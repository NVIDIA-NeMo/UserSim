- id: 54b45262-28ac-50e6-82c5-c1105dd7d02a
  title: Tax-Managed Portfolio — fraud and unauthorized-activity protection
  body: 'At Meridian Wealth, we maintain a zero-trust posture regarding account modifications
    to ensure the integrity of your assets. The Tax-Managed Portfolio, due to its
    optimization for high-income earners, can be a target for sophisticated social
    engineering and phishing attempts. We urge our clients to remain vigilant against
    any communication requesting sensitive credentials or the urgent movement of funds
    via unverified channels.


    It is imperative to understand that we will never ask you to disclose your password
    or multi-factor authentication (MFA) codes via email or telephone. Furthermore,
    we will never request that you transfer funds to a ''safe account'' or a third-party
    entity to ''verify'' your tax status. All legitimate state-changing actions or
    movements of funds require mandatory multi-factor authentication and rigorous
    identity verification.


    If you notice any unauthorized activity or receive a suspicious request appearing
    to originate from our firm, your first action must be to notify your dedicated
    Relationship Manager immediately. Rapid reporting is critical to mitigating potential
    loss. Once a dispute is raised, we employ a philosophy of rapid investigation
    and fair resolution; initial reviews are conducted within 5-10 business days,
    with formal written determinations provided upon conclusion.


    Disclaimer: While we implement institutional-grade security, the investor remains
    responsible for maintaining the confidentiality of their access credentials. Failure
    to report unauthorized access promptly may affect the resolution process.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 6417cc26-953b-525a-a785-c370d1a931a7
  title: Tax-Managed Portfolio — account agreement
  body: 'This account agreement governs the relationship between the client and Meridian
    Wealth regarding the Tax-Managed Portfolio. By initiating this service, the client
    agrees to the following binding terms:


    1. Investment Requirements: The client must maintain a minimum investment of $500,000.
    Should the account value fall below this threshold due to market volatility or
    withdrawals, we reserve the right to review the account''s suitability for this
    specific strategy.


    2. Fee Obligation: The client agrees to an annual advisory fee of 0.95%. This
    fee is non-negotiable to ensure equitable treatment across our client base and
    is calculated based on the complexity and active management required to minimize
    tax liabilities. This fee is deducted periodically from the account assets.


    3. Fiduciary Standard: We operate under a Fiduciary Duty, meaning we are legally
    and ethically obligated to act solely in the client''s best interest. All asset
    allocations are rooted in the client''s documented risk profile.


    4. External Advice: While we provide holistic investment strategy, we defer specific
    legal and tax filing advice to certified external professionals. The client acknowledges
    that Meridian Wealth is not acting as a certified public accountant (CPA) or legal
    counsel.


    5. Termination: This agreement may be terminated by the client or by Meridian
    Wealth upon written notice. Upon closure, any accrued but unpaid advisory fees
    will be settled from the remaining balance before the final disbursement of funds.


    6. Amendments: We may amend these terms to reflect regulatory changes or institutional
    policy updates. Clients will be provided with formal notice of any material changes
    to the fee structure or minimum investment requirements.'
  domain: wealth_management
  product_category: tax_managed_portfolio
