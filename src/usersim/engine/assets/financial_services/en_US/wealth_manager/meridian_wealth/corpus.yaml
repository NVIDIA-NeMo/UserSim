- id: 1b3b6bc2-2a37-5eba-9fc5-a5e7a07f8728
  title: Private Wealth Advisory — check status or history
  body: "Monitoring the performance and transaction history of your bespoke portfolio\
    \ is a seamless process managed through our secure channels. Follow these steps\
    \ to review your account status:\n\n1. **Request a Portfolio Summary**: Tell us\
    \ that you would like a current snapshot of your portfolio status. We will then\
    \ provide a comprehensive overview including your current asset allocation and\
    \ total account value.\n2. **Specify the History Range**: If you require transaction\
    \ history, tell us the specific time period you wish to review (e.g., the last\
    \ quarter or the previous calendar year). \n3. **Receive the Detailed Statement**:\
    \ We will provide a detailed record of all movements, including the application\
    \ of your 0.75% annual advisory fee and any realized gains or losses.\n4. **Request\
    \ a Performance Analysis**: Ask us for a comparative analysis of your portfolio\
    \ against your documented financial goals. We will provide a report detailing\
    \ how current performance aligns with the risk profile established during your\
    \ onboarding.\n\n**Verification of Success**\nYour request is complete once you\
    \ have received the detailed statement or summary via your secure client portal\
    \ or encrypted email. If any figures appear inconsistent with your records, you\
    \ may immediately request a reconciliation review. For guidance on addressing\
    \ such issues, please refer to Private Wealth Advisory — a discrepancy in your\
    \ records or statement."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 14e32588-61ab-5811-8d19-c955f87a4b4e
  title: Private Wealth Advisory — a declined or blocked action
  body: "If you attempt to move funds or modify your account and the action is declined\
    \ or blocked, it is typically due to our rigorous security protocols designed\
    \ to protect ultra-high-net-worth assets.\n\n**Likely Causes**\n* **Authentication\
    \ Failure**: The most common cause is a failure in the mandatory multi-factor\
    \ authentication (MFA) process.\n* **Identity Mismatch**: A discrepancy between\
    \ the request details and the verified identity on file.\n* **Unverified Channel**:\
    \ The request was initiated through a channel that does not meet our zero-trust\
    \ security standards.\n* **Compliance Hold**: The requested action may conflict\
    \ with your documented risk profile or regulatory requirements under the Advisers\
    \ Act.\n\n**Steps to Resolve**\n1. **Verify MFA Status**: Ensure that your MFA\
    \ device is active and that you have successfully completed the secondary verification\
    \ prompt.\n2. **Confirm Identity**: Provide the required identity verification\
    \ markers as requested by your Relationship Manager. We cannot bypass these steps\
    \ for any reason.\n3. **Review the Request**: Check if the fund movement or account\
    \ change aligns with the instructions previously documented in your strategy.\
    \ If the action is a departure from your standard profile, we will require a verbal\
    \ confirmation via a scheduled phone consultation.\n\n**Escalation Process**\n\
    If the block persists after identity verification, we will escalate the matter\
    \ from your Relationship Manager to a Senior Portfolio Strategist. We will investigate\
    \ the specific compliance or security trigger and provide a resolution or a detailed\
    \ explanation for the block within 5-10 business days. \n\nDisclaimer: All product\
    \ recommendations are rooted in the client's documented risk profile and financial\
    \ goals to maintain our fiduciary standard of care."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 0282b9f1-0cd9-56a1-a36c-a8d0dcecf5cc
  title: Private Wealth Advisory — when to switch or upgrade
  body: 'Upgrading to Private Wealth Advisory is recommended when a client''s portfolio
    complexity exceeds the scope of our standard managed solutions and requires a
    bespoke, high-touch strategy.


    **Comparison Dimensions**

    * **Investment Threshold**: Unlike our foundational offerings, Private Wealth
    Advisory requires a minimum investment of $1000000.

    * **Cost Structure**: This tier carries a non-negotiable annual advisory fee of
    0.75%, reflecting the advanced professional management provided.

    * **Service Model**: While other tiers offer professional management, this tier
    provides direct, priority access to Senior Portfolio Strategists for highly customized
    asset allocation.


    **Who Should Switch?**

    Clients should upgrade to Private Wealth Advisory if they have reached the $1000000
    threshold and require a strategy that goes beyond balanced risk or tax optimization
    to include exclusive, tailored investment vehicles. If a client prefers a simpler,
    balanced approach with lower capital requirements, the Managed Portfolio remains
    the superior choice. For those focused specifically on high-income tax mitigation,
    the Tax-Managed Portfolio is more appropriate.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: comparison
  source_authority: official
