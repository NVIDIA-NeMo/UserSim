- id: a3b36e82-b6b4-5016-b7b3-c7f70280b58c
  title: ESG Impact Portfolio — resolve a common request end-to-end
  body: 'A common request for our clients is the reallocation of assets to a more
    aggressive or conservative impact stance. This process ensures your portfolio
    evolves alongside your financial goals and risk tolerance.


    **Prerequisites**

    You must have an existing ESG Impact Portfolio with a minimum balance of $250,000
    and a current, verified risk profile on file.


    **Steps to Reallocate Your Impact Strategy**

    1. **Initiate Reallocation Request:** Tell us that you wish to change the risk
    or impact weighting of your portfolio. Provide the specific goals you wish to
    prioritize (e.g., shifting focus from ''Carbon Neutrality'' to ''Social Equity'').

    2. **Risk Profile Validation:** We will review your current risk profile. If the
    requested change significantly alters your risk exposure, we will ask you to complete
    a updated risk profiling session. We will confirm once your new profile is documented.

    3. **Strategy Proposal:** We will provide a proposed asset allocation that meets
    your new impact goals while remaining within your risk tolerance. You will be
    asked to review and approve this proposal.

    4. **Execution of Trades:** Upon your approval, we will execute the necessary
    trades to rebalance the portfolio. We will notify you once the trades are settled.

    5. **Final Confirmation:** We will provide a final statement showing the new asset
    distribution and confirm that the annual advisory fee of 0.9% continues to apply
    to the updated balance.


    **Confirmation of Success**

    The process is complete when you receive a ''Reallocation Confirmation'' notice
    and your updated portfolio view in the secure client portal reflects the new asset
    weights.


    ***Disclaimer:*** *Rebalancing may trigger taxable events. We defer specific tax
    filing advice to certified external professionals.*'
