- id: a1de6f63-b807-566a-9f7e-310cf26697a3
  title: ESG Impact Portfolio — how rates are tiered and applied
  body: 'The ESG Impact Portfolio utilizes a flat-fee pricing model to ensure equitable
    treatment across our entire client base. Unlike tiered structures that may vary
    by balance, a single annual advisory fee of 0.9% applies to all assets under management
    within this product.


    Application of Fees:

    - The 0.9% fee is calculated based on the total value of the assets managed within
    the ESG Impact Portfolio.

    - Fees are non-negotiable and are deducted periodically from the account balance.

    - This fee covers the professional portfolio management, rigorous ESG screening,
    and fiduciary guidance provided by our Relationship Managers and Senior Portfolio
    Strategists.


    Factors Affecting Cost:

    While the advisory fee remains constant at 0.9%, the total cost of ownership may
    be influenced by the internal expense ratios of the specific third-party ESG funds
    or instruments selected for the portfolio. These external costs are separate from
    the Meridian Wealth advisory fee.'
