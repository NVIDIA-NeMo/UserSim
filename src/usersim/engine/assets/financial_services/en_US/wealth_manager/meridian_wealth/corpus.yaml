- id: f8b1228e-c6ed-50f2-9a61-83dee043c86e
  title: Tax-Managed Portfolio — getting started walkthrough
  body: "This guide is intended for support agents to facilitate the seamless onboarding\
    \ of clients into the Tax-Managed Portfolio, an advanced strategy optimized to\
    \ minimize tax liabilities for high-income earners.\n\n**Onboarding Phase 1: Eligibility\
    \ and Funding**\nVerify that the prospective client can meet the minimum investment\
    \ requirement of $500,000. This is a firm threshold. Ensure the client understands\
    \ that the annual advisory fee is 0.95% and is non-negotiable to ensure fairness\
    \ across our institutional and high-net-worth client base.\n\n**Onboarding Phase\
    \ 2: Risk Profiling**\nBefore any assets are allocated, we must conduct a rigorous\
    \ Risk Profiling process. This evaluates the client's ability and willingness\
    \ to lose principal in exchange for potential returns. All investment recommendations\
    \ must be rooted in this documented profile to adhere to our fiduciary standard\
    \ of care.\n\n**Onboarding Phase 3: Account Activation**\nOnce the risk profile\
    \ is documented and the $500,000 minimum is verified, the account is transitioned\
    \ to active management. The client will be granted access to the secure client\
    \ portal for reporting. \n\n**Onboarding Phase 4: Ongoing Management**\nInform\
    \ the client that support is available via the portal, email, and scheduled phone\
    \ consultations during EST business hours. Complex resolutions are escalated from\
    \ their dedicated Relationship Manager to our Senior Portfolio Strategists.\n\n\
    **Crucial Compliance Note:** Remind the client that while we manage for tax efficiency,\
    \ we defer specific tax filing advice to their certified external tax professionals.\
    \ Our role is the strategic allocation of assets to minimize liability, not the\
    \ filing of returns."
