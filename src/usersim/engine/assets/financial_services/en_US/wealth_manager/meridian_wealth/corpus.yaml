- id: 908e38ba-4e39-5f81-8800-83e4601963bf
  title: ESG Impact Portfolio — fraud and unauthorized-activity protection
  body: 'At Meridian Wealth, we recognize that portfolios aligned with environmental,
    social, and governance (ESG) goals often attract specific types of sophisticated
    fraudulent activity, including ''green-washing'' scams or unauthorized attempts
    to redirect assets to unverified ''impact funds.'' To protect your ESG Impact
    Portfolio, we maintain a zero-trust posture regarding any account modifications
    requested via unverified channels.


    We will never ask you to provide your password, multi-factor authentication (MFA)
    codes, or full security credentials via email or unsolicited phone calls. Any
    request to move funds or change the beneficiary of your portfolio requires rigorous
    identity verification and MFA. Be particularly wary of communications claiming
    that your portfolio requires an urgent ''impact realignment'' or ''regulatory
    update'' that necessitates a transfer of assets to an external account; such requests
    are hallmarks of fraudulent activity.


    If you notice any unauthorized transaction or receive a suspicious communication
    regarding your assets, your first action must be to notify us immediately. Rapid
    reporting is critical to our ability to mitigate loss. Once a dispute is raised,
    we operate under a philosophy of rapid investigation; initial reviews are conducted
    within 5-10 business days, and we provide a formal written determination upon
    the conclusion of the investigation.


    Our commitment to your security is a cornerstone of our fiduciary duty. By adhering
    to these protocols, we ensure that your capital continues to support the global
    impact goals you have defined while remaining shielded from bad actors.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 6a04f2cf-9b38-5df0-b0df-f6dba789c4a7
  title: ESG Impact Portfolio — account agreement
  body: 'This account agreement governs the relationship between Meridian Wealth and
    the client regarding the management of the ESG Impact Portfolio. By establishing
    this account, the client agrees to the following binding terms:


    1. Investment Minimums: The client acknowledges that a minimum investment of $250,000
    is required to open and maintain the ESG Impact Portfolio. Should the total asset
    value fall below this threshold due to market volatility, we reserve the right
    to review the account''s status to ensure it remains viable under our management
    standards.


    2. Fee Obligations: The client agrees to pay a non-negotiable annual advisory
    fee of 0.9%. This fee is employed to align our success with the growth of client
    assets and reflects the active management required to ensure the portfolio adheres
    to strict ESG criteria. This fee is charged periodically against the assets under
    management.


    3. Fiduciary Standard: We commit to a fiduciary duty, meaning we are legally and
    ethically obligated to act solely in the client''s best interest. All asset allocations
    are rooted in the client''s documented risk profile.


    4. External Advice: While we provide holistic investment strategy, we defer specific
    legal and tax filing advice to certified external professionals. The client is
    responsible for engaging such professionals for tax reporting related to their
    ESG investments.


    5. Termination and Closure: Either party may terminate this agreement upon written
    notice. Upon closure, any outstanding pro-rated portion of the 0.9% advisory fee
    will be settled before the final distribution of assets. We maintain a zero-trust
    posture regarding fund movements; all closure distributions are subject to mandatory
    multi-factor authentication (MFA) and identity verification.


    6. Amendments: Meridian Wealth may amend these terms to comply with SEC regulations
    or the Advisers Act, provided that clients are given reasonable notice of such
    changes.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 475d63fc-3da8-5d34-a71d-807cb3f8d98c
  title: ESG Impact Portfolio — who it is best for and common use cases
  body: 'The ESG Impact Portfolio is designed for investors seeking to align their
    financial growth with environmental, social, and governance impact. Unlike a generalist
    approach, this strategy meticulously filters assets to ensure they meet rigorous
    sustainability and ethical benchmarks without abandoning the pursuit of competitive
    returns.


    This solution is best suited for:

    - High-Net-Worth Individuals: Clients who have achieved significant capital accumulation
    and wish to utilize their wealth as a tool for positive global change.

    - Institutional Clients: Organizations with specific mandates to integrate sustainability
    into their endowment or pension fund management.

    - Values-Driven Investors: Those who prioritize corporate transparency, carbon
    footprint reduction, and board diversity as key indicators of long-term corporate
    health.


    Common Use Cases:

    - Legacy Planning: Establishing a portfolio that reflects the family''s ethical
    values for future generations.

    - Diversification with Purpose: Supplementing a traditional portfolio with assets
    that are specifically optimized for ESG impact.

    - Strategic Asset Allocation: Transitioning from a broad market index to a curated
    selection of sustainable equities and green bonds.


    Financial Specifications:

    - Minimum Investment: $250,000

    - Annual Advisory Fee: 0.9%


    Our approach is rooted in a fiduciary standard of care, ensuring that every recommendation
    is based on your documented risk profile. For those who require a more general
    professional management approach, you may wish to review the Managed Portfolio
    — overview. For ultra-high-net-worth individuals seeking completely bespoke strategies,
    we recommend our Private Wealth Advisory — overview.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: product_sheet
  source_authority: official
