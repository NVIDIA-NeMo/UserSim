  institution_id: meridian_wealth
- id: f308ad75-63b4-5ec2-8555-7a785825c844
  title: Private Wealth Advisory — cancel, close, or downgrade
  body: 'Should you decide to terminate your relationship with Meridian Wealth or
    transition to a different service tier, please follow these steps:


    1. Request a Portfolio Review: Inform us of your intent to cancel, close, or downgrade
    your account. We will first schedule a consultation with your Relationship Manager
    to assess the impact on your long-term financial goals.


    2. Specify the Action: Clearly state whether you wish to close the account entirely
    (liquidating or transferring assets) or downgrade to a different product, such
    as the Managed Portfolio — overview.


    3. Verification of Identity: To comply with our security posture, we will perform
    rigorous identity verification and require multi-factor authentication (MFA) before
    any state-changing action is processed.


    4. Settlement of Fees: We will provide a final statement detailing any accrued
    annual advisory fees of 0.75% that are due up to the date of closure or transition.


    5. Execution of Transfer: Provide the receiving institution''s details if you
    are moving funds externally. We will execute the transfer of assets following
    our standard verification protocols.


    6. Confirmation: You will receive a formal written confirmation once the account
    has been closed or the downgrade to a different tier has been completed.


    Disclaimer: Closing an account may have significant tax implications. We defer
    specific tax filing advice to certified external professionals.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 98141861-7814-58ad-afd4-e4150e4b111c
  title: Private Wealth Advisory — an unexpected charge or amount
  body: 'If you observe a charge or a balance amount in your Private Wealth Advisory
    account that does not align with your expectations, please proceed with the following
    steps:


    1. Verify the Fee Structure: Review your latest statement to confirm if the charge
    corresponds to the annual advisory fee of 0.75%. This fee is calculated based
    on assets under management and is applied systematically.


    2. Check for Market Impact: Determine if the amount in question is a result of
    portfolio volatility or a specific asset allocation change rooted in your documented
    risk profile.


    3. Review External Transfers: Confirm whether any scheduled movements of funds
    or external contributions have been processed.


    If the discrepancy remains unresolved after these checks, inform us of the specific
    transaction or balance in question. We will then initiate a formal investigation:


    - Initial Review: We will conduct a thorough review of the transaction history
    and fee application within 5-10 business days.

    - Resolution: If an error is identified, we will apply the necessary corrections
    to your account balance immediately.

    - Final Determination: You will receive a formal written determination upon the
    conclusion of the investigation.


    For complex discrepancies involving high-value portfolios, your Relationship Manager
    will escalate the matter to a Senior Portfolio Strategist for a definitive resolution.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
