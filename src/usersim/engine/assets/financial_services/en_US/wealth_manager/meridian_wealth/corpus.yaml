- id: 8f9047aa-f7ca-57ee-908c-9e2a18b888f8
  title: Tax-Managed Portfolio — vs. a typical competitor offering
  body: 'When comparing the Tax-Managed Portfolio to typical competitor offerings,
    the primary distinctions lie in our fiduciary commitment and fee transparency.


    Competitor Offerings: Many firms utilize ''wrap accounts'' with opaque fee structures
    that may include hidden transaction costs or commissions on the products they
    recommend. These firms may not operate under a strict fiduciary standard, potentially
    leading to conflicts of interest in asset selection.


    Meridian Wealth: We employ a transparent annual advisory fee of 0.95%, which is
    non-negotiable to ensure equity across our client base. As a fiduciary, we are
    legally bound to act in your best interest, meaning our recommendations are based
    solely on your risk profile, not on product commissions.


    Who each suits:

    - A competitor''s offering may suit investors who prefer a lower initial entry
    point or those who do not require a fiduciary guarantee.

    - The Tax-Managed Portfolio is ideal for high-net-worth individuals with $\ge$
    $500,000 in investable assets who prioritize tax efficiency and a steadfast commitment
    to their best interest.'
