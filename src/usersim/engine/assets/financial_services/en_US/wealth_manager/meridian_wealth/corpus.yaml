- id: 784895c4-1cdc-5f88-bcb3-02b8b8535a18
  title: Managed Portfolio — vs. a typical competitor offering
  body: 'When comparing our Managed Portfolio to typical offerings from larger retail
    brokerage firms, the primary distinctions lie in the fiduciary commitment and
    the fee structure.


    Many competitors operate under a ''suitability'' standard, which only requires
    that an investment be suitable for a client. In contrast, we operate under a Fiduciary
    Duty, meaning we are legally bound to act solely in your best interest. While
    some competitors may offer lower introductory rates or tiered fees that fluctuate
    based on marketing promotions, we maintain a transparent and non-negotiable annual
    advisory fee of 0.85%. This ensures that every client—regardless of their starting
    balance above the $250,000 minimum—receives the same high-touch, professional
    rigor.


    Who it suits:

    - Typical Competitor: Best for investors seeking low-cost, self-directed tools
    or those with balances below our $250,000 threshold.

    - Managed Portfolio: Best for high-net-worth individuals who prioritize fiduciary
    transparency and a disciplined, professional asset allocation strategy over the
    lowest possible cost.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: comparison
  source_authority: official
  placeholder: true
