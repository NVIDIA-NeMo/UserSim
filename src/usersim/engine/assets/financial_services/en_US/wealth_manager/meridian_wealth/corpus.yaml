- id: 9fc6aeb0-810e-587b-81ac-74365a1c8303
  title: Private Wealth Advisory — vs. a similar product here
  body: "When choosing between our high-tier offerings, the primary distinctions lie\
    \ in the level of customization and the minimum capital commitment. \n\nPrivate\
    \ Wealth Advisory is designed for ultra-high-net-worth individuals requiring bespoke,\
    \ high-touch strategies. It requires a minimum investment of $1,000,000 and carries\
    \ an annual advisory fee of 0.75%. This is the optimal choice for those whose\
    \ financial complexity demands a tailored approach and direct access to Senior\
    \ Portfolio Strategists.\n\nIn contrast, the Managed Portfolio serves as our foundational\
    \ solution for clients seeking professional management with a balanced risk approach.\
    \ While it offers a sophisticated experience, it does not provide the same level\
    \ of bespoke tailoring as our Private Wealth tier. \n\nIf your primary goal is\
    \ the most exclusive, personalized strategy available and you meet the $1,000,000\
    \ threshold, Private Wealth Advisory is the superior choice. If you prefer a standardized,\
    \ professional allocation with a lower entry point, the Managed Portfolio is the\
    \ more appropriate selection."
