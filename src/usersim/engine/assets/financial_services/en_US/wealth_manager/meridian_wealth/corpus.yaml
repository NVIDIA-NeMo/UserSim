- id: 2ebe74b4-c165-5f29-b9cf-69f74de62bad
  title: ESG Impact Portfolio — minimum investment explained
  body: 'Q: Why is there a minimum investment for the ESG Impact Portfolio?

    A: To maintain the integrity of our active management and the rigorous screening
    processes required for ESG compliance, we require a minimum investment of $250,000.
    This threshold ensures that the portfolio is sufficiently diversified across various
    sustainable sectors to manage risk effectively while justifying the specialized
    research required.


    Q: What happens if my account balance falls below $250,000 due to market fluctuations?

    A: We understand that market volatility occurs. We do not immediately penalize
    clients whose balances dip below the $250,000 minimum due to market movement.
    However, we may conduct a portfolio review to determine if a transition to another
    strategy, such as the one described in Managed Portfolio — minimum investment
    explained, is more appropriate for your current asset level.


    Q: Can I combine multiple funding sources to meet the $250,000 requirement?

    A: Yes, as long as the total initial funding across the designated accounts meets
    the $250,000 threshold, we can initiate the setup of your ESG Impact Portfolio.'
  domain: wealth_management
  product_category: esg_portfolio
