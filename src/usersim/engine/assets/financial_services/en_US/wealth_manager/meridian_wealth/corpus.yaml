- id: edee270a-e5c6-5515-8354-3e84f7b8ffa7
  title: Tax-Managed Portfolio — privacy and data handling
  body: 'At Meridian Wealth, we prioritize full disclosure and the protection of client
    data, framing privacy as a cornerstone of the trust-based investor relationship.
    This disclosure outlines how we handle the sensitive financial data associated
    with the Tax-Managed Portfolio.


    **Data Collection and Usage**

    To manage a portfolio with a minimum investment of $500,000 and an annual advisory
    fee of 0.95%, we must collect comprehensive financial data, including income levels,
    existing tax liabilities, and detailed risk tolerance metrics. This data is used
    exclusively to fulfill our Fiduciary Duty—the legal and ethical obligation to
    act solely in the client''s best interest—and to root all product recommendations
    in your documented risk profile.


    **Security Framework**

    We employ a zero-trust posture regarding the modification of account data. All
    state-changing actions, such as updating beneficiary information or adjusting
    asset allocation, require mandatory multi-factor authentication (MFA) and rigorous
    identity verification. We do not share client data with third-party marketers.


    **Regulatory Adherence**

    Our operations strictly adhere to SEC regulations and the fiduciary standards
    of the Advisers Act. We maintain a transparent record of all conflicts of interest
    and provide full disclosure of any such conflicts upon request.


    **Third-Party Coordination**

    While we manage the portfolio for tax efficiency, we defer specific legal and
    tax filing advice to your certified external professionals. We will only share
    portfolio data with your designated tax professionals upon your explicit, verified
    authorization. Any disputes regarding data handling are approached with our philosophy
    of rapid investigation, with initial reviews completed within 5-10 business days
    and followed by a formal written determination.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: disclosure
  source_authority: official
