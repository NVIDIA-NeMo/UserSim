- id: b9885924-3bf2-5526-ae47-d057fc77c88d
  title: ESG Impact Portfolio — choosing between tiers or options
  body: 'When deciding on the appropriate management tier, investors typically weigh
    the balance between thematic impact and broad market exposure.


    The ESG Impact Portfolio is best suited for those who prioritize environmental,
    social, and governance alignment. It requires a minimum investment of $250,000
    and carries an annual advisory fee of 0.9%. This is a specialized strategy where
    we actively filter assets to meet strict sustainability criteria.


    In contrast, the Managed Portfolio provides a more balanced, foundational approach
    to professional management. While it may offer broader market diversification
    without the same thematic constraints, it is often the better choice for investors
    who do not wish to prioritize ESG factors over traditional asset allocation metrics.


    Both options operate under our fiduciary duty, ensuring that any recommendation
    is rooted in your documented risk profile. Choose the ESG Impact Portfolio if
    you seek to integrate a specific ethical mandate into your wealth growth; choose
    the Managed Portfolio for a traditional, balanced growth strategy.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
