- id: c94c2feb-c7d2-5f7e-8cf5-0d1a4c5e382a
  title: Private Wealth Advisory — getting started walkthrough
  body: 'This guide provides support agents with the necessary steps to onboard a
    client into the Private Wealth Advisory tier. This is our most exclusive service,
    providing bespoke, high-touch strategies for ultra-high-net-worth portfolios.


    Step 1: Eligibility Verification

    Ensure the client meets the minimum investment requirement of $1,000,000. This
    must be verified via documented liquid assets or transferable securities before
    proceeding to the risk-profiling phase.


    Step 2: Comprehensive Risk Profiling

    Conduct a formal risk profiling session. We must document the client''s ability
    and willingness to lose principal in exchange for potential returns. All subsequent
    product recommendations must be rooted in this documented profile and the client''s
    specific financial goals.


    Step 3: Fee Disclosure and Agreement

    Clearly state the annual advisory fee of 0.75%. Emphasize that this fee is non-negotiable
    to ensure equitable treatment. The client must sign the fiduciary agreement, acknowledging
    our legal and ethical obligation to act solely in their best interest.


    Step 4: Asset Allocation Strategy

    Coordinate with a Senior Portfolio Strategist to design a holistic investment
    strategy. This strategy should address the client''s unique needs while adhering
    to our fiduciary standard of care.


    Step 5: Account Funding and MFA Setup

    Guide the client through the funding process to meet the $1,000,000 threshold.
    Simultaneously, ensure that multi-factor authentication (MFA) is activated on
    the secure client portal, as this is mandatory for all state-changing actions.


    Step 6: Final Confirmation

    Provide the client with a written summary of their allocation and a copy of the
    signed agreement. Confirm the scheduled date for their first quarterly review
    with their dedicated Relationship Manager.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: ff76f80e-c5a5-57ff-874b-85b59138d915
  title: Private Wealth Advisory — cost and charges
  body: 'Questions regarding the cost of our most exclusive tier are addressed below:


    What is the cost for professional management of a Private Wealth Advisory account?

    We employ a transparent annual advisory fee of 0.75%. This fee covers the high-touch,
    bespoke management and holistic strategy required for ultra-high-net-worth portfolios.


    Can the advisory fee be negotiated for larger portfolios?

    No. Our fees are non-negotiable to ensure equitable treatment across our entire
    client base, regardless of the total asset value.


    Is there a minimum amount required to open an account?

    Yes, the Private Wealth Advisory tier requires a minimum investment of $1,000,000.


    How does this compare to other options?

    For clients who do not meet the $1,000,000 threshold or require a different approach,
    we suggest reviewing Private Wealth Advisory — choosing between tiers or options.'
