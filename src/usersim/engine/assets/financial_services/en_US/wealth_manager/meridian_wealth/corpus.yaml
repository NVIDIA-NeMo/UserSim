- id: 0354f0a2-a639-5944-902a-e0bafb8ba183
  title: General frequently asked questions
  body: 'How do I contact support or schedule a consultation?

    Support is provided via our secure client portals, email, and scheduled phone
    consultations during EST business hours. For complex strategic needs, we recommend
    using the process outlined in When to use schedule_advisor_meeting to coordinate
    with a Senior Portfolio Strategist.


    What happens if I identify an error or a fraudulent transaction?

    We approach all disputes with a philosophy of rapid investigation and fair resolution.
    We conduct initial reviews within 5-10 business days, and a formal written determination
    is provided upon the conclusion of our investigation.


    How does Meridian Wealth ensure my investments align with my goals?

    We utilize a rigorous process of Risk Profiling—the evaluation of a client''s
    ability and willingness to lose principal in exchange for potential returns. All
    product recommendations are rooted in these documented risk profiles and your
    specific financial goals.'
  domain: wealth_management
  product_category: general
