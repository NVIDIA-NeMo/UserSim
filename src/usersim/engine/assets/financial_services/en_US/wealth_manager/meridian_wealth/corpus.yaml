- id: 2a4e8205-0186-53fb-b474-96373a81174b
  title: Private Wealth Advisory — privacy and data handling
  body: 'Meridian Wealth maintains a rigorous commitment to the privacy and security
    of our clients'' financial data. For clients within the Private Wealth Advisory
    tier, the sensitivity of bespoke strategy data necessitates an enhanced posture
    of confidentiality.


    Data Collection and Use

    We collect and maintain detailed financial records, including risk profiles, asset
    inventories, and personal identification, to fulfill our fiduciary duty. This
    data is used exclusively to develop holistic investment strategies and ensure
    all product recommendations are rooted in your documented risk profile and financial
    goals. We do not sell client data to third parties.


    Security Framework

    We employ a zero-trust architecture for all account modifications. Access to your
    portfolio information is restricted to your dedicated Relationship Manager and
    assigned Senior Portfolio Strategists. Multi-factor authentication (MFA) is a
    mandatory requirement for any client-initiated action via the secure portal. Any
    state-changing action, including the movement of funds, requires rigorous identity
    verification to prevent unauthorized access.


    Third-Party Professionals

    While we provide comprehensive asset allocation and investment strategy, we defer
    specific legal and tax filing advice to certified external professionals. When
    coordinating with your external tax or legal advisors, we will only share information
    with your explicit, written consent.


    Regulatory Compliance

    Our operations strictly adhere to SEC regulations and the fiduciary standards
    of the Advisers Act. We prioritize full disclosure of conflicts and maintain a
    transparent fee structure, including the annual advisory fee of 0.75%. All clients
    are subject to the minimum investment requirement of $1,000,000 to maintain the
    Private Wealth Advisory status. Any breach of data security will be investigated
    rapidly, with initial reviews conducted within 5-10 business days.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 5b47cf6c-cdf9-5759-8376-8ff53b1194b8
  title: Private Wealth Advisory — recognizing scams targeting this product
  body: "Because the Private Wealth Advisory tier is reserved for our most exclusive\
    \ clients, bad actors often attempt to impersonate Meridian Wealth executives\
    \ or Senior Portfolio Strategists to gain access to high-value accounts. We urge\
    \ you to remain vigilant against sophisticated 'whaling' attacks—highly targeted\
    \ phishing attempts designed to trick ultra-high-net-worth individuals into authorizing\
    \ fraudulent transfers.\n\nCommon indicators of a scam include urgent requests\
    \ to move funds to 'secure' temporary accounts or demands for sensitive information\
    \ via unverified channels. Please be advised that Meridian Wealth will never ask\
    \ you to provide your password, multi-factor authentication (MFA) codes, or full\
    \ account credentials via email or text. Furthermore, we will never pressure you\
    \ to bypass our established identity verification protocols to expedite a transaction.\n\
    \nOur institution maintains a zero-trust posture regarding account modifications\
    \ requested via unverified channels. Any request to change your banking instructions\
    \ or authorized users will trigger a rigorous identity verification process before\
    \ any state-changing action is performed. \n\nIf you encounter a communication\
    \ that seems suspicious, or if you believe your credentials have been compromised,\
    \ you must notify us immediately. Rapid reporting is critical to mitigating loss;\
    \ while we approach all disputes with a philosophy of fair resolution, immediate\
    \ notification allows us to freeze assets and prevent further unauthorized movement.\
    \ Once reported, we conduct an initial review within 5-10 business days, providing\
    \ a formal written determination upon the conclusion of our investigation.\n\n\
    Disclaimer: All investment strategies are rooted in the client's documented risk\
    \ profile. Our commitment to fiduciary duty ensures we act solely in your best\
    \ interest, but security is a shared responsibility."
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: b7ceb304-8ef7-5e2e-8ee4-7705de9f73b2
  title: Private Wealth Advisory — limits, restrictions, and edge cases
  body: 'The Private Wealth Advisory service is our most exclusive tier, designed
    for ultra-high-net-worth portfolios. To maintain the bespoke, high-touch nature
    of this strategy, specific financial thresholds and operational restrictions apply.


    **Financial Thresholds**

    To qualify for and maintain a Private Wealth Advisory account, a minimum investment
    of $1000000 is required. Assets falling below this threshold may be subject to
    a review by a Senior Portfolio Strategist to determine if a transition to a different
    management tier is appropriate to ensure the client continues to receive the most
    efficient service model.


    **Fee Structure**

    We employ a transparent advisory fee structure to align our success with the growth
    of client assets. For this tier, the annual advisory fee is 0.75%. This fee is
    non-negotiable to ensure equitable treatment across our entire client base and
    reflects the complexity and active management required for bespoke strategies.


    **Operational Restrictions**

    Due to the complexity of high-touch strategies, certain liquidity restrictions
    may apply depending on the underlying assets within the portfolio. While we strive
    for maximum flexibility, some bespoke instruments may have lock-up periods or
    specific redemption windows. These are documented individually within the client''s
    asset allocation strategy.


    **Edge Cases and Compliance**

    All recommendations are governed by our Fiduciary Duty—the legal and ethical obligation
    to act solely in the client''s best interest. We strictly adhere to SEC regulations
    and the Advisers Act. While we provide holistic investment strategy, we defer
    specific legal and tax filing advice to certified external professionals. Any
    request for a strategy that contradicts the client''s documented Risk Profiling
    (the process of evaluating a client''s ability and willingness to lose principal)
    will be flagged for a mandatory compliance review before implementation.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 325bc03b-c5a9-5ab0-abeb-02825644eadc
  title: Private Wealth Advisory — eligibility and setup
  body: '**Who is eligible for Private Wealth Advisory?**

    This exclusive tier is designed for ultra-high-net-worth individuals and institutional
    clients. Eligibility requires a minimum investment of $1000000.


    **How do I begin the setup process?**

    Setup begins with a comprehensive Risk Profiling session to document your financial
    goals and willingness to accept principal risk. Once your profile is established,
    we will collaborate on a bespoke asset allocation strategy tailored to your specific
    needs.


    **What are the costs associated with this tier?**

    We charge a non-negotiable annual advisory fee of 0.75%, which covers the professional
    management and high-touch guidance provided by our Senior Portfolio Strategists.


    **Can I integrate external tax advice?**

    Yes. While we provide holistic strategy, we defer specific tax filing advice to
    your certified external professionals to maintain the highest standard of care.
    For more details on our approach, please see Private Wealth Advisory — overview.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: faq
  source_authority: official
