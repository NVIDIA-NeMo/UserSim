- id: 79992683-7a0b-5e73-b8c0-ba283290f197
  title: ESG Impact Portfolio — getting started walkthrough
  body: 'This guide provides a structured walkthrough for support agents assisting
    clients in the onboarding process for the ESG Impact Portfolio. This product is
    designed for investors seeking to align their financial growth with environmental,
    social, and governance (ESG) impact.


    Step 1: Risk Profiling

    Before any assets are allocated, the client must undergo a comprehensive risk
    profiling process. This evaluation determines the client''s ability and willingness
    to lose principal in exchange for potential returns. No product recommendation
    is made until the risk profile is documented and signed.


    Step 2: Financial Qualification

    The agent must verify that the client meets the minimum investment requirement
    of $250,000. This threshold ensures the portfolio can be diversified across high-impact
    assets while maintaining the required risk-adjusted returns.


    Step 3: Fee Disclosure

    The agent must clearly state the advisory fee of 0.9% annually. It must be explained
    that this fee covers professional portfolio management and financial guidance
    and is non-negotiable to ensure equitable treatment across all Meridian Wealth
    clients.


    Step 4: Documentation and Funding

    Once the risk profile is aligned with the ESG strategy and funding is verified,
    the agent will coordinate the transfer of assets. The client must complete all
    identity verification and MFA setup before the account is activated.


    Step 5: Strategy Confirmation

    The final step is a consultation with a Senior Portfolio Strategist to review
    the asset allocation and confirm that the ESG impact goals are accurately reflected
    in the portfolio''s construction. For clients comparing this to a more general
    approach, refer them to the Managed Portfolio — overview.'
  domain: wealth_management
  product_category: esg_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 516b5136-4c26-5f2d-bd69-545676a39743
  title: ESG Impact Portfolio — cost and charges
  body: 'What is the total cost for professional management of the ESG Impact Portfolio?

    We charge a transparent annual advisory fee of 0.9% for the ESG Impact Portfolio.
    This fee covers the active management and fiduciary oversight required to align
    your investments with specific ESG criteria.


    Is there a minimum amount I must invest to open this account?

    Yes, the ESG Impact Portfolio requires a minimum investment of $250,000. This
    ensures we can implement a sufficiently diversified strategy that meets our rigorous
    fiduciary standards.


    Can I negotiate the advisory fee based on my total assets?

    Our fee philosophy is rooted in equity and transparency. To ensure all clients
    are treated fairly, our fees—including the 0.9% annual charge for this portfolio—are
    non-negotiable.


    Are there additional fees for tax filing or legal advice?

    We provide holistic investment strategy and asset allocation; however, we defer
    specific legal and tax filing advice to certified external professionals. Such
    services are not included in our advisory fee.'
