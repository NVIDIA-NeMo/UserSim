- id: beecbc3c-1c10-5a27-96c9-e21960700418
  title: Tax-Managed Portfolio — who it is best for and common use cases
  body: 'The Tax-Managed Portfolio is an advanced strategy specifically optimized
    to minimize tax liabilities for high-income earners. Unlike a standard balanced
    approach, this product focuses on tax-loss harvesting and the strategic placement
    of assets to reduce the impact of capital gains and dividend taxes.


    This solution is best suited for:

    - High-net-worth individuals in the highest tax brackets who seek to maximize
    after-tax returns.

    - Investors with significant taxable brokerage accounts who wish to offset gains
    with strategic losses.

    - Clients who require professional fiduciary management but have complex tax considerations
    that preclude a simpler managed solution.


    Common Use Cases:

    - Portfolio Transition: When a client inherits a large taxable position and requires
    a phased liquidation strategy to manage the tax hit.

    - Active Tax Alpha: For clients seeking to generate ''tax alpha''—the additional
    return gained through efficient tax management rather than just market performance.


    Financial Specifications:

    - Minimum Investment: $500,000

    - Annual Advisory Fee: 0.95%


    Disclaimer: Tax laws are subject to change. While we strive to minimize liabilities,
    the actual tax benefit depends on the client''s overall financial situation and
    the current regulatory environment. We recommend coordinating our strategy with
    your external tax professional.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 04794813-b53a-5873-aa07-76233a1d44a0
  title: Tax-Managed Portfolio — minimum investment explained
  body: 'Q: Why is there a minimum investment for the Tax-Managed Portfolio?

    A: Due to the intensive nature of active tax-loss harvesting and the specialized
    management required to optimize for tax efficiency, we require a minimum investment
    of $500,000. This ensures that the tax-saving benefits outweigh the operational
    costs of the strategy.


    Q: What happens if my account balance drops below $500,000?

    A: We monitor accounts regularly. If a balance falls below the minimum investment
    of $500,000 due to market fluctuations, we generally maintain the strategy. However,
    if the balance remains significantly below the threshold or is reduced via withdrawals,
    we may suggest transitioning to the Managed Portfolio — overview to better align
    with your current asset level.


    Q: Can I combine multiple accounts to meet the $500,000 requirement?

    A: Yes, we can consider aggregate household assets to meet the minimum investment
    threshold for our specialized strategies.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: a84794e9-80a2-5a81-847b-46bbbf9b4644
  title: Tax-Managed Portfolio — cancel, close, or downgrade
  body: 'If you wish to discontinue your Tax-Managed Portfolio or move to a different
    strategy, please follow these steps:


    1. Request Review: Inform us that you wish to close your account or downgrade
    your strategy. We will initiate a review of your current holdings to identify
    any immediate tax implications (such as realized gains) that would result from
    liquidating positions for the move.


    2. Tax Impact Confirmation: We will provide a summary of the estimated tax impact
    of the transition. You must confirm your acceptance of these tax consequences
    before we proceed with the closure or downgrade.


    3. Selection of Destination: For downgrades, specify which strategy you wish to
    move to (e.g., the Managed Portfolio). For closures, provide the verified wiring
    instructions for the destination account.


    4. Identity Verification: You will undergo a rigorous identity verification process,
    including multi-factor authentication (MFA), to authorize the movement of funds
    or the change in account status.


    5. Final Settlement: We will calculate and deduct any final prorated advisory
    fees based on the annual advisory fee of 0.95%.


    6. Confirmation: We will provide a final written confirmation once the account
    is closed or the downgrade to a new product is complete.


    Disclaimer: Closing a tax-managed account may trigger significant capital gains
    taxes. We strongly advise consulting your external tax professional before initiating
    this process.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 4bb927e7-802b-5b29-bb2e-9a7cdc76c75b
  title: Tax-Managed Portfolio — an unexpected charge or amount
  body: 'If you notice a charge or a balance discrepancy in your Tax-Managed Portfolio
    that you did not expect, please follow this resolution path:


    Likely Causes:

    - Advisory Fee Deduction: The annual advisory fee of 0.95% is deducted periodically.
    Check if the charge aligns with this percentage of your assets.

    - Tax Withholding: Automatic withholdings for dividends or realized gains may
    occur depending on your account settings.

    - Market Volatility: Price fluctuations in the underlying assets can lead to unexpected
    balance changes.


    Steps to Resolve:

    1. Review the Statement: Identify the exact date and label of the charge. If it
    is labeled as an ''Advisory Fee,'' verify it against the 0.95% annual rate.

    2. Verify Transaction History: Ensure the amount is not a scheduled redistribution
    or a tax-loss harvesting trade that resulted in a temporary cash balance change.

    3. Raise a Dispute: If the charge remains unexplained, notify us immediately.
    We will initiate a formal investigation into the transaction.


    Resolution Timeline:

    We approach all disputes with a philosophy of rapid investigation. Initial reviews
    are conducted within 5-10 business days. If the charge is found to be an error,
    we will apply a correction to your account. You will receive a formal written
    determination upon the conclusion of our review.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
