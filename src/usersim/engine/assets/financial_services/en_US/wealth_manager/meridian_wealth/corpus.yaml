- id: 269f4bdb-0040-5f25-91e8-a1007bb09749
  title: Tax-Managed Portfolio — regulatory disclosures
  body: 'Meridian Wealth operates as a premier fiduciary wealth manager, and our management
    of the Tax-Managed Portfolio strictly adheres to SEC regulations and the fiduciary
    standards of the Advisers Act. We prioritize full disclosure of all potential
    conflicts of interest and rely upon rigorous risk-profiling to ensure alignment
    with client goals.


    **Fiduciary Standard and Fees**

    We maintain a fiduciary duty to act solely in the client''s best interest. To
    align our success with the growth of client assets, we employ a transparent advisory
    fee structure. For the Tax-Managed Portfolio, this consists of an annual advisory
    fee of 0.95%. These fees are non-negotiable to ensure equitable treatment across
    our client base and are based on the active management required for this specific
    product.


    **Investment Requirements and Risks**

    Access to this strategy requires a minimum investment of $500,000. All product
    recommendations are rooted in the client''s documented risk profile. Please be
    advised that tax-managed strategies do not guarantee a specific tax outcome and
    do not protect against market loss.


    **Professional Boundaries**

    ***Disclaimer: While we provide holistic investment strategy and asset allocation
    based on a fiduciary standard of care, we defer specific legal and tax filing
    advice to certified external professionals. Meridian Wealth does not prepare tax
    returns or provide legal opinions on tax law.***


    **Privacy and Security**

    We frame data privacy as a cornerstone of the trust-based investor relationship.
    Consequently, multi-factor authentication (MFA) and rigorous identity verification
    are mandatory before any state-changing action or movement of funds. We maintain
    a zero-trust posture regarding account modifications via unverified channels.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 8c3e2763-bd18-50ae-ae1e-229216bcb937
  title: Tax-Managed Portfolio — interest rate / APY schedule
  body: 'The Tax-Managed Portfolio is an actively managed investment strategy focusing
    on asset allocation and tax efficiency rather than a fixed-rate deposit product.
    Consequently, it does not offer a static interest rate or a guaranteed Annual
    Percentage Yield (APY).


    Returns are derived from the performance of the underlying securities and the
    successful reduction of tax liabilities. The only fixed percentage associated
    with the cost of this product is the annual advisory fee of 0.95%, which is applied
    to the total assets under management. This fee is constant across all account
    balances meeting the $500,000 minimum investment threshold.


    Actual yields will fluctuate based on market conditions and the effectiveness
    of the tax-optimization strategies employed. We recommend reviewing your quarterly
    statements for the realized net-of-fee performance of your specific portfolio.'
