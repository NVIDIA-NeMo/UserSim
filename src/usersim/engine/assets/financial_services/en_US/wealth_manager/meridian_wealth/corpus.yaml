- id: 830481e7-c889-5838-b99d-3c11ede68078
  title: Tax-Managed Portfolio — resolve a common request end-to-end
  body: 'One of the most common requests for our Tax-Managed Portfolio clients is
    the request for a ''Tax-Impact Analysis'' before making a large withdrawal. Because
    this portfolio is actively managed to minimize liabilities, unplanned withdrawals
    can trigger significant capital gains taxes.


    **Prerequisites**

    You must have an active Tax-Managed Portfolio and have completed your most recent
    identity verification via multi-factor authentication (MFA).


    **Steps to Resolve a Withdrawal Tax-Impact Request**

    1. **Submit the Request**: Tell us the specific dollar amount you wish to withdraw
    and the date by which you need the funds.

    2. **Internal Analysis**: We will analyze the current holdings to identify the
    most tax-efficient lots to sell. We will prioritize assets that minimize the immediate
    tax hit to your portfolio.

    3. **Review the Projection**: We will provide you with a projected tax impact
    statement. This document will outline the estimated capital gains and the corresponding
    tax liability associated with the withdrawal.

    4. **Authorize the Action**: If you are satisfied with the projection, provide
    us with your formal authorization to proceed with the trades.

    5. **Execution and Confirmation**: We will execute the trades and transfer the
    funds to your verified account. We will then provide a final confirmation of the
    amount transferred and the actual tax impact realized.


    **Verification of Completion**

    The request is complete when the funds have arrived in your destination account
    and you have received the final transaction confirmation. You can then verify
    these movements by reviewing your account history. If the actual tax impact deviates
    significantly from the projection due to market volatility, we will provide a
    detailed explanation of the variance.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 67c8eb0c-23f6-5fb6-8b45-2daa2325a8b5
  title: Tax-Managed Portfolio — a discrepancy in your records or statement
  body: 'Occasionally, a client may notice a discrepancy between their internal records
    and the statements provided for their Tax-Managed Portfolio. This is often due
    to the complexity of tax-loss harvesting or the timing of fee applications.


    **Common Symptoms**

    - The ending balance does not match the client''s calculated total.

    - An unexpected deduction is noted in the account history.

    - The reported tax-alpha or loss-harvesting totals differ from the client''s expectations.


    **Investigation Steps for Support Agents**

    1. **Verify Fee Application**: Check if the discrepancy aligns with the annual
    advisory fee of 0.95%. Confirm if the fee was applied on a pro-rata basis for
    the period in question.

    2. **Review Transaction Timing**: Analyze the dates of all trades. Because tax-loss
    harvesting involves the rapid selling and replacing of assets, there may be a
    short window where the portfolio value fluctuates before the replacement asset
    is fully settled.

    3. **Audit Minimum Investment**: Ensure the account has remained above the minimum
    investment of $500,000. If the balance dipped below this, check if any administrative
    flags were triggered that affected the reporting.

    4. **Cross-Reference Fiduciary Documentation**: Ensure all trades executed match
    the client''s documented risk profile. Any deviation must be documented and explained.


    **Resolution and Escalation**

    If the discrepancy cannot be resolved through these checks, we follow our philosophy
    of rapid investigation and fair resolution:

    - **Initial Review**: We will conduct a thorough audit of the account records
    within 5-10 business days.

    - **Interim Communication**: The Relationship Manager will inform the client that
    the matter has been escalated to a Senior Portfolio Strategist.

    - **Final Determination**: We will provide a formal written determination to the
    client upon conclusion of the investigation, including any necessary corrections
    to the statement or credits to the account.'
  domain: wealth_management
  product_category: tax_managed_portfolio
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 7406f66a-939d-51fd-8480-f88cf59315d7
  title: ESG Impact Portfolio — overview
  body: 'The ESG Impact Portfolio is designed for investors seeking to align their
    financial growth with environmental, social, and governance impact. We believe
    that sustainable investing is not merely an ethical choice but a rigorous approach
    to risk management and long-term value creation. By integrating ESG criteria into
    our selection process, we aim to capitalize on the transition to a more sustainable
    global economy while adhering to our strict fiduciary duty—the legal and ethical
    obligation to act solely in the client''s best interest.


    To maintain the integrity of this strategy and ensure professional oversight,
    we require a minimum investment of $250,000. This threshold allows us to implement
    a diversified range of sustainable assets that meet our institutional standards
    for liquidity and impact.


    Our management of the ESG Impact Portfolio is governed by a transparent advisory
    fee of 0.9% annually. This fee, defined as the annual percentage charged for professional
    portfolio management and financial guidance, is non-negotiable to ensure equitable
    treatment across our client base and aligns our success directly with the growth
    of your assets.


    Disclaimer: All investment strategies involve risk of loss. Product recommendations
    are rooted in the client''s documented risk profile and financial goals. We provide
    holistic investment strategy and asset allocation; however, we defer specific
    legal and tax filing advice to certified external professionals.'
