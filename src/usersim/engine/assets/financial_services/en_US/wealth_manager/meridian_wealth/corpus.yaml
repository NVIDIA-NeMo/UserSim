- id: 26740022-c560-5bd8-ae10-255e71dd69f2
  title: Private Wealth Advisory — who it is best for and common use cases
  body: 'Private Wealth Advisory is our most exclusive tier, offering bespoke, high-touch
    strategies specifically engineered for ultra-high-net-worth portfolios. Unlike
    our standardized offerings, this service provides a level of customization intended
    for individuals whose financial landscapes involve complex asset structures and
    multifaceted legacy goals.


    This solution is best suited for:

    - Ultra-High-Net-Worth Individuals (UHNWIs) who require a dedicated Relationship
    Manager and access to Senior Portfolio Strategists.

    - Investors who seek a fiduciary partnership where asset allocation is meticulously
    aligned with a rigorous risk profiling process.

    - Clients who manage portfolios exceeding the $1,000,000 minimum investment threshold
    and desire a sophisticated, collegiate approach to wealth preservation.


    Common Use Cases:

    - Bespoke Estate Planning Integration: Aligning investment growth with long-term
    generational wealth transfer goals.

    - Concentrated Position Management: Developing strategies to diversify significant
    holdings in a single security while adhering to a strict fiduciary standard of
    care.

    - Holistic Asset Coordination: Integrating various liquid and illiquid assets
    into a unified strategic allocation.


    Financial Terms:

    - Minimum Investment: $1,000,000

    - Annual Advisory Fee: 0.75%


    Disclaimer: All product recommendations are rooted in the client''s documented
    risk profile and financial goals. Past performance is not indicative of future
    results.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: fff2cf6f-fa66-509d-adc6-28961ca528ed
  title: Private Wealth Advisory — minimum investment explained
  body: 'Q: Why is there a minimum investment requirement for Private Wealth Advisory?


    A: To provide the bespoke, high-touch strategies and dedicated access to Senior
    Portfolio Strategists that define this tier, we require a minimum investment of
    $1,000,000. This threshold ensures that the complexity of the active management
    we provide is economically aligned with the portfolio''s scale.


    Q: What happens if my portfolio value drops below $1,000,000 due to market fluctuations?


    A: We understand that market volatility occurs. We do not immediately terminate
    services if a balance dips below the minimum investment of $1,000,000 due to market
    movement. However, we may conduct a review to determine if the account remains
    suited for this exclusive tier or if a transition to a solution like the Managed
    Portfolio — overview would be more appropriate.


    Q: Can I combine multiple accounts to meet the minimum?


    A: Yes, we can consider the aggregate value of all accounts held at Meridian Wealth
    to satisfy the $1,000,000 requirement.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: faq
  source_authority: official
