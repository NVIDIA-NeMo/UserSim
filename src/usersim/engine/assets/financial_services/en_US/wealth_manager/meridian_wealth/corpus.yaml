- id: f3a2362c-367e-5ce8-a2e8-a64d15252271
  title: Private Wealth Advisory — a failed or pending action
  body: 'If you encounter an issue where a fund transfer is pending or an account
    modification has failed, it is typically due to our rigorous security and compliance
    protocols. As a fiduciary, we prioritize the safety of your assets above all else.


    Common Symptoms:

    - A transfer of funds is marked as ''Pending'' for longer than 48 hours.

    - An attempt to change account beneficiaries or contact details is rejected.

    - A request to modify the investment strategy is not reflected in the portal.


    Likely Causes:

    1. Identity Verification Failure: Any state-changing action requires multi-factor
    authentication (MFA). If the MFA challenge was not completed, the action will
    remain pending.

    2. Insufficient Initial Funding: For new accounts, if the initial deposit falls
    below the minimum investment of $1,000,000, the account activation will remain
    pending.

    3. Unverified Channel: We maintain a zero-trust posture regarding modifications
    made via unverified communication channels.


    Resolution Steps:

    1. Confirm MFA Status: Ensure you have completed all required identity verification
    steps through your secure portal.

    2. Verify Transfer Amount: Confirm that the originating institution has released
    the full $1,000,000 minimum investment.

    3. Request a Security Review: Ask us to review the pending action. We will verify
    your identity using our mandatory protocols.


    When to Escalate:

    If the action remains unresolved after these checks, we will escalate the matter
    from your Relationship Manager to a Senior Portfolio Strategist. You will receive
    a formal update on the status of the resolution within 5-10 business days.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: troubleshooting
  source_authority: official
