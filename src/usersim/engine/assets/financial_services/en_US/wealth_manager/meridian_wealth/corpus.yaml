- id: d433d994-4c8b-55a4-956f-74150932aa80
  title: ESG Impact Portfolio — eligibility and setup
  body: '**Who is eligible to open an ESG Impact Portfolio?**

    We welcome high-net-worth individuals and institutional clients who wish to align
    their capital with sustainable values. Eligibility requires a minimum investment
    of $250,000 and a completed risk profiling process to ensure the strategy matches
    your financial goals.


    **What is the cost to maintain this portfolio?**

    The cost for professional management and guidance is an annual advisory fee of
    0.9%. This fee is transparently applied and non-negotiable to maintain fairness
    across our client base.


    **How do I begin the setup process?**

    Setup begins with a comprehensive risk profiling session. Once we have documented
    your risk tolerance and impact goals, we will facilitate the funding of your account.
    For more detailed steps, please refer to ESG Impact Portfolio — set up and activate.'
