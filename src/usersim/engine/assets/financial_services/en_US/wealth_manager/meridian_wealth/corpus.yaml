- id: b2cde8dc-7850-5db9-a579-b918f9d0483b
  title: Managed Portfolio — set up and activate
  body: 'Activating your Managed Portfolio is a structured process designed to ensure
    our fiduciary alignment with your financial objectives. Before beginning, ensure
    you have liquid assets available to meet the minimum investment of $250,000.


    1. **Initiate Risk Profiling**: Provide us with your current financial standing,
    time horizon, and liquidity needs. We will then guide you through a comprehensive
    risk assessment to determine your tolerance for principal loss versus your desired
    return.

    2. **Review Investment Strategy**: We will present a proposed asset allocation
    based on your risk profile. You will review this strategy with us to ensure it
    aligns with your holistic goals. We will clarify any industry jargon during this
    consultation.

    3. **Confirm Fee Agreement**: We will provide a formal disclosure of the annual
    advisory fee of 0.85%. You must acknowledge this non-negotiable fee structure
    to proceed, ensuring transparency in our partnership.

    4. **Execute Funding**: Instruct us to transfer the minimum investment of $250,000
    into your new account. We will require multi-factor authentication (MFA) and rigorous
    identity verification before any movement of funds occurs.

    5. **Verification of Activation**: Once the funds are cleared and verified, we
    will provide a written confirmation that your Managed Portfolio is active and
    that your assets have been deployed according to the agreed-upon strategy.


    Once active, you may monitor your performance via our secure client portal. For
    a comparison of how this setup differs from our other offerings, you may review
    Managed Portfolio — vs. a similar product here.'
  domain: wealth_management
  product_category: managed_portfolio
  document_type: how_to_guide
