- id: 423274a9-fa4d-5c85-bbf8-bf98146035e1
  title: Private Wealth Advisory — regulatory disclosures
  body: 'Meridian Wealth operates as a fiduciary wealth manager. This document serves
    as a formal regulatory disclosure regarding the Private Wealth Advisory service.
    Our operations strictly adhere to SEC regulations and the fiduciary standards
    of the Advisers Act.


    Fiduciary Standard: We acknowledge our Fiduciary Duty to act solely in the client''s
    best interest. We prioritize full disclosure of all conflicts of interest and
    utilize rigorous Risk Profiling to ensure all investment recommendations are aligned
    with the client''s documented goals.


    Fee Disclosure: The Private Wealth Advisory service is subject to a non-negotiable
    annual advisory fee of 0.75%. This fee is charged for professional portfolio management
    and financial guidance. The minimum investment for this service is $1,000,000.


    Advice Boundaries: We provide holistic investment strategy and asset allocation.
    However, we are not a law firm or a CPA firm. We expressly defer specific legal
    advice and tax filing services to certified external professionals. While we optimize
    for financial goals, the final responsibility for tax filings rests with the client
    and their external advisors.


    Security and Privacy: Data privacy is a cornerstone of our trust-based relationship.
    We employ a zero-trust posture regarding account modifications. Multi-factor authentication
    (MFA) and rigorous identity verification are mandatory before any state-changing
    action or movement of funds is executed.


    Dispute Resolution: We approach all disputes with a philosophy of rapid investigation
    and fair resolution. Initial reviews are conducted within 5-10 business days,
    and a formal written determination is provided upon the conclusion of the investigation.'
  domain: wealth_management
  product_category: private_wealth_advisory
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: meridian_wealth
- id: 9cac5511-f602-57ae-8d6c-71aac608a8f6
  title: Private Wealth Advisory — interest rate / APY schedule
  body: 'Private Wealth Advisory is a managed investment service focused on bespoke
    asset allocation and long-term growth; it is not a deposit account and therefore
    does not offer a fixed interest rate or a guaranteed Annual Percentage Yield (APY).


    Returns are generated through the performance of the diversified assets selected
    within your bespoke portfolio. The actual yield will vary based on the specific
    instruments chosen during the Risk Profiling process and the subsequent market
    performance of those assets.


    Because we provide a high-touch, active management service, the cost of this professional
    oversight is reflected in the annual advisory fee of 0.75%. This fee is applied
    to the total assets under management regardless of the current market yield. For
    a detailed breakdown of how these costs are applied, please refer to the Private
    Wealth Advisory — fee schedule.'
