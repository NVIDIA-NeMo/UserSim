  body: "This document outlines the policy governing modifications to the terms of\
    \ the Tax-Managed Portfolio. As a fiduciary, Meridian Wealth is committed to transparency\
    \ and equitable treatment; consequently, our fee structure is non-negotiable.\
    \ The current annual advisory fee is 0.95%, applied to the total assets under\
    \ management.\n\nMeridian Wealth reserves the right to amend the terms of this\
    \ agreement, including the annual advisory fee of 0.95% or the minimum investment\
    \ threshold of $500,000, to reflect changes in market conditions or regulatory\
    \ requirements. In the event of such a change, we will provide clients with formal\
    \ written notice at least 30 calendar days prior to the effective date of the\
    \ amendment. \n\nContinued maintenance of the account following the notice period\
    \ constitutes acceptance of the revised terms. Clients who find the updated terms\
    \ incompatible with their financial goals may elect to terminate the relationship.\
    \ Upon termination, all outstanding advisory fees accrued up to the date of closure\
    \ will be settled. \n\nOur obligation to act in your best interest—our Fiduciary\
