- id: dcda65af-881b-5686-8223-0c4855d017d7
  title: Anchor 12-Month CD — getting started walkthrough
  body: 'This guide is for support agents assisting customers in opening an Anchor
    12-Month CD. This product is a secure, fixed-rate vehicle for guaranteed returns
    over a one-year term.


    Product Specifications:

    * Term: 12 months

    * APY: 4.5%

    * Minimum Deposit: $1000

    * Early Withdrawal Penalty: 90 days of interest


    Walkthrough Steps:

    1. Identity Verification: Before proceeding, you must complete rigorous identity
    verification. No account modifications or openings are permitted without successful
    validation.

    2. Funding Source: Confirm the customer has a minimum deposit of $1000 available.
    These funds can be transferred from a Northwind Bank account, such as the Everyday
    Checking — overview, or via an external transfer.

    3. Disclosure Delivery: Provide the customer with the full APY disclosure and
    the early withdrawal penalty terms (90 days of interest).

    4. Confirmation: Once the customer accepts the terms and the $1000 minimum is
    deposited, confirm the account is active and the 12 month term has begun.


    Agent Note: Always remind the customer that this is a liquid account only at the
    end of the term. If they need a high-growth account with immediate access, suggest
    the Northwind High-Yield Savings — overview instead.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 1fa82e98-9cbd-5da6-b1a2-f80c1157d365
  title: Anchor 12-Month CD — minimum deposit explained
  body: 'Q: How much money do I need to open an Anchor 12-Month CD?

    A: To open this account, we require a minimum deposit of $1000. This ensures the
    account is properly funded to earn the guaranteed returns over the term.


    Q: Can I add more money to my CD after it is opened?

    A: No. The Anchor 12-Month CD is funded with a one-time deposit at the start.
    If you have additional savings you would like to grow, we recommend opening a
    second CD or using our Northwind High-Yield Savings — overview.


    Q: What happens if my balance falls below $1000?

    A: Since no additional deposits or partial withdrawals are permitted during the
    12 month term (without penalty), your balance will not fall below the initial
    deposit unless an early withdrawal penalty of 90 days of interest is applied.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 61e46bfe-7beb-58d6-832e-4ff5a84faf8e
  title: Anchor 12-Month CD — make a change or update
  body: 'If you need to update the details associated with your Anchor 12-Month CD,
    follow these steps. Please note that because this is a fixed-term product, the
    APY of 4.5% and the 12 month term cannot be changed once the account is open.


    What you need:

    * Valid government-issued photo ID

    * Current account number


    Steps to update your account:

    1. Request the change: Tell us which piece of information you need to update (e.g.,
    your legal name, mailing address, or beneficiary).

    2. Verify your identity: We will perform a rigorous identity verification process.
    This may include multi-factor authentication to ensure the security of your funds.

    3. Provide documentation: For legal name changes or address updates, provide the
    necessary supporting documents for us to review.

    4. Review confirmation: We will confirm once the change has been applied to your
    account records.


    How you know it worked:

    You will receive a confirmation message via your preferred contact method, and
    the updated information will appear on your next account statement.


    Note: If you wish to change the term or the amount of the CD, you must close the
    current account (subject to the early withdrawal penalty of 90 days of interest)
    and open a new one.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 2326bcfc-d538-50ed-80b1-227c51b3c27d
  title: Anchor 12-Month CD — access or login problems
  body: 'Symptom: You are unable to view your Anchor 12-Month CD balance or account
    details when logged into your digital banking experience.


    Likely Causes:

    * Account Maturity: If your 12 month term has recently ended, the account may
    be in a grace period or transitioning.

    * Verification Hold: A security flag may have been triggered, requiring updated
    identity verification.

    * Browser/App Cache: Outdated session data may be preventing the account from
    loading.


    What to check in order:

    1. Check your term date: Review your original account opening documents to see
    if the 12 month term has expired.

    2. Refresh your session: Log out completely and log back in to refresh your credentials.

    3. Verify contact info: Ensure your current phone number and email are correct
    for multi-factor authentication.


    How to fix it:

    If the account is still missing, tell us. We will start by performing a mandatory
    identity verification. Once your identity is validated, we can manually refresh
    your account visibility or resolve any maturity-related holds.


    When we escalate:

    If the issue is related to a technical synchronization error between our core
    banking system and the digital interface, we will raise a case with our technical
    domain leads. You will receive a status update via email within 24 to 48 business
    hours.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
