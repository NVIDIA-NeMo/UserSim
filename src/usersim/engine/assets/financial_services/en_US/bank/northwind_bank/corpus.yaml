  title: Horizon Cashback Card — vs. a similar product here
  body: 'When choosing between our credit options, the decision usually comes down
    to your spending habits and travel frequency.


    **Horizon Cashback Card**

    *   **Annual Fee:** $0

    *   **Rewards:** A flat 1.5% cashback on all qualifying purchases.

    *   **APR:** 21.99% purchase APR.

    *   **Best for:** Retail savers and everyday spenders who want a simple, no-cost
    way to earn rewards on every purchase.


    **Summit Travel Card**

    *   **Annual Fee:** (See Summit Travel Card — fee schedule)

    *   **Rewards:** Tailored for frequent travelers and international spenders.

    *   **Best for:** Customers who spend significantly on travel and can offset the
    annual fee with premium travel rewards.


    If you prefer a foundational tool for daily liquidity and rewards without a yearly
    bill, the Horizon Cashback Card is the better choice. If you travel frequently
    and want premium perks, the Summit Travel Card is more suitable.'
