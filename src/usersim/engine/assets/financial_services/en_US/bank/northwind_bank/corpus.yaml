  title: Northwind High-Yield Savings — interest rate / APY schedule
  body: 'Northwind Bank provides a competitive and transparent rate for our savers.
    The following rate applies to all balances in the Northwind High-Yield Savings
    account:


    * Current APY: 4.25%


    This is a flat rate; there are no tiered balance requirements to earn this yield.
    All funds above the minimum opening deposit of $100 earn the 4.25% APY.


    Rate Application:

    * Calculation: Interest is calculated on your daily balance.

    * Crediting: Interest is paid and credited to your account on a monthly basis.

    * Variability: This rate is variable. Changes may occur based on federal interest
    rate adjustments or Northwind Bank''s internal pricing reviews to remain competitive
    in the retail banking market.'
