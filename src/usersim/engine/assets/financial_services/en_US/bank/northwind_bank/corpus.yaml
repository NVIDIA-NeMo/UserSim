- id: 787c8cea-52ea-5cc8-9bf6-64d166b25b83
  title: Anchor 12-Month CD — choosing between tiers or options
  body: 'When deciding where to place your savings, you may be choosing between the
    Anchor 12-Month CD and the Northwind High-Yield Savings — overview.


    Anchor 12-Month CD:

    * Return: Guaranteed APY of 4.5%.

    * Access: Funds are locked for a 12 month term.

    * Risk: Very low; fixed rate protects you if market rates drop.

    * Lock-in: Early withdrawal results in a penalty of 90 days of interest.

    * Minimum: $1000 deposit required.


    Northwind High-Yield Savings:

    * Return: Variable APY (can change based on market conditions).

    * Access: High liquidity; funds can be withdrawn at any time.

    * Risk: Variable rate means your earnings could decrease over time.

    * Lock-in: No term commitment.


    Who it suits:

    Choose the Anchor 12-Month CD if you have at least $1000 that you do not need
    for a full year and you want the peace of mind of a guaranteed 4.5% return. Choose
    the High-Yield Savings if you are building an emergency fund and need immediate
    access to your money.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: aee48151-e6d2-5e90-a2b6-f23370f2e6a6
  title: Anchor 12-Month CD — privacy and data handling
  body: 'Northwind Bank is committed to the privacy and security of your financial
    data. This disclosure outlines how we handle information related to your Anchor
    12-Month CD.


    Data Collection and Use: We collect personal identifiable information (PII) and
    financial data necessary to open and maintain your account, including your tax
    identification number and the $1000 minimum deposit source. This data is used
    strictly for account administration, regulatory reporting, and to ensure you receive
    your 4.5% APY earnings.


    Regulatory Compliance: We strictly adhere to CFPB, Federal Reserve, and FDIC guidelines.
    All retail deposits, including those in the Anchor 12-Month CD, are FDIC-insured
    up to the maximum allowable limit. We prioritize transparency in all disclosures
    and maintain rigorous data privacy standards.


    Identity Verification: To protect your assets, multi-factor authentication and
    rigorous identity verification are mandatory before any state-changing action
    (such as changing a beneficiary) or disclosure of PII. No account modifications
    are permitted without successful identity validation.


    Third-Party Sharing: We do not sell your personal data. We only share information
    with third parties when required by law or to process transactions essential to
    your account''s operation. Your data is encrypted both in transit and at rest
    using industry-standard protocols.


    For further details on our general privacy practices, you may refer to the Everyday
    Checking — regulatory disclosures.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: f11363ab-a145-5cc9-ae20-e07b785090e2
  title: Anchor 12-Month CD — recognizing scams targeting this product
  body: "At Northwind Bank, we want to help you keep your savings secure. Because\
    \ the Anchor 12-Month CD offers a guaranteed return, it can sometimes be a target\
    \ for scammers who use the promise of 'exclusive' or 'accelerated' rates to trick\
    \ customers.\n\nCommon scams targeting our CD holders include:\n* **The 'Rate\
    \ Boost' Phish:** You receive an email or text claiming that for a small fee or\
    \ by providing your login details, we can increase your 4.5% APY to a much higher\
    \ rate. We will never ask for a fee to increase your rate, nor will we ask for\
    \ your password via text or email.\n* **The Urgent Liquidation Scam:** A caller\
    \ pretends to be from our fraud department, claiming your account is compromised\
    \ and that you must move your funds into a 'secure' external account immediately\
    \ to avoid losing your principal. Remember, we will never pressure you to move\
    \ your funds to an outside institution to 'protect' them.\n* **The Deposit Verification\
    \ Trick:** Scammers may ask you to send a small amount of money to 'verify' your\
    \ identity before you can open a new CD. We only require a minimum deposit of\
    \ $1000 to open an Anchor 12-Month CD, and this is handled through secure, official\
    \ channels.\n\nWhat we will never ask for:\nWe will never ask for your full password,\
    \ your multi-factor authentication (MFA) codes, or your PIN over the phone or\
    \ via email. \n\nIf you notice any suspicious activity or receive a request that\
    \ feels wrong, tell us immediately. Rapid reporting is essential to our fraud\
    \ investigation process. For more general tips on keeping your accounts safe,\
    \ you may refer to Anchor 12-Month CD — account security best practices."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 9cf46c63-ef71-5fdc-a2de-dadefc419f70
  title: Anchor 12-Month CD — limits, restrictions, and edge cases
  body: 'This guide provides the necessary technical constraints and operational limits
    for the Anchor 12-Month CD to assist in customer support interactions.


    **Core Product Constraints**

    * **Term Length:** This product has a fixed term of 12 months. No extensions or
    shortenings of this term are permitted once the account is funded.

    * **Deposit Minimum:** The minimum deposit required to open the account is $1000.
    Applications with funding amounts below this threshold will be rejected.

    * **Yield:** The product provides a fixed APY of 4.5% for the duration of the
    term.


    **Withdrawal Restrictions**

    * **Liquidity:** This is a fixed-rate vehicle. Funds are intended to remain in
    the account for the full 12 months.

    * **Early Withdrawal Penalty:** If a customer requests their funds before the
    end of the 12-month term, a penalty is applied. This penalty is equal to 90 days
    of interest earned on the account.


    **Edge Cases and Handling**

    * **Underfunded Accounts:** If an account is opened but the final settled deposit
    is less than $1000, the account cannot be maintained and must be closed.

    * **Maturity Handling:** Upon completion of the 12 months, funds and earned interest
    are available for withdrawal or can be rolled into a new term based on the rates
    available at that time.

    * **Death or Incapacity:** In accordance with our general retail banking policies,
    early withdrawal penalties may be waived in the event of the account holder''s
    death or a legally documented court-ordered incapacity. Support agents must escalate
    these requests to a domain lead in retail banking for approval.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 8cfd9dbd-5492-56f7-9442-8d1ddf46dde0
  title: Anchor 12-Month CD — early withdrawal penalty days explained
  body: '**What happens if I need my money before the 12 months are up?**

    Because the Anchor 12-Month CD is a fixed-term commitment, it is designed to hold
    your money for the full duration. If you choose to withdraw your funds early,
    we apply an early withdrawal penalty.


    **How is the early withdrawal penalty calculated?**

    The penalty for withdrawing funds before the term ends is equal to 90 days of
    interest. This means we will deduct the equivalent of 90 days of the interest
    you earned from your total balance upon closure.


    **Does the penalty affect my original deposit?**

    In most cases, the penalty is taken from the interest you have already earned.
    However, if you withdraw funds very early in the term before 90 days of interest
    has accumulated, the penalty may reduce your original principal deposit.


    For more details on the costs associated with this account, please see Anchor
    12-Month CD — cost and charges.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: faq
