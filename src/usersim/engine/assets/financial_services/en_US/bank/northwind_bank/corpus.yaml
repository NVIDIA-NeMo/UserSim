- id: ec834c2c-aa8e-53b4-8096-b2591af4e660
  title: Horizon Cashback Card — regulatory disclosures
  body: 'This disclosure provides formal terms regarding the Horizon Cashback Card
    in accordance with Regulation Z and other federal guidelines.


    **Interest Rates and Fees**

    The Horizon Cashback Card carries a purchase APR of 21.99%. This rate is variable
    and may change based on the Prime Rate. Interest is compounded daily and billed
    monthly on your statement. There is an annual fee of $0 associated with the maintenance
    of this account.


    **Rewards Program**

    Cardholders earn a cashback rate of 1.5% on qualifying purchases. Qualifying purchases
    are defined as all transactions that do not fall under excluded categories (such
    as cash advances or balance transfers). Rewards are credited to the account based
    on the monthly billing cycle.


    **Payment Obligations**

    To avoid interest charges, the full statement balance must be paid by the due
    date. Minimum payments are required monthly to keep the account in good standing.
    Failure to make payments may result in penalty rates or account suspension.


    **Fair Treatment and Privacy**

    Northwind Bank strictly adheres to CFPB and Federal Reserve guidelines to ensure
    the fair treatment of all customers. We prioritize your data privacy and transparency
    in all our credit disclosures.


    *Disclaimer: This card is a credit product. Your credit score may be impacted
    by the application process and your subsequent payment history.*'
  domain: cards
  product_category: horizon_cashback_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
