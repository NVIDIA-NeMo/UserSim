- id: 36e64114-2271-5d9e-94c0-3b6b2f90757c
  title: Northwind High-Yield Savings — choosing between tiers or options
  body: 'When deciding where to place your savings, it is important to choose the
    vehicle that matches your goals for liquidity and growth. The Northwind High-Yield
    Savings account is designed for those who need a balance of both.


    **Comparison: High-Yield Savings vs. Anchor 12-Month CD**

    * **Growth:** Northwind High-Yield Savings offers a competitive 4.25% APY. The
    Anchor 12-Month CD provides a fixed rate for guaranteed returns, though the rate
    may differ from the variable savings rate.

    * **Liquidity:** Our savings account is highly liquid, allowing up to 6 withdrawals
    per month. The Anchor 12-Month CD locks your funds for a one-year term; early
    withdrawals from a CD typically incur penalties.

    * **Cost:** The savings account is low-friction but charges an excess withdrawal
    fee of $10 if you exceed the monthly limit. The CD has no monthly withdrawal limit
    because it is not intended for frequent access.

    * **Entry:** The savings account requires a minimum opening deposit of $100.


    **Which one should you choose?**

    * **Choose Northwind High-Yield Savings if:** You are building an emergency fund
    or saving for a short-term goal and need to access your money occasionally.

    * **Choose Anchor 12-Month CD if:** You have a lump sum you don''t need for a
    year and want to guarantee your return regardless of market changes.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: bb81fa11-d395-5246-9b97-d876383eda1a
  title: Northwind High-Yield Savings — privacy and data handling
  body: "Northwind Bank is committed to the highest standards of data privacy and\
    \ transparency. This disclosure explains how we handle your personal and financial\
    \ information in relation to your Northwind High-Yield Savings account.\n\n**Data\
    \ Collection and Usage**\nWe collect personal identifiable information (PII) necessary\
    \ to comply with federal 'Know Your Customer' (KYC) laws and to ensure the security\
    \ of your deposits. This includes your name, address, Social Security number,\
    \ and government-issued identification. We use this data strictly for account\
    \ administration, identity verification, and regulatory reporting.\n\n**Security\
    \ Protocols**\nTo protect your account, we employ mandatory multi-factor authentication\
    \ (MFA) for all state-changing actions. No modifications to your account—including\
    \ changes to your address or beneficiaries—are permitted without successful identity\
    \ validation. This ensures that your funds and your data remain secure.\n\n**Regulatory\
    \ Compliance**\nWe strictly adhere to the guidelines set forth by the CFPB, the\
    \ Federal Reserve, and the FDIC. \n* **Insurance:** All retail deposits in the\
    \ Northwind High-Yield Savings account are FDIC-insured up to the maximum allowable\
    \ limit.\n* **Electronic Transfers:** We prioritize the rapid resolution of unauthorized\
    \ transactions in accordance with Regulation E timelines. Our philosophy is to\
    \ protect the consumer first while we conduct thorough internal investigations\
    \ into fraudulent activity.\n* **Transparency:** We provide clear disclosures\
    \ regarding our variable APY of 4.25% and our low-friction fee model, including\
    \ the $10 excess withdrawal fee applied after the monthly withdrawal limit of\
    \ 6 is reached.\n\n**Privacy Rights**\nWe do not sell your personal financial\
    \ data to third-party marketers. Your information is shared only with authorized\
    \ regulatory bodies or service providers necessary to maintain your banking experience.\
    \ You have the right to request a copy of the data we hold about you or to request\
    \ corrections to your PII through our secure support channels."
  domain: retail_banking
  product_category: high_yield_savings
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: c12f75fe-ac3a-5287-a3ae-876baaf44695
  title: Northwind High-Yield Savings — recognizing scams targeting this product
  body: 'At Northwind Bank, we want to help you keep your savings secure. Because
    the Northwind High-Yield Savings account offers a competitive APY of 4.25%, it
    is often a target for scammers who try to trick customers into moving their money
    into fraudulent accounts.


    Common scams targeting our savers include:


    *   **The ''Rate Boost'' Scam:** You may receive an email or text claiming your
    4.25% APY is about to increase significantly, but only if you move your funds
    to a ''special promotional account'' via a link. We will never ask you to move
    your money to an external account to receive a better rate.

    *   **Urgent Verification Requests:** Scammers may pretend to be from our security
    team, claiming there is a problem with your minimum opening deposit of $100 and
    asking for your password or multi-factor authentication code to ''verify'' your
    identity.

    *   **Payment Processing Scams:** Be wary of anyone asking you to transfer money
    from your savings account to a third party to ''unlock'' a prize or a government
    grant.


    Remember, we will never ask for your full password or your one-time security codes
    over the phone or via email. We use rigorous identity verification for all state-changing
    actions to protect you.


    If you notice an unauthorized transaction or receive a suspicious request, tell
    us immediately. We prioritize the rapid resolution of unauthorized transactions
    in strict accordance with Regulation E timelines to protect you first while we
    conduct our internal investigations.


    For more on how we protect your accounts, you may also review Northwind High-Yield
    Savings — fraud and unauthorized-activity protection.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d8d73ee0-8fdd-5a9b-9f01-3027922ee3ce
  title: Northwind High-Yield Savings — limits, restrictions, and edge cases
  body: 'This document provides a detailed breakdown of the operational limits and
    restrictions for the Northwind High-Yield Savings account. Support agents should
    use this guide to ensure customers understand the boundaries of their account
    usage.


    **Funding and Opening Requirements**

    *   To open an account, a minimum opening deposit of $100 is required. This must
    be present at the time of account creation to successfully activate the product.


    **Withdrawal Limits**

    *   This account is designed for high-growth liquid savings rather than daily
    spending. Consequently, we apply a monthly withdrawal limit of 6 transactions.

    *   A ''withdrawal'' includes any transfer of funds out of the account or any
    one-time payment made from the account.


    **Excess Withdrawal Penalties**

    *   If a customer exceeds the monthly withdrawal limit of 6, an excess withdrawal
    fee of $10 will be applied to each single transaction that occurs after the limit
    is reached.

    *   These fees are designed to discourage account misuse and maintain the account''s
    status as a savings vehicle.


    **Earnings and Yield**

    *   The account earns a competitive APY of 4.25%. This rate is the real rate of
    return earned on the deposit including the effect of compounding interest.


    **Edge Cases for Support**

    *   If a customer has a pending transfer that puts them over the limit of 6, the
    excess withdrawal fee of $10 will trigger once the transaction is finalized.

    *   If a customer''s balance falls below the required amount for a requested transfer,
    the action will be declined to prevent an overdraft.


    For general product positioning, refer to Northwind High-Yield Savings — overview.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 2d9bd31b-0e2d-578c-baf5-ab4c3200e38b
  title: Northwind High-Yield Savings — excess withdrawal fee explained
  body: '**What is the excess withdrawal fee?**

    Because the Northwind High-Yield Savings account is intended for your emergency
    funds and short-term goals, we set a monthly withdrawal limit of 6 transactions.
    If you make more than 6 withdrawals in a single monthly cycle, we charge an excess
    withdrawal fee of $10 for each additional transaction.


    **How can I avoid this fee?**

    To avoid the $10 charge, simply keep your monthly withdrawals to 6 or fewer. If
    you find that you need to move money more frequently, you might consider pairing
    this account with an Everyday Checking — overview account for your daily spending
    needs.


    **Does the fee apply to every transaction over the limit?**

    Yes, every individual withdrawal beyond the 6 allowed per month will incur the
    $10 fee.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ed38f16f-e784-58bf-86e7-14347fb8b592
  title: Northwind High-Yield Savings — check status or history
  body: 'If you need to review your current balance, track your interest earnings,
    or check how many withdrawals you have used this month, follow these steps.


    **What you need before starting:**

    *   Your account identification details.

    *   Successful completion of our identity verification process.


    **Steps to check your status and history:**

    1.  **Request your account summary:** Tell us that you would like to see the current
    status of your Northwind High-Yield Savings account. We will then perform a mandatory
    identity verification to protect your private information.

    2.  **Review your current balance:** We will provide your current available balance
    and confirm the current APY of 4.25% being applied to your funds.

    3.  **Request your transaction history:** Ask us for a list of recent transactions.
    We will provide a detailed history showing all deposits and withdrawals.

    4.  **Verify your withdrawal count:** To avoid the $10 excess withdrawal fee,
    ask us to confirm how many withdrawals you have made during the current monthly
    cycle. We will tell you how many of your 6 monthly withdrawals have been used.

    5.  **Confirm the results:** Review the information we provide. If the history
    matches your records, the process is complete.


    If you notice any missing transactions or incorrect amounts while reviewing your
    history, you can ask us to start a formal review of the discrepancy.'
