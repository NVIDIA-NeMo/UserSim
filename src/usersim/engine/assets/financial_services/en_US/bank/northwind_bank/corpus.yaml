- id: 0013083f-2e8c-5d03-a4c7-aa92f0b6e96f
  title: Anchor 12-Month CD — set up and activate
  body: 'Opening an Anchor 12-Month CD is a straightforward process. To get started,
    please ensure you have at least $1000 available in a Northwind Bank account or
    via an external transfer, as this is the minimum deposit required.


    Follow these steps to activate your account:


    1. Tell us you would like to open an Anchor 12-Month CD. We will first perform
    a mandatory identity verification to protect your security.

    2. Confirm the amount you wish to deposit. This must be $1000 or more.

    3. Review and accept the terms of the 12 months term and the 4.5% APY.

    4. Instruct us on where to pull the funds from (such as your Everyday Checking
    account).

    5. We will process the transfer and provide you with a confirmation of your account
    opening, including your maturity date.


    You will know the process is successful when you see the new Anchor 12-Month CD
    listed in your account overview with the confirmed balance and a 4.5% APY.


    If you are deciding between different savings options, you may find it helpful
    to review Anchor 12-Month CD — vs. a similar product here to see how this fixed-rate
    option differs from our liquid savings accounts.'
