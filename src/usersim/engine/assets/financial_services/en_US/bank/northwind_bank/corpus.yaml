- id: bcd8d831-53fe-5cb1-98a5-bd0fbe73cad0
  title: Summit Travel Card — an unexpected charge or amount
  body: 'Symptom: You see a transaction on your Summit Travel Card statement that
    you do not recognize or an amount that seems incorrect.


    Likely Causes:

    * Temporary Authorization Holds: Hotels and rental car agencies often place holds
    that are higher than the actual cost.

    * Currency Conversion: While we charge a 0% foreign transaction fee, the exchange
    rate is set by the network (e.g., Visa/Mastercard).

    * Unauthorized Activity: A fraudulent charge made by a third party.


    What to check:

    1. Compare the charge date and merchant name against your travel receipts.

    2. Check if the charge is ''Pending'' or ''Posted''. Pending charges are often
    authorizations that will adjust to the correct amount once finalized.


    How to fix:

    * For authorization holds, wait 3-5 business days for the merchant to finalize
    the transaction.

    * For incorrect amounts from a merchant, we recommend contacting the merchant
    first for a correction.


    When to escalate:

    If you confirm the charge is unauthorized or the merchant refuses to correct a
    clear error, tell us immediately. We will initiate a dispute process. We prioritize
    the rapid resolution of unauthorized transactions in accordance with Regulation
    E timelines. We will then route the case to our specialized domain leads in credit
    cards to conduct a thorough internal investigation and apply any eligible provisional
    credits.'
  domain: cards
  product_category: summit_travel_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 6f6f4c91-2650-531d-afab-b61db0e5afba
  title: Summit Travel Card — required documentation
  body: 'To apply for the Summit Travel Card, you must provide the following documentation
    for verification:


    | Requirement | Documentation Needed | Outcome |

    | :--- | :--- | :--- |

    | Identity Proof | Valid Government-issued Photo ID (Passport or Driver''s License)
    | Verification Successful |

    | Residency Proof | Utility Bill or Lease Agreement (dated within 90 days) | Address
    Verified |

    | Income Proof | Recent Paystubs or Tax Returns | Credit Limit Determination |

    | SSN/TIN | Social Security Number or Taxpayer ID | Credit History Pull |


    Failure to provide any of the above will result in an ''Incomplete Application''
    status until the missing document is submitted.'
