- id: 6d339de5-7aef-5a77-9258-5b04ae15a205
  title: Everyday Checking — change-of-terms policy
  body: 'This document outlines how we manage changes to the terms and conditions
    of your Everyday Checking account. As a consumer-centric bank, we strive for transparency
    in all our updates.


    **Our Right to Modify Terms**

    Northwind Bank reserves the right to change the fees, requirements, or features
    of the Everyday Checking account. This includes adjustments to the $0 monthly
    maintenance fee, the $500 minimum balance required to waive certain fees, the
    $34 overdraft fee, or the $2.5 out-of-network ATM fee.


    **Notice Period**

    We will provide you with written notice of any material change to your account
    terms at least 30 days before the change becomes effective. This notice will be
    delivered via your preferred communication method (secure chat, email, or mail).


    **Customer Acceptance and Termination**

    Your continued use of the account after the effective date of a change constitutes
    your acceptance of the new terms. If you do not agree to the updated terms, you
    have the right to close your account without penalty before the change takes effect.
    To do this, you must ensure all pending transactions have cleared and your balance
    is settled.


    **Regulatory Compliance**

    All changes are made in strict adherence to CFPB and Federal Reserve guidelines.
    We prioritize fair treatment and will ensure that any change in fee structure
    is disclosed clearly, avoiding jargon to ensure our terms remain accessible to
    all our customers.


    For the full account agreement, please refer to Everyday Checking — account agreement.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d1dd923c-20ce-5f61-964c-bdae66fd7e84
  title: Everyday Checking — getting started walkthrough
  body: 'This guide is for support agents to help new customers successfully onboard
    and begin using their Everyday Checking account, which serves as the foundational,
    low-cost hub for daily spending and liquidity.


    **Step 1: Identity Verification**

    Before any account is opened, you must perform rigorous identity verification.
    Ensure the customer provides valid government-issued identification. Multi-factor
    authentication is mandatory before the account is finalized.


    **Step 2: Funding the Account**

    Assist the customer in making their first deposit. To avoid any potential friction
    and to establish a healthy account habit, encourage the customer to maintain a
    balance of at least $500, which is the minimum balance to waive the fee for this
    product.


    **Step 3: Card Activation**

    Once the debit card arrives, the customer must activate it. Confirm they have
    set a secure PIN. Remind them that while we provide a streamlined digital experience,
    they can use their card at any ATM; however, an out-of-network ATM fee of $2.5
    applies.


    **Step 4: Feature Education**

    Brief the customer on the following key cost points to ensure transparency:

    * **Monthly Maintenance Fee:** $0

    * **Minimum Balance to Waive Fee:** $500

    * **Overdraft Fee:** $34

    * **Out-of-Network ATM Fee:** $2.5


    **Step 5: Final Confirmation**

    Verify that the customer understands that their deposits are FDIC-insured and
    that they have access to support via secure chat, email, and phone during Eastern
    Time (ET) business hours. Once confirmed, the account is ready for daily use.


    For more general details, see Everyday Checking — overview.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 1a583323-fcdd-5dc7-a0c2-8f9b11c5e926
  title: Everyday Checking — overdraft fee explained
  body: '**What is an overdraft?**

    An overdraft occurs when you spend more money than you currently have in your
    Everyday Checking account, resulting in a deficit.


    **How much is the overdraft fee?**

    If an overdraft occurs, we charge an overdraft fee of $34 per occurrence. This
    fee is designed to discourage account misuse rather than generate revenue for
    the bank.


    **How can I avoid this fee?**

    We recommend keeping a buffer in your account. Maintaining a balance above $500
    not only helps you avoid overdrafts but is also the minimum balance to waive fee
    for this account type. You can also set up alerts to notify you when your balance
    is low.


    For a full list of costs, please refer to Everyday Checking — fee schedule.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: a20af2ad-cd0c-5fd9-b7e7-12ce8ebef8a0
  title: Everyday Checking — make a change or update
  body: 'We make it simple to update your account details to ensure your banking experience
    remains seamless. Follow these steps to make a change to your Everyday Checking
    account.


    **Requirements Before Starting**

    To protect your privacy, you must be able to complete our mandatory identity verification
    process. Have your current account details and a valid government ID ready.


    **Step-by-Step Update Process**

    1. **State the Change:** Tell us exactly what you would like to update (for example,
    your legal name, residential address, or email address).

    2. **Verify Your Identity:** We will perform a rigorous identity verification
    check. This includes multi-factor authentication. No account modifications are
    permitted without successful validation.

    3. **Provide New Information:** Give us the updated details. If you are changing
    a legal name, we will ask you to provide the supporting legal documentation.

    4. **Review the Update:** We will read back the changes to you to ensure every
    detail is correct.

    5. **Receive Confirmation:** We will confirm once the change has been applied
    to your profile. You will receive a notification via your secure channel confirming
    the update is complete.


    **How You Know It Worked**

    Your update is successful when you receive the confirmation notification and see
    the updated information reflected in your account profile during your next login.


    If you need to close the account instead of updating it, please see Everyday Checking
    — cancel, close, or downgrade.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: b6a1a64c-3314-5cae-bb50-9038ca40282a
  title: Everyday Checking — access or login problems
  body: 'If you are unable to access your Everyday Checking account, it is usually
    due to a security lockout or a verification failure. We prioritize your data privacy
    and security above all else.


    **Common Symptoms**

    * "Invalid credentials" error messages despite using the correct password.

    * Not receiving the multi-factor authentication (MFA) code via text or email.

    * Account being flagged as "Locked" for security reasons.


    **What to Check and Fix**

    1. **Check Your Connectivity:** Ensure you have a stable internet connection.
    If you aren''t receiving an MFA code, check your signal strength or your email
    spam folder.

    2. **Verify Your Credentials:** Carefully re-enter your username and password.
    Remember that these are case-sensitive.

    3. **Request a New Code:** If the MFA code has expired, request a new one. Wait
    at least 60 seconds before requesting another to avoid triggering a security block.


    **When We Will Escalate**

    If you have tried the above and still cannot gain access, we will escalate the
    issue. We will first perform a manual identity verification to ensure you are
    the account owner. Once verified, we will:

    * Reset your secure access credentials.

    * Clear any security flags on the account.

    * Provide you with a temporary secure link to regain entry.


    If the issue is related to a systemic login failure, we will route the case to
    our specialized retail banking domain leads. You will be notified via your registered
    contact method as soon as the access is restored. For other unexpected issues,
    see Everyday Checking — a failed or pending action.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: fed17134-4b33-576c-9f80-e14061eb6263
  title: Everyday Checking — qualification tiers
  body: 'This matrix helps support agents determine the account status and fee applicability
    for Everyday Checking customers based on their balance and profile.


    | Condition | Outcome |

    | :--- | :--- |

    | Account Balance < $500 | Subject to standard monthly maintenance fees (currently
    $0) |

    | Account Balance $\ge$ $500 | Monthly maintenance fee waived |

    | Unauthorized Transaction Reported | Protected by Regulation E timelines; investigation
    initiated |

    | Out-of-Network ATM Usage | $2.5 fee applied per transaction |

    | Account Balance < $0 | $34 overdraft fee applied per item |


    All retail deposits are FDIC-insured. Ensure the customer meets the basic identity
    verification requirements before confirming tier placement.'
  domain: retail_banking
