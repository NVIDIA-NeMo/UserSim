- id: 51965c2c-372b-5f74-8223-806dbd41493e
  title: Horizon Cashback Card — a failed or pending action
  body: 'If you experience an issue where a transaction is declined or an account
    action (like activation) is pending, please follow these steps to identify the
    cause.


    **Common Symptoms:**

    *   The card is declined at a point-of-sale terminal.

    *   The card activation status remains ''Pending'' after you have submitted your
    details.

    *   A rewards credit is not appearing in your balance.


    **What to check in order:**

    1.  **Identity Validation:** Ensure that the name and address on your profile
    match your government ID exactly. If there is a mismatch, the action will remain
    pending.

    2.  **Card Status:** Check if the card has been successfully activated. If you
    skipped any step in the Horizon Cashback Card — set up and activate guide, the
    card will not work.

    3.  **Available Credit:** Confirm that the purchase amount does not exceed your
    current available credit limit.


    **The Fix:**

    *   If your identity details are incorrect, tell us the updated information, and
    we will re-verify your account.

    *   If the card was not activated, we will walk you through the activation steps
    immediately.


    **When we escalate:**

    If the issue is related to a suspected fraudulent block or a technical system
    error, we will route your request to our specialized credit card domain leads.
    You will receive a case number and an update on the resolution via your preferred
    contact method within 1-3 business days.'
