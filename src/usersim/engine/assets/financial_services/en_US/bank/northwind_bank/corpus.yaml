- id: 6188f659-8442-584d-bdba-1b3b350f6045
  title: Everyday Checking — account security best practices
  body: 'Keeping your money safe is a partnership between us and you. Because Everyday
    Checking is designed for high-frequency daily use, it can be a target for those
    seeking quick access to funds. We want to ensure you have the tools to protect
    your balance.


    **Best Practices for Your Account**

    * **Enable Multi-Factor Authentication (MFA):** We require MFA for all state-changing
    actions. Never share your one-time passcodes with anyone, including people claiming
    to be from Northwind Bank.

    * **Monitor Your Transactions:** Review your activity daily. Because we follow
    Regulation E, reporting unauthorized transactions quickly is the best way to ensure
    a rapid resolution.

    * **Secure Your Debit Card:** Use a complex PIN and avoid writing it down near
    your card. If you lose your card, let us know immediately so we can freeze it.


    **What We Will Never Ask For**

    We will never send you a text or email asking for your full password, your MFA
    code, or your Social Security number to ''verify'' your account. If you receive
    a request like this, it is a scam.


    **Immediate Action Steps**

    If you notice a transaction you did not authorize, or if you believe your login
    credentials have been compromised, tell us immediately. We prioritize the consumer
    first during fraud investigations, but timely reporting is critical for the protection
    of your funds. We will work with you to secure the account and investigate the
    activity in accordance with federal timelines.


    For more on how we handle unauthorized activity, please see Everyday Checking
    — fraud and unauthorized-activity protection.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: security_advisory
  source_authority: official
