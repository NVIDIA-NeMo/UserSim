- id: 0320e7e2-6f3e-5104-af63-af0107923813
  title: Northwind High-Yield Savings — cancel, close, or downgrade
  body: 'If you no longer need your Northwind High-Yield Savings account or wish to
    move your funds to a different product, follow these steps:


    1. Verify your identity: Tell us you wish to close or change your account. We
    will perform a rigorous identity verification process, which may include multi-factor
    authentication, to ensure your PII is protected.

    2. Specify the remaining balance: Tell us how you would like to receive your remaining
    funds. You can ask us to transfer the full balance to another Northwind Bank account
    (such as your Everyday Checking) or ask us to send the funds to an external institution.

    3. Confirm withdrawal limits: If you are moving a large sum in multiple transactions,
    we will check if these exceed your monthly withdrawal limit of 6. We will notify
    you if any excess withdrawal fee of $10 will be applied based on your current
    monthly activity.

    4. Execute the closure: Once the funds are moved, ask us to formally close the
    account. We will process the request and ensure no further interest is accrued.

    5. Receive confirmation: We will provide a final confirmation message or statement
    showing the account has been closed with a $0 balance.


    If you find that you need more frequent access to your money than the 6-withdrawal
    limit allows, you might consider a downgrade to a standard spending account. For
    more information on our other options, see Everyday Checking — overview.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 7e302843-93da-57d2-9b4d-b43384c0cdf7
  title: Northwind High-Yield Savings — an unexpected charge or amount
  body: 'If you notice a charge or a balance amount in your Northwind High-Yield Savings
    account that you did not expect, follow these steps to identify the cause:


    1. Check for excess withdrawals: Review your transaction history for the current
    monthly statement cycle. Count the number of withdrawals you have made. If you
    have made more than 6 withdrawals, each transaction after the 6th one triggers
    an excess withdrawal fee of $10.

    2. Verify interest credits: If the balance is higher than expected, check for
    the periodic interest payment. Your account earns a 4.25% APY, which is credited
    to your balance on a regular schedule.

    3. Look for unauthorized activity: If you see a withdrawal you did not make, this
    may be a fraud issue. Report this to us immediately.


    Resolution:

    * If the charge is an excess withdrawal fee of $10 and you believe it was applied
    in error, tell us. We will review your monthly transaction count. If we find a
    mistake, we will reverse the fee.

    * If the charge is unauthorized, we will immediately initiate a fraud investigation.
    In accordance with Regulation E, we prioritize the consumer first and will work
    to resolve the unauthorized transaction rapidly.

    * For complex discrepancies that cannot be resolved by reviewing the withdrawal
    limit or interest rate, we will escalate your case to a specialized domain lead
    in retail banking who will conduct a full audit of your account history. You will
    receive a status update via secure chat or email.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ad7873d5-5bef-5e73-bb6f-6d24ab713919
  title: Northwind High-Yield Savings — required documentation
  body: 'To open a Northwind High-Yield Savings account, you must provide the following
    documentation to satisfy our identity verification and regulatory requirements:


    | Requirement | Documentation Needed | Outcome |

    | :--- | :--- | :--- |

    | Proof of Identity | Valid Government-issued Photo ID (Passport, Driver''s License)
    | Identity Verified |

    | Proof of Address | Recent Utility Bill or Lease Agreement | Residency Confirmed
    |

    | Initial Funding | Minimum opening deposit of $100 | Account Activated |

    | Tax Identification | Social Security Number (SSN) or Tax ID (TIN) | Regulatory
    Compliance |


    Failure to provide any of the above items will result in a pending application
    status until the documentation is received and verified.'
