- id: e92d563d-06f4-57cc-b724-83a6ff8e4c30
  title: Summit Travel Card — vs. a typical competitor offering
  body: 'When comparing the Summit Travel Card to typical travel cards from other
    institutions, the primary differences lie in transparency and fee structure.


    * Foreign Transaction Fees: Many competitors charge between 1% and 3% on every
    purchase made abroad. The Summit Travel Card charges 0%, ensuring you pay exactly
    the exchange rate without an added bank fee.

    * Rewards Structure: While some competitors offer complex ''point'' systems that
    vary by partner, we offer a straightforward 3% rewards rate on travel purchases.

    * Cost of Entry: We charge a clear annual fee of $95. Some competitors offer ''no
    annual fee'' travel cards, but these typically have much lower rewards rates or
    charge high foreign transaction fees.


    Who each suits:

    * Summit Travel Card: Best for the frequent traveler who spends enough on trips
    to easily offset the $95 annual fee through the 3% rewards and 0% foreign transaction
    fees.

    * Competitor No-Fee Cards: Better for occasional travelers who prioritize avoiding
    a yearly fee over maximizing rewards on their spending.'
  domain: cards
  product_category: summit_travel_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 2173d664-2a03-56be-8d8d-b5ea09e13aa9
  title: Summit Travel Card — risk disclosures
  body: 'This disclosure outlines the financial risks and regulatory terms associated
    with the Summit Travel Card.


    Interest Risk: The Summit Travel Card is a credit product. If you do not pay your
    balance in full each month, you will be charged interest at an annual percentage
    rate of 23.49%. This interest compounds daily, which can significantly increase
    the total amount you owe over time.


    Fee Obligation: Use of this card carries a mandatory annual fee of $95. This fee
    is non-refundable and is charged regardless of the amount of spend or rewards
    earned during the year.


    Rewards Limitation: The 3% rewards rate applies only to categorized travel purchases.
    Other spending categories do not earn this rate. We reserve the right to modify
    reward categories upon notice.


    Regulatory Compliance: Northwind Bank strictly adheres to CFPB, Federal Reserve,
    and FDIC guidelines. All disclosures regarding the 23.49% APR and the $95 annual
    fee are provided in accordance with Regulation Z to ensure transparency in lending.


    Liability: While we prioritize the rapid resolution of unauthorized transactions
    under Regulation E, your liability for unauthorized charges may depend on how
    quickly you report the loss or theft of your card.'
  domain: cards
  product_category: summit_travel_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 7fbfa09e-a90b-5d43-ba95-2a594a047ded
  title: Summit Travel Card — how rates are tiered and applied
  body: 'The Summit Travel Card utilizes a flat-rate structure for its primary costs
    and rewards, meaning the same rates apply to all cardholders regardless of their
    balance or spending volume.


    * Purchase APR: A flat annual percentage rate of 23.49% applies to all purchases
    not paid in full by the end of the billing cycle.

    * Travel Rewards: A flat rewards rate of 3% is applied to all eligible travel
    purchases.

    * Foreign Transaction Fee: A flat rate of 0% applies to all transactions processed
    in a foreign currency.

    * Annual Fee: A flat fee of $95 is charged once per year.


    These rates are subject to change based on market conditions or changes in the
    Prime Rate. Any change to the 23.49% APR will be communicated to you in writing
    prior to being applied to your account.'
  domain: cards
  product_category: summit_travel_card
  document_type: rate_sheet
  source_authority: official
