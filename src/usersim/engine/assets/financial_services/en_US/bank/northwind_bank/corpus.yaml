- id: c1976f2f-0b42-5d0d-84ee-33d8d4c6a244
  title: Everyday Checking — a discrepancy in your records or statement
  body: 'When a customer reports a discrepancy between their own records and their
    Everyday Checking statement, it is important to identify the cause methodically
    to ensure their account is secure.


    **Symptoms:**

    *   The customer believes a deposit is missing.

    *   A transaction amount on the statement differs from the customer''s receipt.

    *   The customer sees a fee they do not recognize.


    **Likely Causes:**

    1.  **Pending Transactions:** The customer may be looking at an ''available balance''
    rather than a ''posted balance,'' and some transactions have not yet cleared.

    2.  **Automatic Fees:** The customer may have triggered an overdraft fee of $34
    or an atm out of network fee of $2.5 without realizing it.

    3.  **Merchant Errors:** The merchant may have processed a different amount than
    what was agreed upon.

    4.  **Unauthorized Activity:** A transaction was made by someone other than the
    account holder.


    **What to check in order:**

    1.  **Review Pending Items:** Check for any pending authorizations that would
    explain the balance difference.

    2.  **Analyze Fee Patterns:** Check if the discrepancy matches the $34 overdraft
    fee or the $2.5 atm out of network fee.

    3.  **Compare Dates:** Ensure the customer''s records and the bank statement cover
    the exact same date range.


    **The Fix:**

    *   **For Fee Confusion:** Explain the fee (e.g., that a $34 charge occurred because
    the account was overdrawn) and refer them to Everyday Checking — fee schedule.

    *   **For Merchant Errors:** Advise the customer to contact the merchant first
    for a refund, as this is the fastest resolution.

    *   **For Unauthorized Activity:** Immediately begin the dispute process. Verify
    the customer''s identity via multi-factor authentication and file a formal report
    under Regulation E.


    **When we escalate:**

    If the discrepancy cannot be resolved by reviewing the transaction history, we
    will escalate the case to our retail banking domain leads. They will perform a
    deeper audit of the ledger and provide a final written determination to the customer.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d4d2c3a0-5cc1-578e-81f0-74ae2c8d56fd
  title: Horizon Cashback Card — overview
  body: 'Welcome to a simpler way to earn rewards. The Horizon Cashback Card is designed
    as an accessible, no-annual-fee credit option for simple, everyday rewards. We
    believe your daily spending should work for you, which is why we have stripped
    away the complexity often found in rewards cards.


    Key features of the Horizon Cashback Card include:


    *   **Cashback Earnings:** You will earn a cashback rate of 1.5% on your qualifying
    purchases.

    *   **No Annual Cost:** We maintain an annual fee of $0, meaning there is no cost
    just to keep your account open.

    *   **Transparent Pricing:** The purchase APR is 21.99%.


    Our goal is to provide a low-friction experience. Whether you are buying groceries,
    fueling up your car, or shopping for the home, you earn rewards without having
    to track categories or meet difficult monthly spend requirements. We focus on
    transparency and accessibility, ensuring you know exactly what you are earning
    and what it costs to carry a balance.


    *Disclaimer: All credit accounts are subject to credit approval. APR is variable
    and based on the prime rate. Cashback is subject to the terms of the cardholder
    agreement.*'
