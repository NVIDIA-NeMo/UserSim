- id: 42ff2c6c-bd2d-5bd3-9812-39c5cf9e9e67
  title: Everyday Checking — set up and activate
  body: 'Setting up your Everyday Checking account is a streamlined process. Follow
    these steps to get started with your new financial hub.


    Prerequisites:

    * A valid government-issued photo ID.

    * Your Social Security number or Taxpayer Identification Number.

    * An initial deposit amount to fund the account.


    Steps to Activate:

    1. Provide us with your personal details and identity documents for verification.
    We perform rigorous identity validation as part of our security standards.

    2. Confirm the account details and agree to the terms of the Everyday Checking
    account.

    3. Provide the amount and source of your initial funding. We will confirm once
    the funds have been successfully deposited into your account.

    4. Request your debit card. We will process the order and send the card to your
    verified address.

    5. Once your card arrives, tell us the card details or use our secure activation
    process to enable it for spending.


    How you know it worked:

    You will receive a confirmation message stating that your account is open and
    active. You will also be able to see your available balance and your account number
    in your secure profile.'
