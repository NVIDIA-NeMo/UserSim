- id: ae8eec9e-4a1d-5f82-ab9c-98ded4d12f74
  title: Northwind High-Yield Savings — a failed or pending action
  body: 'If you encounter an issue while attempting to fund or withdraw from your
    Northwind High-Yield Savings account, please follow these steps to resolve the
    matter.


    Symptom: Your deposit or withdrawal is marked as ''Pending'' longer than expected,
    or the transaction has ''Failed''.


    Possible Causes:

    1. Identity Verification: For new accounts, a deposit may be pending if your identity
    validation is not yet fully processed.

    2. Insufficient Opening Funds: A funding attempt may fail if the amount is less
    than the required minimum opening deposit of $100.

    3. Withdrawal Limits: If you have already reached your monthly withdrawal limit
    of 6, some automated transfers may trigger a flag or an excess withdrawal fee
    of $10.

    4. Security Hold: Large or unusual transfers may be held for manual review to
    protect your funds from unauthorized activity.


    What to check:

    * Verify your available balance to ensure the funds are present.

    * Check your transaction history to count how many withdrawals you have made this
    month.

    * Confirm that your identity documents are up to date.


    Resolution:

    * If the failure is due to the $100 minimum deposit, please resubmit the transfer
    with the correct amount.

    * If you believe a withdrawal was incorrectly flagged as ''excess'', tell us the
    transaction details. We will review the cycle dates and, if a mistake was made,
    we will reverse the $10 fee.


    When to escalate:

    If a transaction remains pending for more than 3 business days, we will raise
    a case with our retail banking domain leads. You will receive an email update
    within 24 hours of the escalation regarding the status of your funds.'
