- id: ea50d02e-60af-5196-9878-db8aa28345c9
  title: Anchor 12-Month CD — a failed or pending action
  body: 'If you are attempting to open an Anchor 12-Month CD and the action is pending
    or has failed, it is typically due to one of the following reasons:


    * Insufficient Funds: The account you are funding from does not have the minimum
    deposit of $1000 required to open the CD.

    * Identity Verification Failure: For your security, we require rigorous identity
    verification before any state-changing action. If the verification process was
    not completed, the account cannot be opened.

    * Transfer Delays: If funding from an external institution, the funds may be in
    a ''pending'' state due to standard banking clear times.


    How to resolve this:

    1. Check your funding source to ensure you have at least $1000 available.

    2. Re-verify your identity if prompted by our team through our secure authentication
    process.

    3. If the funds are coming from another bank, check the status of the external
    transfer.


    If these steps do not resolve the issue, tell us and we will escalate the matter
    to our specialized domain leads in retail banking. They will conduct a thorough
    internal investigation into the transaction failure. You will receive a status
    update via secure chat or email once the investigation is complete, typically
    within 1-3 business days.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: troubleshooting
