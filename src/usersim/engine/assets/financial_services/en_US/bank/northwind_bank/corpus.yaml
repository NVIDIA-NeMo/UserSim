- id: 2c3733c4-4de7-55ea-b9ae-77d5d84efe79
  title: Northwind High-Yield Savings — apy explained
  body: 'Questions about your earnings?


    What is the current APY on my Northwind High-Yield Savings account?

    Your account currently earns an Annual Percentage Yield (APY) of 4.25%. The APY
    represents the real rate of return earned on your deposit, taking into account
    the effect of compounding interest over the course of a year.


    How is the interest credited to my account?

    Interest is calculated daily and credited to your balance monthly. This compounding
    effect is what allows your savings to grow efficiently at the 4.25% rate.


    Can the rate change?

    Yes, the APY is variable. We monitor market conditions and may adjust the rate
    to remain competitive. We will notify you of any significant changes to your earning
    potential.


    For more details on how our rates are structured, please refer to the Northwind
    High-Yield Savings — interest rate / APY schedule.'
