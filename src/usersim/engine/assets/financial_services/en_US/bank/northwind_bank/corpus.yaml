- id: 17e58fdf-597b-5648-89a0-8993620d6ca8
  title: Horizon Cashback Card — risk disclosures
  body: 'This disclosure provides important information regarding the risks associated
    with using the Horizon Cashback Card. Please read these carefully before deciding
    if this product is right for your financial profile.


    Interest Rate Risk: The Horizon Cashback Card carries a purchase APR of 21.99%.
    If you do not pay your balance in full each month, interest will accrue on the
    remaining amount. Because interest compounds, carrying a balance can significantly
    increase the total cost of your purchases and may offset the gains made from the
    1.5% cashback rate.


    Credit Score Impact: Like all credit products, your use of this card can affect
    your credit score. High credit utilization (using a large percentage of your available
    limit) or late payments can lead to a decrease in your credit score.


    Rewards Limitation: The 1.5% cashback is earned on eligible purchases. Certain
    transactions, such as balance transfers, cash advances, or fees, do not earn cashback.
    We reserve the right to modify the rewards program according to our terms and
    conditions.


    Regulatory Adherence: Northwind Bank strictly adheres to CFPB, Federal Reserve,
    and FDIC guidelines. We prioritize transparency in all Regulation Z disclosures
    regarding interest and fees. All retail deposits held in associated Northwind
    Bank accounts are FDIC-insured, though credit card lines are not deposits.


    For more information on our general approach to fraud and protection, please see
    Horizon Cashback Card — fraud and unauthorized-activity protection.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 30a2b62c-0789-5f09-8c35-502e880ebf70
  title: Horizon Cashback Card — how rates are tiered and applied
  body: 'The Horizon Cashback Card uses a flat-rate structure to ensure transparency
    and simplicity for our customers. There are no tiered rates based on balance or
    spending levels.


    Purchase APR:

    * A flat rate of 21.99% applies to all purchases. This rate is used to calculate
    the interest charged on any balance not paid in full by the end of the billing
    cycle.


    Cashback Rate:

    * A flat rate of 1.5% applies to all eligible purchases. This is credited back
    to the account holder based on the total amount of eligible spending during the
    billing period.


    What would change these rates:

    While the current rates are flat, they may be adjusted based on changes in the
    Prime Rate or revisions to our product terms. Any such change will be communicated
    to you in advance as required by law.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 20edd811-6e66-5c6b-bbf6-6fb5edb24910
  title: Horizon Cashback Card — referral and loyalty offer
  body: 'Share the rewards with your friends! We are pleased to offer a special referral
    bonus for our loyal customers. From October 1, 2024, to December 31, 2024, you
    will receive a $50 statement credit for every new customer you refer who is approved
    for a Horizon Cashback Card.


    The new customer will also benefit from our standard competitive features:


    * A cashback rate of 1.5% on all eligible purchases.

    * An annual fee of $0.

    * An APR for purchases of 21.99%.


    To qualify, the referred applicant must list your name and account number on their
    application. Credits will be applied to your account within 30 days of the new
    member''s first purchase.


    *Disclaimer: Offer valid for US residents only. Credits are non-transferable and
    subject to account standing. Terms and conditions apply.*'
  domain: cards
  product_category: horizon_cashback_card
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: e94a2eac-89db-57ac-a8ca-da97c6f4b1c9
  title: Horizon Cashback Card — account security best practices
  body: 'Protecting your finances is a partnership. Because the Horizon Cashback Card
    is designed for everyday spending, it is often a target for phishing and social
    engineering. We want to ensure you have the tools to keep your account secure.


    **What we will NEVER ask you for**

    We will never ask you to provide your full card number, CVV, or your online banking
    password via email, text, or an unsolicited phone call. If someone claiming to
    be from Northwind Bank asks for these details to ''verify'' your account or ''stop
    a fraudulent charge,'' hang up immediately.


    **Best Practices for Cardholders**

    * Enable real-time transaction alerts so you can spot unauthorized spending the
    moment it happens.

    * Use multi-factor authentication for all access to your account details.

    * Review your monthly statements carefully to ensure every charge is recognized.


    **What to do if you suspect fraud**

    If you notice a transaction you did not authorize, tell us immediately. We prioritize
    the rapid resolution of unauthorized transactions in strict accordance with Regulation
    E timelines. Our philosophy is to protect the consumer first while we conduct
    a thorough internal investigation.


    **Reporting Deadlines**

    To minimize your potential liability, report any lost or stolen cards or unauthorized
    transactions as soon as you discover them. Prompt reporting is essential for the
    full protection provided under our security policies.


    For more information on how we handle unauthorized activity, you may refer to
    Horizon Cashback Card — fraud and unauthorized-activity protection.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: aae3513e-17eb-5a37-b3ba-001166647091
  title: Horizon Cashback Card — change-of-terms policy
  body: 'This policy outlines how Northwind Bank manages changes to the terms and
    conditions governing your Horizon Cashback Card. We strive for transparency and
    will provide clear notice before any material changes take effect.


    **Right to Modify Terms**

    We reserve the right to change the terms of your account, including the purchase
    APR of 21.99% or the cashback rate of 1.5%, to reflect changes in market conditions,
    regulatory requirements, or institutional policy. While the current annual fee
    is $0, any future introduction of a fee will be subject to the notice periods
    described below.


    **Notice Period**

    In accordance with federal regulations, we will provide you with written notice
    at least 45 days prior to the effective date of any significant change that would
    result in an increase in your costs or a decrease in your benefits.


    **Customer Rights upon Change**

    If you do not agree to the modified terms, you have the right to close your account
    before the changes take effect. If the account is closed, any remaining balance
    must be paid in full according to the terms in place at the time of closure.


    **Effect of Continued Use**

    Your continued use of the Horizon Cashback Card after the effective date of a
    change constitutes your acceptance of the new terms.


    **Agreement Termination**

    Either Northwind Bank or the customer may terminate this agreement at any time.
    Upon termination, the card must be destroyed, and all outstanding balances must
    be settled. We will provide a final statement showing all accrued cashback and
    any remaining balance due.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: adf53376-0c3f-50a4-b0d5-55a845ae4a94
  title: Horizon Cashback Card — getting started walkthrough
  body: 'This guide is for support agents assisting customers with the initial setup
    and onboarding process for the Horizon Cashback Card. Our goal is to ensure the
    customer understands the product''s value and can begin spending immediately.


    **Product Core Value**

    The Horizon Cashback Card is an accessible, no-annual-fee credit option for simple,
    everyday rewards. It is designed for customers who want a straightforward way
    to earn on every purchase without managing complex reward categories.


    **Key Financial Terms to Confirm**

    Ensure the customer is aware of the following exactly:

    * Annual Fee: $0

    * Cashback Rate: 1.5% on eligible purchases

    * Purchase APR: 21.99%


    **The Onboarding Process**

    1. **Application & Approval**: Once the customer has been approved based on their
    financial profile, we will issue the account.

    2. **Card Delivery**: The physical card is sent via secure mail. The customer
    should receive it within 7-10 business days.

    3. **Activation**: Upon receipt, the customer must activate the card. Ensure they
    know that multi-factor authentication is mandatory before any state-changing action,
    including activation.

    4. **Setting Up Digital Access**: Help the customer link the card to their Northwind
    Bank digital profile to track their 1.5% cashback earnings in real-time.

    5. **Payment Setup**: Encourage the customer to set up autopay to avoid the 21.99%
    purchase APR.


    **Agent Tips**

    * If the customer is also looking for a place to store their cashback rewards,
    suggest they look at Northwind High-Yield Savings — overview.

    * Remind the customer that all retail deposits at Northwind Bank are FDIC-insured,
    though credit card balances are obligations of the customer.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 03f5853b-7dbf-5947-a315-e89e4a2b256b
  title: Horizon Cashback Card — cashback rate explained
  body: '**How does the cashback rate work?**

    The Horizon Cashback Card offers a flat cashback rate of 1.5% on all eligible
    purchases. This means for every $100 you spend, you earn $1.50 back. There are
    no complex categories to track; you earn the same rate regardless of where you
    shop.


    **When is the cashback credited to my account?**

    Cashback is calculated daily and credited to your rewards balance at the end of
    each billing cycle. You can choose to apply this balance as a statement credit
    to reduce your own balance or transfer it to a Northwind Bank deposit account.


    **Are there any fees to earn or redeem cashback?**

    No. There is an annual fee of $0 for this card, and we do not charge fees for
    redeeming your earned rewards.


    For more details on costs, see Horizon Cashback Card — fee schedule.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 3f64b267-df7d-5c68-bc54-0f83b2f2120d
  title: Horizon Cashback Card — make a change or update
  body: 'If you need to update your personal information or modify how your Horizon
    Cashback Card is managed, follow these steps. We require rigorous identity verification
    before any changes are made to your account.


    **What you will need**

    * Your full legal name

    * Your account number or the last four digits of your card

    * A valid form of government-issued identification


    **Steps to Update Your Account**

    1. **Request the Change**: Tell us which specific detail you need to update (e.g.,
    your residential address, phone number, or email).

    2. **Identity Validation**: We will perform a mandatory identity verification
    check. This may include multi-factor authentication sent to your registered device.
    You must successfully complete this validation before we can proceed.

    3. **Provide New Information**: Give us the updated details. If you are changing
    a legal name, we will ask you to provide a digital copy of the supporting legal
    documentation.

    4. **Review and Confirm**: We will read back the changes to you to ensure accuracy.

    5. **Receive Confirmation**: Once we save the changes, we will provide a confirmation
    number and send a notification to your verified email address.


    **Updating Credit Limits**

    If you wish to request a credit limit increase, let us know. We will review your
    stated goals and financial profile to determine suitability. You will receive
    a decision regarding the limit change within 3-5 business days via secure message.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 8562dac1-aa08-519f-84b7-f4dbb87c2d78
  title: Horizon Cashback Card — access or login problems
  body: '**Symptom**: You are unable to log into your account to view your Horizon
    Cashback Card balance or rewards, or you are receiving an ''Authentication Failed''
    error.


    **Likely Causes**

    * Incorrect login credentials (username or password).

    * An expired or out-of-sync multi-factor authentication (MFA) token.

    * The account has been temporarily locked due to too many incorrect password attempts.


    **What to Check and Fix**

    1. **Verify Credentials**: Ensure that your Caps Lock is off and that you are
    using the correct username. If you have forgotten your password, tell us, and
    we will start the secure reset process.

    2. **Check MFA Device**: Ensure the mobile device registered for your account
    has a stable connection to receive the verification code. If you have a new phone
    number, we must update your profile first.

    3. **Account Status**: Ask us to check if your account is currently locked. If
    it is, we will verify your identity using our mandatory security protocols and
    unlock it for you.


    **When we will escalate the issue**

    If the login problem persists after a password reset and identity verification,
    we will raise a technical case with our digital banking specialized domain leads.
    You will receive an update on the status of your access within 24 business hours.


    For issues related to unexpected charges on your account rather than login access,
    please refer to Horizon Cashback Card — an unexpected charge or amount.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
