- id: d9e22627-fbfd-54fd-adf3-e501b00dd579
  title: Northwind High-Yield Savings — risk disclosures
  body: 'This disclosure provides important regulatory and risk information regarding
    the Northwind High-Yield Savings account.


    Interest Rate Risk: The APY of 4.25% is a variable rate. This means the interest
    rate may change at any time at the sole discretion of Northwind Bank based on
    market conditions and Federal Reserve guidelines. Future rates may be higher or
    lower than the current 4.25%.


    Liquidity and Access: This account is designed for savings, not for daily transactional
    use. While your funds are liquid, they are subject to a monthly withdrawal limit
    of 6. Exceeding this limit will result in an excess withdrawal fee of $10 per
    additional transaction. Customers seeking unlimited daily liquidity should consider
    the product described in Everyday Checking — overview.


    Insurance: All retail deposits in the Northwind High-Yield Savings account are
    FDIC-insured up to the maximum allowed by law. This protects your principal and
    accrued interest in the event of bank failure.


    Regulatory Compliance: Northwind Bank adheres to all CFPB and Federal Reserve
    guidelines. This account is governed by Regulation E regarding electronic fund
    transfers. Any unauthorized transactions reported to us will be handled in accordance
    with the timelines and protections mandated by Regulation E.


    Opening Requirements: A minimum opening deposit of $100 is required to establish
    the account. Funds deposited below this threshold will not result in an active
    account.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: disclosure
  source_authority: official
