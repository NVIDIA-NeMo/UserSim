- id: fa5123c4-85b2-5e36-9985-929e6e5501f2
  title: Northwind High-Yield Savings — how rates are tiered and applied
  body: 'The Northwind High-Yield Savings account uses a flat-rate structure to ensure
    transparency and simplicity for our retail savers.


    * Current APY: 4.25%


    This single rate of 4.25% applies to all account balances, regardless of the amount
    deposited. There are no tiered brackets or minimum balance requirements to earn
    this yield once the account is open with the minimum opening deposit of $100.


    Interest is calculated daily and credited to the account monthly. The APY (Annual
    Percentage Yield) reflects the real rate of return earned on your deposit, including
    the effect of compounding interest. Because this is a variable rate, it may be
    adjusted periodically to stay competitive with market trends. We will notify you
    of any significant changes to the rate according to our standard disclosure policies.'
  domain: retail_banking
