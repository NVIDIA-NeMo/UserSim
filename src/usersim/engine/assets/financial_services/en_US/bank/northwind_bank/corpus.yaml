- id: a6b8d326-c317-5b2c-bfa7-5c5ec3159d6a
  title: Horizon Cashback Card — vs. a typical competitor offering
  body: 'When comparing the Horizon Cashback Card to typical competitor cashback cards,
    the primary differences lie in transparency and cost structure.


    Horizon Cashback Card:

    * Annual Fee: $0

    * Rewards: Flat 1.5% cashback on all eligible spending.

    * Value: No complex tiers or rotating categories to track.


    Typical Competitor Card:

    * Annual Fee: Often ranges from $0 to $95, sometimes requiring a high spend to
    waive.

    * Rewards: May offer 2% or 3% in specific categories (e.g., dining), but only
    1% on all other spending.

    * Value: Higher potential rewards for specific habits, but lower average returns
    for general spending.


    Who each suits:

    * Choose the Horizon Cashback Card if you want a ''set it and forget it'' experience
    with a guaranteed $0 annual fee and a consistent 1.5% return on every dollar spent.

    * Choose a competitor offering if you spend heavily in one specific category and
    are willing to manage multiple cards or pay an annual fee to maximize those specific
    percentages.'
