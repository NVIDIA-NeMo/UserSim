- id: 99c51179-5fe4-5234-9817-fa91a396207b
  title: Summit Travel Card — cancel, close, or downgrade
  body: 'If you no longer need your Summit Travel Card or wish to move to a different
    product, follow these steps:


    1. Verify your balance: Check your current statement to see if you have an outstanding
    balance. All charges, including the 23.49% purchase APR interest if applicable,
    must be paid in full before the account is closed.


    2. Request the change: Tell us whether you want to close the account entirely
    or downgrade to a different card, such as the Horizon Cashback Card.


    3. Confirm reward status: Ask us about any remaining travel rewards earned at
    the 3% rate. We will confirm if these rewards will be transferred, paid out, or
    forfeited upon closure.


    4. Finalize the request: We will verify your identity using multi-factor authentication.
    Once verified, we will process the closure or downgrade.


    5. Receive confirmation: You will receive a final confirmation message stating
    that the account is closed or that your new card product is active. You should
    then destroy your physical Summit Travel Card.'
  domain: cards
