- id: bbb06522-bf7a-5dea-8282-80410563f982
  title: Northwind High-Yield Savings — account security best practices
  body: 'Protecting your hard-earned savings is our top priority. Because the Northwind
    High-Yield Savings account is designed for growth and stability, it is a target
    for phishing attempts. We want to ensure you have the tools to keep your funds
    secure.


    **Common Fraud Patterns**

    Fraudsters may send emails or texts claiming there is a problem with your APY
    of 4.25% or a ''security breach'' that requires you to verify your identity by
    clicking a link. They may also pose as Northwind Bank employees asking for your
    password or multi-factor authentication (MFA) codes to ''unlock'' a transfer.


    **What We Will Never Ask For**

    To be clear, we will never ask you to provide the following via email, text, or
    an unsolicited phone call:

    * Your full account password or PIN.

    * Your one-time MFA verification codes.

    * Your full Social Security number in an unsecured message.

    * A transfer of funds to a ''safe account'' to protect your balance.


    **Immediate Actions for Suspicious Activity**

    If you notice an unauthorized transaction or receive a suspicious request, tell
    us immediately. We prioritize the rapid resolution of unauthorized transactions
    in strict accordance with Regulation E timelines. The sooner you report a discrepancy,
    the faster we can secure your account and begin our internal investigation.


    **Best Practices for Savings Security**

    * **Enable Strong MFA:** Always use multi-factor authentication for every login.
    This is our mandatory standard for any state-changing action.

    * **Monitor Your Statements:** Regularly review your transaction history to ensure
    your monthly withdrawal limit of 6 is not being exceeded by unauthorized parties.

    * **Secure Your Devices:** Ensure the device you use to access your savings is
    updated with the latest security patches.


    Remember, we protect the consumer first. If something feels wrong, notify us immediately
    so we can take action to safeguard your deposits.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 72cd6744-808c-50a5-9378-2b2f6f309626
  title: Northwind High-Yield Savings — change-of-terms policy
  body: "This document outlines how Northwind Bank manages changes to the terms governing\
    \ your Northwind High-Yield Savings account. By maintaining an account with us,\
    \ you agree to these policies regarding modifications to rates, fees, and limits.\n\
    \n**Interest Rate Adjustments**\nThe current APY of 4.25% is a variable rate.\
    \ We reserve the right to change this rate at any time based on market conditions\
    \ and Federal Reserve guidelines. Rate changes are effective immediately upon\
    \ update and will be reflected in your next statement. We do not provide advance\
    \ notice for changes to the APY.\n\n**Fee and Limit Modifications**\nWe strive\
    \ to maintain a low-friction pricing model. However, we may modify our fee schedule\
    \ or account limits, such as the monthly withdrawal limit of 6 or the excess withdrawal\
    \ fee of $10. \n\n* **Notice Period:** For any change that increases a fee or\
    \ decreases a limit, we will provide you with at least 30 days' written notice\
    \ before the change takes effect.\n* **Acceptance:** Continued use of the account\
    \ after the effective date of a change constitutes your acceptance of the new\
    \ terms.\n* **Right to Close:** If you do not agree to a change in terms, you\
    \ have the right to close your account without penalty, provided all outstanding\
    \ obligations are met.\n\n**Account Obligations**\nTo keep your account in good\
    \ standing, you must maintain the minimum opening deposit of $100 at the time\
    \ of account creation. Failure to adhere to account guidelines may result in the\
    \ account being flagged for review.\n\n**Termination of Agreement**\nNorthwind\
    \ Bank may close your account at any time for cause, including suspected fraud\
    \ or repeated misuse of the account. We will provide notice of closure in accordance\
    \ with federal law and return all remaining funds, including accrued interest,\
    \ to you."
  domain: retail_banking
  product_category: high_yield_savings
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d3f7b1b5-e6a2-5535-8711-6f0b70ac2f91
  title: Northwind High-Yield Savings — getting started walkthrough
  body: "This guide is intended for support agents assisting customers with the onboarding\
    \ process for the Northwind High-Yield Savings account. Our goal is to provide\
    \ a streamlined, digital-first experience for retail savers.\n\n**Product Overview**\n\
    The Northwind High-Yield Savings account is a high-growth liquid account designed\
    \ for emergency funds and short-term goals. It offers a competitive APY of 4.25%\
    \ to ensure customers' money works harder for them.\n\n**Step-by-Step Onboarding\
    \ Walkthrough**\n1. **Identity Verification:** Before any account is opened, the\
    \ customer must undergo rigorous identity verification. This includes providing\
    \ government-issued identification and completing our mandatory multi-factor authentication\
    \ (MFA) process.\n2. **Initial Funding:** The customer must make a minimum opening\
    \ deposit of $100. This can be completed via a transfer from another Northwind\
    \ account or an external bank link.\n3. **Account Activation:** Once the deposit\
    \ is confirmed and identity is validated, we activate the account. The customer\
    \ will then have full access to their balance and the 4.25% APY.\n4. **Setting\
    \ Expectations:** Inform the customer about the account's liquidity limits to\
    \ avoid unexpected fees:\n    * They are allowed a monthly withdrawal limit of\
    \ 6.\n    * Any withdrawal exceeding this limit will incur an excess withdrawal\
    \ fee of $10 per transaction.\n\n**Key Product Data for Agents**\n* **Product\
    \ ID:** high_yield_savings\n* **Minimum to Open:** $100\n* **Current Yield:**\
    \ 4.25% APY\n* **Withdrawal Cap:** 6 per month\n* **Over-limit Fee:** $10\n\n\
    **Support Escalation**\nIf a customer encounters issues with identity verification\
    \ or funding, escalate the case to the retail banking domain lead. All deposits\
    \ are FDIC-insured, and we adhere strictly to CFPB and Federal Reserve guidelines\
    \ to ensure fair treatment."
  domain: retail_banking
  product_category: high_yield_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 2ba64b88-c5c4-57ab-a5b7-457cb6068e3c
  title: Northwind High-Yield Savings — monthly withdrawal limit explained
  body: '**What is the monthly withdrawal limit for my savings account?**

    To encourage long-term saving and growth, the Northwind High-Yield Savings account
    has a monthly withdrawal limit of 6. This means you can move money out of the
    account up to 6 times per calendar month without incurring a penalty.


    **What happens if I go over the limit?**

    If you exceed the limit of 6 withdrawals in a single month, we will apply an excess
    withdrawal fee of $10 for each additional transaction. This fee is designed to
    discourage account misuse rather than generate revenue.


    **Does the minimum opening deposit count toward my limit?**

    No. The minimum opening deposit of $100 is required to start the account and does
    not count as a withdrawal. Only funds leaving the account are counted against
    the monthly limit.


    For more details on how these charges are applied, please refer to Northwind High-Yield
    Savings — fee schedule.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: fe3729af-c0af-5a02-83e5-390055ae22c6
  title: Northwind High-Yield Savings — make a change or update
  body: 'Updating your account details is a straightforward process. Whether you have
    moved, changed your phone number, or need to update your beneficiaries, we are
    here to help you maintain accurate records.


    **Before You Begin**

    To protect your funds and PII, we require successful identity validation before
    any state-changing action. Please have your government-issued ID and your mobile
    device ready for multi-factor authentication.


    **Steps to Update Your Account Information**

    1. **Request the Change:** Tell us exactly which piece of information you need
    to update (e.g., ''I need to update my home address'' or ''I want to change my
    primary phone number'').

    2. **Identity Verification:** We will send a verification code to your registered
    device or ask you to confirm specific identity details. You provide the code or
    confirmation to us.

    3. **Provide New Details:** Once your identity is validated, give us the new information.
    For address changes, please provide the full street, city, state, and zip code.

    4. **Review and Confirm:** We will read the updated information back to you to
    ensure accuracy. You confirm that the details are correct.

    5. **Confirmation of Success:** We will provide a confirmation number or a confirmation
    message stating that the change has been applied to your Northwind High-Yield
    Savings account.


    **Updating Beneficiaries**

    If you wish to update who inherits the funds in your account, the process is the
    same. Tell us the name and relationship of the new beneficiary, and we will update
    your records after the identity verification step is complete.


    **Verification Note**

    No modifications are permitted without successful identity validation. This is
    a mandatory security measure to ensure that only the account holder can change
    sensitive account data.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 16d4d47a-e1ed-5820-9202-0fcaa86d2554
  title: Northwind High-Yield Savings — access or login problems
  body: 'If you are unable to access your Northwind High-Yield Savings account, please
    follow these steps to identify and resolve the issue.


    **Symptom: ''Invalid Credentials'' or ''Login Failed''**

    * **Likely Cause:** Incorrect username or password, or an expired password.

    * **What to check:** Ensure your Caps Lock is off and that you are using the most
    recent password you created.

    * **The Fix:** Request a password reset. We will send a secure reset link to your
    registered email. Follow the link and create a new password.


    **Symptom: ''MFA Code Not Received''**

    * **Likely Cause:** Network delays, incorrect phone number on file, or blocked
    short-code SMS.

    * **What to check:** Check your signal strength and ensure your phone is not in
    ''Do Not Disturb'' mode. Verify that you are checking the device associated with
    your account.

    * **The Fix:** Ask us to resend the code. If you still do not receive it, we will
    initiate a manual identity verification process using your government ID to restore
    access.


    **Symptom: ''Account Locked''**

    * **Likely Cause:** Too many unsuccessful login attempts or a security flag triggered
    by an unrecognized device.

    * **What to check:** Recall if you recently attempted to log in from a new location
    or a different browser.

    * **The Fix:** We will perform a rigorous identity verification. Once you have
    successfully validated your identity via our MFA and PII protocols, we will unlock
    your account immediately.


    **When We Escalate**

    If we cannot verify your identity through standard means, or if we suspect your
    account has been compromised, we will escalate the issue to our specialized domain
    leads in retail banking. You will receive a notification via your registered email
    or phone once the investigation is complete and a resolution—such as a provisional
    credit or a mandatory account reset—is applied.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 6ecf760c-c7c1-5857-9ad9-485e9ff42c9c
  title: Northwind High-Yield Savings — qualification tiers
  body: 'The Northwind High-Yield Savings account is a single-tier product designed
    for accessibility and high returns. Use the following matrix to determine customer
    eligibility during the onboarding process.


    | Requirement | Threshold / Condition | Outcome |

    | :--- | :--- | :--- |

    | Minimum Opening Deposit | $100 | Eligible to open account |

    | Minimum Opening Deposit | Below $100 | Ineligible; must meet $100 minimum |

    | Identity Verification | Successful MFA & ID Validation | Eligible for account
    access |

    | Identity Verification | Failed Validation | Ineligible until identity is confirmed
    |

    | Account Type | Retail Saver / Everyday Spender | Qualified for product positioning
    |


    All eligible accounts receive the same flat APY of 4.25% and are subject to the
    monthly withdrawal limit of 6, with an excess withdrawal fee of $10 per transaction
    over that limit.'
