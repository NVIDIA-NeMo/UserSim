- id: 132587a7-329a-5560-82d6-98ff4aaf6b17
  title: Northwind High-Yield Savings — fraud and unauthorized-activity protection
  body: 'At Northwind Bank, we believe in protecting our customers first. Because
    the Northwind High-Yield Savings account is designed for larger balances and emergency
    funds, it can be a target for specific fraud patterns, such as phishing attempts
    where scammers pretend to be bank officials to ''verify'' your account details
    or request a transfer to a ''secure'' external account.


    To keep your funds safe, please remember that we will never ask you for your password,
    your multi-factor authentication codes, or your full social security number via
    email or text message. We will never pressure you to move your money quickly to
    avoid a penalty or account freeze.


    If you notice any transaction you did not authorize, tell us immediately. We prioritize
    the rapid resolution of unauthorized transactions in strict accordance with Regulation
    E timelines. To limit your potential liability and ensure the fastest recovery
    of your funds, you should report any suspicious activity as soon as you discover
    it. Once you report a problem, we will conduct a thorough internal investigation
    while working to protect your balance.


    All retail deposits in your Northwind High-Yield Savings account are FDIC-insured,
    providing a foundational layer of security for your principal. For more information
    on how we handle these disputes, you may refer to Northwind High-Yield Savings
    — regulatory disclosures.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: c1055f7d-213b-5ca4-b820-c6f28dc611f2
  title: Northwind High-Yield Savings — account agreement
  body: "This account agreement governs the relationship between Northwind Bank and\
    \ the account holder for the Northwind High-Yield Savings account. \n\n1. Account\
    \ Establishment: To open this account, the customer must provide a minimum opening\
    \ deposit of $100. This initial funding is required to activate the account and\
    \ begin earning interest.\n\n2. Interest Accrual: The account earns a real rate\
    \ of return based on the current APY of 4.25%. This rate is variable and may be\
    \ adjusted by the bank based on market conditions. Interest is compounded and\
    \ credited to the account according to our standard retail banking schedule.\n\
    \n3. Withdrawal Limits and Fees: To maintain the nature of this savings vehicle,\
    \ we limit the number of withdrawals. Customers are permitted a monthly withdrawal\
    \ limit of 6 transactions. If a customer exceeds this limit within a single monthly\
    \ statement cycle, an excess withdrawal fee of $10 will be applied to each transaction\
    \ beyond the 6th withdrawal.\n\n4. Obligations: Northwind Bank agrees to maintain\
    \ the funds in an FDIC-insured account and provide transparent reporting of all\
    \ transactions. The customer agrees to provide accurate identity verification\
    \ for all state-changing actions.\n\n5. Termination: Either party may close the\
    \ account at any time. Upon closure, all remaining funds, including accrued interest,\
    \ will be disbursed to the customer. The bank reserves the right to close accounts\
    \ that show patterns of misuse or failure to adhere to security protocols.\n\n\
    6. Amendments: We may change these terms, including fees or interest rates, by\
    \ providing notice to the customer as required by law."
