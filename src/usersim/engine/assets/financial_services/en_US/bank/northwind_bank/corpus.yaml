- id: 8592566f-089b-5b1c-a7d6-5ec8442d51ff
  title: Horizon Cashback Card — cancel, close, or downgrade
  body: 'If you have decided that the Horizon Cashback Card no longer fits your financial
    goals, we provide a straightforward process to close or change your account.


    Before you begin:

    * Ensure your current balance is $0 to avoid delays in closing the account.

    * Decide if you wish to redeem your accumulated 1.5% cashback rewards, as these
    may be lost upon closure.


    Steps to close or downgrade your account:

    1. Tell us whether you would like to close the account entirely or downgrade to
    a different card product.

    2. Confirm your identity through our mandatory multi-factor authentication process.

    3. Provide the reason for your request (this helps us improve our services).

    4. We will verify that all pending transactions have cleared and the balance is
    settled.

    5. We will confirm the account status change and provide a final confirmation
    statement.


    You will know the process is complete when you receive a confirmation notice (via
    your preferred communication method) stating that the account is closed or the
    product has been switched.


    If you are comparing this process against other banks, please note that we do
    not charge a fee for closing your account, as our annual fee is $0. For more details
    on the risks of closing a credit line, see the Horizon Cashback Card — risk disclosures.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: c2f5c979-d608-5454-a84b-c7aa5879990b
  title: Horizon Cashback Card — an unexpected charge or amount
  body: 'It can be concerning to see a charge on your Horizon Cashback Card that you
    don''t recognize or an amount that seems incorrect. We are here to help you resolve
    this quickly.


    Common Symptoms:

    * A transaction appears for an amount higher than the receipt.

    * A charge from a merchant you do not recognize appears on your statement.

    * A duplicate charge appears for a single purchase.


    What to check first:

    1. Merchant Names: Check if the merchant uses a different ''doing business as''
    (DBA) name than the one on the storefront.

    2. Pending Status: Verify if the charge is ''Pending.'' Some merchants (like hotels
    or gas stations) place a temporary hold that is larger than the final charge.

    3. Rewards: Ensure you aren''t misidentifying a rewards adjustment or a credit
    as a charge.


    How we fix it:

    If the charge is still incorrect after these checks, tell us about the specific
    transaction. We will then:

    * Review the transaction details and merchant data.

    * If the charge is unauthorized, we will initiate a dispute in accordance with
    Regulation E timelines to protect you first.

    * We will apply a provisional credit to your account while we conduct a thorough
    internal investigation.


    When we escalate:

    If the issue involves a complex merchant dispute or a suspected systemic fraud
    pattern, we will route your case to our specialized domain leads in credit cards.
    You will receive regular updates on the status of the investigation via secure
    chat or email.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: troubleshooting
  source_authority: official
