- id: 63308113-e5f7-53a5-b7ab-edbd1b569104
  title: Horizon Cashback Card — who it is best for and common use cases
  body: 'The Horizon Cashback Card is an accessible, no-annual-fee credit option for
    simple, everyday rewards. It is designed for those who want a straightforward
    way to earn money back on their spending without managing complex category bonuses
    or paying a yearly membership fee.


    This card is best for:

    * The Simplified Spender: If you prefer one flat rate rather than tracking which
    card to use at the grocery store versus the gas station, this card''s 1.5% cashback
    rate is ideal.

    * The Cost-Conscious Consumer: With an annual fee of $0, this card is a great
    fit for those who want the benefits of a credit line without a guaranteed yearly
    cost.

    * The Everyday User: It serves as a reliable tool for daily liquidity and spending.


    Common Use Cases:

    * Daily Errands: Use it for everything from coffee to hardware store runs to earn
    a consistent 1.5% back.

    * Budgeting: Pair it with our Everyday Checking — overview account to manage your
    daily spending and payments in one place.

    * Emergency Buffer: While we recommend a high-growth account for savings, this
    card provides a secure line of credit for unexpected costs.


    Key Product Details:

    * Annual Fee: $0

    * Cashback Rate: 1.5%

    * Purchase APR: 21.99%


    Disclaimer: The purchase APR may vary based on creditworthiness. Credit cards
    are subject to credit approval. Please refer to the Horizon Cashback Card — regulatory
    disclosures for full legal terms.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 7b783c38-be90-596e-83c0-ecc81727e2f1
  title: Horizon Cashback Card — annual fee explained
  body: 'Q: Is there a yearly cost to keep my Horizon Cashback Card active?


    A: No. The Horizon Cashback Card has an annual fee of $0. We believe in transparent,
    low-friction banking, so you can enjoy your cashback rewards without worrying
    about a yearly membership charge.


    Q: Do I need to meet a minimum spending requirement to avoid a fee?


    A: No. Unlike some products that waive fees based on balance or spending, the
    annual fee for this card is $0 regardless of how much you spend or how often you
    use the card.


    Q: Where can I see all the other possible charges for this card?


    A: While there is no annual fee, other charges (such as for late payments) may
    apply. You can find the complete list in the Horizon Cashback Card — fee schedule.'
