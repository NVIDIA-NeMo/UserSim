  institution_id: northwind_bank
- id: f2d010f2-2e7d-5193-adaa-f0cdc98a4dda
  title: Northwind High-Yield Savings — resolve a common request end-to-end
  body: 'One of the most common requests is moving funds from a Northwind High-Yield
    Savings account into an Everyday Checking account to cover upcoming expenses.
    Here is how to complete that process.


    **What you need before starting:**

    *   An active Northwind High-Yield Savings account.

    *   An active Everyday Checking account.

    *   The exact amount you wish to transfer.


    **Steps to transfer your funds:**

    1.  **Initiate the request:** Tell us that you want to move a specific amount
    of money from your Northwind High-Yield Savings account to your Everyday Checking
    account.

    2.  **Verify your identity:** We will perform a mandatory identity verification.
    This may include multi-factor authentication to ensure the request is authorized
    by the account holder.

    3.  **Confirm the withdrawal limit:** We will check your current monthly withdrawal
    count. We will notify you if this transfer is within your limit of 6 monthly withdrawals
    or if it will trigger an excess withdrawal fee of $10.

    4.  **Authorize the amount:** Confirm the final amount to be moved. We will verify
    that you have sufficient funds in your savings account to cover the transfer.

    5.  **Execute the transfer:** We will move the funds between your accounts. You
    will receive a confirmation message stating that the transfer is complete.

    6.  **Verify the update:** Ask us for the new balances of both accounts to ensure
    the money has arrived in your checking account and been deducted from your savings.


    If you are moving a very large sum and are concerned about the withdrawal limits,
    you can ask us about alternative methods for account closure or large-scale transfers.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 75a5e13a-cac5-5e79-b385-4f0ab7c947fd
  title: Northwind High-Yield Savings — a discrepancy in your records or statement
  body: '**Symptom:** A customer reports that the interest credited to their account
    does not match their calculations, or they see a fee they believe was charged
    in error.


    **Likely Causes:**

    *   **Calculation Misunderstanding:** The customer may not be accounting for how
    the 4.25% APY (Annual Percentage Yield) is compounded and credited.

    *   **Withdrawal Limit Overlap:** The customer may have miscounted their withdrawals
    and actually exceeded the limit of 6, triggering the $10 excess withdrawal fee.

    *   **Processing Delay:** A recent deposit may not have been credited yet, affecting
    the interest calculation for that period.


    **What to check and how to fix it:**

    1.  **Review the Transaction Log:** We will provide the customer with a full list
    of all withdrawals for the current monthly cycle. We will count them together
    to determine if the $10 fee was applied correctly based on the limit of 6.

    2.  **Explain the APY:** If the discrepancy is regarding interest, we will explain
    that the 4.25% APY includes the effect of compounding. We will show the customer
    the daily balance used to calculate the interest.

    3.  **Verify Deposit Dates:** Check for any ''pending'' deposits. We will inform
    the customer of the exact date a deposit became available and began earning interest.


    **When we escalate:**

    If the transaction log shows a clear error—such as a fee charged when only 3 withdrawals
    were made—we will escalate the issue to our retail banking domain leads. We will
    then conduct a thorough internal investigation. If an error is found, we will
    apply a corrective credit to the account and notify the customer once the balance
    has been adjusted.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 69597203-7cea-5801-9fe5-f6e234363436
  title: Anchor 12-Month CD — overview
  body: 'Welcome to the Anchor 12-Month CD, a secure, fixed-rate vehicle designed
    for customers who want guaranteed returns over a one-year term. This account is
    ideal for those who have a specific savings goal or an emergency fund they wish
    to protect while earning a competitive yield.


    We provide a predictable growth path for your money, ensuring that your investment
    is safe and your earnings are locked in. All retail deposits at Northwind Bank
    are FDIC-insured, giving you peace of mind that your principal is protected.


    Key Product Details:

    * Annual Percentage Yield (APY): 4.5%

    * Term Length: 12 months

    * Minimum Deposit to Open: $1000

    * Early Withdrawal Penalty: A penalty equal to 90 days of interest if funds are
    withdrawn before the term ends.


    Our goal is to provide a streamlined, transparent experience. Whether you are
    saving for a future purchase or simply diversifying your portfolio, the Anchor
    12-Month CD offers the stability you need. Please note that while this account
    provides guaranteed returns, it is designed for funds you do not intend to access
    until the term is complete to avoid penalties.


    *Disclaimer: APY is accurate as of the current date and is subject to change for
    new accounts. FDIC insurance covers deposits up to the maximum allowable limit.*'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
