- id: d420a922-93b9-55d1-bc50-d395a874d259
  title: Northwind High-Yield Savings — who it is best for and common use cases
  body: 'The Northwind High-Yield Savings account is a high-growth liquid account
    designed specifically for retail savers who want their money to work harder without
    locking it away. It is an ideal choice for those building an emergency fund, saving
    for a short-term goal (like a vacation or a wedding), or holding a house down
    payment.


    This account is best for customers who prioritize a high return on their deposits
    but still need the ability to access their cash occasionally. Unlike a fixed-term
    vehicle, this account offers flexibility while providing a competitive yield.


    Key Product Details:

    * APY: 4.25%

    * Minimum opening deposit: $100

    * Monthly withdrawal limit: 6

    * Excess withdrawal fee: $10


    Common Use Cases:

    * Emergency Funds: Keep 3-6 months of expenses in a safe, insured place where
    they earn a significant return.

    * Goal-Based Saving: Set aside money for a specific purchase while benefiting
    from a 4.25% APY.

    * Cash Reserve: A stepping stone for funds that may be needed sooner than the
    one-year term required by our Anchor 12-Month CD.


    Disclaimer: APY is variable and may change. All deposits are FDIC-insured. This
    product is intended for retail savings and is not a replacement for a primary
    spending account; for daily liquidity, please see Everyday Checking — overview.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 449e09db-4f44-5848-a426-b89c43e0d14b
  title: Northwind High-Yield Savings — minimum opening deposit explained
  body: 'Q: Do I need a specific amount of money to open a Northwind High-Yield Savings
    account?


    A: Yes. To establish a new account, we require a minimum opening deposit of $100.
    This ensures the account is properly funded and active from day one.


    Q: Can I open the account with less than $100 and add to it later?


    A: No. The minimum opening deposit of $100 must be present at the time of account
    opening to satisfy our eligibility requirements. Once the account is open, you
    may continue to add funds to increase your balance and earn more interest at our
    4.25% APY.


    For more details on account costs and requirements, please refer to Northwind
    High-Yield Savings — fee schedule.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: faq
  source_authority: official
