  title: Horizon Cashback Card — qualification tiers
  body: 'The following matrix guides support agents in determining the likely approval
    outcome for a Horizon Cashback Card applicant based on their financial profile.
    We use a standard of suitability to recommend this product.


    | Financial Profile | Credit Standing | Outcome | Note |

    | :--- | :--- | :--- | :--- |

    | Retail Saver / Everyday Spender | Excellent | Approved | Full limit and 1.5%
    cashback rate apply. |

    | Retail Saver / Everyday Spender | Good | Approved | Standard limit; 1.5% cashback
    rate applies. |

    | Retail Saver / Everyday Spender | Fair | Conditional | May require a deposit
    or a lower initial limit. |

    | Any | Poor | Declined | Does not meet minimum suitability requirements. |


    All approved applicants receive the same core terms:

    * Annual Fee: $0

    * Purchase APR: 21.99%

    * Cashback Rate: 1.5%'
