- id: 7cf77cab-4e2b-55d6-9fe5-04619c8686b7
  title: Everyday Checking — regulatory disclosures
  body: 'Northwind Bank adheres to all CFPB, Federal Reserve, and FDIC guidelines
    to ensure fair treatment and data privacy for our customers.


    Deposit Insurance:

    All retail deposits in the Everyday Checking account are FDIC-insured up to the
    maximum legal limit. This ensures the safety of your funds in the event of institutional
    failure.


    Electronic Fund Transfers:

    Unauthorized electronic transactions are handled in strict accordance with Regulation
    E. We prioritize the rapid resolution of these errors and the protection of the
    consumer. Our internal investigations are thorough and conducted following the
    mandatory legal timelines.


    Fee Disclosures:

    We maintain a transparent fee structure. The current monthly maintenance fee is
    $0, which is waived when a minimum balance of $500 is maintained. An Overdraft
    Fee of $34 is applied to accounts that draw more money than they hold. Out-of-network
    ATM usage incurs a fee of $2.5.


    Privacy and Security:

    Multi-factor authentication and rigorous identity verification are mandatory for
    all state-changing actions or the disclosure of personally identifiable information
    (PII). No modifications to account settings or funds transfers are permitted without
    successful validation.


    Disclaimer: This account is not a tax-advantaged vehicle. Northwind Bank provides
    financial education but does not provide individualized tax, legal, or investment
    advice.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
