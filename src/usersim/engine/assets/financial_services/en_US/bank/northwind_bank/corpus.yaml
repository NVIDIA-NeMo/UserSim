- id: ae41beea-3f46-5813-8499-1e9793d1c286
  title: Summit Travel Card — set up and activate
  body: 'Activating your Summit Travel Card is a straightforward process. We ensure
    that your card is secure and ready for use before you head to the airport.


    **What you need before starting:**

    * Your physical Summit Travel Card.

    * Your government-issued photo ID.

    * Your account application reference number.


    **Steps to activate:**

    1. Provide us with your card number and the security code on the back of the card.

    2. Confirm your identity by providing your full name and the photo ID you used
    during your application.

    3. Tell us your preferred billing cycle date if you wish to customize it; otherwise,
    we will assign a standard date.

    4. We will then verify your identity through our mandatory multi-factor authentication
    process.

    5. Once verified, we will activate the card and confirm that you can now begin
    earning your 3% travel rewards.


    **How you know it worked:**

    We will provide a confirmation number for the activation. You will also see the
    card status change to ''Active'' in your account overview, and you may immediately
    use the card for purchases, including international transactions with our 0% foreign
    transaction fee.'
