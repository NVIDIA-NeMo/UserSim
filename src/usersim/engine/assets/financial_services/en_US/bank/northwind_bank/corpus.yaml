- id: 934972cc-f6c0-5c33-9945-a4fef587939c
  title: Everyday Checking — overview
  body: 'Welcome to Northwind Bank. We believe your daily banking should be simple
    and transparent. Our Everyday Checking account is the foundational, low-cost hub
    for your daily spending and liquidity, designed to keep your money moving without
    unnecessary costs.


    We focus on a low-friction pricing model. This means we design our fees to discourage
    account misuse rather than to generate revenue for the bank. For most of our customers,
    the cost of maintaining this account is zero.


    Account Details and Fees:

    * Monthly Maintenance Fee: $0

    * Minimum Balance to Waive Fee: $500

    * Overdraft Fee: $34

    * Out-of-Network ATM Fee: $2.5


    Whether you are depositing your paycheck or paying your monthly bills, we provide
    a streamlined digital-first experience to help you manage your finances with ease.
    All retail deposits at Northwind Bank are FDIC-insured, giving you peace of mind
    that your funds are secure.


    Disclaimer: All accounts are subject to identity verification. Fees are subject
    to change with prior notice. FDIC insurance covers deposits up to the maximum
    allowed by law.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: cab42899-dcdf-56f4-bbb5-39946c2e1cad
  title: Everyday Checking — monthly maintenance fee explained
  body: "Q: Is there a monthly fee for my Everyday Checking account?\nA: We strive\
    \ to keep your banking low-cost. The monthly maintenance fee for this account\
    \ is $0. \n\nQ: Do I need to maintain a specific balance to avoid fees?\nA: While\
    \ the monthly maintenance fee is $0, we maintain a minimum balance to waive fee\
    \ requirement of $500 to ensure your account remains in good standing and eligible\
    \ for all standard benefits. \n\nQ: What happens if my balance drops below that\
    \ amount?\nA: Our fee philosophy is to discourage account misuse. Since the maintenance\
    \ fee is currently $0, you will not see a monthly charge, but keeping a balance\
    \ of $500 or more is the recommended standard for this product. For more details\
    \ on all possible charges, please see Everyday Checking — fee schedule."
