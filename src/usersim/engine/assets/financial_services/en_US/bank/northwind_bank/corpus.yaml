- id: 3af8dc3a-1cba-5de3-8cf6-72c5254b6be5
  title: Everyday Checking — privacy and data handling
  body: 'At Northwind Bank, we adhere to strict CFPB, Federal Reserve, and FDIC guidelines
    to ensure the privacy of your personal information. This disclosure explains how
    we handle your data within your Everyday Checking account.


    **Data Collection and Usage**

    We collect information necessary to maintain your account, verify your identity,
    and comply with federal laws. This includes your name, address, Social Security
    number, and transaction history. We use this data to provide our streamlined digital-first
    banking experience and to ensure the suitability of any products we recommend
    based on your stated goals.


    **Security Protocols**

    To prevent unauthorized access to your PII (Personally Identifiable Information),
    we enforce rigorous identity verification. No state-changing action—such as changing
    an address or transferring large sums—can be performed without successful multi-factor
    authentication. This is a mandatory safeguard for all Everyday Checking customers.


    **Sharing of Information**

    We do not sell your personal data to third parties. We only share your information
    when required by law, for the purpose of processing transactions (such as with
    ATM networks where the $2.5 out-of-network fee may be triggered), or with regulatory
    bodies to ensure compliance with Regulation E and Regulation Z.


    **Your Rights**

    Under federal guidelines, you have the right to access your data and request corrections
    to your personal information. We provide a transparent process for these requests
    through our secure chat, email, and phone channels during Eastern Time (ET) business
    hours.


    For further regulatory details, please see Everyday Checking — regulatory disclosures.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 346801ea-c16b-5177-947e-c69571beb4fa
  title: Everyday Checking — recognizing scams targeting this product
  body: "At Northwind Bank, we want to help you keep your money safe. Because Everyday\
    \ Checking is designed for your daily spending, it is often a target for scammers\
    \ who try to gain quick access to your funds. \n\nCommon scams targeting this\
    \ account include:\n*   **Fake Overdraft Alerts:** You may receive a text or email\
    \ claiming your account is in an overdraft state and demanding immediate payment\
    \ via a gift card or wire transfer to 'fix' the balance. We will never ask you\
    \ to pay fees using gift cards.\n*   **Verification Scams:** Scammers may call\
    \ pretending to be our fraud department, claiming there is a suspicious transaction.\
    \ They will ask you to 'verify' your identity by reading back a multi-factor authentication\
    \ code sent to your phone. We will never ask you for these codes over the phone.\n\
    *   **Payment Request Fraud:** You might receive a request to move money from\
    \ your Everyday Checking account to a 'safe account' because of a security breach.\
    \ Northwind Bank will never ask you to move your money to another account for\
    \ security reasons.\n\n**What we will never ask for:**\nWe will never ask for\
    \ your full password, your PIN, or a one-time security code via email, text, or\
    \ phone call.\n\n**Immediate Action:**\nIf you notice a transaction you did not\
    \ authorize, or if you have shared your account details with someone you now suspect\
    \ is a scammer, tell us immediately. We prioritize the rapid resolution of unauthorized\
    \ transactions in strict accordance with Regulation E timelines to protect you.\
    \ The sooner you report the activity, the better we can protect your funds.\n\n\
    For more information on how we safeguard your account, please see Everyday Checking\
    \ — fraud and unauthorized-activity protection."
  domain: retail_banking
  product_category: everyday_checking
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: dfce82fe-87d5-560a-a602-71e472521e3b
  title: Everyday Checking — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational boundaries of the Everyday Checking account. This product serves as
    the foundational, low-cost hub for daily spending and liquidity.


    **Fee Structure and Waivers**

    *   **Monthly Maintenance Fee:** $0. There is no monthly charge for maintaining
    this account.

    *   **Fee Waiver Threshold:** While the maintenance fee is $0, we maintain a minimum
    balance to waive fee requirement of $500 for internal account tiering and eligibility
    markers.


    **Transaction Restrictions and Fees**

    *   **Overdrafts:** When a customer draws more money than the account holds, an
    overdraft occurs. Each such instance incurs an overdraft fee of $34.

    *   **ATM Usage:** Transactions performed at ATMs outside of the Northwind Bank
    network incur an atm out of network fee of $2.5 per transaction.


    **Edge Cases for Agents**

    *   **Low Balance Scenarios:** If a customer''s balance falls below the $500 minimum
    balance to waive fee threshold, they still pay a $0 monthly maintenance fee, but
    they may not qualify for certain premium retail banking promotions.

    *   **Frequent Overdrafts:** Customers incurring multiple $34 overdraft fees should
    be evaluated for a different product or a budgeting review, as our fee philosophy
    aims to discourage account misuse rather than generate revenue.

    *   **Out-of-Network ATM Volume:** Customers frequently paying the $2.5 atm out
    of network fee should be reminded of our digital-first banking tools to minimize
    these costs.


    All deposits in this account are FDIC-insured. For a full list of charges, refer
    to Everyday Checking — fee schedule.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: f22545e3-8406-52fc-9dd0-deb26594b855
  title: Everyday Checking — atm out of network fee explained
  body: '**What happens if I use an ATM that isn''t owned by Northwind Bank?**

    If you use an ATM outside of our network, we charge an atm out of network fee
    of $2.5 per transaction. Please note that the owner of the other ATM may also
    charge their own separate fee.


    **How can I avoid paying this fee?**

    To avoid the $2.5 charge, we recommend using Northwind Bank ATMs or utilizing
    our streamlined digital-first banking tools for your transfers and deposits.


    **Is this fee charged every time I withdraw money?**

    Yes, the $2.5 fee applies to every individual transaction made at an out-of-network
    ATM.


    For a complete list of all possible charges, please see Everyday Checking — fee
    schedule.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: faq
  source_authority: official
