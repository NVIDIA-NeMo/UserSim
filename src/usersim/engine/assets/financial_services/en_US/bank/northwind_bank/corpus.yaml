- id: e5ecc6fd-5e58-5eae-9a4a-d14a4fa1276c
  title: Horizon Cashback Card — set up and activate
  body: 'Getting started with your new rewards card is a simple process. Please follow
    these steps to activate your account and begin earning 1.5% cashback.


    **What you will need before starting:**

    *   Your new physical Horizon Cashback Card.

    *   A valid government-issued photo ID.

    *   Your account application reference number.


    **Activation Steps:**

    1.  Provide us with your card number and the 3-digit security code on the back
    of the card.

    2.  Confirm your identity by providing your full legal name and the last four
    digits of your Social Security number.

    3.  Verify your current residential address to ensure your billing information
    is accurate.

    4.  We will then perform a final identity validation. Once successful, we will
    confirm that your card is active and ready for use.

    5.  We will provide you with your total credit limit and your current purchase
    APR of 21.99%.


    **How you know it worked:**

    You will receive a confirmation message stating that your card status is now ''Active''.
    You can immediately begin using the card for purchases to earn your 1.5% cashback
    rewards.'
