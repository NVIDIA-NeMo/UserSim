- id: a3fa08c5-2faa-54c9-b850-4508e0deaed9
  title: Summit Travel Card — regulatory disclosures
  body: 'This document provides formal regulatory disclosures for the Summit Travel
    Card in accordance with Regulation Z and CFPB guidelines.


    **Interest and Fees**

    The Summit Travel Card carries a purchase APR of 23.49%. This rate is variable
    and may increase or decrease based on the Prime Rate. Interest is calculated daily
    and billed monthly on any remaining balance not paid in full by the end of the
    grace period.


    There is a mandatory annual fee of $95. This fee is charged once per year to the
    account holder to provide access to the premium travel rewards program.


    **International Transactions**

    We offer a foreign transaction fee of 0% for this product. This means Northwind
    Bank does not add a percentage-based surcharge to transactions processed in foreign
    currencies. The final cost of the purchase is determined by the exchange rate
    provided by the network (e.g., Visa or Mastercard).


    **Rewards Program**

    The travel rewards rate of 3% is applied to qualifying travel purchases. Qualifying
    categories are defined in the account agreement. Rewards are credited to the account
    following the close of the billing cycle.


    **Privacy and Security**

    In accordance with Federal Reserve and FDIC guidelines, we employ rigorous identity
    verification and multi-factor authentication for all state-changing actions. All
    retail deposits held at Northwind Bank are FDIC-insured. We prioritize transparency
    in all disclosures to ensure fair treatment of our consumers.'
  domain: cards
  product_category: summit_travel_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
