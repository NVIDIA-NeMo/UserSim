- id: 54ee1161-92cc-50ee-a657-f2b8a0591e15
  title: Northwind High-Yield Savings — set up and activate
  body: 'Setting up your Northwind High-Yield Savings account is a straightforward
    process. We have designed this experience to be digital-first and efficient.


    Before you begin, ensure you have a valid government-issued ID and your initial
    funding source ready.


    1. Tell us you would like to open a Northwind High-Yield Savings account. We will
    start by asking for your full legal name, address, and Social Security number
    for identity verification.

    2. Provide the required identification. We will perform a rigorous identity validation
    check to ensure the security of your account.

    3. Fund your account. You must provide a minimum opening deposit of $100. You
    can do this by transferring funds from an existing Northwind account or via an
    external bank transfer.

    4. Review the suitability match. We will confirm that this product meets your
    stated goals for liquidity and growth.

    5. Confirm your agreement. We will present the final terms and disclosures for
    your approval.


    Once these steps are complete, we will provide you with your new account number
    and a confirmation of your opening balance. Your account is now active and beginning
    to earn 4.25% APY immediately on your deposited funds.


    If you are comparing this to our other options, you may also wish to review the
    Everyday Checking — overview for your daily spending needs.'
