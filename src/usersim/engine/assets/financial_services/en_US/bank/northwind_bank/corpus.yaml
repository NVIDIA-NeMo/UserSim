- id: 41bd9b40-4f97-5b41-986d-0a37b9716f0c
  title: Anchor 12-Month CD — check status or history
  body: 'If you would like to review your current balance, see how much interest you
    have earned, or check your maturity date, follow these steps:


    **What you need before starting**

    * Your account number or the identity verification details we have on file for
    you.


    **Steps to check your status**

    1. Tell us that you would like to see the current status or transaction history
    of your Anchor 12-Month CD.

    2. We will perform a mandatory identity verification. You will be asked to provide
    your credentials or complete a multi-factor authentication (MFA) challenge.

    3. Once your identity is validated, we will provide your current account balance
    and the current APY of 4.5%.

    4. If you requested history, we will list the dates and amounts of any interest
    credits applied to the account.

    5. We will confirm the exact maturity date (12 months from the date of your original
    deposit).


    **How you know it worked**

    You will have a clear summary of your total balance, the total interest earned
    to date, and the date when your funds become available without penalty.'
  domain: retail_banking
