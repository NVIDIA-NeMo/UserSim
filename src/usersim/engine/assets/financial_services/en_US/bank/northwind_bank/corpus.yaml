- id: eb904a88-037e-5d34-a502-814e6f1313d0
  title: Northwind High-Yield Savings — a declined or blocked action
  body: '**Symptom:** You attempted to move money out of your Northwind High-Yield
    Savings account, but the transaction was declined or blocked.


    **Likely Causes:**

    *   **Insufficient Funds:** Your account balance is lower than the amount you
    are trying to withdraw.

    *   **Verification Failure:** The identity verification required for state-changing
    actions was not successfully completed.

    *   **Account Freeze:** The account has been temporarily blocked due to suspected
    unauthorized activity.


    **What to check and how to fix it:**

    1.  **Check your balance:** Ask us for your current available balance. If the
    balance is less than the amount you requested, you will need to transfer funds
    into the account or request a smaller amount.

    2.  **Re-verify your identity:** If the action was blocked during the verification
    stage, we will ask you to provide additional identification or complete a multi-factor
    authentication challenge. Once validated, we can re-attempt the transaction.

    3.  **Check for security holds:** Ask us if there is a security block on your
    account. If our system detected unusual activity, we may have paused transactions
    to protect your funds. We will work with you to verify the activity and lift the
    hold.


    **When we escalate:**

    If we cannot verify your identity through standard means or if the block is related
    to a complex fraud investigation, we will escalate the matter to our specialized
    domain leads in retail banking. You will receive a notification regarding the
    status of the investigation and a timeline for resolution, typically in accordance
    with Regulation E guidelines for unauthorized activity.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 274e7a41-3ed6-5fc8-920b-02d3936ecf2d
  title: Northwind High-Yield Savings — when to switch or upgrade
  body: 'This guide helps agents determine when a customer should move funds from
    a Northwind High-Yield Savings account to another product.


    **Switch to Everyday Checking if:**

    *   The customer is frequently exceeding the monthly withdrawal limit of 6 and
    paying the $10 excess withdrawal fee.

    *   The customer needs a hub for daily spending and liquidity rather than long-term
    growth.


    **Upgrade to Anchor 12-Month CD if:**

    *   The customer has a specific sum of money they do not need to access for a
    full year.

    *   The customer prefers a guaranteed, fixed rate of return over the variable
    APY of 4.25% offered by the savings account.


    **Stay with High-Yield Savings if:**

    *   The customer is building an emergency fund and needs the money to remain liquid
    (accessible).

    *   The customer wants a high growth rate (4.25% APY) without locking their money
    away for a fixed term.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: comparison
