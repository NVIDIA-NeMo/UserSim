- id: 3f043316-04ef-5003-9b50-2d9bb9d65f84
  title: Summit Travel Card — choosing between tiers or options
  body: 'Choosing the right card depends on your spending habits. Here is how the
    Summit Travel Card compares to our Horizon Cashback Card.


    **Summit Travel Card**

    * **Cost**: $95 annual fee.

    * **Best For**: Frequent travelers and those who spend heavily on flights and
    hotels.

    * **Key Advantage**: A 3% rewards rate on travel and a 0% foreign transaction
    fee.

    * **Trade-off**: Higher cost of entry due to the annual fee.


    **Horizon Cashback Card**

    * **Cost**: No annual fee.

    * **Best For**: Everyday spenders who want simple rewards without a yearly cost.

    * **Key Advantage**: Low-friction, no-annual-fee credit option.

    * **Trade-off**: Lacks the specialized high-rate rewards for travel categories.


    **Which one should you choose?**

    If your annual travel spending is high enough that the 3% rewards offset the $95
    annual fee, the Summit Travel Card is the superior choice. However, if you prefer
    a card for basic daily use and want to avoid all annual fees, the Horizon Cashback
    Card is the better fit.'
  domain: cards
  product_category: summit_travel_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 05d34af3-2279-5cbb-9ed9-1764325955d7
  title: Summit Travel Card — privacy and data handling
  body: 'At Northwind Bank, we are committed to the highest standards of data privacy
    and fair treatment. This disclosure explains how we handle your information in
    relation to your Summit Travel Card account.


    **Data Collection and Usage**

    We collect personal and financial information to manage your credit account, calculate
    your 3% travel rewards, and ensure the security of your transactions. We strictly
    adhere to CFPB, Federal Reserve, and FDIC guidelines to ensure your data is handled
    with integrity.


    **Security and Verification Standards**

    To prevent unauthorized access to your PII (Personally Identifiable Information),
    we enforce rigorous security protocols. Multi-factor authentication and identity
    verification are mandatory before we perform any state-changing action on your
    account or disclose sensitive account details. No modifications to your account
    are permitted without successful identity validation.


    **International Data Handling**

    Because the Summit Travel Card features a 0% foreign transaction fee and is designed
    for global use, your transaction data may be processed through international payment
    networks. We ensure that all such transfers comply with our strict privacy policies
    and applicable regulatory frameworks.


    **Your Privacy Rights**

    You have the right to request a summary of the data we hold about you and to opt
    out of certain types of data sharing. We prioritize transparency in all our disclosures
    and will never sell your personal data to third-party marketers.


    **Regulatory Compliance**

    We prioritize transparency in all Regulation Z and Regulation E disclosures. All
    retail deposits held at Northwind Bank are FDIC-insured, providing you with peace
    of mind regarding your liquidity while you use your credit line for travel.'
  domain: cards
  product_category: summit_travel_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 5c7c4f3c-a983-548a-bff5-7e4c40623d8a
  title: Summit Travel Card — recognizing scams targeting this product
  body: "Because the Summit Travel Card is designed for international use, scammers\
    \ often try to exploit the 'travel' aspect of the account. We want to help you\
    \ recognize these patterns before they cause harm.\n\nCommon Scams Targeting Summit\
    \ Cardholders:\n* The 'Travel Alert' Scam: You may receive a text or email claiming\
    \ there is a suspicious transaction in another country. The message will urge\
    \ you to click a link or provide your full card number to 'verify' your identity\
    \ and stop the charge. \n* The 'Reward Point' Scam: Scammers may contact you claiming\
    \ you have a large balance of travel rewards that are about to expire, asking\
    \ for your login credentials or a one-time passcode to 'redeem' them.\n* The 'Foreign\
    \ Fee' Refund: You might receive a call from someone claiming to be from Northwind\
    \ Bank offering to refund a foreign transaction fee that was charged in error,\
    \ asking for your account details to process the credit.\n\nWhat We Will Never\
    \ Do:\nWe will never ask you for your password, your full PIN, or a multi-factor\
    \ authentication (MFA) code over the phone or via email. We will never ask you\
    \ to move money to a 'safe account' to protect it from fraud.\n\nImmediate Action\
    \ Steps:\nIf you notice a transaction you did not authorize or receive a suspicious\
    \ request, tell us immediately. To protect your consumer rights under Regulation\
    \ E, we prioritize the rapid resolution of unauthorized transactions. The sooner\
    \ you report the activity, the faster we can secure your account and begin our\
    \ internal investigation.\n\nFor more on general safety, you may review Summit\
    \ Travel Card — fraud and unauthorized-activity protection."
  domain: cards
  product_category: summit_travel_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 03ed9649-15bc-54a2-a9b1-bbf40d14ec1f
  title: Summit Travel Card — limits, restrictions, and edge cases
  body: 'This guide provides support agents with the technical boundaries and specific
    constraints of the Summit Travel Card to ensure accurate customer communication.


    Financial Terms and Costs:

    * Annual Fee: $95

    * Purchase APR: 23.49%

    * Foreign Transaction Fee: 0%

    * Travel Rewards Rate: 3%


    Operational Limits and Restrictions:

    * Reward Accrual: The 3% rewards rate applies specifically to travel-coded merchants.
    Spend at non-travel merchants will not earn this premium rate.

    * Credit Limit: Limits are determined by the customer''s creditworthiness and
    financial profile during the underwriting process.

    * Foreign Usage: While there is a 0% foreign transaction fee, we may temporarily
    block transactions that appear highly unusual for the customer''s spending pattern
    to prevent fraud. These can be cleared once the customer''s identity is validated.


    Edge Cases:

    * Reward Redemption: Rewards are credited to the account based on the merchant
    category code (MCC). If a customer believes a travel-related purchase did not
    earn the 3% rate, it is likely due to the merchant''s categorization.

    * Fee Timing: The $95 annual fee is charged upon account opening and annually
    thereafter on the anniversary of the account opening date.

    * Interest Application: The 23.49% APR is applied to any balance not paid in full
    by the monthly due date.


    Refer to Summit Travel Card — overview for general positioning and marketing one-liners.'
  domain: cards
