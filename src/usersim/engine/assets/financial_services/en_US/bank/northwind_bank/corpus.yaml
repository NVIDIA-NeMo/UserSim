- id: d8ccb0cb-dba1-5e1b-ba82-d8e3126dac2a
  title: Everyday Checking — a failed or pending action
  body: 'If you experience a failed transaction or an action that remains ''pending''
    longer than expected, please follow these steps to resolve the issue.


    Common Symptoms:

    * An attempted transfer or payment is marked as ''failed''.

    * A deposit is showing as ''pending'' beyond the typical business day.

    * A debit card transaction was declined despite having sufficient funds.


    What to check:

    1. Balance Verification: Ensure your account has sufficient funds for the transaction.
    Remember that an Overdraft Fee of $34 applies if you draw more money than the
    account holds.

    2. Status Check: Review your recent transaction history to see if the action is
    still processing or if it was reversed.

    3. Identity Validation: Ensure your account is not locked due to a security flag.
    We require mandatory identity verification before any state-changing action.


    How to fix it:

    * If the action failed due to insufficient funds, add the required amount and
    retry the action.

    * If a transaction is stuck in ''pending'' for more than three business days,
    tell us the transaction date and amount, and we will investigate the hold.


    When we escalate:

    If we cannot resolve the failure immediately, we will raise a formal investigation
    case. You will receive a case number and an expected resolution date. For unauthorized
    transactions, we act in strict accordance with Regulation E to protect your funds
    first while we investigate.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
