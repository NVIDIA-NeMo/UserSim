- id: 70b80529-ec16-5daf-a2fa-89f4f7da43fb
  title: Summit Travel Card — fraud and unauthorized-activity protection
  body: 'When you use your Summit Travel Card abroad, you are a prime target for specific
    fraud patterns. We frequently see ''skimming'' at foreign ATMs or kiosks, and
    sophisticated phishing emails that mimic travel alerts to trick you into revealing
    your security codes.


    To keep your account safe, please remember that Northwind Bank will never ask
    you for your full card number, PIN, or password via email or text message. If
    you receive a message claiming there is a problem with your travel rewards or
    a suspicious charge that asks you to click a link to ''verify'' your identity,
    do not engage with it.


    If you notice an unauthorized transaction, tell us immediately. We prioritize
    the rapid resolution of these issues. In strict accordance with Regulation E timelines,
    we work to protect the consumer first while conducting a thorough internal investigation
    to recover your funds.


    To protect your liability, report any lost or stolen cards or unauthorized charges
    as soon as you spot them. The faster you notify us, the better we can secure your
    account and limit potential losses. If you suspect your card is compromised while
    traveling, ask us to freeze your card immediately to prevent further unauthorized
    spend while we arrange for a replacement.'
  domain: cards
  product_category: summit_travel_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ae9dc5ff-7dd5-53c0-a8cc-21224b124028
  title: Summit Travel Card — account agreement
  body: 'This agreement governs the use of the Summit Travel Card. By activating your
    card, you agree to the following terms:


    1. Fees and Payments: You are responsible for an annual fee of $95. This fee is
    billed to your account annually. Purchases made with the card that are not paid
    in full by the due date will accrue interest at an annual percentage rate of 23.49%.


    2. Travel Benefits: We provide a rewards rate of 3% on eligible travel purchases.
    These rewards are credited to your account based on the transaction value.


    3. International Usage: We do not charge a foreign transaction fee (0% fee) for
    purchases made outside of the United States. However, third-party currency exchange
    providers may apply their own fees.


    4. Obligations: You agree to maintain a valid identity and provide updated contact
    information. We reserve the right to suspend or close the account if the terms
    of this agreement are violated or if the account is used for fraudulent activity.


    5. Changes to Terms: We may change the interest rates or fees associated with
    this card. We will provide notice of such changes in accordance with federal law
    before they take effect.


    6. Termination: You may close your account at any time by notifying us. Any remaining
    balance must be paid in full before the account can be formally closed.'
  domain: cards
  product_category: summit_travel_card
  document_type: terms_conditions
