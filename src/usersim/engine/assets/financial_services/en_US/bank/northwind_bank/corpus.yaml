- id: ec531b38-fb24-5cbd-afc8-43b988f34bd5
  title: Horizon Cashback Card — apr purchase explained
  body: '**What is the purchase APR on my Horizon Cashback Card?**

    The purchase APR for this card is 21.99%. This is the annual interest rate that
    applies to any balance you carry from one billing cycle to the next.


    **How can I avoid paying interest on my purchases?**

    You can avoid interest charges entirely by paying your full statement balance
    by the due date every month. If you do this, the 21.99% APR will not be applied
    to those purchases.


    **How is the interest calculated?**

    Interest is calculated based on your average daily balance. For more details on
    how this affects your monthly statement, you can refer to the Horizon Cashback
    Card — regulatory disclosures.'
  domain: cards
  product_category: horizon_cashback_card
