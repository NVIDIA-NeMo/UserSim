- id: 63d3cb2d-6887-578d-ae3d-4df79c951604
  title: Horizon Cashback Card — resolve a common request end-to-end
  body: "One of the most common requests we handle is the redemption of accumulated\
    \ cashback rewards. Here is how to complete that process from start to finish.\n\
    \n**What you need before starting**\n*   Your Horizon Cashback Card account details.\n\
    *   A decision on how you want to receive your rewards (e.g., as a statement credit).\n\
    \n**Steps to redeem your cashback**\n1.  **Verify your identity:** Tell us you\
    \ would like to redeem your rewards. We will first perform mandatory multi-factor\
    \ authentication and identity verification to protect your funds.\n2.  **Check\
    \ your available balance:** Ask us for your current reward total. We will confirm\
    \ the total amount earned at your 1.5% cashback rate that is available for redemption.\n\
    3.  **Specify the redemption amount:** Tell us if you want to redeem all of your\
    \ rewards or a specific dollar amount. \n4.  **Choose the redemption method:**\
    \ Tell us how you want the funds applied. The most common method is a statement\
    \ credit, which reduces the balance you owe on your card.\n5.  **Confirm the request:**\
    \ We will summarize the transaction (e.g., \"Redeeming $50 in cashback as a statement\
    \ credit\"). Confirm that this is correct.\n6.  **Receive confirmation:** We will\
    \ process the request and provide you with a confirmation number. You will see\
    \ the credit appear on your next statement or in your current transaction history.\n\
    \n**How you know it worked**\nYour available rewards balance will decrease by\
    \ the amount you redeemed, and you will see a corresponding credit applied to\
    \ your account balance."
