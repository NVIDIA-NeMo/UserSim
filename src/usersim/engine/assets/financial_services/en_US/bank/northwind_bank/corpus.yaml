- id: 4ac92f31-62db-588e-aed9-0be542dbaff2
  title: Horizon Cashback Card — a discrepancy in your records or statement
  body: 'If you notice a transaction you don''t recognize or a cashback amount that
    seems incorrect on your Horizon Cashback Card statement, please follow these steps.


    **Likely Causes**

    *   **Pending Transactions:** Some merchants place a ''hold'' on funds that may
    differ from the final purchase amount.

    *   **Rewards Lag:** Cashback is calculated on net purchases; returns or credits
    may have reduced your 1.5% earnings.

    *   **Unauthorized Activity:** The transaction may be a result of fraud or an
    error by the merchant.


    **What to check in order**

    1.  **Review Transaction Details:** Ask us for the full details of the disputed
    charge. We will provide the merchant name, date, and exact amount to help you
    recognize the purchase.

    2.  **Verify Reward Calculations:** If the cashback seems low, ask us to review
    your net purchases for the period. We will verify that the 1.5% rate was applied
    correctly after all returns and credits were subtracted.

    3.  **Check for Pending Status:** Ask if the transaction is ''pending'' or ''posted.''
    Pending transactions can change before they finalize on your statement.


    **The Fix**

    *   **For Merchant Errors:** We recommend contacting the merchant first for a
    refund. If they refuse, we can assist you in filing a formal dispute.

    *   **For Unauthorized Charges:** Tell us immediately. We prioritize the rapid
    resolution of unauthorized transactions in accordance with Regulation E timelines,
    protecting the consumer first while we investigate.


    **When we escalate**

    If we cannot resolve the discrepancy through a simple review, we will route the
    case to our specialized domain leads in retail banking or credit cards. They will
    conduct a thorough internal investigation. You will receive a status update via
    secure chat or email throughout the process.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: da470d37-229a-5818-8a49-55ad25aa198c
  title: Northwind High-Yield Savings — overview
  body: 'Welcome to Northwind Bank. We are pleased to introduce the Northwind High-Yield
    Savings account, a high-growth liquid account designed specifically for your emergency
    funds and short-term financial goals. We focus on transparency and competitive
    growth to help your money work harder for you while remaining accessible when
    you need it most.


    Our account structure is designed to be simple and rewarding. We offer a competitive
    yield that allows your savings to grow faster than a traditional savings account,
    making it an ideal hub for those who want a balance between high returns and liquidity.


    Key Account Details:

    * Annual Percentage Yield (APY): 4.25%

    * Minimum Opening Deposit: $100

    * Monthly Withdrawal Limit: 6 withdrawals

    * Excess Withdrawal Fee: $10 per withdrawal over the limit


    Whether you are building a safety net or saving for a specific purchase, we provide
    a streamlined experience to help you track your progress. All retail deposits
    at Northwind Bank are FDIC-insured, ensuring your funds are secure.


    Disclaimer: The APY is variable and may change at our discretion. All accounts
    are subject to identity verification and our standard suitability review to ensure
    this product aligns with your stated financial goals.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: product_sheet
