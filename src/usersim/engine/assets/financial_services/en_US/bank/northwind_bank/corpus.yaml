    Whether you are planning a getaway or saving for a dream vacation, this is a great
    way to accelerate your earnings. The Summit Travel Card continues to offer a 3%
    rewards rate on travel purchases and a 0% foreign transaction fee, making it the
    perfect companion for international exploration.


    * Offer valid for new cardholders only.

    * Referrals must be submitted within the promotional window.

    * Points are credited within 30 days of the referred customer''s first qualifying
    purchase.


    Disclaimer: All credit accounts are subject to credit approval. Terms and conditions
