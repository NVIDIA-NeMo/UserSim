- id: 74b1f199-f3b0-5e1b-8e16-bed7eaf43ea2
  title: Anchor 12-Month CD — fraud and unauthorized-activity protection
  body: "At Northwind Bank, we prioritize the security of your long-term savings.\
    \ Because the Anchor 12-Month CD is designed for stability, it is often a target\
    \ for specific fraud patterns, such as 'account takeover' attempts where bad actors\
    \ try to change the maturity instructions or the linked payout account to divert\
    \ your funds.\n\nWe want to be very clear about our security boundaries: Northwind\
    \ Bank will never ask you to provide your full password, multi-factor authentication\
    \ codes, or your Social Security number via an unsolicited email or text message\
    \ to 'verify' your CD. We will never pressure you to move your funds into a different\
    \ 'safe' account or a cryptocurrency wallet to avoid a penalty.\n\nIf you notice\
    \ an unauthorized transaction or receive a suspicious request regarding your Anchor\
    \ 12-Month CD, your first action should be to notify us immediately. We prioritize\
    \ the rapid resolution of unauthorized transactions in strict accordance with\
    \ Regulation E timelines. Our philosophy is to protect the consumer first while\
    \ we conduct a thorough internal investigation. \n\nTo maintain the integrity\
    \ of your funds, we require rigorous identity verification and multi-factor authentication\
    \ before any state-changing action—such as closing the account or changing a beneficiary—is\
    \ permitted. No modifications to your account will be made without this successful\
    \ validation.\n\nYour deposits in the Anchor 12-Month CD are FDIC-insured, providing\
    \ a layer of federal protection for your principal up to applicable limits."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 5d64ce8a-8520-5c6c-8e39-3f7df86c91f5
  title: Anchor 12-Month CD — account agreement
  body: 'This agreement governs the relationship between Northwind Bank and the account
    holder for the Anchor 12-Month CD.


    1. Deposit Requirements: To open this account, the customer must provide a minimum
    deposit of $1000. Funds must be deposited in full at the time of account opening.


    2. Term and Yield: The account is established for a fixed term of 12 months. During
    this period, the bank agrees to pay an Annual Percentage Yield (APY) of 4.5%.
    This rate is fixed for the duration of the 12 months.


    3. Early Withdrawal: The account holder is obligated to maintain the funds for
    the full 12 months. Should the account holder request a withdrawal of any principal
    or earned interest prior to the maturity date, a penalty equal to 90 days of interest
    will be deducted from the account balance.


    4. Maturity and Renewal: Upon the completion of the 12 months, the account reaches
    maturity. The customer may choose to withdraw the funds, move them to another
    Northwind Bank product, or renew the term. If no instruction is received, the
    account may renew under then-current terms.


    5. Modifications: Northwind Bank adheres to CFPB and Federal Reserve guidelines.
    Any changes to the terms of this agreement will be communicated to the customer
    in writing. All retail deposits remain FDIC-insured.


    6. Termination: This agreement ends upon the full withdrawal of funds at maturity
    or the closure of the account via the early withdrawal process, subject to the
    90 days interest penalty.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ba4b415b-a473-565e-b771-bee0de6e3f4f
  title: Anchor 12-Month CD — who it is best for and common use cases
  body: 'The Anchor 12-Month CD is a secure, fixed-rate vehicle for guaranteed returns
    over a one-year term. Unlike a flexible savings account, this product is designed
    for funds you do not need immediate access to, allowing you to earn a higher,
    guaranteed return.


    **Who This Is Best For**

    This account is ideal for retail savers who have a specific one-year timeline
    and want to eliminate the risk of rate fluctuations. It is best for those who
    have already established an emergency fund and are looking for a low-risk way
    to grow their remaining capital.


    **Common Use Cases**

    * **Planned Purchases:** Saving for a down payment or a large purchase that will
    occur in exactly one year.

    * **Income Stability:** Locking in a high rate of return for a portion of your
    savings to ensure a predictable payout.

    * **Risk Mitigation:** Diversifying a portfolio by moving funds from volatile
    investments into an FDIC-insured fixed-rate account.


    **Product Details**

    * **Annual Percentage Yield (APY):** 4.5%

    * **Term Length:** 12 months

    * **Minimum Deposit:** $1000

    * **Early Withdrawal Penalty:** 90 days of interest


    *Disclaimer: All retail deposits are FDIC-insured. This product is designed for
    suitability based on a customer''s stated goals and financial profile.*'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: e015e4c8-595b-5142-91af-60ade6cd0cb9
  title: Anchor 12-Month CD — apy explained
  body: "**What is the APY for the Anchor 12-Month CD?**\nThe Anchor 12-Month CD offers\
    \ an Annual Percentage Yield (APY) of 4.5%. \n\n**What does APY actually mean?**\n\
    APY stands for Annual Percentage Yield. It is the real rate of return earned on\
    \ your deposit, which includes the effect of compounding interest over the course\
    \ of the year.\n\n**Is the 4.5% rate guaranteed?**\nYes. Because this is a fixed-rate\
    \ CD, the 4.5% APY is locked in for the entire 12 months, regardless of whether\
    \ market rates rise or fall during your term.\n\n**How is this different from\
    \ the High-Yield Savings account?**\nWhile the Northwind High-Yield Savings —\
    \ overview offers liquidity, the Anchor 12-Month CD provides a fixed rate for\
    \ a set term. For more details on our other savings options, you may review the\
    \ Northwind High-Yield Savings — overview."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 4ae92c78-40a9-594f-9afd-b59fae28ab1f
  title: Anchor 12-Month CD — cancel, close, or downgrade
  body: "Closing an Anchor 12-Month CD before the 12-month term ends is considered\
    \ an early withdrawal. Please follow these steps to complete the process:\n\n\
    **What you need before starting**\n* Your account number.\n* A valid government-issued\
    \ photo ID for identity verification.\n* A destination account (such as an Everyday\
    \ Checking account) to receive the funds.\n\n**Steps to close your account**\n\
    1. **Request Closure:** Tell us that you wish to close your Anchor 12-Month CD\
    \ early. \n2. **Identity Validation:** We will perform a rigorous identity verification\
    \ process, which includes multi-factor authentication, to ensure the request is\
    \ authorized.\n3. **Penalty Acknowledgement:** We will inform you of the early\
    \ withdrawal penalty, which is 90 days of interest. You must confirm that you\
    \ accept this deduction from your balance.\n4. **Fund Transfer:** Tell us where\
    \ to send the remaining balance. We will transfer the principal and any earned\
    \ interest (minus the 90 days penalty) to your designated account.\n5. **Confirmation:**\
    \ We will provide a final transaction confirmation showing the total amount transferred\
    \ and the penalty applied.\n\n**How you know it worked**\nYou will receive a confirmation\
    \ notice of the account closure and see the funds arrive in your destination account.\
    \ If you are simply looking to move funds to a different internal product, you\
    \ can ask us to transition the balance to a product like the Everyday Checking\
    \ — overview upon maturity to avoid penalties."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: b7643b8b-347d-5351-aefa-84fde6ee6e7f
  title: Anchor 12-Month CD — an unexpected charge or amount
  body: "**Symptom:** You notice that the balance in your Anchor 12-Month CD is lower\
    \ than expected, or you see a deduction you did not authorize.\n\n**Likely Causes**\n\
    1. **Early Withdrawal Penalty:** The most common cause is an early withdrawal.\
    \ If any funds were removed before the 12 months ended, a penalty of 90 days of\
    \ interest was automatically applied.\n2. **Tax Withholding:** Depending on your\
    \ tax profile, certain withholdings may have been applied to the earned interest.\n\
    3. **Unauthorized Activity:** A transaction occurred that you did not initiate.\n\
    \n**What to check in order**\n1. **Review your transaction history:** Check if\
    \ any withdrawals were made prior to the 12-month maturity date.\n2. **Verify\
    \ the penalty:** Calculate if the missing amount matches 90 days of interest based\
    \ on your 4.5% APY.\n3. **Check for official notices:** Review your messages for\
    \ any tax-related adjustments.\n\n**The Fix**\n* **If it was a penalty:** This\
    \ is a standard part of the account agreement for early closures. No further action\
    \ is needed unless the withdrawal was unauthorized.\n* **If it was unauthorized:**\
    \ Tell us immediately that you are disputing the transaction. \n\n**When we escalate**\n\
    If the amount cannot be explained by a penalty or tax withholding, we will raise\
    \ a formal case with our retail banking domain leads. We prioritize the rapid\
    \ resolution of unauthorized transactions in strict accordance with Regulation\
    \ E timelines. You will receive a notification once the internal investigation\
    \ is complete and, if applicable, a provisional credit will be applied to your\
    \ account."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
