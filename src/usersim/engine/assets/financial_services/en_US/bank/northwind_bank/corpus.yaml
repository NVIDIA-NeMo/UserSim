- id: 13ae8a8a-9dff-56f8-ab14-eed8bd4dba55
  title: Horizon Cashback Card — fraud and unauthorized-activity protection
  body: 'At Northwind Bank, we believe your peace of mind is as important as your
    financial growth. The Horizon Cashback Card is designed for everyday spending,
    which means it is often used at a variety of merchants. Because of this, we want
    to alert you to common fraud patterns targeting cashback users, such as ''phishing''
    emails that claim your rewards have expired or fake text alerts asking you to
    ''verify'' a transaction by providing your full card number and CVV.


    To keep your account safe, please remember that we will never ask you for your
    password, your full card number, or your multi-factor authentication codes via
    email or text. Any request for this information is a red flag.


    If you notice a transaction you did not authorize, the most important first step
    is to notify us immediately. We prioritize the rapid resolution of unauthorized
    transactions in strict accordance with Regulation E timelines. Our philosophy
    is to protect the consumer first while we conduct a thorough internal investigation.
    Reporting the activity quickly helps us limit your potential liability and secure
    your account.


    Once you report a suspicious charge, we will secure your account and begin the
    dispute process. You can find more detailed information on how we handle these
    claims in the Horizon Cashback Card — regulatory disclosures document.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: f5acb492-e809-5d8f-9ecb-118c103ca24b
  title: Horizon Cashback Card — account agreement
  body: 'This account agreement governs the use of the Horizon Cashback Card. By using
    this card, you agree to the following terms and obligations.


    1. Interest and Payments: You agree to pay all balances in accordance with your
    billing statements. Purchases made with the card are subject to a purchase APR
    of 21.99%. Interest is calculated daily and billed monthly if a balance is carried
    forward.


    2. Rewards Program: We provide a cashback rate of 1.5% on eligible purchases.
    This reward is earned based on the transaction amount and is credited to your
    account according to our standard rewards schedule. Northwind Bank reserves the
    right to adjust reward eligibility for specific merchant categories.


    3. Fees: The Horizon Cashback Card is provided with an annual fee of $0. We maintain
    a low-friction pricing model, and while this card has no annual cost, other fees
    (such as late payment fees) may apply as outlined in the Horizon Cashback Card
    — fee schedule.


    4. Account Changes: We may change the terms of this agreement, including the purchase
    APR or cashback rate, provided we give you advance notice in accordance with federal
    law.


    5. Termination: Either you or Northwind Bank may close this account at any time.
    Upon closure, any remaining balance must be paid in full. Any earned but unredeemed
    cashback may be forfeited upon account termination depending on the reason for
    closure.


    6. Compliance: This agreement is governed by CFPB and Federal Reserve guidelines
    to ensure fair treatment and data privacy.'
