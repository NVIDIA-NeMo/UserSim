- id: 62768eac-1a25-5695-8755-927b49868ff8
  title: Anchor 12-Month CD — a declined or blocked action
  body: 'It can be frustrating when a request to open or move funds is blocked. Here
    is how to identify and fix the most common causes for the Anchor 12-Month CD.


    **Symptom:** You are told that your request to open a CD was declined or your
    attempt to withdraw funds was blocked.


    **Likely Causes**

    * **Insufficient Opening Deposit:** The most common cause for a declined application
    is a deposit amount under $1000. This product requires a minimum deposit of $1000
    to activate.

    * **Identity Verification Failure:** All state-changing actions require rigorous
    identity verification. If MFA fails or PII does not match our records, the action
    is blocked for your security.

    * **Term Lock:** If you are attempting a standard transfer or withdrawal, the
    action may be blocked because the funds are locked for the 12-month term.


    **What to check and how to fix it**

    1. **Check your funding amount:** If you are opening an account, ensure the total
    being deposited is at least $1000. If it is lower, you can increase the amount
    or consider a different product like Northwind High-Yield Savings.

    2. **Verify your identity:** If the block occurred during a security check, please
    ensure you have access to your registered mobile device or email to complete the
    MFA process.

    3. **Review your term:** If you are trying to move money, remember that this account
    has a 12-month duration. If you must have the money now, tell us you wish to perform
    an ''early withdrawal'' and acknowledge the 90 days of interest penalty.


    **When we escalate**

    If you have met the $1000 minimum and passed verification, but the action is still
    blocked, we will raise a technical case with our retail banking domain leads to
    investigate the block. You will receive a notification once the restriction is
    lifted.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 03204100-bdc6-5357-b2f2-289d0224dc24
  title: Anchor 12-Month CD — when to switch or upgrade
  body: 'As a support agent, use these guidelines to help customers decide if the
    Anchor 12-Month CD is the right choice compared to our other savings options.


    **When to recommend the Anchor 12-Month CD**

    * The customer has at least $1000 and does not need access to the money for a
    full year.

    * The customer prioritizes a guaranteed return (4.5% APY) over liquidity.

    * The customer is looking for a secure, fixed-rate vehicle to protect their principal.


    **When to suggest switching to Northwind High-Yield Savings**

    * The customer has less than the $1000 minimum deposit.

    * The customer may need their money for an emergency fund or short-term goal and
    cannot risk a penalty of 90 days of interest.

    * The customer prefers a liquid account where they can add or remove funds frequently.


    **Summary for the Customer**

    Choose the Anchor 12-Month CD if you want the peace of mind of a fixed 4.5% APY
    and can commit your funds for 12 months. Choose High-Yield Savings if you need
    your money to stay accessible.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 354210fd-08ed-5fd9-984b-e224aacd6c16
  title: Anchor 12-Month CD — comparison vs. alternatives and when not to choose it
  body: 'When choosing a savings vehicle, it is important to match the product to
    your financial goals. The Anchor 12-Month CD is a specialized tool for guaranteed
    growth, but it is not the right choice for every situation.


    **Why choose the Anchor 12-Month CD?**

    We designed this product for customers who want a predictable return. By committing
    your funds for a 12-month term, you lock in an APY of 4.5%. This protects you
    from falling rates and ensures you know exactly what your return will be at the
    end of the year.


    **Comparison with Alternatives**

    * **Vs. Northwind High-Yield Savings:** While our High-Yield Savings account offers
    liquidity (the ability to withdraw money easily), it does not offer a fixed-rate
    guarantee for a year. The Anchor 12-Month CD provides a higher level of certainty
    for your returns in exchange for locking your funds.

    * **Vs. Everyday Checking:** Checking accounts are for daily spending and liquidity.
    With a minimum deposit of $1000 and a 12-month lock, the Anchor 12-Month CD is
    not a substitute for a spending account.


    **When NOT to choose this product**

    * **If you need an emergency fund:** If this money represents your only safety
    net, do not put it in a CD. Withdrawing your money early triggers a penalty of
    90 days of interest, which could eat into your savings when you need them most.

    * **If you have less than $1000:** This product requires a minimum deposit of
    $1000. If you are starting with a smaller amount, we recommend our other savings
    options.

    * **If you expect to need the cash within the year:** If you are saving for a
    vacation or purchase happening in six months, a 12-month term is too long.


    *Disclaimer: All retail deposits are FDIC-insured.*'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: dd5029d4-a6a1-5a62-9f30-c0e732d29f04
  title: Anchor 12-Month CD — cost and charges
  body: '**Are there any monthly maintenance fees for this CD?**

    No. We believe in low-friction pricing. There are no monthly service fees to maintain
    your Anchor 12-Month CD.


    **How much does it cost to open an account?**

    There is no ''fee'' to open the account, but there is a minimum deposit requirement
    of $1000. This money is yours and earns interest; it is not a charge.


    **What are the charges for taking my money out early?**

    If you withdraw your funds before the 12-month term ends, we apply an early withdrawal
    penalty equal to 90 days of interest earned on the account.


    **Are there any other hidden costs?**

    No. Your primary commitment is the 12-month term and the $1000 minimum deposit.
    For a full list of our pricing philosophy, you can refer to Institution-wide fees
    and charges.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 2d33f0fe-e9e0-5b34-be13-07be95685cbc
  title: Anchor 12-Month CD — resolve a common request end-to-end
  body: 'The most common request for this product is the early closure of the account
    to access funds. Here is the end-to-end process for resolving this request.


    **What you need before starting**

    * Your account number and a valid form of identification for verification.


    **Steps to close your account early**

    1. Tell us that you wish to close your Anchor 12-Month CD and withdraw your funds
    before the term ends.

    2. We will perform a mandatory identity verification using multi-factor authentication
    (MFA) to ensure your account is secure.

    3. We will then calculate the early withdrawal penalty, which is equal to 90 days
    of interest earned on the account. We will disclose the exact dollar amount of
    this penalty to you.

    4. You must explicitly confirm that you accept the 90 days of interest penalty
    to proceed with the closure.

    5. Once you confirm, we will close the account and transfer the remaining balance
    (principal plus interest minus the penalty) to your linked Northwind Bank account.

    6. We will provide a final confirmation message stating the total amount transferred
    and the date of closure.


    **How you know it worked**

    You will see the final balance of your CD, minus the 90 days of interest penalty,
    appear in your linked account balance immediately following the confirmation.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 525f018a-4089-5047-80ef-3f67c44a5cc1
  title: Anchor 12-Month CD — a discrepancy in your records or statement
  body: 'If the interest earned or the final balance on your Anchor 12-Month CD does
    not match your own calculations, follow these steps to resolve the discrepancy.


    **Symptom:** You believe there is an error in the interest credited to your account
    or the amount of an early withdrawal penalty applied.


    **Likely Causes**

    * **Calculation Misunderstanding:** Interest is calculated based on a 4.5% APY.
    If you are calculating simple interest rather than compound interest, your numbers
    may differ from ours.

    * **Penalty Application:** If an early withdrawal occurred, you may be seeing
    the deduction of the 90 days of interest penalty, which is required for withdrawals
    before the 12-month term ends.

    * **Timing of Credits:** Interest may be credited at specific intervals; a statement
    pulled mid-cycle may not show the most recent accrual.


    **What to check and how to fix it**

    1. **Review the APY:** Confirm you are using the 4.5% APY figure for your calculations.

    2. **Verify the Penalty:** If you closed the account early, check if the amount
    missing equals exactly 90 days of interest. If so, this is the standard penalty
    and not an error.

    3. **Check Statement Dates:** Compare the ''as of'' date on your statement with
    the date you performed your calculation.


    **When we escalate**

    If the math still does not align after these checks, tell us you wish to dispute
    the balance. We will then raise a formal internal investigation. We prioritize
    the rapid resolution of these issues and will route the case to a specialized
    domain lead in retail banking. You will receive a response with the findings of
    the investigation within the standard timeframes dictated by our internal audit
    policies.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 43713c2e-f3a8-571f-afe7-84e14bc1ba59
  title: Summit Travel Card — overview
  body: 'The Summit Travel Card is our premium rewards card tailored for frequent
    travelers and international spenders. We designed this card to remove the friction
    of global travel while rewarding you for the journeys you take.


    Whether you are booking flights or dining abroad, the Summit Travel Card provides
    high-value rewards and cost-saving features to make your trips more affordable.


    **Key Features and Costs:**

    * **Travel Rewards:** Earn a rewards rate of 3% on travel-related purchases.

    * **International Use:** We charge a foreign transaction fee of 0%, meaning you
    pay exactly what the merchant charges without added bank fees.

    * **Annual Fee:** There is an annual fee of $95 to maintain this account.

    * **Purchase APR:** The annual percentage rate (APR) for purchases is 23.49%.


    We recommend this card for customers who travel frequently and wish to maximize
    their returns on travel spending. It is a powerful tool for those who want a streamlined
    experience when spending in multiple currencies.


    *Disclaimer: APR is variable and subject to change based on market conditions.
    All credit accounts are subject to credit approval.*'
  domain: cards
