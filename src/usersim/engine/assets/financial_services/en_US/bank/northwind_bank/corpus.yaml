- id: 5c8d8cc0-816d-5440-ba7d-43b1d75823c6
  title: Summit Travel Card — apr purchase explained
  body: '**What is the purchase APR on my Summit Travel Card?**

    The purchase APR is 23.49%. This is the annual interest rate that applies to any
    balances you carry over from one billing cycle to the next.


    **How can I avoid paying interest on my purchases?**

    You can avoid interest charges by paying your full statement balance by the due
    date every month. If the balance is paid in full, the 23.49% APR will not be applied
    to those purchases.


    **Does the APR change?**

    Yes, the APR is variable and may change based on the index it is tied to. We will
    notify you of any significant changes to your rate in accordance with our regulatory
    obligations. For more details on all costs, please see the Summit Travel Card
    — fee schedule.'
