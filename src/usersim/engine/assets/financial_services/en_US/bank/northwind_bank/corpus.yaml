- id: e363357d-8767-5518-b9c3-d6e5c44c18ee
  title: Everyday Checking — fraud and unauthorized-activity protection
  body: "At Northwind Bank, we believe in protecting the consumer first. If you notice\
    \ a transaction in your Everyday Checking account that you did not authorize,\
    \ we prioritize a rapid resolution. We operate in strict accordance with Regulation\
    \ E, the federal rule governing electronic fund transfers, to ensure your rights\
    \ are protected and unauthorized activity is handled quickly.\n\nCommon fraud\
    \ patterns targeting liquid checking accounts include phishing attempts where\
    \ bad actors pretend to be bank staff to steal your login credentials, or 'spoofed'\
    \ texts claiming your account is locked. Please remember: we will never ask you\
    \ for your password, your full social security number, or a multi-factor authentication\
    \ code over a text or email. \n\nIf you suspect fraud or see an unauthorized charge,\
    \ the first action you must take is to notify us immediately. Under Regulation\
    \ E, the timing of your report is critical to limiting your potential liability\
    \ for the unauthorized transfers. Once you alert us, we will freeze the affected\
    \ channels to prevent further loss and begin a thorough internal investigation.\n\
    \nOur philosophy is to secure your funds first and investigate second. We work\
    \ diligently to resolve these disputes and provide updates as the investigation\
    \ progresses. For more details on how we handle specific charges, you may refer\
    \ to Everyday Checking — an unexpected charge or amount."
  domain: retail_banking
  product_category: everyday_checking
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 995a1645-a849-5c3e-9bb3-2fb1c3a82e64
  title: Everyday Checking — account agreement
  body: "This account agreement outlines the binding terms between Northwind Bank\
    \ and the account holder for the Everyday Checking product. \n\n1. Account Maintenance:\
    \ We provide this account as a low-cost hub for daily spending. While the monthly\
    \ maintenance fee is $0, we reserve the right to modify this fee structure with\
    \ prior notice. \n\n2. Fee Obligations: The customer is responsible for costs\
    \ associated with account misuse. Specifically, if an account experiences an overdraft,\
    \ a fee of $34 will be applied per occurrence. Additionally, use of an ATM outside\
    \ of our network will result in an out-of-network fee of $2.5.\n\n3. Fee Waivers:\
    \ To maintain a low-friction experience, the monthly maintenance fee (currently\
    \ $0) is waived provided the customer maintains a minimum balance of $500. \n\n\
    4. Regulatory Compliance: This account is governed by Regulation E for electronic\
    \ transfers and is FDIC-insured. We adhere to all CFPB and Federal Reserve guidelines\
    \ regarding fair treatment and data privacy.\n\n5. Modification of Terms: Northwind\
    \ Bank may change these terms, including fee amounts or balance requirements,\
    \ by providing notice to the customer. Continued use of the account following\
    \ such notice constitutes acceptance of the new terms.\n\n6. Termination: Either\
    \ party may close the account at any time. Upon closure, any remaining funds will\
    \ be returned to the customer after all outstanding fees, including any pending\
    \ $34 overdraft charges or $2.5 ATM fees, have been settled."
  domain: retail_banking
  product_category: everyday_checking
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: bc125ab4-87ba-5073-8700-f7e0fe1d4e4e
  title: Everyday Checking — who it is best for and common use cases
  body: 'The Everyday Checking account is the foundational, low-cost hub for your
    daily spending and liquidity. It is designed specifically for retail savers and
    everyday spenders who need a reliable place to manage their primary income and
    routine expenses without high overhead costs.


    This account is best for:

    * Individuals seeking a transparent banking experience with no hidden monthly
    costs.

    * Customers who maintain a modest cushion in their account and want to avoid maintenance
    fees.

    * Spenders who prioritize digital-first banking and easy access to their funds.


    Common Use Cases:

    * Primary Payroll Deposit: Use this as the destination for your direct deposits
    to fund your monthly bills.

    * Daily Transactional Hub: A secure spot for debit card purchases, bill payments,
    and peer-to-peer transfers.

    * Liquidity Buffer: Keeping a base amount to ensure your daily spending is covered
    without dipping into long-term savings.


    Financial Details:

    * Monthly Maintenance Fee: $0

    * Minimum Balance to Waive Fee: $500

    * Overdraft Fee: $34

    * Out-of-Network ATM Fee: $2.5


    Disclaimer: All retail deposits are FDIC-insured. Fees are designed to discourage
    account misuse rather than generate revenue.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 6e44e0de-49cc-5d08-8551-36706a47f81e
  title: Everyday Checking — minimum balance to waive fee explained
  body: 'Q: How does the minimum balance requirement work for my Everyday Checking
    account?


    A: We want to keep your banking low-friction. While the current monthly maintenance
    fee for Everyday Checking is $0, we maintain a requirement of a $500 minimum balance
    to ensure the fee remains waived. If your balance falls below $500, you may be
    subject to the maintenance fee as outlined in your agreement.


    Q: What happens if my balance dips below $500 for just one day?


    A: We recommend reviewing your specific account terms in Everyday Checking — account
    agreement to see how balance averages are calculated for your cycle. Generally,
    staying above the $500 threshold ensures you avoid unnecessary costs.


    Q: Can I move money from savings to meet this requirement?


    A: Yes, transferring funds from another Northwind Bank account to reach the $500
    minimum is a great way to avoid fees.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: bc24ae2f-25fc-5d1f-9081-d58f4a051d29
  title: Everyday Checking — cancel, close, or downgrade
  body: 'If you no longer need your Everyday Checking account or wish to move to a
    different product, follow these steps to ensure a smooth transition.


    Prerequisites:

    * Ensure all pending transactions have cleared.

    * Have a destination account ready for any remaining funds.


    Steps to close or downgrade:

    1. Tell us whether you wish to close the account entirely or downgrade it to a
    different product.

    2. We will verify your identity using our mandatory multi-factor authentication
    and identity verification process. No account modifications are permitted without
    this step.

    3. Provide instructions on where to send your remaining balance (e.g., a transfer
    to another Northwind Bank account or a check sent to your address on file).

    4. We will check for any outstanding obligations, such as pending $34 overdraft
    fees or uncollected deposits.

    5. Once the balance is zeroed out and all fees are settled, we will process the
    closure or the downgrade.

    6. We will provide a final confirmation message or document stating that the account
    is closed or has been successfully transitioned.


    Your account is officially closed once you receive the final confirmation from
    us. If you are comparing this process against other institutions, please note
    that we prioritize a streamlined, digital-first experience to make this transition
    as easy as possible.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d7634fe6-8376-5ce9-9ea8-0dafd1080461
  title: Everyday Checking — an unexpected charge or amount
  body: 'It can be concerning to see a charge on your statement that you don''t recognize.
    Here is how we can help you identify and resolve the issue.


    Symptom: You see a transaction amount or a fee on your Everyday Checking statement
    that you did not expect.


    Likely Causes:

    * An overdraft occurred, resulting in a $34 fee.

    * You used an ATM outside of our network, resulting in a $2.5 fee.

    * A merchant processed a transaction for a different amount than expected.

    * An unauthorized transaction has occurred.


    What to check in order:

    1. Review the transaction date and merchant name. Sometimes merchants use a parent
    company name that differs from the store name.

    2. Check your balance at the time of the transaction. If the balance was below
    the required amount for the purchase, check if a $34 overdraft fee was applied.

    3. Check the location of the ATM used. If it was not a Northwind Bank ATM, check
    for the $2.5 out-of-network fee.


    How to fix it:

    * If the charge is a legitimate bank fee based on account use, we can explain
    the charge and help you plan to avoid it in the future (such as maintaining the
    $500 minimum balance).

    * If the charge is a merchant error, we recommend contacting the merchant first
    for a refund.

    * If the charge is unauthorized, tell us immediately. We will start a dispute
    process under Regulation E timelines.


    When we escalate:

    If the issue is a complex fraud case, we will raise a case to our specialized
    retail banking domain leads. You will receive a notification that an internal
    investigation has begun and will be updated on the status of your provisional
    credit.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: f7ef7251-33a7-5fa9-bbf6-0d8d9ec189d0
  title: Everyday Checking — required documentation
  body: 'To open an Everyday Checking account, all prospective customers must provide
    specific documentation to satisfy our identity verification and compliance standards.
    We strictly adhere to FDIC and CFPB guidelines.


    | Document Category | Requirement | Outcome |

    | :--- | :--- | :--- |

    | Government Photo ID | Valid Passport or Driver''s License | Identity Verified
    |

    | Proof of Address | Utility Bill or Lease Agreement (last 60 days) | Residency
    Confirmed |

    | Tax Identification | Social Security Number (SSN) or ITIN | Compliance Approved
    |

    | Initial Deposit | Any amount (minimum $0 to open) | Account Active |


    Failure to provide any of the above will result in a pending application status
    until the document is submitted and verified.'
