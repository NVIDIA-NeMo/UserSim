- id: d4ed1a19-6f74-5afc-8b8b-bce80adbabcd
  title: Northwind High-Yield Savings — regulatory disclosures
  body: 'This document provides formal regulatory disclosures regarding the Northwind
    High-Yield Savings account. Northwind Bank adheres strictly to CFPB, Federal Reserve,
    and FDIC guidelines to ensure the fair treatment of all consumers.


    Deposit Insurance

    All retail deposits in the Northwind High-Yield Savings account are FDIC-insured
    up to the maximum allowed by law. This ensures your principal is protected in
    the event of bank failure.


    Interest and APY

    The current Annual Percentage Yield (APY) is 4.25%. This rate is variable and
    may change at any time without prior notice. Interest is compounded daily and
    credited monthly. The APY reflects the total amount of interest paid on an account
    held for one year.


    Withdrawal Restrictions and Fees

    In accordance with our low-friction pricing model, we allow up to 6 withdrawals
    per monthly statement cycle. Any withdrawal exceeding this limit will incur an
    excess withdrawal fee of $10 per occurrence. These fees are designed to discourage
    the use of this savings vehicle as a transactional checking account.


    Account Requirements

    A minimum opening deposit of $100 is required to establish the account. Failure
    to meet this initial requirement will result in the account not being opened.


    Identity and Privacy

    Multi-factor authentication and rigorous identity verification are mandatory before
    any state-changing action or disclosure of PII. We prioritize transparency in
    all Regulation E disclosures regarding electronic fund transfers.


    Suitability Standard

    Northwind Bank recommends this product based on the customer''s stated goals and
    financial profile. We provide financial education but do not provide individualized
    tax, legal, or investment advice.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: disclosure
  source_authority: official
