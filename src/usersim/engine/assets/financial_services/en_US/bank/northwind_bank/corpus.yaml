- id: 68e226f4-c579-5c42-81da-167a8593934c
  title: Summit Travel Card — referral and loyalty offer
  body: 'We believe that the best way to experience the world is with friends. From
    October 1, 2024, to December 31, 2024, we are offering a special loyalty bonus
    for our existing cardholders. Refer a friend or family member to the Summit Travel
    Card, and once they are approved and make their first purchase, we will credit
