- id: b24ec3c9-01cb-50aa-8902-5367e44e1785
  title: Everyday Checking — check status or history
  body: 'We can help you review your recent activity or check the current status of
    your Everyday Checking account. Follow these steps to get the information you
    need:


    **What you need before starting:**

    *   Your account number or the identity verification details associated with your
    profile.


    **Steps to check your status or history:**

    1.  **Request your balance or history:** Tell us that you would like to see your
    current balance or a list of recent transactions for your Everyday Checking account.

    2.  **Verify your identity:** We will perform a mandatory identity verification.
    This includes multi-factor authentication to ensure your private information stays
    secure. You will need to confirm the code we send to your registered device.

    3.  **Specify the timeframe:** If you are looking for history, tell us the specific
    date range you want to review (e.g., ''the last 30 days'' or ''from January 1st
    to January 15th'').

    4.  **Review the details:** We will provide you with your current available balance
    and a chronological list of your transactions, including the date, amount, and
    merchant for each entry.


    **How you know it worked:**

    You will have a confirmed current balance and a clear list of your recent spending
    and deposits. If any transaction looks unfamiliar, you can ask us to investigate
    it immediately under our Regulation E protections.


    For more details on how we handle disputed transactions, please see Everyday Checking
    — fraud and unauthorized-activity protection.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: c9241e39-9400-53dc-86b2-f26d9f0c9499
  title: Everyday Checking — a declined or blocked action
  body: 'It can be frustrating when a transaction is declined or an account action
    is blocked. If you are comparing our services to others, please know that we prioritize
    security to protect your funds.


    **Symptoms:**

    *   Your debit card is declined at a point-of-sale terminal.

    *   An online transfer is blocked.

    *   You receive a message stating the action cannot be completed for security
    reasons.


    **Likely Causes:**

    1.  **Insufficient Funds:** Your account balance may be too low to cover the transaction,
    which could also trigger an overdraft fee of $34 if the transaction is allowed
    to process.

    2.  **Security Trigger:** Our system may have flagged the transaction as unusual
    (e.g., a very large purchase or a transaction in a new geographic location).

    3.  **Identity Verification Failure:** A state-changing action was attempted without
    successful multi-factor authentication.


    **What to check in order:**

    1.  **Check your balance:** Verify you have enough funds for the purchase. Remember
    that we suggest a minimum balance to waive fee of $500 to keep your account in
    good standing.

    2.  **Review recent alerts:** Check your secure messages to see if we sent a notification
    asking you to confirm a transaction.

    3.  **Confirm your identity:** Ensure your contact information is up to date so
    you can receive verification codes.


    **The Fix:**

    If the balance is sufficient and the transaction is legitimate, tell us which
    transaction was declined. We will verify your identity through our mandatory security
    protocols and then manually clear the block or authorize the transaction.


    **When we escalate:**

    If we cannot verify your identity or if we suspect your account has been compromised,
    we will move the issue to our specialized domain leads in retail banking. They
    will conduct a thorough internal investigation to secure your funds, and you will
    receive a status update via secure chat or email.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ccbbe612-37e8-57a3-a576-c6e0fa532d68
  title: Everyday Checking — when to switch or upgrade
  body: 'This guide helps support agents determine when a customer''s needs have outgrown
    the Everyday Checking account.


    **When to stay with Everyday Checking:**

    *   The customer needs a foundational, low-cost hub for daily spending.

    *   The customer prefers a $0 monthly maintenance fee.

    *   The customer maintains a modest balance (around the $500 minimum balance to
    waive fee) and primarily uses the account for liquidity.


    **When to suggest a switch or addition:**

    *   **For Growth:** If the customer has excess cash they don''t need for daily
    spending, suggest the High-Yield Savings account to earn a more competitive APY.

    *   **For Guaranteed Returns:** If the customer has a specific short-term goal
    and a lump sum they won''t need for a year, suggest the Anchor 12-Month CD.

    *   **For Rewards:** If the customer is spending heavily on travel or international
    purchases, suggest adding the Summit Travel Card to their profile.


    Everyday Checking is the best choice for those who value simplicity and zero monthly
    costs for their primary spending account.'
  domain: retail_banking
  product_category: everyday_checking
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ddb10935-411b-54b6-8f6f-82af53c8e1a7
  title: Everyday Checking — comparison vs. alternatives and when not to choose it
  body: "Choosing the right account depends on your financial goals. Everyday Checking\
    \ is designed to be a streamlined, digital-first hub for your daily money management.\n\
    \n**Why choose Everyday Checking?**\nWe designed this account for retail savers\
    \ and everyday spenders who want transparency and low friction. \n*   **Cost:**\
    \ You pay a $0 monthly maintenance fee.\n*   **Accessibility:** It provides the\
    \ immediate liquidity you need for bills and daily purchases.\n*   **Simple Requirements:**\
    \ We suggest a minimum balance to waive fee of $500 to ensure your account remains\
    \ in the best possible standing.\n\n**When NOT to choose Everyday Checking:**\n\
    While this account is excellent for spending, it is not the right tool for every\
    \ goal:\n*   **If you want high growth:** Everyday Checking is for spending, not\
    \ saving. If you want your money to grow quickly, our high-yield savings options\
    \ are a better fit.\n*   **If you have a long-term savings goal:** If you can\
    \ lock your money away for a year to get a guaranteed return, a CD is more appropriate.\n\
    *   **If you primarily need credit:** This is a deposit account. For rewards on\
    \ spending, look at our credit card options.\n\n**Comparison at a Glance:**\n\
    *   **Everyday Checking:** $0 monthly maintenance fee; designed for liquidity\
    \ and daily use.\n*   **Savings/CDs:** Designed for earning APY; higher restrictions\
    \ on withdrawals but better for growth.\n\n**Key Fees to Consider:**\n*   **Overdraft\
    \ Fee:** $34 (charged when you spend more than you have).\n*   **ATM Out-of-Network\
    \ Fee:** $2.5 (charged when using non-Northwind ATMs).\n\nAll deposits are FDIC-insured.\
    \ For a full breakdown of costs, see Everyday Checking — fee schedule."
  domain: retail_banking
  product_category: everyday_checking
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 9c738f34-f1a8-5994-a2a1-569b797c5e35
  title: Everyday Checking — cost and charges
  body: '**Is there a monthly fee to keep my account open?**

    No. We provide a $0 monthly maintenance fee for Everyday Checking, meaning there
    is no cost just to have the account.


    **What is the minimum balance I should keep?**

    We have a minimum balance to waive fee of $500. While the maintenance fee is already
    $0, maintaining this balance ensures you meet our standard suitability profiles
    for the account.


    **What are the most common fees I should know about?**

    *   **Overdrafts:** If you spend more than is in your account, you will be charged
    an overdraft fee of $34 per occurrence.

    *   **Non-Northwind ATMs:** Using an ATM outside our network results in an atm
    out of network fee of $2.5 per transaction.


    For a complete list of all possible charges, please see Everyday Checking — fee
    schedule.'
  domain: retail_banking
