- id: 74d8850c-600d-5bbe-b6e2-e3208f7c8b6d
  title: When to use manage_authorized_users
  body: 'We allow our cardholders to extend the utility of their accounts by adding
    authorized users. This is common for families or business partners who need access
    to the same credit line. This capability is available for our credit products,
    such as the Horizon Cashback Card and the Summit Travel Card.


    Agents should use this procedure when a primary account holder requests to add
    a new authorized user, remove an existing one, or update the details of a current
    authorized user.


    Steps to manage authorized users:

    1. Verify the primary account holder''s identity using the mandatory multi-factor
    authentication and identity verification protocols. No modifications to authorized
    users are permitted without this validation.

    2. Use the get_accounts tool to locate the specific credit account that requires
    the modification.

    3. For adding a user: Collect the full legal name, date of birth, and Social Security
    number of the person to be added.

    4. For removing a user: Confirm the identity of the specific authorized user to
    be removed from the account.

    5. Call the manage_authorized_users tool with the appropriate action (add/remove)
    and the required user details.

    6. Inform the customer that a new card will be issued to the authorized user (if
    adding) or that the existing card has been deactivated (if removing).


    Agents must remind the primary account holder that they remain legally responsible
    for all charges incurred by any authorized user on the account. For details on
    the costs associated with these cards, agents can refer to the Horizon Cashback
    Card — fee schedule or the Summit Travel Card — fee schedule.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: northwind_bank
- id: 5897ea66-0b37-5943-9ce8-f5886c0e24e3
  title: manage_authorized_users tool reference
  body: 'The manage_authorized_users tool is used to modify the list of individuals
    permitted to make charges on a credit account.


    **Tool Signature and Arguments:**

    - `account_id`: The unique identifier of the credit account.

    - `action`: The type of modification to perform (''add'' or ''remove'').

    - `user_details`: The personal information of the user (Name, DOB, SSN) for additions,
    or the user identifier for removals.


    **Effect:**

    Calling this tool updates the account''s authorized user list. If adding, it triggers
    the issuance of a new physical card. If removing, it immediately voids the removed
    user''s card access. The agent performs this action by calling the tool directly.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: northwind_bank
