- id: 1ec02a0b-95ac-5d54-9487-8975703674f8
  title: Summit Travel Card — annual fee explained
  body: 'Q: How much is the annual fee for the Summit Travel Card?

    A: The Summit Travel Card has an annual fee of $95. This fee allows us to provide
    premium benefits, such as the 3% travel rewards rate and the 0% foreign transaction
    fee.


    Q: When is the annual fee charged to my account?

    A: The annual fee is typically charged to your account once per year, usually
    on the anniversary of your account opening.


    Q: Can the annual fee be waived?

    A: Unlike our Everyday Checking account, the Summit Travel Card annual fee of
    $95 is a standard cost of the premium rewards tier and is not waivable through
    minimum balance requirements. For a no-annual-fee option, you may wish to look
    at the Horizon Cashback Card — overview.'
