- id: 3465b9e3-325f-5d4e-a014-7926b51141de
  title: Anchor 12-Month CD — vs. a typical competitor offering
  body: 'When comparing the Anchor 12-Month CD to typical offerings from other traditional
    banks, the primary differences lie in transparency and the cost of early access.


    **Anchor 12-Month CD**

    * **Yield:** Fixed 4.5% APY for the full term.

    * **Lock-in:** 12 months.

    * **Early Access Cost:** A penalty of 90 days of interest.

    * **Minimum to Start:** $1000.


    **Typical Competitor Offering**

    * **Yield:** Often lower base rates or ''teaser'' rates that drop after a few
    months.

    * **Lock-in:** Similar term lengths, but often with more complex renewal clauses.

    * **Early Access Cost:** Penalties can vary wildly, sometimes consuming all earned
    interest or even eating into the principal.

    * **Minimum to Start:** May have lower minimums, but often with lower APYs.


    **Which one should you choose?**

    Choose the Anchor 12-Month CD if you value a guaranteed, competitive 4.5% return
    and have at least $1000 you can commit for a year. A competitor''s product might
    be better if you require a much lower opening deposit and are willing to accept
    a lower yield in exchange.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 20ae7919-0dec-5e32-9dbb-db098464fada
  title: Anchor 12-Month CD — risk disclosures
  body: 'Please review the following regulatory and risk disclosures regarding the
    Anchor 12-Month CD.


    **Liquidity Risk**

    The Anchor 12-Month CD is a time-deposit account. This means your funds are intended
    to remain in the account for the full 12 months. While you can access your money
    before the term ends, doing so incurs a financial cost. Specifically, an early
    withdrawal penalty equal to 90 days of interest will be applied to your balance.
    This may result in a loss of a significant portion of your earned interest.


    **Rate Guarantee**

    The 4.5% APY is fixed for the duration of the 12-month term. While this protects
    you from falling market rates, it also means you will not benefit from any rate
    increases that may occur during the term of your CD.


    **Deposit Insurance**\All retail deposits at Northwind Bank are FDIC-insured.
    This insurance covers your principal and accrued interest up to the maximum amount
    allowed by federal law.


    **Suitability**\Northwind Bank recommends the Anchor 12-Month CD based on a standard
    of suitability. This product is appropriate for customers with a stated goal of
    guaranteed growth and a financial profile that allows for a 12-month lock-up of
    funds. We provide financial education and product comparisons but do not provide
    individualized tax, legal, or investment advice.


    **Regulatory Compliance**\We strictly adhere to CFPB, Federal Reserve, and FDIC
    guidelines. All disclosures are provided in accordance with Regulation Z and Regulation
    E where applicable.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 7ec0ef7f-941a-5984-ad72-8d5093d8d7eb
  title: Anchor 12-Month CD — how rates are tiered and applied
  body: 'The Anchor 12-Month CD uses a flat-rate pricing model. There are no tiers
    based on balance; the same rate applies to all eligible accounts regardless of
    the amount deposited above the minimum.


    * **Annual Percentage Yield (APY):** 4.5%

    * **Application:** This rate applies to the entire balance of the account from
    the date of the initial deposit.

    * **Minimum Deposit Required:** $1000


    **How the rate is applied:**

    The 4.5% APY is fixed for the 12 months of the term. Interest is compounded and
    credited to your account. Because the rate is fixed, it will not change regardless
    of fluctuations in the federal funds rate or other market indices during your
    term. The only event that would alter your total return is an early withdrawal,
    which triggers a penalty of 90 days of interest.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
