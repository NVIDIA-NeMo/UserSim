- id: 54092b03-22ff-59bb-9791-4fcfd50913f2
  title: Anchor 12-Month CD — term months explained
  body: 'Q: What does the 12-month term actually mean for my money?

    A: The term represents the length of time you agree to keep your deposit with
    us to earn the guaranteed rate. For the Anchor 12-Month CD, this term is exactly
    12 months. If you withdraw your funds before this period ends, you will incur
    a penalty.


    Q: Can I add more money to my CD after it has been opened?

    A: The Anchor 12-Month CD is funded with a minimum deposit of $1000 at the time
    of opening. Once the account is established, the deposit is fixed for the 12 months
    term; additional deposits cannot be made to the same CD certificate.


    Q: What happens when the 12 months are up?

    A: At the end of the term, your initial deposit and the earned interest are available
    for withdrawal, or you may choose to roll the balance into a new term. For more
    details on costs, please see Anchor 12-Month CD — fee schedule.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: faq
