- id: e7ca2d77-f00a-5bfe-88b1-7e494d8590b8
  title: Everyday Checking — choosing between tiers or options
  body: 'When deciding how to manage your daily money, it is important to choose the
    account that fits your spending habits. Everyday Checking is our foundational
    hub for daily liquidity.


    **Everyday Checking Key Figures:**

    * Monthly Maintenance Fee: $0

    * Min Balance to Waive Fee: $500

    * Overdraft Fee: $34

    * Out-of-Network ATM Fee: $2.5


    **Comparison Points**

    If you are looking for a place to grow your money rather than spend it, you might
    consider our High-Yield Savings account. While Everyday Checking is best for paying
    bills and daily purchases, a savings account is designed for emergency funds and
    short-term goals.


    **Who it suits:**

    * **Everyday Checking:** Best for the retail spender who wants a low-friction,
    transparent account for their primary income and daily expenses.

    * **High-Yield Savings:** Best for those who want a higher APY and do not need
    the high-frequency liquidity of a checking account.


    For more details on how this compares to other banks, see Everyday Checking —
    vs. a typical competitor offering.'
