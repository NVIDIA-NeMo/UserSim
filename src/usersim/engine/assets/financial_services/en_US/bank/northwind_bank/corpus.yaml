- id: 9bbdb975-494a-5ffc-a7fa-b8bb525a89f6
  title: Anchor 12-Month CD — vs. a similar product here
  body: 'When choosing between the Anchor 12-Month CD and the Northwind High-Yield
    Savings, the decision comes down to your need for liquidity versus your desire
    for a guaranteed rate.


    Anchor 12-Month CD:

    * Yield: 4.5% APY (Fixed)

    * Lock-in: Funds are held for a 12 months term.

    * Access: Early withdrawal incurs a penalty of 90 days of interest.

    * Best for: Guaranteed returns on money you won''t need for a year.


    Northwind High-Yield Savings:

    * Yield: Variable APY (can change based on market conditions).

    * Lock-in: No fixed term.

    * Access: Highly liquid for emergency funds.

    * Best for: Short-term goals or emergency funds where you need immediate access.


    If you need a safe place for your ''rainy day'' fund, the Northwind High-Yield
    Savings is the better choice. If you have $1000 or more that you can set aside
    for a full year to maximize earnings, the Anchor 12-Month CD is the superior option.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 4f6eb3e0-f8bd-55c6-9511-3da3bb4aeee0
  title: Anchor 12-Month CD — regulatory disclosures
  body: 'This account is subject to the following regulatory disclosures and terms:


    Deposit Insurance: All retail deposits in the Anchor 12-Month CD are FDIC-insured
    up to the maximum allowable limit. This ensures the safety of your principal deposit.


    Interest and APY: The Annual Percentage Yield (APY) is 4.5%. APY reflects the
    real rate of return earned on a deposit including the effect of compounding interest.
    This rate is fixed for the duration of the 12 months term.


    Early Withdrawal: We prioritize transparency regarding fund access. If you withdraw
    funds from the Anchor 12-Month CD before the maturity date, a penalty equal to
    90 days of interest will be applied. This penalty may reduce your principal balance
    if earned interest is insufficient to cover the cost.


    Regulatory Compliance: Northwind Bank strictly adheres to CFPB, Federal Reserve,
    and FDIC guidelines. We prioritize transparency in all disclosures related to
    deposit accounts. We provide financial education and product comparisons but do
    not provide individualized tax, legal, or investment advice. Our recommendations
    are based on a standard of suitability relative to your stated goals.


    For more information on how we handle electronic transfers and your rights, please
    refer to the definition of Regulation E in our general glossary.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 4d2f1b63-47e2-5aad-bea0-2e4079415bad
  title: Anchor 12-Month CD — interest rate / APY schedule
  body: 'The Anchor 12-Month CD provides a stable, fixed return on your investment.
    Unlike variable savings accounts, your rate is locked for the entire duration
    of the term.


    * Current APY: 4.5%

    * Applicability: This rate applies to all balances meeting the minimum deposit
    of $1000.

    * Term: 12 months


    Because this is a fixed-rate certificate, the 4.5% APY will not change regardless
    of market fluctuations during your 12 months term. Interest is compounded and
    credited to your account automatically. The only factor that would change the
    total interest earned is an early withdrawal, which would trigger the 90 days
    of interest penalty.'
