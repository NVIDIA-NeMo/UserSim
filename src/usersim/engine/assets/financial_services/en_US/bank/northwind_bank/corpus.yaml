- id: 32b1dd1d-60d6-53e0-918b-e6c4d0752c02
  title: Summit Travel Card — foreign transaction fee explained
  body: 'Q: What is a foreign transaction fee, and do I have to pay one with this
    card?


    A foreign transaction fee is a surcharge some banks apply when you make a purchase
    in a foreign currency or with a merchant located outside the United States. With
    the Summit Travel Card, we maintain a foreign transaction fee of 0%. This means
    you will not be charged extra for spending your money abroad.


    Q: Does the 0% fee apply to ATM withdrawals abroad?


    This 0% fee specifically applies to purchases and credit transactions. For other
    types of international activity, please review the Summit Travel Card — fee schedule
    to see all applicable costs.


    Q: Do I need to notify the bank before using my card in another country?


    While the 0% fee makes the card ideal for travel, we recommend letting us know
    your travel dates so we don''t accidentally block your transactions for your protection.'
  domain: cards
  product_category: summit_travel_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: e80be645-6ca0-5186-9b8a-390d259ea317
  title: Summit Travel Card — check status or history
  body: 'Follow these steps to review your recent spending, check your current balance,
    or see your rewards progress on your Summit Travel Card.


    Prerequisites:

    You must have your account details ready and be prepared to complete our identity
    verification process.


    Steps:

    1. Tell us that you would like to see your recent transaction history or your
    current account status.

    2. We will perform a mandatory identity verification. This may include multi-factor
    authentication to ensure your PII (Personally Identifiable Information) remains
    secure.

    3. Once verified, tell us the specific time frame you are interested in (e.g.,
    ''the last 30 days'' or ''the current billing cycle'').

    4. We will provide you with a list of transactions, including the date, merchant
    name, and the amount charged.

    5. To check your rewards, ask us for your current travel rewards balance. We will
    confirm the total amount you have earned at the 3% rewards rate for your travel
    spending.


    How you know it worked:

    You will receive a clear summary of your recent charges and a confirmed total
    of your available rewards points or credit. If you are checking your status, we
    will confirm your current balance and your next payment due date.'
  domain: cards
  product_category: summit_travel_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 82bd2eca-128a-55f3-a8b0-96cb841aede9
  title: Summit Travel Card — a declined or blocked action
  body: 'Symptom: Your Summit Travel Card was declined at a merchant, or you are unable
    to complete an online transaction.


    Likely Causes:

    * Fraud Prevention: We may have blocked a transaction if it appeared unusual,
    especially if it occurred in a foreign country without prior notice.

    * Credit Limit: You may have reached the maximum credit limit assigned to your
    account.

    * Account Status: The card may be frozen or expired.

    * Verification Failure: For online purchases, the merchant may have rejected the
    transaction due to a mismatch in billing address or CVV.


    What to check in order:

    1. Verify the balance: Check if you have enough available credit for the purchase.

    2. Check card status: Ensure the card is active and not frozen.

    3. Review recent activity: Look for any notifications from us regarding suspicious
    activity.


    How to fix it:

    1. Tell us which transaction was declined and where it occurred.

    2. We will verify your identity using our mandatory multi-factor authentication
    process.

    3. If the block was caused by our fraud systems, we will lift the restriction
    once your identity is validated.

    4. If the card is frozen, we will unfreeze it for you immediately upon successful
    verification.


    When we escalate:

    If we cannot determine why the transaction is failing or if there is a technical
    error with the card''s chip or stripe, we will raise a case to our specialized
    domain leads in credit cards. You will receive a notification once the technical
    review is complete and, if necessary, we will order a replacement card for you.'
  domain: cards
  product_category: summit_travel_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: a7c142df-e133-5a19-866d-595c74bee744
  title: Summit Travel Card — when to switch or upgrade
  body: 'Deciding whether to use the Summit Travel Card or the Horizon Cashback Card
    depends on your spending habits and travel frequency.


    Summit Travel Card:

    * Annual Fee: $95

    * Key Benefit: 3% rewards rate on travel and 0% foreign transaction fees.

    * Best for: Frequent travelers and international spenders who want to maximize
    rewards on flights, hotels, and foreign purchases.


    Horizon Cashback Card:

    * Annual Fee: $0 (no annual fee)

    * Key Benefit: Simple, everyday rewards without a yearly cost.

    * Best for: Everyday spenders who prefer a low-friction, no-fee credit option
    and do not travel internationally often.


    If your annual travel spending is high enough that the 3% rewards and 0% foreign
    fees outweigh the $95 annual fee, the Summit Travel Card is the superior choice.
    However, if you rarely leave the country and prefer a card with no yearly cost,
    the Horizon Cashback Card is a better fit.'
  domain: cards
  product_category: summit_travel_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 11c8894c-253f-5d8d-abc5-60cbfc0495d5
  title: Summit Travel Card — comparison vs. alternatives and when not to choose it
  body: 'The Summit Travel Card is a premium rewards card tailored for frequent travelers
    and international spenders. To help you decide if it is the right fit, we have
    compared its core values against common alternatives.


    Core Values:

    * Travel Rewards Rate: 3%

    * Foreign Transaction Fee: 0%

    * Annual Fee: $95

    * Purchase APR: 23.49%


    When to choose the Summit Travel Card:

    * You travel internationally several times a year and want to avoid the typical
    1% to 3% foreign transaction fees charged by other banks.

    * You spend significantly on travel-related categories and want to earn a high
    3% return on those purchases.

    * You value a streamlined digital-first experience for managing your travel rewards.


    When NOT to choose this card:

    * You are a low-volume spender: If you do not spend enough on travel to earn back
    the $95 annual fee through the 3% rewards, the cost may outweigh the benefits.

    * You want a free card: If you prefer a card with no annual fee for simple daily
    use, the Horizon Cashback Card is a more suitable option.

    * You primarily make domestic purchases: The 0% foreign transaction fee provides
    no value if you do not spend money outside the US.


    Comparing with the Horizon Cashback Card:

    While the Horizon Cashback Card is an accessible, no-annual-fee option for everyday
    rewards, it lacks the specialized 3% travel rate and 0% foreign transaction fee
    that make the Summit Travel Card a powerhouse for global travelers.'
  domain: cards
  product_category: summit_travel_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 8fb5f07c-a28c-5c07-922f-6682793febef
  title: Summit Travel Card — cost and charges
  body: 'Q: What are the primary costs associated with the Summit Travel Card?


    The main cost is an annual fee of $95. Additionally, if you carry a balance from
    month to month, you will be charged a purchase APR of 23.49%.


    Q: Are there fees for using my card outside of the US?


    No. We believe in transparency and low-friction travel, so the Summit Travel Card
    has a foreign transaction fee of 0%.


    Q: How does the rewards system work?


    You earn a 3% rewards rate on travel-related purchases. These rewards are designed
    to help offset the cost of the $95 annual fee and provide value for your future
    trips.


    For a full list of all potential charges, please see the Summit Travel Card —
    fee schedule.'
  domain: cards
  product_category: summit_travel_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: a1c6ccb8-bdae-51d8-8f47-c64a2892b91c
  title: Summit Travel Card — resolve a common request end-to-end
  body: 'This guide explains how to request a travel reward redemption to apply your
    earnings toward your balance.


    Prerequisites:

    You must have a positive rewards balance accumulated from your travel spending
    at the 3% rate.


    Steps:

    1. Tell us that you would like to redeem your travel rewards to pay down your
    current balance.

    2. We will start by verifying your identity. This is a mandatory security step
    that includes multi-factor authentication to protect your account.

    3. Once verified, tell us the amount of rewards you wish to redeem (e.g., ''I
    want to redeem $50 of my rewards'').

    4. We will check your available rewards balance. If you have sufficient funds,
    we will apply that amount as a statement credit to your account.

    5. We will then provide you with your new updated balance and the remaining rewards
    balance available for future use.


    How you know it worked:

    You will receive a confirmation message stating the exact amount of the credit
    applied to your account. You can then verify this by asking for your transaction
    history, where the redemption will appear as a credit.'
  domain: cards
  product_category: summit_travel_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 50758a5b-b0c9-50dd-84b9-91b83591bff3
  title: Summit Travel Card — a discrepancy in your records or statement
  body: 'Symptom: You notice a charge on your Summit Travel Card statement that you
    do not recognize, or the 3% travel reward was not applied to a specific transaction.


    Likely Causes:

    * Pending Transactions: The merchant may have placed a temporary hold that looks
    like a charge.

    * Merchant Coding: The merchant may be coded as ''general retail'' rather than
    ''travel,'' preventing the 3% rewards rate from applying.

    * Unauthorized Activity: The transaction may be fraudulent.

    * Processing Error: A technical glitch may have resulted in a duplicate charge.


    What to check in order:

    1. Review the merchant name: Sometimes a parent company name appears instead of
    the store name.

    2. Check the date: Ensure the transaction didn''t occur on a different date than
    you remember.

    3. Confirm the category: Check if the purchase was definitely travel-related.


    How to fix it:

    1. Tell us the specific transaction date and amount that you are disputing or
    questioning.

    2. We will verify your identity through our mandatory multi-factor authentication
    process.

    3. If it is a rewards discrepancy, we will review the merchant category code.
    If it was miscoded, we will manually apply the 3% reward to that transaction.

    4. If it is an unauthorized charge, we will initiate a dispute. In accordance
    with Regulation E, we prioritize the rapid resolution of unauthorized transactions
    and will protect you first while we investigate.


    When we escalate:

    If the discrepancy involves a complex merchant dispute or a systemic billing error,
    we will route the issue to our specialized domain leads in credit cards. They
    will conduct a thorough internal investigation and notify you of the final resolution
    within the legally mandated timelines.'
  domain: cards
  product_category: summit_travel_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 5f4b798d-8815-57a9-8a06-5bfd80194233
  title: Institution-wide fees and charges
  body: 'At Northwind Bank, we believe in a low-friction pricing model. Our fees are
    designed to discourage account misuse rather than to generate revenue for the
    bank.


    General Institutional Fees:

    * Standard Account Maintenance: Varies by product (see individual product fee
    schedules).

    * Overdraft Fees: Applied when an account has a deficit caused by drawing more
    money than it holds. Specific costs depend on the account type.

    * Specialized Service Fees: Certain manual administrative requests may incur a
    charge.


    Many of our everyday fees, particularly for our Everyday Checking accounts, can
    be easily waived by meeting simple minimum balance requirements. We encourage
    all customers to review their specific product terms to understand how to avoid
    these charges.'
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: d7c0353d-e9c4-5393-bca9-65c974533e0e
  title: General frequently asked questions
  body: 'Q: How can I contact Northwind Bank for support?

    A: We are available to help you via secure chat, email, and phone during Eastern
    Time (ET) business hours.


    Q: What happens if my issue is too complex for the first person I speak with?

    A: If a first-tier agent cannot resolve your request, we will escalate your case
    to a specialized domain lead in either retail banking or credit cards to ensure
    a proper resolution.


    Q: How do I start a dispute for a transaction I don''t recognize?

    A: We prioritize the rapid resolution of unauthorized transactions. Please follow
    the steps outlined in When to use file_transaction_dispute to begin the process.


    Q: Is my money safe at Northwind Bank?

    A: Yes. All retail deposits are FDIC-insured, and we strictly adhere to CFPB and
    Federal Reserve guidelines to protect your funds and data.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 69ae8bbe-2822-5645-ab91-aa64fb499445
  title: Regulatory notes for retail_banking
  body: 'Northwind Bank operates under a strict compliance framework to ensure the
    fair treatment of our retail banking customers. All agents must adhere to the
    following mandates:


    1. FDIC Insurance: All retail deposits are FDIC-insured. Agents must be transparent
    about this coverage when discussing deposit accounts like Northwind High-Yield
    Savings or Anchor 12-Month CD.


    2. Regulation E Compliance: We are bound by Regulation E, the federal rule governing
    electronic fund transfers. This includes strict timelines for the resolution of
    unauthorized transactions. Agents must prioritize the consumer first during the
    initial reporting phase of a dispute while the bank conducts its internal investigation.


    3. CFPB and Federal Reserve Guidelines: We strictly adhere to all CFPB and Federal
    Reserve guidelines regarding data privacy and consumer protection. Any action
    that involves the disclosure of Personally Identifiable Information (PII) or a
    state-changing account modification requires successful identity validation via
    mandatory multi-factor authentication.


    4. Suitability Standard: While we provide financial education and product comparisons,
    we do not provide individualized tax, legal, or investment advice. Agents must
    maintain a standard of suitability, recommending products (such as our various
    savings or checking options) based solely on the customer''s stated goals and
    financial profile.


    Failure to adhere to these regulatory standards may result in compliance violations
    for the institution.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: e7ebf501-49f8-5154-823b-b9c83e62a526
  title: Regulatory notes for cards
  body: 'Agents handling credit products, including the Horizon Cashback Card and
    Summit Travel Card, must ensure all communications comply with federal lending
    laws.


    1. Regulation Z Disclosures: We prioritize full transparency in all Regulation
    Z disclosures. This includes the clear communication of Annual Percentage Rates
    (APR), fee structures, and grace periods. Agents must never paraphrase or approximate
    these figures; they must be delivered exactly as stated in the official rate sheets.


    2. Identity Verification: No account modifications, limit changes, or PII disclosures
    are permitted without rigorous identity verification. Multi-factor authentication
    is mandatory before any state-changing action is performed on a credit account.


    3. Fair Treatment: In accordance with CFPB guidelines, all cardholders must be
    treated fairly. This includes the transparent application of rewards and the consistent
    handling of late fees or interest charges.


    4. Fraud Response: When a customer reports a lost or stolen card, or unauthorized
    charges, agents must act immediately to mitigate risk. This typically involves
    freezing the card and initiating a dispute process under the timelines established
    by federal law and internal policy.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 60687397-b155-58f5-a2f6-b2487640b35f
  title: When to use get_account_transactions
  body: 'The get_account_transactions tool is used to retrieve a detailed list of
    recent financial activity for a specific account. This is a read-only action and
    should be used whenever a customer asks about their spending, questions a specific
    charge, or needs to verify if a deposit has cleared.


    Procedure:

    1. Verify the customer''s identity using mandatory multi-factor authentication.

    2. Use get_accounts to resolve the customer''s account_id if they have only provided
    the last 4 digits of the account number.

    3. Once the account_id is confirmed, call the get_account_transactions tool to
    retrieve the ledger of activity.

    4. Review the returned transactions with the customer to identify the specific
    entry in question.


    This tool should be the primary method for resolving discrepancies in records.
    If the customer identifies a transaction they believe is unauthorized after using
    this tool, the agent should then proceed to the dispute process as outlined in
    When to use file_transaction_dispute.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: northwind_bank
- id: fead1eed-bb45-5056-b190-98812e731b2c
  title: get_account_transactions tool reference
  body: "The get_account_transactions tool retrieves a list of transactions for a\
    \ specified account. \n\nArguments:\n* account_id (required): The unique identifier\
    \ for the bank account.\n\nEffect:\nReturns a list of recent transactions, including\
    \ dates, amounts, and descriptions. \n\nAgent Note: The agent performs this action\
    \ by calling the tool directly within the conversation interface. This is a read-only\
    \ tool and does not modify account state."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: northwind_bank
- id: 5303361c-2523-5a0c-aa40-71a57d576404
  title: When to use file_transaction_dispute
  body: 'Northwind Bank prioritizes the rapid resolution of unauthorized transactions.
    The file_transaction_dispute tool is the authoritative mechanism for initiating
    a formal investigation into a contested charge.


    Procedure:

    1. Verify the customer''s identity through mandatory multi-factor authentication.

    2. Use get_accounts to identify the correct account_id associated with the transaction.

    3. Use get_account_transactions to locate the specific transaction_id that the
    customer is disputing.

    4. Confirm the reason for the dispute (e.g., unauthorized transaction, duplicate
    charge, or incorrect amount).

    5. Call the file_transaction_dispute tool using the account_id and transaction_id
    to log the claim.


    Compliance Note: All disputes are handled in strict accordance with Regulation
    E timelines. Our philosophy is to protect the consumer first while we conduct
    a thorough internal investigation. Agents must inform the customer that the dispute
    has been filed and provide the expected timeline for resolution based on Regulation
    E.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: northwind_bank
- id: 1344773b-05ce-5748-ba29-032cbbb63279
  title: file_transaction_dispute tool reference
  body: "The file_transaction_dispute tool initiates a formal investigation into a\
    \ specific transaction.\n\nArguments:\n* account_id (required): The unique identifier\
    \ for the account.\n* transaction_id (required): The unique identifier for the\
    \ specific transaction being contested.\n\nEffect:\nLogs a dispute against the\
    \ transaction and triggers the internal investigation process. \n\nAgent Note:\
    \ The agent performs this action by calling the tool directly. This is a state-changing\
    \ action and requires identity verification before execution."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: northwind_bank
- id: 1f4a79ce-570e-589c-a0e3-eaacb4ff494d
  title: When to use freeze_card
  body: 'The freeze_card tool is used to immediately disable a debit or credit card
    to prevent further unauthorized spending. This is the first line of defense when
    a customer reports a card as lost, stolen, or compromised.


    Procedure:

    1. Verify the customer''s identity using mandatory multi-factor authentication.

    2. Use get_accounts to locate the card associated with the customer''s profile
    and retrieve the necessary identifier.

    3. Call the freeze_card tool immediately to stop all new transactions on the card.

    4. Once the card is frozen, advise the customer on the next steps, such as using
    order_replacement_card if the card is permanently lost, or filing a dispute via
    file_transaction_dispute if fraudulent charges have already occurred.


    This action is reversible if the card is found, but it must be executed instantly
    upon the customer''s request to minimize potential loss. No card may be frozen
    without successful identity validation.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: northwind_bank
- id: 16fffc9c-5630-5244-942d-0f66ae01e33b
  title: freeze_card tool reference
  body: 'The freeze_card tool immediately disables a payment card to prevent further
    transactions.


    Arguments:

    * card_id (required): The unique identifier for the card to be frozen.


    Effect:

    Sets the card status to ''frozen'', blocking all new authorizations.


    Agent Note: The agent performs this action by calling the tool directly. This
    is a state-changing action and requires rigorous identity verification before
    it can be executed.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: northwind_bank
- id: efd46a82-b9ad-5af7-8079-c1eaf7ba0488
  title: When to use get_accounts
  body: 'At Northwind Bank, we believe in starting every interaction with a clear
    understanding of the customer''s relationship with us. The get_accounts tool is
    the primary mechanism for identifying which products a customer holds and retrieving
    the specific account identifiers necessary to perform further actions.


    Agents must use this tool in the following scenarios:

    1. Initial Account Identification: When a customer references an account by a
    partial number (such as the last four digits) or a product name (e.g., Everyday
    Checking), agents must use get_accounts to resolve the full account_id.

    2. Portfolio Overview: When a customer asks ''What accounts do I have?'' or ''What
    is my total balance across all accounts?'', this tool provides the comprehensive
    list.

    3. Verification of Product Eligibility: Before recommending a new product or modifying
    an existing one, agents should use get_accounts to see if the customer already
    possesses a similar product.


    Procedural Steps:

    1. Perform mandatory identity verification as per our security standards to ensure
    PII is protected.

    2. Call the get_accounts tool to retrieve a list of all active and inactive accounts
    associated with the verified customer profile.

    3. Match the retrieved account_id to the customer''s request (e.g., matching a
    last-4 digit request to the corresponding account_id).

    4. Use the identified account_id for any subsequent state-changing or read-only
    tools.


    We prioritize transparency and security; therefore, no account details should
    be disclosed or acted upon until get_accounts has been used to confirm the specific
    account being discussed.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: northwind_bank
- id: f1671ba9-5dbf-5763-9363-0911929648ff
  title: get_accounts tool reference
  body: "The get_accounts tool allows an agent to retrieve a complete list of all\
    \ financial accounts held by a customer at Northwind Bank. \n\n**Tool Signature:**\
    \ `get_accounts()`\n\n**Arguments:** This tool does not require any input arguments\
    \ as it operates on the currently verified customer session.\n\n**Effect:** Returns\
    \ a list of accounts, including the account_id, product type (such as Everyday\
    \ Checking, Northwind High-Yield Savings, Anchor 12-Month CD, Horizon Cashback\
    \ Card, or Summit Travel Card), current balance, and account status.\n\n**Agent\
    \ Execution:** The agent performs this action by calling the tool directly within\
    \ the chat interface. This is a read-only operation used to establish the context\
    \ of the customer's holdings before proceeding with other service requests."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: northwind_bank
- id: 6a6bda16-64b8-5037-873e-ed2794f12b0b
  title: When to use open_account
  body: 'Northwind Bank focuses on a streamlined, digital-first experience for our
    retail savers and spenders. The open_account tool is used to instantiate new financial
    relationships or add additional products to an existing customer''s profile.


    Agents should utilize this tool when a customer expresses a goal that matches
    one of our product positionings:

    - For daily spending and liquidity: Everyday Checking.

    - For emergency funds or short-term goals: Northwind High-Yield Savings.

    - For guaranteed returns over a fixed term: Anchor 12-Month CD.

    - For simple everyday rewards: Horizon Cashback Card.

    - For international spending and travel rewards: Summit Travel Card.


    Procedural Steps:

    1. Conduct a suitability assessment by asking the customer about their financial
    goals and profile.

    2. Verify the customer''s identity using mandatory multi-factor authentication.

    3. Confirm the customer meets the specific requirements for the chosen product
    (refer to the relevant product eligibility matrix).

    4. Call the open_account tool, specifying the desired product_id (e.g., ''everyday_checking'').

    5. Provide the customer with the legally mandated disclosures and the initial
    funding requirements associated with the new account.


    We do not provide individualized investment or tax advice; we recommend products
    based on the suitability of the product''s features relative to the customer''s
    stated goals.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: northwind_bank
- id: 26a1f4ab-ea1d-52a1-98c8-b66bb0eb91fb
  title: open_account tool reference
  body: "The open_account tool is used to create a new account for a verified customer.\
    \ \n\n**Tool Signature:** `open_account(product_id: string)`\n\n**Arguments:**\
    \ \n- `product_id`: The unique identifier for the product to be opened (e.g.,\
    \ 'everyday_checking', 'high_yield_savings', 'anchor_cd_12mo', 'horizon_cashback_card',\
    \ or 'summit_travel_card').\n\n**Effect:** Initiates the account opening process,\
    \ assigns a new account_id to the customer, and sets up the initial account structure\
    \ based on the product's terms.\n\n**Agent Execution:** The agent performs this\
    \ action by calling the tool directly. This is a state-changing operation that\
    \ requires successful identity validation before the tool can be executed."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: northwind_bank
- id: 6792a689-8faa-511b-8fae-0a570af5b2f3
  title: When to use close_account
  body: 'Closing an account is an irreversible action. We aim to make this process
    clear and professional while ensuring all regulatory obligations are met. The
    close_account tool is the authoritative mechanism for terminating a product relationship.


    Agents must follow these steps before executing a closure:

    1. Identity Validation: Perform rigorous identity verification. No account modifications
    are permitted without successful validation.

    2. Balance Resolution: Use get_accounts to check the current balance. If the account
    has a positive balance, the agent must assist the customer in transferring funds
    via transfer_funds or issuing a final payment.

    3. Overdraft Check: Ensure there is no deficit (overdraft) in the account. Any
    outstanding debts must be resolved before the account can be closed.

    4. Confirmation: Explicitly confirm with the customer that they wish to permanently
    close the account and understand that this action is irreversible.

    5. Tool Execution: Call the close_account tool using the specific account_id.


    Special Considerations:

    - For Anchor 12-Month CD, agents must inform the customer about early withdrawal
    penalties if the term has not yet expired.

    - For credit cards (Horizon Cashback Card or Summit Travel Card), ensure all outstanding
    balances are paid in full.


    Once the tool is called, the account status is updated to closed, and no further
    transactions can be processed against that account_id.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: northwind_bank
- id: 35afa2f8-3a5b-53c7-ad96-96e79e2dd248
  title: close_account tool reference
  body: "The close_account tool permanently terminates a customer's account. \n\n\
    **Tool Signature:** `close_account(account_id: string)`\n\n**Arguments:** \n-\
    \ `account_id`: The unique identifier of the account to be closed.\n\n**Effect:**\
    \ Changes the account status to 'Closed'. This action is irreversible. All associated\
    \ electronic access to the account is revoked.\n\n**Agent Execution:** The agent\
    \ performs this action by calling the tool directly. Due to the irreversible nature\
    \ of this tool, it must only be called after strict identity verification and\
    \ confirmation that the account balance is zero."
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: northwind_bank
- id: dcb307ed-b424-57f3-8368-6ee6321b70a1
  title: When to use update_contact_info
  body: 'Maintaining accurate contact information is critical for the delivery of
    regulatory disclosures and the security of our customers'' accounts. The update_contact_info
    tool is used to modify the PII (Personally Identifiable Information) associated
    with a customer''s profile.


    Agents should use this tool when a customer reports a change in:

    - Residential or mailing address.

    - Primary phone number.

    - Email address used for digital notifications and secure chat.


    Procedural Steps:

    1. Rigorous Verification: Because this tool modifies PII, agents must perform
    full multi-factor authentication. No contact information may be changed without
    successful identity validation.

    2. Information Collection: Clearly document the new information provided by the
    customer.

    3. Tool Execution: Call the update_contact_info tool with the updated details.

    4. Confirmation: Confirm to the customer that their records have been updated
    and advise them to check their secure inbox for a confirmation notice.


    Security Note: If a customer requests a change to a sensitive field (such as an
    email address) and the request seems suspicious, agents should escalate the matter
    to a specialized domain lead in retail banking for further review to prevent account
    takeover attempts.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: northwind_bank
- id: 0c1dddfd-b0f0-5d7e-bbf0-bfacfe39dc89
  title: update_contact_info tool reference
  body: 'The update_contact_info tool modifies the primary contact details for a customer
    profile.


    **Tool Signature:** `update_contact_info(email: string, phone: string, address:
    string)`


    **Arguments:**

    - `email`: The new email address (optional if only other fields are changing).

    - `phone`: The new phone number (optional if only other fields are changing).

    - `address`: The new physical address (optional if only other fields are changing).


    **Effect:** Updates the customer''s global contact record across all their Northwind
    Bank accounts.


    **Agent Execution:** The agent performs this action by calling the tool directly.
    This is a state-changing action that requires rigorous identity verification before
    execution.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: northwind_bank
- id: 756c10e8-c17a-508f-9cb9-038718e86b82
  title: When to use get_statements
  body: 'Statements provide customers with a formal record of their transactions,
    interest earned (APY), and any fees applied. The get_statements tool is used to
    retrieve these documents for customer review or for resolving discrepancies.


    Agents should utilize this tool when:

    1. A customer requests a copy of their monthly or annual statement.

    2. A customer needs documentation for tax purposes or loan applications at another
    institution.

    3. A customer is disputing a charge and needs to review the official statement
    for the period in question.


    Procedural Steps:

    1. Identity Verification: Perform mandatory identity verification to protect the
    customer''s financial privacy.

    2. Account Identification: Use get_accounts to ensure the correct account_id is
    being used for the request.

    3. Parameters: Determine the specific time frame (month/year) the customer requires.

    4. Tool Execution: Call the get_statements tool providing the account_id and the
    requested date range.

    5. Delivery: Direct the customer to their secure document center where the retrieved
    statements are available for download.


    We adhere to all FDIC and CFPB guidelines regarding the availability and transparency
    of account statements. For issues regarding specific transaction amounts within
    a statement, agents may refer to the process described in Everyday Checking —
    a discrepancy in your records or statement.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: northwind_bank
- id: b18524cc-595e-5551-8158-a08014f448c3
  title: get_statements tool reference
  body: 'The get_statements tool retrieves official account statements for a specified
    account and time period.


    **Tool Signature:** `get_statements(account_id: string, start_date: string, end_date:
    string)`


    **Arguments:**

    - `account_id`: The unique identifier of the account.

    - `start_date`: The start date of the period for which statements are requested
    (YYYY-MM-DD).

    - `end_date`: The end date of the period for which statements are requested (YYYY-MM-DD).


    **Effect:** Retrieves the requested PDF statements and makes them available in
    the customer''s secure document portal.


    **Agent Execution:** The agent performs this action by calling the tool directly.
    This is a read-only action that requires identity validation before the documents
    can be accessed.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: northwind_bank
- id: ae46d287-4413-5b77-bb0b-8209a5a1d817
  title: When to use update_beneficiary
  body: 'We believe in helping our customers secure their family''s financial future.
    Updating a beneficiary ensures that funds in a deposit account are distributed
    according to the customer''s wishes in the event of their passing.


    Agents should initiate this procedure when a customer expresses a desire to add
    a new beneficiary, remove an existing one, or change the percentage of assets
    allocated to specific individuals. This is a common request following major life
    events such as marriage, divorce, or the birth of a child.


    To update a beneficiary, the agent must follow these steps:

    1. Perform a rigorous identity verification of the customer. No modifications
    to account details are permitted without successful validation.

    2. Use the get_accounts tool to retrieve the full account_id associated with the
    customer''s profile (e.g., by matching a provided last-4 digit number).

    3. Collect the full legal name and relationship of the new beneficiary from the
    customer.

    4. Call the update_beneficiary tool, providing the account_id and the updated
    beneficiary details to commit the change to the system.


    We provide financial education regarding beneficiaries, but we do not provide
    individualized legal or tax advice. If a customer asks about the legal implications
    of their beneficiary designations, we must inform them that Northwind Bank cannot
    provide legal counsel and recommend they speak with a qualified professional.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: northwind_bank
- id: 1b57f9d9-118f-5435-9a2e-ed758c08a97d
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool allows an agent to modify the designated beneficiaries
    for a specific retail bank account. The agent performs this action by calling
    the tool directly within the conversation once the customer''s identity has been
    verified.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: object)`


    **Arguments:**

    - `account_id`: The unique internal identifier for the account being modified.

    - `beneficiary_details`: An object containing the beneficiary''s legal name, contact
    information, and the percentage share of the account.


    **Effect:**

    Updating the beneficiary record is a state-changing action. Once the tool is called,
    the system replaces or appends the beneficiary information for the specified account
    in the bank''s core ledger.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: northwind_bank
- id: 1897ffd3-e168-5ba9-b831-b00ae5399de8
  title: When to use set_alerts
  body: 'To help our customers maintain better control over their spending and security,
    we offer customizable account alerts. These notifications provide real-time visibility
    into account activity, helping to prevent overdrafts and detect unauthorized transactions
    early.


    Agents should guide customers toward setting alerts when they express concerns
    about monitoring their balance, wanting to be notified of large withdrawals, or
    seeking an extra layer of security for their funds. This is particularly useful
    for customers using an Everyday Checking account who wish to avoid account misuse.


    To set or modify alerts, the agent must follow these steps:

    1. Perform mandatory multi-factor authentication and identity verification to
    ensure the requester is the authorized account holder.

    2. Use the get_accounts tool to identify the correct account_id for the alerts
    being requested.

    3. Confirm the specific trigger for the alert (e.g., balance falling below a certain
    threshold or a transaction exceeding a specific dollar amount) and the preferred
    delivery method (e.g., email or secure chat).

    4. Call the set_alerts tool to activate the notifications for the specified account.


    By proactively setting alerts, we empower our customers to manage their liquidity
    more effectively and respond rapidly to any suspicious activity, aligning with
    our commitment to a streamlined, digital-first experience.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: northwind_bank
- id: 340cc8b3-2ae5-55a6-b838-a81875ee87c9
  title: set_alerts tool reference
  body: 'The set_alerts tool is used by agents to configure automated notifications
    for a customer''s account. The agent performs this action by calling the tool
    directly after identity validation is complete.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_criteria: object)`


    **Arguments:**

    - `account_id`: The unique internal identifier for the account.

    - `alert_criteria`: An object defining the trigger (e.g., low balance, high transaction
    amount) and the notification channel.


    **Effect:**

    This is a state-changing action. The tool updates the customer''s notification
    preferences in the banking system, triggering the automated delivery of alerts
    when the specified account conditions are met.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: northwind_bank
- id: 4e4115b4-2215-5643-be0d-2367ba84d43f
  title: When to use transfer_funds
  body: 'We provide a seamless way for customers to move money between their various
    Northwind Bank accounts. This allows customers to shift liquidity from a high-growth
    account, like Northwind High-Yield Savings, into an Everyday Checking account
    for daily spending.


    Agents should use this procedure when a customer requests to move funds between
    two accounts they own, or when they need to fund a specific goal or payment from
    a savings vehicle.


    To transfer funds, the agent must follow these steps:

    1. Complete the mandatory identity verification process. No funds may be moved
    without successful authentication.

    2. Use the get_accounts tool to resolve the account_ids for both the source (from)
    and the destination (to) accounts.

    3. Verify that the source account has sufficient available funds to cover the
    transfer amount.

    4. Confirm the exact dollar amount to be moved with the customer.

    5. Call the transfer_funds tool to execute the movement of money.


    If a customer is transferring funds to avoid a deficit, remind them that we maintain
    a low-friction pricing model and most fees on Everyday Checking are easily waived
    via minimum balance requirements. For more details on how we handle account deficits,
    refer to Everyday Checking — overdraft fee explained.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: northwind_bank
- id: a9909bba-c186-5cc1-b846-faf850f16704
  title: transfer_funds tool reference
  body: 'The transfer_funds tool is used by agents to move a specified amount of money
    between two internal accounts. The agent performs this action by calling the tool
    directly after the customer''s identity has been verified.


    **Tool Signature:**

    `transfer_funds(from_account_id: string, to_account_id: string, amount: number)`


    **Arguments:**

    - `from_account_id`: The ID of the account where funds will be debited.

    - `to_account_id`: The ID of the account where funds will be credited.

    - `amount`: The exact numerical value of the funds to be moved.


    **Effect:**

    This is a state-changing action. The tool atomically debits the source account
    and credits the destination account, updating the balances for both in real-time.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: northwind_bank
- id: bfb7295f-8417-5923-b7fe-9b6fd9102501
  title: When to use order_replacement_card
  body: 'We ensure our customers always have access to their funds by providing a
    streamlined process for replacing lost, stolen, or damaged payment cards, including
    the Horizon Cashback Card and the Summit Travel Card.


    Agents should initiate a replacement order when a customer reports their card
    is physically damaged, has expired, or is missing. If the card is lost or stolen,
    the agent must first ensure the compromised card is deactivated to prevent unauthorized
    use.


    To order a replacement card, the agent must follow these steps:

    1. Perform mandatory identity verification. No card replacements are permitted
    without successful validation of the account holder.

    2. Use the get_accounts tool to identify the account_id linked to the card that
    needs replacement.

    3. If the card is lost or stolen, call the freeze_card tool immediately to protect
    the consumer first.

    4. Confirm the customer''s current mailing address using the update_contact_info
    tool if any changes are needed.

    5. Call the order_replacement_card tool to trigger the shipment of a new physical
    card.


    We prioritize the rapid resolution of unauthorized transactions under Regulation
    E timelines; however, replacing the physical card is the primary step in preventing
    further unauthorized access to the account. For more on how we protect our customers,
    see Everyday Checking — fraud and unauthorized-activity protection.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: northwind_bank
- id: 042da75c-4c56-51de-b2d4-ef3807704299
  title: order_replacement_card tool reference
  body: 'The order_replacement_card tool initiates the production and mailing of a
    new physical debit or credit card. The agent performs this action by calling the
    tool directly after the customer''s identity has been verified.


    **Tool Signature:**

    `order_replacement_card(account_id: string, card_type: string)`


    **Arguments:**

    - `account_id`: The unique internal identifier for the account associated with
    the card.

    - `card_type`: The specific product type (e.g., the ID for the Horizon Cashback
    Card or Summit Travel Card).


    **Effect:**

    This is a state-changing action. The tool creates a request in the card fulfillment
    system to print and mail a new card to the address on file for the specified account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: northwind_bank
- id: 51216cd9-d0d4-5213-9bc1-819b2f4499e3
  title: When to use stop_payment
  body: 'We provide customers with the ability to cancel a payment before it is processed
    to prevent funds from being sent to the wrong recipient or to resolve a dispute
    with a vendor.


    Agents should use the stop payment procedure when a customer realizes they have
    written a check or authorized an electronic transfer that they no longer wish
    to honor. This is a critical tool for protecting the customer''s funds from erroneous
    or outdated obligations.


    To stop a payment, the agent must follow these steps:

    1. Perform mandatory identity verification to ensure the request is authorized
    by the account holder.

    2. Use the get_accounts tool to resolve the account_id from which the payment
    is scheduled to be drawn.

    3. Use the get_account_transactions tool to help the customer identify the specific
    transaction, including the exact amount and the recipient.

    4. Verify that the payment has not yet cleared the account; once a transaction
    is completed, a stop payment is no longer possible.

    5. Call the stop_payment tool to place a hold on the specific transaction.


    We adhere strictly to CFPB and Federal Reserve guidelines to ensure fair treatment.
    Please note that while we facilitate stop payments, we encourage customers to
    resolve disputes with vendors directly. For issues regarding transactions that
    have already occurred, please refer to When to use file_transaction_dispute.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: northwind_bank
- id: 984ec3af-025b-5a4c-b239-d742fb6be75e
  title: stop_payment tool reference
  body: 'The stop_payment tool allows an agent to prevent a specific pending transaction
    from being completed. The agent performs this action by calling the tool directly
    after the customer''s identity has been verified.


    **Tool Signature:**

    `stop_payment(account_id: string, transaction_id: string)`


    **Arguments:**

    - `account_id`: The unique internal identifier for the account.

    - `transaction_id`: The specific identifier of the transaction to be stopped.


    **Effect:**

    This is a state-changing action. The tool places a block on the specified transaction
    ID within the payment processing queue, ensuring the funds are not debited from
    the customer''s account.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: northwind_bank
- id: 68ddc659-7986-53b3-bf49-09f7bcb08e99
  title: When to use pay_bill
  body: 'We provide a streamlined way for our customers to manage their external obligations
    directly through their Northwind Bank accounts. This procedure ensures that bill
    payments are executed accurately and from the correct funding source.


    Agents should use this process when a customer requests to send a specific payment
    to a third-party vendor, utility company, or service provider using funds from
    their retail banking account.


    Steps to execute a bill payment:

    1. Verify the customer''s identity using the mandatory multi-factor authentication
    and identity verification protocols.

    2. Use the get_accounts tool to retrieve the customer''s available accounts and
    identify the correct account_id for the funding source (e.g., Everyday Checking).

    3. Confirm the payment details with the customer, including the recipient''s name,
    account number, the exact payment amount, and the scheduled date of payment.

    4. Once the customer confirms these details, call the pay_bill tool to initiate
    the transaction.

    5. Provide the customer with a confirmation number and the expected date the funds
    will leave their account.


    We remind agents that we provide financial education and product comparisons but
    do not provide individualized tax, legal, or investment advice. If a customer
    asks whether they should pay a specific bill now or invest those funds, agents
    must maintain our standard of suitability and direct the customer to their own
    financial advisor for personalized investment strategy.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: northwind_bank
- id: 497c2633-2b4b-5b7c-9bd2-3ee509e1b153
  title: pay_bill tool reference
  body: 'The pay_bill tool allows an agent to initiate an electronic payment from
    a customer''s Northwind Bank account to a designated third-party payee.


    **Tool Signature and Arguments:**

    - `account_id`: The unique identifier of the funding account.

    - `payee_name`: The name of the company or individual receiving the funds.

    - `payee_account_number`: The account number of the recipient.

    - `amount`: The dollar amount to be paid (e.g., $50.00).

    - `payment_date`: The date the payment should be processed.


    **Effect:**

    Calling this tool creates a scheduled payment instruction. The funds are deducted
    from the customer''s account on the specified date. The agent performs this action
    by calling the tool directly within the conversation; the customer is not redirected
    to an external portal.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: northwind_bank
- id: b7c0a155-1b43-5169-a61b-7537afafc587
  title: When to use activate_card
  body: 'To ensure the security of our customers'' funds and prevent fraud, all new
    or replacement cards—including those for the Horizon Cashback Card and Summit
    Travel Card—must be activated before they can be used for transactions. We require
    rigorous identity verification before any state-changing action, such as card
    activation, is performed.


    Agents should follow this procedure when a customer has received their physical
    card in the mail and wishes to begin using it for spending or ATM access.


    Steps to activate a card:

    1. Verify the customer''s identity using the mandatory multi-factor authentication
    and identity verification protocols. No activation is permitted without successful
    validation.

    2. Use the get_accounts tool to identify the credit or debit account associated
    with the card the customer is attempting to activate.

    3. Request and verify the card''s unique identifiers (such as the last four digits
    of the card number) to ensure the correct card is being enabled.

    4. Call the activate_card tool to change the card status from ''inactive'' to
    ''active''.

    5. Confirm to the customer that the card is now ready for use.


    If a customer reports that they never received their card, agents should not attempt
    activation but should instead follow the procedure for ordering a replacement
    card. For more information on the specific cards we offer, agents may refer to
    the Horizon Cashback Card — overview or the Summit Travel Card — overview.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: northwind_bank
- id: 4922bbce-0761-5661-bfc3-fc5a9d301cdc
  title: activate_card tool reference
  body: 'The activate_card tool is used to enable a newly issued or replacement payment
    card for active use.


    **Tool Signature and Arguments:**

    - `card_id`: The unique identifier for the specific card to be activated.


    **Effect:**

    This tool updates the card''s status in our core banking system to ''active'',
    allowing the customer to perform transactions. The agent performs this action
    by calling the tool directly; we do not instruct the customer to use an external
    website or phone line for activation once identity has been verified in the secure
    session.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: northwind_bank
- id: 3a78bd75-07cc-5979-8476-0fc45038855a
  title: When to use dispute_status
  body: 'Northwind Bank is committed to the rapid resolution of unauthorized transactions.
    We operate in strict accordance with Regulation E timelines, which governs electronic
    fund transfers and consumer rights. Our philosophy is to protect the consumer
    first while our internal teams conduct thorough investigations.


    Agents should use this procedure when a customer inquires about the progress,
    current stage, or outcome of a previously filed transaction dispute.


    Steps to provide a dispute update:

    1. Verify the customer''s identity using the mandatory multi-factor authentication
    and identity verification protocols.

    2. Use the get_accounts tool to confirm the account associated with the disputed
    transaction.

    3. Call the dispute_status tool to retrieve the most current information regarding
    the investigation.

    4. Explain the current status to the customer in professional, reassuring language.
    If the dispute is still pending, reassure them that we are working to resolve
    it in accordance with Regulation E.

    5. If the dispute has been resolved, clearly state the outcome and whether a provisional
    or permanent credit has been applied to their account.


    If the customer has not yet filed a dispute but believes a transaction is unauthorized,
    the agent must first follow the process for filing a dispute before checking for
    a status. For guidance on how to start this process, agents should refer to the
    When to use file_transaction_dispute policy.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: northwind_bank
- id: 13e0869b-7fca-573a-9a37-e588f97abc4a
  title: dispute_status tool reference
  body: 'The dispute_status tool retrieves the current state of a transaction dispute
    investigation.


    **Tool Signature and Arguments:**

    - `dispute_id`: The unique reference number assigned to the dispute claim.


    **Effect:**

    This tool returns the current status (e.g., ''Under Review'', ''Resolved - Credit
    Issued'', ''Resolved - Denied'') and any available notes from the investigation
    team. The agent performs this action by calling the tool directly to provide the
    customer with a real-time update.'
