  title: Northwind High-Yield Savings — fee schedule
  body: 'This schedule outlines the costs associated with the Northwind High-Yield
    Savings account. Our philosophy is to discourage account misuse rather than generate
    revenue through fees.


    * Monthly Maintenance Fee: $0

    * Minimum Opening Deposit: $100 (Required to open account)

    * Monthly Withdrawal Limit: 6 withdrawals per statement cycle

    * Excess Withdrawal Fee: $10 per withdrawal performed after the 6-withdrawal limit
    is reached


    Fees are applied automatically to the account balance at the time the excess transaction
    occurs. For a broader view of our pricing, see Institution-wide fees and charges.'
