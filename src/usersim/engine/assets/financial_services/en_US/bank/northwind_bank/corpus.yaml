- id: e8f2b1d3-4475-5a98-acad-862bbb7e41c0
  title: Summit Travel Card — account security best practices
  body: 'Protecting your financial journey is our top priority. Because the Summit
    Travel Card is designed for international use, it can sometimes be a target for
    sophisticated phishing and skimming attempts. We want to ensure you have the tools
    to keep your account secure.


    **Common Security Threats**

    Travelers often encounter ''skimming'' devices on foreign ATMs or point-of-sale
    terminals. We also see an increase in ''urgent'' emails or texts claiming there
    is a problem with your travel rewards, asking you to click a link to verify your
    identity.


    **What We Will Never Ask**

    To keep your account safe, please remember that Northwind Bank will never:

    * Ask for your full card number or CVV via email or text.

    * Request your password or multi-factor authentication (MFA) codes over the phone.

    * Ask you to move money to a ''safe account'' to protect it from fraud.


    **Best Practices for Travelers**

    * Use multi-factor authentication for all account access.

    * Monitor your transactions daily through our secure channels.

    * If you suspect your card has been compromised, tell us immediately. We prioritize
    the rapid resolution of unauthorized transactions in accordance with Regulation
    E timelines to protect you first.


    **Immediate Action Steps**

    If you notice a transaction you did not authorize or if you lose your physical
    card while traveling, notify us immediately. The sooner we are aware of the issue,
    the faster we can secure your account and begin our internal investigation. We
    will work with you to freeze the card and issue a replacement to ensure your trip
    continues without further stress.'
  domain: cards
  product_category: summit_travel_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 8f9a585e-cec3-5d4a-891c-dc09f504a2c4
  title: Summit Travel Card — change-of-terms policy
  body: 'This document outlines how we manage changes to the terms governing your
    Summit Travel Card account. We strive for transparency in all our credit offerings
    and will notify you of any material changes to your account agreement.


    **Notice of Change**

    We reserve the right to modify the terms of this agreement, including the annual
    fee of $95, the purchase APR of 23.49%, or the 3% travel rewards rate. We will
    provide you with written notice at least 45 days prior to any change taking effect.
    This notice will be delivered via your preferred communication method (email or
    secure message).


    **Customer Rights**

    If you do not agree to the modified terms, you have the right to close your account
    before the changes become effective. Please note that closing your account may
    affect your credit score and will result in the forfeiture of any unredeemed rewards
    points.


    **Fee and Rate Adjustments**

    While our current foreign transaction fee is 0%, any future changes to this fee
    will follow the same 45-day notice period. Changes to the purchase APR may occur
    based on market conditions or changes in your creditworthiness, as permitted by
    law.


    **Agreement Termination**

    Either you or Northwind Bank may terminate this agreement at any time. Upon termination,
    any outstanding balance, including accrued interest at the 23.49% purchase APR,
    must be paid in full. We will provide a final statement detailing all remaining
    obligations and any final rewards points earned prior to the closure date.


    For further details on how we manage your account, you may refer to the Summit
    Travel Card — overview.'
  domain: cards
  product_category: summit_travel_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: ffbacae6-df02-50f4-9d80-15ea14939364
  title: Summit Travel Card — getting started walkthrough
  body: 'This guide is for support agents assisting customers with the initial setup
    and first-use of the Summit Travel Card. Our goal is to ensure the customer understands
    the premium benefits and the cost structure of their new card.


    **Product Overview**

    The Summit Travel Card is a premium rewards card tailored for frequent travelers
    and international spenders. It is designed to minimize the costs of traveling
    abroad while maximizing rewards on travel-related spend.


    **Key Financial Terms**

    Agents must confirm the customer is aware of the following:

    * Annual Fee: $95

    * Purchase APR: 23.49%

    * Travel Rewards Rate: 3%

    * Foreign Transaction Fee: 0%


    **Step-by-Step Onboarding Walkthrough**

    1. **Identity Verification**: Before performing any state-changing action, the
    agent must complete mandatory multi-factor authentication and identity verification.

    2. **Card Activation**: Guide the customer through the activation process. Confirm
    the card has been received and is ready for use.

    3. **Rewards Education**: Explain that they will earn a 3% rewards rate on qualifying
    travel purchases. Clarify what categories count as ''travel'' (e.g., flights,
    hotels, rental cars).

    4. **International Use**: Highlight the 0% foreign transaction fee, explaining
    that they will not be charged extra for spending in foreign currencies.

    5. **Fee Disclosure**: Remind the customer that the $95 annual fee is charged
    once per year and the purchase APR is 23.49% if a balance is carried.


    **Post-Onboarding**

    Once the customer is set up, confirm they know how to view their rewards balance
    and how to report unauthorized transactions. Remind them that all retail deposits
    are FDIC-insured, though this is a credit product. If the customer has complex
    questions regarding their credit line, escalate the call to a specialized domain
    lead in credit cards.'
  domain: cards
  product_category: summit_travel_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 5021d089-f8c7-5417-916e-53c70b5e14bd
  title: Summit Travel Card — rewards rate travel explained
  body: '**How do I earn rewards with my Summit Travel Card?**

    We reward your adventures. You earn a 3% rewards rate on all qualifying travel
    purchases. This includes spending on airfare, hotels, cruises, and rental cars.
    These rewards accumulate in your account and can be redeemed for future travel
    expenses.


    **Do I earn rewards on international purchases?**

    Yes. Not only do you earn the 3% rewards rate on travel spend regardless of where
    it occurs, but we also charge a 0% foreign transaction fee, meaning you keep more
    of your money while exploring.


    **Is there a cap on how many rewards I can earn?**

    There is no limit to the amount of rewards you can earn using the 3% travel rate.
    The more you travel, the more you earn.


    For a full breakdown of the card''s costs, including the $95 annual fee, please
    see the Summit Travel Card — overview.'
  domain: cards
  product_category: summit_travel_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 3414b0c7-981a-5d9f-b2bf-27aa4b4778ab
  title: Summit Travel Card — make a change or update
  body: 'Whether you have moved to a new home or need to update your security preferences,
    we make it easy to keep your Summit Travel Card account current. Please follow
    these steps to make updates.


    **What you will need before starting**

    * Your account number or the card itself.

    * Valid government-issued identification for verification.

    * The new information you wish to update (e.g., new mailing address or phone number).


    **Step-by-Step Update Process**

    1. **Verify Your Identity**: Tell us which piece of information you need to change.
    We will then perform a mandatory identity verification and multi-factor authentication
    check to protect your PII.

    2. **Provide New Details**: Give us the updated information. For example, if you
    are updating your address, provide the full new street address, city, state, and
    zip code.

    3. **Review and Confirm**: We will read back the changes to you to ensure accuracy.
    Confirm that the details are correct.

    4. **Receive Confirmation**: We will send a confirmation notification to your
    verified email or secure message center once the update is processed.


    **Updating Card Preferences**

    If you need to change your spending limits or request a temporary increase for
    an upcoming trip, tell us the desired amount and the duration of the increase.
    We will review your profile and notify you immediately if the request is approved.


    **How you know it worked**

    Your account profile will reflect the new information immediately after the confirmation
    step, and you will receive a written record of the change in your secure message
    center.'
  domain: cards
  product_category: summit_travel_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 04f47fcb-c6b8-56e9-acd1-214da31c41d3
  title: Summit Travel Card — access or login problems
  body: '**Symptom**: You are unable to log in to your account or are receiving an
    ''access denied'' error when trying to view your Summit Travel Card details.


    **Likely Causes**

    * Incorrect password or username.

    * Multi-factor authentication (MFA) failure (e.g., not receiving the SMS code).

    * Account lockout due to too many unsuccessful login attempts.

    * Security freeze placed on the account due to suspicious activity.


    **What to check and do (in order)**

    1. **Verify Credentials**: Double-check that your caps lock is off and that you
    are using the correct username and password.

    2. **Check MFA Delivery**: If you are not receiving your security code, check
    your signal strength or ensure that your registered mobile number is current.
    If you cannot receive the code, tell us, and we will verify your identity through
    alternative means.

    3. **Reset Password**: If you have forgotten your password, request a password
    reset. We will guide you through the identity verification process before providing
    a secure reset link.

    4. **Check for Account Locks**: If you have attempted to log in too many times,
    your account may be temporarily locked. Tell us you are locked out, and we will
    verify your identity to restore access.


    **When we escalate**

    If we cannot resolve the login issue through standard verification, we will escalate
    your case to our specialized domain leads in credit cards. They will perform a
    deeper security review of your account. You will receive an update via your verified
    email or phone within 24 to 48 business hours once the review is complete and
    access is restored.'
  domain: cards
  product_category: summit_travel_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 38b85961-d7ad-5fb3-83a3-b9fa0f63c0b6
  title: Summit Travel Card — qualification tiers
  body: 'This matrix is for support agents to determine the likely qualification path
    for a customer applying for the Summit Travel Card. We use a standard of suitability
    to ensure this product matches the customer''s financial profile.


    | Credit Profile | Income Requirement | Application Outcome |

    | :--- | :--- | :--- |

    | Excellent | $40,000+ annual | High likelihood of approval; standard limits |

    | Good | $30,000+ annual | Likely approval; reviewed limits |

    | Fair | $25,000+ annual | Case-by-case review; may require deposit |

    | Poor | N/A | Likely decline; recommend Horizon Cashback Card |


    **Key Underwriting Constants**

    * Minimum Age: 18 years

    * Residency: US Citizen or Permanent Resident

    * Annual Fee: $95 (must be acknowledged by applicant)

    * Purchase APR: 23.49% (must be disclosed during application)'
  domain: cards
  product_category: summit_travel_card
