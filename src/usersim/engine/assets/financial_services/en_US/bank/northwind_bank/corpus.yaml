- id: 2b6db87a-7561-5f7a-873f-91fe43b4e7e5
  title: Anchor 12-Month CD — account security best practices
  body: 'Because the Anchor 12-Month CD is a fixed-term investment, it is a target
    for specific types of fraud, including ''account takeover'' attempts where bad
    actors try to change your contact information to divert your funds at maturity.


    We want to ensure your savings remain secure. Please keep these best practices
    in mind:


    * Be wary of ''Urgency Scams'': We will never call or email you claiming your
    CD is ''expiring early'' and requiring an immediate transfer to a ''safe account''
    to avoid a penalty.

    * Protect Your Identity: Northwind Bank will never ask you for your password or
    multi-factor authentication codes over the phone or via email.

    * Monitor Your Access: Regularly review your account settings. Any state-changing
    action, such as updating a beneficiary or changing a mailing address, requires
    rigorous identity verification.


    What to do if you suspect fraud:

    If you notice any unauthorized attempts to access your account or receive suspicious
    communications regarding your Anchor 12-Month CD, tell us immediately. We prioritize
    the rapid resolution of unauthorized transactions in strict accordance with Regulation
    E timelines to protect you first while we conduct our investigation.


    Remember, all retail deposits at Northwind Bank are FDIC-insured, providing an
    essential layer of security for your principal investment.'
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 27d30284-b778-59ee-9b54-be2ac1178207
  title: Anchor 12-Month CD — change-of-terms policy
  body: "This policy governs how Northwind Bank manages changes to the terms of your\
    \ Anchor 12-Month CD. \n\nFixed Terms: The Anchor 12-Month CD is a fixed-rate\
    \ vehicle. Once your account is opened with the agreed-upon APY of 4.5% and the\
    \ term of 12 months, these specific values are guaranteed for the duration of\
    \ the term. We will not decrease the interest rate during the 12 month period.\n\
    \nModifications: We reserve the right to modify account administrative terms,\
    \ such as documentation requirements or internal processing procedures. For any\
    \ material change to the account agreement, we will provide written notice at\
    \ least 30 days prior to the effective date of the change.\n\nEarly Withdrawal:\
    \ The customer is obligated to maintain the funds for the full 12 month term to\
    \ earn the full return. If you choose to withdraw funds before the term ends,\
    \ an early withdrawal penalty of 90 days of interest will be applied. This penalty\
    \ is deducted from the principal or earned interest.\n\nTermination: This agreement\
    \ ends naturally upon the completion of the 12 month term. At maturity, you may\
    \ choose to withdraw the funds or roll them into a new term. If no action is taken,\
    \ we follow the default renewal instructions specified in your account opening\
    \ documents."
  domain: retail_banking
  product_category: anchor_cd_12mo
  document_type: terms_conditions
  source_authority: official
  placeholder: true
