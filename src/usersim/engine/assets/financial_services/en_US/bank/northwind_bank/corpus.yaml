- id: 0e731c4e-1b0f-5f73-9ab9-dc9f1175b5d0
  title: Everyday Checking — resolve a common request end-to-end
  body: 'One of the most common requests we handle is disputing an unauthorized transaction.
    We prioritize the consumer first and work quickly to resolve these issues in accordance
    with Regulation E.


    **What you need before starting:**

    *   The date and amount of the transaction you are disputing.

    *   The name of the merchant involved.


    **Steps to resolve the dispute:**

    1.  **Report the transaction:** Tell us that you have found an unauthorized transaction
    on your Everyday Checking account and provide the specific details (date, amount,
    and merchant).

    2.  **Verify your identity:** We will perform a mandatory identity verification,
    including multi-factor authentication, to ensure the request is coming from the
    account owner.

    3.  **Provide details:** We may ask you a few clarifying questions about the transaction
    to help our internal investigation.

    4.  **Confirm the dispute:** We will confirm that a formal dispute has been filed.
    Under Regulation E, we will conduct a thorough investigation to determine the
    validity of the charge.

    5.  **Receive resolution:** We will notify you of the outcome of the investigation.
    If the transaction is found to be unauthorized, we will credit the funds back
    to your account.


    **How you know it worked:**

    You will receive a confirmation that the dispute has been opened and, eventually,
    a final notification regarding the return of your funds.


    If you have questions about other account charges, such as the $34 overdraft fee
    or the $2.5 atm out of network fee, please see Everyday Checking — fee schedule.'
