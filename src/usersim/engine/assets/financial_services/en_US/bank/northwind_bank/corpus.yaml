- id: 7bfc115f-8f8e-5623-84b6-61b0815466a6
  title: Northwind High-Yield Savings — comparison vs. alternatives and when not to
    choose it
  body: 'When choosing a home for your money, it is important to match the product
    to your financial goal. The Northwind High-Yield Savings account is designed as
    a high-growth liquid account for emergency funds and short-term goals.


    **Why choose Northwind High-Yield Savings?**

    *   **Competitive Growth:** You earn a high APY of 4.25%, which is significantly
    higher than standard savings accounts.

    *   **Liquidity:** Unlike a CD, you can withdraw your money whenever you need
    it (subject to monthly limits).

    *   **Low Entry Barrier:** You can get started with a minimum opening deposit
    of $100.


    **When this is the WRONG choice:**

    *   **For Daily Spending:** If you need to make 10 or 20 transfers a month, this
    is not the right tool. You will be limited to 6 withdrawals per month, and every
    transaction after that will cost you an excess withdrawal fee of $10. For daily
    use, our Everyday Checking — overview is a better fit.

    *   **For Guaranteed Long-Term Rates:** If you are worried that interest rates
    might drop and you want to lock in a rate for a full year, you should look at
    the Anchor 12-Month CD — overview. While the savings account is liquid, the CD
    provides a fixed-rate vehicle for guaranteed returns.


    **Summary of Key Terms:**

    *   **APY:** 4.25%

    *   **Minimum Opening Deposit:** $100

    *   **Monthly Withdrawal Limit:** 6

    *   **Excess Withdrawal Fee:** $10


    *Disclaimer: All retail deposits are FDIC-insured. APY is variable and may change
    based on market conditions.*'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: cbe560d7-fc7c-5da8-9f0f-01e929a7d1ef
  title: Northwind High-Yield Savings — cost and charges
  body: '**Are there any monthly maintenance fees for this account?**

    No, we do not charge a monthly maintenance fee for the Northwind High-Yield Savings
    account. Our goal is to provide a low-friction experience for our savers.


    **What are the potential costs?**

    The only primary fee associated with this account is the excess withdrawal fee.
    We allow you to make 6 withdrawals per month for free. If you exceed this limit,
    you will be charged $10 for each additional withdrawal.


    **Is there a cost to open the account?**

    There is no ''fee'' to open the account, but you must provide a minimum opening
    deposit of $100 to establish the account. This money remains yours and begins
    earning our 4.25% APY immediately.'
  domain: retail_banking
  product_category: high_yield_savings
  document_type: faq
  source_authority: official
  placeholder: true
