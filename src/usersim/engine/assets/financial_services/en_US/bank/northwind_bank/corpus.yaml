- id: b3ca0ed5-572f-53bb-adad-8e35bb02330e
  title: Summit Travel Card — a failed or pending action
  body: '**Symptom:** You attempted to make a purchase or activate your card, but
    the transaction was declined or the action is showing as ''pending'' for an extended
    period.


    **Likely Causes:**

    * **Identity Verification:** For new cards, the activation may be pending because
    multi-factor authentication was not completed.

    * **Travel Block:** We may have placed a security hold on the card if a large
    transaction occurred in a new geographic location without a travel notice.

    * **Credit Limit:** The purchase may have exceeded your available credit limit.


    **What to check in order:**

    1. **Verify Authentication:** Check if you have any pending requests for identity
    verification in your secure messages.

    2. **Check Travel Status:** Confirm if you notified us of your travel plans before
    the transaction attempt.

    3. **Review Available Credit:** Check your current balance to ensure the purchase
    amount fits within your limit.


    **The Fix:**

    If the issue is a security block or verification failure, tell us the date and
    amount of the failed transaction. We will perform a rigorous identity verification.
    Once your identity is validated, we will lift the block and the transaction can
    be re-attempted.


    **When we escalate:**

    If the failure is due to a technical system error or a complex dispute regarding
    a 0% foreign transaction fee miscalculation, we will raise a case to our specialized
    credit card domain leads. You will receive a case number and an update via secure
    chat or email within 3 to 5 business days.'
