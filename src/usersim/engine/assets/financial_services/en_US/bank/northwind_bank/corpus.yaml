- id: 914779f4-dc8e-5f26-ae2a-8ab64c90ed70
  title: Horizon Cashback Card — choosing between tiers or options
  body: 'When deciding which Northwind Bank card is right for you, the choice usually
    comes down to your spending patterns and how much you value travel perks versus
    simple cash returns.


    **Horizon Cashback Card**

    * **Best for**: Everyday spenders who want a simple, one-size-fits-all reward.

    * **Cost**: Annual fee of $0.

    * **Reward**: A flat cashback rate of 1.5% on all eligible purchases.

    * **Rate**: Purchase APR of 21.99%.


    **Summit Travel Card**

    * **Best for**: Frequent travelers and international spenders who want premium
    rewards.

    * **Cost**: Higher annual fee (see Summit Travel Card — fee schedule).

    * **Reward**: Specialized rewards for travel-related spending.


    **Which one should you choose?**

    If you prefer a low-friction experience with no yearly cost and a consistent return
    on every dollar spent, the Horizon Cashback Card is the better choice. If your
    spending is heavily weighted toward flights and hotels and you are comfortable
    with an annual fee to unlock higher travel-specific rewards, the Summit Travel
    Card is more suitable.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 0450621b-f3db-5607-ab25-1fd71df32097
  title: Horizon Cashback Card — privacy and data handling
  body: 'Northwind Bank is committed to the highest standards of data privacy and
    the fair treatment of our customers. This disclosure explains how we handle your
    information in relation to your Horizon Cashback Card.


    **Data Collection and Usage**

    We collect information necessary to maintain your account, process your 1.5% cashback
    rewards, and ensure compliance with federal laws. This includes your transaction
    history, credit score, and identity verification data. We use this data to provide
    you with the services associated with your card and to prevent fraud.


    **Regulatory Compliance**

    We strictly adhere to CFPB, Federal Reserve, and FDIC guidelines. Our handling
    of your electronic data and the resolution of unauthorized transactions are managed
    in strict accordance with Regulation E timelines. We prioritize transparency in
    all Regulation Z disclosures, specifically regarding the purchase APR of 21.99%
    and the $0 annual fee.


    **Privacy Protections**

    Your personally identifiable information (PII) is protected by rigorous security
    layers. We will not sell your personal data to third parties. Data is shared only
    with authorized credit bureaus or as required by law to ensure the stability and
    security of the financial system.


    **Your Rights**

    You have the right to request a summary of the data we hold about your account.
    In accordance with our security and verification policy, multi-factor authentication
    and rigorous identity verification are mandatory before any disclosure of PII
    is permitted.


    For more information on our overarching risk posture, you may refer to Horizon
    Cashback Card — regulatory disclosures.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: b2ec4717-1fcd-55cd-a4cc-3a7fae9f2cf2
  title: Horizon Cashback Card — recognizing scams targeting this product
  body: 'At Northwind Bank, we want to ensure your rewards experience is safe. Because
    the Horizon Cashback Card is a popular choice for everyday spending, it is sometimes
    targeted by scammers who try to trick you into giving away your account details.


    Common scams targeting this card include:

    *   **The ''Rewards Bonus'' Phish:** You may receive a text or email claiming
    you have an unclaimed cashback bonus and asking you to ''verify'' your identity
    by providing your full card number, CVV, or PIN. We will never ask for your PIN
    or password via email or text.

    *   **The ''Suspicious Activity'' Scare:** A caller may pretend to be from our
    fraud department, claiming there is a problem with your 1.5% cashback accrual
    and asking you to move funds to a ''safe account'' to protect them. Northwind
    Bank will never ask you to move money to a different account to secure your rewards.

    *   **The ''Annual Fee'' Trap:** Scammers may send a fake notice claiming you
    owe a fee to keep your card active. Remember, the Horizon Cashback Card has an
    annual fee of $0.


    What to do if something looks wrong:

    If you notice a transaction you did not authorize or receive a suspicious request,
    tell us immediately. We prioritize the rapid resolution of unauthorized transactions
    in strict accordance with Regulation E timelines. Our philosophy is to protect
    the consumer first while conducting thorough internal investigations.


    To protect your account, we require multi-factor authentication and rigorous identity
    verification before any state-changing action. If someone asks you to bypass these
    security steps, hang up or delete the message immediately.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 282cb165-d2cb-53ae-b158-ca85d438f21b
  title: Horizon Cashback Card — limits, restrictions, and edge cases
  body: 'This document provides internal guidance for support agents regarding the
    operational boundaries of the Horizon Cashback Card.


    **Core Financial Terms**

    *   **Annual Fee:** $0. This is a permanent feature of the product; there are
    no conditional requirements to waive this fee.

    *   **Purchase APR:** 21.99%. This rate applies to all standard purchases.

    *   **Cashback Rate:** 1.5%. This rate is applied to eligible net purchases.


    **Operational Restrictions**

    *   **Cashback Accrual:** Rewards are earned on net purchases (total purchases
    minus returns/credits). Cash advances and balance transfers do not earn the 1.5%
    cashback rate.

    *   **Interest Application:** The 21.99% APR is applied to any balance remaining
    after the grace period. Agents should remind customers that paying the full statement
    balance each month avoids this cost.

    *   **Credit Limits:** Limits are determined during the underwriting process based
    on the customer''s financial profile. No manual limit increases are permitted
    without a fresh identity validation and credit review.


    **Edge Cases**

    *   **Account Closure:** If a customer closes the account, any unredeemed cashback
    may be forfeited depending on the timing of the final statement. Always verify
    the current rewards balance before processing a closure.

    *   **Over-limit Transactions:** While we strive for a low-friction experience,
    transactions that exceed the assigned credit limit may be declined. This is a
    security and risk measure to protect both the bank and the consumer.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 1b416121-87d3-576c-b7ef-e0e34295d4ea
  title: Horizon Cashback Card — cost and charges
  body: '**Does the Horizon Cashback Card have a yearly cost?**

    No, there is an annual fee of $0 for this card. We believe in transparent, low-friction
    pricing for our everyday spenders.


    **What is the interest rate on purchases?**

    The Horizon Cashback Card has a purchase APR of 21.99%. To avoid paying interest,
    we recommend paying your statement balance in full every month.


    **How much do I earn back on my spending?**

    You will earn a cashback rate of 1.5% on your eligible purchases. This allows
    you to earn rewards on every single transaction without needing to track categories.


    For more details on how these rates work, please see Horizon Cashback Card — apr
    purchase explained.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 3651ea06-cbc0-5946-9c17-3963c2f113fa
  title: Horizon Cashback Card — check status or history
  body: 'Follow these steps to review your current balance, recent spending, and earned
    rewards for your Horizon Cashback Card.


    **What you need before starting**

    *   Your account identification (such as your account number or verified profile).

    *   A valid form of identification for our verification process.


    **Steps to check your status and history**

    1.  **Verify your identity:** Tell us which account you are inquiring about. We
    will perform a mandatory identity verification and multi-factor authentication
    check to ensure your data remains private.

    2.  **Request your balance:** Ask us for your current outstanding balance. We
    will provide the total amount currently owed on the card.

    3.  **Review recent transactions:** Ask us for a list of your recent purchases.
    We will read back the most recent transactions, including the dates and amounts,
    so you can verify your spending.

    4.  **Check rewards progress:** Ask for your current cashback total. We will confirm
    the total amount you have earned at the 1.5% cashback rate.

    5.  **Request a statement history:** If you need a formal record, ask us to provide
    your monthly statements. We will confirm the dates of the statements available
    for your review.


    **How you know it worked**

    You will have a confirmed current balance, a list of your recent spending, and
    a total of your accumulated cashback rewards.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 27418d15-2c85-507b-93fe-b3da2f19f337
  title: Horizon Cashback Card — a declined or blocked action
  body: 'If your Horizon Cashback Card was declined at a point of sale or a specific
    transaction was blocked, please follow these steps to resolve the issue.


    **Likely Causes**

    *   **Identity Verification Failure:** If you are attempting a high-value transaction
    or a change to your account, the action may be blocked if identity validation
    was not completed.

    *   **Credit Limit Reached:** The transaction may exceed your available credit.

    *   **Fraud Protection:** Our security systems may have flagged the transaction
    as unusual to protect you from unauthorized activity.

    *   **Card Status:** The card may be frozen or inactive.


    **What to check in order**

    1.  **Verify Card Status:** Ask us to check if your card is currently active.
    If it was frozen for security, we can unfreeze it once we complete a rigorous
    identity verification.

    2.  **Check Available Credit:** Ask us for your current available credit. If the
    purchase amount exceeds this limit, the transaction will be declined.

    3.  **Review Fraud Alerts:** Ask us if there are any security flags on your account.
    If we blocked a transaction to protect you, we will verify the purchase details
    with you.


    **The Fix**

    *   **For Fraud Blocks:** Once you confirm the transaction was legitimate and
    we have verified your identity, we will remove the block and you can retry the
    purchase.

    *   **For Limit Issues:** You may choose to make a payment toward your balance
    to free up credit.


    **When we escalate**

    If the block is due to a complex technical error or a systemic dispute, we will
    route your case to a specialized domain lead in our credit card division. You
    will receive a notification via secure chat or email once the lead has resolved
    the underlying block.'
  domain: cards
  product_category: horizon_cashback_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 4563ad2f-6159-5a63-8407-9d7c6ccab320
  title: Horizon Cashback Card — when to switch or upgrade
  body: 'This guide helps agents determine if a customer should stay with the Horizon
    Cashback Card or move to a different product.


    **Stay with Horizon Cashback Card if:**

    The customer wants a simple, no-cost way to earn rewards. With an annual fee of
    $0 and a flat 1.5% cashback rate, this is the best choice for retail spenders
    who prefer not to manage complex reward categories.


    **Switch to Summit Travel Card if:**

    The customer travels frequently or spends significantly on international purchases.
    While the Horizon card is great for everyday use, the Summit Travel Card is specifically
    tailored for those needs.


    **Switch to Everyday Checking if:**

    The customer is using the credit card for liquidity and is incurring interest
    at the 21.99% APR. If they prefer a foundational hub for daily spending without
    interest charges, a checking account is more suitable.


    **Comparison Summary**

    *   **Horizon Cashback Card:** $0 annual fee, 1.5% cashback, 21.99% purchase APR.

    *   **Summit Travel Card:** Tailored for international spenders (see Summit Travel
    Card — overview for details).'
  domain: cards
  product_category: horizon_cashback_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: 8cc7d753-6fd7-53dd-a211-60c7b5727736
  title: Horizon Cashback Card — comparison vs. alternatives and when not to choose
    it
  body: 'Choosing the right card depends on your spending habits and financial goals.
    We provide the Horizon Cashback Card as an accessible, no-annual-fee credit option
    for simple, everyday rewards.


    **Why Choose the Horizon Cashback Card?**

    This card is designed for the ''everyday spender.'' Its primary advantage is simplicity.
    You earn a consistent 1.5% cashback rate on eligible purchases without having
    to worry about which category a store falls into. Additionally, there is no cost
    to hold the card, as the annual fee is $0.


    **Comparison with Alternatives**

    *   **Vs. Specialized Rewards Cards:** Some cards offer higher percentages (e.g.,
    3% or 5%) on specific categories like groceries or gas but often charge an annual
    fee or offer very low rates on everything else. The Horizon card provides a balanced
    1.5% across the board.

    *   **Vs. Travel Cards:** If you spend most of your money on flights, hotels,
    and international vendors, our Summit Travel Card is a more powerful tool. The
    Horizon card is a general-purpose tool; the Summit card is a specialist tool.


    **When NOT to Choose This Card**

    *   **If you cannot pay your balance monthly:** The purchase APR is 21.99%. If
    you tend to carry a balance, the interest charges will quickly outweigh the 1.5%
    cashback you earn.

    *   **If you want high-end travel perks:** This card focuses on cash rewards rather
    than lounge access or travel insurance.

    *   **If you prefer a debit experience:** If you want to spend only what you have
    in your account, our Everyday Checking — overview describes a better foundational
    hub for your liquidity.


    **Quick Specs Recap**

    *   Annual Fee: $0

    *   Cashback Rate: 1.5%

    *   Purchase APR: 21.99%'
  domain: cards
  product_category: horizon_cashback_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: northwind_bank
- id: fe260b32-5910-5a1a-91be-4bf7c79ed965
  title: Horizon Cashback Card — eligibility and setup
  body: '**Who is eligible for the Horizon Cashback Card?**

    We recommend this card for retail savers and everyday spenders. Eligibility is
    based on your financial profile and a suitability standard to ensure the product
    meets your stated goals. You can find detailed requirements in Horizon Cashback
    Card — eligibility requirements.


    **How do I set up my card once I am approved?**

    Once approved, we will send your card to your verified address. You will then
    need to complete a rigorous identity verification process to activate the card.
    For a step-by-step guide, please see Horizon Cashback Card — set up and activate.


    **Can I add authorized users to my account?**

    Yes, you can request to add authorized users. This requires successful identity
    validation for the primary account holder before any modifications are permitted.'
