- id: 5396a5b8-85d9-50df-9e86-dfcb88cbae81
  title: SEP IRA — recognizing scams targeting this product
  body: "At Evergreen Retirement, we prioritize the security of your assets. Because\
    \ the SEP IRA is designed for self-employed individuals and small business owners,\
    \ scammers often target this group by posing as tax authorities or government\
    \ regulators. \n\nCommon scam patterns targeting SEP IRA holders include:\n1.\
    \ The 'Audit Threat': An individual claiming to be from the IRS warns that your\
    \ business contributions exceed the 25% of compensation limit or the annual contribution\
    \ cap of $70,000 and demands an immediate 'settlement fee' to avoid penalties.\n\
    2. The 'Investment Opportunity': Unsolicited offers promising guaranteed returns\
    \ on your retirement assets if you move them to an unverified third-party platform.\n\
    3. The 'Urgent Verification': Requests for your full Social Security number or\
    \ multi-factor authentication (MFA) codes over the phone to 'verify' your business\
    \ status.\n\nWe will never ask you to provide your MFA codes or passwords via\
    \ phone or email. We will never threaten immediate legal action to pressure you\
    \ into moving funds to an external account.\n\nIf you suspect fraudulent activity\
    \ or notice an unauthorized change to your account, notify us immediately. We\
    \ treat all fraud reports with immediate urgency and will initiate a freeze on\
    \ affected assets within one business hour to protect your portfolio.\n\n***\n\
    REGULATORY DISCLAIMER: Evergreen Retirement provides educational resources on\
    \ contribution limits. We do not provide individualized tax or legal advice. Please\
    \ consult a certified CPA for specific tax strategies."
  domain: retirement
  product_category: sep_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
