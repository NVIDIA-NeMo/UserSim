  institution_id: evergreen_retirement
- id: fb7e6214-f945-5282-9f73-36be391c6cc9
  title: Traditional 401(k) — a discrepancy in your records or statement
  body: 'If you identify an error in your Traditional 401(k) balance, contribution
    history, or annual statement, please follow this resolution process.


    **Common Symptoms**

    - The total balance does not reflect a recent employer contribution.

    - Your year-to-date contributions are listed as lower than the amount deducted
    from your payroll.

    - An unexpected fee or penalty has been applied to the account.


    **Resolution Steps**

    1. **Verify the Transaction Date:** Check the date of the missing or incorrect
    transaction. Note that some employer contributions may take several business days
    to post.

    2. **Establish a Secure Session:** Because statements contain PII, we will require
    you to complete a multi-factor authentication (MFA) challenge before we can discuss
    specific account figures.

    3. **Provide Evidence:** Tell us the exact amount and date of the discrepancy.
    If you have payroll records showing a deduction that has not appeared in your
    account, we will ask you to provide those details.

    4. **Internal Review:** We will compare your reported figures against our internal
    records and the data provided by your employer''s payroll department.


    **Fix and Escalation**

    - If the error is a clerical or posting mistake, we will correct the balance immediately
    and provide you with an updated statement.

    - If the discrepancy is the result of a disputed transaction or potential fraud,
    we will initiate a formal review process. Our goal is to reach a full resolution
    within 15 business days.

    - For complex regulatory disputes, your case will be escalated to our Senior Compliance
    Officers for final review to ensure ERISA compliance.'
  domain: retirement
  product_category: traditional_401k
  document_type: troubleshooting
  source_authority: official
