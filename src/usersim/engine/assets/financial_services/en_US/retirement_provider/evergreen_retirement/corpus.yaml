- id: 7e37bb61-8097-549e-989c-65cf022664cc
  title: Traditional IRA — fraud and unauthorized-activity protection
  body: 'At Evergreen Retirement, we prioritize the absolute privacy of your personally
    identifiable information and the security of your retirement assets. For those
    comparing our Traditional IRA against other providers, please be aware that because
    these accounts often hold significant long-term balances, they can be targets
    for specific fraud patterns, such as ''urgent'' requests to liquidate assets for
    unexpected overseas emergencies or fraudulent investment ''opportunities'' that
    require immediate wire transfers.


    We employ rigorous identity verification and mandatory multi-factor authentication
    (MFA) before any state-changing action is permitted. This means no contribution
    changes or distributions can be processed without a verified secure session. We
    will never ask you to provide your MFA codes, passwords, or full social security
    number via an unsolicited email or text message.


    If you notice any unauthorized activity or suspect that your account has been
    compromised, notify us immediately. We treat all fraud reports with immediate
    urgency; upon verification of a report, we will initiate a freeze on affected
    assets within one business hour to prevent further loss. Prompt reporting is essential
    to limiting your liability and ensuring the fastest possible recovery of funds.
    For a comprehensive look at our operational standards, you may also review the
    Traditional IRA — account agreement.'
  domain: retirement
  product_category: traditional_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 2d75f55b-7cb1-59c8-8e34-e19d2f04fd43
  title: Traditional IRA — account agreement
  body: "This account agreement governs the relationship between Evergreen Retirement\
    \ and the account holder regarding the Traditional IRA. \n\n1. Contributions:\
    \ The account holder agrees to adhere to IRS annual contribution limits, currently\
    \ set at $7,000. For individuals aged 50 and older, a catch-up limit of $1,000\
    \ is permitted. Contributions exceeding these limits may be subject to IRS penalties.\n\
    \n2. Distributions and Penalties: Distributions are subject to federal and state\
    \ tax laws. We notify clients that taking distributions before age 59½ typically\
    \ triggers an early withdrawal penalty of 10%, unless a specific IRS exception\
    \ applies. All distributions require a verified secure session and multi-factor\
    \ authentication.\n\n3. Fees and Maintenance: We maintain a lean fee structure\
    \ to maximize your compound growth. Fees are primarily tied to active asset management.\
    \ Basic account maintenance is provided as part of our commitment to stability\
    \ and transparency.\n\n4. Dispute Resolution: Any disputes regarding account activity\
    \ must be submitted through our formal review process. Our goal is to reach a\
    \ resolution within 15 business days.\n\n5. Account Closure: The account holder\
    \ may close the account at any time. Upon request, we will facilitate the transfer\
    \ of assets to another qualified institution or distribute the balance, subject\
    \ to the aforementioned early withdrawal penalty of 10% if the holder is under\
    \ age 59½.\n\n6. Amendments: We reserve the right to modify these terms to maintain\
    \ compliance with DOL and IRS frameworks. Clients will be notified of material\
    \ changes in accordance with regulatory requirements."
  domain: retirement
