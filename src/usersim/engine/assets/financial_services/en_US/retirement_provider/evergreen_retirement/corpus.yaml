- id: 1784cbdd-a46e-59c2-953f-a1b36c6abc6a
  title: Traditional 401(k) — a failed or pending action
  body: 'If you encounter a situation where a contribution change or a distribution
    request is listed as ''failed'' or remains ''pending'' longer than expected, please
    follow these steps to resolve the issue.


    Symptoms: You may see an error message stating ''Action Pending'' or receive a
    notification that a contribution update was not processed.


    Possible Causes:

    1. Unverified Session: State-changing actions require a verified secure session.
    If your multi-factor authentication (MFA) expired, the action will fail.

    2. Limit Breach: The request may have exceeded the annual employee contribution
    limit of $23,500 (or $31,000 for those 50+ utilizing the $7,500 catch-up).

    3. Compliance Hold: The request may be under review for ERISA or IRS compliance.


    Resolution Steps:

    1. Re-authenticate your identity using our MFA process to ensure a secure session
    is active.

    2. Verify that the total contribution for the year, including the new request,
    does not exceed the $23,500 limit (plus any applicable catch-up contributions).

    3. Check your secure notifications for any requests for additional identity verification
    documents.


    If the action remains pending after these checks, we will escalate the matter
    to our Senior Compliance Officers for a final regulatory review. You will receive
    a status update via secure chat or phone within one business day of the escalation.
    For systemic issues regarding account access, please refer to Traditional 401(k)
    — a failed or pending action.'
  domain: retirement
  product_category: traditional_401k
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 82276fa0-96b3-5a0a-91bc-4dfa61873a84
  title: Traditional 401(k) — eligibility requirements
  body: 'Eligibility for the Traditional 401(k) is determined by employment status
    and IRS guidelines. The following matrix outlines the requirements for account
    participation and contribution limits:


    | Condition | Eligibility Outcome |

    | :--- | :--- |

    | Employed by a sponsoring company with an Evergreen plan | Eligible for account
    activation |

    | Under Age 50 | Max annual contribution: $23,500 |

    | Age 50 or Older | Max annual contribution: $31,000 ($23,500 standard + $7,500
    catch-up) |

    | Distribution before age 59½ | Subject to 10% Early Withdrawal Penalty (unless
    exempt) |

    | Non-employee / Self-employed | Ineligible (refer to SEP IRA for alternatives)
    |'
