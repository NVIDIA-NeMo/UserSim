- id: 828e9117-6316-5aa6-8abf-45f246d56edf
  title: Rollover IRA — privacy and data handling
  body: 'Evergreen Retirement is committed to the absolute privacy of PII and the
    fair treatment of all investors. This disclosure outlines our data handling practices
    specifically for the Rollover IRA.


    **Data Collection and Use**

    To facilitate the transfer of assets, we collect necessary account details from
    your previous plan administrator. This data is used exclusively for the purpose
    of executing the rollover and maintaining your account in accordance with DOL
    and IRS frameworks. We do not sell client data to third-party marketers.


    **Security Standards**

    We employ rigorous identity verification and mandatory multi-factor authentication
    (MFA) for all state-changing actions. This ensures that your consolidated assets
    are protected against unauthorized access. Any modification to your account requires
    a verified secure session.


    **Regulatory Disclosures**

    As a premium provider, we adhere strictly to ERISA compliance. We provide comprehensive
    educational resources on Required Minimum Distributions (RMDs) and contribution
    limits; however, we do not provide individualized tax or legal advice. Our standard
    of care is to guide you toward product suitability while deferring specific tax
    strategies to certified CPAs.


    **Important Tax Warnings**

    - **Early Withdrawals:** Taking distributions from your Rollover IRA before age
    59½ may result in an Early Withdrawal Penalty of 10% imposed by the IRS, unless
    a qualified exception applies.

    - **RMDs:** Once you reach the applicable age, you must take a Required Minimum
    Distribution (RMD) annually to avoid significant IRS penalties.


    **Fraud Reporting**

    In the event of suspected fraud, we initiate a freeze on affected assets within
    one business hour of the report. Disputes are handled through a formal review
    process with a goal of resolution within 15 business days.


    For additional risk information, please refer to Rollover IRA — risk disclosures.'
  domain: retirement
  product_category: rollover_ira
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 6b1c58e7-135d-59be-913a-6067477cd1bd
  title: Rollover IRA — recognizing scams targeting this product
  body: 'As you compare retirement options, it is vital to recognize that the process
    of moving assets—specifically when consolidating into a Rollover IRA—is a primary
    target for bad actors. Scammers often pose as ''retirement specialists'' or representatives
    from your former employer, urging you to move funds quickly into high-yield, ''exclusive''
    offshore accounts or unverified private equities to avoid immediate taxation.


    We want to be clear: Evergreen Retirement will never pressure you to move assets
    into an external account via an unsolicited phone call or email. We will never
    ask for your full password or multi-factor authentication (MFA) codes over the
    phone to ''verify'' a transfer. Any legitimate request to modify your account
    or initiate a distribution requires a verified secure session and rigorous identity
    verification.


    Common red flags include requests to wire funds to a third party rather than directly
    to our institution, or promises of guaranteed returns that far exceed market norms.
    If you receive a communication that feels urgent or suspicious, do not provide
    any personal information.


    If you suspect your account has been compromised or you have encountered a fraudulent
    solicitation, report it to us immediately. We treat all fraud reports with immediate
    urgency and will initiate a freeze on affected assets within one business hour
    to protect your retirement savings.


    ***

    REGULATORY DISCLAIMER: Evergreen Retirement provides educational resources on
    product suitability. We do not provide individualized tax or legal advice. Please
    consult a certified CPA regarding the tax implications of your rollover strategy.'
  domain: retirement
  product_category: rollover_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: b16c7337-86ca-5097-bc59-ac5b763707ef
  title: Rollover IRA — limits, restrictions, and edge cases
  body: 'The Rollover IRA is a high-capacity consolidation vehicle designed to streamline
    assets from previous employer-sponsored plans. To ensure regulatory precision
    and ERISA compliance, support agents must adhere to the following limits and processing
    standards:


    **Fee Structure**

    To encourage portfolio consolidation and maximize compound growth, we maintain
    a lean fee posture. The account fee for the Rollover IRA is $0.


    **Processing Timelines**

    Asset transfers into the Rollover IRA are subject to a standard transfer processing
    period of 7 days. This duration accounts for the verification of funds and the
    secure movement of assets from the sending institution.


    **Restrictions and Edge Cases**

    - **Direct vs. Indirect Rollovers**: While we facilitate both, indirect rollovers
    (where the client receives the check) trigger a 60-day window to deposit funds
    to avoid the Early Withdrawal Penalty and income tax. We strongly recommend direct
    trustee-to-trustee transfers.

    - **RMD Requirements**: Once the account holder reaches the applicable age, Required
    Minimum Distributions (RMDs) must be taken annually as mandated by the IRS. Failure
    to meet these distributions may result in significant tax penalties.

    - **Early Withdrawals**: Distributions taken before age 59½ are typically subject
    to an Early Withdrawal Penalty of 10%, unless a specific IRS exception is documented.


    **Compliance Standard**

    All state-changing actions, including the initiation of a rollover or distribution,
    require mandatory multi-factor authentication (MFA). No account modifications
    are permitted without a verified secure session.'
  domain: retirement
  product_category: rollover_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
