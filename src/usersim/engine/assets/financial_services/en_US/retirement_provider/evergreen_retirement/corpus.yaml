- id: aaff9d78-35f0-5afe-a296-9db188d10c3d
  title: Rollover IRA — a failed or pending action
  body: '**Symptom**: You have initiated a transfer of assets from a previous employer
    plan, but the funds have not appeared in your Rollover IRA after the expected
    timeframe.


    **Likely Causes**:

    *   **Incorrect Account Details**: The previous custodian may have had incorrect
    wiring instructions or account numbers.

    *   **Verification Failure**: The transfer may be held if the identity verification
    or MFA session was not fully completed.

    *   **Custodian Delay**: The sending institution may be experiencing internal
    processing delays.


    **What to Check**:

    1. Verify that you provided the correct account number from your previous employer
    plan.

    2. Confirm that you completed the secure identity verification process required
    for all state-changing actions.

    3. Check the elapsed time since the request; remember that the transfer processing
    days are 7 days.


    **The Fix**:

    If the 7 days have passed and the funds are not visible, tell us the date the
    transfer was initiated. We will contact the previous custodian to track the assets
    and resolve any discrepancies in the transfer instructions.


    **Escalation**:

    If we cannot locate the assets within two business days of your report, we will
    escalate the matter to our Senior Compliance Officers for a final regulatory review.
    You will receive a status update via secure chat or phone within 24 hours of the
    escalation.'
