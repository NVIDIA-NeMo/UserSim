- id: 4a5f6ec3-98c9-5c1f-87b6-602344ac1dd8
  title: Rollover IRA — fraud and unauthorized-activity protection
  body: "At Evergreen Retirement, we prioritize the stability of your retirement assets.\
    \ Because the Rollover IRA is often used to consolidate significant sums from\
    \ previous employers, it can be a target for sophisticated fraud patterns, such\
    \ as 'urgent' requests to move funds to a 'secure' external account or phishing\
    \ attempts posing as former employer plan administrators.\n\nWe want to be clear:\
    \ Evergreen Retirement will never ask you to provide your password, multi-factor\
    \ authentication (MFA) codes, or full Social Security number via email or unsecured\
    \ chat. We will never pressure you to move assets into an account not in your\
    \ own name to 'avoid a tax penalty'.\n\nIf you notice any unauthorized activity\
    \ or suspect that your account credentials have been compromised, notify us immediately.\
    \ We treat all fraud reports with immediate urgency. Upon receiving a verified\
    \ report of fraud, we will initiate a freeze on affected assets within one business\
    \ hour to prevent further loss. \n\nTo ensure the absolute privacy of your PII\
    \ and the security of your funds, multi-factor authentication (MFA) and rigorous\
    \ identity verification are mandatory before any state-changing action, such as\
    \ initiating a distribution or changing contribution settings. No account modifications\
    \ are permitted without a verified secure session.\n\nFor further information\
    \ on our general approach to protecting your accounts, you may refer to Traditional\
    \ 401(k) — account security best practices."
  domain: retirement
  product_category: rollover_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
