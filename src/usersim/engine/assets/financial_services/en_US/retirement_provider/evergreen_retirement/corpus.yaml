- id: 1677306e-c478-5c43-ab26-b07a5240009b
  title: Traditional IRA — risk disclosures
  body: 'This document provides essential regulatory disclosures regarding the Traditional
    IRA. Please read these carefully as they affect your tax liability and asset access.


    Tax Treatment and Penalties: The Traditional IRA is a pre-tax accumulation vehicle.
    Contributions may be tax-deductible depending on your income and employer plan
    participation. However, distributions are taxed as ordinary income. We explicitly
    warn that the IRS imposes an early withdrawal penalty of 10% on distributions
    taken before the account holder reaches age 59½, unless a qualified exception
    is met.


    Required Minimum Distributions (RMDs): To comply with IRS frameworks, account
    holders must begin taking Required Minimum Distributions (RMDs) after reaching
    a certain age. Failure to withdraw the RMD can result in significant tax penalties.


    Investment Risk: While we guide clients toward product suitability, all investments
    involve risk. Past performance does not guarantee future results. Our management
    aims for stability, but the value of assets can fluctuate.


    Professional Advice Warning: Evergreen Retirement provides comprehensive educational
    resources on contribution limits and RMDs. However, we do not provide individualized
    tax or legal advice. We strongly recommend that you consult with a certified CPA
    to develop specific tax strategies tailored to your financial situation.


    Privacy and Compliance: We adhere strictly to DOL and IRS frameworks, ensuring
    all personally identifiable information (PII) is handled with absolute privacy
    and in accordance with ERISA compliance standards.'
  domain: retirement
  product_category: traditional_ira
  document_type: disclosure
  source_authority: official
