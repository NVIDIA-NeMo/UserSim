  institution_id: evergreen_retirement
- id: b5682391-67f8-52e8-b7ec-2792ecf79c35
  title: SEP IRA — contribution limit pct comp explained
  body: '**How is the percentage-based contribution limit calculated?**

    For the SEP IRA, the contribution limit is defined as 25% of the employer''s compensation.
    This means the amount you contribute as an employer is based on a percentage of
    the employee''s (or your own, if self-employed) eligible compensation for the
    year.


    **Does the percentage limit always apply?**

    Yes, the 25% limit is the primary ceiling for contributions. However, this amount
    is also subject to the overall annual contribution cap of $70,000. Your total
    contribution for the year cannot exceed whichever of these two figures is lower.


    **Where can I find more details on the maximum dollar amount?**

    For a detailed explanation of the hard ceiling on contributions, please refer
    to SEP IRA — annual contribution cap explained.'
  domain: retirement
