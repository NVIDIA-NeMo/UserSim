- id: 6531f272-7576-548e-bbc0-96a9abf5dc1e
  title: Rollover IRA — regulatory disclosures
  body: 'This disclosure outlines the regulatory framework governing the Rollover
    IRA at Evergreen Retirement. We adhere strictly to Department of Labor (DOL) and
    Internal Revenue Service (IRS) frameworks, ensuring full ERISA compliance across
    all retirement products.


    **Asset Protection and Fees**

    Evergreen Retirement provides the Rollover IRA as a zero-fee consolidation vehicle.
    The account fee is $0. This is intended to maximize the compound growth of the
    investor''s assets. Please be advised that this fee waiver applies to account
    maintenance; it does not exempt the account from fees associated with active asset
    management or specific investment product costs.


    **Tax Obligations and Penalties**

    Account holders are responsible for ensuring that all rollovers are performed
    in accordance with IRS regulations to maintain the tax-deferred status of the
    assets. Distributions are subject to federal and state income taxes. A critical
    regulatory point is the Early Withdrawal Penalty: the IRS typically imposes a
    10% penalty for distributions taken before the age of 59½, unless a qualified
    exception is met.


    **Required Minimum Distributions (RMDs)**

    Upon reaching the age designated by the IRS, account holders must begin taking
    Required Minimum Distributions (RMDs). Failure to withdraw the minimum annual
    amount required by the IRS can result in significant tax penalties.


    **Professional Advice Boundary**

    Evergreen Retirement provides comprehensive educational resources regarding RMDs
    and contribution limits. However, we do not provide individualized tax or legal
    advice. Our standard of care is to guide clients toward product suitability, while
    all specific tax strategies must be deferred to a certified CPA.


    **Privacy and Security**

    We prioritize the absolute privacy of Personally Identifiable Information (PII).
    No state-changing actions, including distributions or contribution changes, are
    permitted without a verified secure session and mandatory multi-factor authentication
    (MFA).'
  domain: retirement
  product_category: rollover_ira
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 358c409d-ead2-5bee-8525-98b8ff13edeb
  title: Rollover IRA — interest rate / APY schedule
  body: 'The Rollover IRA is a consolidation vehicle designed to house various investment
    assets. Because this account is used for managed portfolios rather than as a static
    savings account, there is no single flat annual interest rate or APY applied to
    the account balance itself.


    Instead, the yield on your Rollover IRA is determined by the performance of the
    specific assets selected within the portfolio. These may include equities, bonds,
    or other managed funds. We focus on maximizing compound growth by maintaining
    an account fee of $0, ensuring that no maintenance costs detract from the returns
    generated by your investments.


    Asset yields are quoted based on the underlying security''s performance and are
    subject to market fluctuations. For a detailed review of current asset performance
    and how it affects your portfolio''s growth, please request a current portfolio
    valuation statement.'
