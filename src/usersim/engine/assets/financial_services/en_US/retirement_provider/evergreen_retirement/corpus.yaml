- id: 2d0b38d9-00c2-5877-9080-7ead644d5b61
  title: Rollover IRA — eligibility requirements
  body: 'To maintain ERISA compliance and IRS tax-deferred status, the following eligibility
    requirements must be met for the Rollover IRA:


    | Condition | Outcome |

    | :--- | :--- |

    | Assets originate from a qualified employer-sponsored plan (e.g., 401(k), 403(b))
    | Eligible for Rollover IRA |

    | Assets originate from a non-qualified account | Ineligible (consider Traditional
    IRA) |

    | Account holder has passed MFA and identity verification | Eligible to activate
    account |

    | Assets are transferred via direct rollover (custodian to custodian) | Eligible
    for $0 account fee |

    | Assets are transferred via indirect rollover (check sent to holder) | Eligible,
    but subject to 60-day IRS window |


    All applicants must undergo rigorous identity verification before an account is
    opened.'
