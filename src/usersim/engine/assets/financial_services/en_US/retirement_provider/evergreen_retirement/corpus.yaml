  institution_id: evergreen_retirement
- id: f9acdb72-1a85-5a80-9ee5-bfdd330288fc
  title: Traditional 401(k) — getting started walkthrough
  body: 'This walkthrough is designed to assist support agents in guiding new clients
    through the activation of their Traditional 401(k), a high-limit, employer-sponsored
    savings vehicle designed for maximum pre-tax accumulation.


    Step 1: Verification and Onboarding

    Confirm the client''s identity through our mandatory verification process. Ensure
    the client is an employee of a participating employer and that all PII is captured
    accurately to maintain ERISA compliance.


    Step 2: Establishing Contributions

    Guide the client in selecting their pre-tax contribution amount. Inform the client
    that the standard employee contribution limit is $23,500. For clients aged 50
    and older, explain the availability of the catch-up limit of $7,500, which allows
    for additional annual savings.


    Step 3: Investment Election

    Assist the client in selecting their asset allocation. Our standard of care is
    to guide the client toward product suitability based on their career stage, while
    deferring specific tax strategies to their certified CPA.


    Step 4: Security Setup

    Ensure the client has activated multi-factor authentication (MFA). Explain that
    no account modifications, such as distribution requests, can be performed without
    a verified secure session.


    Step 5: Disclosure Review

    Confirm the client has received and understands the regulatory disclosures, specifically
    regarding the early withdrawal penalty of 10% for distributions taken before age
    59½, unless a legal exception applies.


    Once these steps are complete, the account is considered active and the first
    contribution cycle can begin. For detailed setup steps, refer to Traditional 401(k)
    — set up and activate.'
  domain: retirement
  product_category: traditional_401k
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: e822e832-291d-5423-912d-7bc31034fcee
  title: Traditional 401(k) — early withdrawal penalty explained
  body: 'Q: What happens if I need to withdraw funds from my Traditional 401(k) before
    retirement age?


    A: Distributions taken before the age of 59½ are generally subject to an early
    withdrawal penalty of 10% imposed by the IRS, in addition to applicable ordinary
    income taxes. This is designed to discourage the use of retirement funds for short-term
    needs.


    Q: Are there any exceptions to this 10% penalty?


    A: Yes, the IRS allows for certain exceptions, such as total and permanent disability
    or specific qualified hardship withdrawals. Because we do not provide individualized
    tax or legal advice, we strongly recommend consulting a certified CPA to determine
    if your situation qualifies for an exception.


    Q: How does this differ from other accounts?


    A: While the 10% penalty is a standard IRS rule for most pre-tax accounts, including
    the Traditional IRA, the specific rules for ''hardship'' may vary by employer
    plan. For a broader view of limits, see Traditional 401(k) — employee contribution
    limit explained.'
  domain: retirement
  product_category: traditional_401k
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: c781b337-feee-5054-bb62-e81a1317bab3
  title: Traditional 401(k) — make a change or update
  body: 'To update the parameters of your Traditional 401(k), please follow these
    steps. Note that because these are state-changing actions, a verified secure session
    is required.


    1. Provide Verification: State the specific change you wish to make (e.g., changing
    your contribution percentage). We will then perform a mandatory identity verification
    and multi-factor authentication (MFA) check.


    2. Specify the New Amount: Provide the new contribution amount or percentage.
    If you are increasing your savings, ensure the total does not exceed the employee
    contribution limit of $23,500 (or $31,000 if you are age 50+ utilizing the $7,500
    catch-up limit).


    3. Review Investment Elections: If you are also updating where your funds are
    allocated, specify the new investment choices. We will confirm the suitability
    of these products for your stated retirement timeline.


    4. Confirm the Change: We will provide a summary of the update, including the
    effective date for the next payroll cycle. Confirm that these details are correct.


    5. Receive Verification: We will send a confirmation message via secure chat once
    the update has been applied to your account records.


    Your update is complete once you receive the final confirmation. For reversing
    these changes or closing the account, refer to Traditional 401(k) — cancel, close,
    or downgrade.'
  domain: retirement
  product_category: traditional_401k
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: c732ca46-fd5d-5aaa-b4ce-efa73aafe714
  title: Traditional 401(k) — access or login problems
  body: 'If you are unable to access your Traditional 401(k) account, please follow
    these troubleshooting steps to resolve the issue.


    Symptom: ''I cannot log in'' or ''My MFA code is not arriving.''


    Likely Causes:

    1. Expired credentials or incorrect password.

    2. MFA delivery delays due to network issues.

    3. Account freeze due to suspected fraudulent activity.


    What to check in order:

    - First, verify that you are using the correct login identifier associated with
    your employer plan.

    - Second, check your registered mobile device or email for the MFA code. Wait
    at least 60 seconds before requesting a new code to avoid invalidating the previous
    one.

    - Third, check your secure chat history for any notifications regarding a security
    freeze.


    How to fix it:

    - If the password is forgotten, request a secure reset. We will verify your identity
    through our mandatory protocol before providing a temporary credential.

    - If MFA is failing, we will verify your identity through an alternative method
    to update your contact information and re-sync the MFA device.


    When to escalate:

    - If we cannot verify your identity through standard MFA or if your account has
    been frozen due to a fraud report, we will escalate your case to our Senior Compliance
    Officers for a final review. You will receive a status update via secure chat
    within one business day regarding the resolution of the access block. For other
    transaction errors, see Traditional 401(k) — a failed or pending action.'
  domain: retirement
  product_category: traditional_401k
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 8c61f6ac-06f3-541c-ba37-ad24c0001fe6
  title: Traditional 401(k) — qualification tiers
  body: 'The following matrix defines the contribution qualifications for the Traditional
    401(k). Support agents should use this to determine the maximum allowable input
    for a client.


    | Client Profile | Base Contribution Limit | Additional Catch-up | Total Annual
    Limit |

    | :--- | :--- | :--- | :--- |

    | Employee under age 50 | $23,500 | Not Applicable | $23,500 |

    | Employee age 50 or older | $23,500 | $7,500 | $31,000 |

    | Non-Employee / Individual | Not Eligible | Not Eligible | N/A |


    Note: All contributions must be made via employer-sponsored payroll deferral.
    For documentation requirements to prove employment status, see Traditional 401(k)
    — required documentation.'
