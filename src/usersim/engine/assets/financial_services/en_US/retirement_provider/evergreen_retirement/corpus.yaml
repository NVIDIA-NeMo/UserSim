- id: 06726bdd-62ec-59b4-bf11-c2bbe60e8e82
  title: Roth IRA — resolve a common request end-to-end
  body: "A common request for Roth IRA holders is the 'Contribution Max-Out'—ensuring\
    \ the full annual limit is utilized before the tax deadline. This guide walks\
    \ you through the process of maximizing your contributions.\n\n**Prerequisites**\n\
    - A linked bank account with sufficient funds.\n- Your current year-to-date contribution\
    \ total (which we can provide upon request).\n\n**Steps to Maximize Contributions**\n\
    1. Ask us for your current total contributions for the tax year. \n2. We will\
    \ verify your identity via MFA and provide the exact amount you have contributed\
    \ so far toward the $7000 limit.\n3. Calculate the remaining balance (e.g., if\
    \ you have contributed $3000, you have $4000 remaining). \n4. Tell us the specific\
    \ amount you wish to contribute to reach the $7000 limit.\n5. We will verify that\
    \ the request does not exceed the legal annual limit and that your current income\
    \ remains compatible with the income phaseout single start of $146000.\n6. Confirm\
    \ the funding source. We will then initiate the transfer and provide a transaction\
    \ confirmation number.\n\n**Confirmation**\nThe process is complete when you receive\
    \ the transaction confirmation and your updated account status reflects a total\
    \ annual contribution of $7000.\n\n***\nREGULATORY DISCLAIMER: Evergreen Retirement\
    \ provides educational resources on contribution limits but does not provide individualized\
    \ tax or legal advice. Please consult a certified CPA to ensure your income levels\
    \ allow for these contributions."
  domain: retirement
  product_category: roth_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: c9d76448-959b-5376-8f39-c6b917b9a4bc
  title: Roth IRA — a discrepancy in your records or statement
  body: 'If you notice a discrepancy in your Roth IRA balance, contribution history,
    or monthly statement, we treat this with the utmost seriousness to ensure regulatory
    precision.


    **Common Symptoms**

    - The total contributions shown are higher or lower than your personal records.

    - A deposit you made is not appearing in the transaction history.

    - The balance does not reflect expected earnings or recent distributions.


    **What to Check First**

    1. **Pending Transactions**: Verify if the missing amount is listed as ''pending''.
    Transfers can take several business days to settle.

    2. **Contribution Limits**: Check if a contribution was declined because it would
    have exceeded the $7000 annual limit.

    3. **Statement Dates**: Ensure you are reviewing the statement for the correct
    calendar month or tax year.


    **How to Resolve**

    1. Tell us the specific transaction date and amount that is missing or incorrect.

    2. We will verify your identity via a secure MFA session.

    3. We will conduct a manual audit of the transaction logs for your account.

    4. If the error is on our end, we will correct the record and provide an updated
    statement immediately.


    **Escalation**

    If the discrepancy cannot be resolved during the conversation, we will initiate
    a formal review process. We aim to resolve all record disputes within 15 business
    days. During this time, you will receive a case number and a final resolution
    summary once the Senior Compliance Officers have completed their review.'
  domain: retirement
  product_category: roth_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: eb9ceada-78c9-53c3-9a7f-6747bd1db0f5
  title: Traditional IRA — overview
  body: 'The Traditional IRA is a flexible, individual pre-tax account designed for
    those without employer-sponsored plans or for professionals seeking additional
    savings to secure their future. At Evergreen Retirement, we focus on stability
    and regulatory precision, providing a seamless transition from the accumulation
    phase of your career to the distribution phase of retirement.


    One of the primary advantages of this account is the potential for immediate tax
    benefits, as contributions may be tax-deductible. To maintain compliance with
    IRS frameworks, we enforce strict annual limits. The standard annual contribution
    limit is $7,000. For our clients aged 50 and older, we offer a catch-up limit
    of $1,000, allowing those in the later stages of their career to accelerate their
    savings.


    We prioritize lean, transparent fee structures to maximize your compound growth.
    While we provide comprehensive educational resources on product suitability, we
    defer specific tax strategies to certified CPAs. Please be aware that these accounts
    are designed for long-term growth; taking distributions before age 59½ typically
    triggers an early withdrawal penalty of 10% imposed by the IRS, unless a specific
    exception applies.


    Our commitment to your security means that multi-factor authentication (MFA) and
    rigorous identity verification are mandatory before any state-changing action,
    such as modifying your contributions or requesting a distribution. We ensure all
    your personal information remains private and that your assets are managed with
    the highest standard of care.'
  domain: retirement
  product_category: traditional_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 90703efc-1a28-56f1-a38a-38b0a3e715e8
  title: Traditional IRA — annual contribution limit explained
  body: 'Q: What is the maximum amount I can contribute to my Traditional IRA each
    year?


    A: For the current tax year, the standard annual contribution limit is $7,000.
    This limit applies to your total contributions across all your traditional and
    Roth IRAs.


    Q: Can I contribute more if I am over the age of 50?


    A: Yes. We support the IRS provision for Catch-up Contributions, which allows
    individuals aged 50 and older to contribute an additional $1,000 above the standard
    limit.


    Q: What happens if I exceed these limits?


    A: Exceeding the annual limit can result in IRS tax penalties. We provide the
    tools to track your contributions, but we recommend consulting a certified CPA
    for individualized tax advice to ensure your strategy remains compliant. For more
    details on how these limits interact with other products, you may review the Traditional
    IRA — overview.'
  domain: retirement
  product_category: traditional_ira
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: fcd9e4d4-4cc6-564d-99e4-98ce3a88ea67
  title: Traditional IRA — set up and activate
  body: 'Setting up your Traditional IRA is a streamlined process designed to get
    your assets working for you as quickly as possible. Before starting, ensure you
    have your government-issued identification and your Social Security number ready.


    1. Provide your personal details and employment information to our representative.
    We will use this to establish your identity and ensure you meet the basic requirements
    for a pre-tax account.

    2. Specify your initial funding amount. You may choose to fund the account via
    a one-time transfer or by setting up a recurring contribution. Note that your
    total annual contributions cannot exceed the $7,000 limit (or $8,000 if you are
    aged 50 or older).

    3. Designate your beneficiaries. We will ask for the names and relationship of
    the individuals who should inherit the account assets.

    4. Complete the mandatory identity verification. We will guide you through a secure
    session involving multi-factor authentication (MFA) to authorize the account opening.

    5. Review and accept the account agreement. We will provide the final terms, including
    the 10% early withdrawal penalty for distributions taken before age 59½.


    Once these steps are complete, we will confirm the account activation. You will
    receive a confirmation notice and can immediately begin directing contributions
    toward your retirement goals. If you are considering consolidating other accounts,
    you may also want to explore the Rollover IRA — overview.'
  domain: retirement
  product_category: traditional_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 788993a3-03bd-5d37-b62f-e1a01288809c
  title: Traditional IRA — fee schedule
  body: 'Evergreen Retirement maintains a lean fee structure to ensure that the majority
    of your returns contribute to your compound growth. For the Traditional IRA, fees
    are primarily tied to the active management of your assets.


    • Account Maintenance Fee: $0 (Basic maintenance is waived to encourage long-term
    portfolio stability).

    • Asset Management Fee: Based on the specific investment vehicle selected within
    the IRA.

    • Early Withdrawal Penalty: 10% (This is a regulatory penalty imposed by the IRS
    for distributions taken before age 59½, not a fee charged by Evergreen Retirement).


    We believe in total transparency. All fees are disclosed upfront and can be found
    on your monthly statements. For a broader view of our institution''s pricing,
    refer to Institution-wide fees and charges.'
