- id: 7010a036-fc0e-583e-aafb-876f412c9182
  title: Traditional IRA — account security best practices
  body: 'At Evergreen Retirement, we prioritize the absolute privacy of your personally
    identifiable information (PII) and the security of your retirement assets. To
    maintain the integrity of your Traditional IRA, we require multi-factor authentication
    (MFA) and rigorous identity verification before any state-changing action is permitted,
    such as changing your contribution amounts or requesting distributions.


    Existing customers should be aware of common security threats. We will never ask
    you to provide your password, MFA codes, or full social security number via email
    or unsolicited text messages. Be wary of any communication that creates a sense
    of false urgency regarding your account status or threatens immediate penalties
    unless you provide sensitive data.


    If you suspect unauthorized activity or identify a fraudulent transaction, report
    it to us immediately. We treat all fraud reports with immediate urgency and will
    initiate a freeze on affected assets within one business hour to prevent further
    loss. Once a report is filed, our formal review process begins with a goal of
    resolution within 15 business days.


    To keep your account secure:

    1. Never share your login credentials with third parties.

    2. Ensure your secure session is active and verified before attempting to modify
    account settings.

    3. Regularly review your account statements for any discrepancies.


    By adhering to these practices, you help us maintain the high standard of regulatory
    precision and security that defines our institution.'
  domain: retirement
