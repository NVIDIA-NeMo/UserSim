- id: c0672cb4-198d-5576-a1e4-d5e931e81e41
  title: Traditional 401(k) — fraud and unauthorized-activity protection
  body: 'At Evergreen Retirement, we recognize that the significant accumulation of
    assets in a Traditional 401(k) can make account holders a target for sophisticated
    fraud. Common patterns targeting these accounts include ''employer impersonation,''
    where bad actors pose as HR representatives to redirect contributions, and ''urgent
    distribution'' scams, where fraudsters pressure clients into making early withdrawals
    to ''protect'' their funds from a non-existent threat.


    We maintain a rigorous security posture to protect your retirement. Please be
    aware that Evergreen Retirement will never ask for your full password or multi-factor
    authentication (MFA) codes via email or text. Any request to change your contribution
    limits or initiate a distribution requires a verified secure session with mandatory
    multi-factor authentication.


    If you notice any unauthorized activity—such as an unexpected change to your beneficiary
    or an unapproved distribution request—we urge you to notify us immediately. We
    treat all fraud reports with immediate urgency, initiating a freeze on affected
    assets within one business hour of the report. Prompt reporting is critical to
    limiting your liability and ensuring the swift recovery of assets.


    For further details on our security standards, please refer to Traditional 401(k)
    — account security best practices.'
  domain: retirement
  product_category: traditional_401k
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: b7d420fe-3d43-5e69-bfe6-3dbbd5640d75
  title: Traditional 401(k) — account agreement
  body: 'This agreement governs the relationship between the account holder and Evergreen
    Retirement regarding the Traditional 401(k). By maintaining this account, the
    client agrees to adhere to the following terms:


    1. Contribution Limits: The client agrees to limit employee contributions to $23,500
    per calendar year. For individuals aged 50 and older, a catch-up contribution
    limit of $7,500 is permitted. Contributions exceeding these IRS-mandated thresholds
    may be subject to corrective distributions and tax penalties.


    2. Distributions and Penalties: We facilitate distributions upon request, provided
    the identity of the account holder is verified through a secure session. The client
    acknowledges that distributions taken before the age of 59½ are generally subject
    to an early withdrawal penalty of 10% imposed by the IRS, unless a specific regulatory
    exception applies.


    3. Account Modifications: All state-changing actions, including contribution updates
    or distribution requests, are subject to mandatory multi-factor authentication
    (MFA). No modifications will be processed without a verified secure session.


    4. Fee Obligations: We apply a lean fee structure primarily tied to active asset
    management. All fees are disclosed in the accompanying fee schedule and are deducted
    directly from account assets to maximize compound growth.


    5. Termination: This agreement ends upon the full distribution of assets or the
    transfer of the account to another qualified provider. We reserve the right to
    freeze assets within one business hour if fraud is suspected, as outlined in our
    dispute and fraud handling policies.'
  domain: retirement
  product_category: traditional_401k
  document_type: terms_conditions
  source_authority: official
  placeholder: true
