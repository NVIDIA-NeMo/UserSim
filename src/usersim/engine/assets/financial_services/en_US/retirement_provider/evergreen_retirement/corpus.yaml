- id: 7e4e14d1-b35d-50c4-beb9-33c3d8bcd06a
  title: SEP IRA — fraud and unauthorized-activity protection
  body: "At Evergreen Retirement, we prioritize the security of your business assets.\
    \ Because a SEP IRA is designed for self-employed individuals and small business\
    \ owners, it is often targeted by sophisticated phishing schemes. Fraudsters may\
    \ impersonate regulatory bodies or tax authorities, claiming there is an urgent\
    \ issue with your business tax filings to coerce you into transferring funds to\
    \ an 'escrow' or 'verification' account.\n\nWe want to be clear: Evergreen Retirement\
    \ will never ask you to provide your password, multi-factor authentication (MFA)\
    \ codes, or full Social Security number via email or unsecured chat. We will never\
    \ pressure you to move assets to an external account to 'protect' them from a\
    \ government seizure.\n\nIf you notice any unauthorized activity or suspect your\
    \ account credentials have been compromised, notify us immediately. We treat all\
    \ fraud reports with immediate urgency and will initiate a freeze on affected\
    \ assets within one business hour to prevent further loss. \n\nTo maintain the\
    \ integrity of your retirement savings, we require mandatory multi-factor authentication\
    \ and rigorous identity verification before any state-changing action is permitted,\
    \ such as changes to contribution amounts or requests for distributions. No account\
    \ modifications are permitted without a verified secure session. For more information\
    \ on general security practices, you may refer to Traditional 401(k) — account\
    \ security best practices."
  domain: retirement
  product_category: sep_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 7bae3c6e-e2a4-5556-a9c8-43306fe26528
  title: SEP IRA — account agreement
  body: "This account agreement governs the relationship between the account holder\
    \ and Evergreen Retirement regarding the SEP IRA. \n\n1. Contributions: The account\
    \ holder is obligated to adhere to IRS and DOL guidelines. Contributions are limited\
    \ to the lesser of 25% of compensation or an annual contribution cap of $70,000.\
    \ Any contributions exceeding these limits may be subject to IRS penalties. We\
    \ defer specific tax strategies and calculations to your certified CPA.\n\n2.\
    \ Management and Fees: Evergreen Retirement maintains a lean fee structure primarily\
    \ tied to active asset management. The client agrees to the fee schedule provided\
    \ at account opening. We reserve the right to modify fees with 30 days' prior\
    \ notice.\n\n3. Account Security: The account holder agrees to maintain the confidentiality\
    \ of their access credentials. All distributions and contribution changes require\
    \ multi-factor authentication (MFA). We will freeze assets within one business\
    \ hour of a verified fraud report.\n\n4. Distributions and RMDs: The account holder\
    \ is responsible for initiating Required Minimum Distributions (RMDs) as mandated\
    \ by the IRS. Failure to withdraw the RMD may result in significant tax penalties.\
    \ We provide educational resources on RMDs but do not provide individualized tax\
