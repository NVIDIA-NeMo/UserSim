  institution_id: evergreen_retirement
- id: f87d5f3f-fa43-5bbf-b645-51224bdc2fe3
  title: Roth IRA — access or login problems
  body: 'If you are experiencing difficulties accessing your Roth IRA account, the
    issue is typically related to security verification or session timeouts. Please
    follow these steps to resolve the problem:


    Symptom: ''Unable to complete login'' or ''MFA code not received.''


    1. Check Connection: Ensure you are using a secure internet connection. Our system
    may block access from unrecognized or high-risk networks to protect your PII.

    2. Verify MFA Method: Confirm that the device registered for Multi-factor authentication
    (MFA) is active. If you have changed your phone number, you will need to undergo
    a manual identity verification process.

    3. Clear Cache: In some cases, outdated browser data can interfere with the secure
    session. Clear your browser cache and attempt to log in again.

    4. Attempt a Password Reset: If you suspect your password is incorrect, use the
    ''forgot password'' flow, which will trigger a new MFA challenge.


    When to Escalate:

    If you have followed these steps and still cannot access your account, or if you
    receive a notification that your account has been frozen due to suspicious activity,
    let us know immediately. We will escalate the matter to our security team. In
    the event of suspected fraud, we initiate a freeze on affected assets within one
    business hour.


    Once the issue is escalated, a security specialist will review your identity documentation
    and contact you via your verified phone number to restore access. For similar
    issues with other products, you may see Traditional 401(k) — access or login problems.'
  domain: retirement
  product_category: roth_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 0ff4d74d-d116-5e21-afc5-e276b764e28e
  title: Roth IRA — qualification tiers
  body: 'The following matrix defines the eligibility for direct contributions to
    a Roth IRA based on IRS income thresholds for the current tax year. Support agents
    should use this to determine if a client can contribute directly.


    | Client Profile | Income Threshold | Eligibility Outcome |

    | :--- | :--- | :--- |

    | Single Filer | Below $146,000 | Full Contribution allowed up to $7,000 |

    | Single Filer | $146,000 - Phaseout Ceiling | Partial Contribution allowed (Reduced
    limit) |

    | Single Filer | Above Phaseout Ceiling | Ineligible for direct contributions
    |

    | Married Filing Jointly | Refer to IRS Table | Based on joint income limits |


    Clients who exceed these limits may still be able to fund their retirement through
    other vehicles. For instance, those with employer-sponsored plans should review
    Traditional 401(k) — eligibility requirements.'
  domain: retirement
  product_category: roth_ira
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 30296aa0-7fd1-5872-af09-e2731027bf0f
  title: Roth IRA — choosing between tiers or options
  body: 'When deciding how to allocate your retirement savings, the choice often comes
    down to when you prefer to pay taxes. The Roth IRA is designed for those who prioritize
    tax-free growth and qualified withdrawals in retirement.


    Compared to a Traditional IRA, the Roth IRA requires after-tax contributions,
    meaning you do not get a tax deduction today. However, you benefit from the ability
    to withdraw your earnings tax-free after age 59½. Both accounts share a similar
    structure regarding individual management, but the Roth IRA is often more attractive
    to those who expect to be in a higher tax bracket during retirement.


    For those who have access to an employer-sponsored plan, the Traditional 401(k)
    allows for significantly higher pre-tax accumulation limits than the $7,000 limit
    found in the Roth IRA. However, the Roth IRA offers greater flexibility for those
    seeking a tax-free bucket of assets.


    Choose the Roth IRA if you value tax-free distributions and have a taxable income
    below the phaseout start of $146,000 (for single filers). Choose a Traditional
    401(k) if you seek the maximum possible pre-tax deduction and high-limit contributions.'
  domain: retirement
  product_category: roth_ira
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 16cc9e08-5f1c-5495-afa5-80d469d87a42
  title: Roth IRA — privacy and data handling
  body: 'Evergreen Retirement is committed to the absolute privacy of your personally
    identifiable information (PII) and the secure management of your financial data.
    We adhere strictly to DOL and IRS frameworks, emphasizing ERISA compliance across
    all our retirement products.


    Your data is used exclusively for the administration of your Roth IRA, the processing
    of contributions (up to the annual limit of $7,000), and the facilitation of required
    reporting to the IRS. We do not sell client data to third parties. Access to your
    account information is restricted to authorized personnel and is subject to rigorous
    internal audits.


    To ensure the integrity of your assets, we employ mandatory Multi-factor authentication
    (MFA) and identity verification for all state-changing actions. This prevents
    unauthorized modifications to your distributions or contribution settings. In
    the event of a data breach or suspected fraud, we maintain a protocol to freeze
    affected assets within one business hour of the report.


    Clients should be aware that certain information must be disclosed to regulatory
    bodies as required by law, specifically regarding income verification for those
    near the $146,000 single-filer phaseout threshold. All such disclosures are handled
    through secure, encrypted channels.


    For a comprehensive look at our risk posture, please consult Roth IRA — regulatory
    disclosures.'
  domain: retirement
  product_category: roth_ira
  document_type: disclosure
  source_authority: official
