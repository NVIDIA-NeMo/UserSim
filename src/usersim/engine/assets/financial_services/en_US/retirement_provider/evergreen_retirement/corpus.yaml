- id: 0afc3ff0-b681-5a0f-b0c7-243bff4d641e
  title: Roth IRA — vs. a similar product here
  body: 'When choosing between a Roth IRA and a Traditional IRA, the primary decision
    factor is when you prefer to pay taxes.


    **Roth IRA**

    - **Tax Treatment:** After-tax contributions; tax-free qualified withdrawals.

    - **Contribution Limit:** $7000 annually.

    - **Income Restrictions:** Single filers face a phaseout starting at $146000.

    - **Best for:** Professionals who expect to be in a higher tax bracket during
    retirement or those who prioritize tax-free growth.


    **Traditional IRA**

    - **Tax Treatment:** Pre-tax contributions (typically tax-deductible); withdrawals
    are taxed as ordinary income.

    - **Contribution Limit:** $7000 annually.

    - **Income Restrictions:** No income limit to open/contribute, though tax deductibility
    is phased out based on income and employer plan access.

    - **Best for:** Those who prefer an immediate tax break and expect to be in a
    lower tax bracket during retirement.


    Both products offer the same annual contribution limit of $7000, but they serve
    different tax strategies. Please refer to Traditional IRA — overview for more
    on the pre-tax alternative.'
  domain: retirement
  product_category: roth_ira
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: c8e2d5b5-8cbd-5717-9303-a60574d6744f
  title: Roth IRA — regulatory disclosures
  body: "This account is governed by the Internal Revenue Code and is maintained in\
    \ strict accordance with Department of Labor (DOL) and IRS frameworks. Evergreen\
    \ Retirement emphasizes ERISA compliance across all retirement products to ensure\
    \ the fair treatment of investors.\n\n**Contribution Limits and Eligibility**\n\
    The maximum annual contribution to a Roth IRA is $7000. Eligibility to contribute\
    \ is subject to Modified Adjusted Gross Income (MAGI) limits. For single filers,\
    \ the income phaseout begins at $146000. Contributions made in excess of these\
    \ limits may be subject to a 6% excise tax per year until the excess is withdrawn.\n\
    \n**Distributions and Penalties**\nQualified distributions—those taken after age\
    \ 59½ and following a five-year holding period—are tax-free. However, non-qualified\
    \ distributions of earnings may be subject to ordinary income tax and a 10% Early\
    \ Withdrawal Penalty. \n\n**Privacy and Security**\nWe maintain an absolute commitment\
    \ to the privacy of Personally Identifiable Information (PII). No account modifications,\
    \ including contribution changes or distributions, are permitted without a verified\
    \ secure session using multi-factor authentication (MFA).\n\n**Disclaimer**\n\
    Evergreen Retirement provides comprehensive educational resources on contribution\
    \ limits and RMDs, but we do not provide individualized tax or legal advice. Our\
    \ standard of care is to guide clients toward product suitability while deferring\
    \ specific tax strategies to certified CPAs. All investors should be aware that\
    \ retirement accounts involve market risk, and past performance does not guarantee\
    \ future results."
  domain: retirement
  product_category: roth_ira
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 43cbe8db-2704-5c84-b3e1-b22dcb02b010
  title: Roth IRA — interest rate / APY schedule
  body: "The Roth IRA is an investment vehicle rather than a fixed-rate savings account.\
    \ Therefore, there is no single flat interest rate or APY applied to the account\
    \ balance.\n\nInstead, the yield on your Roth IRA is determined by the performance\
    \ of the underlying assets you select (such as mutual funds, ETFs, or securities).\
    \ The rate of return varies based on the asset class and market conditions. \n\
    \n**Key Factors Influencing Yield:**\n- **Asset Allocation:** The blend of equities,\
    \ bonds, and cash equivalents you choose.\n- **Expense Ratios:** The internal\
    \ costs of the selected funds, which are deducted from the fund's gross return.\n\
    - **Market Volatility:** Fluctuations in the broader financial markets.\n\nAll\
    \ earnings within the Roth IRA grow tax-free, meaning the full yield is retained\
    \ within the account until a qualified distribution is made."
  domain: retirement
  product_category: roth_ira
  document_type: rate_sheet
  source_authority: official
