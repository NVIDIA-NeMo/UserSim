- id: 0d2772c4-6ec9-5621-a4ab-114e1010167f
  title: Rollover IRA — account security best practices
  body: 'At Evergreen Retirement, we maintain a rigorous security posture to protect
    your retirement assets. Because a Rollover IRA often consolidates significant
    lifetime savings, it can be a target for sophisticated phishing and social engineering
    attempts. We urge all clients to adhere to the following best practices to ensure
    the absolute privacy of your PII.


    First, understand that multi-factor authentication (MFA) is mandatory for all
    state-changing actions. We will never ask you to disable MFA or provide your one-time
    passcode over the phone or via email. Any request to do so is a fraudulent attempt
    to gain unauthorized access to your assets.


    Second, be vigilant regarding ''urgent'' requests for distributions. We will never
    initiate a distribution or a change in contribution settings without a verified
    secure session and rigorous identity verification. If you receive a communication
    claiming that your account is frozen or requires immediate ''verification'' via
    an external link, do not click it; instead, initiate a new secure session with
    us directly.


    Third, be aware of the specific risks associated with asset transfers. Fraudsters
    may attempt to impersonate our staff to divert a rollover check to a third-party
    account. Always verify the destination of your assets through your official account
    statements.


    If you suspect any unauthorized activity or believe your credentials have been
    compromised, report it to us immediately. We treat all fraud reports with immediate
    urgency, initiating a freeze on affected assets within one business hour to prevent
    loss. Timely reporting is critical to the recovery of assets and the limitation
    of liability.


    For further guidance on identifying specific threats, you may review Rollover
    IRA — recognizing scams targeting this product.'
  domain: retirement
  product_category: rollover_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 37be8d24-0b00-5b55-b5ea-d8ca7ce24735
