- id: 7071850f-b873-5338-92d1-84a230b431f9
  title: Rollover IRA — risk disclosures
  body: "This document provides essential regulatory disclosures regarding the Rollover\
    \ IRA. Please review these carefully as they impact your tax liability and asset\
    \ security.\n\n**Tax Implications and Penalties:**\nContributions to a Rollover\
    \ IRA are typically made using pre-tax assets. Consequently, distributions are\
    \ generally taxable as ordinary income. Investors should be aware that the IRS\
    \ imposes an Early Withdrawal Penalty (typically 10%) on distributions taken before\
    \ the account holder reaches age 59½, unless a qualifying exception is met. \n\
    \n**Required Minimum Distributions (RMDs):**\nAccount holders must begin taking\
    \ Required Minimum Distributions (RMDs) upon reaching the age specified by the\
    \ IRS. Failure to withdraw the RMD amount can result in significant tax penalties.\
    \ We provide educational resources on RMDs, but we do not provide individualized\
    \ tax advice; we strongly recommend consulting a certified CPA to determine your\
    \ specific distribution strategy.\n\n**Investment Risk:**\nWhile the Rollover\
    \ IRA is a vehicle for consolidation, the assets within the account are subject\
    \ to market risk. There is no guarantee of profit, and the value of your investments\
    \ may decrease.\n\n**Operational Parameters:**\n- **Account Maintenance Fee:**\
    \ $0\n- **Standard Transfer Period:** 7 days\n\n**Regulatory Standard:**\nEvergreen\
    \ Retirement operates in strict accordance with DOL and IRS frameworks, prioritizing\
    \ ERISA compliance across all products. All state-changing actions require a verified\
    \ secure session and multi-factor authentication (MFA) to protect the privacy\
    \ of PII and prevent unauthorized asset movement.\n\n*Disclaimer: Evergreen Retirement\
    \ provides educational guidance on product suitability but does not provide legal\
    \ or tax advice.*"
  domain: retirement
  product_category: rollover_ira
  document_type: disclosure
  source_authority: official
