- id: f988c82e-52f9-5626-975b-810e20315b22
  title: Rollover IRA — set up and activate
  body: 'Setting up your Rollover IRA is a streamlined process designed to ensure
    your assets remain protected and compliant with IRS regulations. Before beginning,
    please have your most recent statement from your previous employer''s retirement
    plan and your legal identification ready.


    1. **Initiate the Request**: Tell us that you wish to open a Rollover IRA and
    provide the details of the account you intend to move. We will verify your identity
    using mandatory multi-factor authentication (MFA) to secure your session.

    2. **Provide Plan Documentation**: Give us the name of the previous plan provider
    and the account number. We will then coordinate with the previous custodian to
    ensure the assets are transferred correctly.

    3. **Confirm Asset Allocation**: Tell us how you would like your consolidated
    funds invested. We will guide you toward product suitability based on your retirement
    timeline and risk tolerance.

    4. **Verify the Transfer**: We will notify you once the assets have arrived. The
    transfer processing days for this action are 7 days.

    5. **Final Account Activation**: We will provide a confirmation statement showing
    your consolidated balance and the $0 account fee. Once you receive this statement,
    your account is fully active and managed.


    Your account is now positioned for maximum compound growth. For more details on
    the timelines involved, you may review the Rollover IRA — transfer processing
    days explained.'
