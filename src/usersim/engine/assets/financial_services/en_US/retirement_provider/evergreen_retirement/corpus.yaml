- id: e92402e6-05c3-5f95-a7a4-c00818876997
  title: Traditional 401(k) — account security best practices
  body: "At Evergreen Retirement, we prioritize the absolute privacy of your personally\
    \ identifiable information and the security of your retirement assets. Because\
    \ the Traditional 401(k) often holds significant pre-tax accumulation, it can\
    \ be a target for sophisticated social engineering. We urge all clients to adhere\
    \ to the following security standards:\n\nFirst, multi-factor authentication (MFA)\
    \ is mandatory for all accounts. We will never ask you to disable MFA or provide\
    \ a one-time pass-code over the phone to a representative. Any request to do so\
    \ is a red flag for fraud.\n\nSecond, be vigilant regarding 'urgent' requests\
    \ for distributions. Fraudsters often create a sense of crisis to bypass standard\
    \ verification. Remember that we require rigorous identity verification and a\
    \ verified secure session before any state-changing action, such as modifying\
    \ your contribution levels or requesting a distribution, can be processed.\n\n\
    Third, verify the source of all communications. Evergreen Retirement will never\
    \ ask for your full password or social security number via email or unsecured\
    \ chat. \n\nIf you suspect unauthorized activity, notify us immediately. We treat\
    \ all fraud reports with immediate urgency and will initiate a freeze on affected\
    \ assets within one business hour of the report. Acting quickly is the best way\
    \ to protect your compound growth and ensure your assets remain secure. For more\
    \ details on our fraud response, please refer to Traditional 401(k) — fraud and\
    \ unauthorized-activity protection."
  domain: retirement
  product_category: traditional_401k
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 81b10a6c-405c-50c7-8b18-5cc1d913f742
  title: Traditional 401(k) — change-of-terms policy
  body: 'This policy governs how Evergreen Retirement modifies the terms, fees, and
    limits associated with the Traditional 401(k). We reserve the right to amend the
    account agreement to ensure continued compliance with DOL and IRS frameworks and
    ERISA standards.


    Changes to Contribution Limits: We will update the employee contribution limit
    of $23,500 and the catch-up limit of $7,500 in accordance with annual IRS adjustments.
    Such changes are effective as of the first day of the calendar year in which they
    are mandated.


    Fee Adjustments: Our fee philosophy centers on a lean, transparent structure.
    Should we modify the fees tied to active asset management, we will provide written
    notice to the account holder at least 30 days prior to the effective date. Basic
    account maintenance fees, if introduced, will be clearly disclosed in the updated
    fee schedule.


    Regulatory Changes: Amendments required by law or regulatory bodies (such as the
    IRS) may be implemented immediately without a prior notice period. This includes
    changes to the early withdrawal penalty of 10% or RMD requirements.


    Notice of Changes: All formal changes to terms will be delivered via secure chat
    or registered mail. Continued funding or maintenance of the account following
    the notice period constitutes acceptance of the revised terms. If you disagree
    with a change, you may request to close the account or initiate a rollover to
    another provider. For the full foundational agreement, see Traditional 401(k)
    — account agreement.'
  domain: retirement
  product_category: traditional_401k
  document_type: terms_conditions
  source_authority: official
  placeholder: true
