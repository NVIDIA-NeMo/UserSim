- id: ca0d8b02-5729-5f5d-ba4e-cd62aa473e1b
  title: Traditional IRA — cost and charges
  body: 'Q: What are the fees associated with opening and maintaining a Traditional
    IRA?

    A: We maintain a lean, transparent fee structure designed to maximize your compound
    growth. Fees are primarily tied to active asset management. Basic account maintenance
    for IRA products is kept minimal to encourage long-term stability.


    Q: Are there costs for transferring assets from another provider?

    A: While active management carries a fee, we often waive basic maintenance for
    consolidation vehicles to help you simplify your portfolio. For a detailed look
    at how we handle consolidations, please refer to Rollover IRA — overview.


    Q: Do I pay a fee for making contributions up to the $7000 limit?

    A: No, there is no fee for making standard annual contributions; however, the
    growth of your assets is subject to our active management fee structure.'
