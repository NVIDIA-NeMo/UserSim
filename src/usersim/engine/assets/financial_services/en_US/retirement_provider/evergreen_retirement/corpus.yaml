- id: d67e4fce-f863-5f2f-911c-c1290b0ac69d
  title: Traditional IRA — privacy and data handling
  body: 'Evergreen Retirement is committed to the highest standards of privacy and
    regulatory precision. We adhere strictly to DOL and IRS frameworks, emphasizing
    ERISA compliance across all our retirement products to ensure the fair treatment
    of our investors.


    Data Handling and Privacy:

    We maintain a rigorous posture regarding the absolute privacy of personally identifiable
    information (PII). Your data is encrypted and accessed only by authorized personnel
    necessary for the administration of your Traditional IRA. No account modifications,
    including changes to your annual contribution limit of $7,000 or your catch-up
    limit 50plus of $1,000, are permitted without a verified secure session utilizing
    multi-factor authentication (MFA).


    Regulatory Disclosures:

    Clients are reminded that the Traditional IRA is subject to IRS rules regarding
    distributions. Specifically, any distribution taken before the age of 59½ is generally
    subject to an early withdrawal penalty of 10%, unless a statutory exception applies.
    Furthermore, Required Minimum Distributions (RMDs) must be taken annually after
    reaching the age specified by the IRS; failure to do so may result in significant
    tax penalties.


    Our standard of care is to provide comprehensive educational resources on these
    limits and requirements. However, Evergreen Retirement does not provide individualized
    tax or legal advice. We strongly recommend that clients consult with a certified
    CPA to determine the most suitable tax strategies for their specific financial
    situation.'
