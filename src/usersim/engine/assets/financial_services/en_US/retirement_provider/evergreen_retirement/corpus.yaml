- id: 25eb5dc1-6ecf-5278-9496-2ac90a3d0f52
  title: Rollover IRA — who it is best for and common use cases
  body: "The Rollover IRA is a zero-fee consolidation vehicle designed for professionals\
    \ who have transitioned away from an employer-sponsored plan and wish to maintain\
    \ the tax-deferred status of their savings while gaining more control over their\
    \ investment options.\n\n**Who This Product Is Best For:**\n- **Career Changers:**\
    \ Professionals moving between companies who prefer to consolidate multiple 401(k)\
    \ or 403(b) accounts into a single, manageable location.\n- **Retirees:** Individuals\
    \ moving from the accumulation phase to the distribution phase who want a seamless\
    \ transition of their employer-sponsored assets.\n- **Stability-Seekers:** Investors\
    \ who value a premium, stability-focused provider with a commitment to regulatory\
    \ precision and transparency.\n\n**Common Use Cases:**\n- **Portfolio Simplification:**\
    \ Instead of tracking several accounts across different former employers, clients\
    \ use the Rollover IRA to centralize their assets, reducing administrative overhead\
    \ and making it easier to monitor overall growth.\n- **Avoiding Forced Distributions:**\
    \ By rolling over assets into an IRA, clients can often avoid the immediate taxable\
    \ distributions that some employer plans require after a certain period of employment\
    \ termination.\n- **Enhanced Management:** Moving assets into a Rollover IRA allows\
    \ for a wider array of investment choices compared to the limited menus typically\
    \ found in employer-sponsored plans.\n\n**Key Financial Terms:**\n- **Account\
    \ Fee:** $0\n- **Transfer Processing Time:** 7 days\n\n**Important Tax Warning:**\n\
    Distributions taken from a Rollover IRA before age 59½ may be subject to an Early\
    \ Withdrawal Penalty (typically 10%) imposed by the IRS, unless a specific exception\
    \ applies. Please consult a certified CPA for personalized tax strategies. \n\n\
    *Standard Regulatory Disclaimer: Investment involves risk. Past performance does\
    \ not guarantee future results.*"
  domain: retirement
  product_category: rollover_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 0f4141cc-e20d-55af-a2a7-44529836c99b
  title: Rollover IRA — transfer processing days explained
  body: '**How long does it take for my funds to appear in my Rollover IRA?**

    Once we receive the assets from your previous plan administrator, the transfer
    processing time is 7 days. This period ensures that all funds are accurately reconciled
    and that the transfer complies with ERISA and IRS regulatory frameworks.


    **Why is there a processing window?**

    We prioritize regulatory precision and the fair treatment of investors. The 7
    days allow our compliance team to verify the source of funds and ensure the transaction
    is recorded as a non-taxable rollover rather than a taxable distribution.


    **What happens if the transfer takes longer than 7 days?**

    While 7 days is our standard, delays can occur if the sending institution provides
    incomplete documentation. If your funds are not visible after this window, we
    recommend reviewing your transfer request for accuracy or consulting Rollover
    IRA — overview for general product details.'
