- id: e3431948-4d00-52d0-af13-1df56915be4f
  title: Traditional IRA — eligibility and setup
  body: 'Q: Who is eligible to open a Traditional IRA?

    A: Any individual with earned income can open a Traditional IRA. It is particularly
    suited for professionals without employer-sponsored plans or those seeking additional
    pre-tax savings.


    Q: How do I set up my account?

    A: To begin, you will provide your personal identification and tax information.
    We require multi-factor authentication (MFA) to secure the setup process. Once
    your identity is verified, we will establish the account and you can begin making
    contributions up to the $7000 annual limit (or $8000 if you are 50+).


    Q: Can I open this account if I already have a 401(k)?

    A: Yes, you may maintain a Traditional IRA alongside an employer-sponsored plan,
    though your tax deductibility may be limited based on your income level. We recommend
    consulting a certified CPA for personalized tax advice.'
