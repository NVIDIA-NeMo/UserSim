- id: be2bcaae-1e1d-5f85-9864-3f21586a18bd
  title: Traditional 401(k) — fee schedule
  body: 'Evergreen Retirement adheres to a lean, transparent fee philosophy to maximize
    the compound growth of your retirement assets. For the Traditional 401(k), fees
    are primarily tied to active asset management rather than account existence.


    - Active Asset Management Fee: Tied to specific fund selections (see individual
    fund prospectuses for exact percentages).

    - Basic Account Maintenance: $0 (waived to encourage long-term portfolio stability).

    - Early Withdrawal Penalty: 10% (This is a regulatory penalty imposed by the IRS,
    not an internal Evergreen Retirement fee, for distributions taken before age 59½).


    All fees are disclosed clearly on your quarterly statements. We do not charge
    hidden administrative fees for maintaining your employer-sponsored plan.'
  domain: retirement
  product_category: traditional_401k
