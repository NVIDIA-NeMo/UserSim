- id: 7dbfe0b2-cde5-53e7-95f7-1f2b4921fcf5
  title: Roth IRA — who it is best for and common use cases
  body: 'The Roth IRA is a premium retirement vehicle designed for individuals who
    prioritize tax-free growth and qualified withdrawals in retirement. Unlike pre-tax
    accounts, the Roth IRA utilizes after-tax contributions, making it an ideal choice
    for those who expect to be in a higher tax bracket during their distribution phase
    than they are currently.


    This product is best suited for:

    - Mid-to-late career professionals who have already maximized employer-sponsored
    plans and seek additional tax-diversification.

    - Individuals who prefer the certainty of tax-free income in retirement over an
    immediate tax deduction today.

    - Investors seeking a flexible account where qualified withdrawals of contributions
    can be made without the stress of future tax liabilities.


    Key Specifications:

    - Annual Contribution Limit: $7,000

    - Income Phaseout (Single Filers): Begins at $146,000

    - Fee Structure: Lean and transparent, with fees primarily tied to active asset
    management.


    Common Use Cases:

    - Complementing a traditional 401(k) to create a ''tax-diversified'' portfolio,
    allowing the retiree to choose which account to draw from based on their current
    tax year needs.

    - Serving as a long-term growth engine for professionals who have surpassed the
    income limits for other tax-advantaged vehicles but still fall within the Roth
    IRA eligibility window.


    For those seeking high-limit, employer-sponsored pre-tax accumulation, you may
    also wish to review the Traditional 401(k) — overview.'
  domain: retirement
  product_category: roth_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 088dcd81-2343-5a2e-ba54-856754e09b20
  title: Roth IRA — income phaseout single start explained
  body: "Q: What happens if my income exceeds the Roth IRA limits?\nA: For single\
    \ filers, the income phaseout begins at $146,000. Once your modified adjusted\
    \ gross income (MAGI) reaches this threshold, the amount you are permitted to\
    \ contribute to a Roth IRA begins to decrease. If your income exceeds the upper\
    \ limit of the phaseout range, you are ineligible to make direct contributions\
    \ to a Roth IRA.\n\nQ: Can I still contribute if I am in the phaseout range?\n\
    A: Yes, but your maximum contribution may be limited to an amount less than the\
    \ standard annual contribution limit of $7,000. \n\nQ: Does Evergreen Retirement\
    \ determine my eligibility?\nA: We provide educational resources to guide you\
    \ toward product suitability; however, we do not provide individualized tax advice.\
    \ We recommend consulting a certified CPA to determine your exact contribution\
    \ capacity based on your specific tax filing status and income. For more details\
    \ on limits, see Roth IRA — annual contribution limit explained."
  domain: retirement
  product_category: roth_ira
