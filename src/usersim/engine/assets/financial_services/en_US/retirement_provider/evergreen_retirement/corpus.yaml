- id: 280b60c5-e6fe-5c4a-8e5f-df23321275ab
  title: Rollover IRA — an unexpected charge or amount
  body: '**Symptom:** You notice a fee or a balance discrepancy in your Rollover IRA
    that you did not expect.


    **Likely Causes:**

    - **External Plan Fees:** The sending employer plan may have deducted a closing
    or termination fee before the funds reached us.

    - **Tax Withholding:** If the rollover was not conducted as a ''direct'' trustee-to-trustee
    transfer, the previous administrator may have withheld taxes.

    - **Market Fluctuations:** If your assets are actively managed, the balance may
    have changed due to market performance.


    **What to Check (In Order):**

    1. **Review the Account Fee:** First, confirm the charge is not an internal fee.
    The Rollover IRA has an account fee of $0; therefore, any charge you see was not
    generated by Evergreen Retirement for basic maintenance.

    2. **Check the Transfer Statement:** Examine the final statement from your previous
    provider to see if any fees were deducted prior to the transfer.

    3. **Verify the Transfer Amount:** Compare the amount sent by the previous provider
    against the amount received in your account.


    **The Fix:**

    If you find that the discrepancy was caused by an error in the transfer process,
    tell us the specific amount missing and provide the transfer statement from your
    previous provider. We will review the transaction records to identify where the
    funds were diverted.


    **When We Escalate:**

    If we cannot resolve the discrepancy immediately, we will initiate a formal review
    process. We treat all financial disputes with urgency, with a goal of resolution
    within 15 business days. You will receive a written notification once the review
    is complete and the correction is applied.'
