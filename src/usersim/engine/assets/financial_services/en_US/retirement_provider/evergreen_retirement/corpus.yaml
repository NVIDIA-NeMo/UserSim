- id: 6dbeffd8-9f45-5b53-a191-87bcda8aee5f
  title: Roth IRA — fraud and unauthorized-activity protection
  body: "At Evergreen Retirement, we prioritize the absolute privacy of your personally\
    \ identifiable information and the security of your retirement assets. Because\
    \ a Roth IRA consists of after-tax contributions, it is often a target for fraudsters\
    \ posing as government agents or tax professionals claiming you have 'unclaimed\
    \ tax credits' or 'urgent IRS audits' that require you to move your funds to a\
    \ 'safe' account.\n\nWe want to be clear: Evergreen Retirement will never ask\
    \ you for your password, multi-factor authentication (MFA) codes, or your full\
    \ social security number via an unsolicited email or text message. We will never\
    \ pressure you to transfer your Roth IRA assets to an external account via a third-party\
    \ payment app or wire transfer under the guise of a 'security update.'\n\nIf you\
    \ notice any unauthorized activity—such as a distribution request you did not\
    \ initiate or a change in your contact information—you must notify us immediately.\
    \ We treat all fraud reports with immediate urgency. Upon receiving a report of\
    \ unauthorized activity, we will initiate a freeze on all affected assets within\
    \ one business hour to prevent further loss. \n\nTo ensure your account remains\
    \ secure, multi-factor authentication (MFA) and rigorous identity verification\
    \ are mandatory before any state-changing action is permitted. No account modifications,\
    \ including contribution changes or distributions, are permitted without a verified\
    \ secure session. By adhering to these strict verification protocols, we ensure\
    \ that your path to tax-free growth remains protected from external threats."
  domain: retirement
  product_category: roth_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 20c2ae5c-ad50-5422-b159-59b32e6acf75
  title: Roth IRA — account agreement
  body: 'This account agreement governs the relationship between the client and Evergreen
    Retirement regarding the Roth IRA. By opening this account, the client agrees
    to adhere to all IRS and DOL frameworks, including ERISA compliance standards.


    1. Contribution Obligations: The client is responsible for ensuring that total
    annual contributions do not exceed the current limit of $7,000. Any excess contributions
    must be corrected according to IRS guidelines to avoid penalties. The client further
    acknowledges that eligibility to contribute is subject to income thresholds, including
    the income phaseout for single filers which begins at $146,000.


    2. Asset Management and Fees: We maintain a lean, transparent fee structure. Fees
    for the Roth IRA are primarily tied to active asset management. We reserve the
    right to adjust these fees with prior notice to the client.


    3. Distributions and Withdrawals: All distributions are subject to multi-factor
    authentication (MFA). The client acknowledges that taking distributions before
    age 59½ may trigger an Early Withdrawal Penalty (typically 10%) unless a regulatory
    exception applies.


    4. Dispute Resolution: Any discrepancies or unauthorized transactions reported
    by the client will enter a formal review process. We aim for a full resolution
    within 15 business days. During this window, the account may be frozen if fraud
    is suspected.


    5. Termination: This agreement may be terminated by the client at any time via
    a formal closing request. Upon termination, all assets will be distributed or
    rolled over according to the client''s instructions, subject to applicable tax
    laws and identity verification.'
