- id: 3c7a6c9f-fe86-5ff2-9220-7820fd398328
  title: Traditional 401(k) — how rates are tiered and applied
  body: 'The Traditional 401(k) does not utilize a flat interest rate, as it is an
    investment-based accumulation vehicle. Instead, the growth of your account is
    determined by the performance of the active asset management selections you make.


    Our fee philosophy is designed to maximize your compound growth. Fees are primarily
    tied to active asset management rather than static account balances. These management
    fees are applied proportionally based on the specific funds or portfolios selected
    within your plan. Because we maintain a lean structure, you avoid the heavy maintenance
    fees often found at other institutions.


    Any changes to the fee percentages associated with your active management options
    will be communicated in accordance with our change-of-terms policy. For the current
    specific costs associated with various management tiers, please refer to Traditional
    401(k) — fee schedule.'
  domain: retirement
