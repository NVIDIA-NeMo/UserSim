- id: c55f7a14-829c-5206-b331-33af6c865a38
  title: Traditional IRA — a discrepancy in your records or statement
  body: 'Symptom: You have noticed an error in your account balance, a missing contribution,
    or an incorrect distribution amount on your Traditional IRA statement.


    Likely Causes:

    - Processing Delay: Recent contributions may not yet be reflected in the current
    statement cycle.

    - Misapplied Funds: A contribution may have been credited to a different account.

    - Regulatory Withholding: A distribution may have been adjusted for mandatory
    tax withholding.


    Resolution Steps:

    1. Verify the transaction date: Confirm the date the funds left your external
    account and check if it falls within the current statement period.

    2. Review contribution limits: Ensure the missing amount did not exceed the $7000
    annual limit (or $8000 for those 50+), which might have caused a rejection.

    3. Request a detailed transaction ledger: Ask us for a line-item history of all
    credits and debits for the period in question.


    If a discrepancy is confirmed, we will initiate a formal review process. Our goal
    is to resolve all disputes within 15 business days. If the error resulted from
    a technical failure on our part, we will apply the necessary corrections and provide
    a revised statement for your records.'
  domain: retirement
  product_category: traditional_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
