- id: b5bf4e3e-c3ad-524f-b8f3-7654cf7751fd
  title: Traditional IRA — make a change or update
  body: 'To ensure the security of your assets, all modifications to your Traditional
    IRA must be performed within a verified secure session using multi-factor authentication
    (MFA). Follow these steps to update your account details or contributions:


    1. Provide the specific update you wish to make, such as changing your monthly
    contribution amount or updating your beneficiary information.

    2. Complete the identity verification process. We will prompt you for your MFA
    code to ensure the request is authorized.

    3. State the new value for your contribution. Please note that your total contributions
    cannot exceed the annual contribution limit of $7,000, or $8,000 if you are eligible
    for the catch-up limit 50plus of $1,000.

    4. Review the summary of changes we provide. We will confirm the new contribution
    amount and the date the change takes effect.

    5. Receive confirmation of the update. We will provide a transaction or modification
    reference number once the change is successfully applied to your account.


    If you are updating your investment elections, we will guide you toward product
    suitability based on your goals, though we remind you that we do not provide individualized
    tax or legal advice. For comprehensive details on contribution limits, you may
    refer to Traditional IRA — annual contribution limit explained.'
