  title: SEP IRA — qualification tiers
  body: 'The following matrix outlines the qualification and contribution thresholds
    for the SEP IRA. This is intended for internal use by support agents when guiding
    prospective clients.


    | Condition | Requirement/Limit | Outcome |

    | :--- | :--- | :--- |

    | Employment Status | Must be a business owner or self-employed | Eligible for
    SEP IRA |

    | Annual Contribution (Percentage) | Maximum 25% of compensation | Contribution
    permitted up to limit |

    | Annual Contribution (Dollar amount) | Maximum $70,000 | Contribution capped
    at this value |

    | Distribution Age | Under 59½ | Subject to 10% Early Withdrawal Penalty (unless
    exception applies) |

    | Distribution Age | Over specified IRS age | Subject to Required Minimum Distributions
