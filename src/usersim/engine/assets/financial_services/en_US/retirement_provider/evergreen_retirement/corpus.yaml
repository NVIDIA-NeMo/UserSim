    **How do I set up the account?**

    Setup is a streamlined process. You provide us with the details of your current
    plan provider and the amount you wish to transfer. We then coordinate the movement
    of assets. To encourage consolidation, we have set the account fee at $0.


    **Is there a minimum balance required to start?**

    We do not impose a minimum balance to open a Rollover IRA, as our goal is to help
    you maximize your compound growth by bringing disparate accounts together.


    For more details on costs, please refer to Rollover IRA — cost and charges.'
