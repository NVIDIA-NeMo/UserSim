  institution_id: evergreen_retirement
- id: 498244bc-8f46-5f08-9c8a-bdef6d7e3a12
  title: Traditional 401(k) — regulatory disclosures
  body: 'This disclosure outlines the regulatory framework governing the Traditional
    401(k) at Evergreen Retirement. We adhere strictly to the Employee Retirement
    Income Security Act (ERISA), the Department of Labor (DOL) guidelines, and the
    Internal Revenue Code.


    Tax Treatment and Limits:

    Contributions to the Traditional 401(k) are made on a pre-tax basis, reducing
    current taxable income. The maximum employee contribution limit is $23,500 per
    calendar year. Individuals aged 50 and older are permitted a Catch-up Contribution
    of $7,500. Any contributions exceeding these limits may be deemed ''excess deferrals''
    by the IRS and are subject to corrective action and potential taxation.


    Withdrawal Penalties:

    Distributions taken from the account prior to age 59½ are generally subject to
    a 10% Early Withdrawal Penalty imposed by the IRS, in addition to applicable federal
    and state income taxes, unless the account holder meets specific IRS exception
    criteria.


    Required Minimum Distributions (RMDs):

    Account holders must begin taking Required Minimum Distributions (RMDs) upon reaching
    the age specified by the IRS. Failure to withdraw the minimum required amount
    may result in significant tax penalties.


    Standard of Care:

    Evergreen Retirement provides educational resources regarding contribution limits
    and RMDs. However, we do not provide individualized tax, legal, or accounting
    advice. Our role is to ensure product suitability; specific tax strategies must
    be deferred to a certified CPA.


    ***

    REGULATORY DISCLAIMER: This document does not constitute tax advice. Please consult
    a certified tax professional regarding your specific financial situation.'
  domain: retirement
  product_category: traditional_401k
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 2177b457-4c0c-555f-8eb0-e9b75a813845
  title: Traditional 401(k) — interest rate / APY schedule
  body: 'The Traditional 401(k) is an investment-based accumulation vehicle rather
    than a fixed-rate deposit account. Consequently, there is no single flat interest
    rate or APY applied to the balance. Instead, your returns are determined by the
    performance of the underlying assets selected within your portfolio.


    Your yield is based on the combined performance of the mutual funds, ETFs, or
    other investment vehicles you choose. These rates fluctuate based on market conditions.
    We provide a range of product suitability options to help you balance growth and
    stability.


    While the account itself does not have a baseline interest rate, we ensure a lean
    fee structure to minimize the drag on your compound growth. All performance data
    and net yields are reported on your quarterly statements, reflecting the active
    asset management fees deducted from the gross returns. For information on consolidation
    and zero-fee options, see Rollover IRA — overview.'
  domain: retirement
  product_category: traditional_401k
