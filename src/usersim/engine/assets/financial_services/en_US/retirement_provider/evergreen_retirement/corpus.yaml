- id: e0161dad-452d-5fee-82ae-26e37603f9c4
  title: SEP IRA — limits, restrictions, and edge cases
  body: 'The SEP IRA is a high-capacity retirement solution tailored for self-employed
    professionals and small business owners. To ensure regulatory precision and ERISA
    compliance, the following limits and restrictions apply:


    Contribution Limits:

    - Percentage-Based Limit: Contributions are limited to 25% of compensation.

    - Absolute Annual Cap: The maximum annual contribution allowed is $70,000.

    - The lesser of these two figures applies to the total contribution for any given
    tax year.


    Restrictions and Edge Cases:

    - Employer-Only Contributions: Unlike some other retirement vehicles, contributions
    to a SEP IRA are made by the employer. Employees cannot make salary-reduction
    contributions to this account.

    - Uniformity Requirement: If an employer contributes to a SEP IRA for themselves,
    they must contribute the same percentage of compensation for all eligible employees.

    - Distribution Rules: Distributions are subject to standard IRS rules. Withdrawals
    made before age 59½ are typically subject to an Early Withdrawal Penalty of 10%,
    unless a qualifying exception is met.

    - Required Minimum Distributions: Account holders must begin taking RMDs (Required
    Minimum Distributions) once they reach the age specified by the IRS.


    We maintain a lean, transparent fee structure to maximize compound growth. While
    asset management fees apply, we aim for high transparency in all costs associated
    with the account.'
  domain: retirement
  product_category: sep_ira
  document_type: product_sheet
  source_authority: official
