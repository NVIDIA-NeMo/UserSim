- id: 2f06f042-83ff-561b-9c72-1c7e860140c1
  title: Traditional 401(k) — who it is best for and common use cases
  body: 'The Traditional 401(k) is a high-limit, employer-sponsored savings vehicle
    designed for maximum pre-tax accumulation. It is specifically engineered for mid-to-late
    career professionals and small business owners who seek to lower their current
    taxable income while building a substantial nest egg for the future.


    This product is best suited for individuals in higher tax brackets today who anticipate
    being in a lower tax bracket during retirement. By contributing pre-tax dollars,
    you reduce your current adjusted gross income while benefiting from tax-deferred
    growth.


    Common Use Cases:

    - High-Earner Accumulation: Professionals maximizing their savings to the employee
    contribution limit of $23,500 to lower their annual tax liability.

    - Late-Stage Catch-up: Individuals aged 50 and older utilizing the additional
    catch-up limit of $7,500 to accelerate their savings as they approach retirement.

    - Stability-Focused Growth: Investors seeking a premium, stability-focused provider
    that prioritizes ERISA compliance and regulatory precision.


    Key Financial Parameters:

    - Employee Contribution Limit: $23,500

    - Catch-up Limit (Age 50+): $7,500

    - Early Withdrawal Penalty: 10% for distributions before age 59½


    For those who have left an employer and wish to consolidate these assets into
    a single managed account, we recommend reviewing the Rollover IRA — overview.'
  domain: retirement
  product_category: traditional_401k
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: bbf55978-c7fa-5e01-b029-b13fba4f06e7
  title: Traditional 401(k) — catch up limit 50plus explained
  body: 'Q: What is the catch-up contribution limit for the Traditional 401(k)?

    A: For participants aged 50 and older, the IRS allows for additional annual contributions
    beyond the standard employee limit. This catch-up limit is $7,500.


    Q: Does this limit replace the standard contribution limit?

    A: No. The catch-up limit is in addition to the standard employee contribution
    limit of $23,500. This means eligible participants aged 50+ can contribute a total
    of $31,000 annually.


    Q: How do I apply this to my account?

    A: You may request a contribution change through a verified secure session. For
    more information on managing your contributions, please see Traditional 401(k)
    — make a change or update.'
  domain: retirement
  product_category: traditional_401k
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 7cd39ccd-f893-586a-bdc9-914c05189777
  title: Traditional 401(k) — cancel, close, or downgrade
  body: "Closing a Traditional 401(k) is a significant financial decision that can\
    \ trigger tax liabilities. Please follow these steps to initiate the process:\n\
    \n1. Provide Account Details: State your intent to close the account and provide\
    \ the specific account number you wish to terminate.\n2. Identify Distribution\
    \ Method: Tell us how you wish to handle the remaining balance. You may choose\
    \ to:\n    - Transfer the assets to another qualified retirement account (e.g.,\
    \ a Rollover IRA) to maintain tax-deferred status.\n    - Request a lump-sum distribution\
    \ (note that this is subject to income tax and, if under age 59½, an early withdrawal\
    \ penalty of 10%).\n3. Verify Identity: Complete a mandatory multi-factor authentication\
    \ (MFA) check. This is required for all state-changing actions to ensure the security\
    \ of your assets.\n4. Confirm Final Balance: We will provide a final account statement\
    \ showing the closing balance, any applicable management fees, and the projected\
    \ distribution amount.\n5. Authorize Closure: Provide your final authorization\
    \ for the asset transfer or distribution. \n\nOnce these steps are complete, we\
    \ will process the closure. You will receive a confirmation notice and a final\
    \ tax reporting document for your records. If you are closing this account to\
    \ simplify your portfolio, you may find the Rollover IRA — overview helpful for\
    \ consolidating previous employer plans into a zero-fee vehicle."
  domain: retirement
  product_category: traditional_401k
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 93a5183d-2ddb-51cc-a26b-73896e1189e1
  title: Traditional 401(k) — an unexpected charge or amount
  body: 'If you notice a charge or a balance amount in your Traditional 401(k) that
    you did not expect, please follow these steps to identify the cause:


    1. Review the Fee Schedule: Check if the charge corresponds to active asset management
    fees. Basic maintenance is often waived, but active management is a primary driver
    of costs.

    2. Verify Contribution Timing: If your balance is lower than expected, confirm
    the date of your last payroll contribution and whether it has been fully credited
    to the account.

    3. Check for Automatic Distributions: Verify if any Required Minimum Distributions
    (RMDs) were triggered based on your age, as these are mandatory IRS withdrawals.

    4. Audit Distribution History: Check for any recent distribution requests. Remember
    that distributions before age 59½ incur an early withdrawal penalty of 10%.


    If the charge remains unexplained, tell us the specific transaction date and amount.
    We will initiate a formal review process. Our goal is to resolve all disputes
    within 15 business days. During this review, we will investigate the transaction''s
    origin and regulatory compliance. If the charge is found to be an error, we will
    apply a correction to your balance immediately. For complex regulatory discrepancies,
    we will escalate the matter to our Senior Compliance Officers for final review.'
  domain: retirement
  product_category: traditional_401k
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
