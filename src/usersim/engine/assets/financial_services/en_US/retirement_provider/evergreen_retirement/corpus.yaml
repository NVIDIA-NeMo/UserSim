- id: d9a8192b-18c2-504a-a288-28832b85489c
  title: Rollover IRA — account agreement
  body: 'This account agreement governs the relationship between the client and Evergreen
    Retirement regarding the Rollover IRA. By opening this account, both parties agree
    to the following terms:


    1. Fee Structure: We maintain a lean, transparent fee structure to maximize your
    compound growth. For the Rollover IRA, the account fee is $0. This waiver is intended
    to encourage portfolio consolidation by removing barriers to transferring assets
    from previous employer plans.


    2. Asset Transfers: When initiating a transfer of assets into the Rollover IRA,
    the standard transfer processing time is 7 days. This window allows for the necessary
    verification of funds and compliance checks under ERISA and IRS frameworks.


    3. Client Obligations: Clients are responsible for ensuring that all funds transferred
    into the Rollover IRA are from eligible retirement plans to avoid unintended tax
    consequences. While we guide clients toward product suitability, we do not provide
    individualized tax or legal advice. All specific tax strategies should be deferred
    to a certified CPA.


    4. Account Modifications: No modifications to the account, including distribution
    requests or beneficiary changes, shall be processed without a verified secure
    session involving mandatory multi-factor authentication (MFA).


    5. Termination: Either party may terminate this agreement. Upon closure, we will
    facilitate the distribution or transfer of remaining assets in accordance with
    IRS regulations. Any disputes arising from account closure will be handled through
    our formal review process, with a goal of resolution within 15 business days.


    6. Regulatory Compliance: Evergreen Retirement adheres strictly to DOL and IRS
    frameworks. We reserve the right to modify these terms to maintain compliance
    with evolving federal retirement laws, provided notice is given to the client.'
