- id: df5319b4-fe2c-5f47-9422-5e759d3ca037
  title: Roth IRA — eligibility requirements
  body: 'The following matrix outlines the eligibility requirements for contributing
    to a Roth IRA based on filing status and income.


    | Condition (Filing Status) | Income Threshold | Outcome |

    | :--- | :--- | :--- |

    | Single Filer | Below $146000 | Full contribution allowed up to $7000 |

    | Single Filer | At or Above $146000 | Contribution limit is phased out/reduced
    |

    | Any Filer | No Earned Income | Ineligible for contribution |

    | Any Filer | Total IRA Contributions > $7000 | Contribution declined (Limit Exceeded)
    |


    For detailed explanations of how these limits are calculated, please see Roth
    IRA — annual contribution limit explained.'
