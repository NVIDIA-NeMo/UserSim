- id: 65a72aab-c1f9-5ca3-8a59-0ca695fe258a
  title: Roth IRA — cancel, close, or downgrade
  body: 'If you have decided that the Roth IRA no longer fits your retirement strategy,
    you may request to close the account or transition the assets. Please follow these
    steps:


    1. Provide the request: Tell us that you wish to close your Roth IRA and specify
    whether you want to liquidate the assets to cash or transfer them to another institution.

    2. Verify your identity: You must complete a rigorous identity verification process,
    including multi-factor authentication (MFA), to authorize this state-changing
    action. No account closure is permitted without a verified secure session.

    3. Select the destination: Provide the account details for the receiving institution
    (if rolling over) or confirm the bank account where funds should be deposited
    (if distributing).

    4. Confirm the tax implications: We will provide a summary of the potential tax
    impact of the closure. Note that if you are under age 59½, you may be subject
    to an Early Withdrawal Penalty of 10% on earnings.

    5. Final Review: We will process the request and send a confirmation notice once
    the assets have been moved and the account is officially closed.


    Once completed, you will receive a final account statement showing a zero balance
    and a confirmation of the distribution or transfer. If you are looking for a zero-fee
    consolidation vehicle for previous employer plans instead, you may want to consider
    the Rollover IRA — overview.'
  domain: retirement
  product_category: roth_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 830032f3-c351-559c-8d49-fd9118ff38a2
  title: Roth IRA — an unexpected charge or amount
  body: 'Symptom: You notice a fee or a balance deduction on your Roth IRA statement
    that you did not expect.


    Likely Causes:

    - Active Asset Management Fees: Most charges in a Roth IRA are tied to the active
    management of your portfolio assets.

    - Excess Contribution Penalties: If contributions exceeded the $7,000 limit, the
    IRS may impose penalties that are reflected in your account.

    - Unauthorized Activity: A transaction may have occurred without your consent.


    What to check:

    1. Review your most recent statement to see if the charge is labeled as a management
    fee. Since we maintain a lean fee structure, these should be transparent and tied
    to asset activity.

    2. Verify your total contributions for the year to ensure you have not exceeded
    the $7,000 limit.

    3. Check your secure notification history for any distribution requests you may
    have forgotten.


    How to resolve:

    - If the charge is a management fee and you have questions about the rate, ask
    us for a detailed breakdown of your asset management costs.

    - If you believe the charge is an error or the result of unauthorized activity,
    inform us immediately. We will initiate a freeze on affected assets within one
    business hour and start a formal review process.


    Escalation: If we cannot resolve the discrepancy during your session, we will
    raise a formal dispute case. Our goal is to provide a final resolution within
    15 business days.'
  domain: retirement
  product_category: roth_ira
