- id: c601714f-dfa5-5213-9d80-088348023406
  title: Rollover IRA — a declined or blocked action
  body: "**Symptom**: You attempt to initiate a distribution, change a beneficiary,\
    \ or move funds, but the action is declined or blocked by our system.\n\n**Likely\
    \ Causes**\n- **Authentication Failure**: The most common cause is the lack of\
    \ a verified secure session. Because we prioritize the privacy of PII, no state-changing\
    \ actions are permitted without multi-factor authentication (MFA).\n- **Security\
    \ Freeze**: If our monitoring systems detected suspicious activity, we may have\
    \ initiated a freeze on your assets. As part of our fraud handling, we freeze\
    \ affected assets within one business hour of a report or detection.\n- **Regulatory\
    \ Block**: The action may conflict with IRS or DOL frameworks, such as an attempt\
    \ to withdraw funds that would trigger an Early Withdrawal Penalty without proper\
    \ documentation.\n\n**What to Check and Resolve**\n1. **Verify Session**: Ensure\
    \ you have successfully completed the MFA process. If your session has timed out,\
    \ you must re-authenticate before the action can be processed.\n2. **Check Alert\
    \ History**: Review your secure notifications to see if a security freeze was\
    \ placed on the account. \n3. **Confirm Documentation**: If the block is related\
    \ to a distribution, ensure all required tax forms are provided to avoid the Early\
    \ Withdrawal Penalty.\n\n**When We Escalate**\nIf we cannot resolve the block\
    \ through authentication or documentation, we will raise a formal review case.\
    \ For complex regulatory inquiries, we escalate the matter to our Senior Compliance\
    \ Officers for final review. You will receive a notification once the review is\
    \ complete, typically within 15 business days if the block is tied to a formal\
    \ dispute process."
  domain: retirement
  product_category: rollover_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 23ad2d0c-f3a5-5d03-b72a-88f9291c9f4f
  title: Rollover IRA — when to switch or upgrade
  body: 'Determining whether to maintain a Rollover IRA or move assets into another
    vehicle depends on your current career stage and tax goals.


    **When to stay with a Rollover IRA**

    Choose this option if your primary goal is consolidation. With an account fee
    of $0, it is the most cost-effective way to merge multiple previous employer plans
    into one managed account to simplify your distribution phase.


    **When to switch to a Roth IRA**

    Consider a switch (via a conversion) if you prefer after-tax contributions in
    exchange for tax-free growth and qualified withdrawals. While the Rollover IRA
    focuses on pre-tax accumulation, the Roth IRA is superior for those who expect
    to be in a higher tax bracket during retirement.


    **When to switch to a SEP IRA**

    If you have transitioned from a corporate employee to a small business owner or
    self-employed professional, a SEP IRA may be more appropriate due to its higher
    contribution capacities tailored for business owners.


    In summary, the Rollover IRA is best for stability and simplification, while the
    Roth and SEP options provide specific tax and contribution advantages for different
    employment statuses.'
  domain: retirement
  product_category: rollover_ira
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: d4589c30-e6e7-5c95-882b-ba53a6aef5d7
  title: Rollover IRA — comparison vs. alternatives and when not to choose it
  body: 'The Rollover IRA is designed as a premium, stability-focused solution for
    those moving from the ''accumulation'' phase of their career to the ''distribution''
    phase. To make an informed decision, it is important to understand where this
    product excels and where it is not the optimal choice.


    **The Evergreen Advantage**

    We compete on transparency and regulatory precision. The Rollover IRA is specifically
    positioned as a zero-fee consolidation vehicle. While other providers may charge
    maintenance fees, we have set our account fee at $0 to encourage clients to maximize
    their compound growth by consolidating their portfolios.


    **Comparison vs. Alternatives**

    - **vs. Traditional 401(k)**: A 401(k) is an employer-sponsored plan. The Rollover
    IRA is an individual account. You should choose the Rollover IRA when you leave
    an employer and want more control over your investment options than the 401(k)
    plan provided.

    - **vs. Traditional IRA**: While similar, the Rollover IRA is specifically optimized
    for moving large sums from employer plans. If you are simply looking to make small,
    annual pre-tax contributions from your current income, a Traditional IRA is the
    standard choice.


    **When NOT to choose a Rollover IRA**

    - **If you seek tax-free withdrawals**: If your goal is to avoid taxes during
    retirement, you should look at a Roth IRA, as the Rollover IRA maintains the pre-tax
    status of the original funds.

    - **If you are currently employed and have a high-match 401(k)**: It is generally
    more beneficial to contribute to an active employer plan to capture company matching
    before considering a rollover of older assets.

    - **If you need immediate liquidity**: Assets in a Rollover IRA are intended for
    retirement. Withdrawals before age 59½ generally incur an Early Withdrawal Penalty
    of 10%.


    ***

    REGULATORY DISCLAIMER: We guide clients toward product suitability but defer specific
    tax strategies to certified CPAs. Please consult a professional regarding your
    specific tax situation.'
  domain: retirement
  product_category: rollover_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: b30b2388-6e5e-523e-8fd1-45ed425cf01c
  title: Rollover IRA — how-to / step-by-step
  body: '**How do I start a rollover from my old employer?**

    First, provide us with your previous plan''s details and the total balance. We
    will then coordinate with the provider to move the assets. You can expect the
    transfer processing period to be 7 days.


    **How do I avoid taxes and penalties during the move?**

    Ask us to perform a ''direct trustee-to-trustee transfer.'' This ensures funds
    move directly from your old plan to your Rollover IRA without passing through
    your hands, avoiding the 60-day indirect rollover risk and the Early Withdrawal
    Penalty.


    **How do I verify the funds have arrived?**

    Once the 7 days processing window has elapsed, ask us for an account balance update.
    We will verify your identity via MFA and confirm the final amount deposited into
    your account.


    For more information on our costs, see Rollover IRA — cost and charges.'
  domain: retirement
  product_category: rollover_ira
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 8915583b-d125-5f06-95b9-1b28683a51aa
  title: Rollover IRA — resolve a common request end-to-end
  body: "One of the most common requests for our clients is the consolidation of a\
    \ previous employer's retirement plan into a Rollover IRA. This process ensures\
    \ your assets are managed under one roof with a $0 account fee.\n\n**Prerequisites**\n\
    - Your most recent statement from your previous employer's retirement plan.\n\
    - The account number and contact information for the current plan administrator.\n\
    - A verified secure session with multi-factor authentication (MFA) enabled.\n\n\
    **Step-by-Step Process**\n1. **Initiate the Request**: Tell us you wish to perform\
    \ a rollover. Provide the name of the previous provider and the approximate balance\
    \ to be moved.\n2. **Select Transfer Method**: Specify that you want a 'direct\
    \ trustee-to-trustee transfer.' This is the most secure method to avoid an Early\
    \ Withdrawal Penalty or accidental taxable events.\n3. **Submit Authorization**:\
    \ Provide the necessary account numbers and signatures required by your previous\
    \ provider. We will review these for ERISA compliance.\n4. **Coordinate the Asset\
    \ Move**: We will contact the sending institution to request the funds. You do\
    \ not need to manage the communication between the two firms.\n5. **Monitor Processing**:\
    \ Wait for the transfer processing period of 7 days to complete.\n6. **Confirm\
    \ Receipt**: Ask us to confirm the final amount received. We will provide the\
    \ exact figure and update your account balance.\n\n**How to Verify Success**\n\
    \ The process is complete when we confirm that the funds have been successfully\
    \ deposited and your account balance reflects the addition of the rollover assets.\
    \ You will see the transaction listed in your history as a completed transfer,\
    \ and you will have a single consolidated account with an account fee of $0."
  domain: retirement
  product_category: rollover_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 21d3e55a-098d-5b97-91a4-b038768f110c
  title: Rollover IRA — a discrepancy in your records or statement
  body: '**Symptom**: You notice that the balance in your Rollover IRA does not match
    the final statement provided by your previous employer, or a transaction is missing
    from your history.


    **Likely Causes**

    - **Processing Lag**: The transfer may still be within the standard transfer processing
    period of 7 days. Assets may be in transit and not yet credited to your balance.

    - **Withholding for Taxes**: If the rollover was handled as an ''indirect'' transfer,
    the previous provider may have withheld a percentage for federal taxes, resulting
    in a lower net deposit.

    - **Timing Discrepancies**: Statements are often generated on a specific cycle;
    a transfer completed on the 1st of the month may not appear on a statement generated
    on the 30th of the previous month.


    **What to Check and Resolve**

    1. **Compare Statement Dates**: Check the ''Effective Date'' of the transfer from
    the sending institution against the ''Statement Date'' of your Evergreen account.

    2. **Verify Transfer Type**: Confirm if the transfer was ''Direct'' or ''Indirect.''
    If it was indirect, review the sending institution''s documents to see if taxes
    were withheld.

    3. **Check Processing Window**: Confirm if 7 days have passed since the funds
    were released by the previous provider.


    **When We Escalate**

    If the discrepancy persists after the 7 days processing window and cannot be explained
    by tax withholding, we will initiate a formal dispute review. We will conduct
    a line-by-line audit of the transfer logs. Our goal is to resolve such disputes
    within 15 business days. You will receive a written resolution notice once the
    investigation is complete.'
  domain: retirement
  product_category: rollover_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
