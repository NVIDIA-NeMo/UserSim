- id: be984dea-b0e8-5d08-8d48-27760f66d0ba
  title: Rollover IRA — cancel, close, or downgrade
  body: "Closing or modifying your Rollover IRA is a significant state-changing action.\
    \ To protect your assets, we require a verified secure session with multi-factor\
    \ authentication (MFA) before proceeding.\n\n**Before You Begin:**\n- Ensure you\
    \ have a destination account (such as another IRA or a current employer's 401(k))\
    \ if you wish to avoid a taxable event.\n- Have your account number and government-issued\
    \ identification ready for verification.\n\n**Steps to Close or Cancel Your Account:**\n\
    1. **Initiate Request:** Tell us that you wish to close your Rollover IRA. \n\
    2. **Identity Verification:** Complete the mandatory multi-factor authentication\
    \ (MFA) process to verify your identity. We will confirm once the session is secure.\n\
    3. **Specify Asset Disposition:** Tell us whether you want a direct rollover to\
    \ another qualified institution or a total distribution of funds. If you choose\
    \ a distribution, we will provide a warning regarding the Early Withdrawal Penalty\
    \ if you are under age 59½.\n4. **Confirm Details:** We will provide a summary\
    \ of the final balance and any applicable tax withholding. Confirm that these\
    \ details are correct.\n5. **Final Execution:** We will process the closure. You\
    \ will receive a confirmation message once the assets have been moved or the check\
    \ has been issued.\n\n**How You Know It Worked:**\nYour account status will be\
    \ updated to 'Closed' in our records, and you will receive a final account statement\
    \ showing a balance of $0.\n\nIf you are considering moving your funds to another\
    \ product within Evergreen Retirement, you may want to compare this process with\
    \ Traditional 401(k) — cancel, close, or downgrade."
  domain: retirement
  product_category: rollover_ira
