- id: a340d0ca-54a7-5faa-b873-c9f612474ec2
  title: SEP IRA — check status or history
  body: 'Monitoring your retirement growth is essential for a seamless transition
    from accumulation to distribution. Follow these steps to review your SEP IRA status
    and transaction history.


    Prerequisites:

    You must have an active account and be prepared to complete our mandatory identity
    verification process.


    Steps:

    1. Request a current account status summary. We will verify your identity using
    a secure session and multi-factor authentication (MFA).

    2. Specify the time frame for the history you wish to review (e.g., the last quarter,
    the current tax year, or a specific date range).

    3. We will provide a detailed ledger showing all contributions made, including
    how they align with the 25% of compensation limit and the $70,000 annual cap.

    4. Review the balance and the current asset allocation. If you have specific questions
    regarding the performance of managed assets, ask us for a detailed breakdown of
    active management fees.

    5. Confirm the receipt of the information. We will provide the summary via a secure
    channel to ensure the privacy of your personally identifiable information (PII).


    How you know it worked:

    You will receive a comprehensive record of your contributions and the current
    total value of your account, confirming that your assets are managed according
    to your elections.'
