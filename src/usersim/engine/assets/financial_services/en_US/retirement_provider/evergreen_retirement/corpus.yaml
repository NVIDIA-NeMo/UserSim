- id: 9afd17e3-912b-53f2-91ce-15b2bcd23ccd
  title: Rollover IRA — getting started walkthrough
  body: 'This guide is intended for support agents to assist clients in the seamless
    transition of assets into a Rollover IRA. The primary goal of this product is
    to provide a zero-fee consolidation vehicle for transferring assets from previous
    employer plans into a single managed account.


    **Step 1: Suitability Assessment**

    Confirm that the client is seeking to consolidate pre-tax assets from a qualified
    employer plan (such as a traditional 401(k)). Guide the client toward the Rollover
    IRA if their goal is to avoid multiple account maintenance fees and centralize
    their accumulation for a smoother transition to distribution.


    **Step 2: Account Opening**

    Facilitate the opening of the account. Ensure the client understands that the
    account fee is $0, which encourages portfolio consolidation and maximizes compound
    growth.


    **Step 3: Initiating the Transfer**

    Coordinate with the client to obtain the necessary details from their previous
    plan administrator. Explain that our standard transfer processing days is 7. The
    agent should set expectations that this timeline covers the internal processing
    at Evergreen Retirement once the assets are received.


    **Step 4: Asset Allocation**

    Once the assets are received, assist the client in selecting their investment
    elections. Remind the client that while we guide them toward product suitability,
    we do not provide individualized tax or legal advice. Specific tax strategies
    regarding the timing of the rollover should be deferred to a certified CPA.


    **Step 5: Verification**

    Confirm the final balance and ensure the client has enabled multi-factor authentication
    (MFA) for all future account modifications. This is mandatory before any state-changing
    action can be performed.


    For a broader overview of the product''s positioning, see Rollover IRA — overview.'
  domain: retirement
  product_category: rollover_ira
  document_type: product_sheet
  source_authority: official
