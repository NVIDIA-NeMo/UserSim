- id: 9d482cc7-bf59-5f05-91d2-bf9e0d0e8029
  title: When to use initiate_rollover
  body: 'The initiate_rollover tool is used to begin the process of transferring retirement
    assets from a previous employer''s plan or another financial institution into
    an Evergreen Retirement account, typically a Rollover IRA. This is a state-changing
    action that requires high-level security clearance.


    **Procedure for Initiating a Rollover:**

    1. **Identity Verification**: The agent must confirm the client is in a verified
    secure session. Multi-factor authentication (MFA) is mandatory.

    2. **Account Identification**: Use the get_accounts tool to resolve the destination
    account_id if the client provides only a partial account number.

    3. **Detail Collection**: Gather the necessary details regarding the source of
    the funds and the amount to be rolled over.

    4. **Tool Execution**: Call the initiate_rollover tool with the required parameters
    to start the transfer process.

    5. **Confirmation**: Inform the client that the rollover has been initiated and
    provide the expected timeline for asset movement.


    Agents must emphasize that the Rollover IRA is a zero-fee consolidation vehicle,
    which helps maximize compound growth by reducing maintenance costs. All rollovers
    must adhere to ERISA compliance and IRS frameworks to avoid unintended taxable
    events.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_rollover
  institution_id: evergreen_retirement
