- id: a3e2cdf9-5e95-5d9d-9519-27055a95faf4
  title: Traditional IRA — a failed or pending action
  body: 'If you encounter a situation where a contribution, distribution, or account
    modification is listed as ''pending'' or has ''failed,'' please follow these steps
    to identify the cause.


    Common Symptoms:

    - A scheduled contribution has not appeared in your balance.

    - A distribution request is stalled in a pending state.

    - An attempt to change beneficiary information was rejected.


    What to check in order:

    1. Verification Status: Most failures are due to an expired secure session. Confirm
    that your multi-factor authentication (MFA) was successfully completed for the
    specific action.

    2. Contribution Limits: If a contribution failed, check if you have already reached
    the annual limit of $7,000 (or $8,000 for those 50+). We automatically block contributions
    that would cause an IRS over-contribution.

    3. Identity Documentation: Ensure that all required PII is current. An expired
    ID on file can cause a freeze on state-changing actions.


    Resolution:

    If you have verified the above and the action remains pending, inform us immediately.
    We will review the transaction logs and, if the failure was due to a system error,
    we will manually push the action through or correct the balance within one business
    day.


    When to Escalate:

    If the action is related to a suspected unauthorized transaction, we will treat
    this with immediate urgency. We will initiate a freeze on all affected assets
    within one business hour and begin a formal review process with a goal of resolution
    within 15 business days.'
  domain: retirement
  product_category: traditional_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
