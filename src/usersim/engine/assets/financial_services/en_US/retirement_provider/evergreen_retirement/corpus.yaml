- id: 582c052e-8918-5288-86c1-621e0be78bb2
  title: Roth IRA — cost and charges
  body: 'What are the primary fees associated with a Roth IRA?

    We maintain a lean, transparent fee structure to maximize your compound growth.
    Fees are primarily tied to active asset management. Unlike some of our other offerings,
    such as the Rollover IRA where basic maintenance is often waived, the Roth IRA''s
    costs are centered on the professional management of your chosen investments.


    Are there any hidden maintenance charges?

    No. We believe in absolute transparency. All fees are clearly disclosed in your
    account agreement and statements. We avoid unnecessary jargon and hidden costs
    to ensure you know exactly how your assets are being managed.


    Does Evergreen Retirement charge for regulatory reporting?

    Standard reporting for contribution limits (such as the $7,000 annual limit) and
    RMD tracking is included as part of our professional service to ensure you remain
    compliant with IRS and DOL frameworks.


    For a full breakdown of all potential costs, please see Roth IRA — fee schedule.'
  domain: retirement
