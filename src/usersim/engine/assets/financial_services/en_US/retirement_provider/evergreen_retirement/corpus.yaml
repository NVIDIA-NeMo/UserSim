- id: 00fb37d0-813a-502a-adf9-d1500796ef12
  title: Roth IRA — make a change or update
  body: 'Updating your Roth IRA account details is a secure process designed to protect
    your assets. Whether you are adjusting your contribution amounts or updating your
    personal information, please follow these steps:


    1. Identity Verification: Provide your account number and complete the required
    Multi-factor authentication (MFA) challenge. We cannot perform any state-changing
    actions without a verified secure session.

    2. Specify the Change: Clearly state the update you wish to make. For example,
    if you are increasing your recurring contribution, specify the new amount and
    the frequency. Ensure the total for the year does not exceed the annual contribution
    limit of $7,000.

    3. Review Suitability: We will review the requested change to ensure it aligns
    with product suitability. If you are requesting a distribution, we will provide
    a warning regarding the Early Withdrawal Penalty if you are under age 59½.

    4. Confirmation of Terms: We will summarize the change and any impact it may have
    on your account status. You must explicitly confirm your agreement to these terms.

    5. Final Execution: Once confirmed, we will process the update. You will receive
    a confirmation notice via your secure message center within one business day.


    If you need to completely close or downgrade your account, please refer to Roth
    IRA — cancel, close, or downgrade.'
  domain: retirement
  product_category: roth_ira
  document_type: how_to_guide
  source_authority: official
