- id: 58dc6687-9b9c-504d-9a60-edb0a23672e9
  title: Roth IRA — overview
  body: 'At Evergreen Retirement, we provide the Roth IRA for clients seeking a strategic
    path toward tax-free growth and qualified withdrawals in retirement. Unlike traditional
    savings vehicles, contributions to a Roth IRA are made with after-tax dollars,
    meaning you do not receive a tax deduction today, but you enjoy the benefit of
    tax-free distributions of both your contributions and their earnings once you
    reach retirement age.


    We design our Roth IRA to be a premium tool for stability and long-term wealth
    accumulation. To maintain compliance with IRS frameworks, we enforce a strict
    annual contribution limit of $7000. This limit ensures a standardized accumulation
    phase across our client base while prioritizing regulatory precision.


    Our fee philosophy is centered on transparency and the maximization of your compound
    growth. We maintain a lean structure where fees are primarily tied to active asset
    management, ensuring that your capital remains focused on growth. We also prioritize
    a seamless transition from the accumulation of assets to the distribution phase,
    guiding you through the suitability of your product choices.


    Please be aware that eligibility for this account is subject to income restrictions.
    For single filers, the income phaseout begins at $146000. If your income exceeds
    these thresholds, your ability to contribute directly to a Roth IRA may be limited
    or eliminated.


    ***


    **TAX WARNING:** Roth IRA contributions are made after-tax. While qualified distributions
    are tax-free, non-qualified distributions may be subject to taxes and an Early
    Withdrawal Penalty. We provide educational resources on these limits, but we do
    not provide individualized tax or legal advice. Please consult a certified CPA
    for specific tax strategies.'
  domain: retirement
  product_category: roth_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
