- id: 975a821b-2c34-5d10-aafe-f32c48951f65
  title: Roth IRA — set up and activate
  body: 'Setting up your Roth IRA is a straightforward process designed to move you
    quickly from decision to accumulation. Please follow these steps to activate your
    account.


    **Requirements before starting:**

    - A valid government-issued photo ID.

    - Your Social Security Number or Taxpayer Identification Number.

    - Funding details for your initial after-tax contribution.


    **Activation Steps:**

    1. **Provide Personal Information:** Tell us your full legal name, address, and
    tax identification number. We will use this information to verify your identity
    in accordance with our rigorous security standards.

    2. **Verify Identity:** Complete a multi-factor authentication (MFA) process.
    We require a verified secure session before any account can be opened or modified.

    3. **Confirm Income Eligibility:** Provide your current annual income for the
    tax year. We will verify that your income is within the allowable limits (for
    example, ensuring single filers are below the $146000 phaseout start) to ensure
    the product is suitable for your situation.

    4. **Fund the Account:** Specify the amount of your initial contribution. Note
    that this amount cannot exceed the annual contribution limit of $7000.

    5. **Select Asset Allocation:** Tell us how you wish to allocate your funds. We
    will guide you toward product suitability based on your retirement timeline.


    **How you know it worked:**

    Once these steps are complete, we will provide a confirmation notice and an account
    number. You will see the funded balance reflected in your secure account summary
    immediately following the transfer.'
