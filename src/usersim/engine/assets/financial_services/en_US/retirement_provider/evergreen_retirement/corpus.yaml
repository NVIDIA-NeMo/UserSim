- id: babefb60-87bc-5215-815f-264bebfac185
  title: Traditional IRA — an unexpected charge or amount
  body: 'It can be concerning to see a balance or charge that does not align with
    your expectations. Most discrepancies in a Traditional IRA are related to regulatory
    penalties or management fees.


    Symptom: "I see a deduction from my balance that I didn''t authorize," or "My
    distribution amount is lower than my total balance."


    Possible Causes:

    1. Early Withdrawal Penalty: If you took a distribution before age 59½, a 10%
    penalty is typically imposed by the IRS. This is a regulatory requirement, not
    an internal fee.

    2. Asset Management Fees: Our fee philosophy ties charges to active asset management.
    Review your latest statement to see if a scheduled management fee was applied.

    3. Tax Withholding: Distributions from pre-tax accounts are taxable events; a
    portion may have been withheld for federal or state taxes.


    Resolution Steps:

    - First, check the date of the transaction and compare it to your distribution
    history.

    - Second, verify if the amount matches exactly 10% of a recent withdrawal (indicating
    an early withdrawal penalty).

    - Third, check if the charge aligns with your active management tier.


    If the cause remains unclear, we will initiate a formal review process. We will
    investigate the transaction and aim for a resolution within 15 business days.
    If the charge is found to be an error, we will apply a correction to your balance
    immediately.'
  domain: retirement
  product_category: traditional_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 79cb227b-490d-5d45-92da-7d6179a6379b
  title: Traditional IRA — required documentation
  body: 'To open a Traditional IRA and ensure full ERISA and IRS compliance, the following
    documentation is required based on your status:


    | Requirement | Individual Applicant | Small Business Owner |

    | :--- | :--- | :--- |

    | Government-Issued ID | Mandatory (Valid Passport/License) | Mandatory (Valid
    Passport/License)

    | Tax Identification | SSN Mandatory | EIN or SSN Mandatory |

    | Proof of Address | Utility Bill or Lease | Business Registration or Lease |

    | Funding Source | Verified Bank Account | Verified Business or Personal Account
    |


    Outcome: Upon receipt and verification of these documents, the account will be
    opened. We will then confirm your annual contribution limit of $7,000 (or $8,000
    if aged 50+).'
