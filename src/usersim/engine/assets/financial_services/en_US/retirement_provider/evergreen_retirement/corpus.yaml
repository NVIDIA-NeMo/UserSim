- id: cab155fb-1880-5c65-880c-8744b28b9615
  title: Traditional IRA — resolve a common request end-to-end
  body: 'Task: Updating your annual contribution amount to maximize your retirement
    savings.


    Before starting: Ensure you know your total contributions for the current calendar
    year to avoid exceeding IRS limits.


    1. Establish a secure session by completing the mandatory multi-factor authentication
    (MFA) and identity verification process.

    2. Tell us the new contribution amount or frequency you wish to implement for
    your Traditional IRA.

    3. We will verify that the requested amount does not exceed the $7000 annual limit,
    or the $8000 limit if you are 50 years or older (which includes the $1000 catch-up
    contribution).

    4. We will confirm the update to your account and provide a confirmation number
    for your records.

    5. Review your updated contribution schedule in your account history to ensure
    the change was applied correctly.


    By following these steps, you ensure your account remains compliant with IRS frameworks
    while maximizing your pre-tax growth. If you have questions about the tax implications
    of these contributions, please refer to a certified CPA.'
  domain: retirement
