- id: 68082e46-dc0c-5fe3-8229-623b49828182
  title: Rollover IRA — cost and charges
  body: '**What are the ongoing costs for maintaining a Rollover IRA?**

    We believe in a lean, transparent fee structure to maximize your compound growth.
    Therefore, the account fee for the Rollover IRA is $0. We waive basic account
    maintenance to encourage clients to consolidate their portfolios.


    **Are there fees for transferring my assets into the account?**

    Evergreen Retirement does not charge a fee to receive your rollover assets. However,
    please be aware that your previous employer''s plan administrator may charge a
