- id: 21e425f6-6a6e-5f36-b142-72df6cf15047
  title: Traditional IRA — access or login problems
  body: 'If you are unable to access your Traditional IRA account or are experiencing
    login failures, please follow these steps to resolve the issue:


    Symptom: "I cannot log in to my account" or "My MFA code is not being accepted."


    Likely Causes:

    - Incorrect credentials or expired password.

    - MFA synchronization issues or outdated contact information.

    - Account freeze due to suspected fraudulent activity.


    Resolution Steps:

    1. Verify your credentials. Ensure there are no typographical errors in your username
    or password.

    2. Check your MFA delivery method. If you are not receiving the code via the registered
    method, ask us to verify the contact information on file.

    3. Confirm account status. Ask us to check if there is a security freeze on your
    assets. If a fraud report was recently initiated, we freeze affected assets within
    one business hour for your protection.


    When to Escalate:

    If the login issue persists after verifying credentials and MFA, we will escalate
    the matter to our technical security team. You will receive an update on the status
    of your access restoration within one business day. If the lockout is related
    to a fraud investigation, the resolution process typically targets a window of
    15 business days.


    For those comparing our security rigor to other providers, please note that we
    do not permit any account modifications without a verified secure session to protect
    your retirement savings.'
