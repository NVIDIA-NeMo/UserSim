- id: 339e7d7b-fb75-5fef-b892-36180a347587
  title: Roth IRA — a failed or pending action
  body: 'If you encounter an issue where a contribution or distribution is listed
    as ''pending'' or has ''failed,'' please follow these diagnostic steps.


    **Symptom:** A contribution toward your $7000 annual limit is not appearing in
    your balance, or a distribution request has been declined.


    **Likely Causes:**

    - **Identity Verification Failure:** The action was attempted without a verified
    secure session or MFA.

    - **Limit Breach:** The contribution would cause the total account balance to
    exceed the $7000 annual limit.

    - **Income Ineligibility:** A contribution was attempted despite income exceeding
    the $146000 phaseout threshold for single filers.

    - **Insufficient Funds:** The linked funding account had insufficient settled
    cash.


    **What to check in order:**

    1. Check your secure session status. Ensure you have completed the most recent
    MFA prompt.

    2. Review your year-to-date contributions. Confirm that the new amount does not
    push you over $7000.

    3. Verify your reported income for the current tax year against the eligibility
    thresholds.


    **The Fix:**

    - If the session expired, re-verify your identity via MFA and resubmit the request.

    - If you have exceeded the $7000 limit, adjust the contribution amount to a value
    that fits within the remaining annual allowance.


    **When to escalate:**

    If the action remains ''pending'' for more than two business days despite meeting
    all criteria, we will raise a formal internal review case. We will investigate
    the transaction with our clearing partners and provide you with a status update
    within 15 business days.'
  domain: retirement
  product_category: roth_ira
  document_type: troubleshooting
  source_authority: official
