- id: cc859824-8b2c-5255-a08e-e585e7beaaa9
  title: SEP IRA — a declined or blocked action
  body: 'Symptom: You attempted to make a contribution or request a distribution from
    your SEP IRA, but the action was declined or blocked.


    Likely Causes:

    1. Security Block: The action was attempted without a verified secure session
    or failed multi-factor authentication (MFA).

    2. Contribution Limit Exceeded: The contribution would cause the account to exceed
    25% of compensation or the absolute annual cap of $70,000.

    3. Regulatory Hold: The account is under a temporary freeze due to a reported
    fraud incident.


    What to check in order:

    1. Verification Status: Ensure you have successfully completed the MFA prompt.
    No state-changing actions are permitted without a verified secure session.

    2. Contribution Math: Review your total contributions for the year. If you have
    already hit the $70,000 limit or the 25% of compensation threshold, the system
    will automatically block further deposits.

    3. Account Alerts: Check if there are any notifications regarding a security freeze.


    Resolution:

    - For security blocks: Re-authenticate your identity through our secure verification
    process, and we will re-process the action.

    - For limit issues: Adjust the contribution amount to fall within the regulatory
    limits of 25% of compensation or the $70,000 maximum.

    - For regulatory holds: If your account was frozen due to fraud, we will work
    with you to verify your identity and resolve the dispute. Our goal is resolution
    within 15 business days.


    Escalation:

    If the block persists despite meeting all criteria, we will escalate the matter
    to our Senior Compliance Officers for a final regulatory review. You will receive
    an update on the status of this review within one business day.'
  domain: retirement
  product_category: sep_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: dd88efbe-78a7-5c8e-a1db-51b595d805a8
  title: SEP IRA — when to switch or upgrade
  body: 'Determining when to move from a SEP IRA to another vehicle depends on your
    business growth and contribution goals.


    Switch to a Traditional 401(k) when:

    - You want to allow employees to make their own salary-reduction contributions,
    which is not possible with the SEP IRA.

    - Your business has grown to a size where the administrative complexity of a 401(k)
    is offset by the benefit of higher employee participation.


    Switch to a Rollover IRA when:

    - You are closing your business or retiring and wish to consolidate your assets
    into a single, zero-fee vehicle to simplify your distribution phase.


    Stay with the SEP IRA if:

    - You prioritize a high annual contribution cap of $70,000 with less administrative
    overhead than a 401(k).

    - You are a sole proprietor or have very few employees and wish to maintain the
    25% of compensation contribution flexibility.


    For more details on consolidation, see Rollover IRA — overview.'
  domain: retirement
  product_category: sep_ira
  document_type: comparison
  source_authority: official
