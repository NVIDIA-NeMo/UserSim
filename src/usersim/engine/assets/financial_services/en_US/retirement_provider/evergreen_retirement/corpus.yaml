- id: d7df243f-d9e8-5689-b211-14a563dcf8e9
  title: SEP IRA — a discrepancy in your records or statement
  body: 'Symptom: A customer reports that the contribution total or account balance
    on their statement does not match their internal business records.


    Likely Causes:

    1. Processing Lag: A recent contribution has been initiated but has not yet cleared
    the settlement period.

    2. Limit Capping: A contribution was partially rejected or capped because it exceeded
    the 25% of compensation limit or the $70,000 annual cap.

    3. Management Fee Deduction: Active asset management fees were deducted, which
    the customer may have mistaken for a missing contribution.


    What to check in order:

    1. Transaction Dates: Compare the date of the business transfer with the posting
    date on the Evergreen Retirement statement.

    2. Contribution Thresholds: Verify if the total deposits for the year reached
    the $70,000 limit or the 25% of compensation threshold.

    3. Fee Ledger: Review the statement for any line items related to active asset
    management fees.


    Resolution:

    - For processing lags: We will provide the current pending transaction status.
    If the funds are in transit, we will confirm the expected posting date.

    - For limit capping: If a contribution was capped by the $70,000 or 25% limit,
    we will identify the excess amount and coordinate the return of those funds to
    the business account.

    - For fee discrepancies: We will provide a detailed breakdown of the fees applied
    to the account to clarify the balance reduction.


    Escalation:

    If the discrepancy remains unresolved after these checks, we will initiate a formal
    review process. We treat all financial discrepancies with urgency and aim for
    a full resolution within 15 business days. During this time, we will provide a
    designated point of contact for the client.'
  domain: retirement
  product_category: sep_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: c7a75101-33a6-5fb6-9294-ddc0a44c171c
  title: Rollover IRA — overview
  body: 'The Rollover IRA is a premium consolidation vehicle designed for mid-to-late
    career professionals and small business owners. We understand that managing multiple
    retirement accounts from previous employers can be cumbersome. This product allows
    you to transfer assets from those previous employer plans into a single, professionally
    managed account, ensuring a seamless transition from the accumulation phase to
    distribution.


    Our primary goal is to maximize your compound growth by reducing the drag of unnecessary
    costs. To encourage this portfolio consolidation, we maintain a lean fee structure.
    For the Rollover IRA, the account fee is $0. By eliminating this basic maintenance
    cost, we ensure that more of your capital remains invested and working toward
    your retirement goals.


    We prioritize regulatory precision and stability. All accounts are managed in
    strict adherence to DOL and IRS frameworks, emphasizing ERISA compliance. Whether
    you are consolidating a traditional 401(k) or another qualified plan, we provide
    the authoritative guidance needed to maintain the tax-deferred status of your
    assets.


    ***

    **TAX WARNING:** Rollovers must be executed according to specific IRS guidelines
    to avoid unintended taxable events. While we provide educational resources on
    contribution limits and Required Minimum Distributions (RMDs), Evergreen Retirement
    does not provide individualized tax or legal advice. We strongly recommend consulting
    a certified CPA to determine the most advantageous tax strategy for your specific
    financial situation.


    **REGULATORY DISCLAIMER:** Distributions from retirement accounts may be subject
    to federal and state income taxes. Early withdrawals made before age 59½ may incur
    an Early Withdrawal Penalty of 10% unless a specific IRS exception applies.'
  domain: retirement
  product_category: rollover_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
