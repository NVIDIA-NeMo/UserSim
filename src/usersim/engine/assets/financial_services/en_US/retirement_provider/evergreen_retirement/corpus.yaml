- id: 6ac25f04-24ba-5ea4-a428-565a46a34287
  title: Regulatory notes for retirement
  body: 'Evergreen Retirement adheres strictly to the frameworks established by the
    Department of Labor (DOL) and the Internal Revenue Service (IRS), with a primary
    emphasis on maintaining ERISA compliance across all retirement products. Our operational
    posture prioritizes the fair treatment of investors and the absolute privacy of
    Personally Identifiable Information (PII).


    **Required Minimum Distributions (RMDs)**

    We provide comprehensive educational resources regarding RMDs—the minimum amount
    the IRS requires account holders to withdraw annually after reaching a certain
    age. It is the agent''s obligation to ensure that all disclosures regarding RMDs
    and associated penalties are prominent in client communications.


    **Early Withdrawal Penalties**

    Clients must be alerted to the Early Withdrawal Penalty, which is a tax penalty
    (typically 10%) imposed by the IRS for taking distributions before age 59½, unless
    a specific regulatory exception applies.


    **Advice Boundaries**

    While we guide clients toward product suitability and provide educational data
    on contribution limits and RMDs, we do not provide individualized tax or legal
    advice. All agents must defer specific tax strategies to certified CPAs.


    ***

    *Regulatory Disclaimer: Evergreen Retirement provides educational information
    only. Tax laws are subject to change and vary by individual circumstance. Please
    consult a certified tax professional or CPA for individualized advice.*'
  domain: retirement
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: fe5b26b5-714a-5aac-a83c-4e1834938ee8
  title: When to use get_retirement_accounts
  body: 'The get_retirement_accounts tool is the authoritative mechanism for retrieving
    a comprehensive list of all retirement-specific accounts held by a client. This
    tool should be used when a client inquires about their overall retirement portfolio
    or when the agent needs to identify which specific retirement products (such as
    a Traditional 401(k), Roth IRA, Traditional IRA, SEP IRA, or Rollover IRA) are
    currently active.


    **Procedure for Account Retrieval:**

    1. **Identity Verification**: Before calling any data retrieval tool, the agent
    must ensure the client has completed a verified secure session using multi-factor
    authentication (MFA).

    2. **Context Gathering**: Confirm the client''s intent to view their retirement-specific
    holdings.

    3. **Tool Execution**: Call the get_retirement_accounts tool to fetch the account
    details.

    4. **Data Presentation**: Provide the client with the account types and balances
    retrieved, ensuring no PII is exposed in non-secure channels.


    This tool is distinct from general account lookups as it filters specifically
    for retirement vehicles. If the agent needs to resolve a specific account_id from
    a last-4 digit provided by the customer, the get_accounts tool should be utilized
    first to establish the correct identifier before proceeding with retirement-specific
    queries.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_retirement_accounts
  institution_id: evergreen_retirement
- id: 31125c85-5abe-5a15-b05f-8c3084a4d837
  title: get_retirement_accounts tool reference
  body: 'The get_retirement_accounts tool allows the agent to retrieve a list of all
    retirement accounts associated with a verified client profile.


    **Tool Signature:**

    `get_retirement_accounts()`


    **Effect:**

    Returns a list of retirement accounts, including product IDs and current balances.
    This tool is read-only and does not modify account state.


    **Agent Action:**

    The agent performs this action by calling the tool directly within the secure
    session. The agent must never direct the customer to a portal or external website
    to retrieve this list; the information is delivered directly through the conversation
    after identity is verified.'
