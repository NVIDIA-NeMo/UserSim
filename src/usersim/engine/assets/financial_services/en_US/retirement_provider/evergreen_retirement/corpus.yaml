- id: 213a83ee-bc47-5a22-9b7d-3d5a481eb226
  title: Traditional IRA — vs. a similar product here
  body: 'When deciding between a Traditional IRA and a Roth IRA, the primary consideration
    is the timing of your tax advantage.


    Traditional IRA:

    - Tax Treatment: Contributions are often pre-tax, reducing your taxable income
    now. Withdrawals in retirement are taxed as ordinary income.

    - Limits: $7,000 annual limit ($8,000 for age 50+).

    - Best For: Professionals who expect to be in a lower tax bracket during retirement
    than they are currently.


    Roth IRA:

    - Tax Treatment: Contributions are made after-tax. Qualified withdrawals in retirement
    are tax-free.

    - Limits: $7,000 annual limit ($8,000 for age 50+).

    - Best For: Those who prefer tax-free growth and flexibility in retirement, or
    who expect to be in a higher tax bracket later.


    Both products require a 10% early withdrawal penalty for distributions before
    age 59½. If you are seeking an employer-sponsored option rather than an individual
    account, you may wish to review the Traditional 401(k) — overview.'
  domain: retirement
  product_category: traditional_ira
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 3ac22725-0499-556a-a08e-40a6711b3a11
  title: Traditional IRA — regulatory disclosures
  body: 'This account is governed by the Internal Revenue Code and adheres to Department
    of Labor (DOL) and ERISA frameworks. All disclosures regarding Required Minimum
    Distributions (RMDs) and tax penalties are provided prominently to ensure investor
    protection.


    TAX WARNINGS:

    - EARLY WITHDRAWALS: Distributions taken from a Traditional IRA before the account
    holder reaches age 59½ are generally subject to a 10% Early Withdrawal Penalty
    imposed by the IRS, in addition to applicable federal and state income taxes.
    Exceptions may apply for first-time homebuyers, qualified higher education expenses,
    or certain medical conditions.

    - REQUIRED MINIMUM DISTRIBUTIONS: Account holders must begin taking RMDs (the
    minimum amount the IRS requires account holders to withdraw annually after reaching
    a certain age). Failure to take an RMD can result in significant tax penalties.


    ADVICE LIMITATIONS:

    Evergreen Retirement provides comprehensive educational resources regarding contribution
    limits, such as the $7,000 standard limit and the $1,000 catch-up limit for those
    50+. However, we do not provide individualized tax or legal advice. Our standard
    of care is to guide clients toward product suitability while deferring specific
    tax strategies—including the determination of deductibility—to certified CPAs.


    SECURITY AND PRIVACY:

    We maintain strict protocols for the protection of Personally Identifiable Information
    (PII). No account modifications, including contribution changes or distributions,
    are permitted without a verified secure session utilizing multi-factor authentication
    (MFA).'
  domain: retirement
  product_category: traditional_ira
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 16e80777-c8b9-56d3-bcca-05e48dd16ffb
  title: Traditional IRA — interest rate / APY schedule
  body: "The Traditional IRA is an investment vehicle; therefore, the yield on your\
    \ assets is determined by the specific investment elections you make within the\
    \ account rather than a single flat institutional rate. \n\nYour actual Annual\
    \ Percentage Yield (APY) will vary based on whether your funds are allocated to\
    \ equities, bonds, or money market instruments. These rates are quoted against\
    \ the current market value of the underlying assets and are credited to your account\
    \ according to the specific terms of the selected investment.\n\nFactors that\
    \ may change your yield include:\n- Market Volatility: Changes in the value of\
    \ the underlying securities.\n- Rebalancing: Adjustments made to your portfolio\
    \ allocation.\n- Management Fees: Fees tied to active asset management.\n\nFor\
    \ a detailed breakdown of how these yields are calculated and applied to your\
    \ balance, please refer to Traditional IRA — who it is best for and common use\
    \ cases."
