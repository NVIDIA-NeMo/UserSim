- id: d45523b3-09c3-5b53-965a-1550b4c42d9b
  title: When to use get_accounts
  body: 'The get_accounts tool is the foundational utility for identifying and resolving
    client accounts. It is used as a prerequisite for nearly all state-changing actions
    to ensure that the correct account_id is targeted, especially when a client provides
    only a partial account number (such as the last 4 digits).


    **Procedure for Account Resolution:**

    1. **Identity Verification**: Multi-factor authentication (MFA) must be completed.
    No account information may be retrieved or modified without a verified secure
    session.

    2. **Input Capture**: Capture the account identifier provided by the client (e.g.,
    a last-4 digit string).

    3. **Tool Execution**: Call the get_accounts tool to retrieve the full account
    details and the unique account_id associated with that client.

    4. **Validation**: Verify that the retrieved account matches the client''s expectations
    and ownership records.


    Once the account_id is resolved, the agent may proceed to other tools, such as
    update_contribution or initiate_rollover. This ensures that PII is handled securely
    and that assets are not incorrectly modified. If the search yields multiple accounts,
    the agent must ask the client to specify the desired account by its display name
    (e.g., Traditional 401(k) or Roth IRA) before proceeding.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: evergreen_retirement
- id: 334b12a8-a1d6-56f7-9c49-a42c2ddeecc2
  title: get_accounts tool reference
  body: 'The get_accounts tool allows agents to retrieve a comprehensive list of all
    accounts associated with a specific client. This tool provides essential visibility
    into the client''s current holdings across our retirement product suite, including
    balance information and account status.


    **Tool Signature:**

    `get_accounts()`


    **Arguments:**

    No arguments are required for this call.


    **Effect:**

    Returns a list of all accounts linked to the authenticated user session, providing
    the necessary account identifiers needed for subsequent state-changing actions.


    Agents perform this action by calling the tool directly within the secure session.
    This tool should be used early in a support interaction to ensure the agent is
    referencing the correct accounts before proceeding with specific requests.'
