- id: 8c627ccf-37a0-569a-ab51-1d8b2ae0fac1
  title: Traditional 401(k) — set up and activate
  body: 'Activating your Traditional 401(k) is a straightforward process designed
    to get your pre-tax savings working as quickly as possible. Before beginning,
    please ensure you have your employer''s plan sponsorship ID and your current salary
    details available.


    1. Provide your personal identification and employer sponsorship details. We will
    verify your identity using mandatory multi-factor authentication (MFA) to ensure
    the security of your PII.

    2. Specify your contribution percentage or a flat dollar amount. Note that your
    total annual contributions cannot exceed the employee contribution limit of $23,500,
    unless you are 50 or older and wish to utilize the $7,500 catch-up limit.

    3. Select your initial investment elections. We will guide you toward product
    suitability based on your retirement timeline and risk tolerance.

    4. Confirm the beneficiary designations for your account to ensure regulatory
    compliance and the privacy of your estate.

    5. Review and electronically sign the account agreement. We will provide a confirmation
    notice once the account is formally activated.


    Once these steps are complete, your account is active. You will know the process
    was successful when you receive a secure confirmation message and see the Traditional
    401(k) listed as an active asset in your portfolio overview. For a full breakdown
    of costs associated with this account, please see Traditional 401(k) — fee schedule.'
  domain: retirement
  product_category: traditional_401k
  document_type: how_to_guide
  source_authority: official
