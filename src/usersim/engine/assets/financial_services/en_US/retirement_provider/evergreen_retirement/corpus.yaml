- id: ab0458fb-56e4-5dec-aa3b-0c19da623d8f
  title: Rollover IRA — access or login problems
  body: "If you are unable to access your Rollover IRA account or are experiencing\
    \ login failures, please follow these steps to resolve the issue.\n\n**Common\
    \ Symptoms**\n- Receiving an 'Invalid Credentials' error despite entering the\
    \ correct password.\n- Not receiving the multi-factor authentication (MFA) code\
    \ on your registered device.\n- Being locked out of the account after multiple\
    \ failed attempts.\n\n**Troubleshooting Steps**\n1. **Check Connection and Device:**\
    \ Ensure your device has a stable internet connection and that your MFA device\
    \ is powered on and capable of receiving SMS or app notifications.\n2. **Verify\
    \ Identity:** If the password is not working, tell us you need a credential reset.\
    \ We will perform a rigorous identity verification process. Once your identity\
    \ is confirmed, we will help you establish a new password.\n3. **MFA Reset:**\
    \ If you have lost access to your MFA device, inform us immediately. We will initiate\
    \ a high-security verification protocol to update your MFA settings. This requires\
    \ presenting verified government-issued identification.\n\n**Resolution and Escalation**\n\
    Most access issues are resolved immediately during the conversation. If the lockout\
    \ is due to suspected fraudulent activity, we will initiate a freeze on affected\
    \ assets within one business hour as a protective measure. \n\nIf the login problem\
    \ persists after a credential reset and MFA update, we will raise a technical\
    \ case with our systems team. You will receive an update on the status of your\
    \ access within one business day.\n\nFor those comparing our security protocols\
    \ with other providers, please see Rollover IRA — vs. a typical competitor offering."
  domain: retirement
