- id: e11940bf-29ed-544e-9778-94705dd1c28d
  title: SEP IRA — access or login problems
  body: 'If you are unable to access your SEP IRA account or are encountering login
    failures, please follow these steps to restore access.


    Symptom: You receive an ''Authentication Failed'' message or your MFA code is
    not being accepted during the login process.


    Likely Causes:

    1. Incorrect credentials or an expired password.

    2. MFA synchronization issues or an outdated authentication device.

    3. An account freeze initiated due to suspected fraudulent activity.


    Resolution Steps:

    1. Check Credentials: Ensure you are using the correct username and password.
    If you have forgotten your password, ask us to trigger a secure password reset
    process.


    2. Verify MFA Device: Ensure your mobile device is connected to the network. If
    the MFA code is not arriving, ask us to resend the code or verify if your contact
    information is current.


    3. Confirm Account Status: Ask us to check if there is a security freeze on your
    account. If a fraud report was initiated, we freeze affected assets within one
    business hour for your protection.


    4. Identity Re-verification: If you have lost access to your MFA device, we will
    require a rigorous identity verification process before granting access. This
    may involve submitting government-issued identification for review.


    When to Escalate:

    If these steps do not resolve the issue, we will escalate your case to our Senior
    Compliance Officers for final review. You can expect a resolution or a detailed
    status update within 15 business days, as per our formal review process for account
    disputes and access issues.'
  domain: retirement
  product_category: sep_ira
  document_type: troubleshooting
  source_authority: official
