- id: 58dad79f-dba2-526f-addd-95d8589a9f47
  title: SEP IRA — overview
  body: 'The SEP IRA is a high-capacity retirement solution tailored specifically
    for self-employed individuals and small business owners. We designed this product
    to provide the stability and growth potential required by mid-to-late career professionals
    who manage their own enterprises, offering a seamless transition from the accumulation
    of assets to their eventual distribution.


    Our SEP IRA allows for significant pre-tax contributions, which can reduce your
    current taxable income while building a substantial nest egg for the future. We
    adhere strictly to DOL and IRS frameworks to ensure your account remains compliant
    with all federal regulations.


    **Contribution Limits**

    To maximize your compound growth, we support the following contribution thresholds:

    - **Annual Contribution Cap**: Contributions are capped at a maximum of $70,000
    per year.

    - **Percentage Limit**: Contributions may be up to 25% of the employer''s compensation.


    **Fees and Management**

    In line with our fee philosophy, we maintain a lean and transparent structure.
    Fees are primarily tied to active asset management to ensure your portfolio is
    positioned for stability. Basic account maintenance is kept minimal to encourage
    the consolidation of your retirement assets.


    **Regulatory Warnings**

    Please be advised that distributions taken before age 59½ may be subject to an
    Early Withdrawal Penalty of 10% imposed by the IRS, unless a specific exception
    applies. Additionally, once you reach the applicable age, you must take a Required
    Minimum Distribution (RMD) annually as mandated by the IRS.


    ***Disclaimer**: Evergreen Retirement provides comprehensive educational resources
    on contribution limits and RMDs, but we do not provide individualized tax or legal
    advice. We guide our clients toward product suitability, but we defer specific
    tax strategies to certified CPAs.*'
  domain: retirement
  product_category: sep_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
