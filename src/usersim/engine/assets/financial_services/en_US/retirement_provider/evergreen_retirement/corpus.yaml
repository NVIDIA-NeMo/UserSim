  title: Traditional IRA — limits, restrictions, and edge cases
  body: 'This internal reference guide outlines the regulatory limits and restrictive
    edge cases for the Traditional IRA to ensure accurate customer support.


    Contribution Limits:

    - Standard Annual Limit: The maximum annual contribution is $7000.

    - Catch-up Provision: Individuals aged 50 and older are eligible for an additional
    catch-up contribution of $1000.


    Withdrawal Restrictions:

    - Early Withdrawal Penalty: Distributions taken before the account holder reaches
    age 59½ are generally subject to a 10% early withdrawal penalty imposed by the
    IRS, unless a regulatory exception applies.

    - Required Minimum Distributions (RMDs): Account holders must begin taking RMDs
    upon reaching the age specified by the IRS to avoid significant tax penalties.


    Compliance Note:

    We adhere strictly to DOL and IRS frameworks, emphasizing ERISA compliance. All
    identity verification and multi-factor authentication (MFA) are mandatory before
    any state-changing action, such as updating contribution amounts or initiating
    a distribution. No account modifications are permitted without a verified secure
    session.'
