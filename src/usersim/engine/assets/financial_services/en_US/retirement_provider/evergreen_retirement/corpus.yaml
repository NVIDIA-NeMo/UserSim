- id: afb3aacd-71de-5139-ac34-a95b197059c6
  title: Traditional IRA — a declined or blocked action
  body: 'Symptom: You are informed that a contribution or distribution request for
    your Traditional IRA has been declined or blocked.


    Likely Causes:

    - Verification Failure: The secure session was not established via mandatory multi-factor
    authentication (MFA).

    - Contribution Limit Breach: The requested contribution exceeds the annual limit
    of $7000 (or $8000 for those aged 50+ including the $1000 catch-up limit).

    - Security Freeze: A fraud report may have triggered an automatic asset freeze.


    Resolution Steps:

    1. Verify your identity: Ensure you have completed all identity verification steps
    to create a verified secure session.

    2. Check your year-to-date totals: Confirm that the new contribution does not
    push your total annual investment above the allowed $7000 limit, plus the $1000
    catch-up if applicable.

    3. Review security notifications: Check for any alerts regarding account freezes.


    If the action remains blocked after these checks, we will escalate the matter
    to our Senior Compliance Officers for a final regulatory review. You will receive
    a notification of the outcome once the review is complete.'
