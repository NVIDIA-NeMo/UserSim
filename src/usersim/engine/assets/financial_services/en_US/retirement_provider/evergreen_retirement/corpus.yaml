- id: 827e62b9-148e-5d0f-9e70-492cd668e275
  title: Roth IRA — annual contribution limit explained
  body: '**What is the maximum amount I can contribute to my Roth IRA this year?**

    The annual contribution limit for the Roth IRA is $7000. This is the maximum amount
    we can accept for your account for the current tax year.


    **What happens if I contribute more than the $7000 limit?**

    Contributing beyond the annual limit can result in IRS penalties. If you believe
    an over-contribution has occurred, please notify us immediately so we can assist
    you in correcting the balance to avoid tax complications.


    **Does the contribution limit apply to my total IRA savings or just the Roth?**

    IRS contribution limits typically apply across all your traditional and Roth IRA
    accounts combined. We recommend reviewing your total annual contributions to ensure
    you stay within the $7000 threshold.


    For more details on how these limits interact with your income, please refer to
    Roth IRA — eligibility requirements.'
  domain: retirement
  product_category: roth_ira
  document_type: faq
  source_authority: official
