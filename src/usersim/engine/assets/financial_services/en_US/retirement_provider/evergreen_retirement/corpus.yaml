- id: fa55e8db-c366-5a7d-8d83-2f1cdb33bb9d
  title: Traditional IRA — how rates are tiered and applied
  body: "For the Traditional IRA, rates are not applied as a flat interest percentage\
    \ on the account balance, but are instead tied to the performance of the assets\
    \ selected within the portfolio. \n\nOur fee structure is designed to be lean\
