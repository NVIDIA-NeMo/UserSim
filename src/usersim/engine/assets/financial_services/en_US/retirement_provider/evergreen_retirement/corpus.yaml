- id: 13482f3f-d1f7-5d99-afaf-4351f14b5633
  title: SEP IRA — a failed or pending action
  body: '**Symptom**: You have attempted to make a contribution or change an account
    setting, but the action is listed as ''Pending'' or has ''Failed''.


    **Likely Causes**

    1. **Authentication Timeout**: The secure session expired before the action was
    finalized.

    2. **Limit Violation**: The contribution amount exceeds the 25% compensation limit
    or the $70,000 annual contribution cap.

    3. **Verification Failure**: Multi-factor authentication (MFA) was not successfully
    completed.


    **Steps to Resolve**

    1. **Check Session Status**: Verify if you are still in a verified secure session.
    If the session has timed out, we will require you to re-authenticate using MFA
    before any state-changing action can be retried.

    2. **Review Contribution Figures**: Check the total amount of contributions made
    year-to-date. Ensure the pending amount does not push the total over the $70,000
    limit or exceed 25% of eligible compensation.

    3. **Verify Identity Documentation**: If the action failed during setup, ensure
    that the business tax ID and personal identification provided match official records
    exactly.


    **Escalation Process**

    If the action remains pending for more than one business day or continues to fail
    after verifying the above, tell us to initiate a formal review. We will escalate
    the matter to our Senior Compliance Officers for a final regulatory review. You
    will receive a status update via secure chat or phone within 15 business days
    regarding the resolution of the dispute or technical error.'
  domain: retirement
  product_category: sep_ira
  document_type: troubleshooting
  source_authority: official
