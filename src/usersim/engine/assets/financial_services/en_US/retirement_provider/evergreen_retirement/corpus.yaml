- id: dd7f5a42-dd31-5ad7-b920-8182d797947a
  title: Traditional 401(k) — risk disclosures
  body: 'Investment in a Traditional 401(k) involves market risk, and the value of
    your account may fluctuate based on the performance of the selected assets. Past
    performance is not a guarantee of future results.


    Tax Implications and Penalties:

    Contributions to a Traditional 401(k) are made pre-tax, meaning withdrawals in
    retirement are taxed as ordinary income. It is critical to understand that the
    IRS imposes an early withdrawal penalty of 10% on distributions taken before the
    age of 59½, unless a qualifying exception is met. All distributions are subject
    to federal and state income taxes.


    Regulatory Compliance:

    Evergreen Retirement adheres strictly to DOL and IRS frameworks, emphasizing ERISA
    compliance across all products. We provide educational resources regarding contribution
    limits—including the $23,500 employee limit and the $7,500 catch-up limit for
    those 50 and older—and Required Minimum Distributions (RMDs).


    Disclaimer:

    We provide comprehensive educational resources on contribution limits and RMDs,
    but we do not provide individualized tax or legal advice. Our standard of care
    is to guide clients toward product suitability while deferring specific tax strategies
    to certified CPAs.


    For a detailed view of our regulatory commitments, please see Traditional 401(k)
    — regulatory disclosures.'
  domain: retirement
  product_category: traditional_401k
  document_type: disclosure
  source_authority: official
  placeholder: true
