- id: 65ef6598-5351-5d3b-9c9f-968bdbeee92f
  title: Traditional IRA — who it is best for and common use cases
  body: 'The Traditional IRA is a flexible, individual pre-tax account designed for
    those without employer-sponsored plans or professionals seeking additional savings
    beyond their workplace options. It is particularly well-suited for mid-to-late
    career professionals who are currently in a higher tax bracket and wish to reduce
    their taxable income now while deferring taxes until retirement.


    Common Use Cases:

    - Supplemental Savings: For professionals who have already maximized their Traditional
    401(k) but wish to save more for the future.

    - Self-Employed Transition: For those moving from a SEP IRA or Traditional 401(k)
    who want a simplified individual vehicle.

    - Tax Deferral: For individuals prioritizing immediate tax deductions over tax-free
    withdrawals in retirement.


    Key Financial Parameters:

    - Annual Contribution Limit: $7,000

    - Catch-up Limit (Age 50+): $1,000

    - Early Withdrawal Penalty: 10% (for distributions before age 59½)


    By consolidating your assets into a Traditional IRA with Evergreen Retirement,
    you benefit from our stability-focused management and a seamless transition from
    the accumulation phase to the distribution phase. For those looking for a zero-fee
    consolidation option for previous employer plans, we recommend reviewing the Rollover
    IRA — overview.'
  domain: retirement
  product_category: traditional_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: f7c3ac86-bec2-564d-992e-2e995d389e4c
  title: Traditional IRA — catch up limit 50plus explained
  body: 'Q: I am over 50 years old; can I contribute more to my Traditional IRA than
    the standard annual limit?


    A: Yes. To help you accelerate your savings as you approach retirement, the IRS
    allows for a Catch-up Contribution. For the Traditional IRA, this allows an additional
    $1,000 on top of the standard annual contribution limit of $7,000.


    Q: How do I apply this extra amount to my account?


    A: You can simply request to increase your contribution amount through a secure
    session. We will ensure the total does not exceed the combined limit of $8,000
    for those eligible. Please refer to Traditional IRA — overview for more details
    on general contribution guidelines.'
  domain: retirement
  product_category: traditional_ira
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 1f59790a-a8a4-57e6-8b48-81abe3b5e967
  title: Traditional IRA — cancel, close, or downgrade
  body: "If you have decided to move your assets or close your account, we provide\
    \ a streamlined process to ensure your retirement funds remain secure and compliant\
    \ with IRS regulations.\n\nBefore you begin, ensure you have the account number\
    \ of the receiving institution if you are performing a direct rollover to avoid\
    \ unintended tax events.\n\n1. Request Account Closure: Inform us that you wish\
    \ to close your Traditional IRA. We will first verify your identity using mandatory\
    \ multi-factor authentication to ensure the request is authorized.\n2. Specify\
    \ Disposition of Funds: Tell us whether you want to transfer the assets to another\
    \ provider (Direct Rollover) or receive a distribution. \n3. Acknowledge Tax Implications:\
    \ If you are under age 59½ and requesting a distribution rather than a rollover,\
    \ we will provide a warning that a 10% early withdrawal penalty typically applies.\
    \ You must confirm you understand this penalty before we proceed.\n4. Final Review:\
    \ We will provide a summary of the final balance and any applicable management\
    \ fees tied to your active assets.\n5. Confirmation: We will execute the transfer\
    \ or distribution and provide you with a confirmation receipt. \n\nYour account\
    \ is considered closed once the final balance reaches $0 and the assets have been\
    \ successfully transferred or distributed. For those wishing to consolidate multiple\
    \ old employer plans instead of closing them individually, see the Rollover IRA\
    \ — overview."
  domain: retirement
