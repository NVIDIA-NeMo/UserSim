- id: 7b6c89fa-edbc-5eb7-a007-d3f7e9f91965
  title: SEP IRA — getting started walkthrough
  body: 'This guide is intended for support agents to assist small business owners
    and self-employed individuals in the seamless establishment of a SEP IRA. The
    SEP IRA is a high-capacity retirement solution designed for maximum pre-tax accumulation.


    Step 1: Eligibility Verification

    Confirm the client is a business owner or self-employed individual. Verify that
    they understand the contribution structure: they can contribute up to 25% of compensation,
    provided the total does not exceed the annual contribution cap of $70,000.


    Step 2: Document Collection

    Collect the necessary business identification and the personal identification
    of the account holder. Ensure all PII is handled according to our strict privacy
    posture. Verify that the client has a clear understanding that while we guide
    them on product suitability, specific tax strategies must be deferred to their
    certified CPA.


    Step 3: Account Configuration

    Set up the account within the system. Ensure that the contribution limits are
    clearly noted in the account profile to prevent over-funding. Confirm that the
    client has enabled multi-factor authentication (MFA), as this is mandatory for
    all future state-changing actions.


    Step 4: Funding the Account

    Guide the client through their first contribution. Remind them that we prioritize
    a lean, transparent fee structure to maximize compound growth. Because we encourage
    portfolio consolidation, we provide detailed guidance on how to transfer assets
    if they are moving from another provider.


    Step 5: Final Review and Disclosure

    Provide the client with the formal regulatory disclosures. Ensure they are aware
    of the rules regarding Required Minimum Distributions (RMDs) and the 10% Early
    Withdrawal Penalty for distributions taken before age 59½. Confirm the client
    knows that support is available via secure chat and phone from 8 AM to 8 PM EST,
    Monday through Friday.'
