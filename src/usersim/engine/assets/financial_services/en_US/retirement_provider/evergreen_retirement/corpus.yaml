- id: 5bb8df40-71ac-5f46-abff-6632228649cf
  title: SEP IRA — resolve a common request end-to-end
  body: 'A common request for SEP IRA holders is the annual contribution adjustment
    to maximize tax benefits based on the year''s final business earnings. This guide
    walks you through the process of updating your contribution.


    Prerequisites:

    You must have your final compensation figures for the tax year and be ready to
    complete multi-factor authentication (MFA).


    Steps:

    1. Provide the total compensation earned for the year and the specific amount
    you wish to contribute to your SEP IRA.

    2. We will perform a regulatory check to ensure the contribution does not exceed
    25% of the provided compensation figure and does not exceed the absolute annual
    cap of $70,000.

    3. If the amount is within limits, we will initiate a secure session. You will
    be asked to verify your identity via MFA to authorize the state-changing action.

    4. We will process the contribution and apply it to your account.

    5. We will provide a confirmation notice showing the new total balance and the
    remaining available contribution room for the current tax year.


    How you know it worked:

    You will receive a transaction confirmation and see the updated balance reflected
    in your account history, ensuring your contribution is correctly recorded for
    tax purposes.


    ***

    REGULATORY DISCLAIMER: Evergreen Retirement provides educational resources on
    contribution limits. We do not provide individualized tax or legal advice. Please
    consult a certified CPA to determine the exact amount you should contribute based
    on your business structure.'
  domain: retirement
  product_category: sep_ira
  document_type: how_to_guide
  source_authority: official
