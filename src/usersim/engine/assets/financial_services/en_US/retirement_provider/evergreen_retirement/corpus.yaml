- id: f5a28a83-db45-53cc-aced-1caad6732c55
  title: Traditional 401(k) — choosing between tiers or options
  body: 'When deciding how to maximize your retirement savings, the primary choice
    is often between the Traditional 401(k) and the Roth IRA.


    Traditional 401(k):

    - Contributions: Pre-tax, reducing your current taxable income.

    - Limits: High capacity, with a base limit of $23,500 and a catch-up limit of
    $7,500 for those 50+.

    - Tax Treatment: Taxes are paid upon distribution in retirement.

    - Best For: High-earning professionals seeking to lower their current tax bracket
    and maximize employer-sponsored accumulation.


    Roth IRA:

    - Contributions: After-tax.

    - Tax Treatment: Qualified withdrawals are tax-free.

    - Best For: Those who expect to be in a higher tax bracket during retirement or
    prefer the certainty of tax-free growth.


    While both options are subject to a 10% early withdrawal penalty before age 59½,
    the Traditional 401(k) offers significantly higher contribution ceilings. For
    a detailed side-by-side, see Traditional 401(k) — vs. a typical competitor offering.'
  domain: retirement
  product_category: traditional_401k
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 1ec94c83-6634-547d-a2f5-0d2169d96daa
  title: Traditional 401(k) — privacy and data handling
  body: 'Evergreen Retirement is committed to the absolute privacy of your personally
    identifiable information (PII) and the rigorous protection of your retirement
    assets. This disclosure outlines our data handling practices for the Traditional
    401(k).


    Data Collection and Use: We collect PII necessary to ensure ERISA compliance and
    to facilitate the pre-tax accumulation of your assets. This includes employment
    verification and tax identification numbers required for IRS reporting of the
    $23,500 base contribution limit and any $7,500 catch-up contributions.


    Security Framework: To prevent unauthorized access to your funds, we mandate multi-factor
    authentication (MFA) for all account access. No state-changing action—including
    contribution updates or the request of a distribution—is permitted without a verified
    secure session.


    Regulatory Compliance: We adhere strictly to DOL and IRS frameworks. In accordance
    with these regulations, we provide prominent disclosures regarding the early withdrawal
    penalty of 10% for distributions taken before age 59½, unless a qualifying exception
    is met.


    Fraud Response: In the event of a reported security breach, we initiate a freeze
    on affected assets within one business hour. Formal disputes regarding account
    activity are handled through a review process with a resolution goal of 15 business
    days.


    Third-Party Sharing: We do not sell client data. PII is shared only with authorized
    regulatory bodies or certified CPAs upon your explicit request to facilitate tax
    strategy planning. For further regulatory details, see Traditional 401(k) — regulatory
    disclosures.'
  domain: retirement
  product_category: traditional_401k
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 69c97227-f542-5c4f-a726-de6b63b26295
  title: Traditional 401(k) — recognizing scams targeting this product
  body: 'As you compare the Traditional 401(k) with other retirement vehicles, it
    is important to be aware of the specific fraud patterns targeting high-accumulation
    employer-sponsored plans. Because these accounts often hold significant balances,
    they are prime targets for ''urgent'' solicitation scams.


    Common scams include unsolicited offers to ''unlock'' your funds early without
    penalties or claims that your account is frozen due to a regulatory error. Be
    wary of any third party claiming they can bypass the 10% early withdrawal penalty
    through a secret IRS loophole. We will never ask you to move your assets to an
    external account via an unverified secure session or request your multi-factor
    authentication (MFA) codes over the phone.


    We emphasize that any state-changing action, such as a distribution or a change
    in contribution limits, requires rigorous identity verification and a verified
    secure session. If you receive a communication that pressures you to act immediately
    or asks for your password, treat it as a security breach.


    If you suspect your account has been compromised, notify us immediately. We treat
    all fraud reports with immediate urgency and will initiate a freeze on affected
    assets within one business hour to protect your retirement savings. For further
    guidance on protecting your account, please refer to Traditional 401(k) — account
    security best practices.'
  domain: retirement
  product_category: traditional_401k
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 1e5fa42d-9dc2-57b0-bffd-8d5efe509617
  title: Traditional 401(k) — limits, restrictions, and edge cases
  body: "This document provides a detailed technical breakdown of the Traditional\
    \ 401(k) to assist support agents in guiding clients through contribution and\
    \ withdrawal boundaries.\n\nContribution Limits:\n- Standard Employee Limit: The\
    \ maximum annual contribution for employees is $23,500. This is a pre-tax accumulation\
    \ limit designed for maximum growth.\n- Catch-up Provision: Individuals aged 50\
    \ and older are eligible for an additional annual contribution of $7,500, allowing\
    \ them to accelerate their savings as they approach retirement.\n\nWithdrawal\
    \ Restrictions and Penalties:\n- Age Threshold: Assets are generally intended\
    \ for distribution after age 59½. \n- Early Withdrawal Penalty: If a client takes\
    \ a distribution before age 59½, the IRS typically imposes a 10% early withdrawal\
    \ penalty, unless a specific regulatory exception applies.\n\nEdge Cases and Regulatory\
    \ Compliance:\n- ERISA Compliance: We strictly adhere to DOL and IRS frameworks\
    \ to ensure the fair treatment of investors. \n- RMDs: Account holders must be\
    \ aware of Required Minimum Distributions (RMDs) once they reach the applicable\
    \ age; failure to withdraw the minimum amount required by the IRS annually can\
    \ lead to significant tax penalties.\n- Tax Advice Boundary: While we provide\
    \ educational resources on these limits and RMDs, we do not provide individualized\
    \ tax or legal advice. We guide clients toward product suitability but defer specific\
    \ tax strategies to certified CPAs.\n\nFor detailed fee information, please refer\
    \ to Traditional 401(k) — fee schedule."
  domain: retirement
  product_category: traditional_401k
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 37cbd018-7d30-5bf3-8081-5d3b03930ef7
  title: Traditional 401(k) — cost and charges
  body: 'Questions regarding the costs of maintaining a Traditional 401(k):


    **How are the fees for my Traditional 401(k) determined?**

    We maintain a lean, transparent fee structure to maximize your compound growth.
    Fees for this product are primarily tied to active asset management rather than
    flat administrative charges.


    **Are there costs for basic account maintenance?**

    While active management involves fees, we prioritize the consolidation of your
    retirement assets. If you are utilizing a Rollover IRA for consolidation, those
    maintenance fees are often waived.


    **Will I pay a fee for taking my money out early?**

    While Evergreen Retirement does not charge a proprietary penalty for withdrawals,
    the IRS imposes an early withdrawal penalty of 10% for distributions taken before
    age 59½, unless an exception applies. We recommend reviewing Traditional 401(k)
    — early withdrawal penalty explained for more details.'
  domain: retirement
  product_category: traditional_401k
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 642ce73e-5d78-571d-888c-bb9167f548fd
  title: Traditional 401(k) — check status or history
  body: "Follow these steps to review your account status, contribution history, and\
    \ current balance for your Traditional 401(k).\n\n**Prerequisites**\nYou must\
    \ have your account number available and be prepared to complete a multi-factor\
    \ authentication (MFA) challenge to establish a verified secure session.\n\n**Steps\
    \ to Review Your Account**\n1. Request a current status summary of your Traditional\
    \ 401(k). We will then initiate the identity verification process.\n2. Complete\
    \ the MFA challenge as prompted. No account modifications or sensitive data disclosures\
    \ are permitted without this verified secure session.\n3. Specify the time period\
    \ for the history you wish to review (e.g., the last 12 months or the current\
    \ tax year). \n4. We will provide a detailed breakdown of your total contributions,\
    \ including any catch-up contributions if you are age 50 or older, and the current\
    \ total balance.\n5. To verify specific transactions, ask us for a list of your\
    \ most recent credits and debits. We will confirm the date and amount of each\
    \ transaction.\n\n**Confirmation**\nYour request is successful once we provide\
    \ the verified balance and a chronological history of your contributions. If you\
    \ notice any discrepancies in these records, please refer to Traditional 401(k)\
    \ — a discrepancy in your records or statement."
  domain: retirement
  product_category: traditional_401k
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 557432fa-29e3-58f7-a46c-044bd20408a0
  title: Traditional 401(k) — a declined or blocked action
  body: "If you have attempted to make a change to your Traditional 401(k)—such as\
    \ updating a contribution amount or requesting a distribution—and the action was\
    \ declined or blocked, please follow these steps.\n\n**Common Symptoms**\n- You\
    \ receive a notification that the transaction cannot be processed.\n- The request\
    \ is blocked due to 'verification failure'.\n- A contribution change is declined\
    \ as 'exceeding limits'.\n\n**Likely Causes and Fixes**\n1. **Verification Failure:**\
    \ The most common cause is the lack of a verified secure session. \n   - *Fix:*\
    \ Ensure you have completed the mandatory multi-factor authentication (MFA). We\
    \ cannot permit any state-changing actions without this verification.\n2. **Contribution\
    \ Limit Breach:** Your requested change may exceed the annual IRS limits.\n  \
    \ - *Fix:* Verify that your total annual contributions do not exceed $23,500.\
    \ If you are age 50 or older, you may contribute up to an additional $7,500. If\
    \ the request exceeds these exact figures, it will be automatically blocked.\n\
    3. **Security Freeze:** If suspicious activity was detected, we may have placed\
    \ an immediate freeze on your assets.\n   - *Fix:* Ask us to check the security\
    \ status of your account. If a freeze is active, we will guide you through the\
    \ formal identity restoration process.\n\n**When to Escalate**\nIf you have verified\
    \ your identity and are within the contribution limits but the action remains\
    \ blocked, we will escalate your inquiry to our Senior Compliance Officers for\
    \ a final review. You will receive a resolution or a detailed explanation of the\
    \ block within 15 business days."
  domain: retirement
  product_category: traditional_401k
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 2a679669-89a6-5355-a5d6-021c37d34f8f
  title: Traditional 401(k) — when to switch or upgrade
  body: 'This guide assists support agents in identifying when a client should transition
    from a Traditional 401(k) to another product.


    **When to suggest a Rollover IRA**

    If a client has left their employer and wishes to consolidate assets from multiple
    previous plans into a single managed account, the Rollover IRA is the superior
    choice. We often waive basic account maintenance fees for the Rollover IRA to
    encourage this consolidation.


    **When to suggest a Roth IRA**

    If a client prioritizes tax-free growth and qualified withdrawals over immediate
    pre-tax accumulation, they should consider the Roth IRA. Unlike the Traditional
    401(k), which emphasizes pre-tax savings, the Roth IRA uses after-tax contributions.


    **When to stay with the Traditional 401(k)**

    Clients should maintain their Traditional 401(k) if they require the high-limit
    accumulation capacity ($23,500 standard limit) provided by employer-sponsored
    plans, which generally exceeds the limits of individual IRAs. This is ideal for
    mid-to-late career professionals seeking maximum pre-tax reduction of their current
    taxable income.'
  domain: retirement
  product_category: traditional_401k
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 0a99311c-b4df-5580-8cd0-3a282f289fec
  title: Traditional 401(k) — comparison vs. alternatives and when not to choose it
  body: 'The Traditional 401(k) is a premium, stability-focused solution designed
    for maximum pre-tax accumulation. However, it is not the right fit for every investor.
    Below is a comparison to help you determine if this product aligns with your goals.


    **Choose the Traditional 401(k) if:**

    - **High Contribution Needs:** You want to save significantly more than individual
    IRA limits allow. The standard employee contribution limit is $23,500, with an
    additional $7,500 catch-up limit for those aged 50 and older.

    - **Immediate Tax Relief:** You prefer to make contributions on a pre-tax basis
    to lower your current taxable income.

    - **Employer Sponsorship:** You have access to an employer-sponsored plan and
    wish to utilize its structured accumulation framework.


    **Consider an Alternative if:**

    - **Tax-Free Growth is the Goal:** If you prefer to pay taxes now to enjoy tax-free
    withdrawals in retirement, the Roth IRA is a better fit.

    - **Self-Employment:** If you are a small business owner or self-employed and
    lack an employer plan, the SEP IRA is specifically tailored for your needs.

    - **Asset Consolidation:** If you are moving funds from an old employer plan into
    a single managed account, our Rollover IRA offers a zero-fee consolidation vehicle.


    **Important Restrictions**

    Regardless of the product chosen, be mindful of the 10% early withdrawal penalty
    imposed by the IRS for distributions taken before age 59½. We adhere strictly
    to ERISA compliance to ensure your assets are handled with regulatory precision.
    For more on these penalties, see Traditional 401(k) — early withdrawal penalty
    explained.'
  domain: retirement
  product_category: traditional_401k
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: e163f688-fceb-5c8f-84fc-4a47c2e4caba
  title: Traditional 401(k) — eligibility and setup
  body: 'Questions regarding the setup and eligibility of your Traditional 401(k):


    **Am I eligible to contribute to a Traditional 401(k)?**

    Eligibility is primarily based on your employment status with a company that sponsors
    the plan. We work within the framework of the employer''s plan documents and ERISA
    guidelines to ensure all participants are treated fairly.


    **How do I start contributing once my account is open?**

    Once your account is active, you can set your contribution percentage or dollar
    amount. Remember that the standard annual employee limit is $23,500. If you are
    50 or older, you can increase this by an additional $7,500 via catch-up contributions.


    **Can I change my contribution levels later?**

    Yes. However, any change to your contributions is a state-changing action. You
    must establish a verified secure session using multi-factor authentication (MFA)
    before we can process these modifications. For a detailed walkthrough, see Traditional
    401(k) — make a change or update.'
  domain: retirement
  product_category: traditional_401k
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: cbe37b71-00da-5342-ad15-a1fa6c087073
  title: Traditional 401(k) — resolve a common request end-to-end
  body: "This guide explains how to request and complete a distribution from your\
    \ Traditional 401(k), including the verification of potential penalties.\n\n**Prerequisites**\n\
    - Your account number.\n- A verified secure session established via multi-factor\
    \ authentication (MFA).\n- Knowledge of your current age to determine if the 10%\
    \ early withdrawal penalty applies.\n\n**Steps to Resolve a Distribution Request**\n\
    1. State the amount you wish to withdraw from your Traditional 401(k). \n2. We\
    \ will then require you to complete a rigorous identity verification process.\
    \ This includes an MFA challenge to ensure the security of your PII.\n3. Once\
    \ the secure session is verified, we will review your account age. If you are\
    \ under age 59½, we will explicitly warn you that the IRS typically imposes a\
    \ 10% early withdrawal penalty on the distribution.\n4. Confirm that you wish\
    \ to proceed with the distribution despite the potential penalty. \n5. We will\
    \ process the request and provide you with a confirmation number and the estimated\
    \ date the funds will be available.\n\n**Confirmation**\nYour request is complete\
    \ when we provide a transaction confirmation and the final distribution amount\
    \ (net of any mandatory withholdings). If you believe a distribution was processed\
    \ in error, please refer to Traditional 401(k) — a discrepancy in your records\
    \ or statement."
  domain: retirement
  product_category: traditional_401k
  document_type: how_to_guide
  source_authority: official
