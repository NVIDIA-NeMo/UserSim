- id: b65bf56e-ded7-5c1a-865c-bbe62ce401a7
  title: SEP IRA — who it is best for and common use cases
  body: 'The SEP IRA is a high-capacity retirement solution tailored specifically
    for self-employed individuals and small business owners. It is designed for those
    who require greater flexibility and higher contribution ceilings than those offered
    by standard individual retirement accounts.


    This product is best suited for:

    - Freelancers and Independent Contractors: Individuals who are the sole employees
    of their business and wish to maximize their pre-tax savings.

    - Small Business Owners: Employers who want to provide retirement benefits for
    their employees with a simplified administrative process compared to a 401(k).

    - High-Earning Professionals: Those seeking to lower their current taxable income
    through significant annual contributions.


    Key Financial Specifications:

    - Contribution Limit: You may contribute up to 25% of compensation.

    - Annual Contribution Cap: The maximum allowable contribution is $70,000 per year.


    Common Use Cases:

    - Scaling Savings with Revenue: Because contributions are percentage-based, business
    owners can increase their savings as their business grows, up to the $70,000 cap.

    - Simplified Benefit Plans: Small businesses can contribute to their own SEP IRA
    and their employees'' accounts using a single, uniform percentage, ensuring fairness
    and regulatory precision.


    For a broader overview of this product, please see SEP IRA — overview.'
  domain: retirement
  product_category: sep_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 7e64d673-3389-5ad6-9155-93974c2fb413
  title: SEP IRA — annual contribution cap explained
  body: 'Q: What is the maximum amount I can contribute to my SEP IRA in a single
    year?

    A: The annual contribution cap is $70,000. However, your actual contribution cannot
    exceed the lesser of this $70,000 cap or 25% of your compensation.


    Q: Does the $70,000 cap apply to only the business owner or also to employees?

    A: The $70,000 annual contribution cap is the maximum aggregate limit per eligible
    employee (including the owner). Each employee''s contribution is limited to the
    lesser of 25% of their compensation or $70,000.


    Q: Can I exceed the $70,000 limit if I have multiple businesses?

    A: No. The annual contribution cap is a total limit across all SEP plans. For
    guidance on how this affects your specific tax situation, we recommend consulting
    a certified CPA. For more details on general limits, see SEP IRA — contribution
    limit pct comp explained.'
  domain: retirement
  product_category: sep_ira
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
