- id: b7c8e7ae-cd46-59b1-957b-d4165f84161b
  title: When to use update_contribution
  body: 'The update_contribution tool is used when a client wishes to modify the amount
    or frequency of their retirement savings deposits. This is a state-changing action
    and must be handled with precision to ensure compliance with IRS annual limits.


    **Procedure for Updating Contributions:**

    1. **Identity Verification**: Ensure the client has successfully passed MFA and
    is in a verified secure session.

    2. **Account Identification**: Use the get_accounts tool to identify the correct
    account_id for the contribution change.

    3. **Limit Review**: Provide educational information regarding the current IRS
    contribution limits for the specific product (e.g., Traditional 401(k) vs Roth
    IRA). For clients aged 50 and older, mention the availability of Catch-up Contributions.

    4. **Verification of Amount**: Confirm the new contribution amount and frequency
    with the client.

    5. **Tool Execution**: Call the update_contribution tool to apply the changes.

    6. **Final Confirmation**: Confirm to the client that the contribution update
    has been successfully processed.


    Agents must not provide specific tax advice on how much a client *should* contribute;
    rather, they should guide the client toward product suitability and defer tax
    strategy to a certified CPA.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contribution
  institution_id: evergreen_retirement
