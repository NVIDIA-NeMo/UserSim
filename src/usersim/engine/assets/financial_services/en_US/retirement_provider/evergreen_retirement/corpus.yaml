- id: 7d53a7c5-70f0-569a-afa8-0167ce2ddf2c
  title: Traditional IRA — check status or history
  body: 'To review your account standing, contribution history, or distribution records,
    please follow these steps:


    1. Provide your account identifier and complete the mandatory multi-factor authentication
    (MFA) process to establish a secure session.

    2. Specify the timeframe you wish to review (e.g., the current tax year or a specific
    date range for past contributions).

    3. Ask us to generate a summary of your current balance and a list of all transactions,
    including any contributions made toward your $7000 annual limit or any applicable
    $1000 catch-up contributions.

    4. Review the provided statement for accuracy. We will confirm the total amount
    contributed for the period and any distributions taken.


    Once these steps are complete, you will have a comprehensive view of your account
    history. If you identify a discrepancy in these records, you may initiate a formal
