- id: c87f01db-b471-5d7e-8fe5-988e338b1d52
  title: General frequently asked questions
  body: '### How can I contact Evergreen Retirement support?

    We provide support via secure chat and phone from 8 AM to 8 PM EST, Monday through
    Friday. For complex regulatory inquiries, our team will escalate your request
    to our Senior Compliance Officers for a final review.


    ### How does the institution handle fraud reports?

    We treat all fraud reports with immediate urgency. Upon a verified report, we
    initiate a freeze on all affected assets within one business hour to protect your
    retirement savings.


    ### What is the process for resolving account disputes?

    Disputes are handled through a formal review process. Our goal is to reach a full
    resolution within 15 business days.


    ### How are my account changes verified?

    To ensure the absolute privacy of your PII, multi-factor authentication (MFA)
    and rigorous identity verification are mandatory before any state-changing action
    is performed. Please refer to When to use get_accounts for more information on
    account verification.'
  domain: retirement
