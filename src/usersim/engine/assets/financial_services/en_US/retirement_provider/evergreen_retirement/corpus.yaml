- id: 7bfc0750-7779-5d8c-9dc6-17d9e51dcfb8
  title: Rollover IRA — make a change or update
  body: "To maintain the security of your retirement assets, all modifications to\
    \ your Rollover IRA require a verified secure session. Follow these steps to update\
    \ your account information or investment elections.\n\n**Prerequisites**\nEnsure\
    \ you have your current account number and access to your multi-factor authentication\
    \ (MFA) device.\n\n**Step 1: Identity Verification**\nProvide your full name and\
    \ account number. We will then send a verification code to your registered MFA\
    \ device. You must provide this code to us to establish a secure session. No account\
    \ modifications are permitted without this verification.\n\n**Step 2: Request\
    \ the Change**\nClearly state the update you wish to make. This may include updating\
    \ your beneficiary designations, changing your investment allocations, or updating\
    \ your contact information. \n\n**Step 3: Review and Confirmation**\nWe will summarize\
    \ the requested change and explain any potential implications. For example, if\
    \ you are changing investment elections, we will discuss product suitability.\
    \ If the update involves complex regulatory requirements, we will escalate the\
    \ request to our Senior Compliance Officers for final review.\n\n**Step 4: Final\
    \ Authorization**\nConfirm your agreement to the change. We will then process\
    \ the request. You will receive a confirmation message in the secure chat or a\
    \ confirmation email once the update is complete.\n\n**Step 5: Verification of\
    \ Update**\nVerify the change by reviewing your updated account details or your\
    \ next monthly statement. If you notice any discrepancies, you can refer to Rollover\
    \ IRA — a discrepancy in your records or statement."
