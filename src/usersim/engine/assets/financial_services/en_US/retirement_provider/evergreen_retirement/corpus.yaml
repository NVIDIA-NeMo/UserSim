- id: 9804d5cd-b2ac-5a19-8f89-b19fc408ad7a
  title: Roth IRA — how rates are tiered and applied
  body: 'For the Roth IRA, rates are not applied as a flat interest rate on the account
    balance. Instead, the growth of your account is determined by the performance
    of the underlying assets selected within your portfolio.


    Because our fee philosophy is focused on maximizing compound growth, we do not
    apply static maintenance fees. Instead, fees are tied directly to active asset
    management. This means that the cost of maintaining your account varies based
    on the complexity and frequency of the management services applied to your assets.


    These management rates are credited and debited according to the specific investment
    vehicles chosen. Any changes to the management fee structure will be communicated
    to the client in advance. For a full breakdown of how these costs affect your
    net yield, please refer to the Roth IRA — fee schedule.'
