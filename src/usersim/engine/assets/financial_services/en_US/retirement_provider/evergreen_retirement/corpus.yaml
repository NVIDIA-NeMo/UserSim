- id: db4901f2-f137-5158-a214-9e82bcb30ae3
  title: Roth IRA — risk disclosures
  body: 'Investment in a Roth IRA involves risk, including the potential loss of principal.
    We adhere strictly to DOL and IRS frameworks to ensure the fair treatment of all
    investors.


    Taxation and Penalties:

    Contributions to a Roth IRA are made with after-tax dollars; therefore, no immediate
    tax deduction is available. While qualified distributions are tax-free, non-qualified
    distributions may be subject to taxes and penalties. Specifically, taking distributions
    before age 59½ typically results in an Early Withdrawal Penalty of 10% imposed
    by the IRS, unless a specific exception applies.


    Contribution Limits:

    Compliance with IRS contribution limits is the responsibility of the account holder.
    For the current period, the annual contribution limit is $7,000. Contributions
    made in excess of this limit, or by individuals exceeding the income phaseout
    (which begins at $146,000 for single filers), may be subject to excise taxes.


    Advice Boundaries:

    Evergreen Retirement provides comprehensive educational resources regarding contribution
    limits and RMDs. However, we do not provide individualized tax or legal advice.
    Our standard of care is to guide clients toward product suitability while deferring
    specific tax strategies and the determination of exact tax liabilities to certified
    CPAs.


    Regulatory Compliance:

    All products are managed in accordance with ERISA compliance standards to ensure
    the absolute privacy of PII and the regulatory integrity of your retirement savings.'
  domain: retirement
