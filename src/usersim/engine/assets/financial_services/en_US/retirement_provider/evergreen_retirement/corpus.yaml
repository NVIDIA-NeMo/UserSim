- id: 6bfb168f-b64a-5cbc-b8cf-407bc0653038
  title: SEP IRA — account security best practices
  body: "At Evergreen Retirement, the security of your retirement assets is our highest\
    \ priority. Because the SEP IRA is designed for high-capacity savings, it can\
    \ be a target for sophisticated phishing attempts. We urge all account holders\
    \ to adhere to the following best practices to maintain the integrity of their\
    \ portfolios.\n\nFirst, multi-factor authentication (MFA) is mandatory for all\
    \ state-changing actions. We will never ask you to provide your MFA code or password\
    \ over an unsecure channel. If you receive a request for this information via\
    \ email or text, treat it as a fraudulent attempt and do not respond. Second,\
    \ be wary of unsolicited communications claiming there is a 'regulatory error'\
    \ with your contribution limits, such as the 25% compensation limit or the $70,000\
    \ annual cap, that requires an immediate transfer of funds to a 'secure' holding\
    \ account. We will never ask you to move assets to an external account to 'verify'\
    \ your identity.\n\nWe maintain a strict identity verification protocol. No modifications\
    \ to your account, including changes to distribution instructions or contribution\
    \ amounts, will be permitted without a verified secure session. \n\nIf you suspect\
    \ any unauthorized activity, notify us immediately. We treat all fraud reports\
    \ with immediate urgency and will initiate a freeze on affected assets within\
    \ one business hour of the report. Prompt reporting is critical to minimizing\
    \ potential loss and ensuring the absolute privacy of your personally identifiable\
    \ information (PII). Our team will guide you through the formal review process\
    \ to secure your assets."
  domain: retirement
  product_category: sep_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
