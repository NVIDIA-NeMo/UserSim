- id: d86d72eb-cd06-577a-9f30-cfb25ff50d93
  title: SEP IRA — risk disclosures
  body: "This disclosure outlines the risks and regulatory constraints associated\
    \ with the SEP IRA. \n\nInvestment Risk: Assets within a SEP IRA are subject to\
    \ market volatility. There is no guarantee of compound growth, and the value of\
    \ your investments may fluctuate. Past performance is not indicative of future\
    \ results.\n\nTax and Penalty Risks: The SEP IRA is a pre-tax accumulation vehicle.\
    \ Distributions are generally taxable as ordinary income. If you take a distribution\
    \ before age 59½, you may be subject to an Early Withdrawal Penalty of 10% imposed\
    \ by the IRS, unless a specific exception applies. \n\nContribution Compliance:\
    \ It is the account holder's responsibility to ensure contributions do not exceed\
    \ the lesser of 25% of compensation or the annual contribution cap of $70,000.\
    \ Excess contributions may be subject to excise taxes.\n\nRegulatory Mandates:\
    \ Upon reaching the age determined by the IRS, you must take a Required Minimum\
    \ Distribution (RMD). Failure to meet these annual requirements can result in\
    \ severe tax penalties. \n\nDisclaimer: Evergreen Retirement provides comprehensive\
    \ educational resources on contribution limits and RMDs, but we do not provide\
    \ individualized tax or legal advice. Our standard of care is to guide clients\
    \ toward product suitability while deferring specific tax strategies to certified\
    \ CPAs. We adhere strictly to DOL and IRS frameworks to ensure ERISA compliance."
