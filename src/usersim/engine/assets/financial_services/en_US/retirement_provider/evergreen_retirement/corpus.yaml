- id: 4a2d986c-9777-5f78-aa26-bd8cac62248c
  title: SEP IRA — cancel, close, or downgrade
  body: 'If you no longer require your SEP IRA—perhaps due to a change in business
    structure or a move to a different retirement vehicle—follow these steps to close
    or transition your account.


    Before starting, ensure you have decided whether you will be withdrawing the funds
    (which may trigger taxes and penalties) or rolling them over into another qualified
    account, such as a Rollover IRA.


    1. State your intent to close or downgrade the account. We will first verify your
    identity using mandatory multi-factor authentication (MFA) to ensure the request
    is authorized.

    2. Specify the destination of the assets. If you are moving funds to another provider
    or an internal Rollover IRA, provide the receiving account details. If you are
    requesting a cash distribution, confirm you are aware of the potential tax implications.

    3. Confirm the final balance. We will provide a final account statement showing
    the current balance and any pending active asset management fees that must be
    settled before closure.

    4. Review the closure summary. We will send a confirmation document detailing
    the distribution or transfer of assets.


    Once the assets are transferred or distributed, we will provide a final confirmation
    notice. Your account is considered closed when the balance reaches $0 and the
    account status is updated to ''Closed''. If you are moving assets to consolidate
    accounts, you may find Rollover IRA — overview helpful.'
  domain: retirement
  product_category: sep_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 2f2de22f-9430-50c4-b79d-ad5d77c64820
  title: SEP IRA — an unexpected charge or amount
  body: 'If you notice a charge or a balance amount in your SEP IRA that you did not
    expect, please follow these steps to identify and resolve the issue.


    Common Symptoms:

    - A deduction labeled as a management fee that seems higher than usual.

    - A contribution amount that was capped unexpectedly despite your request for
    a higher sum.

    - An unexpected tax withholding on a distribution.


    What to check in order:

    1. Review the fee structure: Check if the charge relates to active asset management.
    Our fees are tied to these services; basic maintenance for consolidation vehicles
    is often waived, but active management of a SEP IRA carries specific costs.

    2. Verify contribution limits: If your contribution was lower than expected, check
    if it hit the 25% of compensation limit or the annual contribution cap of $70,000.
    We automatically cap contributions to ensure ERISA and IRS compliance.

    3. Check distribution rules: If a distribution is lower than requested, it may
    be due to a mandatory tax withholding or an Early Withdrawal Penalty (typically
    10%) if you are under age 59½.


    Resolution:

    If the charge remains unexplained, tell us the specific transaction date and amount.
    We will initiate a formal review process to investigate the discrepancy. Our goal
    is to resolve all disputes within 15 business days. If a clerical error is found,
    we will apply the necessary correction to your balance and provide a written confirmation
    of the adjustment.'
  domain: retirement
  product_category: sep_ira
