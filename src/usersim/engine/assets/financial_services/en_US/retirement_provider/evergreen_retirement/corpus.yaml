- id: 1605a2ce-a9ac-5e1c-8981-8fb988c2fd0a
  title: Roth IRA — getting started walkthrough
  body: 'This guide is intended for support agents to assist prospective and new clients
    in the seamless activation of a Roth IRA. The Roth IRA is positioned as a solution
    for those seeking after-tax contributions for tax-free growth and qualified withdrawals.


    Step 1: Eligibility Verification

    Confirm the client''s filing status and income. Note that for single filers, the
    income phaseout begins at $146,000. If the client''s income exceeds the IRS limits,
    they may not be eligible for direct contributions.


    Step 2: Account Setup

    Guide the client through the identity verification process. Ensure that Multi-factor
    authentication (MFA) is established immediately, as no account modifications are
    permitted without a verified secure session.


    Step 3: Funding and Contributions

    Inform the client of the current annual contribution limit of $7,000. Discuss
    their funding strategy, whether via a lump sum or recurring contributions, ensuring
    they stay within the legal cap to avoid IRS over-contribution penalties.


    Step 4: Asset Allocation

    Assist the client in selecting investments that align with their retirement horizon.
    Remind the client that while we guide them toward product suitability, we defer
    specific tax strategies to certified CPAs.


    Step 5: Confirmation

    Provide the client with their account number and a copy of the regulatory disclosures.
    Ensure they understand the importance of the 59½ age threshold to avoid the Early
    Withdrawal Penalty.


    For a high-level overview of the product''s benefits, refer to Roth IRA — overview.'
  domain: retirement
  product_category: roth_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
