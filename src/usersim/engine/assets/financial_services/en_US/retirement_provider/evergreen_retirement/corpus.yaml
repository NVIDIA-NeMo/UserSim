- id: 03ae20d5-5f7f-5b92-8838-6d900852cee5
  title: SEP IRA — set up and activate
  body: 'Setting up your SEP IRA is a straightforward process designed to get your
    business retirement savings active quickly. Before beginning, please ensure you
    have your business tax identification number (EIN) or social security number and
    your current business registration details available.


    1. **Provide Business and Personal Identification**: Tell us the legal name of
    your business, your tax ID, and provide the necessary personal identification
    for the account holder. We will verify your identity through a secure session
    using mandatory multi-factor authentication (MFA).

    2. **Define Contribution Intent**: Inform us of your intended initial contribution
    amount. We will confirm that this amount adheres to the 25% compensation limit
    and does not exceed the $70,000 annual contribution cap.

    3. **Establish Investment Preferences**: Tell us how you would like your assets
    managed. We will guide you through product suitability to ensure your elections
    align with our stability-focused approach.

    4. **Confirm Account Terms**: We will provide the final account disclosures and
    fee schedule. Once you confirm your agreement to these terms, we will activate
    the account.

    5. **Execute Initial Funding**: Provide the funding source details. We will confirm
    once the assets have been successfully deposited and the account is fully active.


    You will know the process is complete when you receive a secure confirmation notice
    and can see your active balance in your account summary.'
