- id: 3045574b-d10f-566e-a4f2-51c746ebbef4
  title: When to use open_account
  body: 'At Evergreen Retirement, we aim to provide a seamless transition for professionals
    moving into a new phase of accumulation or distribution. The open_account tool
    is used when a client wishes to establish a new retirement vehicle to better suit
    their current financial goals.


    **Policy Guidelines:**

    We prioritize product suitability. Before opening an account, agents must ensure
    the client understands the nature of the product—for example, the tax-free growth
    of a Roth IRA versus the pre-tax accumulation of a Traditional 401(k). We guide
    clients toward the product that best fits their needs but defer specific tax strategies
    to certified CPAs.


    **Procedure:**

    1. **Verify Identity:** Ensure the client has completed mandatory multi-factor
    authentication (MFA) and rigorous identity verification. No account may be opened
    without a verified secure session.

    2. **Determine Product Suitability:** Discuss the client''s needs to identify
    the correct product (e.g., Traditional IRA, Roth IRA, SEP IRA, or Rollover IRA).

    3. **Collect Required Details:** Gather any necessary personal information required
    for the specific account type while maintaining absolute privacy of PII.

    4. **Execute Opening:** Call the open_account tool to formally create the account
    in our system.

    5. **Confirmation:** Confirm the successful creation of the account and provide
    the client with the next steps for funding.


    For detailed specifications on the tool''s functionality, refer to the get_accounts
    tool reference.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: evergreen_retirement
- id: 38f61828-a2ef-5965-bf80-c48b02f18612
  title: open_account tool reference
  body: 'The open_account tool is the authoritative mechanism for creating a new retirement
    account for a client within the Evergreen Retirement ecosystem.


    **Tool Signature:**

    `open_account(product_id: string)`


    **Arguments:**

    * `product_id`: The unique identifier for the product to be opened (e.g., ''traditional_ira'',
    ''roth_ira'', ''sep_ira'', or ''rollover_ira'').


    **Effect:**

    Initiates the creation of a new account associated with the verified client''s
    profile. Upon success, the account becomes active and available for contributions
    or rollovers.


    Agents perform this action by calling the tool directly. This is a state-changing
    action and requires a mandatory verified secure session via multi-factor authentication
    (MFA) before the tool can be executed.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
