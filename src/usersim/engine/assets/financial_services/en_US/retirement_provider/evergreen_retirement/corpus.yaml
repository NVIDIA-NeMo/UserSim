- id: 2f34cda5-bf02-5b8a-903b-b3226e974071
  title: SEP IRA — privacy and data handling
  body: 'Evergreen Retirement is committed to the absolute privacy of your personally
    identifiable information (PII) and the secure management of your SEP IRA. We adhere
    strictly to DOL and IRS frameworks, emphasizing ERISA compliance across all our
    retirement products.


    Data Collection and Use: We collect only the information necessary to maintain
    your account, verify your identity, and ensure your contributions remain within
    the legal limits—specifically the 25% compensation threshold and the $70,000 annual
    contribution cap. This data is used solely for account administration and regulatory
    reporting.


    Security Protocols: To protect your assets, multi-factor authentication (MFA)
    and rigorous identity verification are mandatory before any state-changing action.
    No account modifications, such as changes to distributions or contribution limits,
    are permitted without a verified secure session. We employ industry-standard encryption
    to protect your data from unauthorized access.


    Regulatory Compliance: We provide comprehensive educational resources on Required
    Minimum Distributions (RMDs) and the 10% Early Withdrawal Penalty for distributions
    taken before age 59½. However, please be advised that Evergreen Retirement does
    not provide individualized tax or legal advice. Our standard of care is to guide
    clients toward product suitability while deferring specific tax strategies to
    certified CPAs.


    Fraud Response: In the event of a reported security breach, we initiate a freeze
    on affected assets within one business hour. All disputes and fraud claims are
    handled through a formal review process with a goal of resolution within 15 business
    days.


    By maintaining an account with us, you acknowledge that these privacy and security
    measures are in place to ensure the stability and integrity of your retirement
    savings.'
