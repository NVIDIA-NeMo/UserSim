- id: 70a4c6cb-1b95-52de-b68c-ef829c1c2f95
  title: SEP IRA — how rates are tiered and applied
  body: "Fees for the SEP IRA are not based on a tiered interest rate, but rather\
    \ on an active asset management model. \n\nBecause the SEP IRA is an investment-based\
    \ retirement vehicle, there is no single flat interest rate applied to the balance.\
    \ Instead, the growth of the account is determined by the performance of the assets\
    \ selected within the portfolio. \n\nFees are applied as follows:\n- Active Asset\
    \ Management Fees: These are the primary charges for the account and are calculated\
    \ as a percentage of assets under management. These fees are deducted periodically\
    \ from the account balance.\n- Basic Account Maintenance: To encourage portfolio\
    \ consolidation, basic maintenance fees for this account type are often waived.\n\
    \nAny changes to the asset management fee percentage will be communicated to the\
    \ account holder with a 30-day notice. For a full list of current management costs,\
    \ please refer to SEP IRA — fee schedule."
