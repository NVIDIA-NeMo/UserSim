- id: 03503892-8369-5df1-874c-27586a1c807a
  title: When to use close_account
  body: 'Closing a retirement account is a significant action that can have substantial
    tax implications. We treat these requests with professional care to ensure the
    client is aware of potential penalties before an account is permanently shuttered.


    **Policy Guidelines:**

    Because closing an account often involves a distribution of assets, agents must
    emphasize the risk of an Early Withdrawal Penalty (typically 10%) imposed by the
    IRS for distributions taken before age 59½, unless a qualified exception applies.
    We provide educational resources on these penalties but do not provide individualized
    tax advice.


    **Procedure:**

    1. **Verify Identity:** Confirm the client''s identity via mandatory multi-factor
    authentication (MFA). A verified secure session is required for all irreversible
    actions.

    2. **Account Identification:** Use the get_accounts tool to identify the specific
    account the client wishes to close.

    3. **Disclosure of Impact:** Inform the client of the potential tax consequences
    and the irreversibility of the action. Ensure they are aware of the Early Withdrawal
    Penalty if applicable.

    4. **Confirmation of Intent:** Obtain a clear, recorded confirmation from the
    client that they wish to proceed with the closure.

    5. **Execute Closure:** Call the close_account tool to permanently close the specified
    account.


    For more information on how to identify accounts, see the get_accounts tool reference.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: evergreen_retirement
- id: 62e2b419-0562-55d4-83df-39139f84e70b
  title: close_account tool reference
  body: 'The close_account tool is used to permanently terminate a retirement account.
    This is an irreversible action.


    **Tool Signature:**

    `close_account(account_id: string)`


    **Arguments:**

    * `account_id`: The unique identifier of the account to be closed.


    **Effect:**

    Closes the specified account and prevents further contributions or modifications.
    This action triggers the final distribution or transfer of remaining assets as
    per the account''s closing instructions.


    Agents perform this action by calling the tool directly. Due to the irreversible
    nature of this operation, it requires a mandatory verified secure session and
    multi-factor authentication (MFA) before the agent can execute the call.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: evergreen_retirement
- id: 9d91c300-0c69-56d2-aaad-b094c28f178b
  title: When to use update_contact_info
  body: 'Maintaining accurate client information is critical for the delivery of regulatory
    disclosures and the security of our clients'' assets. The update_contact_info
    tool is used to modify a client''s personal details, such as address, phone number,
    or email.


    **Policy Guidelines:**

    Evergreen Retirement prioritizes the absolute privacy of PII. We only update information
    that has been provided through a secure, verified channel. Because contact information
    is often used as a secondary factor in identity verification, we maintain rigorous
    standards for these updates to prevent account takeover and fraud.


    **Procedure:**

    1. **Verify Identity:** The agent must first ensure the client has passed multi-factor
    authentication (MFA). No changes to PII are permitted without a verified secure
    session.

    2. **Request New Information:** Clearly identify which piece of contact information
    needs to be updated (e.g., primary residence, mobile phone, or email address).

    3. **Validate Data:** Ensure the provided information is in the correct format
    and complete.

    4. **Execute Update:** Call the update_contact_info tool with the updated details
    to synchronize the client''s profile across all retirement accounts.

    5. **Confirmation:** Notify the client that the changes have been saved and will
    be reflected on their next statement.


    For a list of all current account details, agents should first use the get_accounts
    tool.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: evergreen_retirement
- id: fcf739c1-a060-5e84-b26e-d9ca11901f7f
  title: update_contact_info tool reference
  body: 'The update_contact_info tool allows agents to modify the personally identifiable
    information (PII) associated with a client''s profile.


    **Tool Signature:**

    `update_contact_info(contact_details: object)`


    **Arguments:**

    * `contact_details`: An object containing the fields to be updated (e.g., address,
    phone_number, email).


    **Effect:**

    Updates the client''s master contact record. These changes propagate to all accounts
    linked to the client''s identity to ensure consistent communication and regulatory
    compliance.


    Agents perform this action by calling the tool directly. A verified secure session
    utilizing multi-factor authentication (MFA) is mandatory before any PII modifications
    can be processed.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: evergreen_retirement
- id: c9f094c1-f57a-56cf-ab03-024559a6c980
  title: When to use get_statements
  body: 'Providing clients with timely and accurate access to their account history
    is a cornerstone of our commitment to transparency. The get_statements tool is
    used to retrieve official account statements for a client''s review.


    **Policy Guidelines:**

    Statements contain sensitive financial data and PII. Consequently, they must only
    be accessed and shared within a secure session. Agents should use this tool to
    help clients resolve discrepancies, verify contribution history, or provide documentation
    for external tax preparation by a certified CPA.


    **Procedure:**

    1. **Verify Identity:** Ensure the client has completed multi-factor authentication
    (MFA). Access to statements is prohibited without a verified secure session.

    2. **Identify Account:** Use the get_accounts tool to find the specific account_id
    for which the statement is required.

    3. **Determine Timeframe:** Confirm the specific period (monthly, quarterly, or
    annual) the client wishes to review.

    4. **Retrieve Statement:** Call the get_statements tool to fetch the relevant
    document.

    5. **Delivery:** Provide the statement to the client through the approved secure
    delivery channel.


    If a client reports a discrepancy in a statement, agents should follow the procedures
    for handling disputes, which we aim to resolve within 15 business days.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: evergreen_retirement
- id: 8d5ac0c6-21dd-5b04-a5ce-f26e6fdde729
  title: get_statements tool reference
  body: 'The get_statements tool allows agents to retrieve official account statements
    for a client''s specified retirement accounts.


    **Tool Signature:**

    `get_statements(account_id: string, timeframe: string)`


    **Arguments:**

    * `account_id`: The unique identifier of the account for which the statement is
    requested.

    * `timeframe`: The specific period for the statement (e.g., ''last_month'', ''Q3_2023'',
    ''2023_annual'').


    **Effect:**

    Returns the requested account statement, including balances, contributions, and
    asset management fees for the specified period.


    Agents perform this action by calling the tool directly. Because statements contain
    sensitive PII, a verified secure session and multi-factor authentication (MFA)
    are required before the tool can be executed.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: evergreen_retirement
- id: 59bd425f-891e-50f6-8a53-d8592bee8ab9
  title: When to use update_beneficiary
  body: 'Designating beneficiaries is a critical part of a client''s distribution
    strategy, ensuring that assets are passed to their intended heirs according to
    their wishes and ERISA frameworks.


    **Policy Guidelines:**

    Beneficiary designations are legal instructions. We ensure that all updates are
    performed with the highest level of security to prevent unauthorized changes to
    the distribution of assets. Agents should remind clients that for complex estate
    planning or legal advice regarding beneficiaries, they should consult a certified
    legal professional.


    **Procedure:**

    1. **Verify Identity:** The agent must confirm the client''s identity through
    mandatory multi-factor authentication (MFA). No beneficiary changes are permitted
    without a verified secure session.

    2. **Account Identification:** Use the get_accounts tool to determine which retirement
    account(s) require a beneficiary update.

    3. **Collect Beneficiary Data:** Gather the full name, relationship, and percentage
    of the asset allocation for each primary and contingent beneficiary.

    4. **Execute Update:** Call the update_beneficiary tool to apply the changes to
    the specified account.

    5. **Confirmation:** Provide the client with a confirmation that the beneficiary
    designation has been updated and is now on file.


    For information on how to retrieve the necessary account identifiers, refer to
    the get_accounts tool reference.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: evergreen_retirement
- id: 0fa1a749-ac8e-50aa-80cd-78dec209809d
  title: update_beneficiary tool reference
  body: 'The update_beneficiary tool allows an agent to modify the designated beneficiaries
    for a client''s retirement account. This action ensures that assets are distributed
    according to the client''s current wishes upon their passing, adhering to ERISA
    compliance and the absolute privacy of PII.


    To perform this action, the agent must call the tool directly within a verified
    secure session. The tool requires the account identifier and the updated beneficiary
    details. The agent is responsible for confirming the accuracy of the information
    provided by the client before executing the call.


    **Tool Signature:**

    `update_beneficiary(account_id: string, beneficiary_details: object)`


    **Effect:**

    Updates the legal beneficiary records associated with the specified retirement
    account in the core ledger.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: evergreen_retirement
- id: e0d885eb-562b-5ca5-bf1b-973bea94cc85
  title: When to use set_alerts
  body: 'We provide alert customization to help our clients monitor their portfolios
    and stay informed about significant account activity. The set_alerts tool should
    be used whenever a client wishes to establish, modify, or remove notifications
    for events such as contribution receipts, distribution alerts, or security-related
    triggers.


    To ensure the security of our clients'' assets, all alert modifications require
    mandatory multi-factor authentication (MFA) and rigorous identity verification.
    No changes may be processed without a verified secure session.


    **Procedure for Setting Alerts:**

    1. Verify the client''s identity using the institution''s mandatory verification
    protocols.

    2. Use the get_accounts tool to resolve the specific account_id using the client''s
    provided account details or last-four digits.

    3. Consult with the client to determine the specific types of alerts they wish
    to receive (e.g., balance thresholds, transaction confirmations).

    4. Call the set_alerts tool with the verified account_id and the desired alert
    configurations.

    5. Confirm to the client that the alerts have been successfully updated.


    Our goal is to provide a seamless experience that emphasizes transparency and
    regulatory precision. If a client reports that they are receiving unauthorized
    alerts, treat this as a potential fraud report and initiate the immediate urgency
    protocol, freezing affected assets within one business hour.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: evergreen_retirement
- id: e4f57fb0-e5d5-586a-afe5-975162d7c263
  title: set_alerts tool reference
  body: 'The set_alerts tool is used by agents to manage the notification preferences
    for a client''s retirement account. This includes enabling or disabling alerts
    for deposits, withdrawals, and security events.


    Agents execute this action by calling the tool directly during a verified session.
    It is not a self-service redirection; the agent must perform the state-changing
    action on behalf of the client after identity is confirmed.


    **Tool Signature:**

    `set_alerts(account_id: string, alert_preferences: object)`


    **Effect:**

    Updates the notification triggers and delivery methods for the specified account,
    ensuring the client is promptly notified of relevant account activity.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: evergreen_retirement
- id: ce51415d-c979-583b-859d-26228424eb55
  title: When to use request_withdrawal
  body: 'The request_withdrawal tool is used to initiate the distribution of funds
    from a retirement account. Because withdrawals are often irreversible and carry
    significant tax implications, agents must adhere to strict compliance standards
    and provide clear regulatory warnings.


    **Tax and Regulatory Warnings:**

    Agents must inform clients that we provide educational resources on Required Minimum
    Distributions (RMDs) but do not provide individualized tax or legal advice. Clients
    should be advised to consult a certified CPA for specific tax strategies. Furthermore,
    agents must prominently disclose the risk of the Early Withdrawal Penalty—a tax
    penalty typically of 10% imposed by the IRS for distributions taken before age
    59½, unless a specific exception applies.


    **Procedure for Requesting Withdrawals:**

    1. Complete mandatory identity verification and ensure the session is secure via
    MFA.

    2. Use the get_accounts tool to identify the correct account_id for the withdrawal.

    3. Verify if the withdrawal is a qualifying RMD or a standard distribution.

    4. Provide the standard regulatory disclaimers regarding the Early Withdrawal
    Penalty and the necessity of professional tax advice.

    5. Call the request_withdrawal tool with the account_id and the requested amount.

    6. Advise the client on the expected processing timeline for the funds.


    If a withdrawal request is suspected to be the result of fraudulent activity,
    the agent must immediately initiate a freeze on affected assets within one business
    hour.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_withdrawal
  institution_id: evergreen_retirement
- id: 322acc29-4b5d-5676-b85a-b76b95c2622f
  title: request_withdrawal tool reference
  body: 'The request_withdrawal tool initiates the process of removing funds from
    a retirement account. Due to the irreversible nature of this action and its regulatory
    sensitivity, it is only accessible during a verified secure session.


    Agents must perform this action by calling the tool directly. The agent is responsible
    for ensuring all regulatory warnings regarding the Early Withdrawal Penalty and
    RMDs have been delivered to the client prior to execution.


    **Tool Signature:**

    `request_withdrawal(account_id: string, amount: number, distribution_type: string)`


    **Effect:**

    Triggers the distribution process for the specified amount from the account, subjecting
    the request to final compliance review and IRS reporting requirements.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_withdrawal
  institution_id: evergreen_retirement
- id: 1f230a0c-1de5-53d7-ba6b-6b2092d3dc00
  title: When to use update_investment_election
  body: 'Investment elections determine how a client''s contributions and existing
    balances are allocated across various assets. The update_investment_election tool
    is used when a client wishes to rebalance their portfolio or change their future
    contribution allocations to better align with their stability-focused goals.


    We guide clients toward product suitability based on their career stage, but we
    do not provide individualized investment advice. Our role is to facilitate the
    technical execution of the client''s chosen strategy.


    **Procedure for Updating Investment Elections:**

    1. Perform mandatory identity verification and establish a secure session via
    MFA.

    2. Use the get_accounts tool to retrieve the relevant account_id.

    3. Review the client''s current allocation and the proposed changes to ensure
    they are clearly understood.

    4. Call the update_investment_election tool with the account_id and the new allocation
    percentages.

    5. Provide the client with a confirmation of the updated election.


    All investment changes are handled with regulatory precision to ensure adherence
    to DOL and IRS frameworks. If a client expresses confusion regarding the tax implications
    of shifting assets between different product types, the agent must defer those
    specific tax strategies to a certified CPA.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_investment_election
  institution_id: evergreen_retirement
- id: fb9e7e58-7b0b-5427-a76a-95d66e7cbd13
  title: update_investment_election tool reference
  body: 'The update_investment_election tool is used to change the allocation of assets
    within a retirement account. This can apply to both the current balance (rebalancing)
    and future contributions.


    Agents execute this change by calling the tool directly. This is a state-changing
    action that requires a verified secure session and mandatory MFA to protect the
    client''s portfolio from unauthorized modifications.


    **Tool Signature:**

    `update_investment_election(account_id: string, new_allocations: object)`


    **Effect:**

    Modifies the investment distribution settings for the specified account, triggering
    a reallocation of assets based on the provided percentages.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_investment_election
  institution_id: evergreen_retirement
- id: 6015d203-3d70-5554-a7ec-4ed0cfbcefa0
  title: When to use plan_loan
  body: 'Certain employer-sponsored plans, such as the Traditional 401(k), may allow
    clients to take a loan against their account balance. The plan_loan tool is used
    to initiate the application and structuring of these loans.


    Loans from retirement accounts are subject to strict ERISA compliance and IRS
    guidelines. Agents must ensure that the loan terms are clearly communicated and
    that the client understands the potential impact on their compound growth.


    **Procedure for Planning a Loan:**

    1. Verify the client''s identity through mandatory MFA and identity verification
    protocols.

    2. Use the get_accounts tool to identify the eligible account_id (typically a
    Traditional 401(k)).

    3. Verify that the account meets the specific eligibility requirements for a plan
    loan.

    4. Discuss the loan amount, repayment terms, and interest rates with the client.

    5. Call the plan_loan tool to formally initiate the loan request.

    6. Provide the client with the necessary loan documentation for final signature.


    Agents must remind clients that while we provide educational resources, we do
    not provide individualized tax advice regarding the repayment of loans or the
    consequences of a loan default. For such matters, clients should be referred to
    a certified CPA.'
  domain: retirement
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - plan_loan
  institution_id: evergreen_retirement
- id: a479f735-32f0-5ad6-8612-2db631033fc4
  title: plan_loan tool reference
  body: 'The plan_loan tool is used to initiate a loan request against a qualified
    retirement account. This tool handles the preliminary structuring of the loan
    before final approval and funding.


    This tool must be called directly by the agent during a verified secure session.
    No loan applications can be processed without rigorous identity verification and
    MFA.


    **Tool Signature:**

    `plan_loan(account_id: string, loan_amount: number, term_months: integer)`


    **Effect:**

    Creates a loan application linked to the account, calculating repayment schedules
    and checking the request against the plan''s maximum loan limits.'
  domain: retirement
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - plan_loan
  institution_id: evergreen_retirement
