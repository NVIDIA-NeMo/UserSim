- id: ec4fcd4a-6073-5191-b986-49b67984041f
  title: Traditional IRA — getting started walkthrough
  body: 'This guide is intended for support agents assisting clients in the onboarding
    process for the Traditional IRA, a flexible, individual pre-tax account for those
    without employer-sponsored plans or those seeking additional savings.


    Step 1: Eligibility and Identification

    Verify the client''s identity using our mandatory verification protocols. Ensure
    the client understands that the Traditional IRA is designed for pre-tax accumulation,
    which may provide immediate tax advantages depending on their income level.


    Step 2: Contribution Setup

    Guide the client in setting their contribution levels. Ensure they are aware of
    the annual contribution limit of $7,000. For clients aged 50 and older, explain
    the availability of the catch-up limit 50plus of $1,000.


    Step 3: Funding the Account

    Assist the client in linking their funding source. If the client is transferring
    assets from another provider, clarify that we prioritize a seamless transition
    from accumulation to distribution.


    Step 4: Investment Suitability

    While we do not provide individualized tax or legal advice, guide the client toward
    product suitability based on their retirement timeline. Defer specific tax strategies,
    such as the deductibility of contributions, to their certified CPA.


    Step 5: Final Review and Disclosure

    Confirm that the client has received and understands all regulatory disclosures.
    Specifically, ensure they are aware that distributions taken before age 59½ are
    typically subject to an early withdrawal penalty of 10%.


    Key Product Specifications for Agents:

    - Annual Contribution Limit: $7,000

    - Catch-up Limit (50+): $1,000

    - Early Withdrawal Penalty: 10%

    - Focus: Pre-tax growth and stability for mid-to-late career professionals.'
