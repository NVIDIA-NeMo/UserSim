- id: cbb4e4cc-9e52-542b-a364-bb7de9674e1c
  title: Traditional 401(k) — overview
  body: 'The Traditional 401(k) at Evergreen Retirement is a high-limit, employer-sponsored
    savings plan designed for maximum pre-tax accumulation. We provide this solution
    for mid-to-late career professionals who wish to reduce their current taxable
    income while building a substantial nest egg for the future. By contributing pre-tax
    dollars, we help you maximize the power of compound growth over time.


    Our Traditional 401(k) is governed by strict adherence to DOL and IRS frameworks,
    ensuring ERISA compliance and the highest standards of regulatory precision. We
    prioritize a seamless transition from your accumulation phase to your eventual
    distribution phase, providing the stability and transparency required for long-term
    financial security.


    Key account parameters include:

    - Annual Employee Contribution Limit: $23,500

    - Catch-up Contribution Limit (for those aged 50 and older): $7,500

    - Early Withdrawal Penalty: 10% (imposed by the IRS for distributions taken before
    age 59½, unless a specific exception applies)


    We maintain a lean fee structure to ensure more of your money stays invested.
    While active asset management fees apply, we focus on transparency so you can
    track every cent of your growth. Please be aware that we provide comprehensive
    educational resources regarding these limits and distributions, but we do not
    provide individualized tax or legal advice. We recommend consulting a certified
    CPA for specific tax strategies.


    ***

    REGULATORY DISCLAIMER: All retirement accounts are subject to IRS regulations.
    Early withdrawals may be subject to a 10% federal tax penalty in addition to ordinary
    income tax.'
  domain: retirement
  product_category: traditional_401k
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: aab3ee17-e2e1-5233-97d5-640b0546fe0a
  title: Traditional 401(k) — employee contribution limit explained
  body: 'Q: How much can I contribute to my Traditional 401(k) this year?


    A: The standard employee contribution limit is $23,500. This is the maximum pre-tax
    amount you can contribute from your salary to the account for the current tax
    year.


    Q: I am over the age of 50; can I contribute more than the standard limit?


    A: Yes. Individuals aged 50 and older are eligible for a Catch-up Contribution
    of $7,500, which is in addition to the standard $23,500 limit.


    Q: What happens if I exceed these limits?


    A: Contributions exceeding IRS limits may be subject to tax penalties. We provide
    tools to help you track your totals, but we recommend coordinating with your payroll
    department and a certified CPA to ensure compliance. For more details on how we
    handle these thresholds, please refer to Traditional 401(k) — overview.'
  domain: retirement
  product_category: traditional_401k
  document_type: faq
  source_authority: official
