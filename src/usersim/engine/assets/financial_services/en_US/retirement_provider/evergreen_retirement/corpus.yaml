- id: d4b7bada-52f7-59ef-8d1f-cf530000264e
  title: SEP IRA — how-to / step-by-step
  body: 'Q: How do I make a contribution to my SEP IRA?

    A: Provide us with the total amount you wish to contribute. We will verify that
    the amount does not exceed 25% of your compensation or the $70,000 annual cap.
    Once verified, we will process the fund transfer into your account.


    Q: How do I update the beneficiaries on my account?

    A: Tell us the names and details of the new beneficiaries. We will require a secure
    session with multi-factor authentication (MFA) to authorize this change. Once
    the identity check is complete, we will update your records and send a confirmation.


    Q: How do I request a distribution?

    A: State the amount you wish to withdraw. We will verify your identity and check
    for any applicable Early Withdrawal Penalty of 10% or RMD requirements before
    finalizing the transaction.'
