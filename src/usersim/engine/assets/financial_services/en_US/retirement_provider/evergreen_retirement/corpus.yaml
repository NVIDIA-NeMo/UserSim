- id: d5b9afd4-b4d4-5e57-913c-7fdf6b86cf19
  title: SEP IRA — regulatory disclosures
  body: 'Evergreen Retirement operates in strict adherence to the Department of Labor
    (DOL) and Internal Revenue Service (IRS) frameworks, with a primary focus on ERISA
    compliance for all retirement products. This disclosure outlines the regulatory
    obligations associated with the SEP IRA.


    **Taxation and Distributions**

    Contributions to the SEP IRA are made on a pre-tax basis. Consequently, distributions
    are taxable as ordinary income in the year they are received. Please be aware
    of the following IRS mandates:

    - **Early Withdrawal Penalty**: A tax penalty of 10% is typically imposed by the
    IRS for taking distributions before the account holder reaches age 59½, unless
    a statutory exception applies.

    - **Required Minimum Distributions (RMD)**: Account holders must begin taking
    an RMD—the minimum amount the IRS requires to be withdrawn annually—after reaching
    the age specified by current tax law.


    **Compliance and Privacy**

    We prioritize the absolute privacy of Personally Identifiable Information (PII).
    No state-changing action, including contribution changes or distribution requests,
    is permitted without a verified secure session and mandatory multi-factor authentication
    (MFA).


    **Dispute Resolution**

    In the event of a fraud report, we initiate a freeze on affected assets within
    one business hour. General account disputes are handled through our formal review
    process, with a resolution goal of 15 business days.


    ***Disclaimer**: Evergreen Retirement provides comprehensive educational resources
    on contribution limits and RMDs, but we do not provide individualized tax or legal
    advice. Our standard of care is to guide clients toward product suitability while
    deferring specific tax strategies to certified CPAs.*'
  domain: retirement
  product_category: sep_ira
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 0a4385fb-9b5f-5338-8a12-6596290216f3
  title: SEP IRA — interest rate / APY schedule
  body: "The SEP IRA is an investment-based retirement vehicle rather than a fixed-rate\
