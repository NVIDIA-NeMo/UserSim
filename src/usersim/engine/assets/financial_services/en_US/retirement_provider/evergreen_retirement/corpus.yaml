- id: 86b5ab5d-053b-520b-bd2d-240368cf9e16
  title: Roth IRA — account security best practices
  body: 'At Evergreen Retirement, the protection of your retirement assets is our
    highest priority. Because a Roth IRA provides tax-free growth, it is often a target
    for sophisticated social engineering attempts. We urge all clients to adhere to
    the following security protocols to ensure their portfolio remains secure.


    First, Multi-factor authentication (MFA) is mandatory for all accounts. You will
    be required to complete a rigorous identity verification process before any state-changing
    action is performed, including updating your contribution levels or requesting
    a distribution. We will never ask you to provide your MFA code or password over
    an unsolicited phone call or email.


    Be vigilant regarding ''urgent'' requests for account changes. Fraudsters often
    impersonate regulatory bodies or internal staff to induce panic. Remember that
    we prioritize regulatory precision and stability; any legitimate change to your
    account will follow our established verification workflows.


    If you suspect unauthorized access or notice a discrepancy in your balance, notify
    us immediately. We treat all fraud reports with immediate urgency, initiating
    a freeze on affected assets within one business hour of the report. This rapid
    response is designed to mitigate loss and protect your principal.


    For further details on how we protect your assets from unauthorized activity,
    please refer to Roth IRA — fraud and unauthorized-activity protection.'
  domain: retirement
  product_category: roth_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 9ce9ea55-40c7-5759-9986-052c9fc9010d
  title: Roth IRA — change-of-terms policy
  body: 'This document outlines the policy regarding modifications to the terms and
    conditions governing your Roth IRA account with Evergreen Retirement. We reserve
    the right to amend our fee schedules, service models, and administrative procedures
    to maintain our commitment to lean, transparent management and regulatory compliance.


    Changes to the account agreement may be triggered by updates to IRS frameworks,
    Department of Labor (DOL) regulations, or internal adjustments to our asset management
    structure. For example, changes to the annual contribution limit of $7,000 or
    the income phaseout for single filers starting at $146,000 will be implemented
    immediately upon the effective date set by the IRS.


    We commit to providing a minimum notice period of 30 calendar days for any material
    changes to our fee structure or service terms. Notice will be delivered via your
    secure communication channel. If you disagree with a change in terms, you maintain
    the right to close your account or transfer your assets to another provider, subject
    to the standard distribution rules and any applicable IRS penalties for early
    withdrawals before age 59½.


    Our obligation is to guide you toward product suitability and ensure ERISA compliance.
    By maintaining your account with us, you agree to abide by these evolving terms,
    which are designed to maximize your compound growth while adhering to the absolute
    privacy of your personally identifiable information (PII). For the full account
    agreement, please see Roth IRA — account agreement.'
  domain: retirement
