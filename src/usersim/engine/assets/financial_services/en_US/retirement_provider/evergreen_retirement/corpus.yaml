- id: c68143bf-96b7-5325-be91-3eeef2421038
  title: Traditional IRA — early withdrawal penalty explained
  body: 'Q: What happens if I withdraw money from my Traditional IRA before I retire?

    A: If you take a distribution from your Traditional IRA before you reach age 59½,
    the IRS typically imposes an early withdrawal penalty of 10% on the taxable portion
    of the amount withdrawn. This is in addition to any applicable federal and state
    income taxes.


    Q: Are there any exceptions to this 10% penalty?

    A: Yes, the IRS allows certain exceptions for early withdrawals, such as first-time
    home purchases (up to a certain limit), qualified higher education expenses, or
    specific medical hardships. We provide educational resources on these limits,
    but we defer specific tax strategy advice to certified CPAs.


    Q: How does this compare to other accounts?

    For a comparison of how penalties and limits differ across our products, please
    refer to Traditional IRA — vs. a similar product here.'
