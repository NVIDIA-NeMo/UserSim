- id: 5a465344-19d9-5819-b0b4-ab58cb11e4f6
  title: Roth IRA — recognizing scams targeting this product
  body: "At Evergreen Retirement, we prioritize the security of your assets. Because\
    \ the Roth IRA is an after-tax vehicle designed for tax-free growth, it is often\
    \ targeted by scammers who promise 'guaranteed' high-yield returns or 'secret'\
    \ strategies to bypass IRS contribution limits. \n\nCommon fraud patterns include:\
    \ \n1. The 'Urgent Distribution' Scam: An individual posing as a regulatory official\
    \ may claim your account is under review and request an immediate transfer of\
    \ funds to a 'safe' account to avoid penalties. \n2. The 'Limit Expansion' Offer:\
    \ Scammers may claim they can help you exceed the annual contribution limit of\
    \ $7000 through unofficial channels.\n\nWe will never ask you for your password,\
    \ multi-factor authentication (MFA) codes, or request that you move funds to an\
    \ external account via an unsolicited phone call or email. We will never pressure\
    \ you to make a distribution to 'protect' your assets from a government freeze.\n\
    \nIf you notice any unauthorized activity or receive a suspicious request, notify\
    \ us immediately. We treat all fraud reports with immediate urgency and will initiate\
    \ a freeze on affected assets within one business hour of the report. To protect\
    \ your privacy and assets, no account modifications are permitted without a verified\
    \ secure session.\n\n***\nREGULATORY DISCLAIMER: Evergreen Retirement provides\
    \ educational resources on contribution limits and RMDs but does not provide individualized\
    \ tax or legal advice. Please consult a certified CPA for specific tax strategies."
  domain: retirement
  product_category: roth_ira
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 35d9b1e2-3266-508d-b211-8649cabb31f1
  title: Roth IRA — limits, restrictions, and edge cases
  body: "This document provides internal guidance for support agents regarding the\
    \ regulatory boundaries of the Roth IRA. \n\nContribution Limits:\nEvery account\
    \ holder is subject to an annual contribution limit of $7000. Agents must ensure\
    \ customers are aware that exceeding this limit may result in IRS penalties. \n\
    \nIncome Restrictions:\nEligibility to contribute directly to a Roth IRA is subject\
    \ to income thresholds. For single filers, the income phaseout single start begins\
    \ at $146000. Once a client's modified adjusted gross income (MAGI) reaches this\
    \ threshold, their ability to contribute the full $7000 is reduced. \n\nDistribution\
    \ Rules:\nWhile contributions can be withdrawn tax-free at any time, earnings\
    \ are subject to different rules. Distributions taken before age 59½ are typically\
    \ subject to an Early Withdrawal Penalty of 10% unless a qualifying exception\
    \ applies. \n\nAgent Posture:\nWe guide clients toward product suitability based\
    \ on these limits but must defer specific tax strategies or calculations regarding\
    \ phaseouts to the client's certified CPA. All disclosures regarding penalties\
    \ must be presented prominently during the distribution request process.\n\n***\n\
    REGULATORY DISCLAIMER: Evergreen Retirement adheres strictly to DOL and IRS frameworks,\
    \ emphasizing ERISA compliance. We do not provide individualized tax or legal\
    \ advice."
  domain: retirement
  product_category: roth_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 24b98c00-99ff-55a8-a789-b87a006f0e5c
  title: Roth IRA — eligibility and setup
  body: '**Who is eligible to open a Roth IRA?**

    Any individual with earned income can open a Roth IRA, provided their income falls
    within IRS limits. For single filers, the income phaseout single start is $146000;
    above this level, your contribution limit may be reduced or eliminated.


    **How much can I contribute per year?**

    The annual contribution limit for a Roth IRA is $7000. This applies to the total
    amount contributed across all your IRA accounts for the tax year.


    **How do I get started with my account?**

    Setup is seamless. You will provide your identity verification and link a funding
    source. Once our mandatory multi-factor authentication (MFA) is established, you
    can begin contributing toward your $7000 limit. For a detailed walkthrough, see
    Roth IRA — getting started walkthrough.'
  domain: retirement
  product_category: roth_ira
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 01100f02-b05f-51f1-a69c-96e82a4c800e
  title: Roth IRA — check status or history
  body: "Monitoring your Roth IRA allows you to track your progress toward tax-free\
    \ growth and ensure you are staying within your annual contribution limits. Follow\
    \ these steps to review your account status and transaction history.\n\n**Prerequisites**\n\
    Before starting, ensure you have your account number and are prepared to complete\
    \ our mandatory identity verification process.\n\n**Steps to Review History**\n\
    1. Tell us that you would like to view your account status or transaction history.\
    \ \n2. Complete the required multi-factor authentication (MFA) challenge to establish\
    \ a verified secure session. No account information is released without this verification.\n\
    3. Specify the time frame you wish to review (e.g., 'last 12 months' or 'current\
    \ tax year').\n4. We will provide a detailed summary of your current balance,\
    \ your total contributions for the year toward the $7000 limit, and a list of\
    \ all earnings credited to the account.\n5. If you require a formal document,\
    \ ask us to generate a statement for the specific period. We will confirm once\
    \ the statement has been generated and is available for your review.\n\n**Confirmation**\n\
    You have successfully completed this process when you receive the balance summary\
    \ or the confirmation that your official statement is ready. If you notice any\
    \ errors in the history provided, please refer to Roth IRA — a discrepancy in\
    \ your records or statement."
  domain: retirement
  product_category: roth_ira
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 14da5aef-d2ac-56b3-871e-27a258f61f80
  title: Roth IRA — a declined or blocked action
  body: "If you attempt to make a contribution or a distribution from your Roth IRA\
    \ and the action is declined or blocked, it is typically due to one of the following\
    \ regulatory or security reasons.\n\n**Common Symptoms**\n- A contribution is\
    \ rejected with a message regarding 'limit exceedance'.\n- A distribution request\
    \ is blocked or flagged for review.\n- An account modification is denied despite\
    \ providing basic credentials.\n\n**Likely Causes**\n1. **Contribution Limit Breach**:\
    \ You have already reached the annual contribution limit of $7000. \n2. **Income\
    \ Eligibility**: Your reported income has crossed the income phaseout single start\
    \ of $146000, triggering a restriction on direct contributions.\n3. **Security\
    \ Block**: A state-changing action was attempted without a verified secure session\
    \ or failed multi-factor authentication (MFA).\n4. **Asset Freeze**: The account\
    \ has been frozen due to a reported fraud event.\n\n**Resolution Steps**\n1. **Check\
    \ Your Limits**: Review your year-to-date contributions. If you have hit $7000,\
    \ the action will be blocked to prevent IRS penalties.\n2. **Verify Identity**:\
    \ Ensure you have completed the MFA process. We cannot perform modifications without\
    \ a verified session.\n3. **Review Income Status**: Confirm if your income has\
    \ entered the phaseout range starting at $146000.\n\n**Escalation**\nIf you believe\
    \ the block is an error, tell us to initiate a formal review. We will escalate\
    \ the matter to our Senior Compliance Officers. Our goal is a resolution within\
    \ 15 business days, at which point we will notify you of the outcome and any necessary\
    \ corrective actions."
  domain: retirement
  product_category: roth_ira
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: e9ba253c-4bd4-5850-b812-c014c53ce8b9
  title: Roth IRA — when to switch or upgrade
  body: "Deciding whether to maintain a Roth IRA or transition to another vehicle\
    \ depends on your current tax bracket and long-term goals. \n\n**Roth IRA vs.\
    \ Traditional IRA**\nThe Roth IRA uses after-tax contributions for tax-free withdrawals\
    \ in retirement, whereas the Traditional IRA typically offers pre-tax contributions.\
    \ Both share the same annual contribution limit of $7000. A switch to a Traditional\
    \ IRA is often better for those currently in a high tax bracket who seek an immediate\
    \ tax deduction.\n\n**Roth IRA vs. Rollover IRA**\nIf you have assets in a previous\
    \ employer's plan, a Rollover IRA serves as a zero-fee consolidation vehicle.\
    \ While the Roth IRA is for new after-tax savings, the Rollover IRA is designed\
    \ for transferring existing assets into a single managed account.\n\n**Recommendation**\n\
    - **Stay with Roth IRA**: If you expect to be in a higher tax bracket during retirement\
    \ or value tax-free growth.\n- **Switch/Add Traditional**: If you need to lower\
    \ your current taxable income.\n- **Open Rollover IRA**: If you are transitioning\
    \ from a previous employer's plan. See Rollover IRA — overview for more details."
  domain: retirement
  product_category: roth_ira
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: bf3e8b2f-60ae-5063-b7c7-a0527689a692
  title: Roth IRA — comparison vs. alternatives and when not to choose it
  body: "The Roth IRA is a premium tool for those seeking tax-free retirement income.\
    \ However, it is not the ideal solution for every professional. \n\n**When to\
    \ Choose the Roth IRA**\nThis product is ideal for mid-to-late career professionals\
    \ who believe their tax rate will be higher in retirement than it is now. By contributing\
    \ up to the annual contribution limit of $7000 using after-tax dollars, you ensure\
    \ that qualified withdrawals in retirement are entirely tax-free.\n\n**When NOT\
    \ to Choose the Roth IRA**\n1. **High Current Tax Bracket**: If you are currently\
    \ in your peak earning years and require an immediate tax break to lower your\
    \ annual liability, a Traditional IRA or a Traditional 401(k) is more suitable.\n\
    2. **Income Exceeds Thresholds**: If your income is significantly above the income\
    \ phaseout single start of $146000, you may be ineligible for direct contributions.\
    \ In such cases, we can discuss alternative strategies with your CPA.\n3. **Immediate\
    \ Need for Liquidity**: While contributions can be accessed, withdrawing earnings\
    \ before age 59½ typically triggers an Early Withdrawal Penalty of 10%.\n\n**Comparison\
    \ Summary**\n- **vs. Traditional IRA**: Roth offers tax-free withdrawals; Traditional\
    \ offers upfront tax deductions. Both have a $7000 limit.\n- **vs. SEP IRA**:\
    \ The SEP IRA is tailored for self-employed individuals with much higher contribution\
    \ capacities than the $7000 Roth limit.\n- **vs. Traditional 401(k)**: The 401(k)\
    \ is employer-sponsored and typically allows for much higher pre-tax accumulation.\n\
    \n***\nREGULATORY DISCLAIMER: Evergreen Retirement provides educational resources\
    \ but does not provide individualized tax or legal advice. Please consult a certified\
    \ CPA for specific tax strategies."
  domain: retirement
  product_category: roth_ira
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: evergreen_retirement
- id: 0e7887e4-aff6-5ec2-8558-e0cf0c29828e
  title: Roth IRA — how-to / step-by-step
  body: '**How do I make a contribution to my Roth IRA?**

    Simply tell us the amount you wish to contribute. We will verify your identity
    via MFA and ensure the amount does not exceed your remaining annual contribution
    limit of $7000. Once confirmed, the funds will be moved from your linked account.


    **How do I request a distribution?**

    Tell us the amount you wish to withdraw. We will verify your identity and check
    if the withdrawal is ''qualified''. If you are under age 59½, we will provide
    a prominent warning regarding the 10% Early Withdrawal Penalty before you finalize
    the request.


    **Can I change my beneficiary?**

    Yes. Tell us you wish to update your beneficiary, provide the new beneficiary''s
    details, and we will confirm once the update is processed in our system.'
  domain: retirement
  product_category: roth_ira
  document_type: faq
