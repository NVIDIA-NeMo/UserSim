- id: 3e32d1b2-a09d-5347-a052-b471b8a3f1e0
  title: Sparkassen-Baufinanzierung — Abweichung von Ihren Unterlagen
  body: 'In seltenen Fällen stellen Kunden fest, dass die in ihren Unterlagen aufgeführten
    Konditionen nicht mit den erwarteten Werten übereinstimmen. Dieses Dokument hilft
    Mitarbeitern, solche Abweichungen zu klären.


    **Symptom:** Der Kunde gibt an, dass der im Vertrag hinterlegte Zinssatz nicht
    mit dem vereinbarten Satz übereinstimmt (z. B. wird 3,91 % statt der erwarteten
    3,68 % aufgeführt).


    **Ursachenanalyse:**

    1. **Prüfung der Zinsbindungsdauer:** Überprüfen Sie, welche Laufzeit tatsächlich
    gewählt wurde. Ein Zinssatz von 3,91 % ist korrekt, wenn eine Zinsbindung von
    15 Jahren vereinbart wurde, während 3,68 % für 10 Jahre gelten.

    2. **Bonitätsabstufung:** Prüfen Sie, ob sich die Kreditwürdigkeit des Kunden
    zum Zeitpunkt der finalen Prüfung geändert hat, was zu einem Zinsaufschlag geführt
    haben könnte.

    3. **Dokumentationsfehler:** Überprüfen Sie, ob es sich um einen Übertragungsfehler
    in die Systemmaske handelt, während der unterzeichnete Vertrag die korrekte Rate
    ausweist.


    **Lösungsweg:**

    - Wenn die Abweichung auf einem Missverständnis der Laufzeiten beruht, erläutern
    Sie dem Kunden den Zusammenhang zwischen Bindungsdauer und Zinssatz.

    - Bei einem tatsächlichen Fehler in den Unterlagen wird der Vorgang umgehend korrigiert.
    Wir senden dem Kunden ein korrigiertes Dokument zu oder führen eine Nachtragsvereinbarung
    durch.


    **Eskalation:**

    Sollte keine Einigung über die Richtigkeit des Zinssatzes erzielt werden, wird
    die Angelegenheit an die Filialleitung und bei Bedarf an die regionale Geschäftsführung
    zur finalen Prüfung der Kreditakte übergeben.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: fb0a253a-b10a-5133-aacd-8c5fef786bfc
  title: Sparkassen-Privatkredit — Überblick
  body: 'Der Sparkassen-Privatkredit der Sparkasse Lindenhain ist die flexible Finanzierungslösung
    für Ihre individuellen Anschaffungen und Wünsche. Ob es sich um eine neue Inneneinrichtung,
    eine Reparatur Ihres Fahrzeugs oder eine andere persönliche Investition handelt
    – wir bieten Ihnen einen transparenten Rahmen, um Ihre Ziele zeitnah zu realisieren.


    Unser Produkt zeichnet sich durch eine klare Kostenstruktur und eine verlässliche
    Planungssicherheit aus. Der maximale Kreditbetrag liegt bei 50.000 €, sodass wir
    Ihnen einen weiten Spielraum für Ihre Vorhaben bieten können. Um Ihnen eine erste
    Orientierung zu ermöglichen, führen wir ein repräsentatives Beispiel auf: Bei
    einem Kreditbetrag von 10.000 € und einer Laufzeit von 60 Monaten ergibt sich
    eine monatliche Rate von 194,75 €. Der effektive Jahreszins beträgt in diesem
    Beispiel 6,49 %, was zu Gesamtkosten von 1.685 € über die gesamte Laufzeit führt.


    Als öffentlich-rechtliches Institut legen wir besonderen Wert auf Vertrauen und
    soziale Verantwortung. Wir prüfen Ihre Kreditwürdigkeit sorgfältig, um eine für
    Sie nachhaltige Finanzierung sicherzustellen. Die Auszahlung erfolgt nach erfolgreicher
    Prüfung und Vertragsabschluss direkt auf Ihr Konto, sodass Sie unmittelbar über
    die gewünschten Mittel verfügen können.


    Für die Abwicklung und Verwaltung Ihrer Zahlungen empfehlen wir die Kombination
    mit unserem Girokonto Komfort mit Sparkassen-Card — Überblick, um eine reibungslose
    Abbuchung der monatlichen Raten zu gewährleisten.


    Die Sparkasse Lindenhain steht Ihnen mit ihrer regionalen Präsenz in all unseren
    Filialen beratend zur Seite. Bitte beachten Sie, dass eine verbindliche Kreditzusage
    erst nach einer finalen und detaillierten Prüfung Ihrer Unterlagen durch unsere
    Fachabteilung erfolgt.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: d4213930-a8a3-5cbd-9fca-b0bd2c742e70
  title: 'Sparkassen-Privatkredit — effektiver Jahreszins im repräsentativen Beispiel:
    Erklärung'
  body: "Was bedeutet der effektive Jahreszins von 6,49 % in meinem Beispiel?\nDer\
    \ effektive Jahreszins ist die maßgebliche Kennzahl, um die Gesamtkosten eines\
    \ Kredits zu beurteilen. Im Gegensatz zum Sollzins enthält der effektive Jahreszins\
    \ von 6,49 % nicht nur die reinen Zinskosten, sondern berücksichtigt alle obligatorischen\
    \ Kosten, die mit der Kreditgewährung verbunden sind. Dies ermöglicht Ihnen einen\
    \ transparenten Vergleich zwischen verschiedenen Finanzierungsangeboten.\n\nWie\
    \ berechnen sich die Gesamtkosten von 1.685 €?\nAm Beispiel eines Kredits über\
    \ 10.000 € mit einer Laufzeit von 60 Monaten und einem effektiven Jahreszins von\
    \ 6,49 % ergeben sich monatliche Zahlungen von 194,75 €. Die Summe aller Zinsen\
    \ und Gebühren, die über die 60 Monate zusätzlich zum ursprünglichen Kreditbetrag\
    \ anfallen, beläuft sich auf genau 1.685 €. \n\nWo finde ich weitere Details zu\
    \ den Kosten?\nAlle Einzelheiten entnehmen Sie bitte dem Dokument Sparkassen-Privatkredit\
    \ — Preis- und Leistungsverzeichnis."
  domain: lending_mortgage
  product_category: privatkredit
  document_type: faq
  source_authority: official
