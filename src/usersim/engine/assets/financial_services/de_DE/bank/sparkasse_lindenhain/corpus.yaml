- id: ea4f057f-e5d8-531a-a51a-34ff96c2dd5d
  title: Sparkassen-Privatkredit — Schritt für Schritt starten
  body: 'Dieses Dokument dient als interne Anleitung für Support-Mitarbeiter, um Kunden
    bei der Beantragung eines Sparkassen-Privatkredits professionell zu begleiten.
    Ziel ist eine transparente und rechtssichere Abwicklung.


    **Schritt 1: Bedarfsanalyse und Beratung**

    Erfassen Sie den Finanzierungswunsch des Kunden. Klären Sie den Verwendungszweck
    und den gewünschten Betrag. Weisen Sie darauf hin, dass die maximale Kreditsumme
    bei 50.000 € liegt. Erläutern Sie, dass wir eine professionelle Produktberatung
    bieten, jedoch keine individuelle Steuer- oder Rechtsberatung erbringen.


    **Schritt 2: Vermittlung des repräsentativen Beispiels**

    Um dem Kunden eine erste preisliche Orientierung zu geben, führen Sie das repräsentative
    Beispiel an:

    - Kreditsumme: 10.000 €

    - Laufzeit: 60 Monate

    - Monatliche Rate: 194,75 €

    - Effektiver Jahreszins: 6,49 %

    - Gesamtkosten des Kredits: 1.685 €


    **Schritt 3: Kreditwürdigkeitsprüfung**

    Informieren Sie den Kunden, dass jede Kreditzusage eine finale Prüfung der Bonität
    voraussetzt. Fordern Sie die notwendigen Einkommensnachweise an. Die Prüfung erfolgt
    strikt nach den Richtlinien der Sparkasse Lindenhain und unter Berücksichtigung
    der gesetzlichen Vorgaben.


    **Schritt 4: Vertragserstellung und Abschluss**

    Nach positiver Prüfung wird der Vertrag erstellt. Stellen Sie sicher, dass alle
    rechtlichen Disclaimer sachlich und transparent platziert sind. Der Kunde muss
    die Bedingungen unterschreiben. Die Auszahlung erfolgt auf das referenzierte Girokonto
    nach erfolgter Identitätsprüfung.


    **Schritt 5: Dokumentation und Archivierung**

    Alle Unterlagen sind gemäß den Datenschutzrichtlinien und den Vorgaben der BaFin
    sowie der Deutschen Bundesbank sicher zu archivieren.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: product_sheet
  source_authority: official
