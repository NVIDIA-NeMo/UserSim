  institution_id: sparkasse_lindenhain
- id: 2b7fbdfe-ea42-5d1a-b3c4-37888765e20e
  title: 'Sparkassen-Kreditkarte Gold — Fremdwährungsentgelt: Erklärung'
  body: 'Frage: Was genau ist das Fremdwährungsentgelt und wie wird es bei meiner
    Sparkassen-Kreditkarte Gold berechnet?


    Antwort: Das Fremdwährungsentgelt ist eine Gebühr, die anfällt, wenn Sie Zahlungen
    in einer anderen Währung als Euro tätigen oder Bargeld in einer Fremdwährung abheben.
    Bei der Sparkassen-Kreditkarte Gold beträgt dieses Entgelt 1,75 % des jeweiligen
    Umsatzbetrages.


    Beispiel: Wenn Sie in den USA einen Betrag von 100 $ bezahlen, wird dieser Betrag
    zunächst in Euro umgerechnet. Auf diesen Euro-Betrag schlägt die Sparkasse Lindenhain
    zusätzlich 1,75 % als Bearbeitungsgebühr für die Währungsumrechnung auf.


    Diese Gebühr dient der Deckung der Kosten, die bei der Abwicklung internationaler
    Transaktionen und dem Wechsel von Währungen entstehen. Sie wird automatisch mit
    jeder entsprechenden Transaktion auf Ihrer monatlichen Abrechnung ausgewiesen.
    Weitere Details zu den Kosten finden Sie in der Sparkassen-Kreditkarte Gold —
    Preis- und Leistungsverzeichnis.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f470599b-5d50-5d63-8f99-781ab6c3420a
  title: Sparkassen-Kreditkarte Gold — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihre Sparkassen-Kreditkarte Gold kündigen möchten oder in einen
    anderen Tarif wechseln wollen, führen wir Sie gerne durch diesen Prozess. Bitte
    stellen Sie sicher, dass vor einer Kündigung alle offenen Beträge auf dem Kreditkartenkonto
    ausgeglichen sind.


    Schritte zur Kündigung oder zum Tarifwechsel:


    1. Mitteilung Ihres Wunsches: Teilen Sie uns mit, ob Sie die Karte vollständig
    kündigen möchten oder einen Wechsel in ein anderes Kartenprodukt (z. B. eine Standardkarte)
    anstreben.

    2. Identitätsprüfung: Wir führen eine strikte Identitätsprüfung durch, um sicherzustellen,
    dass der Antrag von Ihnen persönlich gestellt wurde. Dies erfolgt entweder durch
    die Vorlage Ihres Personalausweises in einer Filiale oder über die starke Kundenauthentifizierung
    im Online-Banking.

    3. Prüfung des Saldos: Wir prüfen Ihren aktuellen Kontostand. Falls noch Beträge
    aus Ihrem Verfügungsrahmen von 5.000 € ausstehend sind, fordern wir Sie auf, diese
    durch eine Überweisung auszugleichen.

    4. Bestätigung der Kündigung: Wir bestätigen Ihnen die Kündigung oder den Tarifwechsel
    schriftlich. Dabei informieren wir Sie auch darüber, dass das Jahresentgelt von
    84 € anteilig verrechnet wird oder entfällt, sofern dies vertraglich so geregelt
    ist.

    5. Deaktivierung der Karte: Nach Ablauf der Kündigungsfrist wird die Karte technisch
    gesperrt. Wir bitten Sie, die physische Karte zu zerstören (insbesondere den Chip
    und den Magnetstreifen).


    Nach erfolgreichem Abschluss erhalten Sie eine finale Abrechnung über alle noch
    offenen Posten, einschließlich etwaiger Fremdwährungsentgelte von 1,75 %, die
    zum Zeitpunkt der Kündigung noch nicht verbucht wurden. Sollten Sie unsicher sein,
    welches Produkt nun besser zu Ihren Bedürfnissen passt, bieten wir Ihnen gerne
    eine professionelle Produktberatung an.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bf96c310-7239-5dc0-8b5c-c73b6a590050
  title: Sparkassen-Kreditkarte Gold — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn ein Kunde einen unerwarteten Betrag auf seiner Abrechnung der Sparkassen-Kreditkarte
    Gold bemerkt, gehen Sie als Support-Mitarbeiter bitte nach folgender Prüfsequenz
    vor:


    Symptom: Der Kunde gibt an, dass ein Betrag belastet wurde, den er nicht zuordnen
    kann oder der ihm zu hoch erscheint.


    Prüfschritte:

    1. Überprüfung auf das Jahresentgelt: Prüfen Sie, ob der Betrag von 84 € belastet
    wurde. Dies ist das reguläre Jahresentgelt für die Gold-Karte und fällt einmal
    jährlich an.

    2. Analyse von Fremdwährungstransaktionen: Prüfen Sie, ob der Kunde Zahlungen
    im Ausland oder in einer anderen Währung als Euro getätigt hat. Erklären Sie dem
    Kunden in diesem Fall das Fremdwährungsentgelt von 1,75 %, das auf den entsprechenden
    Umsatz aufgeschlagen wird.

    3. Abgleich des Verfügungsrahmens: Kontrollieren Sie, ob der Betrag innerhalb
    des monatlichen Verfügungsrahmens von 5.000 € liegt. Falls der Rahmen überschritten
    wurde, prüfen Sie, ob dies zu zusätzlichen Gebühren geführt hat.

    4. Prüfung auf nicht autorisierte Vorgänge: Falls der Kunde die Transaktion weiterhin
    bestreitet, prüfen Sie den Zeitstempel und den Ort der Zahlung.


    Lösung und Eskalation:

    - Wenn es sich um das Jahresentgelt oder das Fremdwährungsentgelt handelt, erläutern
    Sie dies dem Kunden sachlich und transparent.

    - Falls der Verdacht auf Betrug besteht, leiten Sie die sofortige Sperrung der
    Karte ein (Notruf 116 116) und eröffnen Sie ein Reklamationsverfahren gemäß den
    gesetzlichen Fristen des BGB.

    - Sollte die Angelegenheit nicht im ersten Gespräch gelöst werden können, erfolgt
    die Eskalation stufenweise vom Filialmitarbeiter über die Filialleitung bis zur
    regionalen Geschäftsführung.


    Der Kunde wird über den Fortschritt der Prüfung und die mögliche Begrenzung der
    Haftung auf maximal 50 € informiert, sofern die Voraussetzungen vorliegen.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: b87d6299-dfd1-576b-98e7-76797273020f
  title: Sparkassen-Kreditkarte Gold — erforderliche Unterlagen
  body: 'Um eine Sparkassen-Kreditkarte Gold mit einem Verfügungsrahmen von 5.000
    € zu beantragen, sind folgende Unterlagen und Voraussetzungen erforderlich:


    | Dokument/Voraussetzung | Zweck | Erforderlichkeit |

    | :--- | :--- | :--- |

    | Gültiger Personalausweis oder Reisepass | Identitätsprüfung gemäß Sicherheitsrichtlinien
    | Zwingend erforderlich |

    | Aktueller Einkommensnachweis (letzte 3 Lohnabrechnungen) | Prüfung der Kreditwürdigkeit
    für den Rahmen von 5.000 € | Zwingend erforderlich |

    | Bestehendes Girokonto bei der Sparkasse Lindenhain | Verknüpfung für den Ausgleich
    des Saldos | Empfohlen / Zwingend für interne Abrechnung |

    | Meldebescheinigung (falls nicht im Ausweis aktuell) | Nachweis des regionalen
    Bezugs / Wohnsitz | Bei Bedarf |


    Nach Einreichung dieser Unterlagen führen wir eine sorgfältige Kreditwürdigkeitsprüfung
    durch. Bitte beachten Sie, dass wir niemals eine Kreditzusage ohne finale Prüfung
    garantieren können. Die Entscheidung über die Erteilung der Karte erfolgt auf
    Basis Ihrer Bonität und der internen Richtlinien der Sparkasse Lindenhain.'
