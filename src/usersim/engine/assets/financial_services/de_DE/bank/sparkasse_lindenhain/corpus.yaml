- id: 7963e0ea-829e-5e94-ba6e-1e3e33dce9da
  title: Sparkassen-Kreditkarte Gold — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Mitarbeitende, um Kunden bei der
    Beantragung und Aktivierung der Sparkassen-Kreditkarte Gold zu unterstützen. Die
    Karte ist die exklusive Lösung für weltweite Zahlungen mit Premium-Service.


    **Produktdetails und Konditionen:**

    - Jahresentgelt: 84 €

    - Fremdwährungsentgelt: 1,75 %

    - Monatlicher Verfügungsrahmen: 5.000 €


    **Ablauf der Beantragung:**

    1. **Bedarfsanalyse:** Prüfen Sie, ob der Kunde weltweite Zahlungsfähigkeit und
    einen gehobenen Verfügungsrahmen benötigt.

    2. **Kreditwürdigkeitsprüfung:** Führen Sie eine sorgfältige Prüfung der Bonität
    durch. Bitte weisen Sie den Kunden darauf hin, dass eine Kreditzusage niemals
    ohne finale Prüfung garantiert werden kann.

    3. **Antragstellung:** Erfassen Sie den Antrag unter Angabe des gewünschten Verfügungsrahmens
    (Standard: 5.000 €). Stellen Sie sicher, dass ein Referenzkonto (idealerweise
    unser Girokonto Komfort mit Sparkassen-Card — Überblick) für den Einzug des Jahresentgelts
    und der monatlichen Umsätze hinterlegt ist.

    4. **Identitätsprüfung:** Führen Sie eine strikte Identitätsprüfung gemäß den
    gesetzlichen Anforderungen durch.


    **Aktivierung und Übergabe:**

    - Die Karte wird postalisch versandt. Der Kunde muss die Karte nach Erhalt aktivieren.

    - Erläutern Sie dem Kunden die starke Kundenauthentifizierung, die insbesondere
    bei Online-Zahlungen zwingend erforderlich ist.

    - Weisen Sie den Kunden auf die Sicherheitshinweise hin, insbesondere auf die
    Sperrung über den Notruf 116 116 bei Verlust.


    Sollte der Kunde Fragen zu den Kosten haben, verweisen Sie ihn bitte auf die Sparkassen-Kreditkarte
    Gold — Preis- und Leistungsverzeichnis.'
