- id: 6769c2ee-f23e-5341-9195-562e22251106
  title: Sparkassen-Kreditkarte Gold — Voraussetzungen
  body: 'Um eine Sparkassen-Kreditkarte Gold zu erhalten, müssen bestimmte Kriterien
    erfüllt sein. Die folgende Matrix gibt Aufschluss über die Voraussetzungen und
    die daraus resultierenden Möglichkeiten.


    | Bedingung | Ergebnis / Auswirkung |

    | :--- | :--- |

    | Erfolgreiche Kreditwürdigkeitsprüfung | Zusage für die Sparkassen-Kreditkarte
    Gold mit Verfügungsrahmen von 5.000 € |

    | Nachweis eines stabilen Einkommens | Grundvoraussetzung für die Genehmigung
    des Kreditrahmens |

    | Bestehendes Girokonto bei der Sparkasse Lindenhain | Vereinfachter Abschluss
    und automatische Verrechnung des Jahresentgelts von 84 € |

    | Volljährigkeit und Wohnsitz in der Region | Berechtigung zur Beantragung des
    Produkts |

    | Negative Bonitätsprüfung (SCHUFA o.Ä.) | Ablehnung des Antrags oder Angebot
    einer Karte mit geringerem Limit |


    Bitte beachten Sie, dass die finale Entscheidung über die Kreditgewährung immer
    einer detaillierten Prüfung unterliegt und eine Vorab-Zusage nicht garantiert
    werden kann.'
