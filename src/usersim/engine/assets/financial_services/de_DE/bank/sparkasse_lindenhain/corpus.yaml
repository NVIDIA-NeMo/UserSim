  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 7b3ec8f0-afb5-518d-8913-d54b4a44725d
  title: Sparkassenbuch — Schritt für Schritt starten
  body: "Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei\
    \ der Eröffnung eines Sparkassenbuchs zu unterstützen. Das Sparkassenbuch ist\
    \ die klassische, sichere Sparform für langfristigen Vermögensaufbau.\n\nProduktmerkmale\
    \ für die Beratung:\n- Zinssatz: 0,5 %\n- Kündigungsfrist: 3 Monate\n- Kündigungsfreier\
    \ monatlicher Betrag: 2.000 €\n\nSchritte zur Kontoeröffnung:\n1. Identitätsprüfung:\
    \ Führen Sie eine strikte Identitätsprüfung des Kunden durch (Vorlage eines gültigen\
    \ Personalausweises oder Reisepasses). Dies ist eine zwingende Voraussetzung für\
    \ jede zustandsändernde Aktion.\n2. Bedarfsanalyse: Klären Sie den Kunden über\
    \ den Zweck des Sparkassenbuchs auf (langfristiges Sparen) und weisen Sie explizit\
    \ auf die Kündigungsfrist von 3 Monaten für Beträge über 2.000 € hin.\n3. Vertragserstellung:\
    \ Erfassen Sie die Daten des Kunden im System. Stellen Sie sicher, dass alle Felder\
    \ gemäß den Datenschutzrichtlinien korrekt ausgefüllt sind.\n4. Einzahlung: Der\
    \ Kunde kann eine erste Einzahlung leisten, um den Vermögensaufbau zu starten.\n\
    5. Bestätigung: Händigen Sie dem Kunden die Vertragsunterlagen aus und erklären\
    \ Sie die Funktionsweise der Zinsgutschrift (0,5 %). \n\nHinweis für den Mitarbeiter:\
    \ Falls der Kunde eine sofortige Verfügbarkeit seines gesamten Guthabens wünscht,\
    \ weisen Sie ihn auf das Girokonto Komfort mit Sparkassen-Card — Überblick hin,\
    \ wobei dort jedoch keine Zinsen auf das Guthaben anfallen."
