- id: 327dbcee-1134-56f7-9a6c-ac7daaa6753b
  title: Sparkassen-Kreditkarte Gold — Risikohinweise
  body: 'Die Nutzung einer Kreditkarte mit einem hohen Verfügungsrahmen bringt finanzielle
    Verpflichtungen und Risiken mit sich, über die wir Sie transparent aufklären möchten.


    Ein wesentliches Risiko besteht in der Nutzung des monatlichen Verfügungsrahmens
    von 5.000 €. Da es sich hierbei um einen Kredit handelt, führt eine nicht fristgerechte
    Rückzahlung der genutzten Summe zur Entstehung von Zinsen. Eine dauerhafte Inanspruchnahme
    des Rahmens kann zu einer Schuldenspirale führen. Wir empfehlen daher, die Karte
    primär als kurzfristiges Zahlungsmittel und nicht als langfristige Finanzierungsquelle
    zu nutzen.


    Zusätzlich sind die Kosten der Karte zu berücksichtigen: Das Jahresentgelt von
    84 € fällt unabhängig von der Nutzung der Karte an. Bei Transaktionen in Fremdwährungen
    erhöht das Fremdwährungsentgelt von 1,75 % die Gesamtkosten des Einkaufs entsprechend.


    Wir weisen darauf hin, dass die Sparkasse Lindenhain eine professionelle Produktberatung
    anbietet, jedoch keine individuelle Steuer- oder Rechtsberatung erbringt. Die
    Erteilung der Kreditkarte Gold erfolgt unter Vorbehalt einer positiven Kreditwürdigkeitsprüfung.
    Sollte sich Ihre finanzielle Situation wesentlich verschlechtern, behalten wir
    uns vor, den Verfügungsrahmen einzuschränken.


    Alle unsere Prozesse stehen unter der Aufsicht der BaFin und der Deutschen Bundesbank.
    Die gesetzliche Einlagensicherung schützt Guthaben bis 100.000 €, was jedoch primär
    für Kontoguthaben und nicht für Kreditlinien gilt. Im Falle eines Kartenverlusts
    ist die sofortige Sperrung über die 116 116 zwingend erforderlich, um die gesetzliche
    Haftungsbegrenzung auf 50 € zu gewährleisten. Die rechtliche Grundlage für alle
    Vereinbarungen bildet das BGB sowie das Zahlungskontengesetz.'
