- id: fed5a8c3-f6b1-5622-8ce8-9b5ce780db18
  title: Sparkassen-Privatkredit — für wen und wofür geeignet
  body: 'Der Sparkassen-Privatkredit ist die flexible Finanzierung für individuelle
    Anschaffungen mit einem transparenten effektiven Jahreszins. Er richtet sich an
    Bürger unserer Region, die eine sichere und verlässliche Lösung für ihre Finanzplanung
    suchen, ohne dabei auf einen persönlichen Ansprechpartner verzichten zu wollen.


    Dieses Produkt ist besonders geeignet für:

    - Geplante Anschaffungen im Haushalt (z. B. neue Möbel oder Elektronik).

    - Die Finanzierung von notwendigen Reparaturen am Fahrzeug oder im Eigenheim.

    - Die Umschuldung bestehender, teurerer Verbindlichkeiten zur Optimierung der
    monatlichen Belastung.

    - Individuelle Lebensereignisse, die eine kurz- bis mittelfristige Liquidität
    erfordern.


    Die Rahmenbedingungen sind transparent gestaltet: Wir bieten eine maximale Kreditsumme
    von bis zu 50.000 €, sodass sowohl kleinere Wünsche als auch größere Investitionen
    abgedeckt werden können.


    Um Ihnen eine Orientierung über die Kosten zu geben, dient folgendes repräsentatives
    Beispiel:

    Bei einem Nettodarlehensbetrag von 10.000 € und einer Laufzeit von 60 Monaten
    beträgt der effektive Jahreszins 6,49 %. Dies führt zu einer monatlichen Rate
    von 194,75 €. Die Gesamtkosten über die gesamte Laufzeit belaufen sich in diesem
    Beispiel auf 1.685 €.


    Wir legen Wert darauf, dass jede Finanzierung nachhaltig ist. Daher stützen sich
    unsere Empfehlungen auf eine sorgfältige Kreditwürdigkeitsprüfung. Wir bieten
    Ihnen eine professionelle Produktberatung und allgemeine finanzielle Aufklärung
    direkt in unseren Filialen oder telefonisch an.


    Für eine Übersicht der erforderlichen Dokumente zur Beantragung besuchen Sie bitte
    Sparkassen-Privatkredit — erforderliche Unterlagen.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: e4dbaabc-6fc0-5714-967c-7b8b5d37f91f
  title: 'Sparkassen-Privatkredit — Nettodarlehensbetrag im repräsentativen Beispiel:
    Erklärung'
  body: 'Frage: Was bedeutet der Nettodarlehensbetrag von 10.000 € im repräsentativen
    Beispiel für mich als Kreditnehmer?


    Antwort: Der Nettodarlehensbetrag von 10.000 € bezeichnet die Summe, die Ihnen
    im Rahmen des repräsentativen Beispiels tatsächlich zur freien Verfügung gestellt
    wird. Dies ist der Betrag, der auf Ihr Konto ausgezahlt wird.


    Im Gegensatz zu den Gesamtkosten (die im Beispiel 1.685 € betragen) umfasst der
    Nettodarlehensbetrag keine Zinsen oder sonstigen Gebühren. Er stellt die reine
    Kreditsumme dar, die Sie über die Laufzeit von 60 Monaten zurückzahlen. Bitte
    beachten Sie, dass dies ein Beispielwert ist; Ihr individueller Kreditbetrag kann
    bis zu einem Maximum von 50.000 € variieren und hängt von Ihrer persönlichen Bonitätsprüfung
    ab.


    Weitere Details zum repräsentativen Beispiel finden Sie in Sparkassen-Privatkredit
    — Überblick.'
