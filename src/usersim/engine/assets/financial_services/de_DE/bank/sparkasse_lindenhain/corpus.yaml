- id: c3c71f9a-dc53-5f30-a4bf-0b08afb7243c
  title: Sparkassen-Kreditkarte Gold — Datenschutz und Datenverarbeitung
  body: 'Die Sparkasse Lindenhain verarbeitet personenbezogene Daten im Zusammenhang
    mit der Sparkassen-Kreditkarte Gold strikt nach den geltenden Datenschutzrichtlinien
    und der DSGVO. Wir gewährleisten eine transparente und gesetzeskonforme Behandlung
    Ihrer Daten.


    **Zweck der Datenverarbeitung:**

    Wir erheben und verarbeiten Ihre Daten, um die Bereitstellung der Kreditkarte
    zu ermöglichen. Dies umfasst insbesondere die Durchführung einer Kreditwürdigkeitsprüfung,
    um den monatlichen Verfügungsrahmen von 5.000 € verantwortungsbewusst festzulegen.
    Zudem werden Transaktionsdaten verarbeitet, um die Abrechnung des Jahresentgelts
    von 84 € sowie des Fremdwährungsentgelts von 1,75 % korrekt durchzuführen.


    **Übermittlung an Dritte:**

    Im Rahmen der Kreditprüfung tauschen wir Daten mit autorisierten Auskunfteien
    (z. B. SCHUFA) aus. Bei weltweiten Zahlungen werden Daten an die entsprechenden
    Kreditkartenorganisationen und Acquirer übermittelt, um die Autorisierung Ihrer
    Zahlungen zu gewährleisten.


    **Sicherheit und Überwachung:**

    Um Betrugsfälle zu verhindern, überwachen wir Transaktionsmuster. Diese automatisierten
    Prüfungen dienen dem Schutz Ihres Guthabens. Wir weisen darauf hin, dass wir unter
    der Aufsicht der BaFin und der Deutschen Bundesbank agieren, was eine hohe regulatorische
    Sicherheit Ihrer Daten garantiert.


    **Ihre Rechte:**

    Sie haben das Recht auf Auskunft über die zu Ihrer Person gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    (z. B. aus dem BGB oder Steuerrecht) entgegenstehen.


    Weitere rechtliche Hinweise finden Sie in der Sparkassen-Kreditkarte Gold — rechtliche
    Hinweise.'
