- id: c3be0edd-1f09-526e-bc7c-c026aeea36a2
  title: Sparkassen-Baufinanzierung — Änderung der Bedingungen
  body: 'Im Rahmen der Sparkassen-Baufinanzierung gelten die vereinbarten Konditionen
    für die gesamte Dauer der gewählten Sollzinsbindung. Diese Bindung schützt Sie
    vor Zinsschwankungen am Markt. Für eine Zinsbindung von 10 Jahren beträgt der
    aktuelle Zinssatz 3,68 %, während für eine Bindung von 15 Jahren ein Zinssatz
    von 3,91 % festgelegt wurde.


    Änderungen der vertraglichen Bedingungen während der Laufzeit können in folgenden
    Fällen erfolgen:


    1. Gesetzliche Anforderungen: Wir behalten uns vor, die Bedingungen anzupassen,
    sofern dies durch neue gesetzliche Vorgaben, Richtlinien der BaFin oder der Deutschen
    Bundesbank zwingend erforderlich ist.


    2. Einseitige Vertragsänderungen: Sollten wir die allgemeinen Geschäftsbedingungen
    ändern, werden Sie hierüber in einer angemessenen Frist schriftlich informiert.
    Diese Änderungen werden wir transparent kommunizieren. Sie haben in diesem Fall
    das Recht, den Vertrag ohne weitere Kosten zu kündigen, sofern die Änderungen
    zu einer wesentlichen Verschlechterung Ihrer Position führen.


    3. Anpassung der Tilgungsrate: Auf Ihren Wunsch hin können wir die Tilgungsrate
    innerhalb des vertraglich vereinbarten Rahmens anpassen. Bitte beachten Sie, dass
    dies einer erneuten Prüfung Ihrer Kreditwürdigkeit bedarf.


    Bezüglich der Sondertilgung ist vertraglich festgeschrieben, dass Sie jährlich
    bis zu 5 % der ursprünglichen Darlehenssumme kostenfrei tilgen können. Diese Quote
    ist fix und kann nicht einseitig durch die Bank reduziert werden, es sei denn,
    es liegt eine schwerwiegende Änderung der Kreditrisikobewertung vor.


    Die Kündigung des Darlehens vor Ablauf der Sollzinsbindung ist grundsätzlich möglich,
    kann jedoch eine Vorfälligkeitsentschädigung gemäß den gesetzlichen Bestimmungen
    des BGB nach sich ziehen. Wir legen großen Wert auf eine faire und gesetzeskonforme
    Kundenbehandlung und prüfen jede Anfrage individuell auf Basis Ihrer persönlichen
    Situation.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 680aec17-c2f4-534d-a538-bf55fc622ee2
  title: Sparkassen-Baufinanzierung — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter bei der Begleitung
    von Kunden durch den Prozess des Abschlusses einer Sparkassen-Baufinanzierung.
    Das Ziel ist eine strukturierte Abwicklung von der ersten Anfrage bis zur Auszahlung.


    Schritt 1: Erstberatung und Bedarfsanalyse

    Führen Sie mit dem Kunden ein Beratungsgespräch, um den Finanzierungsbedarf und
    die verfügbaren Eigenmittel zu ermitteln. Klären Sie, ob eine langfristige Sicherheit
    (z. B. 15 Jahre Zinsbindung zu 3,91 %) oder eine kurzfristigere Option (z. B.
    10 Jahre Zinsbindung zu 3,68 %) bevorzugt wird.


    Schritt 2: Kreditwürdigkeitsprüfung

    Leiten Sie die Prüfung der Bonität ein. Fordern Sie alle notwendigen Einkommensnachweise
    und Unterlagen an. Weisen Sie den Kunden darauf hin, dass eine Kreditzusage erst
    nach der finalen Prüfung durch unsere Fachabteilung garantiert werden kann.


    Schritt 3: Objektschätzung und Beleihung

    Prüfen Sie den Wert der Immobilie durch eine zertifizierte Bewertung. Stellen
    Sie sicher, dass das Beleihungsausmaß den internen Richtlinien der Sparkasse Lindenhain
    entspricht, um die Sicherheit des Kredits zu gewährleisten.


    Schritt 4: Angebotserstellung und Vertragsunterzeichnung

    Erstellen Sie ein verbindliches Angebot, das die gewählte Sollzinsbindung sowie
    die jährliche Sondertilgungsmöglichkeit von 5 % explizit ausweist. Nach Zustimmung
    des Kunden erfolgt die Unterzeichnung des Kreditvertrags in der Filiale.


    Schritt 5: Notarielle Absicherung

    Koordinieren Sie den Termin beim Notar zur Bestellung der Grundschuld. Die Auszahlung
    des Darlehens erfolgt erst nach Vorliegen der Bestätigung über die Eintragung
    der Grundschuld im Grundbuch.


    Schritt 6: Auszahlung und Betreuung

    Veranlassen Sie die Auszahlung des Kredits an den Verkäufer oder den Bauträger.
    Richten Sie zusammen mit dem Kunden den Dauerauftrag für die monatlichen Raten
    ein und erklären Sie die Funktion der jährlichen Sondertilgung.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: product_sheet
