- id: f7baf9a9-64ca-5d2c-b6ab-ac4131f45241
  title: Sparkassen-Baufinanzierung — Empfehlungs- und Treueangebot
  body: 'Wir freuen uns, Ihnen heute ein besonderes Angebot für die Sparkassen-Baufinanzierung
    vorstellen zu dürfen. Vom 01.11.2024 bis zum 31.12.2024 belohnen wir Ihr Vertrauen
    in unser regional verwurzeltes Institut mit einem exklusiven Empfehlungsbonus.


    Wenn Sie einen neuen Kunden an uns vermitteln, der eine Sparkassen-Baufinanzierung
    erfolgreich abschließt, erhalten sowohl Sie als auch die geworbene Person eine
    einmalige Gutschrift in Höhe von 250,00 € auf das jeweilige Verrechnungskonto.
    Dieses Angebot gilt für alle Neukunden, die sich für eine unserer attraktiven
    Zinsbindungen entscheiden, beispielsweise die 10-jährige Bindung mit einem Zinssatz
    von 3,68 % oder die 15-jährige Bindung mit 3,91 %.


    Nutzen Sie die Chance, Ihren Bekannten den Weg zum Eigenheim mit einer sicheren
    und fairen Finanzierung zu ebnen. Für weitere Details zu den Voraussetzungen und
    zur Einlösung des Bonus laden wir Sie ein, das Dokument Sparkassen-Baufinanzierung
    — Überblick zu konsultieren. Wir freuen uns darauf, Sie und Ihre Empfehlungen
    in Lindenhain begrüßen zu dürfen.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: promo_notice
