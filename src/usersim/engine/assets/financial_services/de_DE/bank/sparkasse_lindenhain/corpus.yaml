- id: c8300a72-efc4-5cc8-9cce-a1d8a767dd0b
  title: Sparkassen-Kreditkarte Gold — Änderung der Bedingungen
  body: 'Diese Bedingungen regeln die Nutzung und die vertraglichen Vereinbarungen
    im Zusammenhang mit der Sparkassen-Kreditkarte Gold der Sparkasse Lindenhain.
    Die Nutzung der Karte erfolgt auf Basis des BGB und unter der Aufsicht der BaFin
    sowie der Deutschen Bundesbank.


    Das Jahresentgelt für die Bereitstellung und Verwaltung der Karte beträgt 84 €.
    Dieses Entgelt wird jährlich in Rechnung gestellt und dient der Finanzierung unseres
    flächendeckenden Filialnetzes sowie des persönlichen Services. Die Sparkasse Lindenhain
    behält sich vor, dieses Entgelt unter Einhaltung einer angemessenen Ankündigungsfrist
    anzupassen.


    Der monatliche Verfügungsrahmen ist auf 5.000 € festgelegt. Dieser Betrag stellt
    die maximale Summe dar, die innerhalb eines Abrechnungszyklus für Zahlungen und
    Bargeldbezüge genutzt werden kann. Eine Erhöhung oder Senkung dieses Rahmens erfolgt
    nach einer erneuten Kreditwürdigkeitsprüfung durch unser Haus.


    Bei Transaktionen in Fremdwährungen wird ein Fremdwährungsentgelt in Höhe von
    1,75 % auf den jeweiligen Transaktionsbetrag erhoben. Dieses Entgelt deckt die
    Kosten der Währungsumrechnung und die Abwicklung über internationale Zahlungssysteme
    ab.


    Änderungen der Bedingungen werden Ihnen schriftlich oder über das Online-Banking
    mitgeteilt. Sie haben das Recht, das Kartenkonto bei einer für Sie nachteiligen
    Änderung des Vertragsverhältnisses unter Einhaltung der vertraglichen Kündigungsfristen
    zu kündigen. Die Beendigung des Vertragsverhältnisses entbindet Sie nicht von
    der Verpflichtung, alle ausstehenden Forderungen aus der Kartennutzung vollständig
    zu begleichen. Alle Prozesse zur Kontoführung und Abrechnung folgen strikt den
    Datenschutzrichtlinien und dem Zahlungskontengesetz.'
