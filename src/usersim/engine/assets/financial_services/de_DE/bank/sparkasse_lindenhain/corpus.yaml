  institution_id: sparkasse_lindenhain
- id: 93721f35-77ea-5401-894c-996ebc729359
  title: Sparkassen-Kreditkarte Gold — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Mitarbeiter dabei, Unstimmigkeiten zwischen den
    Kundenunterlagen und den systemseitigen Daten der Sparkassen-Kreditkarte Gold
    zu klären.


    Symptom: Ein Kunde gibt an, dass die in seinem Vertrag vereinbarten Konditionen
    oder Limits nicht mit den tatsächlichen Abrechnungen oder Systemwerten übereinstimmen.


    Prüfschritte in der Reihenfolge:


    1. Abgleich des Jahresentgelts:

    Überprüfen Sie, ob das Jahresentgelt von 84 € korrekt abgebucht wurde. Falls der
    Kunde eine andere Summe angibt, prüfen Sie, ob es sich um eine Sonderaktion oder
    ein individuelles Entgeltversprechen aus einer früheren Vertragsphase handelt.


    2. Überprüfung des Verfügungsrahmens:

    Kontrollieren Sie im System, ob der monatliche Verfügungsrahmen auf 5.000 € eingestellt
    ist. Sollte ein geringerer Betrag hinterlegt sein, prüfen Sie die letzte Kreditwürdigkeitsprüfung,
    ob der Rahmen aufgrund von Risikoänderungen angepasst wurde.


    3. Kontrolle des Fremdwährungsentgelts:

    Prüfen Sie bei Reklamationen über Auslandskosten, ob die Abrechnung präzise mit
    dem Satz von 1,75 % erfolgt ist. Vergleichen Sie den Wechselkurs zum Zeitpunkt
    der Transaktion mit den systeminternen Kursen.


    4. Identitätsprüfung:

    Bevor Sie dem Kunden detaillierte Auskünfte über diese Abweichungen geben, führen
    Sie eine strikte Identitätsprüfung durch.


    Fix und Eskalation:

    Wenn ein systemischer Fehler vorliegt (z. B. falsches Entgelt), korrigieren wir
    den Betrag umgehend und stellen eine entsprechende Gutschrift aus. Falls die Abweichung
    auf einer komplexen vertraglichen Vereinbarung beruht, die nicht im System hinterlegt
    ist, leiten wir den Fall an die Filialleitung oder die regionale Geschäftsführung
    zur finalen Entscheidung weiter.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 25a9ed1f-9bea-512d-807d-b959f79238ba
  title: Sparkassen-Baufinanzierung — Überblick
  body: 'Die Sparkassen-Baufinanzierung ist die langfristige Finanzierungslösung der
    Sparkasse Lindenhain für alle Bürger, die den Traum vom eigenen Eigenheim verwirklichen
    möchten. Als öffentlich-rechtliches Institut sind wir tief in unserer Region verwurzelt
    und bieten Ihnen eine sichere, vertrauensvolle Basis für Ihre größte private Investition.


    Im Zentrum unseres Angebots steht die Planungssicherheit. Wir bieten Ihnen flexible
    Sollzinsbindungen an, mit denen Sie sich Ihre Kreditkosten über viele Jahre hinweg
    festschreiben können. Aktuell können Sie zwischen verschiedenen Laufzeiten wählen,
    um Ihre monatliche Belastung optimal an Ihre Lebenssituation anzupassen. Für eine
    Zinsbindung von 10 Jahren bieten wir Ihnen einen Zinssatz von 3,68 % an, während
    eine längere Absicherung über 15 Jahre zu einem Zinssatz von 3,91 % möglich ist.


    Ein wesentliches Merkmal unserer Baufinanzierung ist die Flexibilität bei der
    Tilgung. Wir wissen, dass sich Lebensumstände ändern können oder unerwartete Erbschaften
    und Boni anfallen. Daher ist in Ihren Vertrag eine jährliche Sondertilgung in
    Höhe von 5 % der ursprünglichen Darlehenssumme integriert. Dies ermöglicht es
    Ihnen, Ihre Restschuld schneller zu reduzieren und die Gesamtlaufzeit des Kredits
    zu verkürzen, ohne dass Ihnen hierfür zusätzliche Vorfälligkeitsentschädigungen
    entstehen.


    Die Vergabe der Sparkassen-Baufinanzierung erfolgt stets auf Grundlage einer sorgfältigen
    Kreditwürdigkeitsprüfung. Wir begleiten Sie durch den gesamten Prozess – von der
    ersten Bedarfsanalyse über die Bewertung Ihrer Immobilie bis hin zur finalen Auszahlung.
    Bitte beachten Sie, dass eine verbindliche Kreditzusage erst nach Abschluss dieser
    Prüfung erfolgt.


    Zusammen mit einer soliden Finanzierungsstrategie empfehlen wir die Führung eines
    Girokontos zur Abwicklung der monatlichen Raten. Hierzu bietet sich unser Girokonto
    Komfort mit Sparkassen-Card — Überblick an, welches Ihnen eine reibungslose Verwaltung
    Ihrer täglichen Zahlungen ermöglicht.


    Wir stehen Ihnen in unseren regionalen Filialen persönlich zur Verfügung, um gemeinsam
    mit Ihnen eine Lösung zu finden, die sowohl Ihren finanziellen Spielraum als auch
    Ihre langfristigen Ziele berücksichtigt.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f1de71e6-9456-5ab3-b5d9-1acd9e1508a3
  title: 'Sparkassen-Baufinanzierung — Sollzins bei 10 Jahren Zinsbindung: Erklärung'
  body: 'Ein häufig gestellter Frage ist, was genau der Sollzins bei einer Zinsbindung
    von 10 Jahren bedeutet und welche Auswirkungen dies auf die monatliche Rate hat.


    **Was bedeutet die Zinsbindung von 10 Jahren?**

    Wenn Sie sich für eine Zinsbindung von 10 Jahren entscheiden, wird der Zinssatz
    für diesen Zeitraum festgeschrieben. In unserem aktuellen Angebot beträgt dieser
    Sollzins 3,68 %. Das bedeutet, dass Ihr Zinssatz über die gesamten 10 Jahre unabhängig
    von allgemeinen Marktschwankungen stabil bleibt. Sie wissen heute bereits genau,
    welche Zinskosten auf Sie zukommen, bis die Bindungsfrist endet.


    **Was passiert nach Ablauf der 10 Jahre?**

    Nach Ablauf der 10 Jahre muss über die verbleibende Restschuld eine neue Vereinbarung
    getroffen werden. Entweder wird das Darlehen zu den dann aktuellen Marktkonditionen
    verlängert oder die Restsumme wird vollständig getilgt.


    Weitere Details zu unseren Konditionen finden Sie in der Sparkassen-Baufinanzierung
    — Zinsübersicht.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: faq
  source_authority: official
