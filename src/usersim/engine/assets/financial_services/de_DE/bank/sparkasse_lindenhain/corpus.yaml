- id: ca27fa28-3e9a-50e1-91d1-6cc8df3d81d2
  title: Sparkassenbuch — Änderung der Bedingungen
  body: 'Diese Bedingungen regeln die Verwaltung und die Änderungen des Sparkassenbuchs
    bei der Sparkasse Lindenhain. Das Sparkassenbuch dient dem langfristigen Vermögensaufbau
    und unterliegt daher spezifischen vertraglichen Vereinbarungen.


    Verzinsung und Anpassungen:

    Der aktuelle Zinssatz beträgt 0,5 %. Die Sparkasse Lindenhain behält sich das
    Recht vor, diesen Zinssatz unter Berücksichtigung der Marktlage und aufsichtsrechtlicher
    Vorgaben der BaFin und der Deutschen Bundesbank anzupassen. Über Änderungen des
    Zinssatzes werden Sie transparent informiert.


    Verfügbarkeit und Kündigung:

    Um die Stabilität der regionalen Infrastruktur zu gewährleisten, ist das Sparkassenbuch
    mit einer Kündigungsfrist von 3 Monaten verbunden. Dies bedeutet, dass für Auszahlungen,
    die über den kündigungsfreien Betrag hinausgehen, eine entsprechende Vorankündigung
    erforderlich ist.


    Kündigungsfreier Betrag:

    Sie können monatlich einen Betrag von 2.000 € ohne Einhaltung der Kündigungsfrist
    abheben. Übersteigt die gewünschte Auszahlung diesen Betrag, wird die Kündigungsfrist
    von 3 Monaten angewendet, sofern keine gesonderte Vereinbarung getroffen wurde.


    Beendigung des Vertrages:

    Das Konto kann beidseitig gekündigt werden. Bei einer Kündigung durch den Kunden
    ist die vereinbarte Frist von 3 Monaten zu wahren. Die Sparkasse Lindenhain wird
    eine Kündigung aus wichtigem Grund gemäß den Bestimmungen des BGB und des Zahlungskontengesetzes
    vornehmen.


    Alle Änderungen an diesen Bedingungen werden Ihnen schriftlich mitgeteilt. Durch
    die weitere Nutzung des Produkts nach einer entsprechenden Ankündigung erklären
    Sie sich mit den geänderten Bedingungen einverstanden.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: terms_conditions
  source_authority: official
