- id: 70cc8041-9a99-59dd-8506-177da8a27bb7
  title: Sparkassen-Kreditkarte Gold — Betrugsmaschen rund um dieses Produkt erkennen
  body: "Die Sparkassen-Kreditkarte Gold ist aufgrund ihres exklusiven Status und\
    \ des erweiterten Serviceangebots ein Ziel für gezielte Betrugsversuche. Wir möchten\
    \ Sie darauf hinweisen, wie Sie diese Maschen erkennen und Ihr Vermögen schützen.\n\
    \nEin häufiges Szenario ist das sogenannte 'Phishing', bei dem Sie per E-Mail\
    \ oder SMS dazu aufgefordert werden, Ihre Kreditkartendaten auf einer gefälschten\
    \ Webseite zu aktualisieren, angeblich um Ihren Status oder den Verfügungsrahmen\
    \ von 5.000 € zu erhalten. Bitte beachten Sie: Die Sparkasse Lindenhain wird Sie\
    \ niemals per E-Mail oder SMS auffordern, Ihre PIN, Ihre CVV-Prüfnummer oder Ihre\
    \ vollständigen Kartendaten auf einer externen Webseite einzugeben.\n\nZudem warnen\
    \ wir vor betrügerischen Angeboten, die Ihnen eine kostenlose Aufstockung Ihres\
    \ Kreditlimits versprechen, wenn Sie eine geringe 'Bearbeitungsgebühr' vorab bezahlen.\
    \ Solche Forderungen sind unseriös. Alle offiziellen Gebühren, wie das Jahresentgelt\
    \ von 84 €, werden transparent über Ihr Konto abgerechnet.\n\nSollten Sie den\
    \ Verdacht haben, dass Ihre Daten kompromittiert wurden oder Sie eine unbefugte\
    \ Abbuchung bemerken, ist schnelles Handeln entscheidend. Im Falle eines Kartenverlustes\
    \ oder Diebstahls steht die sofortige Sperrung über den Notruf 116 116 im Vordergrund.\
    \ Durch die zeitnahe Meldung kann die Haftung des Kunden auf maximal 50 € begrenzt\
    \ werden. \n\nWir empfehlen Ihnen, die starken Kundenauthentifizierungsverfahren\
    \ bei Online-Zahlungen konsequent zu nutzen und Ihre Kontoauszüge regelmäßig auf\
    \ unbekannte Beträge, insbesondere kleine Testbuchungen, zu prüfen."
