    Kreditrahmen hinaus ins Minus rutschen, greift der Zinssatz für geduldete Überziehungen
    in Höhe von 14,49 %. Diese Zinsen werden periodisch berechnet und dem Konto belastet.


    Die Kündigung des Kontoverhältnisses kann durch beide Parteien unter Einhaltung
    der gesetzlichen Fristen erfolgen. Wir weisen darauf hin, dass im Falle einer
    Kontoschließung alle ausstehenden Verpflichtungen, insbesondere Zinsforderungen
