- id: 3b8dfa29-2f01-579e-ab2d-628ceb7de494
  title: Sparkassen-Privatkredit — zwischen Tarifen wählen
  body: 'Wenn Sie eine Finanzierung planen, stehen Sie oft vor der Wahl zwischen einem
    regionalen Anbieter wie der Sparkasse Lindenhain und einem rein digitalen Online-Kredit.


    **Sparkassen-Privatkredit**

    - **Konditionen**: Unser repräsentatives Beispiel zeigt einen effektiven Jahreszins
    von 6,49 % bei 10.000 € Kreditsumme über 60 Monate (monatliche Rate: 194,75 €).

    - **Service**: Wir bieten eine persönliche Beratung in unseren regionalen Filialen.
    Wir sind tief in der Region verwurzelt und kennen die lokalen Gegebenheiten.

    - **Sicherheit**: Direkter Ansprechpartner bei Problemen; Aufsicht durch BaFin
    und Deutsche Bundesbank.

    - **Maximalbetrag**: Bis zu 50.000 €.


    **Online-Alternativen**

    - **Struktur**: Oft schnellere, automatisierte Prozesse ohne persönlichen Kontakt.

    - **Konditionen**: Die Zinsen können schwanken und sind oft stark an sehr hohe
    Bonitätswerte geknüpft.

    - **Service**: Support erfolgt meist nur über Chat oder E-Mail; keine physische
    Präsenz vor Ort.


    **Fazit: Welches Produkt passt zu Ihnen?**

    Der Sparkassen-Privatkredit ist die ideale Wahl für Kunden, die Wert auf Vertrauen,
    eine verbindliche persönliche Beratung und eine regionale Anbindung legen. Wenn
    Sie eine Finanzierung bis 50.000 € suchen und eine Bank wünschen, die Ihre individuelle
    Situation in einem persönlichen Gespräch würdigt, ist unser Angebot die richtige
    Lösung. Online-Produkte eignen sich eher für Kunden, die eine rein digitale Abwicklung
    bevorzugen und keinen Bedarf an einer persönlichen Betreuung in der Region haben.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 72977aa0-b369-5ec2-b713-aa4cd071d89e
  title: Sparkassen-Privatkredit — Datenschutz und Datenverarbeitung
  body: 'Die Sparkasse Lindenhain verarbeitet personenbezogene Daten im Zusammenhang
    mit dem Sparkassen-Privatkredit streng nach den geltenden Datenschutzrichtlinien
    der EU-Datenschutzgrundverordnung (DSGVO) sowie den nationalen Bestimmungen des
    BGB.


    **Zweck der Datenverarbeitung**

    Zur Vergabe eines Kredits ist die Durchführung einer sorgfältigen Kreditwürdigkeitsprüfung
    unerlässlich. Hierzu verarbeiten wir Daten über Ihre Einkommensverhältnisse, bestehende
    Verpflichtungen und Informationen aus Kreditauskunfteien. Dies dient der Gewährleistung
    einer fairen und gesetzeskonformen Kreditvergabe sowie dem Schutz des Instituts
    vor Ausfallrisiken.


    **Aufsicht und Kontrolle**

    Unsere Datenverarbeitungsprozesse unterliegen der Aufsicht der BaFin und der Deutschen
    Bundesbank. Wir stellen sicher, dass alle personenbezogenen Daten vor unbefugtem
    Zugriff geschützt sind. Die starke Kundenauthentifizierung wird bei allen digitalen
    Interaktionen eingesetzt, um die Integrität Ihrer Daten zu wahren.


    **Ihre Rechte als Kunde**

    Sie haben das Recht auf Auskunft über die zu Ihrer Person gespeicherten Daten
    sowie das Recht auf Berichtigung unrichtiger Daten. Wir informieren Sie transparent
    über die Kriterien, die zu einer Kreditentscheidung geführt haben. Da wir keine
    individuelle Steuer- oder Rechtsberatung erbringen, dienen unsere Auskünfte ausschließlich
    der Information über den Kreditvertrag und die damit verbundenen Datenflüsse.


    **Sicherheit der Guthaben**

    Wir weisen darauf hin, dass im Falle einer Kontoführung bei uns Ihre Guthaben
    durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000 € geschützt
    sind. Diese Sicherheit ist Teil unseres Versprechens an die Bürger der Region
    Lindenhain, einen sicheren Zugang zu Finanzdienstleistungen zu gewährleisten.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 80fc4d7a-5d06-5b5a-93be-4e7eb4b314c2
  title: Sparkassen-Privatkredit — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Der Schutz Ihres Vermögens und Ihrer persönlichen Daten hat für die Sparkasse
    Lindenhain höchste Priorität. Im Zusammenhang mit Kreditprodukten wie dem Sparkassen-Privatkredit
    beobachten wir derzeit verschiedene Betrugsmuster, vor denen wir Sie warnen möchten.


    Eine häufige Masche ist das Angebot von sogenannten „Sofortkrediten“ über soziale
    Medien oder unaufgeforderte E-Mails. Dabei locken Betrüger mit Zinssätzen, die
    weit unter unserem repräsentativen Beispiel von 6,49 % liegen, um Ihre Aufmerksamkeit
    zu gewinnen. Seien Sie skeptisch, wenn Ihnen eine Kreditzusage ohne eine sorgfältige
    Kreditwürdigkeitsprüfung garantiert wird. Wie in unserer Beratungspolitik festgelegt,
    gewährt die Sparkasse Lindenhain niemals eine Kreditzusage ohne finale Prüfung
    der Bonität.


    Ein weiteres Warnsignal ist die Forderung nach Vorauszahlungen. Betrüger verlangen
    oft „Bearbeitungsgebühren“, „Versicherungsprämien“ oder „Kreditsicherungen“, bevor
    der Betrag ausgezahlt wird. Die Sparkasse Lindenhain wird Sie niemals auffordern,
    Gebühren für die Bearbeitung eines Kredits auf ein privates Konto oder über externe
    Zahlungsdienstleister im Voraus zu überweisen.


    Zudem wird niemals ein Mitarbeiter der Sparkasse Lindenhain per Telefon, E-Mail
    oder SMS nach Ihren geheimen Zugangsdaten, Ihrer PIN oder nach einem TAN-Code
    fragen. Solche Informationen sind ausschließlich für Ihre persönliche Nutzung
    bestimmt. Sollten Sie aufgefordert werden, eine sogenannte „Sicherheitsprüfung“
    durchzuführen, bei der Sie Geld auf ein anderes Konto transferieren müssen, handelt
    es sich zweifelsfrei um einen Betrugsversuch.


    Wenn Sie den Verdacht haben, Opfer einer Betrugsmasche geworden zu sein oder wenn
    Ihnen verdächtige Nachrichten im Namen der Sparkasse Lindenhain erreichen, informieren
    Sie uns bitte umgehend. Eine zeitnahe Meldung ist essenziell, um weitere Schäden
    zu begrenzen. Wir unterstützen Sie dabei, Ihre Konten und Kreditverträge zu sichern
    und leiten die notwendigen Schritte zur Schadensbegrenzung ein.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 9a741217-1357-55e5-abf8-b89bb9c8896a
  title: Sparkassen-Privatkredit — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Mitarbeiter, um Kunden über die Rahmenbedingungen
    und Einschränkungen des Sparkassen-Privatkredits umfassend zu informieren. Die
    Einhaltung dieser Grenzen ist für die Risikosteuerung und die regulatorische Konformität
    zwingend erforderlich.


    Der maximal mögliche Kreditbetrag für den Sparkassen-Privatkredit ist auf 50.000
    € festgelegt. Anträge über diesen Betrag hinaus können nicht über dieses Produkt
    abgewickelt werden und erfordern eine individuelle Prüfung auf alternative Finanzierungslösungen
    oder die Prüfung, ob eine Baufinanzierung für den spezifischen Verwendungszweck
    angemessener wäre.


    Eine wesentliche Einschränkung stellt die zwingende Kreditwürdigkeitsprüfung dar.
    Gemäß unserer Risiko- und Compliance-Strategie darf kein Vertrag ohne eine erfolgreiche
    Prüfung der Bonität abgeschlossen werden. Dies schließt die Analyse der regelmäßigen
    Einkünfte sowie der bestehenden Verpflichtungen des Kunden ein. Eine Kreditzusage
    ohne diese finale Prüfung ist untersagt.


    In Sonderfällen, insbesondere bei sozialen Härten, wird die individuelle Situation
    des Kunden im Einklang mit unserer sozialen Verantwortung geprüft. Dennoch bleiben
    die gesetzlichen Anforderungen an die Kreditfähigkeit sowie die Vorgaben der BaFin
    und der Deutschen Bundesbank bindend. Alle Kreditprozesse folgen strikt den Bestimmungen
    des BGB.


    Zudem ist zu beachten, dass die Auszahlung des Kredits an die erfolgreiche Identitätsprüfung
    gekoppelt ist. Vor jeder zustandsändernden Aktion oder der finalen Vertragserteilung
    muss eine strikte Verifizierung des Kunden erfolgen. Bei Online-Abschlüssen ist
    die starke Kundenauthentifizierung zwingend erforderlich, um die Sicherheit des
    Vorgangs zu gewährleisten.


    Sollte ein Kunde Schwierigkeiten bei der Bedienung der Ratenzahlungen haben, ist
    dies stufenweise über den Filialmitarbeiter bis hin zur regionalen Geschäftsführung
    zu eskalieren, um faire und gesetzeskonforme Lösungen im Sinne des BGB zu finden.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 4c983589-1586-5c78-8065-51044e84a926
  title: 'Sparkassen-Privatkredit — Monatsrate im repräsentativen Beispiel: Erklärung'
  body: 'Frage: Wie setzt sich die Monatsrate von 194,75 € im repräsentativen Beispiel
    zusammen?


    Antwort: Die Monatsrate von 194,75 € bezieht sich auf ein Beispiel-Darlehen mit
    einem Nettodarlehensbetrag von 10.000 € und einer Laufzeit von 60 Monaten. In
    diesen Betrag fließen sowohl die Tilgung des geliehenen Kapitals als auch die
    Zinsen ein, die auf Basis eines effektiven Jahreszinses von 6,49 % berechnet werden.


    Durch diese gleichbleibende Rate wissen Sie bereits bei Vertragsabschluss genau,
    welcher Betrag monatlich von Ihrem Konto abgebucht wird. Bitte beachten Sie, dass
    dies ein repräsentatives Beispiel ist. Die tatsächliche Rate für Ihren persönlichen
    Kredit hängt von der finalen Kreditwürdigkeitsprüfung, der gewählten Laufzeit
    und der Kreditsumme ab. Weitere Details zur Zusammensetzung finden Sie auch im
    Dokument Sparkassen-Privatkredit — Überblick.'
