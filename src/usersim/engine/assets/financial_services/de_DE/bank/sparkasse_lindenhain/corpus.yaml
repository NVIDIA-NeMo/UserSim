- id: 588c2e3f-a621-59c1-9931-0615b1f493c7
  title: Sparkassen-Kreditkarte Gold — abgelehnter oder gesperrter Vorgang
  body: "Symptom: Ihre Sparkassen-Kreditkarte Gold wird beim Bezahlvorgang abgelehnt\
    \ oder Sie erhalten die Meldung, dass die Karte gesperrt ist.\n\nMögliche Ursachen\
    \ und Lösungen:\n\n1. Überschreitung des Verfügungsrahmens:\nPrüfen Sie, ob Sie\
    \ den monatlichen Verfügungsrahmen von 5.000 € bereits ausgeschöpft haben. Wenn\
    \ dies der Fall ist, wird der Vorgang systemseitig abgelehnt. \nLösung: Sie können\
    \ eine Zahlung per Überweisung leisten, um den Rahmen zu entlasten, oder eine\
    \ Erhöhung des Rahmens beantragen (vorbehaltlich einer Kreditwürdigkeitsprüfung).\n\
    \n2. Sicherheitsperre durch das System:\nBei ungewöhnlichen Zahlungsmustern oder\
    \ mehreren Fehlversuchen bei der PIN-Eingabe kann das System die Karte automatisch\
    \ sperren, um Betrug zu verhindern.\nLösung: Nennen Sie uns Ihre Daten zur Identitätsprüfung.\
    \ Wir prüfen den Vorgang und können die Karte bei Verifizierung Ihrer Identität\
    \ wieder freischalten.\n\n3. Karte wurde durch den Notruf gesperrt:\nFalls Sie\
    \ oder ein Bevollmächtigter die Karte über den Notruf 116 116 gesperrt haben,\
    \ ist jede weitere Nutzung ausgeschlossen.\nLösung: In diesem Fall ist die Karte\
    \ dauerhaft gesperrt. Bitten Sie uns um die Ausstellung einer Ersatzkarte.\n\n\
    4. Technische Probleme beim Händler:\nGelegentlich liegt ein Fehler am Terminal\
    \ des Händlers vor.\nLösung: Versuchen Sie die Zahlung an einem anderen Terminal\
    \ oder mit einer alternativen Zahlungsmethode.\n\nEskalation:\nSollte die Ursache\
    \ nicht unmittelbar ersichtlich sein, leiten wir den Fall stufenweise an die Filialleitung\
    \ und bei Bedarf an die regionale Geschäftsführung weiter, um eine schnelle Klärung\
    \ zu gewährleisten."
