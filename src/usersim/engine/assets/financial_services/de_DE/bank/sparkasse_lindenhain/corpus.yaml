  institution_id: sparkasse_lindenhain
- id: c6c9f4b9-9b35-573c-8c11-48a8c0d32305
  title: Sparkassen-Kreditkarte Gold — rechtliche Hinweise
  body: 'Die Nutzung der Sparkassen-Kreditkarte Gold unterliegt den gesetzlichen Bestimmungen
    der Bundesrepublik Deutschland sowie den aufsichtsrechtlichen Vorgaben der BaFin
    und der Deutschen Bundesbank.


    **Einlagensicherung und Haftung**

    Obwohl die Sparkassen-Kreditkarte Gold ein Kreditinstrument ist, sind die mit
    ihr verknüpften Guthaben auf Ihrem Verrechnungskonto durch die gesetzliche Einlagensicherung
    bis zu einem Betrag von 100.000 € geschützt. Im Falle eines Kartenverlusts ist
    die sofortige Sperrung über den Notruf 116 116 essenziell. Bei rechtzeitiger Meldung
    wird die Haftung des Kunden gemäß den gesetzlichen Fristen des BGB auf maximal
    50 € begrenzt.


    **Kosten und Entgelte**

    Das Jahresentgelt von 84 € sowie das Fremdwährungsentgelt von 1,75 % sind Bestandteile
    des Vertrages. Änderungen dieser Entgelte werden Ihnen sachlich und transparent
    mitgeteilt. Wir weisen darauf hin, dass wir keine individuelle Steuer- oder Rechtsberatung
    erbringen; unsere Produktberatung ist auf finanzielle Aufklärung und die Vermittlung
    unserer Produkte beschränkt.


    **Identitätsprüfung und Sicherheit**

    Vor jeder zustandsändernden Aktion, wie etwa einer Änderung des Verfügungsrahmens
    von 5.000 €, erfolgt eine strikte Identitätsprüfung. Die starke Kundenauthentifizierung
    ist insbesondere bei Online-Zahlungen und sensiblen Vertragsänderungen zwingend
    erforderlich, um den Schutz Ihrer Daten und Ihres Vermögens zu gewährleisten.


    **Datenschutz**

    Alle Prozesse folgen strikt den aktuellen Datenschutzrichtlinien. Die Verarbeitung
    Ihrer Daten erfolgt ausschließlich zur Abwicklung des Kreditvertrages und zur
    Gewährleistung einer gesetzeskonformen Kundenbehandlung gemäß dem Zahlungskontengesetz.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bc25197e-f0a2-57e8-bc17-4e06222dc358
  title: Sparkassen-Kreditkarte Gold — Zinsübersicht
  body: 'Für die Sparkassen-Kreditkarte Gold gelten spezifische Konditionen für die
    Abwicklung internationaler Transaktionen. Da es sich bei diesem Produkt primär
    um eine Kreditkarte zur weltweiten Zahlung handelt, liegt der Fokus der Raten
    auf der Währungsumrechnung.


    **Fremdwährungsentgelt**

    Für alle Zahlungen, die in einer anderen Währung als Euro getätigt werden, wird
    ein einheitlicher Satz von 1,75 % erhoben. Dieser Prozentsatz gilt unabhängig
    von der Höhe des Betrags oder dem Land der Transaktion.


    **Anwendung und Abrechnung**

    Das Entgelt von 1,75 % wird auf den umgerechneten Euro-Betrag der Transaktion
    aufgeschlagen. Die Abrechnung erfolgt transparent auf Ihrer monatlichen Kreditkartenabrechnung.
    Es gibt keine gestaffelten Sätze; der Wert von 1,75 % ist für alle Inhaber der
    Sparkassen-Kreditkarte Gold identisch.


    **Änderungsvorbehalte**

    Sollten sich die marktüblichen Konditionen oder gesetzliche Vorgaben ändern, behalten
    wir uns eine Anpassung des Entgelts vor. Über solche Änderungen werden Sie rechtzeitig
    und transparent informiert.'
