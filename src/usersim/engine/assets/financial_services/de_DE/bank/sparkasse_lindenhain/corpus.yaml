- id: 3947e974-a7ad-5a7d-b786-aaeba4bbc0da
  title: Girokonto Komfort mit Sparkassen-Card — Änderung der Bedingungen
  body: 'Die Geschäftsbeziehung zwischen der Sparkasse Lindenhain und dem Kontoinhaber
    unterliegt den geltenden Allgemeinen Geschäftsbedingungen. Im Rahmen des Girokonto
    Komfort mit Sparkassen-Card behalten wir uns das Recht vor, die Bedingungen sowie
    die Entgelte anzupassen, um die Qualität unserer regionalen Infrastruktur dauerhaft
    zu gewährleisten.


    Das monatliche Kontoführungsentgelt ist derzeit mit 7,50 € festgelegt. Änderungen
    dieses Entgelts werden Ihnen mit einer angemessenen Frist schriftlich mitgeteilt.
    Sie haben das Recht, der Änderung innerhalb der angegebenen Frist zu widersprechen,
    was in der Regel zur Kündigung des Kontoverhältnisses führt.


    Bezüglich der Kreditrahmen gelten die vereinbarten Zinskonditionen. Für den Dispositionskredit
