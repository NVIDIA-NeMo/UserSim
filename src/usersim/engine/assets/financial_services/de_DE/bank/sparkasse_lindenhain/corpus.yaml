- id: 14249869-5331-5313-aa90-69a62c4ec33c
  title: Sparkassen-Baufinanzierung — Voraussetzungen und Abschluss
  body: 'Hier finden Sie Antworten zu den Voraussetzungen für den Abschluss oder eine
    Anpassung Ihrer Sparkassen-Baufinanzierung.


    **Welche Voraussetzungen muss ich für eine Baufinanzierung erfüllen?**

    Zentral ist eine positive Kreditwürdigkeitsprüfung. Wir analysieren Ihr Einkommen,
    Ihre bestehenden Verpflichtungen und den Wert der zu finanzierenden Immobilie.
    Da wir eine sorgfältige Prüfung vornehmen, können wir eine Kreditzusage niemals
    ohne finale Prüfung garantieren.


    **Kann ich als bestehender Kunde meine Zinsbindung ändern?**

    Eine Änderung der Zinsbindung während eines laufenden Vertrages ist in der Regel
    nur bei einem Neuabschluss oder einer Umschuldung möglich. Wir prüfen gerne für
    Sie, ob ein Wechsel auf eine aktuelle Bindung von 10 Jahren (3,68 %) oder 15 Jahren
    (3,91 %) wirtschaftlich sinnvoll ist.


    **Welche Dokumente werden für den Abschluss benötigt?**

    Wir benötigen in der Regel Einkommensnachweise, einen aktuellen Personalausweis
    sowie Unterlagen zum Objekt (z. B. Grundbuchauszug, Flurkarte). Weitere Informationen
    finden Sie im Dokument Sparkassen-Baufinanzierung — erforderliche Unterlagen.'
