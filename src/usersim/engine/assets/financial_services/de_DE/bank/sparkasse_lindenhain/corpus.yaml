- id: f83d13b7-d616-51d1-9a20-c9d487936d80
  title: Sparkassen-Privatkredit — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Inanspruchnahme des Sparkassen-Privatkredits
    bei der Sparkasse Lindenhain. Sie dienen als verbindliche Grundlage für die Zusammenarbeit
    zwischen dem Institut und dem Kunden.


    1. Kreditrahmen und Gewährung: Der maximale Kreditbetrag für diesen Produkttyp
    ist auf 50.000 € begrenzt. Die tatsächliche Höhe des gewehrten Kredits steht unter
    dem Vorbehalt einer positiven Kreditwürdigkeitsprüfung. Eine Kreditzusage ist
    erst mit der finalen Prüfung und Unterzeichnung des Kreditvertrages rechtsgültig.


    2. Zahlungsverpflichtungen: Der Kunde verpflichtet sich, die vereinbarten monatlichen
    Raten sowie die anfallenden Zinsen fristgerecht auf das vereinbarte Konto zu leisten.
    Im repräsentativen Beispiel entspricht dies einer monatlichen Rate von 194,75
    € bei einem Darlehensbetrag von 10.000 € und einer Laufzeit von 60 Monaten.


    3. Zinsgrundlagen: Die Verzinsung erfolgt auf Basis des effektiven Jahreszinses.
    Im repräsentativen Beispiel beträgt dieser 6,49 %. Änderungen der Zinskonditionen
    sind nur innerhalb der vertraglich festgelegten Rahmen oder bei gesetzlichen Änderungen
    möglich.


    4. Vorzeitige Tilgung: Der Kunde hat das Recht, den Kredit ganz oder teilweise
    vorzeitig zurückzuzahlen. Die Bedingungen für eine vorzeitige Ablösung richten
    sich nach den gesetzlichen Vorgaben des BGB.


    5. Vertragsänderungen und Kündigung: Änderungen des Vertrages bedürfen der Schriftform.
    Die Sparkasse Lindenhain kann den Kreditvertrag bei einer erheblichen Verschlechterung
    der Kreditwürdigkeit oder bei anhaltendem Zahlungsverzug gemäß den gesetzlichen
    Bestimmungen kündigen.


    6. Aufsicht und Recht: Alle Prozesse folgen strikt dem BGB, dem Zahlungskontengesetz
    und den Datenschutzrichtlinien. Wir agieren unter der Aufsicht der BaFin und der
    Deutschen Bundesbank. Die gesetzliche Einlagensicherung schützt Guthaben bis 100.000
    €.


    Für detaillierte Informationen zur Zinsberechnung siehe Sparkassen-Privatkredit
    — wie Zinsen berechnet und angewendet werden.'
