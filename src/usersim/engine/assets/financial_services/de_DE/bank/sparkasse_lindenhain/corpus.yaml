- id: cde864a2-eeb1-5a8f-8d45-e0d0d54a2ff3
  title: Sparkassen-Baufinanzierung — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf eine Sparkassen-Baufinanzierung nicht
    wie gewünscht voranschreitet oder nicht bewilligt wird. Hier finden Sie die Analyse
    der häufigsten Symptome und die entsprechenden Lösungen.


    **Symptom: Der Kreditantrag ist seit längerer Zeit im Status „in Prüfung“ und
    es erfolgt keine Rückmeldung.**

    - **Mögliche Ursache**: Es fehlen notwendige Unterlagen für die Kreditwürdigkeitsprüfung
    (z. B. aktuelle Gehaltsnachweise oder ein aktuelles Gutachten der Immobilie).

    - **Was zu prüfen ist**: Überprüfen Sie, ob Sie alle in der Sparkassen-Baufinanzierung
    — Voraussetzungen genannten Dokumente vollständig eingereicht haben.

    - **Lösung**: Reichen Sie die fehlenden Unterlagen zeitnah nach. Wir bestätigen
    Ihnen den Erhalt und setzen die Prüfung fort.


    **Symptom: Die gewünschte Zinsbindung (z. B. 15 Jahre zu 3,91 %) wurde nicht gewährt.**

    - **Mögliche Ursache**: Die Beleihungsquote ist zu hoch oder die Bonitätsprüfung
    hat ein höheres Risiko ergeben, als für dieses spezifische Produktvorgaben vorliegen.

    - **Lösung**: Besprechen Sie mit Ihrem Filialmitarbeiter alternative Optionen,
    wie etwa eine Erhöhung des Eigenkapitaleinsatzes oder eine kürzere Zinsbindung
    (z. B. 10 Jahre zu 3,68 %), um die Annahmewahrscheinlichkeit zu erhöhen.


    **Eskalationsweg**:

    Sollten Sie mit der Entscheidung oder der Bearbeitungsdauer nicht einverstanden
    sein, erfolgt die Eskalation stufenweise: Zunächst wenden Sie sich an Ihren zuständigen
    Filialmitarbeiter. Bei ausbleibender Lösung wird der Vorgang an die Filialleitung
    und bei Bedarf an die regionale Geschäftsführung der Sparkasse Lindenhain geleitet.


    Sie erhalten über jeden Schritt der Eskalation eine förmliche schriftliche Mitteilung
    oder eine entsprechende Antwort in Ihrem Beratungsgespräch.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 49ac1f41-3332-528b-9592-26063d6762b7
  title: Sparkassen-Baufinanzierung — Voraussetzungen
  body: 'Die Gewährung einer Sparkassen-Baufinanzierung unterliegt einer strikten
    Prüfung, um eine nachhaltige und faire Kreditvergabe zu gewährleisten. Die folgende
    Matrix beschreibt die Voraussetzungen für eine erfolgreiche Kreditzusage:


    | Voraussetzung | Bedingung | Ergebnis |

    | :--- | :--- | :--- |

    | **Identität** | Gültiges Identitätsdokument (Personalausweis/Reisepass) | Zwingend
    erforderlich für Vertragsabschluss |

    | **Bonität** | Positive Auskunft der Kreditreferenzbüros; ausreichendes regelmäßiges
    Einkommen | Grundlage für die Zusage von 3,68 % bzw. 3,91 % Zinsen |

    | **Objektwert** | Werthaltigkeit der Immobilie (nachgewiesen durch Gutachten/Marktpreisanalyse)
    | Bestimmt die maximale Darlehenssumme (Beleihungsauslauf) |

    | **Eigenkapital** | Mindestanteil an Eigenmitteln zur Absicherung der Finanzierung
    | Beeinflusst die endgültige Zinskondition und Kreditbewilligung |

    | **Sicherung** | Zustimmung zur Bestellung einer Grundschuld zugunsten der Sparkasse
    Lindenhain | Zwingende Voraussetzung für die Auszahlung |


    Die finale Entscheidung über die Kreditvergabe erfolgt ausschließlich nach der
    individuellen Prüfung aller genannten Kriterien durch unsere Fachabteilungen.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 54d92012-1f48-5d73-b25d-902a6cff3730
  title: Sparkassen-Baufinanzierung — im Vergleich zu einem ähnlichen Produkt des
    Hauses
  body: 'Für die Finanzierung von Anschaffungen bietet die Sparkasse Lindenhain verschiedene
    Instrumente an. Hier vergleichen wir die Sparkassen-Baufinanzierung mit dem Sparkassen-Privatkredit.


    **Vergleich der Merkmale**:


    - **Zweck**: Die Baufinanzierung ist spezifisch für den Erwerb oder Bau von Immobilien
    konzipiert. Der Privatkredit ist eine flexible Lösung für individuelle Anschaffungen
    (z. B. Möbel oder Elektronik).

    - **Konditionen**: Aufgrund der Absicherung durch eine Grundschuld bietet die
    Baufinanzierung deutlich niedrigere Zinsen (z. B. 3,68 % bei 10 Jahren Zinsbindung).
    Beim Privatkredit ist der effektive Jahreszins aufgrund der fehlenden dinglichen
    Sicherheit höher.

    - **Laufzeit**: Baufinanzierungen sind langfristig angelegt (oft über Jahrzehnte),
    während Privatkredite in der Regel kürzere Laufzeiten haben.

    - **Sondertilgungen**: Die Baufinanzierung erlaubt eine jährliche Sondertilgung
    von 5 % der ursprünglichen Summe.


    **Empfehlung**:

    Die Sparkassen-Baufinanzierung ist die richtige Wahl, wenn Sie eine Immobilie
    erwerben möchten und eine langfristige, kostengünstige Planungssicherheit suchen.
    Der Sparkassen-Privatkredit eignet sich hingegen für kleinere, kurzfristigere
    Finanzierungsbedarfe ohne die Notwendigkeit einer Immobilienbesicherung.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f7ec7f49-837c-5069-94fa-36698200c275
  title: Sparkassen-Baufinanzierung — rechtliche Hinweise
  body: 'Die Sparkassen-Baufinanzierung wird unter der Aufsicht der BaFin und der
    Deutschen Bundesbank angeboten. Alle Prozesse bei der Vergabe und Verwaltung dieses
    Kredits folgen strikt den Vorgaben des Bürgerlichen Gesetzbuches (BGB) sowie den
    geltenden Datenschutzrichtlinien.


    **Zinsrisiken und Bindungen**:

    Die vereinbarten Zinssätze von 3,68 % (für 10 Jahre) bzw. 3,91 % (für 15 Jahre)
    sind für die jeweilige Dauer der Sollzinsbindung festgeschrieben. Kunden werden
    darauf hingewiesen, dass nach Ablauf dieser Bindungsfrist ein Zinsänderungsrisiko
    besteht. Der Zinssatz für die Anschlussfinanzierung richtet sich nach den dann
    gültigen Marktkonditionen, was zu einer Erhöhung oder Senkung der monatlichen
    Rate führen kann.


    **Sondertilgungen und Vorfälligkeit**:

    Gemäß den vertraglichen Vereinbarungen ist eine jährliche Sondertilgung von 5
    % der ursprünglichen Darlehenssumme ohne Vorfälligkeitsentschädigung zulässig.
    Tilgungen, die über diesen Rahmen hinausgehen oder außerhalb der vereinbarten
    Bedingungen erfolgen, können eine Vorfälligkeitsentschädigung gemäß den gesetzlichen
    Bestimmungen des BGB auslösen.


    **Einlagensicherung**:

    Obwohl es sich hierbei um ein Kreditprodukt handelt, ist die Sparkasse Lindenhain
    Mitglied der gesetzlichen Einlagensicherung, welche Guthaben bis zu einem Betrag
    von 100.000 € schützt.


    **Beratungshintergrund**:

    Wir erbringen im Rahmen der Produktberatung eine professionelle Aufklärung über
    die Finanzierungsoptionen. Wir weisen ausdrücklich darauf hin, dass wir keine
    individuelle Steuer- oder Rechtsberatung durchführen. Für spezifische steuerliche
    Fragen zum Immobilienkauf empfehlen wir die Konsultation eines Steuerberaters.


    Alle Kreditzusagen erfolgen erst nach einer finalen, positiven Kreditwürdigkeitsprüfung
    und sind bis zur Unterzeichnung des Vertrages unverbindlich.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f9bdfd23-e294-5e84-94fd-59df5ee07a03
  title: Sparkassen-Baufinanzierung — Zinsübersicht
  body: 'In dieser Übersicht finden Sie die aktuellen Zinssätze für die Sparkassen-Baufinanzierung.
    Die Wahl der Zinsbindung ermöglicht es Ihnen, die Kosten für Ihr Darlehen über
    einen festgelegten Zeitraum abzusichern.


    **Aktuelle Sollzinssätze**:

    - **10 Jahre Zinsbindung**: 3,68 %

    - **15 Jahre Zinsbindung**: 3,91 %


    **Anwendbarkeit**:

    Diese Zinssätze gelten für Neuanträge und sind abhängig von einer positiven Kreditwürdigkeitsprüfung
    sowie dem Grad der Immobilienbesicherung (Beleihungsquote). Ein höherer Eigenkapitalanteil
    kann in Einzelfällen zu einer weiteren Optimierung der Konditionen führen.


    **Zusatzkonditionen**:

    - **Sondertilgungsrecht**: In alle Verträge ist eine kostenfreie jährliche Sondertilgung
    in Höhe von 5 % der ursprünglichen Darlehenssumme integriert.


    Die Zinsen werden auf die Restschuld berechnet und sind Teil Ihrer monatlichen
    Annuitätenrate, die sowohl Zins als auch Tilgung umfasst.'
