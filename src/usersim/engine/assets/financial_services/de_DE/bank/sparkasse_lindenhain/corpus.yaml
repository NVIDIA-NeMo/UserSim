- id: c6dd61ac-8d60-55db-8e05-58dce19a0ad3
  title: Girokonto Komfort mit Sparkassen-Card — fehlgeschlagener oder ausstehender
    Vorgang
  body: 'Es kann vorkommen, dass eine Zahlung oder eine Transaktion mit Ihrem Girokonto
    Komfort mit Sparkassen-Card nicht wie gewünscht ausgeführt wurde. Hier finden
    Sie die systematische Vorgehensweise zur Behebung des Problems.


    Symptom: Eine Zahlung wurde abgelehnt oder wird als ''ausstehend'' angezeigt.


    Mögliche Ursachen und Prüfschritte:

    1. Prüfung des Kontostands: Stellen Sie sicher, dass ausreichende Deckung vorhanden
    ist. Überprüfen Sie, ob Ihr vereinbarter Dispositionskredit (verzinst mit 11,49
    %) bereits ausgeschöpft ist oder ob eine geduldete Überziehung (verzinst mit 14,49
    %) vorliegt, die durch unsere internen Limits begrenzt sein könnte.

    2. Status der Sparkassen-Card: Prüfen Sie, ob Ihre Karte eventuell gesperrt wurde
    oder das Ablaufdatum überschritten ist. Bei einem Kartenverlust sollte die sofortige
    Sperrung über den Notruf 116 116 erfolgen.

    3. Verifizierung des Empfängers: Stellen Sie sicher, dass alle Kontodaten des
    Zahlungsempfängers korrekt eingegeben wurden.


    Lösungsweg:

    - Falls die Deckung ausreicht und die Karte aktiv ist, bitten wir Sie, uns den
    konkreten Vorgang zu schildern. Wir prüfen in diesem Fall die Transaktionsdetails
    in unserem System.

    - Bei technischen Fehlern im Online-Banking führen wir eine Überprüfung der starken
    Kundenauthentifizierung durch.


    Eskalation:

    Sollte die Ursache nicht unmittelbar ersichtlich sein, leiten wir den Fall stufenweise
    an die Filialleitung und bei Bedarf an die regionale Geschäftsführung weiter.
    Wir informieren Sie zeitnah über das Ergebnis der Untersuchung und die notwendigen
    Schritte zur Bereinigung des Vorgangs.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
