- id: e9db29c1-2f4d-535b-b03a-ef3d56e9c961
  title: Sparkassen-Baufinanzierung — wie Zinsen berechnet und angewendet werden
  body: "Die Zinsen für die Sparkassen-Baufinanzierung werden als Sollzinsen auf Basis\
    \ des jeweils ausstehenden Restdarlehensbetrags berechnet. Je nach gewählter Zinsbindungsfrist\
    \ kommen folgende Sätze zur Anwendung:\n\n- Bei einer Zinsbindung von 10 Jahren\
    \ gilt ein Zinssatz von 3,68 %.\n- Bei einer Zinsbindung von 15 Jahren gilt ein\
    \ Zinssatz von 3,91 %.\n\nDie Anwendung erfolgt wie folgt:\nDie Zinsen werden\
    \ jährlich berechnet und über die monatlichen Raten (Zins und Tilgung) eingezogen.\
    \ Da es sich um eine Annuitätendarlehensstruktur handelt, sinkt der Zinsanteil\
    \ innerhalb der Bindungsfrist kontinuierlich, da die Tilgung den Restbetrag reduziert.\
    \ \n\nÄnderungen der Zinsen treten nur in folgenden Fällen ein:\n1. Ablauf der\
    \ gewählten Zinsbindungsfrist: Nach 10 bzw. 15 Jahren wird der Zinssatz an das\
    \ aktuelle Marktniveau angepasst.\n2. Vertragliche Anpassungen: Im Rahmen einer\
    \ Umschuldung oder Tarifänderung kann ein neuer Zins vereinbart werden, sofern\
    \ die Kreditwürdigkeitsprüfung dies zulässt.\n\nDie jährliche Sondertilgung von\
    \ 5 % reduziert die Restschuld direkt und führt somit unmittelbar zu einer geringeren\
    \ Zinslast in den Folgemonaten."
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: rate_sheet
