- id: 8f133b84-77a3-565d-a489-7147aedf2cdb
  title: Sparkassen-Privatkredit — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Sparkassen-Privatkredit vorzeitig beenden oder Anpassungen
    an Ihrem Vertrag vornehmen möchten, folgen Sie bitte diesen Schritten. Da es sich
    um einen Kreditvertrag handelt, bedeutet ein ''Schließen'' in der Regel die vollständige
    Tilgung der Restschuld.


    **Voraussetzungen:**

    Sie benötigen Ihren aktuellen Kreditvertragsnummer und einen gültigen Identitätsnachweis.
    Bei einer Gesamttilgung müssen die noch offenen Beträge inklusive etwaiger Zinsen
    bis zum Tag der Ablösung verfügbar sein.


    **Schritt-für-Schritt-Anleitung:**


    1. **Anforderung der Ablösesumme:** Bitten Sie uns um die Berechnung der aktuellen
    Restschuld inklusive der Zinsen bis zum gewünschten Datum der Ablösung. Wir werden
    Ihnen den exakten Betrag nennen, der zur vollständigen Schließung des Kredits
    erforderlich ist.


    2. **Einigung über die Tilgungsart:** Teilen Sie uns mit, ob die Tilgung über
    eine einmalige Zahlung von Ihrem Girokonto bei uns erfolgt oder ob Sie die Summe
    von einem externen Konto überweisen.


    3. **Durchführung der Zahlung:** Sobald die Ablösesumme feststeht, führen wir
    die Buchung durch oder bestätigen den Eingang Ihrer Zahlung. Bei einem Tarifwechsel
    prüfen wir zunächst, ob eine Anpassung der Konditionen (z. B. Verlängerung der
    Laufzeit über die ursprünglichen 60 Monate hinaus oder Änderung der Rate) aufgrund
    Ihrer aktuellen Bonität möglich ist.


    4. **Bestätigung der Vertragsbeendigung:** Nach dem vollständigen Eingang der
    Restschuld senden wir Ihnen eine schriftliche Bestätigung über die Ablösung des
    Kredits und die damit verbundene Schließung des Kreditkontos zu.


    **Ergebnis:**

    Ihr Kreditkonto ist ausgeglichen und der Vertrag ist beendet. Sie erhalten ein
    entsprechendes Dokument für Ihre Unterlagen, das die Schuldenfreiheit gegenüber
    der Sparkasse Lindenhain bestätigt.


    Für weitere Informationen zu unseren Kreditbedingungen schauen Sie bitte in Sparkassen-Privatkredit
    — Allgemeine Geschäftsbedingungen.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: how_to_guide
