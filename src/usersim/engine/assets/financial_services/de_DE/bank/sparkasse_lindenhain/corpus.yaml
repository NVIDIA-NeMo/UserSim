- id: e7437b89-cfec-553f-b16e-fb74f575e0ca
  title: Sparkassen-Privatkredit — Status oder Verlauf einsehen
  body: 'Wenn Sie bereits einen Sparkassen-Privatkredit nutzen, können Sie jederzeit
    den aktuellen Status Ihres Darlehens sowie den bisherigen Tilgungsverlauf einsehen.
    Gehen Sie dazu wie folgt vor:


    1. Legen Sie uns Ihre Identitätsnachweise vor oder identifizieren Sie sich über
    die starke Kundenauthentifizierung in Ihrem Online-Banking. Dies ist notwendig,
    da Auskünfte über Kontodaten nur nach einer strikten Identitätsprüfung erfolgen
    dürfen.


    2. Fordern Sie eine aktuelle Aufstellung Ihres Kreditkontos an. Wir stellen Ihnen
    eine Übersicht bereit, aus der die ursprüngliche Kreditsumme, der bereits getilgte
    Betrag sowie die noch ausstehende Restschuld hervorgehen.


    3. Überprüfen Sie in der Liste der vergangenen Transaktionen die bereits erfolgten
    Ratenzahlungen. Hier sehen Sie auf einen Blick, an welchen Daten die vereinbarten
    Beträge von Ihrem Referenzkonto abgebucht wurden.


    4. Vergleichen Sie den aktuellen Stand mit Ihrem ursprünglichen Tilgungsplan,
    um sicherzustellen, dass alle Zahlungen plangemäß erfolgt sind.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie eine schriftliche
    oder digitale Bestätigung über den aktuellen Kontostand Ihres Kredits erhalten
    haben, die die Restschuld und das Datum der nächsten anstehenden Rate präzise
    ausweist. Sollten Sie Unstimmigkeiten feststellen, können Sie dies direkt in Ihrem
    Beratungsgespräch ansprechen, woraufhin wir eine detaillierte Prüfung der Buchungen
    vornehmen.'
