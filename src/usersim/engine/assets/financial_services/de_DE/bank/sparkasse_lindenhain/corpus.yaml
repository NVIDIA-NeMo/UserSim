- id: a56c751b-c79b-55ca-8e78-22d1b55cc7e6
  title: Sparkassen-Baufinanzierung — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihre Sparkassen-Baufinanzierung vorzeitig beenden, das Darlehen
    vollständig ablösen oder die Konditionen ändern möchten, ist ein strukturierter
    Prozess erforderlich. Da es sich um langfristige Verträge mit Grundschulden handelt,
    erfolgt die Abwicklung in enger Abstimmung mit uns.


    Was Sie vor Beginn benötigen:

    - Ihre aktuelle Darlehensnummer.

    - Einen aktuellen Nachweis über den Stand Ihres Tilgungsplans.

    - Falls zutreffend: Ein Angebot einer anderen Bank zur Ablösung (Umschuldung).


    Schritte zur Kündigung oder zum Tarifwechsel:


    1. Antrag auf Ablösevertrag: Teilen Sie uns schriftlich oder in einem persönlichen
    Gespräch in Ihrer Filiale mit, dass Sie das Darlehen kündigen oder umschulden
    möchten. Wir prüfen daraufhin Ihren aktuellen Restschuldbetrag und die verbleibende
    Zinsbindungsfrist.


    2. Prüfung der Vorfälligkeit: Wir berechnen für Sie, ob eine Vorfälligkeitsentschädigung
    anfällt. Beachten Sie hierbei, dass Sondertilgungen bis zu 5 % der ursprünglichen
    Summe pro Jahr kostenfrei möglich sind und die Restschuld mindern.


    3. Vereinbarung des Ablösungsdatums: Wir legen gemeinsam mit Ihnen einen Termin
    für die endgültige Zahlung fest. Wir senden Ihnen eine detaillierte Abrechnung
    über den exakten Betrag, der bis zu diesem Datum inklusive aufgelaufener Zinsen
    zu zahlen ist.


    4. Durchführung der Zahlung und Löschung der Grundschuld: Nach Eingang der vollständigen
    Summe bestätigen wir die Ablösung des Kredits. Wir stellen Ihnen die erforderlichen
    Unterlagen zur Teil- oder Gesamtlöschung der im Grundbuch eingetragenen Grundschuld
    aus.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie die schriftliche
    Bestätigung über die Tilgung des Darlehens erhalten und die Löschungsbewilligung
    für das Grundbuchamt vorliegt.


    Sollten Sie lediglich den Tarif oder die Zinsbindung ändern wollen, prüfen wir
    im Rahmen einer neuen Kreditwürdigkeitsprüfung, ob eine Anpassung der Konditionen
    zum aktuellen Marktpreis möglich ist.'
