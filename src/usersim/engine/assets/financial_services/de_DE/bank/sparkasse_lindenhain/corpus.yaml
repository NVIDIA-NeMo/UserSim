- id: b5939f6d-6184-5acd-adac-1a1c510d112a
  title: Sparkassen-Kreditkarte Gold — Empfehlungs- und Treueangebot
  body: 'Die Sparkasse Lindenhain schätzt die Treue unserer Kunden und die Weiterempfehlung
    unseres Hauses in der Region. Wir freuen uns, Ihnen daher ein besonderes Angebot
