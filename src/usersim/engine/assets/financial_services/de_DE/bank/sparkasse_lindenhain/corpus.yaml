- id: 90bff771-94d9-5056-8334-a32cc0af1e60
  title: Sparkassen-Baufinanzierung — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem bestehenden Vertrag der Sparkassen-Baufinanzierung
    vornehmen möchten, wie beispielsweise eine Änderung der monatlichen Tilgungsrate
    oder eine Anpassung der Zinsbindung, gehen Sie bitte wie folgt vor:


    1. Bereitstellung der Vertragsdaten: Halten Sie Ihre Darlehensnummer und Ihre
    aktuellen Unterlagen bereit. Nennen Sie uns bei unserem Gespräch explizit die
    Vertragsnummer, damit wir Ihr Konto sofort identifizieren können.


    2. Mitteilung des Änderungswunsches: Teilen Sie uns genau mit, welche Änderung
    Sie vornehmen möchten. Wenn Sie beispielsweise die Tilgungsrate erhöhen möchten,
    um schneller schuldenfrei zu sein, oder die Zinsbindung anpassen wollen, prüfen
    wir die Machbarkeit basierend auf den aktuellen Konditionen (z. B. 3,68 % für
    10 Jahre oder 3,91 % für 15 Jahre).


    3. Durchführung der Kreditwürdigkeitsprüfung: Da jede Änderung der Kreditstruktur
    die finanzielle Belastung beeinflussen kann, führen wir eine aktualisierte Kreditwürdigkeitsprüfung
    durch. Wir fordern Sie gegebenenfalls auf, aktuelle Einkommensnachweise einzureichen.


    4. Prüfung und Bestätigung durch die Bank: Wir prüfen Ihren Antrag und informieren
    Sie über die Auswirkungen der Änderung auf Ihre monatliche Rate und die Restlaufzeit
    Ihres Darlehens.


    5. Abschluss der Vertragsänderung: Sobald die Prüfung positiv verlaufen ist, erhalten
    Sie von uns eine schriftliche Bestätigung oder einen Nachtrag zum Kreditvertrag.
    Wir bestätigen Ihnen darin die neuen Konditionen und den Zeitpunkt, ab dem die
    geänderte Rate wirksam wird.


    Sollten Sie zusätzlich eine Sondertilgung innerhalb der erlaubten 5 % vornehmen
    wollen, können Sie dies jederzeit durch eine entsprechende Überweisung und Mitteilung
    an uns erledigen.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 3a6248c8-cc72-5004-9c4f-10b1eb089839
  title: Sparkassen-Baufinanzierung — Probleme mit Zugang oder Login
  body: 'Symptom: Sie können sich nicht in Ihr Online-Banking einloggen, um die Details
    Ihrer Sparkassen-Baufinanzierung, wie den aktuellen Kontostand oder den Zinsverlauf,
    einzusehen.


    Mögliche Ursachen:

    - Falsche Eingabe der Zugangsdaten (Benutzername oder PIN).

    - Ihr Zugang wurde aufgrund mehrerer Fehlversuche aus Sicherheitsgründen vorübergehend
    gesperrt.

    - Die starke Kundenauthentifizierung (SCA) schlägt fehl, da die verknüpfte App
    oder das Gerät nicht synchronisiert ist.


    Schritte zur Behebung:

    1. Überprüfung der Dateneingabe: Stellen Sie sicher, dass die Feststelltaste (Caps
    Lock) deaktiviert ist und Sie die korrekten Anmeldedaten verwenden.

    2. Passwort-Reset: Falls Sie Ihre PIN vergessen haben, fordern Sie uns über den
    Gesprächskanal auf, Ihnen einen neuen Zugang zu ermöglichen. Wir werden hierfür
    eine strikte Identitätsprüfung durchführen.

    3. Synchronisation der Authentifizierung: Prüfen Sie, ob Ihre für die starke Kundenauthentifizierung
    genutzte App auf dem neuesten Stand ist. Falls die Bestätigung nicht ankommt,
    fordern Sie uns auf, die Verknüpfung Ihres Geräts zurückzusetzen.


    Wenn diese Schritte nicht zum Erfolg führen, wird das Problem intern eskaliert.
    Wir leiten den Fall stufenweise vom Filialmitarbeiter über die Filialleitung an
    unsere IT-Spezialisten weiter. Sie erhalten von uns eine Benachrichtigung, sobald
    Ihr Zugang wieder vollumfänglich funktioniert.


    Bitte beachten Sie, dass wir aus Sicherheitsgründen niemals Ihre PIN oder TAN
    am Telefon abfragen. Eine erfolgreiche Lösung des Problems erfolgt immer durch
    eine gesicherte Identitätsprüfung.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bf912f84-005d-5107-bc5e-326b1f8c1829
  title: Sparkassen-Baufinanzierung — Zugangsstufen
  body: 'Zur Unterstützung der Kreditvergabe nutzen wir folgende Matrix zur Einstufung
    der Zugangsstufen für die Sparkassen-Baufinanzierung:


    | Bedingung | Ergebnis/Zugangsstufe |

    | :--- | :--- |

    | Nachgewiesene Bonität (sehr gut) + Eigenkapitalquote ≥ 20 % | Standard-Zugang:
    Direkte Prüfung der gewünschten Zinsbindung (z. B. 3,68 % oder 3,91 %) |

    | Nachgewiesene Bonität (gut) + Eigenkapitalquote 10 % - 19 % | Erweiterter Zugang:
    Kreditprüfung mit detaillierter Analyse der Haushaltsrechnung |

    | Nachgewiesene Bonität (ausreichend) + Eigenkapitalquote < 10 % | Eingeschränkter
    Zugang: Zusätzliche Sicherheiten oder Bürgschaften erforderlich |

    | Negative Schufa-Einträge oder unzureichende Bonität | Ablehnung: Keine Kreditzusage
    möglich |


    Alle Stufen unterliegen der finalen Kreditwürdigkeitsprüfung. Eine Zusage erfolgt
    erst nach vollständiger Prüfung aller Unterlagen.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 5503c58f-e29b-5e79-87f6-ea8d0614963b
  title: Sparkassen-Baufinanzierung — zwischen Tarifen wählen
  body: 'Bei der Sparkassen-Baufinanzierung stehen Ihnen verschiedene Optionen der
    Sollzinsbindung zur Verfügung, um die Sicherheit Ihres Eigenheims zu gewährleisten.
    Die Wahl hängt primär von Ihrem Wunsch nach Planungssicherheit gegenüber kurzfristigen
    Kosten ab.


    Option 1: 10 Jahre Zinsbindung

    - Zinssatz: 3,68 %

    - Vorteil: Niedrigerer Zinssatz, was die monatliche Belastung reduziert.

    - Risiko: Nach 10 Jahren muss der Zinssatz für die Restschuld neu verhandelt werden;
    das Risiko steigender Marktzinsen ist höher.


    Option 2: 15 Jahre Zinsbindung

    - Zinssatz: 3,91 %

    - Vorteil: Höhere Planungssicherheit über einen längeren Zeitraum; Sie sind unabhängig
    von Zinssteigerungen für 15 Jahre.

    - Risiko: Ein etwas höherer Zinssatz im Vergleich zur 10-jährigen Bindung.


    Beide Optionen beinhalten die Möglichkeit einer jährlichen Sondertilgung von bis
    zu 5 % der ursprünglichen Summe.


    Empfehlung: Die 10-jährige Bindung zu 3,68 % eignet sich für Kunden, die eine
    geringere aktuelle Rate bevorzugen und eine höhere Flexibilität bei der zukünftigen
    Umschuldung wünschen. Die 15-jährige Bindung zu 3,91 % ist ideal für diejenigen,
    die maximale Sicherheit und eine feste Kalkulationsgrundlage für einen längeren
    Zeitraum suchen.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 1a58016a-d680-51fa-8941-47aab5d078d3
  title: Sparkassen-Baufinanzierung — Datenschutz und Datenverarbeitung
  body: 'Die Sparkasse Lindenhain verarbeitet personenbezogene Daten im Rahmen der
    Sparkassen-Baufinanzierung strikt nach den geltenden Datenschutzrichtlinien der
    DSGVO sowie den Vorgaben der BaFin und der Deutschen Bundesbank. Wir stellen sicher,
    dass Ihre Daten geschützt sind und nur für die Erfüllung des Finanzierungsvertrages
    verwendet werden.


    Zweck der Datenverarbeitung:

    Die Erhebung Ihrer Daten dient primär der Durchführung einer sorgfältigen Kreditwürdigkeitsprüfung.
    Dies umfasst die Analyse Ihrer Einkommensverhältnisse, bestehender Verpflichtungen
    und der Bewertung der im Grundbuch eingetragenen Sicherheiten. Diese Prüfung ist
    zwingend erforderlich, um eine seriöse Kreditvergabe zu gewährleisten und eine
    Überschuldung Ihrer Person zu vermeiden.


    Weitergabe an Dritte:

    Eine Weitergabe Ihrer Daten an Dritte erfolgt nur in den gesetzlich zulässigen
    Fällen. Hierzu gehört die Meldung an Kreditauskunfteien (z. B. SCHUFA) sowie die
    notwendige Kommunikation mit Notaren und dem Grundbuchamt zur Bestellung der Grundschuld.


    Ihre Rechte:

    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern dem keine gesetzlichen
    Aufbewahrungsfristen (z. B. aus dem BGB oder steuerrechtlichen Vorgaben) entgegenstehen.


    Sicherheit der Verarbeitung:

    Wir setzen modernste technische und organisatorische Maßnahmen ein, um Ihre Daten
    vor unbefugtem Zugriff zu schützen. Besonders bei sensiblen Vertragsänderungen
    ist die starke Kundenauthentifizierung zwingend erforderlich. Alle Prozesse folgen
    dem Ziel einer fairen und gesetzeskonformen Kundenbehandlung.


    Für weitere Informationen zu unseren rechtlichen Rahmenbedingungen können Sie
    auch das Dokument Sparkassen-Baufinanzierung — rechtliche Hinweise konsultieren.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 8b07f7c8-dbb7-5b59-b9b5-906541d21a28
  title: Sparkassen-Baufinanzierung — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Zusammenhang mit der Finanzierung von Immobilien gibt es verschiedene
    Betrugsmuster, die darauf abzielen, sensible Daten oder Gelder von Kunden zu entwenden.
    Wir möchten Sie darauf aufmerksam machen, wie Sie diese erkennen und sich schützen
    können.


    Ein häufiges Muster sind gefälschte E-Mails oder SMS, die Ihnen extrem niedrige
    Zinssätze anbieten, die weit unter unseren marktüblichen Konditionen wie beispielsweise
    3,68 % oder 3,91 % liegen. Diese Nachrichten fordern Sie oft dazu auf, über einen
    externen Link persönliche Dokumente oder Kontodaten hochzuladen. Bitte beachten
    Sie: Die Sparkasse Lindenhain wird Sie niemals per E-Mail oder SMS zur Eingabe
    von Passwörtern, PINs oder zur Übermittlung von TANs auffordern.


    Ein weiteres Warnsignal ist die Forderung nach sogenannten „Bearbeitungsgebühren“
    oder „Vorauszahlungen für Versicherungen“, die über externe Konten abgewickelt
    werden sollen, bevor ein Kreditvertrag finalisiert wird. Seriöse Kreditvergaben
    erfolgen nach einer sorgfältigen Kreditwürdigkeitsprüfung und einer transparenten
    Vertragsgestaltung gemäß den Richtlinien der BaFin und der Deutschen Bundesbank.


    Sollten Sie eine Nachricht erhalten, die Ihnen verdächtig vorkommt, oder haben
    Sie bereits sensible Daten an einen unbekannten Dritten übermittelt, informieren
    Sie uns bitte umgehend. Wir prüfen den Vorgang zeitnah gemäß den gesetzlichen
    Fristen des BGB. Eine sofortige Meldung hilft uns, Ihr Konto und Ihre Daten zu
    schützen und mögliche Folgeschäden zu begrenzen.


    Verlassen Sie sich bei Ihren Finanzentscheidungen auf die persönliche Beratung
    in unseren Filialen oder unsere offiziellen Kommunikationskanäle. Vertrauen und
    regionale Präsenz sind die Grundpfeiler unserer Arbeit für Ihre Sicherheit.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f9a91604-fcc9-510a-8045-4367d0518ab4
  title: Sparkassen-Baufinanzierung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient der internen Unterstützung von Mitarbeitern bei der
    Beratung zur Sparkassen-Baufinanzierung. Es beschreibt die strukturellen Grenzen
    und spezifischen Konditionen des Produkts.


    Die Sparkassen-Baufinanzierung ist an feste Zinsbindungszeiträume gebunden, die
    für den Kunden eine Planungssicherheit bieten. Aktuell gelten folgende Konditionen
    für die Sollzinsbindung:

    - Bei einer Zinsbindung von 10 Jahren beträgt der Zinssatz 3,68 %.

    - Bei einer Zinsbindung von 15 Jahren beträgt der Zinssatz 3,91 %.


    Ein wesentlicher Punkt bei der Beratung sind die Möglichkeiten zur vorzeitigen
    Tilgung. Um die finanzielle Stabilität des Instituts und die kalkulierten Zinserträge
    zu gewährleisten, ist die jährliche Sondertilgung auf 5 % der ursprünglichen Darlehenssumme
    begrenzt. Überschreitungen dieses Rahmens können eine Vorfälligkeitsentschädigung
    gemäß BGB auslösen, sofern keine anderen vertraglichen Vereinbarungen getroffen
    wurden.


    Sonderfälle treten insbesondere bei der Finanzierung von nicht-standardisierten
    Objekten (z. B. sehr alte Bestandsimmobilien oder spezielle gewerbliche Mischformen)
    auf. In diesen Fällen kann eine individuelle Prüfung der Kreditwürdigkeit und
    des Objektwertes erforderlich sein. Eine Kreditzusage erfolgt niemals ohne diese
    finale Prüfung.


    Die Sparkassen-Baufinanzierung ist nicht geeignet für kurzfristige Liquiditätsbedarfe.
    Für solche Anliegen sollte auf andere Produkte wie den Sparkassen-Privatkredit
    verwiesen werden. Die Kreditvergabe erfolgt unter strikter Einhaltung der Datenschutzrichtlinien
    und der Aufsicht durch die BaFin sowie die Deutsche Bundesbank.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 1aab455a-373f-5eae-942d-dda414c19b02
  title: Sparkassen-Baufinanzierung — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den wichtigsten Kostenfragen rund um unsere
    Sparkassen-Baufinanzierung.


    **Welche Zinssätze gelten aktuell für die Baufinanzierung?**

    Die Höhe des Zinses hängt von der gewählten Sollzinsbindung ab. Für eine Bindung
    von 10 Jahren beträgt der Zinssatz 3,68 %, während er für eine Bindung von 15
    Jahren bei 3,91 % liegt.


    **Gibt es Gebühren für die Kontoführung im Zusammenhang mit dem Kredit?**

    Die Baufinanzierung selbst ist ein Darlehensprodukt. Für die Abwicklung der Ratenzahlungen
    benötigen Sie ein Girokonto. Wir empfehlen hierzu das Girokonto Komfort mit Sparkassen-Card,
    welches ein monatliches Entgelt von 7,50 € aufweist, um die regionale Infrastruktur
    und den persönlichen Service zu finanzieren.


    **Kann ich außer den monatlichen Raten zusätzliche Beträge zurückzahlen?**

    Ja, Sie haben die Möglichkeit, eine jährliche Sondertilgung von bis zu 5 % der
    Darlehenssumme vorzunehmen, ohne dass zusätzliche Kosten entstehen.


    Weitere Details entnehmen Sie bitte dem Dokument Sparkassen-Baufinanzierung —
    Preis- und Leistungsverzeichnis.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: faq
  source_authority: official
