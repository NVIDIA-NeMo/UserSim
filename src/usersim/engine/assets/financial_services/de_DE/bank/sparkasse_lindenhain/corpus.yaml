- id: 97c32394-38f0-5327-9bcf-16795d9c9a99
  title: 'Girokonto Komfort mit Sparkassen-Card — Dispozins: Erklärung'
  body: 'Was ist der Dispozins beim Girokonto Komfort mit Sparkassen-Card?

    Der Dispozins ist der Zinssatz, den Sie zahlen, wenn Sie Ihr Konto im Rahmen eines
    vereinbarten Dispositionskredits überziehen. Für das Girokonto Komfort mit Sparkassen-Card
    beträgt dieser Zinssatz 11,49 %.


    Wie unterscheidet sich der Dispozins vom Zins für geduldete Überziehungen?

    Ein Dispositionskredit ist ein im Vorfeld vereinbarter Rahmen. Wenn Sie diesen
    Rahmen überschreiten oder keine entsprechende Vereinbarung haben, aber dennoch
    eine Überziehung erfolgt, spricht man von einer geduldeten Überziehung. Hierfür
    gilt ein höherer Zinssatz von 14,49 %.


    Wie wird der Dispozins berechnet?

    Die Zinsen werden tagesgenau auf den überzogenen Betrag berechnet und in der Regel
    einmal monatlich Ihrem Konto belastet. Dies ermöglicht Ihnen eine flexible Nutzung
    Ihres Kontos, während die Kosten transparent bleiben.


    Weitere Einzelheiten zur Zinsanwendung finden Sie in Girokonto Komfort mit Sparkassen-Card
    — wie Zinsen berechnet und angewendet werden.'
