- id: 57b5f320-f44a-5f4d-b262-62d1b6f5636b
  title: Sparkassen-Baufinanzierung — ein typisches Anliegen vollständig erledigen
  body: "Ein häufiges Anliegen unserer Kunden ist die Durchführung einer jährlichen\
    \ Sondertilgung, um die Restschuld zu senken und die Zinslast zu reduzieren. So\
    \ erledigen Sie diesen Vorgang vollständig:\n\n1. Teilen Sie uns mit, dass Sie\
    \ eine Sondertilgung für Ihr Darlehen vornehmen möchten. Nennen Sie uns dabei\
    \ den genauen Betrag, den Sie zusätzlich zur regulären Rate zurückzahlen wollen.\n\
    2. Wir prüfen, ob dieser Betrag innerhalb der vereinbarten jährlichen Grenze von\
    \ 5 % der ursprünglichen Darlehenssumme liegt. \n3. Sofern der Betrag innerhalb\
    \ der 5 %-Grenze liegt, bestätigen wir Ihnen die Annahme der Zahlung. Falls der\
    \ Betrag darüber liegt, weisen wir Sie auf die mögliche Vorfälligkeitsentschädigung\
    \ gemäß BGB hin und bieten Ihnen eine Berechnung der Kosten an.\n4. Sie überweisen\
    \ den Betrag auf das angegebene Konto oder wir buchen ihn von Ihrem Girokonto\
    \ (z. B. Girokonto Komfort) ab.\n5. Nach Eingang der Zahlung erhalten Sie von\
    \ uns eine aktualisierte Übersicht Ihres Darlehensverlaufs. In dieser sehen Sie\
    \ die reduzierte Restschuld und die daraus resultierende Zinsersparnis für die\
    \ verbleibende Laufzeit der Zinsbindung (z. B. bei 3,68 % oder 3,91 %).\n\nMit\
    \ diesem Prozess ist Ihr Anliegen vollständig abgeschlossen. Sie haben Ihre Schulden\
    \ effektiv reduziert und Ihre finanzielle Planung optimiert."
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: how_to_guide
