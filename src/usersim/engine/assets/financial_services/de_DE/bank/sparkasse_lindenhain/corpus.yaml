- id: 646bcd46-7c8e-558c-8747-972b788fcf47
  title: 'Sparkassen-Baufinanzierung — jährliche Sondertilgung: Erklärung'
  body: 'Was genau ist eine jährliche Sondertilgung bei der Sparkassen-Baufinanzierung?

    Die Sondertilgung ermöglicht es Ihnen, zusätzlich zu Ihren regulären monatlichen
    Raten einen größeren Betrag direkt auf die Restschuld Ihres Darlehens zu zahlen.
    Dadurch verringert sich die Kreditsumme schneller, was die Gesamtzinslast senkt
    und die Gesamtlaufzeit Ihrer Finanzierung verkürzt.


    Wie hoch ist der Betrag, den ich jährlich zusätzlich tilgen darf?

    Im Rahmen der Sparkassen-Baufinanzierung ist es Ihnen gestattet, jedes Jahr bis
    zu 5 % der ursprünglichen Darlehenssumme als Sondertilgung zu leisten, ohne dass
    hierfür eine Vorfälligkeitsentschädigung oder andere Gebühren anfallen.


    Wie löse ich eine Sondertilgung aus?

    Sie können den gewünschten Betrag einfach auf Ihr Konto bei uns überweisen und
    uns mitteilen, dass dieser als Sondertilgung für Ihre Baufinanzierung verwendet
    werden soll. Wir verrechnen den Betrag zeitnah mit Ihrer Restschuld.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: faq
  source_authority: official
