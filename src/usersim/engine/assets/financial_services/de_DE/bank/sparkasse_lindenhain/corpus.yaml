  title: Sparkassen-Privatkredit — aktuelles Angebot
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    als treuer Kunde der Sparkasse Lindenhain profitieren Sie aktuell von attraktiven
    Konditionen für Ihre nächsten Pläne. Wir bieten Ihnen derzeit unseren Sparkassen-Privatkredit
    zu folgenden repräsentativen Konditionen an:


    Sichern Sie sich eine Finanzierung mit einem repräsentativen effektiven Jahreszins
    von 6,49 %. Bei einem beispielhaften Kreditbetrag von 10.000 € und einer Laufzeit
    von 60 Monaten beträgt die monatliche Rate lediglich 194,75 €, bei Gesamtkosten
    von 1.685 €.


    Dieses Angebot gilt für Kreditsummen bis maximal 50.000 € und ist befristet bis
