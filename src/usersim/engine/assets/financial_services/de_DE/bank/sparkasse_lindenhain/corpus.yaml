- id: e7ef0f15-52c3-573d-884e-ab90d8c8727b
  title: Girokonto Komfort mit Sparkassen-Card — kündigen, schließen oder den Tarif
    wechseln
  body: 'Wenn Sie Ihr Girokonto Komfort mit Sparkassen-Card kündigen möchten oder
    in einen anderen Tarif wechseln wollen, führen wir Sie durch diesen Prozess. Bitte
    stellen Sie sicher, dass Sie vor Beginn alle automatisierten Lastschriften und
    Daueraufträge geprüft haben.


    Schritt 1: Antrag auf Kündigung oder Tarifwechsel

    Teilen Sie uns Ihren Wunsch nach einer Kontoschließung oder einem Tarifwechsel
    mit. Geben Sie dabei an, ob das Konto zum nächstmöglichen Zeitpunkt oder zu einem
    spezifischen Datum geschlossen werden soll. Im Falle eines Tarifwechsels nennen
    Sie uns bitte den gewünschten neuen Tarif.


    Schritt 2: Klärung des Kontostands

    Wir prüfen gemeinsam mit Ihnen den aktuellen Kontostand. Sollte Ihr Konto ein
    Guthaben aufweisen, nennen Sie uns die Zielverbindung für die Überweisung des
    Restbetrags. Bestehen noch Verbindlichkeiten (z. B. durch die Nutzung des Dispositionskredits
    mit 11,49 % oder geduldeter Überziehungen mit 14,49 %), müssen diese vor der endgültigen
    Schließung ausgeglichen werden.


    Schritt 3: Behandlung der Sparkassen-Card

    Da die Sparkassen-Card ein physisches Sicherheitselement ist, müssen wir sicherstellen,
    dass sie nicht weiter genutzt werden kann. Wir bestätigen Ihnen, dass die Karte
    mit dem Datum der Kontoschließung ungültig wird. Wir bitten Sie, die Karte eigenständig
    zu vernichten (insbesondere den Chip zu beschädigen) oder uns diese in einer Filiale
    zurückzugeben.


    Schritt 4: Abschluss und Bestätigung

    Nachdem alle Voraussetzungen erfüllt sind, führen wir die Schließung oder den
    Tarifwechsel durch. Sie erhalten von uns eine schriftliche Bestätigung über die
    Beendigung des Vertragsverhältnisses oder die Umstellung Ihres Kontomodells.


    Sollten Sie eine Alternative suchen und vergleichen wollen, werfen Sie einen Blick
    auf Girokonto Komfort mit Sparkassen-Card — im Vergleich zu einem typischen Wettbewerbsangebot.'
