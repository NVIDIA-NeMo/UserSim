  institution_id: sparkasse_lindenhain
- id: 4a3fd8aa-80a4-5854-8875-c7e9950b8128
  title: Sparkassenbuch — Vergleich mit Alternativen und wann es nicht passt
  body: 'Das Sparkassenbuch ist die klassische, sichere Sparform für den langfristigen
    Vermögensaufbau. Um jedoch eine fundierte Entscheidung zu treffen, ist es wichtig
    zu wissen, in welchen Szenarien dieses Produkt nicht die ideale Wahl für Sie ist.


    **Wann das Sparkassenbuch nicht passt:**


    - **Tägliche Zahlungsgeschäfte:** Wenn Sie ein Konto für Gehaltseingänge, Mietzahlungen
    oder tägliche Einkäufe suchen, ist das Sparkassenbuch ungeeignet. Hierfür benötigen
    Sie ein Girokonto, wie unser Girokonto Komfort mit Sparkassen-Card, das speziell
    für den täglichen Zahlungsverkehr konzipiert ist.

    - **Sofortige Verfügbarkeit großer Summen:** Das Sparkassenbuch ist nicht für
    Notfallreserven gedacht, die in voller Höhe innerhalb weniger Stunden verfügbar
    sein müssen. Da eine Kündigungsfrist von 3 Monaten gilt, ist der Zugriff auf Beträge
    oberhalb des monatlichen Freibetrags von 2.000 € zeitverzögert.

    - **Maximierung der Rendite:** Mit einem Zinssatz von 0,5 % bietet das Sparkassenbuch
    Sicherheit und Stabilität, jedoch keine hochrentablen Erträge. Kunden, die eine
    höhere Rendite anstreben und dafür höhere Risiken eingehen können, sollten alternative
    Anlageformen prüfen.


    **Vergleich auf einen Blick:**


    | Merkmal | Sparkassenbuch | Alternativen (z. B. Girokonto)

    | :--- | :--- | :--- |

    | **Zweck** | Langfristiges Sparen | Täglicher Zahlungsverkehr |

    | **Zinssatz** | 0,5 % | In der Regel geringer oder kein Zins |

    | **Verfügbarkeit** | 2.000 € monatlich frei; sonst 3 Monate Frist | Täglich voll
    verfügbar |

    | **Kosten** | In der Regel kostenfrei | z. B. 7,50 € mtl. (Girokonto Komfort)
    |


    Zusammenfassend ist das Sparkassenbuch die ideale Lösung für Bürger, die eine
    sichere, regionale Anlaufstelle für ihre Ersparnisse suchen und die soziale Verantwortung
    sowie die Stabilität eines öffentlich-rechtlichen Instituts schätzen.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 1d0cf876-9832-5fcd-a2e0-ba0f5d20319a
  title: Sparkassenbuch — Voraussetzungen und Abschluss
  body: 'Hier finden Sie Informationen zu den Voraussetzungen für die Eröffnung eines
    Sparkassenbuchs sowie zum Abschlussprozess für Bestandskunden.


    **Welche Voraussetzungen müssen für die Eröffnung eines Sparkassenbuchs erfüllt
    sein?**

    Die Eröffnung ist für alle Bürger zugänglich, da wir einen sicheren Zugang zu
    Finanzdienstleistungen gewährleisten. Erforderlich ist ein gültiges Identitätsdokument
    (Personalausweis oder Reisepass). In der Regel ist die Angabe einer Meldeadresse
    innerhalb unserer regionalen Präsenz ausreichend. Wir führen im Rahmen des Abschlusses
    eine sorgfältige Prüfung der Identität durch.


    **Kann ich als bestehender Kunde ein weiteres Sparkassenbuch eröffnen?**

    Ja, die Eröffnung eines weiteren Sparkassenbuchs ist problemlos möglich. Da das
    Produkt primär der sicheren Anlage dient, können Sie so unterschiedliche Sparziele
    voneinander trennen. Der Prozess erfolgt über die Identitätsprüfung in einer unserer
    Filialen oder über das Online-Banking mittels starker Kundenauthentifizierung.


    Weitere Details zu den benötigten Dokumenten finden Sie unter: Sparkassenbuch
    — erforderliche Unterlagen.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 1bc9f47b-84e4-5c90-b995-92dc1e75709a
  title: Sparkassenbuch — ein typisches Anliegen vollständig erledigen
  body: "Ein sehr häufiges Anliegen unserer Kunden ist die Auszahlung eines bestimmten\
    \ Betrages vom Sparkassenbuch. Hier wird beschrieben, wie dieser Prozess von der\
    \ ersten Anfrage bis zur Auszahlung vollständig abgewickelt wird.\n\n**Szenario:**\
    \ Sie möchten eine Summe von Ihrem Sparkassenbuch abheben, um eine Anschaffung\
    \ zu tätigen.\n\n**Schritt-für-Schritt-Anleitung:**\n\n1. **Identifizierung:**\
    \ Legen Sie in Ihrer regionalen Filiale Ihr Sparkassenbuch und Ihren gültigen\
    \ Personalausweis vor oder authentifizieren Sie sich im Online-Banking. Wir führen\
    \ eine strikte Identitätsprüfung durch, um Ihr Guthaben zu schützen.\n2. **Betragsfestlegung:**\
    \ Nennen Sie uns die gewünschte Auszahlungssumme. Wir prüfen nun unmittelbar die\
    \ Verfügbarkeit auf Ihrem Konto.\n3. **Prüfung der Verfügbarkeitsgrenzen:**\n\
    \   - **Fall A (Betrag bis 2.000 €):** Wenn die Summe innerhalb des aktuellen\
    \ Kalendermonats den Freibetrag von 2.000 € nicht überschreitet, bestätigen wir\
    \ Ihnen die sofortige Verfügbarkeit.\n   - **Fall B (Betrag über 2.000 €):** Wenn\
    \ der Betrag den Freibetrag überschreitet oder dieser bereits ausgeschöpft ist,\
    \ weisen wir Sie auf die Kündigungsfrist von 3 Monaten hin. Wir nehmen die Kündigung\
    \ des entsprechenden Betrages für Sie auf.\n4. **Auszahlung und Bestätigung:**\
    \ Bei sofortiger Verfügbarkeit (Fall A) erfolgt die Auszahlung in bar oder durch\
    \ Überweisung auf ein Referenzkonto. Bei Fall B erhalten Sie eine schriftliche\
    \ Bestätigung über den Kündigungstermin, zu dem das Geld verfügbar ist.\n5. **Abschluss:**\
    \ Sie erhalten einen aktualisierten Kontoauszug, aus dem die Buchung und der neue\
    \ Saldo (inklusive der Verzinsung von 0,5 %) hervorgehen.\n\n**Woran Sie erkennen,\
    \ dass das Anliegen erledigt ist:**\nDas Anliegen ist vollständig erledigt, sobald\
    \ Sie entweder die Auszahlung erhalten haben oder eine rechtsverbindliche Bestätigung\
    \ über den Kündigungstermin für die Summe, welche die 2.000 € Grenze überschreitet,\
    \ vorliegen haben."
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a42529ff-71c5-5dce-aac9-59b96f3a283c
  title: Sparkassenbuch — Abweichung von Ihren Unterlagen
  body: 'In der Beratung kann es vorkommen, dass Kunden eine Abweichung zwischen ihren
    persönlichen Unterlagen (z. B. alten Kontoauszügen) und den im System hinterlegten
    Daten des Sparkassenbuchs feststellen. Dieses Dokument leitet Mitarbeiter bei
    der Klärung solcher Differenzen an.


    **Symptom:**

    Der Kunde gibt an, dass der aktuelle Kontostand oder die gutgeschriebenen Zinsen
    nicht mit seinen Erwartungen oder seinen letzten Aufzeichnungen übereinstimmen.


    **Prüfschritte für den Mitarbeiter:**

    1. **Abgleich des Zeitraums:** Prüfen Sie, ob die Unterlagen des Kunden aktuell
    sind. Vergleichen Sie das Datum des letzten Kontoauszugs mit dem aktuellen Systemdatum.
    Beachten Sie dabei etwaige Wertestellungen von Einzahlungen.

    2. **Überprüfung der Zinsberechnung:** Validieren Sie, ob der Zinssatz von 0,5
    % korrekt angewendet wurde. Prüfen Sie, ob Zinsen bereits kapitalisiert wurden
    oder noch als aufgelaufene Zinsen geführt werden, die erst zum Ende des Zinszeitraums
    gutgeschrieben werden.

    3. **Kontrolle der Abhebungen:** Prüfen Sie, ob im betreffenden Monat bereits
    Auszahlungen getätigt wurden, welche den Freibetrag von 2.000 € beansprucht haben
    oder ob Kündigungen über die 3-monatige Frist hinaus erfolgt sind.

    4. **Dokumentenprüfung:** Lassen Sie sich die vom Kunden beanstandeten Unterlagen
    vorlegen und gleichen Sie jede einzelne Buchung mit der Systemhistorie ab.


    **Lösung:**

    - **Erklärungsbedarf:** Wenn die Differenz auf einem Missverständnis (z. B. Zinsvalutadatum)
    beruht, erläutern Sie dem Kunden die Berechnung sachlich und transparent.

    - **Korrekturbedarah:** Falls ein systemischer Fehler vorliegt, ist eine Korrekturbuchung
    unter Beachtung der internen Compliance-Richtlinien einzuleiten.


    **Eskalation:**

    Kann die Abweichung nicht unmittelbar geklärt werden oder ist die Differenz betragsmäßig
    signifikant, wird der Fall stufenweise von der Filialleitung an die regionale
    Geschäftsführung zur detaillierten Prüfung und finalen Entscheidung eskaliert.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: acb7d8c1-8b47-5240-95f2-d319bee2f7cd
  title: Sparkassen-Kreditkarte Gold — Überblick
  body: 'Die Sparkassen-Kreditkarte Gold ist die exklusive Lösung für Kunden der Sparkasse
    Lindenhain, die weltweit finanzielle Flexibilität und einen Premium-Service erwarten.
    Diese Karte ist darauf ausgelegt, Sie sowohl bei Ihren täglichen Einkäufen in
    der Region als auch bei Ihren internationalen Reisen zuverlässig zu begleiten.


    Ein wesentlicher Vorteil der Sparkassen-Kreditkarte Gold ist der großzügige monatliche
    Verfügungsrahmen, der auf 5.000 € festgesetzt ist. Dies ermöglicht Ihnen eine
    hohe finanzielle Handlungsfreiheit für größere Anschaffungen oder unvorhergesehene
    Ausgaben, ohne dass Sie sofort auf Ihr Girokonto zugreifen müssen.


    Für den weltweiten Einsatz ist die Karte optimiert. Bei Zahlungen in einer Fremdwährung
    wird ein Fremdwährungsentgelt von 1,75 % erhoben, welches die Kosten für die Währungsumrechnung
    und die grenzüberschreitende Abwicklung abdeckt. Damit bleibt die Sparkassen-Kreditkarte
    Gold ein transparentes Instrument für den globalen Zahlungsverkehr.


    Um die Aufrechterhaltung unserer regionalen Infrastruktur sowie den exklusiven
    Service-Standard dieser Karte zu gewährleisten, wird ein Jahresentgelt in Höhe
    von 84 € erhoben. Im Gegenzug profitieren Sie von einer weltweit akzeptierten
    Zahlungsmethode und der Sicherheit, einem regional verwurzelten Institut mit hoher
    sozialer Verantwortung zu vertrauen.


    Die Karte ist ideal für Kunden, die über das Basiskonto hinausgehende Anforderungen
    an ihre Zahlungsfähigkeit stellen und Wert auf ein prestigeträchtiges Finanzinstrument
    legen. Die Sparkassen-Kreditkarte Gold kombiniert die Sicherheit der öffentlich-rechtlichen
    Sparkasse mit der Flexibilität einer modernen Kreditkarte.


    Für detaillierte Informationen zu den Kostenstrukturen verweisen wir auf das Sparkassen-Kreditkarte
    Gold — Preis- und Leistungsverzeichnis.'
