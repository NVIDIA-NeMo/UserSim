- id: 3005d901-b778-5fe3-900f-a31fff16443f
  title: Sparkassen-Kreditkarte Gold — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Finanzen hat für die Sparkasse Lindenhain höchste Priorität.
    Da die Sparkassen-Kreditkarte Gold ein Instrument für weltweite Zahlungen ist,
    möchten wir Sie auf aktuelle Betrugsmuster aufmerksam machen und Ihnen präventive
    Maßnahmen erläutern.


    Ein häufiges Risiko ist das sogenannte ''Phishing''. Hierbei erhalten Sie gefälschte
    E-Mails oder SMS, die angeblich von uns stammen und Sie auffordern, Ihre Kreditkartendaten
    oder Ihre Online-Banking-Zugangsdaten auf einer externen Webseite zu bestätigen.
    Bitte beachten Sie: Die Sparkasse Lindenhain wird Sie niemals per E-Mail, SMS
    oder Telefon dazu auffordern, Passwörter, PINs oder TANs preiszugeben.


    Ein weiteres Risiko stellt das ''Skimming'' dar, bei dem an Geldautomaten oder
    Zahlungsterminals unbemerkt Daten vom Magnetstreifen Ihrer Karte kopiert werden.
    Wir empfehlen Ihnen, den Kartenschlitz vor der Einführung kurz zu prüfen und beim
    Eintippen Ihrer PIN die Tastatur abzuschirmen.


    Sollten Sie den Verdacht haben, dass Ihre Karte kompromittiert wurde, oder falls
    Sie Ihre Karte verlieren, ist die sofortige Reaktion entscheidend. Nutzen Sie
    umgehend den Notruf 116 116, um Ihre Karte weltweit zu sperren. Durch die sofortige
    Sperrung begrenzen wir Ihre Haftung bei missbräuchlicher Nutzung auf maximal 50
    €, sofern Sie nicht grob fahrlässig gehandelt haben.


    Zudem weisen wir darauf hin, dass wir bei ungewöhnlichen Transaktionsmustern,
    die nicht Ihrem üblichen Nutzungsverhalten entsprechen, unter Umständen eine zusätzliche
    Identitätsprüfung vornehmen oder die Karte vorübergehend einschränken, um Ihr
    Guthaben zu schützen. Wir danken Ihnen für Ihre Aufmerksamkeit und Ihr Vertrauen
    in unser Institut.'
