- id: cdf2e1e9-7430-556c-b107-c6b44e14e63b
  title: Girokonto Komfort mit Sparkassen-Card — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugang zu Ihrem Online-Banking oder beim
    Login für Ihr Girokonto Komfort mit Sparkassen-Card haben, helfen wir Ihnen gerne
    bei der Behebung des Problems.


    Symptom: Die Fehlermeldung beim Login besagt, dass die Zugangsdaten ungültig sind
    oder das Konto gesperrt wurde.


    Wahrscheinliche Ursachen:

    1. Mehrfache Eingabe einer falschen PIN oder eines falschen Passworts.

    2. Abgelaufene Sicherheitszertifikate oder eine nicht aktualisierte App.

    3. Sicherheitsreaktion der Bank aufgrund ungewöhnlicher Login-Aktivitäten.


    Was Sie in dieser Reihenfolge prüfen sollten:

    - Überprüfen Sie, ob die Feststelltaste (Caps Lock) an Ihrer Tastatur aktiviert
    ist.

    - Stellen Sie sicher, dass Ihre Internetverbindung stabil ist und Sie die aktuellste
    Version unserer Banking-App verwenden.

    - Prüfen Sie, ob Ihr Smartphone für die starke Kundenauthentifizierung korrekt
    registriert und erreichbar ist.


    Die Lösung:

    Wenn ein Login aufgrund falscher Eingaben gesperrt wurde, können wir diese Sperre
    nach einer strikten Identitätsprüfung für Sie aufheben. Bitte teilen Sie uns mit,
    an welcher Stelle der Prozess scheitert. Wir werden Ihre Identität verifizieren
    und Ihnen anschließend einen neuen Zugang oder eine neue PIN zukommen lassen.


    Wenn die Ursache komplexer ist oder ein technischer Fehler in unseren Systemen
    vorliegt, werden wir den Vorgang stufenweise an unsere regionale Geschäftsführung
    eskalieren. Sie werden über den Fortschritt der Entsperrung und die voraussichtliche
    Dauer der Wiederherstellung informiert.


    Für weitere Unterstützung bei unerwarteten Beträgen oder Gebühren sehen Sie bitte
    im Dokument Girokonto Komfort mit Sparkassen-Card — unerwartetes Entgelt oder
    unerwarteter Betrag.'
