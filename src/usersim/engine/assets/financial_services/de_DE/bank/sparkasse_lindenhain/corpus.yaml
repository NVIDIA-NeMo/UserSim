    als Dankeschön eine einmalige Gutschrift in Höhe von 25 € auf Ihr Kartenkonto.
    Diese Gutschrift erfolgt direkt mit der ersten Abrechnung nach erfolgreichem Abschluss.
    Bitte beachten Sie, dass das reguläre Jahresentgelt von 84 € weiterhin zur Aufrechterhaltung
    unseres regionalen Service-Netzes erhoben wird.


    Dieses Angebot ist zeitlich befristet und gilt für Empfehlungen, die im Zeitraum
