  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: e91db582-94b1-51a2-ab6e-43a67d357b5a
  title: Sparkassen-Privatkredit — abschließen und aktivieren
  body: 'Um einen Sparkassen-Privatkredit abzuschließen, folgen Sie bitte diesen Schritten.
    Wir begleiten Sie von der ersten Anfrage bis zur Auszahlung der Mittel auf Ihr
    Konto.


    1. Bedarfsfestlegung: Teilen Sie uns den gewünschten Kreditbetrag (bis maximal
    50.000 €) sowie den Verwendungszweck mit. Geben Sie uns zudem an, über welchen
    Zeitraum Sie das Darlehen zurückzahlen möchten (z. B. 60 Monate).


    2. Einreichung der Unterlagen: Um Ihre Kreditwürdigkeit prüfen zu können, übergeben
    Sie uns die erforderlichen Nachweise. Dazu gehören in der Regel Ihr aktueller
    Personalausweis sowie Ihre letzten drei Gehaltsabrechnungen oder ein entsprechender
    Einkommensnachweis.


    3. Kreditprüfung: Wir führen eine sorgfältige Bonitätsprüfung durch. Wir informieren
    Sie anschließend über das Ergebnis und unterbreiten Ihnen ein konkretes Angebot
    mit dem für Sie geltenden Zinssatz.


    4. Vertragsunterzeichnung: Wenn Sie mit den Konditionen einverstanden sind, unterzeichnen
    Sie den Kreditvertrag. Wir erläutern Ihnen dabei nochmals alle wesentlichen Punkte,
    einschließlich der monatlichen Rate (im repräsentativen Beispiel für 10.000 €
    bei 60 Monaten Laufzeit: 194,75 €) und der Gesamtkosten.


    5. Auszahlung und Aktivierung: Nach der Unterzeichnung wird der Kreditbetrag auf
    Ihr bezeichnetes Konto ausgezahlt. Der Kredit ist damit aktiviert. Die Rückzahlung
    erfolgt in der vereinbarten monatlichen Rate per Lastschrift von Ihrem Konto.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, sobald die Kreditsumme
    auf Ihrem Kontoauszug erscheint und Sie die Vertragsbestätigung erhalten haben.
    Für weitere Informationen zu den rechtlichen Rahmenbedingungen lesen Sie bitte
    Sparkassen-Privatkredit — rechtliche Hinweise.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: e5f46e77-2421-5d67-87ba-354e56db9262
  title: Sparkassen-Privatkredit — Preis- und Leistungsverzeichnis
  body: 'Im Rahmen des Sparkassen-Privatkredits gelten die folgenden Konditionen und
    Kostenstrukturen. Bitte beachten Sie, dass die individuellen Konditionen auf Basis
    der persönlichen Kreditwürdigkeitsprüfung festgelegt werden.


    - Maximaler Kreditbetrag: 50.000 €

    - Repräsentativer effektiver Jahreszins: 6,49 %

    - Repräsentatives Nettodarlehen: 10.000 €

    - Repräsentative Laufzeit: 60 Monate

    - Repräsentative monatliche Rate: 194,75 €

    - Repräsentative Gesamtkosten über die Laufzeit: 1.685 €


    Die oben genannten Werte dienen der transparenten Darstellung der Kostenstruktur.
    Sämtliche Gebühren werden vor Vertragsabschluss klar kommuniziert. Es fallen keine
    versteckten Bearbeitungsgebühren an, sofern nicht anders im individuellen Vertrag
    vereinbart.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: fee_schedule
  source_authority: official
  placeholder: true
