- id: 2c1d1024-6204-57b4-bbce-cbca433ff36e
  title: Sparkassen-Kreditkarte Gold — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Status Ihrer Karte oder Ihren bisherigen Nutzungsvorlauf
    einsehen möchten, stehen Ihnen folgende Schritte zur Verfügung:


    Was Sie benötigen:

    Um Ihre Daten einsehen zu können, ist eine strikte Identitätsprüfung erforderlich.
    Bitte halten Sie bei einem Gespräch mit uns ein gültiges Ausweisdokument bereit
    oder nutzen Sie Ihre Zugangsdaten für das Online-Banking.


    Schritte zur Einsicht des Verlaufs:


    1. Fragen Sie uns nach Ihrem aktuellen Kartenstatus und dem verfügbaren Restbetrag
    Ihres monatlichen Verfügungsrahmens von 5.000 €.

    2. Wir führen eine Identitätsprüfung durch, um den Datenschutz zu gewährleisten.

    3. Wir nennen Ihnen den aktuellen Stand Ihres Kreditrahmens sowie die letzten
    verbuchten Transaktionen.

    4. Falls Sie einen detaillierten Verlauf benötigen, bitten Sie uns um die Erstellung
    einer Kreditkartenabrechnung für den gewünschten Zeitraum.

    5. Wir bestätigen Ihnen die Erstellung und stellen Ihnen das Dokument entweder
    digital über Ihr Online-Banking oder in Papierform in einer unserer Filialen zur
    Verfügung.


    Ergebnis:

    Sie haben nun eine präzise Übersicht über Ihre Ausgaben und wissen genau, welcher
    Teil Ihres Verfügungsrahmens noch für den laufenden Monat zur Verfügung steht.


    Für weitere Details zu den Kosten der Nutzung schauen Sie bitte in Sparkassen-Kreditkarte
    Gold — Kosten und Entgelte.'
