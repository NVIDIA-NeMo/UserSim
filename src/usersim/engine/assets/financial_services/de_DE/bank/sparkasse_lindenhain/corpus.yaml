- id: b1c2063d-9b6e-51e0-9316-bbb17adb87a5
  title: 'Girokonto Komfort mit Sparkassen-Card — Zinssatz für geduldete Überziehungen:
    Erklärung'
  body: 'Häufig gestellte Fragen zum Zinssatz bei Kontoüberziehungen:


    Frage: Was ist eine geduldete Überziehung und wie unterscheidet sie sich vom Dispositionskredit?

    Antwort: Ein Dispositionskredit ist ein vorab mit uns vereinbarter Kreditrahmen,
    der Ihnen Flexibilität im Alltag bietet. Eine geduldete Überziehung tritt ein,
    wenn Ihr Konto über diesen vereinbarten Rahmen hinaus ins Minus rutscht oder wenn
    kein Dispositionskredit vereinbart wurde, wir die Zahlung jedoch dennoch ausführen.


    Frage: Welche Kosten fallen bei einer geduldeten Überziehung an?

    Antwort: Für geduldete Überziehungen im Girokonto Komfort mit Sparkassen-Card
    gilt ein Zinssatz von 14,49 %. Dieser liegt über dem Zinssatz des vereinbarten
    Dispositionskredits, welcher 11,49 % beträgt. Wir empfehlen Ihnen, bei Bedarf
    einen entsprechenden Kreditrahmen zu vereinbaren, um die Kosten zu senken. Weitere
    Details entnehmen Sie bitte dem Dokument Girokonto Komfort mit Sparkassen-Card
    — Zinsübersicht.'
