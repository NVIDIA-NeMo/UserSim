- id: 5a8fa5d2-3f91-5877-921f-48c47c208f47
  title: Girokonto Komfort mit Sparkassen-Card — unerwartetes Entgelt oder unerwarteter
    Betrag
  body: 'Wenn ein Kunde eine Abweichung in seinem Kontostand meldet oder ein Entgelt
    als ''unerwartet'' beschreibt, gehen Sie bitte nach folgendem Schema vor:


    Symptom: Der Kunde stellt fest, dass der Kontostand niedriger ist als erwartet
    oder eine Buchung auftaucht, die er nicht zuordnen kann.


    Ursachenprüfung in dieser Reihenfolge:

    1. Monatliches Kontoführungsentgelt: Prüfen Sie, ob die regelmäßige Gebühr von
    7,50 € für das Girokonto Komfort mit Sparkassen-Card abgebucht wurde. Da dieses
    Entgelt zur Aufrechterhaltung der regionalen Infrastruktur dient, ist es eine
    Standardbuchung.

    2. Dispositionszinsen: Prüfen Sie, ob das Konto im Minus war. Falls ein vereinbarter
    Kreditrahmen genutzt wurde, wurde ein Zinssatz von 11,49 % angewendet. Falls der
    Rahmen überschritten wurde, fielen Zinsen für geduldete Überziehungen in Höhe
    von 14,49 % an.

    3. Drittbuchungen: Prüfen Sie die Umsatzliste auf Lastschriften oder Kartenzahlungen,
    die möglicherweise zeitversetzt gebucht wurden.


    Lösungsweg:

    - Erläutern Sie dem Kunden sachlich die jeweilige Position. Verweisen Sie bei
    den 7,50 € auf die Service-Philosophie der regionalen Präsenz.

    - Bei Zinsfragen erläutern Sie den Unterschied zwischen dem vereinbarten Dispo
    (11,49 %) und der geduldeten Überziehung (14,49 %).

    - Sollte der Kunde eine Buchung weiterhin als nicht autorisiert betrachten, leiten
    Sie den Fall gemäß den Richtlinien zur Betrugsbekämpfung ein.


    Eskalation:

    Falls die Erklärung der Gebühren nicht zur Zufriedenheit des Kunden führt oder
    ein komplexer Fehler im Buchungssystem vermutet wird, wird der Fall stufenweise
    vom Filialmitarbeiter an die Filialleitung und bei Bedarf an die regionale Geschäftsführung
    weitergeleitet.


    Weitere Informationen zur Zinsberechnung finden Sie in Girokonto Komfort mit Sparkassen-Card
    — wie Zinsen berechnet und angewendet werden.'
