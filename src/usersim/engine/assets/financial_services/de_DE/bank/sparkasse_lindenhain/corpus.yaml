- id: a3f67cf8-5c5e-5944-ad50-8511e05a79ec
  title: Girokonto Komfort mit Sparkassen-Card — im Vergleich zu einem ähnlichen Produkt
    des Hauses
  body: 'Im Vergleich zu einem einfachen Basiskonto bietet das Girokonto Komfort mit
    Sparkassen-Card einen erweiterten Serviceumfang für Kunden, die eine vollumfängliche
    regionale Banklösung suchen.


    Das Girokonto Komfort mit Sparkassen-Card zeichnet sich durch die integrierte
    Sparkassen-Card und einen optimierten Service aus, wofür ein monatliches Kontoführungsentgelt
    von 7,50 € erhoben wird. Im Gegensatz zum Basiskonto, das primär der gesetzlichen
    Verpflichtung zur finanziellen Teilhabe dient, ist das Komfort-Konto auf den täglichen
    Zahlungsverkehr und eine flexible Kreditnutzung ausgelegt. Während beim Komfort-Konto
    ein Dispositionskredit mit einem Zinssatz von 11,49 % vereinbart werden kann,
    sind die Kreditmöglichkeiten bei einem Basiskonto stark eingeschränkt.


    Ein wesentlicher Vorteil des Komfort-Kontos ist die nahtlose Integration in unser
    Filialnetz und die umfassende Unterstützung bei komplexeren Finanztransaktionen.


    Welches Produkt passt zu Ihnen?

    - Das Girokonto Komfort mit Sparkassen-Card eignet sich für Kunden, die Wert auf
    persönlichen Service, regionale Präsenz und eine flexible Überziehungsmöglichkeit
    legen.

    - Ein Basiskonto ist die richtige Wahl für Personen, die lediglich den gesetzlich
    geforderten Mindestzugang zu Finanzdienstleistungen benötigen.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 2cf01655-39c4-5540-aac9-5a6346d850b1
  title: Girokonto Komfort mit Sparkassen-Card — rechtliche Hinweise
  body: 'Die Sparkasse Lindenhain agiert als öffentlich-rechtliches Institut unter
    der Aufsicht der BaFin und der Deutschen Bundesbank. Die Führung des Girokonto
    Komfort mit Sparkassen-Card erfolgt strikt nach den Bestimmungen des Bürgerlichen
    Gesetzbuches (BGB), dem Zahlungskontengesetz sowie den geltenden Datenschutzrichtlinien.


    Einlagen und Guthaben auf Ihrem Konto sind durch die gesetzliche Einlagensicherung
    geschützt, welche Beträge bis zu einer Summe von 100.000 € pro Kunde absichert.


    Wir weisen darauf hin, dass für die Kontoführung ein monatliches Entgelt von 7,50
    € erhoben wird, welches der Aufrechterhaltung der regionalen Infrastruktur dient.
    Kreditlinien, wie der Dispositionskredit (11,49 %), werden erst nach einer erfolgreichen
    Kreditwürdigkeitsprüfung eingeräumt. Eine Garantie für eine Kreditzusage wird
    ohne diese Prüfung nicht erteilt.


    Im Falle einer Pfändung kann das Konto in ein Pfändungsschutzkonto umgewandelt
    werden. Gemäß den gesetzlichen Vorgaben wird dabei der Grundfreibetrag in Höhe
    von 1.590 € vor Pfändungen geschützt.


    Die starke Kundenauthentifizierung ist bei allen zustandsändernden Aktionen im
    Online-Banking sowie bei sensiblen Vertragsänderungen zwingend erforderlich, um
    die Sicherheit Ihres Vermögens zu gewährleisten. Vor jeder Auskunft über Kontodaten
    wird eine strikte Identitätsprüfung durchgeführt.


    Bitte beachten Sie, dass wir eine professionelle Produktberatung und allgemeine
    finanzielle Aufklärung anbieten, jedoch keine individuelle Steuer- oder Rechtsberatung
    erbringen.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: e0731c25-cc46-575f-90cd-b522af9db56b
  title: Girokonto Komfort mit Sparkassen-Card — Zinsübersicht
  body: 'Für das Girokonto Komfort mit Sparkassen-Card gelten die folgenden Zinssätze
    für die Inanspruchnahme von Kreditrahmen:


    - Zinssatz für den vereinbarten Dispositionskredit: 11,49 %

    - Zinssatz für geduldete Überziehungen: 14,49 %


    Diese Zinssätze gelten einheitlich für alle Kunden des Girokonto Komfort mit Sparkassen-Card,
    unabhängig vom Kontostand oder dem Volumen der Inanspruchnahme. Der Dispositionskredit
    bezieht sich auf den mit Ihrem Girokonto verbundenen, im Vorfeld vereinbarten
    Überziehungsrahmen. Eine geduldete Überziehung tritt ein, wenn das Konto über
    diesen vereinbarten Rahmen hinaus ins Minus rutscht oder kein Dispositionskredit
    vereinbart wurde.


    Die Zinsen werden periodisch berechnet und dem Konto belastet. Änderungen dieser
    Zinssätze erfolgen transparent und werden Ihnen rechtzeitig mitgeteilt. Für eine
    detaillierte Aufstellung aller Kosten schauen Sie bitte in das Dokument Girokonto
    Komfort mit Sparkassen-Card — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 3fec8c57-346f-5da0-860f-9e76bfa84d63
  title: Girokonto Komfort mit Sparkassen-Card — aktuelles Angebot
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    um unsere regionale Verbundenheit zu stärken, bietet die Sparkasse Lindenhain
    Ihnen ein besonderes Treueangebot für Ihr Girokonto Komfort mit Sparkassen-Card
    an.


    Im Zeitraum vom 01.11.2024 bis zum 31.01.2025 erlassen wir Ihnen für drei aufeinanderfolgende
    Monate das monatliche Kontoführungsentgelt in Höhe von 7,50 €.


    Dieses Angebot gilt für alle bestehenden Kunden, die ihr Konto im genannten Zeitraum
    aktiv nutzen. Nach Ablauf dieser drei kostenfreien Monate wird das reguläre Kontoführungsentgelt
    von 7,50 € wieder automatisch erhoben. Alle weiteren Konditionen, einschließlich
    des Zinssatzes für den Dispositionskredit von 11,49 % und des Zinssatzes für geduldete
    Überziehungen von 14,49 %, bleiben unverändert bestehen.


    Wir danken Ihnen für Ihr Vertrauen in unser Institut und freuen uns, Sie weiterhin
    in der Region Lindenhain begleiten zu dürfen.'
