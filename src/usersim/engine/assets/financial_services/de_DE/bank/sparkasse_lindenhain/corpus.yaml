- id: 8dc17ca4-2f04-5e3d-9560-385b33d6de33
  title: Sparkassenbuch — abgelehnter oder gesperrter Vorgang
  body: 'In bestimmten Fällen kann es vorkommen, dass eine Auszahlungsanfrage für
    Ihr Sparkassenbuch abgelehnt wird oder das Konto für bestimmte Vorgänge gesperrt
    ist. Dies kann insbesondere dann auftreten, wenn Sie die Flexibilität unseres
    Produkts mit anderen Alternativen auf dem Markt vergleichen.


    **Symptom:**

    Sie versuchen, einen Betrag von Ihrem Sparkassenbuch abzuheben, erhalten jedoch
    die Meldung, dass der Vorgang nicht ausgeführt werden kann oder dass eine Sperre
    vorliegt.


    **Mögliche Ursachen und Prüfschritte:**

    1. **Überschreitung des monatlichen Freibetrags:** Prüfen Sie, ob Sie in diesem
    Kalendermonat bereits Beträge abgehoben haben. Die kostenfreie Verfügbarkeit ist
    auf 2.000 € pro Monat begrenzt. Wenn dieser Betrag bereits ausgeschöpft ist, wird
    eine weitere Auszahlung ohne Kündigungsfrist systemseitig abgelehnt.

    2. **Nichtbeachtung der Kündigungsfrist:** Haben Sie eine Summe angefordert, die
    über 2.000 € liegt, ohne die erforderliche Kündigungsfrist von 3 Monaten einzuhalten?
    In diesem Fall ist der Vorgang aufgrund der vertraglichen Vereinbarungen nicht
    unmittelbar ausführbar.

    3. **Fehlgeschlagene Identitätsprüfung:** Wurde die starke Kundenauthentifizierung
    im Online-Banking nicht erfolgreich abgeschlossen oder fehlen in der Filiale die
    notwendigen Ausweisdokumente? Ohne strikte Prüfung erfolgt keine zustandsändernde
    Aktion.


    **Lösung:**

    - **Bei Limitüberschreitung:** Warten Sie bis zum Beginn des nächsten Kalendermonats,
    um erneut den Freibetrag von 2.000 € zu nutzen, oder kündigen Sie den gewünschten
    Betrag unter Einhaltung der Frist von 3 Monaten.

    - **Bei Identitätsproblemen:** Bitte legen Sie ein gültiges Ausweisdokument vor
    oder aktualisieren Sie Ihre Authentifizierungsmethoden.


    **Eskalation:**

    Sollte die Ablehnung trotz Einhaltung aller Fristen und Limits erfolgen, wird
    der Vorgang durch unseren Mitarbeiter an die Filialleitung und bei Bedarf an die
    regionale Geschäftsführung zur manuellen Prüfung und Freigabe weitergeleitet.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 124cdfbf-bb21-5cbb-bbaf-623fc03edd2a
  title: Sparkassenbuch — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Als Unterstützung für die Kundenberatung dient diese Übersicht dazu, zu entscheiden,
    ob das Sparkassenbuch noch die optimale Lösung für den Kunden darstellt oder ein
    Wechsel zu einem anderen Produkt sinnvoll ist.


    **Das Sparkassenbuch ist die richtige Wahl, wenn:**

    Der Kunde primär auf Sicherheit und langfristigen Vermögensaufbau setzt, eine
    geringe Liquiditätsanforderung hat und mit einem Zinssatz von 0,5 % sowie einer
    Kündigungsfrist von 3 Monaten einverstanden ist. Es eignet sich ideal als klassische
    Sparform.


    **Ein Wechsel lohnt sich, wenn:**

    1. **Hoher Liquiditätsbedarf:** Wenn der Kunde regelmäßige Zahlungen tätigen muss
    und der monatliche Freibetrag von 2.000 € nicht ausreicht, ist ein Wechsel zum
    Girokonto Komfort mit Sparkassen-Card ratsam. Hier steht die tägliche Zahlungsfähigkeit
    im Vordergrund, wenngleich eine monatliche Gebühr von 7,50 € anfällt.

    2. **Kurzfristige Verfügbarkeit großer Summen:** Wenn der Kunde nicht in der Lage
    ist, eine Kündigungsfrist von 3 Monaten einzuhalten, ist das Sparkassenbuch ungeeignet.


    // Verweis: Girokonto Komfort mit Sparkassen-Card — Überblick'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: comparison
  source_authority: official
