- id: d82d258c-1ee2-52aa-8508-8b1179921413
  title: Sparkassen-Kreditkarte Gold — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sparkassen-Kreditkarte Gold bietet Ihnen weltweit finanziellen Spielraum,
    was sie jedoch auch zu einem Ziel für gezielte Betrugsmaschen macht. Insbesondere
    bei Reisen in ferne Länder oder bei hochpreisigen Online-Anschaffungen ist erhöhte
    Wachsamkeit geboten.


    Typische Betrugsmuster für dieses Produkt umfassen das sogenannte ''Phishing'',
    bei dem Sie über gefälschte E-Mails oder SMS dazu aufgefordert werden, Ihre Kreditkartendaten
    oder PIN auf einer nachgeahmten Webseite einzugeben. Bitte beachten Sie: Die Sparkasse
    Lindenhain wird Sie niemals per E-Mail oder SMS dazu auffordern, Ihre Geheimnisse
    oder TANs preiszugeben.


    Sollten Sie den Verdacht haben, dass Ihre Karte kompromittiert wurde, oder stellen
    Sie nicht autorisierte Umsätze auf Ihrer Abrechnung fest, ist die sofortige Reaktion
    entscheidend. Bei einem Kartenverlust oder Diebstahl steht die unverzügliche Sperrung
    der Karte im Vordergrund. Nutzen Sie hierfür den Notruf 116 116. Durch die rechtzeitige
    Sperrung begrenzen wir Ihre Haftung gemäß den gesetzlichen Bestimmungen auf maximal
    50 €, sofern Sie nicht grob fahrlässig gehandelt haben.


    Wir agieren unter der Aufsicht der BaFin und der Deutschen Bundesbank und stellen
    sicher, dass alle Prozesse strikt dem BGB und den Datenschutzrichtlinien folgen.
    Zur Absicherung Ihrer Daten ist bei sensiblen Vertragsänderungen oder Online-Zahlungen
    eine starke Kundenauthentifizierung zwingend erforderlich. Dies ist eine notwendige
    Sicherheitsmaßnahme, um den Zugriff unbefugter Dritter auf Ihren Verfügungsrahmen
    von 5.000 € zu verhindern.


    Wenn Sie Unregelmäßigkeiten bemerken, informieren Sie uns bitte umgehend. Wir
    bearbeiten Beschwerden und Betrugsfälle fair und zeitnah gemäß den gesetzlichen
    Fristen des BGB, um Ihren finanziellen Schutz zu gewährleisten.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: c97dc053-33af-52ef-9f58-b5b6da21cf16
  title: Sparkassen-Kreditkarte Gold — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Nutzung der Sparkassen-Kreditkarte
    Gold der Sparkasse Lindenhain. Durch den Abschluss des Vertrages verpflichten
    sich beide Parteien zur Einhaltung der nachfolgenden Bedingungen.


    1. Entgelte und Kosten

    Für die Bereitstellung und Verwaltung der Sparkassen-Kreditkarte Gold wird ein
    jährliches Entgelt in Höhe von 84 € erhoben. Dieses Entgelt dient der Aufrechterhaltung
    unserer regionalen Infrastruktur und des damit verbundenen persönlichen Service.
    Bei Zahlungen in einer Fremdwährung wird ein Fremdwährungsentgelt von 1,75 % des
    jeweiligen Umsatzbetrages berechnet.


    2. Verfügungsrahmen und Nutzung

    Der monatliche Verfügungsrahmen der Karte ist auf 5.000 € festgesetzt. Dieser
    Betrag stellt die maximale Summe dar, die innerhalb eines Abrechnungszeitraums
    für Zahlungen und Bargeldbezüge genutzt werden kann. Die Sparkasse Lindenhain
    behält sich vor, diesen Rahmen nach einer erneuten Kreditwürdigkeitsprüfung anzupassen
    oder bei einer Verschlechterung der Bonität zu reduzieren.


    3. Zahlungsverpflichtungen

    Der Karteninhaber verpflichtet sich, die durch die Nutzung der Karte entstandenen
    Beträge gemäß den in der monatlichen Abrechnung genannten Fristen vollständig
    zurückzuzahlen. Bei Verzug gelten die aktuellen Zinssätze für Kreditkartenverbindlichkeiten.


    4. Laufzeit und Kündigung

    Das Vertragsverhältnis wird auf unbestimmte Zeit geschlossen. Eine Kündigung kann
    von beiden Seiten unter Einhaltung der vertraglich vereinbarten Fristen schriftlich
    oder in einer unserer Filialen erfolgen. Eine außerordentliche Kündigung aus wichtigem
    Grund bleibt vorbehalten.


    5. Rechtliche Grundlage

    Sämtliche Prozesse folgen strikt dem BGB sowie dem Zahlungskontengesetz. Die Sparkasse
    Lindenhain gewährleistet eine gesetzeskonforme Kundenbehandlung unter der Aufsicht
    der BaFin und der Deutschen Bundesbank.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 94260070-47af-5289-83a7-6885d242f8d8
  title: Sparkassen-Kreditkarte Gold — für wen und wofür geeignet
  body: 'Die Sparkassen-Kreditkarte Gold ist die exklusive Lösung für Kunden, die
    einen erweiterten finanziellen Spielraum für weltweite Zahlungen und einen Premium-Service
    schätzen. Sie richtet sich an Personen, die über das Basiskonto hinausgehende
    Anforderungen an ihre Zahlungsfähigkeit stellen.


    Dieses Produkt ist besonders geeignet für:

    - Geschäftsreisende und Weltenbummler, die eine zuverlässige Zahlungsmöglichkeit
    in jeder Währung benötigen und einen großzügigen Verfügungsrahmen schätzen.

    - Kunden, die größere Anschaffungen tätigen möchten, ohne ihr Girokonto sofort
    zu belasten, da die Karte einen monatlichen Verfügungsrahmen von 5.000 € bietet.

    - Personen, die Wert auf die Sicherheit und regionale Verwurzelung einer öffentlich-rechtlichen
    Institution legen, aber dennoch globale Flexibilität suchen.


    Die wichtigsten Konditionen im Überblick:

    - Monatlicher Verfügungsrahmen: 5.000 € für maximale Flexibilität bei täglichen
    Ausgaben oder Notfällen.

    - Jahresentgelt: 84 €, welches die Bereitstellung des Gold-Status und den dazugehörigen
    Service sichert.

    - Fremdwährungsentgelt: Bei Zahlungen in einer anderen Währung als Euro fällt
    eine Gebühr von 1,75 % an, um die Wechselkursabwicklung transparent zu gestalten.


    Im Vergleich zu Standardkarten bietet die Gold-Variante eine deutlich höhere Liquidität
    und ist damit ideal für Kunden, die eine leistungsstarke Alternative zu einer
    einfachen Debitkarte suchen. Wir empfehlen die Sparkassen-Kreditkarte Gold insbesondere
    in Kombination mit unserem Girokonto Komfort, um eine nahtlose Integration Ihrer
    Finanzflüsse zu gewährleisten.


    Bitte beachten Sie, dass die Erteilung der Karte einer sorgfältigen Kreditwürdigkeitsprüfung
    unterliegt, um eine verantwortungsvolle Kreditvergabe im Sinne unserer sozialen
    Verantwortung zu gewährleisten.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: product_sheet
  source_authority: official
  placeholder: true
