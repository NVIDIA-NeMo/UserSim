  institution_id: sparkasse_lindenhain
- id: 12d1d30d-965b-50ed-950d-dfa2bf0aa341
  title: Sparkassen-Baufinanzierung — Status oder Verlauf einsehen
  body: "Wenn Sie bereits eine Sparkassen-Baufinanzierung nutzen, können Sie jederzeit\
    \ den aktuellen Status Ihres Darlehens sowie den bisherigen Tilgungsverlauf einsehen.\
    \ Gehen Sie dazu wie folgt vor:\n\n1. Fordern Sie bei uns eine aktuelle Aufstellung\
    \ Ihres Darlehenskontos an. Hierbei geben Sie an, ob Sie lediglich den aktuellen\
    \ Reststand oder einen detaillierten Verlauf über die letzten Tilgungsperioden\
    \ benötigen.\n2. Wir prüfen Ihre Identität durch eine strikte Identitätsprüfung,\
    \ um den Schutz Ihrer Kontodaten zu gewährleisten.\n3. Wir stellen Ihnen den gewünschten\
    \ Auszug zur Verfügung. In diesem Dokument sehen Sie detailliert aufgeschlüsselt:\n\
    \   - Die verbleibende Restschuld.\n   - Den Anteil der Tilgung und der Zinsen\
    \ in Ihren letzten Raten.\n   - Das Datum, an dem die aktuelle Sollzinsbindung\
    \ (z. B. über 10 Jahre bei 3,68 % oder 15 Jahre bei 3,91 %) endet.\n   - Die Summe\
    \ etwaiger bereits genutzter jährlicher Sondertilgungen im Rahmen der 5 %-Grenze.\n\
    4. Sie erhalten eine Bestätigung über die ausgehändigten Dokumente. \n\nSollten\
    \ Sie Fragen zur Interpretation der Zahlen haben, stehen wir Ihnen in Ihren regionalen\
    \ Filialen oder telefonisch während der Standard-Geschäftszeiten für eine Erläuterung\
    \ zur Verfügung."
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: how_to_guide
