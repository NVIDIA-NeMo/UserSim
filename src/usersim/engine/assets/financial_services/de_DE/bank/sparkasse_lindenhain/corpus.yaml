  institution_id: sparkasse_lindenhain
- id: 29c271be-0875-537a-a845-62b455c5e3f7
  title: Sparkassenbuch — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Einlagen hat für die Sparkasse Lindenhain höchste Priorität.
    Da das Sparkassenbuch eine klassische Sparform für den langfristigen Vermögensaufbau
    ist, möchten wir Sie auf typische Betrugsmuster aufmerksam machen und Ihnen Tipps
    zum Schutz Ihres Guthabens geben.


    Bitte beachten Sie, dass Mitarbeiter der Sparkasse Lindenhain Sie niemals telefonisch
    oder per E-Mail dazu auffordern werden, Passwörter, PINs oder TANs preiszugeben.
    Seien Sie besonders vorsichtig bei Nachrichten, die eine dringende Handlung fordern
    oder eine angebliche Sicherheitslücke vortäuschen. Eine echte Identitätsprüfung
    erfolgt bei uns stets nach strikten Richtlinien, bevor zustandsändernde Aktionen
    vorgenommen werden.


    Sollten Ihnen Unregelmäßigkeiten in Ihren Kontobewegungen auffallen, ist die sofortige
    Meldung an uns entscheidend. Wenn Sie den Verdacht haben, dass Ihre Zugangsdaten
    kompromittiert wurden, informieren Sie uns umgehend in einer unserer Filialen
    oder über unseren telefonischen Kundenservice.


    Wir erinnern Sie daran, dass Ihre Guthaben durch die gesetzliche Einlagensicherung
    bis zu einem Betrag von 100.000 € geschützt sind, was Ihnen eine zusätzliche Sicherheit
    bietet. Die starke Kundenauthentifizierung ist insbesondere bei sensiblen Vertragsänderungen
    zwingend erforderlich, um Ihr Konto vor unbefugten Zugriffen zu schützen.


    Vertrauen Sie auf unsere regionale Präsenz und die persönliche Beratung in unseren
    Filialen. Im Zweifelsfall ist es immer der sicherste Weg, persönlich bei uns vorstellig
    zu werden, um die Echtheit einer Anfrage zu verifizieren.'
