- id: 35b986ec-1b7b-5040-ab09-334d0de67129
  title: Sparkassen-Kreditkarte Gold — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass eine Zahlung mit Ihrer Sparkassen-Kreditkarte Gold
    nicht erfolgreich abgeschlossen wird oder ein Vorgang als ''ausstehend'' markiert
    ist. Bitte prüfen Sie die folgenden Punkte in der angegebenen Reihenfolge.


    **Symptom: Die Karte wird am Terminal oder beim Online-Kauf abgelehnt**


    **Mögliche Ursachen und Prüfungsschritte:**

    1. **Prüfung des Verfügungsrahmens**: Überprüfen Sie in Ihrem Online-Banking,
    ob Ihr monatlicher Verfügungsrahmen von 5.000 € bereits ausgeschöpft ist. Wenn
    die Summe der aktuellen Umsätze diesen Betrag erreicht hat, wird die Transaktion
    systemseitig abgelehnt.

    2. **Starke Kundenauthentifizierung (SCA)**: Bei Online-Zahlungen ist die starke
    Kundenauthentifizierung zwingend erforderlich. Prüfen Sie, ob Sie die Zahlung
    über Ihr mobiles Endgerät oder Ihr TAN-Verfahren korrekt freigegeben haben.

    3. **Kartenstatus**: Stellen Sie sicher, dass die Karte nicht aufgrund eines Sicherheitsverdachts
    vorübergehend gesperrt wurde.

    4. **Technische Probleme beim Händler**: Gelegentlich liegen Störungen beim Zahlungsprovider
    des Händlers vor. Versuchen Sie es in diesem Fall mit einer anderen Zahlungsmethode.


    **Lösung und Behebung**

    - Falls der Verfügungsrahmen von 5.000 € das Problem ist, können Sie durch einen
    Zahlungseingang auf Ihrem Verrechnungskonto wieder Spielraum schaffen.

    - Bei Problemen mit der Authentifizierung stellen Sie sicher, dass Ihre hinterlegten
    Kontaktdaten aktuell sind.


    **Eskalation**

    Sollte der Vorgang weiterhin fehlschlagen, obwohl der Rahmen ausreichend ist,
    leiten wir den Fall intern an unsere Fachabteilung weiter. Wir prüfen die Fehlermeldung
    im System und informieren Sie über das Ergebnis. In dringenden Fällen können Sie
    eine vorläufige Prüfung durch Ihren Filialmitarbeiter anfordern.


    Für weitere Informationen zum Verfügungsrahmen lesen Sie bitte: Sparkassen-Kreditkarte
    Gold — monatlicher Verfügungsrahmen: Erklärung.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: troubleshooting
  source_authority: official
