- id: f4f61623-bd60-5249-851d-5c82a37a3ba1
  title: Girokonto Komfort mit Sparkassen-Card — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Sicherheit und Vertrauen bilden das Fundament der Sparkasse Lindenhain. Wenn
    Sie sich für das Girokonto Komfort mit Sparkassen-Card entscheiden, profitieren
    Sie nicht nur von unserer regionalen Präsenz, sondern auch von einem umfassenden
    Sicherheitssystem zum Schutz Ihres Vermögens.


    Ein besonderes Risiko bei Girokonten stellen Betrugsmaschen wie Phishing oder
    Social Engineering dar. Bitte beachten Sie, dass die Sparkasse Lindenhain Sie
    niemals per E-Mail, SMS oder Telefon dazu auffordern wird, Ihre PIN, Ihre TANs
    oder andere sensible Zugangsdaten preiszugeben. Solche Anfragen sind stets als
    Betrugsversuche einzustufen.


    Zum Schutz Ihrer Transaktionen setzen wir eine strikte starke Kundenauthentifizierung
    ein. Diese ist insbesondere bei Online-Zahlungen und sensiblen Vertragsänderungen
    zwingend erforderlich, um sicherzustellen, dass nur Sie Zugriff auf Ihr Konto
    haben. Sollten Sie dennoch eine nicht autorisierte Buchung auf Ihren Kontoauszügen
    feststellen, ist eine zeitnahe Meldung entscheidend. Gemäß den gesetzlichen Fristen
    des BGB bearbeiten wir Beschwerden fair und zügig.


    Im Falle eines Verlusts oder Diebstahls Ihrer Sparkassen-Card steht die sofortige
    Schadensbegrenzung im Vordergrund. Wir fordern Sie auf, die Karte umgehend über
    den Notruf 116 116 zu sperren. Durch diese sofortige Maßnahme wird die Haftung
    des Kunden bei Kartenverlust auf maximal 50 € begrenzt, sofern keine grobe Fahrlässigkeit
    vorliegt.


    Wir empfehlen Ihnen, Ihre Kontobewegungen regelmäßig über unser Online-Banking
    zu prüfen. Sollten Ihnen Unregelmäßigkeiten auffallen, wenden Sie sich bitte direkt
    an uns. Wir unterstützen Sie dabei, Ihr Konto zu sichern und etwaige nicht autorisierte
    Vorgänge zu klären.


    Für weitere detaillierte Sicherheitshinweise zur Nutzung unserer digitalen Dienste
    können Sie auch das Dokument Girokonto Komfort mit Sparkassen-Card — Sicherheitstipps
    für Ihr Konto konsultieren.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: da1f3f39-adff-5fb6-ae91-3477f4e0bb6f
  title: Girokonto Komfort mit Sparkassen-Card — Allgemeine Geschäftsbedingungen
  body: 'Die Führung des Girokonto Komfort mit Sparkassen-Card unterliegt den folgenden
    Bedingungen, welche auf den Bestimmungen des Bürgerlichen Gesetzbuches (BGB) sowie
    dem Zahlungskontengesetz basieren.


    1. Kontoführung und Entgelte

    Für die Bereitstellung der regionalen Infrastruktur und den persönlichen Service
    erheben wir ein monatliches Kontoführungsentgelt in Höhe von 7,50 €. Dieses Entgelt
    wird monatlich im Nachhinein vom Konto abgebucht. Die Sparkasse Lindenhain behält
    sich vor, die Entgelte unter Einhaltung der gesetzlichen Fristen und nach transparenter
    Kommunikation anzupassen.


    2. Kreditrahmen und Zinsen

    Sofern mit dem Kunden ein Dispositionskredit vereinbart wurde, werden für die
    Inanspruchnahme dieses Rahmens Zinsen in Höhe von 11,49 % p.a. berechnet. Übersteigt
    die Kontoüberziehung den vereinbarten Rahmen (geduldete Überziehung), findet der
    entsprechende Zinssatz für geduldete Überziehungen von 14,49 % p.a. Anwendung.


    3. Kontoumwandlung und Pfändungsschutz

    Kunden haben das Recht, ihr Konto in ein Pfändungsschutzkonto umzuwandeln. In
    diesem Fall wird der Grundfreibetrag, derzeit 1.590 €, vor Pfändungen geschützt,
    sofern die gesetzlichen Voraussetzungen erfüllt sind.


    4. Kündigung und Beendigung

    Das Vertragsverhältnis kann von beiden Seiten unter Einhaltung der vertraglich
    vereinbarten Kündigungsfristen beendet werden. Bei einer Kündigung durch den Kunden
    ist sicherzustellen, dass alle ausstehenden Verpflichtungen beglichen sind und
    die Sparkassen-Card entweder zurückgegeben oder dauerhaft unbrauchbar gemacht
    wird.


    5. Haftung und Einlagensicherung

    Alle Guthaben auf dem Konto sind durch die gesetzliche Einlagensicherung bis zu
    einem Betrag von 100.000 € geschützt. Die Sparkasse Lindenhain agiert unter der
    Aufsicht der BaFin und der Deutschen Bundesbank, um eine gesetzeskonforme Behandlung
    aller Kunden zu gewährleisten.


    Weitere Details zu den Kosten finden Sie im Dokument Girokonto Komfort mit Sparkassen-Card
    — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: terms_conditions
  source_authority: official
