- id: 20a424e1-7e1a-5f8d-9834-e3fe29978f0e
  title: Sparkassen-Kreditkarte Gold — Probleme mit Zugang oder Login
  body: 'Es kann vorkommen, dass Sie Schwierigkeiten haben, die Details Ihrer Sparkassen-Kreditkarte
    Gold in Ihrem Online-Banking einzusehen oder den Zugang zum Kartenportal zu finden.
    Hier finden Sie Hilfe zur Lösung dieser Probleme.


    **Symptom: Die Kreditkarte Gold wird im Online-Banking nicht angezeigt**

    - **Mögliche Ursache:** Die Karte wurde vor kurzem beantragt und ist noch nicht
    vollständig im System aktiviert oder die Verknüpfung zum Referenzkonto ist noch
    nicht abgeschlossen.

    - **Zu prüfen:** Stellen Sie sicher, dass Sie die Karte bereits aktiviert haben.
    Prüfen Sie, ob Sie die aktuelle Version Ihres Online-Bankings verwenden.

    - **Lösung:** In den meisten Fällen aktualisiert sich die Ansicht innerhalb von
    24 Stunden nach der Aktivierung. Sollte die Karte weiterhin fehlen, prüfen wir
    die Verknüpfung Ihrer Kreditkarte zum Girokonto.


    **Symptom: Fehlermeldung bei der starken Kundenauthentifizierung**

    - **Mögliche Ursache:** Ihr mobiles Gerät ist nicht korrekt mit Ihrem Benutzerprofil
    verknüpft oder die App ist veraltet.

    - **Zu prüfen:** Prüfen Sie, ob eine Internetverbindung besteht und ob die App
    auf dem neuesten Stand ist.

    - **Lösung:** Wir können die Verknüpfung Ihres Geräts zurücksetzen, sodass Sie
    die starke Kundenauthentifizierung neu einrichten können. Dies erfolgt nach einer
    strikten Identitätsprüfung.


    **Wann erfolgt eine Eskalation?**

    Wenn eine technische Störung den Zugriff auf Ihr Konto über einen längeren Zeitraum
    verhindert oder wenn Sie einen unbefugten Zugriff vermuten, leiten wir den Fall
    stufenweise an unsere Filialleitung und gegebenenfalls an die regionale Geschäftsführung
    weiter. Sie erhalten über uns eine Bestätigung über den Eingang Ihres Falls und
    eine Information über den voraussichtlichen Zeitpunkt der Lösung.


    Für eine allgemeine Übersicht zu den Produktfunktionen besuchen Sie bitte die
    Sparkassen-Kreditkarte Gold — Überblick.'
