  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 819c9e2b-6358-5897-a392-6de9c86d2de0
  title: Girokonto Komfort mit Sparkassen-Card — ein typisches Anliegen vollständig
    erledigen
  body: 'Ein typisches Anliegen bei unserem Girokonto ist die Beantragung einer neuen
    Sparkassen-Card nach Verlust oder Beschädigung. So erledigen Sie diesen Vorgang
    vollständig:


    1. Meldung und Sperrung: Informieren Sie uns umgehend über den Verlust Ihrer Karte.
    Wir empfehlen die sofortige Sperrung über den Notruf 116 116, um Ihre Haftung
    auf maximal 50 € zu begrenzen.


    2. Identitätsprüfung: Legen Sie uns in einer unserer Filialen Ihren gültigen Personalausweis
    vor oder führen Sie die starke Kundenauthentifizierung durch, damit wir sicherstellen
    können, dass Sie der rechtmäßige Kontoinhaber sind.


    3. Beantragung: Teilen Sie uns mit, dass Sie eine Ersatzkarte für Ihr Girokonto
    Komfort mit Sparkassen-Card benötigen. Wir werden die Bestellung der neuen Karte
    für Sie einleiten.


    4. Empfang und Aktivierung: Sie erhalten Ihre neue Sparkassen-Card per Post. Die
    dazugehörige PIN wird Ihnen in einem separaten Schreiben zugestellt, um maximale
    Sicherheit zu gewährleisten.


    5. Abschluss: Sobald Sie die Karte erhalten und die erste Zahlung erfolgreich
    mit Ihrer PIN durchgeführt haben, ist der Vorgang abgeschlossen.


    Sie wissen, dass Ihr Anliegen vollständig erledigt ist, wenn die neue Karte im
    Ihren Besitz ist und vollumfänglich für Zahlungen und Abhebungen genutzt werden
    kann.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 005d6cdd-64fe-56b5-bb67-38ff94d1cb09
  title: Girokonto Komfort mit Sparkassen-Card — Abweichung von Ihren Unterlagen
  body: 'Symptom: Ein Kunde berichtet, dass die in den Bankunterlagen hinterlegten
    Daten (z. B. Adresse, Name oder ein vereinbarter Kreditrahmen) nicht mit seinen
    eigenen Unterlagen oder seinen Erinnerungen übereinstimmen.


    Wahrscheinliche Ursachen:

    - Veraltete Stammdaten: Eine Adressänderung wurde nicht mitgeteilt oder nicht
    vollständig verarbeitet.

    - Missverständnis über Konditionen: Der Kunde verwechselt den Dispozins von 11,49
    % mit dem Zinssatz für geduldete Überziehungen (14,49 %).

    - Fehlerhafte Dokumentation: Ein Fehler bei der Erfassung eines Antrags führte
    zu einer Abweichung.


    Prüfschritte für den Support-Mitarbeiter:

    1. Identitätsprüfung: Führen Sie eine strikte Identitätsprüfung des Kunden durch,
    bevor Sie Details aus den Unterlagen bestätigen.

    2. Abgleich: Vergleichen Sie die aktuellen Systemdaten mit den vom Kunden vorgelegten
    Originaldokumenten (z. B. Meldebescheinigung oder alter Vertrag).

    3. Analyse der Differenz: Prüfen Sie, ob die Abweichung ein zeitliches Problem
    (z. B. laufende Änderung) oder ein inhaltlicher Fehler ist.


    Lösung:

    - Bei Adressfehlern: Bitten Sie den Kunden um eine aktuelle Meldebescheinigung
    und führen Sie die Änderung im System durch.

    - Bei Konditionsfragen: Erläutern Sie präzise den Unterschied zwischen dem Dispositionskredit
    (11,49 %) und der geduldeten Überziehung (14,49 %).

    - Bei Fehlern in den Verträgen: Leiten Sie eine Korrektur ein und senden Sie dem
    Kunden die aktualisierten Unterlagen zu.


    Eskalation:

    Sollte eine Diskrepanz bestehen, die rechtliche Auswirkungen hat oder nicht durch
    einfache Korrekturen gelöst werden kann, wird der Fall stufenweise über die Filialleitung
    an die regionale Geschäftsführung eskaliert, um eine gesetzeskonforme Behandlung
    gemäß BGB und Datenschutzrichtlinien zu gewährleisten.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 8e939ef3-d080-5a0b-b910-bbfb211e7f16
  title: Sparkassenbuch — Überblick
  body: 'Das Sparkassenbuch der Sparkasse Lindenhain ist die klassische, sichere Sparform
    für den langfristigen Vermögensaufbau. Es richtet sich an Bürger unserer Region,
    die Wert auf Stabilität, Vertrauen und eine persönliche Betreuung legen. Als öffentlich-rechtliches
    Institut gewährleisten wir Ihnen einen sicheren Zugang zu Ihren Ersparnissen,
    eingebettet in unser dichtes Filialnetz.


    Dieses Produkt ist ideal geeignet, um finanzielle Rücklagen systematisch aufzubauen,
    ohne auf die Sicherheit einer traditionsreichen Institution zu verzichten. Ihr
    Guthaben wird mit einem Zinssatz von 0,5 % verzinst, was Ihnen eine stetige Wertentwicklung
    Ihrer Anlagen ermöglicht.


    Um die Stabilität der Einlagen zu gewährleisten und die langfristige Ausrichtung
    des Sparbuchs zu unterstützen, gilt eine Kündigungsfrist von 3 Monaten für Beträge,
    die über den kündigungsfreien Rahmen hinausgehen. Für Ihre kurzfristigen Liquiditätsbedürfnisse
    bieten wir Ihnen jedoch eine hohe Flexibilität: Monatliche Auszahlungen bis zu
    einem Betrag von 2.000 € sind kostenfrei und ohne Einhaltung der Kündigungsfrist
    möglich.


    Die Sicherheit Ihrer Anlagen steht bei uns an erster Stelle. Wir agieren unter
    der Aufsicht der BaFin und der Deutschen Bundesbank. Zudem schützt die gesetzliche
    Einlagensicherung Ihr Guthaben bis zu einem Betrag von 100.000 €.


    Für die tägliche Abwicklung Ihrer Zahlungen empfehlen wir die Kombination mit
    unserem Girokonto. Weitere Informationen zu den Konditionen für den Zahlungsverkehr
    finden Sie im Dokument Girokonto Komfort mit Sparkassen-Card — Überblick.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: fbfabcdf-8926-53bb-b8a6-5dc573aae2da
  title: 'Sparkassenbuch — Zinssatz: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zur Verzinsung Ihres
    Sparkassenbuchs.


    **Wie hoch ist der aktuelle Zinssatz für mein Sparkassenbuch?**

    Ihr Guthaben auf dem Sparkassenbuch wird derzeit mit einem Zinssatz von 0,5 %
    verzinst. Dieser Satz gilt für das gesamte Guthaben Ihres Kontos.


    **Wann und wie werden die Zinsen meinem Konto gutgeschrieben?**

    Die Zinsen werden jährlich berechnet und Ihrem Sparkassenbuch gutgeschrieben.
    Durch diese regelmäßige Zinsgutschrift erhöht sich Ihr Kapital stetig, sofern
    Sie keine darüber hinausgehenden Auszahlungen vornehmen.


    **Kann sich der Zinssatz ändern?**

    Ja, die Sparkasse Lindenhain passt die Zinssätze bei Bedarf an die aktuelle Marktsituation
    und die geldpolitischen Rahmenbedingungen an. Wir informieren Sie über etwaige
    Änderungen transparent und rechtzeitig.


    Für weitere Details zur Zinsstruktur verweisen wir auf das Dokument Sparkassenbuch
    — Zinsübersicht.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 8ddb80bc-1d00-595d-9f12-a5da97e697c5
  title: Sparkassenbuch — abschließen und aktivieren
  body: 'Wenn Sie sich für die Sicherheit eines Sparkassenbuchs entscheiden, führen
    wir Sie durch einen einfachen und verbindlichen Prozess, um Ihr Konto bei der
    Sparkasse Lindenhain zu eröffnen.


    **Voraussetzungen für den Abschluss:**

    Bitte halten Sie ein gültiges Identifikationsdokument (Personalausweis oder Reisepass)
    bereit. Falls Sie noch kein Kunde unseres Hauses sind, ist eine einmalige Identitätsprüfung
    zwingend erforderlich.


    **Schritte zur Kontoeröffnung:**


    1. **Identitätsprüfung und Beratung:** Sie legen uns Ihren gültigen Ausweis vor.
    Gemeinsam prüfen wir Ihren Bedarf und erläutern Ihnen die Konditionen, insbesondere
    den Zinssatz von 0,5 % sowie die Kündigungsfrist von 3 Monaten.

    2. **Vertragsabschluss:** Wir erstellen den Sparvertrag. Sie prüfen die Details
    und unterzeichnen die Vertragsunterlagen förmlich. In diesem Schritt legen wir
    auch fest, wie Sie über Ihr Konto verfügen möchten.

    3. **Einzahlung des Startkapitals:** Sie zahlen den gewünschten Betrag in bar
    oder per Überweisung ein, um Ihr Sparkassenbuch zu aktivieren. Es gibt keine Mindesteinlage,
    um die Kontoeröffnung zu ermöglichen.

    4. **Aushändigung des Sparbuchs:** Wir händigen Ihnen das physische Sparkassenbuch
    (oder die entsprechende digitale Dokumentation) aus. Damit ist Ihr Konto aktiv
    und verzinst.


    **Woran erkennen Sie, dass der Vorgang erfolgreich war?**

    Nach Abschluss erhalten Sie eine schriftliche Bestätigung über die Kontoeröffnung
    sowie den Nachweis über Ihre erste Einzahlung. Ihr Guthaben wird ab dem Tag der
    Einzahlung mit 0,5 % verzinst.


    Für einen Vergleich mit unseren anderen Kontomodellen schauen Sie bitte in das
    Dokument Sparkassenbuch — im Vergleich zu einem ähnlichen Produkt des Hauses.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 651d00cb-c13b-577f-b17d-92db778f075b
  title: Sparkassenbuch — Preis- und Leistungsverzeichnis
  body: 'Im Rahmen unserer sozialen Verantwortung und zur Förderung regionaler Ersparnisse
    bietet die Sparkasse Lindenhain das Sparkassenbuch zu folgenden Konditionen an:


    - **Kontoführung:** Die Führung des Sparkassenbuchs ist für unsere Kunden kostenfrei.

    - **Zinsgutschrift:** Jährliche Verzinsung des Guthabens mit einem Zinssatz von
    0,5 %.

    - **Kündigungsfreie Auszahlungen:** Monatliche Auszahlungen bis zu einem Betrag
    von 2.000 € sind kostenfrei und ohne Einhaltung der Kündigungsfrist möglich.

    - **Auszahlungen über den Freibetrag:** Für Beträge, die den monatlichen Freibetrag
    von 2.000 € übersteigen, gilt eine Kündigungsfrist von 3 Monaten. Bei einer vorzeitigen
    Verfügung über diese Beträge können gemäß den gesetzlichen Bestimmungen des BGB
    Vorfälligkeitsentschädigungen anfallen.


    Alle Entgelte und Bedingungen sind transparent gestaltet, um die Aufrechterhaltung
    unserer regionalen Infrastruktur und eines persönlichen Services zu gewährleisten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 830cb25e-b115-549a-aa13-32efed94f531
  title: Sparkassenbuch — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass ein Kunde eine Auszahlung aus seinem Sparkassenbuch
    beantragt, diese jedoch nicht wie gewünscht ausgeführt werden kann. Hier sind
    die häufigsten Ursachen und die entsprechenden Lösungen.


    **Symptom: Die gewünschte Auszahlung wurde abgelehnt oder verzögert sich.**


    **Mögliche Ursachen und Prüfungsschritte:**

    1. **Überschreitung des kündigungsfreien Betrags:** Prüfen Sie, ob der gewünschte
    Betrag die Grenze von 2.000 € für den laufenden Monat überschreitet. Wenn ja,
    ist die Kündigungsfrist von 3 Monaten zu beachten.

    2. **Fehlende Identitätsprüfung:** Bei Auszahlungen in einer Filiale muss zwingend
    eine strikte Identitätsprüfung erfolgen. Liegt ein gültiger Ausweis nicht vor,
    kann die Auszahlung nicht durchgeführt werden.

    3. **Unstimmigkeiten bei den Vertragsunterlagen:** Prüfen Sie, ob das physische
    Sparkassenbuch vorliegt oder ob die entsprechenden Vollmachten hinterlegt sind.


    **Lösung:**

    - **Bei Beträgen bis 2.000 €:** Stellen Sie sicher, dass der monatliche Rahmen
    noch nicht ausgeschöpft ist. Wir führen die Auszahlung nach erfolgreicher Identitätsprüfung
    sofort durch.

    - **Bei Beträgen über 2.000 €:** Falls die Kündigungsfrist von 3 Monaten bereits
    abgelaufen ist, wird die Auszahlung sofort veranlasst. Falls nicht, wird die Auszahlung
    zum Ende der Frist vorgemerkt.


    **Eskalation:**

    Sollte eine Auszahlung trotz Einhaltung aller Fristen und Voraussetzungen nicht
    möglich sein, leitet der Filialmitarbeiter den Vorgang stufenweise an die Filialleitung
    und gegebenenfalls an die regionale Geschäftsführung zur Klärung weiter. Sie erhalten
    über den Fortschritt Ihres Anliegens eine verbindliche Auskunft.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: c61661bc-dbcd-5e57-a480-56ef5cb7d237
  title: Sparkassenbuch — Voraussetzungen
  body: 'Das Sparkassenbuch der Sparkasse Lindenhain steht allen Bürgern offen, um
    einen sicheren Zugang zu Finanzdienstleistungen zu gewährleisten. Die folgenden
    Bedingungen gelten für die Eröffnung und Führung:


    | Voraussetzung | Bedingung | Ergebnis |

    | :--- | :--- | :--- |

    | **Identität** | Vorlage eines gültigen Personalausweises oder Reisepasses |
    Kontoeröffnung möglich |

    | **Wohnsitz/Bezug** | Offen für alle Bürger (regionaler Fokus) | Zugang zum Produkt
    gewährt |

    | **Mindesteinlage** | Keine spezifische Mindesteinlage erforderlich | Kontoaktivierung
    möglich |

    | **Rechtliche Handlungsfähigkeit** | Vollständige Geschäftsfähigkeit oder gesetzliche
    Vertretung | Vertragsabschluss möglich |

    | **Einlagensicherung** | Gesetzliche Absicherung durch den Sicherungsfonds |
    Guthaben bis 100.000 € geschützt |


    Für Kunden, die aufgrund sozialer Härten ein Basiskonto benötigen, behandeln wir
    diese Anforderungen prioritär, unabhängig von der Eröffnung eines Sparkassenbuchs.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a3c4e128-b40b-5b30-a6c2-2b74f7c2d46a
  title: Sparkassenbuch — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Um die richtige Entscheidung für Ihre finanziellen Ziele zu treffen, vergleichen
    wir das Sparkassenbuch mit unserem Girokonto Komfort mit Sparkassen-Card.


    **Vergleich nach Dimensionen:**


    - **Zweck:** Das Sparkassenbuch dient dem langfristigen Vermögensaufbau und der
    Sicherheit. Das Girokonto Komfort ist das zentrale Alltagskonto für tägliche Zahlungen.

    - **Verzinsung:** Das Sparkassenbuch bietet einen Zinssatz von 0,5 %, während
    das Girokonto nicht primär der Verzinsung dient.

    - **Kosten:** Die Führung des Sparkassenbuchs ist kostenfrei. Für das Girokonto
    Komfort fällt ein Entgelt von 7,50 € an, welches die flächendeckende Infrastruktur
    und den persönlichen Service finanziert.

    - **Verfügbarkeit:** Beim Sparkassenbuch gibt es einen kündigungsfreien Betrag
    von 2.000 € pro Monat; darüber hinaus gilt eine Frist von 3 Monaten. Das Girokonto
    bietet eine sofortige Verfügbarkeit des Guthabens.


    **Empfehlung:**

    - Wählen Sie das **Sparkassenbuch**, wenn Sie Geld sicher anlegen möchten, einen
    Zinsertrag von 0,5 % erzielen wollen und die Mittel nicht täglich benötigen.

    - Wählen Sie das **Girokonto Komfort**, wenn Sie ein funktionales Konto für Gehaltseingänge,
    Miete und tägliche Einkäufe benötigen.


    Details zu den Kosten des Girokontos finden Sie in Girokonto Komfort mit Sparkassen-Card
    — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 99d23960-ce70-53fe-baf3-a931e7885d3c
  title: Sparkassenbuch — rechtliche Hinweise
  body: 'Die Führung des Sparkassenbuchs bei der Sparkasse Lindenhain unterliegt den
    gesetzlichen Rahmenbedingungen der Bundesrepublik Deutschland. Wir agieren unter
    der Aufsicht der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin) sowie
    der Deutschen Bundesbank.


    **Einlagensicherung:**

    Alle Einlagen sind durch die gesetzliche Einlagensicherung geschützt. Dies bedeutet,
    dass Guthaben bis zu einem Betrag von 100.000 € pro Kunde pro Institut im Falle
    einer Insolvenz abgesichert sind. Diese Absicherung erfolgt gemäß den geltenden
    gesetzlichen Richtlinien.


    **Vertragsgrundlagen:**

    Die Geschäftsbeziehung basiert auf den Bestimmungen des Bürgerlichen Gesetzbuches
    (BGB) sowie den spezifischen Bedingungen für Sparkonten. Insbesondere die Regelungen
    zu Kündigungsfristen und Verfügungen sind rechtlich bindend. Für Beträge, die
    den monatlichen kündigungsfreien Betrag von 2.000 € überschreiten, ist eine Kündigungsfrist
    von 3 Monaten zwingend einzuhalten.


    **Verzinsung und Steuern:**

    Der aktuelle Zinssatz beträgt 0,5 %. Wir weisen darauf hin, dass auf Zinserträge
    die gesetzlichen Kapitalertragsteuern anfallen können, sofern kein Freistellungsauftrag
    vorliegt. Die Sparkasse Lindenhain erbringt eine professionelle Produktberatung,
    jedoch keine individuelle Steuer- oder Rechtsberatung.


    **Datenschutz:**

    Alle Prozesse zur Kontoführung und Identitätsprüfung folgen strikt den aktuellen
    Datenschutzrichtlinien und der DSGVO, um eine gesetzeskonforme Behandlung Ihrer
    Daten zu gewährleisten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: b1bd046e-fcce-52bc-b6b6-8b49f0cbc7f6
  title: Sparkassenbuch — Zinsübersicht
  body: 'Die Sparkasse Lindenhain bietet für das Sparkassenbuch eine transparente
    und stabile Verzinsung an, um den Vermögensaufbau unserer regionalen Kunden zu
    unterstützen.


    **Aktuelle Konditionen:**


    - **Zinssatz:** 0,5 %

    - **Geltungsbereich:** Dieser Zinssatz gilt einheitlich für alle Guthaben auf
    dem Sparkassenbuch, unabhängig von der Höhe des eingezahlten Betrags.

    - **Zinsintervall:** Die Zinsen werden jährlich berechnet und dem Konto gutgeschrieben.


    **Änderungsvorbehalt:**

    Der Zinssatz von 0,5 % ist variabel. Anpassungen erfolgen bei Bedarf basierend
    auf den Marktentwicklungen und den Vorgaben der Europäischen Zentralbank (EZB).
    Wir informieren Sie über Zinsänderungen transparent über die Ihnen bekannten Kommunikationswege.


    **Besonderheiten:**

    Die Verzinsung bleibt auch dann bestehen, wenn Sie den kündigungsfreien Betrag
    von 2.000 € pro Monat voll ausschöpfen. Nur bei einer vollständigen Kündigung
    und Schließung des Kontos endet die Zinsberechnung mit dem Datum der Kontoschließung.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: ef248e2c-7233-59b6-bc78-b3d0de4665ae
  title: Sparkassenbuch — aktuelles Angebot
  body: 'Im Rahmen unserer Kampagne „Regional verwurzelt, sicher sparen“ bieten wir
    unseren bestehenden Kunden die Möglichkeit, ihre langfristigen Rücklagen weiter
    zu optimieren.


    **Das Angebot:**

    Sichern Sie sich jetzt die bewährte Stabilität unseres klassischen Sparprodukts.
    Für alle Neuanlagen sowie bestehende Guthaben auf dem Sparkassenbuch gilt ein
    attraktiver Zinssatz von 0,5 %.


    **Zeitraum:**

    Dieses Angebot ist gültig für alle im Zeitraum vom 01.01.2024 bis zum 31.12.2024
    getätigten Einzahlungen auf ein Sparkassenbuch.


    **Ihre Vorteile:**

    - Garantierter Zinssatz von 0,5 % für Ihren Vermögensaufbau.

    - Flexibilität durch kostenfreie Auszahlungen bis zu 2.000 € pro Monat.

    - Höchste Sicherheit durch die gesetzliche Einlagensicherung bis 100.000 €.


    Nutzen Sie die Gelegenheit, Ihr Erspartes sicher in Ihrer Heimatregion anzulegen.
    Für weitere Informationen zur Funktionsweise der Zinsen lesen Sie bitte Sparkassenbuch
    — Zinssatz: Erklärung.'
