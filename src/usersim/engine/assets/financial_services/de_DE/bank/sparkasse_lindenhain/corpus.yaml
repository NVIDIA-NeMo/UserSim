  institution_id: sparkasse_lindenhain
- id: c0c33b9b-1e04-554a-9ab1-e634f2d43688
  title: Sparkassenbuch — für wen und wofür geeignet
  body: 'Das Sparkassenbuch der Sparkasse Lindenhain ist die klassische und sichere
    Sparform für alle Bürger unserer Region, die Wert auf Stabilität, Vertrauen und
    eine langfristige Planung ihres Vermögens legen. Es richtet sich primär an Kunden,
    die keine kurzfristigen Spekulationen suchen, sondern eine verlässliche Reserve
    aufbauen möchten.


    Dieses Produkt ist besonders geeignet für:

    - Vorsorgende Sparer: Personen, die einen Notgroschen für unvorhergesehene Ereignisse
    anlegen möchten, dabei aber eine feste Struktur bevorzugen.

    - Konservative Anleger: Kunden, die eine risikoarme Anlage suchen und die Sicherheit
    der gesetzlichen Einlagensicherung bis 100.000 € schätzen.

    - Jugendliche und Eltern: Als Instrument zur Vermittlung von Sparsamkeit und zum
    Aufbau eines ersten Grundstocks für spätere Lebensziele.


    Die wesentlichen Merkmale im Überblick:

    - Verzinsung: Sie erhalten eine Verzinsung von 0,5 %, was Ihnen einen stetigen,
    wenn auch moderaten Zuwachs Ihres Kapitals ermöglicht.

    - Liquidität: Für den täglichen Bedarf oder kleinere Notfälle steht Ihnen ein
    monatlicher kündigungsfreier Betrag von 2.000 € zur Verfügung. Dieser Betrag kann
    ohne Vorankündigung abgehoben werden.

    - Planungssicherheit: Für größere Summen gilt eine Kündigungsfrist von 3 Monaten.
    Dies fördert die Disziplin beim Sparen und sichert die langfristige Ausrichtung
    des Kontos.


    Im Vergleich zu einem Girokonto, wie dem Girokonto Komfort mit Sparkassen-Card
    — Überblick, dient das Sparkassenbuch nicht dem Zahlungsverkehr, sondern explizit
    dem Vermögensaufbau. Es bietet eine klare Trennung zwischen verfügbaren Tagesgeldern
    und langfristigen Ersparnissen, was eine bewusste Finanzplanung unterstützt.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: d0986453-fdc4-58e4-bf9d-e997c8026b6d
  title: 'Sparkassenbuch — Kündigungsfrist (Monate): Erklärung'
  body: '### Was bedeutet die Kündigungsfrist für mein Sparkassenbuch?

    Die Kündigungsfrist von 3 Monaten bedeutet, dass Sie Verfügungen über Beträge,
    die über den monatlichen kündigungsfreien Betrag hinausgehen, drei Monate im Voraus
    anmelden müssen. Dies dient der Planungssicherheit der Bank und fördert gleichzeitig
    Ihren langfristigen Vermögensaufbau.


    ### Kann ich nicht auch früher über mein Geld verfügen?

    Ja, das ist möglich. Ihnen steht jeden Monat ein kündigungsfreier Betrag von 2.000
    € zur Verfügung. Dieser Betrag kann ohne Einhaltung der 3 Monate Kündigungsfrist
    sofort abgehoben werden.


    ### Was passiert, wenn ich mehr als 2.000 € sofort benötige?

    Wenn Sie eine Summe benötigen, die den kündigungsfreien Betrag von 2.000 € übersteigt
    und die 3 Monate Kündigungsfrist nicht eingehalten wurde, wird dies als vorzeitige
    Verfügung gewertet. In diesem Fall können gemäß unseren Bedingungen Entgelte anfallen.
    Weitere Informationen hierzu finden Sie im Dokument Sparkassenbuch — Preis- und
    Leistungsverzeichnis.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 5d63c438-1626-58aa-903f-6b333363da91
  title: Sparkassenbuch — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihr Sparkassenbuch auflösen oder in eine andere Sparform überführen
    möchten, führen wir Sie durch diesen Prozess. Bitte beachten Sie, dass für die
    vollständige Auflösung die Kündigungsfrist von 3 Monaten gilt, sofern das Guthaben
    den kündigungsfreien Betrag von 2.000 € übersteigt.


    **Voraussetzungen:**

    - Ein gültiges Identifikationsdokument (Personalausweis oder Reisepass).

    - Die Angabe eines Referenzkontos (z. B. Ihr Girokonto bei uns), auf das das Guthaben
    inklusive Zinsen überwiesen werden soll.


    **Schritte zur Schließung Ihres Sparkassenbuchs:**


    1. **Kündigungswunsch äußern:** Teilen Sie uns mit, dass Sie Ihr Sparkassenbuch
    schließen möchten. Geben Sie dabei an, ob Sie die Kündigungsfrist von 3 Monaten
    einhalten oder eine vorzeitige Verfügung (über 2.000 € hinaus) wünschen.

    2. **Identitätsprüfung:** Wir führen eine strikte Prüfung Ihrer Identität durch.
    Bitte legen Sie uns Ihren gültigen Ausweis vor oder bestätigen Sie Ihre Identität
    über die starke Kundenauthentifizierung im Online-Banking.

    3. **Zielkonto festlegen:** Nennen Sie uns die IBAN des Kontos, auf welches das
    gesamte Restguthaben sowie die bis zum Auflösungsdatum aufgelaufenen Zinsen aus
    dem Zinssatz von 0,5 % übertragen werden sollen.

    4. **Abschluss und Bestätigung:** Wir berechnen den finalen Auszahlungsbetrag
    unter Berücksichtigung etwaiger Vorfälligkeitsentgelte, falls die Kündigungsfrist
    nicht eingehalten wurde. Sie erhalten eine schriftliche Bestätigung über die Kontoschließung
    und die durchgeführte Überweisung.


    Sollten Sie statt einer Schließung einen Wechsel in ein anderes Produkt erwägen,
    prüfen Sie bitte Sparkassenbuch — im Vergleich zu einem ähnlichen Produkt des
    Hauses, um die für Sie passende Alternative zu finden.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: how_to_guide
  source_authority: official
