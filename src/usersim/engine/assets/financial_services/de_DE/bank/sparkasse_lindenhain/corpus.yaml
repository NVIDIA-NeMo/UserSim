- id: d2c3e39b-b6b0-597a-a814-21f7bac1696f
  title: Sparkassen-Baufinanzierung — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf eine Sparkassen-Baufinanzierung abgelehnt
    wird oder ein laufender Vorgang (z. B. eine Erhöhung des Darlehensrahmens) gesperrt
    wird. Hier erfahren Sie, woran das liegen kann und wie wir gemeinsam eine Lösung
    finden.


    **Symptom:** Sie erhalten die Mitteilung, dass Ihr Kreditantrag nicht bewilligt
    werden konnte oder ein Prozess unterbrochen wurde.


    **Mögliche Ursachen:**

    - **Kreditwürdigkeitsprüfung:** Eine Prüfung Ihrer Bonität (z. B. über die SCHUFA)
    hat ergeben, dass die monatliche Belastung im Verhältnis zu Ihrem Einkommen zu
    hoch wäre.

    - **Unzureichende Besicherung:** Der Wert der Immobilie wurde durch eine Bewertung
    als zu niedrig eingestuft, um die gewünschte Kreditsumme abzusichern.

    - **Fehlende Unterlagen:** Es liegen nicht alle erforderlichen Nachweise (z. B.
    Einkommensbelege oder Grundbuchauszüge) in vollständiger und aktueller Form vor.


    **Lösungsschritte:**

    1. Wir analysieren gemeinsam mit Ihnen die Gründe für die Ablehnung.

    2. Prüfen Sie, ob die Kreditsumme angepasst werden kann oder ob zusätzliche Sicherheiten
    (z. B. durch einen Mitantragsteller) bereitgestellt werden können.

    3. Wir gleichen die eingereichten Unterlagen erneut mit den Anforderungen ab,
    um etwaige Lücken zu schließen.


    **Eskalation:**

    Wenn Sie mit der Entscheidung nicht einverstanden sind, wird der Vorgang stufenweise
    vom zuständigen Filialmitarbeiter über die Filialleitung bis zur regionalen Geschäftsführung
    geleitet. Wir prüfen den Fall erneut unter Berücksichtigung aller neuen Informationen.
    Sie erhalten eine schriftliche Mitteilung über das Ergebnis der erneuten Prüfung.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 547e6a2b-83e3-5b79-b5f6-7b452549edb7
  title: Sparkassen-Baufinanzierung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Mitarbeiter dabei, Kunden zu bewerten, ob eine
    Umschuldung oder eine Änderung der Zinsbindungsstrategie innerhalb der Sparkassen-Baufinanzierung
    sinnvoll ist.


    Ein Wechsel oder ein Upgrade ist in folgenden Szenarien empfehlenswert:


    - **Zinsvorteil:** Wenn der Kunde derzeit ein Darlehen mit einem Zinssatz hält,
    der deutlich über unseren aktuellen Konditionen von 3,68 % (bei 10 Jahren Zinsbindung)
    oder 3,91 % (bei 15 Jahren Zinsbindung) liegt, kann eine Umschuldung die monatliche
    Rate senken.

    - **Sicherheit gegen Zinsanstieg:** Kunden mit kurzen Restlaufzeiten ihrer Zinsbindung
    sollten über ein Upgrade auf eine längere Bindung (z. B. von 10 auf 15 Jahre)
    nachdenken, falls eine allgemeine Marktzinserhöhung erwartet wird, um die Rate
    von 3,91 % langfristig zu sichern.

    - **Effektive Tilgung:** Kunden, die über liquide Mittel verfügen, können prüfen,
    ob die Nutzung der jährlichen Sondertilgung von 5 % vorteilhafter ist als ein
    kompletter Wechsel des Produkts, da dies die Restschuld ohne Vorfälligkeitsentschädigung
    reduziert.


    **Wer profitiert wovon?**

    - Der sicherheitsorientierte Kunde wählt die 15-jährige Bindung zu 3,91 %.

    - Der Kunde, der auf moderate Zinsrückgänge setzt, wählt die 10-jährige Bindung
    zu 3,68 %.

    - Kunden mit schwankendem Einkommen sollten die 5 % Sondertilgungsoption priorisieren.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 9bc0dff7-ef61-50aa-a8ea-38403cd0ceaf
  title: Sparkassen-Baufinanzierung — Vergleich mit Alternativen und wann es nicht
    passt
  body: 'Die Sparkassen-Baufinanzierung ist die spezialisierte Lösung für den langfristigen
    Erwerb oder Bau von Immobilien. Um die richtige Entscheidung zu treffen, ist ein
    Vergleich mit Alternativen hilfreich.


    **Vergleich mit dem Sparkassen-Privatkredit**

    Während die Sparkassen-Baufinanzierung durch niedrige Zinsen (z. B. 3,68 % für
    10 Jahre oder 3,91 % für 15 Jahre) und sehr lange Laufzeiten besticht, bietet
    der Sparkassen-Privatkredit eine schnellere Abwicklung und höhere Flexibilität
    für kleinere Beträge. Der Privatkredit ist jedoch aufgrund höherer Zinsen für
    Immobilienkäufe unrentabel.


    **Wann die Sparkassen-Baufinanzierung nicht passt:**

    - **Kurzfristige Finanzierung:** Wenn Sie nur eine Überbrückung für wenige Monate
    benötigen, ist ein Baukredit aufgrund der festen Zinsbindungen und etwaiger Vorfälligkeitsentschädigungen
    nicht geeignet.

    - **Fehlende Sicherheiten:** Da das Darlehen durch die Immobilie besichert wird,
    ist das Produkt nicht anwendbar, wenn kein werthaltiges Objekt als Sicherheit
    dient.

    - **Unbeständiges Einkommen:** Da die monatlichen Raten über Jahrzehnte zuverlässig
    bedient werden müssen, passt dieses Produkt nicht zu Personen ohne stabiles, nachweisbares
    Einkommen.


    **Ihre Vorteile bei uns:**

    Wir bieten Ihnen nicht nur faire Konditionen, sondern auch die Sicherheit eines
    öffentlich-rechtlichen Instituts. Guthaben sind zudem durch die gesetzliche Einlagensicherung
    bis 100.000 € geschützt. Unsere Beratung erfolgt regional und persönlich, um Ihre
    individuelle Lebenssituation zu berücksichtigen.'
