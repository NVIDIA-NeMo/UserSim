- id: 24923b6b-13e2-5e00-96d6-f6dde0b95330
  title: Sparkassen-Baufinanzierung — abschließen und aktivieren
  body: 'Der Weg zu Ihrem Eigenheim beginnt mit einer fundierten Planung. Damit Sie
    die Sparkassen-Baufinanzierung erfolgreich abschließen können, folgen Sie bitte
    diesen Schritten:


    1. **Beratungsgespräch vereinbaren**: Teilen Sie uns Ihren Finanzierungswunsch
    und die Eckdaten des Objekts (Kaufpreis, geschätzter Wert, vorhandenes Eigenkapital)
    mit. Wir analysieren gemeinsam mit Ihnen Ihren finanziellen Spielraum.


    2. **Einreichung der Unterlagen**: Um eine präzise Prüfung vornehmen zu können,
    übergeben Sie uns die erforderlichen Dokumente. Dazu gehören in der Regel Einkommensnachweise
    (z. B. die letzten drei Gehaltsabrechnungen), ein aktueller Personalausweis sowie
    Unterlagen zum Objekt (z. B. Grundbuchauszug, Baupläne oder ein Gutachten). Eine
    detaillierte Liste finden Sie in der Sparkassen-Baufinanzierung — Voraussetzungen.


    3. **Kreditwürdigkeitsprüfung**: Wir führen eine detaillierte Prüfung Ihrer Bonität
    und des Beleihungswertes der Immobilie durch. In diesem Schritt wird ermittelt,
    ob eine Finanzierung zu den gewünschten Konditionen, wie beispielsweise dem Zinssatz
    von 3,68 % für 10 Jahre oder 3,91 % für 15 Jahre, möglich ist.


    4. **Vertragsabschluss**: Nach positiver Prüfung erstellen wir Ihren individuellen
    Darlehensvertrag. Sie prüfen die Konditionen und unterzeichnen das Dokument gemeinsam
    mit Ihrem Partner oder Mitantragsteller in einer unserer Filialen.


    5. **Sicherung und Auszahlung**: Wir veranlassen die Eintragung der Grundschuld
    im Grundbuch als Absicherung. Sobald die Voraussetzungen erfüllt sind, erfolgt
    die Auszahlung des Darlehens direkt an den Verkäufer oder den Bauträger.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie die schriftliche
    Bestätigung über die Darlehensauszahlung erhalten und die erste monatliche Rate
    über Ihr Konto abgebucht wird.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a5df0e78-7912-5da3-9d8d-483b74bba949
  title: Sparkassen-Baufinanzierung — Preis- und Leistungsverzeichnis
  body: 'Dieses Verzeichnis dient der internen Unterstützung bei der Kundenberatung
    für die Sparkassen-Baufinanzierung. Die Entgelte und Konditionen sind transparent
    gestaltet, um die regionale Infrastruktur und den persönlichen Service der Sparkasse
    Lindenhain zu gewährleisten.


    **Zinskonditionen (Sollzinssätze):**

    - Zinsbindung 10 Jahre: 3,68 %

    - Zinsbindung 15 Jahre: 3,91 %


    **Tilgungsoptionen:**

    - Jährliche Sondertilgung: Kostenfrei bis zu einem Betrag von 5 % der ursprünglichen
    Darlehenssumme pro Kalenderjahr.


    **Sonstige Bestimmungen:**

    - Die oben genannten Zinssätze gelten unter Vorbehalt einer positiven Kreditwürdigkeitsprüfung.

    - Für eine detaillierte Aufstellung der rechtlichen Rahmenbedingungen verweisen
    wir auf die Sparkassen-Baufinanzierung — rechtliche Hinweise.'
