- id: b482050a-a354-5260-a6e7-bde85f89e0dd
  title: Girokonto Komfort mit Sparkassen-Card — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Finanzen hat für die Sparkasse Lindenhain höchste Priorität.
    Um Ihr Girokonto Komfort mit Sparkassen-Card optimal zu schützen, bitten wir Sie,
    die folgenden Sicherheitshinweise aufmerksam zu lesen und im Alltag anzuwenden.


    Ein aktuelles Risiko stellen sogenannte Phishing-Versuche dar. Hierbei erhalten
    Kunden gefälschte E-Mails oder SMS, die eine dringende Handlung fordern, wie etwa
    die Bestätigung von Kontodaten oder die Aktualisierung eines Sicherheitszertifikats.
    Bitte beachten Sie: Die Sparkasse Lindenhain wird Sie niemals per E-Mail oder
    SMS dazu auffordern, Passwörter, PINs oder TANs auf einer externen Webseite einzugeben.
    Solche Anfragen sind stets Betrugsversuche.


    Nutzen Sie für Ihre Online-Banking-Vorgänge ausschließlich die starke Kundenauthentifizierung.
    Dies ist eine zwingende Voraussetzung, um Ihre Transaktionen abzusichern und unbefugte
    Zugriffe zu verhindern.


    Sollten Sie den Verdacht haben, dass Ihre Sparkassen-Card verloren gegangen ist
    oder gestohlen wurde, ist schnelles Handeln entscheidend. Bitte nutzen Sie umgehend
    den Notruf 116 116, um die Karte sofort zu sperren. Durch die rechtzeitige Sperrung
    und Meldung kann Ihre Haftung bei missbräuchlicher Nutzung auf maximal 50 € begrenzt
    werden.


    Wir empfehlen Ihnen zudem, Ihre Kontoumsätze regelmäßig zu prüfen. Sollten Ihnen
    Vorgänge auffallen, die Sie nicht selbst autorisiert haben, informieren Sie uns
    bitte unverzüglich. Wir bearbeiten solche Fälle fair und zeitnah gemäß den gesetzlichen
    Fristen des BGB. Für weitere Informationen zum Schutz vor Betrug verweisen wir
    auf das Dokument Girokonto Komfort mit Sparkassen-Card — Schutz vor Betrug und
    nicht autorisierten Vorgängen.'
