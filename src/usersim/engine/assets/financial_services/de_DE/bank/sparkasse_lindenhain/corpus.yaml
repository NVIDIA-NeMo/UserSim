- id: e630dc1d-2fa0-5d90-869b-f6c194566568
  title: Sparkassen-Privatkredit — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Wenn Sie einen Sparkassen-Privatkredit in Betracht ziehen und diesen mit
    anderen Angeboten vergleichen, ist es von entscheidender Bedeutung, auf die Sicherheit
    Ihres Finanzierungsplans zu achten. Im aktuellen Marktumfeld gibt es vermehrt
    Betrugsmaschen, insbesondere durch sogenannte ''Kreditvermittler'', die Ihnen
    unrealistisch niedrige Zinsen versprechen oder eine sofortige Zusage ohne Kreditwürdigkeitsprüfung
    garantieren.


    Bitte beachten Sie, dass die Sparkasse Lindenhain niemals eine Kreditzusage ohne
    eine finale, sorgfältige Prüfung Ihrer Bonität gibt. Ein wesentliches Warnsignal
    für Betrug ist die Forderung von Vorauszahlungen. Wir fordern Sie niemals auf,
    Gebühren für ''Bearbeitungskosten'', ''Versicherungen'' oder ''Sicherheitsleistungen''
    im Voraus zu bezahlen, bevor der Kreditbetrag auf Ihrem Konto eingegangen ist.
    Seriöse Finanzdienstleistungen integrieren anfallende Kosten transparent in den
    Kreditvertrag oder führen diese über die Auszahlung ab.


    Um Ihre Sicherheit zu gewährleisten, führen wir vor jeder zustandsändernden Aktion
    oder der Auskunft über Kontodaten eine strikte Identitätsprüfung durch. Die starke
    Kundenauthentifizierung ist insbesondere bei sensiblen Vertragsänderungen zwingend
    erforderlich. Seien Sie misstrauisch gegenüber E-Mails oder SMS, die Sie auffordern,
    auf externe Links zu klicken, um Kreditunterlagen zu ''bestätigen''.


    Sollten Sie den Verdacht haben, Opfer eines Betrugsversuchs geworden zu sein oder
    bemerken Sie nicht autorisierte Vorgänge im Zusammenhang mit Ihrem Kreditkonto,
    informieren Sie uns bitte umgehend. Wir bearbeiten Beschwerden und Betrugsfälle
    fair und zeitnah gemäß den gesetzlichen Fristen des BGB. Falls im Zuge Ihrer Finanzierung
    auch eine Karte betroffen ist, nutzen Sie zur sofortigen Sperrung den Notruf 116
    116, um Ihre Haftung auf maximal 50 € zu begrenzen.


    Vertrauen Sie auf die regionale Präsenz und die Sicherheit unseres Instituts,
    das unter der Aufsicht der BaFin und der Deutschen Bundesbank agiert. Für weitere
    Details zu unseren Konditionen verweisen wir auf das Dokument Sparkassen-Privatkredit
    — Überblick.'
