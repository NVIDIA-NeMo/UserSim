- id: f6a6c9e6-8b8d-5399-a074-3c898035015e
  title: Werkzeugreferenz dispute_status
  body: 'Das Werkzeug `dispute_status` erlaubt es dem Agenten, den aktuellen Fortschritt
    einer Reklamation zu einer spezifischen Kontobewegung einzusehen. Der Agent führt
    diese Abfrage direkt im System durch.


    **Signatur und Parameter:**

    - `transaction_id`: Die eindeutige Kennung der Transaktion, für die ein Dispute
    (Widerspruch/Reklamation) eingereicht wurde. Diese ID wird entweder vom Kunden
    genannt oder über das Werkzeug `get_account_transactions` ermittelt.


    **Effekt:**

    Das Tool liefert den aktuellen Bearbeitungsstatus der Reklamation sowie etwaige
    interne Vermerke zum Fortschritt der Untersuchung. Der Agent nutzt diese Informationen,
    um den Kunden über den Stand des Verfahrens gemäß den gesetzlichen Fristen des
    BGB transparent zu informieren.'
