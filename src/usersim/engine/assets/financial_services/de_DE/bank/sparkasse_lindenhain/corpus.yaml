- id: 3b9623b9-4fd5-5199-bbe3-53a111ef9e12
  title: Girokonto Komfort mit Sparkassen-Card — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter bei der Unterstützung
    von Kunden, die ein Girokonto Komfort mit Sparkassen-Card eröffnen möchten. Bitte
    führen Sie den Kunden durch die folgenden Schritte, um eine gesetzeskonforme und
    vollständige Kontoeröffnung zu gewährleisten.


    Schritt 1: Identitätsprüfung

    Bevor ein Konto eröffnet werden kann, ist eine strikte Identitätsprüfung zwingend
    erforderlich. Prüfen Sie die Gültigkeit des Personalausweises oder Reisepasses.
    Bei einer Eröffnung in der Filiale erfolgt die Prüfung unmittelbar; bei Online-Anträgen
    muss die Identifizierung über die vorgesehenen rechtssicheren Verfahren abgeschlossen
    sein.


    Schritt 2: Produktwahl und Bedingungsvereinbarung

    Informieren Sie den Kunden über die Positionierung des Girokonto Komfort mit Sparkassen-Card
    als zentrales Alltagskonto. Weisen Sie explizit auf das monatliche Kontoführungsentgelt
    von 7,50 € hin und erläutern Sie, dass diese Gebühr den persönlichen Service und
    das Filialnetz der Sparkasse Lindenhain finanziert.


    Schritt 3: Festlegung des Kreditrahmens

    Klären Sie mit dem Kunden, ob ein Dispositionskredit gewünscht ist. Führen Sie
    eine sorgfältige Kreditwürdigkeitsprüfung durch. Weisen Sie darauf hin, dass für
    diesen Kredit ein Zinssatz von 11,49 % gilt. Machen Sie deutlich, dass eine Kreditzusage
    erst nach finaler Prüfung garantiert werden kann.


    Schritt 4: Vertragsschluss und Kartenbestellung

    Nach erfolgreicher Prüfung und Zustimmung des Kunden zu allen Bedingungen wird
    der Vertrag unterzeichnet. Die integrierte Sparkassen-Card wird automatisch beantragt
    und dem Kunden auf dem zugeschriebenen Postweg zugestellt.


    Schritt 5: Aktivierung

    Informieren Sie den Kunden über die notwendigen Schritte zur ersten Nutzung der
    Karte und den Zugang zum Online-Banking mittels der starken Kundenauthentifizierung.
    Für weitere Details zur Aktivierung verweisen Sie auf das Dokument Girokonto Komfort
    mit Sparkassen-Card — abschließen und aktivieren.'
