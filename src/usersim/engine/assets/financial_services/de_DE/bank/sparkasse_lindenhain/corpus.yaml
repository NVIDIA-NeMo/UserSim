- id: ead626cb-57c4-5cd2-bc2e-1fdc4ee6dd37
  title: Sparkassenbuch — zwischen Tarifen wählen
  body: 'Wenn Sie entscheiden müssen, welches Produkt am besten zu Ihren Zielen passt,
    hilft Ihnen dieser Vergleich zwischen unserem Sparkassenbuch und dem Girokonto
    Komfort mit Sparkassen-Card.


    Sparkassenbuch:

    - Zweck: Langfristiger Vermögensaufbau.

    - Verzinsung: 0,5 %.

    - Verfügbarkeit: Kündigungsfreier Betrag von 2.000 € pro Monat; darüber hinaus
    gilt eine Kündigungsfrist von 3 Monaten.

    - Kosten: Kostenlos in der Grundführung.

    - Geeignet für: Kunden, die Sicherheit und Zinserträge suchen und ihr Geld nicht
    täglich in voller Höhe benötigen.


    Girokonto Komfort mit Sparkassen-Card:

    - Zweck: Tägliche Zahlungen und Liquidität.

    - Verzinsung: Keine Verzinsung des Guthabens.

    - Verfügbarkeit: Sofortiger Zugriff auf das gesamte Guthaben ohne Kündigungsfristen.

    - Kosten: Monatliches Entgelt von 7,50 € zur Aufrechterhaltung der regionalen
    Infrastruktur.

    - Geeignet für: Kunden, die ein zentrales Alltagskonto für tägliche Transaktionen
    benötigen.


    Zusammenfassend: Wählen Sie das Sparkassenbuch für den sicheren Aufbau Ihres Vermögens
    mit 0,5 % Zinsen und akzeptieren Sie im Gegenzug die 3 Monate Kündigungsfrist
    für größere Beträge. Wählen Sie das Girokonto, wenn Sie maximale Flexibilität
    benötigen und bereit sind, das Entgelt von 7,50 € für den persönlichen Service
    zu zahlen.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: ea93dac8-7201-55ae-999e-f87f43c4efe4
  title: Sparkassenbuch — Datenschutz und Datenverarbeitung
  body: 'Die Sparkasse Lindenhain legt großen Wert auf die vertrauliche Behandlung
    Ihrer Daten. Die Verarbeitung Ihrer personenbezogenen Daten im Zusammenhang mit
    Ihrem Sparkassenbuch erfolgt strikt nach den geltenden Datenschutzrichtlinien
    und der Datenschutz-Grundverordnung (DSGVO).


    Zweck der Datenverarbeitung:

    Wir verarbeiten Ihre Daten, um die Führung Ihres Sparkassenbuchs zu gewährleisten,
    die gesetzliche Identitätsprüfung durchzuführen und die Zinsgutschrift von 0,5
    % korrekt anzuwenden. Zudem stützen sich unsere Empfehlungen auf eine sorgfältige
    Kreditwürdigkeitsprüfung, sofern Sie weitere Finanzprodukte anfragen.


    Aufsicht und Sicherheit:

    Wir agieren unter der Aufsicht der BaFin und der Deutschen Bundesbank. Ihre Einlagen
    sind durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000 €
    geschützt. Zum Schutz Ihrer Daten ist die starke Kundenauthentifizierung bei sensiblen
    Vertragsänderungen zwingend erforderlich.


    Weitergabe von Daten:

    Eine Weitergabe Ihrer Daten an Dritte erfolgt nur, wenn dies gesetzlich vorgeschrieben
    ist oder zur Erfüllung des Vertrages (z. B. an die Einlagensicherung) notwendig
    ist. Wir gewährleisten eine faire und gesetzeskonforme Kundenbehandlung gemäß
    den Vorgaben des BGB und des Zahlungskontengesetzes.


    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    entgegenstehen. Für weitere Informationen besuchen Sie bitte das Dokument Sparkassenbuch
    — rechtliche Hinweise.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 43b84a96-fb1e-5c91-8a06-9de95500a21e
  title: Sparkassenbuch — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Ein Sparkassenbuch ist aufgrund seiner traditionellen Natur und der damit
    verbundenen Sicherheit ein beliebtes Instrument für den langfristigen Vermögensaufbau.
    Genau diese Sicherheit wird von Betrügern oft ausgenutzt, um Kunden durch gezielte
    Manipulationen zu täuschen. Wenn Sie unser Produkt mit anderen Finanzanlagen vergleichen,
    sollten Sie besonders auf folgende Warnsignale achten.


    Eine häufige Masche ist die sogenannte „Zinsoptimierung“. Hierbei kontaktieren
    Sie Personen, die vorgeben, Mitarbeiter der Sparkasse Lindenhain zu sein, und
    Ihnen einen kurzfristig deutlich höheren Zinssatz als die regulären 0,5 % versprechen.
    Um diesen angeblichen Vorteil zu nutzen, werden Sie aufgefordert, Ihr Guthaben
    auf ein „Sicherheitskonto“ oder ein externes Anlagekonto zu überweisen. Bitte
    beachten Sie: Die Sparkasse Lindenhain wird Sie niemals dazu auffordern, Gelder
    auf Konten Dritter zu übertragen, um Zinskonditionen zu verbessern.


    Ein weiteres Warnsignal ist der gefälschte Zeitdruck. Betrüger behaupten oft,
    dass Ihr Sparkassenbuch aufgrund regulatorischer Änderungen sofort aufgelöst werden
    müsse, wenn nicht innerhalb weniger Stunden eine Identitätsprüfung durch die Preisgabe
    von Zugangsdaten oder PINs erfolgt. Wir betonen ausdrücklich: Wir fragen Sie niemals
    per E-Mail, SMS oder Telefon nach Ihren geheimen Passwörtern oder PINs.


    Sollten Sie eine Nachricht erhalten haben, die Ihnen untypische Transaktionen
    oder ungewöhnliche Zinsversprechen ankündigt, ist die erste und wichtigste Maßnahme
    die sofortige Kontaktaufnahme mit uns über die bekannten regionalen Kanäle. Prüfen
    Sie im Zweifelsfall Ihre offiziellen Kontoauszüge. Wir agieren strikt unter der
    Aufsicht der BaFin und der Deutschen Bundesbank, um Ihr Guthaben zu schützen.
    Eine schnelle Meldung verdächtiger Vorfälle ist entscheidend, um Ihre Haftung
    im Falle eines Betrugs zu begrenzen und die Sicherheit Ihres Vermögens zu gewährleisten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 38286bd0-1083-5f2b-9cfe-7147739dafad
  title: Sparkassenbuch — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient der Unterstützung von Mitarbeitern bei der Beratung
    und Abwicklung von Vorgängen rund um das Sparkassenbuch. Es ist essenziell, die
    Kunden über die spezifischen Rahmenbedingungen dieses Produkts transparent aufzuklären,
    um Missverständnisse bei der Verfügbarkeit von liquiden Mitteln zu vermeiden.


    Die zentrale Einschränkung des Sparkassenbuchs liegt in der Verfügbarkeit des
    Guthabens. Es handelt sich nicht um ein täglich voll verfügbarmente Konto. Für
    Beträge, die über den kündigungsfreien Rahmen hinausgehen, gilt eine gesetzliche
    und vertragliche Kündigungsfrist von 3 Monaten. Dies bedeutet, dass Kunden, die
    eine größere Summe abheben möchten, diese Frist einhalten müssen, sofern sie nicht
    auf den monatlichen Freibetrag zurückgreifen.


    Ein wesentlicher Sonderfall ist der kostenfreie monatliche Verfügungsrahmen. Kunden
    können bis zu einem Betrag von 2.000 € pro Monat ohne Einhaltung der Kündigungsfrist
    abheben. Wird dieser Betrag in einem Kalendermonat überschritten, unterliegt der
    darüber liegende Betrag der genannten Kündigungsfrist von 3 Monaten, es sei denn,
    es liegen besondere soziale Härten vor, die eine prioritäre Behandlung gemäß unserer
    sozialen Verantwortung rechtfertigen.


    Die Verzinsung erfolgt mit einem Zinssatz von 0,5 %. Dieser Zins wird auf das
    jeweilige Guthaben berechnet. In Sonderfällen, wie beispielsweise bei Pfändungen,
    ist zu prüfen, ob das Konto in ein Pfändungsschutzkonto umgewandelt werden muss,
    um den Grundfreibetrag zu schützen. Alle Prozesse folgen strikt dem BGB und dem
    Zahlungskontengesetz.


    Zusammenfassend sind die harten Grenzen:

    - Kündigungsfrist: 3 Monate

    - Kostenfreie monatliche Abhebung: bis zu 2.000 €

    - Zinssatz: 0,5 %


    Bei Eskalationen bezüglich dieser Einschränkungen ist der Vorgang stufenweise
    vom Filialmitarbeiter über die Filialleitung bis zur regionalen Geschäftsführung
    zu leiten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bcd3d174-520b-5995-aaf7-0cf19860812f
  title: Sparkassenbuch — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kosten und Entgelten im Zusammenhang mit
    dem Sparkassenbuch.


    **Welche Kontoführungsgebühren fallen für das Sparkassenbuch an?**

    Die Führung eines Sparkassenbuchs ist in der Regel kostenfrei. Wir verfolgen das
    Ziel, jedem Bürger einen sicheren und fairen Zugang zu Basisfinanzdienstleistungen
    zu ermöglichen. Im Gegensatz zu unserem Girokonto Komfort, welches mit 7,50 €
    bepreist ist, dient das Sparkassenbuch primär dem sicheren Sparen ohne monatliche
    Grundgebühren.


    **Gibt es Gebühren für die Auszahlung von Guthaben?**

    Auszahlungen innerhalb des kostenfreien monatlichen Rahmens von 2.000 € sind gebührenfrei.
    Für Auszahlungen, die über diesen Betrag hinausgehen und unter Einhaltung der
    Kündigungsfrist von 3 Monaten erfolgen, fallen ebenfalls keine zusätzlichen Entgelte
    an. Sollten Sie eine vorzeitige Auflösung wünschen, die über die gesetzlichen
    Rahmenbedingungen hinausgeht, weisen wir auf die entsprechenden Konditionen in
    unserem Preis- und Leistungsverzeichnis hin.


    Weitere Details finden Sie in der Dokumentation: Sparkassenbuch — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 54acd136-8df5-5b38-8d69-ba7dc0485980
  title: Sparkassenbuch — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Stand Ihres Guthabens oder die Historie Ihrer Ein-
    und Auszahlungen für Ihr Sparkassenbuch einsehen möchten, folgen Sie bitte diesen
    Schritten. Wir unterstützen Sie dabei omnikanal über unsere Filialen oder den
    telefonischen Kundenservice.


    **Voraussetzungen:**

    Sie müssen im Besitz eines gültigen Ausweisdokuments sein oder über eine aktive
    starke Kundenauthentifizierung für das Online-Banking verfügen.


    **Schritt-für-Schritt-Anleitung:**


    1. **Identitätsprüfung:** Nennen Sie uns Ihr Sparkassenbuch-Konto oder legen Sie
    in der Filiale Ihr Ausweisdokument sowie das physische Sparkassenbuch vor. Wir
    führen eine strikte Identitätsprüfung durch, bevor uns Auskünfte über Kontodaten
    erteilt werden dürfen.

    2. **Anforderung der Auskunft:** Bitten Sie uns explizit um die Auskunft über
    den aktuellen Kontostand sowie den Verlauf der letzten Transaktionen. Geben Sie
    dabei an, für welchen Zeitraum Sie den Verlauf einsehen möchten.

    3. **Prüfung der Zinsgutschriften:** Wir bestätigen Ihnen den aktuellen Saldo.
    In diesem Zuge weisen wir Sie auf die bereits gutgeschriebenen Zinsen in Höhe
    von 0,5 % hin, sofern der entsprechende Zinszeitraum bereits abgeschlossen ist.

    4. **Dokumentenübergabe:** Wir händigen Ihnen einen aktuellen Kontoauszug aus
    oder stellen Ihnen diesen über Ihr Online-Banking zur Verfügung. Dieser Beleg
    enthält alle relevanten Buchungen und den aktuellen Endstand.


    **Woran Sie erkennen, dass der Vorgang erfolgreich war:**

    Der Vorgang ist abgeschlossen, sobald Sie einen physischen oder digitalen Beleg
    erhalten haben, der Ihren aktuellen Kontostand sowie alle gewünschten Transaktionen
    aufschlüsselt. Sollten Sie Fragen zur Berechnung der Zinsen haben, verweisen wir
    auf das Dokument: Sparkassenbuch — wie Zinsen berechnet und angewendet werden.'
