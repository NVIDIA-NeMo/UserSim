- id: 1ab42281-d15a-55e0-a7ed-cbc303a73854
  title: 'Sparkassen-Kreditkarte Gold — monatlicher Verfügungsrahmen: Erklärung'
  body: 'Hier finden Sie Antworten zu den wichtigsten Fragen rund um den Verfügungsrahmen
    Ihrer Sparkassen-Kreditkarte Gold.


    **Was genau ist der monatliche Verfügungsrahmen?**

    Der Verfügungsrahmen ist der maximale Betrag, den Sie innerhalb eines Abrechnungsmonats
    mit Ihrer Kreditkarte für Zahlungen, Online-Käufe und Bargeldabhebungen nutzen
    können. Bei der Sparkassen-Kreditkarte Gold liegt dieser Rahmen standardmäßig
    bei 5.000 €.


    **Kann ich den Rahmen von 5.000 € überschreiten?**

    Nein, eine Überschreitung des festgesetzten Rahmens ist im Regelfall nicht möglich.
    Wenn der Betrag von 5.000 € erreicht ist, werden weitere Transaktionen abgelehnt,
    bis die ausstehenden Beträge ausgeglichen wurden oder eine Erhöhung des Rahmens
    genehmigt wurde.


    **Wie kann ich meinen Verfügungsrahmen ändern?**

    Eine Änderung des Rahmens ist nach einer erneuten Kreditwürdigkeitsprüfung möglich.
    Bitte wenden Sie sich hierzu an Ihren Filialmitarbeiter oder nutzen Sie die entsprechenden
    Optionen im Online-Banking. Beachten Sie, dass eine Erhöhung nicht garantiert
    werden kann.'
