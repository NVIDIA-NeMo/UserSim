  institution_id: sparkasse_lindenhain
- id: 07e83d67-c3e2-57b1-baa9-03662b54f7d6
  title: Sparkassen-Privatkredit — fehlgeschlagener oder ausstehender Vorgang
  body: 'Wenn Ihr Antrag auf einen Sparkassen-Privatkredit abgelehnt wurde oder der
    Vorgang unerwartet verzögert ist, kann dies verschiedene Ursachen haben. Bitte
    prüfen Sie die folgenden Punkte in der angegebenen Reihenfolge.


    Symptom: Der Kreditantrag wurde abgelehnt oder es erfolgt keine Rückmeldung.


    1. Prüfung der Dokumentation: Überprüfen Sie, ob alle eingereichten Einkommensnachweise
    vollständig und aktuell sind. Fehlende oder veraltete Dokumente führen häufig
    zu einer Verzögerung oder einer automatischen Ablehnung im Prüfungsprozess.


    2. Prüfung der Bonitätskriterien: Stellen Sie sicher, dass die gewünschte Kreditsumme
    (bis maximal 50.000 €) in einem angemessenen Verhältnis zu Ihrem monatlichen Nettoeinkommen
    steht. Eine zu hohe monatliche Belastung kann zu einer Ablehnung führen.


    3. Abgleich der Identitätsdaten: Vergewissern Sie sich, dass die Angaben in Ihrem
    Antrag exakt mit den Daten in Ihrem Personalausweis übereinstimmen. Diskrepanzen
    führen zu einer Unterbrechung des Prozesses aus Sicherheitsgründen.


    Lösung: Sollten Unterlagen fehlen, reichen Sie diese bitte unmittelbar nachgereicht
    ein. Wir werden den Antrag daraufhin erneut prüfen.


    Eskalationsweg:

    Wenn Sie die Entscheidung nicht nachvollziehen können oder der Prozess trotz vollständiger
    Unterlagen stagniert, leiten wir Ihr Anliegen stufenweise weiter: Zuerst erfolgt
    eine Prüfung durch den zuständigen Filialmitarbeiter, bei Bedarf durch die Filialleitung
    und im letzten Schritt durch die regionale Geschäftsführung. Sie erhalten über
    diesen Weg eine detaillierte Erläuterung der Entscheidung oder eine Bestätigung
    über den neuen Status Ihres Vorgangs.'
