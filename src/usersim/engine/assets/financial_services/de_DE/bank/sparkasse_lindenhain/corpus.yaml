- id: 2fe38a53-176c-5bfc-abce-0359e80d51a7
  title: Sparkassenbuch — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Wenn Sie Ihr Erspartes bei uns anlegen, steht die Sicherheit Ihres Vermögens
    an erster Stelle. Das Sparkassenbuch ist eine klassische Sparform, die traditionell
    durch eine physische Urkunde oder einen digitalen Datensatz geschützt ist. Im
    Vergleich zu hochdynamischen Anlageprodukten bietet diese Form eine hohe Stabilität,
    ist jedoch nicht immun gegen betrügerische Versuche.


    Ein häufiges Muster bei Betrugsversuchen ist das sogenannte Social Engineering.
    Hierbei geben sich Täter als Mitarbeiter der Sparkasse Lindenhain aus, um sensible
    Informationen zu erschleichen. Bitte beachten Sie: Die Sparkasse Lindenhain wird
    Sie niemals telefonisch, per E-Mail oder per SMS dazu auffordern, Passwörter,
    PINs oder TANs preiszugeben. Wir fordern Sie ebenfalls niemals auf, Geld auf ein
    „Sicherungskonto“ zu überweisen, um Ihr Sparkassenbuch vor einem angeblichen Angriff
    zu schützen.


    Sollten Sie den Verdacht haben, dass Unbefugte Zugriff auf Ihre Kontodaten erlangt
    haben oder haben Sie eine verdächtige Nachricht erhalten, ist die sofortige Meldung
    an uns entscheidend. Wir prüfen jeden Vorgang unter strikter Einhaltung der Identitätsprüfung,
    bevor eine zustandsändernde Aktion vorgenommen wird. Da wir als öffentlich-rechtliches
    Institut unter der Aufsicht der BaFin und der Deutschen Bundesbank stehen, ist
    Ihr Guthaben zudem durch die gesetzliche Einlagensicherung bis zu einem Betrag
    von 100.000 € geschützt.


    Wenn Sie feststellen, dass unautorisierte Abbuchungen von Ihrem Sparkassenbuch
    erfolgt sind, melden Sie uns dies unverzüglich. Wir bearbeiten solche Beschwerden
    fair und zeitnah gemäß den gesetzlichen Fristen des Bürgerlichen Gesetzbuches
    (BGB). Eine schnelle Reaktion hilft uns, weitere Schäden zu begrenzen und die
    rechtliche Haftung zu klären.


    Für eine detailliertere Übersicht über die rechtlichen Rahmenbedingungen Ihrer
    Anlage empfehlen wir die Lektüre von Sparkassenbuch — rechtliche Hinweise.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: d19e4a56-cec8-5905-b66b-38a4e2912c4f
  title: Sparkassenbuch — Allgemeine Geschäftsbedingungen
  body: 'Die Geschäftsbeziehung zwischen der Sparkasse Lindenhain und dem Kunden bezüglich
    des Sparkassenbuchs richtet sich nach den vorliegenden Allgemeinen Geschäftsbedingungen
    sowie den gesetzlichen Bestimmungen des BGB und des Zahlungskontengesetzes.


    1. Einlage und Verzinsung: Der Kunde zahlt Gelder auf das Sparkassenbuch ein.
    Diese werden mit einem Zinssatz von 0,5 % verzinst. Die Zinsen werden jährlich
    gutgeschrieben. Die Sparkasse Lindenhain behält sich vor, den Zinssatz unter Einhaltung
    einer angemessenen Ankündigungsfrist anzupassen.


    2. Verfügungen und Kündigungsfristen: Das Sparkassenbuch ist auf den langfristigen
    Vermögensaufbau ausgelegt. Für Verfügungen über das Guthaben gilt eine Kündigungsfrist
    von 3 Monaten. Diese Frist ist einzuhalten, sofern der Betrag den kündigungsfreien
    Betrag übersteigt. Ein monatlicher kündigungsfreier Betrag von 2.000 € steht dem
    Kunden zur Verfügung, der ohne Einhaltung der Kündigungsfrist abgehoben werden
    kann.


    3. Vorzeitige Verfügungen: Verfügungen über den kündigungsfreien Betrag von 2.000
    € hinaus, die vor Ablauf der 3 Monate Kündigungsfrist erfolgen, können mit einem
    Vorfälligkeitsentgelt belegt werden, sofern dies im Preis- und Leistungsverzeichnis
    so festgelegt ist.


    4. Beendigung des Vertragsverhältnisses: Das Sparkassenbuch kann von beiden Seiten
    gekündigt werden. Die Kündigung durch den Kunden erfolgt unter Einhaltung der
    Kündigungsfrist von 3 Monaten oder durch die vollständige Auflösung des Kontos
    unter Verzicht auf die Zinsen der laufenden Periode.


    5. Einlagensicherung: Guthaben sind gemäß den gesetzlichen Richtlinien der Einlagensicherung
    bis zu einem Betrag von 100.000 € geschützt.


    6. Identitätsprüfung: Vor jeder Auszahlung oder Vertragsänderung ist eine strikte
    Identitätsprüfung des Kontoinhabers zwingend erforderlich. Bei Online-Vorgängen
    ist die starke Kundenauthentifizierung anzuwenden.


    Für weitere Details zu den Kosten verweisen wir auf das Sparkassenbuch — Preis-
    und Leistungsverzeichnis.'
