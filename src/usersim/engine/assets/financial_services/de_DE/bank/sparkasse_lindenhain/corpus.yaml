  institution_id: sparkasse_lindenhain
- id: ae9f27fb-62a9-5ed6-8d94-e7ddc45b2fbb
  title: 'Girokonto Komfort mit Sparkassen-Card — monatliches Kontoführungsentgelt:
    Erklärung'
  body: 'Frage: Warum wird für mein Girokonto Komfort mit Sparkassen-Card ein monatliches
    Entgelt erhoben?


    Antwort: Für die Führung Ihres Kontos berechnen wir ein monatliches Kontoführungsentgelt
    in Höhe von 7,50 €. Dieser Betrag dient primär der Aufrechterhaltung unserer flächendeckenden
    regionalen Infrastruktur. Damit stellen wir sicher, dass Sie auch weiterhin auf
    ein dichtes Netz an Filialen und Geldautomaten in der Region Lindenhain zugreifen
    können sowie auf einen persönlichen Service durch unsere kompetenten Mitarbeiter
    vor Ort.


    Frage: Gibt es Ausnahmen bei der Erhebung dieser Gebühren?


    Antwort: Die Sparkasse Lindenhain legt großen Wert auf soziale Verantwortung.
    In Fällen von nachgewiesener sozialer Härte oder bei der Bereitstellung eines
    gesetzlich vorgeschriebenen Basiskontos prüfen wir die Konditionen individuell,
    um jedem Bürger einen fairen Zugang zu grundlegenden Finanzdienstleistungen zu
    ermöglichen. Weitere Details entnehmen Sie bitte dem Dokument Girokonto Komfort
    mit Sparkassen-Card — Preis- und Leistungsverzeichnis.'
