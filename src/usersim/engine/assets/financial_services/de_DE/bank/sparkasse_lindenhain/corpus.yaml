  institution_id: sparkasse_lindenhain
- id: 1b6d659c-5671-5cb2-98c3-96ab61369ff9
  title: 'Sparkassen-Privatkredit — Laufzeit im repräsentativen Beispiel (Monate):
    Erklärung'
  body: 'Hier finden Sie die Erläuterung zur Laufzeit innerhalb unseres repräsentativen
    Beispiels für den Sparkassen-Privatkredit.


    **Frage: Was bedeutet die Angabe von 60 Monaten im repräsentativen Beispiel?**


    Antwort: Die Angabe von 60 Monaten beschreibt die vereinbarte Laufzeit des Kredits,
    also den Zeitraum, über den die Darlehenssumme zurückgezahlt wird. In unserem
    Beispiel führt dies bei einem Kreditbetrag von 10.000 € zu einer monatlichen Belastung
    von 194,75 €. Eine längere Laufzeit würde die monatliche Rate senken, jedoch die
    Gesamtkosten des Kredits erhöhen, während eine kürzere Laufzeit die monatliche
    Rate steigert, aber die Zinskosten reduziert.


    **Frage: Ist die Laufzeit von 60 Monaten für jeden Kunden verpflichtend?**


    Antwort: Nein, die 60 Monate dienen lediglich als standardisiertes Beispiel zur
    besseren Vergleichbarkeit. Die tatsächliche Laufzeit wird gemeinsam mit Ihnen
    und auf Basis Ihrer individuellen finanziellen Situation vereinbart, sofern diese
    im Rahmen der Kreditwürdigkeitsprüfung genehmigt wird.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 1a2febd3-cd7f-5269-bedf-3f81525976ca
  title: Sparkassen-Privatkredit — etwas ändern
  body: 'Wenn Sie bereits einen Sparkassen-Privatkredit nutzen und Anpassungen an
    Ihren Vertragsbedingungen vornehmen möchten (z. B. eine Änderung der monatlichen
    Rate oder eine Anpassung der Laufzeit), folgen Sie bitte diesen Schritten:


    1. **Änderungswunsch mitteilen**: Teilen Sie uns mit, welche Anpassung Sie vornehmen
    möchten. Wenn Sie beispielsweise Ihre monatliche Rate erhöhen möchten, um den
    Kredit schneller zu tilgen, nennen Sie uns den gewünschten neuen Betrag.


    2. **Prüfung der Machbarkeit**: Wir prüfen, ob der Änderungswunsch im Rahmen Ihres
    bestehenden Vertrages und der gesetzlichen Vorgaben möglich ist. Bei einer Verlängerung
    der Laufzeit oder einer Senkung der Rate führen wir eine erneute Kreditwürdigkeitsprüfung
    durch, um die nachhaltige Tragfähigkeit der Finanzierung sicherzustellen.


    3. **Identitätsprüfung**: Bevor wir die Änderung systemseitig vornehmen, führen
    wir eine strikte Identitätsprüfung durch. Je nach Kanal erfolgt dies über die
    starke Kundenauthentifizierung oder durch Vorlage eines gültigen Ausweisdokuments
    in einer unserer Filialen.


    4. **Bestätigung der neuen Konditionen**: Wir senden Ihnen eine schriftliche Bestätigung
    über die geänderten Konditionen zu. Hierin sind die neue monatliche Rate sowie
    die angepasste Restlaufzeit präzise aufgeführt.


    5. **Wirksamkeit**: Die Änderung wird mit dem im Bestätigungsschreiben genannten
    Datum wirksam. Sie erkennen dies an der angepassten Abbuchung auf Ihrem Girokonto
    zum nächsten Monatstermin.


    Sollten Sie Fragen zu den Auswirkungen einer Änderung auf die Gesamtkosten haben,
    stehen wir Ihnen gerne in einer unserer regionalen Filialen beratend zur Seite.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bec050eb-1f90-52a0-9b3e-2ba1fe3dc76e
  title: Sparkassen-Privatkredit — Probleme mit Zugang oder Login
  body: 'Kunden, die ihren Sparkassen-Privatkredit über unser Online-Banking verwalten,
    können gelegentlich auf Probleme beim Zugang zu ihren Kreditdetails stoßen. Hier
    ist der Leitfaden zur Behebung dieser Symptome.


    **Symptom: Die Kreditübersicht wird nicht angezeigt oder der Login schlägt fehl.**


    **Mögliche Ursachen:**

    - Falsche Eingabe der Zugangsdaten.

    - Die starke Kundenauthentifizierung wurde nicht korrekt abgeschlossen.

    - Das Benutzerkonto wurde aufgrund mehrerer Fehlversuche aus Sicherheitsgründen
    vorübergehend gesperrt.


    **Vorgehensweise zur Behebung:**

    1. **Überprüfung der Eingaben**: Bitte stellen Sie sicher, dass Ihre Anmeldedaten
    korrekt eingegeben wurden. Beachten Sie dabei die Groß- und Kleinschreibung Ihres
    Passworts.


    2. **Prüfung des Authentifizierungswegs**: Stellen Sie sicher, dass Sie das für
    die starke Kundenauthentifizierung hinterlegte Gerät nutzen und die entsprechende
    Freigabe bestätigt haben.


    3. **Passwort-Reset**: Wenn Sie Ihr Passwort vergessen haben, fordern Sie über
    die Funktion „Zugangsdaten vergessen“ eine neue Vergabe an. Dies erfolgt unter
    strikter Identitätsprüfung.


    **Wann erfolgt eine Eskalation?**

    Sollten die oben genannten Schritte nicht zum Erfolg führen, wird der Vorgang
    stufenweise eskaliert. Zunächst unterstützt Sie ein Mitarbeiter unserer Filialen.
    Bei komplexeren technischen Fehlern wird die Angelegenheit an die Filialleitung
    und gegebenenfalls an die regionale Geschäftsführung weitergeleitet.


    Sie erhalten über den Verlauf der Bearbeitung eine transparente Rückmeldung, sobald
    der Zugang zu Ihren Kreditdaten (z. B. Informationen zur aktuellen Restschuld
    oder zum effektiven Jahreszins von 6,49 % aus dem repräsentativen Beispiel) wiederhergestellt
    ist.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: eac6a380-5b63-51f5-959f-03701c2998ea
  title: Sparkassen-Privatkredit — Zugangsstufen
  body: 'Diese Matrix dient dem Support-Personal zur schnellen Bestimmung der Kreditfähigkeit
    eines Kunden für den Sparkassen-Privatkredit.


    | Bedingung | Ergebnis/Zugangsstufe |

    | :--- | :--- |

    | Vorlage eines gültigen Personalausweises/Reisepasses & Nachweis eines stetigen
    Einkommens | Berechtigt zur Durchführung einer Kreditwürdigkeitsprüfung |

    | Positive Kreditwürdigkeitsprüfung (Bonität gemäß internen Richtlinien) | Zusage
    für Kreditbeträge bis maximal 50.000 € |

    | Nachweis einer bestehenden Geschäftsbeziehung (z.B. Girokonto Komfort) | Beschleunigte
    Prüfung der Unterlagen möglich |

    | Unzureichende Bonität oder bestehende Zahlungsstörungen | Ablehnung des Kreditantrags
    / Keine Zusage möglich |

    | Erreichen der maximalen Kreditsumme von 50.000 € | Keine weitere Aufstockung
    im Rahmen dieses Produkts möglich |


    **Wichtiger Hinweis für Mitarbeiter**: Eine Kreditzusage darf niemals ohne die
    finale Prüfung der Kreditwürdigkeit garantiert werden. Alle Entscheidungen müssen
    transparent und gemäß den BGB-Vorgaben dokumentiert werden.'
  domain: lending_mortgage
