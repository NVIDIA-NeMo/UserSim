- id: 659810fe-1c9c-5a4b-a104-7b081ffbc9f0
  title: Girokonto Komfort mit Sparkassen-Card — Risikohinweise
  body: 'Dieses Dokument enthält wichtige regulatorische Hinweise und Risikodeklarationen
    im Zusammenhang mit der Nutzung des Girokonto Komfort mit Sparkassen-Card.


    Finanzielle Risiken bei Kontoüberziehungen

    Die Nutzung eines Dispositionskredits stellt eine Form der Verschuldung dar. Bitte
    beachten Sie, dass die Inanspruchnahme des vereinbarten Rahmens mit einem Zinssatz
    von 11,49 % p.a. verbunden ist. Sollten Sie diesen Rahmen überschreiten, erhöht
    sich die Zinslast auf 14,49 % p.a. für die geduldete Überziehung. Eine dauerhafte
    Nutzung des Dispositionskredits kann zu einer langfristigen Zinslast führen und
    die Kreditwürdigkeit beeinträchtigen.


    Gesetzliche Absicherung und Aufsicht

    Die Sparkasse Lindenhain agiert unter der strikten Aufsicht der BaFin und der
    Deutschen Bundesbank. Alle Prozesse zur Kontoführung und Kreditvergabe folgen
    den Richtlinien des BGB und des Zahlungskontengesetzes. Dies gewährleistet eine
    faire und gesetzeskonforme Behandlung aller Kunden.


    Einlagensicherung

    Im Falle einer Insolvenz des Instituts sind Ihre Guthaben durch die gesetzliche
    Einlagensicherung geschützt. Dieser Schutz umfasst Beträge bis zu einer Höhe von
    100.000 € pro Kunde.


    Pfändungsschutz

    Kunden, die sich in einer finanziellen Notlage befinden, haben das Recht auf die
    Umwandlung ihres Kontos in ein Pfändungsschutzkonto. In diesem Fall wird ein Grundbetrag
    von 1.590 € vor Pfändungen geschützt, um die Existenzsicherung des Kontoinhabers
    zu gewährleisten.


    Wir weisen darauf hin, dass wir eine professionelle Produktberatung anbieten,
    jedoch keine individuelle Steuer- oder Rechtsberatung erbringen. Für solche Anliegen
    wenden Sie sich bitte an entsprechend qualifizierte Fachleute.


    Weitere rechtliche Details finden Sie im Dokument Girokonto Komfort mit Sparkassen-Card
    — rechtliche Hinweise.'
