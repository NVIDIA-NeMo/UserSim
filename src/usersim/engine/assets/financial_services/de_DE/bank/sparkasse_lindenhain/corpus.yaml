  institution_id: sparkasse_lindenhain
- id: 16ee06b2-a7c1-5687-b12e-282928157d24
  title: Girokonto Komfort mit Sparkassen-Card — abgelehnter oder gesperrter Vorgang
  body: 'Symptom: Eine Zahlung mit der Sparkassen-Card wird am Automaten oder im Geschäft
    abgelehnt, oder eine Online-Transaktion wird mit einer Fehlermeldung gesperrt.


    Mögliche Ursachen:

    - Überschreitung des verfügbaren Guthabens: Wenn weder ein Dispositionskredit
    in Höhe von 11,49 % Zinsen noch eine geduldete Überziehung (14,49 % Zinsen) möglich
    ist, wird der Vorgang abgelehnt.

    - Sicherheitsblockade: Aufgrund ungewöhnlicher Zahlungsmuster wurde die Karte
    aus Sicherheitsgründen vorübergehend gesperrt.

    - Falsche PIN-Eingabe: Nach mehrmaliger fehlerhafter Eingabe wird die Karte gesperrt.

    - Fehlende starke Kundenauthentifizierung: Bei Online-Zahlungen wurde die erforderliche
    Verifizierung nicht erfolgreich abgeschlossen.


    Was zu prüfen ist:

    1. Prüfen Sie Ihren aktuellen Kontostand. Reicht das Guthaben für die gewünschte
    Summe aus?

    2. Überprüfen Sie, ob Sie eine Benachrichtigung über eine Sicherheitsperre erhalten
    haben.


    Lösung:

    - Bei Guthabenmangel: Bitte führen Sie eine Einzahlung vor oder beantragen Sie
    die Anpassung Ihres Kreditrahmens.

    - Bei Sicherheitsperre: Bitte fordern Sie uns zur Identitätsprüfung auf. Nach
    erfolgreicher Verifizierung werden wir die Karte umgehend wieder freischalten.

    - Bei PIN-Verlust: Wir werden Ihnen eine neue PIN zukommen lassen.


    Eskalation:

    Sollte die Ursache der Ablehnung nicht unmittelbar ersichtlich sein oder eine
    Freischaltung nicht möglich sein, leiten wir den Fall stufenweise vom Filialmitarbeiter
    über die Filialleitung bis zur regionalen Geschäftsführung weiter, um eine zeitnahe
    Lösung gemäß den gesetzlichen Fristen des BGB zu gewährleisten.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a91d33e4-3f6d-5fab-a78b-374cfc6b576a
  title: Girokonto Komfort mit Sparkassen-Card — wann sich ein Wechsel oder Upgrade
    lohnt
  body: 'Im Rahmen der Kundenberatung ist es wichtig zu analysieren, ob das Girokonto
    Komfort mit Sparkassen-Card noch den Bedürfnissen des Kunden entspricht oder ob
    ein Wechsel sinnvoll ist.


    Das Girokonto Komfort mit Sparkassen-Card eignet sich ideal für Kunden, die eine
    zuverlässige regionale Infrastruktur, persönliche Beratung in der Filiale und
    ein Standardkonto für den Alltag suchen. Das monatliche Kontoführungsentgelt beträgt
    7,50 €.


    Ein Upgrade oder Wechsel ist in folgenden Fällen zu empfehlen:

    - Globaler Premium-Service: Wenn der Kunde häufig weltweit reist und einen erweiterten
    Verfügungsrahmen sowie exklusive Versicherungsleistungen benötigt, ist ein Wechsel
    zur Sparkassen-Kreditkarte Gold die bessere Wahl.

    - Minimierung der Fixkosten: Wenn der Kunde auf den persönlichen Service und das
    Filialnetz verzichten kann und eine rein digitale Lösung mit geringeren oder keinen
    Grundgebühren sucht, sollte über ein Basiskonto oder ein alternatives Modell nachgedacht
    werden (unter Beachtung der sozialen Härten).

    - Langfristiger Vermögensaufbau: Wenn der Kunde nicht nur Zahlungsverkehr abwickelt,
    sondern sicher sparen möchte, sollte ergänzend ein Sparkassenbuch eröffnet werden.


    Zusammenfassend bleibt das Girokonto Komfort mit Sparkassen-Card die erste Wahl
    für Kunden, die Vertrauen und regionale Präsenz über die niedrigstmöglichen Gebühren
    stellen.'
