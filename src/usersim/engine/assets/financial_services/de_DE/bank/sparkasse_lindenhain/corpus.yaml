- id: 499b0d9f-d09a-5e76-b446-08bb585c37aa
  title: Sparkassen-Baufinanzierung — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Finanzierung einer Immobilie ist eine der bedeutendsten Entscheidungen
    Ihres Lebens. Aufgrund der hohen Volumina sind Baufinanzierungen und die damit
    verbundenen Dokumente ein Ziel für betrügerische Aktivitäten. Um Ihre Sicherheit
    bei der Sparkasse Lindenhain zu gewährleisten, bitten wir Sie, die folgenden Hinweise
    aufmerksam zu lesen.


    Ein häufiges Betrugsmuster im Bereich der Immobilienfinanzierung ist das sogenannte
    ''Refinanzierungs-Phishing''. Dabei erhalten Kunden gefälschte E-Mails oder Briefe,
    die eine dringende Zinsanpassung oder ein attraktives Umschuldungsangebot vortäuschen.
    Diese Nachrichten fordern Sie oft auf, sensible Dokumente über unsichere Links
    hochzuladen oder Passwörter für Ihr Online-Banking preiszugeben.


    Bitte beachten Sie: Die Sparkasse Lindenhain wird Sie niemals per E-Mail, SMS
    oder Telefon dazu auffordern, Ihre PIN, Ihre TANs oder Ihre Zugangsdaten für das
    Online-Banking zu übermitteln. Ebenso fordern wir Sie niemals auf, eine dringende
    Zahlung auf ein fremdes Konto zu leisten, um eine vermeintliche Zinsprivilegierung
    zu sichern.


    Sollten Sie eine Nachricht erhalten, die Ihnen verdächtig erscheint, oder bemerken
    Sie nicht autorisierte Änderungen in Ihren Kreditunterlagen, ist schnelles Handeln
    entscheidend. Bitte informieren Sie uns umgehend in Ihrer regionalen Filiale oder
    über unseren telefonischen Kundenservice. Im Falle eines Verlusts Ihrer Sparkassen-Card,
    die mit Ihrem Konto verknüpft ist, nutzen Sie bitte sofort den Notruf 116 116,
    um die Karte zu sperren und Ihre Haftung gesetzlich auf maximal 50 € zu begrenzen.


    Wir legen höchsten Wert auf die starke Kundenauthentifizierung, insbesondere bei
    sensiblen Vertragsänderungen. Jede zustandsändernde Aktion an Ihrer Baufinanzierung
    erfordert eine strikte Identitätsprüfung. Vertrauen Sie nur offiziellen Kommunikationswegen
    und zögern Sie nicht, uns bei Unsicherheiten direkt in Ihrer Filiale zu sprechen.
    Wir schützen gemeinsam Ihr Vermögen und Ihren Traum vom Eigenheim.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f712d12c-132a-5a14-8245-db75079ac4b6
  title: Sparkassen-Baufinanzierung — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Inanspruchnahme der Sparkassen-Baufinanzierung
    bei der Sparkasse Lindenhain. Die Vereinbarung basiert auf den gesetzlichen Bestimmungen
    des BGB und dem Zahlungskontengesetz.


    1. Kreditgewährung und Zinsbindung

    Die Sparkasse Lindenhain gewährt den Kredit basierend auf einer sorgfältigen Kreditwürdigkeitsprüfung.
    Der vereinbarte Sollzins bleibt für die gewählte Dauer der Zinsbindung (beispielsweise
    10 oder 15 Jahre) unverändert. Die Zinsen werden auf den jeweils verbleibenden
    Restbetrag des Darlehens berechnet und sind gemäß dem vereinbarten Tilgungsplan
    zu zahlen.


    2. Besicherung

    Zur Absicherung der Forderung wird in der Regel eine Grundschuld auf das finanzierte
    Objekt eingetragen. Der Kunde verpflichtet sich, die Immobilie angemessen zu versichern
    und die Sparkasse Lindenhain über jede Änderung der Eigentumsverhältnisse oder
    wesentliche Wertminderungen des Objekts unverzüglich zu informieren.


    3. Sondertilgungen

    Um Ihnen Flexibilität bei der Schuldenreduzierung zu bieten, ist eine jährliche
    Sondertilgung in Höhe von 5 % der ursprünglichen Darlehenssumme ohne zusätzliche
    Vorfälligkeitsentschädigung gestattet. Diese Option dient der schnelleren Tilgung
    Ihres Kredits und senkt die langfristige Zinslast.


    4. Kündigung und vorzeitige Ablösung

    Das Darlehen kann unter Einhaltung der gesetzlichen Fristen gekündigt werden.
    Bei einer vorzeitigen Ablösung außerhalb der vereinbarten Sondertilgungsrechte
    kann die Sparkasse Lindenhain eine gesetzlich zulässige Vorfälligkeitsentschädigung
    verlangen, sofern dies zur Deckung des Zinsverlusts erforderlich ist.


    5. Änderungen und Mitteilungen

    Änderungen der Vertragsbedingungen erfolgen schriftlich. Wir weisen darauf hin,
    dass wir eine professionelle Produktberatung bieten, jedoch keine individuelle
    Steuer- oder Rechtsberatung erbringen. Für solche Anliegen wird die Konsultation
    qualifizierter Fachberater empfohlen.


    Die Sparkasse Lindenhain agiert unter der Aufsicht der BaFin und der Deutschen
    Bundesbank. Alle Prozesse folgen strikt den Datenschutzrichtlinien zur Gewährleistung
    einer fairen und gesetzeskonformen Kundenbehandlung.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 7eb0350f-c007-54ec-8aa1-684dc970f786
  title: Sparkassen-Baufinanzierung — für wen und wofür geeignet
  body: 'Die Sparkassen-Baufinanzierung ist die ideale Lösung für alle Bürger unserer
    Region, die den Traum vom eigenen Eigenheim verwirklichen möchten. Dieses Produkt
    richtet sich insbesondere an Personen, die Wert auf langfristige Planungssicherheit,
    regionale Verbundenheit und eine persönliche Betreuung in ihrer Filiale legen.


    Für wen ist dieses Produkt geeignet?

    - Ersterwerber, die eine sichere und transparente Finanzierung für ihr erstes
    Haus oder ihre erste Wohnung suchen.

    - Familien, die durch eine langfristige Zinsbindung ihre monatlichen Wohnkosten
    stabil halten wollen.

    - Immobilienbesitzer, die eine energetische Sanierung oder einen Ausbau ihres
    bestehenden Heims finanzieren möchten.


    Wofür ist die Sparkassen-Baufinanzierung geeignet?

    Das Darlehen dient primär der Finanzierung von Grundstücken, Neubauten oder dem
    Kauf bestehender Immobilien. Dank flexibler Sollzinsbindungen können Sie genau
    entscheiden, wie lange Sie sich gegen steigende Zinsen absichern möchten. Wir
    bieten Ihnen folgende Konditionen an:

    - Eine Zinsbindung von 10 Jahren zu einem Zinssatz von 3,68 %.

    - Eine Zinsbindung von 15 Jahren zu einem Zinssatz von 3,91 %.


    Besondere Vorteile unserer Finanzierung:

    - Planungssicherheit: Durch die festgeschriebenen Zinsen wissen Sie heute schon,
    wie hoch Ihre Rate in zehn oder fünfzehn Jahren sein wird.

    - Flexibilität: Mit einer jährlichen Sondertilgung von bis zu 5 % der ursprünglichen
    Darlehenssumme können Sie Ihre Schulden schneller abbauen, ohne dass Ihnen Kosten
    für eine Vorfälligkeitsentschädigung entstehen.

    - Regionale Verantwortung: Als öffentlich-rechtliches Institut sind wir tief in
    Lindenhain verwurzelt und bieten Ihnen einen persönlichen Ansprechpartner vor
    Ort, der Ihre regionale Situation kennt.


    Wir empfehlen Ihnen ein persönliches Beratungsgespräch in einer unserer Filialen,
    um die optimale Zinsbindungsfrist und Tilgungshöhe auf Ihre individuelle Lebenssituation
    abzustimmen. Bitte beachten Sie, dass eine Kreditzusage erst nach einer finalen
    Kreditwürdigkeitsprüfung garantiert werden kann.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: dd6ab9d6-752b-589a-85f0-36473c29d01b
  title: 'Sparkassen-Baufinanzierung — Sollzins bei 15 Jahren Zinsbindung: Erklärung'
  body: 'Frage: Warum liegt der Sollzins bei einer Zinsbindung von 15 Jahren bei 3,91
    % und ist damit höher als bei einer kürzeren Bindung?


    Antwort: Ein Zinssatz von 3,91 % für eine Laufzeit von 15 Jahren spiegelt die
    höhere Planungssicherheit wider, die Ihnen die Sparkasse Lindenhain bietet. Mit
    dieser Option sichern Sie sich die Zinskosten für einen deutlich längeren Zeitraum
    gegen Marktschwankungen ab. Die Differenz zum kürzeren Zinssatz (z. B. 3,68 %
    bei 10 Jahren) ergibt sich aus dem Risiko, das die Bank über diesen längeren Zeitraum
    trägt. Sie zahlen einen geringen Aufpreis für die Gewissheit, dass Ihre Zinslast
    auch nach einem Jahrzehnt stabil bleibt, unabhängig von der allgemeinen Zinsentwicklung
    am Markt.


    Diese Option eignet sich besonders für Kunden, die maximale Sicherheit bevorzugen
    und ihre Finanzierung über einen sehr langen Horizont präzise kalkulieren möchten.
    Weitere Details zu den Zinskonditionen finden Sie in der Sparkassen-Baufinanzierung
    — Zinsübersicht.'
