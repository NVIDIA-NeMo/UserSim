- id: 9e91ac8f-9131-5cf2-a277-cc51103adf24
  title: Sparkassen-Kreditkarte Gold — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie Anpassungen an Ihrem Kreditkartenkonto
    vornehmen, beispielsweise eine Änderung Ihres monatlichen Verfügungsrahmens (aktuell
    5.000 €).


    **Voraussetzungen:**

    - Sie verfügen über eine aktive Sparkassen-Kreditkarte Gold.

    - Ihr Konto ist auf einem aktuellen Stand (keine überfälligen Zahlungen).


    **Schritte zur Änderung des Verfügungsrahmens:**

    1. **Antrag auf Anpassung:** Teilen Sie uns mit, auf welchen Betrag Sie Ihren
    monatlichen Verfügungsrahmen anpassen möchten. Sie können uns entweder eine Erhöhung
    oder eine Senkung des aktuellen Rahmens von 5.000 € wünschen.

    2. **Einreichung von Nachweisen:** Falls eine Erhöhung gewünscht wird, bitten
    wir Sie um die Vorlage aktueller Einkommensnachweise (z. B. die letzten drei Gehaltsabrechnungen),
    damit wir eine neue Kreditwürdigkeitsprüfung durchführen können.

    3. **Prüfungsphase:** Wir prüfen Ihren Antrag auf Basis Ihrer Bonität und Ihrer
    bisherigen Kontoführung. Bitte haben Sie Verständnis dafür, dass wir eine Kreditzusage
    niemals ohne diese finale Prüfung garantieren können.

    4. **Bestätigung der Änderung:** Nach erfolgreicher Prüfung teilen wir Ihnen die
    Entscheidung mit. Bei einer Genehmigung erhalten Sie eine schriftliche Bestätigung
    über den neuen, angepassten Verfügungsrahmen.

    5. **Wirksamkeit:** Die Änderung wird sofort in unseren Systemen hinterlegt und
    ist ab diesem Zeitpunkt bei Ihren Zahlungen wirksam.


    Sollten Sie Änderungen an Ihren persönlichen Daten wünschen (z. B. neue Adresse),
    reichen Sie uns bitte die entsprechenden Dokumente ein; wir werden diese nach
    einer Identitätsprüfung umgehend aktualisieren.'
