- id: ccb843a7-e1d1-5847-8de5-18dc157dd2ea
  title: Sparkassen-Privatkredit — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn ein Kunde einen unerwarteten Betrag oder ein nicht vorgesehenes Entgelt
    im Zusammenhang mit seinem Sparkassen-Privatkredit meldet, gehen Sie als Support-Mitarbeiter
    bitte wie folgt vor:


    **Mögliche Symptome:**

    Der Kunde gibt an, dass die monatliche Rate höher ist als die vereinbarten 194,75
    € (bezogen auf das repräsentative Beispiel) oder dass zusätzliche Beträge von
    seinem Konto abgebucht wurden.


    **Ursachenanalyse und Prüfungsschritte:**

    1. **Prüfung des Tilgungsplans:** Gleichen Sie die aktuelle Abbuchung mit dem
    im Vertrag vereinbarten Tilgungsplan ab. Prüfen Sie, ob es sich um die reguläre
    Rate handelt.

    2. **Prüfung auf Verzugszinsen:** Überprüfen Sie, ob die Rate zum Fälligkeitstermin
    nicht gedeckt war. In diesem Fall können gemäß BGB Verzugszinsen angefallen sein,
    die den Betrag erhöhen.

    3. **Prüfung auf Sondertilgungen:** Prüfen Sie, ob der Kunde eine Sondertilgung
    vorgenommen hat, die die Zinsberechnung oder die zukünftigen Raten beeinflusst
    hat.

    4. **Prüfung von Versicherungsbeiträgen:** Prüfen Sie, ob eine optional vereinbarte
    Restschuldversicherung anfällt, die separat oder zusammen mit der Rate abgebucht
    wird.


    **Lösungsweg:**

    - **Erklärung:** Erläutern Sie dem Kunden sachlich und transparent, aus welcher
    Position sich die Differenz ergibt. Beziehen Sie sich dabei präzise auf die Vertragspunkte.

    - **Korrektur:** Sollte ein Fehler unsererseits vorliegen (z. B. falsche Zinsanwendung),
    leiten Sie umgehend eine Korrekturbuchung ein.


    **Eskalation:**

    Wenn die Ursache nicht unmittelbar geklärt werden kann oder der Kunde die Erklärung
    nicht akzeptiert, leiten Sie den Fall stufenweise über die Filialleitung an die
    regionale Geschäftsführung weiter. Der Kunde wird über den Fortschritt und die
    erwartete Bearbeitungszeit informiert. Für weitere Details zur Zinsanwendung siehe
    Sparkassen-Privatkredit — wie Zinsen berechnet und angewendet werden.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: bc54f6fc-70b6-5a5d-a6df-0b29f2c8652f
  title: Sparkassen-Privatkredit — erforderliche Unterlagen
  body: 'Um einen Sparkassen-Privatkredit (bis maximal 50.000 €) beantragen zu können,
    ist die Einreichung spezifischer Unterlagen zwingend erforderlich. Dies ermöglicht
    uns eine sorgfältige Kreditwürdigkeitsprüfung.


    | Erforderliche Unterlage | Zweck der Prüfung | Ergebnis / Auswirkung |

    | :--- | :--- | :--- |

    | **Gültiges Identitätsdokument** (Personalausweis oder Reisepass) | Identitätsprüfung
    und Verifizierung | Grundvoraussetzung für den Vertragsabschluss |

    | **Einkommensnachweise** (letzte 3 Gehaltsabrechnungen) | Prüfung der monatlichen
    Rückzahlungsfähigkeit | Bestimmung der maximalen monatlichen Rate |

    | **Aktueller Kontoauszug** (der letzten 1-3 Monate) | Analyse des Zahlungsverhaltens
    und bestehender Verpflichtungen | Bewertung der Kreditwürdigkeit |

    | **Unterschriebenes SEPA-Lastschriftmandat** | Automatisierung der Ratenzahlung
    | Sicherstellung der fristgerechten Tilgung |


    **Ergebnis der Prüfung:**

    Nach vollständiger Einreichung aller Unterlagen erfolgt die finale Prüfung. Nur
    bei positiver Bonitätsbewertung erhalten Sie eine verbindliche Kreditzusage und
    den Vertrag mit dem für Sie geltenden effektiven Jahreszins.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 35816b3e-138f-58da-9a32-c3882a125783
  title: Sparkassen-Privatkredit — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Im Vergleich zu typischen Angeboten von Online-Kreditinstituten bietet der
    Sparkassen-Privatkredit einen wesentlichen Mehrwert durch regionale Verwurzelung
    und persönlichen Service.


    **Strukturvergleich:**

    - **Sparkasse Lindenhain:** Wir setzen auf Vertrauen und eine persönliche Beratung
    in der Filiale. Der Prozess ist transparent: Ein repräsentatives Beispiel zeigt
    einen effektiven Jahreszins von 6,49 % bei einer Summe von 10.000 € über 60 Monate.

    - **Online-Wettbewerber:** Diese bieten oft einen rein digitalen Prozess. Während
    die Abwicklung schneller sein kann, fehlt die individuelle Beratung bei komplexen
    Lebenslagen und die soziale Verantwortung eines öffentlich-rechtlichen Instituts.


    **Entscheidende Dimensionen:**

    - **Zugang:** Wir bieten ein dichtes Filialnetz für persönliche Gespräche; Online-Banken
    agieren ausschließlich digital.

    - **Sicherheit:** Beide agieren unter BaFin-Aufsicht, doch die Sparkasse Lindenhain
    bietet Ihnen die Sicherheit eines regionalen Partners, der Ihre lokale Situation
    kennt.


    **Empfehlung:**

    Ein Online-Angebot eignet sich für Kunden, die eine rein transaktionale Abwicklung
    ohne Beratungsbedarf suchen. Der Sparkassen-Privatkredit ist die bessere Wahl
    für Kunden, die Wert auf eine verbindliche, persönliche Beziehung, regionale Präsenz
    und eine fundierte, individuelle Kreditprüfung legen.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 315a502c-29e4-5f4b-bf45-18da0f734e20
  title: Sparkassen-Privatkredit — Risikohinweise
  body: 'Die Aufnahme eines Kredits ist eine langfristige finanzielle Verpflichtung.
    Wir weisen Sie darauf hin, dass eine Kreditaufnahme mit Risiken verbunden ist,
    insbesondere wenn die monatliche Belastung nicht mit den verfügbaren Einkünften
    in Einklang steht.


    **Risiko der Überschuldung:**

    Eine zu hohe Kreditlast kann zu einer finanziellen Schieflage führen. Bitte prüfen
    Sie sorgfältig, ob die monatliche Rate für Sie tragbar ist. Im repräsentativen
    Beispiel führt eine Summe von 10.000 € bei einer Laufzeit von 60 Monaten zu einer
    monatlichen Belastung von 194,75 €. Die Gesamtkosten belaufen sich in diesem Fall
    auf 1.685 € über die gesamte Laufzeit.


    **Rechtliche Rahmenbedingungen:**

    Die Sparkasse Lindenhain agiert unter der Aufsicht der BaFin und der Deutschen
    Bundesbank. Alle Kreditprozesse folgen strikt dem BGB und den geltenden Datenschutzrichtlinien.
    Wir gewährleisten eine faire und gesetzeskonforme Kundenbehandlung.


    **Kreditzusage:**

    Wir bieten eine professionelle Produktberatung, jedoch ist jede Kreditzusage an
    eine finale Kreditwürdigkeitsprüfung gebunden. Wir garantieren niemals eine Auszahlung
    ohne diese Prüfung. Der maximale Kreditbetrag ist auf 50.000 € begrenzt.


    **Einlagensicherung:**

    Im Rahmen unserer Tätigkeit als öffentlich-rechtliches Institut ist Ihr Guthaben
    durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000 € geschützt.


    Für detaillierte rechtliche Bedingungen verweisen wir auf das Dokument Sparkassen-Privatkredit
    — Allgemeine Geschäftsbedingungen.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 4ac26178-2f9a-51c6-b113-d0060d6c4506
  title: Sparkassen-Privatkredit — wie Zinsen berechnet und angewendet werden
  body: 'Die Verzinsung beim Sparkassen-Privatkredit erfolgt auf Basis des effektiven
    Jahreszinses, welcher die Gesamtkosten des Kredits pro Jahr als Prozentsatz der
    Kreditsumme ausdrückt.


    Im repräsentativen Beispiel wird ein effektiver Jahreszins von 6,49 % angewendet.
    Dieser Zinssatz ist ein fester Wert für das Beispiel und bildet die Grundlage
    für die Berechnung der monatlichen Rate von 194,75 € bei einem Darlehensbetrag
    von 10.000 € und einer Laufzeit von 60 Monaten.


    **Anwendung der Zinsen:**

    - Die Zinsen werden auf den jeweils noch ausstehenden Restbetrag des Kredits berechnet.

    - Mit jeder monatlichen Rate wird ein Teil der Zinsen sowie ein Teil der Kreditsumme
    (Tilgung) zurückgezahlt.

    - Da der Restbetrag durch die Tilgung stetig sinkt, nimmt der absolute Zinsanteil
    innerhalb der konstanten Rate im Laufe der Zeit ab.


    Die Gesamtkosten aus Zinsen und etwaigen Gebühren belaufen sich im repräsentativen
    Beispiel auf insgesamt 1.685 €. Individuelle Zinssätze werden erst nach einer
    sorgfältigen Kreditwürdigkeitsprüfung festgelegt.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 0c9c3acf-4fb5-5fa8-8f8d-49fa6f4ad94c
  title: Sparkassen-Privatkredit — Empfehlungs- und Treueangebot
  body: "Die Sparkasse Lindenhain legt großen Wert auf das Vertrauen unserer Kunden\
    \ und die regionale Verbundenheit. Daher freuen wir uns, Ihnen vom 01.11.2024\
    \ bis zum 31.12.2024 ein besonderes Empfehlungs- und Treueangebot für den Sparkassen-Privatkredit\
    \ zu unterbreiten.\n\nWenn Sie einen neuen Kunden an uns vermitteln, der einen\
    \ Sparkassen-Privatkredit mit einer Kreditsumme bis zu 50.000 € erfolgreich abschließt,\
    \ erhalten sowohl Sie als auch die geworbene Person eine einmalige Treueprämie\
    \ in Höhe von 50 € als Gutschrift auf das Girokonto. \n\nZur Orientierung dient\
    \ unser repräsentatives Beispiel: Bei einem Kreditbetrag von 10.000 € und einer\
    \ Laufzeit von 60 Monaten ergibt sich eine monatliche Rate von 194,75 € bei einem\
    \ effektiven Jahreszins von 6,49 %. Die Gesamtkosten belaufen sich in diesem Beispiel\
    \ auf 1.685 €.\n\nDieses Angebot gilt nur für Neuanträge innerhalb des genannten\
    \ Zeitraums und unterliegt der finalen Kreditwürdigkeitsprüfung. Wir laden Sie\
    \ ein, diese Gelegenheit zu nutzen und gemeinsam mit uns in die Zukunft zu investieren."
  domain: lending_mortgage
  product_category: privatkredit
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 4520e754-3ea5-58ca-a417-7e7bf5e523b3
  title: Sparkassen-Privatkredit — Sicherheitstipps für Ihr Konto
  body: 'Der Schutz Ihrer Finanzen und personenbezogenen Daten hat für die Sparkasse
    Lindenhain höchste Priorität. Im Zusammenhang mit Ihrem Sparkassen-Privatkredit
    möchten wir Sie auf folgende Sicherheitsmaßnahmen hinweisen, um Ihr Konto vor
    Betrug und nicht autorisierten Zugriffen zu schützen.


    Bitte beachten Sie, dass wir Sie niemals per E-Mail, SMS oder über soziale Medien
    dazu auffordern werden, Ihre Online-Banking-PIN, TANs oder Passwörter preiszugeben.
    Seien Sie skeptisch bei Nachrichten, die eine sofortige Handlung fordern, um eine
    vermeintliche Sperrung Ihres Kredits oder eine unerwartete Zinsänderung zu verhindern.
    Solche Nachrichten sind oft Versuche des Phishings.


    Für alle zustandsändernden Aktionen sowie für die Auskunft über Ihre Kontodaten
    führen wir eine strikte Identitätsprüfung durch. Die starke Kundenauthentifizierung
    ist insbesondere bei sensiblen Vertragsänderungen Ihres Kredits zwingend erforderlich.
    Dies stellt sicher, dass nur Sie Zugriff auf Ihre Finanzierungsdetails haben.


    Sollten Sie den Verdacht haben, dass Ihre Zugangsdaten kompromittiert wurden oder
    Sie eine verdächtige Kommunikation erhalten haben, informieren Sie uns bitte umgehend.
    Im Falle eines Kartenverlusts, sofern Ihr Kredit mit einer Karte verknüpft ist,
    nutzen Sie bitte sofort den Notruf 116 116, um die Karte zu sperren. Dies begrenzt
    Ihre Haftung gemäß unseren Richtlinien auf maximal 50 €.


    Wir erinnern Sie daran, dass wir unter der Aufsicht der BaFin und der Deutschen
    Bundesbank agieren. Zudem ist Ihr Guthaben durch die gesetzliche Einlagensicherung
    bis zu einem Betrag von 100.000 € geschützt. Durch diese institutionellen Sicherheitsnetze
    gewährleisten wir eine verlässliche und gesetzeskonforme Behandlung Ihrer Angelegenheiten.'
  domain: lending_mortgage
