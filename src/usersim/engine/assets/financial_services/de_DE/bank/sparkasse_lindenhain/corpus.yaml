- id: 39fe8a85-6293-5a3b-8952-c1135022c3be
  title: Sparkassen-Kreditkarte Gold — abschließen und aktivieren
  body: 'Wenn Sie sich für die Sparkassen-Kreditkarte Gold entscheiden, führen wir
    Sie durch einen transparenten Prozess, um Ihnen schnellstmöglich Zugang zu Ihrem
    erweiterten Verfügungsrahmen von 5.000 € zu ermöglichen.


    **Voraussetzungen vor dem Start**

    Bevor Sie den Antrag stellen, halten Sie bitte ein gültiges Identifikationsdokument
    (Personalausweis oder Reisepass) sowie Ihre aktuelle Einkommensnachweise bereit.
    Da die Karte einen Kreditrahmen gewährt, ist eine sorgfältige Kreditwürdigkeitsprüfung
    zwingend erforderlich.


    **Schritte zum Abschluss und zur Aktivierung**


    1. **Antragstellung**: Teilen Sie uns Ihren Wunsch nach einer Sparkassen-Kreditkarte
    Gold mit. Wir prüfen gemeinsam mit Ihnen Ihre persönlichen Daten und die gewünschten
    Konditionen.

    2. **Kreditprüfung**: Wir führen eine finale Prüfung Ihrer Kreditwürdigkeit durch.
    Bitte beachten Sie, dass wir bis zum Abschluss dieser Prüfung keine verbindliche
    Kreditzusage garantieren können.

    3. **Vertragsunterzeichnung**: Nach erfolgreicher Prüfung unterzeichnen Sie den
    Kreditkartenvertrag. Hierbei werden Ihnen das Jahresentgelt von 84 € sowie das
    Fremdwährungsentgelt von 1,75 % transparent erläutert.

    4. **Kartenversand**: Die physische Sparkassen-Kreditkarte Gold wird Ihnen per
    Post zugestellt. Aus Sicherheitsgründen erfolgt der Versand der PIN in einem separaten
    Schreiben.

    5. **Aktivierung**: Um die Karte nutzen zu können, führen Sie eine erste Transaktion
    unter Verwendung der PIN an einem unserer Automaten durch oder nutzen Sie die
    starke Kundenauthentifizierung über Ihr Online-Banking.


    Nach der Aktivierung steht Ihnen der monatliche Verfügungsrahmen von 5.000 € sofort
    zur Verfügung. Sollten Sie Unterstützung bei der ersten Nutzung benötigen, steht
    Ihnen unser Kundenservice während der Standard-Geschäftszeiten gerne zur Verfügung.'
