- id: 37fb4381-3431-5299-a100-7ab871c22391
  title: Girokonto Komfort mit Sparkassen-Card — abschließen und aktivieren
  body: 'Wenn Sie sich für die Eröffnung eines Girokonto Komfort mit Sparkassen-Card
    entscheiden, führen wir Sie durch einen verbindlichen und transparenten Prozess,
    um Ihren Zugang zu unseren Finanzdienstleistungen sicher zu gewährleisten.


    Bevor Sie beginnen, halten Sie bitte ein gültiges Identitätsdokument (Personalausweis
    oder Reisepass mit aktueller Meldebescheinigung) bereit.


    1. Identitätsprüfung und Antragstellung: Sie teilen uns Ihren Wunsch nach einer
    Kontoeröffnung mit. Wir führen eine strikte Identitätsprüfung durch, um die Sicherheit
    Ihres zukünftigen Kontos zu gewährleisten. Gemeinsam füllen wir den Antragsbogen
    aus, in dem Sie die gewünschten Rahmenbedingungen festlegen.


    2. Prüfung der Kreditwürdigkeit: Falls Sie zusätzlich einen Dispositionskredit
    wünschen (derzeit verzinst mit 11,49 %), führen wir eine sorgfältige Kreditwürdigkeitsprüfung
    durch. Bitte beachten Sie, dass wir eine Kreditzusage niemals ohne diese finale
    Prüfung garantieren können.


    3. Vertragsunterzeichnung: Nach erfolgreicher Prüfung unterzeichnen Sie den Kontovertrag.
    Wir erläutern Ihnen dabei nochmals die transparenten Kosten, wie das monatliche
    Kontoführungsentgelt von 7,50 €.


    4. Erhalt der Sparkassen-Card: In den folgenden Werktagen erhalten Sie Ihre Sparkassen-Card
    sowie Ihren zugehörigen PIN-Brief per Post an Ihre hinterlegte Adresse.


    5. Aktivierung des Kontos: Zur Aktivierung Ihrer Karte und des Online-Bankings
    ist die starke Kundenauthentifizierung zwingend erforderlich. Folgen Sie den Anweisungen
    im Aktivierungsbrief, um Ihren Zugang sicher freizuschalten.


    Sobald diese Schritte abgeschlossen sind, ist Ihr Konto voll einsatzbereit. Sie
    können nun Ihre täglichen Zahlungen abwickeln und unser Filialnetz nutzen.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: how_to_guide
  source_authority: official
