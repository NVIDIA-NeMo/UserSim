- id: b84e87f6-18c6-50fa-ad77-7a38877cef80
  title: Sparkassen-Baufinanzierung — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn ein Kunde eine Abweichung bei den monatlichen Abbuchungen seiner Sparkassen-Baufinanzierung
    feststellt oder ein unerwartetes Entgelt auf seinem Konto bemerkt, ist ein systematisches
    Vorgehen zur Klärung erforderlich. Dieses Dokument dient als Leitfaden für Support-Mitarbeiter.


    Symptom: Der Kunde berichtet, dass die monatliche Rate höher ist als im Tilgungsplan
    angegeben oder ein zusätzlicher Betrag abgebucht wurde.


    Mögliche Ursachen:

    - Anpassung der Zinsen nach Ablauf einer Zinsbindungsfrist (z. B. Übergang von
    3,68 % auf den aktuellen Marktzins).

    - Fehlerhafte Zuordnung einer Sondertilgung (die 5 %-Grenze wurde eventuell überschritten,
    was zu Vorfälligkeitskosten führte).

    - Einzug von Versicherungsbeiträgen (z. B. Gebäudeversicherung), die über das
    Kreditkonto abgerechnet werden.

    - Fehlende Zuweisung von Guthaben auf einem damit verknüpften Sparkonto.


    Prüfschritte in dieser Reihenfolge:

    1. Aktuellen Tilgungsplan prüfen: Stimmt die Abbuchung mit der im Plan für den
    aktuellen Monat hinterlegten Rate überein?

    2. Zinsbindungsdatum kontrollieren: Ist die gewählte Bindung (10 oder 15 Jahre)
    bereits abgelaufen?

    3. Sondertilgungen prüfen: Wurden in diesem Jahr bereits Beträge über die kostenfreien
    5 % der ursprünglichen Summe hinaus getilgt?

    4. Verwendungszweck analysieren: Handelt es sich um Zinsen, Tilgung oder ein Drittentgelt
    (Versicherung/Notar)?


    Lösung und Eskalation:

    - Wenn es sich um einen Rechenfehler handelt, leiten wir eine sofortige Korrektur
    ein und erstatten den Differenzbetrag auf das Girokonto des Kunden.

    - Bei Unklarheiten über Zinsanpassungen erläutern wir dem Kunden die vertragliche
    Grundlage der Zinsbindung.

    - Kann die Ursache nicht unmittelbar geklärt werden, erfolgt die Eskalation stufenweise:
    Der zuständige Filialmitarbeiter leitet den Fall an die Filialleitung und bei
    komplexen rechtlichen Fragen an die regionale Geschäftsführung weiter.


    Der Kunde wird über den Fortschritt der Prüfung informiert und erhält nach Abschluss
    eine schriftliche Aufstellung der Korrekturen.'
