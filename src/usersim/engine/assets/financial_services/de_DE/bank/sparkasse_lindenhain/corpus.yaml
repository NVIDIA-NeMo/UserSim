  product_category: privatkredit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 982bbad0-9595-5928-9a2f-b80d2e13accb
  title: Sparkassen-Privatkredit — Voraussetzungen
  body: 'Um einen Sparkassen-Privatkredit zu erhalten, müssen bestimmte Kriterien
    erfüllt sein. Die folgende Matrix gibt Aufschluss über die Voraussetzungen und
    die daraus resultierenden Möglichkeiten:


    | Bedingung | Ergebnis / Limit |

    | :--- | :--- |

    | Nachweis eines regelmäßigen Einkommens | Grundvoraussetzung für die Kreditprüfung
    |

    | Wohnsitz in Deutschland | Erforderlich für den Vertragsabschluss |

    | Positive Bonitätsprüfung (Schufa etc.) | Voraussetzung für die Kreditzusage
    |

    | Gewünschte Kreditsumme | Maximal 50.000 € |

    | Mindestalter | Volljährigkeit (18 Jahre) |


    Bitte beachten Sie, dass die Erfüllung dieser Grundvoraussetzungen noch keine
    Garantie für eine Kreditzusage darstellt. Die finale Entscheidung basiert auf
    einer individuellen Kreditwürdigkeitsprüfung.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: eligibility_matrix
  source_authority: official
