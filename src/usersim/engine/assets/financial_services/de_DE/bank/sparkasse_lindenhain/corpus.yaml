- id: 98540bb1-b31a-5a1f-bfbd-d4871f68481d
  title: Girokonto Komfort mit Sparkassen-Card — Status oder Verlauf einsehen
  body: 'Um den aktuellen Status Ihres Kontos oder den Verlauf Ihrer Transaktionen
    beim Girokonto Komfort mit Sparkassen-Card einzusehen, folgen Sie bitte diesen
    Schritten:


    1. Identitätsprüfung: Bitte legen Sie uns Ihren gültigen Personalausweis oder
    Reisepass vor oder führen Sie die starke Kundenauthentifizierung durch, sofern
    Sie unsere Dienste digital nutzen. Dies ist zwingend erforderlich, bevor wir Auskünfte
    über Kontodaten erteilen können.


    2. Anforderung der Daten: Teilen Sie uns mit, welchen Zeitraum Sie für den Kontoverlauf
    einsehen möchten (z. B. den letzten Monat oder ein spezifisches Quartal) oder
    ob Sie lediglich den aktuellen Kontostand wissen möchten.


    3. Bereitstellung: Wir werden Ihnen den gewünschten Kontoauszug oder die aktuelle
    Saldo-Information zur Verfügung stellen. Diese enthält alle verbuchten Geschäftsvorfälle
    sowie etwaige Zinsbelastungen für Dispositionskredite (11,49 %) oder geduldete
    Überziehungen (14,49 %).


    4. Überprüfung: Gehen Sie die aufgelisteten Transaktionen durch. Sollten Sie Unstimmigkeiten
    feststellen, können wir diese unmittelbar gemeinsam prüfen.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie das entsprechende
    Dokument (digital oder in Papierform) erhalten haben und der aktuelle Kontostand
    mit Ihren eigenen Aufzeichnungen übereinstimmt.'
