- id: 205ae5b9-4b70-5ba9-bcf2-5ca2de0393c2
  title: Girokonto Komfort mit Sparkassen-Card — Betrugsmaschen rund um dieses Produkt
    erkennen
  body: 'Für Kunden, die das Girokonto Komfort mit Sparkassen-Card nutzen oder in
    Erwägung ziehen, ist die Wachsamkeit gegenüber aktuellen Betrugsmustern essenziell.
    Da dieses Produkt tief in die täglichen Zahlungsströme integriert ist, versuchen
    Betrüger häufig, über gefälschte Kommunikationskanäle Zugriff auf Ihre Kontodaten
    zu erlangen.


    Ein häufiges Muster ist das sogenannte ''Phishing''. Hierbei erhalten Sie E-Mails
    oder SMS, die scheinbar von der Sparkasse Lindenhain stammen und Sie auffordern,
    Ihre Zugangsdaten zur Online-Banking-Verifizierung auf einer externen Webseite
    einzugeben. Bitte beachten Sie: Wir werden Sie niemals per E-Mail oder SMS dazu
    auffordern, Passwörter, PINs oder TANs auf einer Webseite einzugeben oder uns
    diese mitzuteilen.


    Ein weiteres Risiko ist der ''Social Engineering''-Betrug. Dabei geben sich Anrufer
    als Sicherheitsmitarbeiter der Bank aus und behaupten, es gäbe einen unbefugten
    Zugriff auf Ihr Konto. Sie werden dann gedrängt, Geldbeträge auf ein ''Sicherheitskonto''
    zu überweisen oder eine Überweisung zu tätigen, um Ihr Guthaben zu schützen. Dies
    ist ein Betrugsversuch. Die Sparkasse Lindenhain wird Sie niemals dazu auffordern,
    Gelder zur Sicherheit auf andere Konten zu transferieren.


    Sollten Sie den Verdacht haben, Opfer eines Betrugs geworden zu sein oder haben
    Sie Ihre Sparkassen-Card verloren, ist die sofortige Handlung entscheidend. Nutzen
    Sie den Notruf 116 116 zur sofortigen Sperrung Ihrer Karte. Durch diese zeitnahe
    Meldung kann die Haftung des Kunden im Falle nicht autorisierter Zahlungen auf
    maximal 50 € begrenzt werden.


    Wir empfehlen Ihnen, die starke Kundenauthentifizierung konsequent zu nutzen,
    da diese insbesondere bei sensiblen Vertragsänderungen und Online-Zahlungen zwingend
    erforderlich ist, um Ihre Vermögenswerte zu schützen.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 66888672-a4f7-5691-8388-74358d3e9e73
  title: Girokonto Komfort mit Sparkassen-Card — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter bei der Beratung
    zu den operationellen Grenzen und Sonderregelungen des Girokonto Komfort mit Sparkassen-Card.


    Überziehung und Zinslasten:

    Das Konto ermöglicht eine flexible Nutzung des Guthabens. Wenn ein Kunde sein
    Guthaben übersteigt, greifen unterschiedliche Zinssätze. Für einen vereinbarten
    Dispositionskredit gilt ein Zinssatz von 11,49 %. Sollte der Kunde diesen Rahmen
    überschreiten oder kein Dispositionskredit vereinbart sein, wird die Überziehung
    geduldet. In diesen Fällen wird ein höherer Zinssatz von 14,49 % angewendet. Es
    ist wichtig, den Kunden transparent über diese Differenz aufzuklären, um finanzielle
    Härten zu vermeiden.


    Gesetzliche Sonderfälle (Basiskonto):

    Die Sparkasse Lindenhain kommt ihrer sozialen Verantwortung nach, jedem Bürger
    einen Zugang zu Finanzdienstleistungen zu ermöglichen. In Fällen, in denen ein
    Kunde ein Basiskonto benötigt, werden die gesetzlichen Anforderungen prioritär
    behandelt. Die Konditionen für Basiskonten weichen von den Standardentgelten des
    Girokonto Komfort mit Sparkassen-Card ab und folgen den gesetzlichen Vorgaben.


    Pfändungsschutz:

    Kunden in finanziellen Notlagen können die Umwandlung ihres Kontos in ein Pfändungsschutzkonto
    beantragen. Durch diese Umwandlung wird der Grundfreibetrag, der derzeit bei 1.590
    € liegt, vor Pfändungen geschützt, um die Existenzsicherung des Kunden zu gewährleisten.


    Identitätsprüfung:

    Vor jeder zustandsändernden Aktion (z. B. Adressänderung, Erhöhung des Kreditrahmens)
    oder der Auskunft über Kontodaten muss eine strikte Identitätsprüfung erfolgen.
    Ohne eine erfolgreiche Verifizierung dürfen keine vertraulichen Informationen
    preisgegeben oder Änderungen am Konto vorgenommen werden.'
