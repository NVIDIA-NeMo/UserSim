- id: d19c6c94-d7a7-5120-8057-e811e6edeb4c
  title: Sparkassen-Kreditkarte Gold — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Mitarbeiter bei der Beratung und
    Unterstützung von Kunden zur Sparkassen-Kreditkarte Gold. Es beschreibt die systemischen
    und regulatorischen Grenzen des Produkts.


    Verfügungsrahmen und Limits:

    Das Produkt verfügt über einen monatlichen Verfügungsrahmen von 5.000 €. Dieser
    Betrag stellt die maximale Grenze für alle Transaktionen innerhalb eines Abrechnungsmonats
    dar. Eine Überschreitung dieses Rahmens führt systemseitig zur Ablehnung weiterer
    Zahlungen, sofern kein gesonderter Kreditrahmen vereinbart wurde.


    Kostenstruktur bei Auslandseinsätzen:

    Bei Zahlungen in Fremdwährungen fällt ein Fremdwährungsentgelt in Höhe von 1,75
    % an. Dieses Entgelt wird automatisch auf den umgerechneten Betrag aufgeschlagen.
    Dies ist insbesondere bei weltweiten Zahlungen zu kommunizieren, um eine transparente
    Kostenübersicht zu gewährleisten.


    Sonderfälle und Einschränkungen:

    Die Erteilung der Sparkassen-Kreditkarte Gold erfolgt nicht automatisch. Sie ist
    zwingend an eine positive Kreditwürdigkeitsprüfung gebunden. Kunden, die diese
    Prüfung nicht bestehen, können nicht mit diesem Produkt bedient werden.


    Zusatzkosten:

    Das Produkt ist mit einem Jahresentgelt von 84 € verbunden. Dieses Entgelt dient
    der Aufrechterhaltung unseres Premium-Services und der regionalen Infrastruktur.


    Rechtlicher Rahmen:

    Alle Vorgänge unterliegen den Richtlinien der BaFin und der Deutschen Bundesbank
    sowie den Bestimmungen des BGB. In Fällen von Kartenverlust ist die Sperrung über
    116 116 die primäre Maßnahme zur Haftungsbegrenzung auf 50 €.'
  domain: cards
  product_category: kreditkarte_gold
  document_type: product_sheet
  source_authority: official
