- id: 91f72f84-5432-5a5c-982f-80c4de3c2d74
  title: Girokonto Komfort mit Sparkassen-Card — Datenschutz und Datenverarbeitung
  body: 'Die Sparkasse Lindenhain verarbeitet personenbezogene Daten im Zusammenhang
    mit der Führung Ihres Girokonto Komfort mit Sparkassen-Card strikt nach den geltenden
    Datenschutzrichtlinien und der DSGVO. Wir gewährleisten, dass Ihre Finanzdaten
    sicher und nur für die Zwecke der Kontoführung sowie zur Erfüllung gesetzlicher
    Aufsichtspflichten verwendet werden.


    Im Rahmen unserer sozialen Verantwortung und zur Gewährleistung eines fairen Zugangs
    zu Finanzdienstleistungen bieten wir die Umwandlung Ihres Kontos in ein Pfändungsschutzkonto
    an. In diesem Fall wird der gesetzlich festgelegte Grundfreibetrag in Höhe von
    1.590 € vor Pfändungen geschützt. Dies stellt sicher, dass Ihnen trotz etwaiger
    Pfändungen ein Betrag für die Deckung Ihrer existenziellen Grundbedürfnisse zur
    Verfügung steht. Die Datenverarbeitung in diesem Kontext erfolgt unter strikter
    Beachtung des Zahlungskontengesetzes.


    Wir weisen darauf hin, dass wir als öffentlich-rechtliches Institut unter der
    Aufsicht der BaFin und der Deutschen Bundesbank agieren. Ihre Einlagen sind durch
    die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000 € geschützt.
    Diese Sicherheit ist ein Kernbestandteil unseres Versprechens an alle Bürger der
    Region Lindenhain.


    Alle zustandsändernden Aktionen an Ihren Kontodaten erfordern eine vorherige,
    strikte Identitätsprüfung sowie die Anwendung der starken Kundenauthentifizierung.
    Dies dient dem Schutz Ihrer Daten vor unbefugtem Zugriff.


    Weitere rechtliche Hinweise zu den Risiken und Bedingungen finden Sie im Dokument
    Girokonto Komfort mit Sparkassen-Card — rechtliche Hinweise.'
