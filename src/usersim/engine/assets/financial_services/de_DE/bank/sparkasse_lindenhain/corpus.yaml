- id: 0f128c60-0456-5e76-8762-8b53e35188ea
  title: Girokonto Komfort mit Sparkassen-Card — Kosten und Entgelte
  body: 'Frage: Wie hoch sind die monatlichen Kosten für die Führung meines Kontos?


    Antwort: Für das Girokonto Komfort mit Sparkassen-Card erheben wir ein monatliches
    Kontoführungsentgelt in Höhe von 7,50 €. Dieses Entgelt dient der Aufrechterhaltung
    unserer regionalen Infrastruktur und ermöglicht Ihnen den persönlichen Service
    in unseren Filialen.


    Frage: Welche Zinsen fallen an, wenn mein Konto ins Minus rutscht?


    Antwort: Wenn Sie einen vereinbarten Dispositionskredit nutzen, beträgt der Zinssatz
    11,49 %. Sollte eine Überziehung ohne vorherige Vereinbarung erfolgen (geduldete
    Überziehung), wird ein Zinssatz von 14,49 % angewendet.


    Frage: Gibt es Ausnahmen bei den Gebühren?


    Antwort: Ja, wir behandeln soziale Härten und gesetzliche Anforderungen, wie beispielsweise
    die Bereitstellung eines Basiskontos, prioritär und gemäß den gesetzlichen Vorgaben.'
  domain: retail_banking
  product_category: girokonto_komfort
  document_type: faq
  source_authority: official
