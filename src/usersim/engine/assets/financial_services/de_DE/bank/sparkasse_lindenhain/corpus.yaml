- id: 03eb371d-16ba-5dfb-80dd-ea855cff81c0
  title: 'Sparkassenbuch — kündigungsfreier Betrag pro Monat: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zum kündigungsfreien
    Betrag Ihres Sparkassenbuchs.


    Was bedeutet der kündigungsfreie Betrag genau?

    Das Sparkassenbuch ist für das langfristige Sparen gedacht, bietet Ihnen aber
    dennoch eine gewisse Flexibilität. Ein Betrag von 2.000 € kann jeden Monat ohne
    Einhaltung einer Kündigungsfrist abgehoben werden. Dieser Betrag steht Ihnen also
    sofort zur Verfügung.


    Was passiert, wenn ich mehr als 2.000 € in einem Monat abheben möchte?

    Wenn Sie einen Betrag wünschen, der die 2.000 € überschreitet, greift die vertragliche
    Kündigungsfrist von 3 Monaten. Sie müssen den darüber hinausgehenden Betrag also
    drei Monate im Voraus bei uns anmelden.


    Kann ich die Kündigungsfrist verkürzen?

    In Härtefällen prüfen wir Ihr Anliegen individuell. Bitte beachten Sie jedoch,
    dass die Einhaltung der 3 Monate in der Regel zwingend ist, um die Stabilität
    unserer regionalen Finanzdienstleistungen zu gewährleisten.


    Weitere Details finden Sie im Dokument Sparkassenbuch — Überblick.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 38c25ddd-4058-5729-9544-9f17ec72aecd
  title: Sparkassenbuch — etwas ändern
  body: 'Wenn Sie Änderungen an Ihrem Sparkassenbuch vornehmen möchten, etwa Ihre
    persönlichen Daten aktualisieren oder eine größere Auszahlung planen, folgen Sie
    bitte diesen Schritten.


    Was Sie benötigen:

    - Ihren gültigen Personalausweis oder Reisepass zur Identitätsprüfung.

    - Die Kontonummer Ihres Sparkassenbuchs.


    Schritte zur Änderung:

    1. Identitätsnachweis: Bitte legen Sie uns Ihren gültigen Ausweis vor. Vor jeder
    zustandsändernden Aktion führen wir eine strikte Identitätsprüfung durch, um Ihr
    Guthaben zu schützen.

    2. Änderungswunsch mitteilen: Nennen Sie uns genau, was Sie ändern möchten (z.
    B. Adressänderung oder die Ankündigung einer Auszahlung über den kündigungsfreien
    Betrag von 2.000 € hinaus).

    3. Prüfung durch die Bank: Wir prüfen Ihren Antrag. Im Falle einer Auszahlung
    über 2.000 € wird die Kündigungsfrist von 3 Monaten hinterlegt.

    4. Bestätigung erhalten: Wir bestätigen Ihnen die Änderung oder den Termin für
    die Auszahlung schriftlich oder in einem Gespräch.


    Wie Sie wissen, dass es funktioniert hat:

    Sie erhalten eine Bestätigung über die vorgenommene Änderung oder einen Terminbeleg
    für Ihre Auszahlung, der die Einhaltung der 3 Monate Kündigungsfrist dokumentiert.


    Für Fragen zur Verzinsung Ihres Kontos mit 0,5 % sehen Sie bitte im Dokument Sparkassenbuch
    — Zinsübersicht nach.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a7de2053-0eb2-5372-90fc-f2df59bf1e5a
  title: Sparkassenbuch — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten haben, auf die Details Ihres Sparkassenbuchs
    über unser Online-Banking zuzugreifen, finden Sie hier die gängigsten Lösungen.


    Symptom: Fehlermeldung beim Login oder das Sparkassenbuch wird in der Kontoübersicht
    nicht angezeigt.


    Mögliche Ursachen:

    - Ihre Zugangsdaten sind abgelaufen oder falsch eingegeben.

    - Ihr Zugang wurde aus Sicherheitsgründen nach mehreren Fehlversuchen gesperrt.

    - Es liegt eine technische Störung in der regionalen Online-Banking-Infrastruktur
    vor.


    Was Sie tun können:

    1. Zugangsdaten prüfen: Stellen Sie sicher, dass Sie die korrekten Anmeldedaten
    verwenden. Achten Sie auf die Groß- und Kleinschreibung.

    2. Identitätsprüfung: Wenn Ihr Konto gesperrt ist, bitten wir Sie, uns zur Identitätsprüfung
    zu kontaktieren. Wir verifizieren Ihre Identität strikt, bevor wir Ihren Zugang
    wieder freischalten.

    3. Alternativer Zugang: Prüfen Sie, ob Sie über andere Kanäle (z. B. in einer
    Filiale) Zugriff auf Ihr Guthaben haben.


    Wenn das Problem nicht gelöst werden kann:

    Sollte der Login trotz korrekter Daten nicht möglich sein, werden wir den Fall
    stufenweise eskalieren. Zunächst prüft ein Filialmitarbeiter die technischen Voraussetzungen,
    bei anhaltenden Problemen wird die Filialleitung und schließlich die regionale
    Geschäftsführung eingeschaltet, um eine Lösung zu finden.


    Sie können während dieser Zeit weiterhin Ihr Guthaben mit dem Zinssatz von 0,5
    % und dem kündigungsfreien Betrag von 2.000 € über unsere Filialen verwalten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f78386a4-6f67-53c0-84db-7db518b23ff0
  title: Sparkassenbuch — Zugangsstufen
  body: 'Diese Matrix dient Support-Mitarbeitern zur schnellen Prüfung der Voraussetzungen
    für die Eröffnung und Nutzung eines Sparkassenbuchs.


    | Voraussetzung | Ergebnis / Zugangsstufe |

    | :--- | :--- |

    | Volljährige Person mit gültigem Personalausweis/Reisepass | Voller Zugang zur
    Eröffnung eines Sparkassenbuchs mit 0,5 % Zinsen. |

    | Minderjährige Person (mit Zustimmung der gesetzlichen Vertreter + ID-Nachweis)
    | Zugang zur Eröffnung eines Sparkassenbuchs für den langfristigen Vermögensaufbau.
    |

    | Nachgewiesene regionale Verbundenheit oder Wohnsitz im Einzugsgebiet | Bevorzugter
    Zugang zur Nutzung des dichten Filial- und Automatennetzes. |

    | Erfolgreiche Identitätsprüfung (SCA bei Online-Anträgen) | Freischaltung des
    Kontos und Zugriff auf den kündigungsfreien Betrag von 2.000 €. |

    | Fehlender Identitätsnachweis | Keine Kontoeröffnung möglich; Verweis auf notwendige
    Dokumente. |


    Alle Kunden, die diese Bedingungen erfüllen, profitieren von der Kündigungsfrist
    von 3 Monaten für Beträge über 2.000 €.'
