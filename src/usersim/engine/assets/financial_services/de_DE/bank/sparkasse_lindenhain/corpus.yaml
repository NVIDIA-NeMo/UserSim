  institution_id: sparkasse_lindenhain
- id: 64855093-2b11-59e6-be7e-e9325b853b44
  title: Sparkassen-Kreditkarte Gold — Kosten und Entgelte
  body: 'Häufig gestellte Fragen zu den Kosten der Sparkassen-Kreditkarte Gold:


    Was kostet die Nutzung der Sparkassen-Kreditkarte Gold pro Jahr?

    Für die Bereitstellung der Karte und des damit verbundenen Premium-Services wird
    ein Jahresentgelt in Höhe von 84 € erhoben.


    Fallen Gebühren an, wenn ich im Ausland in einer anderen Währung bezahle?

    Ja, bei Zahlungen in einer Fremdwährung wird ein Fremdwährungsentgelt von 1,75
    % auf den jeweiligen Transaktionsbetrag berechnet.


    Gibt es Kosten für die Erhöhung des Kreditrahmens?

    Die Standardkonditionen beinhalten einen monatlichen Verfügungsrahmen von 5.000
    €. Sollten Sie eine Anpassung dieses Rahmens wünschen, prüfen wir dies im Rahmen
    einer neuen Kreditwürdigkeitsprüfung. Die damit verbundenen Kosten entnehmen Sie
    bitte dem Preis- und Leistungsverzeichnis unter Sparkassen-Kreditkarte Gold —
    Preis- und Leistungsverzeichnis.'
