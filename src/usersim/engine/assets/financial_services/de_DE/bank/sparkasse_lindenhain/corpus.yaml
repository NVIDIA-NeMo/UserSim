- id: 255e7eab-9587-5271-acbd-09164a4f0b10
  title: Sparkassenbuch — unerwartetes Entgelt oder unerwarteter Betrag
  body: "In diesem Dokument finden Sie Unterstützung bei der Klärung von Unstimmigkeiten\
    \ bezüglich des Guthabens oder der Abbuchungen auf Ihrem Sparkassenbuch.\n\n**Symptom:**\
    \ Der Kunde stellt fest, dass das Guthaben niedriger ist als erwartet oder ein\
    \ Entgelt abgezogen wurde, das nicht unmittelbar nachvollziehbar ist.\n\n**Mögliche\
    \ Ursachen und Prüfungsschritte:**\n\n1. **Überschreitung des kündigungsfreien\
    \ Betrags:**\n   - Prüfen Sie, ob in den letzten 3 Monaten eine Auszahlung getätigt\
    \ wurde, die den Betrag von 2.000 € überschritten hat.\n   - Wenn die Kündigungsfrist\
    \ von 3 Monaten nicht eingehalten wurde, wurde ein Vorfälligkeitsentgelt erhoben.\
    \ Dies ist die häufigste Ursache für unerwartete Kosten bei diesem Produkt.\n\n\
    2. **Zinsgutschrift-Zeitpunkt:**\n   - Prüfen Sie, ob die erwarteten Zinsen aus\
    \ dem Zinssatz von 0,5 % bereits zum jährlichen Stichtag gutgeschrieben wurden.\
    \ Zinsen werden nicht monatlich, sondern jährlich auf dem Konto sichtbar.\n\n\
    3. **Nicht autorisierte Vorgänge:**\n   - Gleichen Sie die letzten Kontobewegungen\
    \ ab. Falls eine Transaktion nicht durch den Kunden autorisiert wurde, liegt möglicherweise\
    \ ein Sicherheitsvorfall vor.\n\n**Lösung und Eskalation:**\n\n- **Korrektur von\
    \ Fehlern:** Sollte ein Entgelt fälschlicherweise erhoben worden sein (z. B. trotz\
    \ Einhaltung der Kündigungsfrist), werden wir die Gutschrift des Betrags umgehend\
    \ veranlassen.\n- **Eskalationsweg:** Wenn die Ursache nicht durch den Filialmitarbeiter\
    \ geklärt werden kann, wird das Anliegen stufenweise an die Filialleitung und\
    \ bei Bedarf an die regionale Geschäftsführung weitergeleitet.\n- **Rechtlicher\
    \ Rahmen:** Wir bearbeiten alle Reklamationen gemäß den gesetzlichen Fristen des\
    \ BGB. Der Kunde erhält eine schriftliche Stellungnahme über das Ergebnis der\
    \ Prüfung innerhalb der gesetzlichen Antwortfristen."
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: eac5eaf4-2c00-55d7-8bf6-bb8ed0b7c55f
  title: Sparkassenbuch — erforderliche Unterlagen
  body: 'Um ein Sparkassenbuch bei der Sparkasse Lindenhain zu eröffnen, müssen folgende
    Unterlagen und Bedingungen erfüllt sein:


    | Anforderung | Erforderliches Dokument / Bedingung | Ergebnis bei Erfüllung |

    | :--- | :--- | :--- |

    | **Identitätsnachweis** | Gültiger Personalausweis oder Reisepass (original)
    | Identität verifiziert, Eröffnung möglich |

    | **Steuerliche Erfassung** | Steueridentifikationsnummer (Steuer-ID) | Steuerliche
    Meldepflichten erfüllt |

    | **Wohnsitznachweis** | Aktuelle Meldebescheinigung (falls Ausweis nicht aktuell)
    | Regionaler Bezug bestätigt |

    | **Volljährigkeit** | Geburtsdatum gemäß Ausweis ≥ 18 Jahre | Vertragspartner
    kann eigenständig schließen |

    | **Gesetzliche Vertretung** | Bei Minderjährigen: Unterschrift beider Sorgeberechtigten
    + deren Ausweise | Konto unter gesetzlicher Vertretung möglich |


    Alle Unterlagen müssen im Original vorgelegt werden. Eine digitale Kopie reicht
    für den Eröffnungsprozess nicht aus, da eine strikte Identitätsprüfung gemäß unserer
    Sicherheitsrichtlinien zwingend erforderlich ist.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: de928021-6d30-55b1-ab76-070e5bd15d42
  title: Sparkassenbuch — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Beim Vergleich unseres Sparkassenbuchs mit typischen Angeboten von Direktbanken
    oder Online-Anbietern zeigen sich folgende Unterschiede:


    **Sparkasse Lindenhain (Sparkassenbuch)**

    - **Zinssatz:** Festgelegt auf 0,5 %.

    - **Zugang:** Persönlicher Service in regionalen Filialen, Vertrauen durch lokale
    Präsenz.

    - **Sicherheit:** Gesetzliche Einlagensicherung bis 100.000 €.

    - **Flexibilität:** Kündigungsfreier Betrag von 2.000 € pro Monat; darüber hinaus
    Kündigungsfrist von 3 Monaten.


    **Typisches Wettbewerbsangebot (Online-Tagesgeld)**

    - **Zinssatz:** Oft variabel und kurzfristig höher, jedoch häufig an Neukundenkonditionen
    gebunden.

    - **Zugang:** Rein digital, kein physisches Filialnetz für persönliche Beratung.

    - **Flexibilität:** Meist täglich verfügbar, jedoch ohne die soziale Verantwortung
    und regionale Verwurzelung eines öffentlich-rechtlichen Instituts.


    **Fazit:**

    Das Online-Angebot ist die bessere Wahl für Kunden, die maximale kurzfristige
    Liquidität und die höchstmögliche aktuelle Verzinsung suchen. Das Sparkassenbuch
    der Sparkasse Lindenhain ist hingegen ideal für Kunden, die eine sichere, traditionelle
    Anlageform mit persönlichem Ansprechpartner in ihrer Heimatregion bevorzugen und
    die Disziplin einer Kündigungsfrist von 3 Monaten für ihren langfristigen Vermögensaufbau
    nutzen möchten.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 7b65a226-cac3-5b03-a772-5b1142a101f4
  title: Sparkassenbuch — Risikohinweise
  body: 'Im Rahmen der transparenten Kundenberatung der Sparkasse Lindenhain weisen
    wir Sie auf die folgenden Risiken und Besonderheiten des Sparkassenbuchs hin:


    **1. Inflationsrisiko:**

    Das Sparkassenbuch ist eine nominalwertgesicherte Anlage. Bei einem aktuellen
    Zinssatz von 0,5 % besteht das Risiko, dass die reale Kaufkraft Ihres angesparten
    Kapitals sinkt, sofern die Inflationsrate über dem Zinssatz liegt. Eine Wertsteigerung
    ist somit nur in nominalen Zahlen garantiert, nicht zwingend in Bezug auf die
    reale Kaufkraft.


    **2. Liquiditätsrisiko und Verfügbarkeitsbeschränkungen:**

    Im Gegensatz zu einem Girokonto ist das Sparkassenbuch nicht für den täglichen
    Zahlungsverkehr konzipiert. Es gilt eine strikte Kündigungsfrist von 3 Monaten
    für Beträge, die den monatlichen kündigungsfreien Betrag von 2.000 € überschreiten.
    Werden diese Mittel vor Ablauf der Frist benötigt, können Vorfälligkeitsentgelte
    anfallen, welche die effektive Rendite mindern.


    **3. Zinsänderungsrisiko:**

    Der Zinssatz von 0,5 % ist nicht dauerhaft fixiert. Die Sparkasse Lindenhain kann
    die Verzinsung unter Einhaltung der gesetzlichen und aufsichtsrechtlichen Vorgaben
    anpassen. Dies kann sowohl eine Erhöhung als auch eine Senkung bedeuten.


    **4. Gesetzliche Absicherung:**

    Trotz dieser Risiken bietet das Sparkassenbuch eine extrem hohe Sicherheit. Ihr
    Guthaben ist durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000
    € geschützt. Wir agieren unter der Aufsicht der BaFin und der Deutschen Bundesbank,
    um eine gesetzeskonforme Behandlung aller Kunden zu gewährleisten.


    Für weitere Informationen zu den Bedingungen Ihrer Anlage lesen Sie bitte das
    Dokument Sparkassenbuch — Allgemeine Geschäftsbedingungen.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f0bd2180-c7b2-54d0-927d-4be5344505a0
  title: Sparkassenbuch — wie Zinsen berechnet und angewendet werden
  body: 'Die Verzinsung des Sparkassenbuchs erfolgt nach folgenden Grundsätzen:


    - **Zinssatz:** Es gilt ein einheitlicher Zinssatz von 0,5 % pro Jahr (p.a.) für
    alle Guthabenstände.

    - **Berechnungsgrundlage:** Die Zinsen werden auf Basis des täglichen Endsaldos
    berechnet. Das bedeutet, dass jede Einzahlung ab dem Tag des Geldeingangs und
    jede Auszahlung ab dem Tag des Geldabflusses in die Zinsberechnung einfließt.

    - **Gutschrift:** Die berechneten Zinsen werden einmal jährlich dem Konto gutgeschrieben.
    Erst mit der Gutschrift werden die Zinsen Teil des Kapitals und werden im Folgejahr
    mitverzinst (Zinseszins-Effekt).

    - **Änderungen:** Der Zinssatz von 0,5 % kann von der Sparkasse Lindenhain angepasst
    werden. Über Änderungen werden Kunden transparent und zeitnah informiert.


    Da das Sparkassenbuch als Instrument für den langfristigen Vermögensaufbau dient,
    ist die Verzinsung stabil und unabhängig von gestaffelten Betragsgrenzen gestaltet.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: ccba34e2-0efa-5342-902a-c52f25070800
  title: Sparkassenbuch — Empfehlungs- und Treueangebot
  body: 'Die Sparkasse Lindenhain schätzt die regionale Verbundenheit und das Vertrauen
    ihrer Kunden. Deshalb bieten wir Ihnen und Ihren Empfohlenen ein besonderes Treueangebot
    für unser Sparkassenbuch an.


    Sichern Sie sich bei einer Neueröffnung Ihres Sparkassenbuchs im Zeitraum vom
    01. November 2024 bis zum 31. Dezember 2024 einen attraktiven Zinssatz von 0,5
    %. Dieses Angebot richtet sich an alle Bürger, die ihr Vermögen sicher, regional
    und verantwortungsbewusst aufbauen möchten.


    Profitieren Sie von der Sicherheit eines öffentlich-rechtlichen Instituts und
    einem kündigungsfreien monatlichen Betrag von 2.000 €, der Ihnen Flexibilität
    bei Ihren Auszahlungen garantiert. Für Beträge, die diesen Rahmen übersteigen,
    gilt die reguläre Kündigungsfrist von 3 Monaten.


    Wir laden Sie ein, Teil unserer regionalen Gemeinschaft zu werden und gemeinsam
    mit uns für Ihre finanzielle Zukunft vorzusorgen. Bitte beachten Sie, dass dieses
    Angebot zeitlich befristet ist und nur für Neukunden sowie im Rahmen unserer Empfehlungsaktion
    gilt.'
  domain: retail_banking
  product_category: sparkassenbuch
  document_type: promo_notice
  source_authority: official
