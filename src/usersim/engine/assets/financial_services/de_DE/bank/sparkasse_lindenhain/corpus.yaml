- id: 7953e996-be48-5606-ae3c-cbe4883e3c0b
  title: Girokonto Komfort mit Sparkassen-Card — wie Zinsen berechnet und angewendet
    werden
  body: 'Die Zinsberechnung für das Girokonto Komfort mit Sparkassen-Card erfolgt
    transparent und auf Basis der täglichen Inanspruchnahme von Kreditlinien.


    Anwendbare Zinssätze:

    - Dispositionskredit (vereinbart): 11,49 %

    - Geduldete Überziehung (nicht vereinbart oder Rahmen überschritten): 14,49 %


    Berechnungsmethode:

    Die Zinsen werden täglich auf Basis des jeweiligen Endsaldos berechnet. Dabei
    wird der Zinssatz pro Jahr (p.a.) auf die Anzahl der Tage verteilt, an denen das
    Konto im Minus war. Die Summe der täglichen Zinsen wird gesammelt und in der Regel
    einmal monatlich als Zinsbelastung auf dem Konto verbucht.


    Änderung der Zinsen:

    Die Sparkassen-Zinssätze sind variabel. Das bedeutet, dass sie sich an die allgemeinen
    Marktentwicklungen und die Vorgaben der Bundesbank anpassen können. Über Änderungen
    der Zinssätze werden Kunden transparent informiert.


    Es gibt bei diesem Produkt keine gestaffelten Zinssätze basierend auf dem Überziehungsbetrag;
    die oben genannten Sätze gelten einheitlich für den jeweiligen Status der Überziehung
    (vereinbart vs. geduldet).'
