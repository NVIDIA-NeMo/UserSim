  product_category: girokonto_komfort
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 0c1091c6-4182-5f43-a2a8-f2002721a1c0
  title: 'Girokonto Komfort mit Sparkassen-Card — monatlicher Grundfreibetrag auf
    dem Pfändungsschutzkonto: Erklärung'
  body: 'Frage: Was ist der monatliche Grundfreibetrag auf einem Pfändungsschutzkonto
    und wie hoch ist dieser beim Girokonto Komfort mit Sparkassen-Card?


    Antwort: Ein Pfändungsschutzkonto ist eine besondere Form des Girokontos, die
    dazu dient, einen Teil Ihres Guthabens vor Pfändungen durch Gläubiger zu schützen.
    Dies stellt sicher, dass Ihnen ein Betrag für den notwendigen Lebensunterhalt
    zur Verfügung steht. Beim Girokonto Komfort mit Sparkassen-Card beträgt dieser
    geschützte Grundfreibetrag aktuell 1.590 € pro Monat. Beträge bis zu dieser Höhe
    sind pfändungsfrei, sofern das Konto rechtmäßig in ein Pfändungsschutzkonto umgewandelt
    wurde.


    Frage: Wie erfolgt die Umwandlung in ein Pfändungsschutzkonto?


    Antwort: Die Umwandlung erfolgt auf Ihren Antrag hin. Wir unterstützen Sie gerne
    in unseren regionalen Filialen dabei, die notwendigen Schritte gemäß den gesetzlichen
    Anforderungen des BGB und des Zahlungskontengesetzes einzuleiten, um Ihren Grundfreibetrag
    in Höhe von 1.590 € zu sichern.'
