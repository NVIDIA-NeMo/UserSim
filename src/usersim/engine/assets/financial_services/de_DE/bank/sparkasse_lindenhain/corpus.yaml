- id: ad88c60e-3caa-569f-8373-d3a7a7f478a3
  title: Sparkassen-Baufinanzierung — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Finanzen hat für die Sparkasse Lindenhain höchste Priorität,
    insbesondere bei langfristigen Verpflichtungen wie der Sparkassen-Baufinanzierung.
    Um Ihr Konto und Ihr Vermögen vor Betrug zu schützen, bitten wir Sie, die folgenden
    Sicherheitshinweise strikt zu beachten.


    Ein häufiges Muster bei Betrugsversuchen ist die sogenannte ''Phishing''-Methode.
    Dabei erhalten Sie E-Mails oder SMS, die vorgeben, von uns zu stammen und Sie
    zur dringenden Aktualisierung Ihrer Daten oder zur Bestätigung von Vertragsdetails
    auffordern. Bitte bedenken Sie: Die Sparkasse Lindenhain wird Sie niemals per
    E-Mail, SMS oder Telefon dazu auffordern, Ihre Online-Banking-PIN, Ihre TAN oder
    andere Zugangsdaten preiszugeben. Solche Informationen sind absolut geheim zu
    halten.


    Besonderes Augenmerk sollten Sie auf sogenannte ''unabhängige Finanzberater''
    legen, die Ihnen unrealistisch niedrige Zinsen versprechen, die deutlich unter
    unseren Konditionen von 3,68 % (10 Jahre) oder 3,91 % (15 Jahre) liegen, sofern
    diese nicht durch eine extrem hohe Eigenkapitalquote gerechtfertigt sind. Seien
    Sie misstrauisch bei Angeboten, die eine sofortige Zahlung von Bearbeitungsgebühren
    vor der eigentlichen Kreditprüfung verlangen.


    Sollten Sie den Verdacht haben, dass Ihre Zugangsdaten kompromittiert wurden oder
    Sie eine verdächtige Nachricht erhalten haben, ist schnelles Handeln entscheidend.
    Informieren Sie uns umgehend über Ihren persönlichen Filialmitarbeiter oder unseren
    telefonischen Kundenservice. Wir werden eine sofortige Sicherheitsprüfung Ihres
    Kontos einleiten und gegebenenfalls eine starke Kundenauthentifizierung für alle
    weiteren Änderungen an Ihrem Finanzierungsvertrag erzwingen.


    Wir empfehlen Ihnen zudem, regelmäßig Ihre Kontoauszüge und die Zinsabrechnungen
    Ihrer Sparkassen-Baufinanzierung zu prüfen. Unstimmigkeiten sollten sofort gemeldet
    werden, um eine zeitnahe Klärung gemäß den gesetzlichen Fristen des BGB zu gewährleisten.
    Weitere allgemeine Informationen finden Sie in dem Dokument Sparkassen-Baufinanzierung
    — Überblick.'
  domain: lending_mortgage
  product_category: baufinanzierung
  document_type: security_advisory
