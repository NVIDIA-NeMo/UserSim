- id: ec404af8-5c11-5d78-916e-ba157fab7ad5
  title: Girokonto Komfort mit Sparkassen-Card — Zugangsstufen
  body: 'Zur Unterstützung unserer Mitarbeiter folgt hier die Matrix der Zugangsstufen
    für das Girokonto Komfort mit Sparkassen-Card. Bitte prüfen Sie die Voraussetzungen
    vor jeder Kontoeröffnung oder Funktionserweiterung.


    Standard-Kontozugang:

    - Voraussetzung: Nachweis eines festen Wohnsitzes, gültiges Ausweisdokument (Identitätsprüfung),
    Volljährigkeit oder gesetzliche Vertretung.

    - Ergebnis: Eröffnung des Kontos mit Grundfunktionen und Sparkassen-Card; monatliches
    Entgelt von 7,50 €.


    Erweiterter Kreditzugang (Dispositionskredit):

    - Voraussetzung: Positive Kreditwürdigkeitsprüfung, regelmäßiger Gehaltseingang
    auf dem Konto.

    - Ergebnis: Einrichtung eines Kreditrahmens zu einem Zinssatz von 11,49 %.


    Besonderer Schutzstatus (Pfändungsschutzkonto):

    - Voraussetzung: Antrag auf Umwandlung in ein Pfändungsschutzkonto aufgrund einer
    Pfändung oder zur Prävention.

    - Ergebnis: Schutz des Grundfreibetrags bis zu einer Höhe von 1.590 € vor Pfändungen.


    Für die detaillierte Dokumentation der benötigten Nachweise verweisen Sie bitte
    auf das Dokument Girokonto Komfort mit Sparkassen-Card — erforderliche Unterlagen.'
