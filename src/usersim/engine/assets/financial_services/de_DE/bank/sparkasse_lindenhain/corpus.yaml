- id: 7b7fc301-8f4b-5654-ad3c-5c4042ed2d25
  title: Sparkassen-Privatkredit — abgelehnter oder gesperrter Vorgang
  body: 'Symptom: Ihr Antrag auf einen Sparkassen-Privatkredit wurde abgelehnt oder
    ein bestehender Vorgang im Zusammenhang mit Ihrem Kredit wurde gesperrt.


    Ursachen: Eine Ablehnung erfolgt in der Regel auf Basis der obligatorischen Kreditwürdigkeitsprüfung.
    Mögliche Gründe sind ein nicht ausreichendes regelmäßiges Einkommen im Verhältnis
    zur gewünschten Kreditsumme, eine zu hohe bestehende Schuldenlast oder negative
    Einträge in Auskunfteien. Eine Sperrung von Vorgängen kann zudem durch eine fehlgeschlagene
    Identitätsprüfung oder Sicherheitsbedenken im Rahmen der starken Kundenauthentifizierung
    ausgelöst werden.


    Was zu prüfen ist:

    1. Prüfen Sie, ob alle eingereichten Einkommensnachweise aktuell und vollständig
    sind.

    2. Verifizieren Sie, ob die angegebene Kreditsumme (bis maximal 50.000 €) in einem
    angemessenen Verhältnis zu Ihren monatlichen Ausgaben steht.

    3. Stellen Sie sicher, dass Ihre persönlichen Daten und Kontaktdaten auf dem neuesten
    Stand sind, um Fehlern bei der Identitätsprüfung vorzubeugen.


    Lösung:

    Wenn eine Ablehnung aufgrund der Bonität erfolgte, besprechen Sie mit uns alternative
    Optionen, wie eine Anpassung der Kreditsumme oder eine Verlängerung der Laufzeit,
    um die monatliche Belastung zu senken. Wir führen eine erneute Prüfung durch,
    sobald neue, belastbare Unterlagen vorliegen.


    Eskalation:

    Sollten Sie die Entscheidung nicht nachvollziehen können, leiten wir Ihr Anliegen
    stufenweise vom Filialmitarbeiter über die Filialleitung bis zur regionalen Geschäftsführung
    weiter. Sie erhalten eine sachliche und transparente Erläuterung der Ablehnung
    unter Einhaltung der datenschutzrechtlichen Richtlinien und der gesetzlichen Vorgaben
    des BGB.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: cbc44a59-0dbd-5f2e-90ad-6479e6d9ad94
  title: Sparkassen-Privatkredit — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Ein Wechsel oder ein Upgrade des Sparkassen-Privatkredits ist dann sinnvoll,
    wenn sich die finanziellen Bedürfnisse oder die Lebenssituation des Kunden grundlegend
    ändern.


    Ein Upgrade ist ratsam, wenn der aktuelle Kreditrahmen nicht mehr ausreicht, um
    geplante Anschaffungen zu tätigen, jedoch die maximale Kreditsumme von 50.000
    € noch nicht erreicht ist. In diesem Fall kann eine Aufstockung des Kredits geprüft
    werden, sofern die Kreditwürdigkeitsprüfung positiv ausfällt.


    Ein Wechsel zu einem anderen Produkt lohnt sich hingegen, wenn der Verwendungszweck
    eine langfristige Investition in Immobilien ist. In diesem Fall ist die Sparkassen-Baufinanzierung
    die geeignetere Wahl, da sie über flexible Sollzinsbindungen verfügt, die bei
    einem Privatkredit nicht gegeben sind.


    Zusammenfassend: Der Sparkassen-Privatkredit eignet sich für flexible, kurz- bis
    mittelfristige Anschaffungen. Für langfristige Vermögensaufbau-Strategien ist
    hingegen das Sparkassenbuch die richtige Wahl. Wir empfehlen eine individuelle
    Beratung, um die optimale Lösung basierend auf der aktuellen Bonität zu finden.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 3ab3ea82-e875-57dc-919e-2cc418747ebb
  title: Sparkassen-Privatkredit — Vergleich mit Alternativen und wann es nicht passt
  body: 'Bei der Wahl der passenden Finanzierung ist es wichtig, die Struktur des
    Sparkassen-Privatkredits gegenüber anderen Optionen abzuwägen. Unser Produkt zeichnet
    sich durch Transparenz und regionale Sicherheit aus, ist jedoch nicht für jeden
    Zweck die optimale Lösung.


    Im Vergleich zu einem Sparkassenbuch, das der langfristigen Vermögensbildung dient,
    ist der Sparkassen-Privatkredit ein Instrument zur sofortigen Liquiditätsbeschaffung.
    Während Sie beim Sparen Zinsen erhalten, zahlen Sie beim Kredit Zinsen – im repräsentativen
    Beispiel einen effektiven Jahreszins von 6,49 %.


    Der Sparkassen-Privatkredit passt ideal, wenn Sie eine flexible Finanzierung für
    individuelle Anschaffungen suchen und eine schnelle Auszahlung benötigen. Er bietet
    eine klare Struktur: Bei einem Beispielbetrag von 10.000 € über eine Laufzeit
    von 60 Monaten ergibt sich eine monatliche Rate von 194,75 € und Gesamtkosten
    von 1.685 €.


    Das Produkt ist hingegen nicht geeignet in folgenden Fällen:

    1. Bei sehr hohen Finanzierungsvolumina über 50.000 €, da dies die maximale Kreditsumme
    überschreitet.

    2. Bei langfristigen Immobilienvorhaben. Hier ist die Sparkassen-Baufinanzierung
    aufgrund der spezifischen Sollzinsbindungen vorzuziehen.

    3. Wenn eine sehr kurzfristige Überziehungsmöglichkeit ohne festen Tilgungsplan
    gesucht wird; hier wäre ein Dispositionskredit im Rahmen eines Girokonto Komfort
    mit Sparkassen-Card die richtige Wahl.


    Wir empfehlen stets eine sorgfältige Prüfung der Kreditwürdigkeit, um eine nachhaltige
    Finanzierung zu gewährleisten. Eine Kreditzusage erfolgt erst nach finaler Prüfung,
    um eine Überschuldung zu vermeiden und eine gesetzeskonforme Kundenbehandlung
    gemäß BGB zu garantieren.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: cc4aeba5-e322-5dd4-9118-a976332991c0
  title: 'Sparkassen-Privatkredit — Gesamtkosten im repräsentativen Beispiel: Erklärung'
  body: "Frage: Was bedeuten die Gesamtkosten von 1.685 € im repräsentativen Beispiel\
    \ genau?\n\nAntwort: Die Gesamtkosten von 1.685 € stellen den Betrag dar, den\
    \ Sie über die gesamte Laufzeit des Kredits an Zinsen zahlen, um die Nutzung des\
    \ Kapitals zu entlohnen. \n\nIm Beispiel wird eine Summe von 10.000 € über 60\
    \ Monate zu einem effektiven Jahreszins von 6,49 % finanziert. Die Gesamtkosten\
    \ sind somit die Differenz zwischen der Summe aller geleisteten Monatszahlungen\
    \ (60 Monate x 194,75 €) und dem ursprünglich ausgezahlten Nettodarlehensbetrag\
    \ von 10.000 €. Diese Kosten dienen unter anderem der Aufrechterhaltung unserer\
    \ regionalen Infrastruktur und des persönlichen Service in unseren Filialen. Bitte\
    \ beachten Sie, dass dies ein Beispiel ist und die tatsächlichen Kosten je nach\
    \ individueller Bonitätsprüfung variieren."
  domain: lending_mortgage
  product_category: privatkredit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 905a3aa4-8da7-578a-87ac-05f74f9591d8
  title: Sparkassen-Privatkredit — ein typisches Anliegen vollständig erledigen
  body: 'Hier beschreiben wir den Prozess für ein typisches Anliegen: Die Beantragung
    und den Abschluss eines Sparkassen-Privatkredits.


    1. Geben Sie uns die gewünschte Kreditsumme und den geplanten Verwendungszweck
    bekannt. Beachten Sie dabei die maximale Kreditsumme von 50.000 €.


    2. Legen Sie uns die erforderlichen Unterlagen zur Prüfung Ihrer Kreditwürdigkeit
    vor. Dazu gehören in der Regel aktuelle Einkommensnachweise (z. B. Lohnabrechnungen)
    und eine Aufstellung Ihrer monatlichen Fixkosten. Diese Dokumente sind die Grundlage
    für unsere obligatorische Bonitätsprüfung.


    3. Wir führen die Kreditwürdigkeitsprüfung durch. In diesem Schritt ermitteln
    wir den für Sie möglichen Zinssatz. Zur Orientierung dient unser repräsentatives
    Beispiel mit einem effektiven Jahreszins von 6,49 % bei 10.000 € über 60 Monate.


    4. Nach erfolgreicher Prüfung unterbreiten wir Ihnen ein verbindliches Angebot
    mit der exakten Monatsrate und der Gesamtlaufzeit. Wir erläutern Ihnen dabei transparent
    alle Kosten.


    5. Führen Sie die Identitätsprüfung durch. Dies erfolgt entweder persönlich in
    einer unserer Filialen oder über die starke Kundenauthentifizierung bei einem
    Online-Abschluss.


    6. Unterzeichnen Sie den Kreditvertrag. Wir bestätigen Ihnen den Abschluss und
    die Auszahlung des Nettodarlehensbetrags auf das von Ihnen angegebene Konto.


    Sie wissen, dass das Anliegen vollständig erledigt ist, wenn der Kreditbetrag
    auf Ihrem Konto eingegangen ist und Sie den unterzeichneten Vertrag sowie den
    Tilgungsplan erhalten haben. Ab diesem Zeitpunkt erfolgt die Tilgung automatisch
    über die vereinbarten Monatsraten.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 54abb7d4-b67e-50c8-be8a-32ddcdc666bf
  title: Sparkassen-Privatkredit — Abweichung von Ihren Unterlagen
  body: 'Symptom: Bei der Prüfung eines Kreditantrags oder während der Laufzeit eines
    Sparkassen-Privatkredits wird eine Abweichung zwischen den vom Kunden eingereichten
    Unterlagen und den internen Daten oder den Anforderungen des Kreditvertrags festgestellt.


    Ursachen: Häufige Ursachen sind veraltete Einkommensnachweise, nicht aktualisierte
    Adressdaten oder Diskrepanzen bei der angegebenen Haushaltsgröße. Auch eine Änderung
    der beruflichen Situation, die nicht gemeldet wurde, kann zu einer Abweichung
    führen, die die Kreditwürdigkeitsprüfung beeinflusst.


    Was zu prüfen ist:

    1. Vergleichen Sie die eingereichten Lohnabrechnungen mit den tatsächlichen Geldeingängen
    auf dem Referenzkonto.

    2. Prüfen Sie, ob alle im Antrag genannten Verpflichtungen und bestehenden Kredite
    in den Auskunftsdateien korrekt abgebildet sind.

    3. Stellen Sie sicher, dass die Identität des Kunden durch aktuelle Ausweisdokumente
    zweifelsfrei belegt ist.


    Lösung:

    Fordern Sie den Kunden auf, die fehlenden oder aktualisierten Unterlagen nachzureichen.
    Sollte die Abweichung die Kreditwürdigkeit wesentlich beeinflussen, muss die Bonitätsprüfung
    erneut durchgeführt werden. Dies kann zu einer Anpassung der Konditionen oder
    einer Änderung der maximal möglichen Kreditsumme (bis maximal 50.000 €) führen.


    Eskalation:

    Wenn der Kunde die geforderten Unterlagen nicht erbringen kann oder die Abweichungen
    einen Verdacht auf Falschangaben nahelegen, ist der Vorgang stufenweise an die
    Filialleitung und ggf. an die regionale Geschäftsführung zu melden. Die weitere
    Vorgehensweise erfolgt strikt nach den Datenschutzrichtlinien und den gesetzlichen
    Bestimmungen des BGB, um eine faire und gesetzeskonforme Behandlung zu gewährleisten.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: a841d5f0-baa1-57e0-b7a7-23bd491f899c
  title: Entgelte und Kosten im Überblick
  body: "Die Sparkasse Lindenhain ist ein öffentlich-rechtliches Institut, das seine\
    \ Entgelte transparent kommuniziert. Unsere Gebühren dienen primär der Aufrechterhaltung\
    \ einer flächendeckenden regionalen Infrastruktur sowie der Bereitstellung eines\
    \ persönlichen und kompetenten Services in unseren Filialen.\n\nEin beispielhaftes\
    \ Entgelt ist die monatliche Gebühr von 7,50 € für das Girokonto Komfort mit Sparkassen-Card.\
    \ Die genaue Höhe der Kosten variiert je nach gewähltem Produkt und den damit\
    \ verbundenen Leistungen. \n\nWir legen großen Wert auf soziale Verantwortung.\
    \ Daher werden gesetzliche Anforderungen, wie etwa die Bereitstellung eines Basiskontos,\
    \ sowie nachgewiesene soziale Härten bei der Festlegung und Erhebung von Entgelten\
    \ prioritär behandelt. Eine detaillierte Aufstellung aller produktbezogenen Kosten\
    \ entnehmen Sie bitte den jeweiligen Preis- und Leistungsverzeichnissen der einzelnen\
    \ Produkte."
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 15cecae7-82c8-5da7-9b77-5ae3f5f9b895
  title: Häufige Fragen
  body: 'Hier finden Sie Antworten auf allgemeine Fragen zu unseren Dienstleistungen
    und dem Kontakt mit der Sparkasse Lindenhain.


    **Wie kann ich die Sparkasse Lindenhain kontaktieren?**

    Sie können uns omnikanal erreichen: persönlich in einer unserer regionalen Filialen,
    über unseren telefonischen Kundenservice oder bequem per Online-Banking. Bitte
    beachten Sie, dass diese Dienste während unserer Standard-Geschäftszeiten zur
    Verfügung stehen.


    **Was passiert, wenn ich mit einer Lösung nicht zufrieden bin?**

    Wir legen Wert auf eine faire Behandlung aller Kunden. Sollte ein Anliegen nicht
    zufriedenstellend gelöst werden, erfolgt die Eskalation stufenweise: Zunächst
    erfolgt die Bearbeitung durch den zuständigen Filialmitarbeiter, gefolgt von der
    Filialleitung und schließlich durch die regionale Geschäftsführung.


    **Wie wird meine Identität geprüft?**

    Um die Sicherheit Ihrer Daten zu gewährleisten, führen wir vor jeder zustandsändernden
    Aktion oder der Auskunft über Kontodaten eine strikte Identitätsprüfung durch.
    Bei sensiblen Vertragsänderungen und Online-Zahlungen ist zudem eine starke Kundenauthentifizierung
    zwingend erforderlich.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f3fda348-e56b-5040-b038-b032409629b3
  title: 'Aufsichtsrechtliche Hinweise: Privatkundengeschäft'
  body: 'Die Sparkasse Lindenhain agiert als öffentlich-rechtliches Institut unter
    der strengen Aufsicht der BaFin (Bundesanstalt für Finanzdienstleistungsaufsicht)
    und der Deutschen Bundesbank. Diese regulatorische Einbettung gewährleistet die
    Stabilität unseres Hauses und den Schutz unserer Kunden.


    Ein zentraler Aspekt der Sicherheit ist die gesetzliche Einlagensicherung. Guthaben
    unserer Kunden sind dadurch bis zu einem Betrag von 100.000 € geschützt. Dieser
    Schutz gilt für alle geführten Konten und Einlagen innerhalb der gesetzlichen
    Rahmenbedingungen.


    Sämtliche Geschäftsprozesse im Privatkundengeschäft folgen strikt den Vorgaben
    des Bürgerlichen Gesetzbuches (BGB), dem Zahlungskontengesetz sowie den aktuellen
    Datenschutzrichtlinien (DSGVO). Diese rechtlichen Grundlagen dienen der Gewährleistung
    einer fairen, transparenten und gesetzeskonformen Behandlung jedes einzelnen Kunden.


    Das Personal der Sparkasse Lindenhain ist verpflichtet, diese Richtlinien in jeder
    Kundeninteraktion anzuwenden. Insbesondere bei der Eröffnung von Konten, der Prüfung
    von Kreditwürdigkeiten oder der Bearbeitung von Datenschutzanfragen ist die strikte
    Einhaltung der gesetzlichen Fristen und Dokumentationspflichten zwingend. Verstöße
    gegen diese Compliance-Richtlinien werden intern sanktioniert, um die Integrität
    unserer regionalen Verwurzelung und das Vertrauen der Bürger zu wahren.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 3247b2b9-09e5-5e94-bc11-6e76e9d61bcd
  title: 'Aufsichtsrechtliche Hinweise: Karten'
  body: 'Die Ausstellung und Verwaltung von Zahlungskarten durch die Sparkasse Lindenhain
    unterliegt den Bestimmungen des BGB sowie den allgemeinen Geschäftsbedingungen
    des Instituts. Wir verpflichten uns zu einer transparenten Kommunikation aller
    Kosten und Haftungsbedingungen.


    Im Falle eines Kartenverlusts oder Diebstahls steht die sofortige Schadensbegrenzung
    im Vordergrund. Kunden werden ausdrücklich darauf hingewiesen, ihre Karte unverzüglich
    über den Notruf 116 116 zu sperren. Diese sofortige Maßnahme ist entscheidend,
    um die Haftung des Kunden im Falle einer nicht autorisierten Nutzung auf maximal
    50 € zu begrenzen.


    Beschwerden im Zusammenhang mit Kartentransaktionen sowie Betrugsfälle werden
    fair und zeitnah gemäß den gesetzlichen Fristen des BGB bearbeitet. Die Sparkasse
    Lindenhain prüft jeden Fall individuell unter Berücksichtigung der vorliegenden
    Beweise und der Sicherheitsmerkmale der verwendeten Karte.


    Die Sicherheit der Transaktionen wird durch moderne Verfahren gewährleistet. Für
    Online-Zahlungen und sensitive Vertragsänderungen ist die starke Kundenauthentifizierung
    (SCA) zwingend erforderlich. Diese Maßnahme dient dem Schutz des Kunden vor unbefugten
    Zugriffen Dritter und entspricht den regulatorischen Anforderungen der EU-Zahlungsdiensterichtlinien.
    Mitarbeiter müssen sicherstellen, dass Kunden über die Notwendigkeit dieser Sicherheitsverfahren
    aufgeklärt werden und die korrekten Schritte zur Verifizierung kennen.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 8f2e6c8a-a8ac-59c5-946e-38d8890c8557
  title: 'Aufsichtsrechtliche Hinweise: Kredite und Baufinanzierung'
  body: 'Die Vergabe von Krediten und Baufinanzierungen erfolgt bei der Sparkasse
    Lindenhain auf Basis einer sorgfältigen und verantwortungsbewussten Kreditwürdigkeitsprüfung.
    Dies dient sowohl dem Schutz des Instituts als auch der Vermeidung einer finanziellen
    Überlastung unserer Kunden.


    Es ist strikt untersagt, eine verbindliche Kreditzusage ohne die finale Prüfung
    der erforderlichen Unterlagen und der Bonität zu garantieren. Jedes Angebot ist
    bis zum Abschluss der vollständigen Prüfung als unverbindlich zu betrachten. Wir
    bieten eine professionelle Produktberatung und allgemeine finanzielle Aufklärung
    an, um unseren Kunden eine fundierte Entscheidungshilfe zu geben.


    In diesem Zusammenhang gilt eine strikte Grenze unserer Beratungstätigkeit: Die
    Sparkasse Lindenhain erbringt keine individuelle Steuer- oder Rechtsberatung.
    Kunden werden bei Bedarf ausdrücklich darauf hingewiesen, für diese spezifischen
    Anliegen qualifizierte Steuerberater oder Rechtsanwälte zu konsultieren.


    Bei langfristigen Finanzierungen, wie der Sparkassen-Baufinanzierung, werden die
    Sollzinsbindungen transparent erläutert. Die Kunden werden über die Auswirkungen
    der gewählten Bindungsdauer auf die Gesamtkosten und die zukünftige Zinsentwicklung
    aufgeklärt. Alle Kreditverträge werden gemäß den Vorgaben des BGB und unter Beachtung
    der Aufklärungspflichten gegenüber Verbrauchern erstellt, um eine faire und rechtssichere
    Finanzierung des Eigenheims oder individueller Anschaffungen zu gewährleisten.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 65aa7395-4570-54ef-a49e-e88358745c88
  title: Wann get_account_transactions eingesetzt wird
  body: 'Das Werkzeug `get_account_transactions` wird eingesetzt, wenn ein Kunde Informationen
    über die Umsätze auf einem seiner Konten wünscht oder wenn eine spezifische Transaktion
    zur Klärung eines Sachverhalts (z. B. bei einer Reklamation oder einem Disput)
    identifiziert werden muss.


    Die Anwendung erfolgt nach folgendem Prozess:


    1.  **Identitätsprüfung**: Vor jedem Zugriff auf Kontodaten muss der Mitarbeiter
    die Identität des Kunden mithilfe des Werkzeugs `verify_identity` strikt prüfen.

    2.  **Kontenermittlung**: Falls dem Mitarbeiter nur Teile der Kontonummer (z.
    B. die letzten vier Ziffern) vorliegen, muss zunächst `get_accounts` aufgerufen
    werden, um die vollständige Kontonummer (account_id) des Kunden zu ermitteln.

    3.  **Transaktionsabruf**: Mit der vorliegenden Kontonummer wird das Werkzeug
    `get_account_transactions` aufgerufen. Der Mitarbeiter gibt dabei den gewünschten
    Zeitraum oder die spezifischen Parameter an, um die relevanten Umsätze abzurufen.

    4.  **Informationsweitergabe**: Die abgerufenen Daten werden dem Kunden in einer
    klaren und verständlichen Form kommuniziert. Fachbegriffe werden bei Bedarf erläutert.


    Dieses Werkzeug darf ausschließlich für den spezifischen Kunden verwendet werden,
    dessen Identität erfolgreich verifiziert wurde. Ein Zugriff auf Daten Dritter
    ist ohne entsprechende Kontovollmacht nicht zulässig.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: sparkasse_lindenhain
- id: 1ba7d33d-f4f7-53a0-8e48-771c19ec9844
  title: Werkzeugreferenz get_account_transactions
  body: 'Das Werkzeug `get_account_transactions` dient dem Abruf der Transaktionshistorie
    eines spezifischen Kontos.


    **Signatur:**

    `get_account_transactions(account_id: string, start_date: string, end_date: string)`


    **Argumente:**

    *   `account_id`: Die eindeutige Kennung des Kontos, die durch das Werkzeug `get_accounts`
    ermittelt wurde.

    *   `start_date`: Das Startdatum des gewünschten Zeitraums im Format YYYY-MM-DD.

    *   `end_date`: Das Enddatum des gewünschten Zeitraums im Format YYYY-MM-DD.


    **Effekt:**

    Das Werkzeug gibt eine Liste aller Transaktionen zurück, die innerhalb des angegebenen
    Zeitraums auf dem Konto mit der angegebenen `account_id` erfolgt sind. Der Agent
    führt diese Aktion direkt durch den Aufruf des Werkzeugs aus, um die Daten für
    den Kunden einzusehen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: sparkasse_lindenhain
- id: 1bc1676d-5ceb-534a-ba77-b3e0c868aa33
  title: Wann file_transaction_dispute eingesetzt wird
  body: 'Das Werkzeug `file_transaction_dispute` wird eingesetzt, wenn ein Kunde eine
    bestimmte Buchung auf seinem Konto beanstandet und einen offiziellen Reklamationsprozess
    einleiten möchte.


    Die Vorgehensweise ist wie folgt festgelegt:


    1.  **Identitätsprüfung**: Der Mitarbeiter führt eine strikte Identitätsprüfung
    des Kunden mittels `verify_identity` durch.

    2.  **Kontenidentifikation**: Über `get_accounts` wird die korrekte Kontonummer
    (`account_id`) ermittelt.

    3.  **Transaktionsidentifikation**: Der Mitarbeiter nutzt `get_account_transactions`,
    um die genaue Transaktion zu finden, die der Kunde beanstandet. Hierbei wird die
    spezifische Transaktions-ID ermittelt.

    4.  **Einleitung des Disputs**: Sobald die Transaktions-ID und die Kontonummer
    vorliegen, ruft der Mitarbeiter das Werkzeug `file_transaction_dispute` auf, um
    den Vorgang im System zu registrieren.

    5.  **Abschluss**: Der Kunde wird darüber informiert, dass die Beschwerde gemäß
    den gesetzlichen Fristen des BGB bearbeitet wird und er über den Fortschritt informiert
    wird.


    Der Mitarbeiter darf keinen Disput einleiten, ohne dass die entsprechende Transaktion
    zuvor im Konto des verifizierten Kunden identifiziert wurde.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: sparkasse_lindenhain
- id: d09b0293-8d97-510c-a69f-0615285fd968
  title: Werkzeugreferenz file_transaction_dispute
  body: 'Das Werkzeug `file_transaction_dispute` dient der formalen Einleitung eines
    Widerspruchsverfahrens für eine spezifische Kontobuchung.


    **Signatur:**

    `file_transaction_dispute(account_id: string, transaction_id: string, reason:
    string)`


    **Argumente:**

    *   `account_id`: Die eindeutige Kennung des betroffenen Kontos (aus `get_accounts`).

    *   `transaction_id`: Die eindeutige Kennung der beanstandeten Transaktion (aus
    `get_account_transactions`).

    *   `reason`: Die vom Kunden angegebene Begründung für den Widerspruch (z. B.
    "Betrag doppelt abgebucht" oder "nicht autorisierte Zahlung").


    **Effekt:**

    Das Werkzeug erstellt einen formalen Disput-Fall in den Systemen der Sparkasse
    Lindenhain. Der Agent führt diese Aktion direkt durch den Aufruf des Werkzeugs
    aus, wodurch der rechtliche Bearbeitungsprozess gemäß BGB gestartet wird.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: sparkasse_lindenhain
- id: 8d94518b-ef79-569d-905c-14c84b6bc977
  title: Wann freeze_card eingesetzt wird
  body: 'Das Werkzeug `freeze_card` wird eingesetzt, wenn eine Zahlungskarte aufgrund
    von Verlust, Diebstahl oder dem Verdacht auf missbräuchliche Nutzung sofort gesperrt
    werden muss, um weiteren finanziellen Schaden vom Kunden abzuwenden.


    Der Prozess erfolgt in diesen Schritten:


    1.  **Identitätsprüfung**: Der Mitarbeiter führt eine strikte Identitätsprüfung
    mittels `verify_identity` durch.

    2.  **Kartenermittlung**: Über `get_accounts` wird das Konto und die damit verknüpfte
    Karte identifiziert, die gesperrt werden soll.

    3.  **Sperrung ausführen**: Der Mitarbeiter ruft das Werkzeug `freeze_card` auf,
    um die Karte unmittelbar für alle weiteren Transaktionen zu deaktivieren.

    4.  **Zusätzliche Beratung**: Parallel zur systemseitigen Sperrung weist der Mitarbeiter
    den Kunden darauf hin, dass im Falle eines Diebstahls die Meldung über den Notruf
    116 116 zur vollständigen Absicherung und zur Begrenzung der Haftung auf maximal
    50 € unerlässlich ist.

    5.  **Nachfassung**: Der Mitarbeiter unterstützt den Kunden bei der Bestellung
    einer Ersatzkarte über das entsprechende Ersatzverfahren.


    Die sofortige Sperrung hat Priorität vor jeder weiteren administrativen Abklärung,
    um das Risiko für den Kunden zu minimieren.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: sparkasse_lindenhain
- id: 71470c09-ef59-52d7-8ae9-3791deaecaab
  title: Werkzeugreferenz freeze_card
  body: 'Das Werkzeug `freeze_card` wird verwendet, um eine Debit- oder Kreditkarte
    des Kunden sofort für weitere Transaktionen zu sperren. Diese Aktion ist insbesondere
    bei einem Verlust der Karte oder dem Verdacht auf Missbrauch kritisch, um den
    finanziellen Schaden zu begrenzen.


    Der Mitarbeiter führt diese Aktion direkt im System durch, indem er das Werkzeug
    aufruft. Es ist nicht erforderlich, den Kunden an ein Online-Portal oder eine
    App zu verweisen.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des Kontos, zu dem die Karte gehört (ermittelbar
    über `get_accounts`).

    - `card_id`: Die Kennung der zu sperrenden Karte.


    **Auswirkung:**

    Die Karte wird mit sofortiger Wirkung deaktiviert. Alle versuchten Zahlungen oder
    Abhebungen mit dieser Karte werden vom System abgelehnt. Diese Maßnahme dient
    als erste Sofortmaßnahme, bevor ggf. eine dauerhafte Sperrung oder eine Neuausstellung
    der Karte eingeleitet wird. In Verbindung mit dem Notruf 116 116 hilft dies dabei,
    die Haftung des Kunden gemäß unseren Richtlinien auf maximal 50 € zu begrenzen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: sparkasse_lindenhain
- id: c7fa8642-a9f0-5e38-9cfb-4b05e08ad908
  title: Wann change_overdraft_limit eingesetzt wird
  body: 'Die Anpassung des Dispositionskredits – also der mit einem Girokonto verbundenen
    Überziehungsmöglichkeit bis zu einem vereinbarten Rahmen – erfolgt auf Antrag
    des Kunden oder im Rahmen einer regelmäßigen Bonitätsprüfung durch die Sparkasse
    Lindenhain. Die Erhöhung des Rahmens ist stets an eine positive Kreditwürdigkeitsprüfung
    gebunden.


    **Verfahren zur Änderung des Dispositionsrahmens:**


    1. **Identitätsprüfung:** Bevor über Kontodaten gesprochen oder Änderungen vorgenommen
    werden, muss eine strikte Identitätsprüfung des Kunden erfolgen.

    2. **Kontodaten ermitteln:** Der Mitarbeiter verwendet das Werkzeug `get_accounts`,
    um die korrekte `account_id` des betroffenen Girokontos (z. B. eines Girokonto
    Komfort mit Sparkassen-Card) anhand der vom Kunden genannten letzten Ziffern der
    Kontonummer zu identifizieren.

    3. **Bedarfsanalyse und Prüfung:** Der Mitarbeiter klärt mit dem Kunden den gewünschten
    neuen Rahmen. Bei einer gewünschten Erhöhung erfolgt eine interne Prüfung der
    Kreditwürdigkeit. Der Kunde wird darauf hingewiesen, dass eine Kreditzusage niemals
    ohne finale Prüfung garantiert werden kann.

    4. **Durchführung der Änderung:** Sobald die Prüfung positiv beschieden wurde
    oder eine Senkung/Kündigung gewünscht ist, setzt der Mitarbeiter das Werkzeug
    `change_overdraft_limit` ein.

    5. **Bestätigung:** Der Kunde wird über die erfolgreiche Anpassung des Rahmens
    und die damit verbundenen Konditionen informiert.


    Dieses Verfahren stellt sicher, dass die regionale finanzielle Stabilität gewahrt
    bleibt und wir unserer sozialen Verantwortung gerecht werden, indem wir faire
    und nachhaltige Konditionen anbieten. Für detaillierte Informationen zu den Zinsen
    bei Überziehungen wird auf das Dokument Girokonto Komfort mit Sparkassen-Card
    — Dispozins: Erklärung verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: sparkasse_lindenhain
- id: d0d6517f-13d6-598d-94b3-c5a5840d61dd
  title: Werkzeugreferenz change_overdraft_limit
  body: 'Das Werkzeug `change_overdraft_limit` ermöglicht es dem Mitarbeiter, den
    eingeräumten Dispositionskredit für ein Girokonto des Kunden anzupassen oder vollständig
    zu kündigen.


    Der Mitarbeiter führt diese zustandsändernde Aktion direkt durch den Aufruf des
    Werkzeugs aus, nachdem die Identität des Kunden verifiziert und die Kreditwürdigkeit
    (bei Erhöhungen) geprüft wurde.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des Girokontos (aus `get_accounts`).

    - `new_limit`: Der neue Betrag des Dispositionsrahmens in Euro (z. B. 2.000,00
    €). Für die vollständige Kündigung des Rahmens wird der Wert 0 gesetzt.

    - `action`: Die Art der Änderung (z. B. ''erhöhen'', ''senken'' oder ''kündigen'').


    **Auswirkung:**

    Der verfügbare Überziehungsrahmen des Kontos wird in Echtzeit aktualisiert. Dies
    beeinflusst unmittelbar die verfügbaren Mittel des Kunden für tägliche Zahlungen.
    Die Änderung wird im System protokolliert und ist für den Kunden im Online-Banking
    einsehbar.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_overdraft_limit
  institution_id: sparkasse_lindenhain
- id: 191c354a-1653-5a24-91e3-a8e70423bce2
  title: Wann convert_to_protected_account eingesetzt wird
  body: 'Ein Pfändungsschutzkonto (P-Konto) ist ein Girokonto, das durch die Umwandlung
    den Grundfreibetrag vor Pfändungen schützt. Die Umwandlung eines bestehenden Kontos
    in ein P-Konto ist ein gesetzliches Recht des Kunden, um die Sicherstellung einer
    minimalen Existenzgrundlage zu gewährleisten.


    **Verfahren zur Umwandlung in ein Pfändungsschutzkonto:**


    1. **Identitätsprüfung:** Zunächst erfolgt eine strikte Identitätsprüfung des
    Kunden gemäß den Sicherheitsrichtlinien der Sparkasse Lindenhain.

    2. **Kontoidentifikation:** Der Mitarbeiter nutzt das Werkzeug `get_accounts`,
    um die `account_id` des Girokontos zu ermitteln, das in ein P-Konto umgewandelt
    werden soll.

    3. **Antragsaufnahme:** Der Kunde erklärt den Wunsch zur Umwandlung. Der Mitarbeiter
    weist den Kunden transparent darauf hin, dass die Umwandlung innerhalb von vier
    Geschäftstagen vollzogen wird.

    4. **Umsetzung:** Der Mitarbeiter löst die Umwandlung direkt über das Werkzeug
    `convert_to_protected_account` aus.

    5. **Abschluss:** Der Kunde wird über die Frist von vier Geschäftstagen und den
    Schutz des Grundfreibetrags informiert.


    Dieses Verfahren folgt strikt dem Zahlungskontengesetz und den Datenschutzrichtlinien,
    um eine faire und gesetzeskonforme Behandlung jedes Bürgers in unserer Region
    sicherzustellen. Weitere Erläuterungen zum Grundfreibetrag finden Sie in Girokonto
    Komfort mit Sparkassen-Card — monatlicher Grundfreibetrag auf dem Pfändungsschutzkonto:
    Erklärung.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - convert_to_protected_account
  institution_id: sparkasse_lindenhain
- id: ace8ff1d-d175-52e9-82d1-63bf9a0cda3e
  title: Werkzeugreferenz convert_to_protected_account
  body: 'Das Werkzeug `convert_to_protected_account` wird eingesetzt, um ein bestehendes
    Girokonto in ein Pfändungsschutzkonto (P-Konto) umzuwandeln.


    Der Mitarbeiter führt diesen Vorgang direkt im System aus. Eine manuelle Weiterleitung
    des Kunden an ein Formular oder eine Filiale ist nicht erforderlich, sofern die
    Identität bereits verifiziert wurde.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des zu umwandeltes Girokontos (ermittelbar
    über `get_accounts`).


    **Auswirkung:**

    Das System initiiert den Prozess der Kontoumwandlung. Gemäß den gesetzlichen Vorgaben
    und internen Prozessen der Sparkasse Lindenhain wird die Umwandlung innerhalb
    von vier Geschäftstagen abgeschlossen. Nach Abschluss ist das Konto als P-Konto
    gekennzeichnet, wodurch der gesetzliche Grundfreibetrag vor Pfändungszugriffen
    geschützt ist.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - convert_to_protected_account
  institution_id: sparkasse_lindenhain
- id: 64810bb4-6b0a-5cc8-8077-bc15ea9da61f
  title: Wann initiate_account_switch eingesetzt wird
  body: 'Die Kontowechselhilfe dient dazu, Kunden den Übergang zu einem Konto bei
    der Sparkasse Lindenhain so einfach wie möglich zu gestalten. Hierbei werden Daueraufträge,
    Lastschriften und Zahlungspartner vom bisherigen Konto des Kunden bei einem anderen
    Institut auf das neue Konto übertragen.


    **Verfahren zur Einleitung des Kontowechsels:**


    1. **Identitätsprüfung:** Vor jedem zustandsändernden Vorgang erfolgt die strikte
    Identitätsprüfung des Kunden.

    2. **Kontoidentifikation:** Der Mitarbeiter ermittelt mittels `get_accounts` die
    `account_id` des neuen Kontos bei unserer Sparkasse, auf welches die Mandate übertragen
    werden sollen.

    3. **Einholung der Informationen:** Der Mitarbeiter klärt mit dem Kunden, welche
    Mandate und Partner übertragen werden sollen und lässt sich die notwendigen Informationen
    zum Altkonto bestätigen.

    4. **Beauftragung der Hilfe:** Der Mitarbeiter setzt das Werkzeug `initiate_account_switch`
    ein, um den automatisierten Prozess der Kontowechselhilfe zu starten.

    5. **Informationsfluss:** Der Kunde wird darüber informiert, dass die Sparkasse
    Lindenhain nun die Kommunikation mit dem bisherigen Kreditinstitut übernimmt,
    um die Übertragung der Zahlungsverpflichtungen sicherzustellen.


    Durch diesen Service unterstreichen wir unser Ziel, allen Bürgern einen sicheren
    und unkomplizierten Zugang zu Finanzdienstleistungen zu ermöglichen. Für Informationen
    zum Abschluss eines neuen Kontos siehe Girokonto Komfort mit Sparkassen-Card —
    abschließen und aktivieren.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: sparkasse_lindenhain
- id: 90c28aaa-185a-5fa9-93f2-fbf0ce42ac8d
  title: Werkzeugreferenz initiate_account_switch
  body: 'Das Werkzeug `initiate_account_switch` wird verwendet, um die Kontowechselhilfe
    für einen Kunden zu beauftragen.


    Der Agent führt diesen Prozess direkt aus, indem er das Werkzeug aufruft. Es wird
    kein externer Link an den Kunden gesendet; die Sparkasse übernimmt die Koordination
    im Hintergrund.


    **Parameter:**

    - `account_id`: Die Kennung des Zielkontos bei der Sparkasse Lindenhain (aus `get_accounts`).


    **Auswirkung:**

    Das System startet den Prozess zur Übertragung von Daueraufträgen, Lastschriften
    und anderen Zahlungspartnern vom bisherigen Konto des Kunden zu uns. Dies beinhaltet
    die formale Benachrichtigung des alten Instituts und die Übermittlung der neuen
    Kontodaten an die jeweiligen Zahlungspartner, sofern vom Kunden gewünscht.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: sparkasse_lindenhain
- id: b5090499-943f-596d-962e-efde5a774e37
  title: Wann request_special_repayment eingesetzt wird
  body: 'Eine Sondertilgung ermöglicht es Kunden mit einer Sparkassen-Baufinanzierung,
    die Restschuld ihres Darlehens durch eine zusätzliche Zahlung schneller zu reduzieren,
    was die Zinslast senkt und die Laufzeit verkürzt.


    **Verfahren zur Beantragung einer Sondertilgung:**


    1. **Identitätsprüfung:** Eine strikte Identitätsprüfung des Kunden ist zwingende
    Voraussetzung.

    2. **Darlehen ermitteln:** Der Mitarbeiter nutzt `get_accounts`, um die `loan_id`
    der entsprechenden Baufinanzierung zu identifizieren.

    3. **Prüfung des Rahmens:** Der Mitarbeiter prüft im Vertrag, welcher Betrag im
    laufenden Jahr als Sondertilgung ohne Vorfälligkeitsentschädigung zulässig ist.
    Der Kunde wird über den vertraglich vereinbarten Rahmen aufgeklärt.

    4. **Durchführung der Zahlung:** Nach Festlegung des Betrags setzt der Mitarbeiter
    das Werkzeug `request_special_repayment` ein, um die Tilgung im vereinbarten Rahmen
    zu beauftragen.

    5. **Bestätigung:** Der Kunde erhält eine Bestätigung über die Verrechnung des
    Betrags mit der Darlehensschuld.


    Dieses Verfahren stellt sicher, dass Tilgungswünsche im Einklang mit den individuellen
    Vertragsbedingungen und den gesetzlichen Vorgaben des BGB bearbeitet werden. Details
    zur jährlichen Sondertilgung finden Sie in Sparkassen-Baufinanzierung — jährliche
    Sondertilgung: Erklärung.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_special_repayment
  institution_id: sparkasse_lindenhain
- id: f8a37983-7c5d-5181-88f6-dd33e1487e22
  title: Werkzeugreferenz request_special_repayment
  body: 'Das Werkzeug `request_special_repayment` dient der Beauftragung einer Sondertilgung
    auf eine bestehende Sparkassen-Baufinanzierung.


    Der Mitarbeiter löst die Sondertilgung direkt über dieses Werkzeug aus, nachdem
    die vertraglichen Möglichkeiten geprüft wurden. Eine Weiterleitung an ein Online-Formular
    entfällt.


    **Parameter:**

    - `loan_id`: Die eindeutige Kennung des Baufinanzierungsvertrags (aus `get_accounts`).

    - `amount`: Der Betrag der Sondertilgung in Euro (z. B. 5.000,00 €).


    **Auswirkung:**

    Der angegebene Betrag wird zur Reduzierung der Darlehensschuld verwendet. Dies
    führt zu einer Senkung der Restschuld und entsprechend geringeren Zinsaufwendungen
    in der Zukunft. Das System prüft dabei, ob der Betrag innerhalb des vertraglich
    vereinbarten jährlichen Rahmens liegt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - request_special_repayment
  institution_id: sparkasse_lindenhain
- id: 94be2dd0-b950-5d34-a075-65d41fee54c0
  title: Wann apply_loan eingesetzt wird
  body: "Der Sparkassen-Privatkredit bietet eine flexible Finanzierung für individuelle\
    \ Anschaffungen. Die Vergabe erfolgt auf Basis einer sorgfältigen Kreditwürdigkeitsprüfung,\
    \ um eine nachhaltige Finanzierung ohne Überforderung des Kunden zu gewährleisten.\n\
    \n**Verfahren zur Beantragung eines Privatkredits:**\n\n1. **Identitätsprüfung:**\
    \ Zuerst erfolgt eine strikte Identitätsprüfung des Kunden.\n2. **Bedarfsermittlung:**\
    \ Der Mitarbeiter klärt mit dem Kunden folgende Details:\n   - Gewünschter Kreditbetrag\
    \ in Euro.\n   - Gewünschte Laufzeit (in Monaten).\n   - Verwendungszweck der\
    \ Finanzierung.\n3. **Aufklärung:** Der Mitarbeiter informiert den Kunden über\
    \ den effektiven Jahreszins (die Gesamtkosten des Kredits pro Jahr, ausgedrückt\
    \ als Prozentsatz der Kreditsumme) und weist darauf hin, dass dies ein repräsentatives\
    \ Beispiel ist und die finalen Konditionen von der Prüfung abhängen.\n4. **Antragstellung:**\
    \ Der Mitarbeiter setzt das Werkzeug `apply_loan` ein, um den Antrag mit den genannten\
    \ Parametern im System zu erfassen.\n5. **Hinweis auf Prüfung:** Der Kunde wird\
    \ explizit darauf hingewiesen, dass das Tool lediglich den Antrag stellt. Eine\
    \ Kreditzusage erfolgt niemals ohne die finale, im Anschluss durchgeführte Kreditwürdigkeitsprüfung.\n\
    \nDieses Vorgehen garantiert eine gesetzeskonforme Behandlung gemäß BGB und den\
    \ Richtlinien der BaFin. Weitere Details zu den Kosten finden Sie in Sparkassen-Privatkredit\
    \ — effektiver Jahreszins im repräsentativen Beispiel: Erklärung."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: sparkasse_lindenhain
- id: b251137a-05b8-520f-914f-563aacf5a451
  title: Werkzeugreferenz apply_loan
  body: 'Das Werkzeug `apply_loan` wird vom Servicemitarbeiter direkt aufgerufen,
    um einen Antrag auf einen Sparkassen-Privatkredit für den Kunden zu stellen. Der
    Mitarbeiter führt diese Aktion im Dialog aus, nachdem die Identität des Kunden
    zweifelsfrei festgestellt wurde.


    **Parameter:**

    - **Betrag:** Die gewünschte Kreditsumme in Euro (€), die der Kunde leihen möchte.

    - **Laufzeit:** Der gewünschte Zeitraum für die Rückzahlung des Kredits (in Monaten).

    - **Verwendungszweck:** Die Angabe, wofür das Darlehen verwendet werden soll (z.
    B. Anschaffung eines Fahrzeugs oder Umschuldung).


    **Effekt:**

    Nach dem Aufruf des Werkzeugs wird der formale Kreditantrag in das System der
    Sparkasse Lindenhain eingesteuert. Es ist wichtig zu beachten, dass dieser Schritt
    noch keine Kreditzusage darstellt. Im Anschluss an den Antrag erfolgt eine sorgfältige
    Kreditwürdigkeitsprüfung durch unsere Fachabteilung. Erst nach positivem Abschluss
    dieser Prüfung kann eine finale Zusage und der Vertragsschluss erfolgen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: sparkasse_lindenhain
- id: 3667b2e9-7e6b-5028-be28-b99ef8af2201
  title: Wann update_beneficiary eingesetzt wird
  body: 'Die Verwaltung der Empfängerliste ist ein wesentlicher Bestandteil des täglichen
    Zahlungsverkehrs für Kunden des Girokonto Komfort mit Sparkassen-Card. Das Werkzeug
    `update_beneficiary` wird immer dann eingesetzt, wenn ein Kunde eine Person oder
    ein Unternehmen in seiner hinterlegten Empfängerliste anlegen, bestehende Daten
    korrigieren oder einen Empfänger dauerhaft löschen möchte. Dies dient der Vereinfachung
    künftiger Überweisungen und der Reduktion von Fehlern bei der manuellen Eingabe
    von IBANs.


    Um diesen Vorgang korrekt durchzuführen, muss der Mitarbeiter die folgenden Schritte
    strikt einhalten:


    1. **Identitätsprüfung:** Vor jeder Änderung an den Kontodaten muss eine strikte
    Identitätsprüfung des Kunden gemäß unseren Sicherheitsrichtlinien erfolgen.

    2. **Kontoverifizierung:** Der Mitarbeiter ruft das Werkzeug `get_accounts` auf,
    um die korrekte Konto-Identifikationsnummer (account_id) basierend auf den Kundeninformationen
    oder den letzten vier Stellen der Kontonummer zu ermitteln.

    3. **Anforderungsaufnahme:** Der Mitarbeiter klärt mit dem Kunden, welche Aktion
    konkret gewünscht ist (Hinzufügen, Ändern oder Löschen). Bei neuen oder geänderten
    Empfängern müssen der vollständige Name des Empfängers sowie die korrekte IBAN
    abgefragt werden.

    4. **Ausführung:** Der Mitarbeiter ruft das Werkzeug `update_beneficiary` mit
    der ermittelten account_id, der gewählten Aktion sowie den entsprechenden Empfängerdaten
    auf.

    5. **Bestätigung:** Dem Kunden wird die erfolgreiche Aktualisierung der Empfängerliste
    verbindlich bestätigt.


    Sollte der Kunde unsicher über die korrekte Schreibweise des Empfängers sein,
    wird er gebeten, die Daten anhand eines offiziellen Belegs zu prüfen, um Fehlzahlungen
    zu vermeiden. Für weitere Details zu den Kontofunktionen wird auf das Dokument
    Girokonto Komfort mit Sparkassen-Card — Überblick verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: sparkasse_lindenhain
- id: 15eac71c-6021-5b9c-83c4-87fad931c948
  title: Werkzeugreferenz update_beneficiary
  body: 'Das Werkzeug `update_beneficiary` ermöglicht es dem Mitarbeiter, die Liste
    der gespeicherten Zahlungsempfänger für das Girokonto eines Kunden zu verwalten.
    Die Aktion wird direkt durch den Mitarbeiter im System ausgeführt.


    **Parameter:**

    - **account_id:** Die eindeutige Kennung des betroffenen Girokontos, welche zuvor
    über `get_accounts` ermittelt wurde.

    - **Aktion:** Die Art der Änderung. Hierbei kann zwischen ''Hinzufügen'' (für
    neue Empfänger), ''Ändern'' (zur Korrektur bestehender Daten) oder ''Löschen''
    (zur Entfernung eines Empfängers) gewählt werden.

    - **Name:** Der vollständige Name des Zahlungsempfängers (nur bei ''Hinzufügen''
    oder ''Ändern'' erforderlich).

    - **IBAN:** Die internationale Kontonummer des Empfängers (nur bei ''Hinzufügen''
    oder ''Ändern'' erforderlich).


    **Effekt:**

    Die Empfängerliste des Kunden wird in Echtzeit aktualisiert. Dies ermöglicht es
    dem Kunden, bei künftigen Überweisungen den entsprechenden Empfänger einfach auszuwählen,
    ohne die Bankverbindung erneut manuell eingeben zu müssen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: sparkasse_lindenhain
- id: c15eec5b-5a42-54c8-a516-c23f0ead653b
  title: Wann stop_payment eingesetzt wird
  body: 'Das Werkzeug `stop_payment` dient der Steuerung und Rückabwicklung von Zahlungsaufträgen
    im SEPA-Verkehr. Es wird in drei spezifischen Szenarien eingesetzt: Erstens, wenn
    ein Kunde einer bereits erfolgten SEPA-Lastschrift widerspricht und diese zurückgeben
    möchte. Zweitens, wenn ein bestehendes Lastschriftmandat gegenüber einem Zahlungspartner
    widerrufen werden soll. Drittens, wenn ein bestehender Dauerauftrag gelöscht werden
    muss, um künftige automatische Zahlungen zu verhindern.


    Da diese Aktionen unmittelbare Auswirkungen auf den Kontostand und rechtliche
    Verpflichtungen gegenüber Dritten haben, ist folgendes Verfahren zwingend anzuwenden:


    1. **Identitätsprüfung:** Eine vollständige Identitätsprüfung des Kunden ist obligatorisch,
    bevor eine Zahlung gestoppt oder zurückgegeben wird.

    2. **Kontoermittlung:** Über den Aufruf von `get_accounts` stellt der Mitarbeiter
    sicher, dass die korrekte account_id für das betroffene Girokonto vorliegt.

    3. **Detailprüfung:** Der Mitarbeiter muss genau identifizieren, welcher Vorgang
    betrifft ist. Bei Lastschriften wird die entsprechende Transaktions-ID oder das
    Mandat geprüft; bei Daueraufträgen wird der spezifische Auftrag in der Liste identifiziert.

    4. **Beratung:** Der Mitarbeiter weist den Kunden sachlich darauf hin, dass die
    Rückgabe einer Lastschrift oder die Löschung eines Dauerauftrags zu Mahnungen
    oder Vertragsstrafen seitens des Zahlungspartners führen kann.

    5. **Ausführung:** Der Mitarbeiter führt den Vorgang durch den Aufruf des Werkzeugs
    `stop_payment` unter Angabe der account_id und der spezifischen Transaktions-
    oder Mandatsdetails durch.

    6. **Abschluss:** Der Mitarbeiter bestätigt die Ausführung des Stopp-Auftrags
    gegenüber dem Kunden.


    Bei Fragen zu den rechtlichen Rahmenbedingungen der Lastschriften wird auf das
    Dokument Girokonto Komfort mit Sparkassen-Card — rechtliche Hinweise verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: sparkasse_lindenhain
- id: cb1b25fd-df7a-5002-8c71-e9f998d3b35c
  title: Werkzeugreferenz stop_payment
  body: 'Das Werkzeug `stop_payment` wird vom Mitarbeiter genutzt, um Zahlungsströme
    auf einem Konto zu unterbrechen oder bereits durchgeführte Lastschriften rückgängig
    zu machen. Der Agent führt diese Aktion direkt aus.


    **Parameter:**

    - **account_id:** Die eindeutige Kennung des betroffenen Kontos.

    - **Zahlungsart:** Die Spezifikation des Vorgangs, z. B. ''SEPA-Lastschrift'',
    ''Lastschriftmandat'' oder ''Dauerauftrag''.

    - **Referenz-ID:** Die spezifische Identifikationsnummer der Transaktion, des
    Mandats oder des Dauerauftrags, die gestoppt oder gelöscht werden soll.


    **Effekt:**

    Je nach gewählter Zahlungsart bewirkt das Werkzeug entweder die Rückbuchung eines
    bereits abgebuchten Betrags auf das Konto des Kunden oder die sofortige Deaktivierung
    eines zukünftigen Zahlungsauftrags. Die Änderung wird unmittelbar im Kernbanksystem
    der Sparkasse Lindenhain wirksam.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: sparkasse_lindenhain
- id: e7869579-9df8-5bb3-9201-0cd1577cc9ca
  title: Wann pay_bill eingesetzt wird
  body: "Das Werkzeug `pay_bill` wird eingesetzt, wenn ein Kunde den Mitarbeiter bittet,\
    \ eine spezifische Rechnung unter Verwendung der auf dem Beleg angegebenen Zahlungsdaten\
    \ direkt über sein Girokonto zu begleichen. Dieser Service bietet Kunden eine\
    \ bequeme Möglichkeit, Überweisungen im Dialog mit dem Servicemitarbeiter durchzuführen,\
    \ ohne das Online-Banking selbst bedienen zu müssen.\n\nUm eine fehlerfreie Ausführung\
    \ der Zahlung zu gewährleisten, ist das folgende Verfahren einzuhalten:\n\n1.\
    \ **Sicherheitsprüfung:** Vor Beginn der Transaktion muss eine strikte Identitätsprüfung\
    \ des Kunden durchgeführt werden.\n2. **Kontoidentifikation:** Der Mitarbeiter\
    \ ermittelt mithilfe des Werkzeugs `get_accounts` die korrekte account_id des\
    \ Kundenkontos, von dem die Zahlung abgebucht werden soll.\n3. **Datenerfassung:**\
    \ Der Mitarbeiter fragt die notwendigen Details der Rechnung ab. Dazu gehören:\n\
    \    - Der genaue Betrag in Euro (€).\n    - Die IBAN des Rechnungsempfängers.\n\
    \    - Der Verwendungszweck (z. B. Rechnungsnummer oder Kundennummer), um eine\
    \ korrekte Zuordnung beim Empfänger zu ermöglichen.\n4. **Prüfung der Deckung:**\
    \ Der Mitarbeiter prüft im System, ob das Konto über ausreichende Mittel verfügt\
    \ oder ein entsprechender Dispositionskredit vorhanden ist.\n5. **Transaktionsausführung:**\
    \ Der Mitarbeiter ruft das Werkzeug `pay_bill` mit der account_id, dem Betrag,\
    \ der Empfänger-IBAN und dem Verwendungszweck auf.\n6. **Dokumentation:** Der\
    \ Mitarbeiter bestätigt dem Kunden den erfolgreichen Auftrag und gibt, falls gewünscht,\
    \ die Transaktionsreferenz an.\n\nFür eine Übersicht über die Kosten im Zusammenhang\
    \ mit Überweisungen wird auf das Dokument Entgelte und Kosten im Überblick verwiesen."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: sparkasse_lindenhain
- id: ced2ae61-1455-56d6-8970-15c041ad93a6
  title: Werkzeugreferenz pay_bill
  body: 'Das Werkzeug `pay_bill` wird vom Servicemitarbeiter verwendet, um eine einmalige
    Überweisung zur Begleichung einer Rechnung direkt aus dem Konto des Kunden zu
    initiieren. Der Agent führt diese Aktion im Namen des Kunden aus.


    **Parameter:**

    - **account_id:** Die eindeutige Kennung des Kontos, von dem die Gelder abgebucht
    werden.

    - **Betrag:** Die zu überweisende Summe in Euro (€).

    - **Empfänger-IBAN:** Die internationale Kontonummer des Rechnungsempfängers.

    - **Zahlungsdetails:** Der Text für den Verwendungszweck, wie er auf der Rechnung
    angegeben ist.


    **Effekt:**

    Das Werkzeug löst eine sofortige Überweisung aus dem angegebenen Konto an den
    Empfänger aus. Der Betrag wird in Echtzeit vom Konto des Kunden abgezogen und
    die Transaktion wird in den Kontoauszügen mit den angegebenen Zahlungsdetails
    vermerkt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: sparkasse_lindenhain
- id: d306f2a2-fe58-5fd7-b616-9c04eee766d7
  title: Wann manage_authorized_users eingesetzt wird
  body: 'Die Erteilung oder der Widerruf einer Kontovollmacht ist ein sensibler Vorgang,
    da er Dritten den Zugriff auf die finanziellen Mittel des Kunden ermöglicht. Das
    Werkzeug `manage_authorized_users` wird eingesetzt, um eine Person offiziell als
    bevollmächtigten Nutzer für ein Konto zu registrieren oder eine bestehende Vollmacht
    zu beenden.


    Aufgrund der hohen Sicherheitsrelevanz muss dieses Verfahren exakt wie folgt durchgeführt
    werden:


    1. **Strikte Identitätsprüfung:** Bevor über Vollmachten gesprochen wird, muss
    eine lückenlose Identitätsprüfung des Kontoinhabers erfolgen.

    2. **Kontoauswahl:** Mittels `get_accounts` identifiziert der Mitarbeiter die
    account_id des Kontos, für welches die Vollmacht gelten oder entzogen werden soll.

    3. **Festlegung der Aktion:** Der Mitarbeiter klärt, ob eine Vollmacht erteilt
    (''erteilen'') oder eine bestehende Vollmacht widerrufen (''widerrufen'') werden
    soll.

    4. **Erfassung der Personendaten:** Im Falle einer Erteilung müssen die vollständigen
    Daten der bevollmächtigten Person erhoben werden. Dies umfasst den vollständigen
    Namen, das Geburtsdatum sowie die aktuellen Kontaktdaten (Adresse, Telefon).

    5. **Ausführung:** Der Mitarbeiter ruft das Werkzeug `manage_authorized_users`
    mit der account_id, der gewünschten Aktion und den Personendaten des Bevollmächtigten
    auf.

    6. **Bestätigung:** Der Mitarbeiter bestätigt dem Kunden die Änderung des Berechtigungsstatus
    schriftlich oder im Dialog.


    Der Mitarbeiter muss den Kunden darauf hinweisen, dass eine Kontovollmacht eine
    weitreichende rechtliche Bindung darstellt. Für weitere Informationen zu den Sicherheitsaspekten
    wird auf das Dokument Girokonto Komfort mit Sparkassen-Card — Sicherheitstipps
    für Ihr Konto verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: sparkasse_lindenhain
- id: 7a7c1295-2eb6-5997-bdba-751cf4941bdc
  title: Werkzeugreferenz manage_authorized_users
  body: 'Das Werkzeug `manage_authorized_users` dient der Verwaltung von Kontovollmachten.
    Damit kann ein Mitarbeiter festlegen, welche Personen außer dem Kontoinhaber berechtigt
    sind, über das Konto zu verfügen. Der Agent führt diese Aktion direkt im System
    aus.


    **Parameter:**

    - **account_id:** Die eindeutige Kennung des betroffenen Kontos.

    - **Aktion:** Die gewünschte Änderung, entweder ''erteilen'' (um eine neue Vollmacht
    einzurichten) oder ''widerrufen'' (um eine bestehende Vollmacht zu löschen).

    - **Personendaten:** Die Details der bevollmächtigten Person, bestehend aus vollständigem
    Namen, Geburtsdatum und Kontaktdaten.


    **Effekt:**

    Das System aktualisiert die Berechtigungsmatrix des Kontos. Bei einer Erteilung
    erhält die genannte Person Zugriff auf die Kontofunktionen gemäß den bankinternen
    Vollmachtsrichtlinien. Bei einem Widerruf wird der Zugriff für die entsprechende
    Person mit sofortiger Wirkung gesperrt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: sparkasse_lindenhain
- id: 88214ec8-8736-5792-891f-10226bdb7453
  title: Wann get_accounts eingesetzt wird
  body: 'Das Werkzeug `get_accounts` ist die fundamentale Grundlage für nahezu jede
    kontobezogene Aktion innerhalb der Sparkasse Lindenhain. Da im Dialog mit dem
    Kunden oft nur allgemeine Informationen oder Teilangaben (wie die letzten vier
    Stellen einer Kontonummer) vorliegen, dient dieses Werkzeug dazu, die präzise
    systeminterne Konto-Identifikationsnummer (account_id) zu ermitteln, die für alle
    weiteren zustandsändernden Werkzeuge zwingend erforderlich ist.


    Der Einsatz von `get_accounts` erfolgt nach folgendem Standardprozess:


    1. **Identitätsprüfung:** Bevor Kontodaten abgerufen werden dürfen, muss eine
    strikte Identitätsprüfung des Kunden gemäß den geltenden Sicherheits- und Datenschutzrichtlinien
    abgeschlossen sein.

    2. **Abruf der Kontenliste:** Der Mitarbeiter ruft das Werkzeug `get_accounts`
    auf. Das System liefert daraufhin alle mit dem Kunden verknüpften Konten sowie
    deren jeweilige account_id und Produktbezeichnung (z. B. Girokonto Komfort mit
    Sparkassen-Card oder Sparkassenbuch).

    3. **Kundenabgleich:** Der Mitarbeiter gleicht die Liste mit den Angaben des Kunden
    ab. Falls der Kunde nur ein bestimmtes Konto meint (z. B. „mein Girokonto“), wählt
    der Mitarbeiter die entsprechende account_id aus der Liste aus.

    4. **Überleitung zum Zielprozess:** Sobald die korrekte account_id identifiziert
    wurde, kann der Mitarbeiter mit anderen Werkzeugen wie `pay_bill`, `stop_payment`
    oder `update_beneficiary` fortfahren.


    Es ist streng untersagt, Aktionen an Konten vorzunehmen, ohne zuvor die Identität
    geprüft und die account_id über `get_accounts` validiert zu haben. Dies gewährleistet
    die Einhaltung der Datenschutzrichtlinien und verhindert Fehlbuchungen auf falschen
    Konten.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: sparkasse_lindenhain
- id: 01e38b8d-1d23-5da8-b138-699b1d3a8de3
  title: Werkzeugreferenz get_accounts
  body: 'Das Werkzeug `get_accounts` dient dazu, eine vollständige Übersicht aller
    Konten und Finanzprodukte abzurufen, die auf den Namen des aktuell verifizierten
    Kunden bei der Sparkasse Lindenhain geführt werden. Der Agent führt diese Aktion
    direkt aus, indem er das Werkzeug aufruft, nachdem die Identität des Kunden zweifelsfrei
    festgestellt wurde.


    **Signatur und Parameter:**

    Das Werkzeug benötigt keine zusätzlichen Argumente vom Kunden, da die Abfrage
    automatisch auf Basis der bereits durchgeführten Identitätsprüfung des aktuellen
    Gesprächspartners erfolgt.


    **Effekt:**

    Das System gibt eine Liste aller aktiven und inaktiven Konten zurück. Diese Liste
    enthält essenzielle Informationen wie die Kontonummer (IBAN), die Produktbezeichnung
    (z. B. Girokonto Komfort mit Sparkassen-Card oder Sparkassenbuch) sowie den aktuellen
    Kontostatus. Diese Daten sind die notwendige Grundlage für fast alle weiteren
    zustandsändernden Aktionen, da sie die korrekte `account_id` liefern, welche für
    nachfolgende Werkzeuge zwingend erforderlich ist.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: sparkasse_lindenhain
- id: d4c1569d-b456-5798-bd87-c0983cdc55b4
  title: Wann open_account eingesetzt wird
  body: 'Die Eröffnung eines neuen Kontos ist ein zentraler Prozess der Sparkasse
    Lindenhain, um Bürgern einen sicheren Zugang zu Finanzdienstleistungen zu ermöglichen.
    Das Werkzeug `open_account` wird eingesetzt, wenn ein Kunde ein neues Produkt
    gemäß unserem regionalen Leistungsangebot abschließen möchte.


    **Verfahrensablauf:**


    1. **Identitätsprüfung:** Vor jeder Kontoeröffnung muss eine strikte Identitätsprüfung
    des Kunden erfolgen. Dies geschieht durch das Werkzeug `verify_identity` oder
    die entsprechende Vorlage im System.


    2. **Bedarfsanalyse und Produktwahl:** Der Agent berät den Kunden über die verfügbaren
    Produkte. Je nach Bedarf wird auf ein entsprechendes Produkt verwiesen, wie beispielsweise
    das Girokonto Komfort mit Sparkassen-Card für den täglichen Zahlungsverkehr oder
    das Sparkassenbuch für den langfristigen Vermögensaufbau.


    3. **Prüfung der Voraussetzungen:** Der Agent stellt sicher, dass der Kunde die
    notwendigen Voraussetzungen erfüllt. Hierzu werden die erforderlichen Unterlagen
    angefordert und geprüft.


    4. **Datenerhebung:** Der Agent erfasst alle für den Vertragsschluss notwendigen
    persönlichen Daten (vollständiger Name, aktuelle Meldeadresse, Geburtsdatum und
    steuerliche Identifikationsnummer).


    5. **Ausführung der Kontoeröffnung:** Nachdem alle Daten vorliegen und die Identität
    bestätigt wurde, führt der Agent die Eröffnung direkt im Gespräch durch, indem
    er das Werkzeug `open_account` aufruft.


    6. **Abschluss und Information:** Der Kunde wird über die nächsten Schritte informiert,
    wie etwa den Erhalt der Sparkassen-Card oder die Aktivierung des Online-Bankings.


    **Besondere Hinweise:**

    Gemäß unserer sozialen Verantwortung behandeln wir Anträge auf ein Basiskonto
    prioritär. In solchen Fällen sind die gesetzlichen Anforderungen an die Kontoeröffnung
    strikt einzuhalten, unabhängig von der bestehenden Kreditwürdigkeit des Kunden.
    Für detaillierte Informationen zum Standardkonto konsultieren Sie bitte das Dokument
    Girokonto Komfort mit Sparkassen-Card — Überblick.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: sparkasse_lindenhain
- id: f8a02d90-9a1b-5642-91b2-54237755970d
  title: Werkzeugreferenz open_account
  body: 'Das Werkzeug `open_account` ermöglicht es dem Agenten, die Eröffnung eines
    neuen Bankkontos direkt im System der Sparkasse Lindenhain zu initiieren. Die
    Aktion wird vom Agenten durch den direkten Aufruf des Werkzeugs durchgeführt;
    der Kunde muss nicht auf externe Formulare oder Filialbesuche verwiesen werden,
    sofern die Identitätsprüfung bereits erfolgt ist.


    **Signatur und Parameter:**

    Um ein Konto erfolgreich zu eröffnen, muss der Agent folgende Informationen übermitteln,
    die im Gespräch mit dem Kunden erhoben wurden:

    - `product_id`: Die eindeutige Kennung des gewünschten Produkts (z. B. `girokonto_komfort`
    für das Girokonto Komfort mit Sparkassen-Card oder `sparkassenbuch` für das Sparkassenbuch).

    - `full_name`: Der vollständige Name des Kunden in korrekter Schreibweise.

    - `date_of_birth`: Das Geburtsdatum des Kunden.

    - `address`: Die aktuelle Meldeadresse inklusive Postleitzahl und Ort.

    - `tax_id`: Die steuerliche Identifikationsnummer des Kunden.


    **Effekt:**

    Nach dem Aufruf wird das Konto im Kernsystem angelegt. Das Werkzeug gibt die neue
    Kontonummer (IBAN) sowie die Vertragsdetails zurück. Der Prozess ist erst abgeschlossen,
    wenn das System die Bestätigung der erfolgreichen Anlage übermittelt hat.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: sparkasse_lindenhain
- id: 798d187f-9163-574f-b8d3-a02dd34f4901
  title: Wann close_account eingesetzt wird
  body: 'Die Schließung eines Kontos ist ein irreversibler Vorgang, der eine sorgfältige
    Prüfung und eindeutige Kundenwillenserklärung erfordert. Das Werkzeug `close_account`
    wird verwendet, um ein bestehendes Kundenverhältnis für ein spezifisches Produkt
    zu beenden.


    **Verfahrensablauf:**


    1. **Identitätsprüfung:** Zunächst muss die Identität des Kunden zwingend und
    strikt überprüft werden, um unbefugte Kontoauflösungen zu verhindern.


    2. **Kontenidentifikation:** Der Agent ruft das Werkzeug `get_accounts` auf, um
    die Liste aller Konten des Kunden einzusehen und die exakte `account_id` des zu
    schließenden Kontos zu identifizieren.


    3. **Prüfung des Kontostands:** Der Agent prüft, ob das Konto ein Guthaben oder
    eine Verbindlichkeit aufweist. Bei einem Guthaben muss die Auszahlung auf ein
    anderes Referenzkonto vereinbart werden. Besteht eine Überziehung im Rahmen eines
    Dispositionskredits, muss diese zunächst ausgeglichen werden.


    4. **Klärung von Daueraufträgen und Lastschriften:** Der Kunde wird darauf hingewiesen,
    dass bestehende Daueraufträge und Lastschriften nach der Schließung nicht mehr
    ausgeführt werden können. Der Agent empfiehlt die Nutzung der Kontowechselhilfe,
    falls das Konto zu einem anderen Institut übertragen wird.


    5. **Bestätigung der Schließung:** Der Agent lässt sich die ausdrückliche Zustimmung
    zur endgültigen Schließung des Kontos vom Kunden bestätigen.


    6. **Ausführung:** Der Agent führt die Schließung durch, indem er das Werkzeug
    `close_account` mit der entsprechenden `account_id` aufruft.


    **Wichtiger Hinweis:**

    Da dieser Vorgang nicht rückgängig gemacht werden kann, ist die Dokumentation
    des Kundenwunschs im System zwingend erforderlich. Für Anleitungen zum Tarifwechsel
    oder zur Kündigung siehe auch Girokonto Komfort mit Sparkassen-Card — kündigen,
    schließen oder den Tarif wechseln.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: sparkasse_lindenhain
- id: 733599ae-ee82-5a6f-88f3-c64b4d50232c
  title: Werkzeugreferenz close_account
  body: 'Das Werkzeug `close_account` wird vom Agenten eingesetzt, um ein Konto bei
    der Sparkasse Lindenhain dauerhaft zu schließen. Dieser Vorgang ist irreversibel
    und führt zur sofortigen Beendigung der Zugriffsmöglichkeiten auf das entsprechende
    Konto.


    **Signatur und Parameter:**

    Das Werkzeug benötigt einen einzigen Parameter, der im Rahmen des Gesprächs durch
    den Aufruf von `get_accounts` ermittelt werden muss:

    - `account_id`: Die eindeutige interne Kennung des zu schließenden Kontos.


    **Effekt:**

    Nach dem Aufruf wird das Konto im System auf den Status ''geschlossen'' gesetzt.
    Alle damit verbundenen Dienste werden beendet. Das Werkzeug gibt eine Bestätigung
    über die erfolgreiche Schließung zurück sowie Informationen über etwaige Restbeträge,
    die auf ein Verrechnungskonto übertragen wurden. Der Agent muss dem Kunden mitteilen,
    dass das Konto ab diesem Zeitpunkt nicht mehr zur Verfügung steht.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: sparkasse_lindenhain
- id: c8af665f-1f76-5dc0-a870-1815274a04f5
  title: Wann update_contact_info eingesetzt wird
  body: 'Die Aktualisierung der Kundendaten ist essentiell für die korrekte Zustellung
    von Dokumenten und die Einhaltung regulatorischer Anforderungen. Das Werkzeug
    `update_contact_info` wird eingesetzt, wenn Kunden Änderungen an ihren persönlichen
    Kontaktdaten melden.


    **Verfahrensablauf:**


    1. **Identitätsprüfung:** Vor jeder Änderung zustandsrelevanter Daten erfolgt
    eine strikte Identitätsprüfung des Kunden, um Datenschutzrichtlinien zu gewährleisten.


    2. **Erfassung der Änderungen:** Der Agent fragt präzise ab, welche Daten aktualisiert
    werden sollen. Dies kann eine neue Wohnadresse, eine geänderte Telefonnummer oder
    eine neue E-Mail-Adresse sein.


    3. **Validierung der Daten:** Der Agent stellt sicher, dass die Angaben vollständig
    und in einem plausiblen Format vorliegen (z. B. korrekte Postleitzahl und vollständige
    E-Mail-Adresse).


    4. **Durchführung der Aktualisierung:** Der Agent aktualisiert die Daten im System,
    indem er das Werkzeug `update_contact_info` aufruft und die geänderten Felder
    übergibt.


    5. **Bestätigung:** Dem Kunden wird die erfolgreiche Änderung der Daten bestätigt.
    Bei einer Adressänderung wird der Kunde darauf hingewiesen, dass dies Auswirkungen
    auf die Zustellung von physischen Dokumenten, wie z. B. Kreditkarten oder Kontoauszüge,
    haben kann.


    **Besondere Hinweise:**

    Änderungen an den Kontaktdaten sind kostenfrei. Sollten die Änderungen im Zusammenhang
    mit einem Umzug in eine andere Region stehen, kann der Agent darauf hinwegiesen,
    dass unsere regionalen Filialen weiterhin als Ansprechpartner zur Verfügung stehen,
    um die lokale Verwurzelung der Sparkasse Lindenhain zu betonen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: sparkasse_lindenhain
- id: fafcf97a-dedc-5d3d-a113-359ed4895039
  title: Werkzeugreferenz update_contact_info
  body: 'Das Werkzeug `update_contact_info` erlaubt es dem Agenten, die im System
    hinterlegten Kontaktdaten eines verifizierten Kunden zu aktualisieren. Der Agent
    führt diese Aktion direkt durch, ohne dass der Kunde ein separates Formular einreichen
    muss.


    **Signatur und Parameter:**

    Das Werkzeug akzeptiert die folgenden optionalen Parameter. Es müssen nur die
    Felder übermittelt werden, die tatsächlich geändert werden sollen:

    - `full_name`: Der aktualisierte vollständige Name des Kunden.

    - `address`: Die neue Meldeadresse (Straße, Hausnummer, PLZ, Ort).

    - `phone_number`: Die neue Telefonnummer.

    - `email`: Die neue E-Mail-Adresse für die digitale Kommunikation.


    **Effekt:**

    Die übermittelten Informationen werden in der zentralen Kundendatenbank der Sparkasse
    Lindenhain überschrieben. Das Werkzeug gibt eine Bestätigung zurück, dass die
    Stammdaten erfolgreich aktualisiert wurden. Alle zukünftigen Korrespondenzen werden
    an die neuen Kontaktdaten adressiert.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: sparkasse_lindenhain
- id: 8b56e227-175c-516e-a757-2f57e68759fa
  title: Wann get_statements eingesetzt wird
  body: 'Die Bereitstellung von Kontoauszügen dient der Transparenz und ermöglicht
    den Kunden die Kontrolle über ihre Finanztransaktionen. Das Werkzeug `get_statements`
    wird eingesetzt, wenn Kunden eine Übersicht ihrer Kontobewegungen für einen bestimmten
    Zeitraum anfordern.


    **Verfahrensablauf:**


    1. **Identitätsprüfung:** Vor der Auskunft über Kontodaten oder dem Versand von
    Auszügen ist eine strikte Identitätsprüfung zwingend erforderlich.


    2. **Kontoidentifikation:** Da Kunden oft mehrere Produkte besitzen (z. B. Girokonto
    Komfort mit Sparkassen-Card und ein Sparkassenbuch), muss der Agent mithilfe von
    `get_accounts` die korrekte `account_id` für das gewünschte Konto ermitteln.


    3. **Zeitraumfestlegung:** Der Agent klärt mit dem Kunden, für welchen Zeitraum
    die Auszüge benötigt werden (Startdatum und Enddatum). Es ist zu prüfen, ob die
    gewünschten Daten innerhalb der gesetzlichen Aufbewahrungsfristen liegen.


    4. **Ausführung der Abfrage:** Der Agent ruft das Werkzeug `get_statements` mit
    der `account_id` und dem definierten Zeitraum auf.


    5. **Bereitstellung:** Je nach gewählter Option werden die Auszüge entweder digital
    über das Online-Banking bereitgestellt oder als Dokument generiert.


    **Besondere Hinweise:**

    Der Agent sollte den Kunden darauf hinweisen, dass aktuelle Umsätze oft bereits
    in Echtzeit über das Online-Banking einsehbar sind. Für eine detaillierte Einsicht
    in einzelne Transaktionen kann ergänzend das Werkzeug zur Transaktionsabfrage
    genutzt werden.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: sparkasse_lindenhain
- id: 4b3375cc-dae0-54c5-a1ee-40795ab0713d
  title: Werkzeugreferenz get_statements
  body: 'Das Werkzeug `get_statements` wird vom Agenten verwendet, um offizielle Kontoauszüge
    für ein spezifisches Konto des Kunden zu generieren. Der Agent führt diesen Vorgang
    direkt aus, um dem Kunden eine schnelle und präzise Information über seine Kontostände
    und Umsätze zu liefern.


    **Signatur und Parameter:**

    Um die gewünschten Auszüge abzurufen, benötigt das Werkzeug folgende Parameter:

    - `account_id`: Die eindeutige Kennung des Kontos, für welches die Auszüge angefordert
    werden (aus `get_accounts` zu beziehen).

    - `start_date`: Das Beginnungsdatum des gewünschten Zeitraums im Format JJJJ-MM-TT.

    - `end_date`: Das Enddatum des gewünschten Zeitraums im Format JJJJ-MM-TT.


    **Effekt:**

    Das System generiert die Kontoauszüge für den angegebenen Zeitraum. Das Werkzeug
    gibt die entsprechenden Dokumente oder einen Link zum Download im gesicherten
    Bereich des Online-Bankings zurück. Es wird eine Zusammenfassung der im Zeitraum
    erfolgten Gesamtein- und Auszahlungen sowie der Endsaldo zum `end_date` bereitgestellt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: sparkasse_lindenhain
- id: 1e968a64-0e8f-50e5-b84f-54bca50abd40
  title: Wann set_alerts eingesetzt wird
  body: "Benachrichtigungen (Alerts) helfen unseren Kunden, ihre Finanzen proaktiv\
    \ zu steuern und unbefugte Aktivitäten schneller zu erkennen. Das Werkzeug `set_alerts`\
    \ wird eingesetzt, um spezifische Trigger für Kontobewegungen oder Kontostände\
    \ zu konfigurieren.\n\n**Verfahrensablauf:**\n\n1. **Identitätsprüfung:** Vor\
    \ jeder Änderung an den Kontoeinstellungen erfolgt eine strikte Identitätsprüfung\
    \ des Kunden.\n\n2. **Kontoauswahl:** Der Agent identifiziert mithilfe von `get_accounts`\
    \ das Konto, für welches die Benachrichtigungen eingerichtet werden sollen (z.\
    \ B. das Girokonto Komfort mit Sparkassen-Card).\n\n3. **Definition des Triggers:**\
    \ Der Agent klärt mit dem Kunden, bei welchem Ereignis eine Benachrichtigung erfolgen\
    \ soll. Typische Beispiele sind:\n   - Ein Mindestkontostand (Warnung bei Unterschreiten\
    \ eines Betrags).\n   - Ein maximaler Betrag für einzelne ausgehende Transaktionen.\n\
    \   - Benachrichtigung bei jedem Geldeingang über einem bestimmten Wert.\n\n4.\
    \ **Festlegung des Kommunikationskanals:** Es wird vereinbart, wie der Kunde benachrichtigt\
    \ werden möchte (z. B. per E-Mail oder Push-Nachricht im Online-Banking).\n\n\
    5. **Durchführung:** Der Agent setzt die gewünschten Parameter durch den Aufruf\
    \ des Werkzeugs `set_alerts` im System um.\n\n6. **Bestätigung:** Dem Kunden wird\
    \ bestätigt, dass die Alarmierung nun aktiv ist und unter welchen Bedingungen\
    \ die Benachrichtigungen ausgelöst werden.\n\n**Besondere Hinweise:**\nDie Einrichtung\
    \ von Alerts ist ein kostenfreier Service der Sparkasse Lindenhain, um die Sicherheit\
    \ und Kontrolle der Kunden über ihre Konten zu erhöhen. Der Agent sollte darauf\
    \ hinweisen, dass Alerts eine ergänzende Sicherheitsmaßnahme darstellen und die\
    \ regelmäßige Kontrolle der Kontoauszüge nicht ersetzen."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: sparkasse_lindenhain
- id: 8943efe7-c4c4-5fa4-808a-9a774d3415c6
  title: Werkzeugreferenz set_alerts
  body: 'Das Werkzeug `set_alerts` wird vom Agenten direkt aufgerufen, um Benachrichtigungen
    für ein spezifisches Konto des Kunden zu konfigurieren. Der Agent führt diese
    Aktion im Dialog aus, nachdem die Identität des Kunden erfolgreich geprüft wurde.


    **Signatur und Parameter:**

    - `account_id`: Die eindeutige Kennung des Kontos. Diese wird durch den vorherigen
    Aufruf von `get_accounts` ermittelt.

    - `alert_type`: Die Art der Benachrichtigung (z. B. Kontostand-Schwellenwert,
    Zahlungseingang oder Lastschriften).

    - `threshold`: Ein numerischer Wert, der die Auslösung des Alarms definiert (z.
    B. Benachrichtigung, wenn der Kontostand unter einen bestimmten Betrag fällt).
    Dieser Wert wird vom Kunden im Gespräch angegeben.


    **Effekt:**

    Nach dem Aufruf wird die gewünschte Benachrichtigungsregel im System der Sparkasse
    Lindenhain hinterlegt. Der Kunde erhält fortan automatische Mitteilungen gemäß
    den definierten Kriterien über seine bevorzugten Kommunikationskanäle. Die Bestätigung
    über die erfolgreiche Einrichtung wird dem Kunden im Dialog mitgeteilt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: sparkasse_lindenhain
- id: 9afcba7b-b928-5389-8e97-292664dc0437
  title: Wann transfer_funds eingesetzt wird
  body: "Das Werkzeug `transfer_funds` dient der Durchführung von Geldtransfers von\
    \ einem Konto des Kunden an einen anderen Empfänger (intern oder extern). Es ist\
    \ das maßgebliche Instrument, um Überweisungen im Rahmen des Kundenservice direkt\
    \ in der Konversation abzuschließen.\n\n**Vorgehensweise für den Agenten:**\n\n\
    1. **Identitätsprüfung:** Bevor eine Transaktion eingeleitet wird, muss eine strikte\
    \ Identitätsprüfung des Kunden mittels `verify_identity` erfolgen, um die Sicherheit\
    \ des Vermögens zu gewährleisten.\n2. **Kontoidentifikation:** Der Agent ruft\
    \ `get_accounts` auf, um die korrekte `account_id` des Quellkontos (z. B. des\
    \ Girokonto Komfort mit Sparkassen-Card) basierend auf den Angaben des Kunden\
    \ zu ermitteln.\n3. **Datenerfassung:** Der Agent fragt die erforderlichen Details\
    \ für den Transfer ab:\n    - Die Ziel-IBAN des Empfängers.\n    - Den exakten\
    \ Betrag in Euro (€).\n    - Einen präzisen Verwendungszweck.\n4. **Ausführung:**\
    \ Der Agent ruft das Werkzeug `transfer_funds` mit den gesammelten Parametern\
    \ (`account_id`, Ziel-IBAN, Betrag, Verwendungszweck) auf.\n5. **Bestätigung:**\
    \ Der Agent informiert den Kunden über den erfolgreichen Abschluss der Transaktion\
    \ oder gibt im Falle eines Fehlers eine sachliche Rückmeldung.\n\n**Besondere\
    \ Hinweise:**\nSollte der Kunde die Details eines Empfängers ändern wollen, bevor\
    \ der Transfer erfolgt, ist das Werkzeug `update_beneficiary` zu verwenden. Falls\
    \ der Kunde Unterstützung beim Wechsel seines gesamten Kontos zu einem anderen\
    \ Institut wünscht, ist auf die entsprechende Kontowechselhilfe zu verweisen,\
    \ welche über `initiate_account_switch` beauftragt werden kann."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: sparkasse_lindenhain
- id: adcb9036-ee10-5108-a5db-0b62124afc22
  title: Werkzeugreferenz transfer_funds
  body: 'Das Werkzeug `transfer_funds` ermöglicht es dem Agenten, eine direkte Geldüberweisung
    von einem Konto des Kunden an eine angegebene IBAN zu initiieren. Der Agent führt
    diese Aktion durch den direkten Tool-Aufruf aus.


    **Signatur und Parameter:**

    - `account_id`: Die Kennung des Kontos, von dem die Gelder abgebucht werden. Diese
    wird durch das Tool `get_accounts` aufgelöst.

    - `to_iban`: Die vollständige IBAN des Empfängers, wie sie vom Kunden im Gespräch
    angegeben wurde.

    - `amount`: Der zu überweisende Betrag in Euro (€). Der Agent muss diesen Wert
    exakt vom Kunden erfragen.

    - `purpose`: Der Verwendungszweck der Zahlung, ebenfalls vom Kunden vorgegeben.


    **Effekt:**

    Das System bucht den angegebenen Betrag vom Konto des Kunden ab und schreibt ihn
    dem Empfängerkonto gut. Der Vorgang erfolgt gemäß den SEPA-Richtlinien. Der Agent
    erhält eine Bestätigung über die erfolgreiche Ausführung der Zahlung, welche er
    unmittelbar an den Kunden kommuniziert.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: sparkasse_lindenhain
- id: 2510001a-851b-56fc-88a2-99c1ab4dc357
  title: Wann order_replacement_card eingesetzt wird
  body: 'Das Werkzeug `order_replacement_card` wird eingesetzt, wenn ein Kunde eine
    Ersatzkarte für eine bestehende Karte beantragt, beispielsweise aufgrund von Verschleiß,
    Verlust oder Diebstahl.


    **Vorgehensweise für den Agenten:**


    1. **Sicherheitsprüfung:** Es erfolgt eine zwingende Identitätsprüfung mittels
    `verify_identity`.

    2. **Kartenstatus klären:** Falls die Karte verloren ging oder gestohlen wurde,
    muss der Agent prioritär die sofortige Sperrung der Karte veranlassen. Bei Kartenverlust
    steht die Sperrung über den Notruf 116 116 im Vordergrund, um die Haftung des
    Kunden auf maximal 50 € zu begrenzen. Alternativ kann im System das Tool `freeze_card`
    genutzt werden.

    3. **Konto- und Kartenermittlung:** Der Agent nutzt `get_accounts`, um die `account_id`
    zu finden. Anschließend wird geklärt, welches Kartenprodukt ersetzt werden soll
    (z. B. die Sparkassen-Card im Rahmen des Girokonto Komfort mit Sparkassen-Card
    oder die Sparkassen-Kreditkarte Gold).

    4. **Auftragserteilung:** Der Agent ruft `order_replacement_card` mit der entsprechenden
    `account_id` und dem spezifischen Kartentyp auf.

    5. **Abschluss:** Der Agent bestätigt dem Kunden die Bestellung und informiert
    ihn über die voraussichtliche Zustellung der neuen Karte per Post.


    **Hinweise zur Nachverfolgung:**

    Nach Erhalt der neuen Karte muss der Kunde diese aktivieren. Der Agent kann ihn
    in diesem Zusammenhang auf die notwendigen Schritte zur Aktivierung hinweisen,
    die später über das Tool `activate_card` unterstützt werden können.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: sparkasse_lindenhain
- id: cc916a73-4bab-5a58-8561-3b68d34280c1
  title: Werkzeugreferenz order_replacement_card
  body: 'Das Werkzeug `order_replacement_card` wird vom Agenten aufgerufen, um die
    Produktion und den Versand einer neuen physischen Karte für den Kunden zu veranlassen.
    Der Agent führt diesen Vorgang direkt aus.


    **Signatur und Parameter:**

    - `account_id`: Die Kennung des Kontos, mit dem die Karte verknüpft ist. Diese
    wird über `get_accounts` ermittelt.

    - `card_type`: Die Art der zu bestellenden Karte. Der Agent muss sicherstellen,
    dass der Typ mit dem Produkt des Kunden übereinstimmt (z. B. Sparkassen-Card oder
    Sparkassen-Kreditkarte Gold).


    **Effekt:**

    Das System löst den Druck- und Versandprozess für die Ersatzkarte aus. Die Karte
    wird an die im System hinterlegte Adresse des Kunden versandt. Der Agent erhält
    eine Bestätigung der Bestellung, die er dem Kunden mitteilt. Falls die Kontaktinformationen
    nicht aktuell sind, sollte vorab das Tool `update_contact_info` verwendet werden.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: sparkasse_lindenhain
- id: 4960ec11-e04b-59b7-9055-4c3a9df8fcfa
  title: Wann activate_card eingesetzt wird
  body: 'Das Werkzeug `activate_card` wird verwendet, um eine neu ausgestellte oder
    Ersatzkarte für die Nutzung freizuschalten. Dies ist ein notwendiger Sicherheitsschritt,
    bevor Zahlungen mit der physischen Karte getätigt werden können.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Zur Vermeidung von Missbrauch erfolgt eine strikte Identitätsprüfung
    mittels `verify_identity`.

    2. **Kontoidentifikation:** Der Agent ruft `get_accounts` auf, um die `account_id`
    des Kunden zu verifizieren und die zugehörigen Karten zu identifizieren.

    3. **Kartenidentifikation:** Der Agent fragt den Kunden nach der spezifischen
    Karte (z. B. die neue Sparkassen-Kreditkarte Gold), die aktiviert werden soll,
    und stellt die entsprechende `card_id` im System fest.

    4. **Aktivierung:** Der Agent ruft das Werkzeug `activate_card` mit der `account_id`
    und der `card_id` auf.

    5. **Bestätigung:** Der Agent informiert den Kunden über die erfolgreiche Aktivierung
    und weist darauf hin, dass die Karte nun für Zahlungen und am Automatennetz der
    Sparkasse Lindenhain einsatzbereit ist.


    **Sicherheitshinweis:**

    Die starke Kundenauthentifizierung ist bei sensiblen Vertragsänderungen und der
    ersten Nutzung von Online-Zahlungen zwingend erforderlich. Der Agent sollte den
    Kunden darauf hinweisen, dass die Aktivierung der physischen Karte nur den ersten
    Schritt darstellt.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: sparkasse_lindenhain
- id: 62e7024c-3d7c-5f50-bafd-93c26d78d2c7
  title: Werkzeugreferenz activate_card
  body: 'Das Werkzeug `activate_card` dient der Freischaltung einer Karte für den
    aktiven Zahlungsverkehr. Der Agent führt diese Aktion direkt im System aus.


    **Signatur und Parameter:**

    - `account_id`: Die Kennung des Kontos, zu dem die Karte gehört. Diese wird vom
    Agenten über `get_accounts` bezogen.

    - `card_id`: Die eindeutige Kennung der physischen Karte, die aktiviert werden
    soll. Diese wird aus den Kontoinformationen oder den Angaben des Kunden ermittelt.


    **Effekt:**

    Die Karte wird im System von einem Status „Inaktiv“ oder „Versandt“ auf „Aktiv“
    gesetzt. Damit sind alle mit der Karte verbundenen Zahlungsfunktionen (z. B. im
    Einzelhandel oder an Automaten) freigeschaltet. Der Agent erhält eine Bestätigung
    über die erfolgreiche Aktivierung, welche er dem Kunden mitteilt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: sparkasse_lindenhain
- id: 6858c24d-85ad-5dec-b610-fb907b905a14
  title: Wann dispute_status eingesetzt wird
  body: 'Das Werkzeug `dispute_status` wird eingesetzt, wenn ein Kunde Informationen
    über den aktuellen Bearbeitungsstand einer bereits eingereichten Reklamation oder
    eines Betrugsfalls zu einer bestimmten Transaktion wünscht.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Es erfolgt eine strikte Identitätsprüfung mittels `verify_identity`.

    2. **Kontoidentifikation:** Der Agent ruft `get_accounts` auf, um die `account_id`
    des betroffenen Kontos zu ermitteln.

    3. **Transaktionsidentifikation:** Falls der Kunde die spezifische Transaktions-ID
    nicht kennt, ruft der Agent `get_account_transactions` auf, um die entsprechende
    Buchung anhand des Datums und des Betrags in Euro (€) zu finden.

    4. **Statusabfrage:** Der Agent ruft das Werkzeug `dispute_status` mit der ermittelten
    `transaction_id` auf.

    5. **Kommunikation:** Der Agent teilt dem Kunden den aktuellen Status mit (z.
    B. „In Prüfung“, „Erledigt“ oder „Abgelehnt“) und erläutert bei Bedarf die nächsten
    Schritte.


    **Rechtlicher Rahmen:**

    Beschwerden und Betrugsfälle werden fair und zeitnah gemäß den gesetzlichen Fristen
    des BGB bearbeitet. Sollte der Kunde eine neue Reklamation einreichen wollen,
    ist das Werkzeug `file_transaction_dispute` zu verwenden.'
