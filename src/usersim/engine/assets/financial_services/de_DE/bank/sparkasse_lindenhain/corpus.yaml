  institution_id: sparkasse_lindenhain
- id: 337ded02-2445-5db1-86ce-c7a1116267ca
  title: Sparkassen-Privatkredit — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Kunden entscheiden sich oft zwischen dem Sparkassen-Privatkredit und unserer
    Baufinanzierung. Hier ist ein Vergleich der wesentlichen Unterschiede:


    Der Sparkassen-Privatkredit ist als flexible Finanzierung für individuelle Anschaffungen
    konzipiert. Er bietet eine schnelle Abwicklung für Beträge bis maximal 50.000
    €. Im repräsentativen Beispiel mit einem effektiven Jahreszins von 6,49 % und
    monatlichen Raten von 194,75 € ist er ideal für kurz- bis mittelfristige Investitionen
    (z. B. 60 Monate).


    Im Gegensatz dazu dient die Sparkassen-Baufinanzierung ausschließlich der langfristigen
    Finanzierung von Immobilien. Sie bietet wesentlich höhere Kreditsummen und andere
    Zinsstrukturen (Sollzinsbindungen), ist jedoch an eine dingliche Absicherung (Grundschuld)
    gebunden.


    Zusammenfassend gilt:

    - Wählen Sie den Sparkassen-Privatkredit für Konsumgüter, kleinere Anschaffungen
    oder flexible Zwischenfinanzierungen bis 50.000 €.

    - Wählen Sie die Sparkassen-Baufinanzierung, wenn Sie den Traum vom Eigenheim
    realisieren möchten und eine langfristige Absicherung suchen.


    Weitere Details finden Sie in der Sparkassen-Baufinanzierung — Überblick.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: f868defe-aa13-52b3-863f-84b24b476625
  title: Sparkassen-Privatkredit — rechtliche Hinweise
  body: 'Die Gewährung eines Sparkassen-Privatkredits durch die Sparkasse Lindenhain
    erfolgt unter strikter Einhaltung der gesetzlichen Vorgaben des Bürgerlichen Gesetzbuches
    (BGB) sowie der geltenden Aufsichtsrichtlinien der BaFin und der Deutschen Bundesbank.


    Es wird ausdrücklich darauf hingewiesen, dass jede Kreditzusage einer finalen
    Kreditwürdigkeitsprüfung unterliegt. Eine verbindliche Zusage kann nicht ohne
    die Prüfung der Bonität und der Einkommensverhältnisse garantiert werden. Dies
    dient dem Schutz des Kunden vor einer Überschuldung und entspricht unserer sozialen
    Verantwortung als regionales Institut.


    Die im repräsentativen Beispiel genannten Werte (10.000 € Kreditbetrag, 60 Monate
    Laufzeit, effektiver Jahreszins 6,49 %, monatliche Rate 194,75 € und Gesamtkosten
    1.685 €) stellen eine beispielhafte Kalkulation dar. Die tatsächlichen Konditionen
    weichen je nach individueller Bonität und gewähltem Kreditbetrag (bis maximal
    50.000 €) ab.


    Alle Prozesse zur Datenverarbeitung und Identitätsprüfung folgen den aktuellen
    Datenschutzrichtlinien. Vor jedem zustandsändernden Vorgang erfolgt eine strikte
    Identitätsprüfung des Kunden.


    Zudem weisen wir darauf hin, dass die gesetzliche Einlagensicherung Guthaben bis
    100.000 € schützt, was die Sicherheit Ihrer bei uns geführten Konten, über welche
    die Kreditraten abgewickelt werden, gewährleistet. Die Sparkasse Lindenhain erbringt
    im Rahmen dieser Produktberatung keine individuelle Steuer- oder Rechtsberatung.'
  domain: lending_mortgage
  product_category: privatkredit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: sparkasse_lindenhain
- id: 0f03df7f-c1cd-5472-9d45-ad12b4e272ae
  title: Sparkassen-Privatkredit — Zinsübersicht
  body: "Die Zinskonditionen für den Sparkassen-Privatkredit werden individuell auf\
    \ Basis Ihrer Bonität festgelegt. Zur Orientierung bieten wir Ihnen folgende repräsentative\
    \ Zinssätze an:\n\n- Repräsentativer effektiver Jahreszins: 6,49 %\n- Basis des\
    \ repräsentativen Beispiels: 10.000 € Kreditbetrag\n- Beispiellaufzeit: 60 Monate\n\
    \nDer effektive Jahreszins von 6,49 % gilt für das oben genannte Beispiel. Da\
    \ es sich um einen individuellen Privatkredit handelt, gibt es keine starre Zinstabelle;\
    \ der Zinssatz wird im Rahmen der Kreditwürdigkeitsprüfung für Ihren spezifischen\
    \ Fall ermittelt. Faktoren, welche die Zinsen beeinflussen, sind unter anderem\
    \ Ihre Einkommenshöhe, Ihr bestehendes Vermögen sowie Ihre bisherige Zahlungshistorie.\
    \ \n\nDie maximale Kreditsumme von 50.000 € kann mit unterschiedlichen Laufzeiten\
    \ kombiniert werden, was die monatliche Belastung und die Gesamtkosten beeinflusst."
