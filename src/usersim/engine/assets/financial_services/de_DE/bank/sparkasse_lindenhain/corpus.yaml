- id: 91be7e3e-a149-5b16-85a7-609450ebcef8
  title: Girokonto Komfort mit Sparkassen-Card — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem Girokonto Komfort mit Sparkassen-Card vornehmen
    möchten, etwa die Änderung Ihres Dispositionskreditrahmens, folgen Sie bitte diesem
    Prozess. Wir unterstützen Sie gerne dabei, Ihr Konto an Ihre aktuellen Lebensumstände
    anzupassen.


    Was Sie benötigen:

    Für eine Änderung des Kreditrahmens benötigen wir einen aktuellen Nachweis über
    Ihre Einkommensverhältnisse (z. B. die letzten drei Gehaltsabrechnungen).


    Schritt 1: Antrag auf Rahmenänderung

    Teilen Sie uns mit, auf welchen Betrag Sie Ihren Dispositionskredit erhöhen oder
    senken möchten. Sie können uns diesen Wunsch direkt in einer unserer Filialen,
    telefonisch oder über das gesicherte Postfach Ihres Online-Bankings mitteilen.


    Schritt 2: Kreditwürdigkeitsprüfung

    Wir führen eine sorgfältige Prüfung Ihrer aktuellen finanziellen Situation durch.
    Dies ist gesetzlich vorgeschrieben, um eine nachhaltige Finanzierung zu gewährleisten
    und Ihre Kreditwürdigkeit nicht zu gefährden.


    Schritt 3: Bestätigung der Konditionen

    Wir teilen Ihnen mit, ob der gewünschte Rahmen bewilligt wurde. In diesem Schritt
    bestätigen wir Ihnen erneut den geltenden Zinssatz für den Dispositionskredit
    in Höhe von 11,49 %. Bitte beachten Sie, dass bei einer Überschreitung dieses
    Rahmens der Zinssatz für geduldete Überziehungen von 14,49 % zur Anwendung kommt.


    Schritt 4: Umsetzung und Benachrichtigung

    Nach Ihrer Zustimmung setzen wir den neuen Rahmen in Ihrem Konto aktiv. Sie erhalten
    eine schriftliche Bestätigung über die Änderung Ihres Kreditlimits.


    Sollten Sie grundlegende Änderungen wie einen Tarifwechsel wünschen, finden Sie
    die entsprechenden Schritte im Dokument Girokonto Komfort mit Sparkassen-Card
    — kündigen, schließen oder den Tarif wechseln.'
