- id: 125602d0-8373-5a9e-9d3f-e5c807b32273
  title: 'Bausparvertrag Heimstatt Classic — Abschlussgebühr in Prozent der Bausparsumme:
    Erklärung'
  body: 'Frage: Warum wird bei meinem Bausparvertrag Heimstatt Classic eine Abschlussgebühr
    erhoben und wie hoch ist diese?


    Antwort: Die Abschlussgebühr beträgt 1,6 % der vereinbarten Bausparsumme. Diese
    Gebühr dient der Deckung des administrativen Aufwands, der mit der Einrichtung
    Ihres Vertrages und insbesondere mit der langfristigen Sicherung der Zinskonditionen
    verbunden ist. Da wir Ihnen bereits bei Vertragsabschluss die Zinsen für das spätere
    Darlehen fest zusagen, übernehmen wir ein Zinsrisiko, das durch diese einmalige
    Gebühr teilweise abgesichert wird.


    Frage: Gibt es Möglichkeiten, die Abschlussgebühr von 1,6 % zu reduzieren?


    Antwort: Wir verfolgen eine transparente Preispolitik. Im Rahmen spezieller Aktionsangebote
    oder bei besonders hohen Vertragsvolumina kann die Abschlussgebühr reduziert oder
    in Ausnahmefällen ganz erlassen werden. Bitte sprechen Sie uns auf aktuelle Möglichkeiten
    an.


    Weitere Details zu den Kosten finden Sie im Dokument Bausparvertrag Heimstatt
    Classic — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: faq
