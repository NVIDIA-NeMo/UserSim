- id: 52a0a514-44c7-5cb7-aee8-9e743abc7864
  title: Bausparvertrag Heimstatt Rendite — rechtliche Hinweise
  body: 'Die Bausparkasse Heimstatt agiert bei der Vermittlung und Verwaltung des
    Bausparvertrags Heimstatt Rendite strikt nach den regulatorischen Vorgaben der
    BaFin und der Deutschen Bundesbank sowie den Bestimmungen des BGB für Verbraucherdarlehen.
    Alle Konditionen werden transparent offengelegt.


    Die Abschlussgebühr in Höhe von 1 % der Bausparsumme wird erhoben, um den administrativen
    Aufwand zur langfristigen Zinssicherung zu decken. Die Verzinsung Ihres Guthabens
    erfolgt mit einem festen Zinssatz von 1,5 %, während das spätere Bauspardarlehen
    mit einem festen Zinssatz von 3,95 % verzinst wird. Bitte beachten Sie, dass wir
    umfassende Produktberatung und allgemeine finanzielle Bildung anbieten, jedoch
    keine individualisierte Steuer- oder Rechtsberatung erbringen. Für spezifische
    rechtliche oder steuerliche Details verweisen wir an zertifizierte Fachleute.


    Alle Einlagen unterliegen der gesetzlichen Einlagensicherung, wodurch Ihr Kapital
    gemäß den gesetzlichen Bestimmungen geschützt ist. Der effektive Jahreszins des
    Darlehens ergibt sich aus dem Nominalzins von 3,95 % unter Berücksichtigung der
    Vertragslaufzeit und der Abschlussgebühr; die präzisen Werte werden Ihnen im individuellen
    Vertragsangebot transparent ausgewiesen.


    Statusändernde Aktionen oder die Herausgabe von Kontoinformationen erfordern zwingend
    eine eindeutige Identitätsprüfung (z. B. durch Ausweisdokumente oder Zwei-Faktor-Authentifizierung),
    um die Sicherheit Ihrer Kundendaten gemäß unseren strikten Verifikationsprotokollen
    zu gewährleisten.


    Beschwerden im Zusammenhang mit diesem Produkt werden fair, transparent und unter
    Einhaltung gesetzlicher Fristen bearbeitet. Bei begründetem Verdacht auf Betrug
    erfolgt eine sofortige Sperrung der betroffenen Konten sowie eine Meldung an die
    zuständigen Aufsichtsbehörden.'
