- id: cf3a6bb5-de03-5d43-ab8a-4a71b02eaf14
  title: Bausparvertrag Heimstatt Rendite — Zinsübersicht
  body: 'Für den Bausparvertrag Heimstatt Rendite gelten die folgenden festen Zinssätze:


    - Guthabenzins: 1,5 % pro Jahr

    - Darlehenszins: 3,95 % pro Jahr


    Diese Zinssätze sind für die gesamte Laufzeit Ihres Vertrages festgeschrieben
    und bieten Ihnen somit eine maximale Planungssicherheit. Der Guthabenzins von
    1,5 % wird auf das vorhandene Sparguthaben angewendet und jährlich gutgeschrieben.
    Der Darlehenszins von 3,95 % gilt für den Betrag, den Sie nach Erreichen der Zuteilungsvoraussetzungen
    (Mindestsparguthaben von 50 % der Bausparsumme) in Anspruch nehmen.


    Es gibt keine gestaffelten Zinssätze; diese Werte gelten einheitlich für alle
    Vertragsvolumina dieses Produkts. Eine Änderung der Zinsen während der Laufzeit
    ist ausgeschlossen, sofern keine gesetzlichen Anpassungen zwingend erforderlich
    werden.'
