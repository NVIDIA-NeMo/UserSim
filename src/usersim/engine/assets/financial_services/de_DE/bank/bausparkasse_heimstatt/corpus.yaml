- id: 4478158a-c18a-5153-a59d-8ae99d492fc1
  title: Modernisierungsdarlehen ohne Grundschuld — Allgemeine Geschäftsbedingungen
  body: 'Die folgenden Bedingungen regeln die Inanspruchnahme des Modernisierungsdarlehens
    ohne Grundschuld der Bausparkasse Heimstatt. Diese Vereinbarung unterliegt den
    Bestimmungen des BGB für Verbraucherdarlehen sowie den regulatorischen Vorgaben
    der BaFin und der Deutschen Bundesbank.


    1. Kreditrahmen und Verwendungszweck

    Das Darlehen ist ausdrücklich für Modernisierungs- und Renovierungsmaßnahmen an
    einer selbstgenutzten oder vermieteten Immobilie vorgesehen. Der maximale Darlehensbetrag
    ist auf 50.000 € begrenzt. Eine Auszahlung erfolgt nach erfolgreicher Bonitätsprüfung
    und Identitätsverifizierung.


    2. Zinsen und Rückzahlung

    Die Verzinsung erfolgt zu einem festgesetzten Zinssatz, der für die gesamte Laufzeit
    des Vertrages gilt. Die Rückzahlung erfolgt in gleichbleibenden monatlichen Raten.
    Im repräsentativen Beispiel entspricht dies einer monatlichen Rate von 210,12
    € bei einer Laufzeit von 120 Monaten und einer Darlehenssumme von 20.000 €.


    3. Sonderregelungen zur Tilgung

    Gemäß unserer Philosophie zur Flexibilität ist eine Sondertilgung bei unseren
    Bauspardarlehen jederzeit kostenfrei möglich. Kunden können somit zusätzlich zu
    den regelmäßigen Raten außerplanmäßige Rückzahlungen leisten, was die Gesamtlaufzeit
    verkürzt und die Zinslast senkt.


    4. Verpflichtungen des Kreditnehmers

    Der Kunde verpflichtet sich, die Raten pünktlich zum vereinbarten Termin zu leisten.
    Bei Zahlungsverzug behalten wir uns vor, die entsprechenden gesetzlichen Verzugszinsen
    in Rechnung zu stellen. Zudem ist der Kunde verpflichtet, jede Änderung der persönlichen
    Verhältnisse, die die Kreditwürdigkeit wesentlich beeinflusst, mitzuteilen.


    5. Beendigung und Kündigung

    Das Darlehensverhältnis endet mit der vollständigen Rückzahlung des Kapitals nebst
    Zinsen. Eine vorzeitige Kündigung durch den Kunden ist durch die kostenfreie Sondertilgung
    (vollständige Ablösung) jederzeit möglich. Die Bank kann den Vertrag bei schwerwiegenden
    Vertragsverletzungen oder einer dauerhaften Verschlechterung der Bonität gemäß
    den gesetzlichen Fristen kündigen.


    6. Gebühren

    Abschlussgebühren dienen der Deckung des administrativen Aufwands zur langfristigen
    Zinssicherung und werden transparent im Preis- und Leistungsverzeichnis ausgewiesen.'
