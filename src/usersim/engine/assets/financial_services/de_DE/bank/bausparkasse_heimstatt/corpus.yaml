- id: 3e0ace35-1dea-5c94-864f-88f9ed9b29ef
  title: Bausparvertrag Heimstatt Classic — unerwartetes Entgelt oder unerwarteter
    Betrag
  body: 'Wenn ein Kunde eine Abbuchung oder einen Betrag in seinem Bausparvertrag
    Heimstatt Classic bemerkt, den er nicht zuordnen kann, gehen Sie bitte nach folgendem
    Schema vor:


    Symptom: Der Kunde berichtet über eine unerwartete Belastung auf seinem Konto
    oder eine Differenz im Guthaben.


    Mögliche Ursachen und Prüfschritte:


    1. Prüfung der Abschlussgebühr: Prüfen Sie, ob der Vertrag vor kurzem abgeschlossen
    wurde. Die Abschlussgebühr beträgt 1,6 % der Bausparsumme und wird oft zu Beginn
    der Vertragslaufzeit fällig. Wenn dies der Fall ist, erklären Sie dem Kunden,
    dass diese Gebühr der langfristigen Zinssicherung dient.


    2. Abgleich der monatlichen Sparrate: Kontrollieren Sie, ob die Abbuchung dem
    regelmäßigen monatlichen Sparbeitrag entspricht. Dieser liegt bei 0,4 % der Bausparsumme.
    Weicht der Betrag ab, prüfen Sie, ob Sonderzahlungen geleistet wurden oder ob
    eine Anpassung der Rate erfolgt ist.


    3. Überprüfung von Zinsgutschriften: Falls das Guthaben niedriger ist als erwartet,
    prüfen Sie, ob die Guthabenzinsen von 0,5 % bereits verbucht wurden oder ob steuerliche
    Abzüge erfolgt sind.


    4. Analyse von Darlehenszinsen: Falls der Vertrag bereits in der Darlehensphase
    ist, prüfen Sie, ob die Zinsen von 2,45 % korrekt berechnet und abgebucht wurden.


    Lösung und Eskalation:

    Wenn die Ursache durch die obigen Schritte nicht geklärt werden kann oder der
    Kunde eine Fehlbuchung beanstandet, leiten Sie den Fall hierarchisch über die
    Filialleitung an das Beschwerdemanagement weiter. Wir bearbeiten solche Fälle
    fair und transparent. Bei SEPA-Rückgaben beachten wir die gesetzliche Frist von
    acht Wochen. Der Kunde erhält eine schriftliche Mitteilung über den Ausgang der
    Prüfung.'
