- id: a3f7c07e-e25e-5f8b-a3c3-031231b34e86
  title: Modernisierungsdarlehen ohne Grundschuld — zwischen Tarifen wählen
  body: 'Wenn Sie überlegen, wie Sie Ihre Renovierungen finanzieren, stehen Sie oft
    vor der Wahl zwischen einem klassischen Modernisierungsdarlehen und unserem Modernisierungsdarlehen
    ohne Grundschuld.


    Vergleich der Kernmerkmale:


    - Modernisierungsdarlehen ohne Grundschuld: Dieses Produkt zeichnet sich durch
    eine schnelle, unbürokratische Abwicklung aus. Der wesentliche Vorteil ist der
    Verzicht auf eine Grundschueleintragung, was Zeit und Notarkosten spart. Es eignet
    sich ideal für kleinere Beträge bis zu 50.000 €. Ein repräsentativer effektiver
    Jahreszins liegt bei 4,9 %.


    - Klassische Baufinanzierung/Modernisierungskredit: Diese sind in der Regel für
    sehr hohe Summen gedacht und erfordern zwingend eine Grundschuld als Sicherheit.
    Während sie oft niedrigere Zinsen bieten können, ist der administrative Aufwand
    deutlich höher.


    Wer sollte was wählen?


    Das Modernisierungsdarlehen ohne Grundschuld ist die richtige Wahl für Familien
    und Eigenheimbesitzer, die eine schnelle Lösung für kleinere Renovierungen suchen
    und keinen langwierigen Grundbuchprozess durchlaufen möchten. Es bietet Planungssicherheit
    durch feste Zinsen und eine einfache Struktur, wie sie beispielsweise in einem
    repräsentativen Beispiel mit 20.000 € Kreditsumme und einer monatlichen Rate von
    210,12 € zu sehen ist.


    Für umfassende Informationen zur Kombination von Sparen und Bauen lesen Sie bitte
    Bausparvertrag Heimstatt Classic — Überblick.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: b444fd8d-7534-5bc2-b4e0-ca0156698d67
  title: Modernisierungsdarlehen ohne Grundschuld — Datenschutz und Datenverarbeitung
  body: 'Die Bausparkasse Heimstatt verpflichtet sich zur transparenten und rechtmäßigen
    Verarbeitung Ihrer personenbezogenen Daten im Zusammenhang mit dem Modernisierungsdarlehen
    ohne Grundschuld. Wir agieren hierbei strikt nach den regulatorischen Vorgaben
    der BaFin, der Deutschen Bundesbank sowie der Datenschutz-Grundverordnung (DSGVO).


    Zweck der Datenverarbeitung

    Die Erhebung Ihrer Daten ist notwendig, um den Kreditvertrag zu prüfen, die Bonität
    festzustellen und die Auszahlung des Darlehens (bis maximal 50.000 €) zu ermöglichen.
    Wir verarbeiten Ihre Daten zur Erfüllung unserer vertraglichen Verpflichtungen
    sowie zur Einhaltung gesetzlicher Meldepflichten gegenüber den Aufsichtsbehörden.


    Art der verarbeiteten Daten

    Wir erheben Identitätsdaten (ausgeprägt durch Ausweisdokumente), Einkommensnachweise,
    Kontodaten sowie Informationen über Ihre Immobilie. Diese Daten werden ausschließlich
    für den Zweck der Kreditprüfung und -verwaltung verwendet.


    Sicherheit der Verarbeitung

    Um die Sicherheit Ihrer Daten zu gewährleisten, wenden wir strikte Verifikationsprotokolle
    an. Vor jeder statusändernden Aktion oder der Herausgabe von Kontoinformationen
    ist eine eindeutige Identitätsprüfung (z. B. durch Zwei-Faktor-Authentifizierung)
    zwingend erforderlich. Die Datenübertragung innerhalb unseres digitalen Kundenportals
    erfolgt über verschlüsselte Verbindungen.


    Speicherung und Löschung

    Ihre Daten werden für die Dauer der Vertragslaufzeit (z. B. die im repräsentativen
    Beispiel genannten 120 Monate) und darüber hinaus für die gesetzlich vorgeschriebenen
    Aufbewahrungsfristen gespeichert. Nach Ablauf dieser Fristen werden die Daten
    anonymisiert oder gelöscht.


    Ihre Rechte

    Sie haben das Recht auf Auskunft über Ihre gespeicherten Daten, das Recht auf
    Berichtigung sowie das Recht auf Löschung, sofern keine gesetzlichen Aufbewahrungspflichten
    entgegenstehen.


    Für weitere rechtliche Details und Risikohinweise verweisen wir auf das Dokument
    Modernisierungsdarlehen ohne Grundschuld — rechtliche Hinweise.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: f2dc4687-c213-572e-ad6b-bdd31079632e
  title: Modernisierungsdarlehen ohne Grundschuld — Betrugsmaschen rund um dieses
    Produkt erkennen
  body: 'Die Bausparkasse Heimstatt legt höchsten Wert auf die Sicherheit Ihrer Finanzen.
    Da unser Modernisierungsdarlehen ohne Grundschuld aufgrund seiner unbürokratischen
    Abwicklung besonders attraktiv ist, wird es gelegentlich zum Ziel von betrügerischen
    Aktivitäten. Wir möchten Sie daher für gängige Maschen sensibilisieren.


    Ein häufiges Muster ist die Kontaktaufnahme durch Personen, die vorgeben, Vermittler
    der Bausparkasse Heimstatt zu sein. Diese versprechen oft Konditionen, die weit
    unter unserem repräsentativen effektiven Jahreszins von 4,9 % liegen, oder behaupten,
    eine Sofortzusage ohne Bonitätsprüfung garantieren zu können. Seien Sie skeptisch:
    Solche Angebote sind unseriös. Wir führen stets eine sorgfältige Prüfung durch,
    um eine nachhaltige Finanzierung zu gewährleisten.


    Ein weiterer kritischer Punkt ist das sogenannte Phishing. Betrüger könnten versuchen,
    über gefälschte E-Mails oder SMS Zugriff auf Ihre Zwei-Faktor-Authentifizierung
    oder Ihre Ausweisdokumente zu erhalten, mit dem Vorwand, den Darlehensantrag zu
    beschleunigen. Bitte beachten Sie: Die Bausparkasse Heimstatt wird Sie niemals
    dazu auffordern, Passwörter oder PINs per E-Mail oder über unsichere Kanäle zu
    übermitteln. Vor jeder statusändernden Aktion ist eine eindeutige Identitätsprüfung
    zwingend erforderlich, die entweder physisch in unseren regionalen Filialen oder
    über unsere gesicherten digitalen Protokolle erfolgt.


    Sollten Sie eine verdächtige Anfrage erhalten haben oder den Verdacht hegen, dass
    Ihre Daten kompromittiert wurden, ist schnelles Handeln entscheidend. Informieren
    Sie uns umgehend. Bei einem konkreten Betrugsverdacht werden wir die betroffenen
    Konten sofort sperren und die zuständigen Aufsichtsbehörden einschalten.


    Wir empfehlen Ihnen, bei Unklarheiten stets den direkten Weg über unsere offiziellen
    Kommunikationskanäle zu wählen. Für weitere allgemeine Sicherheitshinweise können
    Sie auch das Dokument Modernisierungsdarlehen ohne Grundschuld — Schutz vor Betrug
    und nicht autorisierten Vorgängen konsultieren.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: ce1137a4-0083-52fd-b69a-ed6570aff775
  title: Modernisierungsdarlehen ohne Grundschuld — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Kommunikation
    der produktionsspezifischen Grenzen des Modernisierungsdarlehens ohne Grundschuld.
    Es ist essenziell, dass diese Limits gegenüber dem Kunden präzise kommuniziert
    werden, um Erwartungshaltungen korrekt zu steuern.


    Die primäre Grenze dieses Produkts ist die maximale Darlehenssumme. Das Modernisierungsdarlehen
    ohne Grundschuld kann bis zu einem maximalen Darlehensbetrag von 50.000 € gewährt
    werden. Da dieses Produkt bewusst auf die Eintragung einer Grundschuld verzichtet,
    um die Abwicklung zu beschleunigen und Kosten zu senken, ist dieser Betrag strikt
    einzuhalten. Anträge, die diesen Betrag überschreiten, können nicht über dieses
    Produkt abgewickelt werden.


    Ein weiterer wichtiger Aspekt ist der Verwendungszweck. Das Darlehen ist explizit
    für Modernisierungsmaßnahmen an bestehenden Immobilien konzipiert. Es handelt
    sich nicht um eine Finanzierung für den Neubau oder den Erwerb eines Grundstücks.
    Sonderfälle, wie etwa rein konsumtive Ausgaben oder die Finanzierung von nicht
    immobilienbezogenen Investitionen, sind ausgeschlossen.


    In Bezug auf die Laufzeit orientiert sich das Produkt an einem Standardmodell,
    wie es im repräsentativen Beispiel mit einer Dauer von 120 Monaten dargestellt
    wird. Zwar sind individuelle Anpassungen möglich, doch muss die Bonität des Kunden
    die entsprechende Tilgungsrate tragen können.


    Falls ein Kunde eine Summe über 50.000 € benötigt oder eine langfristige Kombination
    aus Sparen und Bauen wünscht, ist ein Verweis auf unsere klassischen Bausparprodukte
    ratsam. In solchen Fällen sollte der Kunde auf Bausparvertrag Heimstatt Classic
    — Überblick hingewiesen werden, da dort höhere Summen durch die Zuteilung eines
    Bauspardarlehens realisiert werden können.


    Zusammenfassend: Maximalbetrag 50.000 €, Verwendungszweck Modernisierung, keine
    Grundschuld erforderlich.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: e0756d82-9222-5cf4-92c9-5399abd165b6
  title: 'Modernisierungsdarlehen ohne Grundschuld — Monatsrate im repräsentativen
    Beispiel: Erklärung'
  body: 'Hier finden Sie die Erläuterung zur monatlichen Belastung unseres Modernisierungsdarlehens.


    **Wie setzt sich die Monatsrate im repräsentativen Beispiel zusammen?**

    In unserem repräsentativen Beispiel beträgt die monatliche Rate 210,12 €. Dieser
    Wert basiert auf einem Darlehensbetrag von 20.000 €, der über eine Laufzeit von
    120 Monaten zurückgezahlt wird, bei einem effektiven Jahreszins von 4,9 %. Die
    Rate umfasst sowohl den Zinsanteil als auch die Tilgung des Kapitals.


    **Ist diese Rate für jeden Kunden identisch?**

    Nein. Die Rate von 210,12 € ist ein Beispiel zur Veranschaulichung. Ihre individuelle
    Rate hängt von der von Ihnen gewählten Darlehenssumme (bis maximal 50.000 €),
    der vereinbarten Laufzeit und den zum Zeitpunkt des Abschlusses geltenden Zinskonditionen
    ab. Wir erstellen Ihnen gerne eine präzise Berechnung basierend auf Ihren persönlichen
    Anforderungen.


    Für eine detaillierte Aufschlüsselung der Gesamtkosten beachten Sie bitte das
    Dokument Modernisierungsdarlehen ohne Grundschuld — Gesamtkosten im repräsentativen
    Beispiel: Erklärung.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: faq
