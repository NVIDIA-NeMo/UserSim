- id: 84e35845-da50-588d-a31b-f2832acef2f2
  title: Bausparvertrag Heimstatt Rendite — fehlgeschlagener oder ausstehender Vorgang
  body: 'Sollten Sie feststellen, dass Ihr Bausparvertrag Heimstatt Rendite trotz
    Antragstellung nicht aktiviert wurde oder ein Vorgang ausstehend ist, prüfen Sie
    bitte die folgenden Punkte:


    Symptom: Der Vertrag wird im Kundenportal nicht als ''aktiv'' angezeigt oder die
    erste Zinsgutschrift erfolgt nicht.


    Ursachen und Prüfschritte:

    1. Fehlende Identitätsprüfung: Wurde die Verifikation durch Ausweisdokumente oder
    die Zwei-Faktor-Authentifizierung erfolgreich abgeschlossen? Ohne eine eindeutige
    Identitätsprüfung ist eine Statusänderung des Kontos nicht möglich.

    2. Ausstehende Abschlussgebühr: Wurde die Abschlussgebühr in Höhe von 1 % der
    Bausparsumme bereits an uns überwiesen? Die Aktivierung des Vertrags setzt in
    der Regel die Zahlung dieser Gebühr oder die erste Sparrate voraus.

    3. Unvollständige Unterlagen: Liegen alle für die staatliche Förderung erforderlichen
    Nachweise vor?


    Lösung:

    - Falls die Identitätsprüfung noch nicht erfolgt ist, legen Sie uns bitte ein
    gültiges Dokument vor. Wir werden den Status Ihres Kontos umgehend aktualisieren.

    - Falls die Zahlung der Abschlussgebühr von 1 % fehlgeschlagen ist, prüfen Sie
    bitte Ihren Zahlungsvorgang oder übermitteln Sie uns einen Beleg der Überweisung.


    Eskalation:

    Sollten die oben genannten Punkte geklärt sein und der Vertrag dennoch nicht aktiv
    sein, werden wir den Vorgang intern an die zuständige Fachabteilung über die Filialleitung
    weiterleiten. Sie erhalten innerhalb von fünf Werktagen eine schriftliche Rückmeldung
    über den Fortschritt der Prüfung.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 191508c7-f153-561b-8602-e54ac47f4b23
  title: Bausparvertrag Heimstatt Rendite — Voraussetzungen
  body: 'Um die Leistungen des Bausparvertrags Heimstatt Rendite vollumfänglich nutzen
    zu können, müssen folgende Voraussetzungen erfüllt sein:


    | Bedingung | Erforderlicher Wert / Status | Ergebnis |

    | :--- | :--- | :--- |

    | Identitätsprüfung | Erfolgreich (Ausweis/2FA) | Vertragsabschluss möglich |

    | Monatliche Sparleistung | Mindestens 0,5 % der Bausparsumme | Erhaltung des
    Vertragsstatus |

    | Guthabensstand für Zuteilung | Mindestens 50 % der Bausparsumme | Beanspruchung
    des Darlehens möglich |

    | Abschlussgebühr | Zahlung von 1 % der Bausparsumme | Aktivierung des Vertrages
    |


    Kunden, die die monatliche Sparleistung von 0,5 % nicht einhalten können, werden
    von uns individuell beraten, um eine entsprechende Anpassung des Vertrages oder
