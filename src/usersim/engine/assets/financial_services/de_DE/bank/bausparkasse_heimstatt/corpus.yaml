- id: 3e5483f9-41d8-5627-af35-855b9716bae5
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Zinsübersicht
  body: 'In dieser Übersicht finden Sie die aktuellen Zuschusssätze für die staatlichen
    Förderungen bei der Bausparkasse Heimstatt. Diese Sätze sind gesetzlich fixiert
    und unabhängig vom gewählten Bauspartarif.


    Wohnungsbauprämie:

    - Zuschusssatz: 10 %

    - Anwendbar auf: Prämienbegünstigte Einzahlungen bis maximal 700 € (Alleinstehende)
    bzw. 1.400 € (Zusammenveranlagung).

    - Effekt: Bei einer Einzahlung von 700 € erhalten Sie einen staatlichen Zuschuss
    von 70 €.


    Arbeitnehmer-Sparzulage:

    - Zuschusssatz: 9 %

    - Anwendbar auf: Förderfähige Beiträge bis maximal 470 €.

    - Effekt: Bei einer maximalen Beitragsleistung von 470 € erhalten Sie einen staatlichen
    Zuschuss von 42,30 €.


    Diese Zuschüsse werden zusätzlich zu den vertraglich vereinbarten Guthabenzinsen
    Ihres Bausparvertrags gutgeschrieben. Änderungen an diesen Sätzen erfolgen ausschließlich
    durch gesetzliche Neuregelungen auf Bundesebene.'
