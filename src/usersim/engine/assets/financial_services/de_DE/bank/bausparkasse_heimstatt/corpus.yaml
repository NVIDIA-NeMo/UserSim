- id: b3dd1617-f144-558f-ac1c-56063c295002
  title: Modernisierungsdarlehen ohne Grundschuld — kündigen, schließen oder den Tarif
    wechseln
  body: 'Wenn Sie Ihr Modernisierungsdarlehen ohne Grundschuld vorzeitig beenden möchten
    oder eine Änderung Ihrer Finanzierungsstrategie planen, stehen Ihnen verschiedene
    Wege offen. Da wir eine transparente Preispolitik verfolgen, ist die vorzeitige
    Tilgung bei uns unkompliziert gestaltet.


    So kündigen oder schließen Sie Ihr Darlehen:


    1. Mitteilung des Wunsches: Teilen Sie uns mit, dass Sie das Darlehen vollständig
    zurückzahlen und den Vertrag schließen möchten. Hierzu benötigen Sie keine formelle
    Kündigungsfrist, da eine Sondertilgung jederzeit kostenfrei möglich ist.


    2. Einholung des Ablösebetrags: Wir berechnen Ihnen zum gewünschten Stichtag den
    exakten Restbetrag, der zur vollständigen Tilgung erforderlich ist. Dieser Betrag
    setzt sich aus der noch offenen Kapitalsumme und den bis zum Stichtag aufgelaufenen
    Zinsen zusammen.


    3. Durchführung der Zahlung: Sie leisten die Zahlung des Ablösebetrags auf das
    Ihnen zugewiesene Konto. Sobald der Betrag bei uns eingegangen ist, wird das Darlehenskonto
    automatisch geschlossen.


    4. Erhalt der Bestätigung: Wir senden Ihnen eine schriftliche Bestätigung über
    die vollständige Tilgung und die Schließung Ihres Kreditvertrags zu.


    Tarifwechsel:

    Da das Modernisierungsdarlehen ohne Grundschuld ein spezifisches Produkt mit fixen
    Konditionen ist, ist ein direkter ''Tarifwechsel'' innerhalb dieses Produkts nicht
    vorgesehen. Sollten Sie jedoch eine deutlich höhere Summe für umfangreichere Bauvorhaben
    benötigen, die den maximalen Rahmen von 50.000 € übersteigt, empfehlen wir eine
    Umstellung auf ein klassisches Bauspardarlehen.


    In diesem Fall würde ein neuer Vertrag abgeschlossen, und das bestehende Modernisierungsdarlehen
    würde durch die Auszahlung des neuen Darlehens abgelöst werden. Bitte sprechen
    Sie uns hierzu an, damit wir die optimale Lösung für Ihre private Vorsorge und
    Ihren Wohnungsbau planen können.


    Für weitere Details zur Vertragsstruktur lesen Sie bitte Modernisierungsdarlehen
    ohne Grundschuld — Allgemeine Geschäftsbedingungen.'
