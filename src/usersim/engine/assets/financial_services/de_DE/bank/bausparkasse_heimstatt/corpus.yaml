- id: b0ccef05-1581-5558-b083-3b85365ee956
  title: Bausparvertrag Heimstatt Rendite — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Eröffnung eines Bausparvertrags Heimstatt Rendite professionell zu begleiten.
    Das Ziel ist ein reibungsloser Onboarding-Prozess unter Einhaltung aller Compliance-Richtlinien.


    Schritt 1: Identitätsprüfung und Bedarfsanalyse

    Zunächst ist eine lückenlose Identitätsprüfung durchzuführen. Dies geschieht durch
    die Prüfung eines gültigen Personalausweises oder Reisepasses in der Filiale bzw.
    über ein zertifiziertes Zwei-Faktor-Verfahren im digitalen Portal. Parallel erfolgt
    die Beratung hinsichtlich der Sparziele und der optimalen Nutzung staatlicher
    Förderungen.


    Schritt 2: Festlegung der Bausparsumme

    Gemeinsam mit dem Kunden wird die Bausparsumme festgelegt. Diese Summe bildet
    die Basis für die Berechnung aller weiteren Werte. Erläutern Sie dem Kunden, dass
    der Bausparvertrag Heimstatt Rendite primär auf attraktive Guthabenzinsen ausgelegt
    ist.


    Schritt 3: Vereinbarung der Konditionen und Gebühren

    Informieren Sie den Kunden präzise über die folgenden Werte:

    - Guthabenzins: 1,5 %

    - Sollzins des Darlehens: 3,95 %

    - Abschlussgebühr: 1 % der Bausparsumme (fällig bei Abschluss)


    Schritt 4: Festlegung der Sparrate

    Um eine effiziente Bewertung des Vertrages zu erreichen, wird eine regelmäßige
    monatliche Sparrate vereinbart. Wir empfehlen hierfür einen Wert von 0,5 % der
    Bausparsumme.


    Schritt 5: Vertragsabschluss und Dokumentation

    Nachdem der Kunde den Vertrag unterzeichnet hat, wird die Abschlussgebühr von
    1 % in Rechnung gestellt. Der Kunde erhält eine transparente Offenlegung aller
    Konditionen, inklusive des effektiven Jahreszinses und des Hinweises zur gesetzlichen
    Einlagensicherung.


    Nach Abschluss wird der Vertrag in das System eingepflegt und der Kunde über die
    weiteren Schritte zur Einzahlung informiert. Bei Fragen zur langfristigen Strategie
    verweisen Sie bitte auf das Dokument Bausparvertrag Heimstatt Rendite — Überblick.'
