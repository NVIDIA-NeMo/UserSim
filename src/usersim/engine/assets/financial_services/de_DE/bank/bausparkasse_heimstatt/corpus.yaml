  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 851c530b-0dd6-5903-b304-9f67a93df60c
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — abgelehnter oder gesperrter
    Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf staatliche Förderung abgelehnt wurde
    oder ein Vorgang zur Gutschrift gesperrt ist. Hier finden Sie die häufigsten Ursachen
    und Lösungen.


    Symptom: Sie erhalten eine Mitteilung, dass die Wohnungsbauprämie oder die Arbeitnehmer-Sparzulage
    für einen bestimmten Zeitraum nicht gewährt werden konnte.


    Mögliche Ursachen und Prüfungsschritte:

    1. Einkommensgrenzen überschritten: Prüfen Sie, ob Ihr zu versteuerndes Einkommen
    die gesetzlichen Grenzen überschritten hat. Bei der Wohnungsbauprämie liegt diese
    für Alleinstehende bei 35.000 € und bei Zusammenveranlagung bei 70.000 €. Für
    die Arbeitnehmer-Sparzulage liegt sie bei 40.000 € (allein) bzw. 80.000 € (gemeinsam).

    2. Fehlende Unterlagen: Prüfen Sie, ob alle notwendigen Einkommensnachweise oder
    Steuerbescheide eingereicht wurden.

    3. Falsche Arbeitgeberdaten: Im Falle der Arbeitnehmer-Sparzulage kann ein Fehler
    in der Meldung des Arbeitgebers zur Sperrung führen.


    Lösung:

    - Falls eine Einkommensgrenze fälschlicherweise als überschritten markiert wurde,
    reichen Sie uns bitte den aktuellen Steuerbescheid ein. Wir prüfen den Vorgang
    daraufhin erneut.

    - Bei fehlenden Daten reichen Sie die entsprechenden Dokumente über das Kundenportal
    oder in der Filiale nach.


    Wenn die Ablehnung aufgrund einer tatsächlich überschrittenen Einkommensgrenze
    (z. B. Einkommen über 35.000 € für Alleinstehende) erfolgt ist, kann die Förderung
    für dieses Jahr nicht nachträglich aktiviert werden. In diesem Fall wird der Vorgang
    durch unsere Fachabteilung final geschlossen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: ad25363e-8ca1-573c-b630-2e0c2036c9ff
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — wann sich ein Wechsel oder
    Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Analyse, ob ein Kunde
    seine Sparstrategie anpassen sollte, um die staatlichen Förderungen optimal auszuschöpfen.


    Ein ''Upgrade'' der monatlichen Sparrate oder eine Erhöhung der Bausparsumme ist
    in folgenden Fällen empfehlenswert:


    - Unterausnutzung der Prämiengrenze: Wenn ein Kunde weniger als 700 € (Alleinstehende)
    bzw. 1.400 € (Zusammenveranlagung) pro Jahr spart, entgeht ihm ein Teil der 10
    % Wohnungsbauprämie. Eine Erhöhung der Rate auf diesen Maximalwert ist finanziell
    hochattraktiv, sofern die Einkommensgrenzen (35.000 € / 70.000 €) eingehalten
    werden.

    - Optimierung der Arbeitnehmer-Sparzulage: Wenn die jährlichen Beiträge unter
    470 € liegen, sollte geprüft werden, ob der Arbeitgeber höhere Beiträge ermöglicht,
    um die volle Zulage von 9 % zu erhalten (Einkommensgrenze: 40.000 € / 80.000 €).


    Vergleich der Strategien:

    - Niedrige Sparrate: Geringere Liquiditätsbelastung, aber Verlust von staatlichem
    Kapitalzuwachs.

    - Optimierte Sparrate (bis 700 €/1.400 €): Maximale Nutzung der 10 % Prämie, schnellere
    Erreichung der Zuteilung, höhere Gesamtkapitalbildung.


    Empfehlung: Kunden mit einem Einkommen unterhalb der genannten Grenzen sollten
    stets darauf hingewiesen werden, ihre Sparraten so zu wählen, dass die maximal
    begünstigten Beträge ausgeschöpft werden.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: b9d20d4e-5f6b-5666-aa44-193e579d904f
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Vergleich mit Alternativen
    und wann es nicht passt
  body: "Die staatliche Förderung durch die Wohnungsbauprämie und die Arbeitnehmer-Sparzulage\
    \ ist ein leistungsstarkes Instrument zur Eigenkapitalbildung, jedoch nicht für\
    \ jeden Sparer gleichermaßen geeignet.\n\nVergleich mit klassischen Sparformen:\n\
    Im Gegensatz zu einem herkömmlichen Sparkonto bietet die Kombination aus Bausparen\
    \ und staatlicher Förderung einen signifikanten Hebel durch direkte Zuschüsse:\
    \ \n- Die Wohnungsbauprämie gewährt einen Zuschuss von 10 % auf Sparleistungen\
    \ bis maximal 700 € (Alleinstehende) bzw. 1.400 € (Zusammenveranlagung).\n- Die\
    \ Arbeitnehmer-Sparzulage ergänzt dies um 9 % auf Beiträge bis maximal 470 €.\n\
    \nDiese Rendite durch staatliche Zulagen ist oft deutlich höher als die reinen\
    \ Guthabenzinsen eines Standard-Sparkontos.\n\nWann dieses Produkt nicht passt:\n\
    Die staatliche Förderung ist in folgenden Fällen weniger geeignet oder nicht verfügbar:\n\
    1. Hohes Einkommen: Wenn Ihr zu versteuerndes Einkommen dauerhaft über den Grenzen\
    \ von 35.000 € (allein) / 70.000 € (gemeinsam) für die Prämie bzw. 40.000 € (allein)\
    \ / 80.000 € (gemeinsam) für die Zulage liegt, entfallen die staatlichen Zuschüsse\
    \ komplett.\n2. Kurze Zeithorizonte: Bausparen ist auf langfristige Planung ausgelegt.\
    \ Wer maximale Flexibilität für kurzfristige Entnahmen benötigt, sollte Alternativen\
    \ prüfen, da Förderungen an die Zweckbindung des Wohnungsbaus geknüpft sind.\n\
    \nZusammenfassend eignet sich unser Modell ideal für Familien und zukünftige Eigenheimbesitzer,\
    \ die Planungssicherheit und staatliche Unterstützung suchen. Für Personen mit\
    \ sehr hohem Einkommen empfehlen wir unsere anderen Sparoptionen, die unabhängig\
    \ von staatlichen Einkommensgrenzen funktionieren."
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: f1eb1fbd-fa9b-51cc-8864-2bc27310c3d2
  title: 'Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Einkommensgrenze der Wohnungsbauprämie
    bei Zusammenveranlagung: Erklärung'
  body: 'Hier finden Sie Erläuterungen zur Einkommensgrenze der Wohnungsbauprämie
    für Ehepaare oder eingetragene Lebenspartnerschaften, die gemeinsam veranlagt
    werden.


    Frage: Wie hoch ist die Einkommensgrenze der Wohnungsbauprämie bei einer Zusammenveranlagung?

    Antwort: Bei Zusammenveranlagung liegt die Einkommensgrenze für den Anspruch auf
    die Wohnungsbauprämie bei insgesamt 70.000 €. Liegt das gemeinsame zu versteuernde
    Einkommen unter diesem Betrag, können Sie die staatliche Förderung in Anspruch
    nehmen.


    Frage: Wie hoch ist in diesem Fall die maximale Sparsumme, die gefördert wird?

    Antwort: Bei Zusammenveranlagung ist die maximal begünstigte Sparleistung mit
    1.400 € höher angesetzt als bei Alleinstehenden. Auf diesen Betrag erhalten Sie
    die Prämie von 10 %.


    Frage: Gilt für die Arbeitnehmer-Sparzulage die gleiche Grenze von 70.000 €?

    Antwort: Nein, die Arbeitnehmer-Sparzulage hat bei Zusammenveranlagung eine höhere
    Einkommensgrenze von 80.000 €. Bitte beachten Sie diese Unterscheidung bei Ihren
    Planungen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 74d3050d-ab1f-5e16-ac2f-8e09839fdc7d
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — ein typisches Anliegen vollständig
    erledigen
  body: 'In diesem Leitfaden zeigen wir Ihnen, wie Sie den Prozess zur Beantragung
    und Erhaltung der staatlichen Förderung für Ihr Bausparprodukt vollständig durchlaufen.


    Ziel: Die maximale Ausnutzung der 10 % Wohnungsbauprämie und der 9 % Arbeitnehmer-Sparzulage
    auf Ihrem Konto.


    1. Einreichung der Förderfähigkeit: Übermitteln Sie uns Ihre Steueridentifikationsnummer
    sowie einen aktuellen Einkommensnachweis oder den letzten Steuerbescheid. Dies
    ist notwendig, um zu prüfen, ob Sie unter den Grenzen von 35.000 € / 70.000 €
    (Prämie) bzw. 40.000 € / 80.000 € (Zulage) liegen.

    2. Festlegung der Sparrate: Passen Sie Ihre regelmäßigen Einzahlungen so an, dass
    Sie die maximal begünstigten Beträge erreichen (700 € für Alleinstehende bzw.
    1.400 € bei Zusammenveranlagung für die Prämie; bis zu 470 € für die Zulage).

    3. Überprüfung und Antragstellung: Wir prüfen Ihre Unterlagen. Wenn die Voraussetzungen
    erfüllt sind, stellen wir den Antrag auf Auszahlung der staatlichen Mittel.

    4. Gutschrift der Förderungen: Sobald die zuständigen Stellen die Prüfung abgeschlossen
    haben, schreiben wir die Prämien (10 %) und Zulagen (9 %) direkt Ihrem Bausparkonto
    gut.


    Sie wissen, dass das Anliegen vollständig erledigt ist, wenn die entsprechenden
    Beträge in Ihrem Kontoauszug als ''Wohnungsbauprämie'' oder ''Arbeitnehmer-Sparzulage''
    aufgeführt sind. Für Details zur Berechnung sehen Sie bitte in das Dokument Wohnungsbauprämie
    und Arbeitnehmer-Sparzulage — Überblick.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 62f37f5e-3f3e-5f8a-9a11-427ba6475cdd
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Klärung von Differenzen
    zwischen den vom Kunden erwarteten und den tatsächlich gutgeschriebenen Förderbeträgen.


    Symptom: Der Kunde gibt an, dass die gutgeschriebene Prämie niedriger ist als
    erwartet oder die Arbeitnehmer-Sparzulage gänzlich fehlt.


    Prüfschritte zur Fehlerbehebung:

    1. Prüfung der Sparleistung: Überprüfen Sie, wie viel der Kunde im betreffenden
    Jahr tatsächlich eingezahlt hat. Die 10 % Prämie wird nur auf maximal 700 € (Alleinstehende)
    bzw. 1.400 € (Zusammenveranlagung) berechnet. Einzahlungen über diese Beträge
    hinaus sind nicht prämienbegünstigt.

    2. Prüfung der Einkommensgrenzen: Kontrollieren Sie den hinterlegten Steuerbescheid.
    Wurde die Grenze von 35.000 € (Alleinstehende) oder 70.000 € (Zusammenveranlagung)
    überschritten? Wenn ja, ist die Ablehnung der Prämie korrekt.

    3. Prüfung der Zulage-Voraussetzungen: Bei fehlender Arbeitnehmer-Sparzulage (9
    %) prüfen Sie, ob das Einkommen über 40.000 € (Alleinstehende) bzw. 80.000 € (Zusammenveranlagung)
    lag oder ob der maximale Beitrag von 470 € nicht erreicht wurde.


    Lösung:

    - Wenn die Einzahlungen korrekt waren, aber ein technischer Fehler vorliegt, leiten
    wir den Fall an die Fachabteilung für Förderungen zur manuellen Korrektur weiter.

    - Wenn der Kunde die Grenzen überschritten hat, erklären Sie ihm freundlich die
    gesetzlichen Vorgaben der BaFin und des BGB.

    - Sollten Unterlagen fehlen, fordern Sie diese über den sicheren Kanal an, um
    eine Nachförderung zu prüfen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: c8fb582e-d56e-55b5-b5cf-ea6ac6767bf8
  title: Entgelte und Kosten im Überblick
  body: "Die Bausparkasse Heimstatt legt großen Wert auf eine transparente Preispolitik,\
    \ damit Sie Ihre Finanzplanung mit absoluter Sicherheit gestalten können. \n\n\
    Die bei uns anfallenden Entgelte setzen sich primär aus den produktbezogenen Abschlussgebühren\
    \ zusammen. Diese Gebühren dienen der Deckung des administrativen Aufwands, der\
    \ für die langfristige Sicherung Ihrer Zinsen erforderlich ist. \n\nBitte beachten\
    \ Sie folgende allgemeine Grundsätze zu unseren Kosten:\n- Die genauen Gebührensätze\
    \ variieren je nach gewähltem Produkt und Bausparsumme.\n- Im Rahmen spezieller\
    \ Aktionsangebote können Abschlussgebühren reduziert oder vollständig erlassen\
    \ werden.\n- Bei besonders hohen Vertragsvolumina prüfen wir individuell die Möglichkeit\
    \ einer Gebührenreduktion.\n\nDa die Kosten direkt an die spezifischen Vertragsbedingungen\
    \ geknüpft sind, entnehmen Sie die detaillierten Werte bitte dem jeweiligen Preis-\
    \ und Leistungsverzeichnis Ihres Produktes, wie beispielsweise im Dokument Bausparvertrag\
    \ Heimstatt Classic — Preis- und Leistungsverzeichnis."
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
