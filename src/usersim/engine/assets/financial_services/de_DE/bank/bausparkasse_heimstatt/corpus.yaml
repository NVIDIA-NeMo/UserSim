- id: f6947d89-4bd3-5c87-ad6c-a162c06535be
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Risikohinweise
  body: 'Die Inanspruchnahme staatlicher Förderungen ist an strikte gesetzliche Bedingungen
    geknüpft. Wir weisen Sie auf folgende Risiken und Verpflichtungen hin:


    1. Rückforderungsrisiko

    Die Wohnungsbauprämie und die Arbeitnehmer-Sparzulage sind zweckgebunden. Wenn
    das angesparte Guthaben nicht für den Erwerb oder Bau von selbstgenutztem Wohneigentum
    verwendet wird oder die gesetzlichen Sperrfristen nicht eingehalten werden, kann
    die zuständige Finanzbehörde die bereits gewährten Prämien zurückfordern. Dies
    betrifft insbesondere die auf die 10 % bzw. 9 % basierenden Zuschüsse.


    2. Einkommensgrenzen

    Ein Überschreiten der Einkommensgrenzen führt zum sofortigen Wegfall des Anspruchs
    für das betreffende Kalenderjahr. Die relevanten Grenzen liegen bei 35.000 € /
    70.000 € für die Wohnungsbauprämie und bei 40.000 € / 80.000 € für die Arbeitnehmer-Sparzulage.
    Eine falsche Angabe Ihrer Einkünfte kann steuerrechtliche Konsequenzen nach sich
    ziehen.


    3. Begrenzung der Förderfähigkeit

    Bitte beachten Sie, dass nur Einzahlungen bis zu einem Höchstbetrag von 700 €
    (Alleinstehende) / 1.400 € (Gemeinsam) bzw. 470 € (Sparzulage) prämienbegünstigt
    sind. Höhere Einzahlungen erhöhen zwar Ihr Gesamtkapital, generieren jedoch keine
    weiteren staatlichen Zulagen.


    4. Regulatorischer Rahmen

    Unsere Verwaltung erfolgt strikt nach den Vorgaben der BaFin und der Deutschen
    Bundesbank. Die endgültige Entscheidung über die Gewährung der Förderung obliegt
    jedoch ausschließlich den Finanzbehörden. Die Bausparkasse Heimstatt ist für die
    korrekte Übermittlung der Daten verantwortlich, übernimmt jedoch keine Garantie
    für die Bewilligung durch den Staat.


    Wir empfehlen Ihnen, bei spezifischen steuerrechtlichen Fragen einen zertifizierten
    Steuerberater zu konsultieren, da wir keine individualisierte Steuerberatung erbringen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: disclosure
