- id: c86941b9-4ba5-5d4a-9409-6bcf689220c7
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — wie Zinsen berechnet und
    angewendet werden
  body: 'Im Bereich der staatlichen Förderung handelt es sich nicht um variable Zinsen,
    sondern um feste gesetzliche Zuschüsse, die auf Ihre Einzahlungen gewährt werden.


    Wohnungsbauprämie:

    Es wird ein fester Fördersatz von 10 % auf die prämienbegünstigte Sparleistung
    angewendet. Dieser Prozentsatz wird auf die jährlichen Einzahlungen bis maximal
    700 € (Alleinstehende) bzw. 1.400 € (Gemeinsam) berechnet. Der Betrag wird nach
    Bewilligung durch die Finanzbehörde dem Vertrag gutgeschrieben.


    Arbeitnehmer-Sparzulage:

    Hier wird ein Fördersatz von 9 % auf die Beiträge angewendet, wobei die Förderung
    auf einen maximalen jährlichen Beitrag von 470 € begrenzt ist.


    Anwendung:

    Diese Zuschüsse werden als Kapitalzuwachs direkt Ihrem Sparguthaben hinzugefügt.
    Sie erhöhen damit die Basis, auf der im weiteren Verlauf des Bausparvertrags die
    regulären Guthabenzinsen berechnet werden. Im Gegensatz zu den variablen Marktzinsen
    sind diese staatlichen Sätze (10 % und 9 %) gesetzlich fixiert und unabhängig
    von der Marktlage.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: rate_sheet
