- id: 7f4e1ce0-691b-5e12-b70f-3c8c87165893
  title: Bausparvertrag Heimstatt Rendite — Betrugsmaschen rund um dieses Produkt
    erkennen
  body: 'Um Ihre Ersparnisse und Ihre Planungssicherheit zu schützen, informieren
    wir Sie über aktuelle Betrugsmuster, die gezielt Kunden ansprechen, die an einer
    renditeorientierten Vorsorge interessiert sind. Da der Bausparvertrag Heimstatt
    Rendite mit einem attraktiven Guthabenzins von 1,5 % lockt, versuchen Betrüger
    oft, dieses Interesse auszunutzen.


    Ein häufiges Muster ist das Angebot durch vermeintliche „unabhängige Vermittler“,
    die eine Garantie abgeben, die Zuteilung Ihres Vertrages durch illegale Manipulation
    der Bewertungszahl massiv zu beschleunigen oder den Guthabenzins von 1,5 % durch
    externe Zusatzverträge künstlich zu erhöhen. Seien Sie skeptisch, wenn Ihnen versprochen
    wird, dass die Abschlussgebühr von 1 % durch geheime Rabattaktionen vollständig
    erstattet wird, sofern Sie eine Vorauszahlung an eine Drittpartei leisten.


    Bitte beachten Sie: Die Bausparkasse Heimstatt wird Sie niemals dazu auffordern,
    Passwörter, PINs oder TANs per E-Mail oder Telefon preiszugeben. Wir fordern Sie
    niemals auf, Gelder auf Konten zu überweisen, die nicht offiziell auf den Namen
    der Bausparkasse Heimstatt lauten. Vor jeder statusändernden Aktion führen wir
    eine strikte Identitätsprüfung durch, beispielsweise mittels eines gültigen Ausweisdokuments
    oder einer Zwei-Faktor-Authentifizierung.


    Sollten Sie eine verdächtige Anfrage erhalten haben oder vermuten, dass Ihre Daten
    kompromittiert wurden, ist die sofortige Meldung an uns zwingend erforderlich.
    Im Verdachtsfall erfolgt eine sofortige Sperrung der betroffenen Konten, um weiteren
    Schaden abzuwenden, und eine entsprechende Meldung an die Aufsichtsbehörden.


    Für weitere allgemeine Sicherheitshinweise können Sie auch das Dokument Bausparvertrag
    Heimstatt Rendite — Sicherheitstipps für Ihr Konto konsultieren.'
