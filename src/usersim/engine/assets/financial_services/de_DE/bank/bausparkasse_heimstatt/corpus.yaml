- id: f2194341-5641-5c26-acd0-d03efb26b386
  title: Bausparvertrag Heimstatt Rendite — Risikohinweise
  body: 'Im Rahmen der transparenten Kommunikation der Bausparkasse Heimstatt weisen
    wir Sie auf folgende regulatorische und finanzielle Rahmenbedingungen des Bausparvertrags
    Heimstatt Rendite hin:


    **Zinsbindung und Flexibilität**

    Durch den Abschluss dieses Vertrages sichern Sie sich einen Guthabenzins von 1,5
    % sowie einen späteren Darlehenszins von 3,95 %. Diese Festschreibung bietet hohe
    Planungssicherheit, bedeutet jedoch auch, dass Sie nicht von einer eventuellen
    allgemeinen Zinssenkung am Markt profitieren können, falls diese unter die vereinbarten
    Werte fallen sollte.


    **Kosten und Gebühren**

    Bitte beachten Sie, dass die Abschlussgebühr von 1 % der Bausparsumme eine einmalige
    administrative Kostenpauschale ist, die nicht erstattungsfähig ist. Diese Gebühr
    ist für die langfristige Sicherung der Zinskonditionen essenziell.


    **Zuteilungsvoraussetzungen**

    Ein Anspruch auf das Bauspardarlehen entsteht erst, wenn die vertraglich vereinbarte
    Mindestsparguthaben-Grenze von 50 % der Bausparsumme erreicht wurde und der Vertrag
    die nötige Bewertung erreicht hat. Eine vorzeitige Inanspruchnahme ist nicht möglich.


    **Regulatorische Absicherung**

    Wir agieren strikt nach den regulatorischen Vorgaben der BaFin und der Deutschen
    Bundesbank sowie den Bestimmungen des BGB für Verbraucherdarlehen. Ihr Guthaben
    ist zudem durch die gesetzliche Einlagensicherung geschützt.


    Für weitere Details zu den rechtlichen Grundlagen verweisen wir auf das Dokument
    Bausparvertrag Heimstatt Rendite — rechtliche Hinweise.'
