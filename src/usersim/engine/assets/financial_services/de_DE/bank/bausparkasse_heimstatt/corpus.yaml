- id: efb607ca-a761-59b2-bbda-9968542b718e
  title: Bausparvertrag Heimstatt Classic — Probleme mit Zugang oder Login
  body: 'Wenn Sie Schwierigkeiten haben, auf Ihr digitales Kundenportal zuzugreifen,
    um Ihren Bausparvertrag Heimstatt Classic zu verwalten, finden Sie hier die gängigsten
    Lösungen.


    **Symptom: Fehlermeldung beim Login oder falsches Passwort**

    *Ursache:* Meist liegt ein Tippfehler vor oder das Passwort ist aufgrund von Sicherheitsrichtlinien
    abgelaufen.

    *Lösung:* Versuchen Sie, die Tastaturbelegung (z. B. Feststelltaste) zu prüfen.
    Falls der Zugriff weiterhin verweigert wird, fordern Sie über die Funktion „Passwort
    vergessen“ einen Reset-Link an. Dieser wird an Ihre hinterlegte E-Mail-Adresse
    gesendet.


    **Symptom: Zwei-Faktor-Authentifizierung (2FA) funktioniert nicht**

    *Ursache:* Der Sicherheitscode wurde nicht empfangen oder die hinterlegte Mobilfunknummer
    ist nicht mehr aktuell.

    *Lösung:* Prüfen Sie zunächst Ihr Netzwerk und starten Sie das Gerät ggf. neu.
    Wenn die hinterlegten Kontaktdaten veraltet sind, können wir den Zugang nicht
    einfach per Telefon freischalten, da dies gegen unsere Sicherheitsrichtlinien
    verstößt. In diesem Fall müssen Sie eine Identitätsprüfung durchführen (z. B.
    Vorlage des Ausweises in einer Filiale), damit wir Ihre Kontaktdaten sicher aktualisieren
    können.


    **Symptom: Konto ist gesperrt**

    *Ursache:* Nach mehreren Fehlversuchen beim Login wird das Konto zum Schutz Ihrer
    Daten automatisch gesperrt.

    *Lösung:* Eine Entsperrung erfolgt ausschließlich nach einer eindeutigen Identitätsprüfung.
    Bitte teilen Sie uns mit, dass Ihr Zugang gesperrt ist. Wir werden den Vorgang
    an unsere Fachabteilung für digitales Banking eskalieren. Sobald Ihre Identität
    zweifelsfrei festgestellt wurde, schalten wir den Zugang wieder frei und informieren
    Sie darüber per E-Mail oder SMS.


    Sollten diese Schritte nicht zum Erfolg führen, wird Ihr Anliegen intern an das
    Beschwerdemanagement oder die zuständige IT-Fachabteilung weitergeleitet, um eine
    technische Lösung zu finden. Wir bemühen uns, den Zugang innerhalb der regulären
    Geschäftszeiten schnellstmöglich wiederherzustellen.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: troubleshooting
  source_authority: official
