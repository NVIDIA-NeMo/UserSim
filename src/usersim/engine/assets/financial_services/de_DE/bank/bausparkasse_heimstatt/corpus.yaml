- id: c4cd8749-0f29-50c1-a00b-985ac5d73b11
  title: 'Bausparvertrag Heimstatt Classic — Guthabenzins: Erklärung'
  body: 'Frage: Wie funktioniert der Guthabenzins bei meinem Bausparvertrag Heimstatt
    Classic?


    Antwort: Der Guthabenzins ist die Verzinsung, die Sie auf Ihr eingezahltes Sparguthaben
    während der Sparphase erhalten. Beim Bausparvertrag Heimstatt Classic beträgt
    dieser Zinssatz 0,5 %. Dieser Zins wird auf Ihr Guthaben gutgeschrieben und erhöht
    so stetig Ihr Eigenkapital, bevor Sie in die Darlehensphase übergehen.


    Frage: Ist dieser Zinssatz variabel oder fest?


    Antwort: Der Guthabenzins von 0,5 % ist für die Dauer der Sparphase fest vereinbart,
    was Ihnen eine verlässliche Kalkulation Ihres Ansparmodells ermöglicht. Wir empfehlen
    Ihnen, in Kombination mit dem Dokument Bausparvertrag Heimstatt Classic — Zinsübersicht
    die genaue Zinsstruktur zu prüfen, um Ihre Finanzplanung optimal zu gestalten.'
