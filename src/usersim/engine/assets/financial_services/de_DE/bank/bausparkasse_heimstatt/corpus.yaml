- id: cdf892d6-2794-5981-90ed-6211068de0f2
  title: 'Bausparvertrag Heimstatt Classic — Sollzins des Bauspardarlehens: Erklärung'
  body: 'Hier finden Sie Antworten zur Verzinsung des Darlehensanteils in unserem
    Classic-Tarif.


    **Was genau ist der Sollzins bei meinem Bausparvertrag Heimstatt Classic?**

    Der Sollzins ist der Zinssatz, den Sie für das Darlehen zahlen, sobald Ihr Vertrag
    zuteilungsreif ist und Sie den Kredit beanspruchen. Im Bausparvertrag Heimstatt
    Classic beträgt dieser feste Zinssatz 2,45 %.


    **Warum ist dieser Zinssatz bereits jetzt festgelegt?**

    Das ist der Kernvorteil unseres Bausparens: Sie sichern sich heute die Darlehenskosten
    für die Zukunft. Unabhängig davon, wie sich der allgemeine Marktzins in den nächsten
    Jahren entwickelt, bleibt Ihr Zins von 2,45 % stabil. Dies bietet Ihnen maximale
    Planungssicherheit für Ihr Bauvorhaben.


    **Wann kann ich das Darlehen zu diesem Zinssatz in Anspruch nehmen?**

    Sobald Ihr Vertrag eine ausreichende Bewertung erreicht hat (die Zuteilung) und
    Sie die Mindestsparguthaben-Hürde von 40 % der Bausparsumme überschritten haben.
    Weitere Details finden Sie im Dokument Bausparvertrag Heimstatt Classic — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: faq
