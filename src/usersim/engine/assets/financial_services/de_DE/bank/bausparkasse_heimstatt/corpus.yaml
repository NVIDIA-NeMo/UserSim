- id: 6bfd354e-6bf2-5925-83d7-ae535a6df11e
  title: Modernisierungsdarlehen ohne Grundschuld — ein typisches Anliegen vollständig
    erledigen
  body: 'Wenn Sie Ihr Vorhaben einer Modernisierung schnell finanzieren möchten, führen
    wir Sie gerne durch den Prozess des Abschlusses eines Modernisierungsdarlehens
    ohne Grundschuld. So erledigen Sie Ihren Antrag vollständig:


    1. **Bedarfsfeststellung und Summe**: Teilen Sie uns den gewünschten Darlehensbetrag
    mit. Bitte beachten Sie, dass das Maximum für dieses Produkt bei 50.000 € liegt.
    Für ein Beispiel: Bei einem Betrag von 20.000 € würden wir die Konditionen basierend
    auf einer Laufzeit von 120 Monaten berechnen.


    2. **Einreichung der Unterlagen**: Übergeben Sie uns die erforderlichen Dokumente
    zur Bonitätsprüfung. Dazu gehören in der Regel aktuelle Einkommensnachweise und
    ein Nachweis über den Besitz der Immobilie, die modernisiert werden soll.


    3. **Identitätsprüfung**: Wir führen eine zwingende Identitätsprüfung durch. Dies
    erfolgt entweder durch die Vorlage eines gültigen Ausweisdokuments in einer unserer
    Filialen oder über ein gesichertes Zwei-Faktor-Authentifizierungsverfahren.


    4. **Konditionenprüfung**: Wir berechnen Ihnen die individuellen Konditionen.
    Im repräsentativen Beispiel entspricht dies einem effektiven Jahreszins von 4,9
    % und einer monatlichen Rate von 210,12 €.


    5. **Vertragsabschluss**: Nach erfolgreicher Prüfung erhalten Sie den Darlehensvertrag.
    Mit Ihrer Unterschrift wird der Vertrag aktiviert und die Summe wird zeitnah auf
    Ihr Konto ausgezahlt.


    6. **Abschlussbestätigung**: Sie erhalten eine schriftliche Bestätigung über den
    Auszahlungsbetrag und den Tilgungsplan, aus dem hervorgeht, wann welche Raten
    fällig werden.


    Nach Abschluss können Sie Ihren Vertrag jederzeit verwalten. Informationen dazu
    finden Sie im Dokument Modernisierungsdarlehen ohne Grundschuld — Status oder
    Verlauf einsehen.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: b6d9b051-c64b-5220-9d6b-7be4e09993d0
  title: Modernisierungsdarlehen ohne Grundschuld — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen Kunden eine Diskrepanz zwischen ihren persönlichen Unterlagen und den
    Systemdaten der Bausparkasse Heimstatt melden.


    **Symptom: Der Kunde gibt an, dass die Zinsen, die monatliche Rate oder die Restschuld
    nicht mit seinen Unterlagen übereinstimmen.**

    Beispiel: Ein Kunde erwartet eine Rate von 210,12 €, im System wird jedoch ein
    anderer Betrag ausgewiesen, obwohl die Parameter (20.000 € Summe, 120 Monate Laufzeit,
    4,9 % effektiver Jahreszins) identisch erscheinen.


    **Ursachenanalyse (Checkliste in dieser Reihenfolge)**:

    1. **Vertragsversion prüfen**: Liegt dem Kunden die aktuellste Version des Vertrags
    vor? Prüfen Sie, ob nachträgliche Änderungen oder Sondertilgungen vorgenommen
    wurden, die das System aktualisiert haben, die Unterlagen des Kunden jedoch nicht.


    2. **Sondertilgungen prüfen**: Da Sondertilgungen bei unseren Bauspardarlehen
    jederzeit kostenfrei möglich sind, könnte eine außerplanmäßige Zahlung die Restschuld
    und damit eventuell die Zinsberechnung beeinflusst haben.


    3. **Zinsanpassungen**: Prüfen Sie, ob es sich um ein Festzinsdarlehen handelt
    oder ob es spezifische Vereinbarungen gab, die zu einem anderen Zeitpunkt gegriffen
    haben.


    4. **Systemfehler**: Prüfen Sie, ob ein technischer Übertragungsfehler bei der
    Erfassung des Darlehensbetrags (max. 50.000 €) vorliegt.


    **Lösungsweg**:

    - **Bei Dokumentationsfehlern**: Wenn die Unterlagen des Kunden korrekt sind und
    das System einen Fehler aufweist, korrigieren Sie die Daten in Abstimmung mit
    der Fachabteilung und senden Sie dem Kunden eine aktualisierte Vertragsbestätigung
    zu.

    - **Bei Verständnisfehlern**: Erklären Sie dem Kunden detailliert, wie sich die
    Gesamtkosten (z. B. 5.214,40 € im repräsentativen Beispiel) zusammensetzen und
    wie Sondertilgungen die Laufzeit oder Rate beeinflussen.


    **Eskalation**:

    Sollte die Differenz nicht durch einfache Prüfungen klärbar sein, leiten Sie den
    Fall an die Filialleitung zur weiteren Prüfung durch das Beschwerdemanagement
    weiter.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: c09533a6-27d8-5c10-9b7e-236b7b777011
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Überblick
  body: 'Die Bausparkasse Heimstatt unterstützt Sie dabei, Ihr Eigenkapital durch
    die gezielte Nutzung staatlicher Förderungen effizient zu steigern. Unser Angebot
    zur staatlichen Förderung umfasst die Wohnungsbauprämie sowie die Arbeitnehmer-Sparzulage,
    um Ihnen maximale Planungssicherheit und eine attraktive Rendite für Ihren zukünftigen
    Wohnungsbau zu ermöglichen.


    Die Wohnungsbauprämie bietet einen staatlichen Zuschuss in Höhe von 10 % auf die
    prämienbegünstigten Spareinlagen. Um diese Förderung zu erhalten, gelten folgende
    Einkommensgrenzen: Für Alleinstehende liegt die Grenze bei 35.000 €, während sie
    bei Zusammenveranlagung 70.000 € beträgt. Die maximal förderfähigen Spareinlagen
    belaufen sich auf 700 € für Einzelpersonen und auf 1.400 € im Falle einer gemeinsamen
    Veranlagung.


    Zusätzlich können Sie die Arbeitnehmer-Sparzulage in Anspruch nehmen. Hierbei
    gewährt der Staat einen Zuschuss von 9 % auf die entsprechenden Sparbeiträge.
    Die maximale förderfähige Beitragsleistung ist auf 470 € begrenzt. Voraussetzung
    hierfür ist, dass das Einkommen die Grenze von 40.000 € für Alleinstehende bzw.
    80.000 € bei Zusammenveranlagung nicht überschreitet.


    Durch die Kombination dieser Instrumente optimieren Sie Ihre Sparphase und verkürzen
    den Weg zur Zuteilung Ihres Bauspardarlehens. Wir beraten Sie gerne in unseren
    regionalen Filialen, wie Sie diese staatlichen Mittel optimal in Ihre individuelle
    Finanzierungsstrategie integrieren können.


    Für weitere Details zu den verschiedenen Vertragsvarianten können Sie auch das
    Dokument Bausparvertrag Heimstatt Classic — Überblick einsehen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 8a4eb292-b01c-5ccf-a553-8722b8f9c4ee
  title: 'Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Wohnungsbauprämie: Erklärung'
  body: 'Hier finden Sie Antworten auf die häufigsten Fragen zur Wohnungsbauprämie
    im Rahmen Ihres Vertrages bei der Bausparkasse Heimstatt.


    Was genau ist die Wohnungsbauprämie und wie hoch ist sie?

    Die Wohnungsbauprämie ist ein staatlicher Zuschuss zur Förderung des privaten
    Wohnungsbaus. Sie beträgt 10 % der prämienbegünstigten Spareinlagen, sofern die
    gesetzlichen Voraussetzungen erfüllt sind.


    Wer ist berechtigt, diese Prämie zu erhalten?

    Berechtigt sind Personen, deren Einkommen innerhalb der gesetzlichen Grenzen liegt.
    Aktuell gilt eine Einkommensgrenze von 35.000 € für Alleinstehende und 70.000
    € bei Zusammenveranlagung.


    Gibt es eine Obergrenze für die Förderung?

    Ja, es gibt eine maximale prämienbegünstigte Sparleistung. Diese beträgt 700 €
    für Einzelpersonen und 1.400 € bei Zusammenveranlagung. Nur Beträge bis zu dieser
    Höhe werden mit den 10 % gefördert.


    Wo finde ich weitere Informationen zu den rechtlichen Rahmenbedingungen?

    Details entnehmen Sie bitte dem Dokument Wohnungsbauprämie und Arbeitnehmer-Sparzulage
    — rechtliche Hinweise.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 31b5634d-9ae6-5b4e-a973-e1b116b23555
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — abschließen und aktivieren
  body: 'Wenn Sie die staatlichen Förderungen in Ihren Sparplan integrieren möchten,
    führen wir Sie durch den Aktivierungsprozess. Bitte beachten Sie, dass die staatliche
    Förderung eine Ergänzung zu einem bestehenden oder neuen Bausparvertrag darstellt.


    Was Sie vorab benötigen:

    - Ein gültiges Ausweisdokument zur Identitätsprüfung.

    - Einen aktuellen Einkommensnachweis (z. B. die letzte Einkommensteuerbescheid).

    - Informationen zu Ihrem Arbeitgeber (im Falle der Arbeitnehmer-Sparzulage).


    Schritte zur Aktivierung:


    1. Identitätsprüfung: Überreichen Sie uns Ihr Ausweisdokument. Wir führen eine
    eindeutige Identitätsprüfung durch, um die Sicherheit Ihrer Daten zu gewährleisten.

    2. Einkommensprüfung: Nennen Sie uns Ihr aktuelles Jahreseinkommen oder übergeben
    Sie uns Ihren Steuerbescheid. Wir prüfen, ob Sie unter den Grenzen von 35.000
    € (allein) bzw. 70.000 € (gemeinsam) für die Wohnungsbauprämie oder 40.000 € (allein)
    bzw. 80.000 € (gemeinsam) für die Arbeitnehmer-Sparzulage liegen.

    3. Festlegung der Sparrate: Wir vereinbaren gemeinsam eine monatliche Sparrate,
    die so optimiert ist, dass Sie die maximalen Förderbeträge (bis zu 700 € bzw.
    1.400 € für die Prämie und 470 € für die Zulage) voll ausschöpfen.

    4. Unterzeichnung der Fördervereinbarung: Sie unterschreiben die entsprechenden
    Dokumente, mit denen wir Sie gegenüber den zuständigen Behörden als förderberechtigt
    anmelden.

    5. Bestätigung: Wir senden Ihnen eine schriftliche Bestätigung über die aktivierten
    Förderoptionen und die zu erwartenden jährlichen Zuschüsse zu.


    Sobald diese Schritte abgeschlossen sind, werden die staatlichen Zuschüsse in
    den gesetzlich vorgesehenen Zyklen auf Ihr Konto gutgeschrieben.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: d7d2f0b5-a7f0-5394-82be-e762d7488716
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Preis- und Leistungsverzeichnis
  body: 'Im Rahmen unserer transparenten Preispolitik führt die Bausparkasse Heimstatt
    für die Verwaltung und Beantragung der staatlichen Wohnungsbauprämie sowie der
    Arbeitnehmer-Sparzulage folgende Konditionen:


    - Beantragung und Abwicklung der staatlichen Förderung: Kostenfrei

    - Jährliche Prüfung der Förderberechtigung: Kostenfrei

    - Gutschrift der staatlichen Zuschüsse auf das Bausparkonto: Kostenfrei


    Bitte beachten Sie, dass diese kostenfreien Leistungen die reine Verwaltung der
    staatlichen Zuschüsse betreffen. Für den zugrunde liegenden Bausparvertrag fallen
    separate Gebühren an, wie beispielsweise die Abschlussgebühr zur langfristigen
    Zinssicherung. Einzelheiten hierzu entnehmen Sie bitte dem Preisverzeichnis Ihres
    gewählten Basistarifs, beispielsweise im Dokument Bausparvertrag Heimstatt Classic
    — Preis- und Leistungsverzeichnis.'
