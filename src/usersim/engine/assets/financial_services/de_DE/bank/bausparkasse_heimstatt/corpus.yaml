- id: 9da20613-92a0-5208-9a3e-672dbc1f311a
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — für wen und wofür geeignet
  body: 'Die staatliche Förderung durch die Wohnungsbauprämie und die Arbeitnehmer-Sparzulage
    ist das ideale Instrument für Familien und zukünftige Eigenheimbesitzer, die ihr
    Eigenkapital für den Wohnungsbau effizient und sicher aufbauen möchten. Durch
    die Kombination aus Eigenleistung und staatlichen Zuschüssen beschleunigen Sie
    den Weg zu Ihrem eigenen Heim erheblich.


    Für wen ist diese Förderung geeignet?

    Das Produkt richtet sich an Personen, die ein moderates Einkommen innerhalb der
    gesetzlichen Grenzen haben und eine langfristige Planungssicherheit suchen. Es
    ist besonders attraktiv für:

    - Junge Familien, die gemeinsam sparen und die höheren Einkommensgrenzen nutzen.

    - Alleinstehende, die gezielt für eine erste eigene Immobilie vorsorgen.

    - Arbeitnehmer, die über ihren Arbeitgeber in Vermögenswirksame Leistungen (VWL)
    investieren.


    Die konkreten Förderwerte im Überblick:

    - Wohnungsbauprämie: Sie erhalten einen staatlichen Zuschuss von 10 % auf Ihre
    prämienbegünstigten Einzahlungen. Dabei ist die maximale jährliche Sparsumme für
    Alleinstehende auf 700 € und für gemeinsam Sparer auf 1.400 € begrenzt. Um diese
    Förderung zu erhalten, darf das Einkommen 35.000 € (Alleinstehende) bzw. 70.000
    € (Zusammenveranlagung) nicht überschreiten.

    - Arbeitnehmer-Sparzulage: Hier profitieren Sie von einem Fördersatz von 9 % auf
    Beiträge bis zu einem Höchstbetrag von 470 € pro Jahr. Die Einkommensgrenzen liegen
    hier bei 40.000 € für Alleinstehende und 80.000 € für gemeinsam Veranlagte.


    Warum die Förderung bei der Bausparkasse Heimstatt?

    Wir unterstützen Sie dabei, diese Zulagen optimal zu nutzen, um Ihre Bausparsumme
    schneller zu erreichen. In Verbindung mit einem unserer Bausparverträge sichern
    Sie sich nicht nur staatliche Geschenke, sondern auch feste Zinsen für Ihr späteres
    Darlehen. Wir empfehlen Ihnen, die Förderung in Verbindung mit dem Bausparvertrag
    Heimstatt Classic zu prüfen, um eine ausgewogene Basis für Ihr Bauvorhaben zu
    schaffen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: f76f6a0f-cedd-5c22-ac15-aa8b3e54de45
  title: 'Wohnungsbauprämie und Arbeitnehmer-Sparzulage — prämienbegünstigte Sparleistung
    für Alleinstehende: Erklärung'
  body: 'Was versteht man unter der prämienbegünstigten Sparleistung für Alleinstehende?

    Dies ist der Teil Ihres jährlichen Sparbetrags, auf den Sie einen staatlichen
    Zuschuss in Form der Wohnungsbauprämie erhalten können. Damit dieser Anspruch
    besteht, muss Ihr Einkommen die Grenze von 35.000 € nicht überschreiten.


    Wie viel kann ich als Alleinstehender maximal sparen, um die volle Prämie zu erhalten?

    Die maximale prämienbegünstigte Sparsumme für Alleinstehende beträgt 700 € pro
    Kalenderjahr. Nur auf diesen Betrag wird die Förderung berechnet.


    In welcher Höhe erfolgt die Förderung?

    Auf die maximalen 700 € erhalten Sie einen staatlichen Zuschuss von 10 %, was
    einer jährlichen Prämie von 70 € entspricht, sofern alle anderen Voraussetzungen
    erfüllt sind.


    Wo finde ich weitere Details zu den Voraussetzungen?

    Eine detaillierte Übersicht finden Sie im Dokument Wohnungsbauprämie und Arbeitnehmer-Sparzulage
    — erforderliche Unterlagen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 8f4670c3-fd1d-5807-9168-0fdd252904f2
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — kündigen, schließen oder
    den Tarif wechseln
  body: 'Wenn Sie Ihren Vertrag zur staatlichen Förderung beenden oder die Art Ihrer
    Förderung ändern möchten (beispielsweise durch einen Wechsel der Sparform), führen
    Sie bitte die folgenden Schritte aus:


    1. Mitteilung des Anliegens: Teilen Sie uns mit, ob Sie die gesamte Förderung
    kündigen, das Konto schließen oder lediglich den Tarif Ihrer Sparleistung ändern
    möchten. Geben Sie dabei Ihre Vertragsnummer an.


    2. Identitätsprüfung: Da es sich um eine statusändernde Aktion handelt, führen
    wir eine eindeutige Identitätsprüfung durch. Bitte halten Sie hierfür Ihr gültiges
    Ausweisdokument bereit oder nutzen Sie unsere Zwei-Faktor-Authentifizierung.


    3. Überprüfung der Förderansprüche: Wir prüfen gemeinsam mit Ihnen Ihren aktuellen
    Stand. Wir analysieren, ob noch ausstehende Prämien (basierend auf den Sätzen
    von 10 % bzw. 9 %) zu beantragen sind oder ob durch die Kündigung eine Rückforderung
    von bereits gewährten Zulagen droht, falls die gesetzlichen Bedingungen (z. B.
    die Nutzung für Wohnungsbau) nicht erfüllt wurden.


    4. Bestätigung der Änderung: Wir senden Ihnen eine schriftliche Bestätigung über
    die Kündigung oder den Tarifwechsel zu. In dieser Bestätigung wird aufgeführt,
    welche Beträge final gutgeschrieben werden und ab welchem Datum die Förderung
    endet.


    5. Abschluss und Auszahlung: Im Falle einer vollständigen Kontoschließung wird
    das Guthaben inklusive der bis zum Stichtag verbuchten staatlichen Zulagen auf
    Ihr hinterlegtes Referenzkonto überwiesen.


    Bitte beachten Sie, dass eine Kündigung der staatlichen Förderung nicht zwingend
    die Kündigung des gesamten Bausparvertrags bedeutet. Sie können den Sparvertrag
    beibehalten, aber auf die staatlichen Zulagen verzichten.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 4c619c6a-c99c-5a66-97f9-ad6f313682d2
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — unerwartetes Entgelt oder
    unerwarteter Betrag
  body: 'Sollten Sie feststellen, dass die gutgeschriebenen staatlichen Förderbeträge
    nicht Ihren Erwartungen entsprechen oder niedriger ausfallen als berechnet, gehen
    Sie bitte nach folgendem Schema vor:


    Symptom: Die Gutschrift der Wohnungsbauprämie liegt unter den erwarteten 10 %
    der Einzahlung oder die Arbeitnehmer-Sparzulage weicht von den 9 % ab.


    Mögliche Ursachen:

    - Überschreitung der Sparhöchstbeträge: Für Alleinstehende beträgt die Grenze
    700 € und für gemeinsam Sparer 1.400 €. Einzahlungen über diese Beträge hinaus
    werden nicht gefördert.

    - Einkommensgrenzen überschritten: Wenn Ihr Einkommen die Grenze von 35.000 €
    / 70.000 € (Wohnungsbauprämie) bzw. 40.000 € / 80.000 € (Arbeitnehmer-Sparzulage)
    überschritten hat, entfällt der Anspruch.

    - Fehlende Unterlagen: Die zuständige Finanzbehörde konnte die Förderung aufgrund
    fehlender Einkommensnachweise nicht bewilligen.


    Prüfungsschritte:

    1. Vergleichen Sie Ihre Gesamteinzahlungen des Kalenderjahres mit den Höchstbeträgen
    (700 € / 1.400 € bzw. 470 €).

    2. Überprüfen Sie Ihren letzten Steuerbescheid auf die Einhaltung der Einkommensgrenzen.

    3. Kontrollieren Sie, ob alle erforderlichen Anträge vollständig an uns übermittelt
    wurden.


    Lösung und Eskalation:

    Wenn die Ursache nicht eindeutig ist, prüfen wir intern die Kommunikation mit
    der zuständigen Behörde. Sollte ein Fehler in der Übermittlung vorliegen, werden
    wir eine Korrekturmeldung an das Finanzamt senden. Falls die Differenz auf einer
    komplexen steuerlichen Situation beruht, leiten wir den Fall an unser spezialisiertes
    Beschwerdemanagement oder die Fachabteilung für staatliche Förderung weiter. Sie
    erhalten innerhalb von zehn Werktagen eine schriftliche Erläuterung über die Differenz
    oder die Bestätigung der Nachforderung.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 9797fb9c-4860-5e98-b13c-c887dfbea84a
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — erforderliche Unterlagen
  body: 'Um die staatlichen Förderungen korrekt zu beantragen und zu erhalten, sind
    je nach Status folgende Unterlagen zwingend erforderlich:


    | Förderart | Status | Einkommenslimit | Erforderliche Unterlagen |

    | :--- | :--- | :--- | :--- |

    | Wohnungsbauprämie | Alleinstehend | 35.000 € | Aktueller Einkommensnachweis
    / Steuerbescheid, Identitätsnachweis |

    | Wohnungsbauprämie | Zusammenveranlagt | 70.000 € | Gemeinsamer Einkommensnachweis,
    Identitätsnachweise beider Partner |

    | Arbeitnehmer-Sparzulage | Alleinstehend | 40.000 € | Arbeitgeberbescheinigung
    über VL-Einzahlungen, Einkommensnachweis |

    | Arbeitnehmer-Sparzulage | Zusammenveranlagt | 80.000 € | Arbeitgeberbescheinigungen,
    gemeinsamer Einkommensnachweis |


    Zusätzlich ist für alle Anträge ein gültiges Identitätsdokument (Personalausweis
    oder Reisepass) zur Verifizierung gemäß unseren Sicherheitsrichtlinien erforderlich.'
