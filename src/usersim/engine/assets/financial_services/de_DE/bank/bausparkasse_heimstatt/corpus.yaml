  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 6ae59d46-25b7-5ed8-a6d7-a9b3b26d0082
  title: 'Bausparvertrag Heimstatt Rendite — Mindestsparguthaben in Prozent der Bausparsumme:
    Erklärung'
  body: '**Was bedeutet das Mindestsparguthaben in Prozent der Bausparsumme?**

    Das Mindestsparguthaben gibt an, welchen Anteil der gesamten Bausparsumme Sie
    eigenständig ansparen müssen, bevor Sie das Recht erwerben, das Bauspardarlehen
    zu den festgesetzten Zinsen zu beantragen (die sogenannte Zuteilung).


    **Wie hoch ist dieser Wert beim Bausparvertrag Heimstatt Rendite?**

    Beim Bausparvertrag Heimstatt Rendite liegt dieser Wert bei 50 %. Das bedeutet,
    dass Sie erst dann eine Zuteilung erhalten, wenn Ihr Sparguthaben mindestens 50
    % der vereinbarten Bausparsumme erreicht hat.


    **Warum ist diese Grenze wichtig?**

    Diese Regelung stellt die finanzielle Stabilität des Kollektivs sicher und garantiert,
    dass die Darlehensvergabe auf einer soliden Eigenkapitalbasis erfolgt. Wenn Sie
    weitere Details zu den Zinskonditionen wünschen, finden Sie diese in der Bausparvertrag
    Heimstatt Rendite — Zinsübersicht.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 4f3022fd-6763-5db4-91b3-07d74478efe8
  title: Bausparvertrag Heimstatt Rendite — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Stand Ihres Bausparvertrags prüfen möchten, um beispielsweise
    festzustellen, wie nah Sie der Zuteilungsgrenze von 50 % Ihres Mindestsparguthabens
    gekommen sind, gehen Sie bitte wie folgt vor:


    1. **Identitätsprüfung:** Legen Sie uns zur Verifizierung Ihr gültiges Ausweisdokument
    vor oder bestätigen Sie Ihre Identität über die Zwei-Faktor-Authentifizierung.
    Dies ist zwingend erforderlich, bevor wir Ihnen kontospezifische Informationen
    herausgeben können.

    2. **Anforderung der Vertragsübersicht:** Bitten Sie uns um eine aktuelle Aufstellung
    Ihres Vertragskontos für den Bausparvertrag Heimstatt Rendite. Fordern Sie explizit
    die aktuelle „Bewertungszahl“ sowie den gesamten aktuellen Guthabenstand an.

    3. **Prüfung der Zinsgutschriften:** Lassen Sie sich den Verlauf der Zinsgutschriften
    anzeigen. Sie können so verifizieren, dass Ihr Guthaben mit dem vereinbarten Guthabenzins
    von 1,5 % verzinst wurde.

    4. **Abgleich der Sparraten:** Prüfen Sie in der Aufstellung, ob Ihre monatlichen
    Einzahlungen dem vereinbarten Regelsparbeitrag von 0,5 % der Bausparsumme entsprechen.

    5. **Bestätigung des Status:** Wir bestätigen Ihnen abschließend schriftlich oder
    mündlich Ihren aktuellen Rang in der Zuteilungsliste und berechnen Ihnen, welcher
    Betrag noch bis zum Erreichen der 50 %-Hürde fehlt.


    Nach Abschluss dieser Schritte haben Sie eine vollständige Übersicht über Ihren
    Fortschritt und die korrekte Anwendung der Konditionen. Für Änderungen an Ihrem
    Vertrag lesen Sie bitte Bausparvertrag Heimstatt Rendite — etwas ändern.'
