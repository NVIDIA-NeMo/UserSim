- id: 5fa2a8da-6ed2-5854-9305-bb4873d9b0ee
  title: Bausparvertrag Heimstatt Classic — Schritt für Schritt starten
  body: 'Dieser Leitfaden unterstützt Support-Mitarbeiter bei der Begleitung von Kunden
    durch den Onboarding-Prozess für den Bausparvertrag Heimstatt Classic. Ziel ist
    ein transparenter Abschluss, der alle regulatorischen Anforderungen erfüllt.


    Schritt 1: Identitätsprüfung

    Bevor Vertragsdetails besprochen werden, ist eine eindeutige Identitätsprüfung
    zwingend erforderlich. Prüfen Sie die Gültigkeit des Personalausweises oder Reisepasses
    des Kunden. Ohne erfolgreiche Verifikation darf kein Vertrag initiiert werden.


    Schritt 2: Festlegung der Bausparsumme

    In Abstimmung mit den Wohnbauplänen des Kunden wird die Bausparsumme festgelegt.
    Erklären Sie dem Kunden, dass sich aus dieser Summe sowohl der Sparanteil als
    auch der spätere Darlehensanteil zusammensetzen.


    Schritt 3: Vereinbarung der Sparrate

    Einrichten Sie den regelmäßigen monatlichen Sparbeitrag. Dieser muss mindestens
    0,4 % der vereinbarten Bausparsumme betragen. Weisen Sie darauf hin, dass eine
    konsequente Einzahlung die Bewertungszahl erhöht und somit den Zeitpunkt der Zuteilung
    beschleunigt.


    Schritt 4: Erläuterung der Konditionen und Gebühren

    Informieren Sie den Kunden transparent über die folgenden Werte:

    - Abschlussgebühr: 1,6 % der Bausparsumme (fällig bei Vertragsschluss).

    - Guthabenzins: 0,5 % pro Jahr.

    - Darlehenszins (Sollzins): 2,45 % pro Jahr (festgeschrieben für die Zukunft).

    - Mindestsparguthaben für Zuteilung: 40 % der Bausparsumme.


    Schritt 5: Dokumentation und Unterzeichnung

    Erstellen Sie das Vertragsangebot einschließlich aller transparenten Offenlegungen
    und des effektiven Jahreszinses. Der Kunde unterzeichnet die Unterlagen, womit
    die langfristige Zinssicherung aktiviert wird.


    Nach Abschluss erhält der Kunde Zugang zum digitalen Kundenportal, um seine Einzahlungen
    und den Fortschritt zur Zuteilung jederzeit einsehen zu können. Für weitere Details
    zur Produktstruktur siehe Bausparvertrag Heimstatt Classic — Überblick.'
