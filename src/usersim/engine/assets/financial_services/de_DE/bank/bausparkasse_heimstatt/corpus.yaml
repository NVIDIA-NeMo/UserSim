- id: 37e449a4-a4c0-5514-953b-73dcc3410cd6
  title: Bausparvertrag Heimstatt Classic — Empfehlungs- und Treueangebot
  body: 'Wir schätzen das Vertrauen, das Sie in die Bausparkasse Heimstatt setzen.
    Um Ihnen und Ihren Angehörigen den Weg zum Eigenheim zu erleichtern, bieten wir
    Ihnen ein besonderes Treue- und Empfehlungsangebot für den Bausparvertrag Heimstatt
    Classic an.


    Wenn Sie zwischen dem 01. Oktober 2024 und dem 31. Dezember 2024 einen neuen Vertrag
    abschließen oder einen neuen Kunden erfolgreich an uns vermitteln, reduzieren
    wir die Abschlussgebühr von den regulären 1,6 % auf lediglich 1,0 % der Bausparsumme.


    Dieses Angebot gilt sowohl für Neukunden als auch für Bestandskunden, die ihr
    Portfolio erweitern möchten. Durch die Senkung dieser Gebühr, die normalerweise
    zur Deckung des administrativen Aufwands für die langfristige Zinssicherung dient,
    steigern wir gemeinsam Ihr startkapital.


    Profitieren Sie von der Planungssicherheit einer festen Darlehensverzinsung von
    2,45 % und einem Guthabenzins von 0,5 %. Wir freuen uns darauf, Sie und Ihre Empfohlenen
    bei Ihren Wohnbauplänen beratend zu unterstützen.'
