- id: d1b04e0b-b089-5970-8cc0-a58f30458e9a
  title: Modernisierungsdarlehen ohne Grundschuld — Sicherheitstipps für Ihr Konto
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    die Sicherheit Ihrer Finanzdaten hat bei der Bausparkasse Heimstatt höchste Priorität.
    Da ein Modernisierungsdarlehen ohne Grundschuld sensible Kreditinformationen beinhaltet,
    möchten wir Sie auf folgende Sicherheitsmaßnahmen aufmerksam machen:


    1. Identitätsprüfung: Beachten Sie bitte, dass wir vor jeder statusändernden Aktion
    an Ihrem Darlehenskonto oder der Herausgabe von Kontoinformationen eine eindeutige
    Identitätsprüfung durchführen. Dies erfolgt zwingend durch die Vorlage gültiger
    Ausweisdokumente oder über eine Zwei-Faktor-Authentifizierung (2FA).


    2. Kommunikation: Die Bausparkasse Heimstatt wird Sie niemals per E-Mail, SMS
    oder über soziale Medien dazu auffordern, Passwörter, PINs oder TANs preiszugeben.
    Solche Anfragen sind stets als Betrugsversuche einzustufen.


    3. Zugriffsschutz: Verwenden Sie für Ihr digitales Kundenportal ein starkes, individuelles
    Passwort und ändern Sie dieses regelmäßig. Geben Sie Ihre Zugangsdaten niemals
    an Dritte weiter.


    4. Warnsignale: Seien Sie skeptisch bei unerwarteten Anrufen, bei denen Personen
    vorgeben, Mitarbeiter unseres Beschwerdemanagements oder der Fachabteilungen zu
    sein und dringende Handlungen an Ihrem Kreditkonto fordern.


    Was tun bei Verdacht auf Betrug?


    Sollten Sie Unregelmäßigkeiten in Ihren Kontoauszügen bemerken oder vermuten,
    dass Ihre Zugangsdaten kompromittiert wurden, informieren Sie uns bitte umgehend
    über unsere zentrale Telefon-Hotline oder in Ihrer regionalen Filiale. Im Falle
    eines begründeten Betrugsverdachts erfolgt eine sofortige Sperrung der betroffenen
    Konten, um weiteren Schaden abzuwenden. Wir leiten im Anschluss eine Meldung an
    die zuständigen Aufsichtsbehörden ein.


    Wir empfehlen Ihnen, regelmäßig die Dokumentation in Modernisierungsdarlehen ohne
    Grundschuld — Betrugsmaschen rund um dieses Produkt erkennen zu lesen, um über
    aktuelle Bedrohungslagen informiert zu bleiben.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 5d889c6b-db7a-5544-8369-cde4c0ec061c
  title: Modernisierungsdarlehen ohne Grundschuld — Änderung der Bedingungen
  body: 'Die folgenden Bedingungen regeln die Anpassung und Änderung der Vertragsgrundlagen
    für das Modernisierungsdarlehen ohne Grundschuld der Bausparkasse Heimstatt. Diese
    Vereinbarungen erfolgen strikt nach den regulatorischen Vorgaben der BaFin, der
    Deutschen Bundesbank sowie den Bestimmungen des BGB für Verbraucherdarlehen.


    Änderungsvorbehalt und Anpassungen

    Die Bausparkasse Heimstatt behält sich vor, die Bedingungen des Darlehens unter
    Einhaltung der gesetzlichen Fristen anzupassen. Änderungen betreffen insbesondere
    die administrativen Gebühren zur Deckung des Aufwands für die langfristige Zinssicherung
    oder Anpassungen in der digitalen Bereitstellung des Portals. Jede Änderung wird
    Ihnen schriftlich oder über das Kundenportal mitgeteilt.


    Zinsbindung und Kosten

    Im Rahmen des Modernisierungsdarlehens ohne Grundschuld wird eine feste Zinsbindung
    vereinbart. Ein repräsentativer effektiver Jahreszins beträgt 4,9 %. Diese Zinsen
    bleiben für die vereinbarte Laufzeit stabil und bieten Ihnen somit volle Planungssicherheit.
    Die Gesamtkosten eines repräsentativen Beispiels über eine Laufzeit von 120 Monaten
    bei einer Kreditsumme von 20.000 € belaufen sich auf 5.214,40 €.


    Kündigung und vorzeitige Rückzahlung

    Gemäß unserer Philosophie ist eine Sondertilgung bei unseren Bauspardarlehen jederzeit
    kostenfrei möglich. Dies bedeutet, dass Sie zusätzlich zu den regelmäßigen Raten
    (im repräsentativen Beispiel 210,12 €) außerplanmäßige Rückzahlungen leisten können,
    ohne dass hierfür eine Vorfälligkeitsentschädigung erhoben wird.


    Beendigung des Vertragsverhältnisses

    Das Darlehensverhältnis endet mit der vollständigen Tilgung der Bausparsumme inklusive
    aller angefallenen Zinsen und Gebühren. Die Bausparkasse Heimstatt ist berechtigt,
    das Darlehen bei schwerwiegenden Vertragsverletzungen oder nach gesetzlichen Vorgaben
    der Aufsichtsbehörden zu kündigen.


    Für detaillierte rechtliche Hinweise verweisen wir auf das Dokument Modernisierungsdarlehen
    ohne Grundschuld — rechtliche Hinweise.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: terms_conditions
  source_authority: official
