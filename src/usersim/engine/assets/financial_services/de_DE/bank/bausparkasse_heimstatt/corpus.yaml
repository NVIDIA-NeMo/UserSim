- id: a35b3f09-a64b-5153-885a-9ddfbf968cce
  title: Bausparvertrag Heimstatt Classic — Preis- und Leistungsverzeichnis
  body: 'In diesem Preis- und Leistungsverzeichnis finden Sie die verbindlichen Entgelte
    für den Bausparvertrag Heimstatt Classic. Wir legen Wert auf eine transparente
    Darstellung unserer Kostenstruktur.


    - Abschlussgebühr: 1,6 % der Bausparsumme (einmalig bei Vertragsabschluss zur
    Deckung des administrativen Aufwands und der Zinssicherung).

    - Kontoführungsgebühr: Kostenfrei im Rahmen des Standardmodells.

    - Sondertilgung: Kostenfrei (zusätzliche Rückzahlungen des Darlehens sind jederzeit
    ohne Vorfälligkeitsentschädigung möglich).


    Bitte beachten Sie, dass die Abschlussgebühr von 1,6 % im Rahmen von speziellen
    Aktionsangeboten oder bei sehr hohen Vertragsvolumina reduziert werden kann. Alle
    anderen Konditionen richten sich nach den allgemeinen Geschäftsbedingungen für
    das Privatkundengeschäft.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 9e511db7-80d3-5b5e-878a-ad4a10c5a914
  title: Bausparvertrag Heimstatt Classic — fehlgeschlagener oder ausstehender Vorgang
  body: 'Sollten Sie feststellen, dass Ihr Antrag auf einen Bausparvertrag Heimstatt
    Classic nicht bearbeitet wurde oder ein Status im Kundenportal als „ausstehend“
    angezeigt wird, prüfen Sie bitte die folgenden Punkte:


    Symptom: Der Vertrag wurde nicht final aktiviert oder die Bestätigung fehlt.


    Mögliche Ursachen und Prüfschritte:

    1. Unvollständige Identitätsprüfung: Die häufigste Ursache ist eine nicht erfolgreich
    abgeschlossene Verifikation. Bitte prüfen Sie, ob alle erforderlichen Ausweisdokumente
    vollständig und lesbar eingereicht wurden. Ohne eine eindeutige Identitätsprüfung
    ist eine Aktivierung gesetzlich nicht möglich.

    2. Fehlende Informationen: Überprüfen Sie, ob alle Pflichtfelder (z. B. Steuer-ID
    oder die gewünschte Bausparsumme) korrekt angegeben wurden.

    3. Zahlungsausfall der ersten Rate: Ein Vertrag wird oft erst nach dem ersten
    Geldeingang final aktiviert. Prüfen Sie Ihren Kontoauszug, ob die erste Sparrate
    von 0,4 % der Bausparsumme erfolgreich abgebucht wurde.


    Lösung:

    Wenn Sie feststellen, dass Dokumente fehlen, reichen Sie diese bitte erneut ein.
    Wir werden die Verifizierung dann umgehend erneut prüfen und den Vertrag aktivieren.


    Eskalation:

    Sollte der Vorgang trotz korrekter Unterlagen länger als zehn Werktage ausstehen,
    leiten wir den Fall intern an die zuständige Fachabteilung weiter. Sie erhalten
    eine schriftliche Benachrichtigung über den Fortschritt der Bearbeitung und den
    voraussichtlichen Zeitpunkt der Aktivierung. Für rechtliche Details zur Vertragserstellung
    sehen Sie bitte in Bausparvertrag Heimstatt Classic — rechtliche Hinweise.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 101cfa17-2b84-5ca7-965a-5df1d49e451c
  title: Bausparvertrag Heimstatt Classic — Voraussetzungen
  body: 'Die folgende Matrix beschreibt die Voraussetzungen für die verschiedenen
    Phasen Ihres Bausparvertrages Heimstatt Classic.


    | Bedingung | Ergebnis / Status |

    | :--- | :--- |

    | Volljährige Geschäftsfähigkeit & erfolgreiche Identitätsprüfung | Berechtigung
    zum Vertragsabschluss (Einzahlung der Abschlussgebühr von 1,6 %) |

    | Monatliche Einzahlung von mindestens 0,4 % der Bausparsumme | Regelmäßiger Aufbau
    der Bewertungszahl |

    | Erreichen eines Sparguthabens von 40 % der Bausparsumme | Grundvoraussetzung
    für die Beantragung der Zuteilung |

    | Erreichen der erforderlichen Bewertungszahl (Rangliste) | Berechtigung zur Inanspruchnahme
    des Darlehens zu 2,45 % Zinsen |


    Bitte beachten Sie, dass das Erreichen des Mindestsparguthabens von 40 % eine
    notwendige, aber nicht allein hinreichende Bedingung für die Zuteilung ist; es
    muss zusätzlich die entsprechende Bewertungszahl erreicht worden sein.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: eligibility_matrix
  source_authority: official
