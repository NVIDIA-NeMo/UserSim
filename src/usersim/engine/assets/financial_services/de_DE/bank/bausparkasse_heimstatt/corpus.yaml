- id: cb446e54-5019-54a3-a69d-8b9770fde970
  title: Bausparvertrag Heimstatt Classic — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Bausparvertrag Heimstatt Classic beenden oder in ein anderes
    Produkt wechseln möchten, führen wir Sie durch den notwendigen Prozess. Bitte
    beachten Sie, dass eine Kündigung vor Erreichen der Zuteilung Auswirkungen auf
    Ihre zukünftigen Finanzierungsmöglichkeiten haben kann.


    Schritte zur Kündigung oder zum Tarifwechsel:


    1. Mitteilung des Wunsches: Teilen Sie uns mit, ob Sie den Vertrag vollständig
    schließen, die Sparrate ändern oder in einen anderen Tarif (z. B. Bausparen Rendite)
    wechseln möchten. Geben Sie dabei die entsprechende Vertragsnummer an.


    2. Identitätsprüfung: Zur Sicherheit Ihrer Daten führen wir eine eindeutige Identitätsprüfung
    durch. Dies erfolgt entweder durch die Vorlage eines gültigen Ausweisdokuments
    in einer unserer regionalen Filialen oder über unsere Zwei-Faktor-Authentifizierung
    in Ihrem digitalen Kundenportal.


    3. Prüfung der Vertragslage: Wir prüfen Ihren aktuellen Status, insbesondere ob
    das Mindestsparguthaben von 40 % bereits erreicht wurde oder ob noch Abschlussgebühren
    in Höhe von 1,6 % ausstehend sind. Wir informieren Sie über mögliche Fristen und
    die Auswirkungen auf Ihre Guthabenzinsen von 0,5 %.


    4. Bestätigung und Durchführung: Nach erfolgreicher Prüfung erhalten Sie eine
    schriftliche Bestätigung über die Schließung des Kontos oder den Wechsel des Tarifs.
    Im Falle einer Kündigung wird das vorhandene Guthaben inklusive der aufgelaufenen
    Zinsen auf Ihr angegebenes Referenzkonto überwiesen.


    5. Abschluss: Der Vorgang ist abgeschlossen, sobald Sie die finale Abrechnung
    und die Bestätigung über die Kontoschließung erhalten haben.


    Für Informationen dazu, wie Sie einen Vertrag neu eröffnen, schlagen wir das Dokument
    Bausparvertrag Heimstatt Classic — abschließen und aktivieren vor.'
