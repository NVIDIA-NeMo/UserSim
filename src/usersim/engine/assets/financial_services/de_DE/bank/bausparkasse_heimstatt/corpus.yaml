- id: b17fa487-71c5-5deb-ae08-5eb5c5984c0d
  title: Modernisierungsdarlehen ohne Grundschuld — fehlgeschlagener oder ausstehender
    Vorgang
  body: 'Sollten Sie feststellen, dass Ihr Antrag auf ein Modernisierungsdarlehen
    ohne Grundschuld nicht wie erwartet bearbeitet wurde oder die Auszahlung aussteht,
    prüfen Sie bitte die folgenden Punkte in der genannten Reihenfolge.


    Symptom: Der Antrag wurde abgelehnt oder der Status ist seit längerer Zeit ''ausstehend''.


    1. Prüfung der Identitätsprüfung: In vielen Fällen liegt eine unvollständige Verifikation
    vor. Überprüfen Sie, ob alle geforderten Ausweisdokumente vollständig und lesbar
    eingereicht wurden. Wenn eine Zwei-Faktor-Authentifizierung erforderlich war,
    stellen Sie sicher, dass diese erfolgreich abgeschlossen wurde.


    2. Prüfung der Unterlagen: Überprüfen Sie, ob die Angaben zum Verwendungszweck
    der Modernisierung präzise sind. Unklarheiten in der Beschreibung des Vorhabens
    können zu Verzögerungen in der Prüfung führen.


    3. Bonitätsprüfung: Falls Ihr Antrag abgelehnt wurde, kann dies an einer nicht
    ausreichenden Bonitätsbewertung liegen. In diesem Fall prüfen Sie, ob sich Ihre
    finanziellen Verhältnisse geändert haben oder ob Sie zusätzliche Sicherheiten
    (trotz des Verzichts auf eine Grundschuld) anbieten können.


    Lösung:

    Wenn eine fehlende Information die Ursache ist, reichen Sie die entsprechenden
    Dokumente nach. Wir werden den Vorgang umgehend erneut prüfen und Ihnen den aktualisierten
    Status mitteilen.


    Eskalation:

    Sollte der Vorgang trotz korrekter Unterlagen weiterhin ausstehen, leiten wir
    das Anliegen hierarchisch über die Filialleitung an die zuständige Fachabteilung
    oder unser Beschwerdemanagement weiter. Sie erhalten innerhalb der gesetzlichen
    Fristen eine schriftliche Rückmeldung über den Verbleib Ihres Antrags oder die
    Gründe für die Verzögerung.'
