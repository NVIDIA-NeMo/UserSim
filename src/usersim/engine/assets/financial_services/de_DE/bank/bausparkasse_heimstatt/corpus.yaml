- id: 5693cef5-9628-518c-9da0-0812c746c4d3
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Betrugsmaschen rund um dieses
    Produkt erkennen
  body: 'Die Nutzung staatlicher Förderungen ist ein attraktiver Weg zur Vermögensbildung.
    Leider versuchen Betrüger oft, dieses Interesse auszunutzen. Wir möchten Sie darauf
    aufmerksam machen, welche Muster typisch für betrügerische Aktivitäten im Zusammenhang
    mit der Wohnungsbauprämie und der Arbeitnehmer-Sparzulage sind.


    Ein häufiges Szenario sind Angebote von Drittanbietern, die behaupten, durch spezielle
    ''Optimierungsprogramme'' eine höhere Prämie als die gesetzlichen 10 % der Wohnungsbauprämie
    oder die 9 % der Arbeitnehmer-Sparzulage erwirken zu können. Seien Sie extrem
    vorsichtig bei Versprechen, die eine Umgehung der Einkommensgrenzen (wie etwa
    35.000 € für Alleinstehende bei der Wohnungsbauprämie) suggerieren. Solche Angebote
    sind in der Regel betrügerisch.


    Bitte beachten Sie, dass die Bausparkasse Heimstatt Sie niemals dazu auffordern
    wird, Passwörter, Zwei-Faktor-Authentifizierungs-Codes oder vollständige PINs
    über eine E-Mail oder SMS preiszugeben, um Förderansprüche zu prüfen. Eine Identitätsprüfung
    erfolgt bei uns ausschließlich über gesicherte Kanäle, wie die Vorlage von Ausweisdokumenten
    in unseren Filialen oder über unser zertifiziertes Kundenportal.


    Sollten Sie eine verdächtige Nachricht erhalten haben oder das Gefühl haben, Opfer
    eines Betrugsversuchs geworden zu sein, ist die sofortige Meldung an uns unerlässlich.
    Bitte informieren Sie uns umgehend über eine unserer regionalen Filialen oder
    unsere zentrale Hotline. Im Falle eines konkreten Betrugsverdachts werden wir
    die betroffenen Konten sofort sperren und die zuständigen Aufsichtsbehörden informieren,
    um weiteren Schaden abzuwenden.


    Für weitere Informationen zur Sicherheit Ihrer Konten verweisen wir auf das Dokument
    Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Schutz vor Betrug und nicht autorisierten
    Vorgängen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: security_advisory
  source_authority: official
