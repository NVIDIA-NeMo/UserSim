- id: 4040a978-86bf-5635-a161-ea2f060efea7
  title: Modernisierungsdarlehen ohne Grundschuld — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem bestehenden Modernisierungsdarlehen ohne Grundschuld
    vornehmen möchten, führen Sie bitte die folgenden Schritte durch. Wir begleiten
    Sie bei diesem Prozess direkt in der Kommunikation.


    Anpassung der monatlichen Zahlung oder Sondertilgung


    1. Mitteilung des Anliegens: Teilen Sie uns mit, welchen Betrag Sie außerplanmäßig
    tilgen möchten oder ob Sie die monatliche Rate anpassen wollen. Wir weisen darauf
    hin, dass Sondertilgungen bei unseren Bauspardarlehen jederzeit kostenfrei möglich
    sind.


    2. Identitätsprüfung: Zur Sicherheit führen wir eine Verifizierung Ihrer Identität
    durch Ihr hinterlegtes Zwei-Faktor-Authentifizierungsverfahren oder die Vorlage
    eines Ausweisdokuments durch.


    3. Prüfung der Möglichkeiten: Wir prüfen Ihren aktuellen Kontostand und die vertraglichen
    Rahmenbedingungen. Im Falle einer Sondertilgung berechnen wir die neue Restschuld
    und die daraus resultierende Zinsersparnis für Sie.


    4. Bestätigung der Änderung: Wir senden Ihnen eine schriftliche Bestätigung über
    die durchgeführte Teilrückzahlung oder die geänderte Ratenstruktur zu. In dieser
    Bestätigung ist der neue Zeitplan der Rückzahlung sowie die verbleibende Laufzeit
    präzise aufgeführt.


    5. Überprüfung im Portal: Sie können die Änderung unmittelbar nach Abschluss des
    Gesprächs in Ihrem digitalen Kundenportal einsehen.


    Änderung der persönlichen Kontaktdaten


    1. Datenübermittlung: Nennen Sie uns die neuen Kontaktdaten (z. B. neue Anschrift
    oder Telefonnummer).


    2. Verifizierung: Wir führen eine strikte Identitätsprüfung durch, um den Schutz
    Ihrer Kundendaten zu gewährleisten.


    3. Systemaktualisierung: Wir aktualisieren Ihre Daten in unserem System. Sie erhalten
    eine Benachrichtigung über die erfolgreiche Änderung.


    Sollten Sie Probleme beim Zugriff auf Ihre Daten haben, lesen Sie bitte Modernisierungsdarlehen
    ohne Grundschuld — Probleme mit Zugang oder Login.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: how_to_guide
  source_authority: official
