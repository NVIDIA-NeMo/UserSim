- id: 8f198aed-5827-599b-91a6-88860d8ba841
  title: Häufige Fragen
  body: 'Hier finden Sie Antworten auf allgemeine Fragen zu unseren Services und dem
    Kontakt mit der Bausparkasse Heimstatt.


    **Wie kann ich Unterstützung bei meinen Anliegen erhalten?**

    Sie können uns während der regulären Geschäftszeiten über unsere regionalen Filialen,
    unsere zentrale Telefon-Hotline oder über das digitale Kundenportal erreichen.
    Unser Team berät Sie gerne persönlich und kompetent.


    **Was passiert, wenn ich mit einer Entscheidung oder einem Prozess nicht einverstanden
    bin?**

    Wir bearbeiten Beschwerden fair und transparent. Eskalationen werden hierarchisch
    über die Filialleitung an die zuständigen Fachabteilungen oder direkt an unser
    Beschwerdemanagement weitergeleitet, um eine zufriedenstellende Lösung zu finden.


    **Wie beginne ich mit dem Aufbau meines Eigenkapitals?**

    Der erste Schritt ist die Wahl des passenden Produkts und der Abschluss eines
    Vertrages. Eine detaillierte Anleitung finden Sie beispielsweise im Dokument Bausparvertrag
    Heimstatt Classic — abschließen und aktivieren.


    **Wie werden Betrugsfälle gehandhabt?**

    Bei Verdacht auf Betrug erfolgt eine sofortige Sperrung der betroffenen Konten
    sowie eine Meldung an die zuständigen Aufsichtsbehörden.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: de1065e8-4f0b-5802-a5a7-d2d209963ec0
  title: 'Aufsichtsrechtliche Hinweise: Privatkundengeschäft'
  body: 'Die Bausparkasse Heimstatt agiert als vertrauenswürdiger Finanzpartner unter
    strikter Einhaltung der regulatorischen Vorgaben. Für unser gesamtes Privatkundengeschäft
    gelten die Richtlinien der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin)
    sowie der Deutschen Bundesbank.


    **Sicherheit der Einlagen**

    Wir gewährleisten die Sicherheit Ihrer Kundendaten und Guthaben durch strikte
    Verifikationsprotokolle. Vor jeder statusändernden Aktion oder der Herausgabe
    von Kontoinformationen ist eine eindeutige Identitätsprüfung zwingend erforderlich.
    Dies geschieht in der Regel durch die Vorlage gültiger Ausweisdokumente oder über
    eine Zwei-Faktor-Authentifizierung.


    **Gesetzliche Einlagensicherung**

    Alle unsere Produkte werden mit transparenten Offenlegungen kommuniziert. Wir
    weisen ausdrücklich auf die gesetzliche Einlagensicherung hin, welche den Schutz
    Ihrer Guthaben gemäß den gesetzlichen Bestimmungen garantiert. Diese Transparenz
    ist Teil unseres Versprechens an Familien und zukünftige Eigenheimbesitzer, eine
    sichere Basis für ihren Wohnungsbau zu bieten.


    **Compliance und Datenschutz**

    Unser Handeln orientiert sich an den Bestimmungen des Bürgerlichen Gesetzbuchs
    (BGB) sowie den geltenden Datenschutzgrundverordnungen. Wir stellen sicher, dass
    alle Kundenprozesse – von der Kontoeröffnung bis zur Auszahlung – rechtssicher
    dokumentiert und vollzogen werden. Für spezifische Details zur Datenverarbeitung
    verweisen wir auf die entsprechenden produktspezifischen Dokumentationen, wie
    etwa Bausparvertrag Heimstatt Classic — Datenschutz und Datenverarbeitung.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 5152e97e-d072-5e99-87ca-17b46deba408
  title: 'Aufsichtsrechtliche Hinweise: Kredite und Baufinanzierung'
  body: 'Bei der Vergabe von Bauspardarlehen und anderen Finanzierungslösungen hält
    sich die Bausparkasse Heimstatt strikt an die gesetzlichen Vorgaben zur Verbraucherkreditvergabe.


    **Gesetzlicher Rahmen**

    Sämtliche Kreditprodukte werden gemäß den Bestimmungen des Bürgerlichen Gesetzbuchs
    (BGB) für Verbraucherdarlehen gestaltet. Zudem unterliegen wir der Aufsicht durch
    die BaFin und die Deutsche Bundesbank, um eine stabile und nachhaltige Kreditvergabe
    zu gewährleisten.


    **Transparenz der Konditionen**

    Wir verpflichten uns zu einer vollständigen Offenlegung aller Kosten. In jedem
    Kreditangebot wird der effektive Jahreszins präzise ausgewiesen. Dieser Wert beinhaltet
    die nominalen Zinsen sowie die Kosten, die mit dem Kredit verbunden sind, und
    ermöglicht Ihnen einen objektiven Vergleich der Finanzierungskosten.


    **Sorgfaltspflichten und Beratung**

    Wir wenden einen hohen Sorgfaltsstandard bei Produktempfehlungen an. Bitte beachten
    Sie jedoch, dass unsere Mitarbeiter eine umfassende Produktberatung und allgemeine
    finanzielle Bildung anbieten, jedoch keine individualisierte Steuer- oder Rechtsberatung
    erbringen. Für spezifische rechtliche oder steuerliche Details verweisen wir an
    zertifizierte Fachleute.


    **Bearbeitung von Rückgaben und Streitfällen**

    Im Falle von SEPA-Rückgaben oder anderen finanziellen Disputen bearbeiten wir
    diese fair, transparent und unter Einhaltung der gesetzlichen Fristen. Beispielsweise
    werden SEPA-Rückgaben innerhalb einer Frist von acht Wochen bearbeitet. Bei Verdacht
    auf betrügerische Aktivitäten werden Konten unmittelbar gesperrt und die Aufsichtsbehörden
    informiert.'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: d766ea58-11e1-5c53-8515-e4e025346cec
  title: Wann change_contract_sum eingesetzt wird
  body: 'Das Werkzeug `change_contract_sum` wird verwendet, wenn ein Kunde die vertraglich
    vereinbarte Bausparsumme anpassen möchte. Dies kann eine Erhöhung, eine Ermäßigung
    oder eine Teilung des bestehenden Vertrages beinhalten, um die Planungssicherheit
    für das zukünftige Bauvorhaben zu optimieren.


    **Voraussetzungen für die Durchführung:**

    Bevor eine Änderung der Bausparsumme vorgenommen wird, muss die Identität des
    Kunden zweifelsfrei festgestellt worden sein. Dies geschieht gemäß unseren Sicherheitsrichtlinien
    durch eine eindeutige Identitätsprüfung (z. B. Ausweisdokumente oder Zwei-Faktor-Authentifizierung).


    **Vorgehensweise für den Mitarbeiter:**

    1. Führen Sie die obligatorische Identitätsprüfung des Kunden durch.

    2. Ermitteln Sie die korrekte Konto-Identifikationsnummer des betroffenen Bausparvertrags.
    Nutzen Sie hierfür das Werkzeug `get_accounts`, indem Sie die vom Kunden genannten
    letzten vier Stellen der Kontonummer abgleichen.

    3. Klären Sie mit dem Kunden das genaue Ziel der Änderung: Soll die Bausparsumme
    erhöht, vermindert oder der Vertrag geteilt werden?

    4. Dokumentieren Sie die neue Bausparsumme bzw. die Aufteilung präzise.

    5. Führen Sie die Änderung final aus, indem Sie das Werkzeug `change_contract_sum`
    mit der ermittelten Konto-ID und den neuen Parametern aufrufen.


    Nach erfolgreichem Aufruf des Werkzeugs ist der Kunde über die Änderung und die
    daraus resultierenden Auswirkungen auf die Bewertungszahl zu informieren.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_contract_sum
  institution_id: bausparkasse_heimstatt
- id: 9269527b-5a30-5ebe-ac57-f6947da092fc
  title: Werkzeugreferenz change_contract_sum
  body: 'Das Werkzeug `change_contract_sum` ermöglicht die administrative Anpassung
    der Bausparsumme eines bestehenden Vertrages.


    **Funktion:**

    Der Agent führt diese Aktion direkt im System aus, nachdem die Identität des Kunden
    verifiziert wurde. Es ist keine Weiterleitung an externe Portale erforderlich.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des Bausparvertrags (vom Agenten über `get_accounts`
    ermittelt).

    - `action`: Die Art der Änderung (Werte: ''increase'' für Erhöhung, ''decrease''
    für Ermäßigung, ''split'' für Vertragsteilung).

    - `new_sum`: Die neue, vertraglich zu vereinbarende Bausparsumme in €.


    **Auswirkung:**

    Die Bausparsumme wird im System aktualisiert. Dies beeinflusst unmittelbar die
    Berechnung der Bewertungszahl und somit den Zeitpunkt der möglichen Zuteilung.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_contract_sum
  institution_id: bausparkasse_heimstatt
- id: 85d7985d-5037-5420-b5a4-68d5e05817c4
  title: Wann change_savings_rate eingesetzt wird
  body: 'Das Werkzeug `change_savings_rate` wird eingesetzt, wenn ein Kunde seinen
    monatlichen Sparbeitrag anpassen möchte oder eine außerplanmäßige Sonderzahlung
    auf seinen Bausparvertrag leisten will. Dies dient der flexiblen Steuerung des
    Sparprozesses, um die Zuteilungsreife schneller zu erreichen.


    **Voraussetzungen für die Durchführung:**

    Eine Statusänderung am Vertrag erfordert zwingend eine vorherige Identitätsprüfung
    des Kunden (z. B. mittels Zwei-Faktor-Authentifizierung oder Ausweisprüfung).


    **Vorgehensweise für den Mitarbeiter:**

    1. Stellen Sie die Identität des Kunden durch die vorgeschriebenen Verifikationsprotokolle
    sicher.

    2. Rufen Sie mit dem Werkzeug `get_accounts` die Liste der Verträge des Kunden
    ab, um die korrekte `account_id` für den betreffenden Bausparvertrag zu identifizieren.

    3. Fragen Sie den Kunden nach dem gewünschten neuen monatlichen Sparbetrag oder
    dem Betrag der einmaligen Sonderzahlung.

    4. Überprüfen Sie, ob die Änderung im Einklang mit den Mindestforderungen des
    jeweiligen Produkts steht (siehe z. B. Bausparvertrag Heimstatt Classic — Mindestsparguthaben
    in Prozent der Bausparsumme: Erklärung).

    5. Setzen Sie die Änderung durch den Aufruf des Werkzeugs `change_savings_rate`
    unter Angabe der `account_id` und des neuen Betrags bzw. der Sonderzahlung um.


    Der Kunde ist im Anschluss über die wirksame Änderung und den Zeitpunkt der ersten
    neuen Abbuchung zu informieren.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_savings_rate
  institution_id: bausparkasse_heimstatt
- id: 6d7a34c5-60f3-5d92-ab77-1261ebb0af1f
  title: Werkzeugreferenz change_savings_rate
  body: 'Das Werkzeug `change_savings_rate` dient der Anpassung der Sparbeiträge eines
    Bausparvertrags.


    **Funktion:**

    Der Agent führt die Änderung der Sparrate oder die Buchung einer Sonderzahlung
    direkt durch den Aufruf dieses Werkzeugs aus.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des Bausparvertrags (vom Agenten über `get_accounts`
    ermittelt).

    - `new_monthly_rate`: Der neue monatliche Sparbetrag in €.

    - `special_payment`: Ein optionaler Betrag für eine einmalige Sonderzahlung in
    €.


    **Auswirkung:**

    Die monatliche Abbuchung wird angepasst oder eine einmalige Gutschrift auf das
    Guthabenkonto erfolgt. Dies erhöht die Bewertungszahl des Vertrages und beschleunigt
    potenziell den Weg zur Zuteilung.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - change_savings_rate
  institution_id: bausparkasse_heimstatt
- id: 504353f4-7498-5d2e-bf63-5c83fcfd52be
  title: Wann accept_allocation eingesetzt wird
  body: 'Das Werkzeug `accept_allocation` wird verwendet, wenn ein Bausparvertrag
    die notwendige Bewertung erreicht hat und der Kunde die Zuteilung annehmen möchte.
    Dies ist der entscheidende Schritt, um das Bausparguthaben und das Bauspardarlehen
    für ein konkretes Wohnvorhaben zu beanspruchen.


    **Voraussetzungen für die Durchführung:**

    Da die Zuteilung eine irreversible Handlung mit erheblichen finanziellen Auswirkungen
    ist, ist eine strikte Identitätsprüfung des Kunden absolut zwingend. Zudem muss
    die Zuteilungsreife des Vertrages systemseitig bestätigt sein.


    **Vorgehensweise für den Mitarbeiter:**

    1. Führen Sie eine umfassende Identitätsprüfung des Kunden durch.

    2. Verwenden Sie `get_accounts`, um den zuteilungsreifen Vertrag über die `account_id`
    zu identifizieren.

    3. Erheben Sie alle notwendigen Informationen zum geplanten Wohnvorhaben (z. B.
    Art der Nutzung, Objektbeschreibung).

    4. Erläutern Sie dem Kunden die Zinsen des Darlehens und die Bedingungen der Auszahlung.

    5. Führen Sie den Prozess durch den Aufruf des Werkzeugs `accept_allocation` aus,
    wobei die `account_id` und die Details zum Wohnvorhaben übermittelt werden.


    Nach der Ausführung wird der Vertrag in den Status ''ausgezahlt'' überführt, und
    die Auszahlung der Mittel wird eingeleitet.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - accept_allocation
  institution_id: bausparkasse_heimstatt
- id: dbfa4869-45a9-5102-a06a-4fab66fe57ea
  title: Werkzeugreferenz accept_allocation
  body: 'Das Werkzeug `accept_allocation` wird eingesetzt, um die Zuteilung eines
    Bausparvertrags formal anzunehmen und die Auszahlung zu beantragen.


    **Funktion:**

    Der Agent löst die Zuteilung direkt über dieses Werkzeug aus. Dieser Vorgang ist
    irreversibel.


    **Parameter:**

    - `account_id`: Die eindeutige Kennung des zuteilungsreifen Bausparvertrags (über
    `get_accounts` ermittelt).

    - `project_details`: Eine detaillierte Beschreibung des Wohnvorhabens, für welches
    die Mittel verwendet werden.

    - `payout_request`: Die Bestätigung der gewünschten Auszahlung von Guthaben und
    Darlehen.


    **Auswirkung:**

    Der Bausparvertrag wechselt vom Sparstatus in den Darlehensstatus. Das Guthaben
    wird ausgezahlt und das Darlehen zu den ursprünglich festgesetzten Zinsen bereitgestellt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - accept_allocation
  institution_id: bausparkasse_heimstatt
- id: 9f644bf6-16fa-57fc-8789-2ad25e2bdedd
  title: Wann apply_housing_bonus eingesetzt wird
  body: 'Die Beantragung der Wohnungsbauprämie ist ein zentraler Bestandteil unserer
    Unterstützung bei der Maximierung des Eigenkapitals unserer Kunden. Dieses Verfahren
    wird angewendet, wenn ein Kunde den jährlichen Antrag auf die staatliche Förderung
    für seinen Bausparvertrag stellen möchte, um die staatlichen Zulagen optimal zu
    nutzen.


    Bevor eine statusändernde Aktion durchgeführt wird, muss die Identität des Kunden
    zwingend zweifelsfrei festgestellt werden. Da die Wohnungsbauprämie an spezifische
    steuerliche und einkommensbezogene Voraussetzungen geknüpft ist, sollte der Berater
    den Kunden darauf hinweisen, dass die Bausparkasse Heimstatt eine allgemeine Produktberatung
    bietet, jedoch keine individualisierte Steuerberatung erbringen kann. Für detaillierte
    rechtliche oder steuerliche Fragen wird auf zertifizierte Fachleute verwiesen.


    Der Agent folgt bei der Bearbeitung dieser Anfrage diesen Schritten:


    1. Die Identität des Kunden wird mittels der Funktion verify_identity lückenlos
    geprüft (z. B. durch Ausweisdokumente oder Zwei-Faktor-Authentifizierung).

    2. Zur Ermittlung der korrekten Vertragsnummer wird die Funktion get_accounts
    aufgerufen, sofern der Kunde nur die letzten vier Ziffern seines Kontos angegeben
    hat.

    3. Der Agent prüft im Gespräch, für welches Kalenderjahr die Prämie beantragt
    werden soll und ob der entsprechende Vertrag für staatliche Förderungen zugelassen
    ist.

    4. Der Agent informiert den Kunden über die notwendigen Voraussetzungen für die
    prämienbegünstigte Sparleistung, wie sie auch in der Dokumentation Wohnungsbauprämie
    und Arbeitnehmer-Sparzulage — Überblick beschrieben sind.

    5. Sobald alle notwendigen Informationen vorliegen, führt der Agent die Beantragung
    durch, indem er die Funktion apply_housing_bonus direkt aufruft.


    Nach dem erfolgreichen Aufruf der Funktion wird dem Kunden bestätigt, dass der
    Antrag eingereicht wurde. Die weitere Bearbeitung erfolgt gemäß den gesetzlichen
    Vorgaben und Fristen. Sollten im Zuge dieses Prozesses Unklarheiten über die Voraussetzungen
    bestehen, kann auf das Dokument Wohnungsbauprämie und Arbeitnehmer-Sparzulage
    — Voraussetzungen verwiesen werden.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_housing_bonus
  institution_id: bausparkasse_heimstatt
- id: 7c825da4-efa2-5dc0-bb7c-418ef92d22fa
  title: Werkzeugreferenz apply_housing_bonus
  body: 'Die Funktion apply_housing_bonus wird vom Agenten direkt aufgerufen, um den
    jährlichen Antrag auf die staatliche Wohnungsbauprämie für einen spezifischen
    Bausparvertrag des Kunden einzureichen.


    **Signatur:**

    `apply_housing_bonus(contract_id: string, application_year: string)`


    **Argumente:**

    - `contract_id`: Die eindeutige Kennung des Bausparvertrags, für den die Prämie
    beantragt wird. Diese Information wird über die Funktion get_accounts bezogen.

    - `application_year`: Das Kalenderjahr, für welches die Förderung beantragt wird
    (im Format YYYY), wie es vom Kunden im Gespräch angegeben wurde.


    **Effekt:**

    Das System registriert den Förderantrag für das angegebene Jahr und leitet diesen
    an die zuständige Fachabteilung zur Prüfung der Einkommensgrenzen und der prämienbegünstigten
    Sparleistung weiter. Der Agent führt diese Aktion aus, indem er das Werkzeug aufruft;
    es erfolgt keine Weiterleitung des Kunden an ein externes Portal.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_housing_bonus
  institution_id: bausparkasse_heimstatt
- id: 44cfd0dd-5d97-5a4a-b945-d0b9b744c523
  title: Wann set_up_employee_savings eingesetzt wird
  body: 'Die Einrichtung von vermögenswirksamen Leistungen (VL) ermöglicht es unseren
    Kunden, staatliche Arbeitgeberzulagen direkt in ihren Bausparvertrag fließen zu
    lassen, was die effektive Sparrate erhöht und die Zuteilung beschleunigt.


    Dieses Verfahren wird immer dann eingesetzt, wenn ein Kunde wünscht, dass sein
    Arbeitgeber Beiträge zur Vermögensbildung auf einen bestehenden oder neu eröffneten
    Bausparvertrag bei der Bausparkasse Heimstatt einzahlt.


    Der Agent geht dabei wie folgt vor:


    1. Zunächst erfolgt die zwingende Identitätsprüfung des Kunden über die Funktion
    verify_identity.

    2. Der Agent identifiziert den Zielvertrag mithilfe von get_accounts, falls die
    Vertragsnummer nicht bereits vorliegt.

    3. Der Agent erfragt die vollständigen Daten des Arbeitgebers sowie die gewünschte
    Höhe der monatlichen vermögenswirksamen Leistung, sofern diese nicht bereits durch
    den Arbeitgeber vorgegeben ist.

    4. Der Agent erklärt dem Kunden, dass die Bausparkasse Heimstatt im Rahmen dieses
    Prozesses die notwendige Bescheinigung für den Arbeitgeber ausstellt, damit die
    Zahlungen korrekt zugeordnet werden können.

    5. Der Agent schließt den Vorgang ab, indem er die Funktion set_up_employee_savings
    aufruft.


    Nach der erfolgreichen Ausführung wird der Kunde über die Erstellung der Bescheinigung
    informiert. Sollte der Kunde darüber hinaus Informationen zur Maximierung seines
    Eigenkapitals wünschen, kann auf die Dokumentation Wohnungsbauprämie und Arbeitnehmer-Sparzulage
    — Überblick verwiesen werden, da VL oft mit anderen staatlichen Förderungen kombiniert
    werden.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_employee_savings
  institution_id: bausparkasse_heimstatt
- id: b10dc8e8-4890-5c4c-b84d-ffb1690e3010
  title: Werkzeugreferenz set_up_employee_savings
  body: 'Die Funktion set_up_employee_savings dient dazu, vermögenswirksame Leistungen
    auf einen Bausparvertrag zu richten und die entsprechende Bescheinigung für den
    Arbeitgeber zu generieren.


    **Signatur:**

    `set_up_employee_savings(contract_id: string, employer_details: string)`


    **Argumente:**

    - `contract_id`: Die eindeutige Kennung des Bausparvertrags. Diese wird durch
    den Agenten über get_accounts ermittelt.

    - `employer_details`: Die vom Kunden im Gespräch bereitgestellten Informationen
    zum Arbeitgeber (beispielsweise Name und Anschrift des Unternehmens).


    **Effekt:**

    Das System aktiviert die Funktion für vermögenswirksame Leistungen für den Vertrag
    und erstellt eine Bescheinigung, die dem Kunden zur Vorlage beim Arbeitgeber zur
    Verfügung gestellt wird. Der Agent führt diesen Vorgang direkt durch den Tool-Aufruf
    aus.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_employee_savings
  institution_id: bausparkasse_heimstatt
- id: 4adbc43e-08a3-500f-8f07-42f73bd83d74
  title: Wann apply_loan eingesetzt wird
  body: 'Das Modernisierungsdarlehen ohne Grundschuld ist eine schnelle und unbürokratische
    Finanzierungslösung, die speziell für kleinere Renovierungen und Modernisierungsmaßnahmen
    konzipiert wurde. Dieses Verfahren wird eingesetzt, wenn Kunden eine Finanzierung
    wünschen, die ohne die langwierige Bestellung einer Grundschuld auskommt.


    Da es sich hierbei um die Gewährung eines Darlehens handelt, agieren wir strikt
    nach den regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank sowie
    den Bestimmungen des BGB für Verbraucherdarlehen. Der Agent muss sicherstellen,
    dass alle Konditionen transparent kommuniziert werden, einschließlich des effektiven
    Jahreszinses.


    Der Agent führt die folgenden Schritte aus:


    1. Die Identität des Kunden wird obligatorisch über die Funktion verify_identity
    überprüft.

    2. Der Agent erfragt die genauen Details des Vorhabens (z. B. Art der Renovierung),
    den gewünschten Darlehensbetrag sowie die angestrebte Laufzeit.

    3. Der Agent informiert den Kunden darüber, dass der Antrag eine Kreditwürdigkeitsprüfung
    durch die Fachabteilung nach sich zieht und die endgültige Zusage erst nach dieser
    Prüfung erfolgt.

    4. Der Agent stellt sicher, dass der Kunde die spezifischen Merkmale des Produkts
    versteht, wie sie in Modernisierungsdarlehen ohne Grundschuld — Überblick beschrieben
    sind.

    5. Die Beantragung wird final durch den Aufruf der Funktion apply_loan durchgeführt.


    Nach dem Tool-Aufruf wird der Kunde darüber informiert, dass die Fachabteilung
    die Unterlagen prüft und zeitnah eine Rückmeldung zur Kreditwürdigkeit erfolgt.
    Für eine detaillierte Übersicht der Kosten wird auf Modernisierungsdarlehen ohne
    Grundschuld — Preis- und Leistungsverzeichnis verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: bausparkasse_heimstatt
- id: 2ab508db-47ae-568b-81cf-9c568c04f2db
  title: Werkzeugreferenz apply_loan
  body: 'Die Funktion apply_loan wird vom Agenten verwendet, um einen Antrag auf ein
    Modernisierungsdarlehen ohne Grundschuld im Namen des Kunden zu stellen.


    **Signatur:**

    `apply_loan(amount: number, duration_months: number, project_description: string)`


    **Argumente:**

    - `amount`: Der vom Kunden gewünschte Darlehensbetrag in Euro (€).

    - `duration_months`: Die gewünschte Laufzeit des Darlehens in Monaten.

    - `project_description`: Eine detaillierte Beschreibung des Modernisierungsvorhabens,
    wie sie vom Kunden im Gespräch geschildert wurde.


    **Effekt:**

    Der Antrag wird im System erfasst und an die Kreditprüfungsabteilung weitergeleitet.
    Dies löst automatisch die Prüfung der Kreditwürdigkeit aus. Der Agent führt diese
    Aktion direkt durch den Tool-Aufruf aus, ohne den Kunden an externe Formulare
    zu verweisen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: bausparkasse_heimstatt
- id: 063b6d57-b779-5d1f-af25-e608578efac4
  title: Wann update_beneficiary eingesetzt wird
  body: 'Die Festlegung oder Änderung einer Begünstigung für den Todesfall ist eine
    wichtige Vorsorgemaßnahme, um sicherzustellen, dass das Guthaben eines Bausparvertrags
    im Ereignis eines Todesfalls an die gewünschte Person übergeht.


    Dieses Verfahren wird angewendet, wenn Kunden eine bestehende Begünstigung ändern
    möchten oder zum ersten Mal eine Person als Begünstigten für ihren Vertrag benennen
    wollen.


    Der Agent hält sich an folgende Prozessschritte:


    1. Zuerst erfolgt die zwingende Identitätsprüfung des Kunden über die Funktion
    verify_identity.

    2. Der Agent ermittelt den betroffenen Vertrag mithilfe der Funktion get_accounts.

    3. Der Agent erfragt die vollständigen persönlichen Daten der neuen oder geänderten
    Begünstigungsperson. Erforderlich sind der vollständige Name, das Geburtsdatum
    sowie die aktuellen Kontaktinformationen.

    4. Der Agent weist den Kunden darauf hin, dass die Begünstigung nur für das Guthaben
    im Todesfall gilt und keine generelle Vollmacht über das Konto darstellt.

    5. Der Agent schließt die Änderung ab, indem er die Funktion update_beneficiary
    aufruft.


    Nach der erfolgreichen Aktualisierung bestätigt der Agent dem Kunden die Änderung.
    Sollte der Kunde darüber hinaus Fragen zur allgemeinen Sicherheit seiner Daten
    haben, kann auf die Dokumentation Bausparvertrag Heimstatt Classic — Sicherheitstipps
    für Ihr Konto verwiesen werden, sofern ein Classic-Vertrag vorliegt.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: bausparkasse_heimstatt
- id: f2945bd9-8eda-5426-85bd-350221d091f1
  title: Werkzeugreferenz update_beneficiary
  body: 'Die Funktion update_beneficiary wird genutzt, um die im Bausparvertrag hinterlegte
    Begünstigung für den Todesfall festzulegen oder zu aktualisieren.


    **Signatur:**

    `update_beneficiary(contract_id: string, full_name: string, dob: string, contact_info:
    string)`


    **Argumente:**

    - `contract_id`: Die Kennung des betroffenen Bausparvertrags (aus get_accounts).

    - `full_name`: Der vollständige Name der Begünstigungsperson, wie vom Kunden angegeben.

    - `dob`: Das Geburtsdatum der Begünstigungsperson (im Format TT.MM.JJJJ).

    - `contact_info`: Die Kontaktdaten der Begünstigungsperson (z. B. Adresse oder
    Telefonnummer).


    **Effekt:**

    Die Begünstigungsdaten im Vertrag werden sofort aktualisiert. Der Agent führt
    diese Aktion direkt durch den Tool-Aufruf aus.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: bausparkasse_heimstatt
- id: 3b1c28bd-9318-5ae9-ae13-e3f5b4170ab3
  title: Wann open_account eingesetzt wird
  body: 'Das Eröffnen eines neuen Bausparvertrags ist der erste Schritt für Familien
    und zukünftige Eigenheimbesitzer, um Planungssicherheit durch feste Zinsen zu
    gewinnen. Dieses Verfahren wird eingesetzt, wenn ein Neukunde oder ein Bestandskunde
    ein weiteres Produkt zur Wohnungsfinanzierung oder privaten Vorsorge abschließen
    möchte.


    Der Agent muss den Kunden umfassend über die verfügbaren Optionen beraten, insbesondere
    über den Unterschied zwischen dem Bausparvertrag Heimstatt Classic (ausgewogene
    Basisoption) und dem Bausparvertrag Heimstatt Rendite (Fokus auf Guthabenzinsen).


    Der Agent folgt diesen Schritten:


    1. Die Identität des Kunden wird über die Funktion verify_identity lückenlos geprüft.

    2. Der Agent führt eine Bedarfsanalyse durch, um das passende Produkt zu empfehlen.
    Hierbei wird auf die jeweiligen Produktübersichten, wie Bausparvertrag Heimstatt
    Classic — Überblick oder Bausparvertrag Heimstatt Rendite — Überblick, verwiesen.

    3. Der Agent vereinbart mit dem Kunden die Bausparsumme sowie den ersten Einzahlungsbetrag.

    4. Der Agent informiert den Kunden transparent über die anfallenden Abschlussgebühren,
    die der Deckung des administrativen Aufwands zur langfristigen Zinssicherung dienen.
    Er weist darauf hin, dass diese bei besonders hohen Vertragsvolumina reduziert
    oder erlassen werden können.

    5. Der Agent schließt den Vertrag ab, indem er die Funktion open_account aufruft.


    Nach dem erfolgreichen Aufruf wird dem Kunden der neue Vertrag bestätigt. Für
    Informationen zum weiteren Vorgehen wird auf Bausparvertrag Heimstatt Classic
    — abschließen und aktivieren verwiesen, sofern dieses Produkt gewählt wurde.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: bausparkasse_heimstatt
- id: cebfed36-7549-5b36-a044-2fd691345d43
  title: Werkzeugreferenz open_account
  body: 'Die Funktion open_account wird vom Agenten verwendet, um einen neuen Bausparvertrag
    im System zu eröffnen.


    **Signatur:**

    `open_account(product_id: string, contract_sum: number, initial_contribution:
    number)`


    **Argumente:**

    - `product_id`: Die interne ID des gewählten Produkts (z. B. `bausparen_classic`
    oder `bausparen_rendite`).

    - `contract_sum`: Die vereinbarte Bausparsumme in Euro (€).

    - `initial_contribution`: Der erste Einzahlungsbetrag in Euro (€), den der Kunde
    bei Eröffnung leistet.


    **Effekt:**

    Es wird ein neuer Bausparvertrag mit den angegebenen Konditionen erstellt und
    eine Vertragsnummer generiert. Der Agent führt diese Aktion direkt durch den Tool-Aufruf
    aus.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: bausparkasse_heimstatt
- id: 1fc7f35e-9e56-5c39-a289-1f9430f7823a
  title: Wann close_account eingesetzt wird
  body: 'Die Schließung eines Bausparvertrags ist ein irreversibler Vorgang, der eine
    sorgfältige Prüfung und Verifizierung des Kunden erfordert. Das Werkzeug close_account
    wird eingesetzt, wenn ein Kunde den ausdrücklichen Wunsch geäußert hat, seinen
    Vertrag vorzeitig oder zum Laufzeitende zu kündigen und das angesparte Guthaben
    inklusive Zinsen auszahlen zu lassen.


    Um diesen Prozess gemäß unseren Sicherheits- und Compliance-Richtlinien durchzuführen,
    muss der Agent die folgenden Schritte strikt einhalten:


    1. Identitätsprüfung: Bevor Informationen zu einem Konto abgerufen oder Änderungen
    vorgenommen werden, muss die Identität des Kunden zweifelsfrei festgestellt werden.
    Rufen Sie hierzu das Werkzeug verify_identity auf. Ohne erfolgreiche Verifizierung
    darf kein weiterer Schritt eingeleitet werden.


    2. Kontenidentifikation: Da Kunden oft mehrere Verträge besitzen, muss das spezifische
    Konto identifiziert werden. Verwenden Sie get_accounts, um eine Übersicht aller
    aktiven Verträge des Kunden zu erhalten und die korrekte Account-ID zu ermitteln.
    Sollte der Kunde nur die letzten vier Ziffern der Kontonummer nennen, dient get_accounts
    zur eindeutigen Zuordnung.


    3. Aufklärung über die Kündigungsfrist: Der Agent muss den Kunden explizit darauf
    hinweisen, dass eine Kündigung mit einer Frist von drei Monaten erfolgt. Es ist
    zu klären, ob der Kunde mit dieser Frist einverstanden ist und dass eine Auszahlung
    des Guthabens erst nach Ablauf dieser Zeit erfolgt.


    4. Durchführung der Schließung: Sobald die Identität bestätigt, das Konto eindeutig
    identifiziert und die Kündigungsfrist kommuniziert wurde, wird das Werkzeug close_account
    mit der entsprechenden Account-ID aufgerufen.


    5. Bestätigung: Nach dem erfolgreichen Aufruf des Werkzeugs ist dem Kunden schriftlich
    oder mündlich zu bestätigen, dass der Kündigungsprozess eingeleitet wurde und
    wann mit der Auszahlung des Guthabens zu rechnen ist.


    Für detaillierte Informationen zum Ablauf der Kündigung bei spezifischen Produkten
    verweisen wir auf das Dokument Bausparvertrag Heimstatt Classic — kündigen, schließen
    oder den Tarif wechseln.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: bausparkasse_heimstatt
- id: 3fa9f322-5a04-5b61-809b-918c0c45e814
  title: Werkzeugreferenz close_account
  body: 'Das Werkzeug close_account dient der förmlichen Kündigung eines Bausparvertrags
    und der Einleitung des Auszahlungsprozesses für das vorhandene Guthaben.


    Der Agent führt diese Aktion direkt durch den Aufruf des Werkzeugs aus, nachdem
    die Identität des Kunden verifiziert wurde.


    **Signatur und Parameter:**

    - account_id (String): Die eindeutige Kennung des zu schließenden Bausparvertrags.
    Diese ID muss zuvor über get_accounts ermittelt worden sein.


    **Effekt:**

    Das System setzt den Status des Vertrags auf „gekündigt“. Es wird eine Kündigungsfrist
    von drei Monaten hinterlegt. Nach Ablauf dieser Frist wird das Guthaben automatisch
    auf das hinterlegte Referenzkonto des Kunden ausgezahlt. Dieser Vorgang ist irreversibel.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: bausparkasse_heimstatt
- id: 9c309757-035b-57ea-b40c-ef994470ae5b
  title: Wann get_accounts eingesetzt wird
  body: 'Das Werkzeug get_accounts ist der zentrale Ausgangspunkt für nahezu jede
    kundenbezogene Transaktion innerhalb unserer Bausparkassen-Systeme. Es wird eingesetzt,
    um eine vollständige Übersicht aller Verträge und Konten zu erhalten, die auf
    den Namen des verifizierten Kunden registriert sind.


    In der Praxis wird get_accounts in folgenden Szenarien verwendet:


    1. Zuordnung von Verträgen: Wenn ein Kunde ein Anliegen zu einem „Bausparvertrag“
    hat, ohne eine genaue Account-ID zu nennen (z. B. „ich möchte meinen Classic-Vertrag
    prüfen“), ermöglicht get_accounts dem Agenten, alle verfügbaren Konten aufzulisten
    und die richtige ID zu identifizieren.


    2. Validierung von Kontoständen: Bevor spezifische Änderungen wie eine Erhöhung
    der Bausparsumme oder eine Sonderzahlung vorgenommen werden, dient der Abruf über
    get_accounts zur Sicherstellung, dass das Konto aktiv und für die gewünschte Aktion
    zugänglich ist.


    3. Vorbereitung weiterer Werkzeuge: Viele statusändernde Werkzeuge (wie close_account
    oder change_savings_rate) benötigen eine präzise Account-ID. get_accounts ist
    das autoritative Mittel, um diese ID sicher zu beziehen.


    **Verfahrensablauf für den Agenten:**


    1. Identitätsprüfung: Rufen Sie zwingend verify_identity auf, um sicherzustellen,
    dass der Gesprächspartner berechtigt ist, Einblick in die Kontodaten zu erhalten.


    2. Abruf der Kontenliste: Rufen Sie get_accounts auf. Das System gibt eine Liste
    aller zugehörigen Konten mit den jeweiligen IDs, Produktbezeichnungen (z. B. Bausparvertrag
    Heimstatt Classic) und dem aktuellen Status zurück.


    3. Abgleich mit dem Kunden: Der Agent gleicht die gefundenen Konten mit den Angaben
    des Kunden ab, um Verwechslungen zu vermeiden, bevor weitere Schritte eingeleitet
    werden.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: bausparkasse_heimstatt
- id: 0ea65901-4284-5e95-ba30-94b898593434
  title: Werkzeugreferenz get_accounts
  body: 'Das Werkzeug get_accounts ruft alle mit dem aktuell verifizierten Kunden
    verknüpften Bausparverträge und Kontoinformationen ab.


    Der Agent führt diese Aktion durch den direkten Aufruf des Werkzeugs aus. Da das
    Werkzeug im Kontext der bereits verifizierten Sitzung operiert, ist keine manuelle
    Eingabe einer Kunden-ID erforderlich.


    **Signatur und Parameter:**

    - Keine Parameter erforderlich.


    **Effekt:**

    Das Werkzeug gibt eine strukturierte Liste aller Konten zurück. Diese Liste enthält
    für jedes Konto die Account-ID, den Produktnamen, das aktuelle Guthaben und den
    Status des Vertrags (z. B. „sparend“, „zuteilungsfähig“ oder „darlehensphase“).
    Diese Informationen sind die Grundlage für alle weiteren vertragsspezifischen
    Aktionen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: bausparkasse_heimstatt
- id: cca4d354-df0e-5a28-b4a5-e481fdaaa539
  title: Wann update_contact_info eingesetzt wird
  body: "Die Aktualisierung von Kontaktdaten ist ein wesentlicher Prozess, um die\
    \ Erreichbarkeit des Kunden sicherzustellen und die Zustellung wichtiger Dokumente\
    \ (wie Zuteilungsbenachrichtigungen) zu gewährleisten. Das Werkzeug update_contact_info\
    \ wird immer dann eingesetzt, wenn ein Kunde eine Änderung seiner Postanschrift,\
    \ Telefonnummer oder E-Mail-Adresse meldet.\n\nUm die Integrität der Kundendaten\
    \ zu wahren, muss der Agent wie folgt vorgehen:\n\n1. Identitätsprüfung: Vor jeder\
    \ Änderung von Stammdaten ist eine eindeutige Identitätsprüfung zwingend erforderlich.\
    \ Verwenden Sie hierzu verify_identity.\n\n2. Erfassung der neuen Daten: Der Agent\
    \ muss die neuen Informationen präzise vom Kunden abfragen. Dies umfasst:\n  \
    \ - Die vollständige neue Anschrift (Straße, Hausnummer, PLZ, Ort).\n   - Die\
    \ aktuelle Telefonnummer.\n   - Die gültige E-Mail-Adresse für den digitalen Zugang\
    \ zum Kundenportal.\n\n3. Validierung: Der Agent sollte die Daten kurz wiederholen,\
    \ um Übertragungsfehler zu vermeiden.\n\n4. Durchführung der Aktualisierung: Das\
    \ Werkzeug update_contact_info wird aufgerufen, wobei nur die Felder aktualisiert\
    \ werden, für die der Kunde eine Änderung gewünscht hat.\n\n5. Bestätigung: Der\
    \ Kunde wird darüber informiert, dass die Daten im System aktualisiert wurden\
    \ und dass dies auch Auswirkungen auf die Korrespondenz mit regionalen Filialen\
    \ und der zentralen Hotline hat.\n\nSollte der Kunde zusätzlich den Zugriff auf\
    \ sein digitales Kundenportal ändern wollen, ist dies im Rahmen dieser Aktualisierung\
    \ mit zu berücksichtigen."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: bausparkasse_heimstatt
- id: 91ab0d76-3480-5fad-9da1-9275abbc65e3
  title: Werkzeugreferenz update_contact_info
  body: 'Das Werkzeug update_contact_info aktualisiert die Stammdaten eines Kunden
    in der zentralen Datenbank der Bausparkasse Heimstatt.


    Der Agent führt diese Aktion durch den direkten Aufruf des Werkzeugs aus, nachdem
    die Identität des Kunden erfolgreich bestätigt wurde.


    **Signatur und Parameter:**

    - address (String, optional): Die neue Postanschrift des Kunden.

    - phone_number (String, optional): Die neue Telefonnummer.

    - email_address (String, optional): Die neue E-Mail-Adresse.


    **Effekt:**

    Die angegebenen Informationen werden im Kundenprofil überschrieben. Alle zukünftigen
    Benachrichtigungen und rechtlichen Dokumente werden an die aktualisierten Kontaktdaten
    versendet. Felder, die beim Aufruf leer gelassen werden, bleiben unverändert.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: bausparkasse_heimstatt
- id: 6caf6943-a490-55e0-a033-32ecc7681c80
  title: Wann get_statements eingesetzt wird
  body: 'Kunden haben ein Recht auf Transparenz über ihre Einzahlungen und die Entwicklung
    ihres Bausparvertrags. Das Werkzeug get_statements wird eingesetzt, wenn ein Kunde
    Kontoauszüge, eine Übersicht über seine geleisteten Sparbeiträge oder eine Bestätigung
    des aktuellen Guthabenstands für einen bestimmten Zeitraum anfordert.


    Der Agent folgt diesem Prozess:


    1. Identitätsprüfung: Rufen Sie verify_identity auf. Da Kontoauszüge sensible
    Finanzinformationen enthalten, ist eine strikte Verifizierung unumgänglich.


    2. Kontoauswahl: Verwenden Sie get_accounts, um die Account-ID des betreffenden
    Vertrags zu ermitteln, falls der Kunde nicht bereits eine eindeutige ID angegeben
    hat.


    3. Zeitraumbestimmung: Der Agent klärt mit dem Kunden, für welchen Zeitraum (z.
    B. das letzte Kalenderjahr oder ein spezifisches Quartal) die Auszüge benötigt
    werden.


    4. Abruf der Dokumente: Das Werkzeug get_statements wird mit der Account-ID und
    dem gewünschten Zeitraum aufgerufen.


    5. Bereitstellung: Der Agent informiert den Kunden darüber, wie die Auszüge bereitgestellt
    werden (z. B. durch Bereitstellung im digitalen Kundenportal oder durch Versand
    an die hinterlegte Adresse).


    Dies ist besonders wichtig bei Anfragen im Zusammenhang mit der staatlichen Förderung,
    um die prämienbegünstigte Sparleistung nachzuweisen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: bausparkasse_heimstatt
- id: 4e09af51-528d-55ca-b494-45e5cd27e5cd
  title: Werkzeugreferenz get_statements
  body: 'Das Werkzeug get_statements generiert oder ruft bestehende Kontoauszüge und
    Transaktionslisten für einen spezifischen Bausparvertrag ab.


    Der Agent führt diese Aktion durch den direkten Aufruf des Werkzeugs aus, nachdem
    die Identität des Kunden verifiziert wurde.


    **Signatur und Parameter:**

    - account_id (String): Die eindeutige Kennung des Vertrags, für den die Auszüge
    angefordert werden (via get_accounts zu beziehen).

    - period (String): Der Zeitraum, für den die Auszüge erstellt werden sollen (z.
    B. „2023“ oder „Q1 2024“).


    **Effekt:**

    Das System generiert die entsprechenden Dokumente, die den Verlauf der Einzahlungen,
    Zinsgutschriften und etwaige Sonderzahlungen detailliert auflisten. Diese Dokumente
    werden dem Kunden über den definierten Kommunikationskanal zur Verfügung gestellt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: bausparkasse_heimstatt
- id: 499e97f7-51d5-5094-8840-f32c5acb9806
  title: Wann set_alerts eingesetzt wird
  body: 'Um unseren Kunden eine optimale Planungssicherheit zu bieten, ermöglicht
    die Bausparkasse Heimstatt die individuelle Konfiguration von Benachrichtigungen.
    Das Werkzeug set_alerts wird eingesetzt, wenn Kunden definieren möchten, über
    welche Ereignisse sie informiert werden wollen und über welchen Kanal dies geschehen
    soll.


    Typische Anwendungsfälle sind Benachrichtigungen bei:

    - Erreichen einer bestimmten Bewertungszahl.

    - Zuteilungsfähigkeit des Vertrags.

    - Fälligkeit von Sonderzahlungen oder Prämienanträgen.


    **Verfahrensablauf für den Agenten:**


    1. Identitätsprüfung: Bevor Benachrichtigungseinstellungen geändert werden, muss
    verify_identity erfolgreich aufgerufen werden.


    2. Bedarfsanalyse: Der Agent fragt den Kunden, für welche Ereignisse er Alarme
    wünscht und welche Kommunikationswege (E-Mail, SMS oder Portal-Benachrichtigung)
    bevorzugt werden.


    3. Konfiguration: Das Werkzeug set_alerts wird aufgerufen, um die gewünschten
    Benachrichtigungstypen und Kanäle zu hinterlegen.


    4. Bestätigung: Der Agent bestätigt dem Kunden, dass die Alarme aktiviert wurden
    und erklärt kurz, in welcher Form die Benachrichtigungen erfolgen werden.


    Durch die Nutzung von set_alerts unterstützen wir unsere Kunden dabei, staatliche
    Förderungen optimal zu nutzen und den Zeitpunkt der Zuteilung nicht zu versäumen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
