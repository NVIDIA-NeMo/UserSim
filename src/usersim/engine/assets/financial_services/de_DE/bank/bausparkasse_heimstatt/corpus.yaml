- id: 96580551-bfdc-5abd-8973-c978fd5c8187
  title: Modernisierungsdarlehen ohne Grundschuld — rechtliche Hinweise
  body: 'Die Bausparkasse Heimstatt agiert bei der Vergabe des Modernisierungsdarlehens
    ohne Grundschuld strikt nach den regulatorischen Vorgaben der BaFin und der Deutschen
    Bundesbank sowie den Bestimmungen des Bürgerlichen Gesetzbuches (BGB) für Verbraucherdarlehen.


    Transparenz und Offenlegung:

    Alle Produkte werden mit vollständigen Informationen kommuniziert. Dies umfasst
    insbesondere die Angabe des effektiven Jahreszinses, der alle Kosten des Kredits
    widerspiegelt. In unserem repräsentativen Beispiel für eine Summe von 20.000 €
    über 120 Monate beträgt dieser 4,9 %. Die Gesamtkosten belaufen sich in diesem
    Beispiel auf 5.214,40 €.


    Sicherheit und Einlagensicherung:

    Wir weisen ausdrücklich auf die gesetzliche Einlagensicherung hin, die die Guthaben
    unserer Kunden schützt. Die Sicherheit Ihrer Daten wird durch strikte Verifikationsprotokolle
    gewährleistet; vor jeder statusändernden Aktion ist eine eindeutige Identitätsprüfung
    zwingend erforderlich.


    Beratungsgrenzen:

    Wir bieten Ihnen eine umfassende Produktberatung und finanzielle Bildung an. Bitte
    beachten Sie jedoch, dass die Bausparkasse Heimstatt keine individualisierte Steuer-
    oder Rechtsberatung erbringt. Für spezifische rechtliche Fragen zum Immobilienrecht
    oder steuerliche Details bei Modernisierungen verweisen wir an zertifizierte Fachleute.


    Bearbeitung von Beschwerden:

    Beschwerden werden fair, transparent und unter Einhaltung gesetzlicher Fristen
    bearbeitet. Im Falle eines Verdachts auf Betrug erfolgt eine sofortige Sperrung
    der betroffenen Konten sowie eine Meldung an die zuständigen Aufsichtsbehörden.
    Bei SEPA-Rückgaben gelten die gesetzlichen Fristen von acht Wochen.'
