- id: d68a3896-16e9-5c94-a71f-565272f45dee
  title: Modernisierungsdarlehen ohne Grundschuld — Status oder Verlauf einsehen
  body: 'Wenn Sie bereits ein Modernisierungsdarlehen ohne Grundschuld bei uns führen,
    können Sie jederzeit den aktuellen Status Ihres Darlehens sowie den bisherigen
    Rückzahlungsverlauf einsehen. Gehen Sie dazu bitte wie folgt vor:


    1. **Identitätsprüfung**: Da es sich um sensible Kontoinformationen handelt, führen
    wir zunächst eine eindeutige Identitätsprüfung durch. Bitte halten Sie hierfür
    ein gültiges Ausweisdokument bereit oder nutzen Sie die Zwei-Faktor-Authentifizierung
    über Ihr digitales Kundenportal.


    2. **Anforderung der Informationen**: Teilen Sie uns mit, welche Informationen
    Sie benötigen. Sie können entweder den aktuellen Kontostand (das noch offene Restdarlehen)
    oder eine detaillierte Aufstellung der bereits geleisteten Tilgungen anfordern.


    3. **Überprüfung des Verlaufs**: Wir stellen Ihnen eine Übersicht bereit, aus
    der hervorgeht, wie viele der vereinbarten Monate (im Beispielmodell 120 Monate)
    bereits vergangen sind und welche Beträge bereits verrechnet wurden.


    4. **Bestätigung des Status**: Wir bestätigen Ihnen abschließend schriftlich oder
    digital den aktuellen Status Ihres Vertrags, einschließlich der noch ausstehenden
    Gesamtsumme.


    Sollten Sie feststellen, dass die aufgeführten Beträge nicht mit Ihren eigenen
    Aufzeichnungen übereinstimmen, wenden Sie sich bitte an uns, damit wir die Differenzen
    prüfen können. Für Unterstützung bei Unstimmigkeiten ist das Dokument Modernisierungsdarlehen
    ohne Grundschuld — Abweichung von Ihren Unterlagen relevant.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 718f93ea-888a-50b1-9a5c-4f574b01f5c7
  title: Modernisierungsdarlehen ohne Grundschuld — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf ein Modernisierungsdarlehen ohne Grundschuld
    abgelehnt wird oder ein bestehender Vorgang gesperrt wird. Hier erfahren Sie,
    woran das liegen kann und wie wir gemeinsam eine Lösung finden.


    **Symptom: Der Darlehensantrag wurde abgelehnt.**

    Die häufigsten Ursachen hierfür sind:

    - Eine nicht ausreichende Bonität im Verhältnis zur gewünschten Darlehenssumme
    (bis zu 50.000 €).

    - Unvollständige oder nicht nachvollziehbare Einkommensnachweise.

    - Eine Überschreitung des maximal zulässigen Kreditrahmens für unbesicherte Modernisierungsdarlehen.


    **Symptom: Der Vorgang wurde aus Sicherheitsgründen gesperrt.**

    Dies geschieht in der Regel, wenn

    - die erforderliche Identitätsprüfung (z. B. Ausweisdokumente oder Zwei-Faktor-Authentifizierung)
    nicht erfolgreich abgeschlossen wurde.

    - Unstimmigkeiten in den persönlichen Daten vorliegen.

    - ein konkreter Verdacht auf Betrug besteht.


    **Lösungsschritte**:

    1. **Unterlagen prüfen**: Bitte prüfen Sie, ob alle eingereichten Dokumente aktuell
    und vollständig sind. Reichen Sie fehlende Nachweise nach.

    2. **Identität verifizieren**: Falls die Sperrung auf einer fehlgeschlagenen Verifizierung
    beruht, führen Sie die Identitätsprüfung erneut durch, idealerweise persönlich
    in einer unserer regionalen Filialen.

    3. **Beratungsgespräch**: Vereinbaren Sie einen Termin, um die Finanzierungsparameter
    (z. B. Laufzeit oder Summe) anzupassen, damit sie besser zu Ihrer aktuellen finanziellen
    Situation passen.


    **Eskalation**:

    Sollte eine Lösung auf der ersten Ebene nicht möglich sein, wird der Vorgang hierarchisch
    über die Filialleitung an die zuständige Fachabteilung oder das Beschwerdemanagement
    weitergeleitet. Sie erhalten innerhalb der gesetzlichen Fristen eine schriftliche
    Begründung der Ablehnung oder eine Mitteilung über die Aufhebung der Sperre.'
