- id: bf784601-b360-56c8-99fb-afd61ca594d3
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Schutz vor Betrug und nicht
    autorisierten Vorgängen
  body: 'Die Sicherheit Ihres Vermögens und der Schutz Ihrer persönlichen Daten haben
    für die Bausparkasse Heimstatt oberste Priorität. Im Zusammenhang mit staatlichen
    Förderungen wie der Wohnungsbauprämie und der Arbeitnehmer-Sparzulage beobachten
    wir vereinzelt Versuche Dritter, Kunden durch Täuschung zu manipulieren.


    Ein häufiges Muster ist die Kontaktaufnahme durch Personen, die vorgeben, Mitarbeiter
    staatlicher Behörden oder Finanzberater zu sein. Diese versprechen oft eine Erhöhung
    der gesetzlichen Prämiensätze über die festgeschriebenen 10 % für die Wohnungsbauprämie
    oder 9 % für die Arbeitnehmer-Sparzulage hinaus, sofern Sie bestimmte Gebühren
    im Voraus zahlen oder Kontodaten preisgeben. Bitte beachten Sie: Die Förderquoten
    sind gesetzlich festgeschrieben; es gibt keine „Sonderprogramme“, die diese Sätze
    durch private Vorauszahlungen steigern.


    Wir weisen Sie ausdrücklich darauf hin, dass die Bausparkasse Heimstatt Sie niemals
    per E-Mail, SMS oder Telefon dazu auffordern wird, Ihre Passwörter, Zwei-Faktor-Authentifizierungs-Codes
    oder vollständige Kreditkartendaten preiszugeben. Jede statusändernde Aktion an
    Ihrem Vertrag erfordert eine strikte Identitätsprüfung durch Ausweisdokumente
    oder unsere gesicherten Verifikationsprotokolle.


    Sollten Sie eine Nachricht erhalten haben, die Ihnen ungewöhnliche Renditen oder
    eine beschleunigte Auszahlung staatlicher Zulagen verspricht, ist dies ein deutliches
    Warnsignal. Wenn Sie den Verdacht haben, Opfer eines Betrugsversuchs geworden
    zu sein oder eine nicht autorisierte Änderung an Ihren Förderanträgen bemerken,
    informieren Sie uns bitte umgehend. In Fällen eines bestätigten Betrugsverdachts
    werden wir die betroffenen Konten sofort sperren und die Meldung an die zuständigen
    Aufsichtsbehörden einleiten, um weiteren Schaden abzuwenden.


    Für weitere Informationen zur allgemeinen Sicherheit Ihrer Verträge verweisen
    wir auf das Dokument Bausparvertrag Heimstatt Classic — Sicherheitstipps für Ihr
    Konto.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: security_advisory
