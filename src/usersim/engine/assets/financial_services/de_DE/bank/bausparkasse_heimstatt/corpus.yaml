- id: 19625bd3-5263-521f-b900-8d837e993b2b
  title: Modernisierungsdarlehen ohne Grundschuld — Voraussetzungen
  body: 'Die folgende Matrix beschreibt die Voraussetzungen für die Gewährung eines
    Modernisierungsdarlehens ohne Grundschuld bei der Bausparkasse Heimstatt.


    | Voraussetzung | Bedingung / Schwellenwert | Ergebnis |

    | :--- | :--- | :--- |

    | Darlehenshöhe | Bis maximal 50.000 € | Förderfähig |

    | Identität | Eindeutige Prüfung (Ausweis/2FA) | Zwingend erforderlich für Vertragsschluss
    |

    | Verwendungszweck | Modernisierung/Renovierung von Wohneigentum | Produktzugang
    gewährt |

    | Bonität | Positive Kreditwürdigkeit gemäß interner Richtlinien | Kreditbewilligung
    möglich |

    | Absicherung | Verzicht auf Grundschuld | Schnellerer Prozess, begrenzte Summe
    |


    Kunden, die eine Summe von über 50.000 € benötigen, können dieses spezifische
