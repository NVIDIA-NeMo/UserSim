- id: 2e4302a3-8b5c-54aa-9c6c-119ad3fe6c0c
  title: 'Bausparvertrag Heimstatt Classic — monatlicher Regelsparbeitrag in Prozent
    der Bausparsumme: Erklärung'
  body: "**Was bedeutet der monatliche Regelsparbeitrag von 0,4 %?**\n\nDer Regelsparbeitrag\
    \ ist der Betrag, den Sie idealerweise jeden Monat in Ihren Bausparvertrag einzahlen,\
    \ um einen stetigen Fortschritt in Richtung der Zuteilung zu erzielen. Beim Bausparvertrag\
    \ Heimstatt Classic ist dieser Betrag auf 0,4 % der vereinbarten Bausparsumme\
    \ festgesetzt.\n\n**Wie berechnet sich dieser Betrag konkret?**\n\nDie Berechnung\
    \ ist einfach: Sie nehmen Ihre Bausparsumme und multiplizieren diese mit 0,004.\
    \ \n\n*Beispiel:* Bei einer Bausparsumme von 10.000 € ergibt sich ein monatlicher\
    \ Regelsparbeitrag von 40 € (10.000 € x 0,4 % = 40 €).\n\n**Muss ich genau diesen\
    \ Betrag einzahlen?**\n\nDer Regelsparbeitrag dient als Orientierung für eine\
    \ planmäßige Erreichung des Mindestsparguthabens von 40 %. Sie können jedoch auch\
    \ höhere Beträge einzahlen, um die Zuteilungsreife Ihres Vertrages zu beschleunigen.\
    \ Auf alle eingezahlten Beträge erhalten Sie den Guthabenzins von 0,5 %.\n\nWeitere\
    \ Informationen zu den Kosten finden Sie im Dokument Bausparvertrag Heimstatt\
    \ Classic — Preis- und Leistungsverzeichnis."
  domain: retail_banking
  product_category: bausparen_classic
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 3214f4d6-d97a-5998-a51c-3babdccad248
  title: Bausparvertrag Heimstatt Classic — ein typisches Anliegen vollständig erledigen
  body: 'Ein häufiges Anliegen unserer Kunden ist die Anpassung des monatlichen Sparbetrags,
    um beispielsweise die Zuteilungsreife schneller zu erreichen. So erledigen Sie
    diesen Vorgang vollständig.


    **Voraussetzungen**

    Um Änderungen an Ihrem Vertrag vorzunehmen, ist eine eindeutige Identitätsprüfung
    (z. B. durch Ausweisdokumente oder Zwei-Faktor-Authentifizierung) zwingend erforderlich.


    **Schritte zur Anpassung des Sparbetrags**


    1. **Identitätsprüfung durchführen**: Legen Sie uns Ihren gültigen Personalausweis
    vor oder bestätigen Sie Ihre Identität über das digitale Portal. Erst nach erfolgreicher
    Prüfung können wir statusändernde Aktionen vornehmen.

    2. **Aktuellen Stand prüfen**: Wir teilen Ihnen Ihren derzeitigen monatlichen
    Sparbetrag mit (basierend auf dem Regelsparbeitrag von 0,4 % der Bausparsumme)
    und informieren Sie über Ihr aktuelles Guthaben im Verhältnis zum Mindestsparguthaben
    von 40 %.

    3. **Neuen Sparbetrag festlegen**: Nennen Sie uns den neuen Betrag, den Sie ab
    dem nächsten Monat einzahlen möchten. Beachten Sie, dass höhere Einzahlungen die
    Bewertungzahl Ihres Vertrages schneller erhöhen.

    4. **Bestätigung der Änderung**: Wir prüfen die neue Rate auf Plausibilität und
    bestätigen Ihnen die Änderung schriftlich oder digital. Wir informieren Sie zudem
    darüber, dass auf den erhöhten Betrag weiterhin der Guthabenzins von 0,5 % angewendet
    wird.


    **Ergebnis**

    Ihr monatlicher Sparbeitrag wurde erfolgreich angepasst. Sie beschleunigen damit
    den Weg zur Zuteilung Ihres Darlehens zum festen Zins von 2,45 %.


    Für weitere Änderungen an Ihrem Vertrag lesen Sie bitte Bausparvertrag Heimstatt
    Classic — etwas ändern.'
