  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 91509b3e-3e68-50e2-8c2a-4ea74e6a2d77
  title: Bausparvertrag Heimstatt Classic — aktuelles Angebot
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    wir freuen uns, Ihnen ein exklusives Angebot zur Erweiterung Ihrer Vorsorge vorstellen
    zu dürfen. Für alle bestehenden Kunden der Bausparkasse Heimstatt, die bis zum
    31.12.2024 einen zusätzlichen Bausparvertrag Heimstatt Classic mit einer Bausparsumme
    von über 50.000 € abschließen, bieten wir eine Reduktion der Abschlussgebühr an.


    Statt der regulären Abschlussgebühr von 1,6 % berechnen wir für diese speziellen
    Vertragsvolumina lediglich eine reduzierte Gebühr von 1,2 % der Bausparsumme.
    Alle weiteren Konditionen bleiben unverändert:

    - Guthabenzins: 0,5 %

    - Darlehenszins: 2,45 %

    - Regelmäßiger monatlicher Sparbeitrag: 0,4 % der Bausparsumme


    Dieses Angebot gilt befristet vom 01.10.2024 bis zum 31.12.2024. Nutzen Sie diese
    Gelegenheit, um Ihr Eigenkapital für zukünftige Bauvorhaben kostengünstiger zu
    sichern. Sprechen Sie uns einfach bei Ihrem nächsten Besuch in der Filiale oder
    über das Kundenportal an, um von diesem Vorteil zu profitieren.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 035b53e0-7b86-51ad-92ef-5bb4e05f1f58
  title: Bausparvertrag Heimstatt Classic — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Der Bausparvertrag Heimstatt Classic ist eine langfristige Anlage für Ihre
    Zukunft. Aufgrund der Attraktivität fester Zinsen und staatlicher Förderungen
    können betrügerische Akteure versuchen, Kunden durch Täuschungen zu schädigen.
    Wir bitten Sie, bei folgenden Mustern besonders wachsam zu sein:


    1. Gefälschte Zuteilungsbenachrichtigungen: Betrüger versenden oft E-Mails oder
    Briefe, die eine sofortige Zuteilung Ihres Darlehens vortäuschen. In diesen Schreiben
    werden Sie aufgefordert, eine vermeintliche „Bearbeitungsgebühr“ oder eine Anzahlung
    auf ein fremdes Konto zu leisten, um den Prozess zu beschleunigen. Die Bausparkasse
    Heimstatt fordert niemals Zahlungen auf private Konten oder über Drittanbieter-Payment-Services
    an.


    2. Druck durch Zeitnot: Wenn Sie dazu gedrängt werden, innerhalb weniger Stunden
    eine Entscheidung zu treffen oder sensible Daten preiszugeben, handelt es sich
    höchstwahrscheinlich um einen Betrugsversuch. Seriöse Beratungen und Vertragsprozesse
    bei uns erfolgen transparent und in Ihrem Tempo.


    3. Abfrage von Sicherheitsmerkmalen: Wir werden Sie niemals per E-Mail, SMS oder
    Telefon nach Ihrem Passwort, Ihrer Zwei-Faktor-Authentifizierung (2FA) oder Ihren
    vollständigen Kreditkartendaten fragen. Solche Informationen sind ausschließlich
    in unserem gesicherten Kundenportal oder bei einem persönlichen Termin in einer
    Filiale unter Vorlage eines gültigen Ausweisdokuments zu verwenden.


    Sollten Sie eine verdächtige Kommunikation erhalten haben, ist die sofortige Meldung
    an uns entscheidend. Im Falle einer nicht autorisierten Kontobewegung oder eines
    Verdachts auf Betrug führen wir eine sofortige Sperrung der betroffenen Konten
    durch. Bitte beachten Sie, dass bei SEPA-Rückgaben gesetzliche Fristen von bis
    zu acht Wochen gelten können.


    Wir wenden strikte Verifikationsprotokolle an, um Ihre Kundendaten zu gewährleisten.
    Vor jeder statusändernden Aktion ist eine eindeutige Identitätsprüfung zwingend
    erforderlich. Für weitere Informationen zur allgemeinen Sicherheit Ihrer Anlagen
    lesen Sie bitte auch das Dokument Bausparvertrag Heimstatt Classic — rechtliche
    Hinweise.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: c393c23b-eeef-5814-ae42-0048b7f6f8be
  title: Bausparvertrag Heimstatt Classic — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die vertragliche Beziehung
    zwischen der Bausparkasse Heimstatt und dem Vertragspartner für den Bausparvertrag
    Heimstatt Classic. Alle Vereinbarungen unterliegen den regulatorischen Vorgaben
    der BaFin und der Deutschen Bundesbank sowie den Bestimmungen des BGB für Verbraucherdarlehen.


    1. Abschluss und Gebühren: Mit dem Abschluss des Vertrages wird eine einmalige
    Abschlussgebühr in Höhe von 1,6 % der Bausparsumme fällig. Diese Gebühr dient
    der Deckung des administrativen Aufwands zur langfristigen Zinssicherung. In Ausnahmefällen,
    wie bei besonders hohen Vertragsvolumina oder im Rahmen spezieller Aktionsangebote,
    kann diese Gebühr nach Ermessen der Filialleitung reduziert oder erlassen werden.


    2. Sparphase und Guthabenzinsen: Während der Sparphase wird das Guthaben mit einem
    Zins von 0,5 % verzinst. Der Kunde verpflichtet sich zu einem regelmäßigen monatlichen
    Sparbeitrag, der 0,4 % der Bausparsumme entspricht. Um eine Zuteilung zu beantragen,
    muss ein Mindestsparguthaben von 40 % der Bausparsumme erreicht worden sein.


    3. Darlehensphase: Nach erfolgreicher Zuteilung kann das Darlehen zu einem festgesetzten
    Zinssatz von 2,45 % beansprucht werden. Die Zinsen bleiben über die gesamte Laufzeit
    des Darlehens konstant, was dem Kunden eine hohe Planungssicherheit bietet.


    4. Kündigung und Beendigung: Der Vertrag kann unter Einhaltung der gesetzlichen
    und vertraglichen Fristen gekündigt werden. Eine vorzeitige Auflösung kann Auswirkungen
    auf die bereits geleisteten Einzahlungen und die Zuteilungswartezeit haben.


    5. Sondervereinbarungen: Sondertilgungen sind bei unseren Bauspardarlehen jederzeit
    kostenfrei möglich, um die Restschuld schneller zu reduzieren.


    Jegliche Änderungen dieser Bedingungen werden dem Kunden schriftlich mitgeteilt.
    Für detaillierte Erläuterungen zu den einzelnen Gebührenkomponenten verweisen
    wir auf das Dokument Bausparvertrag Heimstatt Classic — Abschlussgebühr in Prozent
    der Bausparsumme: Erklärung.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 1e90b3b0-7e5e-5771-832a-589f88063327
  title: Bausparvertrag Heimstatt Classic — für wen und wofür geeignet
  body: 'Der Bausparvertrag Heimstatt Classic ist die ideale Lösung für Personen,
    die eine ausgewogene Basisoption für eine sichere Kombination aus Sparen und späterem
    Bauen suchen. Er richtet sich primär an Familien und zukünftige Eigenheimbesitzer,
    die Wert auf regionale Verwurzelung und maximale Planungssicherheit legen.


    Dieses Produkt eignet sich besonders für Sie, wenn:

    - Sie eine feste Zinsgarantie für Ihre zukünftige Finanzierung wünschen, um sich
    gegen steigende Marktzinsen abzusichern.

    - Sie durch die optimale Nutzung staatlicher Förderungen Ihr Eigenkapital effizient
    steigern möchten.

    - Sie einen disziplinierten Sparplan mit einem festen Rahmen benötigen.


    Die Konditionen im Überblick:

    - Guthabenzinsen: Sie erhalten auf Ihr Sparguthaben einen Zins von 0,5 %.

    - Darlehenszinsen: Nach der Zuteilung sichern Sie sich ein Darlehen zu einem Zinssatz
    von 2,45 %.

    - Abschlussgebühr: Zur Absicherung der Konditionen fällt eine einmalige Gebühr
    von 1,6 % der Bausparsumme an.

    - Sparrate: Der regelmäßige monatliche Sparbeitrag ist auf 0,4 % der Bausparsumme
    festgelegt.

    - Zuteilungsvoraussetzung: Ein Mindestsparguthaben von 40 % der Bausparsumme ist
    erforderlich, um das Darlehen beanspruchen zu können.


    Ob Sie Ihren ersten Immobilienkauf planen oder eine langfristige Vorsorge für
    Ihre Familie aufbauen möchten, der Bausparvertrag Heimstatt Classic bietet Ihnen
    die notwendige Stabilität. Durch die Kombination aus festen Zinsen und der Möglichkeit
    kostenloser Sondertilgungen behalten Sie stets die volle Kontrolle über Ihre Finanzplanung.


    Für eine detaillierte Übersicht über den Startprozess besuchen Sie bitte das Dokument
    Bausparvertrag Heimstatt Classic — Schritt für Schritt starten.'
