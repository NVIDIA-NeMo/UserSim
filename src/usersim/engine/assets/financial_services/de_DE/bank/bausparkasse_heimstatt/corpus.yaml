- id: 33c03182-b61e-5747-abed-8cc42cbbbf4c
  title: Bausparvertrag Heimstatt Classic — erforderliche Unterlagen
  body: 'Um einen Bausparvertrag Heimstatt Classic abzuschließen und die damit verbundenen
    Konditionen (wie den Darlehenszins von 2,45 %) zu sichern, sind folgende Unterlagen
    zwingend erforderlich:


    | Dokument | Zweck | Erforderlichkeit |

    | :--- | :--- | :--- |

    | Gültiges Ausweisdokument | Identitätsprüfung zur Sicherheit Ihrer Daten | Zwingend
    |

    | Einkommensnachweis (z. B. Gehaltsabrechnung) | Prüfung der Tragbarkeit der monatlichen
    Rate von 0,4 % | Zwingend |

    | Nachweis der Staatsangehörigkeit / Aufenthalt | Regulatorische Compliance (BaFin/Bundesbank)
    | Zwingend |

    | Referenzkonto-Nachweis | Einrichtung des Lastschriftverfahrens für Sparraten
    | Zwingend |

    | Nachweise über staatliche Förderberechtigung | Maximierung von Prämien und Zulagen
    | Optional (empfohlen) |


    Bitte stellen Sie sicher, dass alle Dokumente aktuell sind, um eine reibungslose
    Vertragseröffnung und die korrekte Verrechnung der Abschlussgebühr von 1,6 % zu
    gewährleisten. Weitere Informationen finden Sie im Dokument Bausparvertrag Heimstatt
    Classic — Voraussetzungen.'
