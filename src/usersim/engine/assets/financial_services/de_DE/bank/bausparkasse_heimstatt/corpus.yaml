- id: a31e899e-583a-5e68-9341-e0d45d4758e6
  title: Modernisierungsdarlehen ohne Grundschuld — unerwartetes Entgelt oder unerwarteter
    Betrag
  body: 'Symptom: Ein Kunde stellt fest, dass der von seinem Konto abgebuchte Betrag
    für das Modernisierungsdarlehen nicht mit der vereinbarten Rate (z. B. 210,12
    € aus dem repräsentativen Beispiel) übereinstimmt oder zusätzliche Gebühren auf
    dem Kontoauszug erscheinen.


    Wahrscheinliche Ursachen:

    - Verpasste Raten: Wenn eine monatliche Rate nicht eingezogen werden konnte, kann
    der folgende Abbuchungsbetrag höher ausfallen, um den Rückstand auszugleichen.

    - Zinsanpassungen bei Sondervereinbarungen: In seltenen Fällen können bei spezifischen
    Vertragsänderungen kurzfristige Anpassungen auftreten.

    - Administrative Gebühren: Gelegentlich können Kosten für die Erstellung spezieller
    Bescheinigungen oder Dokumente anfallen, sofern diese nicht kostenfrei sind.


    Schritte zur Überprüfung und Behebung:

    1. Abgleich mit dem Tilgungsplan: Prüfen Sie zunächst, ob der abgebuchte Betrag
    mit dem im Vertrag festgelegten Tilgungsplan und den vereinbarten Konditionen
    übereinstimmt.

    2. Prüfung der Kontoaktivität: Kontrollieren Sie, ob in den Vormonaten eine Lastschriftrückgabe
    oder eine Fehlbuchung vorlag.

    3. Verifizierung der Identität: Bevor Kontodetails oder konkrete Beträge besprochen
    werden, muss eine eindeutige Identitätsprüfung (Ausweis oder 2FA) erfolgen.


    Lösung:

    - Bei einem Rechenfehler oder einer Fehlbuchung wird die Differenz umgehend mit
    dem Kunden geklärt und eine entsprechende Korrekturbuchung vorgenommen.

    - Sollte eine Rate aufgrund mangelnder Deckung fehlgeschlagen sein, wird der Kunde
    gebeten, den ausstehenden Betrag nachzuzahlen.


    Eskalation:

    Wenn die Ursache nicht unmittelbar im Gespräch geklärt werden kann, wird der Fall
    hierarchisch über die Filialleitung an die zuständige Fachabteilung für Kreditadministration
    oder das Beschwerdemanagement weitergeleitet. Der Kunde erhält innerhalb einer
    angemessenen Frist eine schriftliche Stellungnahme zur Betragsabweichung.


    Weitere Informationen zu Kosten finden Sie im Dokument Modernisierungsdarlehen
    ohne Grundschuld — Preis- und Leistungsverzeichnis.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: troubleshooting
  source_authority: official
