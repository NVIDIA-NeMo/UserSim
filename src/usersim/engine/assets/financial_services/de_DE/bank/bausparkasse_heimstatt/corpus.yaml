- id: aff1ca45-8267-5357-b6ca-0ae0a791389f
  title: Bausparvertrag Heimstatt Rendite — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Identifikation
    von Einschränkungen und Sonderfällen im Zusammenhang mit dem Bausparvertrag Heimstatt
    Rendite.


    **Zuteilungsvoraussetzungen und Grenzen**

    Die wichtigste Einschränkung dieses Produkts ist das Mindestsparguthaben. Ein
    Kunde kann das Darlehen erst dann beanspruchen (Zuteilung), wenn ein Guthaben
    von mindestens 50 % der vereinbarten Bausparsumme erreicht wurde. Dieser Schwellenwert
    ist strikt einzuhalten und kann nicht durch Sonderregelungen unterschritten werden.


    **Konditionen und Fixierungen**

    - **Abschlussgebühr:** Es fällt eine einmalige Abschlussgebühr von 1 % der Bausparsumme
    an. Diese dient der Deckung des administrativen Aufwands. Eine Reduktion ist nur
    im Rahmen spezifischer Aktionsangebote oder bei außerordentlich hohen Vertragsvolumina
    durch die Fachabteilung möglich.

    - **Guthabenzins:** Der Guthabenzins ist fest auf 1,5 % gesetzt.

    - **Darlehenszins:** Im Gegenzug für die höheren Sparzinsen ist der Darlehenszins
    mit 3,95 % vergleichsweise hoch angesetzt. Dies ist die bewusste Positionierung
    dieses Produkts gegenüber der Basisoption.

    - **Sparrate:** Der monatliche Regelsparbeitrag beträgt 0,5 % der Bausparsumme.
    Eine dauerhafte Unterschreitung dieses Wertes kann die Zeit bis zur Zuteilung
    (Erreichen der 50 %-Marke) signifikant verlängern.


    **Sonderfälle**

    Sondertilgungen sind bei unseren Bauspardarlehen jederzeit kostenfrei möglich.
    Dies ermöglicht es Kunden, die Zinslast des Darlehens (3,95 %) schneller zu reduzieren.
    Bei Kündigungswünschen oder Tarifwechseln ist auf die jeweiligen gesetzlichen
    Fristen und die vertragliche Bindung zu achten. Für detaillierte Informationen
    zum Vergleich mit anderen Tarifen siehe Bausparvertrag Heimstatt Rendite — im
    Vergleich zu einem ähnlichen Produkt des Hauses.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: product_sheet
