  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 6b6c3d71-aca4-5fee-b651-eba9c70d3d82
  title: Bausparvertrag Heimstatt Rendite — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem bestehenden Bausparvertrag Heimstatt Rendite
    vornehmen möchten, stellen wir Ihnen hier den Prozess vor. Bitte beachten Sie,
    dass alle Änderungen zur Sicherheit Ihres Vermögens einer strikten Verifizierung
    unterliegen.


    Was Sie für die Änderung benötigen:

    - Ihren gültigen Personalausweis oder Reisepass.

    - Die Vertragsnummer Ihres Bausparvertrags.


    Schritt 1: Mitteilung des Änderungswunsches

    Teilen Sie uns mit, welchen Aspekt Ihres Vertrages Sie ändern möchten. Typische
    Anpassungen sind die Erhöhung oder Senkung der monatlichen Sparrate (empfohlen
    sind 0,5 % der Bausparsumme) oder die Anpassung der gesamten Bausparsumme.


    Schritt 2: Identitätsprüfung

    Bevor wir eine Änderung vornehmen, führen wir eine eindeutige Identitätsprüfung
    durch. In der Filiale geschieht dies durch Vorlage Ihres Ausweisdokuments; bei
    einer digitalen Anfrage nutzen wir unsere Zwei-Faktor-Authentifizierung.


    Schritt 3: Prüfung der Auswirkungen

    Wir berechnen für Sie, wie sich die Änderung auf Ihre Bewertungszahl und den Zeitpunkt
    der Zuteilung auswirkt. Beispielsweise führt eine Erhöhung der Sparrate zu einer
    schnelleren Erreichung des Mindestsparguthabens von 50 % der Bausparsumme, was
    die Zuteilung des Darlehens zu 3,95 % beschleunigt.


    Schritt 4: Bestätigung und Umsetzung

    Nachdem Sie die neuen Konditionen akzeptiert haben, führen wir die Änderung in
    Ihrem Vertrag aus. Sie erhalten eine schriftliche Bestätigung über die angepassten
    Werte.


    Schritt 5: Überprüfung der Einzahlungen

    Falls Sie Ihren monatlichen Sparbetrag geändert haben, prüfen Sie bitte bei der
    nächsten Kontoabrechnung, ob der neue Betrag korrekt abgebucht wurde.


    Sollten Sie Ihren gesamten Tarif wechseln wollen, finden Sie die entsprechenden
    Schritte im Dokument Bausparvertrag Heimstatt Rendite — kündigen, schließen oder
    den Tarif wechseln.'
