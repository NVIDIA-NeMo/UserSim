- id: 45e074b7-986b-53f4-8a4f-8e0e35225760
  title: Modernisierungsdarlehen ohne Grundschuld — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Die Sicherheit Ihrer finanziellen Daten hat bei der Bausparkasse Heimstatt
    höchste Priorität. Gerade bei Kreditprodukten wie dem Modernisierungsdarlehen
    ohne Grundschuld gibt es spezifische Betrugsmuster, vor denen wir Sie warnen möchten.


    Ein häufiges Szenario ist das sogenannte ''Phishing'', bei dem Betrüger versuchen,
    sich als Mitarbeiter unserer Bank auszugeben. Diese Personen kontaktieren Sie
    möglicherweise per E-Mail, SMS oder Telefon und behaupten, Ihr Darlehen sei aufgrund
    eines Fehlers gesperrt oder es gäbe eine attraktivere Zinsoption, die eine sofortige
    Bestätigung Ihrer Zugangsdaten erfordere. Bitte beachten Sie: Die Bausparkasse
    Heimstatt wird Sie niemals per E-Mail oder SMS auffordern, Passwörter, PINs oder
    Ihre Zwei-Faktor-Authentifizierungscodes auf einer externen Webseite einzugeben.


    Vor jeder statusändernden Aktion an Ihrem Kreditvertrag, wie etwa einer Änderung
    der Bankverbindung für die monatlichen Raten, führen wir eine strikte Identitätsprüfung
    durch. Dies geschieht entweder durch die Vorlage gültiger Ausweisdokumente in
    unseren regionalen Filialen oder über unsere gesicherten Zwei-Faktor-Authentifizierungsprotokolle
    im digitalen Kundenportal. Wenn Sie aufgefordert werden, sensible Informationen
    über einen unsicheren Kanal preiszugeben, ist dies ein deutliches Warnsignal.


    Sollten Sie den Verdacht haben, Opfer eines Betrugsversuchs geworden zu sein oder
    bemerken Sie unautorisierte Zugriffe auf Ihre Kontoinformationen, handeln Sie
    bitte umgehend. Informieren Sie uns sofort über unsere zentrale Telefon-Hotline
    oder in Ihrer Filiale. Wir werden das betroffene Konto unverzüglich sperren, um
    weiteren Schaden abzuwenden, und den Vorfall an die zuständigen Aufsichtsbehörden
    melden.


    Ein besonderes Augenmerk gilt der Kommunikation über Drittanbieter. Wir fordern
    Sie niemals auf, Gebühren für die Bearbeitung eines Darlehens auf Konten einzuzahlen,
    die nicht eindeutig auf die Bausparkasse Heimstatt lauten. Wir setzen auf Transparenz
    und Seriosität, um Ihr Eigenheim sicher zu modernisieren.


    Für weitere allgemeine Sicherheitshinweise können Sie auch das Dokument Bausparvertrag
    Heimstatt Classic — Sicherheitstipps für Ihr Konto konsultieren.'
