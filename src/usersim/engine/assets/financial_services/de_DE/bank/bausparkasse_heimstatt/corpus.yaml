  institution_id: bausparkasse_heimstatt
- id: 6588942d-8577-54ef-b1d3-48301b931397
  title: Bausparvertrag Heimstatt Rendite — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die vertraglichen Pflichten
    und Rechte im Rahmen des Bausparvertrags Heimstatt Rendite. Durch den Abschluss
    dieses Vertrages vereinbaren Sie die Einhaltung der folgenden Konditionen:


    1. Abschlussgebühren: Zur Deckung des administrativen Aufwands zur langfristigen
    Zinssicherung wird eine einmalige Abschlussgebühr in Höhe von 1 % der Bausparsumme
    erhoben. Diese Gebühr wird bei Vertragsabschluss fällig.


    2. Sparphase und Guthabenzinsen: Während der Sparphase wird Ihr Guthaben mit einem
    Zinssatz von 1,5 % verzinst. Die Zinsgutschrift erfolgt jährlich auf das bestehende
    Guthaben.


    3. Sparverpflichtungen: Zur Erreichung der Zuteilungsreife verpflichten Sie sich
    zu einem regelmäßigen monatlichen Sparbeitrag in Höhe von 0,5 % der Bausparsumme.
    Zudem muss ein Mindestsparguthaben von 50 % der Bausparsumme erreicht werden,
    bevor ein Anspruch auf das Darlehen besteht.


    4. Darlehensphase: Nach erfolgter Zuteilung wird das Darlehen zu einem festen
    Zinssatz von 3,95 % bereitgestellt. Dieser Zins bleibt über die gesamte Laufzeit
    des Darlehens unverändert, was Ihnen eine maximale Planungssicherheit garantiert.


    5. Kündigung und Beendigung: Der Vertrag kann unter Einhaltung der gesetzlichen
    und vertraglichen Fristen gekündigt werden. Bei einer vorzeitigen Kündigung vor
    Erreichen der Zuteilungsreife können die Bedingungen für die Auszahlung des Guthabens
    von den regulären Konditionen abweichen.


    6. Änderungen: Die Bausparkasse Heimstatt behält sich vor, die Bedingungen nach
    rechtzeitiger Ankündigung anzupassen, sofern dies regulatorisch erforderlich ist
    oder durch neue gesetzliche Vorgaben der BaFin oder der Deutschen Bundesbank geboten
    wird.


    Diese Vereinbarungen basieren auf den Bestimmungen des BGB für Verbraucherdarlehen.
    Für detaillierte Informationen zu den rechtlichen Rahmenbedingungen verweisen
    wir auf das Dokument Bausparvertrag Heimstatt Rendite — rechtliche Hinweise.'
