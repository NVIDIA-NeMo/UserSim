- id: 6545ceda-eaf9-5685-b6ba-b8c1a8c12867
  title: Bausparvertrag Heimstatt Rendite — Datenschutz und Datenverarbeitung
  body: 'Die Bausparkasse Heimstatt verarbeitet personenbezogene Daten im Zusammenhang
    mit dem Bausparvertrag Heimstatt Rendite strikt nach den regulatorischen Vorgaben
    der BaFin und der Deutschen Bundesbank sowie in Übereinstimmung mit der Datenschutz-Grundverordnung
    (DSGVO).


    Zweck der Datenverarbeitung

    Die Erhebung Ihrer Daten erfolgt ausschließlich zur Abwicklung Ihres Bausparvertrags.
    Dies umfasst die Verwaltung Ihres Guthabens, die Berechnung der Guthabenzinsen
    in Höhe von 1,5 % sowie die Prüfung der Zuteilungsvoraussetzungen (z. B. Erreichen
    des Mindestsparguthabens von 50 %). Zudem werden Ihre Daten zur Identitätsprüfung
    gemäß unseren strikten Verifikationsprotokollen genutzt, um unbefugte Zugriffe
    auf Ihre Kontoinformationen zu verhindern.


    Sicherheit und Aufbewahrung

    Wir wenden hohe Sicherheitsstandards an, um Ihre Daten vor unbefugtem Zugriff
    zu schützen. Dies beinhaltet den Einsatz von Zwei-Faktor-Authentifizierung für
    den digitalen Zugang. Die Aufbewahrung von Vertragsunterlagen, einschließlich
    der Dokumentation über die gezahlte Abschlussgebühr von 1 %, erfolgt unter Einhaltung
    der gesetzlichen Aufbewahrungsfristen des BGB und steuerrechtlicher Vorgaben.


    Ihre Rechte

    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungspflichten
    entgegenstehen. Für Anfragen zur Datenverarbeitung wenden Sie sich bitte an unseren
    Datenschutzbeauftragten über Ihre regionale Filiale oder das digitale Kundenportal.


    Wir weisen darauf hin, dass wir keine individualisierte Steuer- oder Rechtsberatung
    erbringen. Für spezifische Fragen zur steuerlichen Behandlung Ihrer Bauspargewinne
    oder zur rechtlichen Ausgestaltung von Immobiliengeschäften verweisen wir an zertifizierte
    Fachleute. Die Bausparkasse Heimstatt garantiert die transparente Offenlegung
    aller produktrelevanten Daten, einschließlich des effektiven Jahreszinses, um
    eine fundierte Entscheidungsgrundlage für Sie zu schaffen.'
