  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: e3877e25-ddab-5a1d-aa26-49ed9d5d9a3d
  title: Bausparvertrag Heimstatt Classic — abschließen und aktivieren
  body: 'Wenn Sie sich für den Bausparvertrag Heimstatt Classic entschieden haben,
    führen wir Sie durch einen strukturierten Prozess, um Ihren Vertrag schnell und
    sicher zu aktivieren.


    Bevor Sie beginnen, halten Sie bitte ein gültiges Ausweisdokument (Personalausweis
    oder Reisepass) sowie Ihre Steueridentifikationsnummer bereit.


    1. Festlegung der Bausparsumme: Sie teilen uns mit, welche Gesamtsumme Sie ansparen
    und später als Darlehen beanspruchen möchten. Auf Basis dieser Summe berechnen
    wir die Abschlussgebühr von 1,6 % sowie den regelmäßigen monatlichen Sparbeitrag
    von 0,4 %.

    2. Identitätsprüfung: Zur Eröffnung des Kontos führen wir eine eindeutige Identitätsprüfung
    durch. Sie legen uns hierzu Ihr Ausweisdokument vor oder nutzen unser Zwei-Faktor-Authentifizierungsverfahren.

    3. Vereinbarung der Sparraten: Wir bestätigen Ihnen die monatliche Sparrate von
    0,4 % der Bausparsumme und klären, ob Sie darüber hinausgehende Sonderzahlungen
    leisten möchten.

    4. Unterzeichnung der Vertragsunterlagen: Sie erhalten die detaillierten Vertragsbedingungen,
    aus denen auch der Guthabenzins von 0,5 % und der Darlehenszins von 2,45 % hervorgehen.
    Nach Ihrer Unterschrift ist der Vertrag rechtsgültig.

    5. Aktivierung und erste Einzahlung: Wir aktivieren Ihren Vertrag. Sobald die
    erste Sparrate oder eine Einmalzahlung auf Ihrem Konto eingegangen ist, beginnt
    die Berechnung Ihrer Bewertungszahl.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie die schriftliche
    Vertragsbestätigung inklusive Ihres individuellen Kontonummer-Nachweises erhalten
    haben. Für weitere Informationen zur Nutzung Ihres Vertrages lesen Sie bitte Bausparvertrag
    Heimstatt Classic — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: how_to_guide
  source_authority: official
