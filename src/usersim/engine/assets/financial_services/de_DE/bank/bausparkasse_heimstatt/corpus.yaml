- id: 00f20dba-d498-5559-8cd7-9cdb25119dd6
  title: Bausparvertrag Heimstatt Classic — etwas ändern
  body: 'Im Laufe der Zeit können sich Ihre finanziellen Prioritäten ändern. Wir unterstützen
    Sie dabei, die Parameter Ihres Bausparvertrags Heimstatt Classic an Ihre aktuelle
    Lebenssituation anzupassen.


    **Änderung der monatlichen Sparrate**

    Wenn Sie Ihren monatlichen Sparbetrag erhöhen oder senken möchten, gehen Sie wie
    folgt vor:

    1. Teilen Sie uns den gewünschten neuen monatlichen Betrag mit. Beachten Sie dabei,
    dass der Betrag nicht unter die Mindestgrenze von 0,4 % der Bausparsumme fallen
    darf.

    2. Wir prüfen die neue Rate im Kontext Ihrer Bausparsumme und bestätigen Ihnen
    die Änderung schriftlich oder über das Kundenportal.

    3. Ab dem nächsten Abrechnungszyklus wird der neue Betrag eingezogen. Eine Erhöhung
    der Rate beschleunigt in der Regel das Erreichen der Zuteilungsreife.


    **Anpassung der Bausparsumme**

    Sollten sich Ihre Baupläne ändern und Sie eine höhere oder niedrigere Gesamtsumme
    benötigen, ist dies unter bestimmten Voraussetzungen möglich:

    1. Geben Sie uns die gewünschte neue Bausparsumme bekannt.

    2. Wir prüfen, ob die Änderung mit den aktuellen regulatorischen Vorgaben und
    Ihren bereits geleisteten Einzahlungen vereinbar ist.

    3. Bei einer Erhöhung der Bausparsumme kann eine proportionale Anpassung der Abschlussgebühr
    (regulär 1,6 %) anfallen, da der administrative Aufwand für die höhere Zinssicherung
    steigt.

    4. Nach Ihrer Zustimmung passen wir den Vertrag an und senden Ihnen die aktualisierten
    Vertragsunterlagen zu.


    **Wichtiger Hinweis**

    Bitte beachten Sie, dass jede Änderung der Bausparsumme oder der Sparrate Auswirkungen
    auf Ihre Bewertungszahl und somit auf den Zeitpunkt der Zuteilung hat. Wir empfehlen
    Ihnen, diese Änderungen in einem Beratungsgespräch mit einem unserer regionalen
    Experten zu besprechen, um Ihre optimale Strategie beizubehalten.'
