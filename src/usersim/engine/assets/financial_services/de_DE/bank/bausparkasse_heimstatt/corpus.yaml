- id: 6c8fec7e-38e7-535e-ae8f-19ef68fc4336
  title: Bausparvertrag Heimstatt Classic — Risikohinweise
  body: 'Im Rahmen Ihrer Entscheidung für den Bausparvertrag Heimstatt Classic weisen
    wir Sie auf die folgenden regulatorischen und finanziellen Risiken hin. Wir agieren
    strikt nach den Vorgaben der BaFin und der Deutschen Bundesbank sowie dem BGB.


    1. Liquiditätsrisiko: Ein Bausparvertrag ist ein langfristiges Finanzinstrument.
    Die Verfügbarkeit Ihres Kapitals ist an die Zuteilungsregeln gebunden. Erst wenn
    ein Mindestsparguthaben von 40 % der Bausparsumme erreicht und die erforderliche
    Bewertung erzielt wurde, können Sie das Darlehen zu 2,45 % beanspruchen. Eine
    vorzeitige Entnahme des Guthabens kann zu Verlusten bei den Zinsen oder zum Wegfall
    von staatlichen Förderungen führen.


    2. Inflationsrisiko: Da die Guthabenzinsen bei 0,5 % festgeschrieben sind, besteht
    das Risiko, dass die reale Kaufkraft Ihres Sparguthabens bei einer Inflation,
    die über diesen Zinssatz steigt, sinkt. Demgegenüber steht jedoch der Schutz vor
    steigenden Zinsen in der Darlehensphase durch den fixierten Satz von 2,45 %.


    3. Kosten der Absicherung: Die Abschlussgebühr von 1,6 % der Bausparsumme stellt
    einen unmittelbaren Kostenfaktor dar, der das effektive Renditepotenzial in den
    ersten Jahren des Vertrages mindert. Diese Gebühr ist jedoch die Voraussetzung
    für die langfristige Zinsgarantie.


    4. Verpflichtungen: Durch den Vertrag verpflichten Sie sich zu einem regelmäßigen
    monatlichen Sparbeitrag von 0,4 % der Bausparsumme. Eine dauerhafte Nichterfüllung
    dieser Verpflichtung kann die Zuteilungsfrist verlängern.


    Alle unsere Produkte werden mit transparenten Offenlegungen kommuniziert, einschließlich
    des effektiven Jahreszinses und Hinweisen zur gesetzlichen Einlagensicherung.
    Für weitere rechtliche Details besuchen Sie bitte das Dokument Bausparvertrag
    Heimstatt Classic — rechtliche Hinweise.'
