- id: a4da7915-e863-5330-9111-9836fb7c21a9
  title: 'Bausparvertrag Heimstatt Rendite — monatlicher Regelsparbeitrag in Prozent
    der Bausparsumme: Erklärung'
  body: '**Was genau ist der monatliche Regelsparbeitrag in Prozent der Bausparsumme?**

    Der Regelsparbeitrag ist die vertraglich vereinbarte Summe, die Sie jeden Monat
    auf Ihr Bausparkonto einzahlen. Um die Planung für alle Kunden zu vereinheitlichen,
    definieren wir diesen Betrag als Prozentsatz der gesamten Bausparsumme.


    **Wie hoch ist dieser Betrag beim Bausparvertrag Heimstatt Rendite?**

    Beim Bausparvertrag Heimstatt Rendite beträgt der monatliche Regelsparbeitrag
    0,5 % der Bausparsumme. Wenn Sie beispielsweise eine Bausparsumme von 10.000 €
    vereinbart haben, beläuft sich Ihr monatlicher Sparbeitrag auf 50 €.


    **Kann ich diesen Betrag ändern?**

    Ja, Anpassungen sind möglich. Bitte beachten Sie jedoch, dass eine Senkung der
    Sparrate die Zeit verlängert, bis Sie das erforderliche Mindestsparguthaben von
    50 % für die Zuteilung erreichen. Weitere Informationen hierzu finden Sie in Bausparvertrag
    Heimstatt Rendite — etwas ändern.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 0a2af72e-f134-5afc-8d59-7dbfda6d0090
  title: Bausparvertrag Heimstatt Rendite — ein typisches Anliegen vollständig erledigen
  body: 'Ein typisches Anliegen ist der vollständige Abschluss und die Aktivierung
    eines Bausparvertrags Heimstatt Rendite. Damit Ihr Weg zum Eigenheim sicher geplant
    ist, führen wir Sie durch den gesamten Prozess:


    1. **Identitätsprüfung und Beratung:** Legen Sie uns Ihr gültiges Ausweisdokument
    vor. Wir prüfen Ihre Identität und besprechen gemeinsam Ihre Ziele, um sicherzustellen,
    dass der Fokus auf Rendite (Guthabenzins 1,5 %) Ihren Vorstellungen entspricht.

    2. **Festlegung der Bausparsumme:** Sie legen fest, welche Bausparsumme Sie insgesamt
    anstreben. Auf Basis dieser Summe werden alle weiteren Werte berechnet.

    3. **Vereinbarung der Sparrate:** Wir bestätigen Ihnen den monatlichen Regelsparbeitrag
    von 0,5 % der gewählten Bausparsumme, um eine stetige Annäherung an die Zuteilungsgrenze
    zu gewährleisten.

    4. **Zustimmung zu den Kosten:** Sie erklären sich mit der Abschlussgebühr von
    1 % der Bausparsumme einverstanden, welche zur Sicherung der langfristigen Zinskonditionen
    verwendet wird.

    5. **Vertragsunterzeichnung:** Sie unterschreiben den Vertrag, in dem der Guthabenzins
    von 1,5 % und der zukünftige Darlehenszins von 3,95 % verbindlich fixiert sind.

    6. **Aktivierung:** Wir bestätigen Ihnen den erfolgreichen Abschluss. Ihr Vertrag
    ist nun aktiv, und Sie beginnen mit dem Aufbau Ihres Kapitals, um die Zuteilungshürde
    von 50 % Mindestsparguthaben zu erreichen.


    Nach diesen Schritten ist Ihr Vertrag vollständig aufgesetzt. Für Informationen
    zur staatlichen Förderung ergänzen Sie Ihr Wissen mit dem Dokument Wohnungsbauprämie
    und Arbeitnehmer-Sparzulage — Überblick.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 67a65330-f258-5d43-b84d-ef71c5e3077a
  title: Bausparvertrag Heimstatt Rendite — Abweichung von Ihren Unterlagen
  body: 'Wenn ein Kunde eine Abweichung zwischen seinen eigenen Aufzeichnungen und
    den offiziellen Unterlagen des Bausparvertrags Heimstatt Rendite meldet, ist vom
    Support-Mitarbeiter folgendes Vorgehen anzuwenden:


    **Häufige Fehlerquellen und Prüfschritte**

    1. **Überprüfung der Guthabenzinsen:** Prüfen Sie, ob der Kunde eine andere Verzinsung
    erwartet hat. Vergewissern Sie sich, dass ein Guthabenzins von exakt 1,5 % angewendet
    wurde. Falls der Kunde einen niedrigeren Wert sieht, prüfen Sie, ob es sich um
    einen Teilzeitraum vor Vertragsaktivierung handelt.

    2. **Kontrolle der Abschlussgebühr:** Prüfen Sie, ob die Abschlussgebühr von 1
    % der Bausparsumme korrekt belastet wurde. Kunden verwechseln diese Gebühr gelegentlich
    mit monatlichen Kontoführungsgebühren.

    3. **Abgleich der Sparraten:** Prüfen Sie, ob die monatlichen Einzahlungen tatsächlich
    0,5 % der Bausparsumme entsprechen. Abweichungen können entstehen, wenn Sonderzahlungen
    geleistet wurden, die nicht als Regelsparrate gewertet werden.

    4. **Prüfung des Mindestsparguthabens:** Wenn der Kunde behauptet, die Zuteilung
    sei bereits möglich, prüfen Sie, ob das Guthaben tatsächlich die Grenze von 50
    % der Bausparsumme erreicht hat. Rundungsdifferenzen in den Unterlagen des Kunden
    führen hier oft zu Missverständnissen.


    **Lösung und Dokumentation**

    - Bei einem nachweisbaren Fehler in der Zinsberechnung oder Gebührenerhebung ist
    eine sofortige Korrektur durch die Fachabteilung einzuleiten.

    - Bei einem Missverständnis des Kunden ist die Struktur des Produkts (hohe Sparrendite
    von 1,5 % vs. höhere Darlehenskosten von 3,95 %) erneut erläutern.

    - Dokumentieren Sie die Klärung im Kundenportal. Sollte keine Einigung erzielt
    werden, erfolgt die Weiterleitung an die Filialleitung und das Beschwerdemanagement.'
