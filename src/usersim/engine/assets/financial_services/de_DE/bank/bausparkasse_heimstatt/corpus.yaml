- id: 0a836db0-a146-52a7-a071-4005981de2fa
  title: Bausparvertrag Heimstatt Classic — wie Zinsen berechnet und angewendet werden
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Berechnung
    und Anwendung der Zinsen im Bausparvertrag Heimstatt Classic.


    1. Guthabenzinsen (Sparphase):

    Auf das gesamte eingezahlte Guthaben wird ein Zinssatz von 0,5 % angewendet. Diese
    Zinsen werden jährlich kapitalisiert und dem Konto gutgeschrieben. Es gibt keine
    gestaffelten Zinssätze; der Satz von 0,5 % gilt für alle Guthabenstände unabhängig
    von der Bausparsumme.


    2. Darlehenszinsen (Auszahlungsphase):

    Nach der Zuteilung wird das Darlehen mit einem festen Zinssatz von 2,45 % verzinst.
    Dieser Zinssatz ist nominal und bleibt über die gesamte Laufzeit des Darlehens
    unverändert, unabhängig von Marktschwankungen.


    3. Einflussfaktoren:

    - Sondertilgungen: Da Sondertilgungen kostenfrei möglich sind, reduziert eine
    außerplanmäßige Rückzahlung die Restschuld und somit die absolut anfallenden Zinslasten
    bei einem Zinssatz von 2,45 %.

    - Zuteilungsstichtage: Die Zinsen werden auf Basis des jeweiligen Tagesguthabens
    bzw. der Restschuld berechnet.


    Für eine detaillierte Übersicht aller Zinskonditionen verweisen wir auf das Dokument
    Bausparvertrag Heimstatt Classic — Zinsübersicht.'
