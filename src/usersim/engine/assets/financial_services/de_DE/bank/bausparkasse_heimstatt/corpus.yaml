- id: 18513114-fbde-5237-a5aa-46b7d9c4ba31
  title: Bausparvertrag Heimstatt Classic — im Vergleich zu einem ähnlichen Produkt
    des Hauses
  body: 'Hier vergleichen wir den Bausparvertrag Heimstatt Classic mit dem Bausparvertrag
    Heimstatt Rendite, um Ihnen die Entscheidung zu erleichtern.


    | Merkmal | Heimstatt Classic | Heimstatt Rendite |

    | :--- | :--- | :--- |

    | Fokus | Ausgewogenheit (Sparen & Bauen) | Maximierung der Guthabenzinsen |

    | Guthabenzins | 0,5 % | Höher (siehe Produktblatt Rendite) |

    | Darlehenszins | 2,45 % | Höher als beim Classic-Modell |

    | Abschlussgebühr | 1,6 % | 1,6 % |

    | Mindestsparen für Zuteilung | 40 % | Gemäß Produktbedingungen |


    Der Bausparvertrag Heimstatt Classic ist die ideale Wahl für Familien und zukünftige
    Eigenheimbesitzer, die eine möglichst kostengünstige Finanzierung (2,45 %) für
    ihr Bauvorhaben sichern möchten und eine moderate Verzinsung ihrer Ersparnisse
    akzeptieren.


    Der Bausparvertrag Heimstatt Rendite eignet sich hingegen besser für Kunden, die
    primär eine attraktive Verzinsung ihres Kapitals suchen und bereit sind, im Gegenzug
    höhere Zinsen für das spätere Darlehen in Kauf zu nehmen.


    Weitere Details zum Classic-Modell finden Sie in Bausparvertrag Heimstatt Classic
    — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 2f345113-1357-516a-a3e6-8032996f1a40
  title: Bausparvertrag Heimstatt Classic — rechtliche Hinweise
  body: 'Die Bausparkasse Heimstatt agiert strikt nach den regulatorischen Vorgaben
    der BaFin und der Deutschen Bundesbank sowie den Bestimmungen des BGB für Verbraucherdarlehen.
    Im Zusammenhang mit dem Bausparvertrag Heimstatt Classic gelten folgende rechtliche
    Bestimmungen:


    Zinsen und Kosten:

    Die vertraglich vereinbarten Konditionen – ein Guthabenzins von 0,5 % und ein
    Darlehenszins von 2,45 % – sind festgeschrieben und bleiben über die gesamte Laufzeit
    des Vertrages unabhängig von Marktschwankungen bestehen. Die Abschlussgebühr von
    1,6 % der Bausparsumme wird einmalig bei Vertragsabschluss erhoben.


    Einlagensicherung:

    Alle Guthaben aus dem Bausparvertrag Heimstatt Classic sind durch die gesetzliche
    Einlagensicherung geschützt. Wir weisen darauf hin, dass die Einlagensicherung
    den gesetzlichen Schwellenwerten entspricht.


    Zuteilung und Darlehen:

    Die Zuteilung des Darlehens erfolgt erst, wenn der Vertrag die notwendige Bewertung
    erreicht hat und ein Mindestsparguthaben von 40 % der Bausparsumme vorhanden ist.
    Die Inanspruchnahme des Darlehens erfolgt unter Einhaltung der in den AGB festgelegten
    Fristen.


    Beratungsvorbehalt:

    Wir bieten eine umfassende Produktberatung an. Bitte beachten Sie jedoch, dass
    die Bausparkasse Heimstatt keine individualisierte Steuer- oder Rechtsberatung
    erbringt. Für spezifische rechtliche oder steuerliche Fragen, insbesondere im
    Zusammenhang mit staatlichen Förderungen, verweisen wir an zertifizierte Fachleute.


    Datenschutz:

    Die Verarbeitung Ihrer personenbezogenen Daten erfolgt gemäß den geltenden Datenschutzgrundverordnungen.
    Details finden Sie in den allgemeinen Datenschutzhinweisen unserer Institution.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 47092c81-5e18-5709-95a8-b5f629e253db
  title: Bausparvertrag Heimstatt Classic — Zinsübersicht
  body: 'In dieser Zinsübersicht finden Sie die präzisen Zinssätze für den Bausparvertrag
    Heimstatt Classic. Da es sich um ein Produkt mit Planungssicherheit handelt, sind
    diese Sätze für die gesamte Vertragslaufzeit fixiert.


    - Guthabenzins: 0,5 %

    Dieses Guthabenzins-Niveau gilt für alle Einzahlungen auf Ihr Bausparkonto. Die
    Zinsen werden jährlich auf das Guthaben gutgeschrieben.


    - Darlehenszins: 2,45 %

    Dieser Zinssatz gilt für das Bauspardarlehen, welches Sie nach erfolgreicher Zuteilung
    beanspruchen können. Der Zinssatz ist unabhängig von der zukünftigen Marktentwicklung
    festgeschrieben.


    Die Zinsen sind unabhängig von der Höhe der Bausparsumme konstant. Eine Änderung
    dieser Sätze erfolgt nur im Rahmen der gesetzlichen Bestimmungen oder bei einem
    Wechsel des Produkttarifs. Für weitere Details zur Berechnung der Zinsen verweisen
    wir auf die allgemeinen Vertragsbedingungen. Eine Zusammenfassung der Kosten finden
    Sie in Bausparvertrag Heimstatt Classic — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: rate_sheet
  source_authority: official
