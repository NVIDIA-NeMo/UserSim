- id: 616a0a53-fbb3-50b4-ad64-8e489f2ff7e6
  title: 'Modernisierungsdarlehen ohne Grundschuld — Nettodarlehensbetrag im repräsentativen
    Beispiel: Erklärung'
  body: "Frage: Was bedeutet der Nettodarlehensbetrag von 20.000 € im repräsentativen\
    \ Beispiel für mein Modernisierungsdarlehen?\n\nAntwort: Der Nettodarlehensbetrag\
    \ (auch Nettoauszahlungsbetrag genannt) ist die Summe, die Ihnen tatsächlich zur\
    \ Verfügung steht, um Ihre Modernisierungsmaßnahmen zu finanzieren. In unserem\
    \ repräsentativen Beispiel beträgt dieser Betrag 20.000 €. \n\nDies ist der Betrag,\
    \ der nach Abzug etwaiger direkter Kosten oder Gebühren auf Ihr Konto ausgezahlt\
    \ wird. Auf Basis dieses Betrages berechnet sich auch die monatliche Rate von\
    \ 210,12 € sowie die Gesamtkosten von 5.214,40 € über die Laufzeit von 120 Monaten.\
    \ Bitte beachten Sie, dass dies ein Beispielwert ist; Ihr individueller Nettodarlehensbetrag\
    \ kann je nach Ihren Bedürfnissen bis zu einem Maximum von 50.000 € betragen.\n\
    \nWeitere Erläuterungen finden Sie im Dokument Modernisierungsdarlehen ohne Grundschuld\
    \ — Überblick."
