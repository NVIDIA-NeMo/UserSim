  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 06bb7dac-69be-513a-850d-a54e4fa83cbb
  title: 'Bausparvertrag Heimstatt Classic — Mindestsparguthaben in Prozent der Bausparsumme:
    Erklärung'
  body: '**Was bedeutet das Mindestsparguthaben bei meinem Bausparvertrag?**


    Das Mindestsparguthaben ist die Bedingung, die erfüllt sein muss, damit Sie Ihr
    Recht auf die Zuteilung des Bauspardarlehens ausüben können. Beim Bausparvertrag
    Heimstatt Classic liegt dieses Mindestsparguthaben bei 40 % der vereinbarten Bausparsumme.


    **Warum ist dieser Prozentsatz wichtig?**


    Ein Bausparvertrag ist ein Zusammenspiel aus Sparen und späterem Bauen. Damit
    das System funktioniert, muss ein Teil der Summe bereits durch Ihre Einzahlungen
    gedeckt sein. Erst wenn Sie 40 % der Bausparsumme angespart haben (und die entsprechende
    Bewertungzahl erreicht ist), können Sie das Darlehen zu den festgesetzten Zinsen
    von 2,45 % beanspruchen.


    **Was passiert, wenn ich weniger als 40 % gespart habe?**


    Solange die Schwelle von 40 % nicht erreicht ist, ist der Vertrag noch nicht „zuteilungsreif“.
    Sie können in dieser Phase weiterhin Guthabenzinsen von 0,5 % auf Ihre Einzahlungen
    erhalten, aber das Darlehen noch nicht in Anspruch nehmen.


    Weitere Details finden Sie unter Bausparvertrag Heimstatt Classic — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: bee25262-386c-51ec-9b82-959ca03914d7
  title: Bausparvertrag Heimstatt Classic — Status oder Verlauf einsehen
  body: "Wenn Sie wissen möchten, wie weit Ihr Bausparvertrag Heimstatt Classic fortgeschritten\
    \ ist und wann Sie voraussichtlich auf Ihr Darlehen zugreifen können, folgen Sie\
    \ diesen Schritten.\n\n**Voraussetzungen**\nUm Auskunft über Ihren Vertrag zu\
    \ erhalten, benötigen Sie ein gültiges Ausweisdokument für die Identitätsprüfung.\n\
    \n**Schritte zur Statusabfrage**\n\n1. **Identitätsprüfung durchführen**: Bitte\
    \ legen Sie uns Ihren gültigen Personalausweis oder Reisepass vor oder schließen\
    \ Sie die Zwei-Faktor-Authentifizierung ab. Dies ist zwingend erforderlich, um\
    \ die Sicherheit Ihrer Kundendaten zu gewährleisten.\n2. **Anforderung des aktuellen\
    \ Status**: Bitten Sie uns um eine Auskunft über Ihren aktuellen Kontostand sowie\
    \ Ihre aktuelle „Bewertungszahl“. Die Bewertungszahl ist der entscheidende Punktwert,\
    \ der Ihren Rang in der Zuteilungsliste bestimmt.\n3. **Überprüfung des Sparguthabens**:\
    \ Wir teilen Ihnen mit, welcher Prozentsatz der Bausparsumme bereits angespart\
    \ wurde. Vergleichen Sie diesen Wert mit dem erforderlichen Mindestsparguthaben\
    \ von 40 %. \n4. **Einblick in den Zahlungsverlauf**: Fordern Sie eine Aufstellung\
    \ Ihrer geleisteten Einzahlungen an. Wir bestätigen Ihnen die Summe der eingegangenen\
    \ Beiträge und die darauf angewendeten Guthabenzinsen von 0,5 %.\n\n**Ergebnis**\n\
    Sie erhalten eine präzise Auskunft darüber, ob Ihr Vertrag bereits die erforderlichen\
    \ 40 % erreicht hat und wie Ihre aktuelle Position für die Zuteilung zum Darlehenszins\
    \ von 2,45 % aussieht.\n\nFür Informationen zum Abschluss des Vertrages lesen\
    \ Sie bitte Bausparvertrag Heimstatt Classic — abschließen und aktivieren."
  domain: retail_banking
  product_category: bausparen_classic
  document_type: how_to_guide
  source_authority: official
