- id: 9f8618be-f9da-5b93-8276-5723ce0f311b
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Empfehlungs- und Treueangebot
  body: "Profitieren Sie von unserer regionalen Verbundenheit. Wir freuen uns, Ihnen\
    \ und Ihren Empfohlenen ein besonderes Treueangebot präsentieren zu können. \n\
    \nWenn Sie einen neuen Kunden an die Bausparkasse Heimstatt vermitteln, der einen\
    \ Vertrag zur Nutzung der staatlichen Förderung abschließt, erlassen wir Ihnen\
    \ sowie dem Neukunden die administrativen Abschlussgebühren vollständig. Dieses\
    \ Angebot gilt für alle Anträge, die im Zeitraum vom 01. Oktober 2023 bis zum\
    \ 31. Dezember 2023 eingereicht werden.\n\nSichern Sie sich die Chance, Ihr Eigenkapital\
    \ durch eine staatliche Förderung von 10 % (Wohnungsbauprämie) bzw. 9 % (Arbeitnehmer-Sparzulage)\
    \ effizient zu steigern, ohne dass Ihnen initiale Bearbeitungskosten entstehen.\
    \ \n\nWir beraten Sie und Ihre Bekannten gerne in unseren regionalen Filialen\
    \ über die optimalen Sparraten, um die maximale Förderung auszuschöpfen. Gemeinsam\
    \ schaffen wir die Grundlage für Ihren sicheren Wohnungsbau."
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 0c2aba64-adb3-5497-ac2e-bf5bdf2b3532
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Sicherheitstipps für Ihr
    Konto
  body: 'Die Sicherheit Ihrer Ersparnisse und Ihrer persönlichen Daten hat für die
    Bausparkasse Heimstatt oberste Priorität. Da staatliche Förderungen wie die Wohnungsbauprämie
    und die Arbeitnehmer-Sparzulage sensible Einkommensdaten erfordern, möchten wir
    Sie auf aktuelle Betrugsmuster aufmerksam machen.


    Bitte beachten Sie, dass die Bausparkasse Heimstatt Sie niemals per E-Mail, SMS
    oder über soziale Medien dazu auffordert, Ihre Passwörter, PINs oder TANs preiszugeben.
    Wir werden Sie niemals bitten, eine Identitätsprüfung durch die Übermittlung von
    Fotos Ihrer Ausweisdokumente über ungesicherte Kanäle wie WhatsApp durchzuführen.


    Ein besonderes Augenmerk gilt der Verifizierung: Vor jeder statusändernden Aktion
    oder der Herausgabe von Kontoinformationen ist eine eindeutige Identitätsprüfung,
    beispielsweise durch ein gültiges Ausweisdokument oder eine Zwei-Faktor-Authentifizierung,
    zwingend erforderlich. Sollten Sie eine Nachricht erhalten, die eine dringende
    Handlung an Ihrem Förderkonto fordert und dabei auf eine externe Webseite verweist,
    handelt es sich höchstwahrscheinlich um einen Phishing-Versuch.


    Wenn Ihnen Unregelmäßigkeiten in Ihren Kontoständen oder verdächtige Nachrichten
    auffallen, ist die erste und wichtigste Maßnahme die sofortige Meldung an unsere
    regionale Filiale oder unsere zentrale Telefon-Hotline. Bei einem konkreten Verdacht
    auf Betrug werden wir Ihr Konto sofort sperren und die zuständigen Aufsichtsbehörden
    informieren, um weiteren Schaden abzuwenden.


    Wir empfehlen Ihnen, regelmäßig Ihre Kontoauszüge zu prüfen und die Zwei-Faktor-Authentifizierung
    in unserem digitalen Kundenportal zu aktivieren. So stellen wir gemeinsam sicher,
    dass Ihre staatlichen Zulagen sicher Ihrem Wohnungsbauprojekt zugutekommen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: abc01382-661f-52c1-943e-ab0051d527b0
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Änderung der Bedingungen
  body: "Die Gewährung staatlicher Förderungen unterliegt den gesetzlichen Bestimmungen\
    \ des Bundes sowie den regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank.\
    \ Die Bausparkasse Heimstatt behält sich vor, die Bedingungen für die Abwicklung\
    \ dieser Förderungen anzupassen, sofern sich die gesetzlichen Rahmenbedingungen\
    \ ändern.\n\nDie derzeitigen Fördersätze von 10 % für die Wohnungsbauprämie und\
    \ 9 % für die Arbeitnehmer-Sparzulage basieren auf der aktuellen Gesetzgebung.\
    \ Sollten diese Sätze durch staatliche Verordnungen angepasst werden, erfolgt\
    \ die Umsetzung in Ihren Verträgen automatisch zum jeweils gesetzlich festgelegten\
    \ Stichtag.\n\nÄnderungen der Einkommensgrenzen – derzeit 35.000 € für Alleinstehende\
    \ und 70.000 € für Zusammenveranlagte bei der Wohnungsbauprämie sowie 40.000 €\
    \ bzw. 80.000 € bei der Arbeitnehmer-Sparzulage – werden ebenfalls unmittelbar\
    \ nach Inkrafttreten der neuen gesetzlichen Regelungen angewendet. \n\nWir informieren\
    \ Sie über wesentliche Änderungen der Vertragsbedingungen in der Regel schriftlich\
    \ oder über das digitale Kundenportal mit einer angemessenen Vorlaufzeit. Da es\
    \ sich bei diesen Leistungen um staatliche Zulagen handelt, ist die Bausparkasse\
    \ Heimstatt lediglich für die korrekte Administration und Beantragung zuständig;\
    \ der Anspruch auf die Förderung selbst wird durch das Finanzamt geprüft.\n\n\
    Ein Vertrag zur staatlichen Förderung endet mit der Zuteilung des Bauspardarlehens,\
    \ der Kündigung des zugrunde liegenden Sparvertrags oder durch den Wegfall der\
    \ gesetzlichen Anspruchsvoraussetzungen. Wir weisen darauf hin, dass eine Fehlberatung\
    \ bezüglich der steuerlichen Behandlung nicht durch die Bank ersetzt wird; für\
    \ spezifische rechtliche Details verweisen wir an zertifizierte Fachleute."
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 9dc17e05-5b67-5eca-bd17-8c6b2d4b9460
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Schritt für Schritt starten
  body: "Dieses Dokument dient als Leitfaden für Support-Mitarbeiter bei der Unterstützung\
    \ von Kunden, die staatliche Förderungen in ihren Bausparvertrag integrieren möchten.\n\
    \nUm den Prozess der staatlichen Förderung erfolgreich zu starten, sind folgende\
    \ Schritte zwingend einzuhalten:\n\n1. Identitätsprüfung: Bevor Kontoinformationen\
    \ abgeglichen oder Förderanträge gestellt werden, muss eine eindeutige Identitätsprüfung\
    \ erfolgen. Dies geschieht durch die Vorlage eines gültigen Ausweisdokuments in\
    \ der Filiale oder über die Zwei-Faktor-Authentifizierung im Portal.\n\n2. Bedarfsanalyse\
    \ und Prüfung der Einkommensgrenzen: Prüfen Sie mit dem Kunden, welche Förderung\
    \ in Frage kommt. \n   - Wohnungsbauprämie (10 %): Einkommen bis 35.000 € (alleinstehend)\
    \ bzw. 70.000 € (zusammenveranlagt).\n   - Arbeitnehmer-Sparzulage (9 %): Einkommen\
    \ bis 40.000 € (alleinstehend) bzw. 80.000 € (zusammenveranlagt).\n\n3. Festlegung\
    \ der Sparrate: Unterstützen Sie den Kunden bei der Wahl einer Rate, die die maximale\
    \ Förderquote ausschöpft. Beachten Sie hierbei die Höchstbeträge für die prämienbegünstigte\
    \ Sparleistung (z. B. 700 € für Alleinstehende bei der Wohnungsbauprämie).\n\n\
    4. Vertragliche Hinterlegung: Die Option 'staatliche Förderung' muss im System\
    \ aktiviert werden. Informieren Sie den Kunden darüber, dass die Bank den administrativen\
    \ Aufwand zur Zinssicherung und Antragstellung übernimmt.\n\n5. Bestätigung und\
    \ Dokumentation: Der Kunde erhält eine schriftliche Bestätigung über die aktivierten\
    \ Förderoptionen. Weisen Sie den Kunden darauf hin, dass die endgültige Zuteilung\
    \ der Prämien durch das Finanzamt erfolgt.\n\nFür detaillierte Informationen zu\
    \ den Voraussetzungen verweisen Sie bitte auf das Dokument Wohnungsbauprämie und\
    \ Arbeitnehmer-Sparzulage — Voraussetzungen."
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: fef3bbf5-acf1-5afe-abea-cba80829a37c
  title: 'Wohnungsbauprämie und Arbeitnehmer-Sparzulage — prämienbegünstigte Sparleistung
    bei Zusammenveranlagung: Erklärung'
  body: 'Frage: Wie verändert sich die prämienbegünstigte Sparleistung, wenn ich mit
    meinem Ehepartner zusammenveranlagt bin?


    Antwort: Bei einer Zusammenveranlagung erhöht sich der Rahmen für die staatliche
    Unterstützung deutlich. Während für Alleinstehende die maximale prämienbegünstigte
    Sparleistung für die Wohnungsbauprämie bei 700 € liegt, beträgt diese bei gemeinsam
    Veranlagten insgesamt 1.400 €.


    Frage: Welche Einkommensgrenze gilt in diesem Fall für den Erhalt der Wohnungsbauprämie?


    Antwort: Für Paare, die gemeinsam veranlagt werden, liegt die Einkommensgrenze
    zur Qualifikation für die Wohnungsbauprämie bei 70.000 €. Liegt das gemeinsame
    Einkommen darüber, entfällt der Anspruch auf die Förderung von 10 % auf die Einzahlungen.


    Weitere Details zu den Einkommensgrenzen finden Sie in unserem Dokument Wohnungsbauprämie
    und Arbeitnehmer-Sparzulage — Überblick.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 82defa42-c4f2-5686-aa60-05c64b13b79c
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — etwas ändern
  body: 'Wenn sich Ihre persönlichen Verhältnisse ändern – beispielsweise durch eine
    Heirat, eine Scheidung oder eine signifikante Änderung Ihres Einkommens – ist
    es wichtig, Ihre Daten bei uns zu aktualisieren. Dies stellt sicher, dass Sie
    die staatlichen Förderungen weiterhin korrekt und in voller Höhe erhalten.


    Folgen Sie diesen Schritten, um Ihre Angaben zu ändern:


    1. Unterlagen bereitstellen: Halten Sie die entsprechenden Nachweise bereit (z.
    B. Heiratsurkunde oder den aktuellen Einkommensteuerbescheid), um die neue Förderberechtigung
    zu belegen.


    2. Identitätsprüfung: Wir führen zu Beginn des Gesprächs eine zwingend erforderliche
    Identitätsprüfung durch, indem Sie uns Ihr Ausweisdokument vorlegen oder die Zwei-Faktor-Authentifizierung
    nutzen.


    3. Änderung mit uns abstimmen: Teilen Sie uns mit, welcher Status sich geändert
    hat (z. B. Wechsel von Alleinstehend zu Zusammenveranlagt). Wir prüfen daraufhin,
    ob sich dadurch die maximale prämienbegünstigte Sparleistung erhöht – beispielsweise
    von 700 € auf 1.400 € bei der Wohnungsbauprämie.


    4. Anpassung der Sparrate: Falls Sie durch die Änderung einen höheren Förderrahmen
    nutzen möchten, vereinbaren wir gemeinsam eine Anpassung Ihres monatlichen Sparbeitrags,
    um die maximale Förderung von 10 % bzw. 9 % optimal zu nutzen.


    5. Bestätigung erhalten: Wir bestätigen Ihnen die Änderung der Daten und der Förderoptionen
    schriftlich oder über Ihr digitales Kundenportal. Damit ist der Vorgang abgeschlossen
    und die korrekte Meldung an die Finanzbehörden ist sichergestellt.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: ec9ce0b4-9107-51fa-b801-75a7ce6b6671
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Probleme mit Zugang oder
    Login
  body: 'Sollten Sie Schwierigkeiten haben, auf Ihr digitales Kundenportal zuzugreifen,
    um den Status Ihrer staatlichen Förderungen einzusehen, prüfen Sie bitte die folgenden
    Punkte in der genannten Reihenfolge.


    Symptom: ''Login fehlgeschlagen'' oder ''Zugriff verweigert'' beim Versuch, das
    Portal zu öffnen.


    1. Überprüfung der Zugangsdaten: Stellen Sie sicher, dass Benutzername und Passwort
    korrekt eingegeben wurden. Beachten Sie dabei die Groß- und Kleinschreibung.


    2. Zwei-Faktor-Authentifizierung (2FA): Prüfen Sie, ob Sie die erforderliche Bestätigung
    auf Ihrem registrierten Endgerät erhalten haben. Ohne diesen Schritt ist ein Login
    aus Sicherheitsgründen nicht möglich, da wir strikte Verifikationsprotokolle anwenden.


    3. Browser- und Cache-Probleme: Versuchen Sie, den Cache Ihres Browsers zu leeren
    oder einen anderen Webbrowser zu verwenden, um technische Inkompatibilitäten auszuschließen.


    4. Status der Identitätsprüfung: Falls Ihr Konto nach einer längeren Inaktivität
    gesperrt wurde, ist eine erneute Identitätsprüfung durch Ausweisdokumente erforderlich.


    Wenn diese Schritte nicht zur Lösung führen, werden wir den Fall intern eskalieren.
    Wir leiten Ihr Anliegen hierarchisch über die Filialleitung an die zuständige
    Fachabteilung für Digital Services oder das Beschwerdemanagement weiter. Sie erhalten
    innerhalb von drei Werktagen eine Rückmeldung über den aktuellen Bearbeitungsstand
    oder eine Anleitung zur manuellen Freischaltung Ihres Zugangs.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 8475f1f5-5aeb-5752-8136-7cddfc312496
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Zugangsstufen
  body: 'Diese Matrix dient Support-Mitarbeitern zur schnellen Bestimmung der Förderberechtigung
    basierend auf dem Status und Einkommen des Kunden.


    | Status | Einkommen (max.) | Förderung | Fördersatz | Max. Sparleistung |

    | :--- | :--- | :--- | :--- | :--- |

    | Alleinstehend | 35.000 € | Wohnungsbauprämie | 10 % | 700 € |

    | Zusammenveranlagt | 70.000 € | Wohnungsbauprämie | 10 % | 1.400 € |

    | Alleinstehend | 40.000 € | Arbeitnehmer-Sparzulage | 9 % | 470 € (Beitrag) |

    | Zusammenveranlagt | 80.000 € | Arbeitnehmer-Sparzulage | 9 % | 470 € (Beitrag)
    |


    Hinweis: Die Arbeitnehmer-Sparzulage setzt zusätzlich ein bestehendes Beschäftigungsverhältnis
    voraus. Bei Überschreitung der genannten Einkommensgrenzen entfällt der Anspruch
    auf die jeweilige staatliche Förderung.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 4dbc84a4-766f-56b7-b3fb-5f6145e8a40a
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — zwischen Tarifen wählen
  body: 'Bei der Entscheidung, welche staatliche Förderung für Ihr Sparziel am vorteilhaftesten
    ist, sollten Sie die unterschiedlichen Voraussetzungen und Sätze betrachten.


    Die Wohnungsbauprämie bietet mit einem Fördersatz von 10 % die höchste Rendite
    auf Ihre Einzahlungen. Sie ist ideal für alle, die ein Einkommen bis maximal 35.000
    € (alleinstehend) bzw. 70.000 € (zusammenveranlagt) haben und eine prämienbegünstigte
    Sparleistung von bis zu 700 € bzw. 1.400 € nutzen möchten.


    Die Arbeitnehmer-Sparzulage hingegen ist mit einem Fördersatz von 9 % geringfügig
    niedriger, bietet jedoch höhere Einkommensgrenzen: Hier liegt die Grenze bei 40.000
    € für Alleinstehende und 80.000 € für Zusammenveranlagte. Sie ist die richtige
    Wahl für Erwerbstätige, deren Einkommen die Grenzen der Wohnungsbauprämie überschreitet,
    aber noch innerhalb der Zulagen-Grenzen liegt, wobei ein maximaler Beitrag von
    470 € berücksichtigt wird.


    In vielen Fällen ist eine Kombination beider Förderungen möglich und sinnvoll,
    um das Eigenkapital für den zukünftigen Wohnungsbau maximal zu steigern. Wir beraten
    Sie gerne individuell zu der für Sie optimalen Kombination.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 052362c4-cbf0-5a95-b757-08dee7d377ee
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Datenschutz und Datenverarbeitung
  body: 'Die Bausparkasse Heimstatt verarbeitet personenbezogene Daten im Rahmen der
    staatlichen Förderung strikt nach den regulatorischen Vorgaben der BaFin und der
    Deutschen Bundesbank sowie den Bestimmungen des BGB.


    Zur Beantragung der Wohnungsbauprämie (Fördersatz 10 %) und der Arbeitnehmer-Sparzulage
    (Fördersatz 9 %) ist die Erhebung und Verarbeitung von Einkommensdaten sowie dem
    Familienstand unerlässlich. Diese Daten werden ausschließlich dazu verwendet,
    Ihre Berechtigung im Hinblick auf die geltenden Einkommensgrenzen (z. B. 35.000
    € bzw. 70.000 € für die Wohnungsbauprämie) zu prüfen und die entsprechenden Anträge
    an die zuständigen Finanzbehörden zu übermitteln.


    Gemäß unseren Sicherheitsrichtlinien ist vor jeder Herausgabe von Kontoinformationen
    oder der Änderung von Förderstatus eine eindeutige Identitätsprüfung, etwa durch
    Ausweisdokumente oder eine Zwei-Faktor-Authentifizierung, zwingend erforderlich.
    Dies dient dem Schutz Ihrer Daten vor nicht autorisiertem Zugriff.


    Wir weisen darauf hin, dass wir eine umfassende Produktberatung anbieten, jedoch
    keine individualisierte Steuer- oder Rechtsberatung erbringen. Die endgültige
    Prüfung der Förderberechtigung und die Auszahlung der Zulagen obliegen der zuständigen
    Finanzbehörde. Wir halten uns an einen hohen Sorgfaltsstandard bei der Übermittlung
    Ihrer Daten, verweisen jedoch für spezifische rechtliche Details zur steuerlichen
    Veranlagung an zertifizierte Fachleute.


    Ihre Daten werden sicher in unseren Systemen gespeichert und nur an die gesetzlich
    vorgeschriebenen Aufsichtsbehörden oder Finanzämter weitergegeben, sofern dies
    zur Abwicklung der staatlichen Förderungen erforderlich ist.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: disclosure
