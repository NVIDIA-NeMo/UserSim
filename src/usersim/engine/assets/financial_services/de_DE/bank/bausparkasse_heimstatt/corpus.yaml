  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 7219d095-1f47-5e27-8751-9245b9c5f3c0
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — fehlgeschlagener oder ausstehender
    Vorgang
  body: 'Sollten Sie feststellen, dass die erwarteten staatlichen Zuschüsse nicht
    auf Ihrem Konto eingegangen sind oder eine Beantragung fehlgeschlagen ist, prüfen
    Sie bitte folgende Punkte:


    Symptom: Die Wohnungsbauprämie wurde nicht gutgeschrieben.

    Mögliche Ursachen:

    - Ihr Jahreseinkommen hat die Grenze von 35.000 € (allein) bzw. 70.000 € (gemeinsam)
    überschritten.

    - Die prämienbegünstigten Einzahlungen lagen in dem Kalenderjahr unter dem für
    die volle Förderung erforderlichen Betrag oder überschritten die maximal förderfähige
    Summe von 700 € (allein) bzw. 1.400 € (gemeinsam), wodurch die Berechnung variiert.

    - Es liegt eine Lücke in der Identitätsprüfung vor.


    Symptom: Die Arbeitnehmer-Sparzulage fehlt.

    Mögliche Ursachen:

    - Die Einkommensgrenzen von 40.000 € (allein) bzw. 80.000 € (gemeinsam) wurden
    überschritten.

    - Die maximale Beitragsleistung von 470 € wurde nicht korrekt über den Arbeitgeber
    oder das Konto abgebildet.


    Was Sie jetzt tun können:

    1. Überprüfen Sie Ihre letzten Einkommensnachweise auf Änderungen.

    2. Gleichen Sie Ihre Einzahlungen des letzten Jahres mit den Fördergrenzen ab.

    3. Bitten Sie uns um eine detaillierte Aufstellung Ihrer prämienbegünstigten Einzahlungen.


    Wenn die Ursache nicht eindeutig ist, leiten wir den Vorgang intern an unsere
    Fachabteilung für staatliche Förderungen weiter. Wir prüfen die Kommunikation
    mit den zuständigen Behörden und informieren Sie innerhalb von zehn Werktagen
    über das Ergebnis der Prüfung.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: a3d9ed5f-10b8-5821-a441-4eb9ea74a867
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Voraussetzungen
  body: 'Um die staatlichen Förderungen in Anspruch nehmen zu können, müssen folgende
    Voraussetzungen erfüllt sein:


    | Förderart | Status | Einkommensgrenze | Ergebnis |

    | :--- | :--- | :--- | :--- |

    | Wohnungsbauprämie | Alleinstehend | bis 35.000 € | Förderberechtigt (10 % Zuschuss)
    |

    | Wohnungsbauprämie | Zusammenveranlagt | bis 70.000 € | Förderberechtigt (10
    % Zuschuss) |

    | Arbeitnehmer-Sparzulage | Alleinstehend | bis 40.000 € | Förderberechtigt (9
    % Zuschuss) |

    | Arbeitnehmer-Sparzulage | Zusammenveranlagt | bis 80.000 € | Förderberechtigt
    (9 % Zuschuss) |


    Zusätzliche Bedingungen:

    - Für die Wohnungsbauprämie ist eine maximale förderfähige Sparleistung von 700
    € (allein) bzw. 1.400 € (gemeinsam) zu beachten.

    - Für die Arbeitnehmer-Sparzulage gilt eine maximale förderfähige Beitragsleistung
    von 470 €.

    - Eine erfolgreiche Identitätsprüfung ist für alle Anträge zwingend erforderlich.'
