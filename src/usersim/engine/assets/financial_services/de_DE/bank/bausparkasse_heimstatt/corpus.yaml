  product_category: bausparen_rendite
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: db3e2e70-183a-51c0-afb0-85e877e0d2b5
  title: Bausparvertrag Heimstatt Rendite — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Bausparvertrag Heimstatt Rendite beenden oder in ein anderes
    Modell wechseln möchten, führen Sie bitte die folgenden Schritte aus:


    **Voraussetzungen:**

    Sie benötigen ein gültiges Identifikationsdokument (z. B. Personalausweis) und
    Ihre Vertragsnummer.


    **Schritte zur Kündigung oder zum Tarifwechsel:**


    1. **Antragstellung:** Teilen Sie uns schriftlich oder über unser digitales Kundenportal
    mit, ob Sie den Vertrag vollständig kündigen oder in einen anderen Tarif (z. B.
    den Bausparvertrag Heimstatt Classic) wechseln möchten.

    2. **Identitätsprüfung:** Wir führen eine zwingende Identitätsprüfung durch. Hierzu
    legen Sie uns entweder Ihren Ausweis vor oder bestätigen den Vorgang über die
    Zwei-Faktor-Authentifizierung Ihres Portals.

    3. **Prüfung der Vertragslage:** Wir prüfen Ihr aktuelles Guthaben und die erreichten
    Bewertungszahlen. Dabei wird ermittelt, ob eine vorzeitige Kündigung Auswirkungen
    auf die Guthabenzinsen von 1,5 % hat.

    4. **Bestätigung und Abschluss:** Wir senden Ihnen eine schriftliche Bestätigung
    über die Schließung des Kontos oder den Tarifwechsel zu.

    5. **Auszahlung:** Im Falle einer Kündigung wird das Gesamtguthaben unter Berücksichtigung
    etwaiger noch offener Posten auf Ihr hinterlegtes Referenzkonto überwiesen.


    **Ergebnis:**

    Der Vorgang ist abgeschlossen, sobald Sie die Bestätigung erhalten haben und die
    entsprechende Gutschrift auf Ihrem Konto eingegangen ist.


    Falls Sie unsicher sind, ob ein Wechsel sinnvoll ist, verweisen wir auf das Dokument
    Bausparvertrag Heimstatt Rendite — im Vergleich zu einem ähnlichen Produkt des
    Hauses.'
