- id: 380c06df-1ecb-5c55-ab08-f0b0cbf5e941
  title: Bausparvertrag Heimstatt Classic — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Beratung von Kunden,
    die über einen Wechsel vom Bausparvertrag Heimstatt Classic in ein anderes Produkt
    nachdenken.


    **Vergleich: Classic vs. Rendite**


    Der Bausparvertrag Heimstatt Classic ist die ausgewogene Basisoption. Er zeichnet
    sich durch einen niedrigen Darlehenszins von 2,45 % aus, bietet jedoch einen moderaten
    Guthabenzins von 0,5 %.


    Ein Wechsel zum Bausparvertrag Heimstatt Rendite lohnt sich in folgenden Fällen:

    *   **Fokus auf Sparen**: Wenn der Kunde primär an attraktiven Guthabenzinsen
    interessiert ist und das Darlehen erst in sehr ferner Zukunft oder gar nicht beanspruchen
    möchte. Das Rendite-Produkt bietet höhere Zinsen für Sparer, jedoch auch höhere
    Kosten für das spätere Darlehen.

    *   **Geringere Darlehensbedürftigkeit**: Wenn die Planungssicherheit eines niedrigen
    Zinses (2,45 %) weniger wichtig ist als der aktuelle Zuwachs des Kapitals.


    **Wann der Verbleib im Classic-Tarif ratsam ist:**

    *   **Sicherung niedriger Baukosten**: Für Familien und zukünftige Eigenheimbesitzer,
    die eine möglichst günstige Finanzierung ihres Bauvorhabens anstreben. Der Zinssatz
    von 2,45 % ist hier der entscheidende Vorteil.

    *   **Stabilität**: Kunden, die ein ausgewogenes Verhältnis zwischen Sparphase
    (0,5 %) und Darlehensphase suchen.


    **Wichtiger Hinweis:**

    Ein Tarifwechsel kann Auswirkungen auf die bereits erreichte Bewertungszahl und
    den Weg zur Zuteilung (Mindestsparguthaben 40 %) haben. Prüfen Sie dies stets
    gemeinsam mit dem Kunden.


    Weitere Details zum Vergleich finden Sie unter Bausparvertrag Heimstatt Classic
    — im Vergleich zu einem ähnlichen Produkt des Hauses.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: comparison
  source_authority: official
