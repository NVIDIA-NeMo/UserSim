- id: 1536d177-559b-5f9f-8872-ac8a189b3dd1
  title: Modernisierungsdarlehen ohne Grundschuld — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter bei der Unterstützung
    von Kunden, die ein Modernisierungsdarlehen ohne Grundschuld abschließen möchten.
    Ziel ist eine strukturierte Abwicklung im Einklang mit unseren Sicherheits- und
    Compliance-Richtlinien.


    Schritt 1: Identitätsprüfung und Bedarfsanalyse

    Bevor spezifische Konditionen besprochen werden, muss eine eindeutige Identitätsprüfung
    erfolgen (Ausweisdokumente oder 2FA). Klären Sie den Modernisierungsbedarf des
    Kunden. Das Produkt ist ideal für kleinere Renovierungen ohne die Notwendigkeit
    einer Grundschuld.


    Schritt 2: Festlegung der Darlehenssumme

    Prüfen Sie den gewünschten Betrag. Das Modernisierungsdarlehen ohne Grundschuld
    bietet einen maximalen Darlehensbetrag von 50.000 €. Erläutern Sie dem Kunden
    das repräsentative Beispiel, um die Kostenstruktur zu verdeutlichen:

    - Darlehensbetrag: 20.000 €

    - Laufzeit: 120 Monate

    - Monatliche Rate: 210,12 €

    - Effektiver Jahreszins: 4,9 %

    - Gesamtkosten: 5.214,40 €


    Schritt 3: Bonitätsprüfung und Unterlagenprüfung

    Leiten Sie den Antrag an die zuständige Fachabteilung zur Prüfung der Kreditwürdigkeit
    weiter. Informieren Sie den Kunden über die notwendigen Nachweise zur Einkommenssituation,
    da wir strikt nach BaFin-Vorgaben agieren.


    Schritt 4: Vertragsabschluss und Auszahlung

    Nach positiver Prüfung wird der Vertrag erstellt. Weisen Sie den Kunden darauf
    hin, dass Abschlussgebühren zur Deckung des administrativen Aufwands anfallen,
    diese jedoch bei besonders hohen Vertragsvolumina oder im Rahmen von Aktionsangeboten
    reduziert werden können.


    Schritt 5: Aktivierung und Monitoring

    Nach Unterzeichnung wird der Betrag auf das Konto des Kunden ausgezahlt. Unterstützen
    Sie den Kunden bei der ersten Anmeldung im digitalen Kundenportal während der
    regulären Geschäftszeiten.


    Bei Fragen zu den Voraussetzungen verweisen Sie bitte auf Modernisierungsdarlehen
    ohne Grundschuld — Voraussetzungen.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: product_sheet
