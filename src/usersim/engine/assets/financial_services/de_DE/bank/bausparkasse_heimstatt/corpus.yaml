- id: 8cfe341d-e71f-50ed-9411-243e977b169a
  title: Bausparvertrag Heimstatt Classic — Überblick
  body: "Der Bausparvertrag Heimstatt Classic ist die ausgewogene Basisoption für\
    \ Kunden, die eine sichere Kombination aus dem Aufbau von Eigenkapital und einer\
    \ planbaren Finanzierung für ihr späteres Bauvorhaben suchen. Wir bieten Ihnen\
    \ mit diesem Produkt die notwendige Planungssicherheit durch festgeschriebene\
    \ Zinsen, sodass Sie sich heute bereits auf die Konditionen Ihrer zukünftigen\
    \ Finanzierung verlassen können.\n\nIm Zentrum dieses Vertrages steht die Balance\
    \ zwischen attraktiven Sparmöglichkeiten und kostengünstigen Darlehen. Für Ihre\
    \ Einzahlungen erhalten Sie einen Guthabenzins von 0,5 %. Wenn Ihr Vertrag die\
    \ erforderliche Bewertung erreicht hat und die Zuteilung erfolgt, steht Ihnen\
    \ das Bauspardarlehen zu einem festen Zinssatz von 2,45 % zur Verfügung.\n\nUm\
    \ den administrativen Aufwand für die langfristige Zinssicherung zu decken, fällt\
    \ bei Vertragsabschluss eine Abschlussgebühr in Höhe von 1,6 % der Bausparsumme\
    \ an. Wir unterstützen Sie dabei, Ihre Sparziele effizient zu erreichen: Der regelmäßige\
    \ monatliche Sparbeitrag ist auf 0,4 % der Bausparsumme festgesetzt. \n\nEin wesentlicher\
    \ Meilenstein Ihres Vertrages ist das Mindestsparguthaben. Damit Ihr Vertrag für\
    \ eine Zuteilung bereitsteht, muss ein Mindestsparguthaben von 40 % der Bausparsumme\
    \ erreicht worden sein. Durch diese Struktur gewährleisten wir eine solide Eigenkapitalbasis\
    \ für Ihr Vorhaben.\n\nWir empfehlen Ihnen, in Kombination mit diesem Vertrag\
    \ auch die staatlichen Förderungen zu prüfen, um Ihr Eigenkapital weiter zu maximieren.\
    \ Für eine detaillierte Auflistung aller anfallenden Kosten verweisen wir auf\
    \ das Dokument Bausparvertrag Heimstatt Classic — Preis- und Leistungsverzeichnis.\
    \ Mit dem Bausparvertrag Heimstatt Classic schaffen Sie ein stabiles Fundament\
    \ für Ihr Eigenheim und profitieren von der regionalen Verwurzelung und Verlässlichkeit\
    \ unserer Institution."
  domain: retail_banking
  product_category: bausparen_classic
  document_type: product_sheet
  source_authority: official
