  institution_id: bausparkasse_heimstatt
- id: 05f8f704-040c-5267-81f3-c8adc24a220a
  title: Modernisierungsdarlehen ohne Grundschuld — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugriff auf Ihr digitales Kundenportal haben,
    um Informationen zu Ihrem Modernisierungsdarlehen ohne Grundschuld einzusehen,
    finden Sie hier die entsprechenden Lösungsschritte.


    Symptom: Die Fehlermeldung ''Zugriff verweigert'' oder ein dauerhaftes Laden der
    Seite beim Login-Versuch.


    Wahrscheinliche Ursachen:

    - Falsche Eingabe der Zugangsdaten.

    - Abgelaufene Zwei-Faktor-Authentifizierung (2FA) Sitzung.

    - Sicherheitsperre aufgrund mehrfacher fehlerhafter Passworteingaben.


    Was Sie in dieser Reihenfolge prüfen sollten:

    1. Überprüfen Sie die Groß- und Kleinschreibung Ihres Passworts sowie die korrekte
    Eingabe Ihrer Kundennummer.


    2. Stellen Sie sicher, dass Ihr mobiles Endgerät für den Empfang des 2FA-Codes
    erreichbar ist.


    3. Prüfen Sie, ob Ihr Browser auf dem neuesten Stand ist oder versuchen Sie es
    mit einem anderen Webbrowser.


    Lösung und Behebung:

    Wenn die oben genannten Prüfungen keinen Erfolg bringen, können wir die Blockierung
    Ihres Kontos im Gespräch aufheben. Hierzu ist eine strikte Identitätsprüfung zwingend
    erforderlich (z. B. Abgleich von Ausweisdokumenten). Wir setzen Ihren Zugang dann
    zurück und leiten Ihnen einen temporären Aktivierungscode zu.


    Eskalation:

    Sollte der Login-Fehler trotz Identitätsprüfung weiterhin bestehen, wird der Fall
    hierarchisch über die Filialleitung an unsere zentrale Fachabteilung für digitale
    Dienste weitergeleitet. Sie werden innerhalb von zwei Werktagen über den Fortschritt
    informiert.


    Für weitere Informationen zum Datenschutz bei der Nutzung des Portals besuchen
    Sie Modernisierungsdarlehen ohne Grundschuld — Datenschutz und Datenverarbeitung.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 1c4459c7-90b2-5ac9-97c3-f24df6be8d3d
  title: Modernisierungsdarlehen ohne Grundschuld — Zugangsstufen
  body: 'Dieses Dokument dient Support-Mitarbeitern zur schnellen Einstufung der Kreditwürdigkeit
    und des Zugangsberechtigung für das Modernisierungsdarlehen ohne Grundschuld.


    | Kriterium | Stufe A (Standard) | Stufe B (Bevorzugt) | Ergebnis/Auswirkung |

    | :--- | :--- | :--- | :--- |

    | Einkommensnachweis | Regelmäßiges Einkommen vorhanden | Hohes, stabiles Einkommen
    | Grundvoraussetzung für Kreditgewährung |

    | Bonitätsprüfung | Keine negativen SCHUFA-Einträge | Hervorragende Bonität |
    Bestimmt die finale Zusage |

    | Darlehensbetrag | Bis zu 25.000 € | Bis zu 50.000 € | Maximalbetrag ist 50.000
    € |

    | Identitätsprüfung | Ausweisdokument + 2FA | Ausweisdokument + 2FA | Zwingend
    erforderlich für alle Stufen |

    | Dokumentation | Standard-Nachweise | Erweiterte Nachweise | Notwendig für Beträge
    > 20.000 € |


    Hinweis für Mitarbeiter: Die Zuweisung zu einer Stufe erfolgt durch die Fachabteilung
    nach Prüfung der eingereichten Unterlagen. Der effektive Jahreszins von 4,9 %
    gilt als repräsentativer Wert für die Standardkonditionen.'
