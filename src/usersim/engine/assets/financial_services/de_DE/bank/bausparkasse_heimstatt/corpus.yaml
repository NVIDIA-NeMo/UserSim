  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 9edffa85-5369-522a-aec0-09a3fbfb490a
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Vermittlung und Verwaltung
    der staatlichen Förderung im Rahmen der Verträge der Bausparkasse Heimstatt. Die
    Inanspruchnahme der Wohnungsbauprämie und der Arbeitnehmer-Sparzulage erfolgt
    auf Grundlage der jeweils geltenden gesetzlichen Bestimmungen des Bundes sowie
    der regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank.


    1. Anspruchsvoraussetzungen und Einkommensgrenzen

    Der Anspruch auf die Wohnungsbauprämie ist an die Einhaltung bestimmter Einkommensgrenzen
    gebunden. Für Alleinstehende liegt diese Grenze bei maximal 35.000 €, bei Zusammenveranlagung
    bei maximal 70.000 €. Die Arbeitnehmer-Sparzulage kann in Anspruch genommen werden,
    sofern das Einkommen für Alleinstehende 40.000 € und bei Zusammenveranlagung 80.000
    € nicht übersteigt.


    2. Höchstbeträge und Fördersätze

    Die Wohnungsbauprämie wird mit einem Satz von 10 % auf die prämienbegünstigte
    Sparleistung gewährt. Die maximale Sparsumme, für die diese Prämie gewährt wird,
    beträgt 700 € für Alleinstehende und 1.400 € für gemeinsam Sparer. Für die Arbeitnehmer-Sparzulage
    gilt ein Fördersatz von 9 %, wobei die maximale jährliche Einzahlung für die Zulage
    470 € beträgt.


    3. Pflichten des Kunden

    Der Kunde ist verpflichtet, der Bausparkasse Heimstatt alle für die Prüfung der
    Förderfähigkeit relevanten Einkommensnachweise und Steuerdaten wahrheitsgemäß
    und zeitnah zur Verfügung zu stellen. Eine fehlerhafte Angabe kann zum Verlust
    des staatlichen Anspruchs sowie zur Rückforderung bereits ausgezahlter Prämien
    führen.


    4. Beendigung und Änderung

    Die Verwaltung der staatlichen Förderung endet mit der Schließung des zugrunde
    liegenden Bausparvertrages oder beim Wegfall der gesetzlichen Voraussetzungen.
    Änderungen der Konditionen erfolgen ausschließlich durch die zuständigen staatlichen
    Stellen. Die Bausparkasse Heimstatt wird über solche Änderungen informieren, sofern
    dies im Rahmen der gesetzlichen Vorgaben erforderlich ist.


    5. Haftung

    Die Bausparkasse Heimstatt haftet für die korrekte Übermittlung der Anträge, übernimmt
    jedoch keine Haftung für die Entscheidung der zuständigen Finanzbehörden über
    die Gewährung der Zulagen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: terms_conditions
  source_authority: official
