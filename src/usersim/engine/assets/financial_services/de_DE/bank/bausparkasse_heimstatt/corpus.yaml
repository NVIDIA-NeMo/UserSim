  product_category: bausparen_rendite
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 8c4ce8ef-6992-5310-a31c-fabde0f5896c
  title: Bausparvertrag Heimstatt Rendite — unerwartetes Entgelt oder unerwarteter
    Betrag
  body: 'Wenn ein Kunde eine Abweichung bei den Beträgen auf seinem Konto feststellt,
    gehen Sie bitte nach folgendem Schema vor:


    **Symptom: Ein unerwarteter Abzug beim Vertragsstart**

    - **Mögliche Ursache:** Es handelt sich höchstwahrscheinlich um die einmalige
    Abschlussgebühr. Diese beträgt beim Bausparvertrag Heimstatt Rendite genau 1 %
    der Bausparsumme.

    - **Prüfung:** Gleichen Sie die Bausparsumme des Kunden mit dem abgezogenen Betrag
    ab. Wenn der Betrag genau 1 % entspricht, ist dies die reguläre Gebühr zur Zinssicherung.

    - **Lösung:** Erklären Sie dem Kunden, dass diese Gebühr dem administrativen Aufwand
    zur langfristigen Sicherung der Konditionen dient.


    **Symptom: Die Darlehensrate ist höher als bei anderen Produkten erwartet**

    - **Mögliche Ursache:** Der Kunde vergleicht eventuell die Kosten mit einem Classic-Tarif.
    Der Bausparvertrag Heimstatt Rendite hat einen höheren Darlehenszins von 3,95
    %.

    - **Prüfung:** Prüfen Sie den gewählten Tarif im System. Bestätigen Sie, dass
    der Zinssatz von 3,95 % korrekt hinterlegt ist.

    - **Lösung:** Erläutern Sie dem Kunden den Trade-off: Er erhält im Gegenzug einen
    attraktiveren Guthabenzins von 1,5 % während der Sparphase.


    **Symptom: Fehlende Zinsgutschrift**

    - **Mögliche Ursache:** Zinsen werden jährlich gutgeschrieben. Wenn das Kalenderjahr
    noch nicht abgeschlossen ist, ist keine Gutschrift zu erwarten.

    - **Prüfung:** Prüfen Sie das Datum der letzten Zinsgutschrift.

    - **Lösung:** Informieren Sie den Kunden über den jährlichen Rhythmus der Zinsgutschrift
    von 1,5 %.


    **Eskalation:**

    Sollte eine Differenz bestehen, die nicht durch diese Werte (1 % Abschlussgebühr,
    3,95 % Darlehenszins, 1,5 % Guthabenzins) erklärt werden kann, leiten Sie den
    Fall hierarchisch über die Filialleitung an das Beschwerdemanagement weiter.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: dbc3c5a2-5c86-5e85-8904-f3df6c6b70ef
  title: Bausparvertrag Heimstatt Rendite — erforderliche Unterlagen
  body: 'Um einen Bausparvertrag Heimstatt Rendite abzuschließen oder eine Zuteilung
    zu beantragen, müssen folgende Dokumente eingereicht werden:


    | Dokument | Zweck | Erforderlichkeit |

    | :--- | :--- | :--- |

    | Gültiges Ausweisdokument | Eindeutige Identitätsprüfung gemäß unseren Sicherheitsprotokollen
    | Zwingend erforderlich |

    | Einkommensnachweis | Prüfung der Tragfähigkeit der monatlichen Sparrate (0,5
    % der Bausparsumme) | Zwingend erforderlich |

    | SEPA-Mandat | Einrichtung des regelmäßigen Sparbeitrags | Zwingend erforderlich
    |

    | Steuer-Identifikationsnummer | Korrekte Abführung der Kapitalertragsteuer auf
    die 1,5 % Guthabenzinsen | Zwingend erforderlich |

    | Nachweis über Eigenkapital | Nachweis zur Erreichung der Mindestsparguthaben-Grenze
    von 50 % | Nur bei Sofort-Zuteilungsantrag |


    Alle Dokumente können entweder physisch in unseren regionalen Filialen vorgelegt
    oder über das digitale Kundenportal hochgeladen werden.'
