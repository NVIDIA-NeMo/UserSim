- id: 110cdcf1-1da2-5227-8af1-d2198180d11c
  title: Bausparvertrag Heimstatt Rendite — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugang zu Ihrem digitalen Kundenportal für
    den Bausparvertrag Heimstatt Rendite haben, finden Sie hier die systematische
    Vorgehensweise zur Behebung des Problems.


    Symptom: Fehlermeldung beim Login oder kein Zugriff auf die Vertragsdetails.


    Ursachen und Prüfschritte:

    1. Überprüfung der Zugangsdaten: Stellen Sie sicher, dass Benutzername und Passwort
    korrekt eingegeben wurden. Beachten Sie die Groß- und Kleinschreibung.

    2. Status der Zwei-Faktor-Authentifizierung: Prüfen Sie, ob Sie den Bestätigungscode
    auf Ihrem registrierten Endgerät erhalten haben. Falls nicht, stellen Sie sicher,
    dass Ihr Gerät über eine aktive Internetverbindung verfügt.

    3. Browser- und Cache-Probleme: Löschen Sie gegebenenfalls Ihren Browser-Cache
    oder versuchen Sie, den Login über ein anderes Gerät oder einen anderen Browser
    durchzuführen.


    Die Lösung:

    - Passwort zurücksetzen: Nutzen Sie die Funktion „Passwort vergessen“, um über
    Ihre hinterlegte E-Mail-Adresse ein neues Passwort zu generieren.

    - Verifizierung aktualisieren: Falls Ihr Mobiltelefon gewechselt wurde, ist eine
    neue Identitätsprüfung erforderlich, da wir aus Sicherheitsgründen keine 2FA-Endgeräte
    ohne Nachweis ändern.


    Wenn die oben genannten Schritte nicht zum Erfolg führen:

    In diesem Fall erfolgt eine Eskalation an die zuständige Fachabteilung. Bitte
    teilen Sie uns Ihren vollständigen Namen und die Vertragsnummer mit. Wir werden
    Ihren Zugang prüfen und Sie über den Lösungsweg informieren.


    Bei dauerhaften technischen Problemen, die eine dringende Einsicht in Ihre Vertragsunterlagen
    erforderlich machen, können Sie sich jederzeit in einer unserer regionalen Filialen
    legitimieren. Dort erhalten Sie nach Vorlage Ihres Ausweises sofortigen Zugriff
    auf Ihre Informationen oder einen aktuellen Kontoauszug. Die Filialleitung koordiniert
    in komplexen Fällen die Kommunikation mit dem Beschwerdemanagement, um eine zeitnahe
    Wiederherstellung Ihres digitalen Zugangs zu gewährleisten.'
