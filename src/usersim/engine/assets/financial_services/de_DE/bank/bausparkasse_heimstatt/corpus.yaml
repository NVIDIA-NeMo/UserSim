  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 6f233024-3a76-5114-979d-e76c713518f8
  title: Bausparvertrag Heimstatt Classic — Zugangsstufen
  body: 'Dieses Dokument dient Support-Mitarbeitern zur schnellen Überprüfung der
    Zugangsvoraussetzungen für den Bausparvertrag Heimstatt Classic.


    | Voraussetzung | Bedingung | Ergebnis/Status |

    | :--- | :--- | :--- |

    | **Identität** | Gültiges Ausweisdokument vorhanden | Zugänglich (nach Verifikation)
    |

    | **Mindestrate** | Monatliche Sparrate ≥ 0,4 % der Bausparsumme | Vertragsschluss
    möglich |

    | **Finanzielle Basis** | Fähigkeit zur Zahlung der Abschlussgebühr (1,6 %) |
    Vertrag aktivierbar |

    | **Zuteilungsreife** | Sparguthaben ≥ 40 % der Bausparsumme + nötige Bewertung
    | Darlehensanspruch (2,45 %) |

    | **Wohnsitz/Recht** | Handlungsfähigkeit gemäß BGB | Vertragsschluss möglich
    |


    Nur wenn alle Bedingungen der ersten Stufe (Identität, Mindestrate und Abschlussgebühr)
    erfüllt sind, kann der Vertrag erfolgreich eröffnet werden. Die Zuteilungsstufe
    wird erst im Laufe der Vertragslaufzeit durch Erreichen der 40 %-Hürde und der
    erforderlichen Bewertungszahl erreicht.'
