- id: d091c5a3-6f8f-5864-a86e-711328830bfa
  title: 'Bausparvertrag Heimstatt Rendite — Abschlussgebühr in Prozent der Bausparsumme:
    Erklärung'
  body: 'Frage: Warum wird bei meinem Bausparvertrag Heimstatt Rendite eine Abschlussgebühr
    erhoben und wie hoch ist diese?


    Antwort: Die Abschlussgebühr dient der Deckung des administrativen Aufwands, der
    mit der Einrichtung Ihres Vertrages und insbesondere mit der langfristigen Sicherung
    der Zinskonditionen verbunden ist. Bei dem Bausparvertrag Heimstatt Rendite beträgt
    diese Gebühr exakt 1 % der vereinbarten Bausparsumme. Diese einmalige Zahlung
    stellt sicher, dass wir Ihnen sowohl den attraktiven Guthabenzins als auch den
    festen Darlehenszins über die gesamte Vertragslaufzeit garantieren können.


    Frage: Gibt es Möglichkeiten, diese Gebühr zu reduzieren?


    Antwort: In der Regel ist die Gebühr von 1 % festgeschrieben. Im Rahmen spezieller
    Aktionsangebote oder bei besonders hohen Vertragsvolumina prüfen wir jedoch gerne,
    ob eine Reduzierung oder ein Erlass der Gebühr möglich ist. Bitte sprechen Sie
    uns in diesem Fall direkt auf aktuelle Sonderkonditionen an.


    Weitere Details zu den Kosten finden Sie im Dokument Bausparvertrag Heimstatt
    Rendite — Preis- und Leistungsverzeichnis.'
