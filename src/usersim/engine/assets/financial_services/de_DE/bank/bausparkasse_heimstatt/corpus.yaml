  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 53acd774-2419-540e-8a64-71fe3643a386
  title: Bausparvertrag Heimstatt Classic — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Identifikation
    von Einschränkungen und Sonderregelungen im Zusammenhang mit dem Bausparvertrag
    Heimstatt Classic.


    **Zuteilungsvoraussetzungen und Grenzen**

    Die wichtigste Einschränkung für den Kunden ist das Mindestsparguthaben. Ein Darlehen
    kann erst beansprucht werden, wenn ein Mindestsparguthaben von 40 % der Bausparsumme
    erreicht wurde und die entsprechende Bewertungzahl vorliegt. Kunden können den
    Zuteilungsantrag nicht vorzeitig stellen, wenn diese Schwelle unterschritten wird,
    ungeachtet der Vertragslaufzeit.


    **Kostenstruktur und administrative Hürden**

    Bei Abschluss des Vertrages fällt eine Abschlussgebühr von 1,6 % der Bausparsumme
    an. Diese Gebühr dient der Deckung des administrativen Aufwands zur langfristigen
    Zinssicherung. Support-Mitarbeiter sollten darauf hinweisen, dass diese Kosten
    bei Vertragsschluss einmalig anfallen und den effektiven Startwert des Sparguthabens
    reduzieren.


    **Zinsbindung und Festlegung**

    Der Darlehenszins von 2,45 % ist festgeschrieben und bietet dem Kunden Planungssicherheit.
    Eine Anpassung dieses Zinses nach Abschluss des Vertrages ist im Regelfall nicht
    möglich, da dies den Kern des Bausparprinzips (Sicherung heutiger Zinsen für die
    Zukunft) widerspricht.


    **Sonderfälle: Gebührenreduktion**

    Gemäß unserer Gebührenphilosophie können Abschlussgebühren in folgenden Sonderfällen
    reduziert oder erlassen werden:

    1. Im Rahmen spezifischer, von der Geschäftsleitung genehmigter Aktionsangebote.

    2. Bei besonders hohen Vertragsvolumina, sofern dies im Rahmen der individuellen
    Vertragsverhandlung mit der Filialleitung vereinbart wurde.


    **Eskalationspfad**

    Sollten Kunden Sonderwünsche äußern, die über diese Parameter hinausgehen (z.
    B. eine Ausnahme bei der Mindestsparquote von 40 %), sind diese Anfragen hierarchisch
    über die Filialleitung an die zuständigen Fachabteilungen oder das Beschwerdemanagement
    weiterzuleiten.


    Für eine detaillierte Übersicht aller Konditionen verweisen Sie bitte auf das
    Dokument Bausparvertrag Heimstatt Classic — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: product_sheet
  source_authority: official
