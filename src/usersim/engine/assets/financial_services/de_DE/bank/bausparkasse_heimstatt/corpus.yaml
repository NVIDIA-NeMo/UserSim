  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 04f32032-e9fc-5a0a-8bb7-5332b134bfcd
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Grenzen, Einschränkungen
    und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter zur präzisen Beantwortung
    von Kundenanfragen bezüglich der Grenzen und Sonderfälle der staatlichen Förderungen.


    Die staatliche Förderung setzt sich aus zwei Hauptkomponenten zusammen, die jeweils
    unterschiedlichen Voraussetzungen unterliegen:


    1. Wohnungsbauprämie

    - Prämiensatz: 10 %

    - Maximal begünstigte Sparleistung (Alleinstehende): 700 €

    - Maximal begünstigte Sparleistung (Zusammenveranlagung): 1.400 €

    - Einkommensgrenze (Alleinstehende): 35.000 €

    - Einkommensgrenze (Zusammenveranlagung): 70.000 €


    2. Arbeitnehmer-Sparzulage

    - Zulagensatz: 9 %

    - Maximal begünstigter Beitrag: 470 €

    - Einkommensgrenze (Alleinstehende): 40.000 €

    - Einkommensgrenze (Zusammenveranlagung): 80.000 €


    Besondere Einschränkungen und Sonderfälle:

    - Überschreitung der Einkommensgrenzen: Wenn das zu versteuernde Einkommen die
    genannten Grenzwerte (z. B. 35.000 € für Alleinstehende bei der Prämie) überschreitet,
    entfällt der Anspruch für das entsprechende Kalenderjahr komplett.

    - Maximalwerte: Ein Kunde, der mehr als 700 € (allein) bzw. 1.400 € (gemeinsam)
    einzahlt, erhält die 10 % Prämie nur auf den maximal begünstigten Betrag. Höhere
    Einzahlungen sind zwar für den späteren Darlehensanteil vorteilhaft, erhöhen aber
    nicht den staatlichen Zuschuss.

    - Kombination: Die Förderungen können nebeneinander in Anspruch genommen werden,
    sofern beide Einkommensgrenzen (z. B. 35.000 € für die Prämie und 40.000 € für
    die Zulage bei Alleinstehenden) gewahrt bleiben.


    Bei komplexen steuerlichen Fragen verweisen Sie den Kunden bitte an einen zertifizierten
    Steuerberater, da wir keine individualisierte Steuerberatung erbringen.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 528bc044-ca9c-5892-986a-8ba69c26a871
  title: 'Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Einkommensgrenze der Wohnungsbauprämie
    für Alleinstehende: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zur Einkommensgrenze
    für Alleinstehende bei der Beantragung der Wohnungsbauprämie.


    Frage: Wie hoch ist die Einkommensgrenze für Alleinstehende, um die Wohnungsbauprämie
    zu erhalten?

    Antwort: Für Alleinstehende liegt die Einkommensgrenze der Wohnungsbauprämie aktuell
    bei 35.000 €. Nur wenn Ihr zu versteuerndes Einkommen diesen Betrag nicht überschreitet,
    haben Sie Anspruch auf die staatliche Förderung.


    Frage: Was passiert, wenn ich knapp über dieser Grenze von 35.000 € liege?

    Antwort: Die Wohnungsbauprämie ist an strikte gesetzliche Vorgaben gebunden. Bei
    einer Überschreitung der Grenze von 35.000 € besteht leider kein rechtlicher Anspruch
    auf die Auszahlung der Prämie für das jeweilige Jahr.


    Frage: Gilt diese Grenze auch für die Arbeitnehmer-Sparzulage?

    Antwort: Nein, die Arbeitnehmer-Sparzulage hat eine separate Einkommensgrenze,
    die für Alleinstehende bei 40.000 € liegt. Details hierzu finden Sie im Dokument
    Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Überblick.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 19212f12-267a-5af6-96fb-feb7794afd6d
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — Status oder Verlauf einsehen
  body: 'In diesem Leitfaden erfahren Sie, wie Sie den aktuellen Status Ihrer staatlichen
    Förderungen sowie den bisherigen Verlauf der Gutschriften einsehen können.


    Bevor Sie beginnen, stellen Sie bitte sicher, dass Sie Ihre Identität nachweisen
    können (z. B. durch Ihr Ausweisdokument), da die Herausgabe von Kontoinformationen
    einer strikten Verifikation unterliegt.


    1. Fordern Sie eine Auskunft über den aktuellen Status Ihrer Förderungen an. Sie
    können uns dies entweder persönlich in einer regionalen Filiale, über unsere Telefon-Hotline
    oder über das digitale Kundenportal mitteilen.

    2. Wir führen eine Identitätsprüfung durch (z. B. via Zwei-Faktor-Authentifizierung
    im Portal oder durch Vorlage Ihres Personalausweises in der Filiale).

    3. Nach erfolgreicher Verifizierung stellen wir Ihnen die Details zu Ihren beantragten
    und bereits gutgeschriebenen Prämien und Zulagen bereit.

    4. Wir bestätigen Ihnen den Stand der letzten Prüfung (z. B. ob die 10 % Wohnungsbauprämie
    für das letzte Kalenderjahr bereits verbucht wurde) und listen die Beträge auf,
    die auf Basis Ihrer Sparleistungen (bis maximal 700 € bzw. 1.400 €) ausgezahlt
    wurden.


    Sie wissen, dass der Vorgang erfolgreich war, wenn Sie eine detaillierte Aufstellung
    über die erhaltenen staatlichen Zuschüsse in Ihren Unterlagen oder in Ihrem digitalen
    Postfach finden.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: how_to_guide
  source_authority: official
