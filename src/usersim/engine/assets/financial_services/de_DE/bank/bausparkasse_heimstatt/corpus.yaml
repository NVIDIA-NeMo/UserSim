  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 71b3574b-323b-51c1-9223-29d7025c643c
  title: Bausparvertrag Heimstatt Classic — Betrugsmaschen rund um dieses Produkt
    erkennen
  body: 'Im Kontext von langfristigen Sparanlagen wie dem Bausparvertrag Heimstatt
    Classic gibt es spezifische Betrugsmuster, die Sie kennen sollten, um Ihr Vermögen
    zu schützen. Kriminelle versuchen oft, Kunden durch unrealistische Versprechungen
    in die Irre zu führen.


    Ein häufiges Warnsignal ist das Angebot von „garantierten Renditen“, die weit
    über unserem aktuellen Guthabenzins von 0,5 % liegen. Seien Sie extrem vorsichtig,
    wenn Ihnen externe Berater versprechen, die Zuteilungszeit Ihres Vertrages durch
    „geheime Strategien“ massiv zu verkürzen oder Ihnen eine Rendite anzubieten, die
    nicht mit den offiziellen Konditionen der Bausparkasse Heimstatt übereinstimmt.
    Ein seriöser Bausparvertrag basiert auf Planungssicherheit und festen Zinsen,
    nicht auf spekulativen Gewinnversprechen.


    Ein weiteres Warnsignal ist die Aufforderung, Gelder auf Konten zu überweisen,
    die nicht eindeutig der Bausparkasse Heimstatt zugeordnet werden können, oder
    die Nutzung von Drittanbietern für die „Beschleunigung“ Ihres Sparprozesses. Wir
    betonen ausdrücklich: Wir werden Sie niemals per E-Mail oder SMS auffordern, Passwörter,
    PINs oder TANs preiszugeben, um Ihren Vertrag zu „aktivieren“ oder eine Zuteilung
    zu beschleunigen.


    Gemäß unseren Sicherheitsrichtlinien ist vor jeder statusändernden Aktion eine
    eindeutige Identitätsprüfung (z. B. durch Ausweisdokumente oder Zwei-Faktor-Authentifizierung)
    zwingend erforderlich. Wenn Sie aufgefordert werden, diese Sicherheitsstufen zu
    umgehen, handelt es sich mit hoher Wahrscheinlichkeit um einen Betrugsversuch.


    Sollten Sie eine Nachricht erhalten haben, die Ihnen ungewöhnliche Vorteile für
    Ihren Bausparvertrag Heimstatt Classic verspricht, oder haben Sie bereits sensible
    Daten übermittelt? Bitte informieren Sie uns umgehend. Bei Verdacht auf Betrug
    erfolgt eine sofortige Sperrung der betroffenen Konten, um weiteren Schaden abzuwenden.


    Weitere allgemeine Sicherheitshinweise finden Sie im Dokument Bausparvertrag Heimstatt
    Classic — Schutz vor Betrug und nicht autorisierten Vorgängen.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: security_advisory
  source_authority: official
