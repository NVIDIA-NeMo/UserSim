  institution_id: bausparkasse_heimstatt
- id: 4551d057-76f2-5799-922b-fb328683c667
  title: Bausparvertrag Heimstatt Classic — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen Kunden eine Abweichung zwischen ihren eigenen Unterlagen und den Systemdaten
    der Bausparkasse Heimstatt feststellen.


    **Symptom: Kunde gibt andere Konditionen an**


    Der Kunde behauptet, ein anderer Guthabenzins als 0,5 % oder einen anderen Darlehenszins
    als 2,45 % vereinbart zu haben.


    **Ursachenanalyse und Prüfungsschritte**


    1. **Vertragsdatum prüfen**: Überprüfen Sie das Datum des Vertragsabschlusses.
    Wurde der Vertrag während eines speziellen Aktionsangebots abgeschlossen? Falls
    ja, prüfen Sie die damals gültigen Sonderkonditionen.

    2. **Produktidentifikation**: Stellen Sie sicher, dass der Kunde tatsächlich den
    Bausparvertrag Heimstatt Classic besitzt und nicht den Bausparvertrag Heimstatt
    Rendite, welcher andere Zinskonditionen aufweist.

    3. **Dokumentenabgleich**: Bitten Sie den Kunden, die entsprechende Stelle in
    seinem unterzeichneten Vertrag zu benennen oder uns eine Kopie der Unterlagen
    zur Prüfung einzureichen.


    **Lösungsweg**


    *   **Systemfehler bestätigt**: Sollte ein Fehler in unseren Systemen vorliegen,
    wird die Korrektur über die zuständige Fachabteilung eingeleitet. Der Kunde wird
    über die Anpassung informiert.

    *   **Missverständnis aufgeklärt**: Wenn die Systemdaten korrekt sind (z. B. Guthabenzins
    0,5 % und Darlehenszins 2,45 %), erklären Sie dem Kunden höflich die Struktur
    des Classic-Produkts und verweisen Sie auf die schriftlich fixierten Bedingungen.

    *   **Sondervereinbarungen**: Prüfen Sie, ob im Rahmen eines hohen Vertragsvolumens
    eine Reduktion der Abschlussgebühr von 1,6 % vereinbart wurde, die eventuell nicht
    sofort ersichtlich ist.


    **Eskalation**

    Bei hartnäckigen Differenzen oder Vorwürfen der Falschberatung ist der Fall zwingend
    an die Filialleitung und anschließend an das Beschwerdemanagement weiterzuleiten.


    Weitere Details zu den rechtlichen Rahmenbedingungen finden Sie unter Bausparvertrag
    Heimstatt Classic — rechtliche Hinweise.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 1c0436f1-e308-58db-8c17-9ef6dc65d3a8
  title: Bausparvertrag Heimstatt Rendite — Überblick
  body: 'Der Bausparvertrag Heimstatt Rendite ist die ideale Lösung für Kunden, die
    ein besonderes Augenmerk auf den Zuwachs ihres Kapitals legen. In einer Zeit wirtschaftlicher
    Unsicherheit bietet dieses Produkt eine attraktive Kombination aus einer hohen
    Verzinsung Ihres Sparguthabens und der langfristigen Absicherung Ihrer zukünftigen
    Finanzierungskosten.


    Im Zentrum dieses Vertrags steht die Maximierung Ihrer Rendite während der Sparphase.
    Mit einem Guthabenzins von 1,5 % profitieren Sie von einer überdurchschnittlichen
    Verzinsung Ihres Eigenkapitals. Im Gegenzug ist das spätere Bauspardarlehen mit
    einem Zinssatz von 3,95 % kalkuliert, was dieses Produkt primär für Sparer prädestiniert,
    die eine sichere Anlage suchen und die Finanzierung zu einem späteren Zeitpunkt
    planen.


    Um die langfristige Zinssicherung und den administrativen Aufwand zu decken, wird
    eine Abschlussgebühr in Höhe von 1 % der Bausparsumme erhoben. Die Bausparsumme
    stellt dabei den vertraglich vereinbarten Gesamtwert dar, bestehend aus Ihrem
    Sparanteil und dem späteren Darlehensanteil.


    Damit Ihr Vertrag eine positive Entwicklung nimmt und die Zuteilung — also der
    Zeitpunkt, an dem Sie das Darlehen zu den festgesetzten Zinsen beanspruchen können
    — zeitnah erreicht wird, gelten bestimmte Rahmenbedingungen. So ist ein Mindestsparguthaben
    von 50 % der Bausparsumme erforderlich, bevor eine Zuteilung erfolgen kann. Zudem
    wird ein regelmäßiger monatlicher Sparbeitrag in Höhe von 0,5 % der Bausparsumme
    vorausgesetzt, um eine stetige Kapitalbildung zu gewährleisten.


    Ein wesentlicher Vorteil unserer Bauspardarlehen ist die Flexibilität bei der
    Rückzahlung: Sondertilgungen sind jederzeit kostenfrei möglich, sodass Sie die
    Restschuld Ihres Darlehens ohne zusätzliche Gebühren schneller reduzieren können.
    Zusammen mit der optimalen Nutzung staatlicher Förderungen bietet der Bausparvertrag
    Heimstatt Rendite eine solide Basis für Ihre private Vorsorge und Ihren zukünftigen
    Wohnungsbau.


    Für eine detaillierte Aufstellung der Konditionen verweisen wir auf das Dokument
    Bausparvertrag Heimstatt Rendite — Preis- und Leistungsverzeichnis.'
