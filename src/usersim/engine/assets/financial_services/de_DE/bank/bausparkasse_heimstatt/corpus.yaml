- id: a053d90a-a260-56d5-b587-803393db9f2d
  title: Bausparvertrag Heimstatt Classic — zwischen Tarifen wählen
  body: 'Die Wahl des richtigen Bausparvertrags hängt von Ihren persönlichen Zielen
    ab. Hier vergleichen wir den Bausparvertrag Heimstatt Classic mit unserem Rendite-Tarif.


    **Bausparvertrag Heimstatt Classic**

    *   **Guthabenzins:** 0,5 %

    *   **Darlehenszins:** 2,45 %

    *   **Profil:** Die ausgewogene Basisoption. Sie bietet eine sichere Kombination
    aus moderatem Sparen und einer attraktiven, festen Verzinsung für das spätere
    Darlehen.

    *   **Ideal für:** Familien und zukünftige Eigenheimbesitzer, die maximale Planungssicherheit
    und ein faires Gleichgewicht zwischen Sparphase und Bauphase suchen.


    **Bausparvertrag Heimstatt Rendite**

    *   **Profil:** Fokus auf attraktivere Guthabenzinsen während der Sparphase, jedoch
    verbunden mit höheren Kosten für das spätere Darlehen.

    *   **Ideal für:** Kunden, die das Bausparen primär als Anlageinstrument nutzen
    möchten und eine höhere Rendite auf ihr Guthaben legen, dabei aber bereit sind,
    für das spätere Darlehen einen höheren Zins als 2,45 % zu akzeptieren.


    Während der Classic-Tarif durch Stabilität und moderate Kosten besticht, ist der
    Rendite-Tarif für renditeorientierte Sparer optimiert. Für eine detaillierte Gegenüberstellung
    der Konditionen schauen Sie bitte in das Dokument Bausparvertrag Heimstatt Rendite
    — Überblick.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 524f5a4a-d67a-5ea7-9720-f3a25e980d2d
  title: Bausparvertrag Heimstatt Classic — Datenschutz und Datenverarbeitung
  body: 'Die Bausparkasse Heimstatt verarbeitet personenbezogene Daten im Rahmen Ihres
    Bausparvertrags Heimstatt Classic strikt nach den regulatorischen Vorgaben der
    BaFin, der Deutschen Bundesbank sowie der Datenschutz-Grundverordnung (DSGVO).
    Diese Offenlegung informiert Sie darüber, wie wir Ihre Daten schützen und verwenden.


    **Zweck der Datenverarbeitung**

    Wir erheben und verarbeiten Ihre Daten, um Ihren Vertrag administrativ zu führen,
    die monatlichen Sparbeiträge (mindestens 0,4 % der Bausparsumme) zu verbuchen
    und die Zuteilung zu berechnen. Dies umfasst die Überwachung des Mindestsparguthabens
    von 40 %, das für den Zugriff auf das Darlehen zu 2,45 % erforderlich ist.


    **Identitätsprüfung und Verifikation**

    Gemäß unseren Sicherheitsrichtlinien führen wir vor jeder statusändernden Aktion
    eine eindeutige Identitätsprüfung durch. Die Dokumentation dieser Prüfungen (z.
    B. Kopien von Ausweisdokumenten oder Logs der Zwei-Faktor-Authentifizierung) wird
    sicher gespeichert, um die Integrität Ihres Kontos zu gewährleisten und Betrug
    vorzubeugen.


    **Weitergabe von Daten**

    Eine Weitergabe Ihrer Daten an Dritte erfolgt nur dann, wenn dies zur Vertragserfüllung
    notwendig ist oder eine gesetzliche Verpflichtung besteht (z. B. Meldungen an
    die zuständigen Aufsichtsbehörden bei Betrugsverdacht oder Steuerbehörden im Rahmen
    staatlicher Förderungen).


    **Ihre Rechte**

    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungspflichten
    (z. B. aus dem BGB oder steuerrechtlichen Vorschriften) entgegenstehen.


    Wir gewährleisten durch moderne Verschlüsselungstechnologien und strikte interne
    Zugriffskontrollen, dass Ihre Finanzdaten geschützt bleiben. Für weitere rechtliche
    Hinweise zu Ihren Verträgen verweisen wir auf das Dokument Bausparvertrag Heimstatt
    Classic — rechtliche Hinweise.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: disclosure
  source_authority: official
