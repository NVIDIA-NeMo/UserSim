    aktiviert |

    | Regelmäßiger Sparbeitrag | Empfohlen: 0,5 % der Bausparsumme monatlich | Optimierte
    Bewertung der Zuteilungsliste |

    | Mindestsparguthaben | Erreichen von 50 % der Bausparsumme | Anspruch auf Zuteilung
    des Darlehens |

    | Zuteilungsantrag | Erreichung der erforderlichen Bewertungszahl | Auszahlung
    des Darlehens zu 3,95 % |


    Alle Kunden müssen die regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank
