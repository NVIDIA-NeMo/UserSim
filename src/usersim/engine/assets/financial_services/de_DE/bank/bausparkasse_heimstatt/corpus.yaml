- id: dc7f5373-7394-57bc-b744-ef463be34142
  title: Bausparvertrag Heimstatt Rendite — abschließen und aktivieren
  body: 'Um den Bausparvertrag Heimstatt Rendite erfolgreich abzuschließen und zu
    aktivieren, befolgen Sie bitte diese Schritte:


    1. Festlegung der Vertragsparameter: Teilen Sie uns die gewünschte Bausparsumme
    mit. Basierend auf dieser Summe berechnen wir die Abschlussgebühr von 1 % sowie
    den erforderlichen monatlichen Sparbeitrag von 0,5 % der Bausparsumme.


    2. Identitätsprüfung: Zur Eröffnung des Kontos ist eine eindeutige Identitätsprüfung
    zwingend erforderlich. Bitte legen Sie uns ein gültiges Ausweisdokument (Personalausweis
    oder Reisepass) vor oder führen Sie die Zwei-Faktor-Authentifizierung durch.


    3. Prüfung der Förderfähigkeit: Wir klären gemeinsam, inwieweit Sie staatliche
    Prämien und Zulagen nutzen können, um Ihr Eigenkapital optimal zu maximieren.


    4. Vertragsunterzeichnung: Wir erstellen den Vertrag mit dem festgesetzten Guthabenzins
    von 1,5 % und dem Darlehenszins von 3,95 %. Nach Ihrer Unterschrift wird der Vertrag
    rechtlich bindend.


    5. Aktivierung durch Einzahlung: Der Vertrag wird mit der ersten Einzahlung aktiviert.
    Dies kann entweder durch die Überweisung der Abschlussgebühr in Höhe von 1 % der
    Bausparsumme oder durch die erste reguläre Sparrate erfolgen.


    6. Bestätigung: Sie erhalten von uns eine schriftliche Bestätigung über die Aktivierung
    sowie Ihren ersten Kontoauszug, aus dem die aktuelle Bewertungszahl hervorgeht.
    Diese Zahl ist entscheidend für Ihren Rang in der Zuteilungsliste.


    Sobald diese Schritte abgeschlossen sind, ist Ihr Vertrag aktiv und Ihr Guthaben
    wird mit 1,5 % verzinst. Beachten Sie, dass für die spätere Zuteilung des Darlehens
    ein Mindestsparguthaben von 50 % der Bausparsumme erreicht werden muss.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: 8036340d-3a6c-538c-8109-eb4a79e1e4b9
  title: Bausparvertrag Heimstatt Rendite — Preis- und Leistungsverzeichnis
  body: 'Im Folgenden finden Sie die transparenten Konditionen für den Bausparvertrag
    Heimstatt Rendite. Alle Angaben beziehen sich auf die vereinbarte Bausparsumme:


    - Abschlussgebühr: 1 % der Bausparsumme (einmalig bei Vertragsschluss zur Deckung
    des administrativen Aufwands und der Zinssicherung).

    - Monatlicher Regelsparbeitrag: 0,5 % der Bausparsumme (verpflichtende Mindestrate
    zur kontinuierlichen Kapitalbildung).

    - Sondertilgungen während der Darlehensphase: kostenfrei (jederzeit möglich).


    Zusätzliche Gebühren für die Kontoführung oder die Verwaltung im Rahmen des digitalen
    Kundenportals während der regulären Geschäftszeiten fallen nicht an. Reduzierungen
    der Abschlussgebühr von 1 % sind ausschließlich im Rahmen von Aktionsangeboten
    oder bei signifikant hohen Vertragsvolumina nach individueller Prüfung möglich.'
