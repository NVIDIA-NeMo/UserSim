- id: 1e11946c-10b5-5f1a-9955-6892d01e04d4
  title: Bausparvertrag Heimstatt Rendite — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Die Sicherheit Ihrer Ersparnisse und die Integrität Ihres Bausparvertrags
    Heimstatt Rendite haben für uns höchste Priorität. In einem Marktumfeld, in dem
    Finanzprodukte zunehmend digital verwaltet werden, ist Wachsamkeit gegenüber betrügerischen
    Aktivitäten essenziell.


    Ein häufiges Muster im Betrug ist das sogenannte ''Phishing'', bei dem Täter versuchen,
    durch gefälschte E-Mails oder SMS an Ihre Zugangsdaten für das digitale Kundenportal
    zu gelangen. Bitte beachten Sie, dass die Bausparkasse Heimstatt Sie niemals per
    E-Mail oder SMS dazu auffordern wird, Passwörter, PINs oder TANs auf einer externen
    Webseite einzugeben.


    Um den Schutz Ihrer Daten zu gewährleisten, wenden wir strikte Verifikationsprotokolle
    an. Vor jeder statusändernden Aktion oder der Herausgabe von Kontoinformationen
    ist eine eindeutige Identitätsprüfung zwingend erforderlich. Dies erfolgt in unseren
    Filialen durch die Vorlage eines gültigen Ausweisdokuments oder im digitalen Raum
    über eine Zwei-Faktor-Authentifizierung. Seien Sie skeptisch, wenn Personen am
    Telefon eine dringende Handlung fordern, ohne dass eine solche Verifizierung stattgefunden
    hat.


    Sollten Sie den Verdacht haben, dass Ihre Daten kompromittiert wurden oder Sie
    eine verdächtige Nachricht erhalten haben, ist die sofortige Meldung an uns entscheidend.
    Bei einem konkreten Verdacht auf Betrug erfolgt eine sofortige Sperrung der betroffenen
    Konten sowie eine Meldung an die zuständigen Aufsichtsbehörden, um weiteren Schaden
    abzuwenden.


    Wir empfehlen Ihnen, regelmäßig Ihre Kontoauszüge zu prüfen und Unregelmäßigkeiten
    umgehend zu melden. Eine rechtzeitige Meldung ist die beste Versicherung gegen
    nicht autorisierte Vorgänge. Für weitere Informationen zur allgemeinen Sicherheit
    unserer Produkte können Sie auch das Dokument Bausparvertrag Heimstatt Classic
    — Schutz vor Betrug und nicht autorisierten Vorgängen konsultieren, da die grundlegenden
    Sicherheitsmechanismen für alle unsere Bausparprodukte gelten.'
  domain: retail_banking
  product_category: bausparen_rendite
  document_type: security_advisory
