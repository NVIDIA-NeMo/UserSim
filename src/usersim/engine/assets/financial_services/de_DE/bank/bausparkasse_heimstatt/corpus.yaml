- id: ff066f0b-5aa6-5b54-b533-61fe26e027a4
  title: Werkzeugreferenz set_alerts
  body: 'Das Werkzeug set_alerts konfiguriert die automatisierten Benachrichtigungen
    für ein Kundenkonto.


    Der Agent führt diese Aktion durch den direkten Aufruf des Werkzeugs aus, nachdem
    die Identität des Kunden verifiziert wurde.


    **Signatur und Parameter:**

    - alert_type (String): Die Art des Ereignisses, bei dem eine Benachrichtigung
    ausgelöst werden soll (z. B. „allocation_ready“, „bonus_deadline“).

    - channel (String): Der gewünschte Kommunikationskanal (z. B. „email“, „sms“,
    „portal“).


    **Effekt:**

    Das System hinterlegt die Präferenzen in der Datenbank. Sobald das definierte
    Ereignis eintritt, wird automatisch eine Nachricht über den gewählten Kanal an
    den Kunden versendet. Bestehende Alarme derselben Art werden durch neue Einstellungen
    überschrieben.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: bausparkasse_heimstatt
- id: 67735c0b-a01a-5bb5-aa42-565e09e59da0
  title: Wann manage_authorized_users eingesetzt wird
  body: 'Die ordnungsgemäße Verwaltung von bevollmächtigten Personen ist für die Sicherheit
    der Kundendaten und die Integrität der Verträge bei der Bausparkasse Heimstatt
    von zentraler Bedeutung. Das Werkzeug manage_authorized_users wird eingesetzt,
    wenn ein Vertragsinhaber einer anderen Person die Berechtigung erteilen möchte,
    im Namen des Inhabers über den Bausparvertrag zu verfügen, oder wenn eine bestehende
    Vollmacht widerrufen werden soll.


    Dies ist insbesondere in folgenden Szenarien relevant:

    - Ein Ehepartner oder Familienmitglied soll gemeinsam über den Bausparvertrag
    Heimstatt Classic oder den Bausparvertrag Heimstatt Rendite verfügen können.

    - Ein rechtlicher Vertreter soll zur Kontoführung autorisiert werden.

    - Eine bestehende Berechtigung soll aufgrund einer Änderung der Lebensumstände
    entzogen werden.


    Um die Sicherheit der Kundendaten gemäß unseren strikten Verifikationsprotokollen
    zu gewährleisten, muss der Agent zwingend die folgende Verfahrensweise einhalten:


    1. Identitätsprüfung: Vor jeder statusändernden Aktion ist eine eindeutige Identitätsprüfung
    des primären Vertragsinhabers durchzuführen. Hierzu ist das Werkzeug verify_identity
    zu verwenden, wobei Ausweisdokumente oder die Zwei-Faktor-Authentifizierung als
    Nachweis dienen.

    2. Kontenidentifikation: Falls der Kunde mehrere Verträge besitzt, muss zunächst
    über das Werkzeug get_accounts die korrekte account_id für den betroffenen Vertrag
    ermittelt werden (z. B. durch Abgleich der letzten vier Stellen der Vertragsnummer).

    3. Datenerhebung: Der Agent muss die vollständigen Daten der zu autorisierenden
    oder zu entfernenden Person erfragen. Erforderlich sind der vollständige Name,
    das Geburtsdatum sowie das Verhältnis zum Vertragsinhaber.

    4. Durchführung: Erst nach erfolgreicher Verifizierung und Datenerhebung wird
    das Werkzeug manage_authorized_users aufgerufen, um die Änderung im System zu
    hinterlegen.


    Sollte der Kunde unsicher sein, welche Personen derzeit Zugriff auf sein Konto
    haben, verweist der Agent auf die entsprechende Dokumentation in Wann get_accounts
    eingesetzt wird, um zunächst eine Übersicht der Konten und deren Status zu erhalten.


    Nach Abschluss des Vorgangs ist dem Kunden schriftlich oder über das digitale
    Portal zu bestätigen, dass die Änderung der Bevollmächtigung erfolgreich vorgenommen
    wurde.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: bausparkasse_heimstatt
- id: de0dab1f-3bbf-549c-a5ae-61a05b967cb2
  title: Werkzeugreferenz manage_authorized_users
  body: 'Das Werkzeug manage_authorized_users ermöglicht es dem Agenten, die Liste
    der für einen Bausparvertrag autorisierten Personen zu bearbeiten. Die Aktion
    wird durch den direkten Aufruf des Werkzeugs im System ausgeführt; der Kunde muss
    nicht auf ein externes Portal oder ein Formular verwiesen werden.


    **Signatur und Parameter:**


    - account_id: Die eindeutige Kennung des Bausparvertrags, die zuvor über get_accounts
    ermittelt wurde.

    - action: Die durchzuführende Operation, entweder "add" (Hinzufügen einer Person)
    oder "remove" (Entfernen einer Person).

    - full_name: Der vollständige Name der Person, die autorisiert oder entzogen werden
    soll, exakt so, wie er vom Kunden angegeben wurde.

    - date_of_birth: Das Geburtsdatum der betreffenden Person zur eindeutigen Identifizierung.

    - relationship: Das Verhältnis der Person zum Hauptvertragsinhaber (z. B. "Ehepartner",
    "Kind" oder "Rechtsbeistand").


    **Effekt:**

    Nach dem Aufruf wird die Berechtigungsliste des spezifischen Vertrags aktualisiert.
    Bei einer Hinzufügung ist die Person ab sofort berechtigt, Auskünfte einzuholen
    und im Rahmen der gesetzlichen Bestimmungen über den Vertrag zu verfügen. Bei
    einer Entfernung erlischt jeglicher Zugriff dieser Person auf den Vertrag mit
    sofortiger Wirkung.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: bausparkasse_heimstatt
