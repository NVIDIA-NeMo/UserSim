- id: 6853c5c8-8d75-507c-b3f8-a51959bdab80
  title: Bausparvertrag Heimstatt Classic — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Ersparnisse und Ihrer persönlichen Daten hat bei der
    Bausparkasse Heimstatt oberste Priorität. Um Ihren Bausparvertrag Heimstatt Classic
    optimal zu schützen, bitten wir Sie, die folgenden Sicherheitshinweise strikt
    zu beachten.


    Ein wesentlicher Pfeiler unseres Sicherheitskonzepts ist die eindeutige Identitätsprüfung.
    Bitte seien Sie sich bewusst, dass wir vor jeder statusändernden Aktion oder der
    Herausgabe von Kontoinformationen zwingend eine Verifikation durchführen. Dies
    erfolgt entweder durch die Vorlage gültiger Ausweisdokumente in unseren Filialen
    oder über eine Zwei-Faktor-Authentifizierung in unserem digitalen Kundenportal.
    Ohne diesen Prozess werden keine vertraulichen Daten übermittelt.


    Bitte achten Sie auf folgende Warnsignale:

    1. Wir werden Sie niemals per E-Mail, SMS oder Telefon dazu auffordern, Passwörter,
    PINs oder TANs preiszugeben. Solche Anfragen sind immer als Betrugsversuche einzustufen.

    2. Seien Sie skeptisch bei Nachrichten, die eine sofortige Handlung fordern, um
    eine vermeintliche Kontosperrung zu verhindern, sofern diese nicht über die offiziellen
    Kanäle der Bausparkasse Heimstatt kommuniziert wurden.

    3. Überprüfen Sie bei jedem Login in das Kundenportal, ob die Verbindung gesichert
    ist und die korrekte URL unseres Instituts angezeigt wird.


    Sollten Sie den Verdacht haben, dass Ihre Zugangsdaten kompromittiert wurden oder
    Sie eine verdächtige Nachricht erhalten haben, ist die sofortige Meldung an uns
    unerlässlich. Bei einem konkreten Betrugsverdacht werden wir Ihr Konto umgehend
    sperren, um weitere Verluste zu verhindern, und die zuständigen Aufsichtsbehörden
    informieren.


    Wir empfehlen Ihnen, Ihre Zugangsdaten regelmäßig zu ändern und niemals auf externen
    Geräten in öffentlichen Netzwerken auf Ihr Konto zuzugreifen. Durch Ihre Aufmerksamkeit
    und die Einhaltung dieser Protokolle gewährleisten wir gemeinsam den Schutz Ihres
    Vermögens für Ihren zukünftigen Wohnbau.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: f13a8aba-cecf-51c6-a508-4aa7ae570685
  title: Bausparvertrag Heimstatt Classic — Änderung der Bedingungen
  body: 'Die Geschäftsbeziehung im Rahmen des Bausparvertrags Heimstatt Classic unterliegt
    den regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank sowie den
    Bestimmungen des BGB für Verbraucherdarlehen. Diese Bedingungen regeln die Verpflichtungen
    beider Parteien sowie die Modalitäten bei Vertragsänderungen.


    Die Abschlussgebühr in Höhe von 1,6 % der Bausparsumme wird bei Vertragsabschluss
    fällig und dient der Deckung des administrativen Aufwands für die langfristige
    Zinssicherung. Diese Gebühr ist Teil der verbindlichen Konditionen und kann nur
    im Rahmen spezifischer Aktionsangebote oder bei besonders hohen Vertragsvolumina
    reduziert werden.


    Um die Zuteilungsfähigkeit des Vertrages zu gewährleisten, ist die Einhaltung
    der Sparvereinbarungen essenziell. Der Kunde verpflichtet sich zu einem regelmäßigen
    monatlichen Sparbeitrag von mindestens 0,4 % der Bausparsumme. Eine Änderung dieses
    Betrags ist nach vorheriger Abstimmung möglich, solange die Mindestgrenze gewahrt
    bleibt. Die Zuteilung des Darlehens zu dem festgesetzten Sollzins von 2,45 % erfolgt
    erst, wenn der Vertrag die erforderliche Bewertung erreicht hat, was unter anderem
    das Erreichen eines Mindestsparguthabens von 40 % der Bausparsumme voraussetzt.


    Änderungen der allgemeinen Geschäftsbedingungen werden Ihnen schriftlich oder
    über das digitale Kundenportal mit einer angemessenen Frist mitgeteilt. Sie haben
    das Recht, Änderungen, die eine Verschlechterung der Konditionen bedeuten, innerhalb
    der gesetzlichen Fristen zu reklamieren.


    Die Beendigung des Vertrages kann durch eine Kündigung erfolgen, wobei die entsprechenden
    Fristen des BGB und die spezifischen Bedingungen für Bausparverträge gelten. Bitte
    beachten Sie, dass eine vorzeitige Auflösung vor Erreichen der Zuteilungsreife
    Auswirkungen auf die staatliche Förderung und die Zuteilungsbewertung haben kann.
    Für detaillierte Informationen zu Kündigungsprozessen verweisen wir auf das Dokument
    Bausparvertrag Heimstatt Classic — kündigen, schließen oder den Tarif wechseln.'
  domain: retail_banking
  product_category: bausparen_classic
  document_type: terms_conditions
