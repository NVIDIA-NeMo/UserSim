  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: b17fdad2-09ed-552a-87fe-a70a94a9c759
  title: 'Modernisierungsdarlehen ohne Grundschuld — Gesamtkosten im repräsentativen
    Beispiel: Erklärung'
  body: 'In diesem FAQ erklären wir die Zusammensetzung der Gesamtkosten Ihres Darlehens.


    **Was bedeuten die Gesamtkosten von 5.214,40 € im repräsentativen Beispiel?**

    Die Gesamtkosten von 5.214,40 € stellen die Summe aller Kosten dar, die Ihnen
    über die gesamte Laufzeit des Darlehens entstehen, zusätzlich zum zurückgezahlten
    Nettodarlehensbetrag. In unserem Beispiel bezieht sich dies auf ein Darlehen über
    20.000 € mit einer Laufzeit von 120 Monaten und einem effektiven Jahreszins von
    4,9 %.


    **Setzen sich diese Kosten nur aus Zinsen zusammen?**

    Ja, bei diesem Produkt sind die Gesamtkosten primär die Zinskosten, die für die
    Bereitstellung des Kapitals über den gewählten Zeitraum anfallen. Da es sich um
    ein Darlehen ohne Grundschuld handelt, entfallen die Kosten für die notarielle
    Beurkundung und den Grundbucheintrag, was die Gesamtkosten im Vergleich zu besicherten
    Krediten senkt.


    Für weitere Informationen zur monatlichen Belastung lesen Sie bitte Modernisierungsdarlehen
    ohne Grundschuld — Monatsrate im repräsentativen Beispiel: Erklärung.'
  domain: lending_mortgage
  product_category: modernisierungsdarlehen
  document_type: faq
