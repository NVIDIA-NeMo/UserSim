- id: 1d7b6929-b58c-5114-af23-c7e91a148cb5
  title: Wohnungsbauprämie und Arbeitnehmer-Sparzulage — rechtliche Hinweise
  body: 'Die Gewährung der Wohnungsbauprämie und der Arbeitnehmer-Sparzulage erfolgt
    strikt nach den gesetzlichen Vorgaben der Bundesrepublik Deutschland sowie den
    regulatorischen Richtlinien der BaFin und der Deutschen Bundesbank.


    Die Bausparkasse Heimstatt agiert hierbei als vermittelnde Instanz und führt die
    Anträge im Auftrag des Kunden aus. Die endgültige Entscheidung über die Förderberechtigung
    liegt bei den zuständigen staatlichen Stellen.


    Folgende rechtliche Rahmenbedingungen gelten:

    - Identitätsprüfung: Gemäß unseren Sicherheitsrichtlinien ist vor jeder Antragstellung
    eine eindeutige Identitätsprüfung (z. B. durch Ausweisdokumente) zwingend erforderlich.

    - Einkommensgrenzen: Die genannten Grenzwerte (z. B. 35.000 € / 70.000 € für die
    Prämie und 40.000 € / 80.000 € für die Zulage) basieren auf den aktuellen gesetzlichen
    Bestimmungen und können sich durch gesetzgeberische Änderungen ändern.

    - Haftung: Die Bausparkasse Heimstatt haftet nicht für entgangene Förderungen,
    wenn dem Kunden die Meldung von Einkommensänderungen oder die Bereitstellung notwendiger
    Unterlagen versäumt wurde.

    - Beratungsbegrenzung: Wir bieten eine umfassende Produktberatung zur optimalen
    Nutzung der Förderung an. Wir erbringen jedoch keine individualisierte Steuer-
    oder Rechtsberatung. Für spezifische steuerliche Details verweisen wir an zertifizierte
    Steuerberater oder Rechtsanwälte.

    - Datenschutz: Die Übermittlung von Einkommensdaten an die zuständigen Behörden
    erfolgt ausschließlich im Rahmen der gesetzlichen Notwendigkeit zur Förderabwicklung.'
  domain: retail_banking
  product_category: staatliche_foerderung
  document_type: disclosure
