- id: 25f3f2c7-0e3d-5460-9812-b44b79257afe
  title: Bausparvertrag Heimstatt Rendite — wie Zinsen berechnet und angewendet werden
  body: 'Dieses Dokument dient als Leitfaden für die Berechnung und Anwendung der
    Zinsen und Gebühren des Bausparvertrags Heimstatt Rendite.


    **1. Guthabenzinsen (Sparphase)**

    - **Satz:** 1,5 %

    - **Anwendung:** Der Zins wird auf das zum Stichtag vorhandene Guthaben berechnet.

    - **Gutschrift:** Die Zinsgutschrift erfolgt einmal jährlich auf das Konto des
    Kunden.


    **2. Darlehenszinsen (Finanzierungsphase)**

    - **Satz:** 3,95 %

    - **Anwendung:** Dieser Zinssatz gilt für die gesamte Laufzeit des Bauspardarlehens,
    unabhängig von Marktschwankungen.

    - **Berechnung:** Die Zinsen werden auf den jeweils ausstehenden Restbetrag des
    Darlehens berechnet.


    **3. Abschlussgebühr**

    - **Satz:** 1 %

    - **Anwendung:** Die Gebühr wird einmalig bei Vertragsabschluss auf Basis der
    gesamten Bausparsumme berechnet und erhoben.


    **4. Sparraten**

    - **Regelsparrate:** Es wird eine regelmäßige monatliche Sparrate von 0,5 % der
    Bausparsumme vorausgesetzt.

    - **Mindestguthaben:** Die Zuteilungsreife wird erst nach Erreichen eines Guthabens
    von 50 % der Bausparsumme geprüft.'
