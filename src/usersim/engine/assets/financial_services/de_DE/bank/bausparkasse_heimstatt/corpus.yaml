- id: 6b5a84c9-7a27-5cfc-bb4c-e62ad47a6e37
  title: Modernisierungsdarlehen ohne Grundschuld — Preis- und Leistungsverzeichnis
  body: 'Dieses Preis- und Leistungsverzeichnis dient als Referenz für die Konditionen
    des Modernisierungsdarlehens ohne Grundschuld. Wir verfolgen eine transparente
    Preispolitik, um Ihnen volle Planungssicherheit zu bieten.


    Darlehnungskonditionen:

    - Maximaler Darlehensbetrag: 50.000 €

    - Repräsentativer effektiver Jahreszins: 4,9 %

    - Repräsentative Laufzeit: 120 Monate

    - Repräsentative monatliche Rate: 210,12 €

    - Repräsentative Gesamtkosten: 5.214,40 € (bei einer Summe von 20.000 €)


    Gebührenstruktur:

    - Abschlussgebühren: Diese werden zur Deckung des administrativen Aufwands für
    die langfristige Zinssicherung erhoben. Die genaue Höhe richtet sich nach dem
    Vertragsvolumen.

    - Gebührenreduktion: Bei besonders hohen Vertragsvolumina oder im Rahmen spezifischer
    Aktionsangebote können Abschlussgebühren reduziert oder vollständig erlassen werden.

    - Sondertilgungen: Zusätzliche Rückzahlungen des Darlehens sind jederzeit kostenfrei
    möglich.


    Sämtliche Kosten werden in den individuellen Vertragsunterlagen transparent offengelegt,
    bevor der Vertrag rechtswirksam wird.'
