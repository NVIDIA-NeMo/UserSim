- id: 6cddcc98-4539-5146-a1ec-129abe2518c7
  title: Modernisierungsdarlehen ohne Grundschuld — wie Zinsen berechnet und angewendet
    werden
  body: "Für das Modernisierungsdarlehen ohne Grundschuld gilt ein Modell mit festen\
    \ Zinsen, das maximale Planungssicherheit für unsere Kunden schafft. Es gibt keine\
    \ variablen Zinssätze; der bei Vertragsschluss vereinbarte Zins bleibt über die\
    \ gesamte Laufzeit unverändert.\n\nBerechnungsgrundlage\nDie Zinsen werden auf\
    \ die jeweils noch ausstehende Restschuld berechnet. Da es sich um ein Annuitätendarlehen\
    \ handelt, bleibt die monatliche Rate konstant. In der Anfangsphase des Darlehens\
    \ ist der Zinsanteil an der Rate höher, während der Tilgungsanteil im Laufe der\
    \ Zeit zunimmt.\n\nRepräsentative Werte\nZur Veranschaulichung der Zinsanwendung\
    \ nutzen wir folgendes Beispiel:\n- Effektiver Jahreszins: 4,9 %\n- Nettodarlehensbetrag:\
    \ 20.000 €\n- Laufzeit: 120 Monate\n- Monatliche Rate: 210,12 €\n\nAnwendung\n\
    Der effektive Jahreszins beinhaltet sowohl die Nominalzinsen als auch die anfallenden\
    \ Kosten des Kredits, sofern diese die Gesamtkosten beeinflussen. Die Zinsen werden\
    \ monatlich verrechnet und sind in der festen Rate von 210,12 € bereits enthalten.\
    \ \n\nÄnderungen der Zinslast\nEine Verringerung der Zinslast ist für den Kunden\
    \ durch eine kostenfreie Sondertilgung möglich. Da die Zinsen auf die Restschuld\
    \ berechnet werden, reduziert eine außerplanmäßige Rückzahlung die Grundlage für\
    \ die Zinsberechnung und senkt somit die Gesamtkosten des Darlehens über die verbleibende\
    \ Laufzeit."
