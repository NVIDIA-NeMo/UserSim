  mentions_tools: []
  institution_id: bausparkasse_heimstatt
- id: df0b95dd-b0ac-5d38-9dd0-4d14bcf89926
  title: Modernisierungsdarlehen ohne Grundschuld — erforderliche Unterlagen
  body: 'Um die Beantragung Ihres Modernisierungsdarlehens ohne Grundschuld effizient
    zu gestalten, benötigen wir eine Reihe von Unterlagen. Je nach gewünschter Kreditsumme
    (bis maximal 50.000 €) variieren die Anforderungen.


    | Unterlage | Zweck | Erforderlichkeit |

    | :--- | :--- | :--- |

    | Gültiges Identitätsdokument (Personalausweis/Reisepass) | Eindeutige Identitätsprüfung
    | Zwingend erforderlich |

    | Aktuelle Einkommensnachweise (Lohnabrechnungen/Rentenbescheide) | Bonitätsprüfung
    und Sicherstellung der Ratenzahlung | Zwingend erforderlich |

    | Nachweis über Immobilieneigentum (z. B. Grundbuchauszug) | Bestätigung des Verwendungszwecks
    (Modernisierung) | Zwingend erforderlich |

    | Kurze Beschreibung der geplanten Maßnahmen | Prüfung der Förderfähigkeit/Zweckbindung
    | Empfohlen |

    | Kostenvoranschläge von Fachfirmen | Beleg für den gewünschten Nettodarlehensbetrag
    | Bei höheren Summen erforderlich |


    Nach Einreichung dieser Dokumente führen wir eine Prüfung gemäß den regulatorischen
    Vorgaben der BaFin durch. Sobald alle Unterlagen vollständig vorliegen und die
    Bonitätsprüfung positiv verlaufen ist, können wir die Auszahlung des Darlehens
    veranlassen.'
