- id: d640d08b-5d24-597e-a4c3-a73406fa18e6
  title: Modernisierungsdarlehen ohne Grundschuld — Risikohinweise
  body: 'Die Inanspruchnahme eines Modernisierungsdarlehens ohne Grundschuld ist mit
    finanziellen Verpflichtungen und Risiken verbunden, die Sie vor Abschluss des
    Vertrages sorgfältig prüfen sollten.


    Zinslast und Gesamtkosten

    Bitte beachten Sie, dass die Zinsen die Gesamtkosten des Kredits erhöhen. In unserem
    repräsentativen Beispiel führt ein Nettodarlehensbetrag von 20.000 € bei einem
    effektiven Jahreszins von 4,9 % und einer Laufzeit von 120 Monaten zu Gesamtkosten
    von 5.214,40 €. Dies bedeutet, dass Sie über die gesamte Laufzeit einen Betrag
    zurückzahlen, der über die ursprünglich geliehene Summe hinausgeht.


    Kreditrisiko und Zahlungsverzug

    Die regelmäßige Zahlung der monatlichen Rate (im Beispiel 210,12 €) ist essenziell.
    Ein Verzug bei den Zahlungen kann nicht nur zu Mahngebühren führen, sondern auch
    Ihre Kreditwürdigkeit (Bonität) nachhaltig beeinträchtigen. In schweren Fällen
    kann dies zur Kündigung des Darlehens durch die Bausparkasse Heimstatt führen,
    wodurch der gesamte Restbetrag sofort zur Rückzahlung fällig wird.


    Verwendungszweck

    Das Darlehen ist zweckgebunden für die Modernisierung Ihrer Immobilie. Eine Verwendung
    für andere Zwecke widerspricht den Vertragsbedingungen und kann rechtliche Konsequenzen
    nach sich ziehen.


    Regulatorischer Rahmen

    Wir agieren strikt nach den Vorgaben der BaFin und der Deutschen Bundesbank sowie
    den Bestimmungen des BGB für Verbraucherdarlehen. Alle Konditionen werden transparent
    offengelegt. Wir weisen darauf hin, dass wir eine umfassende Produktberatung anbieten,
    jedoch keine individualisierte Steuer- oder Rechtsberatung erbringen. Für spezifische
    rechtliche Fragen zur Immobilie oder steuerliche Absetzbarkeit von Modernisierungskosten
    verweisen wir an zertifizierte Fachleute.


    Die Sicherheit Ihrer Einlagen und die Abwicklung unserer Verträge erfolgen unter
    Einhaltung der gesetzlichen Einlagensicherung, sofern dies für die jeweilige Produktstruktur
    relevant ist.'
