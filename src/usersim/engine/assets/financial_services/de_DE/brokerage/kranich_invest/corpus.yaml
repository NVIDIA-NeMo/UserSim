- id: 9d19ea62-259e-5f3e-9d17-f304e607b5ed
  title: Kranich Depot — zwischen Tarifen wählen
  body: 'Wenn Sie entscheiden, welches Modell für Ihre Anlagestrategie am besten geeignet
    ist, bietet das Kranich Depot eine klare, transparente Struktur ohne versteckte
    Kosten.


    **Kranich Depot (Standard)**

    * Depotgebühr: 0 € (kostenfrei).

    * Ordergebühr: Fixe 1 € pro Order, unabhängig vom Handelsvolumen.

    * Verrechnungskonto: 2,25 % Zinsen bis zu einem Betrag von 50.000 €.

    * Zielgruppe: Private Anleger, die eine kostengünstige, planbare Lösung für den
    langfristigen Vermögensaufbau suchen.


    **Vergleich mit klassischen Brokern**

    Viele traditionelle Institute erheben prozentuale Depotgebühren oder Orderkosten,
    die mit steigendem Orderwert linear anwachsen. Das Kranich Depot hingegen setzt
    auf maximale Kosteneffizienz:

    * Planbarkeit: Während andere Broker prozentuale Gebühren nutzen, bleibt Ihre
    Order bei uns immer bei 1 €.

    * Hürdenlose Anlage: Mit einer Depotgebühr von 0 € fördern wir Ihren Vermögensaufbau
    ohne unnötige Fixkosten.

    * Liquiditätsvorteil: Die Verzinsung von 2,25 % macht Ihr Verrechnungskonto zu
    einem attraktiven Parkplatz für Liquidität.


    **Empfehlung:**

    Das Kranich Depot ist die ideale Wahl für Sie, wenn Sie Wert auf Sicherheit (Sondervermögen),
    maximale Transparenz und niedrige Fixkosten legen. Für Anleger, die eine individuelle
    steuerliche oder rechtliche Beratung benötigen, empfehlen wir die zusätzliche
    Konsultation eines zertifizierten Beraters, da wir uns auf edukative Informationen
    beschränken.


    Regulatorischer Hinweis: Die Sicherheit wird durch die gesetzliche Anlegerentschädigung
    (90 % bis maximal 20.000 €) ergänzt.'
  domain: brokerage_investing
  product_category: wertpapierdepot
