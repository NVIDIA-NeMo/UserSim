- id: 26d32cee-c601-569d-8ea6-c915adcc0bd1
  title: Kranich Depot — Vergleich mit Alternativen und wann es nicht passt
  body: "Wenn Sie Ihr Kapital investieren möchten, stehen Ihnen verschiedene Optionen\
    \ zur Verfügung. Das Kranich Depot ist als transparenter, kosteneffizienter Hub\
    \ konzipiert. Hier erfahren Sie, wie wir uns von Alternativen unterscheiden und\
    \ für wen unser Modell eventuell nicht die richtige Wahl ist.\n\n**Die Vorteile\
    \ des Kranich Depot**\n*   **Planbare Kosten:** Während viele Broker prozentuale\
    \ Gebühren erheben, die bei steigenden Anlagebeträgen massiv ansteigen, bleibt\
    \ unsere Ordergebühr konstant bei 1 €. \n*   **Keine Depotgebühren:** Wir verzichten\
    \ vollständig auf Depotgebühren (0 €), um den langfristigen Vermögensaufbau ohne\
    \ unnötige Hürden zu fördern.\n*   **Verzinsung des Cash-Bestands:** Ihr nicht\
    \ investiertes Geld auf dem Verrechnungskonto arbeitet für Sie mit einem Zinssatz\
    \ von 2,25 % (bis zu einem Höchstbetrag von 50.000 €).\n*   **Sicherheit:** Die\
    \ Verwahrung Ihrer Wertpapiere erfolgt als Sondervermögen. Dies schützt Ihre Anlagen\
    \ auch im Falle einer Insolvenz des Instituts.\n\n**Wann das Kranich Depot nicht\
    \ die richtige Wahl ist**\n\n*   **Individuelle Beratungsbedarfe:** Wenn Sie eine\
    \ umfassende, persönliche Steuerberatung oder eine rechtliche Gestaltung Ihrer\
    \ Vermögensstruktur benötigen, ist unser Modell nicht passend. Wir bieten edukative\
    \ Informationen und allgemeine Markteinblicke, leisten jedoch keine individuelle\
    \ Steuer- oder Rechtsberatung.\n*   **Komplexe Hedge-Strategien:** Anleger, die\
    \ hochkomplexe Derivate-Strategien oder spezialisierte institutionelle Instrumente\
    \ benötigen, die über den Standard von MiFID II hinausgehen, finden bei uns eventuell\
    \ nicht alle benötigten Werkzeuge.\n*   **Garantie-Suchende:** Da wir strikt nach\
    \ MiFID II agieren, weisen wir explizit auf das Verlustrisiko hin. Wenn Sie eine\
    \ Anlage suchen, bei der die Rendite garantiert ist, ist ein Wertpapierdepot grundsätzlich\
    \ nicht das richtige Produkt.\n\nFür weitere Details zu unseren Konditionen sehen\
    \ Sie bitte in: Kranich Depot — Preis- und Leistungsverzeichnis."
