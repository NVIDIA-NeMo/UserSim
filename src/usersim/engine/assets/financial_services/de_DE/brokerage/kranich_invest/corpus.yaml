- id: e35887c5-a077-5fa9-84f0-afbba57e9f37
  title: Kranich Depot — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass eine Order oder eine Änderung an Ihren Stammdaten
    nicht wie gewünscht ausgeführt wurde. In diesem Fall beschreiben Kunden dies häufig
    als „ausstehender Status“ oder „fehlgeschlagene Transaktion“.


    **Mögliche Ursachen und Prüfschritte:**


    1.  **Prüfung des Guthabens:** Stellen Sie sicher, dass Ihr Verrechnungskonto
    über ausreichend Deckung verfügt. Für jede Order wird neben dem Kaufpreis eine
    Gebühr von 1 € fällig. Ist das Guthaben nicht ausreichend, bleibt der Vorgang
    ausstehend.

    2.  **Überprüfung der Identitätsprüfung:** Wurde vor kurzem eine Änderung an Ihren
    Stammdaten vorgenommen? Jede zustandsändernde Aktion erfordert eine starke Authentifizierung.
    Wenn diese nicht vollständig abgeschlossen wurde, kann der Vorgang gesperrt sein.

    3.  **Marktzeiten und Handelsplätze:** Prüfen Sie, ob der gewünschte Wertpapierplatz
    zum Zeitpunkt der Order geöffnet war. Orders außerhalb der Geschäftszeiten können
    als „ausstehend“ markiert sein, bis der Handel wieder beginnt.


    **Lösung und Fix:**


    *   **Bei fehlendem Guthaben:** Überweisen Sie den Differenzbetrag auf Ihr Verrechnungskonto.
    Der Vorgang wird nach Geldeingang automatisch erneut geprüft.

    *   **Bei Authentifizierungsproblemen:** Wiederholen Sie den Verifizierungsprozess
    über die Ihnen zugesandten Sicherheitskanäle.


    **Wann erfolgt eine Eskalation?**


    Sollte ein Vorgang trotz ausreichender Deckung und erfolgreicher Authentifizierung
    länger als zwei Geschäftstage im Status „ausstehend“ verbleiben, leiten wir die
    Anfrage intern über unser Eskalationsmanagement an die Fachabteilung für Depotführung
    weiter. Sie erhalten innerhalb dieses Zeitrahmens eine transparente Statusmeldung
    über den Fortschritt der Bearbeitung.


    Für weitere rechtliche Details zu unseren Prüfprozessen sehen Sie bitte in Kranich
    Depot — rechtliche Hinweise.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 608370d2-b934-594f-b98f-87059f084379
  title: Kranich Depot — Voraussetzungen
  body: 'Um ein Kranich Depot eröffnen und nutzen zu können, müssen die folgenden
    Voraussetzungen erfüllt sein:


    | Bedingung | Anforderung | Ergebnis bei Erfüllung |

    | :--- | :--- | :--- |

    | Mindestalter | Vollendung des 18. Lebensjahres | Teilnahme am Eröffnungsprozess
    möglich |

    | Wohnsitz | Gesetzlicher Wohnsitz in Deutschland oder dem EWR | Kontoeröffnung
    zulässig |

    | Identität | Erfolgreiche mehrstufige Sicherheitsprüfung | Aktivierung des Depots
    möglich |

    | MiFID II Profil | Abgeschlossene Geeignetheitsprüfung | Handelsfreischaltung
    für Wertpapiere |

    | Kapitalfluss | Verfügbarkeit eines validen Referenzkontos | Einzahlungen und
    Auszahlungen möglich |


    Kunden, die das Mindestalter von 18 Jahren noch nicht erreicht haben, können alternativ
    prüfen, ob das Produkt Kranich Kinderdepot für ihre Bedürfnisse geeignet ist.'
