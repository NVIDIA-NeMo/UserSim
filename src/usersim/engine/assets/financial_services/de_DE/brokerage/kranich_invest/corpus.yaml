  institution_id: kranich_invest
- id: 8826495c-d919-5d33-ad98-4cd000eba199
  title: Kranich Kinderdepot — wie Zinsen berechnet und angewendet werden
  body: 'Dieses Dokument dient als Referenz für Support-Agenten zur Erläuterung der
    Verzinsung des Verrechnungskontos im Rahmen des Kranich Kinderdepots.


    **Zinssatz und Anwendung**

    Das zum Kinderdepot gehörende Verrechnungskonto wird verzinst. Die Verzinsung
    erfolgt auf Basis des täglichen Saldos und wird in den im System hinterlegten
    Intervallen gutgeschrieben.


    **Wichtige Parameter:**

    * **Verzinster Höchstbetrag:** Die Verzinsung erfolgt auf Guthaben bis zu einem
    Betrag von 50.000 €. Beträge, die diesen Schwellenwert überschreiten, werden nicht
    verzinst.

    * **Zinsberechnung:** Die Zinsen werden tagesgenau berechnet und entsprechend
    dem aktuellen Zinssatz von Kranich Invest gutgeschrieben.

    * **Änderungen:** Der Zinssatz ist variabel und kann aufgrund von Marktveränderungen
    oder Entscheidungen der Geschäftsführung angepasst werden. Kunden werden über
    signifikante Änderungen informiert.


    **Auszahlung und Steuern**

    Die Zinsgutschriften erfolgen direkt auf das Verrechnungskonto. Auf diese Erträge
    fällt die Abgeltungsteuer inkl. Solidaritätszuschlag und ggf. Kirchensteuer an,
    sofern kein gültiger Freistellungsauftrag (Einzel: 1.000 €, Gemeinschaft: 2.000
    €) hinterlegt wurde.


    *Regulatorischer Hinweis: Die Verzinsung erfolgt im Einklang mit den geltenden
    Bankengesetzen und den BaFin-Richtlinien.*'
