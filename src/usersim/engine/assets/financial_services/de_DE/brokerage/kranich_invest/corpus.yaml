- id: c25872ac-e6de-5655-8c0d-2ab5c078da53
  title: ETF-Sparplan — etwas ändern
  body: 'Wenn Sie die Parameter Ihres bestehenden ETF-Sparplans anpassen möchten,
    können Sie dies unkompliziert über unsere digitalen Kanäle vornehmen. In diesem
    Guide erfahren Sie, wie Sie den Sparbetrag oder das Intervall ändern.


    **Voraussetzungen**

    *   Ein aktiver ETF-Sparplan in Ihrem Depot.

    *   Ein verifiziertes Konto mit aktiver starker Authentifizierung.


    **Schritte zur Änderung**


    1. **Änderungswunsch mitteilen**: Nennen Sie uns den ETF-Sparplan, den Sie anpassen
    möchten, sowie die gewünschte Änderung (z. B. Erhöhung oder Senkung des monatlichen
    Betrags).

    2. **Betragsprüfung**: Wenn Sie den Betrag ändern, stellen Sie bitte sicher, dass
    der neue Wert mindestens 10 € beträgt. Beträge unter dieser Grenze können nicht
    gespeichert werden.

    3. **Sicherheitsprüfung**: Da es sich um eine zustandsändernde Aktion handelt,
    fordern wir Sie zur starken Authentifizierung auf. Bestätigen Sie die Änderung
    über Ihr verifiziertes Gerät.

    4. **Bestätigung erhalten**: Wir senden Ihnen eine Bestätigung über die angepassten
    Konditionen und den Zeitpunkt, ab dem die Änderung für die nächste Ausführung
    wirksam wird.


    **Wann tritt die Änderung in Kraft?**

    Änderungen, die bis zu fünf Bankarbeitstagen vor dem nächsten Ausführungsdatum
    eingereicht werden, gelten in der Regel für den nächsten Turnus. Bei einer späteren
    Meldung wird die Änderung zum übernächsten Termin wirksam.


    Falls Sie den Sparplan nicht nur ändern, sondern vollständig beenden möchten,
    lesen Sie bitte: ETF-Sparplan — kündigen, schließen oder den Tarif wechseln.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 47c953b6-4fab-5742-ac0f-2a16b7a5b4f1
  title: ETF-Sparplan — Probleme mit Zugang oder Login
  body: "Probleme beim Zugang zu Ihrem Konto können die Verwaltung Ihres ETF-Sparplans\
    \ einschränken. Hier finden Sie die gängigsten Symptome und deren Lösungen.\n\n\
    **Symptom: Die Anmeldung schlägt fehl oder die Fehlermeldung „Zugriff verweigert“\
    \ erscheint.**\n*   **Mögliche Ursachen**: Falsche Zugangsdaten, abgelaufene Sitzung\
    \ oder ein temporäres Problem mit der starken Authentifizierung.\n*   **Prüfschritte**:\n\
    \    1. Überprüfen Sie Ihre Eingaben auf Tippfehler.\n    2. Stellen Sie sicher,\
    \ dass Ihr Gerät für die Multi-Faktor-Authentifizierung (MFA) korrekt registriert\
    \ und verbunden ist.\n    3. Versuchen Sie, die Anwendung neu zu starten oder\
    \ den Cache zu leeren.\n*   **Lösung**: Wenn die Daten korrekt sind, aber der\
    \ Login weiterhin scheitert, fordern Sie eine neue Passwort- oder MFA-Verifizierung\
    \ an.\n\n**Symptom: Die starke Authentifizierung wird nicht ausgelöst oder der\
    \ Code wird nicht empfangen.**\n*   **Mögliche Ursachen**: Netzwerkprobleme, falsche\
    \ hinterlegte Telefonnummer oder ein Problem mit dem Authentifizierungsdienst.\n\
    *   **Prüfschritte**:\n    1. Prüfen Sie Ihre Internetverbindung.\n    2. Stellen\
    \ Sie sicher, dass die hinterlegte Mobilfunknummer noch aktuell ist.\n*   **Lösung**:\
    \ Fordern Sie uns auf, Ihren Identitätsstatus zu prüfen. Wir leiten den Vorgang\
    \ an unsere Fachabteilung für Compliance zur manuellen Verifizierung weiter.\n\
    \n**Eskalation**\nWenn diese Schritte das Problem nicht beheben, wird Ihr Anliegen\
    \ über unser Eskalationsmanagement an die Fachabteilung für Depotführung weitergeleitet.\
    \ Sie erhalten innerhalb eines definierten Zeitrahmens eine Rückmeldung über den\
    \ Status Ihrer Wiederherstellung.\n\nWeitere Hilfe bei technischen Problemen finden\
    \ Sie in: Kranich Depot — Probleme mit Zugang oder Login."
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: d63283ff-0347-5eb0-bc51-c54d6de759d3
  title: ETF-Sparplan — Zugangsstufen
  body: 'Dieses Dokument dient Support-Mitarbeitern zur schnellen Prüfung, ob ein
    Kunde die Voraussetzungen für die Einrichtung eines ETF-Sparplans erfüllt.


    | Bedingung | Status | Ergebnis / Zugangsebene |

    | :--- | :--- | :--- |

    | Identitätsprüfung (KYC) | Nicht abgeschlossen | Kein Zugang zu Investmentprodukten.
    Bitte Verifizierung starten. |

    | Wertpapierdepot | Nicht vorhanden | Kein Zugang. Zuerst ein Depot mit 0 € Depotgebühr
    eröffnen. |

    | Wertpapierdepot | Aktiv & Verifiziert | Zugang zum ETF-Sparplan ab einem Betrag
    von 10 €. |

    | Verrechnungskonto | Nicht ausreichend gedeckt | Sparplan einrichtbar, aber Ausführung
    schlägt fehl (fehlende Deckung). |

    | Verrechnungskonto | Ausreichend gedeckt | Voller Zugang: Automatische Ausführung
    des Sparplans möglich. |


    **Hinweis für den Support**: Jede Änderung an den Stammdaten oder die erste Einrichtung
    des Sparplans erfordert zwingend eine mehrstufige Sicherheitsprüfung zur Verifizierung
    der Identität.'
