- id: 724841cc-0079-53b3-996d-ae499e67541b
  title: 'Kranich Depot — Entgelt pro Order: Erklärung'
  body: '**Wie setzt sich das Entgelt für meine Wertpapierorders zusammen?**


    Im Gegensatz zu vielen traditionellen Brokern verzichtet Kranich Invest auf prozentuale
    Gebührenmodelle, die oft intransparent sind. Wir nutzen eine Philosophie der Transparenz:
    Für jede ausgeführte Order wird ein fixer Betrag von 1 € erhoben.


    **Warum ist dies vorteilhafter als eine prozentuale Gebühr?**


    Ein Fixpreis macht Ihre Kosten unabhängig von der Ordergröße planbar. Während
    prozentuale Gebühren bei größeren Investitionssummen stark ansteigen, bleibt die
    Gebühr beim Kranich Depot immer bei 1 €, egal ob Sie einen kleinen oder einen
    großen Betrag investieren.


    **Gibt es Ausnahmen von dieser Gebühr?**


    Die Gebühr von 1 € gilt standardmäßig für alle Wertpapierorders innerhalb des
    Kranich Depot. Weitere Details zu allen anfallenden Kosten finden Sie in unserem
    Dokument Kranich Depot — Preis- und Leistungsverzeichnis.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 0dc433ac-3275-5803-b4ab-336acaa6b148
  title: Kranich Depot — abschließen und aktivieren
  body: 'Um Ihr Kranich Depot zu eröffnen und mit Ihren Investments zu starten, führen
    Sie bitte die folgenden Schritte durch. Bitte stellen Sie sicher, dass Sie ein
    gültiges Ausweisdokument bereitliegen haben.


    1.  **Übermittlung der Stammdaten:** Teilen Sie uns Ihre persönlichen Daten (Name,
    Anschrift, Geburtsdatum und Steuer-Identifikationsnummer) mit. Wir prüfen diese
    Angaben auf Vollständigkeit.

    2.  **Identitätsprüfung:** Durchlaufen Sie unsere mehrstufige Sicherheitsprüfung.
    Wir fordern Sie auf, Ihre Identität durch ein verifiziertes Verfahren nachzuweisen.
    Sobald die Verifizierung erfolgreich abgeschlossen ist, erhalten Sie von uns eine
    Bestätigung.

    3.  **Risikoprofiling (MiFID II):** Beantworten Sie unsere Fragen zur Geeignetheits-
    und Angemessenheitsprüfung. Dies dient dazu, Ihre Anlageerfahrung und Ihre Risikobereitschaft
    zu ermitteln, damit wir die regulatorischen Anforderungen der BaFin und MiFID
    II erfüllen können.

    4.  **Vertragsabschluss:** Wir senden Ihnen die Vertragsunterlagen digital zu.
    Bestätigen Sie die Annahme der Bedingungen durch eine starke Authentifizierung.

    5.  **Einrichtung des Verrechnungskontos:** Wir richten Ihnen automatisch das
    zugehörige Verrechnungskonto ein. Sie können nun eine erste Einzahlung tätigen,
    um Ihr Depot zu aktivieren.


    **Woran erkennen Sie, dass der Prozess erfolgreich war?**


    Nach Abschluss der Schritte 1 bis 5 erhalten Sie eine finale Bestätigung über
    die Eröffnung Ihres Kontos. In Ihrem Dashboard sehen Sie nun das aktive Kranich
    Depot mit einer Depotgebühr von 0 € und dem verzinsten Verrechnungskonto.


    Falls während des Prozesses eine Prüfung Ihrer Unterlagen erforderlich ist, werden
    wir Sie proaktiv informieren. Weitere Informationen zu den Anforderungen finden
    Sie in Kranich Depot — Voraussetzungen.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: how_to_guide
  source_authority: official
