- id: 4436800c-dde5-592f-9f1b-00d6341c6813
  title: Kranich Depot — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Im Vergleich zu herkömmlichen Brokern oder klassischen Bankhäusern bietet
    das Kranich Depot eine deutlich vereinfachte und kostentransparentere Struktur.


    **Kostenvergleich**

    * **Depotgebühren:** Viele Wettbewerber erheben jährliche Pauschalgebühren für
    die Depotführung. Das Kranich Depot ist mit 0 € kostenfrei.

    * **Ordergebühren:** Während andere Institute oft prozentuale Gebühren (z. B.
    0,25 % des Ordervolumens) berechnen, was bei größeren Summen sehr teuer wird,
    setzen wir auf eine fixe Gebühr von 1 € pro Order.

    * **Verzinsung:** Viele Neobroker bieten keine oder nur sehr geringe Zinsen auf
    das Verrechnungskonto. Wir bieten 2,25 % auf Guthaben bis 50.000 €.


    **Wer sollte was wählen?**

    * **Das Kranich Depot** ist die ideale Wahl für Anleger, die maximale Kostentransparenz
    suchen, keine Lust auf prozentuale Gebühren haben und ihr nicht investiertes Kapital
    attraktiv verzinst wissen wollen.

    * **Ein Wettbewerbsangebot** könnte vorteilhaft sein, wenn der Kunde spezifische,
    hochkomplexe Finanzinstrumente (z. B. bestimmte exotische Derivate) benötigt,
    die in unserem aktuellen Angebot nicht enthalten sind.


    Weitere Details zu unseren Konditionen finden Sie in Kranich Depot — Preis- und
    Leistungsverzeichnis.'
