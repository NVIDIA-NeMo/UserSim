  mentions_tools: []
  institution_id: kranich_invest
- id: b060df00-3c01-5603-8987-073c4802b536
  title: ETF-Sparplan — Schritt-für-Schritt-Anleitung
  body: 'Wie richte ich meinen ETF-Sparplan bei Kranich Invest ein? Hier ist der einfache
    Ablauf in drei Schritten:


    Schritt 1: Auswahl des ETFs

    Sie wählen aus unserem Angebot den ETF aus, der zu Ihrer Anlagestrategie passt.
    Stellen Sie sicher, dass Ihr MiFID II Profil aktuell ist, damit wir die Geeignetheit
    prüfen können.


    Schritt 2: Festlegung der Parameter

    Sie teilen uns den gewünschten Sparbetrag mit. Dieser muss mindestens 10 € betragen.
    Zudem legen Sie fest, an welchem Tag im Monat die Ausführung erfolgen soll.


    Schritt 3: Bestätigung

    Wir bestätigen Ihnen, dass für die Ausführung dieses Sparplans eine Gebühr von
    0 € anfällt. Durch eine starke Authentifizierung schließe Sie den Vorgang ab.


    Was passiert nach dem Abschluss?

    Zum gewählten Termin wird der Betrag automatisch von Ihrem Verrechnungskonto abgebucht
    und in den entsprechenden ETF investiert. Sie erhalten eine Bestätigung über die
    erfolgreiche Ausführung.


    Weitere Informationen finden Sie in: ETF-Sparplan — Voraussetzungen und Abschluss.'
