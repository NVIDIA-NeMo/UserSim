- id: ffd4651c-552d-5ae6-8ac3-340078052f37
  title: Kranich Depot — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie Anpassungen an Ihrem Kranich Depot
    vornehmen, beispielsweise die Änderung Ihres Freistellungsauftrags für den Sparer-Pauschbetrag.


    **Voraussetzungen:**

    * Sie verfügen über einen aktiven Zugang zum Kranich Depot.

    * Ihre Identität ist vollständig verifiziert.


    **Schritte zur Änderung des Freistellungsauftrags:**

    1. Teilen Sie uns mit, welchen Betrag Sie als steuerfreien Sparer-Pauschbetrag
    geltend machen möchten. Beachten Sie die gesetzlichen Höchstgrenzen: 1.000 € für
    Einzelpersonen bzw. 2.000 € für Gemeinschaftsdepots.

    2. Wir führen eine Sicherheitsprüfung durch, um sicherzustellen, dass die Änderung
    von Ihnen autorisiert wurde.

    3. Wir bestätigen Ihnen die Änderung des Freistellungsauftrags schriftlich über
    Ihr gesichertes Postfach.


    **Andere Änderungen (Stammdaten):**

    1. Nennen Sie uns die zu ändernden Informationen (z. B. neue Adresse oder Bankverbindung).

    2. Legen Sie bei Bedarf die erforderlichen Nachweise (z. B. Meldebescheinigung)
    vor.

    3. Nach einer mehrstufigen Sicherheitsprüfung führen wir die Änderung in Ihrem
    Profil durch.

    4. Sie erhalten eine Benachrichtigung, sobald die Daten aktualisiert wurden.


    Regulatorischer Hinweis: Änderungen an steuerlichen Daten haben Einfluss auf die
    Abführung der Abgeltungsteuer. Wir leisten keine individuelle Steuerberatung.'
