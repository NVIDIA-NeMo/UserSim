- id: d56a914f-a9ba-5698-a617-acf67de47ea6
  title: ETF-Sparplan — zwischen Tarifen wählen
  body: "Bei Kranich Invest haben Sie die Wahl, wie Sie in ETFs investieren möchten:\
    \ über einen automatisierten ETF-Sparplan oder über manuelle Einzelorders über\
    \ Ihr Depot.\n\n**Vergleich der Optionen**\n\n*   **ETF-Sparplan**\n    *   **Kosten**:\
    \ 0 € Ausführungsgebühr pro Sparplanausführung.\n    *   **Mindestbetrag**: 10\
    \ € pro Intervall.\n    *   **Vorteil**: Automatisierter Vermögensaufbau, Zeitersparnis\
    \ und Nutzung des Cost-Average-Effekts.\n\n*   **Manuelle Einzelorder (via Wertpapierdepot)**\n\
    \    *   **Kosten**: Fixe Kosten von 1 € pro Order.\n    *   **Mindestbetrag**:\
    \ Abhängig vom Kurs des ETFs (kein fixes Minimum von 10 €).\n    *   **Vorteil**:\
    \ Volle Kontrolle über den exakten Zeitpunkt des Kaufs; geeignet für größere,\
    \ einmalige Investitionen.\n\n**Empfehlung**\n*   Der **ETF-Sparplan** eignet\
    \ sich ideal für Anleger, die diszipliniert und kosteneffizient (0 € Gebühr) über\
    \ einen langen Zeitraum Vermögen aufbauen möchten, beginnend mit kleinen Beträgen\
    \ ab 10 €.\n*   Die **Einzelorder** ist die bessere Wahl für erfahrene Anleger,\
    \ die gezielt auf Marktschwankungen reagieren wollen und bereit sind, die Gebühr\
    \ von 1 € pro Trade zu zahlen.\n\nWeitere Details zu den Depotkosten finden Sie\
    \ in: Kranich Depot — Entgelt pro Order: Erklärung."
