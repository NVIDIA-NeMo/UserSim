- id: edf64823-84b7-5740-b0e2-316d52598b60
  title: ETF-Sparplan — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen die Angaben eines Kunden für einen ETF-Sparplan nicht mit den hinterlegten
    Stammdaten übereinstimmen.


    Symptom: Ein Kunde versucht einen Sparplan einzurichten oder zu ändern, aber die
    im Antrag genannten Daten (z. B. Name, Anschrift oder Steuer-ID) weichen von den
    im System hinterlegten Daten ab.


    Wahrscheinliche Ursachen:

    * Namensänderung durch Heirat oder Scheidung, die noch nicht im System aktualisiert
    wurde.

    * Fehlerhafte Eingabe bei der Übermittlung des Sparplanauftrags.

    * Veralteter Personalausweis oder abgelaufene Identitätsprüfung.


    Prüfungsreihenfolge und Lösung:


    1. Identitätsabgleich: Prüfen Sie, ob die Abweichung geringfügig (Tippfehler)
    oder substanziell (anderer Name/Adresse) ist.

    2. Anforderung von Nachweisen: Bitten Sie den Kunden um die Einreichung eines
    aktuellen, verifizierten Identitätsnachweises (z. B. Personalausweis, Reisepass)
    oder einer offiziellen Urkunde (z. B. Heiratsurkunde).

    3. Stammdatenaktualisierung: Führen Sie eine mehrstufige Sicherheitsprüfung durch
    und aktualisieren Sie die Stammdaten im System, bevor der Sparplan-Vorgang finalisiert
    wird.

    4. Validierung der MiFID II Daten: Stellen Sie sicher, dass die steuerlichen Informationen
    (z. B. Sparer-Pauschbetrag) mit den aktualisierten Daten übereinstimmen.


    Eskalation:

    Falls der Kunde keine gültigen Dokumente vorlegen kann oder ein begründeter Verdacht
    auf Identitätsdiebstahl besteht, ist der Vorgang sofort an die Fachabteilung für
    Compliance weiterzuleiten. Das Konto wird bis zur Klärung für zustandsändernde
    Aktionen gesperrt.


    Regulatorischer Hinweis: Wir agieren streng nach den Vorgaben der BaFin. Jede
    Änderung an Stammdaten erfordert eine verifizierte Identität.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 014d1528-8f7d-50de-93f0-d5859e829573
  title: Kranich Kinderdepot — Überblick
  body: 'Das Kranich Kinderdepot ist speziell darauf ausgerichtet, den langfristigen
    Vermögensaufbau für die nächste Generation mit minimalen Hürden und maximaler
    Transparenz zu ermöglichen. Wir bieten Eltern und gesetzlichen Vertretern ein
    Instrument, um bereits in jungen Jahren eine solide finanzielle Basis für ihre
    Kinder zu schaffen.


    Unser Fokus liegt auf Kosteneffizienz und Sicherheit. Im Gegensatz zu vielen traditionellen
    Angeboten verzichten wir vollständig auf Depotgebühren, sodass das investierte
    Kapital ohne unnötige Kostenbelastung wachsen kann. Die Preisstruktur ist bewusst
    einfach gehalten: Statt komplexer prozentualer Gebühren, die bei steigenden Beträgen
    massiv zunehmen, setzen wir auf eine planbare Fixgebühr pro Transaktion.


    Die wichtigsten Konditionen im Überblick:


    * Depotführung: Die jährliche Depotgebühr beträgt 0 €.

    * Ordergebühren: Jede Order wird mit einem fixen Entgelt von 1 € abgerechnet.

    * Vermögensaufbau per Sparplan: Automatisierte Investitionen sind bereits ab einem
    Betrag von 10 € pro Monat möglich.


    Ein wesentlicher Aspekt unserer Philosophie ist die Sicherheit der Anlagen. Alle
    Wertpapiere werden als Sondervermögen verwahrt. Das bedeutet, dass die Bestände
    rechtlich strikt vom Institutsvermögen der Kranich Invest getrennt sind und im
    unwahrscheinlichen Fall einer Insolvenz nicht in die Insolvenzmasse fallen. Zusätzlich
    greift die gesetzliche Anlegerentschädigung, die 90 % des Guthagens bis zu einem
    Maximalbetrag von 20.000 € absichert.


    Das Kranich Kinderdepot ist somit die ideale Lösung für Anleger, die eine seriöse,
    kostengünstige und regulatorisch abgesicherte Umgebung suchen, um das Vermögen
    ihrer Kinder systematisch aufzubauen. Wir unterstützen Sie dabei, durch niedrige
    Einstiegshürden und eine klare Kostenstruktur den Grundstein für eine finanziell
    abgesicherte Zukunft zu legen.


    Für detaillierte Informationen zu den Kosten konsultieren Sie bitte das Kranich
    Kinderdepot — Preis- und Leistungsverzeichnis.'
