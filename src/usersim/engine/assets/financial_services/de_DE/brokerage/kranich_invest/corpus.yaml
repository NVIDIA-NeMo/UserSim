- id: 7a7fdd06-1f2e-5fcd-8056-baa35433ad5d
  title: Kranich Kinderdepot — abschließen und aktivieren
  body: 'Die Eröffnung eines Kranich Kinderdepots ist ein strukturierter Prozess,
    der sicherstellt, dass alle regulatorischen Anforderungen an die Identitätsprüfung
    und die gesetzliche Vertretung erfüllt werden. Bitte beachten Sie, dass das Depot
    auf den Namen des Kindes geführt wird, die Verwaltung jedoch durch die Eltern
    oder gesetzlichen Sorgeberechtigten erfolgt.


    **Voraussetzungen vor dem Start**

    Bevor Sie mit der Eröffnung beginnen, halten Sie bitte folgende Unterlagen bereit:

    * Die Geburtsurkunde des Kindes (als Nachweis über das Eltern-Kind-Verhältnis).

    * Gültige Identitätsnachweise (Personalausweis oder Reisepass) aller gesetzlichen
    Vertreter.

    * Die Steueridentifikationsnummer des Kindes.


    **Schritte zur Aktivierung**


    1. **Antragstellung**: Teilen Sie uns mit, dass Sie ein Kinderdepot eröffnen möchten,
    und geben Sie die Stammdaten des Kindes sowie die Daten der gesetzlichen Vertreter
    an.

    2. **Einreichung der Dokumente**: Übermitteln Sie uns die oben genannten Identitätsnachweise
    und die Geburtsurkunde. Wir prüfen diese Unterlagen im Rahmen unserer mehrstufigen
    Sicherheitsprüfung.

    3. **Identitätsverifizierung**: Die gesetzlichen Vertreter müssen eine starke
    Authentifizierung durchlaufen, um ihre Identität zweifelsfrei nachzuweisen.

    4. **Vertragsabschluss**: Nach erfolgreicher Prüfung erhalten Sie die Vertragsunterlagen
    zur digitalen Signatur. Sobald diese unterzeichnet vorliegen, wird das Depot aktiviert.

    5. **Erste Einzahlung**: Überweisen Sie den gewünschten Betrag auf das neue Verrechnungskonto,
    um mit dem Investment zu starten.


    **Abschluss des Vorgangs**

    Der Vorgang ist abgeschlossen, wenn Sie eine Bestätigung über die erfolgreiche
    Depotaktivierung erhalten und Zugriff auf die Depotverwaltung haben. Ab diesem
    Moment können Sie Einzelorders mit einem Entgelt von 1 € tätigen oder einen Sparplan
    bereits ab 10 € pro Monat einrichten.


    Weitere Informationen zu den Voraussetzungen finden Sie im Dokument Kranich Kinderdepot
    — Voraussetzungen.'
