- id: 9e648e8f-d65a-5f67-b0f4-1ce1e8940826
  title: Kranich Depot — Risikohinweise
  body: 'Kranich Invest ist gesetzlich verpflichtet, Kunden umfassend über die mit
    dem Erwerb von Wertpapieren verbundenen Risiken aufzuklären. Bitte lesen Sie die
    folgenden Hinweise sorgfältig durch.


    **Marktrisiko und Verlustmöglichkeit**

    Investitionen in Wertpapiere sind mit Risiken verbunden. Die Kurse von Aktien,
    ETFs und anderen Finanzinstrumenten können schwanken. Es besteht die Möglichkeit,
    dass Sie einen Teil oder sogar das gesamte eingesetzte Kapital verlieren. Eine
    Rendite kann nicht garantiert werden.


    **Sicherheit der Einlagen und Wertpapiere**

    Kranich Invest implementiert strenge Sicherheitsmaßnahmen zur Verwahrung Ihrer
    Vermögenswerte:


    * **Sondervermögen:** Ihre Wertpapiere werden als Sondervermögen verwahrt. Das
    bedeutet, dass sie rechtlich getrennt vom Vermögen des Instituts gehalten werden
    und somit im Falle einer Insolvenz von Kranich Invest nicht in die Insolvenzmasse
    fallen. Sie bleiben Ihr Eigentum.

    * **Gesetzliche Einlagensicherung:** Für das Guthaben auf dem Verrechnungskonto
    greift die gesetzliche Anlegerentschädigung. Diese sichert 90 % des Betrags bis
    zu einer maximalen Summe von 20.000 € ab.


    **Regulatorischer Rahmen**

    Wir agieren streng nach den Vorgaben der BaFin sowie den Richtlinien der MiFID
    II. Insbesondere die Kostenoffenlegung und die Prüfung der Angemessenheit von
    Finanzprodukten haben für uns Priorität. Die Durchführung dieser Prüfungen dient
    dem Schutz des Anlegers und stellt sicher, dass die gewählten Produkte zum Kenntnisstand
    und zur finanziellen Situation des Kunden passen.


    **Beratungshinweis**

    Kranich Invest bietet edukative Informationen und allgemeine Markteinblicke an.
    Wir leisten jedoch keine individuelle Steuerberatung oder Rechtsberatung. Wir
    empfehlen, bei komplexen steuerlichen Fragen einen qualifizierten Steuerberater
    zu konsultieren.


    Für weitere Informationen zur Kontoführung siehe Kranich Depot — Allgemeine Geschäftsbedingungen.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: disclosure
