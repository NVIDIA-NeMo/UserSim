- id: b2dde171-4cc6-5a85-a96f-8ae3bc578844
  title: Kranich Kinderdepot — Voraussetzungen und Abschluss
  body: 'Hier erfahren Sie, wie Sie den Vermögensaufbau für Ihr Kind bei uns starten.


    **Welche Voraussetzungen müssen für die Eröffnung erfüllt sein?**

    Da das Depot auf den Namen des Kindes geführt wird, müssen Sie als gesetzlicher
    Vertreter (in der Regel die Eltern) legitimiert sein. Sie benötigen ein gültiges
    Identifikationsdokument sowie einen Nachweis über die Elternschaft (z. B. Geburtsurkunde
    des Kindes).


    **Wie erfolgt der Abschluss des Depots?**

    Der Prozess ist rein digital. Sie reichen die erforderlichen Dokumente ein, durchlaufen
    eine mehrstufige Sicherheitsprüfung und bestätigen die Rahmenbedingungen. Sobald
    die Verifizierung abgeschlossen ist, ist das Depot einsatzbereit.


    **Kann ich für das Kind einen Steuerfreistellungsauftrag einrichten?**

    Ja, das ist möglich und sehr empfehlenswert. Da Kinder einen eigenen Sparer-Pauschbetrag
    haben, können Sie über einen Freistellungsauftrag sicherstellen, dass Kapitalerträge
    bis zu diesem Betrag steuerfrei bleiben.


    Weitere Details zu den erforderlichen Dokumenten finden Sie in Kranich Kinderdepot
    — Voraussetzungen.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 7de64723-c1b9-55ee-8e85-930004095f4a
  title: Kranich Kinderdepot — ein typisches Anliegen vollständig erledigen
  body: 'Ein sehr häufiges Anliegen ist die Einrichtung eines automatisierten Sparplans
    für das Kind. So führen Sie diesen Prozess von Anfang bis Ende erfolgreich durch:


    **Voraussetzungen**

    Ein bereits eröffnetes und verifiziertes Kranich Kinderdepot sowie ein ausreichendes
    Guthaben auf dem Verrechnungskonto zur Deckung der ersten Rate und der Gebühren.


    **Schritt-für-Schritt-Anleitung**

    1.  **Anlageobjekt wählen:** Teilen Sie uns mit, in welchen Wertpapier oder ETF
    Sie für Ihr Kind investieren möchten. Wir prüfen die Verfügbarkeit des Produkts.

    2.  **Sparraten festlegen:** Geben Sie den gewünschten monatlichen Betrag an.
    Beachten Sie dabei, dass der Mindestbetrag pro Sparplanausführung 10 € beträgt.

    3.  **Ausführungsdatum bestimmen:** Legen Sie fest, an welchem Tag des Monats
    die Anlage automatisch erfolgen soll.

    4.  **Kostenbestätigung:** Wir weisen Sie darauf hin, dass für jede Ausführung
    des Sparplans eine fixe Ordergebühr von 1 € anfällt. Bitte bestätigen Sie Ihr
    Einverständnis mit dieser Gebühr.

    5.  **Abschluss:** Wir richten den Sparplan in Ihrem Depot ein und senden Ihnen
    eine Bestätigung über die Parameter (Betrag, Intervall, Produkt) zu.


    **Woran erkennen Sie, dass das Anliegen erledigt ist?**

    Der Vorgang ist vollständig abgeschlossen, wenn Sie die schriftliche Bestätigung
    des Sparplans erhalten haben und die erste geplante Ausführung in Ihrem Transaktionsverlauf
    als „ausgeführt“ erscheint.


    Für weitere Informationen zum Thema Sparpläne lesen Sie bitte ETF-Sparplan — Überblick.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: c8225258-b7ca-5103-a43d-58c23798288f
  title: Kranich Kinderdepot — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt den Support bei der Bearbeitung von Fällen, in
    denen die eingereichten Dokumente nicht mit den hinterlegten Stammdaten des Kinderdepots
    übereinstimmen.


    **Symptom**

    Bei der Prüfung der Identität oder der gesetzlichen Vertretung stellt der Support
    fest, dass Namen, Geburtsdaten oder Adressen in den Dokumenten (z. B. Ausweis
    des Elternteils, Geburtsurkunde des Kindes) von den Angaben im Antragsformular
    abweichen.


    **Prüfsequenz für den Support**

    1.  **Art der Abweichung identifizieren:** Handelt es sich um einen Tippfehler,
    eine Namensänderung (z. B. durch Heirat) oder eine grundlegende Diskrepanz in
    der Identität?

    2.  **Dokumentenabgleich:** Vergleichen Sie die Geburtsurkunde des Kindes mit
    dem Ausweis des gesetzlichen Vertreters. Ist die Abstammung eindeutig belegt?

    3.  **Aktualität prüfen:** Sind die eingereichten Ausweisdokumente noch gültig
    oder sind sie abgelaufen?


    **Lösungsweg**

    *   **Bei Tippfehlern:** Bitten Sie den Kunden um eine kurze schriftliche Bestätigung
    der korrekten Schreibweise und korrigieren Sie die Daten intern nach Verifizierung.

    *   **Bei Namensänderungen:** Fordern Sie ein offizielles Dokument an, das die
    Änderung belegt (z. B. Heiratsurkunde), um die Kette der Identität lückenlos zu
    schließen.

    *   **Bei grundlegenden Diskrepanzen:** Leiten Sie den Fall an die Fachabteilung
    für Compliance weiter. Das Depot bleibt bis zur endgültigen Klärung für zustandsändernde
    Aktionen gesperrt, um die Sicherheit des Sondervermögens zu gewährleisten.


    **Ergebnis für den Kunden**

    Der Kunde wird über die notwendigen Nachbelege informiert. Nach erfolgreicher
    Einreichung wird die Sperre aufgehoben und die Stammdaten aktualisiert.


    Details zu den erforderlichen Unterlagen finden Sie in Kranich Kinderdepot — erforderliche
    Unterlagen.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 94077332-1339-5e3a-a749-f675d35365a9
  title: Entgelte und Kosten im Überblick
  body: 'Kranich Invest verfolgt eine Philosophie der maximalen Kostentransparenz,
    um den langfristigen Vermögensaufbau unserer Kunden ohne unnötige Hürden zu fördern.
    Wir verzichten bewusst auf prozentuale Gebührenmodelle, die bei steigendem Depotwert
    oft intransparent werden.


    Die folgenden Konditionen gelten instituteweit:


    * Depotführung: Diese ist mit 0 € kostenfrei.

    * Ordergebühren: Für jede ausgeführte Order berechnen wir einen fixen Betrag von
    1 €.


    Diese Struktur stellt sicher, dass Ihre Kosten planbar bleiben, unabhängig von
    der Höhe Ihres Investments oder der Anzahl der Transaktionen. Für spezifische
    Details zu einzelnen Produkten, wie etwa den Mindestbeträgen bei automatisierten
    Plänen, konsultieren Sie bitte die jeweiligen Produktunterlagen, wie beispielsweise
    den ETF-Sparplan — Überblick.


    Wir verzichten auf versteckte Kosten, um eine faire und wettbewerbsfähige Umgebung
    für private Anleger zu schaffen.'
  domain: brokerage_investing
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 57b344e6-c972-548e-a62c-f6b11f8753e6
  title: Häufige Fragen
  body: 'Hier finden Sie Antworten auf allgemeine Fragen zu unserem Service-Modell
    bei Kranich Invest.


    **Wie kann ich den Support kontaktieren?**

    Unser Support steht Ihnen über digitale Kanäle per E-Mail und Chat zur Verfügung.
    Für persönliche Anliegen erreichen Sie uns telefonisch während der Geschäftszeiten
    (MEZ).


    **Was passiert, wenn mein Anliegen komplex ist?**

    Sollte eine Anfrage eine tiefergehende Prüfung erfordern, nutzen wir ein definiertes
    Eskalationsmanagement. Ihre Anfrage wird in diesem Fall an die zuständigen Fachabteilungen
    für Compliance oder Depotführung weitergeleitet, um eine präzise Lösung zu gewährleisten.


    **Wie werden Beschwerden oder Betrugsverdacht behandelt?**

    Wir erfassen alle Beschwerden und Verdachtsmomente systematisch. Die Bearbeitung
    erfolgt innerhalb eines fest definierten Zeitrahmens, transparent und im Einklang
    mit den BaFin-Richtlinien. Weitere Details zur Vorgehensweise finden Sie in unseren
    internen Richtlinien zur Betrugsbekämpfung.


    Ihre aktuellen Positionen und Ihr Guthaben sehen Sie jederzeit in der Kranich-App.'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: b6ab5400-8400-5ebd-8aff-341603e34bd8
  title: 'Aufsichtsrechtliche Hinweise: Wertpapiere und Depot'
  body: 'Kranich Invest agiert strikt nach den regulatorischen Vorgaben der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin) sowie den Richtlinien der MiFID II.
    Die Einhaltung dieser Standards dient dem Schutz Ihrer Anlagen und der Sicherstellung
    eines fairen Marktumfelds.


    **Geeignetheits- und Angemessenheitsprüfung**

    Im Rahmen der MiFID II führen wir eine sorgfältige Geeignetheits- und Angemessenheitsprüfung
    durch. Ziel ist es, sicherzustellen, dass die angebotenen Finanzinstrumente Ihren
    Kenntnissen, Ihrer Erfahrung und Ihren finanziellen Zielen entsprechen. Die vollständige
    Kostenoffenlegung ist dabei ein zentraler Bestandteil unseres Prozesses.


    **Sicherheit und Verwahrung**

    Die Sicherheit Ihrer Vermögenswerte hat für uns höchste Priorität. Wir gewährleisten
    dies durch folgende Mechanismen:


    * Sondervermögen: Alle Wertpapiere werden als Sondervermögen verwahrt. Das bedeutet,
    dass Ihre Wertpapiere rechtlich strikt vom Institutsvermögen getrennt sind und
    im unwahrscheinlichen Fall einer Insolvenz nicht in die Insolvenzmasse fallen.

    * Anlegerentschädigung: Darüber hinaus greift die gesetzliche Anlegerentschädigung,
    die bis zu 90 % des Schadens, jedoch maximal 20.000 €, abdeckt.


    **Risikohinweis**

    Wir weisen Sie explizit darauf hin, dass Investitionen in Wertpapiere mit einem
    Verlustrisiko verbunden sind. Es besteht die Möglichkeit, dass Sie einen Teil
    oder die Gesamtheit des eingesetzten Kapitals verlieren. Da wir keine Renditen
    garantieren, sollten Sie Ihre Anlagestrategie stets auf Ihre persönliche Risikotoleranz
    abstimmen.


    **Steuerliche Behandlung**

    Kranich Invest führt die anfallende Abgeltungsteuer inklusive Solidaritätszuschlag
    und gegebenenfalls Kirchensteuer direkt an das Finanzamt ab. Sie können uns mittels
    eines Freistellungsauftrags mitteilen, welchen Teil Ihres Sparer-Pauschbetrags
    (1.000 € für Einzelpersonen, 2.000 € für Gemeinschaftsdepots) wir berücksichtigen
    sollen.


    *Disclaimer: Wir bieten edukative Informationen und allgemeine Markteinblicke,
    leisten jedoch keine individuelle Steuer- oder Rechtsberatung.*'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: db76a5f3-75cc-51ad-9af1-f72e661004ba
  title: Wann get_positions eingesetzt wird
  body: 'Das Werkzeug get_positions dient dazu, die aktuellen Wertpapierpositionen
    eines Kunden innerhalb seines Depots abzurufen. Es ist die primäre Informationsquelle,
    wenn ein Kunde Fragen zu seinem aktuellen Portfolio, der Anzahl seiner Anteile
    oder der aktuellen Zusammensetzung seines Depots hat.


    Um die Sicherheit und den Datenschutz zu gewährleisten, darf dieses Werkzeug nur
    nach einer erfolgreichen Identitätsprüfung aufgerufen werden. Der Agent muss sicherstellen,
    dass er mit dem rechtmäßigen Inhaber des Kontos kommuniziert.


    **Ablauf der Abfrage:**


    1. **Identitätsprüfung:** Der Agent führt zunächst eine starke Authentifizierung
    durch, indem er das Werkzeug verify_identity einsetzt.

    2. **Kontoauflösung:** Da der Kunde oft nur eine Teilnummer (z. B. die letzten
    vier Ziffern) seines Kontos nennt, muss der Agent get_accounts aufrufen, um die
    vollständige, systeminterne account_id zu ermitteln.

    3. **Positionsabruf:** Erst nach Vorliegen der verifizierten Identität und der
    korrekten account_id wird das Werkzeug get_positions aufgerufen.


    Der Agent nutzt die Rückgabewerte von get_positions, um dem Kunden eine präzise
    Aufstellung seiner Wertpapiere zu geben. Es ist untersagt, Positionen zu nennen,
    ohne dass dieser Prozess vollständig durchlaufen wurde. Sollte der Kunde mehrere
    Depots besitzen, muss explizit geklärt werden, für welches Depot die Auskunft
    gewünscht wird, bevor die entsprechende account_id an get_positions übermittelt
    wird.


    Nach dem Abruf der Daten sind die Informationen im Sinne der Diskretion nur im
    Kontext der aktuellen Sitzung zu verwenden und nicht dauerhaft in ungesicherten
    Notizen zu speichern.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: kranich_invest
- id: f78b89cf-9b99-59ae-85fd-9d4d9eb254e8
  title: Werkzeugreferenz get_positions
  body: 'Das Werkzeug `get_positions` wird vom Agenten direkt aufgerufen, um eine
    Liste aller im Depot eines Kunden gehaltenen Wertpapiere abzurufen.


    **Signatur:**

    `get_positions(account_id: string)`


    **Argumente:**

    * `account_id`: Die eindeutige systeminterne Kennung des Depots. Dieser Wert muss
    zuvor durch den Aufruf von `get_accounts` auf Basis der Kundenidentität ermittelt
    werden.


    **Effekt:**

    Das Werkzeug gibt eine detaillierte Liste der aktuellen Positionen zurück, einschließlich
    ISIN, Ticker-Symbol, Anzahl der gehaltenen Anteile und dem aktuellen Marktwert.


    Der Agent führt diese Aktion aus, indem er das Tool im System ausführt; der Kunde
    wird nicht auf ein externes Portal verwiesen, sondern erhält die Informationen
    direkt in der Konversation.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: kranich_invest
- id: 6ceaee9c-7620-5487-ab05-109bfebeb518
  title: Wann place_trade eingesetzt wird
  body: 'Das Werkzeug place_trade ist der operative Mechanismus zur Ausführung von
    Kauf- oder Verkaufsaufträgen für Wertpapiere. Es wird eingesetzt, wenn ein Kunde
    explizit den Wunsch äußert, ein bestimmtes Wertpapier zu erwerben oder eine bestehende
    Position zu veräußern.


    Da es sich hierbei um eine zustandsändernde Aktion handelt, gelten strengste Sicherheitsvorgaben.
    Eine Transaktion darf niemals ohne vorherige Verifizierung und ausreichende Deckung
    auf dem Verrechnungskonto (beim Kauf) oder vorhandene Positionen (beim Verkauf)
    initiiert werden.


    **Ablauf der Handelsausführung:**


    1. **Identitätsprüfung:** Der Agent muss die Identität des Kunden zwingend über
    verify_identity bestätigen.

    2. **Kontoidentifikation:** Über get_accounts wird die korrekte account_id für
    das betroffene Depot ermittelt.

    3. **Detailaufnahme:** Der Agent muss die genauen Parameter der Order klären:
    Welches Wertpapier (Ticker/ISIN), welche Menge (Stückzahl/Betrag) und welche Richtung
    (Kauf oder Verkauf).

    4. **Prüfung:** Der Agent stellt sicher, dass die Order mit den geltenden Bedingungen
    übereinstimmt. Er weist den Kunden sachlich auf das Risiko von Kursschwankungen
    hin.

    5. **Ausführung:** Das Tool place_trade wird mit den gesammelten Parametern aufgerufen.


    Der Agent muss dem Kunden nach dem Tool-Aufruf die Bestätigung der Order sowie
    die anfallenden Kosten (fixe Ordergebühr von 1 €) mitteilen. Sollte die Transaktion
    fehlschlagen, ist der entsprechende Fehlercode zu analysieren und der Kunde entsprechend
    zu informieren. Eine manuelle Umleitung auf Webformulare ist nicht vorgesehen;
    die Ausführung erfolgt direkt durch den Agenten via Tool-Aufruf.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: kranich_invest
- id: f525c00a-2fdd-556f-9500-3cb52e0e40c3
  title: Werkzeugreferenz place_trade
  body: 'Das Werkzeug `place_trade` wird vom Agenten verwendet, um Wertpapierorders
    für den Kunden direkt im System zu platzieren.


    **Signatur:**

    `place_trade(account_id: string, ticker: string, quantity: number, side: string)`


    **Argumente:**

    * `account_id`: Die systeminterne Kennung des Depots (aus `get_accounts`).

    * `ticker`: Das eindeutige Identifikationssymbol des Wertpapiers.

    * `quantity`: Die Anzahl der zu handelnden Anteile.

    * `side`: Die Richtung des Handels, entweder "BUY" (Kauf) oder "SELL" (Verkauf).


    **Effekt:**

    Das Tool übermittelt die Order an das Handelssystem. Bei Erfolg wird eine Transaktions-ID
    zurückgegeben; bei Fehlern (z. B. mangelnde Deckung) wird eine entsprechende Fehlermeldung
    ausgegeben.


    Der Agent führt diesen Vorgang direkt durch den Tool-Aufruf aus, nachdem die Identität
    des Kunden verifiziert wurde.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - place_trade
  institution_id: kranich_invest
- id: 9f569a60-4a7e-5e85-86b1-9fddb2580584
  title: Wann initiate_securities_transfer eingesetzt wird
  body: "Das Werkzeug initiate_securities_transfer wird eingesetzt, um den Prozess\
    \ eines Depotübertrags von einem anderen Kreditinstitut zu Kranich Invest zu starten.\
    \ Dieser Service ist im Rahmen unserer Philosophie der niedrigen Einstiegshürden\
    \ für Kunden kostenlos.\n\nEin Depotübertrag ist ein komplexer Vorgang, da er\
    \ die Kommunikation mit einem Drittinstitut erfordert. Daher ist eine präzise\
    \ Erfassung der Stammdaten essenziell, um Fehlleitungen oder Verzögerungen zu\
    \ vermeiden.\n\n**Ablauf des Depotübertrags:**\n\n1. **Identitätsprüfung:** Der\
    \ Agent muss die Identität des Kunden über verify_identity zweifelsfrei feststellen.\n\
    2. **Kontoauflösung:** Über get_accounts wird die Ziel-account_id bei Kranich\
    \ Invest ermittelt, in die die Wertpapiere übertragen werden sollen.\n3. **Informationsaufnahme:**\
    \ Der Agent fragt die notwendigen Details ab:\n    * Name und Anschrift des abgebenden\
    \ Instituts.\n    * Die Depotnummer beim bisherigen Broker.\n    * Ob ein Gesamtobertrag\
    \ (alle Positionen) oder ein Teilübertrag (nur bestimmte ISINs) gewünscht ist.\n\
    4. **Initiierung:** Der Agent ruft initiate_securities_transfer mit diesen Informationen\
    \ auf.\n\nDer Agent informiert den Kunden darüber, dass der Übertrag einige Werktage\
    \ in Anspruch nehmen kann und dass die Wertpapiere nach dem erfolgreichen Transfer\
    \ als Sondervermögen in seinem Kranich Depot geführt werden. Es ist wichtig, den\
    \ Kunden darauf hinzuweisen, dass Kranich Invest die Übertragung kostenfrei steuert,\
    \ jedoch mögliche Gebühren des abgebenden Instituts nicht beeinflussen kann."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_securities_transfer
  institution_id: kranich_invest
- id: b2501d0b-1da5-529a-b71b-148bd627e017
  title: Werkzeugreferenz initiate_securities_transfer
  body: 'Das Werkzeug `initiate_securities_transfer` wird vom Agenten aufgerufen,
    um einen kostenlosen Übertrag von Wertpapieren von einem anderen Institut zu Kranich
    Invest zu beauftragen.


    **Signatur:**

    `initiate_securities_transfer(account_id: string, source_institution: string,
    details: string)`


    **Argumente:**

    * `account_id`: Die systeminterne Kennung des Ziel-Depots bei Kranich Invest (ermittelt
    via `get_accounts`).

    * `source_institution`: Der Name des Instituts, von dem die Wertpapiere übertragen
    werden.

    * `details`: Eine Zusammenfassung der Übertragungsdetails, einschließlich der
    Depotnummer beim Quellinstitut und der zu übertragenden Wertpapiere.


    **Effekt:**

    Das System erstellt einen offiziellen Übertragsauftrag, der an das Quellinstitut
    übermittelt wird. Das Tool gibt eine Bestätigung der Auftragserstellung zurück.


    Der Agent führt diese Aktion direkt aus; es ist keine manuelle Einreichung von
    Dokumenten durch den Kunden erforderlich, sofern alle Daten im Gespräch vorliegen.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_securities_transfer
  institution_id: kranich_invest
- id: e119aa47-ce18-5f6f-9f8a-2aca02f6f9e0
  title: Wann set_up_savings_plan eingesetzt wird
  body: "Das Werkzeug set_up_savings_plan wird verwendet, um automatisierte ETF-Sparpläne\
    \ für Kunden einzurichten, zu ändern oder auszusetzen. Dies ist das zentrale Werkzeug\
    \ für Kunden, die einen regelmäßigen, automatisierten Vermögensaufbau anstreben.\n\
    \nEin Sparplan ermöglicht es Kunden, bereits ab einem Betrag von 10 € pro Monat\
    \ zu investieren. Der Agent muss sicherstellen, dass der Kunde über die Funktionsweise\
    \ eines Sparplans informiert ist und die notwendigen Parameter definiert hat.\n\
    \n**Ablauf der Einrichtung eines Sparplans:**\n\n1. **Identitätsprüfung:** Die\
    \ Identität des Kunden muss via verify_identity bestätigt werden.\n2. **Kontoidentifikation:**\
    \ Die Ziel-account_id wird über get_accounts ermittelt.\n3. **Parameterdefinition:**\
    \ Der Agent muss folgende Informationen vom Kunden einholen:\n    * Das gewünschte\
    \ Wertpapier (ETF).\n    * Den monatlichen Sparbetrag (Minimum 10 €).\n    * Den\
    \ gewünschten Ausführungstag im Monat.\n4. **Ausführung:** Der Agent ruft set_up_savings_plan\
    \ mit den definierten Werten auf.\n\nDer Agent muss dem Kunden bestätigen, dass\
    \ der Sparplan aktiv ist und ab welchem Datum die erste Ausführung erfolgt. Falls\
    \ ein bestehender Plan geändert oder ausgesetzt werden soll, nutzt der Agent dasselbe\
    \ Tool mit den aktualisierten Parametern. Es ist darauf hinzuweisen, dass Sparpläne\
    \ eine flexible Methode des Investierens darstellen, jedoch wie jede Wertpapieranlage\
    \ dem Marktrisiko unterliegen."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_savings_plan
  institution_id: kranich_invest
- id: a5097c00-8c47-5340-8ddc-718ac3f8d30f
  title: Werkzeugreferenz set_up_savings_plan
  body: 'Das Werkzeug set_up_savings_plan wird vom Agenten direkt aufgerufen, um einen
    ETF-Sparplan für einen Kunden zu erstellen, zu modifizieren oder zu pausieren.
    Die Ausführung erfolgt unmittelbar im System ohne Verweis auf externe Portale.


    **Parameter:**

    * **Betrag:** Der monatliche Anlagebetrag (Mindestbetrag: 10 €).

    * **Ausführungstag:** Der gewünschte Tag im Monat, an dem die Anlage erfolgt.

    * **Wertpapier:** Die Kennung (ISIN/WKN) des auszuwählenden ETFs.

    * **Aktion:** Definition, ob der Sparplan neu angelegt, der Betrag/Tag geändert
    oder der Plan ausgesetzt werden soll.


    **Effekt:**

    Das System hinterlegt den automatisierten Anlageauftrag im Depot des Kunden. Bei
    einer Änderung wird der bestehende Plan aktualisiert; bei einer Aussetzung wird
    die automatische Einziehung gestoppt, ohne den Plan zu löschen.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_up_savings_plan
  institution_id: kranich_invest
- id: cb256727-a27e-53b0-9970-d61a065b9206
  title: Wann set_tax_exemption_order eingesetzt wird
  body: "Dieses Verfahren wird angewendet, wenn ein Kunde einen Freistellungsauftrag\
    \ zur Nutzung des Sparer-Pauschbetrags einrichten, ändern oder löschen möchte.\
    \ Ziel ist es, die Abgeltungsteuer nur für Erträge oberhalb der gesetzlichen Freigrenzen\
    \ abzuführen.\n\n**Vorgehensweise:**\n1. Identität des Kunden durch starke Authentifizierung\
    \ verifizieren.\n2. Mit get_accounts die entsprechende account_id des Kunden anhand\
    \ der hinterlegten Daten oder der letzten vier Ziffern der Depotnummer ermitteln.\n\
    3. Den gewünschten Freistellungsbetrag erfragen. Dabei ist auf die gesetzlichen\
    \ Höchstgrenzen des Sparer-Pauschbetrags zu achten:\n   * Einzelpersonen: maximal\
    \ 1.000 €\n   * Gemeinschaftsdepots: maximal 2.000 €\n4. Den Tool-Aufruf set_tax_exemption_order\
    \ mit der account_id und dem Betrag ausführen.\n5. Den Kunden über die erfolgreiche\
    \ Hinterlegung und die Auswirkungen auf die Abgeltungsteuer informieren.\n\nDie\
    \ korrekte Erfassung ist essentiell, um eine Überzahlung von Steuern durch das\
    \ Institut zu vermeiden und die regulatorischen Vorgaben zur Kostenoffenlegung\
    \ und Steuerpflicht einzuhalten."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_tax_exemption_order
  institution_id: kranich_invest
- id: 965ba498-cd30-564c-af71-fc18dd0f2693
  title: Werkzeugreferenz set_tax_exemption_order
  body: 'Das Werkzeug set_tax_exemption_order dient der Verwaltung des Freistellungsauftrags
    für die Kapitalertragsteuer. Der Agent führt diese Aktion direkt im Backend aus.


    **Parameter:**

    * **account_id:** Die eindeutige Kennung des betroffenen Depots.

    * **betrag:** Der steuerfreie Betrag (gemäß Sparer-Pauschbetrag, z. B. 1.000 €
    für Einzelpersonen oder 2.000 € für Gemeinschaftskonten).

    * **aktion:** Festlegung, ob der Auftrag neu erstellt, der Betrag aktualisiert
    oder der Auftrag vollständig gelöscht werden soll.


    **Effekt:**

    Das System passt die steuerliche Behandlung von Kapitalerträgen für die angegebene
    account_id an. Zukünftige Erträge werden bis zur Höhe des Betrags nicht mit Abgeltungsteuer
    belastet.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_tax_exemption_order
  institution_id: kranich_invest
- id: 7faf449a-a3aa-587f-a457-b15ec5057784
  title: Wann update_beneficiary eingesetzt wird
  body: 'Dieses Verfahren wird genutzt, wenn ein Kunde das Referenzkonto (IBAN) ändern
    möchte, auf das Auszahlungen von Kranich Invest überwiesen werden. Da dies eine
    zustandsändernde Aktion mit hohem Sicherheitsrisiko ist, gelten verschärfte Prüfpflichten.


    **Vorgehensweise:**

    1. Die Identität des Kunden mittels mehrstufiger Sicherheitsprüfung strikt verifizieren.

    2. Mit get_accounts die aktuelle account_id des Kunden auflösen.

    3. Die neue IBAN des Referenzkontos erfragen und auf Plausibilität prüfen.

    4. Über das Tool update_beneficiary die Änderung der Auszahlungsadresse beauftragen.

    5. Den Kunden darüber informieren, dass die Änderung nach einer kurzen Sicherheitsprüfung
    aktiv wird.


    Es ist strikt darauf zu achten, dass Auszahlungen nur auf Konten erfolgen dürfen,
    die auf den Namen des Kontoinhabers laut Identitätsnachweis laufen. Bei Unstimmigkeiten
    ist der Vorgang sofort an die Fachabteilung für Compliance zu eskalieren.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kranich_invest
- id: 60ac8776-ba56-5062-9f20-77a143740a67
  title: Werkzeugreferenz update_beneficiary
  body: 'Das Werkzeug update_beneficiary wird verwendet, um die IBAN des Referenzkontos
    für einen Kunden zu aktualisieren. Der Agent führt diese Änderung direkt aus,
    nachdem die Identität zweifelsfrei festgestellt wurde.


    **Parameter:**

    * **account_id:** Die eindeutige Kennung des Kundenkontos.

    * **neue_iban:** Die vollständige IBAN des neuen Zielkontos für Auszahlungen.


    **Effekt:**

    Die hinterlegte Auszahlungsadresse im Kundenstamm wird aktualisiert. Alle zukünftigen
    Auszahlungsanforderungen werden an die neue IBAN geleitet. Bestehende Sicherheitsmechanismen
    lösen eine Benachrichtigung an den Kunden aus.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kranich_invest
- id: 4f0b82db-ef6b-5ed8-82b9-388ae4d91705
  title: Wann manage_authorized_users eingesetzt wird
  body: 'Dieses Verfahren wird angewendet, wenn ein Kunde einer anderen Person eine
    Depotvollmacht erteilen oder eine bestehende Vollmacht widerrufen möchte.


    **Vorgehensweise:**

    1. Die Identität des Kontoinhabers durch starke Authentifizierung verifizieren.

    2. Mit get_accounts die account_id des betreffenden Depots ermitteln.

    3. Im Falle einer Neuerteilung: Die vollständigen Stammdaten der bevollmächtigten
    Person erheben (vollständiger Name, Geburtsdatum und Kontaktinformationen).

    4. Über das Tool manage_authorized_users die entsprechende Vollmacht erteilen
    oder den Widerruf durchführen.

    5. Den Kunden über den Abschluss des Vorgangs und die daraus resultierenden Zugriffsrechte
    der dritten Person informieren.


    Aufgrund der Sicherheitsrelevanz dieser Aktion ist eine präzise Erfassung der
    Bevollmächtigten zwingend erforderlich, um unbefugte Zugriffe auf das Sondervermögen
    des Kunden zu verhindern.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kranich_invest
- id: 2dbf54f3-13cb-524f-bf51-c831ccdc3e53
  title: Werkzeugreferenz manage_authorized_users
  body: 'Das Werkzeug manage_authorized_users dient der Verwaltung von Depotvollmachten.
    Der Agent nutzt dieses Tool, um Zugriffsrechte für Dritte im Namen des Kontoinhabers
    zu steuern.


    **Parameter:**

    * **account_id:** Die Kennung des Depots, für das die Vollmacht gilt.

    * **vollmacht_aktion:** Festlegung, ob eine Vollmacht erteilt oder ein bestehender
    Zugriff widerrufen werden soll.

    * **personen_details:** Bei Neuerteilung die vollständigen Angaben der bevollmächtigten
    Person (Name, Geburtsdatum, Kontakt).


    **Effekt:**

    Das System aktualisiert die Berechtigungsmatrix des Depots. Die bevollmächtigte
    Person wird im System als autorisierter Nutzer hinterlegt und erhält je nach Konfiguration
    entsprechende Zugriffsrechte.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kranich_invest
- id: 81f42cd2-e02f-50cf-a550-e371bd34f14e
  title: Wann get_accounts eingesetzt wird
  body: 'Das Tool get_accounts ist das fundamentale Einstiegswerkzeug für nahezu alle
    depotbezogenen Aktionen. Es wird eingesetzt, um die interne account_id eines Kunden
    zu finden, da Kunden in der Regel nur ihre Depotnummer oder die letzten vier Ziffern
    davon kennen.


    **Vorgehensweise:**

    1. Die Identität des Kunden verifizieren.

    2. Falls der Kunde eine Depotnummer angibt, diese als Filter verwenden oder die
    letzten vier Ziffern abfragen.

    3. Das Tool get_accounts aufrufen, um eine Liste aller mit dem Kunden verknüpften
    Konten und deren interne account_ids abzurufen.

    4. Die korrekte account_id für den nachfolgenden Prozess (z. B. Handel, Adressänderung
    oder Sparplan) identifizieren.


    Ohne die durch get_accounts ermittelte account_id können keine weiteren zustandsändernden
    Werkzeuge korrekt adressiert werden.'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kranich_invest
- id: e5ccea9a-b650-58b8-aaf3-bae1b5f715bb
  title: Werkzeugreferenz get_accounts
  body: 'Das Werkzeug get_accounts wird vom Agenten verwendet, um alle mit einem Kunden
    verknüpften Konten und Depots sowie deren interne IDs abzurufen. Dies ist ein
    read-only Vorgang.


    **Parameter:**

    * **filter_kriterien:** Optionale Angaben wie die letzten vier Ziffern einer Depotnummer
    oder ein spezifischer Produkttyp, um die Ergebnismenge einzugrenzen.


    **Effekt:**

    Das System gibt eine Liste der verfügbaren Konten zurück, inklusive der jeweiligen
    account_id, des Produkttyps und des aktuellen Status. Diese IDs dienen als Referenz
    für alle weiteren produktbezogenen Tool-Aufrufe.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kranich_invest
- id: a11988ed-73fc-5f71-b722-92747ce3f503
  title: Wann open_account eingesetzt wird
  body: "Dieses Verfahren wird angewendet, wenn ein Neukunde oder ein Bestandskunde\
    \ ein neues Produkt bei Kranich Invest eröffnen möchte.\n\n**Vorgehensweise:**\n\
    1. Die Identität des Antragstellers durch eine vollständige, mehrstufige Verifizierung\
    \ (KYC) prüfen.\n2. Das gewünschte Produkt festlegen. Zur Auswahl stehen:\n  \
    \ * Kranich Depot\n   * ETF-Sparplan\n   * Kranich Kinderdepot\n3. Den Kunden\
    \ über die Konditionen aufklären, insbesondere über die Depotführung von 0 € und\
    \ die Ordergebühren von 1 €.\n4. Das Tool open_account mit den erforderlichen\
    \ persönlichen Daten und der Produktwahl aufrufen.\n5. Den Kunden über den erfolgreichen\
    \ Abschluss und die nächsten Schritte zur Aktivierung informieren.\n\nBei der\
    \ Eröffnung eines Kinderdepots ist besonders auf die gesetzliche Vertretungsberechtigung\
    \ der Elternteile zu achten. Für weitere Details zu den Produkten siehe Kranich\
    \ Depot — Überblick."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kranich_invest
- id: 989dd5e0-3371-5c0f-a9a9-30c8cf862a34
  title: Werkzeugreferenz open_account
  body: 'Das Werkzeug `open_account` dient der Eröffnung eines neuen Kundenkontos
    bei Kranich Invest. Der Agent führt diese Aktion direkt durch den Aufruf des Tools
    aus, ohne den Kunden an externe Formulare oder Portale zu verweisen.


    **Parameter:**

    * **Vollständiger Name**: Der Name des Kunden, wie er in den Ausweisdokumenten
    angegeben ist.

    * **Geburtsdatum**: Das Geburtsdatum des Antragstellers.

    * **Adresse**: Die aktuelle Wohnadresse für die postalische Korrespondenz.

    * **E-Mail-Adresse**: Die primäre E-Mail-Adresse für die digitale Kommunikation
    und Dokumentenzustellung.

    * **Telefonnummer**: Eine verifizierte Kontaktnummer.


    **Auswirkung:**

    Nach erfolgreicher Ausführung wird ein neues Depotkonto erstellt und der Kunde
    in das System integriert. Dies ist die notwendige Voraussetzung, um Produkte wie
    das Kranich Depot oder den ETF-Sparplan zu nutzen. Vor der endgültigen Kontoaktivierung
    erfolgt gemäß unseren Sicherheitsrichtlinien eine mehrstufige Identitätsprüfung.


    Regulatorischer Hinweis: Die Kontoeröffnung erfolgt streng nach den Vorgaben der
    BaFin und MiFID II.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kranich_invest
- id: cdd0e680-d919-5ee6-9732-55c5b2b8b385
  title: Wann close_account eingesetzt wird
  body: "Die Schließung eines Kontos ist ein irreversibler Vorgang. Das Werkzeug `close_account`\
    \ wird eingesetzt, wenn ein Kunde die Geschäftsbeziehung mit Kranich Invest beendet\
    \ und alle damit verbundenen Konten auflösen möchte.\n\n**Vorgehensweise für den\
    \ Agenten:**\n\n1. **Identitätsprüfung**: Führen Sie eine starke Authentifizierung\
    \ durch, um sicherzustellen, dass die Anfrage von der berechtigten Person stammt.\n\
    2. **Kontenidentifikation**: Verwenden Sie das Werkzeug `get_accounts`, um die\
    \ spezifische Konto-ID des Kunden anhand der letzten vier Ziffern der Kontonummer\
    \ oder anderer Referenzdaten zu ermitteln.\n3. **Prüfung der Voraussetzungen**:\
    \ Stellen Sie sicher, dass folgende Bedingungen erfüllt sind:\n    * Das Verrechnungskonto\
    \ weist einen Saldo von 0 € auf.\n    * Es befinden sich keine offenen Wertpapierpositionen\
    \ im Depot.\n    * Alle ausstehenden Orders wurden storniert oder ausgeführt.\n\
    \    * Eventuelle ETF-Sparpläne wurden beendet.\n4. **Kundenbestätigung**: Bestätigen\
    \ Sie dem Kunden explizit, dass die Schließung dauerhaft ist und alle Zugänge\
    \ zum Depot verloren gehen.\n5. **Ausführung**: Rufen Sie das Werkzeug `close_account`\
    \ unter Angabe der ermittelten Konto-ID auf.\n\nSollte das Konto noch Positionen\
    \ enthalten, weisen Sie den Kunden darauf hin, dass diese entweder verkauft oder\
    \ über einen Depotübertrag zu einem anderen Institut transferiert werden müssen.\
    \ Weitere Details zur Kündigung finden Sie im Dokument \"Kranich Depot — kündigen,\
    \ schließen oder den Tarif wechseln\".\n\nRegulatorischer Hinweis: Die Kontoschließung\
    \ erfolgt unter Einhaltung der gesetzlichen Aufbewahrungsfristen für Dokumentationen\
    \ gemäß BaFin-Richtlinien."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kranich_invest
- id: 20c452a8-a064-510a-a9a2-6af4f2d7dcd6
  title: Werkzeugreferenz close_account
  body: 'Das Werkzeug `close_account` wird verwendet, um ein bestehendes Depotkonto
    dauerhaft und irreversibel zu schließen. Der Agent führt diese Aktion direkt aus,
    sofern alle regulatorischen und internen Voraussetzungen für eine Kontoschließung
    erfüllt sind.


    **Parameter:**

    * **Konto-ID**: Der eindeutige systeminterne Identifikator des zu schließenden
    Kontos. Dieser muss zuvor über ein entsprechendes Abfrage-Tool (z. B. `get_accounts`)
    ermittelt werden.


    **Auswirkung:**

    Das Konto wird im System deaktiviert. Ein Zugriff auf das Depot und das Verrechnungskonto
    ist nach der Ausführung nicht mehr möglich. Da dieser Vorgang irreversibel ist,
    ist eine vorherige Verifizierung der Identität sowie die Sicherstellung eines
    Nullsaldos zwingend erforderlich.


    Regulatorischer Hinweis: Alle im Rahmen der MiFID II erforderlichen Aufzeichnungen
    bleiben für die gesetzlich vorgeschriebene Dauer in unserem Archiv erhalten.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kranich_invest
- id: a1cba35f-5945-5c29-92ca-e06a5bfa1326
  title: Wann update_contact_info eingesetzt wird
  body: "Die Aktualisierung von Stammdaten ist ein sicherheitskritischer Vorgang.\
    \ Das Werkzeug `update_contact_info` wird eingesetzt, wenn ein Kunde Änderungen\
    \ an seiner hinterlegten E-Mail-Adresse, Telefonnummer oder Wohnadresse wünscht.\n\
    \n**Vorgehensweise für den Agenten:**\n\n1. **Identitätsprüfung**: Da Änderungen\
    \ an Stammdaten eine zustandsändernde Aktion darstellen, ist eine starke Authentifizierung\
    \ zwingend erforderlich. Verifizieren Sie die Identität des Kunden vollständig.\n\
    2. **Kontenidentifikation**: Nutzen Sie `get_accounts`, um die korrekte Konto-ID\
    \ für den Kunden zu finden.\n3. **Datenerfassung**: Erfragen Sie die neuen Kontaktinformationen\
    \ präzise:\n    * Neue E-Mail-Adresse (inklusive Validierung der Schreibweise).\n\
    \    * Neue Telefonnummer.\n    * Neue Anschrift (Straße, Hausnummer, PLZ, Ort).\n\
    4. **Prüfung**: Gleichen Sie die neuen Daten kurz mit dem Kunden ab, um Übertragungsfehler\
    \ zu vermeiden.\n5. **Ausführung**: Rufen Sie das Werkzeug `update_contact_info`\
    \ mit der Konto-ID und den aktualisierten Werten auf.\n\nNach der Änderung wird\
    \ der Kunde automatisch über die aktualisierten Daten informiert. Für weitere\
    \ Anfragen zur Kontoverwaltung siehe \"Kranich Depot — etwas ändern\".\n\nRegulatorischer\
    \ Hinweis: Die Aktualisierung von Stammdaten erfolgt unter strikter Einhaltung\
    \ der Datenschutz-Grundverordnung (DSGVO) und der internen Compliance-Richtlinien\
    \ von Kranich Invest."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kranich_invest
- id: d73eaed8-d8c3-5494-bc11-443c46d0f1d9
  title: Werkzeugreferenz update_contact_info
  body: 'Das Werkzeug `update_contact_info` dient der Aktualisierung der persönlichen
    Kontaktdaten eines Kunden in unserem System. Der Agent führt diese Änderung direkt
    durch den Aufruf des Tools aus.


    **Parameter:**

    * **Konto-ID**: Der interne Identifikator des Kundenkontos.

    * **Neue E-Mail-Adresse**: Die aktualisierte E-Mail-Adresse für den digitalen
    Kontakt.

    * **Neue Telefonnummer**: Die aktualisierte Telefonnummer.

    * **Neue Adresse**: Die aktualisierte vollständige Anschrift.


    **Auswirkung:**

    Die Stammdaten des Kunden werden in der Datenbank überschrieben. Alle künftigen
    Benachrichtigungen, Kontoauszüge und regulatorischen Dokumente werden an die neuen
    Kontaktdaten versendet. Da dies eine sicherheitsrelevante Änderung ist, muss der
    Aufruf zwingend durch eine erfolgreiche Identitätsprüfung (`verify_identity`)
    preceded werden.


    Regulatorischer Hinweis: Änderungen an Stammdaten werden im Audit-Log systemseitig
    protokolliert.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kranich_invest
- id: 2dffc211-0992-5baa-a3a6-25aa5ea23e94
  title: Wann get_statements eingesetzt wird
  body: "Das Werkzeug `get_statements` wird verwendet, um Depot- und Verrechnungskontoauszüge\
    \ für einen bestimmten Zeitraum für den Kunden bereitzustellen.\n\n**Vorgehensweise\
    \ für den Agenten:**\n\n1. **Identitätsprüfung**: Verifizieren Sie die Identität\
    \ des Kunden, da Kontoauszüge sensible Finanzdaten enthalten.\n2. **Kontenidentifikation**:\
    \ Verwenden Sie `get_accounts`, um die entsprechende Konto-ID zu ermitteln.\n\
    3. **Zeitraumfestlegung**: Klären Sie mit dem Kunden, für welchen Zeitraum die\
    \ Auszüge benötigt werden:\n    * Startdatum (TT.MM.JJJJ).\n    * Enddatum (TT.MM.JJJJ).\n\
    4. **Spezifikation**: Falls gewünscht, lassen Sie den Kunden wählen, ob ein monatlicher,\
    \ quartalsweiser oder jährlicher Auszug benötigt wird.\n5. **Ausführung**: Rufen\
    \ Sie das Werkzeug `get_statements` mit der Konto-ID und dem definierten Zeitraum\
    \ auf.\n\nDie Auszüge werden dem Kunden über den sicheren digitalen Kanal zur\
    \ Verfügung gestellt. Informationen zur Einsicht in den Kontoverlauf finden Sie\
    \ auch unter \"Kranich Depot — Status oder Verlauf einsehen\".\n\nRegulatorischer\
    \ Hinweis: Die Bereitstellung von Kontoauszügen erfolgt gemäß den Transparenzpflichten\
    \ der MiFID II und den BaFin-Vorgaben zur Kostenoffenlegung."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kranich_invest
- id: 9e6372e8-eca5-5098-98ea-b8de840c445f
  title: Werkzeugreferenz get_statements
  body: 'Das Werkzeug `get_statements` ermöglicht den Abruf von offiziellen Konto-
    und Depotauszügen für einen definierten Zeitraum. Der Agent führt diese Aktion
    direkt durch den Tool-Aufruf aus.


    **Parameter:**

    * **Konto-ID**: Der interne Identifikator des Kundenkontos.

    * **Startdatum**: Der Beginn des gewünschten Zeitraums (Format: JJJJ-MM-TT).

    * **Enddatum**: Das Ende des gewünschten Zeitraums (Format: JJJJ-MM-TT).


    **Auswirkung:**

    Das System generiert die entsprechenden Dokumente, die Transaktionen, Bestände
    und anfallende Gebühren (wie die fixen Ordergebühren von 1 €) detailliert auflisten.
    Die Auszüge werden dem Kunden digital über das gesicherte Portal oder per E-Mail
    zugestellt.


    Regulatorischer Hinweis: Diese Dokumente dienen als rechtlich bindender Nachweis
    über die Depotführung und die Kapitalerträge.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kranich_invest
- id: d72b08a5-4b53-54a9-9446-45aba7111438
  title: Wann set_alerts eingesetzt wird
  body: "Das Werkzeug `set_alerts` wird eingesetzt, um Kunden dabei zu unterstützen,\
    \ ihre Investments proaktiv zu überwachen, indem Benachrichtigungen für bestimmte\
    \ Marktereignisse oder Kontostände eingerichtet werden.\n\n**Vorgehensweise für\
    \ den Agenten:**\n\n1. **Identitätsprüfung**: Verifizieren Sie die Identität des\
    \ Kunden.\n2. **Kontenidentifikation**: Nutzen Sie `get_accounts`, um die Konto-ID\
    \ des Kunden zu finden.\n3. **Definition der Alert-Kriterien**: Klären Sie mit\
    \ dem Kunden, welcher Trigger die Benachrichtigung auslösen soll:\n    * **Kurs-Alert**:\
    \ Benachrichtigung, wenn ein Wertpapier einen bestimmten Preis erreicht oder unterschreitet.\n\
    \    * **Saldo-Alert**: Benachrichtigung, wenn das Guthaben auf dem Verrechnungskonto\
    \ einen definierten Schwellenwert unterschreitet.\n    * **Transaktions-Alert**:\
    \ Benachrichtigung bei Ausführung einer Order.\n4. **Festlegung des Schwellenwerts**:\
    \ Erfragen Sie den exakten numerischen Wert (z. B. einen Aktienkurs in € oder\
    \ einen Kontostand).\n5. **Ausführung**: Rufen Sie das Werkzeug `set_alerts` mit\
    \ der Konto-ID, dem Alert-Typ und dem Schwellenwert auf.\n\nInformieren Sie den\
    \ Kunden darüber, dass Alerts edukative Unterstützung bieten, jedoch keine Anlageberatung\
    \ darstellen und keine Rendite garantieren.\n\nRegulatorischer Hinweis: Alerts\
    \ dienen der Information und stellen kein Signal zum Kauf oder Verkauf im Sinne\
    \ einer individuellen Anlageberatung dar."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kranich_invest
- id: e34f1e6c-1ca4-51b3-a001-41cc58a25a04
  title: Werkzeugreferenz set_alerts
  body: 'Das Werkzeug `set_alerts` konfiguriert automatisierte Benachrichtigungen
    für ein Kundenkonto. Der Agent führt diese Einrichtung direkt über den Tool-Aufruf
    aus.


    **Parameter:**

    * **Konto-ID**: Der interne Identifikator des Kundenkontos.

    * **Alert-Typ**: Die Kategorie der Benachrichtigung (z. B. ''price_threshold'',
    ''balance_low'').

    * **Schwellenwert**: Der numerische Wert, der die Benachrichtigung auslöst (z.
    B. ein Kurs in €).


    **Auswirkung:**

    Es wird eine Überwachungsregel im System hinterlegt. Sobald die definierten Bedingungen
    erfüllt sind, erhält der Kunde eine Benachrichtigung über seine bevorzugten digitalen
    Kanäle. Dies hilft Kunden, den langfristigen Vermögensaufbau effizient zu steuern,
    ohne das Depot ständig manuell prüfen zu müssen.


    Regulatorischer Hinweis: Die Einrichtung von Alerts erfolgt im Einklang mit den
    Richtlinien zur Kundenkommunikation.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kranich_invest
- id: 56e296f7-302b-5176-8233-bedc32c6d14d
  title: Wann transfer_funds eingesetzt wird
  body: "Das Werkzeug `transfer_funds` wird eingesetzt, um Geldtransfers vom Verrechnungskonto\
    \ des Kunden auf ein externes Referenzkonto oder zwischen internen Konten durchzuführen.\n\
    \n**Vorgehensweise für den Agenten:**\n\n1. **Identitätsprüfung**: Da es sich\
    \ um eine zustandsändernde Aktion mit finanziellen Auswirkungen handelt, ist eine\
    \ starke Authentifizierung zwingend erforderlich.\n2. **Kontenidentifikation**:\
    \ Verwenden Sie `get_accounts`, um die Konto-ID des Ausgangskontos zu ermitteln.\n\
    3. **Transaktionsdetails**: Erfassen Sie die genauen Angaben zum Transfer:\n \
    \   * **Betrag**: Die exakte Summe in €.\n    * **Ziel-IBAN**: Die IBAN des Empfängerkontos.\n\
    \    * **Verwendungszweck**: Eine kurze Beschreibung der Zahlung.\n4. **Deckungsprüfung**:\
    \ Stellen Sie sicher, dass das Verrechnungskonto über ausreichende liquide Mittel\
    \ verfügt, um den Transfer sowie etwaige anfallende Gebühren zu decken.\n5. **Ausführung**:\
    \ Rufen Sie das Werkzeug `transfer_funds` mit der Konto-ID, dem Betrag und der\
    \ Ziel-IBAN auf.\n\nWeisen Sie den Kunden darauf hin, dass Auszahlungen nur an\
    \ verifizierte Referenzkonten erfolgen, um Betrug vorzubeugen. Details zum allgemeinen\
    \ Konto-Hub finden Sie in \"Kranich Depot — Überblick\".\n\nRegulatorischer Hinweis:\
    \ Alle Geldtransfers unterliegen den Geldwäschegesetzen (GWG) und werden bei entsprechenden\
    \ Schwellenwerten automatisiert geprüft."
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kranich_invest
- id: e3980862-356c-5d7e-8577-e44b1c3d4711
  title: Werkzeugreferenz transfer_funds
  body: 'Das Werkzeug `transfer_funds` wird vom Agenten verwendet, um eine interne
    oder externe Geldübertragung zwischen Konten zu initiieren. Der Agent führt diese
    Aktion direkt durch den Aufruf des Tools aus, ohne den Kunden auf externe Portale
    zu verweisen.


    **Signatur und Parameter:**

    - `source_account_id` (String): Die Identifikationsnummer des Quellkontos, die
    zuvor über `get_accounts` ermittelt wurde.

    - `destination_account_id` (String): Die Identifikationsnummer des Zielkontos
    oder die IBAN des Empfängers.

    - `amount` (Number): Der zu überweisende Betrag (z. B. 100,00).

    - `currency` (String): Die Währung der Transaktion (z. B. "EUR").


    **Effekt:**

    Das Tool löst den Transfer des angegebenen Betrags vom Quellkonto auf das Zielkonto
    aus. Es wird eine Bestätigung über den Erfolg oder das Scheitern der Transaktion
    zurückgegeben. Bevor dieses Werkzeug eingesetzt wird, muss die Identität des Kunden
    zweifelsfrei verifiziert sein und eine starke Authentifizierung für die zustandsändernde
    Aktion vorliegen.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kranich_invest
- id: 73be3bf9-43ac-54be-a281-9d8a1cf76427
  title: Wann cancel_order eingesetzt wird
  body: 'Die Stornierung einer Order ist nur möglich, solange die entsprechende Transaktion
    noch nicht ausgeführt wurde. Sobald eine Order am Markt gefüllt wurde, kann sie
    nicht mehr rückgängig gemacht werden. Der Agent nutzt das Werkzeug `cancel_order`,
    um diesen Prozess im Namen des Kunden abzuschließen.


    **Vorgehensweise zur Orderstornierung:**


    1. **Identitätsprüfung:** Zunächst muss die Identität des Kunden über den vorgesehenen
    Verifizierungsprozess vollständig bestätigt werden.

    2. **Kontoverknüpfung:** Der Agent ruft `get_accounts` auf, um die korrekte `account_id`
    anhand der vom Kunden genannten Kontodaten (z. B. letzte vier Stellen) zu ermitteln.

    3. **Order-Identifikation:** Der Agent fragt den Kunden nach der spezifischen
    Order-Nummer oder nutzt `get_order_status`, um die Liste der offenen Orders zu
    prüfen und die zu stornierende Position eindeutig zu identifizieren.

    4. **Bestätigung der Absicht:** Der Agent informiert den Kunden darüber, dass
    die Stornierung nur bei noch nicht ausgeführten Orders möglich ist und lässt sich
    die Absicht explizit bestätigen.

    5. **Ausführung der Stornierung:** Der Agent ruft das Tool `cancel_order` mit
    der entsprechenden Order-ID und der `account_id` auf.

    6. **Abschluss:** Der Agent bestätigt dem Kunden den Erfolg der Stornierung anhand
    der Systemrückmeldung.


    Sollte eine Order bereits ausgeführt sein, wird das Tool eine Fehlermeldung zurückgeben.
    In diesem Fall muss der Agent den Kunden darüber informieren, dass die Transaktion
    bereits abgeschlossen ist und keine Stornierung mehr erfolgen kann. Weitere Details
    zur Überprüfung des Status finden Sie in der Dokumentation „Wann get_order_status
    eingesetzt wird“.


    *Regulatorischer Hinweis: Alle Transaktionen unterliegen den Richtlinien der BaFin
    und MiFID II. Bitte weisen Sie den Kunden darauf hin, dass durch die Stornierung
    einer Order die Chance auf eine bestimmte Kursausführung entfällt.*'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: kranich_invest
- id: 0ed826c6-8ab9-56f3-9435-018aa5ad1684
  title: Werkzeugreferenz cancel_order
  body: 'Das Werkzeug `cancel_order` dient dazu, eine noch nicht ausgeführte Handelsorder
    (z. B. eine Limit-Order) im Depot des Kunden zu stornieren. Der Agent führt diese
    Aktion direkt durch den Tool-Aufruf aus.


    **Signatur und Parameter:**

    - `order_id` (String): Die eindeutige Kennnummer der zu stornierenden Order.

    - `account_id` (String): Die Identifikationsnummer des betroffenen Kontos, die
    mittels `get_accounts` ermittelt wurde.


    **Effekt:**

    Das System prüft, ob die Order noch im Status „offen“ oder „ausstehend“ ist. Wenn
    dies der Fall ist, wird die Order gelöscht und die reservierten Mittel auf dem
    Verrechnungskonto werden wieder freigegeben. Falls die Order bereits ausgeführt
    wurde, schlägt der Aufruf fehl und gibt eine entsprechende Fehlermeldung zurück.


    Vor der Ausführung ist eine starke Authentifizierung des Kunden zwingend erforderlich,
    da es sich um eine zustandsändernde Aktion handelt.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: kranich_invest
- id: 51f78860-3e72-5d07-b838-a788f929d6e5
  title: Wann get_order_status eingesetzt wird
  body: 'Das Werkzeug `get_order_status` wird eingesetzt, wenn Kunden Informationen
    über den aktuellen Bearbeitungsstand einer Kauf- oder Verkaufsorder benötigen.
    Dies ist insbesondere dann relevant, wenn Orders noch nicht vollständig ausgeführt
    wurden oder der Kunde eine Bestätigung über den Abschluss einer Transaktion wünscht.


    **Vorgehensweise zur Statusabfrage:**


    1. **Identitätsprüfung:** Der Agent stellt sicher, dass die Identität des Kunden
    verifiziert ist.

    2. **Kontoverknüpfung:** Der Agent nutzt `get_accounts`, um die `account_id` des
    Kunden zu validieren und sicherzustellen, dass die Anfrage auf das korrekte Depot
    bezogen ist.

    3. **Abfrage der Order-ID:** Der Agent erfragt vom Kunden die spezifische Order-Nummer.
    Falls diese nicht vorliegt, kann der Agent über andere Positions- oder Kontoabfragen
    helfen, die relevante Order zu finden.

    4. **Tool-Aufruf:** Der Agent ruft `get_order_status` unter Angabe der `order_id`
    auf.

    5. **Information des Kunden:** Der Agent kommuniziert den aktuellen Status (z.
    B. „ausstehend“, „teilweise ausgeführt“ oder „abgeschlossen“) in einer klaren
    und verständlichen Sprache an den Kunden.


    Falls eine Order als „ausstehend“ markiert ist, kann der Agent den Kunden proaktiv
    fragen, ob die Order beibehalten oder storniert werden soll. In letzterem Fall
    wird auf das Verfahren in „Wann cancel_order eingesetzt wird“ verwiesen.


    *Regulatorischer Hinweis: Der Agent muss darauf hinweisen, dass die Ausführung
    von Orders von der Marktliquidität und den Handelszeiten der jeweiligen Börse
    abhängt. Es gibt keine Garantie für einen sofortigen Abschluss zum gewünschten
    Preis.*'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: kranich_invest
- id: afd0c90a-bf90-5de6-9926-a35f30232e95
  title: Werkzeugreferenz get_order_status
  body: 'Das Werkzeug `get_order_status` wird vom Agenten verwendet, um den aktuellen
    Status einer spezifischen Handelsorder abzurufen. Da dies eine reine Leseoperation
    (read-only) ist, erfolgt keine Änderung am Kontozustand.


    **Signatur und Parameter:**

    - `order_id` (String): Die eindeutige Identifikationsnummer der Order, deren Status
    geprüft werden soll.


    **Effekt:**

    Das Tool gibt detaillierte Informationen zur Order zurück, einschließlich des
    aktuellen Zustands (z. B. pending, executed, cancelled), des Zeitpunkts der Erstellung
    und – falls bereits ausgeführt – des tatsächlichen Ausführungspreises und der
    Menge.


    Der Agent nutzt diese Informationen, um den Kunden über den Fortschritt seiner
    Transaktion zu informieren. Eine vorherige Identitätsprüfung des Kunden ist Voraussetzung,
    um den Zugriff auf diese sensiblen Orderdaten zu rechtfertigen.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: kranich_invest
- id: 86cbdceb-520e-53cb-8468-e02fbcbd7b24
  title: Wann deposit_funds eingesetzt wird
  body: 'Die Einzahlung von Geldern auf das Verrechnungskonto ist die Voraussetzung
    für die Durchführung von Wertpapierkäufen. Das Werkzeug `deposit_funds` wird eingesetzt,
    um den Prozess der Kapitalzufuhr vom Referenzkonto des Kunden zu seinem Kranich
    Invest Verrechnungskonto zu initiieren.


    **Vorgehensweise zur Geldeinzahlung:**


    1. **Identitätsprüfung:** Der Agent verifiziert die Identität des Kunden gemäß
    den Sicherheitsrichtlinien.

    2. **Kontenermittlung:** Über den Aufruf von `get_accounts` ermittelt der Agent
    die korrekte `account_id` des Kunden.

    3. **Erfassung der Einzahlungsdetails:** Der Agent fragt den Kunden nach dem gewünschten
    Einzahlungsbetrag und bestätigt die Währung (standardmäßig EUR).

    4. **Prüfung der Herkunft:** Der Agent stellt sicher, dass die Einzahlung von
    einem Konto erfolgt, das auf den Namen des Kunden laut Stammdaten lautet.

    5. **Ausführung der Einzahlung:** Der Agent ruft das Tool `deposit_funds` mit
    der `account_id`, dem Betrag und der Währung auf.

    6. **Bestätigung:** Der Agent informiert den Kunden über die Einleitung des Vorgangs
    und die voraussichtliche Gutschriftzeit auf dem Verrechnungskonto.


    Der Agent weist den Kunden darauf hin, dass Guthaben auf dem Verrechnungskonto
    bis zu einem Betrag von 50.000 € verzinst werden. Für detaillierte Informationen
    zu den Zinsen wird auf „Kranich Depot — Zinsübersicht“ verwiesen.


    *Sicherheitshinweis: Jede Einzahlung unterliegt einer mehrstufigen Sicherheitsprüfung.
    Bei ungewöhnlich hohen Beträgen kann eine zusätzliche Verifizierung durch die
    Compliance-Abteilung erforderlich sein.*'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: kranich_invest
- id: abae6f54-c88b-5e9e-8236-12a7bca0079b
  title: Werkzeugreferenz deposit_funds
  body: 'Das Werkzeug `deposit_funds` wird vom Agenten verwendet, um eine Einzahlung
    von einem externen Referenzkonto auf das Verrechnungskonto des Kunden bei Kranich
    Invest zu veranlassen. Dies ist eine zustandsändernde Aktion.


    **Signatur und Parameter:**

    - `account_id` (String): Die Identifikationsnummer des Kundenkontos, die über
    `get_accounts` ermittelt wurde.

    - `amount` (Number): Der einzuzahlende Betrag (z. B. 500,00).

    - `currency` (String): Die Währung der Einzahlung (z. B. "EUR").


    **Effekt:**

    Das Tool löst den Einzahlungsprozess aus. Je nach gewählter Methode wird entweder
    ein Lastschrifttraeger-Auftrag initiiert oder dem Kunden eine spezifische Referenznummer
    für die Überweisung bereitgestellt. Das System registriert den erwarteten Zahlungseingang
    für das entsprechende Konto.


    Bevor dieser Aufruf erfolgt, muss die Identität des Kunden verifiziert und die
    Aktion durch eine starke Authentifizierung bestätigt worden sein.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: kranich_invest
- id: 1b3a69ab-1010-52cd-99dc-8dd977ed627d
  title: Wann withdraw_funds eingesetzt wird
  body: 'Die Auszahlung von Guthaben vom Verrechnungskonto auf ein externes Referenzkonto
    ist ein kritischer Vorgang. Das Werkzeug `withdraw_funds` wird verwendet, um diesen
    Transfer sicher und regulatorisch konform durchzuführen.


    **Vorgehensweise zur Geldauszahlung:**


    1. **Identitätsprüfung:** Aufgrund der hohen Sicherheitsrelevanz ist eine lückenlose
    Verifizierung der Identität des Kunden sowie eine starke Authentifizierung zwingend
    erforderlich.

    2. **Kontenermittlung:** Der Agent nutzt `get_accounts`, um die `account_id` des
    Kunden zu ermitteln.

    3. **Verifizierung des Referenzkontos:** Der Agent prüft, ob die Auszahlung an
    das hinterlegte Referenzkonto (IBAN) erfolgen soll. Falls eine Änderung des Empfängers
    gewünscht ist, muss zuerst das Verfahren zur Änderung der Stammdaten durchlaufen
    werden.

    4. **Betragsprüfung:** Der Agent fragt den gewünschten Auszahlungsbetrag ab und
    prüft über `get_accounts` (oder die Kontosalden), ob ausreichend verfügbares Guthaben
    vorhanden ist. Es dürfen nur nicht reservierte Mittel (keine offenen Orders) ausgezahlt
    werden.

    5. **Ausführung der Auszahlung:** Der Agent ruft das Tool `withdraw_funds` mit
    der `account_id`, dem Betrag und der Währung auf.

    6. **Abschluss und Hinweis:** Der Agent bestätigt dem Kunden den Auftrag und weist
    darauf hin, dass diese Aktion irreversibel ist.


    Der Agent erinnert den Kunden gegebenenfalls daran, dass nur liquide Mittel ausgezahlt
    werden können und für die Auszahlung von Wertpapieren zunächst ein Verkauf erforderlich
    ist.


    *Sicherheitshinweis: Auszahlungen an Drittkonten sind aus Betrugspräventionsgründen
    grundsätzlich ausgeschlossen. Es erfolgt ausschließlich eine Überweisung auf das
    verifizierte Referenzkonto des Kontoinhabers.*'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: kranich_invest
- id: 0ad3f0d0-2fef-596b-9105-b2db675e316d
  title: Werkzeugreferenz withdraw_funds
  body: 'Das Werkzeug `withdraw_funds` wird vom Agenten verwendet, um eine Auszahlung
    von verfügbarem Guthaben vom Verrechnungskonto des Kunden auf dessen verifiziertes
    Referenzkonto zu initiieren. Diese Aktion ist irreversibel.


    **Signatur und Parameter:**

    - `account_id` (String): Die Identifikationsnummer des Kundenkontos, ermittelt
    über `get_accounts`.

    - `amount` (Number): Der auszuzahlende Betrag (z. B. 250,00).

    - `currency` (String): Die Währung der Auszahlung (z. B. "EUR").


    **Effekt:**

    Das Tool prüft die Verfügbarkeit des Guthabens (abzüglich eventueller Reservierungen
    für offene Orders). Wenn ausreichend Mittel vorhanden sind, wird der Transfer
    an die im System hinterlegte IBAN des Referenzkontos ausgelöst. Der Betrag wird
    sofort vom Verrechnungskonto abgezogen.


    Aufgrund der Risikokategorie dieser Aktion ist eine mehrstufige Sicherheitsprüfung
    und eine explizite starke Authentifizierung des Kunden vor dem Tool-Aufruf obligatorisch.'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: kranich_invest
