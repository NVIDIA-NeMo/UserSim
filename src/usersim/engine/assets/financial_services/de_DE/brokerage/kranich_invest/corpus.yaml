  mentions_tools: []
  institution_id: kranich_invest
- id: ea6013f4-ba64-5370-9b5f-9534715c0530
  title: 'Kranich Depot — verzinster Höchstbetrag auf dem Verrechnungskonto: Erklärung'
  body: 'Hier finden Sie Antworten zur Verzinsung Ihres Verrechnungskontos beim Kranich
    Depot.


    **Bis zu welchem Betrag werden meine Gelder auf dem Verrechnungskonto verzinst?**

    Wir verzinsen das Guthaben auf Ihrem Verrechnungskonto bis zu einem Höchstbetrag
    von 50.000 €.


    **Wie hoch ist der Zinssatz für dieses Guthaben?**

    Der aktuelle Zinssatz beträgt 2,25 % pro Jahr.


    **Was passiert, wenn mein Guthaben die Grenze von 50.000 € überschreitet?**

    Beträge bis einschließlich 50.000 € werden mit dem Zinssatz von 2,25 % verzinst.
    Der Teilbetrag, der über diese Grenze hinausgeht, wird derzeit nicht verzinst.


    **Gibt es eine Mindestlaufzeit, um diese Zinsen zu erhalten?**

    Nein, die Verzinsung erfolgt auf das jeweilige Guthaben ohne eine feste Mindestbindungsfrist.
    Weitere Details zur Zinsberechnung finden Sie im Dokument: Kranich Depot — wie
    Zinsen berechnet und angewendet werden.'
