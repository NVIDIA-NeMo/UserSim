    müssen.


    | Voraussetzung | Ergebnis / Zugangsstufe | Details |

    | :--- | :--- | :--- |

    | Vollständige Identitätsprüfung (KYC) | Basiszugang | Kontoeröffnung möglich,
    Einzahlungen erlaubt. |

    | Erfolgreiche Geeignetheitsprüfung (MiFID II) | Handelszugang | Kauf/Verkauf
