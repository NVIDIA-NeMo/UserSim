- id: 8972ede2-7744-5819-8cd2-6e45615b97b3
  title: ETF-Sparplan — Status oder Verlauf einsehen
  body: 'In dieser Anleitung erfahren Sie, wie Sie den Status Ihrer laufenden Sparpläne
    sowie den historischen Verlauf der Ausführungen einsehen können.


    Bevor Sie beginnen:

    Stellen Sie sicher, dass Sie über einen aktiven Zugang zu Ihrem Konto verfügen
    und Ihre Identität durch die starke Authentifizierung verifiziert wurde.


    Schritte zum Einsehen des Status und Verlaufs:


    1. Fordern Sie eine Übersicht Ihrer aktiven Sparpläne an. Wir bestätigen Ihnen
    daraufhin die Liste aller hinterlegten ETFs, die jeweiligen monatlichen Beträge
    (z. B. 10 € oder höher) sowie die nächsten geplanten Ausführungstermine.

    2. Bitten Sie uns um den Transaktionsverlauf Ihres ETF-Sparplans für einen spezifischen
    Zeitraum. Wir lassen Ihnen eine detaillierte Aufstellung zukommen, aus der hervorgeht,
    welche Beträge zu welchem Datum investiert wurden.

    3. Überprüfen Sie die Ausführungsgebühren in der Aufstellung. Sie werden sehen,
    dass pro Sparplanausführung ein Entgelt von 0 € berechnet wurde.

    4. Vergleichen Sie den Gesamtwert der investierten Beträge mit Ihrem aktuellen
    Depotbestand, um die Entwicklung Ihrer Positionen zu verfolgen.


    So wissen Sie, dass es funktioniert hat:

    Sie haben eine schriftliche Bestätigung oder eine Liste erhalten, die präzise
    die investierten Summen und die Ausführungsdaten enthält. Die Bestätigung der
    kostenfreien Ausführung (0 €) dient als Beleg für die korrekte Anwendung unserer
    Gebührenphilosophie.


    Regulatorischer Hinweis: Bitte beachten Sie, dass die Wertentwicklung von ETFs
    schwankt und keine Rendite garantiert wird.'
