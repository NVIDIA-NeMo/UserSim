- id: 6d5d69d7-c96e-5697-a8ae-f72543aa8036
  title: Kranich Depot — Datenschutz und Datenverarbeitung
  body: 'Kranich Invest verpflichtet sich zur transparenten und rechtskonformen Verarbeitung
    Ihrer personenbezogenen Daten. Im Zusammenhang mit Ihrem Kranich Depot gelten
    insbesondere die Vorgaben der DSGVO sowie die regulatorischen Anforderungen der
    BaFin und MiFID II.


    **Zweck der Datenverarbeitung:**

    * Identitätsprüfung: Zur Eröffnung des Depots ist eine starke Authentifizierung
    und eine verifizierte Identität zwingend erforderlich.

    * Geeignetheits- und Angemessenheitsprüfung: Gemäß MiFID II erheben wir Informationen
    über Ihre Anlageerfahrung und Ihre finanziellen Ziele, um sicherzustellen, dass
    die Produkte für Sie geeignet sind.

    * Steuerliche Abwicklung: Zur korrekten Abführung der Abgeltungsteuer und zur
    Berücksichtigung Ihres Freistellungsauftrags (1.000 € für Einzelpersonen, 2.000
    € für Gemeinschaftsdepots) verarbeiten wir Ihre steuerlichen Stammdaten.


    **Sicherheit und Verwahrung:**

    * Ihre Wertpapiere werden als Sondervermögen verwahrt. Dies bedeutet eine rechtliche
    Trennung vom Institutsvermögen, sodass diese im Insolvenzfall nicht in die Insolvenzmasse
    fallen.

    * Die Sicherheit Ihres Kontos wird durch mehrstufige Sicherheitsprüfungen bei
    jeder zustandsändernden Aktion gewährleistet.


    **Ihre Rechte:**

    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern dem keine gesetzlichen
    Aufbewahrungspf dampen (z. B. durch das Geldwäschegesetz oder steuerrechtliche
    Vorgaben) entgegenstehen.


    Regulatorischer Hinweis: Wir bieten allgemeine Markteinblicke, jedoch keine individuelle
    Steuer- oder Rechtsberatung. Die gesetzliche Anlegerentschädigung deckt 90 % bis
    maximal 20.000 € ab.'
