  title: Kranich Kinderdepot — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Im Vergleich zum regulären Kranich Depot (siehe Kranich Depot — Überblick)
    bietet das Kranich Kinderdepot eine spezialisierte Struktur für den Vermögensaufbau
    von Minderjährigen.


    **Gemeinsamkeiten**

    Beide Produkte folgen unserer Philosophie der Kostentransparenz: Sowohl das reguläre
    Depot als auch das Kinderdepot verzichten mit einer jährlichen Gebühr von 0 €
    auf Depotkosten. Zudem ist das Order-Entgelt in beiden Fällen mit 1 € identisch
