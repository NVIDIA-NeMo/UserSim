- id: 223eed8d-e531-5b19-818d-a4b4afaaa262
  title: Kranich Depot — Status oder Verlauf einsehen
  body: 'In diesem Leitfaden erfahren Sie, wie Sie den aktuellen Status Ihres Depots
    sowie den Verlauf Ihrer Transaktionen einsehen können.


    **Voraussetzungen**

    Um den Verlauf einzusehen, benötigen Sie einen aktiven Zugang zum Kranich Depot
    und eine erfolgreiche starke Authentifizierung Ihres Kontos.


    **Schritte zur Einsicht des Depotstatus und Verlaufs**


    1.  **Bestandsübersicht anfordern:** Geben Sie uns das Signal, dass Sie Ihre aktuelle
    Depotübersicht sehen möchten. Wir stellen Ihnen daraufhin eine detaillierte Liste
    aller gehaltenen Wertpapiere, die aktuellen Kurse und den Gesamtwert Ihres Portfolios
    bereit.

    2.  **Transaktionsverlauf abfragen:** Teilen Sie uns mit, für welchen Zeitraum
    Sie den Verlauf Ihrer Orders einsehen möchten (z. B. „den Verlauf des letzten
    Monats“). Wir lassen Ihnen eine chronologische Aufstellung aller getätigten Käufe
    und Verkäufe zukommen.

    3.  **Einzelstatus einer Order prüfen:** Wenn Sie wissen möchten, ob eine bestimmte
    Order bereits ausgeführt wurde, nennen Sie uns die entsprechende Order-Nummer
    oder das Wertpapier. Wir bestätigen Ihnen den aktuellen Status (z. B. „ausstehend“,
    „ausgeführt“ oder „storniert“).

    4.  **Verrechnungskonto prüfen:** Fragen Sie nach Ihrem aktuellen Kontostand.
    Wir informieren Sie über das verfügbare Guthaben und weisen Sie auf die Verzinsung
    von 2,25 % bis zum Limit von 50.000 € hin.


    **Woran erkenne ich, dass der Vorgang erfolgreich war?**

    Sie erhalten eine schriftliche Bestätigung bzw. eine detaillierte Auflistung Ihrer
    Positionen oder Transaktionen direkt in Ihrem Kommunikationskanal. Die Daten sind
    tagesaktuell und beinhalten alle relevanten Zeitstempel der Ausführung.


    Für Informationen zum Abschluss eines neuen Depots lesen Sie bitte: Kranich Depot
    — abschließen und aktivieren.'
