- id: d69540ea-8835-5b20-9e5d-9bf9b0dcadf6
  title: Kranich Kinderdepot — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn ein Kunde ein Entgelt oder einen Betrag auf dem Verrechnungskonto des
    Kranich Kinderdepots beanstandet, gehen Sie als Support-Agent bitte nach folgendem
    Schema vor:


    **Symptom: „Ich sehe eine Abbuchung, die ich nicht verstehe.“**


    **Prüfungsschritte:**

    1. **Ordergebühren prüfen:** Kontrollieren Sie die letzten Transaktionen. Jede
    Order im Kinderdepot löst eine fixe Gebühr von 1 € aus. Prüfen Sie, ob die Anzahl
    der Abbuchungen mit der Anzahl der ausgeführten Orders übereinstimmt.

    2. **Depotgebühren ausschließen:** Stellen Sie fest, dass die jährliche Depotgebühr
    0 € beträgt. Falls dennoch eine Depotgebühr aufgeführt ist, liegt ein Systemfehler
    vor.

    3. **Steuerliche Abzüge prüfen:** Prüfen Sie, ob Abgeltungsteuer auf realisierte
    Gewinne abgeführt wurde. Weisen Sie den Kunden auf den Sparer-Pauschbetrag hin,
    falls kein Freistellungsauftrag vorliegt.

    4. **Sparplan-Einzüge:** Prüfen Sie, ob ein ETF-Sparplan aktiv ist. Der Mindestbetrag
    liegt bei 10 € pro Monat.


    **Lösung und Eskalation:**

    * **Erklärung:** Wenn es sich um die korrekte Ordergebühr von 1 € handelt, erklären
    Sie dem Kunden die fixe Kostenstruktur unseres Instituts.

    * **Korrektur:** Falls eine Gebühr fälschlicherweise erhoben wurde, leiten Sie
    den Vorgang an die Fachabteilung für Depotführung zur Korrektur weiter.

    * **Komplexität:** Bei Unstimmigkeiten bezüglich steuerlicher Abführungen oder
    Verdacht auf Fehlbuchungen durch Drittsysteme wird die Anfrage an die Fachabteilung
    für Compliance eskaliert.


    Der Kunde erhält nach der Eskalation eine Bestätigung über die Fallnummer und
    eine Information über den erwarteten Bearbeitungszeitraum.


    *Regulatorischer Hinweis: Alle Gebührenkorrekturen erfolgen unter Einhaltung der
    BaFin-Richtlinien und werden transparent dokumentiert.*'
  domain: brokerage_investing
  product_category: kinderdepot
