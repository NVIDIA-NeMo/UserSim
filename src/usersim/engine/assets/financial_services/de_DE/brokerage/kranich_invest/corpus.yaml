- id: a56bb253-6bbc-5f34-96e8-b55b3f63b773
  title: ETF-Sparplan — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Nutzung und Verwaltung
    des ETF-Sparplans bei Kranich Invest. Durch die Einrichtung eines Sparplans erklären
    Sie sich mit den folgenden Bedingungen einverstanden.


    Vertragliche Verpflichtungen

    Kranich Invest verpflichtet sich zur systematischen und präzisen Ausführung der
    von Ihnen definierten Sparraten gemäß den gewählten Intervallen. Der Kunde ist
    verpflichtet, zum Ausführungszeitpunkt eine ausreichende Deckung auf dem zugehörigen
    Verrechnungskonto sicherzustellen.


    Konditionen und Entgelte

    - Mindestbetrag: Die Einrichtung eines ETF-Sparplans ist ab einem Mindestbetrag
    von 10 € pro Sparplanausführung möglich.

    - Ausführungsentgelt: Die Gebühr pro Sparplanausführung beträgt derzeit 0 €.

    - Depotführung: Die Depotführung ist im Rahmen unserer Philosophie der Kostentransparenz
    mit 0 € kostenfrei.


    Änderungen und Kündigung

    Sie können Ihren ETF-Sparplan jederzeit anpassen oder kündigen. Änderungen am
    Sparbetrag oder dem Ausführungsintervall werden nach einer mehrstufigen Sicherheitsprüfung
    wirksam. Eine Kündigung des Sparplans beendet die automatischen Käufe; bestehende
    Positionen verbleiben in Ihrem Depot und unterliegen den allgemeinen Bedingungen
    der Depotführung.


    Regulatorischer Rahmen

    Die Ausführung erfolgt unter strikter Einhaltung der MiFID II-Richtlinien. Wir
    priorisieren die Kostenoffenlegung und führen vor Produktempfehlungen die notwendigen
    Geeignetheits- und Angemessenheitsprüfungen durch.


    Haftung und Sicherheit

    Die Verwahrung Ihrer Wertpapiere erfolgt als Sondervermögen, rechtlich getrennt
    vom Institutsvermögen. Die gesetzliche Anlegerentschädigung deckt 90 % des Betrags
    bis zu einem Maximum von 20.000 € ab.


    Regulatorische Disclaimer: Anlagen in ETFs sind mit Risiken verbunden. Es besteht
    die Möglichkeit eines Kapitalverlusts; eine Rendite wird nicht garantiert.'
