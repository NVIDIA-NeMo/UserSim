- id: f73b6bff-6069-5e40-bb81-7f02f039623c
  title: ETF-Sparplan — Kosten und Entgelte
  body: 'Hier finden Sie Antworten auf die häufigsten Fragen zu den Kosten unseres
    ETF-Sparplans.


    **Wie hoch ist die Gebühr für die Ausführung eines ETF-Sparplans?**

    Die Ausführung eines ETF-Sparplans ist bei uns kostenfrei. Es fällt eine Gebühr
    von 0 € pro Sparplanausführung an.


    **Gibt es einen Mindestbetrag, den ich monatlich investieren muss?**

    Ja, um einen ETF-Sparplan bei uns zu führen, ist ein Mindestbetrag von 10 € pro
    Ausführung erforderlich. Dies ermöglicht uns eine effiziente Abwicklung bei gleichzeitig
    niedrigen Hürden für Ihren Vermögensaufbau.


    **Fallen zusätzliche Depotgebühren an?**

    Nein. Die Depotführung ist bei Kranich Invest grundsätzlich mit 0 € kostenfrei.
    Wir fördern den langfristigen Vermögensaufbau unserer Kunden ohne unnötige Fixkosten.


    Weitere Einzelheiten entnehmen Sie bitte dem Dokument ETF-Sparplan — Überblick.'
