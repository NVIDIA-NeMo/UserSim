- id: a893cd10-3972-5719-a54e-16f9aeda8c65
  title: Kranich Kinderdepot — für wen und wofür geeignet
  body: 'Das Kranich Kinderdepot ist die ideale Lösung für Eltern, Großeltern und
    gesetzliche Vertreter, die bereits in jungen Jahren einen fundierten Vermögensaufbau
    für Kinder realisieren möchten. Es richtet sich an Anleger, die Wert auf eine
    kostengünstige, transparente und sichere Anlageumgebung legen.


    **Warum das Kranich Kinderdepot?**

    Unser Produkt ist darauf ausgelegt, den Zinseszins-Effekt über einen langen Zeitraum
    ohne hohe Kostenbelastungen zu nutzen. Durch den Verzicht auf Depotgebühren bleibt
    das investierte Kapital vollständig im Depot.


    **Die wichtigsten Konditionen im Überblick:**

    * **Depotgebühr:** 0 € pro Jahr – für einen hürdenfreien Start in den Vermögensaufbau.

    * **Ordergebühr:** Fixe 1 € pro Order – unabhängig von der Ordergröße, für maximale
    Planbarkeit.

    * **ETF-Sparplan:** Automatisierter Aufbau bereits ab einem monatlichen Betrag
    von 10 €.

    * **Sicherheit:** Verwahrung Ihrer Wertpapiere als Sondervermögen zur maximalen
    Absicherung.


    **Eignungsszenarien**

    * **Langfristiges Sparen:** Ideal für die Finanzierung der Ausbildung oder den
    Start ins Berufsleben.

    * **Geschenk-Alternative:** Statt kurzlebiger Geschenke bietet das Depot einen
    nachhaltigen Wertzuwachs.

    * **Finanzielle Bildung:** Ein Instrument, um Kindern gemeinsam mit den Eltern
    die Funktionsweise der Finanzmärkte zu erklären.


    **Vergleichbare Optionen**

    Für Anleger, die ein Depot für sich selbst führen möchten, bieten wir das entsprechende
    Standardprodukt an, wie in Kranich Depot — Überblick beschrieben.


    *Regulatorischer Hinweis: Wertpapieranlagen sind mit Risiken verbunden. Es gibt
    keine Garantie für eine positive Rendite; ein Totalverlust ist theoretisch möglich.*'
