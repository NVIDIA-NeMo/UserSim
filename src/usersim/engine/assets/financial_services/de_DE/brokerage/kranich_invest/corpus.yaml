- id: ee5948da-2ca4-5db2-9ef4-caddffb2d695
  title: Kranich Kinderdepot — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit der Vermögenswerte Ihrer Kinder hat bei Kranich Invest oberste
    Priorität. Da Depots für Minderjährige oft über längere Zeiträume bestehen, ist
    ein besonderer Schutz vor unbefugten Zugriffen essenziell.


    **Wichtige Sicherheitsmaßnahmen**


    * **Starke Authentifizierung:** Jede zustandsändernde Aktion, wie etwa die Änderung
    eines Sparplans oder eine Orderausführung, erfordert eine mehrstufige Sicherheitsprüfung
    und eine starke Authentifizierung. Bitte geben Sie Ihre Zugangsdaten niemals an
    Dritte weiter.

    * **Identitätsprüfung:** Änderungen an Stammdaten oder die Auszahlung von Guthaben
    werden nur nach einer verifizierten Identität des gesetzlichen Vertreters durchgeführt.

    * **Phishing-Warnung:** Kranich Invest wird Sie niemals per E-Mail oder SMS auffordern,
    Ihr Passwort oder Ihre TANs auf einer externen Webseite einzugeben. Seien Sie
    skeptisch bei Nachrichten, die eine sofortige Handlung unter Androhung von Kontosperrungen
    fordern.


    **Was wir niemals von Ihnen verlangen**


    Wir fordern Sie niemals auf, Sicherheitsmerkmale per Telefon oder Chat zu nennen
    oder Ihnen einen Zugriff auf Ihr Depot durch einen Dritten zu ermöglichen, um
    „technische Probleme“ zu lösen.


    **Im Verdachtsfall richtig handeln**


    Sollten Sie ungewöhnliche Aktivitäten in Ihrem Kinderdepot bemerken oder den Verdacht
    haben, dass Ihre Zugangsdaten kompromittiert wurden, informieren Sie uns umgehend.
    Eine sofortige Meldung hilft uns, das Konto präventiv zu sperren und einen möglichen
    Vermögensverlust zu verhindern.


    **Regulatorische Absicherung**


    Zur Beruhigung Ihrer langfristigen Planung: Wertpapiere werden bei uns als Sondervermögen
    verwahrt. Das bedeutet, dass sie rechtlich strikt vom Institutsvermögen getrennt
    sind und im Falle einer Insolvenz nicht in die Insolvenzmasse fallen. Darüber
    hinaus ist die Sicherheit durch die gesetzliche Anlegerentschädigung gewährleistet,
    die 90 % des Guthabens bis zu einem Maximalbetrag von 20.000 € abdeckt.


    Weitere Details finden Sie in der Dokumentation Kranich Kinderdepot — rechtliche
    Hinweise.'
