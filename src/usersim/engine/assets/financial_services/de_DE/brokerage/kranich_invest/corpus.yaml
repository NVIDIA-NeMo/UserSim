- id: 8bd84fa6-e27f-50d6-8702-770e286615bf
  title: Kranich Kinderdepot — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie bestehende Einstellungen in Ihrem
    Kranich Kinderdepot anpassen, beispielsweise die Höhe Ihres monatlichen Sparplans.


    **Voraussetzungen**


    Bevor Sie Änderungen vornehmen, stellen Sie sicher, dass Sie als gesetzlicher
    Vertreter authentifiziert sind. Für jede Änderung ist eine starke Authentifizierung
    erforderlich.


    **Schritt-für-Schritt-Anleitung zur Anpassung eines Sparplans**


    1. **Änderungswunsch mitteilen:** Sagen Sie uns, für welchen ETF-Sparplan Sie
    den Betrag ändern möchten und nennen Sie uns den neuen gewünschten Betrag. Beachten
    Sie, dass der Mindestbetrag pro Ausführung 10 € betragen muss.

    2. **Überprüfung:** Wir prüfen die Verfügbarkeit des gewählten Wertpapiers für
    Sparpläne und validieren den neuen Betrag gegenüber der Mindestgrenze von 10 €.

    3. **Bestätigung:** Wir senden Ihnen eine Zusammenfassung der Änderung sowie das
    Datum, ab dem die neue Rate (z. B. 25 € statt 10 €) wirksam wird.

    4. **Authentifizierung:** Bestätigen Sie den Vorgang über Ihr verifiziertes Sicherheitsverfahren
    (z. B. App-Freigabe oder TAN).

    5. **Abschluss:** Wir führen die Änderung im System durch. Sie erhalten eine finale
    Bestätigung per E-Mail.


    **Andere Änderungen**


    * **Stammdaten:** Wenn Sie Adressänderungen oder neue steuerliche Informationen
    melden, fordern wir Sie auf, uns die entsprechenden Nachweise digital zu übermitteln.
    Wir prüfen diese und bestätigen Ihnen die Aktualisierung innerhalb weniger Werktage.

    * **Ordergebühren:** Bitte beachten Sie, dass die fixen Ordergebühren von 1 €
    systemseitig festgelegt sind und nicht individuell angepasst werden können.


    Wenn Sie das Depot vollständig schließen möchten, finden Sie die entsprechenden
    Schritte in Kranich Kinderdepot — kündigen, schließen oder den Tarif wechseln.'
