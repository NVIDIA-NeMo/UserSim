- id: e2bd377a-0854-5856-a869-627de06c9882
  title: 'Kranich Kinderdepot — Entgelt pro Order: Erklärung'
  body: 'Häufige Fragen zum Order-Entgelt beim Kranich Kinderdepot


    **Warum wird ein fixes Entgelt statt einer prozentualen Gebühr erhoben?**

    Wir verfolgen eine Philosophie der Transparenz. Während prozentuale Gebühren oft
    unübersichtlich sind und bei größeren Summen stark ansteigen, machen Fixkosten
    die Ausgaben planbar. Ein Entgelt von 1 € pro Order bleibt unabhängig von der
    Ordergröße gleich, was insbesondere beim langfristigen Vermögensaufbau für Kinder
    fair und kosteneffizient ist.


    **Wie oft wird die Gebühr von 1 € berechnet?**

    Die Gebühr fällt pro ausgeführter Order an. Wenn Sie beispielsweise eine Aktie
    kaufen oder eine Position verkaufen, wird dieser Betrag einmalig von Ihrem Verrechnungskonto
    abgezogen.


    **Gilt dieses Entgelt auch für automatisierte Sparpläne?**

    Ja, die Kostenstruktur bleibt konsistent. Für weitere Details zu den verschiedenen
    Kostenarten verweisen wir auf das Dokument Kranich Kinderdepot — Preis- und Leistungsverzeichnis.'
