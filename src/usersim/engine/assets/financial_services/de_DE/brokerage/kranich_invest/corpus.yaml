- id: 5c3e5ca8-3bc9-5a6e-9220-cd4509e220ee
  title: ETF-Sparplan — wie Zinsen berechnet und angewendet werden
  body: "Im Zusammenhang mit dem ETF-Sparplan ist es wichtig, zwischen der Wertentwicklung\
    \ des ETFs und der Verzinsung Ihres liquiden Kapitals zu unterscheiden.\n\nVerzinsung\
    \ des Verrechnungskontos\nDer ETF-Sparplan selbst ist ein Anlageprodukt und generiert\
    \ keine Zinsen, sondern Partizipationen an Kursgewinnen und Dividenden. Das Guthaben\
    \ auf Ihrem Verrechnungskonto, aus dem die Sparraten (ab 10 €) entnommen werden,\
    \ wird jedoch von uns verzinst. \n\nAnwendung der Zinsen\nDie Zinsen auf das Verrechnungskonto\
    \ werden auf Basis des täglichen Saldos berechnet und in den festgelegten Intervallen\
    \ gutgeschrieben. Diese Verzinsung dient dazu, dass auch Ihr noch nicht investiertes\
    \ Kapital arbeitet.\n\nEinflussfaktoren\nDer Zinssatz auf dem Verrechnungskonto\
    \ gilt für alle Kunden einheitlich bis zu einem bestimmten Höchstbetrag. Über\
    \ die aktuellen Sätze und die genaue Berechnung informieren wir Sie im Dokument\
    \ Kranich Depot — Zinsübersicht.\n\nRegulatorischer Hinweis: Die Verzinsung des\
    \ Verrechnungskontos erfolgt gemäß den allgemeinen Bedingungen des Depots und\
    \ ist von der Performance der im Sparplan gekauften ETFs unabhängig."
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: rate_sheet
  source_authority: official
