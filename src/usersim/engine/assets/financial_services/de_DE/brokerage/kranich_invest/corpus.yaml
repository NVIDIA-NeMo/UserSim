- id: 8916fead-d448-58ae-bb8e-4becea7e5057
  title: Kranich Kinderdepot — erforderliche Unterlagen
  body: 'Um ein Kranich Kinderdepot zu eröffnen, müssen bestimmte Dokumentationsanforderungen
    erfüllt sein. Die Prüfung erfolgt streng nach den Vorgaben der BaFin und MiFID
    II.


    | Erforderliche Unterlage | Zweck der Unterlage | Status |

    | :--- | :--- | :--- |

    | **Geburtsurkunde des Kindes** | Nachweis der Identität und des Verwandtschaftsverhältnisses
    | Zwingend erforderlich |

    | **Gültiger Personalausweis/Reisepass (Eltern/Vertreter)** | Verifizierung der
    Identität des gesetzlichen Vertreters | Zwingend erforderlich |

    | **Steuer-Identifikationsnummer (Kind)** | Abführung der Abgeltungsteuer / steuerliche
    Erfassung | Zwingend erforderlich |

    | **Nachweis der Sorgerechtsberechtigung** | Bestätigung der Handlungsfähigkeit
    des Vertreters | Zwingend erforderlich (bei Alleinsorge oder geteilter Sorge entsprechend
    nachzuweisen) |

    | **Referenzkonto-Nachweis** | Sicherstellung des Geldflusses (Verrechnungskonto)
    | Zwingend erforderlich |


    **Ergebnis der Prüfung:**

    * **Vollständige Unterlagen:** Die Eröffnung des Depots kann unmittelbar nach
    der mehrstufigen Sicherheitsprüfung erfolgen.

    * **Unvollständige Unterlagen:** Der Antrag wird bis zum Nachreichen der fehlenden
    Dokumente ausgesetzt.


    *Regulatorischer Hinweis: Die Identitätsprüfung ist eine gesetzliche Vorgabe zur
    Geldwäscheprävention.*'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 2beceb1b-2da0-583d-9ce7-d04e0cd7afe9
  title: Kranich Kinderdepot — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Beim Vergleich des Kranich Kinderdepots mit typischen Angeboten anderer Institute
    zeigen sich deutliche Vorteile in der Kostenstruktur und Planbarkeit.


    **Kostenvergleich**

    * **Depotführung:** Während viele Wettbewerber jährliche Pauschalgebühren oder
    prozentuale Depotgebühren erheben, ist die Depotführung bei uns mit 0 € dauerhaft
    kostenfrei.

    * **Ordergebühren:** Viele Institute nutzen prozentuale Gebühren, die bei steigenden
    Anlagesummen teurer werden. Kranich Invest setzt auf eine fixe Gebühr von 1 €
    pro Order, was besonders bei regelmäßigen, kleineren Käufen vorteilhaft ist.

    * **Einstiegshürden:** Mit einem Mindestbetrag von 10 € für ETF-Sparpläne liegen
    wir im Marktvergleich an der Spitze der Zugänglichkeit.


    **Struktur und Sicherheit**

    Im Gegensatz zu einfachen Sparkonten bietet das Kinderdepot den Zugang zum Kapitalmarkt.
    Die Sicherheit wird durch die Verwahrung als Sondervermögen und die Anlegerentschädigung
    (90 % bis maximal 20.000 €) garantiert.


    **Welches Produkt passt zu wem?**

    * **Kranich Kinderdepot:** Ideal für Eltern, die eine maximale Kostentransparenz
    suchen und den langfristigen Zinseszins-Effekt ohne Depotgebühren nutzen wollen.

    * **Wettbewerbsangebote:** Können vorteilhaft sein, wenn das Institut spezifische,
    physische Beratungsgespräche in einer Filiale anbietet, was bei unserem digitalen
    Modell nicht vorgesehen ist.


    *Regulatorischer Hinweis: Vergleiche basieren auf marktüblichen Konditionen; individuelle
    Angebote von Drittanbietern können variieren.*'
