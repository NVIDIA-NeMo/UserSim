- id: ab54c1d6-4dd2-578e-a539-69e874435351
  title: Kranich Depot — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Vermögenswerte hat bei Kranich Invest oberste Priorität.
    Um Ihr Kranich Depot optimal zu schützen, bitten wir Sie, die folgenden Sicherheitstipps
    strikt zu beachten:


    * Starke Authentifizierung: Jede zustandsändernde Aktion in Ihrem Depot erfordert
    eine starke Authentifizierung. Nutzen Sie die bereitgestellten Sicherheitsmechanismen
    und geben Sie Ihre Zugangsdaten niemals an Dritte weiter.

    * Verifizierung der Identität: Bevor Änderungen an Ihren Stammdaten oder Transaktionen
    ausgeführt werden, erfolgt eine mehrstufige Sicherheitsprüfung. Seien Sie wachsam
    bei unerwarteten Anfragen zur Identitätsbestätigung.

    * Erkennung von Phishing: Kranich Invest wird Sie niemals per E-Mail oder SMS
    dazu auffordern, Passwörter oder TANs auf einer externen Webseite einzugeben.
    Prüfen Sie die Absenderadresse und den Link sorgfältig.

    * Schutz von Zugangsdaten: Verwenden Sie für Ihren Zugang ein komplexes, einzigartiges
    Passwort und ändern Sie dieses regelmäßig.


    Was wir niemals von Ihnen verlangen:

    * Die Übermittlung Ihres Passworts über den Chat oder per E-Mail.

    * Die Überweisung von Geldern auf Konten, die nicht offiziell als Institutskonto
    von Kranich Invest ausgewiesen sind.

    * Die Installation von Fernwartungssoftware zur "Hilfe bei der Depotverwaltung".


    Sollten Sie eine Unregelmäßigkeit bemerken oder den Verdacht auf einen Betrugsversuch
    haben, informieren Sie uns umgehend. Beschwerden und Betrugsverdacht werden systematisch
    erfasst und innerhalb eines fest definierten Zeitrahmens transparent bearbeitet,
    in Einklang mit den BaFin-Richtlinien.


    Regulatorischer Hinweis: Die Sicherheit Ihrer Wertpapiere wird dadurch gewährleistet,
    dass diese als Sondervermögen verwahrt werden. Zudem besteht die gesetzliche Anlegerentschädigung
    (90 % bis maximal 20.000 €).'
