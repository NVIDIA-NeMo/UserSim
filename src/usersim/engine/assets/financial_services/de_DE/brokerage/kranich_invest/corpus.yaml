- id: 32f572f4-ba1a-5d81-8717-e39d2a6ae095
  title: 'Kranich Kinderdepot — Mindestbetrag pro Sparplanausführung: Erklärung'
  body: '**Was ist der Mindestbetrag für einen ETF-Sparplan im Kinderdepot?**


    Um den Vermögensaufbau für Kinder so niederschwellig wie möglich zu gestalten,
    haben wir den Mindestbetrag pro Sparplanausführung auf 10 € festgelegt. Das bedeutet,
    dass Sie bereits mit einem sehr kleinen monatlichen Betrag starten können, um
    langfristig von den Märkten zu profitieren.


    **Warum gibt es eine Mindestgrenze von 10 €?**


    Diese Grenze stellt sicher, dass die Investments effizient ausgeführt werden können
    und gleichzeitig für fast jeden Haushalt erschwinglich bleiben. Wir möchten den
    langfristigen Vermögensaufbau fördern, ohne unnötige Hürden aufzubauen.


    **Kann ich den Sparbetrag später ändern?**


    Ja, Sie können den Betrag jederzeit anpassen, sofern der neue Betrag weiterhin
    mindestens 10 € beträgt. Details hierzu finden Sie im Dokument Kranich Kinderdepot
    — etwas ändern.'
