  body: 'Sichern Sie die finanzielle Zukunft Ihrer Kinder und teilen Sie diesen Vorteil
    mit Freunden und Familie. Wir freuen uns, Ihnen unser aktuelles Empfehlungsprogramm
    für das Kranich Kinderdepot vorzustellen.


    **Das Angebot:**

    Werden Sie aktiv im Vermögensaufbau für die nächste Generation. Wenn Sie einen
    neuen Kunden erfolgreich für die Eröffnung eines Kranich Kinderdepots werben,
    erhalten Sie eine einmalige Treueprämie in Höhe von 25 €, die direkt auf Ihr Verrechnungskonto
    gutgeschrieben wird.


    **Konditionen des Produkts:**

    Das Kranich Kinderdepot bleibt dabei konsequent kosteneffizient:

    * Depotführung: 0 €

    * Ordergebühren: Fixe 1 € pro Order

    * ETF-Sparpläne: Bereits ab einem Betrag von 10 € pro Monat


    **Gültigkeitszeitraum:**

    Dieses Angebot gilt für Empfehlungen, die im Zeitraum vom 01.11.2023 bis zum 31.01.2024
    ausgesprochen und erfolgreich in einer Depotöffnung resultieren.


    Profitieren Sie von fairen Konditionen und unterstützen Sie andere Eltern dabei,
    einen transparenten Start in die Welt der Investments zu finden.'
