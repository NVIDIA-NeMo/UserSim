- id: aaeac539-5da8-5f09-b80b-40c1c9cf63d4
  title: Kranich Depot — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihr Kranich Depot schließen möchten oder ein anderes Produkt wählen,
    folgen Sie bitte diesen Schritten. Da das Kranich Depot derzeit ein einheitliches
    Preismodell nutzt, entfällt ein Tarifwechsel innerhalb des Produkts; es handelt
    sich primär um den Prozess der Kontoschließung oder den Übertrag der Wertpapiere.


    **Voraussetzungen**

    Bevor Sie den Prozess starten, stellen Sie bitte sicher, dass:

    1. Alle offenen Orders storniert wurden.

    2. Keine ausstehenden Abrechnungen für kürzlich getätigte Transaktionen vorliegen.


    **Schritte zur Schließung oder zum Übertrag**


    1. **Absichtserklärung:** Teilen Sie uns mit, ob Sie das Depot vollständig schließen
    (inklusive Liquidation aller Positionen) oder ob Sie einen Depotübertrag zu einem
    anderen Institut wünschen.

    2. **Übertragdetails (nur bei Übertrag):** Geben Sie uns die genauen Daten des
    Empfängerinstituts und Ihre dortige Depotnummer an. Wir leiten die Übertragung
    Ihrer Wertpapiere ein.

    3. **Auszahlung des Restguthabens:** Wir führen das verbleibende Guthaben Ihres
    Verrechnungskontos auf Ihr hinterlegtes Referenzkonto über. Dabei werden etwaige
    letzte Gebühren (z. B. die letzte Ordergebühr von 1 €, falls zutreffend) verrechnet.

    4. **Abschlussprüfung:** Wir führen eine letzte Prüfung durch, ob noch Forderungen
    bestehen oder steuerliche Meldungen an das Finanzamt ausstehend sind.

    5. **Bestätigung:** Sie erhalten eine schriftliche Bestätigung über die Schließung
    des Depots sowie eine finale Abrechnung.


    **Wichtiger Hinweis:**

    Ein Depotübertrag ist bei Kranich Invest kostenfrei. Bitte beachten Sie, dass
    die Schließung des Depots unwiderruflich ist. Wenn Sie lediglich eine Pause in
    Ihren Investments machen möchten, empfehlen wir, das Depot mit 0 € Gebühren einfach
    ruhen zu lassen.


    Weitere Informationen zu den rechtlichen Rahmenbedingungen finden Sie in Kranich
    Depot — Allgemeine Geschäftsbedingungen.'
