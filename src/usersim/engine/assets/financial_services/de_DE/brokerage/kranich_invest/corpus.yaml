- id: c51d06a6-ac6f-54bb-87e7-47922d0ebcfc
  title: ETF-Sparplan — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass eine geplante Sparplanausführung nicht wie gewünscht
    erfolgt ist. Hier finden Sie die Analyse und die entsprechenden Lösungen.


    **Symptom: Die geplante Investition wurde nicht in Ihrem Depot verbucht.**


    **Mögliche Ursachen und Prüfschritte:**

    1. **Unzureichende Deckung**: Die häufigste Ursache ist ein zu geringes Guthaben
    auf dem Verrechnungskonto zum Zeitpunkt der Ausführung. Prüfen Sie bitte Ihren
    Kontostand.

    2. **Fehlende Verifizierung**: In seltenen Fällen können regulatorische Aktualisierungen
    (z. B. abgelaufene Ausweisdokumente) dazu führen, dass Transaktionen temporär
    gesperrt werden.

    3. **ETF-Handelsstopp**: In Ausnahmefällen kann der ETF-Anbieter den Handel am
    Markt vorübergehend einstellen.


    **Lösungsschritte:**

    * **Bei Unterdeckung**: Überweisen Sie den fehlenden Betrag auf Ihr Verrechnungskonto.
    Sobald die Deckung wiederhergestellt ist, können Sie uns bitten, eine einmalige
    manuelle Nachausführung der fehlenden Rate zu starten.

    * **Bei Verifizierungsproblemen**: Übermitteln Sie uns die geforderten aktualisierten
    Dokumente. Wir führen eine mehrstufige Sicherheitsprüfung durch und geben den
    Sparplan anschließend wieder frei.

    * **Bei Handelsstopps**: In diesem Fall müssen wir warten, bis der ETF-Anbieter
    den Handel wieder freigibt. Wir informieren Sie proaktiv über den Status.


    **Eskalation:**

    Sollte keine der oben genannten Ursachen zutreffen, wird Ihr Anliegen durch unser
    Support-Team an die Fachabteilung für Depotführung weitergeleitet. Wir prüfen
    den Vorgang systematisch und melden uns innerhalb eines definierten Zeitrahmens
    mit einer Lösung bei Ihnen. Beachten Sie hierzu auch die „ETF-Sparplan — rechtliche
    Hinweise“ bezüglich der Ausführungsrichtlinien.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 0529d128-8364-5482-8dae-fa557e99187e
  title: ETF-Sparplan — Voraussetzungen
  body: 'Um einen ETF-Sparplan bei Kranich Invest einrichten zu können, müssen folgende
    Voraussetzungen erfüllt sein:


    | Bedingung | Erforderlicher Status | Ergebnis |

    | :--- | :--- | :--- |

    | **Identitätsprüfung** | Vollständig verifiziert | Berechtigt zur Einrichtung
    |

    | **Depotstatus** | Aktives Wertpapierdepot vorhanden | Berechtigt zur Einrichtung
    |

    | **MiFID II Prüfung** | Geeignetheits- und Angemessenheitsprüfung abgeschlossen
    | Berechtigt zur Auswahl passender ETFs |

    | **Mindestbetrag** | Anlagebetrag $\ge$ 10 € | Sparplan kann aktiviert werden
    |

    | **Verrechnungskonto** | Aktives Konto bei Kranich Invest | Ausführung der Sparrate
    möglich |


    Kunden, die diese Kriterien nicht vollständig erfüllen, können den Sparplan erst
    nach Nachreichung der fehlenden Dokumente oder Abschluss der regulatorischen Prüfungen
    aktivieren.'
