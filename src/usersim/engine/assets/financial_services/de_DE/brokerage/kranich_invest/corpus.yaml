- id: 2248a623-54ca-5fcc-b672-116d15f21dca
  title: ETF-Sparplan — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Anlagen und Ihres Kontos hat bei Kranich Invest oberste
    Priorität. Da Ihr ETF-Sparplan einen automatisierten Geldfluss beinhaltet, ist
    ein besonderer Schutz Ihrer Zugangsdaten essenziell.


    Bitte beachten Sie die folgenden Sicherheitshinweise, um Ihr Depot vor nicht autorisierten
    Zugriffen zu schützen:


    *   Starke Authentifizierung: Nutzen Sie für jede zustandsändernde Aktion – insbesondere
    bei der Änderung Ihres Sparbetrags oder der Bankverbindung – die geforderte starke
    Authentifizierung. Geben Sie MFA-Codes (Multi-Faktor-Authentifizierung) niemals
    an Dritte weiter.

    *   Identitätsschutz: Kranich Invest wird Sie niemals per E-Mail, SMS oder Telefon
    dazu auffordern, Ihr Passwort oder Ihre TANs preiszugeben. Solche Anfragen sind
    immer als Betrugsversuche einzustufen.

    *   Überprüfung von Stammdaten: Achten Sie darauf, dass Änderungen an Ihren Stammdaten
    stets einer mehrstufigen Sicherheitsprüfung unterliegen. Wenn Sie eine Benachrichtigung
    über eine Änderung erhalten, die Sie nicht selbst initiiert haben, informieren
    Sie uns umgehend.

    *   Sicherheit Ihrer Wertpapiere: Wir erinnern Sie daran, dass Ihre ETF-Anteile
    als Sondervermögen verwahrt werden. Das bedeutet, dass diese rechtlich strikt
    vom Institutsvermögen getrennt sind und im Falle einer Insolvenz des Instituts
    nicht in die Insolvenzmasse fallen.

    *   Einlagensicherung: Ihr Verrechnungskonto unterliegt der gesetzlichen Anlegerentschädigung
    von 90 % bis maximal 20.000 €.


    Sollten Sie einen Betrugsverdacht haben oder ungewöhnliche Aktivitäten in Ihrem
    ETF-Sparplan feststellen, melden Sie uns dies bitte unverzüglich. Wir erfassen
    solche Vorfälle systematisch und bearbeiten sie innerhalb eines fest definierten
    Zeitrahmens gemäß den BaFin-Richtlinien.


    Weitere Informationen zum Schutz Ihres Kontos finden Sie in: Kranich Depot — Sicherheitstipps
    für Ihr Konto.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 650d7cc1-7c71-52ef-83cf-5ea029e9d6d7
  title: ETF-Sparplan — Änderung der Bedingungen
  body: 'Die Nutzung des ETF-Sparplans bei Kranich Invest unterliegt den vereinbarten
    Geschäftsbedingungen. Um Transparenz und Fairness zu gewährleisten, legen wir
    die Modalitäten für etwaige Änderungen der Bedingungen wie folgt fest:


    1. Anpassung von Gebühren und Limits

    Kranich Invest behält sich das Recht vor, die Konditionen des ETF-Sparplans anzupassen.
    Dies betrifft insbesondere:

    *   Die aktuelle Ausführungsgebühr von 0 € pro Sparplanausführung.

    *   Den Mindestbetrag pro Sparplan von 10 €.


    2. Benachrichtigungspflicht

    Jede Änderung der Bedingungen wird Ihnen in einer angemessenen Frist vor Inkrafttreten
    schriftlich oder über die hinterlegten digitalen Kommunikationskanäle mitgeteilt.
    Die Benachrichtigung enthält die genaue Beschreibung der Änderung sowie das Datum
    des Inkrafttretens.


    3. Widerspruchsrecht

    Sollten Sie mit den geänderten Bedingungen nicht einverstanden sein, haben Sie
    das Recht, Ihren ETF-Sparplan kostenfrei zu kündigen oder das entsprechende Wertpapierdepot
    zu schließen. Die Kündigung muss vor dem Inkrafttreten der neuen Bedingungen erfolgen.


    4. Regulatorische Anpassungen

    Änderungen, die aufgrund von gesetzlichen Vorgaben (z. B. BaFin, MiFID II) oder
    steuerrechtlichen Neuerungen zwingend erforderlich sind, können ohne die oben
    genannte Widerspruchsfrist umgesetzt werden, sofern dies regulatorisch so vorgegeben
    ist.


    5. Beendigung des Vertragsverhältnisses

    Ein ETF-Sparplan kann jederzeit durch den Kunden oder durch das Institut beendet
    werden. Bei einer Beendigung durch den Kunden entfallen weitere Ausführungen;
    bereits gekaufte Anteile verbleiben in Ihrem Depot als Sondervermögen.


    Für einen detaillierten Überblick über die aktuellen Konditionen verweisen wir
    auf das Dokument ETF-Sparplan — Kosten und Entgelte.'
