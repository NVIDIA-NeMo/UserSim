- id: 4e95fdb1-b0ec-5173-88fc-24275c822464
  title: Kranich Depot — wie Zinsen berechnet und angewendet werden
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Erläuterung
    der Zinsgutschriften auf dem Verrechnungskonto des Kranich Depots.


    **Zinssatz und Geltungsbereich**

    Für das Verrechnungskonto gilt ein einheitlicher Zinssatz von 2,25 % pro Jahr
    (p.a.). Es gibt keine gestaffelten Zinsstufen; dieser Satz gilt für alle Kunden
    gleichermaßen.


    **Zinsdeckel (Cap)**

    Die Verzinsung ist auf einen maximalen Betrag begrenzt. Nur Guthaben bis zu einer
    Höhe von 50.000 € werden verzinst. Beträge, die diesen Schwellenwert überschreiten,
    erhalten keine Zinsen.


    **Berechnung und Gutschrift**

    * **Berechnungsbasis:** Die Zinsen werden auf Basis des täglichen Saldos des Verrechnungskontos
    berechnet.

    * **Anwendung:** Der Zinssatz von 2,25 % wird jährlich angewendet und in den festgelegten
    Zyklen auf das Konto gutgeschrieben.

    * **Änderungen:** Zinsänderungen erfolgen aufgrund von Marktbedingungen oder regulatorischen
    Vorgaben. Kunden werden über etwaige Änderungen des Zinssatzes transparent informiert.


    Bei Fragen zu spezifischen Zinsgutschriften auf dem Konto eines Kunden ziehen
    Sie bitte die Abrechnungsdetails in der Historie heran.'
