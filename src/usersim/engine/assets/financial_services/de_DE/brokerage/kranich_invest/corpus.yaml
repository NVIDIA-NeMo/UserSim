- id: 3be0f7a5-c09e-5fb2-bd80-01632349fb1c
  title: Kranich Kinderdepot — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient dem Support als Leitfaden für die Handhabung von Sonderfällen
    und systemischen Grenzen beim Kranich Kinderdepot.


    **Rechtliche Rahmenbedingungen und Vertretung**

    *   **Gesetzliche Vertretung:** Das Depot wird auf den Namen des Kindes eröffnet,
    verwaltet jedoch primär der gesetzliche Vertreter (in der Regel die Eltern). Alle
    Transaktionen und Stammdatenänderungen erfordern die Verifizierung der Identität
    des Vertreters.

    *   **Volljährigkeit:** Mit Erreichen der Volljährigkeit geht die Verfügungsgewalt
    über das Depot auf das Kind über. In diesem Fall ist eine neue Identitätsprüfung
    und eine Anpassung der Kontostruktur notwendig.


    **Kostenstruktur und Limits**

    *   **Ordergebühren:** Es gilt eine fixe Gebühr von 1 € pro Order. Dies ist unabhängig
    vom Orderwert. Diese Transparenz dient der Planbarkeit für die Eltern.

    *   **Depotgebühren:** Die jährliche Depotführung ist mit 0 € kostenfrei.

    *   **Sparplan-Mindestbetrag:** Für automatisierte Sparpläne gilt ein Mindestbetrag
    von 10 € pro Monat. Beträge unterhalb dieser Grenze können systemisch nicht als
    Sparplan eingerichtet werden.


    **Sonderfälle in der Depotführung**

    *   **Steuerliche Behandlung:** Kapitalerträge im Kinderdepot unterliegen der
    Abgeltungsteuer. Eltern sollten darauf hingewiesen werden, dass für das Kind ein
    eigener Sparer-Pauschbetrag existiert, der über einen entsprechenden Freistellungsauftrag
    geltend gemacht werden kann.

    *   **Sondervermögen:** Wertpapiere werden strikt als Sondervermögen verwahrt,
    was die Sicherheit im Insolvenzfall gewährleistet.


    Bei allgemeinen Fragen zur Produktstruktur verweisen Sie bitte auf das Dokument
    Kranich Kinderdepot — Überblick.'
