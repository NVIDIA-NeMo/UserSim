- id: ffcd1c66-7cd9-5c40-a4d2-3191728f0c89
  title: Kranich Kinderdepot — rechtliche Hinweise
  body: 'Dieses Dokument enthält wichtige regulatorische und rechtliche Informationen
    zum Kranich Kinderdepot. Bitte lesen Sie diese aufmerksam durch.


    **Regulatorischer Rahmen und Compliance**

    Kranich Invest agiert streng nach den Vorgaben der Bundesanstalt für Finanzdienstleistungsaufsicht
    (BaFin) sowie der MiFID II. Wir priorisieren die Kostenoffenlegung sowie die Angemessenheitsprüfung,
    um sicherzustellen, dass unsere Produkte den Bedürfnissen unserer Kunden entsprechen.


    **Sicherheit der Einlagen und Wertpapiere**

    * **Sondervermögen**: Alle Wertpapiere im Kinderdepot werden als Sondervermögen
    verwahrt. Diese sind rechtlich vom Vermögen von Kranich Invest getrennt. Im Falle
    einer Insolvenz des Instituts bleiben die Wertpapiere Eigentum des Kunden und
    fallen nicht in die Insolvenzmasse.

    * **Anlegerentschädigung**: Gemäß den gesetzlichen Bestimmungen sind Guthaben
    auf dem Verrechnungskonto durch die gesetzliche Anlegerentschädigung abgesichert.
    Diese deckt 90 % des Betrages bis zu einem Maximum von 20.000 € ab.


    **Risikohinweise**

    Wir weisen explizit darauf hin, dass Investitionen in Wertpapiere mit einem Verlustrisiko
    verbunden sind. Es gibt keine Garantie für eine positive Rendite; der Wert der
    Anlagen kann sowohl steigen als auch fallen. Die Sicherheit des Kapitals ist nur
    im Rahmen der oben genannten gesetzlichen Absicherungen gegeben.


    **Beratungsgrenzen**

    Kranich Invest bietet edukative Informationen und allgemeine Markteinblicke. Wir
    leisten jedoch ausdrücklich keine individuelle Steuer- oder Rechtsberatung. Wir
    empfehlen, bei komplexen steuerlichen Fragen (z. B. zum Sparer-Pauschbetrag des
    Kindes) einen qualifizierten Steuerberater zu konsultieren.


    **Sicherheitsprüfung**

    Jede zustandsändernde Aktion am Kinderdepot erfordert eine starke Authentifizierung
    und eine verifizierte Identität der gesetzlichen Vertreter. Vor der Ausführung
    von Transaktionen erfolgt eine mehrstufige Sicherheitsprüfung, um Missbrauch zu
    verhindern.'
