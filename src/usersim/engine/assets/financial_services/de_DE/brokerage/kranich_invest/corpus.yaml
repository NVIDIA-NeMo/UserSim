- id: 9bf3e9fc-4d80-55c2-9bd4-a6999be0c72c
  title: Kranich Kinderdepot — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Beim Aufbau eines Vermögens für Ihre Kinder steht die Sicherheit an erster
    Stelle. Das Kranich Kinderdepot ist durch mehrstufige Sicherheitsmechanismen geschützt,
    um nicht autorisierte Zugriffe und Betrugsversuche zu verhindern.


    **Sicherheitsmaßnahmen und Verifizierung**

    Jede zustandsändernde Aktion, wie etwa die Änderung von Stammdaten oder die Ausführung
    von Transaktionen, erfordert eine starke Authentifizierung. Wir führen eine mehrstufige
    Sicherheitsprüfung durch, bevor Änderungen wirksam werden. Dies stellt sicher,
    dass nur die rechtmäßigen gesetzlichen Vertreter Zugriff auf das Depot des Kindes
    haben.


    **Wichtige Warnhinweise zur Betrugsprävention**

    Bitte beachten Sie, dass Kranich Invest folgende Praktiken niemals anwendet:

    * Wir fordern Sie niemals per E-Mail, SMS oder Chat auf, Ihre Passwörter oder
    TANs preiszugeben.

    * Wir verlangen keine unangekündigten Überweisungen auf externe Konten zur „Sicherung“
    des Depots.

    * Wir kontaktieren Sie nicht über soziale Medien, um vertrauliche Kontodaten abzufragen.


    **Vorgehen im Verdachtsfall**

    Sollten Sie eine ungewöhnliche Aktivität in Ihrem Kranich Kinderdepot feststellen
    oder eine verdächtige Nachricht erhalten haben, ist schnelles Handeln entscheidend.
    Informieren Sie uns umgehend über unsere digitalen Kanäle oder telefonisch.


    Beschwerden und Betrugsverdacht werden systematisch erfasst und innerhalb eines
    fest definierten Zeitrahmens transparent bearbeitet. Eine Meldung innerhalb der
    regulatorischen Fristen ist essenziell, um Ihren Schutz optimal zu gewährleisten.
    Wir arbeiten eng mit den BaFin-Richtlinien zusammen, um faire und rechtssichere
    Lösungen zu finden.


    Zur weiteren Information über die allgemeine Absicherung Ihrer Wertpapiere verweisen
    wir auf das Dokument Kranich Kinderdepot — Risikohinweise.


    *Regulatorischer Hinweis: Die Sicherheit Ihrer Einlagen ist durch die gesetzliche
    Anlegerentschädigung (90 % bis maximal 20.000 €) sowie die Verwahrung der Wertpapiere
    als Sondervermögen gewährleistet.*'
