- id: 6bced873-4ab3-5834-9165-af048b764f82
  title: Kranich Kinderdepot — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie ein Kranich Kinderdepot schließen möchten oder eine Änderung der
    Depotstruktur vornehmen wollen, folgen Sie bitte diesen Schritten. Da es sich
    um ein Depot für Minderjährige handelt, muss dieser Prozess zwingend durch den
    gesetzlichen Vertreter eingeleitet werden.


    **Voraussetzungen für die Schließung**

    Bevor Sie die Kündigung beantragen, stellen Sie bitte sicher, dass:

    1. Alle offenen Orders vollständig ausgeführt oder storniert wurden.

    2. Keine ausstehenden Lieferungen von Wertpapieren vorliegen.

    3. Ein gültiges Referenzkonto für die Auszahlung des Restguthabens hinterlegt
    ist.


    **Schritte zur Schließung des Depots**

    1. **Kündigungswunsch äußern:** Teilen Sie uns mit, dass Sie das Kranich Kinderdepot
    schließen möchten. Geben Sie dabei die Depotnummer an.

    2. **Verbleib der Wertpapiere klären:** Entscheiden Sie, ob die vorhandenen Positionen
    verkauft werden sollen (gegen eine Ordergebühr von 1 € pro Position) oder ob ein
    Depotübertrag zu einem anderen Institut erfolgen soll.

    3. **Identitätsprüfung:** Aufgrund der hohen Sicherheitsrelevanz führen wir eine
    mehrstufige Verifizierung Ihrer Identität als gesetzlicher Vertreter durch.

    4. **Abschlussbestätigung:** Wir bestätigen Ihnen die Schließung schriftlich,
    sobald alle Positionen übertragen oder verkauft wurden und das Verrechnungskonto
    ausgeglichen ist.


    **Tarifwechsel**

    Da das Kinderdepot ein spezialisiertes Produkt mit fixen Konditionen (0 € Depotgebühr,
    1 € Ordergebühr) ist, gibt es innerhalb dieses Produkts keine verschiedenen Tarife.
    Sollte das Kind die Volljährigkeit erreichen, erfolgt in Abstimmung mit dem Inhaber
    der Übergang in ein reguläres Depot, wie in Kranich Depot — kündigen, schließen
    oder den Tarif wechseln beschrieben.


    *Regulatorischer Hinweis: Bei einem Depotübertrag können bei Drittinstituten Kosten
    anfallen. Die Sicherheit der Wertpapiere ist durch Sondervermögen gewährleistet.*'
