- id: d00a5352-df9f-55ed-bf94-97cb5bbda284
  title: ETF-Sparplan — Voraussetzungen und Abschluss
  body: 'Hier finden Sie die wichtigsten Informationen zum Start Ihres automatisierten
    Vermögensaufbaus.


    Was sind die Voraussetzungen für den Abschluss eines ETF-Sparplans?

    Um einen ETF-Sparplan einrichten zu können, benötigen Sie ein eröffnetes und verifiziertes
    Wertpapierdepot bei Kranich Invest. Zudem muss die gesetzlich vorgeschriebene
    Geeignetheits- und Angemessenheitsprüfung gemäß MiFID II abgeschlossen sein, damit
    wir sicherstellen können, dass das Produkt zu Ihrem Anlegerprofil passt.


    Wie hoch ist der Mindestbetrag für einen Sparplan?

    Der Einstieg in den automatisierten Vermögensaufbau ist bereits ab einem Betrag
    von 10 € pro Monat möglich.


    Welche Kosten fallen für die Ausführung des Sparplans an?

    Wir fördern den langfristigen Vermögensaufbau unserer Kunden. Daher beträgt das
    Entgelt für die Ausführung eines Sparplans 0 €.


    Wie erfolgt der Abschluss?

    Nachdem Sie den gewünschten ETF ausgewählt und den Betrag (mindestens 10 €) sowie
    das Intervall festgelegt haben, bestätigen Sie den Vorgang über unsere starke
    Authentifizierung.


    Weitere Details entnehmen Sie bitte dem Dokument: ETF-Sparplan — Überblick.'
