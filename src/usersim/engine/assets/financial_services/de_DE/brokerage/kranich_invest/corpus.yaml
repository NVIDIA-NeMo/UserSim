  institution_id: kranich_invest
- id: 21c91bf7-a171-54a6-b325-c86536cd7537
  title: Kranich Kinderdepot — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Der Vermögensaufbau für Kinder ist ein emotionales Thema, das leider oft
    von betrügerischen Akteuren ausgenutzt wird. Wenn Sie Ihr Portfolio mit anderen
    Angeboten vergleichen, sollten Sie besonders auf folgende Warnsignale achten,
    die spezifisch auf Kinderdepots abzielen:


    *   **Versprechen garantierter Renditen:** Seriöse Broker weisen stets auf das
    Verlustrisiko hin. Angebote, die eine „garantierte Gewinnrate“ für das Depot Ihres
    Kindes versprechen, sind fast immer betrügerisch.

    *   **Dringlichkeit und psychologischer Druck:** Betrüger suggerieren oft, dass
    ein „einmaliges Zeitfenster“ für eine besonders günstige Anlagemöglichkeit für
    Kinder schließt, um Sie zu überhasteten Entscheidungen zu bewegen.

    *   **Anfragen nach sensiblen Zugangsdaten:** Kranich Invest wird Sie niemals
    per E-Mail, Chat oder Telefon nach Ihrem Passwort oder Ihren TANs fragen. Jede
    zustandsändernde Aktion erfordert eine starke Authentifizierung durch Sie selbst.

    *   **Unaufgeforderte „Beratungsangebote“:** Seien Sie skeptisch bei Personen,
    die Ihnen ungefragt Tipps für das Kinderdepot geben und dabei die Übertragung
    von Geldern auf externe Konten fordern.


    **Ihre erste Reaktion bei Verdacht:**

    Sollten Sie eine verdächtige Nachricht erhalten oder eine ungewöhnliche Kontobewegung
    feststellen, informieren Sie uns umgehend. Wir erfassen Betrugsverdacht systematisch
    und bearbeiten diesen transparent innerhalb eines definierten Zeitrahmens gemäß
    den BaFin-Richtlinien.


    Um die Sicherheit Ihres Vermögens zu gewährleisten, werden alle Wertpapiere im
    Kranich Kinderdepot als Sondervermögen verwahrt. Dies bedeutet, dass die Anlagen
    rechtlich getrennt vom Institutsvermögen gelten und im Falle einer Insolvenz geschützt
    sind.


    Für weitere allgemeine Sicherheitshinweise lesen Sie bitte das Dokument Kranich
    Kinderdepot — Schutz vor Betrug und nicht autorisierten Vorgängen.'
