- id: c1c4857b-9633-5b0d-84ee-f0ee64fcb61c
  title: ETF-Sparplan — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn sich Ihre finanziellen Ziele ändern oder Sie Ihre Anlagestrategie anpassen
    möchten, können Sie Ihren ETF-Sparplan flexibel verändern oder beenden.


    Ein Sparplan kann entweder angepasst (Tarifwechsel/Betragsänderung) oder vollständig
    gekündigt werden. Bestehende ETF-Anteile bleiben in beiden Fällen in Ihrem Depot
    erhalten.


    Schritte zur Änderung des Sparbetrags (Tarifwechsel)

    1. Teilen Sie uns mit, für welchen ETF-Sparplan Sie den Betrag anpassen möchten
    und nennen Sie den neuen gewünschten Betrag (Mindestbetrag: 10 €).

    2. Wir führen eine Sicherheitsprüfung durch, um Ihre Identität zu verifizieren.

    3. Wir bestätigen Ihnen die Änderung schriftlich oder digital. Die neue Rate wird
    zum nächsten geplanten Ausführungstermin angewendet.


    Schritte zur Kündigung des Sparplans

    1. Teilen Sie uns mit, dass Sie den betreffenden ETF-Sparplan kündigen möchten.
    Bitte geben Sie die entsprechende Produktbezeichnung oder die Plan-ID an.

    2. Wir prüfen Ihre Anfrage und führen die notwendige starke Authentifizierung
    durch.

    3. Sie erhalten eine Bestätigung über die Aufhebung des automatischen Kaufauftrags.
    Ab diesem Zeitpunkt erfolgen keine weiteren Abbuchungen und Käufe mehr für diesen
    Plan.


    Was passiert mit meinen bereits gekauften Anteilen?

    Die Kündigung eines Sparplans bedeutet nicht den Verkauf Ihrer Wertpapiere. Ihre
    bereits erworbenen Anteile bleiben in Ihrem Depot. Möchten Sie diese verkaufen,
    können Sie dies über eine reguläre Verkaufsorder tun, welche gemäß unserer Preisliste
    mit 1 € pro Order berechnet wird.


    Regulatorischer Hinweis: Wir weisen darauf hin, dass eine Änderung der Anlagestrategie
    Auswirkungen auf Ihr Risikoprofil haben kann. Eine individuelle Beratung erfolgt
    gemäß MiFID II-Standards.


    Regulatorische Disclaimer: Wertpapierinvestitionen unterliegen Marktschwankungen
    und können Verluste führen.'
