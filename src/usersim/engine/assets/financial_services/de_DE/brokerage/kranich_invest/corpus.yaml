- id: b43ac5cd-9a4c-550a-b0cd-9cffeb6d5acc
  title: Kranich Kinderdepot — wann sich ein Wechsel oder Upgrade lohnt
  body: "Dieses Dokument unterstützt den Support bei der Beratung von Kunden, die\
    \ über einen Wechsel vom Kinderdepot zu einem anderen Produkt nachdenken.\n\n\
    **Szenario 1: Erreichen der Volljährigkeit**\nWenn das Kind 18 Jahre alt wird,\
    \ ist ein Wechsel in ein reguläres Depot zwingend erforderlich. \n*   **Kranich\
    \ Kinderdepot:** Fokus auf einfache Verwaltung durch Eltern, 0 € Depotgebühr,\
    \ 1 € Ordergebühr.\n*   **Kranich Depot:** Bietet erweiterten Zugriff für den\
    \ nun volljährigen Nutzer. Die Kostenstruktur bleibt mit 0 € Depotgebühr und 1\
    \ € Ordergebühr identisch, wodurch ein nahtloser Übergang ohne finanzielle Nachteile\
    \ möglich ist.\n\n**Szenario 2: Erhöhter Anlagebedarf**\nSollte die Anlagestrategie\
    \ komplexer werden (z. B. Nutzung spezialisierter Finanzprodukte, die über das\
    \ Standard-Kinderdepot hinausgehen), lohnt sich der Blick auf das reguläre Depot.\
    \ Da jedoch beide Produkte die gleiche kosteneffiziente Philosophie verfolgen\
    \ (1 € pro Order, 0 € Depotgebühr), ergibt sich der Vorteil hier primär aus der\
    \ Produktpalette und den Zugriffsrechten.\n\n**Empfehlung**\nEin „Upgrade“ im\
    \ Sinne einer Kostenoptimierung ist nicht notwendig, da das Kinderdepot bereits\
    \ unsere günstigsten Konditionen bietet. Der Wechsel erfolgt primär aus rechtlichen\
    \ Gründen (Volljährigkeit) oder bei Bedarf an komplexeren Instrumenten.\n\nWeitere\
    \ Details zum Vergleich finden Sie in Kranich Depot — im Vergleich zu einem ähnlichen\
    \ Produkt des Hauses."
