- id: 49c8af25-2b95-51f3-90d2-4e871347e558
  title: 'Kranich Depot — Zinssatz auf dem Verrechnungskonto: Erklärung'
  body: 'Häufig gestellte Fragen zur Verzinsung Ihres Guthabens im Kranich Depot:


    **Wie hoch ist die Verzinsung auf meinem Verrechnungskonto?**

    Wir bieten Ihnen eine attraktive Verzinsung von 2,25 % auf das Guthaben Ihres
    Verrechnungskontos. Dies ermöglicht es Ihnen, Ihr nicht investiertes Kapital effizient
    zu nutzen.


    **Gibt es eine Grenze für die Verzinsung?**

    Ja, die Verzinsung von 2,25 % gilt für Guthaben bis zu einem Höchstbetrag von
    50.000 €. Beträge, die diesen Betrag überschreiten, werden derzeit nicht verzinst.


    **Wie wird der Zins gutgeschrieben?**

    Die Zinsen werden regelmäßig auf Ihr Verrechnungskonto gutgeschrieben. Die genauen
    Zeitpunkte und die Berechnungsmethode finden Sie in der Zinsübersicht.


    **Muss ich die Zinsen versteuern?**

    Kapitalerträge unterliegen der Abgeltungsteuer. Sofern Sie uns einen Freistellungsauftrag
    (bis zu 1.000 € für Einzelpersonen) erteilt haben, bleiben die Zinsen bis zu dieser
    Höhe steuerfrei.


    Weitere Details finden Sie in: Kranich Depot — Zinsübersicht.'
  domain: brokerage_investing
  product_category: wertpapierdepot
