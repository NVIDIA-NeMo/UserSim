- id: 6855d3f2-2492-579c-9bc8-05836d8a3668
  title: ETF-Sparplan — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Kunden entscheiden oft zwischen dem automatisierten ETF-Sparplan und dem
    manuellen Kauf von ETF-Anteilen über das Wertpapierdepot. Hier ist der direkte
    Vergleich:


    **ETF-Sparplan**

    * **Ausführung**: Automatisiert in festgelegten Intervallen.

    * **Kosten**: 0 € pro Sparplanausführung.

    * **Einstieg**: Mindestbetrag von 10 €.

    * **Strategie**: Ideal für den langfristigen Vermögensaufbau und zur Nutzung des
    Cost-Average-Effekts.


    **Manuelle Kauforder (über das Depot)**

    * **Ausführung**: Manuell durch den Kunden zu jedem gewünschten Zeitpunkt.

    * **Kosten**: Fixe Gebühr von 1 € pro Order.

    * **Einstieg**: Abhängig vom Kurs des ETFs (kein fixer Mindestbetrag wie beim
    Sparplan).

    * **Strategie**: Ideal für gezielte Einzelinvestitionen oder das Reagieren auf
    spezifische Marktsituationen.


    **Empfehlung:**

    Der ETF-Sparplan ist die bessere Wahl für Anleger, die Disziplin in ihren Investitionszyklus
    bringen wollen und die Kosten auf 0 € senken möchten. Die manuelle Order eignet
    sich eher für erfahrene Anleger, die einzelne Positionen strategisch aufbauen.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 3b40a015-50c7-5d14-b194-c9934cbaa0cb
  title: ETF-Sparplan — rechtliche Hinweise
  body: 'Dieses Dokument enthält wichtige regulatorische Informationen zur Nutzung
    des ETF-Sparplans bei Kranich Invest.


    **Risikohinweis und Rendite**

    Wir weisen ausdrücklich darauf hin, dass Investitionen in ETFs mit einem Verlustrisiko
    verbunden sind. Der Wert der Anlagen kann sowohl steigen als auch fallen; eine Rendite
    wird nicht garantiert. Die vergangene Wertentwicklung ist kein zuverlässiger Indikator
    für zukünftige Ergebnisse.


    **Regulatorische Rahmenbedingungen**

    Kranich Invest agiert streng nach den Vorgaben der BaFin sowie der MiFID II. Im
    Rahmen dieser Richtlinien priorisieren wir die Kostenoffenlegung sowie die Geeignetheits-
    und Angemessenheitsprüfung, um sicherzustellen, dass die gewählten Produkte zu
    Ihrem Anlegerprofil passen.


    **Sicherheit der Vermögenswerte**

    Die über den ETF-Sparplan erworbenen Wertpapiere werden als Sondervermögen verwahrt.
    Dies bedeutet eine rechtliche Trennung vom Institutsvermögen, sodass diese im
    Insolvenzfall nicht in die Insolvenzmasse fallen. Zudem besteht ein Schutz durch
    die gesetzliche Anlegerentschädigung in Höhe von 90 % des betroffenen Betrags,
    maximal jedoch 20.000 €.


    **Beratungsstatus**

    Wir bieten edukative Informationen und allgemeine Markteinblicke an. Bitte beachten
    Sie, dass wir keine individuelle Steuer- oder Rechtsberatung leisten. Wir empfehlen
    Ihnen, bei komplexen steuerlichen Fragen einen qualifizierten Steuerberater zu
    konsultieren.


    **Kostenstruktur**

    Die Gebühr für die Sparplanausführung beträgt 0 €. Wir verpflichten uns zur vollständigen
    Transparenz aller anfallenden Kosten gemäß den MiFID II-Standards. Alle weiteren
    Details entnehmen Sie bitte dem „ETF-Sparplan — Preis- und Leistungsverzeichnis“. '
