- id: 2bfdab67-b12d-5058-b2e3-0157c535f758
  title: Kranich Kinderdepot — Schritt für Schritt starten
  body: 'Dieser Leitfaden dient Support-Mitarbeitern als Referenz, um Kunden bei der
    Eröffnung und dem Start eines Kranich Kinderdepots zu begleiten. Ziel ist ein
    reibungsloser Onboarding-Prozess unter strikter Einhaltung der Compliance-Vorgaben.


    **Phase 1: Identitätsprüfung und Dokumentation**


    Bevor ein Depot eröffnet werden kann, muss eine mehrstufige Sicherheitsprüfung
    erfolgen:

    1. **Gesetzlicher Vertreter:** Durchführung einer vollständigen Identitätsprüfung
    des Elternteils oder Vormunds (KYC-Prozess).

    2. **Kind:** Einreichung und Verifizierung der Geburtsurkunde sowie, sofern vorhanden,
    eines gültigen Ausweisdokuments des Kindes.

    3. **Steuerliche Daten:** Erfassung der Steuer-Identifikationsnummer des Kindes
    zur korrekten Abführung der Abgeltungsteuer.


    **Phase 2: Depoteröffnung**


    Sobald die Dokumente geprüft sind, wird das Depot mit folgenden Konditionen aktiviert:

    * **Depotgebühr:** Die Führung des Depots ist mit 0 € kostenfrei.

    * **Verrechnungskonto:** Eröffnung eines Kontos zur Abwicklung der Transaktionen.


    **Phase 3: Investment-Strategie einrichten**


    Unterstützen Sie den Kunden bei der ersten Bespielung des Depots:

    * **Einzelorders:** Weisen Sie darauf hin, dass jede Order mit einer fixen Gebühr
    von 1 € behaftet ist, unabhängig vom Orderwert.

    * **Sparplan-Einrichtung:** Bei der Einrichtung eines automatisierten ETF-Sparplans
    ist auf den Mindestbetrag von 10 € pro Monat zu achten. Beträge unter dieser Grenze
    können technisch nicht ausgeführt werden.


    **Phase 4: Abschluss und Bestätigung**


    Nach erfolgreicher Einrichtung erhält der Kunde eine schriftliche Bestätigung
    über die Depotführung und die Kostenoffenlegung gemäß MiFID II. Weisen Sie den
    Kunden darauf hin, dass Wertpapiere als Sondervermögen gelten und somit geschützt
    sind.


    Bei komplexen Fragen zur rechtlichen Stellvertretung ist die Anfrage an die Fachabteilung
    für Compliance zu eskalieren.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: product_sheet
  source_authority: official
  placeholder: true
