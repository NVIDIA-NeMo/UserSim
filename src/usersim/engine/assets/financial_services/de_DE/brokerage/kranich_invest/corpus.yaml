  mentions_tools: []
  institution_id: kranich_invest
- id: 5a5c9b8a-93b1-57e2-b740-03417ff46067
  title: Kranich Depot — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden über
    die spezifischen Grenzen und regulatorischen Rahmenbedingungen des Kranich Depot
    aufzuklären.


    **Zinskapitalisierung und Limits**

    Das Verrechnungskonto bietet eine attraktive Verzinsung von 2,25 %. Es ist jedoch
    wichtig, den Kunden transparent zu kommunizieren, dass dieser Zinssatz nur bis
    zu einem Höchstbetrag von 50.000 € gilt. Beträge, die diesen Limit überschreiten,
    werden nicht verzinst. Dies ist ein wesentlicher Punkt bei der Beratung von Kunden
    mit sehr hohen Liquiditätsbeständen auf dem Konto.


    **Gebührenstruktur und Handelsstrategien**

    Kranich Invest setzt auf maximale Planbarkeit. Die Ordergebühr ist mit 1 € pro
    Order fixiert. Dies bietet folgende Implikationen:

    *   **Vorteil für Großorders:** Im Vergleich zu prozentualen Gebühren ist das
    Kranich Depot bei hohen Orderwerten extrem kosteneffizient.

    *   **Herausforderung bei Kleinstbeträgen:** Für Kunden, die sehr häufig Trades
    in extrem geringen Beträgen (z. B. wenige Euro) tätigen, können die fixen 1 €
    prozentual ins Gewicht fallen. Hier sollte auf die langfristige Strategie des
    Vermögensaufbaus hingewiesen werden.


    **Regulatorische Einschränkungen**

    *   **Geeignetheitsprüfung:** Gemäß MiFID II müssen Kunden eine Angemessenheits-
    und Geeignetheitsprüfung durchlaufen. Wenn ein Kunde ein Produkt wählt, das nicht
    zu seinem Risikoprofil passt, kann das System den Vorgang blockieren oder eine
    Warnung ausgeben.

    *   **Sondervermögen:** Wertpapiere werden als Sondervermögen verwahrt. Das bedeutet,
    dass diese rechtlich getrennt vom Institutsvermögen gelten und im Insolvenzfall
    nicht in die Insolvenzmasse fallen.

    *   **Einlagensicherung:** Die gesetzliche Anlegerentschädigung deckt 90 % des
    Betrags bis maximal 20.000 € ab.


    **Sonderfälle bei Depotüberträgen**

    Der Depotübertrag zu Kranich Invest ist kostenfrei. Dennoch kann es je nach ausgebuchendem
    Institut zu Verzögerungen kommen, die außerhalb unseres Einflussbereichs liegen.


    Für detaillierte Preisangaben verweisen Sie bitte auf: Kranich Depot — Preis-
    und Leistungsverzeichnis.'
