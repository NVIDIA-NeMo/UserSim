- id: 0d93fff1-eba5-5499-a0a6-fdfd88c981b5
  title: Kranich Depot — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn Kunden einen Betrag auf ihrem Verrechnungskonto bemerken, den sie nicht
    zuordnen können oder der aus ihrer Sicht „unerwartet“ ist, gehen Sie bitte nach
    folgendem Schema vor:


    **Häufige Symptome**

    * Kunde berichtet von einem Abzug in Höhe von 1 €.

    * Kunde stellt fest, dass Kapitalerträge nicht vollumfänglich gutgeschrieben wurden.

    * Es erscheint ein Betrag, der als Steuerabzug gekennzeichnet ist.


    **Prüfschritte und Lösungen**


    1. **Prüfung auf Ordergebühren:**

    Überprüfen Sie die Historie der Transaktionen. Da jede Order bei uns mit einer
    fixen Gebühr von 1 € belegt wird, resultiert dieser Betrag aus jedem Kauf- oder
    Verkaufsvorgang. Erklären Sie dem Kunden, dass dies die standardmäßige, transparente
    Gebühr ist.


    2. **Prüfung der Steuerabführungen (Abgeltungsteuer):**

    Wenn Beträge fehlen, prüfen Sie, ob Gewinne realisiert wurden. Kranich Invest
    führt die Abgeltungsteuer automatisch ab. Prüfen Sie im Kundenprofil, ob ein gültiger
    Freistellungsauftrag hinterlegt ist.


    3. **Abgleich mit dem Sparer-Pauschbetrag:**

    Prüfen Sie, ob der Kunde seinen Freistellungsauftrag korrekt gestellt hat:

    * Für Einzeldepots: bis zu 1.000 €.

    * Für Gemeinschaftsdepots: bis zu 2.000 €.

    Falls der Betrag überschritten wurde oder kein Auftrag vorliegt, ist der Steuerabzug
    korrekt.


    **Eskalation**

    Falls die Gebühr nicht einer Order (1 €) oder einer steuerlichen Verpflichtung
    zugeordnet werden kann, leiten wir den Fall an die Fachabteilung für Depotführung
    weiter. Der Kunde wird über den Eingang der Prüfung informiert und erhält innerhalb
    des definierten Zeitrahmens eine transparente Antwort.


    Für detaillierte Informationen zu den Steuersätzen und Freibeträgen siehe auch
    Kranich Depot — Allgemeine Geschäftsbedingungen.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: f11e19a5-58b6-56f8-878d-76266438a68b
  title: Kranich Depot — erforderliche Unterlagen
  body: 'Um ein Kranich Depot zu eröffnen, müssen bestimmte Dokumente zur Identitätsprüfung
    und regulatorischen Compliance vorgelegt werden. Die folgende Matrix zeigt die
    erforderlichen Unterlagen und den daraus resultierenden Status:


    | Erforderliche Unterlage | Zweck | Ergebnis bei Vorlage |

    | :--- | :--- | :--- |

    | Gültiges Ausweisdokument (Personalausweis oder Reisepass) | Identitätsnachweis
    & KYC | Identität verifiziert |

    | Aktueller Adressnachweis (z. B. Stromrechnung, Meldebescheinigung) | Wohnsitzbestätigung
    | Adresse bestätigt |

    | Steueridentifikationsnummer (Steuer-ID) | Abführung der Abgeltungsteuer | Steuerstatus
    aktiv |

    | Antwortbogen zur Geeignetheitsprüfung | MiFID II Compliance | Risikoprofil festgelegt
    |


    **Ergebnis:**

    Nur wenn **alle** oben genannten Anforderungen erfüllt sind, erfolgt die finale
    Freischaltung des Depots und die Aktivierung des Verrechnungskontos. Ohne die
    Geeignetheitsprüfung ist der Handel mit Wertpapieren gemäß gesetzlichen Vorgaben
    nicht möglich.'
