- id: 9f4e1411-bf97-554a-8f8c-a96d78c74d43
  title: ETF-Sparplan — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Sollten Sie in Ihren Unterlagen oder in Ihrem Depot einen Betrag oder eine
    Gebühr feststellen, die nicht Ihren Erwartungen entspricht, folgen Sie bitte diesem
    Prüfprozess.


    Symptom: Der Kunde bemerkt eine Abweichung beim abgebuchten Betrag oder sieht
    eine Gebührenbuchung im Zusammenhang mit dem ETF-Sparplan.


    Mögliche Ursachen und Prüfschritte

    1. Prüfung der Ausführungsgebühr: Überprüfen Sie, ob es sich tatsächlich um eine
    Gebühr von Kranich Invest handelt. Da das Entgelt pro Sparplanausführung bei uns
    0 € beträgt, sollten keine Ordergebühren für den Sparplan aufgeführt sein.

    2. Externe Produktkosten: Prüfen Sie, ob die Kosten innerhalb des ETFs selbst
    anfallen (z. B. die Gesamtkostenquote/TER des Fondsanbieters). Diese Kosten werden
    direkt im Fondswert verrechnet und erscheinen nicht als separate Gebührenbuchung
    auf Ihrem Verrechnungskonto.

    3. Mindestbetragsprüfung: Prüfen Sie, ob der abgebuchte Betrag dem von Ihnen festgelegten
    Betrag entspricht. Beachten Sie, dass der Mindestbetrag bei 10 € liegt.

    4. Verrechnungsfehler: Überprüfen Sie, ob eventuelle Steuern (Abgeltungsteuer)
    aus anderen Dividendenerträgen mit der Einzahlung verrechnet wurden.


    Lösungsweg

    Wenn Sie feststellen, dass eine Gebühr fälschlicherweise als Ausführungsentgelt
    gebucht wurde, teilen Sie uns dies bitte mit. Wir gleichen die Transaktion mit
    unseren Systemen ab. Falls ein Fehler vorliegt, wird die Differenz umgehend auf
    Ihr Verrechnungskonto zurückerstattet.


    Eskalation

    Kann das Problem nicht unmittelbar geklärt werden, leiten wir die Anfrage über
    unser Eskalationsmanagement an die Fachabteilung für Depotführung oder Compliance
    weiter. Sie erhalten innerhalb des definierten Zeitrahmens eine transparente Rückmeldung
    über den Status der Untersuchung.


    Regulatorischer Hinweis: Alle Korrekturen erfolgen unter Einhaltung der BaFin-Richtlinien
    und der MiFID II-Kostenoffenlegung.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: troubleshooting
  source_authority: official
