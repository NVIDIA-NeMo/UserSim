- id: f7fc0e93-abea-54b5-af74-367bc3f17e69
  title: Kranich Depot — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugriff auf Ihr Kranich Depot haben, finden
    Sie hier die gängigsten Ursachen und Lösungen. Wir legen Wert auf eine transparente
    und schnelle Fehlerbehebung, um Ihren Handelszugang sicherzustellen.


    **Symptom: Fehlgeschlagener Login / Passwort falsch**

    * Mögliche Ursachen: Tippfehler, Feststelltaste aktiviert oder vergessenes Passwort.

    * Lösung: Überprüfen Sie Ihre Eingabe. Wenn Sie Ihr Passwort vergessen haben,
    fordern Sie über die Funktion "Passwort vergessen" einen neuen Zugang an. Sie
    müssen Ihren Identitätsprozess erneut durchlaufen.


    **Symptom: Probleme mit der starken Authentifizierung (MFA)**

    * Mögliche Ursachen: Veraltete App-Version, fehlende Netzverbindung oder ein neues
    Endgerät ohne Verknüpfung.

    * Lösung: Stellen Sie sicher, dass Sie die aktuellste Version unserer Anwendung
    nutzen. Wenn das Gerät gewechselt wurde, fordern Sie eine neue Geräteverknüpfung
    an. Diese erfordert eine mehrstufige Sicherheitsprüfung zur Verifizierung Ihrer
    Identität.


    **Symptom: Konto ist gesperrt**

    * Mögliche Ursachen: Zu viele Fehlversuche beim Login oder Sicherheitsverdacht
    aufgrund ungewöhnlicher Aktivitäten.

    * Lösung: In diesem Fall ist eine manuelle Überprüfung durch unsere Fachabteilung
    erforderlich. Wir prüfen Ihren Fall und setzen das Konto nach erfolgreicher Identitätsbestätigung
    wieder frei.


    **Wann erfolgt eine Eskalation?**

    Wenn technische Probleme trotz dieser Schritte fortbestehen, leiten wir Ihre Anfrage
    über unser Eskalationsmanagement an die Fachabteilung für Depotführung weiter.
    Sie erhalten innerhalb eines definierten Zeitrahmens eine Rückmeldung über den
    Status der Lösung.


    Regulatorischer Hinweis: Aus Sicherheitsgründen wird bei jedem Login-Problem die
    Identität des Nutzers prioritär geprüft.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: troubleshooting
  source_authority: official
