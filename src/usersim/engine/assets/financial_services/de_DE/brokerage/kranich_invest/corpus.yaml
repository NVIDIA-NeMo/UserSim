- id: 9a3b11ea-8667-536a-ab68-b0c67f35b04a
  title: Kranich Depot — Änderung der Bedingungen
  body: 'Im Rahmen unserer Philosophie der Transparenz und Kosteneffizienz behält
    sich Kranich Invest das Recht vor, die Bedingungen für das Kranich Depot anzupassen.
    Dies betrifft insbesondere die im Preis- und Leistungsverzeichnis festgelegten
    Entgelte sowie die Zinssätze auf dem Verrechnungskonto.


    * Anpassung von Gebühren: Sollte die fixe Ordergebühr von 1 € oder die Depotgebühr
    von 0 € angepasst werden, erfolgt dies unter Einhaltung einer angemessenen Ankündigungsfrist
    per E-Mail oder über das gesicherte Postfach.

    * Zinsänderungen: Der aktuelle Zinssatz von 2,25 % auf dem Verrechnungskonto kann
    je nach Marktlage und regulatorischen Vorgaben angepasst werden. Änderungen treten
    nach einer entsprechenden Mitteilungsfrist in Kraft.

    * Anpassung von Limits: Der maximale verzinste Betrag von 50.000 € kann ebenfalls
    angepasst werden, sofern dies zur Sicherstellung der regulatorischen Compliance
    oder aufgrund strategischer Neuausrichtungen erforderlich ist.


    Ihr Recht bei Änderungen:

    * Informationspflicht: Sie werden über jede wesentliche Änderung der Bedingungen
    transparent informiert.

    * Kündigungsrecht: Im Falle einer für Sie nachteiligen Änderung der Bedingungen
    haben Sie das Recht, Ihr Depot kostenfrei zu schließen oder einen Depotübertrag
    zu einem anderen Institut zu veranlassen.

    * Fristen: Die Kündigungsfrist beträgt in der Regel einen Monat zum Ende des Kalendermonats,
    sofern nicht kürzere Fristen aus regulatorischen Gründen gelten.


    Kranich Invest agiert dabei streng nach den Vorgaben der BaFin sowie MiFID II.
    Wir priorisieren die Kostenoffenlegung, damit Ihre Kosten stets planbar bleiben.


    Regulatorischer Hinweis: Wertpapiere werden als Sondervermögen verwahrt und fallen
    im Insolvenzfall nicht in die Insolvenzmasse des Instituts.'
