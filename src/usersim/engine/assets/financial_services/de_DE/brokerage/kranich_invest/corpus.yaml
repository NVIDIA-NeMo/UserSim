- id: 5819efba-15af-59cf-823e-dfa984182b9f
  title: Kranich Kinderdepot — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kosten beim Aufbau eines Vermögens für Ihr
    Kind.


    **Welche Gebühren fallen für die Führung des Kinderdepots an?**

    Die Depotführung ist bei uns vollständig kostenfrei. Es fallen 0 € an jährlichen
    Depotgebühren an, um den langfristigen Vermögensaufbau Ihres Kindes ohne Hürden
    zu fördern.


    **Wie hoch sind die Kosten für den Kauf oder Verkauf von Wertpapieren?**

    Wir setzen auf maximale Transparenz: Pro Order berechnen wir eine fixe Gebühr
    von 1 €. Es fallen keine prozentualen Gebühren an, sodass die Kosten für Sie unabhängig
    von der Anlagesumme planbar bleiben.


    **Gibt es eine Mindestsumme für einen Sparplan?**

    Ja, Sie können bereits ab einem Betrag von 10 € pro Monat einen automatisierten
    Sparplan einrichten, um kontinuierlich in die Zukunft Ihres Kindes zu investieren.


    Für eine detaillierte Aufstellung aller Kosten sehen Sie bitte im Dokument Kranich
    Kinderdepot — Preis- und Leistungsverzeichnis nach.'
