- id: 6ccbcbf3-4c04-5551-9a7c-c47e74729f4a
  title: Kranich Kinderdepot — Datenschutz und Datenverarbeitung
  body: 'Bei der Führung eines Kranich Kinderdepots verarbeiten wir personenbezogene
    Daten sowohl des gesetzlichen Vertreters als auch des minderjährigen Kontoinhabers.
    Diese Verarbeitung erfolgt streng nach den Vorgaben der DSGVO sowie den Richtlinien
    der BaFin und MiFID II.


    **Umfang der Datenverarbeitung**


    Wir erheben und speichern notwendige Stammdaten wie Namen, Geburtsdaten und Steueridentifikationsnummern.
    Diese Daten sind zwingend erforderlich, um die rechtliche Vertretung zu prüfen
    und die Abgeltungsteuer korrekt abzuführen. Da es sich um Daten von Minderjährigen
    handelt, wenden wir besondere Schutzmaßnahmen an, um eine unbefugte Offenlegung
    zu verhindern.


    **Zweckbindung und Sicherheit**


    Die Daten werden ausschließlich für die Verwaltung des Depots, die Durchführung
    von Orders (gebührenpflichtig mit 1 €) und die gesetzliche Meldepflicht verwendet.
    Eine Weitergabe an Dritte erfolgt nur, wenn dies regulatorisch gefordert ist oder
    für die Verwahrung der Wertpapiere notwendig ist.


    **Sicherheit der Vermögenswerte**


    Wir weisen darauf hin, dass die Sicherheit Ihrer Anlagen nicht nur durch Datenschutz,
    sondern primär durch die rechtliche Struktur gewährleistet wird. Alle Wertpapiere
    im Kinderdepot werden als Sondervermögen geführt. Dies stellt sicher, dass die
    Assets im Insolvenzfall des Instituts nicht in die Insolvenzmasse fallen und somit
    dem Kind zustehen bleiben.


    Zusätzlich greift die gesetzliche Anlegerentschädigung, welche die Einlagen mit
    90 % bis zu einem Maximalbetrag von 20.000 € absichert.


    **Ihre Rechte**


    Sie haben als gesetzlicher Vertreter das Recht auf Auskunft über die gespeicherten
    Daten Ihres Kindes sowie das Recht auf Berichtigung oder Löschung, sofern keine
    gesetzlichen Aufbewahrungsfristen (z. B. steuerrechtliche Fristen) entgegenstehen.


    Für weitere rechtliche Hinweise konsultieren Sie bitte das Dokument Kranich Kinderdepot
    — rechtliche Hinweise.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: disclosure
  source_authority: official
