- id: 262da7c3-8ccd-506e-ab88-6542a5edf732
  title: Kranich Depot — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sicherheit Ihrer Vermögenswerte hat bei Kranich Invest oberste Priorität.
    In einem Marktumfeld, das zunehmend von digitalem Betrug geprägt ist, möchten
    wir Sie über die Sicherheitsmechanismen des Kranich Depots informieren und Sie
    für typische Gefahren sensibilisieren.


    Um Ihre Bestände zu schützen, setzt Kranich Invest auf eine mehrstufige Sicherheitsprüfung.
    Jede zustandsändernde Aktion – insbesondere die Auszahlung von Geldern oder die
    Änderung Ihrer Stammdaten – erfordert eine starke Authentifizierung sowie eine
    verifizierte Identität. Dies stellt sicher, dass nur Sie Zugriff auf Ihr Depot
    haben.


    Bitte beachten Sie die folgenden Sicherheitshinweise:


    * Wir werden Sie niemals per E-Mail, SMS oder Telefon dazu auffordern, Passwörter,
    PINs oder TANs preiszugeben.

    * Kranich Invest wird Sie nicht dazu auffordern, Gelder auf ein fremdes Konto
    zu überweisen, um eine „Sicherheitsprüfung“ durchzuführen oder eine „Gewinnfreischaltung“
    zu aktivieren.

    * Seien Sie skeptisch bei unerwarteten Anrufen von Personen, die behaupten, Mitarbeiter
    unseres Instituts zu sein und Ihnen exklusive Investmentmöglichkeiten anbieten.


    Sollten Sie den Verdacht haben, dass Ihre Zugangsdaten kompromittiert wurden oder
    Sie eine verdächtige Anfrage erhalten haben, ist schnelles Handeln entscheidend.
    Informieren Sie uns umgehend über unsere digitalen Kanäle oder telefonisch. Wir
    werden Ihr Konto sofort prüfen und gegebenenfalls temporäre Sperren einrichten,
    um weitere nicht autorisierte Vorgänge zu verhindern.


    Zur Sicherheit Ihrer Wertpapiere weisen wir darauf hin, dass diese als Sondervermögen
    verwahrt werden. Das bedeutet, dass Ihre Wertpapiere rechtlich streng von unserem
    Institutsvermögen getrennt sind und im Falle einer Insolvenz nicht in die Insolvenzmasse
    fallen. Zusätzlich greift die gesetzliche Anlegerentschädigung, die 90 % des Guthabens
    bis zu einem maximalen Betrag von 20.000 € absichert.


    Für weitere Details zur rechtlichen Absicherung Ihres Vermögens lesen Sie bitte
    auch das Dokument Kranich Depot — Risikohinweise.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: ca00a1f9-7696-5fc0-bee5-5383519c8059
  title: Kranich Depot — Allgemeine Geschäftsbedingungen
  body: 'Die folgenden Bedingungen regeln die Führung und Nutzung des Kranich Depots.
    Diese Vereinbarung basiert auf den regulatorischen Vorgaben der BaFin sowie der
    MiFID II.


    **1. Kostenstruktur und Gebühren**

    Kranich Invest verfolgt eine Philosophie der Transparenz. Für jede ausgeführte
    Order wird eine fixe Gebühr von 1 € erhoben. Im Gegensatz zu vielen Wettbewerbern
    verzichten wir auf prozentuale Gebühren, um die Kosten für den Kunden planbar
    zu gestalten. Die jährliche Depotführung ist mit 0 € kostenfrei.


    **2. Verrechnungskonto und Verzinsung**

    Das mit dem Depot verknüpfte Verrechnungskonto wird verzinst. Es gilt ein Zinssatz
    von 2,25 %, sofern das Guthaben den Betrag von 50.000 € nicht überschreitet. Beträge
    über dieser Grenze werden nicht verzinst. Die Zinsgutschrift erfolgt gemäß den
    internen Zinszyklen.


    **3. Steuerliche Verpflichtungen**

    Kranich Invest führt die anfallende Abgeltungsteuer inklusive Solidaritätszuschlag
    und ggf. Kirchensteuer direkt ab. Kunden können einen Freistellungsauftrag einrichten,
    um den Sparer-Pauschbetrag geltend zu machen (1.000 € für Einzeldepots, 2.000
    € für Gemeinschaftsdepots).


    **4. Pflichten des Instituts und des Kunden**

    Kranich Invest verpflichtet sich zur Einhaltung der Geeignetheits- und Angemessenheitsprüfung
    gemäß MiFID II. Der Kunde ist verpflichtet, alle für diese Prüfungen erforderlichen
    Informationen wahrheitsgemäß und vollständig bereitzustellen. Jede Änderung von
    Stammdaten erfordert eine mehrstufige Sicherheitsprüfung.


    **5. Kündigung und Beendigung**

    Beide Parteien können das Depotverhältnis unter Einhaltung der gesetzlichen Fristen
    kündigen. Im Falle einer Kündigung werden alle offenen Positionen entweder liquidiert
    oder im Rahmen eines Depotübertrags an ein anderes Institut übertragen. Eine finale
    Abrechnung erfolgt nach Abschluss aller ausstehenden Transaktionen.


    Für detaillierte Informationen zur Kostenstruktur verweisen wir auf das Dokument
    Kranich Depot — Preis- und Leistungsverzeichnis.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 607661a3-271c-512f-9367-294ee996d450
  title: Kranich Depot — für wen und wofür geeignet
  body: 'Das Kranich Depot ist als zentraler Investment-Hub konzipiert und richtet
    sich an private Anleger, die eine kosteneffiziente, transparente und sichere Möglichkeit
    suchen, ihr Vermögen langfristig aufzubauen. Es ist insbesondere für Anleger geeignet,
    die eine einfache Struktur ohne versteckte Kosten bevorzugen.


    **Zielgruppen**

    * **Einsteiger:** Personen, die mit dem Investieren beginnen möchten und eine
    niedrige Eintrittshürde suchen.

    * **Langfristige Anleger:** Personen, die durch den Verzicht auf Depotgebühren
    (0 €) ihre Rendite optimieren wollen.

    * **Kostenbewusste Trader:** Anleger, die durch die fixen Ordergebühren von 1
    € unabhängig von der Handelsvolumengröße genau planen können, welche Kosten anfallen.


    **Wofür ist das Produkt geeignet?**

    Das Depot eignet sich hervorragend für den Aufbau eines diversifizierten Portfolios
    aus Aktien und ETFs. Da wir den langfristigen Vermögensaufbau fördern, bietet
    das Depot eine attraktive Verzinsung des Verrechnungskontos von 2,25 % für Guthaben
    bis zu 50.000 €, sodass auch nicht investiertes Kapital produktiv genutzt wird.


    **Die wichtigsten Vorteile auf einen Blick:**

    * **Kosteneffizienz:** Keine jährlichen Depotgebühren (0 €) und eine fixe Gebühr
    von nur 1 € pro Order.

    * **Sicherheit:** Verwahrung der Wertpapiere als Sondervermögen und strikte Einhaltung
    der BaFin- und MiFID II-Richtlinien.

    * **Transparenz:** Klare Kostenstruktur ohne prozentuale Aufschläge.


    **Wichtige Voraussetzungen:**

    Für die Eröffnung ist eine erfolgreiche Identitätsprüfung sowie die Durchführung
    einer Geeignetheits- und Angemessenheitsprüfung erforderlich, um sicherzustellen,
    dass die gewählten Finanzinstrumente zu Ihrem Risikoprofil passen.


    Weitere Details zum Startvorgang finden Sie in Kranich Depot — abschließen und
    aktivieren.'
