- id: dfbaa92c-7098-5688-aca1-21fae0e2f4b7
  title: 'Kranich Depot — Depotgebühr pro Jahr: Erklärung'
  body: '**Gibt es bei Kranich Invest eine jährliche Depotgebühr?**

    Nein. Die Depotführung für das Kranich Depot ist mit 0 € dauerhaft kostenfrei.
    Wir verzichten bewusst auf diese Gebühren, da wir den langfristigen Vermögensaufbau
    unserer Kunden fördern möchten, ohne dass unnötige Fixkosten die Rendite schmälern.


    **Bedeutet das, dass die Kontoführung komplett kostenlos ist?**

    Die reine Depotführung ist kostenfrei (0 €). Bitte beachten Sie jedoch, dass für
    die Ausführung von Kauf- und Verkaufsaufträgen eine fixe Ordergebühr von 1 € pro
    Transaktion anfällt. Diese ist jedoch unabhängig von der Summe des gehandelten
    Wertpapiers, was Ihnen eine präzise Kostenplanung ermöglicht.


    Für eine vollständige Übersicht aller Kosten schauen Sie bitte in das Dokument
    Kranich Depot — Preis- und Leistungsverzeichnis.'
