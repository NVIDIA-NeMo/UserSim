- id: 03bde2ea-b4a0-50ce-8c37-37394f245fb7
  title: Kranich Depot — wann sich ein Wechsel oder Upgrade lohnt
  body: "Dieses Dokument unterstützt Support-Mitarbeiter dabei, Kunden zu bewerten,\
    \ für wen das Kranich Depot die optimale Wahl ist und wann ein Wechsel sinnvoll\
    \ ist.\n\n**Vergleich der Kostenstruktur**\nDas entscheidende Merkmal des Kranich\
    \ Depot ist die fixe Ordergebühr von 1 € und die Depotgebühr von 0 €.\n\n*   **Wann\
    \ der Wechsel zu uns lohnt:**\n    *   **Hohe Orderwerte:** Wenn ein Kunde bei\
    \ anderen Brokern prozentuale Gebühren zahlt (z. B. 0,25 % bei einer 10.000 €\
    \ Order wären das 25 €), spart er beim Kranich Depot massiv, da die Kosten bei\
    \ 1 € bleiben.\n    *   **Langfristige Anlage:** Da die Depotführung mit 0 € dauerhaft\
    \ kostenfrei ist, eignet sich das Produkt ideal für den langfristigen Vermögensaufbau\
    \ ohne laufende Fixkosten.\n    *   **Liquiditätshalter:** Mit einer Verzinsung\
    \ von 2,25 % auf das Verrechnungskonto (bis 50.000 €) ist das Depot attraktiver\
    \ als viele klassische Bankdepots mit 0 % Zinsen.\n\n*   **Wann es weniger attraktiv\
    \ ist:**\n    *   **Extrem kleine Einzeltrades:** Kunden, die täglich Trades im\
    \ Bereich von 5 € bis 20 € tätigen, zahlen bei uns prozentual relativ hohe Gebühren\
    \ (1 € bei einem 10 € Trade sind 10 %). In diesem speziellen Fall könnten Pauschalmodelle\
    \ anderer Anbieter vorteilhafter sein.\n\n**Empfehlung**\nDas Kranich Depot ist\
    \ die erste Wahl für preisbewusste Anleger, die Sicherheit (Sondervermögen) mit\
    \ minimalen, planbaren Kosten kombinieren wollen."
