  body: 'Starten Sie Ihren Vermögensaufbau mit einem starken Netzwerk. Bei Kranich
    Invest möchten wir, dass fairer Vermögensaufbau für jeden zugänglich ist. Deshalb
    bieten wir Ihnen und Ihren Empfohlenen attraktive Konditionen für den Einstieg
    in die Welt der ETFs.


    Profitieren Sie von unserem Treueangebot für den ETF-Sparplan:


    *   Ausführungsgebühr: 0 € pro Sparplan

    *   Niedrige Einstiegshürde: Bereits ab einem Betrag von 10 € pro Monat


    Dieses Angebot gilt für alle Neukunden sowie für Bestandskunden, die ihren ersten
    Sparplan aktivieren. Wir verzichten bewusst auf prozentuale Kosten, um Ihren langfristigen
    Erfolg zu fördern. Nutzen Sie die Chance, systematisch und kosteneffizient in
