- id: ad2b50fd-1060-5241-a8e3-ddc4aa707318
  title: Kranich Kinderdepot — Probleme mit Zugang oder Login
  body: "Wenn Sie Schwierigkeiten haben, auf das Kranich Kinderdepot zuzugreifen,\
    \ liegt dies meist an Sicherheitsmechanismen, die den Schutz des minderjährigen\
    \ Kontoinhabers gewährleisten sollen.\n\n**Symptom: Login fehlgeschlagen oder\
    \ Zugriff verweigert**\n\n**Mögliche Ursachen:**\n* Falsche Eingabe der Zugangsdaten.\n\
    * Abgelaufene oder nicht synchronisierte starke Authentifizierung (MFA).\n* Sicherheitsperre\
    \ aufgrund mehrerer Fehlversuche.\n* Fehlende oder abgelaufene Identitätsnachweise\
    \ des gesetzlichen Vertreters.\n\n**Lösungsschritte in der richtigen Reihenfolge:**\n\
    \n1. **Zugangsdaten prüfen:** Überprüfen Sie die korrekte Schreibweise Ihrer E-Mail-Adresse\
    \ und Ihres Passworts. Achten Sie auf Groß- und Kleinschreibung.\n2. **Authentifizierungsgerät\
    \ prüfen:** Stellen Sie sicher, dass Ihr für die starke Authentifizierung hinterlegtes\
    \ Gerät aktiv und mit dem Internet verbunden ist.\n3. **Passwort-Reset:** Falls\
    \ das Passwort vergessen wurde, fordern Sie eine neue Setzmöglichkeit an. Sie\
    \ erhalten einen Verifizierungslink per E-Mail.\n4. **Identitäts-Check:** Prüfen\
    \ Sie, ob wir Sie kürzlich aufgefordert haben, Ihre Identität erneut zu bestätigen\
    \ (z. B. aufgrund regulatorischer Aktualisierungen der BaFin).\n\n**Wann eine\
    \ Eskalation notwendig ist**\n\nSollten die oben genannten Schritte nicht zum\
    \ Erfolg führen, wird der Fall durch uns an die Fachabteilung für Depotführung\
    \ eskaliert. \n\n**Was dann passiert:**\n* Wir prüfen manuell den Status Ihres\
    \ Benutzerkontos und die Verknüpfung zum Kinderdepot.\n* Falls eine Sicherheitsperre\
    \ vorliegt, fordern wir Sie zur erneuten Durchführung einer Identitätsprüfung\
    \ auf.\n* Wir informieren Sie innerhalb von zwei Werktagen über die Lösung oder\
    \ die erforderlichen nächsten Schritte.\n\nFür allgemeine Fragen zu den Depotkonditionen,\
    \ wie der Depotgebühr von 0 €, können Sie jederzeit die Dokumentation Kranich\
    \ Kinderdepot — Überblick konsultieren."
