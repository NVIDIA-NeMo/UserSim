  title: Kranich Kinderdepot — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Führung und Verwaltung
    des Kranich Kinderdepots. Die Vereinbarung basiert auf den Grundsätzen der Transparenz
    und Kosteneffizienz.


    **Gebühren und Entgelte**

    * **Depotführung:** Die jährliche Depotgebühr beträgt 0 €. Wir fördern damit den
    langfristigen Vermögensaufbau der nächsten Generation ohne unnötige Hürden.

    * **Transaktionskosten:** Für jede Order wird eine fixe Gebühr von 1 € erhoben.
    Prozentuale Gebühren werden nicht angewendet, um die Kosten planbar zu gestalten.

    * **Sparpläne:** Die Ausführung automatisierter Sparpläne ist ab einem Mindestbetrag
    von 10 € pro Monat möglich.


    **Pflichten und Rechte**

    Der gesetzliche Vertreter ist verpflichtet, bei der Eröffnung und während der
    Laufzeit eine verifizierte Identität nachzuweisen. Jede Änderung der Stammdaten
    unterliegt einer mehrstufigen Sicherheitsprüfung. Kranich Invest verpflichtet
    sich zur Einhaltung der BaFin-Vorgaben sowie der MiFID II-Richtlinien, insbesondere
    im Hinblick auf die Kostenoffenlegung und die Geeignetheitsprüfung.


    **Laufzeit und Kündigung**

    Das Depot kann durch den gesetzlichen Vertreter jederzeit gekündigt werden. Die
    Abwicklung erfolgt nach Abschluss aller ausstehenden Transaktionen. Die Verrechnung
    von Restbeträgen erfolgt auf das hinterlegte Verrechnungskonto.


    **Haftung und Entschädigung**

    Wertpapiere werden als Sondervermögen verwahrt und sind somit rechtlich vom Institutsvermögen
    getrennt. Im Falle einer Insolvenz fallen diese nicht in die Insolvenzmasse. Die
    gesetzliche Anlegerentschädigung greift im entsprechenden Rahmen bis zu einem
    Betrag von 20.000 € (Deckung von 90 %).


    *Regulatorischer Hinweis: Diese Bedingungen unterliegen den Richtlinien der BaFin
    und MiFID II. Es erfolgt keine individuelle Steuer- oder Rechtsberatung.*'
