- id: f7e3e9fe-a5fe-5f83-94f2-a0440a70919f
  title: ETF-Sparplan — wann sich ein Wechsel oder Upgrade lohnt
  body: "Dieses Dokument unterstützt Support-Mitarbeiter dabei, Kunden zu beraten,\
    \ ob ein ETF-Sparplan die bessere Wahl gegenüber manuellen Einzelkäufen ist.\n\
    \nVergleich: ETF-Sparplan vs. Manuelle Order\n\n* Kosten:\n  - ETF-Sparplan: Die\
    \ Ausführung ist mit 0 € komplett kostenfrei.\n  - Manuelle Order: Jede Einzelorder\
    \ wird mit einem fixen Betrag von 1 € belastet.\n* Automatisierung:\n  - ETF-Sparplan:\
    \ Automatisiertes Investment ab 10 € pro Monat, fördert die Disziplin beim langfristigen\
    \ Vermögensaufbau.\n  - Manuelle Order: Erfordert manuelle Ausführung jeder Transaktion.\n\
    * Betrag:\n  - ETF-Sparplan: Festgelegter Betrag (mind. 10 €), der regelmäßig\
    \ investiert wird.\n  - Manuelle Order: Flexibel wählbare Beträge bei jeder Order.\n\
    \nEmpfehlung:\n\nEin Wechsel zum ETF-Sparplan lohnt sich für Kunden, die:\n* Regelmäßig\
    \ kleine Beträge (z. B. monatlich 50 €) investieren wollen, da sie so die Ordergebühren\
    \ von 1 € pro Transaktion einsparen.\n* Einen automatisierten Anlageprozess ohne\
    \ manuelles Eingreifen wünschen.\n* Den Durchschnittskosteneffekt (Cost-Average-Effekt)\
    \ nutzen wollen.\n\nDie manuelle Order bleibt die bessere Wahl für Kunden, die:\n\
    * Nur sporadisch und in großen Summen investieren.\n* Markttimings gezielt nutzen\
    \ möchten und daher nicht an ein fixes Intervall gebunden sein wollen.\n\nRegulatorischer\
    \ Hinweis: In beiden Fällen gelten die MiFID II Richtlinien zur Kostenoffenlegung\
    \ und Geeignetheit."
