- id: a5c0850e-3a35-5b73-b2fd-bdd578c8866d
  title: ETF-Sparplan — Schritt für Schritt starten
  body: 'Dieser Leitfaden unterstützt Support-Mitarbeiter dabei, Kunden bei der Einrichtung
    eines ETF-Sparplans zu begleiten. Bitte stellen Sie sicher, dass alle Schritte
    in der genannten Reihenfolge durchlaufen werden.


    Schritt 1: Prüfung der Voraussetzungen

    Bevor ein Sparplan eingerichtet werden kann, muss der Kunde über ein aktives und
    verifiziertes Wertpapierdepot verfügen. Prüfen Sie, ob die Identitätsprüfung erfolgreich
    abgeschlossen wurde. Falls nicht, verweisen Sie auf das Dokument Kranich Depot
    — abschließen und aktivieren.


    Schritt 2: Auswahl des ETFs

    Der Kunde wählt den gewünschten ETF aus unserem Angebot aus. Weisen Sie den Kunden
    darauf hin, dass wir edukative Informationen bereitstellen, jedoch keine individuelle
    Anlageberatung im Sinne einer Renditegarantie leisten.


    Schritt 3: Festlegung des Sparbetrags

    Der Kunde legt den monatlichen Anlagebetrag fest. Hierbei gilt die strikte Untergrenze
    eines Mindestbetrags von 10 € pro Ausführung. Beträge unter 10 € können systemtechnisch
    nicht verarbeitet werden.


    Schritt 4: Festlegung des Intervalls und Datums

    Es muss ein regelmäßiges Intervall (standardmäßig monatlich) sowie ein Ausführungsdatum
    definiert werden.


    Schritt 5: Bestätigung der Kosten

    Informieren Sie den Kunden transparent über die Kostenstruktur:

    *   Ausführungsgebühr: 0 € pro Sparplanausführung.

    *   Depotgebühr: 0 € (kostenfrei).


    Schritt 6: Abschließende Verifizierung

    Die Einrichtung des Sparplans erfordert eine starke Authentifizierung. Der Kunde
    muss den Vorgang durch den vorgesehenen Sicherheitsmechanismus bestätigen.


    Nach erfolgreichem Abschluss erhält der Kunde eine Bestätigung über die Details
    des Sparplans. Bei Fragen zum weiteren Verlauf verweisen Sie auf ETF-Sparplan
    — Status oder Verlauf einsehen.'
