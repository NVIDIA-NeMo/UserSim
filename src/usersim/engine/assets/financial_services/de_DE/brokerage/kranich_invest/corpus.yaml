- id: b59fac59-aba9-54b3-9a87-0f9560113e56
  title: Kranich Depot — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Im Vergleich zum Kranich Kinderdepot bietet das Standard-Kranich Depot die
    volle Flexibilität für erwachsene Privatanleger. Beide Produkte teilen unsere
    Philosophie der Kosteneffizienz: Sowohl das Kranich Depot als auch das Kinderdepot
    verzichten auf Depotgebühren (0 €) und nutzen die planbare Ordergebühr von 1 €.


    Der wesentliche Unterschied liegt in der Zielgruppe und den rechtlichen Rahmenbedingungen.
    Während das Kranich Depot direkt vom Erwachsenen verwaltet wird, ist das Kinderdepot
    speziell für den Vermögensaufbau der nächsten Generation konzipiert und unterliegt
    anderen regulatorischen Anforderungen hinsichtlich der gesetzlichen Vertretung.


    **Welches Produkt passt zu Ihnen?**


    *   **Kranich Depot:** Ideal für Personen ab 18 Jahren, die ihr eigenes Portfolio
    eigenständig und kostengünstig verwalten möchten.

    *   **Kranich Kinderdepot:** Die richtige Wahl, wenn Sie im Namen Ihres Kindes
    langfristig und sicher investieren wollen, um dessen Start in die Zukunft zu erleichtern.


    Beide Produkte profitieren von der Verwahrung als Sondervermögen und der gesetzlichen
    Anlegerentschädigung von 90 % bis maximal 20.000 €.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: a4857d43-29f1-5961-8b04-5b5b9e1fd536
  title: Kranich Depot — rechtliche Hinweise
  body: 'Kranich Invest agiert unter strikter Einhaltung der Vorgaben der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin) sowie der Richtlinie über Märkte für
    Finanzinstrumente (MiFID II). In diesem Zusammenhang weisen wir auf folgende regulatorische
    Rahmenbedingungen hin:


    **Sicherheit und Verwahrung**

    Die Sicherheit Ihrer Anlagen hat höchste Priorität. Alle Wertpapiere im Kranich
    Depot werden als Sondervermögen verwahrt. Diese rechtliche Trennung stellt sicher,
    dass Ihre Wertpapiere im Falle einer Insolvenz des Instituts nicht in die Insolvenzmasse
    fallen und Ihnen somit vollumfänglich zustehen.


    **Anlegerentschädigung**

    Zusätzlich zur Verwahrung als Sondervermögen besteht die gesetzliche Anlegerentschädigung.
    Diese sichert 90 % der Ansprüche ab, jedoch bis zu einem Maximalbetrag von 20.000
    € pro Kunde.


    **Prüfpflichten**

    Gemäß MiFID II sind wir verpflichtet, eine Geeignetheits- und Angemessenheitsprüfung
    durchzuführen. Erst nach erfolgreichem Abschluss dieser Prüfung und der Feststellung
    Ihres Anlegerprofils ist der Handel mit bestimmten Finanzinstrumenten möglich.


    **Risikohinweis**

    Wir weisen explizit darauf hin, dass Investitionen in Wertpapiere mit Risiken
    verbunden sind. Es besteht die Möglichkeit von Kursverlusten, die bis zum Totalverlust
    des eingesetzten Kapitals führen können. Eine Rendite wird nicht garantiert.


    **Beratungsgrenzen**

    Kranich Invest bietet edukative Informationen und allgemeine Markteinblicke an.
    Wir leisten jedoch keine individuelle Steuer- oder Rechtsberatung. Wir empfehlen,
    für spezifische steuerliche Fragen einen qualifizierten Steuerberater zu konsultieren.
    Der Sparer-Pauschbetrag (1.000 € für Einzelpersonen, 2.000 € für Gemeinschaftsdepots)
    dient lediglich als allgemeine Richtlinie zur steuerfreien Nutzung von Kapitalerträgen.


    Für eine Übersicht aller anfallenden Entgelte referenzieren Sie bitte auf das
    Dokument Kranich Depot — Preis- und Leistungsverzeichnis.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 02c52794-9e72-5f1c-b01c-be282c14bdf0
  title: Kranich Depot — Zinsübersicht
  body: 'Bei Kranich Invest möchten wir, dass Ihr Kapital auch dann arbeitet, wenn
    es nicht in Wertpapiere investiert ist. Daher verzinsen wir das Verrechnungskonto
    Ihres Kranich Depot.


    **Aktuelle Konditionen:**


    *   **Zinssatz:** 2,25 %

    *   **Geltungsbereich:** Dieser Zinssatz gilt einheitlich für alle Guthaben auf
    dem Verrechnungskonto.

    *   **Zinscap (Höchstbetrag):** Die Verzinsung erfolgt bis zu einem maximalen
    Betrag von 50.000 €.


    **Details zur Anwendung:**


    *   **Berechnung:** Die Zinsen werden auf Basis des täglichen Saldos berechnet
    und in regelmäßigen Intervallen gutgeschrieben.

    *   **Änderungen:** Der Zinssatz ist variabel und kann sich aufgrund von Marktgegebenheiten
    oder Änderungen der Leitzinsen ändern. Über entsprechende Anpassungen werden wir
    Sie transparent informieren.

    *   **Beträge über dem Cap:** Guthaben, die den Höchstbetrag von 50.000 € überschreiten,
    werden nicht verzinst.


    Weitere Informationen zur steuerlichen Behandlung dieser Zinsen finden Sie in
    unseren rechtlichen Hinweisen unter Kranich Depot — rechtliche Hinweise.'
