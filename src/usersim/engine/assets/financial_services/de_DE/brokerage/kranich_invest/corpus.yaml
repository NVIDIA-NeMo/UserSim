- id: 5e377434-bd33-569b-9799-3272c9baba98
  title: ETF-Sparplan — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sicherheit Ihrer Anlagen hat bei Kranich Invest höchste Priorität. Insbesondere
    bei automatisierten Anlageprodukten wie dem ETF-Sparplan ist es wichtig, dass
    Sie die Mechanismen zum Schutz Ihres Vermögens kennen.


    Aktuelle Betrugsmuster

    Betrüger versuchen häufig, über sogenanntes Social Engineering an Ihre Zugangsdaten
    zu gelangen. Dabei geben sich Täter oft als Mitarbeiter von Finanzinstituten oder
    Regulierungsbehörden aus, um Sie zur Preisgabe von Passwörtern oder zur Durchführung
    von Transaktionen zu bewegen. Achten Sie besonders auf Nachrichten, die eine sofortige
    Handlung fordern, um eine vermeintliche Kontosperrung zu verhindern.


    Was wir niemals von Ihnen verlangen

    Um Ihre Sicherheit zu gewährleisten, beachten Sie bitte die folgenden Grundsätze:

    - Wir fragen Sie niemals per E-Mail, SMS oder Telefon nach Ihrem Passwort oder
    Ihren TANs.

    - Wir fordern Sie niemals auf, Ihre Zugangsdaten auf einer externen Webseite einzugeben,
    die nicht direkt über unsere gesicherten Kanäle aufgerufen wurde.

    - Wir werden Sie niemals dazu auffordern, Gelder auf ein Drittkonto zu überweisen,
    um eine „Sicherheitsprüfung“ Ihres ETF-Sparplans durchzuführen.


    Maßnahmen bei Verdacht

    Sollten Sie eine ungewöhnliche Aktivität in Ihrem Depot bemerken oder eine verdächtige
    Anfrage erhalten haben, ist schnelles Handeln entscheidend. Bitte informieren
    Sie uns umgehend. Je schneller ein Betrugsverdacht gemeldet wird, desto effektiver
    können wir zustandsändernde Aktionen stoppen und Ihr Konto schützen.


    Sicherheitsprüfung bei Änderungen

    Jede wesentliche Änderung an Ihrem ETF-Sparplan, wie etwa die Anpassung des Sparbetrags
    oder die Änderung der Bankverbindung, erfordert eine starke Authentifizierung.
    Wir führen eine mehrstufige Sicherheitsprüfung durch, bevor eine solche Transaktion
    ausgeführt wird, um sicherzustellen, dass nur Sie Zugriff auf Ihre Anlagestrategie
    haben.


    Regulatorischer Hinweis

    Wir agieren streng nach den Vorgaben der BaFin sowie MiFID II. Die Sicherheit
    Ihrer Wertpapiere wird dadurch gewährleistet, dass diese als Sondervermögen verwahrt
    werden. Im Falle einer Insolvenz des Instituts fallen diese nicht in die Insolvenzmasse.


    Regulatorische Disclaimer: Die Sicherheit der Einlagen wird durch die gesetzliche
    Anlegerentschädigung (90 % bis maximal 20.000 €) gewährleistet.'
