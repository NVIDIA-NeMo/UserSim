- id: f23f4eab-70ce-51c9-a6a5-c5ccfd493dc3
  title: ETF-Sparplan — ein typisches Anliegen vollständig erledigen
  body: 'In diesem Leitfaden zeigen wir Ihnen, wie Sie den Prozess von der Auswahl
    eines ETFs bis zum startbereiten Sparplan vollständig durchlaufen.


    Ziel: Einrichtung eines monatlichen ETF-Sparplans zur langfristigen Vermögensbildung.


    Schritte zur vollständigen Erledigung:


    1. Auswahl des Anlageprodukts: Nennen Sie uns den Namen oder die ISIN des gewünschten
    ETFs. Wir prüfen umgehend, ob dieser für Ihren Kontotyp verfügbar ist und ob Ihre
    MiFID II Geeignetheitsprüfung aktuell ist.

    2. Festlegung des Sparbetrags: Geben Sie uns den monatlichen Betrag an. Beachten
    Sie, dass dieser mindestens 10 € betragen muss. Wir bestätigen Ihnen die Annahme
    des Betrags.

    3. Wahl des Ausführungsdatums: Teilen Sie uns mit, an welchem Kalendertag pro
    Monat die Investition erfolgen soll (z. B. der 1. oder der 15. eines Monats).

    4. Kostenprüfung: Wir bestätigen Ihnen explizit, dass für die regelmäßige Ausführung
    dieses Sparplans ein Entgelt von 0 € berechnet wird, sodass Ihre Kosten planbar
    bleiben.

    5. Finale Verifizierung: Wir fordern Sie zur starken Authentifizierung auf. Sobald
    Sie diese erfolgreich abgeschlossen haben, ist der Sparplan aktiviert.


    Wie Sie wissen, dass das Anliegen erledigt ist:

    Sie erhalten eine finale Bestätigung über den aktivierten Sparplan, aus der der
    gewählte ETF, der Betrag (z. B. 50 €) und der Ausführungszyklus hervorgehen. Der
    Sparplan ist nun in Ihrer Depotübersicht sichtbar.


    Regulatorischer Hinweis: Bitte beachten Sie, dass Wertpapieranlagen mit Risiken
    verbunden sind und wir keine individuelle Steuerberatung leisten.'
