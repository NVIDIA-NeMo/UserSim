    | Anforderung | Erforderliches Dokument / Information | Ergebnis bei Vorliegen
    |

    | :--- | :--- | :--- |

    | Identitätsprüfung | Gültiger Personalausweis oder Reisepass | Verifizierte Identität
    für Kontoeröffnung |

    | Steuerliche Erfassung | Steueridentifikationsnummer (Steuer-ID) | Korrekte Abführung
    der Abgeltungsteuer |

    | Zahlungsfluss | Verknüpftes Verrechnungskonto / Bankverbindung | Ausführung
    der Sparraten ab 10 € möglich |

    | Risikoprofil | Abgeschlossene Geeignetheitsprüfung (MiFID II) | Freigabe für
