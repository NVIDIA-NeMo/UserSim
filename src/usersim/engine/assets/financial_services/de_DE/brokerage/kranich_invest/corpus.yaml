- id: d82b5d61-d233-50db-9cd6-462c2e2ddb5d
  title: Kranich Kinderdepot — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Stand des Vermögens Ihres Kindes oder die Historie
    der Transaktionen prüfen möchten, gehen Sie bitte wie folgt vor:


    **Voraussetzungen**

    Sie müssen als gesetzlicher Vertreter des Kindes verifiziert sein und über den
    entsprechenden Zugang zu Ihrem Kundenkonto verfügen.


    **Schritt-für-Schritt-Anleitung**

    1.  **Anfrage des Depotstatus:** Bitten Sie uns um eine aktuelle Aufstellung der
    Positionen im Kranich Kinderdepot. Wir stellen Ihnen eine Übersicht aller aktuell
    gehaltenen Wertpapiere und deren Gesamtwert zum aktuellen Marktpreis zur Verfügung.

    2.  **Abruf des Transaktionsverlaufs:** Wenn Sie spezifische Käufe oder Verkäufe
    prüfen möchten, nennen Sie uns den gewünschten Zeitraum (z. B. „das letzte Kalenderjahr“).
    Wir senden Ihnen eine detaillierte Liste aller ausgeführten Orders zu.

    3.  **Prüfung der Gebühren:** In der Transaktionsliste können Sie die anfallenden
    Fixkosten sehen. Jede ausgeführte Order wird mit dem Betrag von 1 € ausgewiesen.

    4.  **Bestätigung:** Sobald Sie die Dokumente erhalten haben, prüfen Sie die Salden
    auf dem Verrechnungskonto und die Anzahl der Anteile in den Positionen.


    **Woran erkennen Sie, dass der Vorgang erfolgreich war?**

    Der Vorgang ist abgeschlossen, sobald Sie die gewünschte Depotübersicht oder den
    Kontoauszug in Ihrem digitalen Postfach erhalten haben oder wir Ihnen die Daten
    im Chat schriftlich bestätigt haben.


    Weitere Details zum Start des Depots finden Sie in Kranich Kinderdepot — Schritt
    für Schritt starten.'
