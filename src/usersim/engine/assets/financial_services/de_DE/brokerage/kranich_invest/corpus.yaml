- id: ed40651c-6cb3-55f7-a165-0e0303f29260
  title: ETF-Sparplan — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass die Einrichtung oder die monatliche Ausführung eines
    ETF-Sparplans abgelehnt oder gesperrt wird. Hier erfahren Sie, woran das liegen
    kann und wie das Problem gelöst wird.


    Symptom: Die Meldung „Vorgang abgelehnt“ erscheint oder ein geplanter Sparplan
    wurde nicht ausgeführt.


    Mögliche Ursachen:


    1. Unzureichende Deckung: Das Verrechnungskonto weist zum Zeitpunkt der Ausführung
    nicht genügend Guthaben auf, um den gewählten Betrag (mindestens 10 €) zu decken.

    2. Veraltetes Kundenprofil: Die erforderliche Geeignetheits- und Angemessenheitsprüfung
    nach MiFID II ist abgelaufen oder muss aufgrund einer Änderung Ihrer Lebensumstände
    aktualisiert werden.

    3. Sicherheitsprüfung: Eine zustandsändernde Aktion wurde nicht erfolgreich durch
    die mehrstufige Sicherheitsprüfung oder die starke Authentifizierung verifiziert.

    4. Regulatorische Sperre: Aufgrund fehlender Stammdaten oder einer laufenden Identitätsprüfung
    wurde das Depot temporär eingeschränkt.


    Lösungsschritte:


    * Guthaben prüfen: Stellen Sie sicher, dass der Betrag für den Sparplan auf Ihrem
    Verrechnungskonto verfügbar ist.

    * Profil aktualisieren: Wenn die Geeignetheitsprüfung abgelaufen ist, teilen Sie
    uns dies mit. Wir senden Ihnen die notwendigen Fragen zu, um Ihr Profil zu aktualisieren.

    * Authentifizierung wiederholen: Falls die Sicherheitsprüfung fehlgeschlagen ist,
    führen Sie den Vorgang erneut unter Beachtung der Authentifizierungsschritte durch.


    Wenn wir das Problem nicht sofort lösen können:

    Wir leiten die Anfrage intern an die Fachabteilung für Depotführung oder Compliance
    weiter. Sie erhalten eine Benachrichtigung über den Fortschritt der Bearbeitung
    innerhalb des festgelegten Zeitrahmens.


    Regulatorischer Hinweis: Wir weisen explizit auf das Verlustrisiko bei Wertpapieranlagen
    hin; die Sicherheit Ihres Kapitals wird durch die Verwahrung als Sondervermögen
    gewährleistet.'
  domain: brokerage_investing
