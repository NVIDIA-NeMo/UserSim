- id: 1eeeca52-9ba7-5c7d-868e-c1ef6ee39e3e
  title: Kranich Depot — abgelehnter oder gesperrter Vorgang
  body: "Wenn eine Order oder eine Änderung an Ihren Stammdaten abgelehnt oder gesperrt\
    \ wird, kann dies verschiedene Ursachen haben. In diesem Dokument finden Sie die\
    \ häufigsten Gründe und die entsprechenden Lösungen.\n\n**Symptom: „Vorgang abgelehnt“\
    \ oder „Transaktion gesperrt“**\n\n**Mögliche Ursachen und Prüfschritte**\n\n\
    1.  **Unzureichende Deckung:**\n    *   *Prüfung:* Überprüfen Sie Ihr Guthaben\
    \ auf dem Verrechnungskonto. Bedenken Sie, dass neben dem Kaufpreis des Wertpapiers\
    \ auch die Ordergebühr von 1 € gedeckt sein muss.\n    *   *Lösung:* Überweisen\
    \ Sie den fehlenden Betrag auf Ihr Verrechnungskonto.\n\n2.  **Fehlende oder veraltete\
    \ Geeignetheitsprüfung:**\n    *   *Prüfung:* Haben Sie die erforderlichen MiFID\
    \ II-Fragebögen zur Risikobewertung ausgefüllt?\n    *   *Lösung:* Aktualisieren\
    \ Sie Ihre Angaben zur Kenntnis und Erfahrung, damit wir die Angemessenheit des\
    \ Produkts prüfen können.\n\n3.  **Sicherheitsprüfung nicht bestanden:**\n   \
    \ *   *Prüfung:* Wurde die starke Authentifizierung für diese zustandsändernde\
    \ Aktion erfolgreich durchgeführt?\n    *   *Lösung:* Wiederholen Sie den Verifizierungsprozess\
    \ sorgfältig.\n\n4.  **Regulatorische Sperren:**\n    *   *Prüfung:* Liegen uns\
    \ alle notwendigen Identitätsnachweise vor oder gibt es Unstimmigkeiten in den\
    \ Stammdaten?\n    *   *Lösung:* Reichen Sie die angeforderten Unterlagen nach.\n\
    \n**Eskalationsweg**\nWenn die oben genannten Punkte nicht zur Lösung führen,\
    \ werden wir den Vorgang intern an die Fachabteilungen für Compliance oder Depotführung\
    \ weiterleiten. Sie erhalten innerhalb eines definierten Zeitrahmens eine transparente\
    \ Rückmeldung über die Ursache der Sperre und die notwendigen Schritte zur Behebung.\n\
    \nWeitere Details zu fehlgeschlagenen Vorgängen finden Sie in: Kranich Depot —\
    \ fehlgeschlagener oder ausstehender Vorgang."
