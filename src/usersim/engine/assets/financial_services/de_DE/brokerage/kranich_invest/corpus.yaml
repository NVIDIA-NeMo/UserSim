- id: 858602dc-78c9-557c-9939-a57e35b23c3c
  title: Kranich Kinderdepot — fehlgeschlagener oder ausstehender Vorgang
  body: 'Wenn die Eröffnung oder eine Änderung am Kranich Kinderdepot nicht wie erwartet
    abgeschlossen wurde, liegt dies meist an fehlenden oder nicht ausreichend verifizierten
    Informationen. Da Sicherheit und regulatorische Konformität (BaFin/MiFID II) oberste
    Priorität haben, führen Unstimmigkeiten in den Daten automatisch zu einer Verzögerung.


    **Symptom: Der Depot-Antrag steht auf „ausstehend“ oder wurde abgelehnt**


    **Mögliche Ursachen**

    * **Unvollständige Dokumentation**: Die eingereichte Geburtsurkunde ist nicht
    vollständig lesbar oder es fehlt ein Identitätsnachweis eines der sorgeberechtigten
    Elternteile.

    * **Identitätsprüfung fehlgeschlagen**: Die starke Authentifizierung der gesetzlichen
    Vertreter konnte nicht erfolgreich abgeschlossen werden.

    * **Datenunstimmigkeit**: Die angegebenen Stammdaten des Kindes weichen von den
    eingereichten offiziellen Dokumenten ab.


    **Lösungsschritte**

    1. **Prüfung der Unterlagen**: Kontrollieren Sie, ob alle Dokumente (Ausweise,
    Geburtsurkunde) aktuell, gültig und in hoher Auflösung eingereicht wurden.

    2. **Nachreichung**: Senden Sie uns die fehlenden oder korrigierten Dokumente
    erneut zu.

    3. **Verifizierung wiederholen**: Falls die Identitätsprüfung fehlgeschlagen ist,
    führen Sie den Prozess der starken Authentifizierung erneut durch.


    **Wann erfolgt eine Eskalation?**

    Sollten die Unterlagen korrekt eingereicht sein und der Status dennoch über fünf
    Werktage unverändert bleiben, leiten wir den Vorgang intern an unsere Fachabteilung
    für Depotführung weiter. Wir informieren Sie transparent über den Fortschritt
    und die voraussichtliche Dauer der Prüfung.


    Bei Fragen zu den notwendigen Unterlagen hilft Ihnen das Dokument Kranich Kinderdepot
    — Voraussetzungen weiter.'
