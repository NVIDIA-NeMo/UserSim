- id: c7c4fa46-a4cc-55a9-8ea5-d2a76afbdc1f
  title: ETF-Sparplan — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Beim Vergleich unseres ETF-Sparplans mit typischen Angeboten anderer Broker
    ergeben sich wesentliche Unterschiede in der Kostenstruktur und den Einstiegshürden.


    | Merkmal | Kranich Invest ETF-Sparplan | Typisches Wettbewerbsangebot |

    | :--- | :--- | :--- |

    | Ausführungsgebühr | 0 € | Prozentualer Satz oder Fixbetrag pro Kauf |

    | Mindestbetrag | 10 € | Oft 25 € bis 50 € |

    | Depotgebühr | 0 € | Monatliche oder jährliche Grundgebühr |

    | Transparenz | Fixe Kostenphilosophie | Komplexe Staffelsysteme |


    Bewertung


    Kranich Invest ist die bessere Wahl für Anleger, die maximale Kosteneffizienz
    suchen und bereits mit sehr kleinen Beträgen (ab 10 €) einen systematischen Vermögensaufbau
    starten möchten. Durch den Verzicht auf Ausführungsgebühren bleibt die gesamte
    Sparrate im Investment.


    Ein Wettbewerbsangebot könnte dann vorteilhaft sein, wenn dieser Anbieter eine
    wesentlich größere Auswahl an exotischen Nischen-ETFs führt, die über unser aktuelles
    Portfolio hinausgehen. Wir konzentrieren uns hingegen auf transparente, kosteneffiziente
    und sicher verwahrte Anlageoptionen.


    Regulatorischer Hinweis: Ein Vergleich bezieht sich auf die Kostenstruktur; die
    Renditechancen hängen vom gewählten ETF ab.'
