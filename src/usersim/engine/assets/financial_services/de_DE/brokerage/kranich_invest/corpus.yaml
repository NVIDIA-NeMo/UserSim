- id: 3e7f75b9-c37f-5095-ad5b-41fcedbbfbe7
  title: Kranich Kinderdepot — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass eine Transaktion oder eine Änderung an den Stammdaten
    des Kranich Kinderdepots nicht ausgeführt werden kann. Hier erfahren Sie, woran
    das liegen kann und wie es gelöst wird.


    **Symptom**

    Sie erhalten die Meldung, dass ein Vorgang (z. B. ein Wertpapierkauf oder die
    Einrichtung eines Sparplans) abgelehnt wurde oder das Depot vorübergehend für
    Änderungen gesperrt ist.


    **Mögliche Ursachen und Prüfschritte**

    1.  **Fehlende oder veraltete Identitätsnachweise:** Prüfen Sie, ob alle erforderlichen
    Dokumente des gesetzlichen Vertreters und des Kindes (z. B. Geburtsurkunde) aktuell
    und vollständig hinterlegt sind. Eine starke Authentifizierung ist für jede zustandsändernde
    Aktion zwingend erforderlich.

    2.  **Nicht ausreichendes Guthaben:** Stellen Sie sicher, dass auf dem Verrechnungskonto
    genügend liquide Mittel vorhanden sind, um sowohl den Kaufpreis des Wertpapiers
    als auch die fixe Ordergebühr von 1 € zu decken.

    3.  **Mindestbetrag des Sparplans nicht erreicht:** Wenn die Einrichtung eines
    Sparplans abgelehnt wurde, prüfen Sie, ob der gewählte Betrag mindestens 10 €
    beträgt. Beträge darunter können systemisch nicht verarbeitet werden.

    4.  **Regulatorische Prüfungen:** In seltenen Fällen führen MiFID II-konforme
    Geeignetheits- oder Angemessenheitsprüfungen zu einer vorübergehenden Sperre,
    bis alle erforderlichen Informationen vorliegen.


    **Lösung und Eskalation**

    *   **Korrektur:** Übermitteln Sie uns die fehlenden Dokumente oder führen Sie
    die notwendige Aufladung des Verrechnungskontos durch. Wir lösen die Sperre unmittelbar
    nach erfolgreicher Prüfung.

    *   **Eskalation:** Sollte die Ursache nicht offensichtlich sein, leiten wir Ihr
    Anliegen intern an unsere Fachabteilung für Depotführung weiter. Sie erhalten
    innerhalb eines definierten Zeitrahmens eine transparente Rückmeldung über den
    Status der Prüfung.


    Für weitere Informationen zu fehlgeschlagenen Prozessen siehe Kranich Kinderdepot
    — fehlgeschlagener oder ausstehender Vorgang.'
  domain: brokerage_investing
  product_category: kinderdepot
  document_type: troubleshooting
  source_authority: official
