- id: cc595262-5224-59e3-9dcd-96ae5f18169b
  title: Kranich Depot — Preis- und Leistungsverzeichnis
  body: 'Nachfolgend finden Sie die aktuellen Gebühren für das Kranich Depot. Wir
    verfolgen eine Philosophie der maximalen Transparenz, weshalb wir auf prozentuale
    Kosten verzichten.


    *   **Depotführung (jährlich):** 0 €

    *   **Ordergebühr (pro Transaktion):** 1 €

    *   **Ein- und Auszahlungen auf das Verrechnungskonto:** Kostenfrei

    *   **Depotübertrag von anderen Instituten:** Kostenfrei


    Alle Gebühren verstehen sich als Endpreise. Es fallen keine versteckten Verwaltungs-
    oder Kontoführungsgebühren an. Wir fördern den langfristigen Vermögensaufbau unserer
    Kunden, indem wir die Einstiegshürden so niedrig wie möglich halten.'
