- id: 0607d64a-2c10-509a-bc16-a5f4cada3b46
  title: ETF-Sparplan — Datenschutz und Datenverarbeitung
  body: 'Kranich Invest legt großen Wert auf den Schutz Ihrer personenbezogenen Daten.
    Bei der Nutzung eines ETF-Sparplans werden Daten gemäß den Vorgaben der DSGVO
    sowie den Richtlinien der BaFin und MiFID II verarbeitet.


    **Zweck der Datenverarbeitung**

    Die Verarbeitung Ihrer Daten ist notwendig, um den ETF-Sparplan technisch und
    regulatorisch auszuführen. Dies umfasst:

    *   **Transaktionsabwicklung**: Die Überweisung des Sparbetrags (mindestens 10
    €) von Ihrem Verrechnungskonto an die zuständigen Fondsadministratoren.

    *   **Identitätsprüfung**: Zur Erfüllung der KYC-Pflichten (Know Your Customer)
    und zur Durchführung der mehrstufigen Sicherheitsprüfungen bei jeder zustandsändernden
    Aktion.

    *   **Steuerliche Meldungen**: Die Berechnung und Abführung der Abgeltungsteuer,
    des Solidaritätszuschlags und ggf. der Kirchensteuer.


    **Datenübermittlung an Dritte**

    Im Rahmen der Ausführung Ihres Sparplans werden notwendige Daten an die jeweiligen
    ETF-Anbieter und Verwahrstellen übermittelt. Diese Übermittlung erfolgt streng
    zweckgebunden und nur insoweit, als dies zur Erbringung der Dienstleistung erforderlich
    ist.


    **Ihre Rechte**

    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    (z. B. durch die BaFin) entgegenstehen.


    **Sicherheit und Verwahrung**

    Wir weisen darauf hin, dass Ihre durch den Sparplan erworbenen Wertpapiere als
    Sondervermögen verwahrt werden. Damit sind sie rechtlich von unserem Institutsvermögen
    getrennt. Die Sicherheit Ihres Verrechnungskontos wird zudem durch die gesetzliche
    Anlegerentschädigung von 90 % bis maximal 20.000 € gewährleistet.


    Für weitere rechtliche Hinweise besuchen Sie bitte: ETF-Sparplan — rechtliche
    Hinweise.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 6050ab88-02f6-51e4-8776-323e983640a8
  title: ETF-Sparplan — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Ein ETF-Sparplan ist ein Instrument zum langfristigen Vermögensaufbau. Aufgrund
    der Popularität dieses Produkts gibt es verschiedene Betrugsmuster, die Sie kennen
    sollten, um Ihr Kapital zu schützen.


    Typische Betrugsmaschen:


    * Versprechen garantierter Renditen: Seriöse Anbieter, einschließlich Kranich
    Invest, garantieren niemals eine Rendite. Angebote, die eine "risikofreie Gewinnzusage"
    oder "garantierte monatliche Erträge" für Ihren Sparplan versprechen, sind fast
    immer betrügerisch.

    * Aufrufe zur Überweisung auf Privatkonten: Ein ETF-Sparplan wird immer über ein
    offizielles Verrechnungskonto geführt. Wir werden Sie niemals bitten, Gelder für
    einen Sparplan auf ein privates Konto oder an einen Drittanbieter zu überweisen.

    * Dringlichkeitsdruck und Geheimhaltungsaufforderungen: Betrüger versuchen oft,
    Sie zu schnellen Entscheidungen zu drängen oder Sie dazu zu bewegen, Details Ihrer
    Anlage vor Angehörigen oder Bankberatern geheim zu halten.

    * Phishing über gefälschte Bestätigungen: Achten Sie auf E-Mails, die angeblich
    über eine Änderung Ihres Sparplans informieren und Sie auffordern, Ihre Zugangsdaten
    auf einer externen Webseite einzugeben.


    Was wir niemals von Ihnen verlangen:

    Wir fragen Sie niemals per E-Mail, Telefon oder Chat nach Ihren vollständigen
    Passwörtern oder Transaktions-PINs. Jede zustandsändernde Aktion bei Kranich Invest
    erfordert eine starke Authentifizierung über unsere gesicherten Kanäle.


    Erste Schritte bei Verdacht:

    Sollten Sie eine verdächtige Nachricht erhalten haben oder eine ungewöhnliche
    Transaktion in Ihrem Verlauf bemerken, informieren Sie uns umgehend. Wir erfassen
    Betrugsverdacht systematisch und bearbeiten diesen innerhalb eines definierten
    Zeitrahmens gemäß den BaFin-Richtlinien.


    Regulatorischer Hinweis: Wertpapiere werden bei uns als Sondervermögen verwahrt
    und fallen daher im Insolvenzfall nicht in die Insolvenzmasse des Instituts.


    Weitere Informationen finden Sie in: ETF-Sparplan — Schutz vor Betrug und nicht
    autorisierten Vorgängen.'
