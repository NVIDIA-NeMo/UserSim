- id: c5d1868c-783a-5fb7-b045-f24dce705881
  title: Kranich Depot — Schritt für Schritt starten
  body: 'Diese Anleitung dient als Unterstützung für Support-Mitarbeiter, um Kunden
    bei der Eröffnung und dem Start mit dem Kranich Depot zu begleiten.


    Schritt 1: Identitätsprüfung und Kontoeröffnung

    * Der Kunde gibt seine Stammdaten an.

    * Durchführung einer starken Identitätsprüfung (KYC-Prozess). Erst nach erfolgreicher
    Verifizierung ist eine Kontoeröffnung möglich.

    * Erstellung des Verrechnungskontos und des Wertpapierdepots.


    Schritt 2: Einrichtung der steuerlichen Präferenzen

    * Unterstützung des Kunden bei der Hinterlegung des Freistellungsauftrags (Sparer-Pauschbetrag).

    * Für Alleinstehende: 1.000 €.

    * Für Gemeinschaftsdepots: 2.000 €.

    * Hinweis: Die Abgeltungsteuer wird vom Institut direkt abgeführt.


    Schritt 3: Erste Finanzierung

    * Der Kunde überweist das gewünschte Startkapital auf das Verrechnungskonto.

    * Hinweis auf den Zinsvorteil: Guthaben bis zu 50.000 € werden mit 2,25 % verzinst.


    Schritt 4: Erste Transaktion

    * Der Kunde wählt das gewünschte Wertpapier aus.

    * Erläuterung der Kostenstruktur: Pro Order fällt eine fixe Gebühr von 1 € an.
    Die Depotführung bleibt dauerhaft bei 0 €.

    * Durchführung der Geeignetheits- und Angemessenheitsprüfung gemäß MiFID II vor
    der ersten Order.


    Schritt 5: Abschluss und Bestätigung

    * Der Kunde erhält eine Bestätigung der ausgeführten Order.

    * Hinweis auf das Verlustrisiko bei Wertpapieranlagen.


    Regulatorischer Hinweis: Weisen Sie den Kunden darauf hin, dass Wertpapiere als
    Sondervermögen geschützt sind und die gesetzliche Anlegerentschädigung 90 % bis
    maximal 20.000 € abdeckt.'
