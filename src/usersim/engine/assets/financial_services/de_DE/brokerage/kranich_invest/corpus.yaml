- id: 29a9f6d7-bdba-53ac-b1cd-3285be0be1a5
  title: Kranich Depot — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Kontext digitaler Vermögensverwaltung gibt es spezifische Betrugsmuster,
    die darauf abzielen, unbefugten Zugriff auf Ihr Kranich Depot zu erlangen oder
    Sie zu Fehlentscheidungen zu verleiten. Für Anleger, die verschiedene Anbieter
    vergleichen, ist es wichtig, die Sicherheitsstandards von Kranich Invest zu kennen.


    Typische Betrugsmaschen im Depot-Umfeld:


    *   **Garantierte Renditen:** Seien Sie skeptisch bei Angeboten, die Ihnen über
    soziale Medien oder Messenging-Dienste „garantierte“ Gewinne versprechen. Kranich
    Invest garantiert gemäß MiFID II niemals Renditen. Jedes Investment in Wertpapiere
    ist mit einem Verlustrisiko verbunden.

    *   **Fake-Support und Phishing:** Betrüger geben sich oft als Mitarbeiter unseres
    Supports aus. Sie versuchen, durch Zeitdruck oder die Androhung einer Kontosperrung
    an Ihre Zugangsdaten zu gelangen. Beachten Sie: Wir fragen Sie niemals per E-Mail,
    Chat oder Telefon nach Ihren Passwörtern, TANs oder anderen starken Authentifizierungsmerkmalen.

    *   **Überweisung an Drittkonten:** Warnen Sie sich vor Anweisungen, Gelder für
    „exklusive Investmentmöglichkeiten“ auf Konten zu überweisen, die nicht offiziell
    auf den Namen der Kranich Invest eingetragen sind.


    Was wir niemals tun:

    *   Wir fordern Sie nicht auf, Ihre Identitätsnachweise erneut über unsichere
    Links in einer E-Mail zu übermitteln.

    *   Wir verlangen keine Vorauszahlungen für die Freischaltung von Gewinnen.


    Erste Maßnahmen bei Verdacht:

    Sollten Sie eine Nachricht erhalten haben, die Ihnen verdächtig vorkommt, oder
    haben Sie versehentlich Daten preisgegeben? Informieren Sie uns umgehend über
    unsere digitalen Kanäle oder telefonisch. Eine schnelle Meldung ist entscheidend,
    um zustandsändernde Aktionen zu blockieren und den Schutz Ihres Sondervermögens
    zu gewährleisten. Wir bearbeiten Betrugsverdacht systematisch innerhalb unserer
    definierten Zeitrahmen und in Abstimmung mit den BaFin-Richtlinien.


    Weitere Informationen zum Schutz Ihres Kontos finden Sie in: Kranich Depot — Sicherheitstipps
    für Ihr Konto.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: security_advisory
  source_authority: official
