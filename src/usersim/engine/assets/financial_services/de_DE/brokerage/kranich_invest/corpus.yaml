- id: 8f94329a-8c4f-5c16-98b9-1f5f3b723b6f
  title: 'Kranich Depot — Sparer-Pauschbetrag für Alleinstehende: Erklärung'
  body: 'Häufige Fragen zur steuerlichen Behandlung Ihrer Kapitalerträge beim Kranich
    Depot.


    **Was ist der Sparer-Pauschbetrag für Alleinstehende?**

    Der Sparer-Pauschbetrag ist der Betrag an Kapitalerträgen, der pro Jahr steuerfrei
    bleibt. Für Einzelpersonen liegt dieser Betrag bei 1.000 €.


    **Wie wird dieser Betrag im Kranich Depot berücksichtigt?**

    Damit wir die Abgeltungsteuer nicht automatisch auf alle Erträge abführen, müssen
    Sie uns einen Freistellungsauftrag erteilen. In diesem geben Sie an, bis zu welchem
    Betrag (maximal 1.000 € für Alleinstehende) Ihre Erträge steuerfrei bleiben sollen.


    **Was passiert, wenn ich keinen Freistellungsauftrag einreiche?**

    In diesem Fall führen wir die anfallende Abgeltungsteuer inklusive Solidaritätszuschlag
    und ggf. Kirchensteuer direkt an das Finanzamt ab.


    Weitere Informationen zu steuerlichen Themen finden Sie in: Kranich Depot — rechtliche
    Hinweise.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 6fbd0d8b-0fc1-5dff-a62f-b83e6e58f3bd
  title: Kranich Depot — ein typisches Anliegen vollständig erledigen
  body: 'In diesem Leitfaden zeigen wir Ihnen beispielhaft, wie Sie den Prozess von
    der Eröffnung Ihres Depots bis zum ersten erfolgreichen Wertpapierkauf vollständig
    abschließen.


    **Voraussetzungen**

    Sie benötigen ein gültiges Ausweisdokument für die Identitätsprüfung und ein Referenzkonto
    für die Einzahlungen.


    **Schritt-für-Schritt-Anleitung**


    1.  **Depot-Antrag stellen:** Teilen Sie uns mit, dass Sie ein Kranich Depot eröffnen
    möchten. Wir führen Sie durch die notwendigen Schritte der Identitätsprüfung und
    der starken Authentifizierung.

    2.  **Konto aktivieren und Kapital einzahlen:** Nachdem Ihr Depot aktiviert wurde,
    überweisen Sie den gewünschten Betrag von Ihrem Referenzkonto auf Ihr neues Verrechnungskonto.
    Sobald das Geld eingegangen ist, wird es mit einem Zinssatz von 2,25 % verzinst
    (bis maximal 50.000 €).

    3.  **Freistellungsauftrag einrichten:** Damit Ihre ersten Gewinne steuerfrei
    bleiben, teilen Sie uns Ihren gewünschten Sparer-Pauschbetrag mit (für Alleinstehende
    bis zu 1.000 €, für Gemeinschaftsdepots bis zu 2.000 €).

    4.  **Erste Order platzieren:** Nennen Sie uns das Wertpapier (ISIN/WKN), das
    Sie kaufen möchten, sowie die Stückzahl. Wir prüfen die Verfügbarkeit und die
    Deckung auf Ihrem Konto.

    5.  **Ausführung und Bestätigung:** Wir führen die Order aus. Dabei wird lediglich
    die fixe Ordergebühr von 1 € berechnet, unabhängig vom Volumen Ihres Kaufs. Sie
    erhalten eine Bestätigung über die erfolgreiche Ausführung und den neuen Depotbestand.


    **Woran erkenne ich, dass alles erledigt ist?**

    Der Prozess ist abgeschlossen, wenn Sie in Ihrer Depotübersicht das erworbene
    Wertpapier sehen und die entsprechende Abbuchung (Kaufpreis + 1 € Gebühr) in Ihrem
    Transaktionsverlauf auf dem Verrechnungskonto aufgeführt ist.


    Für detaillierte Infos zur Eröffnung siehe: Kranich Depot — abschließen und aktivieren.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 28bc53ed-2793-553c-8a6a-2e7695a64501
  title: Kranich Depot — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen die eingereichten Dokumente des Kunden nicht mit den im System hinterlegten
    Stammdaten übereinstimmen.


    **Symptom: Inkonsistenz in den Kundendaten (KYC-Abweichung)**


    **Häufige Ursachen**

    *   **Namensänderung:** Der Kunde hat geheiratet oder den Namen geändert, ohne
    dies im Profil zu aktualisieren.

    *   **Adressabweichungen:** Die gemeldete Adresse weicht von der Adresse im aktuellen
    Personalausweis oder einer aktuellen Meldebescheinigung ab.

    *   **Steuer-ID Fehler:** Die übermittelte Steueridentifikationsnummer ist fehlerhaft
    oder wird vom Finanzamt nicht bestätigt.


    **Prüfsequenz und Behebung**


    1.  **Abgleich der Dokumente:** Prüfen Sie genau, welche Felder divergieren. Handelt
    es sich um einen Tippfehler oder eine grundsätzliche Änderung der Stammdaten?

    2.  **Anforderung von Nachweisen:** Bitten Sie den Kunden, ein offizielles Dokument
    einzureichen, das die Änderung belegt (z. B. Heiratsurkunde, aktuelle Meldebescheinigung).

    3.  **Verifizierung:** Stellen Sie sicher, dass die neue Dokumentation über eine
    gesicherte Methode übermittelt wird und die Identität des Kunden durch eine starke
    Authentifizierung erneut bestätigt wurde.

    4.  **Korrektur im System:** Sobald die Nachweise vorliegen und geprüft wurden,
    aktualisieren Sie die Stammdaten. Informieren Sie den Kunden über die erfolgreiche
    Anpassung.


    **Eskalationsweg**

    Sollten die Unterlagen widersprüchlich sein oder ein begründeter Verdacht auf
    Identitätsbetrug bestehen, ist der Vorgang sofort an die Fachabteilung für Compliance
    zu eskalieren. In diesem Fall wird das Depot vorsorglich gesperrt, bis eine abschließende
    Prüfung erfolgt ist.


    Weitere Informationen zu erforderlichen Dokumenten finden Sie in: Kranich Depot
    — erforderliche Unterlagen.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 96a6d94c-7130-56b6-b57c-67b34459c5b2
  title: ETF-Sparplan — Überblick
  body: 'Der ETF-Sparplan von Kranich Invest ist das ideale Werkzeug für Anleger,
    die einen automatisierten, langfristigen Vermögensaufbau anstreben. Durch die
    regelmäßige Investition in Exchange Traded Funds (ETFs) profitieren Sie vom Durchschnittskosteneffekt
    (Cost-Average-Effect) und minimieren das Risiko eines ungünstigen Einstiegszeitpunkts.


    Unser Modell zeichnet sich durch maximale Transparenz und minimale Kosten aus.
    Wir ermöglichen Ihnen den Einstieg in den Kapitalmarkt mit einer sehr niedrigen
    Hürde: bereits ab einem Betrag von 10 € pro Monat können Sie Ihren Sparplan starten.
    Um Ihren Vermögensaufbau nicht durch Gebühren zu bremsen, erheben wir eine Gebühr
    für die Sparplanausführung in Höhe von 0 €.


    Die Sicherheit Ihrer Anlagen hat bei uns oberste Priorität. Alle über den ETF-Sparplan
    erworbenen Wertpapiere werden als Sondervermögen verwahrt. Das bedeutet, dass
    Ihre Positionen rechtlich strikt vom Institutsvermögen von Kranich Invest getrennt
    sind und im Falle einer Insolvenz nicht in die Insolvenzmasse fallen. Zusätzlich
    sind Sie durch die gesetzliche Anlegerentschädigung abgesichert, die bis zu 90
    % des Guthabens, maximal jedoch 20.000 €, abdeckt.


    Um den Sparplan zu nutzen, benötigen Sie ein bestehendes Depot bei uns. Wir empfehlen
    Ihnen, die Details zur Depotführung in unserem Dokument „Kranich Depot — Überblick“
    zu prüfen. In Kombination mit der Verzinsung Ihres Verrechnungskontos bietet der
    ETF-Sparplan eine effiziente Strategie, um sowohl liquides Kapital zu halten als
    auch systematisch in die Märkte zu investieren.


    Bitte beachten Sie, dass Investitionen in ETFs mit Risiken verbunden sind. Die
    Wertentwicklung der Fonds kann schwanken, und eine Rendite kann nicht garantiert
    werden. Wir stellen Ihnen edukative Informationen zur Verfügung, leisten jedoch
    keine individuelle Anlageberatung.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kranich_invest
- id: 3b3a1d85-c81a-54a5-a090-84f5f3007bca
  title: 'ETF-Sparplan — Mindestbetrag pro Sparplanausführung: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zum Mindestbetrag Ihres
    ETF-Sparplans.


    **Wie hoch ist der Mindestbetrag, den ich monatlich investieren muss?**

    Um einen ETF-Sparplan bei Kranich Invest zu aktivieren, ist ein Mindestbetrag
    von 10 € pro Ausführung erforderlich. Dieser geringe Betrag stellt sicher, dass
    der Vermögensaufbau für jedermann zugänglich ist, unabhängig von der Höhe des
    verfügbaren Monatseinkommens.


    **Kann ich den Sparbetrag später anpassen?**

    Ja, Sie können Ihren Sparbetrag jederzeit ändern. Voraussetzung ist lediglich,
    dass der neue Betrag weiterhin mindestens 10 € beträgt. Änderungen werden nach
    einer kurzen Bearbeitungszeit für den nächsten Ausführungszyklus wirksam.


    **Was passiert, wenn ich einen Betrag unter 10 € investieren möchte?**

    Für Beträge unter 10 € können wir derzeit keine automatisierten Sparpläne anbieten.
    In diesem Fall können Sie jedoch eine manuelle Einzelorder über Ihr Depot tätigen,
    wobei hier die regulären Ordergebühren gemäß dem „ETF-Sparplan — Preis- und Leistungsverzeichnis“
    gelten.'
  domain: brokerage_investing
  product_category: etf_sparplan
  document_type: faq
  source_authority: official
