- id: ffe3b06b-d77f-5e33-b9ce-09fd98a0375c
  title: Kranich Kinderdepot — Änderung der Bedingungen
  body: 'Diese Bedingungen regeln die Anpassung der vertraglichen Rahmenbedingungen
    für das Kranich Kinderdepot. Als Anbieter verpflichten wir uns zu maximaler Transparenz
    bei allen Kostenstrukturen.


    **Anpassung der Entgelte**


    Kranich Invest behält sich das Recht vor, die Gebührenstruktur anzupassen. Aktuell
    gilt eine Depotgebühr von 0 € und eine fixe Ordergebühr von 1 €. Sollten diese
    Werte angepasst werden, geschieht dies unter Einhaltung der regulatorischen Vorgaben
    der BaFin und MiFID II.


    **Benachrichtigung und Fristen**


    * **Ankündigung:** Wir informieren Sie über jede Änderung der Bedingungen oder
    Entgelte mit einer Frist von mindestens zwei Monaten vor Inkrafttreten der Änderung.

    * **Form der Mitteilung:** Die Benachrichtigung erfolgt über die von Ihnen hinterlegten
    digitalen Kommunikationskanäle (E-Mail oder gesicherte Nachricht im Postfach).

    * **Widerspruchsrecht:** Sie haben das Recht, einer Erhöhung der Entgelte innerhalb
    der angekündigten Frist zu widersprechen, indem Sie das Depot kündigen. Die Kündigung
    wird zum Ende der Ankündigungsfrist wirksam.


    **Verpflichtungen der Vertragsparteien**


    Der gesetzliche Vertreter verpflichtet sich, die Richtigkeit der hinterlegten
    Stammdaten des Kindes und des Vertreters sicherzustellen. Wir verpflichten uns,
    die Wertpapiere strikt als Sondervermögen zu führen, sodass sie unabhängig von
    der finanziellen Lage des Instituts geschützt bleiben.


    **Beendigung des Vertrages**


    Das Vertragsverhältnis endet durch Kündigung durch eine der Parteien. Bei Erreichen
    der Volljährigkeit des Kindes wird das Depot in ein reguläres Depot überführt,
    sofern keine andere Vereinbarung getroffen wurde. In diesem Fall gelten die Bedingungen
    für das entsprechende Produkt, wie in Kranich Depot — Überblick beschrieben.


    Die Einhaltung der gesetzlichen Anlegerentschädigung (90 % bis maximal 20.000
    €) bleibt auch bei Bedingungsänderungen unberührt.'
