- id: 8442de13-e90f-53c6-8b80-5de0f9c34c5e
  title: ETF-Sparplan — Zinsübersicht
  body: 'Ein ETF-Sparplan selbst generiert keine festen Zinsen, da es sich um eine
    Investition in Wertpapiere handelt, deren Ertrag aus Kursgewinnen und etwaigen
    Ausschüttungen resultiert.


    Jedoch ist der ETF-Sparplan eng mit Ihrem Verrechnungskonto verknüpft. Um Ihren
    Vermögensaufbau zu optimieren, verzinsen wir das Guthaben auf Ihrem Verrechnungskonto
    bis zu einem Betrag von 50.000 €.


    **Zinskonditionen des Verrechnungskontos:**

    * **Geltungsbereich**: Alle Kunden mit einem aktiven Depot und ETF-Sparplan.

    * **Verzinsung**: Attraktive Verzinsung auf Guthaben bis maximal 50.000 €.

    * **Zahlungsweise**: Die Zinsen werden gemäß den Standardzyklen von Kranich Invest
    gutgeschrieben.


    Durch diese Kombination profitieren Sie von einer Verzinsung Ihrer liquiden Mittel,
    während Ihr Kapital über den ETF-Sparplan systematisch und kosteneffizient (Ausführungsgebühr
    0 €) am Kapitalmarkt investiert wird. Details zur Verzinsung finden Sie auch im
    Dokument „Kranich Depot — Zinsübersicht“. '
