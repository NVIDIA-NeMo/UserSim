- id: e95dedd7-6c23-56e7-ac4a-687c0bd7c3cd
  title: ETF-Sparplan — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter zur Klärung von
    Grenzfallen und Einschränkungen beim ETF-Sparplan.


    Kernspezifikationen und Limits:


    * Mindestanlage: Der ETF-Sparplan kann erst ab einem Betrag von 10 € pro Monat
    eingerichtet werden. Beträge darunter sind technisch nicht ausführbar.

    * Kostenstruktur: Die Ausführung eines Sparplans ist mit 0 € kostenfrei. Dies
    unterscheidet sich von Einzelorders, die einer fixen Gebühr unterliegen.

    * Verrechnungskonto: Für die Ausführung des Sparplans muss zum Zeitpunkt der Ausführung
    ein ausreichendes Guthaben auf dem Verrechnungskonto vorhanden sein. Ist dies
    nicht der Fall, wird der Vorgang nicht ausgeführt.


    Sonderfälle und regulatorische Einschränkungen:


    * Geeignetheitsprüfung: Gemäß MiFID II muss vor dem Abschluss eines Sparplans
    die Angemessenheits- und Geeignetheitsprüfung erfolgreich durchlaufen sein. Ohne
    ein aktuelles Kundenprofil kann kein Sparplan eingerichtet werden.

    * Sondervermögen: Kunden müssen darüber informiert werden, dass die im Rahmen
    des Sparplans erworbenen Wertpapiere als Sondervermögen gelten und somit rechtlich
    vom Institutsvermögen getrennt sind.

    * Anlegerentschädigung: Im Falle einer Insolvenz greift die gesetzliche Anlegerentschädigung,
    die 90 % des Schadens bis zu einem maximalen Betrag von 20.000 € abdeckt.


    Eskalationsmanagement:

    Bei komplexen Anfragen zur Depotführung oder bei regulatorischen Unklarheiten
    bezüglich MiFID II sind die Vorgänge über das definierte Eskalationsmanagement
    an die Fachabteilung Compliance weiterzuleiten.


    Regulatorischer Hinweis: Wir leisten keine individuelle Steuer- oder Rechtsberatung.
    Kunden sind auf die steuerlichen Auswirkungen ihrer Anlagen selbst hinzuweisen.'
