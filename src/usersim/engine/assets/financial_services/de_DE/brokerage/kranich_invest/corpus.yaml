- id: 833f19d7-6afb-5bd5-b155-e5416eaa783c
  title: ETF-Sparplan — Risikohinweise
  body: 'Die Nutzung eines ETF-Sparplans ist mit spezifischen Risiken verbunden, über
    die wir Sie im Rahmen der MiFID II-Richtlinien transparent informieren müssen.


    Marktrisiko und Kapitalverlust

    Anlagen in ETFs (Exchange Traded Funds) sind Finanzanlagen, deren Wert sich aus
    der Entwicklung der zugrunde liegenden Indizes ergibt. Es besteht kein Garantiezins
    und keine Garantie auf die Erhaltung des eingesetzten Kapitals. Kursschwankungen
    können dazu führen, dass der Wert Ihres Portfolios unter den ursprünglich investierten
    Betrag sinkt. Ein Totalverlust ist zwar bei breit gestreuten Indizes unwahrscheinlich,
    jedoch theoretisch möglich.


    Keine Renditegarantie

    Wir weisen explizit darauf hin, dass vergangene Wertentwicklungen keine Gewähr
    für zukünftige Renditen bieten. Wir leisten keine individuelle Anlageberatung,
    sondern bieten edukative Informationen und allgemeine Markteinblicke.


    Sicherheit der Verwahrung

    Um Ihr Risiko gegenüber dem Institut zu minimieren, werden alle Wertpapiere als
    Sondervermögen verwahrt. Das bedeutet, dass Ihre ETF-Anteile rechtlich vom Vermögen
    von Kranich Invest getrennt sind und im Falle einer Insolvenz nicht in die Insolvenzmasse
    fallen.


    Gesetzliche Absicherung

    Zusätzlich zur Sondervermögensstruktur greift bei entsprechenden Ereignissen die
    gesetzliche Anlegerentschädigung, die 90 % des Guthabens bis zu einem maximalen
    Betrag von 20.000 € absichert.


    Geeignetheitsprüfung

    Bevor Sie einen ETF-Sparplan abschließen, führen wir eine Angemessenheits- und
    Geeignetheitsprüfung durch. Dies dient dazu, sicherzustellen, dass das Produkt
    zu Ihrem Wissen, Ihrer finanziellen Situation und Ihren Anlagezielen passt.


    Regulatorische Disclaimer: Wir bieten keine Steuer- oder Rechtsberatung an. Bitte
    konsultieren Sie bei Bedarf einen qualifizierten Steuerberater oder Rechtsanwalt.'
