  mentions_tools: []
  institution_id: kranich_invest
- id: d2506bdb-3db7-508d-894b-633d7d5b00ce
  title: ETF-Sparplan — abschließen und aktivieren
  body: 'Um Ihren automatisierten Vermögensaufbau zu starten, folgen Sie bitte diesen
    Schritten. Bevor Sie beginnen, stellen Sie bitte sicher, dass Ihr Konto vollständig
    verifiziert ist und Sie bereits ein Wertpapierdepot bei Kranich Invest führen.


    1. **Auswahl des ETFs**: Teilen Sie uns mit, in welchen ETF oder welche Auswahl
    an ETFs Sie investieren möchten. Wir prüfen für Sie die Verfügbarkeit des Produkts
    im Rahmen unserer MiFID II-Richtlinien.

    2. **Festlegung des Sparbetrags**: Nennen Sie uns den gewünschten monatlichen
    Investitionsbetrag. Beachten Sie dabei, dass der Mindestbetrag pro Sparplanausführung
    10 € beträgt.

    3. **Wahl des Ausführungsintervalls**: Legen Sie fest, an welchem Tag des Monats
    die Ausführung erfolgen soll. Wir bestätigen Ihnen den nächsten möglichen Ausführungsdatum.

    4. **Prüfung und Bestätigung**: Wir senden Ihnen eine Zusammenfassung Ihrer Einstellungen
    (gewählter ETF, Betrag ab 10 €, Intervall und die Ausführungsgebühr von 0 €) zur
    finalen Bestätigung zu.

    5. **Aktivierung**: Nach Ihrer Zustimmung richten wir den Sparplan ein. Sie erhalten
    eine Benachrichtigung, sobald der Plan aktiv ist und die erste Ausführung terminiert
    wurde.


    Sie wissen, dass der Vorgang erfolgreich war, wenn der ETF-Sparplan in Ihrer Depotübersicht
    als „aktiv“ gekennzeichnet ist. Bitte stellen Sie sicher, dass zum Zeitpunkt der
    Ausführung ausreichend Guthaben auf Ihrem Verrechnungskonto vorhanden ist, um
    eine fehlgeschlagene Transaktion zu vermeiden.


    Weitere Informationen zu den Kosten finden Sie im Dokument „ETF-Sparplan — Preis-
    und Leistungsverzeichnis“. Eine Übersicht über die allgemeinen Voraussetzungen
    entnehmen Sie bitte dem Dokument „ETF-Sparplan — Voraussetzungen“. '
