- id: cb92fcf3-353e-580b-adc5-95811e3f8677
  title: 'ETF-Sparplan — Entgelt pro Sparplanausführung: Erklärung'
  body: 'Häufig gestellte Fragen zu den Kosten Ihres ETF-Sparplans


    Frage: Welche Gebühren fallen bei jeder Ausführung meines Sparplans an?

    Antwort: Bei Kranich Invest ist die Ausführung Ihres ETF-Sparplans kostenfrei.
    Das Entgelt pro Sparplanausführung beträgt 0 €, damit Ihr investiertes Kapital
    ohne unnötige Hürden wachsen kann.


    Frage: Gibt es einen Mindestbetrag, den ich investieren muss?

    Antwort: Ja, der Mindestbetrag pro Sparplanausführung liegt bei 10 €. Damit machen
    wir den Vermögensaufbau bereits für kleine Beträge zugänglich.


    Frage: Fallen neben der Ausführungsgebühr weitere Depotgebühren an?

    Antwort: Nein, die Depotführung ist bei uns grundsätzlich mit 0 € kostenfrei.
    Wir verfolgen eine Philosophie der Transparenz und fördern den langfristigen Vermögensaufbau.


    Weitere Informationen zu den Kosten finden Sie in den Dokumenten ETF-Sparplan
    — Preis- und Leistungsverzeichnis sowie ETF-Sparplan — Überblick.'
