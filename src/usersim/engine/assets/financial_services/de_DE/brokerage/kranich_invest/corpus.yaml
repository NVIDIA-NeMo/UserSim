- id: 949a83c7-699c-5316-8c38-8c90e80d98c9
  title: Kranich Kinderdepot — Risikohinweise
  body: 'Bevor Sie ein Kranich Kinderdepot eröffnen, ist es wichtig, die mit Wertpapieranlagen
    verbundenen Risiken vollständig zu verstehen. Wir agieren streng nach den Vorgaben
    der BaFin sowie MiFID II.


    **Kapitalverlustrisiko**

    Investitionen in Wertpapiere, einschließlich ETFs und Aktien, unterliegen Marktschwankungen.
    Dies bedeutet, dass der Wert der Anlagen steigen oder fallen kann. Es besteht
    das Risiko eines teilweisen oder vollständigen Verlusts des eingesetzten Kapitals.
    Eine Rendite wird nicht garantiert.


    **Sicherheit der Einlagen und Wertpapiere**

    * **Sondervermögen:** Alle Wertpapiere werden als Sondervermögen verwahrt. Das
    bedeutet, dass sie rechtlich vom Vermögen von Kranich Invest getrennt sind. Im
    Falle einer Insolvenz des Instituts fallen diese Wertpapiere nicht in die Insolvenzmasse
    und bleiben Eigentum des Kunden bzw. des Kindes.

    * **Anlegerentschädigung:** Gemäß den gesetzlichen Bestimmungen sind Ansprüche
    aus dem Verrechnungskonto durch die gesetzliche Anlegerentschädigung abgesichert.
    Diese deckt 90 % des Guthabens bis zu einem maximalen Betrag von 20.000 € ab.


    **Besonderheiten bei Kinderdepots**

    Die Anlageentscheidungen werden durch den gesetzlichen Vertreter getroffen. Bitte
    beachten Sie, dass die steuerliche Behandlung von Kapitalerträgen bei Minderjährigen
    spezifischen Regeln unterliegt. Wir leisten keine individuelle Steuer- oder Rechtsberatung.


    Für weitere Details zur Kostenstruktur verweisen wir auf das Dokument Kranich
    Kinderdepot — Preis- und Leistungsverzeichnis.


    *Regulatorischer Hinweis: Die Geeignetheits- und Angemessenheitsprüfung gemäß
    MiFID II dient Ihrem Schutz, schließt jedoch Marktrisiken nicht aus.*'
  domain: brokerage_investing
  product_category: kinderdepot
