- id: a9ded303-0460-5c02-b5e0-2aec91f3c3d7
  title: Kranich Depot — Überblick
  body: 'Willkommen bei Kranich Invest. Das Kranich Depot ist als zentraler Investment-Hub
    konzipiert, um privaten Anlegern einen transparenten und kosteneffizienten Zugang
    zu den Finanzmärkten zu ermöglichen. Unser Fokus liegt auf der Förderung eines
    langfristigen Vermögensaufbaus durch den Verzicht auf unnötige Hürden und versteckte
    Kosten.


    Die Kernvorteile des Kranich Depot im Überblick:


    *   **Kostentransparenz:** Wir verzichten vollständig auf Depotgebühren. Die jährliche
    Depotführung ist mit 0 € kostenfrei.

    *   **Planbare Orderkosten:** Statt prozentualer Gebühren, die bei steigenden
    Kursen teurer werden, setzen wir auf eine fixe Gebühr. Jede Order kostet lediglich
    1 €.

    *   **Attraktive Verzinsung:** Ihr nicht investiertes Kapital auf dem Verrechnungskonto
    arbeitet für Sie. Wir bieten einen Zinssatz von 2,25 % auf Guthaben bis zu einem
    Höchstbetrag von 50.000 €.

    *   **Steuerliche Vereinfachung:** Wir unterstützen Sie bei der Verwaltung Ihrer
    Kapitalerträge. Je nach Status können Sie einen Freistellungsauftrag für den Sparer-Pauschbetrag
    hinterlegen (1.000 € für Einzelpersonen, 2.000 € für Gemeinschaftsdepots).


    Sicherheit ist bei uns oberste Priorität. Ihre Wertpapiere werden als Sondervermögen
    verwahrt, was bedeutet, dass sie rechtlich strikt vom Institutsvermögen getrennt
    sind und im Falle einer Insolvenz nicht in die Insolvenzmasse fallen. Zusätzlich
    greift die gesetzliche Anlegerentschädigung, die 90 % des Guthabens bis zu einem
    Maximalbetrag von 20.000 € absichert.


    Wir agieren streng nach den Vorgaben der BaFin sowie MiFID II, um höchste Qualitätsstandards
    bei der Geeignetheits- und Angemessenheitsprüfung zu gewährleisten.


    *Hinweis: Der Handel mit Wertpapieren ist mit Risiken verbunden, einschließlich
    des möglichen Totalverlusts des eingesetzten Kapitals. Wir bieten edukative Informationen,
    jedoch keine individuelle Steuer- oder Rechtsberatung. Eine Rendite wird nicht
    garantiert.*


    Für detaillierte Preisinformationen besuchen Sie bitte das Dokument Kranich Depot
    — Preis- und Leistungsverzeichnis.'
  domain: brokerage_investing
  product_category: wertpapierdepot
  document_type: product_sheet
