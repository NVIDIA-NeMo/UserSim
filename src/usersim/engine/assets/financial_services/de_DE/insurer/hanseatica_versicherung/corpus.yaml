- id: f4b4ce10-8cc3-52e6-9d0c-9afc1c539d09
  title: Fondsgebundene Rentenversicherung — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Einrichtung einer Fondsgebundenen Rentenversicherung fundiert zu unterstützen.
    Ziel ist ein transparenter Onboarding-Prozess, der den Standard der hanseatischen
    Sorgfalt widerspiegelt.


    **Schritt 1: Bedarfsanalyse und Eignungsprüfung**

    Prüfen Sie zunächst, ob das Produkt für die allgemeine Zielgruppe des Kunden geeignet
    ist. Erklären Sie, dass es sich um einen flexiblen, fondsgebundenen Vermögensaufbau
    handelt. Weisen Sie darauf hin, dass wir keine individuelle Steuer- oder Rechtsberatung
    leisten und keine spezifische Wertentwicklung garantieren können.


    **Schritt 2: Festlegung der Beitragsstruktur**

    Klären Sie den Kunden über den Mindestbeitrag auf. Für die Fondsgebundene Rentenversicherung
    beträgt der Mindestbeitrag pro Monat 25 €. Ein niedrigerer Betrag ist systemseitig
    nicht möglich, um die administrative Solvenz zu gewährleisten.


    **Schritt 3: Transparenz über Kosten**

    Legen Sie die Kostenstruktur offen. Der Kunde muss über die effektiven Kosten
    in Höhe von 1,1 % pro Jahr informiert werden. Erläutern Sie zudem die Abschlusskosten:
    Diese sind durch eine Obergrenze von maximal 2,5 % der Beitragssumme
    gedeckelt, was eine faire und wettbewerbsfähige Kalkulation sicherstellt.


    **Schritt 4: Identitätsprüfung und KYC**

    Bevor der Vertrag finalisiert wird, muss eine eindeutige Identitätsprüfung erfolgen.
    Leiten Sie den Kunden durch den validierten KYC-Prozess oder die Multi-Faktor-Authentifizierung.
    Ohne diesen Schritt kann keine zustandsändernde Aktion (Vertragserstellung) durchgeführt
    werden.


    **Schritt 5: Dokumentation und Widerrufsbelehrung**

    Stellen Sie sicher, dass der Kunde die Unterlagen zur Rentenversicherung erhält.
    Informieren Sie ihn proaktiv über das 30-tägige Widerrufsrecht, das für Rentenprodukte
    gilt, sowie über die Datenschutzrichtlinien der Hanseatica Versicherung.


    Nach Abschluss des Prozesses erhält der Kunde Zugriff auf das Kundenportal, über
    das er seine Beitragszahlungen und die Wertentwicklung einsehen kann. Bei Fragen
    zu den Kosten verweisen Sie auf die entsprechende FAQ.'
