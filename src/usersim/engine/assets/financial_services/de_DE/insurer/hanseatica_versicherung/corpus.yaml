- id: 104d5872-7229-5ace-a4ce-f67dea15b6a6
  title: Hausratversicherung — fehlgeschlagener oder ausstehender Vorgang
  body: 'Sollten Sie während des Abschluss- oder Änderungsprozesses Ihrer Hausratversicherung
    auf Probleme stoßen, finden Sie hier die entsprechenden Lösungswege.


    **Symptom: Der Versicherungsabschluss wird als „ausstehend“ oder „fehlgeschlagen“
    angezeigt.**


    **Mögliche Ursachen:**

    - **Fehlgeschlagene Identitätsprüfung:** Die Multi-Faktor-Authentifizierung oder
    der KYC-Prozess wurde nicht erfolgreich abgeschlossen oder die Dokumente waren
    nicht validierbar.

    - **Unvollständige Objektdaten:** Es fehlen notwendige Angaben zur Wohnfläche,
    wodurch die Berechnung der Versicherungssumme (basierend auf 650 € pro m²) nicht
    abgeschlossen werden konnte.

    - **Zahlungsprobleme:** Der Erstbeitrag (z. B. die beispielhaften 96 € für 70
    m²) konnte nicht erfolgreich eingezogen werden.


    **Vorgehensweise zur Behebung:**

    1. **Prüfung der Authentifizierung:** Überprüfen Sie, ob Sie alle Schritte der
    Multi-Faktor-Authentifizierung in Ihrem Kundenportal bestätigt haben. Falls eine
    Fehlermeldung vorliegt, fordern Sie einen neuen Verifizierungscode an.

    2. **Vollständigkeit der Daten prüfen:** Stellen Sie sicher, dass alle Pflichtfelder
    zur Wohnfläche und zum Standort korrekt ausgefüllt sind.

    3. **Zahlungsmittel validieren:** Überprüfen Sie die hinterlegte Bankverbindung
    auf Korrektheit und ausreichende Deckung für den ausstehenden Beitrag.


    **Eskalationsweg:**

    Wenn die oben genannten Schritte nicht zur Lösung führen, wird der Vorgang durch
    unseren Service strukturiert an die jeweilige Fachabteilung und anschließend an
    das Beschwerdemanagement geleitet. Sie erhalten eine Bestätigung über die Fallnummer
    und eine geschätzte Bearbeitungszeit innerhalb von zwei Werktagen. Wir prüfen
    in diesem Fall manuell, ob ein technischer Fehler bei der Übermittlung der Daten
    vorlag oder ob zusätzliche Nachweise zur Identität erforderlich sind.'
  domain: insurance
  product_category: hausrat
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 6a8f82fb-43c5-5dee-9e8b-fbfdfcbbf056
  title: Hausratversicherung — Voraussetzungen
  body: 'Um eine Hausratversicherung bei der Hanseatica Versicherung abschließen zu
    können, müssen folgende Kriterien erfüllt sein:


    | Bedingung | Anforderung | Ergebnis |

    | :--- | :--- | :--- |

    | **Wohnsitz** | Gesetzlicher Wohnsitz innerhalb der Bundesrepublik Deutschland
    | Voraussetzung für Vertragsschluss |

    | **Objektstatus** | Eigennutzung oder rechtmäßige Mietnutzung der Räumlichkeiten
    | Versicherbarkeit des Hausrats gegeben |

    | **Identitätsnachweis** | Erfolgreicher Abschluss eines KYC-Prozesses inkl. Multi-Faktor-Authentifizierung
    | Zugang zur Police und Aktivierung möglich |

    | **Wohnfläche** | Angabe einer validen Quadratmeterzahl zur Berechnung der Versicherungssumme
    (650 €/m²) | Ermittlung der risikobasierten Prämie möglich |

    | **Zahlungsfähigkeit** | Nachweis eines gültigen SEPA-Lastschriftmandats | Aktivierung
    des Versicherungsschutzes |


    Kunden, die diese Kriterien erfüllen, erhalten einen transparenten Schutz, der
    im Standardfall bei 70 m² Wohnfläche eine Beispielprämie von 96 € aufweist und
    Fahrraddiebstahl bis 1.000 € abdeckt.'
  domain: insurance
  product_category: hausrat
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: dcd07e4e-cd29-5095-82fa-a2d85d461f6c
  title: Hausratversicherung — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Kunden fragen häufig nach dem Unterschied zwischen der Hausratversicherung
    und der Privathaftpflichtversicherung. Obwohl beide Produkte zur privaten Absicherung
    gehören, decken sie grundlegend unterschiedliche Risiken ab.


    **Hausratversicherung:**

    Dieses Produkt sichert Ihre eigenen materiellen Besitztümer gegen Gefahren wie
    Feuer, Einbruchdiebstahl oder Leitungswasser. Mit einer Kalkulationsbasis von
    650 € pro Quadratmeter und einem spezialisierten Schutz gegen Fahrraddiebstahl
    bis 1.000 € steht der Erhalt Ihres eigenen Vermögens im Vordergrund. Ein Beispielbeitrag
    für 70 m² liegt bei 96 € jährlich.


    **Privathaftpflicht Komfort:**

    Im Gegensatz dazu schützt die Privathaftpflicht Ihre finanziellen Mittel vor Forderungen
    Dritter, wenn Sie anderen einen Schaden zufügen. Hier geht es nicht um den Ersatz
    eigener Gegenstände, sondern um die Deckung von Haftpflichtansprüchen durch hohe
    Deckungssummen.


    **Empfehlung:**

    Die Hausratversicherung ist die richtige Wahl, wenn Sie Ihr Eigentum im Heim absichern
    möchten. Die Privathaftpflicht ist unverzichtbar, um Ihr Gesamtvermögen vor existenzbedrohenden
    Schadensersatzforderungen zu schützen. Für eine lückenlose Absicherung des privaten
    Bereichs empfehlen wir die Kombination beider Produkte. Weitere Details finden
    Sie unter Privathaftpflicht Komfort — Überblick.'
  domain: insurance
  product_category: hausrat
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1cc5f222-549d-5bf0-acbc-bbda2d28e4e4
  title: Hausratversicherung — rechtliche Hinweise
  body: 'Die Hausratversicherung der Hanseatica Versicherung unterliegt der strikten
    Aufsicht der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin) und wird
    in strikter Übereinstimmung mit dem Versicherungsvertragsgesetz (VVG) geführt.
    Wir verpflichten uns zu höchster Transparenz und Zuverlässigkeit in allen geschäftlichen
    Belangen.


    **Widerrufsrechte:**

    Gemäß den gesetzlichen Bestimmungen steht Ihnen ein Widerrufsrecht für Ihren Versicherungsvertrag
    zu. Dieses kann innerhalb von 14 Tagen nach Vertragsschluss ohne Angabe von Gründen
    ausgeübt werden. Die Frist beginnt mit dem Erhalt der Versicherungspolice und
    der entsprechenden Widerrufsbelehrung.


    **Prämienkalkulation und Solvenz:**

    Unsere Prämien, wie beispielsweise der Richtwert von 96 € für eine Wohnfläche
    von 70 m², sind risikobasiert kalkuliert. Die Gebühren dienen nicht nur der Deckung
    administrativer Kosten, sondern stellen die Einhaltung regulatorischer Sicherheitsmargen
    sicher, um eine dauerhafte Solvenz und höchste Leistungsqualität in jedem Schadenfall
    zu gewährleisten. Die Berechnung der Versicherungssumme erfolgt auf Basis von
    650 € pro Quadratmeter, um eine angemessene Absicherung ohne Unterversicherung
    zu gewährleisten.


    **Datenschutz und Identitätsprüfung:**

    Der Schutz Ihrer personenbezogenen Daten hat für uns höchste Priorität. Vor jeder
    zustandsändernden Aktion im Kundenportal oder dem Zugriff auf vertrauliche Vertragsdaten
    ist eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses zwingend erforderlich. Dies dient dem Schutz vor
    nicht autorisierten Zugriffen und Betrugsversuchen.


    **Haftungsausschluss:**

    Die Hanseatica Versicherung bietet edukative Erläuterungen zur Produktwahl an.
    Wir leisten jedoch ausdrücklich keine individuelle Steuer- oder Rechtsberatung.
    Die in diesem Dokument genannten Werte sind Richtwerte und stellen kein verbindliches
    Angebot dar. Wir halten uns an einen Standard der Sorgfalt, der die Eignung des
    Produkts für die allgemeine Zielgruppe priorisiert.'
