  institution_id: hanseatica_versicherung
- id: 88f70b98-a7f1-53b3-a502-2be9670ddcbd
  title: Fondsgebundene Rentenversicherung — Preis- und Leistungsverzeichnis
  body: 'Dieses Preis- und Leistungsverzeichnis dient als Referenz für die Kosten
    der Fondsgebundenen Rentenversicherung. Alle Beträge und Prozentsätze sind endgültig
    und transparent kalkuliert:


    - Mindestmonatlicher Beitrag: 25 €

    - Effektivkosten pro Jahr: 1,1 % (bezieht sich auf die Gesamtkostenquote des Produkts)

    - Abschlusskostenobergrenze: 2,5 % (maximal zulässiger Anteil der Beitragssumme
    für die Anschaffungskosten)


    Die Gebühren dienen der Deckung der administrativen Kosten sowie der Einhaltung
    der regulatorischen Sicherheitsmargen der BaFin. Eine detaillierte Erläuterung
    der Kosten finden Sie im Dokument Fondsgebundene Rentenversicherung — Überblick.'
