  institution_id: hanseatica_versicherung
- id: 836ecff2-2268-522a-946a-f652193c1b98
  title: Privathaftpflicht Komfort — Risikohinweise
  body: 'Im Rahmen Ihrer Entscheidung für die Privathaftpflicht Komfort weisen wir
    Sie auf folgende wichtige regulatorische und vertragliche Punkte hin:


    Die Deckungssumme von 20.000.000 € ist die absolute Höchstgrenze der Haftungsübernahme
    durch die Hanseatica Versicherung. Schäden, die über diesen Betrag hinausgehen,
    müssen in jedem Fall aus dem Privatvermögen beglichen werden.


    Bitte beachten Sie die vereinbarte Selbstbeteiligung von 150 €. Diese bedeutet,
    dass Sie bei jedem anerkannten Schadensfall den ersten Betrag bis zu dieser Höhe
    selbst tragen. Dies dient der Reduzierung von Kleinschäden und der Stabilisierung
    der Prämien für alle Versicherten.


    Ein wesentlicher Risikofaktor für den Versicherungsschutz ist die Verzögerung
    der Schadenmeldung. Wir fordern eine unverzügliche Schadenmeldung. Eine schuldhafte
    verspätete Meldung kann dazu führen, dass die Versicherung die Leistung kürzt
    oder in extremen Fällen ganz verweigert, sofern die verspätete Meldung die Prüfung
    des Schadens erschwert hat.


    Wir bieten edukative Erläuterungen zur Produktwahl an, leisten jedoch ausdrücklich
    keine individuelle Steuer- oder Rechtsberatung. Diese Dokumentation stellt kein
    verbindliches Angebot dar, sondern dient der Information über die Produktmerkmale.


    Weitere Informationen finden Sie in den Allgemeinen Geschäftsbedingungen unter
    Privathaftpflicht Komfort — Allgemeine Geschäftsbedingungen.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: d404d53b-2cb2-5097-8409-d80a2fc4efe0
  title: Privathaftpflicht Komfort — wie Zinsen berechnet und angewendet werden
  body: 'Im Rahmen der Privathaftpflicht Komfort handelt es sich um ein reines Risikoversicherungsprodukt.
    Im Gegensatz zu Renten- oder Lebensversicherungsprodukten gibt es bei der Privathaftpflicht
    keine Zinskomponente, keine Verzinsung von Beiträgen und keine Kapitalanlage.


    Die finanzielle Struktur gestaltet sich wie folgt:

    - Prämienberechnung: Die Beiträge (beispielhaft 59 € pro Jahr) werden risikobasiert
    kalkuliert. Sie basieren auf statistischen Wahrscheinlichkeiten für Schadensereignisse
    in der jeweiligen Nutzergruppe.

    - Anwendung: Die eingezahlten Prämien dienen der Deckung der potenziellen Schadensleistungen
    bis zur Deckungssumme von 20.000.000 € sowie der Deckung administrativer Kosten
    und regulatorischer Sicherheitsmargen.

    - Keine Zinsen: Da keine Rücklagen zur späteren Auszahlung gebildet werden, entfallen
    Zinsrechnungen oder Zinsgutschriften vollständig.


    Sollten Kunden Fragen zu verzinsten Produkten haben, verweisen wir auf unser Portfolio
    für die Altersvorsorge, wie beispielsweise die fondsgebundene Rentenversicherung.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 90d6d894-3153-5759-81a8-626395cb6128
  title: Privathaftpflicht Komfort — Empfehlungs- und Treueangebot
  body: 'Hanseatica Versicherung schätzt das Vertrauen, das uns der deutsche Mittelstand
    entgegenbringt. Um diese Partnerschaft zu vertiefen, bieten wir Ihnen unser aktuelles
    Empfehlungs- und Treueangebot an.


    Wenn Sie uns einem Partner oder Familienmitglied empfehlen und dieser einen Vertrag
    für die Privathaftpflicht Komfort abschließt, profitieren beide Seiten von unserer
    hanseatischen Zuverlässigkeit. Für den Zeitraum vom 01. Oktober 2024 bis zum 31.
    Dezember 2024 gilt für Neukunden ein attraktiver Einstieg: Ein beispielhafter
    Jahresbeitrag von 59 € ermöglicht den Zugang zu einem umfassenden Schutz Ihres
    Privatvermögens.


    Mit einer Deckungssumme von 20.000.000 € bietet dieser Tarif eine Sicherheit,
    die weit über den Standard hinausgeht, kombiniert mit einer transparenten Selbstbeteiligung
    von 150 €.


    Nutzen Sie diese Gelegenheit, um Ihre private Absicherung auf ein professionelles
    Fundament zu stellen. Wir laden Sie ein, die Details in unserem Dokument Privathaftpflicht
    Komfort — Überblick zu prüfen und die Sicherheit der Hanseatica Versicherung für
    sich zu gewinnen.'
