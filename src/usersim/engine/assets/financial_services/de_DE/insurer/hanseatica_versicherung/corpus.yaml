- id: cb9aa143-0d56-5da3-a49d-9948fe899ebb
  title: Fondsgebundene Rentenversicherung — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Altersvorsorge hat für Hanseatica Versicherung höchste
    Priorität. Da die Fondsgebundene Rentenversicherung langfristige Vermögenswerte
    repräsentiert, ist der Schutz vor unbefugtem Zugriff essenziell. Wir bitten Sie
    daher, die folgenden Sicherheitshinweise strikt zu beachten.


    Ein zentraler Pfeiler unserer Sicherheit ist die Multi-Faktor-Authentifizierung
    (MFA). Vor jeder zustandsändernden Aktion, wie etwa der Änderung Ihrer Bezugsrechte
    oder der Anpassung Ihres monatlichen Beitrags, ist eine eindeutige Identitätsprüfung
    zwingend erforderlich. Bitte geben Sie Ihre MFA-Codes niemals an Dritte weiter.
    Hanseatica Versicherung wird Sie niemals telefonisch oder per E-Mail dazu auffordern,
    Passwörter oder Sicherheitscodes preiszugeben.


    Seien Sie wachsam gegenüber Phishing-Versuchen. Betrüger versuchen oft, unser
    seriöses Erscheinungsbild zu imitieren, um an vertrauliche Daten zu gelangen.
    Prüfen Sie stets die Absenderadresse unserer E-Mails. Offizielle Mitteilungen
    erfolgen über unser gesichertes Kundenportal oder per Post. Sollten Sie eine Nachricht
    erhalten, die Sie zur dringenden Eingabe von Zugangsdaten auf einer externen Webseite
    auffordert, handelt es sich mit hoher Wahrscheinlichkeit um einen Betrugsversuch.


    Im Falle eines Verdachts auf Kontokompromittierung ist die unverzügliche Meldung
    an uns entscheidend. Informieren Sie uns sofort, wenn Ihnen ungewöhnliche Aktivitäten
    in Ihrem Depot auffallen oder wenn Sie Ihre Zugangsdaten verloren haben. Eine
    zeitnahe Meldung ist Voraussetzung, um mögliche Verluste zu begrenzen und betrügerische
    Transaktionen zu stoppen. Wir dokumentieren jeden Betrugsversuch konsequent und
    melden diese an die zuständigen Behörden, um die Integrität unserer Finanzprodukte
    zu gewährleisten.


    Zur Validierung Ihrer Identität setzen wir zudem einen zertifizierten KYC-Prozess
    (Know Your Customer) ein. Dies dient nicht nur der regulatorischen Compliance
    unter der Aufsicht der BaFin, sondern schützt primär Ihr Vermögen vor Identitätsdiebstahl.
    Wir danken Ihnen für Ihre Kooperation bei der Aufrechterhaltung dieser Sicherheitsstandards.'
  domain: insurance
  product_category: fondsrente
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 6b63d7e5-bf1c-56d9-b61d-479c77b29f30
  title: Fondsgebundene Rentenversicherung — Änderung der Bedingungen
  body: 'Die Geschäftsbeziehung zwischen Hanseatica Versicherung und dem Versicherungsnehmer
    basiert auf Transparenz und gegenseitiger Verpflichtung. In diesem Dokument werden
    die Modalitäten für Änderungen der Versicherungsbedingungen der Fondsgebundenen
    Rentenversicherung dargelegt.


    Hanseatica Versicherung behält sich das Recht vor, die Vertragsbedingungen unter
    Einhaltung der gesetzlichen Vorgaben und der Aufsicht der BaFin anzupassen. Änderungen
    betreffen insbesondere die Anpassung von Gebühren zur Deckung administrativer
    Kosten oder die Umsetzung neuer regulatorischer Sicherheitsmargen. Jede Änderung
    der Bedingungen wird dem Kunden schriftlich oder über das Kundenportal mit einer
    angemessenen Vorlaufzeit mitgeteilt.


    Im Falle einer Beitragserhöhung oder einer wesentlichen Änderung der Kostenstruktur,
    wie beispielsweise einer Anpassung der effektiven Kosten von derzeit 1,1 % pro
    Jahr, steht dem Versicherungsnehmer ein Sonderkündigungsrecht zu. Die Ausübung
    dieses Rechts muss innerhalb der in der Mitteilung genannten Frist erfolgen.


    Wir weisen ausdrücklich auf die bestehenden Widerrufsrechte hin: Für allgemeine
    Versicherungsverträge gilt eine Frist von 14 Tagen. Da die Fondsgebundene Rentenversicherung
    als Rentenprodukt eingestuft wird, beträgt das Widerrufsrecht in diesem spezifischen
    Fall 30 Tage ab Vertragsschluss. Die Ausübung des Widerrufs erfolgt ohne Angabe
    von Gründen.


    Die Kostenkalkulation bleibt risikobasiert. Die Abschlusskosten sind auf maximal
    2,5 % der Beitragssumme begrenzt. Diese Deckelung dient dem Schutz des Kunden vor unverhältnismäßigen Einstiegskosten
    und gewährleistet eine faire Preisgestaltung. Eine Überschreitung dieser Grenze
    ist ausgeschlossen.


    Die Beendigung des Vertrages kann durch den Versicherungsnehmer jederzeit erfolgen,
    wobei die Bedingungen für die Auszahlung des Fondsguthabens den allgemeinen Versicherungsbedingungen
    sowie den spezifischen Bestimmungen zur Rentenauszahlung unterliegen. Für die
    Abwicklung von Streitfällen aus Bedingungsänderungen verweisen wir auf die kostenlose
    Unterstützung durch den Versicherungsombudsmann, sofern kein konsensualer Lösungsweg
    gefunden wird.'
