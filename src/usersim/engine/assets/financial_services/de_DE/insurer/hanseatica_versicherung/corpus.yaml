- id: d6e740ff-2dc3-52cb-810d-3a301ed005f6
  title: Privathaftpflicht Komfort — fehlgeschlagener oder ausstehender Vorgang
  body: 'Wenn ein Antrag auf Abschluss der Privathaftpflicht Komfort nicht wie erwartet
    abgeschlossen wurde oder ein Vorgang ausstehend bleibt, liegt dies häufig an formalen
    Anforderungen im Rahmen unserer Sicherheits- und Compliance-Richtlinien.


    **Symptom: Der Antrag wird als ''ausstehend'' angezeigt oder eine Bestätigung
    fehlt.**


    **Mögliche Ursachen:**

    1. **Unvollständige Identitätsprüfung:** Die zwingend erforderliche Multi-Faktor-Authentifizierung
    oder der KYC-Prozess wurde nicht vollständig durchlaufen.

    2. **Fehlende Dokumentation:** Erforderliche Nachweise zur Risikoprüfung wurden
    nicht ausreichend übermittelt.

    3. **Prüfung der Anzeigepflicht:** Es liegen Unstimmigkeiten in den vorvertraglichen
    Angaben vor, die einer manuellen Prüfung bedürfen.


    **Lösungsschritte aus Kundensicht:**

    - Überprüfen Sie, ob Sie alle Schritte der Identitätsprüfung abgeschlossen haben.
    Falls eine Nachricht zur Multi-Faktor-Authentifizierung nicht ankam, bitten wir
    Sie, dies uns mitzuteilen, damit wir den Prozess neu anstoßen können.

    - Stellen Sie sicher, dass alle angeforderten Dokumente in lesbarer Form vorliegen.

    - Prüfen Sie Ihre Angaben zur vorvertraglichen Anzeigepflicht auf Vollständigkeit
    und Richtigkeit.


    **Eskalationsweg:**

    Sollte der Vorgang trotz dieser Prüfungen nicht abgeschlossen werden, leiten wir
    Ihr Anliegen strukturiert über die zuständige Fachabteilung an unser Beschwerdemanagement
    weiter. Wir werden Sie über den Fortschritt der Prüfung und die voraussichtliche
    Dauer der Bearbeitung informieren.


    Nach erfolgreicher Klärung erhalten Sie die Bestätigung Ihres Versicherungsschutzes
    mit der vereinbarten Deckungssumme von 20.000.000 € und der Selbstbeteiligung
    von 150 €. Für rechtliche Details siehe Privathaftpflicht Komfort — rechtliche
    Hinweise.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 70e7c68b-a593-539f-8741-ff39654fe7c2
  title: Privathaftpflicht Komfort — Voraussetzungen
  body: 'Die Aufnahme in die Privathaftpflicht Komfort setzt bestimmte Kriterien voraus,
    um eine faire und risikobasierte Kalkulation der Prämien zu gewährleisten.


    | Bedingung | Ergebnis / Auswirkung |

    | :--- | :--- |

    | Nachweis eines Wohnsitzes in Deutschland | Grundvoraussetzung für den Abschluss
    des Vertrages |

    | Vollständige Erfüllung der vorvertraglichen Anzeigepflicht | Voraussetzung für
    die volle Leistungszusage bei Schadensfall |

    | Erfolgreicher Abschluss des KYC-Prozesses / MFA | Zwingend erforderlich für
    die Aktivierung des Versicherungsschutzes |

    | Akzeptanz der Selbstbeteiligung von 150 € | Bedingung für die Nutzung des Komfort-Tarifs
    |

    | Zustimmung zur risikobasierten Prämie (z.B. 59 € Beispielwert) | Grundlage für
    den Vertragsschluss |


    Bei Nichterfüllung der Identitätsprüfung kann der Vertrag nicht aktiviert werden.
    Für weitere Informationen zu den Bedingungen schauen Sie bitte in Privathaftpflicht
    Komfort — Überblick.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: eligibility_matrix
  source_authority: official
