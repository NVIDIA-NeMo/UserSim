- id: fa74654e-a00b-59b5-812d-bc9cfed12af0
  title: Hausratversicherung — Empfehlungs- und Treueangebot
  body: 'Hanseatica Versicherung schätzt das Vertrauen, das Sie in unsere hanseatische
    Zuverlässigkeit setzen. Um diese Partnerschaft zu honorieren, bieten wir Ihnen
    und Ihren Empfehlungen ein besonderes Treueangebot an.


    Wenn Sie einen neuen Kunden erfolgreich an unsere Hausratversicherung vermitteln,
    erhalten beide Parteien eine einmalige Prämie in Höhe von 25 € als Dankeschön.
    Dieses Angebot gilt für alle Abschlüsse, die im Zeitraum vom 01. Oktober 2024
    bis zum 31. Dezember 2024 erfolgen. Zudem gewähren wir Bestandskunden, die seit
    mehr als drei Jahren bei uns versichert sind, bei Abschluss einer zusätzlichen
    Police einen Treuerabatt von 5 % auf die erste Jahresprämie.


    Die Hausratversicherung bietet Ihnen einen umfassenden Schutz Ihres Eigentums,
    inklusive eines spezialisierten Schutzes gegen Fahrraddiebstahl bis zu einem Betrag
    von 1.000 €. Wir laden Sie ein, die Sicherheit Ihres Heims mit einem Partner zu
    gewährleisten, der für Transparenz und Fairness steht.


    Dieses Angebot ist nicht mit anderen Rabattaktionen kombinierbar.'
  domain: insurance
