  institution_id: hanseatica_versicherung
- id: a25a5424-5c1e-5456-8adf-214b4fbcb40a
  title: Privathaftpflicht Komfort — Datenschutz und Datenverarbeitung
  body: 'Hanseatica Versicherung handelt unter strikter Aufsicht der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin) und verpflichtet sich zur Einhaltung
    aller datenschutzrechtlichen Vorgaben der DSGVO sowie des Versicherungsvertragsgesetzes.


    Im Rahmen Ihres Vertrages zur Privathaftpflicht Komfort verarbeiten wir personenbezogene
    Daten, um die risikobasierte Kalkulation Ihrer Prämie (Beispiel: 59 €) vorzunehmen
    und die Leistungsfähigkeit im Schadenfall sicherzustellen. Die Verarbeitung erfolgt
    transparent und ausschließlich zu den Zwecken der Vertragsabwicklung, der Betrugsprävention
    und der Erfüllung regulatorischer Anforderungen.


    Besondere Datenschutzaspekte:

    - Identitätsprüfung: Vor jedem Zugriff auf vertrauliche Daten oder zustandsändernden
    Aktionen führen wir eine Multi-Faktor-Authentifizierung oder einen validierten
    KYC-Prozess durch. Dies dient Ihrem Schutz vor Identitätsdiebstahl.

    - Datenweitergabe: Daten werden nur an Dritte weitergegeben, wenn dies zur Schadensregulierung
    (z. B. mit gegnerischen Versicherungen) oder aufgrund gesetzlicher Pflichten zwingend
    erforderlich ist.

    - Widerrufs- und Löschrechte: Sie haben ein allgemeines Widerrufsrecht von 14
    Tagen ab Vertragsschluss. Ihr Recht auf Auskunft und Löschung Ihrer Daten bleibt
    im Rahmen der gesetzlichen Aufbewahrungsfristen gewahrt.


    Wir weisen darauf hin, dass die hohe Deckungssumme von 20.000.000 € und die Selbstbeteiligung
    von 150 € feste Bestandteile der vertraglichen Vereinbarung sind und in unseren
    Systemen als Basis für die Risikobewertung hinterlegt werden.


    Wir bieten edukative Erläuterungen zu unseren Produkten, leisten jedoch keine
    individuelle Steuer- oder Rechtsberatung. Für weitere rechtliche Hinweise konsultieren
    Sie bitte Privathaftpflicht Komfort — rechtliche Hinweise.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: disclosure
  source_authority: official
