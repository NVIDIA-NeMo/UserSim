- id: 26ceb4d0-f359-522d-a516-0446356c4132
  title: Kfz-Versicherung — abschließen und aktivieren
  body: 'Wenn Sie sich für die Kfz-Versicherung der Hanseatica Versicherung entscheiden,
    führen wir Sie durch einen strukturierten Prozess, um Ihren Versicherungsschutz
    zeitnah und rechtssicher zu aktivieren.


    **Voraussetzungen für den Abschluss**

    Bevor Sie den Prozess starten, halten Sie bitte folgende Informationen bereit:
    die Zulassungsbescheinigung Teil I (Fahrzeugschein), Ihren gültigen Führerschein
    sowie die Angaben zu allen Personen, die das Fahrzeug regelmäßig führen werden.


    **Schritt-für-Schritt-Anleitung**


    1. **Datenübermittlung**: Teilen Sie uns die Fahrzeugdetails sowie Ihr gewünschtes
    Deckungsniveau (Haftpflicht, Teilkasko oder Vollkasko) mit. Wir prüfen daraufhin
    Ihre Angaben im Rahmen unseres KYC-Prozesses.

    2. **Angebotserhalt**: Wir erstellen Ihnen ein individuelles, risikobasiertes
    Angebot. In diesem Dokument finden Sie Ihre exakte Prämie sowie die vereinbarte
    Selbstbeteiligung (z. B. 300 € bei Vollkasko oder 150 € bei Teilkasko).

    3. **Bestätigung und Identitätsprüfung**: Bestätigen Sie das Angebot. Zur finalen
    Aktivierung führen wir eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    durch.

    4. **Erhalt der eVB-Nummer**: Nach erfolgreichem Abschluss lassen wir Ihnen die
    elektronische Versicherungsbestätigung (eVB-Nummer) zukommen. Diese ist zwingend
    erforderlich, um Ihr Fahrzeug bei der zuständigen Zulassungsstelle anzumelden.

    5. **Zulassung und Aktivierung**: Sobald die Zulassungsstelle die eVB-Nummer im
    System validiert hat, ist Ihr Versicherungsschutz aktiv. Wir senden Ihnen im Anschluss
    Ihre Versicherungspolice zu.


    **Abschluss des Vorgangs**

    Der Prozess ist erfolgreich beendet, wenn Sie die Zulassungsbescheinigung Ihres
    Fahrzeugs erhalten haben und uns die Kopie der Anmeldung vorliegen lassen. Beachten
    Sie, dass Sie ein gesetzliches Widerrufsrecht von 14 Tagen ab Vertragsschluss
    haben.


    Für weitere Informationen zu den Voraussetzungen besuchen Sie bitte Kfz-Versicherung
    — Voraussetzungen.'
