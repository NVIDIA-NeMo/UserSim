- id: 5779301a-d99c-5e27-b2cd-c0a7f8f7785e
  title: Berufsunfähigkeitsversicherung — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem bestehenden Vertrag vornehmen möchten, etwa
    die Erhöhung der monatlichen Rentenleistung oder die Änderung Ihrer Kontaktdaten,
    führen Sie bitte die folgenden Schritte aus:


    1. Mitteilung des Änderungswunsches: Teilen Sie uns mit, welchen Teil Ihres Vertrages
    Sie anpassen möchten. Wenn Sie beispielsweise die monatliche Rente von 1.500 €
    auf einen höheren Betrag anheben möchten, nennen Sie uns die gewünschte Zielsumme.


    2. Identitätsprüfung: Da es sich um eine zustandsändernde Aktion handelt, führen
    wir eine zwingend erforderliche Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines KYC-Prozesses durch. Bitte halten Sie Ihr für die Verifizierung benötigtes
    Gerät bereit.


    3. Prüfung der Voraussetzungen: Bei einer Erhöhung der Rentenleistung prüfen wir
    im Rahmen der Risikoanalyse, ob neue Gesundheitsangaben erforderlich sind, da
    die vorvertragliche Anzeigepflicht auch bei Vertragsänderungen eine Rolle spielt.


    4. Anpassung der Prämie: Wir berechnen Ihnen den neuen, risikobasierten Beitrag.
    Beachten Sie, dass eine höhere Rente zu einer Steigerung des Beitrags führt (zum
    Beispiel über den Beispielwert von 68 € hinaus).


    5. Bestätigung: Wir senden Ihnen die geänderten Vertragsbedingungen und die neue
    Beitragsübersicht digital über das Kundenportal zu. Sobald Sie diese erhalten
    haben, ist die Änderung erfolgreich abgeschlossen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1e05a159-5dcc-59c6-a0bf-b54344cd156f
  title: Berufsunfähigkeitsversicherung — Probleme mit Zugang oder Login
  body: 'Wenn Sie Probleme beim Zugriff auf Ihr Kundenportal haben, um Ihre Unterlagen
    zur Berufsunfähigkeitsversicherung einzusehen, prüfen Sie bitte die folgenden
    Punkte in der genannten Reihenfolge:


    Symptom: Fehlermeldung beim Login oder Zugriff verweigert.


    1. Überprüfung der Zugangsdaten: Stellen Sie sicher, dass Benutzername und Passwort
    korrekt eingegeben wurden. Beachten Sie die Groß- und Kleinschreibung.


    2. MFA-Prüfung: Prüfen Sie, ob Sie den Code der Multi-Faktor-Authentifizierung
    korrekt und innerhalb des Zeitfensters eingegeben haben. Stellen Sie sicher, dass
    Ihr verknüpftes Gerät Empfang hat.


    3. Browser-Cache: Leeren Sie den Cache Ihres Browsers oder versuchen Sie den Zugriff
    über ein privates Fenster (Inkognito-Modus), um lokale Fehlerquellen auszuschließen.


    Wenn diese Schritte nicht zum Erfolg führen, wenden Sie sich bitte an uns. Wir
    werden dann folgende Maßnahmen einleiten:


    Wir führen eine erneute, strikte Identitätsprüfung durch, um sicherzustellen,
    dass nur Sie Zugriff auf Ihre vertraulichen Daten haben. Im Anschluss setzen wir
    Ihren Zugang zurück oder aktualisieren Ihre hinterlegten Sicherheitsmerkmale.
    Sie erhalten eine Bestätigung über die Wiederherstellung Ihres Zugangs direkt
    an Ihre hinterlegte E-Mail-Adresse. Sollten technische Störungen auf unserer Seite
    vorliegen, wird Ihr Anliegen strukturiert an die entsprechende Fachabteilung und
    gegebenenfalls an das Beschwerdemanagement geleitet.'
