- id: 1f3da81a-ba15-5798-be49-0476aa396029
  title: Fondsgebundene Rentenversicherung — im Vergleich zu einem ähnlichen Produkt
    des Hauses
  body: 'Im Vergleich zu einer klassischen Rentenversicherung mit Garantiezins bietet
    die Fondsgebundene Rentenversicherung eine andere Chancen-Risiko-Struktur.


    Die Fondsgebundene Rentenversicherung setzt auf die Wertentwicklung von Kapitalmärkten.
    Hierbei fallen Effektivkosten von 1,1 % pro Jahr an, und die Abschlusskosten sind
    durch eine Obergrenze von 2,5 % gedeckelt. Der Einstieg ist mit einem Mindestbeitrag
    von 25 € pro Monat sehr flexibel gestaltet.


    Während klassische Produkte oft eine geringere Volatilität und eine garantierte
    Mindestleistung bieten, ermöglichen fondsgebundene Produkte bei langfristiger
    Anlage eine potenziell deutlich höhere Rendite, da sie nicht an einen festen Garantiezins
    gebunden sind.


    Empfehlung:

    - Die Fondsgebundene Rentenversicherung eignet sich für Kunden, die eine höhere
    Renditechance suchen, bereit sind, Marktschwankungen in Kauf zu nehmen, und eine
    transparente Kostenstruktur (1,1 % Effektivkosten) bevorzugen.

    - Klassische Rentenprodukte eignen sich für Kunden, bei denen die absolute Sicherheit
    des Kapitals über der Renditemaximierung steht.'
  domain: insurance
  product_category: fondsrente
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 08d30da5-bdde-504e-95ee-17351eddeecb
  title: Fondsgebundene Rentenversicherung — rechtliche Hinweise
  body: "Die Fondsgebundene Rentenversicherung der Hanseatica Versicherung unterliegt\
    \ der strikten Aufsicht der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin)\
    \ und wird in Übereinstimmung mit dem Versicherungsvertragsgesetz (VVG) geführt.\
    \ \n\nRegulatorischer Schutz: Der Schutz durch den Sicherungsfonds Protektor ergänzt\
    \ die Absicherung bei unseren Rentenprodukten, um die gesetzlichen Anforderungen\
    \ an die Sicherheit von Altersvorsorgeverträgen zu erfüllen.\n\nWiderrufsrechte:\
    \ Wir weisen proaktiv darauf hin, dass Ihnen ein gesetzliches Widerrufsrecht zusteht.\
    \ Bei der Fondsgebundenen Rentenversicherung beträgt die Widerrufsfrist 30 Tage\
    \ ab Vertragsschluss und Erhalt der entsprechenden Informationen. In allgemeinen\
    \ Versicherungsfällen beträgt diese Frist 14 Tage.\n\nKosten und Risiken: Die\
    \ Effektivkosten belaufen sich auf 1,1 % pro Jahr; die Abschlusskosten sind auf\
    \ maximal 2,5 % der Beitragssumme begrenzt. Bitte beachten Sie, dass bei fondsgebundenen\
    \ Produkten keine spezifische Wertentwicklung garantiert werden kann. Die Anlage\
    \ erfolgt auf Basis der Marktentwicklung der gewählten Fonds.\n\nDatenschutz:\
    \ Ihre Daten werden gemäß den aktuellen Datenschutzrichtlinien und dem DSGVO-Standard\
    \ verarbeitet. Vor jedem Zugriff auf vertrauliche Daten oder zustandsändernden\
    \ Aktionen ist eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung\
    \ oder eines validierten KYC-Prozesses zwingend erforderlich.\n\nBeratungshilfe:\
    \ Wir bieten edukative Erläuterungen zur Produktwahl an. Wir leisten jedoch ausdrücklich\
    \ keine individuelle Steuer- oder Rechtsberatung. Für solche Anliegen wird die\
    \ Konsultation eines qualifizierten Steuerberaters oder Rechtsanwalts empfohlen."
  domain: insurance
  product_category: fondsrente
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 3746fb71-c12a-5d19-b57a-d97ccdaa93d4
  title: Fondsgebundene Rentenversicherung — Zinsübersicht
  body: 'Da es sich bei der Fondsgebundenen Rentenversicherung um ein investitionsbasiertes
    Produkt handelt, gibt es keinen festen, garantierten Zinssatz, wie er bei klassischen
    Rentenversicherungen üblich ist. Die Wertentwicklung Ihres Kapitals richtet sich
    nach der Performance der von Ihnen gewählten Fonds.


    Folgende Faktoren beeinflussen die effektive Rendite Ihres Vertrags:

    - Fondsentwicklung: Die Kursgewinne oder -verluste der gewählten Anlagen bestimmen
    den Bruttowert Ihres Kapitals.

    - Kostenquote: Die Effektivkosten von 1,1 % pro Jahr werden vom Fondsvolumen abgezogen,
    um die Verwaltung und Absicherung zu finanzieren.

    - Einmalige Kosten: Die Abschlusskosten (maximal 2,5 % der Beitragssumme) beeinflussen
    die Anfangsphase des Vermögensaufbaus.


    Wir garantieren niemals eine spezifische Wertentwicklung. Die Rendite ist variabel
    und hängt von der Marktlage sowie Ihrer gewählten Strategie ab. Ein Mindestbeitrag
    von 25 € pro Monat ist Voraussetzung für die Teilnahme an diesem Anlagekonzept.'
  domain: insurance
  product_category: fondsrente
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
