- id: 3bcd49d8-d60e-5623-b4b3-a68d77c05661
  title: Kfz-Versicherung — Risikohinweise
  body: 'Die Hanseatica Versicherung weist darauf hin, dass der Versicherungsschutz
    maßgeblich von der Richtigkeit der vom Versicherungsnehmer gemachten Angaben abhängt.
    Wir halten uns an einen Standard der Sorgfalt, der die Eignung des Produkts für
    die allgemeine Zielgruppe priorisiert.


    Ein wesentlicher Risikofaktor ist die Verletzung der vorvertraglichen Anzeigepflicht.
    Wenn relevante Informationen zum Fahrzeug oder zum Fahrer vorsätzlich oder fahrlässig
    verschwiegen werden, kann dies im Schadensfall zu einer Kürzung der Leistung oder
    zur Kündigung des Vertrages führen.


    Bitte beachten Sie, dass wir edukative Erläuterungen zur Produktwahl anbieten,
    jedoch ausdrücklich keine individuelle Steuer- oder Rechtsberatung leisten. Die
    Haftung für Schäden ist durch die gewählten Deckungssummen begrenzt. Eine Unterversicherung
    kann dazu führen, dass im Schadensfall nicht die volle Summe des entstandenen
    Schadens erstattet wird.


    Wir agieren unter strikter Aufsicht der BaFin und halten das Versicherungsvertragsgesetz
    ein. Das Widerrufsrecht beträgt allgemein 14 Tage nach Vertragsschluss. Für die
    Kfz-Versicherung gibt es keine Garantie auf eine spezifische Wertentwicklung,
    da es sich um eine reine Risikoversicherung handelt.


    Alle Prämien sind risikobasiert kalkuliert, um die Solvenz des Unternehmens und
    damit die Sicherheit Ihrer Ansprüche zu gewährleisten. Für weitere Details sehen
    Sie bitte in Kfz-Versicherung — Allgemeine Geschäftsbedingungen.'
  domain: insurance
  product_category: kfz
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: f939ddae-31fb-50f9-a023-94ada82a6dbe
  title: Kfz-Versicherung — wie Zinsen berechnet und angewendet werden
  body: 'Im Rahmen der Kfz-Versicherung handelt es sich nicht um ein kapitalbildendes
    Produkt; daher werden keine Zinsen im Sinne einer Rendite berechnet oder gutgeschrieben.
    Die finanzielle Struktur basiert auf risikobasierten Prämien.


    Die Berechnung der Beiträge erfolgt auf Grundlage eines individuellen Risikoprofils.
    Als illustratives Beispiel für die Preisgestaltung dient eine jährliche Prämie
    von 780 €. Dieser Betrag ist transparent kalkuliert und deckt sowohl das versicherte
    Risiko als auch die notwendigen administrativen Kosten sowie regulatorische Sicherheitsmargen
    ab.


    Änderungen an der Prämie können eintreten durch:

    - Eine Anpassung der Schadenfreiheitsklasse (SF-Klasse) nach einem Versicherungsjahr.

    - Die Änderung des Fahrzeugs oder des Fahrerkreises.

    - Gesetzliche Anpassungen der Haftpflichtvorgaben.


    Die Prämien dienen der Sicherstellung der dauerhaften Solvenz der Hanseatica Versicherung,
    um eine höchste Leistungsqualität im Schadenfall zu garantieren.'
  domain: insurance
  product_category: kfz
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 14a3632a-368a-5dcf-bd83-3ddb7570addd
  title: Kfz-Versicherung — Empfehlungs- und Treueangebot
  body: "Hanseatica Versicherung schätzt die Beständigkeit und das Vertrauen unserer\
    \ Kunden. Um diese hanseatische Zuverlässigkeit zu honorieren, bieten wir Ihnen\
    \ ein exklusives Treueangebot an. Wenn Sie uns als vertrauenswürdigen Partner\
    \ weiterempfehlen, gewähren wir sowohl Ihnen als auch der neu geworbenen Person\
    \ einen einmaligen Treuebonus in Höhe von 25 € auf die nächste Jahresprämie.\n\
    \nFür Neukunden, die ihre Kfz-Versicherung bis zum 31. Dezember 2024 bei uns abschließen,\
    \ reduzieren wir die erste Jahresprämie einmalig um 25 €. Als Orientierung dient\
    \ unser Beispieltarif mit einer jährlichen Prämie von 780 €, wodurch die effektive\
    \ Kostenbelastung im ersten Jahr auf 755 € sinkt. \n\nDieses Angebot ist zeitlich\
    \ begrenzt und gilt nur für Neuverträge sowie für bestehende Kunden, deren Vertrag\
    \ mindestens 12 Monate besteht. Bitte beachten Sie, dass dieses Angebot nicht\
    \ mit anderen Rabatten kombinierbar ist. Wir freuen uns darauf, Sie und Ihre Empfehlungen\
    \ in unserem Hause willkommen zu heißen."
  domain: insurance
  product_category: kfz
  document_type: promo_notice
  source_authority: official
