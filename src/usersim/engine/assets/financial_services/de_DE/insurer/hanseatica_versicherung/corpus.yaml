  institution_id: hanseatica_versicherung
- id: 03c105d6-d7a0-5cdd-b67d-362d485f6583
  title: Fondsgebundene Rentenversicherung — abschließen und aktivieren
  body: 'Der Abschluss einer Fondsgebundenen Rentenversicherung erfolgt in einem strukturierten
    Prozess, um eine optimale Eignung des Produkts für Ihre individuelle Situation
    sicherzustellen. Bitte folgen Sie diesen Schritten:


    1. Bedarfsanalyse und Produktauswahl: Sie teilen uns Ihre Ziele für die Altersvorsorge
    sowie Ihre Risikobereitschaft mit. Wir erläutern Ihnen die Funktionsweise der
    fondsgebundenen Anlage und die Kostenstruktur, einschließlich der Effektivkosten
    von 1,1 % und der Abschlusskostenobergrenze von 2,5 %.


    2. Antragstellung: Sie geben die gewünschte monatliche Beitragszahlung an, die
    mindestens 25 € betragen muss. Zudem legen Sie die anpassbaren Bezugsrechte fest,
    die definieren, wer im Leistungsfall oder bei einer vorzeitigen Auszahlung Anspruch
    auf das Kapital hat.


    3. Identitätsprüfung (KYC): Zur Einhaltung regulatorischer Vorgaben und zum Schutz
    vor Geldwäsche führen wir eine eindeutige Identitätsprüfung durch. Sie stellen
    uns hierfür die erforderlichen Dokumente zur Verfügung, welche wir über einen
    validierten KYC-Prozess prüfen.


    4. Zahlungseinrichtung: Sie benennen ein Bankkonto für den Einzug der monatlichen
    Beiträge. Wir bestätigen Ihnen den Eingang des Mandats und den Starttermin der
    ersten Beitragszahlung.


    5. Aktivierung und Bestätigung: Nach erfolgreicher Prüfung aller Unterlagen und
    der Identitätsverifizierung stellen wir den Vertrag aus. Sie erhalten die Versicherungsunterlagen
    sowie eine Bestätigung über die Aktivierung Ihres Vertrags.


    Nach Abschluss Ihres Vertrages steht Ihnen ein Widerrufsrecht von 30 Tagen zur
    Verfügung, wie es für Lebens- und Rentenversicherungen gesetzlich vorgesehen ist.
    Informationen hierzu finden Sie in der Dokumentation Fondsgebundene Rentenversicherung
    — rechtliche Hinweise.'
  domain: insurance
