- id: 484fc833-37f7-5e0c-a52a-d046fc771f3f
  title: Fondsgebundene Rentenversicherung — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Vertrag beenden oder an Ihre aktuelle Lebenssituation anpassen
    möchten, stehen Ihnen verschiedene Wege offen. Bitte beachten Sie, dass eine Kündigung
    bei fondsgebundenen Produkten je nach Marktlage zu Verlusten gegenüber den eingezahlten
    Beiträgen führen kann.


    Voraussetzungen für den Vorgang:

    - Ihr gültiges Identifikationsdokument (Personalausweis oder Reisepass).

    - Zugang zu Ihrem für die Multi-Faktor-Authentifizierung hinterlegten Gerät.


    Schritte zur Kündigung oder zum Tarifwechsel:


    1. Mitteilung des Wunsches: Teilen Sie uns mit, ob Sie den Vertrag vollständig
    kündigen, schließen oder in einen anderen verfügbaren Tarif wechseln möchten.

    2. Identitätsprüfung: Da es sich um eine zustandsändernde Aktion handelt, führen
    wir eine zwingende Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses durch.

    3. Prüfung der Fristen: Wir prüfen, ob ein Sonderkündigungsrecht vorliegt oder
    ob die regulären Kündigungsfristen eingehalten wurden. Bei Neuverträgen erinnern
    wir Sie gegebenenfalls an das 30-tägige Widerrufsrecht.

    4. Bestätigung und Abrechnung: Wir senden Ihnen eine schriftliche Bestätigung
    zu. Im Falle einer Kündigung erhalten Sie eine Aufstellung des aktuellen Rückkaufswertes
    sowie die Information über die Auszahlungsmodalitäten.


    Sie wissen, dass der Vorgang erfolgreich war, wenn Sie die entsprechende Bestätigung
    in Ihren Unterlagen erhalten und — im Falle einer Schließung — der entsprechende
    Betrag auf Ihr hinterlegtes Referenzkonto überwiesen wurde.'
