- id: b72283d8-f754-5a1d-b098-6b3d0de8698e
  title: Fondsgebundene Rentenversicherung — fehlgeschlagener oder ausstehender Vorgang
  body: "Sollten Sie während des Antrags- oder Aktivierungsprozesses Ihrer Fondsgebundenen\
    \ Rentenversicherung feststellen, dass ein Vorgang nicht abgeschlossen wurde oder\
    \ ausstehend bleibt, prüfen Sie bitte die folgenden Punkte:\n\nSymptom: Der Vertragsstatus\
    \ wird als 'ausstehend' angezeigt oder eine Bestätigung steht aus.\n\nWahrscheinliche\
    \ Ursachen:\n1. Unvollständige Identitätsprüfung: Die für den KYC-Prozess eingereichten\
    \ Dokumente waren nicht lesbar oder nicht vollständig, wodurch die obligatorische\
    \ Identitätsprüfung nicht abgeschlossen werden konnte.\n2. Fehlerhafte Zahlungsinformationen:\
    \ Die angegebene Bankverbindung konnte nicht validiert werden, oder der Mindestbeitrag\
    \ pro Monat wurde niedriger als die erforderlichen 25 € angesetzt.\n3. Fehlende\
    \ Unterschriften: Notwendige Dokumente wurden nicht vollständig unterzeichnet.\n\
    \nVorgehensweise zur Lösung:\n- Überprüfen Sie die eingereichten Identitätsnachweise\
    \ auf Gültigkeit und Lesbarkeit. Falls erforderlich, reichen Sie diese erneut\
    \ ein.\n- Kontrollieren Sie Ihre Beitragsangaben. Stellen Sie sicher, dass der\
    \ Betrag mindestens 25 € beträgt.\n- Prüfen Sie Ihre E-Mails auf Rückfragen unserer\
    \ Fachabteilung bezüglich fehlender Unterschriften oder Informationen.\n\nWenn\
    \ diese Prüfungen keine Lösung bringen, leiten wir den Vorgang strukturiert über\
    \ die entsprechende Fachabteilung an unser Beschwerdemanagement weiter. Sie erhalten\
    \ eine Rückmeldung über den Bearbeitungsstand innerhalb der regulären Geschäftszeiten\
    \ (MEZ). \n\nZusätzliche Informationen zu den rechtlichen Rahmenbedingungen finden\
    \ Sie unter Fondsgebundene Rentenversicherung — rechtliche Hinweise."
  domain: insurance
  product_category: fondsrente
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: d618e571-b025-54d7-9a56-8be236d2fc58
  title: Fondsgebundene Rentenversicherung — Voraussetzungen
  body: 'Die Annahme eines Vertrags für die Fondsgebundene Rentenversicherung erfolgt
    auf Basis der folgenden Voraussetzungen:


    | Bedingung | Erforderlicher Wert / Status | Ergebnis |

    | :--- | :--- | :--- |

    | Wohnsitz | Deutschland (DE) | Erforderlich für Vertragsabschluss |

    | Identitätsprüfung | Erfolgreicher Multi-Faktor-Authentifizierung / KYC-Prozess
    | Zwingend für Aktivierung |

    | Finanzielle Kapazität | Monatlicher Beitrag $\ge$ 25 € | Vertragsschluss möglich
    |

    | Alter | Gesetzliche Mindestvoraussetzungen für Versicherungsverträge | Vertragsschluss
    möglich |

    | Risikoprüfung | Vorvertragliche Anzeigepflicht erfüllt | Annahme durch Versicherung
    |


    Bei Nichterfüllung des Mindestbeitrags von 25 € kann kein Vertrag für dieses spezifische
    Produkt abgeschlossen werden.'
