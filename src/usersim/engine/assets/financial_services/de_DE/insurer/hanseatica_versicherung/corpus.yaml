- id: 234972e1-7305-51b9-a59a-e4b6f464c3a8
  title: Fondsgebundene Rentenversicherung — Probleme mit Zugang oder Login
  body: '**Symptom:**

    Ein Kunde berichtet: "Ich kann mich nicht in mein Kundenkonto einloggen, um meine
    Rentenvorsorge einzusehen", oder erhält eine Fehlermeldung bei der Multi-Faktor-Authentifizierung
    (MFA).


    **Mögliche Ursachen:**

    1. **Fehlerhafte MFA-Daten:** Der vom Kunden eingegebene Sicherheitscode ist abgelaufen
    oder falsch.

    2. **Veralteter KYC-Status:** Die Identitätsprüfung ist aufgrund regulatorischer
    Anforderungen der BaFin abgelaufen und muss erneuert werden.

    3. **Konto-Sperrung:** Das Konto wurde aufgrund mehrerer fehlgeschlagener Login-Versuche
    aus Sicherheitsgründen vorübergehend gesperrt.


    **Lösungswege (in dieser Reihenfolge zu prüfen):**


    1. **Überprüfung der MFA-Methode:** Bitten Sie den Kunden, zu prüfen, ob das Gerät
    für die MFA noch korrekt registriert ist. Wenn der Code nicht ankommt, lösen wir
    gemeinsam einen neuen Versand des Verifizierungscodes aus.


    2. **Manuelle Identitätsprüfung:** Sollte die automatisierte MFA fehlschlagen,
    führen wir eine manuelle Identitätsprüfung durch. Der Kunde muss hierzu aktuelle
    Validierungsunterlagen bereitstellen, um den KYC-Prozess erneut zu durchlaufen.


    3. **Entsperrung des Zugangs:** Wenn das Konto gesperrt ist, prüfen wir nach erfolgreicher
    Identifizierung die Sicherheitsprotokolle. Wir setzen den Zugang dann manuell
    zurück, nachdem wir sichergestellt haben, dass kein unbefugter Zugriff vorlag.


    **Eskalation:**

    Sollten diese Schritte nicht zur Lösung führen oder liegt ein systemischer Fehler
    im Portal vor, leiten wir den Fall strukturiert an die jeweilige Fachabteilung
    weiter. Von dort aus wird die Anfrage an unser Beschwerdemanagement geleitet,
    falls der Kunde mit der Dauer der Wiederherstellung unzufrieden ist.


    Der Kunde erhält eine Ticketnummer und eine verbindliche Rückmeldefrist (in der
    Regel innerhalb von drei Werktagen). Bei ausbleibendem Konsens über die Lösung
    eines technischen Problems weisen wir den Kunden aktiv auf den kostenlosen Versicherungsombudsmann
    hin.'
  domain: insurance
  product_category: fondsrente
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
