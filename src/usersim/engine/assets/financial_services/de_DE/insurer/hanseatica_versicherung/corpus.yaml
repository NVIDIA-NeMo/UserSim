- id: 8b92a115-ea75-5599-8d98-46f65ae86425
  title: Fondsgebundene Rentenversicherung — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die vertraglichen Grundlagen
    der Fondsgebundenen Rentenversicherung der Hanseatica Versicherung. Der Vertrag
    unterliegt der Aufsicht der BaFin und den Bestimmungen des Versicherungsvertragsgesetzes
    (VVG).


    1. Beiträge und Zahlungsmodalitäten: Der Versicherungsnehmer verpflichtet sich
    zur Zahlung der vereinbarten Prämien. Für dieses Produkt gilt ein Mindestbeitrag
    von 25 € pro Monat. Die Prämien sind risikobasiert und transparent kalkuliert,
    um die dauerhafte Solvenz und Leistungsqualität zu sichern. Gebühren dienen der
    Deckung administrativer Kosten und regulatorischer Sicherheitsmargen.


    2. Kostenstruktur: Die Effektivkosten pro Jahr werden mit 1,1 % angegeben. Um
    den Kunden beim Start nicht übermäßig zu belasten, ist die Obergrenze für die
    Abschlusskosten auf 2,5 % der Beitragssumme begrenzt.


    3. Widerrufsrechte: Gemäß den gesetzlichen Bestimmungen steht Ihnen ein Widerrufsrecht
    zu. Bei Rentenprodukten wie der Fondsgebundenen Rentenversicherung beträgt die
    Widerrufsfrist 30 Tage ab Vertragsschluss und Erhalt der Produktinformationen.


    4. Vertragliche Änderungen und Beendigung: Änderungen an den Vertragsbedingungen
    oder dem Tarif können nach schriftlicher Mitteilung durch den Versicherer erfolgen.
    Eine außerordentliche Beendigung (Sonderkündigungsrecht) ist beispielsweise nach
    einer Beitragserhöhung möglich.


    5. Datenschutz und Sicherheit: Der Zugriff auf vertrauliche Daten und die Durchführung
    von Änderungen erfordern zwingend eine erfolgreiche Identitätsprüfung via Multi-Faktor-Authentifizierung
    oder einen validierten KYC-Prozess.


    6. Haftung und Beratung: Die Hanseatica Versicherung bietet edukative Erläuterungen
    zur Produktwahl. Wir leisten jedoch keine individuelle Steuer- oder Rechtsberatung.'
