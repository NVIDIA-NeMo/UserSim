- id: 7ad6b679-6642-5dcc-a0fc-f6ca8272a7db
  title: Kfz-Versicherung — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf Versicherungsschutz oder eine spezifische
    Vertragsänderung abgelehnt oder der Vorgang gesperrt wird. Hier erfahren Sie,
    warum dies geschieht und wie Sie vorgehen sollten.


    **Symptome**

    Sie erhalten die Mitteilung, dass Ihr Antrag nicht bearbeitet werden konnte, Ihr
    Zugang gesperrt ist oder eine Änderung an Ihrer Kfz-Versicherung abgelehnt wurde.


    **Mögliche Ursachen**

    1. **Fehlgeschlagene Identitätsprüfung:** Die erforderliche Multi-Faktor-Authentifizierung
    oder der KYC-Prozess konnte nicht erfolgreich abgeschlossen werden.

    2. **Unvollständige Unterlagen:** Es fehlen zwingend erforderliche Dokumente,
    wie etwa die Zulassungsbescheinigung Teil I oder ein gültiger Führerscheinnachweis.

    3. **Risikoprofil:** Das Fahrzeug oder das Nutzungsprofil überschreitet die Annahmerichtlinien
    der Hanseatica Versicherung (z. B. extrem leistungsstarke Fahrzeuge ohne entsprechende
    Erfahrung des Fahrers).

    4. **Sicherheitsverdacht:** Es gibt Hinweise auf betrügerische Aktivitäten oder
    inkonsistente Angaben in den Antragsunterlagen.


    **Lösungsschritte**

    * **Prüfung der Identität:** Stellen Sie sicher, dass Sie alle Schritte der Identitätsprüfung
    korrekt durchlaufen haben. Falls ein Fehler auftrat, fordern Sie eine neue Verifizierung
    an.

    * **Dokumentenprüfung:** Gleichen Sie Ihre eingereichten Unterlagen mit der Liste
    der erforderlichen Dokumente ab. Reichen Sie fehlende Nachweise vollständig und
    gut lesbar ein.

    * **Korrektur von Angaben:** Überprüfen Sie Ihre Angaben zur Fahrzeugnutzung und
    zum Fahrerprofil auf Richtigkeit und Vollständigkeit.


    **Eskalation**

    Wenn die Ursache nicht unmittelbar ersichtlich ist, leiten wir den Vorgang strukturiert
    an die jeweilige Fachabteilung und unser Beschwerdemanagement weiter. Wir prüfen
    den Fall erneut und informieren Sie innerhalb der regulären Geschäftszeiten über
    die Entscheidung. Sollte kein Konsens erzielt werden, weisen wir Sie aktiv auf
    den kostenlosen Versicherungsombudsmann hin.'
  domain: insurance
  product_category: kfz
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1d1a1dca-721f-5fb7-9298-c6d014b27a1b
  title: Kfz-Versicherung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Ein Upgrade oder Wechsel des Tarifs innerhalb der Kfz-Versicherung ist dann
    sinnvoll, wenn sich Ihr Risikoprofil oder Ihr Vermögensstatus ändert.


    **Upgrade von Teilkasko auf Vollkasko**

    Ein Wechsel lohnt sich insbesondere bei Neuwagen oder Fahrzeugen mit hohem Marktwert.
    Während die Teilkasko nur bestimmte Ereignisse (z. B. Diebstahl, Glasbruch) abdeckt,
    schützt die Vollkasko auch vor selbstverschuldeten Unfällen und Vandalismus. Trotz
    der höheren Prämie ist die Sicherheit eines umfassenden Schutzes bei einem hohen
    Fahrzeugwert oft vorteilhafter, auch wenn die Vollkasko-Selbstbeteiligung mit
    300 € höher liegt als die Teilkasko-Selbstbeteiligung von 150 €.


    **Wechsel bei geänderter Nutzung**

    Wenn Sie Ihr Fahrzeug nicht mehr täglich für lange Pendlerstrecken nutzen, kann
    eine Anpassung der Kilometerleistung zu einer Prämiensenkung führen. Umgekehrt
    ist ein Upgrade zwingend erforderlich, wenn das Fahrzeug für gewerbliche Zwecke
    genutzt wird.


    **Empfehlung**

    * **Vollkasko** eignet sich für Besitzer hochwertiger Fahrzeuge, die ein Maximum
    an finanzieller Sicherheit wünschen.

    * **Teilkasko/Haftpflicht** ist die wirtschaftlichere Wahl für ältere Fahrzeuge,
    bei denen ein Totalschaden finanziell weniger schmerzt als die jährlichen Mehrkosten
    einer Vollkaskodeckung.'
  domain: insurance
  product_category: kfz
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 0671f116-d5cd-5d08-9667-2cbba24b23ce
  title: Kfz-Versicherung — Vergleich mit Alternativen und wann es nicht passt
  body: 'Die Kfz-Versicherung der Hanseatica Versicherung richtet sich an Fahrzeugbesitzer,
    die Wert auf hanseatische Zuverlässigkeit, Transparenz und eine seriöse Abwicklung
    legen. Im Vergleich zu anderen Marktteilnehmern setzen wir auf eine faire, risikobasierte
    Preisgestaltung statt auf kurzfristige Lockvogelangebote.


    **Vorteile gegenüber Alternativen**

    Viele Wettbewerber locken mit extrem niedrigen Einstiegspreisen, die jedoch durch
    eine Vielzahl von versteckten Zusatzgebühren oder sehr niedrigen Deckungssummen
    in der Haftpflicht erkauft werden. Wir hingegen bieten eine transparente Kalkulation.
    Beispielsweise liegt ein jährlicher Beispielbeitrag bei 780 €, wobei alle Kosten
    klar ausgewiesen sind. Unsere digitalen Prozesse ermöglichen eine schnelle Abwicklung,
    ohne dass die persönliche Betreuung und die Seriosität eines traditionellen Versicherers
    verloren gehen.


    **Wann unsere Kfz-Versicherung nicht passt**

    Es gibt Szenarien, in denen unser Produkt möglicherweise nicht die optimale Wahl
    ist:

    1. **Extreme Budgetoptimierung ohne Leistungswunsch:** Kunden, die ausschließlich
    den günstigsten Preis suchen und bereit sind, im Schadensfall sehr hohe Selbstbeteiligungen
    (weit über den üblichen 150 € oder 300 €) zu tragen oder auf essenzielle Zusatzleistungen
    zu verzichten, könnten bei spezialisierten Low-Cost-Anbietern fündig werden.

    2. **Spezialfahrzeuge:** Für extrem modifizierte Rennwagen oder Fahrzeuge, die
    ausschließlich für riskante Motorsport-Events genutzt werden, bieten wir keine
    Standarddeckung an. Hier ist eine spezialisierte Motorsportversicherung erforderlich.

    3. **Sehr geringe Laufleistungen:** Bei Fahrzeugen, die kaum bewegt werden (Sammlerstücke),
    können spezialisierte Oldtimer-Versicherungen mit anderen Bedingungsprofilen vorteilhafter
    sein.


    Wir empfehlen eine sorgfältige Prüfung Ihrer Anforderungen. Wenn Ihnen Verlässlichkeit
    und eine klare Kommunikation wichtiger sind als das letzte Cent-Ersparnis bei
    der Prämie, ist die Hanseatica Versicherung Ihr idealer Partner.'
  domain: insurance
  product_category: kfz
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 8e8a20a3-aa21-5427-9e78-c840f93f505d
  title: Kfz-Versicherung — Voraussetzungen und Abschluss
  body: 'Hier finden Sie die wichtigsten Informationen zum Abschluss Ihrer Kfz-Versicherung.


    **Welche Voraussetzungen müssen für den Abschluss erfüllt sein?**

    Für den Abschluss benötigen Sie eine gültige Fahrerlaubnis sowie die Fahrzeugidentifikationsdaten
    (aus der Zulassungsbescheinigung). Zudem ist eine wahrheitsgemäße Angabe zur Nutzung
    des Fahrzeugs und zum Fahrerprofil zwingend erforderlich.


    **Wie erhalte ich meine eVB-Nummer?**

    Nach dem erfolgreichen Abschluss und der Identitätsprüfung stellen wir Ihnen die
    elektronische Versicherungsbestätigung (eVB-Nummer) zeitnah zur Verfügung. Diese
    ist für die Zulassung Ihres Fahrzeugs bei der Kfz-Zulassungsstelle zwingend erforderlich.


    **Kann ich den Vertrag sofort kündigen?**

    Ja, Sie haben ein gesetzliches Widerrufsrecht von 14 Tagen ab Vertragsschluss,
    um den Vertrag ohne Angabe von Gründen zu stornieren. Weitere Informationen finden
    Sie unter Kfz-Versicherung — rechtliche Hinweise.'
  domain: insurance
  product_category: kfz
  document_type: faq
  source_authority: official
