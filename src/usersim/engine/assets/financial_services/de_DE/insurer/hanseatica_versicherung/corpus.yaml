- id: dce1eaaa-abab-5d2b-a58c-90192698c3a3
  title: Fondsgebundene Rentenversicherung — Betrugsmaschen rund um dieses Produkt
    erkennen
  body: 'Im Kontext der privaten Altersvorsorge gibt es verschiedene Betrugsmuster,
    die darauf abzielen, Anleger durch falsche Versprechen zu manipulieren. Wenn Sie
    verschiedene Optionen für Ihre Vorsorge vergleichen, sollten Sie besonders auf
    folgende Warnsignale achten:


    1. Versprechen garantierter Renditen: Seriöse Anbieter für fondsgebundene Produkte
    können aufgrund der Marktschwankungen niemals eine spezifische Wertentwicklung
    garantieren. Angebote, die eine „risikofreie“ hohe Rendite versprechen, sind fast
    immer betrügerisch. Die Hanseatica Versicherung leistet edukative Erläuterungen
    zur Produktwahl, garantiert jedoch niemals eine spezifische Wertentwicklung.


    2. Druck zur sofortigen Entscheidung: Betrüger nutzen oft eine künstliche Zeitnot,
    um Sie daran zu hindern, die Kostenstrukturen – wie etwa die Effektivkosten von
    1,1 % oder die Obergrenze der Abschlusskosten von 2,5 % – gründlich zu prüfen.
    Ein vertrauenswürdiger Partner gibt Ihnen stets den Raum für eine sorgfältige
    Prüfung.


    3. Ungewöhnliche Zahlungsaufforderungen: Wir werden Sie niemals auffordern, Beiträge
    auf private Konten oder über nicht verifizierte Drittanbieter zu überweisen. Alle
    Zahlungen erfolgen über die definierten, transparenten Prozesse unseres Hauses.


    4. Anfragen nach Zugangsdaten: Die Hanseatica Versicherung wird Sie niemals per
    E-Mail oder Telefon nach Ihrem Passwort oder Ihren Multi-Faktor-Authentifizierungscodes
    fragen. Diese Daten sind strikt vertraulich.


    Sollten Sie eine Kommunikation erhalten, die Ihnen verdächtig vorkommt, unterbrechen
    Sie den Kontakt sofort. Informieren Sie uns unverzüglich über Ihren gewohnten
    Kommunikationsweg. Wir dokumentieren Betrugsversuche konsequent und melden diese
    den zuständigen Behörden.


    Bitte beachten Sie, dass wir keine individuelle Steuer- oder Rechtsberatung anbieten.
    Für eine rechtlich verbindliche Prüfung Ihrer Situation empfehlen wir die Konsultation
    eines zertifizierten Fachberaters.'
  domain: insurance
  product_category: fondsrente
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e100ec26-828e-56cb-8c06-c82455078eb8
  title: Fondsgebundene Rentenversicherung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient der internen Unterstützung durch Support-Mitarbeiter,
    um Kunden über die Rahmenbedingungen der Fondsgebundenen Rentenversicherung transparent
    zu informieren.


    Finanzielle Rahmenbedingungen und Limits:

    Ein wesentlicher Einschränkungsfaktor ist der Mindestbeitrag pro Monat, der bei
    25 € liegt. Verträge, die unter diesen Betrag fallen oder bei denen die Beitragszahlung
    ausbleibt, können nicht in der vorgesehenen Form aufrechterhalten werden. In Bezug
    auf die Kosten ist die Obergrenze der Abschlusskosten auf 2,5 % der Beitragssumme
    festgesetzt, was eine transparente Kalkulation der initialen Kosten gewährleistet.


    Marktrisiken und Wertentwicklung:

    Da es sich um ein fondsgebundenes Produkt handelt, unterliegt das angesparte Kapital
    den Schwankungen der Finanzmärkte. Es besteht kein Garantiezins; die Wertentwicklung
    hängt von den gewählten Fonds ab. Es muss klargestellt werden, dass die Effektivkosten
    von 1,1 % die jährliche Rendite beeinflussen.


    Rechtliche Sonderfälle und Fristen:

    Gemäß den regulatorischen Vorgaben für Rentenprodukte gilt ein erweitertes Widerrufsrecht
    von 30 Tagen ab Vertragsschluss. Innerhalb dieser Frist kann der Kunde den Vertrag
    ohne Angabe von Gründen stornieren.


    Sonderfälle bei der Auszahlung:

    Die Bezugsrechte können anpassbar gestaltet werden, jedoch unterliegt jede Änderung
    der Begünstigten einer strikten Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses, um Missbrauch vorzubeugen.


    Compliance-Hinweis:

    Wir agieren unter strikter Aufsicht der BaFin und halten das Versicherungsvertragsgesetz
    ein. Bei Rentenprodukten wird der Schutz durch den Sicherungsfonds Protektor ergänzt.
    Wir leisten keine individuelle Steuer- oder Rechtsberatung.'
  domain: insurance
  product_category: fondsrente
  document_type: product_sheet
  source_authority: official
