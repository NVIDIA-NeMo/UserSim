  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: d4d58784-570f-5837-87d0-130cb5e1e950
  title: Kfz-Versicherung — Voraussetzungen
  body: 'Um eine Kfz-Versicherung bei der Hanseatica Versicherung abschließen zu können,
    müssen folgende Voraussetzungen erfüllt sein:


    | Bedingung | Erforderliche Nachweise / Status | Ergebnis |

    | :--- | :--- | :--- |

    | **Fahrerlaubnis** | Gültiger Führerschein der entsprechenden Klasse | Zulassung
    möglich |

    | **Fahrzeugbesitz** | Zulassungsbescheinigung Teil I (Fahrzeugschein) | Zulassung
    möglich |

    | **Identität** | Erfolgreicher KYC-Prozess / MFA-Prüfung | Vertragsschluss möglich
    |

    | **Zahlungsfähigkeit** | Validiertes Bankkonto für Prämienzahlung | Aktivierung
    möglich |

    | **Fahrzeugzustand** | Betriebsfähiges Fahrzeug gemäß Straßenverkehrsordnung
    | Deckung gewährleistet |


    Sollten eine dieser Voraussetzungen nicht erfüllt sein, kann eine Versicherung
    nicht aktiviert werden. Insbesondere die Identitätsprüfung ist gemäß unseren Sicherheitsrichtlinien
    zwingend erforderlich, bevor eine eVB-Nummer ausgestellt wird.'
  domain: insurance
  product_category: kfz
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 478d17cd-973e-5a3d-9a42-470195e3b047
  title: Kfz-Versicherung — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Kunden fragen häufig nach dem Unterschied zwischen unserer Kfz-Versicherung
    und der Privathaftpflichtversicherung. Obwohl beide Produkte das Prinzip der Haftungsübernahme
    verfolgen, gibt es fundamentale Unterschiede:


    **Kfz-Versicherung**

    - **Art**: Gesetzlich vorgeschrieben (Haftpflichtteil).

    - **Gegenstand**: Schäden, die spezifisch durch die Nutzung eines Kraftfahrzeugs
    entstehen.

    - **Besonderheiten**: Beinhaltet eine obligatorische eVB-Nummer für die Zulassung
    und bietet optionale Kaskodeckungen mit Selbstbeteiligungen von 150 € (Teilkasko)
    bis 300 € (Vollkasko).

    - **Zielgruppe**: Alle Halter von Kraftfahrzeugen.


    **Privathaftpflicht Komfort**

    - **Art**: Freiwillige Versicherung.

    - **Gegenstand**: Allgemeine private Haftpflichtschäden im Alltag (z. B. bei Personen-
    oder Sachschäden ohne Kfz-Bezug).

    - **Besonderheiten**: Deckt Schäden ab, die explizit NICHT durch die Kfz-Versicherung
    abgedeckt sind.

    - **Zielgruppe**: Personen, die ihr gesamtes Privatvermögen umfassend schützen
    möchten.


    **Empfehlung**

    Die Kfz-Versicherung ist eine rechtliche Notwendigkeit für jeden Fahrzeughalter.
    Die Privathaftpflicht ist hingegen eine dringende Empfehlung zur Ergänzung, da
    die Kfz-Versicherung keine privaten Schäden außerhalb des Straßenverkehrs abdeckt.
    Details finden Sie in der Privathaftpflicht Komfort — Überblick.'
  domain: insurance
  product_category: kfz
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 519e2ce9-c6a5-5daf-b29c-ec5b49eda3f5
  title: Kfz-Versicherung — rechtliche Hinweise
  body: 'Die Kfz-Versicherung der Hanseatica Versicherung unterliegt der strikten
    Aufsicht der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin) und wird
    in Übereinstimmung mit dem Versicherungsvertragsgesetz (VVG) geführt. Wir verpflichten
    uns zu einer transparenten und fairen Behandlung aller Versicherungsnehmer.


    **Widerrufsrechte**

    Gemäß den gesetzlichen Bestimmungen steht Ihnen ein allgemeines Widerrufsrecht
    von 14 Tagen ab dem Tag des Vertragsschlusses oder dem Erhalt der Versicherungsunterlagen
    zu. Die Ausübung dieses Rechts erfolgt ohne Angabe von Gründen.


    **Kündigungsfristen und Sonderkündigungsrechte**

    Die reguläre Kündigung des Vertrages ist unter Einhaltung der vertraglichen Fristen
    bis zum 30. November möglich. Darüber hinaus besteht ein Sonderkündigungsrecht,
    beispielsweise nach einer Beitragserhöhung oder im Falle eines eingetretenen Schadenfalls,
    sofern die Bedingungen des VVG hierfür erfüllt sind.


    **Prämien und Kosten**

    Unsere Prämien, wie etwa der beispielhafte Jahresbeitrag von 780 € für eine Vollkaskodeckung,
    sind risikobasiert kalkuliert. Gebühren dienen der Deckung administrativer Kosten
    und der Einhaltung regulatorischer Sicherheitsmargen, um die dauerhafte Solvenz
    des Instituts zu gewährleisten. Die vereinbarten Selbstbeteiligungen (z. B. 300
    € bei Vollkasko bzw. 150 € bei Teilkasko) sind fester Bestandteil des Versicherungsvertrages
    und reduzieren die Versicherungsleistung im Schadenfall entsprechend.


    **Datenschutz und Sicherheit**

    Wir verarbeiten personenbezogene Daten gemäß den geltenden Datenschutzrichtlinien.
    Vor jeder zustandsändernden Aktion oder dem Zugriff auf vertrauliche Daten ist
    eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses zwingend erforderlich.


    **Beschwerdemanagement**

    Beschwerden werden fair und zeitnah bearbeitet. Sollte kein Konsens erzielt werden,
    verweisen wir aktiv und kostenfrei an den Versicherungsombudsmann. Betrugsversuche
    werden konsequent dokumentiert und den zuständigen Behörden gemeldet.'
  domain: insurance
  product_category: kfz
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 0b322a88-34be-5df2-bde4-f93923bf754c
  title: Kfz-Versicherung — Zinsübersicht
  body: 'Im Gegensatz zu unseren Rentenprodukten handelt es sich bei der Kfz-Versicherung
    um ein reines Risikoversicherungsmodell. Daher gibt es im Rahmen dieses Produkts
    keine Zinsübersichten, Verzinsungen oder Renditechancen.


    Die von Ihnen gezahlten Prämien – beispielhaft 780 € für eine Vollkaskodeckung
    – dienen ausschließlich der Absicherung der vereinbarten Risiken sowie der Deckung
    der administrativen Kosten. Es findet kein Kapitalaufbau statt, und es werden
    keine Zinsen auf die eingezahlten Beiträge gutgeschrieben.


    Die Kalkulation folgt dem Prinzip der Risikobasierung. Das bedeutet, dass die
    Höhe der Prämie nicht durch einen Zinssatz, sondern durch statistische Wahrscheinlichkeiten
    und individuelle Risikomerkmale (z. B. Schadenfreiheitsklasse) bestimmt wird.
    Änderungen der Prämie erfolgen in der Regel jährlich auf Basis einer Neubewertung
    des Risikos oder bei einer Anpassung der allgemeinen Tarifbedingungen.'
  domain: insurance
  product_category: kfz
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 021d149b-ece7-5ab1-aac5-fdeee0bd3127
  title: Kfz-Versicherung — aktuelles Angebot
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    wir schätzen Ihre Treue zur Hanseatica Versicherung. Um Ihren umfassenden Schutz
    weiter zu optimieren, bieten wir Ihnen derzeit eine besondere Kondition an.


    **Ihr Treue-Angebot: Kombi-Vorteil**

    Wenn Sie Ihre bestehende Kfz-Versicherung bis zum 31.12.2024 mit einer Hausratversicherung
    kombinieren, gewähren wir Ihnen einen einmaligen Treuerabatt auf die Jahresprämie
    Ihrer Kfz-Versicherung.


    **Details des Angebots:**

    - **Gültigkeit**: Ab sofort bis zum 31.12.2024.

    - **Voraussetzung**: Abschluss eines neuen Hausratvertrags bei bestehender Kfz-Police.

    - **Vorteil**: Einmaliger Abzug von 50 € von der nächsten Jahresprämie (z. B.
    Reduzierung eines Beispielbeitrags von 780 € auf 730 €).


    Dieses Angebot ist nicht mit anderen Rabattaktionen kombinierbar. Bitte kontaktieren
    Sie uns für eine individuelle Berechnung Ihres kombinierten Versicherungsschutzes.
    Für weitere Details zum Kombinationsprodukt besuchen Sie bitte Hausratversicherung
    — Überblick.'
  domain: insurance
  product_category: kfz
  document_type: promo_notice
  source_authority: official
