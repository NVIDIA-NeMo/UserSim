- id: d0359d20-2d19-5d4f-abd5-4fe128321ee0
  title: 'Privathaftpflicht Komfort — Deckungssumme: Erklärung'
  body: 'Hier finden Sie Antworten zur Deckungssumme Ihres Tarifs Privathaftpflicht
    Komfort.


    Was bedeutet die Deckungssumme von 20.000.000 € konkret?

    Die Deckungssumme ist der maximale Betrag, den die Hanseatica Versicherung pro
    Schadensfall (oder Versicherungsperiode, je nach Vertrag) an den geschädigten
    Dritten zahlt. Mit 20.000.000 € sind Sie selbst gegen extrem hohe Forderungen
    abgesichert, wie sie beispielsweise nach einem schweren Verkehrsunfall mit dauerhafter
    Pflegebedürftigkeit des Opfers entstehen können.


    Ist eine so hohe Summe wirklich notwendig?

    In der modernen Rechtsprechung können Schadensersatzforderungen schnell in die
    Millionen gehen. Eine niedrige Deckungssumme könnte dazu führen, dass Sie die
    Differenz aus Ihrem Privatvermögen begleichen müssen. Die Summe von 20.000.000
    € stellt sicher, dass Ihr Vermögen auch bei katastrophalen Ereignissen geschützt
    bleibt.


    Wie wirkt sich die Selbstbeteiligung auf diese Summe aus?

    Die Selbstbeteiligung von 150 € ist der Betrag, den Sie im Schadensfall selbst
    tragen. Die Deckungssumme von 20.000.000 € bezieht sich auf die maximale Gesamtleistung
    des Versicherers über diesen Betrag hinaus.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 33cbee47-0526-5a7d-88e6-24d6353cd791
  title: Privathaftpflicht Komfort — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Vertrag der Privathaftpflicht Komfort kündigen, schließen
    oder in einen anderen Tarif wechseln möchten, führen Sie bitte die folgenden Schritte
    aus:


    1. Mitteilung der Absicht: Teilen Sie uns mit, ob Sie den Vertrag komplett kündigen,
    ihn zum nächstmöglichen Termin schließen oder in einen anderen Tarif wechseln
    möchten. Geben Sie dabei bitte Ihre Versicherungsnummer an.


    2. Identitätsprüfung: Da es sich um eine zustandsändernde Aktion handelt, werden
    wir eine Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder eines validierten
    KYC-Prozesses durchführen. Bitte bestätigen Sie die Anfrage über Ihr registriertes
    Endgerät oder reichen Sie die geforderten Nachweise ein.


    3. Prüfung der Fristen: Wir prüfen die Einhaltung der Kündigungsfristen. Beachten
    Sie, dass ein allgemeines Widerrufsrecht von 14 Tagen nach Vertragsschluss besteht.
    Falls ein Sonderkündigungsrecht vorliegt (z. B. nach einer Beitragserhöhung),
    teilen Sie uns dies bitte explizit mit.


    4. Bestätigung und Abschluss: Nach erfolgreicher Prüfung senden wir Ihnen eine
    schriftliche Bestätigung über das Enddatum Ihres aktuellen Vertrages sowie – im
    Falle eines Tarifwechsels – die neuen Konditionen zu.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, sobald Sie die entsprechende
    Bestätigung per E-Mail oder über Ihr Kundenportal erhalten haben. Für Informationen
    zum ursprünglichen Abschluss besuchen Sie bitte Privathaftpflicht Komfort — abschließen
    und aktivieren.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 66d6784d-36dc-56b5-9fb1-1536dee13a51
  title: Privathaftpflicht Komfort — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Symptom: Der Kunde bemerkt eine Abbuchung oder eine Forderung, die nicht
    mit dem erwarteten Jahresbeitrag von 59 € übereinstimmt.


    Mögliche Ursachen:

    1. Anwendung der Selbstbeteiligung: Im Falle eines gemeldeten und anerkannten
    Schadens wurde die vereinbarte Selbstbeteiligung von 150 € in Rechnung gestellt
    oder mit der Leistung verrechnet.

    2. Beitragsanpassung: Aufgrund einer allgemeinen Anpassung der Risikokalkulation
    oder einer Änderung der individuellen Risikostufe hat sich der Beitrag geändert.


    Prüfschritte für den Support-Agenten:

    1. Vertragsstatus prüfen: Liegt ein aktueller Schadenfall vor? Wenn ja, wurde
    die Selbstbeteiligung von 150 € bereits korrekt verrechnet?

    2. Beitragsverlauf analysieren: Gab es eine offizielle Benachrichtigung über eine
    Beitragsänderung?

    3. Abrechnungsdetails abgleichen: Entspricht der Betrag einer Nachzahlung oder
    einer Vorauszahlung für das nächste Versicherungsjahr?


    Lösung:

    - Bei Fehlern in der Abrechnung: Korrektur der Buchung und sofortige Benachrichtigung
    des Kunden.

    - Bei korrekten Beträgen: Erläuterung der Kostenbasis (z. B. Hinweis auf die Selbstbeteiligung)
    gegenüber dem Kunden.


    Eskalation:

    Sollte kein Konsens mit dem Kunden erzielt werden, wird der Vorgang strukturiert
    an die jeweilige Fachabteilung und anschließend an das Beschwerdemanagement geleitet.
    Wir weisen den Kunden in diesem Fall aktiv auf den kostenlosen Versicherungsombudsmann
    hin.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 509e9ed3-50e4-5411-a654-903b7afd9c2f
  title: Privathaftpflicht Komfort — erforderliche Unterlagen
  body: 'Um einen Vertrag für die Privathaftpflicht Komfort abzuschließen, sind folgende
    Unterlagen und Informationen zwingend erforderlich:


    | Erforderliche Angabe/Dokument | Zweck | Status |

    | :--- | :--- | :--- |

    | Gültiges Identitätsdokument (Personalausweis/Reisepass) | Durchführung des KYC-Prozesses
    & Identitätsprüfung | Zwingend |

    | Aktuelle Meldeadresse | Verifizierung des Wohnsitzes in Deutschland | Zwingend
    |

    | Angaben zur Haushaltszusammensetzung | Risikobasierte Kalkulation der Prämie
    (z. B. 59 € Beispiel) | Zwingend |

    | Bankverbindung (IBAN) | Einrichtung des Lastschriftverfahrens für Prämien |
    Zwingend |

    | Angaben zu bestehenden Versicherungen | Prüfung auf Doppelversicherungen / Vorversicherer
    | Optional |


    Alle Dokumente müssen in digitaler, lesbarer Form über das Kundenportal oder per
    E-Mail eingereicht werden. Die finale Genehmigung des Antrags erfolgt nach erfolgreicher
    Validierung der Identität.'
