  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: a89bd617-ab35-5b63-8b95-4ad8f29dd694
  title: Hausratversicherung — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer Daten hat bei der Hanseatica Versicherung höchste Priorität.
    Um den Zugriff auf Ihre vertraulichen Vertragsdaten der Hausratversicherung zu
    schützen, bitten wir Sie, die folgenden Sicherheitshinweise strikt zu beachten.


    Zunächst ist die Nutzung der Multi-Faktor-Authentifizierung (MFA) zwingend erforderlich.
    Vor jeder zustandsändernden Aktion — wie etwa der Änderung Ihrer Versicherungssumme
    oder der Anpassung Ihrer Bankverbindung — führen wir eine eindeutige Identitätsprüfung
    durch. Bitte seien Sie wachsam: Hanseatica Versicherung wird Sie niemals per E-Mail
    oder SMS dazu auffordern, Ihr Passwort oder Ihre MFA-Codes auf einer externen
    Webseite einzugeben.


    Ein häufiges Betrugsmuster ist das sogenannte Phishing, bei dem gefälschte Nachrichten
    an Kunden versandt werden, um an Zugangsdaten zu gelangen. Prüfen Sie stets den
    Absender und klicken Sie nicht auf verdächtige Links. Sollten Sie bemerken, dass
    unbefugte Personen Zugriff auf Ihr Konto erhalten haben, oder sollten Sie eine
    verdächtige Kommunikation erhalten, informieren Sie uns bitte unverzüglich. Eine
    Meldung innerhalb von 24 Stunden hilft uns, Ihr Konto präventiv zu sperren und
    den Schaden zu minimieren.


    Wir weisen darauf hin, dass Betrugsversuche konsequent dokumentiert und den zuständigen
    Behörden gemeldet werden. Die Einhaltung unserer KYC-Prozesse (Know Your Customer)
    dient nicht nur regulatorischen Anforderungen der BaFin, sondern ist Ihr primärer
    Schutz gegen Identitätsdiebstahl.


    Für weitere Details zu unseren Datenschutzrichtlinien besuchen Sie bitte das Dokument
    Hausratversicherung — Datenschutz und Datenverarbeitung.'
  domain: insurance
  product_category: hausrat
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: ff751c84-280b-58b2-91ca-8a7e1f49968b
  title: Hausratversicherung — Änderung der Bedingungen
  body: 'Im Rahmen der kontinuierlichen Anpassung an regulatorische Vorgaben der BaFin
    und zur Sicherstellung unserer dauerhaften Solvenz behält sich die Hanseatica
    Versicherung das Recht vor, die Bedingungen der Hausratversicherung zu ändern.


    Änderungen der Versicherungsbedingungen oder der Prämiengestaltung werden Ihnen
    schriftlich oder über das Kundenportal mit einer Vorlaufzeit von mindestens einem
    Monat mitgeteilt. Eine Erhöhung der risikobasierten Prämien kann erfolgen, wenn
    sich die statistischen Risiken signifikant ändern oder gesetzliche Anforderungen
    dies erzwingen. In einem solchen Fall steht Ihnen gemäß den geltenden Bestimmungen
    ein Sonderkündigungsrecht zu.


    Die Grundlage unserer Kalkulation bleibt transparent. So orientiert sich die Versicherungssumme
    beispielsweise an einem Standardwert von 650 € pro Quadratmeter Wohnfläche, um
    eine Unterversicherung zu vermeiden. Änderungen an diesen Referenzwerten werden
    transparent kommuniziert, damit Sie die Eignung Ihres Produkts jederzeit prüfen
    können.


    Sollten Sie mit einer Bedingungsänderung nicht einverstanden sein, können Sie
    den Vertrag innerhalb der genannten Frist kündigen. Wir agieren hierbei strikt
    nach dem Versicherungsvertragsgesetz (VVG).


    Bitte beachten Sie, dass Anpassungen an der Deckung, wie etwa die Erhöhung des
    Schutzes gegen Fahrraddiebstahl über den Standardwert von 1.000 € hinaus, einer
    neuen Risikoprüfung und einer entsprechenden Anpassung der Prämie bedürfen. Wir
    garantieren eine faire und transparente Abwicklung aller Vertragsanpassungen.'
  domain: insurance
  product_category: hausrat
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 070fe5b6-8be4-5777-8d6a-5103d12733cd
  title: Hausratversicherung — Schritt für Schritt starten
  body: 'Dieser Leitfaden unterstützt Support-Agenten bei der Begleitung von Neukunden
    durch den Onboarding-Prozess der Hausratversicherung. Ziel ist eine transparente
    und professionelle Einführung in den Versicherungsschutz.


    Schritt 1: Bedarfsanalyse und Flächenberechnung

    Erfragen Sie die Wohnfläche des Kunden. Erklären Sie, dass Hanseatica Versicherung
    zur Vermeidung von Unterversicherung eine Versicherungssumme von 650 € pro Quadratmeter
    empfiehlt. Berechnen Sie gemeinsam mit dem Kunden die notwendige Gesamtsumme.


    Schritt 2: Prüfung spezieller Deckungen

    Weisen Sie den Kunden auf den integrierten Schutz gegen Fahrraddiebstahl hin,
    der bis zu einem Betrag von 1.000 € greift. Klären Sie, ob dieser Rahmen für die
    vorhandenen Fahrräder ausreichend ist.


    Schritt 3: Prämienkalkulation

    Nutzen Sie die risikobasierten Kalkulationstools. Als Orientierung dient ein Beispielwert
    für eine Standardpolice von 96 € für die jährliche Prämie (je nach individuellem
    Risiko und Objektdaten).


    Schritt 4: Identitätsprüfung und Abschluss

    Leiten Sie den Kunden durch den KYC-Prozess. Erinnern Sie ihn daran, dass vor
    dem endgültigen Vertragsabschluss eine Multi-Faktor-Authentifizierung erforderlich
    ist. Weisen Sie explizit auf das Widerrufsrecht von 14 Tagen nach Vertragsschluss
    hin.


    Schritt 5: Dokumentenversand

    Nach erfolgreichem Abschluss erhält der Kunde die Police und die detaillierten
    Versicherungsbedingungen digital über das Kundenportal.


    Bei Fragen zur allgemeinen Struktur des Produkts verweisen Sie auf das Dokument
    Hausratversicherung — Überblick.'
