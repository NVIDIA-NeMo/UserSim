- id: 6fb6e408-bfe0-58cf-bdac-1e4547d938f9
  title: Berufsunfähigkeitsversicherung — Datenschutz und Datenverarbeitung
  body: 'Hanseatica Versicherung verarbeitet personenbezogene Daten im Rahmen der
    Berufsunfähigkeitsversicherung unter strikter Einhaltung der Datenschutz-Grundverordnung
    (DSGVO) und unter Aufsicht der BaFin. Aufgrund der Art des Produkts werden notwendigerweise
    besondere Kategorien personenbezogener Daten, insbesondere Gesundheitsdaten, verarbeitet.


    Diese Daten sind zwingend erforderlich, um die vorvertragliche Anzeigepflicht
    zu prüfen und die risikobasierte Kalkulation der Prämie (beispielsweise 68 €)
    sowie die spätere Leistungsprüfung (Berufsunfähigkeit ab 50 %) vorzunehmen. Die
    Verarbeitung erfolgt auf Basis des Versicherungsvertrags und zur Erfüllung rechtlicher
    Verpflichtungen.


    Zum Schutz Ihrer Daten ist vor jeder zustandsändernden Aktion oder dem Zugriff
    auf vertrauliche Informationen eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses obligatorisch. Wir gewährleisten durch moderne,
    digitale Prozesse eine sichere Speicherung Ihrer Informationen.


    Sie haben das Recht auf Auskunft, Berichtigung und Löschung Ihrer Daten, sofern
    keine gesetzlichen Aufbewahrungsfristen entgegenstehen. Wir weisen darauf hin,
    dass Rentenprodukte zudem durch den Sicherungsfonds Protektor ergänzt werden,
    um die langfristige Solvenz zu gewährleisten. Informationen zu Ihren Widerrufsrechten
    (30 Tage bei Rentenprodukten) finden Sie in den Vertragsunterlagen. Für weitere
    Fragen zur Datenverarbeitung wenden Sie sich bitte an unseren Datenschutzbeauftragten
    über die regulären Kommunikationskanäle während der Geschäftszeiten (MEZ).'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: cf0a8f45-67a4-5528-818e-55228cf5eb70
  title: Berufsunfähigkeitsversicherung — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Zuge des Vergleichs verschiedener Absicherungsmodelle für Ihre Erwerbsfähigkeit
    könnten Sie auf Angebote stoßen, die zu gut klingen, um wahr zu sein. Wir möchten
    Sie darauf hinweisen, dass insbesondere bei der Berufsunfähigkeitsversicherung
    gezielte Betrugsmaschen existieren, die wir gemeinsam mit Ihnen unterbinden wollen.


    Ein häufiges Warnsignal sind Angebote, die eine „garantierte Zusage ohne Gesundheitsprüfung“
    versprechen oder behaupten, dass eine Berufsunfähigkeit ab einem sehr geringen
    Grad ohne medizinische Nachweise sofort anerkannt wird. Seriöse Versicherer, einschließlich
    Hanseatica Versicherung, fordern stets eine sorgfältige vorvertragliche Anzeigepflicht
    ein, um eine dauerhafte Solvenz und die Leistungsqualität für alle Versicherten
    zu gewährleisten.


    Bitte beachten Sie: Wir werden Sie niemals dazu auffordern, Passwörter, TANs oder
    Ihre Multi-Faktor-Authentifizierungscodes per E-Mail oder Telefon an Dritte weiterzugeben.
    Jede zustandsändernde Aktion in Ihrem Vertrag erfordert eine eindeutige Identitätsprüfung
    mittels Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses. Wenn
    Ihnen ein Anbieter suggeriert, dass diese Sicherheitsmaßnahmen „umgangen“ werden
    können, um den Prozess zu beschleunigen, liegt ein erhebliches Sicherheitsrisiko
    vor.


    Sollten Sie eine verdächtige Nachricht erhalten haben oder den Verdacht hegen,
    dass Ihre Daten missbraucht wurden, melden Sie uns dies bitte unverzüglich. Wir
    dokumentieren Betrugsversuche konsequent und leiten diese an die zuständigen Behörden
    weiter.


    Zur rechtlichen Absicherung erinnern wir Sie an Ihr gesetzliches Widerrufsrecht:
    Sie können einen Versicherungsvertrag innerhalb von 14 Tagen (bzw. 30 Tagen bei
    Lebens- und Rentenversicherungen) ohne Angabe von Gründen stornieren. Dies gibt
    Ihnen die nötige Zeit, die Seriosität eines Angebots in Ruhe zu prüfen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: a4c508b2-3cc4-5ad0-b453-a5126c756cd8
  title: Berufsunfähigkeitsversicherung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Kommunikation
    von Leistungsgrenzen und Sonderfällen im Rahmen der Berufsunfähigkeitsversicherung.


    Die zentrale Leistungsvoraussetzung ist das Erreichen eines Grades der Berufsunfähigkeit
    von mindestens 50 %. Eine Leistungserbringung erfolgt nur dann, wenn die medizinische
    und berufliche Prüfung ergibt, dass die versicherte Person zu 50 % oder mehr dauerhaft
    an der Ausübung ihrer Tätigkeit gehindert ist. Ein geringerer Grad der Einschränkung
    führt nicht zum Eintritt der Versicherungsleistung.


    Besondere Aufmerksamkeit gilt der vorvertraglichen Anzeigepflicht. Wenn der Versicherungsnehmer
    Gesundheitsdaten oder berufliche Risiken im Antrag bewusst oder grob fahrlässig
    verschwiegen hat, kann dies zu einer Leistungskürzung oder zur vollständigen Ablehnung
    des Anspruchs führen. Dies dient dem Schutz der Gemeinschaft aller Versicherten
    und der Einhaltung regulatorischer Sicherheitsmargen unter BaFin-Aufsicht.


    Einschränkungen bestehen zudem in folgenden Sonderfällen:

    1. Vorsätzliche Herbeiführung der Berufsunfähigkeit: Schäden, die durch eine vorsätzliche
    Handlung des Versicherten verursacht wurden, sind nicht abgedeckt.

    2. Krieg und ähnliche Ereignisse: In den Versicherungsbedingungen sind spezifische
    Ausnahmen für außergewöhnliche globale Ereignisse definiert.

    3. Vorerkrankungen: Bestehende Leiden, die bereits zum Zeitpunkt des Vertragsabschlusses
    vorlagen und im Antrag nicht korrekt angegeben wurden, können ausgeschlossen sein.


    Bei komplexen Einzelfällen, in denen die 50 %-Hürde strittig ist, erfolgt die
    Prüfung über die jeweilige Fachabteilung. Sollte kein Konsens erzielt werden,
    ist der Kunde aktiv auf den kostenlosen Versicherungsombudsmann zu verweisen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 651d190c-c48b-5c6a-aad5-3bae8eb78664
  title: Berufsunfähigkeitsversicherung — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen unserer Berufsunfähigkeitsversicherung.


    **Wie hoch ist der Beitrag für diese Absicherung?**

    Die Prämien sind risikobasiert und transparent kalkuliert. Als Orientierungshilfe
    dient ein Beispielwert: Ein monatlicher Beitrag von 68 € kann je nach individuellen
    Risikofaktoren (wie Berufsgruppe, Alter und Gesundheitszustand) anfallen.


    **Wie setzen sich die Gebühren zusammen?**

    Die erhobenen Beiträge dienen primär der Deckung der versicherten Risiken sowie
    der administrativen Kosten. Dies stellt sicher, dass wir eine dauerhafte Solvenz
    und höchste Leistungsqualität gewährleisten können, während wir unter strikter
    Aufsicht der BaFin agieren.


    **Kann ich die Kosten beeinflussen?**

    Da unsere Kalkulation auf einem präzisen Risikoprofil basiert, beeinflussen korrekte
    Angaben zur Tätigkeit und Gesundheit die Prämie. Wir bieten edukative Erläuterungen
    zur Produktwahl an, damit Sie die für Sie passende Deckung wählen können. Weitere
    Details entnehmen Sie bitte dem Dokument „Berufsunfähigkeitsversicherung — Überblick“.


    **Welche Zahlungsmodalitäten gibt es?**

    Die Beiträge werden in der Regel monatlich eingezogen, um eine kontinuierliche
    Absicherung ohne Unterbrechungen zu gewährleisten.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 03ab2d6e-76d8-59d4-be4f-5a01e1ad121b
  title: Berufsunfähigkeitsversicherung — Status oder Verlauf einsehen
  body: 'Wenn Sie Ihren aktuellen Versicherungsstatus oder den Verlauf Ihrer Beitragszahlungen
    prüfen möchten, führen Sie bitte die folgenden Schritte aus:


    1. Teilen Sie uns mit, für welchen Zeitraum oder welchen spezifischen Aspekt (z.
    B. Beitragsverlauf oder aktueller Leistungsstatus) Sie eine Auskunft wünschen.

    2. Zur Sicherheit führen wir eine eindeutige Identitätsprüfung durch. Sie werden
    aufgefordert, sich mittels Multi-Faktor-Authentifizierung zu verifizieren oder
    einen validierten KYC-Prozess zu durchlaufen. Dies ist zwingend erforderlich,
    bevor wir Ihnen vertrauliche Vertragsdaten übermitteln.

    3. Nach erfolgreicher Verifizierung stellen wir Ihnen die gewünschten Informationen
    zur Verfügung. Dies kann eine Aufstellung der letzten Beitragszahlungen (z. B.
    zur Bestätigung des monatlichen Betrags von 68 €) oder eine Bestätigung Ihres
    aktuellen Versicherungsschutzes sein.

    4. Wir bestätigen Ihnen den Vorgang schriftlich oder über das Kundenportal, sodass
    Sie eine dauerhafte Dokumentation Ihres Statusverlaufs besitzen.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie die detaillierte
    Übersicht über Ihren Vertragsstatus erhalten haben und die Daten mit Ihren eigenen
    Unterlagen übereinstimmen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: eef146d7-cfa5-5bdd-931d-b3fba728ac5c
  title: Berufsunfähigkeitsversicherung — abgelehnter oder gesperrter Vorgang
  body: 'Wenn Sie im Rahmen Ihres Vergleichs oder Ihres Antrags feststellen, dass
    ein Vorgang abgelehnt oder gesperrt wurde, kann dies verschiedene Ursachen haben.


    **Häufige Symptome**

    Sie erhalten eine Nachricht, dass Ihr Antrag nicht bearbeitet werden konnte, oder
    der Zugriff auf bestimmte Vertragsänderungen wurde gesperrt.


    **Mögliche Ursachen**

    - **Fehlende Identitätsprüfung:** Ein Vorgang wird automatisch gesperrt, wenn
    die erforderliche Multi-Faktor-Authentifizierung oder der KYC-Prozess nicht vollständig
    abgeschlossen wurde.

    - **Unvollständige Gesundheitsangaben:** Wenn die vorvertragliche Anzeigepflicht
    nicht lückenlos erfüllt wurde, kann ein Antrag vorerst abgelehnt werden.

    - **Risikoprofil:** In seltenen Fällen führt eine medizinische Vorprüfung dazu,
    dass ein Vertrag zu den gewünschten Konditionen nicht abgeschlossen werden kann.


    **Schritte zur Lösung**

    1. Überprüfen Sie, ob Sie alle geforderten Identitätsnachweise eingereicht haben.

    2. Gleichen Sie Ihre Gesundheitsangaben mit den Anforderungen ab. Stellen Sie
    sicher, dass keine relevanten Informationen fehlen.

    3. Fordern Sie bei uns eine detaillierte Begründung für die Ablehnung an.


    **Eskalation**

    Wenn eine Lösung im direkten Dialog nicht möglich ist, wird der Fall strukturiert
    an unsere Fachabteilung und bei Bedarf an das Beschwerdemanagement geleitet. Sollte
    auch hier kein Konsens erzielt werden, weisen wir Sie aktiv auf die kostenlose
    Unterstützung durch den Versicherungsombudsmann hin.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: c8ced1fd-18fe-5276-9af1-aedc958f72eb
  title: Berufsunfähigkeitsversicherung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Beratung von Kunden
    bezüglich eines Wechsels oder Upgrades innerhalb der Berufsunfähigkeitsversicherung.


    Ein Upgrade oder Wechsel ist in folgenden Szenarien ratsam:


    - **Einkommenssteigerung:** Wenn das aktuelle Einkommen des Kunden gestiegen ist,
    reicht eine beispielhafte monatliche Rente von 1.500 € möglicherweise nicht mehr
    aus, um den gewohnten Lebensstandard im Ernstfall zu sichern. In diesem Fall sollte
    die Rentenhöhe angepasst werden.

    - **Berufliche Veränderung:** Ein Wechsel in eine andere Berufsgruppe (z. B. vom
    Angestellten zum Selbstständigen) kann das Risikoprofil verändern. Dies kann sowohl
    eine Anpassung der Prämie als auch eine Neubeurteilung der Bedingungen zur Folge
    haben.

    - **Änderung des Gesundheitszustands:** Eine signifikante Verbesserung der Gesundheit
    könnte unter Umständen eine Neubewertung der Risikoklasse ermöglichen.


    **Vergleich der Optionen**

    - **Beibehaltung:** Ideal für Kunden, deren Lebensumstände stabil sind und deren
    Absicherung (z. B. 1.500 € monatlich) weiterhin ihren Bedarf deckt.

    - **Upgrade:** Empfohlen für Kunden mit steigenden finanziellen Verpflichtungen
    oder Karriereaufstieg, um die existenzielle Lücke bei einer Berufsunfähigkeit
    ab 50 % zu schließen.


    Wir weisen darauf hin, dass jedes Upgrade einer erneuten Gesundheitsprüfung unterliegen
    kann, um die Solvenz und Fairness für alle Versicherten zu wahren.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: c84326cc-e320-57c5-9235-c7252dca4e5e
  title: Berufsunfähigkeitsversicherung — Vergleich mit Alternativen und wann es nicht
    passt
  body: 'Die Entscheidung für die richtige Absicherung ist ein wesentlicher Schritt
    zur finanziellen Sicherheit. Hier vergleichen wir die Berufsunfähigkeitsversicherung
    mit gängigen Alternativen.


    **Vergleich mit Alternativen**


    1. **Berufsunfähigkeitsversicherung vs. Unfallversicherung:**

    Die Unfallversicherung zahlt nur bei einem Unfall. Die Berufsunfähigkeitsversicherung
    hingegen schützt Sie unabhängig von der Ursache – egal ob durch Krankheit, Unfall
    oder psychische Belastungen –, sofern der Grad der Berufsunfähigkeit 50 % erreicht.


    2. **Berufsunfähigkeitsversicherung vs. Gesetzliche Erwerbsminderungsrente:**

    Die gesetzliche Rente ist oft nur eine Basisabsicherung und deckt in der Regel
    nicht den tatsächlichen Lebensstandard ab. Unsere Versicherung ergänzt diese Lücke
    durch eine vereinbarte Summe, wie beispielsweise eine monatliche Rentenzahlung
    von 1.500 €, um Ihre Existenz nachhaltig zu sichern.


    **Wann passt das Produkt nicht?**


    - **Sehr hohe bestehende Gesundheitsrisiken:** Wenn aufgrund von Vorerkrankungen
    eine Versicherung trotz risikobasierter Kalkulation nicht möglich ist oder die
    Prämien in keinem Verhältnis mehr zum Nutzen stehen.

    - **Kurzfristige Absicherung:** Da es sich um eine langfristige Existenzsicherung
    handelt, ist das Produkt weniger geeignet für Personen, die lediglich eine kurzzeitige
    Absicherung für eine sehr begrenzte Zeitspanne suchen.


    Wir bieten Ihnen edukative Erläuterungen an, um die Eignung des Produkts für Ihre
    individuelle Situation zu prüfen. Bitte beachten Sie, dass wir keine individuelle
    Steuer- oder Rechtsberatung leisten.'
