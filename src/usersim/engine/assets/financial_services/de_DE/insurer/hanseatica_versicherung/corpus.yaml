- id: ba9ee8ad-1d6c-5fae-8dfc-7f1ea942400a
  title: Hausratversicherung — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Bearbeitungsstatus eines Schadenfalls oder den Verlauf
    Ihrer Vertragsänderungen einsehen möchten, folgen Sie bitte diesen Schritten.
    Da es sich um vertrauliche Daten handelt, ist eine Sicherheitsprüfung zwingend
    erforderlich.


    **Voraussetzungen:**

    Sie benötigen Ihre Versicherungsnummer sowie Zugriff auf Ihr für die Multi-Faktor-Authentifizierung
    (MFA) hinterlegtes Gerät.


    **Schritt-für-Schritt-Anleitung:**

    1. Teilen Sie uns mit, für welchen Vorgang Sie den Status oder Verlauf einsehen
    möchten (z. B. eine konkrete Schadensnummer oder eine beantragte Adressänderung).

    2. Wir fordern Sie zur Identitätsprüfung auf. Bestätigen Sie die Anfrage über
    Ihren validierten KYC-Prozess oder mittels Multi-Faktor-Authentifizierung.

    3. Nach erfolgreicher Verifizierung teilen wir Ihnen den aktuellen Status des
    Vorgangs mit (z. B. ''In Prüfung'', ''Freigegeben'' oder ''Abgeschlossen'').

    4. Falls gewünscht, lassen wir Ihnen eine detaillierte Auflistung der bisherigen
    Ereignisse und Kommunikation im Sinne eines Verlaufsprotokolls zukommen.


    **Woran erkennen Sie, dass der Vorgang erfolgreich war?**

    Sie erhalten eine klare Bestätigung über den aktuellen Stand Ihres Anliegens sowie,
    falls zutreffend, das Datum der letzten Bearbeitung oder die Information, welche
    Unterlagen eventuell noch zur finalen Entscheidung fehlen.'
