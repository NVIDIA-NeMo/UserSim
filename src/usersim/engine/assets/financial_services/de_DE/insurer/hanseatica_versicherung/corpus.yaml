  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 656de99e-592c-5d78-8742-ebada375e774
  title: Berufsunfähigkeitsversicherung — Preis- und Leistungsverzeichnis
  body: 'Dieses Verzeichnis dient zur Unterstützung bei Kundenanfragen bezüglich der
    Kostenstruktur der Berufsunfähigkeitsversicherung. Die Gebühren dienen der Deckung
    administrativer Kosten und der Einhaltung regulatorischer Sicherheitsmargen.


    - Monatliche Versicherungsprämie: Individuell risikobasiert kalkuliert (Beispielwert:
    68 €). Die Prämie richtet sich nach Berufsgruppe, Eintrittsalter und Gesundheitsstatus.

    - Monatliche Leistungsrente: Individuell vereinbart (Beispielwert: 1.500 €), zahlbar
    bei einer medizinisch attestierten Berufsunfähigkeit ab 50 %.

    - Bearbeitungsgebühren für Vertragsänderungen: Im Rahmen des Standard-Service
    inkludiert; bei komplexen Sonderanpassungen fallen administrative Kosten an, die
    transparent in Rechnung gestellt werden.

    - Kosten für Gesundheitsprüfungen: Diese werden im Regelfall durch die Hanseatica
    Versicherung getragen, sofern sie im Rahmen des Antragsverfahrens angefordert
    wurden.


    Alle Beträge verstehen sich in Euro (€). Die Kalkulation erfolgt unter strikter
    Einhaltung der Solvabilitätsvorschriften zur Gewährleistung einer dauerhaften
    Leistungsfähigkeit.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: fee_schedule
