- id: fe3fe0b0-df41-5e02-b30b-069ba258cbd2
  title: Hausratversicherung — Risikohinweise
  body: 'Die Hanseatica Versicherung agiert unter strikter Aufsicht der BaFin und
    hält sämtliche Vorgaben des Versicherungsvertragsgesetzes ein. Wir weisen Sie
    hiermit auf folgende wichtige Risikopositionen und regulatorischen Rahmenbedingungen
    hin:


    Risiko der Unterversicherung: Die Versicherungssumme wird standardmäßig mit 650
    € pro Quadratmeter Wohnfläche kalkuliert. Sollte der tatsächliche Wert Ihres Hausrats
    diesen Betrag signifikant übersteigen, besteht das Risiko einer Unterversicherung.
    Im Schadensfall führt dies dazu, dass Leistungen im Verhältnis der Unterversicherung
    gekürzt werden. Wir empfehlen daher eine regelmäßige Überprüfung Ihres Inventars.


    Leistungsgrenzen: Beachten Sie, dass spezifische Deckungen Grenzen haben. So ist
    der Schutz gegen Fahrraddiebstahl auf maximal 1.000 € begrenzt. Beträge, die über
    diese Summe hinausgehen, sind nicht versichert, sofern keine individuelle Erweiterung
    vereinbart wurde.


    Widerrufs- und Kündigungsrechte: Gemäß den gesetzlichen Bestimmungen steht Ihnen
    ein Widerrufsrecht von 14 Tagen ab Vertragsschluss zu. Die Kündigung kann unter
    Einhaltung der vertraglichen Fristen oder durch Ausübung eines Sonderkündigungsrechts
    (z. B. bei Beitragserhöhungen) erfolgen.


    Datenschutz und Compliance: Alle Daten werden gemäß unseren Datenschutzrichtlinien
    verarbeitet. Vor jeder zustandsändernden Aktion im Kundenportal ist eine Multi-Faktor-Authentifizierung
    zwingend erforderlich, um Ihre Vertragsdaten vor unbefugtem Zugriff zu schützen.


    Wir bieten edukative Erläuterungen zur Produktwahl an, leisten jedoch keine individuelle
    Rechts- oder Steuerberatung. Für eine detaillierte Aufstellung der Bedingungen
    sehen Sie bitte in die Hausratversicherung — Allgemeine Geschäftsbedingungen.'
  domain: insurance
  product_category: hausrat
  document_type: disclosure
  source_authority: official
