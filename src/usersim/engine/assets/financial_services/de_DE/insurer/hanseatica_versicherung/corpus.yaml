- id: f2508943-5197-5b3d-8339-b6136feb712a
  title: 'Fondsgebundene Rentenversicherung — Abschlusskosten in Prozent der Beitragssumme:
    Erklärung'
  body: '**Was genau sind Abschlusskosten bei der Fondsgebundenen Rentenversicherung?**

    Abschlusskosten sind Gebühren, die bei Vertragsbeginn anfallen. Sie dienen der
    Deckung der administrativen Kosten der Vertragserstellung, der Risikoprüfung sowie
    der regulatorischen Aufwendungen. Bei Hanseatica Versicherung wird diese Summe
    transparent kalkuliert, um eine dauerhafte Solvenz und höchste Leistungsqualität
    zu gewährleisten.


    **Wie hoch sind diese Kosten bei Hanseatica Versicherung?**

    Wir setzen eine strikte Obergrenze für diese Gebühren. Die Abschlusskosten sind
    durch eine Obergrenze von maximal 2,5 % der Beitragssumme begrenzt.
    Damit stellen wir sicher, dass ein Großteil Ihrer Beiträge unmittelbar in den
    Vermögensaufbau fließt und die Einstiegshürden fair bleiben.


    **Gibt es weitere laufende Kosten?**

    Ja, neben den Abschlusskosten fallen jährliche Kosten an. Die effektiven Kosten
    für die Verwaltung und Fondsauswahl liegen bei 1,1 % pro Jahr. Details hierzu
    finden Sie in unserem Preis- und Leistungsverzeichnis unter ''Fondsgebundene Rentenversicherung
    — Preis- und Leistungsverzeichnis''.'
  domain: insurance
  product_category: fondsrente
