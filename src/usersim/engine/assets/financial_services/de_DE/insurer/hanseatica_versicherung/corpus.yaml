  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 408daff2-b877-5652-b1a4-fc13bbe052ec
  title: Hausratversicherung — wie Zinsen berechnet und angewendet werden
  body: 'Bei der Hausratversicherung handelt es sich um ein risikobasiertes Versicherungsprodukt
    und nicht um ein Anlageprodukt. Daher fallen in diesem Zusammenhang keine Zinsen
    im Sinne einer Verzinsung von Kapital an.


    Die Kostenstruktur wird wie folgt angewendet:

    - Prämienberechnung: Die Beiträge werden auf Basis des versicherten Risikos kalkuliert.
    Ein beispielhafter Jahresbeitrag beträgt 96 €. Dieser Betrag wird zur Deckung
    der Leistungsverpflichtungen sowie der administrativen Kosten verwendet.

    - Anpassung der Beiträge: Änderungen der Prämien erfolgen risikobasiert. Faktoren
    wie die Wohnlage oder die Quadratmeterzahl (Basis: 650 € pro Quadratmeter) beeinflussen
    die Kalkulation.

    - Erstattungen: Sollten im Rahmen einer Tarifänderung Überzahlungen entstanden
    sein, werden diese ohne Zinszugschlag in voller Höhe auf das hinterlegte Referenzkonto
    zurückerstattet.


    Alle Gebühren dienen der Gewährleistung einer dauerhaften Solvenz und der Einhaltung
    der regulatorischen Sicherheitsmargen gemäß BaFin-Vorgaben.'
