  institution_id: hanseatica_versicherung
- id: 372c40cc-52ba-5b17-8661-5341be65ae52
  title: Berufsunfähigkeitsversicherung — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Beim Vergleich unserer Berufsunfähigkeitsversicherung mit typischen Marktbegleitern
    stehen die Transparenz und die Zuverlässigkeit im Vordergrund.


    | Merkmal | Hanseatica Versicherung | Typisches Wettbewerbsangebot |

    | :--- | :--- | :--- |

    | **Leistungsbeginn** | Klar definiert ab 50 % Berufsunfähigkeit | Oft komplexere,
    stufenweise Staffellösungen |

    | **Beispielhafte Rente** | 1.500 € (transparent kalkuliert) | Ähnliche Summen,
    oft mit versteckten Kosten |

    | **Beispielhafter Beitrag**| 68 € (risikobasiert) | Schwankend je nach aggressiver
    Preisstrategie |

    | **Prozesse** | Modern, digital, BaFin-konform | Teilweise noch stark papiergebunden
    |

    | **Vertrauensbasis** | Hanseatische Zuverlässigkeit | Fokus auf kurzfristige
    Marktakquise |


    **Wer profitiert von unserem Angebot?**

    Unser Produkt eignet sich hervorragend für Kunden, die eine langfristige, stabile
    Partnerschaft suchen und Wert auf eine klare Sprache ohne versteckte Klauseln
    legen. Es ist die richtige Wahl für den deutschen Mittelstand, der Sicherheit
    über kurzfristige Preisoptimierungen stellt.


    **Wann ist ein Wettbewerbsangebot eventuell vorzuziehen?**

    Ein anderes Angebot könnte dann attraktiv sein, wenn ein Kunde eine extrem spezifische
    Nischendeckung wünscht, die über unseren Standard der Sorgfalt für die allgemeine
    Zielgruppe hinausgeht.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: comparison
  source_authority: official
