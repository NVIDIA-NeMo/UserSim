- id: d23bd80e-79f4-5a09-95f4-d3ce185e057c
  title: Kfz-Versicherung — Preis- und Leistungsverzeichnis
  body: 'Dieses Verzeichnis dient als Referenz für die Kostenstruktur der Kfz-Versicherung.
    Alle Beträge sind auf Basis einer risikobasierten Kalkulation festgesetzt, um
    die Solvenz des Instituts und die Leistungsqualität zu sichern.


    **Prämienbeispiele (indikativ)**

    - Beispielhafter Jahresbeitrag (Vollkasko): 780 €


    **Selbstbeteiligungen im Schadenfall**

    - Selbstbeteiligung bei Vollkaskodeckung: 300 €

    - Selbstbeteiligung bei Teilkaskodeckung: 150 €


    **Administrative Gebühren**

    - Die Gebühren zur Deckung administrativer Kosten sind in den oben genannten Prämien
    enthalten und werden transparent gemäß den regulatorischen Sicherheitsmargen der
    BaFin kalkuliert.


    **Zahlungsbedingungen**

    - Die Prämien sind gemäß der in der individuellen Police vereinbarten Zahlungsweise
    (jährlich, halbjährlich oder vierteljährlich) fällig.


    Bei Fragen zur individuellen Kalkulation eines Kunden wird auf die risikobasierten
    Faktoren in der jeweiligen Police verwiesen.'
