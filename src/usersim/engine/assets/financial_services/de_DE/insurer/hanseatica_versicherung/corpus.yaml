- id: 2de19147-c592-5b1f-b4a1-de8f5ee5a3e7
  title: 'Hausratversicherung — Versicherungssumme je Quadratmeter: Erklärung'
  body: 'Frage: Wie wird die Versicherungssumme in meiner Hausratversicherung ermittelt
    und was bedeutet der Wert pro Quadratmeter?


    Antwort: Um eine präzise und faire Absicherung zu gewährleisten, verwenden wir
    bei der Hanseatica Versicherung eine standardisierte Kalkulationsbasis. Wir setzen
    eine Versicherungssumme von 650 € pro Quadratmeter Ihrer Wohnfläche an. Dieser
    Wert dient dazu, den durchschnittlichen Wert eines Hausrats in Relation zur Wohnungsgröße
    realistisch abzubilden. So wird effektiv verhindert, dass Sie unterversichert
    sind, was im Schadensfall zu einer proportionalen Kürzung der Leistungen führen
    würde.


    Frage: Kann ich diesen Wert anpassen, wenn ich besonders wertvolle Gegenstände
    besitze?


    Antwort: Ja, die Anpassung der Versicherungssumme ist möglich und wird empfohlen,
    wenn der reale Wert Ihres Inventars die Pauschale von 650 € pro Quadratmeter deutlich
    übersteigt. Bitte teilen Sie uns die gewünschte Summe mit, damit wir Ihren Schutz
    individuell anpassen können. Weitere Informationen zu den Kosten finden Sie in
    der Hausratversicherung — Kosten und Entgelte.'
  domain: insurance
  product_category: hausrat
  document_type: faq
  source_authority: official
