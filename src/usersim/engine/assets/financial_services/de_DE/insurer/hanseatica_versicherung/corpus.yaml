- id: 30ec849f-9036-5751-9d04-80aeead46ebc
  title: 'Hausratversicherung — Versicherungssumme für Fahrraddiebstahl: Erklärung'
  body: 'Häufig gestellte Fragen zur Abdeckung von Fahrrädern in unserer Hausratversicherung:


    Frage: Wie hoch ist die maximale Entschädigung bei einem Fahrraddiebstahl?

    Antwort: In unserer standardmäßigen Hausratversicherung ist ein spezialisierter
    Schutz gegen Fahrraddiebstahl bis zu einem Betrag von 1.000 € integriert. Dieser
    Betrag stellt die Obergrenze für die Erstattung pro Schadensfall dar.


    Frage: Gilt diese Summe für jedes einzelne Fahrrad oder für alle Fahrräder im
    Haushalt zusammen?

    Antwort: Die Summe von 1.000 € bezieht sich auf die Gesamtsumme der versicherten
    Fahrräder im Haushalt. Sollten Ihre Fahrräder einen höheren Gesamtwert haben,
    empfehlen wir eine Anpassung der Police, um eine vollständige Deckung zu gewährleisten.


    Frage: Was muss ich tun, wenn mein Fahrrad gestohlen wurde?

    Antwort: Es besteht die vertragliche Pflicht zur unverzüglichen Schadenmeldung.
    Bitte melden Sie den Diebstahl umgehend sowohl uns als auch der zuständigen Polizeidienststelle.
    Weitere Informationen finden Sie unter Hausratversicherung — Überblick.'
  domain: insurance
  product_category: hausrat
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: bf17999d-2c5f-5a11-9069-07d28f7d0a18
  title: Hausratversicherung — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrer bestehenden Hausratversicherung vornehmen möchten
    — beispielsweise aufgrund eines Umzugs, einer Änderung der Wohnfläche oder der
    Anschaffung wertvollerer Gegenstände — folgen Sie bitte diesem Prozess.


    Was Sie benötigen:

    Bevor Sie die Änderung beantragen, halten Sie bitte Ihre Versicherungsscheinnummer
    sowie die neuen Daten (z. B. die neue Quadratmeterzahl Ihrer Wohnung) bereit.


    Schritt 1: Mitteilung der Änderung

    Teilen Sie uns mit, welchen Aspekt Ihres Vertrages Sie ändern möchten. Wenn Sie
    beispielsweise Ihre Wohnfläche anpassen, nennen Sie uns die neue Quadratmeterzahl.
    Wir berechnen daraufhin die neue Versicherungssumme auf Basis unserer Richtlinie
    von 650 € pro Quadratmeter.


    Schritt 2: Identitätsprüfung

    Da es sich um eine zustandsändernde Aktion handelt, werden wir eine Identitätsprüfung
    mittels Multi-Faktor-Authentifizierung durchführen. Bestätigen Sie bitte die entsprechende
    Anfrage auf Ihrem registrierten Endgerät.


    Schritt 3: Überprüfung der neuen Prämie

    Wir teilen Ihnen die angepasste, risikobasierte Jahresprämie mit. Beachten Sie,
    dass eine Erhöhung der Versicherungssumme oder eine Erweiterung des Schutzes (z.
    B. über die 1.000 € für Fahrraddiebstahl hinaus) zu einer Anpassung Ihres Beitrags
    führen kann.


    Schritt 4: Bestätigung und Dokumentation

    Sobald Sie der Änderung zustimmen, führen wir die Anpassung in unserem System
    durch. Sie erhalten eine Bestätigung der Vertragsänderung sowie einen aktualisierten
    Versicherungsschein digital über Ihr Kundenportal.


    Der Vorgang ist abgeschlossen, sobald die aktualisierte Police in Ihrem Postfach
    hinterlegt ist.'
  domain: insurance
  product_category: hausrat
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 060af6af-0697-5a2f-942b-4f188cec235d
  title: Hausratversicherung — Probleme mit Zugang oder Login
  body: 'Wenn Sie Schwierigkeiten haben, auf Ihr Kundenkonto für die Hausratversicherung
    zuzugreifen, prüfen Sie bitte die folgenden Punkte in der angegebenen Reihenfolge.


    Symptom: Fehlermeldung beim Login oder Zugriff auf Vertragsdaten nicht möglich.


    1. Prüfung der Zugangsdaten

    Stellen Sie sicher, dass Ihre E-Mail-Adresse und Ihr Passwort korrekt eingegeben
    wurden. Beachten Sie dabei die Groß- und Kleinschreibung.


    2. Status der Multi-Faktor-Authentifizierung (MFA)

    Überprüfen Sie, ob Sie den MFA-Code auf Ihrem Mobilgerät erhalten haben. Falls
    kein Code eintrifft, prüfen Sie Ihre Netzverbindung oder fordern Sie einen neuen
    Code an. Ohne eine erfolgreiche MFA ist der Zugriff auf vertrauliche Daten aus
    Sicherheitsgründen gesperrt.


    3. Prüfung des KYC-Status

    In seltenen Fällen kann der Zugang eingeschränkt sein, wenn eine Aktualisierung
    Ihrer Identitätsdaten (KYC-Prozess) erforderlich ist. Prüfen Sie Ihre E-Mails
    auf Nachrichten von Hanseatica Versicherung bezüglich einer notwendigen Validierung.


    4. Browser- und Cache-Probleme

    Löschen Sie den Cache Ihres Browsers oder versuchen Sie es mit einem anderen Browser,
    um technische Anzeigefehler auszuschließen.


    Wenn diese Schritte keine Lösung bringen, werden wir den Vorgang intern eskalieren.
    Wir leiten Ihr Anliegen an unsere Fachabteilung für digitale Services weiter,
    die eine manuelle Prüfung Ihres Kontostatus vornimmt. Sie erhalten innerhalb von
    zwei Werktagen eine Rückmeldung über den Status Ihres Zugangs per E-Mail.


    Sollten Sie Ihren Zugang vergleichen wollen, finden Sie Informationen zur allgemeinen
    Struktur unter Hausratversicherung — Überblick.'
  domain: insurance
  product_category: hausrat
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e0d3ee31-2dc6-53c5-a6f9-90bf32fb70c2
  title: Hausratversicherung — Zugangsstufen
  body: 'Dieser Matrix dient Support-Agenten zur Bestimmung der Zugangsberechtigung
    für verschiedene Deckungsstufen der Hausratversicherung.


    | Bedingung | Ergebnis / Zugangsstufe |

    | :--- | :--- |

    | Wohnsitz in Deutschland, nachgewiesene Identität (KYC) | Zugang zur Standard-Hausratversicherung
    |

    | Wohnfläche > 0 m², Angabe der Objektdaten | Berechtigung für Berechnung der
    Summe (Basis: 650 €/m²) |

    | Besitz von Fahrrädern innerhalb des Haushalts | Berechtigung für integrierten
    Fahrraddiebstahl-Schutz (bis 1.000 €) |

    | Nachweis eines bestehenden Versicherungsverhältnisses > 3 Jahre | Berechtigung
    für Treuerabatte auf Zusatzpolicen |

    | Fehlgeschlagene Multi-Faktor-Authentifizierung | Kein Zugriff auf zustandsändernde
    Vertragsaktionen |

    | Ablehnung des KYC-Prozesses | Kein Abschluss einer neuen Police möglich |


    Agenten müssen sicherstellen, dass alle KYC-Anforderungen erfüllt sind, bevor
    ein Vertrag mit einer Beispielprämie von 96 € oder individuellen Konditionen finalisiert
    wird.'
