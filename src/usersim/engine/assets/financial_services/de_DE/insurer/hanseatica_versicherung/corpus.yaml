  institution_id: hanseatica_versicherung
- id: 9ad88887-bca8-5a2c-aa42-9a57ad41d11d
  title: Berufsunfähigkeitsversicherung — im Vergleich zu einem ähnlichen Produkt
    des Hauses
  body: 'Kunden wählen oft zwischen der Berufsunfähigkeitsversicherung und der Fondsgebundenen
    Rentenversicherung, da beide Produkte der langfristigen Absicherung dienen. Sie
    unterscheiden sich jedoch grundlegend in ihrem Zweck.


    Die Berufsunfähigkeitsversicherung ist eine Risikoabsicherung. Ihr Ziel ist die
    Existenzsicherung bei einem plötzlichen Einkommensverlust. Die Kernleistung tritt
    ein, sobald eine Berufsunfähigkeit ab 50 % vorliegt. Im Gegenzug zahlen Sie eine
    risikobasierten Prämie (Beispiel: 68 €), um im Ernstfall eine Rente (Beispiel:
    1.500 €) zu erhalten. Es handelt sich nicht um einen Sparplan, sondern um einen
    Schutz gegen den Totalausfall der Arbeitskraft.


    Die Fondsgebundene Rentenversicherung dient hingegen dem aktiven Vermögensaufbau
    für das Alter. Hier stehen flexible Anlageoptionen und die Wertentwicklung der
    Fonds im Vordergrund. Während die Berufsunfähigkeitsversicherung Sie vor einem
    Risiko schützt, hilft Ihnen die Fondsrente, Ihr Kapital für die Zeit nach dem
    Berufsleben zu mehren.


    Zusammenfassend: Die Berufsunfähigkeitsversicherung ist die richtige Wahl für
    Personen, die eine sofortige Absicherung ihres Einkommens bei Krankheit oder Unfall
    benötigen. Die Fondsrente eignet sich für Kunden, die eine ergänzende private
    Altersvorsorge aufbauen möchten. Für einen detaillierten Überblick siehe Fondsgebundene
    Rentenversicherung — Überblick.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 7152eede-b34e-54c9-b75d-c81ed2d0a9b1
  title: Berufsunfähigkeitsversicherung — rechtliche Hinweise
  body: 'Die Berufsunfähigkeitsversicherung der Hanseatica Versicherung unterliegt
    der strikten Aufsicht der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin)
    und wird in Übereinstimmung mit dem Versicherungsvertragsgesetz (VVG) geführt.


    Widerrufsrecht: Wir weisen Sie proaktiv auf Ihr Recht hin, diesen Versicherungsvertrag
    innerhalb von 14 Tagen nach Vertragsschluss und Erhalt der Versicherungspolice
    ohne Angabe von Gründen zu widerrufen. Die Frist beginnt mit dem Tag, an dem Sie
    alle notwendigen Informationen und die Vertragspapiere erhalten haben.


    Vorvertragliche Anzeigepflicht: Der Versicherungsnehmer ist verpflichtet, alle
    vom Versicherer gestellten Fragen zu seinem Gesundheitszustand und seiner beruflichen
    Tätigkeit wahrheitsgemäß und vollständig zu beantworten. Eine Verletzung dieser
    Pflicht kann gemäß VVG zur Leistungsfreiheit des Versicherers oder zur Kündigung
    des Vertrages führen.


    Leistungsvoraussetzung: Die Auszahlung der vereinbarten Rentenleistung (Beispiel:
    1.500 €) erfolgt ausschließlich, wenn eine Berufsunfähigkeit ab 50 % medizinisch
    nachgewiesen wird. Die Feststellung erfolgt durch qualifizierte medizinische Sachverständige.


    Datenschutz: Wir verarbeiten Ihre personenbezogenen Daten und Gesundheitsdaten
    ausschließlich zur Durchführung des Versicherungsvertrages und unter Einhaltung
    der geltenden Datenschutzrichtlinien. Alle Daten werden sicher verschlüsselt und
    nur für die notwendigen Prozesse verwendet.


    Beratungshinweis: Wir bieten edukative Erläuterungen zur Produktwahl an. Die Hanseatica
    Versicherung leistet jedoch keine individuelle Steuer- oder Rechtsberatung. Wir
    garantieren keine spezifische Wertentwicklung, da es sich bei diesem Produkt um
    eine reine Risikoabsicherung handelt.


    Bei Streitigkeiten wird im Falle eines ausbleibenden Konsenses aktiv auf den kostenlosen
    Versicherungsombudsmann verwiesen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: a9fe0d36-01e9-5a6a-85f1-5e2b4865fc85
  title: Berufsunfähigkeitsversicherung — Zinsübersicht
  body: 'Im Gegensatz zu Renten- oder Anlageprodukten basiert die Berufsunfähigkeitsversicherung
    nicht auf einem Zinsatz oder einer Rendite, sondern auf einer risikobasierten
    Prämienkalkulation. Es gibt daher keinen festen Zinssatz, der auf das Kapital
    angewendet wird.


    Die Berechnung der monatlichen Beiträge folgt diesen Prinzipien:


    - Risikobasierte Kalkulation: Die Prämie wird individuell ermittelt. Faktoren
    wie das Eintrittsalter, die berufliche Tätigkeit (Berufsgruppe) und der Gesundheitszustand
    bestimmen die Höhe des Beitrags. So resultiert aus einem spezifischen Risikoprofil
    beispielsweise ein Monatsbeitrag von 68 €.

    - Leistungshöhe: Die Höhe der monatlichen Rente (Beispiel: 1.500 €) wird vertraglich
    fixiert und ist an die Bedingung geknüpft, dass eine Berufsunfähigkeit ab 50 %
    eintritt.

    - Stabilität: Unsere Prämien sind so kalkuliert, dass eine dauerhafte Solvenz
    und höchste Leistungsqualität gewährleistet ist. Die Kosten dienen der Deckung
    administrativer Aufwendungen sowie regulatorischer Sicherheitsmargen.


    Änderungen an der Prämie können eintreten, wenn sich die allgemeine Risikolage
    der versicherten Berufsgruppe signifikant verschiebt oder gesetzliche Vorgaben
    angepasst werden. Wir informieren Sie in diesen Fällen transparent und zeitnah.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 5b57aff5-1438-5172-a26a-f297146dff2c
  title: Berufsunfähigkeitsversicherung — aktuelles Angebot
  body: 'Exklusiv für unsere bestehenden Kunden der Hanseatica Versicherung: Sichern
    Sie Ihre berufliche Zukunft noch umfassender ab.


    Angebot: ''Sicherung Plus 2024''

    Zeitraum: Gültig vom 01. Oktober 2024 bis zum 31. Dezember 2024.


    Kunden, die bereits eine Berufsunfähigkeitsversicherung bei uns unterhalten, haben
    im genannten Zeitraum die Möglichkeit, ihre monatliche Rentenzahlung ohne erneute
    umfassende Gesundheitsprüfung zu erhöhen (vorbehaltlich einer vereinfachten Gesundheitsprüfung).
    Dies ermöglicht es Ihnen, Ihre Absicherung beispielsweise von einer bestehenden
    Summe auf 1.500 € pro Monat anzuheben.


    Die Anpassung der risikobasierten Prämie (z. B. Erhöhung auf 68 € oder mehr, je
    nach individuellem Profil) erfolgt transparent und wird Ihnen vor Abschluss der
    Änderung schriftlich bestätigt.


    Nutzen Sie dieses zeitlich begrenzte Angebot, um Ihre existenzielle Absicherung
    an Ihre aktuelle Lebenssituation und gestiegene Einkommensverhältnisse anzupassen.
    Für eine individuelle Berechnung wenden Sie sich bitte an Ihren zuständigen Berater
    oder nutzen Sie unser Kundenportal.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 5063fe44-c920-5dee-b8b7-72d9d3b87362
  title: Berufsunfähigkeitsversicherung — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Die Sicherheit Ihrer persönlichen Daten und Ihres Versicherungsschutzes hat
    bei der Hanseatica Versicherung höchste Priorität. Insbesondere bei der Berufsunfähigkeitsversicherung,
    die Ihre langfristige Existenz sichert, ist Wachsamkeit gegenüber betrügerischen
    Aktivitäten geboten.


    Ein häufiges Betrugsmuster ist die Kontaktaufnahme durch Personen, die sich fälschlicherweise
    als Mitarbeiter unserer Gesellschaft ausgeben. Diese versuchen oft, sensible Informationen
    oder Zugangsdaten zu erlangen, um unbefugte Vertragsänderungen vorzunehmen. Bitte
    beachten Sie: Die Hanseatica Versicherung wird Sie niemals per E-Mail, SMS oder
    Telefon dazu auffordern, Passwörter, PINs oder Multi-Faktor-Authentifizierungscodes
    preiszugeben.


    Um den Zugriff auf vertrauliche Daten oder zustandsändernde Aktionen in Ihrem
    Vertrag zu gewährleisten, setzen wir eine eindeutige Identitätsprüfung mittels
    Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses zwingend voraus.
    Sollten Sie eine Aufforderung erhalten, die Ihnen ungewöhnlich erscheint, oder
    den Verdacht hegen, dass Unbefugte auf Ihre Daten zugegriffen haben, melden Sie
    uns dies bitte unverzüglich.


    Betrugsversuche werden von uns konsequent dokumentiert und den zuständigen Behörden
    gemeldet, um die Integrität unseres Versicherungskollektivs zu schützen. Wenn
    Sie einen Vorfall melden, prüfen wir die Vorgänge strukturiert über die zuständige
    Fachabteilung. Wir empfehlen Ihnen, jede Form von Kommunikation, die eine dringende
    Änderung Ihrer Bankverbindung oder eine sofortige Zahlung außerhalb der regulären
    Prämienzahlungen (wie im Beispiel 68 €) fordert, kritisch zu hinterfragen.


    Die rechtzeitige Meldung eines Verdachts ist entscheidend, um die Haftung für
    nicht autorisierte Vorgänge zu begrenzen. Wir agieren hierbei unter strikter Aufsicht
    der BaFin, um höchste Sicherheitsstandards zu gewährleisten.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 4fb24dd6-ad5e-5bb3-8a4c-ade644590e75
  title: Berufsunfähigkeitsversicherung — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die vertraglichen Grundlagen
    der Berufsunfähigkeitsversicherung der Hanseatica Versicherung. Die Zusammenarbeit
    basiert auf den Prinzipien hanseatischer Zuverlässigkeit und Transparenz.


    1. Versicherungsleistung und Anspruch:

    Ein Anspruch auf die monatliche Berufsunfähigkeitsrente besteht, wenn eine Berufsunfähigkeit
    im Sinne der vertraglichen Definition mit einem Grad von mindestens 50 % vorliegt.
    Die Höhe der Leistung richtet sich nach dem vereinbarten Tarif, wie beispielsweise
    in unserem Modellbeispiel mit einer monatlichen Rente von 1.500 €.


    2. Pflichten des Versicherungsnehmers:

    Der Versicherungsnehmer unterliegt einer sorgfältigen vorvertraglichen Anzeigepflicht.
    Alle gesundheitlichen und beruflichen Angaben müssen wahrheitsgemäß und vollständig
    erfolgen. Die Verletzung dieser Pflicht kann zum Verlust des Versicherungsanspruchs
    oder zur Kündigung des Vertrages führen.


    3. Prämienzahlung:

    Die Prämien sind risikobasiert kalkuliert. Ein Beispielbeitrag beläuft sich auf
    68 € monatlich. Gebühren dienen der Deckung administrativer Kosten und der Einhaltung
    regulatorischer Sicherheitsmargen. Die dauerhafte Solvenz wird durch strikte Einhaltung
    der BaFin-Vorgaben und des Versicherungsvertragsgesetzes gewährleistet.


    4. Beendigung und Widerruf:

    Versicherungsnehmer haben ein gesetzliches Widerrufsrecht. Da es sich bei der
    Berufsunfähigkeitsversicherung in der Regel um ein lebensversicherungsähnliches
    Produkt handelt, beträgt die Widerrufsfrist 30 Tage. Ein allgemeines Sonderkündigungsrecht
    besteht beispielsweise nach einer Beitragserhöhung oder einem eingetretenen Schadenfall.


    5. Streitbeilegung:

    Sollte kein Konsens über einen Leistungsanspruch erzielt werden, verweist die
    Hanseatica Versicherung aktiv auf den kostenlosen Versicherungsombudsmann zur
    fairen und zeitnahen Klärung der Angelegenheit.'
