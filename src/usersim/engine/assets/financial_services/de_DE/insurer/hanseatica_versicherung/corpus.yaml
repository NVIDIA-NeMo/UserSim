- id: 2d0bfbd3-fce5-5f1d-ae63-9061b272541b
  title: Fondsgebundene Rentenversicherung — Status oder Verlauf einsehen
  body: 'Um den aktuellen Status Ihres Guthabens oder den Verlauf Ihrer Beitragszahlungen
    einzusehen, folgen Sie bitte diesen Schritten:


    1. Identitätsprüfung: Da es sich um vertrauliche Finanzdaten handelt, bestätigen
    Sie zunächst Ihre Identität durch einen Multi-Faktor-Authentifizierungsprozess
    oder durch die Bereitstellung der geforderten KYC-Dokumente. Erst nach erfolgreicher
    Verifizierung erhalten Sie Zugriff auf die Vertragsdaten.


    2. Anforderung des aktuellen Standes: Teilen Sie uns mit, für welchen Zeitraum
    Sie den Verlauf einsehen möchten oder ob Sie den tagesaktuellen Wert Ihrer fondsgebundenen
    Vorsorge benötigen.


    3. Prüfung der Aufschlüsselung: Wir senden Ihnen eine detaillierte Aufstellung
    zu. Diese enthält den aktuellen Fondswert, die Summe der eingezahlten Beiträge
    (unter Berücksichtigung des Mindestbeitrags von 25 € pro Monat) sowie die abgezogenen
    Effektivkosten in Höhe von 1,1 % p.a.


    4. Abgleich der Abschlusskosten: Falls Sie Ihren Vertrag kürzlich abgeschlossen
    haben, können Sie in diesem Verlauf auch die Verrechnung der Abschlusskosten einsehen,
    die maximal 2,5 % der Beitragssumme betragen.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie das entsprechende
    Dokument in Ihrem Kundenportal erhalten oder es Ihnen per E-Mail zugestellt wurde.
    Sollten Sie Fragen zur Interpretation der Werte haben, stehen wir Ihnen für edukative
    Erläuterungen gerne zur Verfügung; bitte beachten Sie jedoch, dass wir keine individuelle
    Steuerberatung durchführen.'
