- id: ef8394fc-a52c-5acc-b529-fde87cf531b0
  title: Fondsgebundene Rentenversicherung — wie Zinsen berechnet und angewendet werden
  body: 'In einer Fondsgebundenen Rentenversicherung gibt es keinen festen Zinsfuß,
    wie er in klassischen Rentenversicherungen Anwendung findet. Die Wertentwicklung
    Ihres Kapitals basiert stattdessen auf der Performance der gewählten Investmentfonds.


    Berechnungslogik:

    1. Fondswert (NAV): Die Wertentwicklung ergibt sich aus der Veränderung des Net
    Asset Value (NAV) der im Vertrag gehaltenen Fondsanteile.

    2. Netto-Effekt: Die tatsächliche Rendite für den Kunden ergibt sich aus der Bruttorendite
    der Fonds abzüglich der Effektivkosten pro Jahr in Höhe von 1,1 %.

    3. Kostenanwendung: Diese 1,1 % werden kontinuierlich zur Deckung der Verwaltung
    und Fondskosten verwendet, was die Basis für das zukünftige Wachstum reduziert.


    Einflussfaktoren:

    - Marktentwicklung: Steigende Kurse der Fonds führen zu einer Erhöhung des Rentenkapitals;
    fallende Kurse führen zu einer Minderung.

    - Beitragsflüsse: Ein Mindestbeitrag von 25 € pro Monat sorgt für einen stetigen
    Zukauf von Fondsanteilen, was den Durchschnittskosteneffekt (Cost-Average-Effect)
    nutzen kann.

    - Abschlusskosten: Die anfängliche Belastung durch Abschlusskosten (maximal 2,5
    %) wird im Zeitverlauf durch die Marktrendite amortisiert.


    Zusammenfassend: Es wird kein fester Zinssatz angewendet, sondern eine marktbasierte
    Wertentwicklung, die durch die Kostenstruktur von 1,1 % p.a. beeinflusst wird.'
