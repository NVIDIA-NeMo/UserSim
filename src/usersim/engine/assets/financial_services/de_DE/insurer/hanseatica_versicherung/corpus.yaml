- id: 218bc146-59b5-531a-8756-4841d7c05a0c
  title: Fondsgebundene Rentenversicherung — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen unserer Fondsgebundenen
    Rentenversicherung.


    **Welche Kosten fallen jährlich für die Verwaltung meines Vertrags an?**

    Die Effektivkosten belaufen sich auf 1,1 % pro Jahr. Diese Kosten dienen der Deckung
    administrativer Aufwendungen und der Sicherstellung der Leistungsqualität.


    **Gibt es eine Begrenzung für die Kosten beim Abschluss des Vertrages?**

    Ja, wir setzen eine Obergrenze für die Abschlusskosten von 2,5 % der Beitragssumme
    fest, um Ihnen einen fairen und transparenten Start in Ihre Vorsorge zu ermöglichen.


    **Welchen Betrag muss ich mindestens monatlich einzahlen?**

    Um eine dauerhafte Solvenz und eine effektive Vermögensbildung zu gewährleisten,
    beträgt der Mindestbeitrag pro Monat 25 €.


    Weitere Details zu den rechtlichen Rahmenbedingungen finden Sie in der Dokumentation
    zur Fondsgebundenen Rentenversicherung — Überblick.'
