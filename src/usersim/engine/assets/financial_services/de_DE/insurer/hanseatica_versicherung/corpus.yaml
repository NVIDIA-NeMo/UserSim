  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 8d1ab7e3-303e-5c7c-a3a8-ee274f1e86cc
  title: Kfz-Versicherung — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen unserer Kfz-Versicherung.


    **Wie hoch ist der Beitrag für eine Kfz-Versicherung?**

    Die Prämien sind risikobasiert und transparent kalkuliert. Als Orientierung dient
    ein Beispielwert: Ein jährlicher Beispielbeitrag für eine Kfz-Versicherung beläuft
    sich auf 780 €. Der tatsächliche Betrag hängt individuell von Faktoren wie Fahrzeugtyp,
    Schadenfreiheitsklasse und Nutzungsprofil ab.


    **Wie setzen sich die Gebühren zusammen?**

    Unsere Gebühren dienen der Deckung administrativer Kosten und der Einhaltung regulatorischer
    Sicherheitsmargen, um eine dauerhafte Solvenz und höchste Leistungsqualität zu
    gewährleisten. Wir verzichten auf versteckte Kosten.


    **Welche Kosten fallen im Schadensfall an?**

    Je nach gewähltem Tarif fällt eine Selbstbeteiligung an. In der Vollkasko beträgt
    diese 300 €, in der Teilkasko 150 €. Diese Beträge werden im Falle einer Schadensregulierung
    mit der Leistung verrechnet.


    Weitere Details entnehmen Sie bitte dem Dokument Kfz-Versicherung — Überblick.'
  domain: insurance
  product_category: kfz
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: fc6846d2-c288-559e-9218-8fe6307a5bda
  title: Kfz-Versicherung — Status oder Verlauf einsehen
  body: 'In diesem Leitfaden erfahren Sie, wie Sie den aktuellen Status Ihrer Versicherungsangelegenheiten
    oder den Verlauf Ihrer Zahlungen und Schadensmeldungen bei der Hanseatica Versicherung
    einsehen können.


    **Voraussetzungen**

    Um Ihren Status einzusehen, benötigen Sie einen gültigen Zugang zu Ihrem Kundenkonto
    sowie ein erfolgreich durchgeführte Multi-Faktor-Authentifizierung zur Sicherung
    Ihrer vertraulichen Daten.


    **Schritte zur Einsichtnahme**


    1. **Anfrage stellen:** Teilen Sie uns mit, welche Informationen Sie einsehen
    möchten (z. B. den Status einer aktuellen Schadensmeldung oder die Historie Ihrer
    Beitragszahlungen).

    2. **Identitätsprüfung:** Wir führen eine eindeutige Identitätsprüfung mittels
    unseres validierten KYC-Prozesses oder einer Multi-Faktor-Authentifizierung durch,
    bevor wir Zugriff auf Ihre vertraulichen Vertragsdaten gewähren.

    3. **Datenabruf:** Sobald die Identität bestätigt ist, rufen wir die gewünschten
    Informationen aus Ihrem Versicherungskonto ab. Wir teilen Ihnen den aktuellen
    Bearbeitungsstand (z. B. ''in Prüfung'', ''genehmigt'' oder ''ausgezahlt'') mit.

    4. **Bestätigung:** Wir senden Ihnen die gewünschten Details oder eine Zusammenfassung
    des Verlaufs in einer für Sie nachvollziehbaren Form zu.


    **Woran erkennen Sie, dass der Vorgang erfolgreich war?**

    Der Vorgang ist abgeschlossen, wenn Sie die gewünschten Statusinformationen oder
    den detaillierten Verlauf Ihres Vertrags schriftlich erhalten haben oder diese
    in Ihrem Kundenportal unter dem entsprechenden Reiter aktualisiert angezeigt werden.


    Sollten Sie Unstimmigkeiten in Ihrem Verlauf feststellen, können Sie dies direkt
    im Rahmen der Kommunikation ansprechen. Für Unterstützung bei Problemen mit dem
    Zugang beachten Sie bitte Kfz-Versicherung — Probleme mit Zugang oder Login.'
