  institution_id: hanseatica_versicherung
- id: f70830a0-1e70-5846-90ed-ac366d946bcf
  title: Privathaftpflicht Komfort — ein typisches Anliegen vollständig erledigen
  body: 'Ein typisches und wichtiges Anliegen in der Privathaftpflicht Komfort ist
    die Meldung eines Schadensereignisses. Damit Ihr Fall zügig und fair bearbeitet
    werden kann, folgen Sie bitte diesem strukturierten Prozess.


    **Voraussetzungen:**

    Sie sollten über Ihre Versicherungsnummer verfügen und alle relevanten Informationen
    zum Schaden (Datum, Ort, beteiligte Personen) sowie etwaige Beweismittel (Fotos,
    Zeugenaussagen) bereitgehalten haben.


    **Schritte zur vollständigen Schadensabwicklung:**


    1. **Unverzügliche Schadenmeldung:** Informieren Sie uns ohne schuldhaftes Zögern
    über das eingetretene Ereignis. Nennen Sie uns die Details des Vorfalls. Dies
    ist eine vertragliche Pflicht, um Ihren Versicherungsschutz nicht zu gefährden.


    2. **Identitätsprüfung:** Vor der Erfassung des Schadensfalls führen wir eine
    Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder eines validierten
    KYC-Prozesses durch, um sicherzustellen, dass nur autorisierte Personen Zugriff
    auf Ihren Vertrag haben.


    3. **Einreichung der Dokumentation:** Übermitteln Sie uns die notwendigen Belege.
    Wir bestätigen den Erhalt der Unterlagen und prüfen, ob der Schaden unter die
    Deckungssumme von 20.000.000 € fällt und ob Ausnahmen vorliegen.


    4. **Prüfung und Regulierung:** Wir prüfen den Anspruch. In diesem Schritt wird
    die vereinbarte Selbstbeteiligung von 150 € gegengerechnet. Wir informieren Sie
    über die Entscheidung zur Leistungszahlung.


    5. **Abschluss und Auszahlung:** Nach positivem Bescheid wird die Summe direkt
    an den Geschädigten oder an Sie (nach Nachweis der Zahlung) überwiesen.


    **Woran erkennen Sie, dass Ihr Anliegen vollständig erledigt ist?**

    Der Vorgang ist beendet, wenn Sie eine schriftliche Abrechnung über die regulierte
    Summe erhalten haben und der Fall in Ihrem Kundenportal als ''Abgeschlossen''
    markiert ist.


    Sollten Sie Fragen zu den Kosten haben, lesen Sie bitte Privathaftpflicht Komfort
    — Kosten und Entgelte.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 02b72e65-b637-50af-b9a4-68517261ca79
  title: Privathaftpflicht Komfort — Abweichung von Ihren Unterlagen
  body: 'In der täglichen Unterstützung unserer Kunden kann es vorkommen, dass die
    uns vorliegenden Vertragsdaten nicht mit den Unterlagen übereinstimmen, die der
    Kunde vorlegt. Dies erfordert ein präzises und strukturiertes Vorgehen des Support-Agents.


    **Symptom:**

    Der Kunde gibt an, dass beispielsweise eine andere Deckungssumme oder ein anderer
    Beitrag (abweichend vom beispielhaften Jahresbeitrag von 59 €) vereinbart wurde,
    als in unserem System hinterlegt ist.


    **Ursachenanalyse und Prüfung:**


    1. **Überprüfung der Vertragsversion:** Prüfen Sie, ob der Kunde eine ältere Version
    der Police vorlegt oder ob eine nachträgliche Tarifanpassung im System noch nicht
    vollständig synchronisiert wurde.


    2. **Validierung der Identität:** Bevor Sie Details zu Abweichungen besprechen,
    führen Sie zwingend eine Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses durch. Dies verhindert, dass vertrauliche
    Daten an unbefugte Dritte gelangen.


    3. **Prüfung der Dokumentenechtheit:** Vergleichen Sie die vom Kunden eingereichten
    Dokumente mit unseren internen Protokollen zur Vertragserstellung.


    **Lösungsschritte:**


    - **Dokumentenabgleich:** Wenn der Kunde ein schriftliches Dokument vorlegt, das
    eine andere Vereinbarung belegt (z. B. eine abweichende Selbstbeteiligung von
    nicht 150 €), leiten Sie dieses Dokument an die Fachabteilung zur Prüfung weiter.

    - **Korrekturlauf:** Nach Bestätigung durch die Fachabteilung korrigieren wir
    die Daten in Ihrem Profil und senden Ihnen eine aktualisierte Versicherungsbestätigung
    zu.


    **Eskalation:**

    Sollte eine Einigung über die Richtigkeit der Unterlagen nicht möglich sein, wird
    der Vorgang an das Beschwerdemanagement geleitet. Wir handeln dabei stets fair
    und transparent. Falls keine Lösung gefunden wird, weisen wir den Kunden auf den
    kostenlosen Versicherungsombudsmann hin.


    Für weitere Informationen zum Identitätsschutz siehe Privathaftpflicht Komfort
    — Sicherheitstipps für Ihr Konto.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e0163f11-1d4f-5e2e-a38f-a7cf0caea858
  title: Hausratversicherung — Überblick
  body: 'Die Hausratversicherung der Hanseatica Versicherung bietet Ihnen einen umfassenden
    und verlässlichen Schutz für Ihr privates Eigentum innerhalb Ihrer vier Wände.
    In einer Zeit zunehmender Unsicherheiten positionieren wir uns als Ihr vertrauenswürdiger
    Partner, der hanseatische Zuverlässigkeit mit modernen, digitalen Prozessen vereint,
    um Ihren materiellen Lebensstandard bei unvorhersehbaren Ereignissen zu sichern.


    Unser Versicherungsschutz zeichnet sich durch Transparenz und Fairness aus. Wir
    verzichten auf komplizierte Unterversicherungsregelungen, sofern die Versicherungssumme
    angemessen bemessen ist, um Ihnen im Schadensfall eine unkomplizierte Abwicklung
    zu ermöglichen. Ein besonderes Merkmal unserer Police ist der spezialisierte Schutz
    gegen Fahrraddiebstahl, der eine Deckung von bis zu 1.000 € umfasst und somit
    auch Ihre Mobilität absichert.


    Die Kalkulation der Versicherungssumme erfolgt auf einer transparenten Basis:
    Wir rechnen mit einem Wert von 650 € pro Quadratmeter Wohnfläche. Dies stellt
    sicher, dass Ihr Hausrat realistisch bewertet und im Ernstfall adäquat ersetzt
    werden kann. Die Prämienstruktur ist risikobasiert und darauf ausgelegt, eine
    dauerhafte Solvenz sowie höchste Leistungsqualität zu gewährleisten.


    Um Ihnen eine erste Orientierung bei den Kosten zu geben, führen wir ein Beispiel
    an: Für eine durchschnittliche Wohnfläche von 70 m² beläuft sich der kalkulatorische
    Jahresbeitrag auf 96 €. Bitte beachten Sie, dass dieser Betrag als Orientierungswert
    dient und die endgültige Prämie von Ihren individuellen Risikofaktoren und gewählten
    Zusatzoptionen abhängt.


    Die Verwaltung Ihres Vertrages erfolgt bequem über unser Kundenportal. Wir legen
    höchsten Wert auf Sicherheit: Vor jeder zustandsändernden Aktion oder dem Zugriff
    auf vertrauliche Daten ist eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    zwingend erforderlich. Damit schützen wir Ihr Vermögen und Ihre Daten nach höchsten
    regulatorischen Standards.


    Zusammenfassend bietet die Hausratversicherung der Hanseatica Versicherung eine
    solide Absicherung Ihres Heims, gepaart mit einer fairen Preisgestaltung und einem
    Fokus auf die Bedürfnisse des deutschen Mittelstands.'
  domain: insurance
  product_category: hausrat
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: afdec764-0fd8-5708-954b-dc36e99a12f0
  title: 'Hausratversicherung — Jahresbeitrag für 70 m² Wohnfläche (Beispiel): Erklärung'
  body: 'Frage: Wie setzt sich der beispielhafte Jahresbeitrag von 96 € für eine Wohnfläche
    von 70 m² zusammen?


    Antwort: Der genannte Betrag von 96 € dient als transparenter Richtwert für unsere
    Kunden. Er basiert auf einer Standardkalkulation für eine durchschnittliche Wohnung
    mit 70 m², bei der wir eine versicherte Summe von 650 € pro Quadratmeter zugrunde
    legen. Die Prämie deckt die administrativen Kosten sowie die notwendigen regulatorischen
    Sicherheitsmargen ab, um eine dauerhafte Leistungsfähigkeit der Hanseatica Versicherung
    zu garantieren.


    Frage: Gilt dieser Preis von 96 € für jeden Kunden mit 70 m² Wohnfläche?


    Antwort: Nein. Da unsere Prämien risikobasiert kalkuliert werden, kann der tatsächliche
    Beitrag variieren. Faktoren wie die örtliche Gefahrenlage, bestehende Sicherheitsvorkehrungen
    oder gewählte Zusatzleistungen (wie die Erweiterung des Fahrraddiebstahlschutzes
    über die Standarddeckung von 1.000 € hinaus) beeinflussen die endgültige Prämie.
    Für eine präzise Berechnung Ihrer individuellen Kosten verweisen wir auf das Dokument
    Hausratversicherung — Preis- und Leistungsverzeichnis.'
