  institution_id: hanseatica_versicherung
- id: fd8df1f1-773a-57ad-af64-6ffaf2d392e6
  title: Berufsunfähigkeitsversicherung — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen Kunden eine Abweichung zwischen ihren Unterlagen und den Systemdaten
    melden.


    **Symptom**

    Der Kunde gibt an, dass die in seinen Unterlagen vermerkte monatliche Prämie (z.
    B. 68 €) oder die vereinbarte Rentensumme (z. B. 1.500 €) nicht mit den aktuellen
    Abrechnungen oder dem Systemstatus übereinstimmt.


    **Ursachenprüfung (Reihenfolge)**

    1. **Prüfung der letzten Vertragsänderungen:** Kontrollieren Sie, ob kürzlich
    Anpassungen vorgenommen wurden, die zu einer Beitragsänderung geführt haben.

    2. **Risikoklassifizierung:** Prüfen Sie, ob nach einer verspäteten Gesundheitsprüfung
    eine Neubewertung des Risikos erfolgte, was die Prämie erhöht haben könnte.

    3. **Zahlungsfehler:** Prüfen Sie, ob administrative Gebühren zur Deckung regulatorischer
    Sicherheitsmargen hinzugefügt wurden, die der Kunde fälschlicherweise als Prämienerhöhung
    interpretiert.


    **Lösungsweg**

    - **Bei Systemfehlern:** Korrigieren Sie den Datensatz umgehend gemäß der unterzeichneten
    Police und senden Sie dem Kunden eine schriftliche Bestätigung der Korrektur.

    - **Bei berechtigten Erhöhungen:** Erläutern Sie dem Kunden transparent die risikobasierte
    Kalkulation und warum die Abweichung zum Beispielwert von 68 € eingetreten ist.


    **Eskalation**

    Sollte der Kunde die Korrektur oder die Begründung nicht akzeptieren, leiten Sie
    den Vorgang strukturiert an das Beschwerdemanagement weiter. Verweisen Sie im
    Falle eines dauerhaften Dissens auf den kostenlosen Versicherungsombudsmann.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 30427abe-4075-5162-bb3a-6cde0b6ee997
  title: Fondsgebundene Rentenversicherung — Überblick
  body: 'Die Fondsgebundene Rentenversicherung der Hanseatica Versicherung ist eine
    moderne Lösung für den langfristigen Vermögensaufbau und die private Altersvorsorge,
    speziell konzipiert für die Anforderungen des deutschen Mittelstands. In einer
    Zeit volatiler Märkte bietet dieses Produkt die Möglichkeit, die Renditechancen
    von Investmentfonds mit der Sicherheit eines Versicherungsrahmens zu kombinieren.


    Das Kernziel dieser Vorsorge ist die existenzielle Absicherung im Alter durch
    eine flexible, fondsgebundene Strategie. Sie entscheiden selbst über die Ausgestaltung
    Ihrer Altersvorsorge, wobei wir auf hanseatische Zuverlässigkeit und transparente
    Kostenstrukturen setzen. Um den Zugang zu dieser Form der Anlage zu erleichtern,
    haben wir die Hürden für den Einstieg bewusst niedrig gehalten: Der Mindestbeitrag
    pro Monat beträgt lediglich 25 €.


    Transparenz ist ein Grundpfeiler unserer Philosophie. Daher legen wir die Kostenstruktur
    offen. Die Effektivkosten pro Jahr belaufen sich auf 1,1 %. Zudem gewährleisten
    wir eine faire Kalkulation der initialen Kosten; so ist die Abschlusskostenobergrenze
    auf 2,5 % der Beitragssumme begrenzt. Diese Kosten dienen der Deckung administrativer
    Aufwendungen sowie der Einhaltung regulatorischer Sicherheitsmargen, um eine dauerhafte
    Solvenz und höchste Leistungsqualität für unsere Versicherten zu garantieren.


    Die Fondsgebundene Rentenversicherung zeichnet sich durch anpassbare Bezugsrechte
    und eine transparente Verwaltung Ihrer Anlagen aus. Da es sich um ein fondsgebundenes
    Produkt handelt, partizipieren Sie direkt an der Wertentwicklung der gewählten
    Fonds, was bei einem langfristigen Anlagehorizont ein erhebliches Potenzial für
    Ihr Alterskapital bietet. Wir unterstützen Sie dabei, eine Auswahl zu treffen,
    die Ihren persönlichen Risikoprofilen entspricht, ohne dabei individuelle Steuer-
    oder Rechtsberatung zu leisten.


    Für weitere Details zu den spezifischen Kostenstrukturen verweisen wir auf das
    Dokument Fondsgebundene Rentenversicherung — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: fondsrente
  document_type: product_sheet
  source_authority: official
