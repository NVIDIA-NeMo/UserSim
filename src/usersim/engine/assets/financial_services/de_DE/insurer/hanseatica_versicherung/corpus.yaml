  body: 'Die Zulassung zur Fondsgebundenen Rentenversicherung richtet sich nach den
    folgenden Kriterien, um eine nachhaltige Absicherung des deutschen Mittelstands
    zu gewährleisten:


    | Kriterium | Anforderung | Ergebnis/Zugang |

    | :--- | :--- | :--- |

    | **Wohnsitz/Rechtsstatus** | Deutschland / EU | Vollständiger Zugang möglich
    |

    | **Monatlicher Beitrag** | $\ge$ 25 € | Vertragsschluss möglich |

    | **Monatlicher Beitrag** | $<$ 25 € | Kein Zugang (Mindestbeitrag nicht erfüllt)
    |

    | **Identitätsprüfung** | Erfolgreicher KYC-Prozess | Aktivierung des Kontos möglich
    |

    | **Identitätsprüfung** | Fehlgeschlagene MFA | Zugang gesperrt bis zur Klärung
    |


    Alle Anträge werden unter strikter Aufsicht der BaFin geprüft. Die Einhaltung
    des Mindestbeitrags von 25 € ist zwingend erforderlich, um die Deckung der administrativen
    Kosten und die Einhaltung regulatorischer Sicherheitsmargen zu garantieren.'
