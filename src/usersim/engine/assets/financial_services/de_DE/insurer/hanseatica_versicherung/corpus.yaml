- id: a472283b-6d4e-5bda-9da1-5706bd0f3eb6
  title: Berufsunfähigkeitsversicherung — für wen und wofür geeignet
  body: 'Die Berufsunfähigkeitsversicherung der Hanseatica Versicherung ist die zentrale
    Säule der Existenzsicherung für Personen im deutschen Mittelstand sowie für Angestellte
    und Selbstständige, die ihr Einkommen bei einem dauerhaften Erwerbsausfall absichern
    möchten.


    Dieses Produkt ist ideal für Sie, wenn Sie eine verlässliche finanzielle Basis
    benötigen, falls Sie Ihren Beruf aufgrund einer Krankheit oder eines Unfalls nicht
    mehr ausüben können. Wir schützen Sie vor den existenziellen Risiken einer langfristigen
    Erwerbsunfähigkeit durch eine transparente und faire Preisgestaltung.


    Die Kernmerkmale unseres Schutzes:

    - Leistungsauslöser: Die Versicherung greift, sobald eine Berufsunfähigkeit ab
    einem Grad von 50 % ärztlich festgestellt und durch uns anerkannt wird.

    - Finanzielle Absicherung: Zur Illustration dient ein Beispiel, bei dem eine monatliche
    Berufsunfähigkeitsrente von 1.500 € gezahlt wird, um die Lebenshaltungskosten
    und Verpflichtungen zu decken.

    - Kalkulierbare Kosten: Die Beiträge sind risikobasiert. Ein beispielhafter monatlicher
    Beitrag liegt bei 68 €.

    - Verlässlichkeit: Wir kombinieren traditionelle Werte mit modernen digitalen
    Prozessen, um eine schnelle und reibungslose Abwicklung im Leistungsfall zu garantieren.


    Durch die Kombination aus hoher Leistungsqualität und regulatorischer Sicherheit
    (Aufsicht durch die BaFin) bieten wir Ihnen einen Partner, der Ihnen auch in schwierigen
    Lebensphasen zur Seite steht. Es wird empfohlen, die Rentenhöhe so zu wählen,
    dass sie die Differenz zwischen Ihrem aktuellen Nettoeinkommen und etwaigen staatlichen
    Absicherungen deckt.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 21d5bda9-a1cd-5eae-93f3-3515725d48ec
  title: 'Berufsunfähigkeitsversicherung — monatliche Berufsunfähigkeitsrente (Beispiel):
    Erklärung'
  body: 'Hier finden Sie Erläuterungen zur Zusammensetzung und Bedeutung der monatlichen
    Rentenzahlungen.


    **Was bedeutet die Beispielsumme von 1.500 € monatlich?**

    Die Summe von 1.500 € stellt eine beispielhafte monatliche Rentenzahlung dar,
    die ein Versicherungsnehmer erhält, sofern die Bedingung einer Berufsunfähigkeit
    von mindestens 50 % erfüllt ist. Dies ist kein Pauschalwert für alle Verträge,
    sondern ein illustrativer Wert, um die Dimension der Absicherung zu verdeutlichen.


    **Wie wird die tatsächliche Rentenhöhe in meinem Vertrag festgelegt?**

    Die Rentenhöhe wird bei Vertragsabschluss basierend auf Ihrem Einkommen, Ihrem
    Beruf und dem gewählten Tarif festgelegt. Sie ist so kalkuliert, dass sie Ihre
    Existenz sichert.


    **Gibt es Einschränkungen bei der Auszahlung dieser Rente?**

    Die Auszahlung erfolgt, wenn die medizinische Prüfung ergibt, dass Sie Ihren Beruf
    nicht mehr zu mindestens 50 % ausüben können. Wir empfehlen, die Details in Ihrem
    individuellen Versicherungsschein zu prüfen. Für weitere Informationen besuchen
    Sie bitte das Dokument Berufsunfähigkeitsversicherung — Überblick.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 5e69e687-c819-55e1-b258-96018b2fe49e
  title: Berufsunfähigkeitsversicherung — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Versicherungsschutz anpassen oder beenden möchten, führen
    wir Sie durch den strukturierten Prozess der Vertragsänderung. Bitte beachten
    Sie, dass eine Kündigung der Berufsunfähigkeitsversicherung mit einem Verlust
    des Versicherungsschutzes verbunden ist und ein späterer Neuabschluss aufgrund
    Ihres Alters oder Gesundheitszustands teurer sein kann.


    **Voraussetzungen:**

    Sie benötigen Ihre Versicherungsnummer und einen gültigen Identitätsnachweis für
    die notwendige Identitätsprüfung (MFA).


    **Schritte zur Kündigung oder Schließung des Vertrages:**

    1. Teilen Sie uns Ihren Wunsch nach einer Vertragsbeendigung mit. Geben Sie dabei
    an, ob Sie ein reguläres Kündigungsrecht nutzen oder ein Sonderkündigungsrecht
    (z. B. nach einer Beitragserhöhung) geltend machen.

    2. Wir prüfen die Vertragslage und bestätigen Ihnen das Datum des Vertragsendes
    sowie etwaige Auswirkungen auf Ihren Schutz.

    3. Sie erhalten eine schriftliche Bestätigung über die Schließung des Vertrages.


    **Schritte zum Tarifwechsel:**

    1. Nennen Sie uns Ihren Wunsch nach einer Anpassung der Leistungen (z. B. Erhöhung
    der monatlichen Rente über die beispielhaften 1.500 € hinaus) oder eine Änderung
    des Beitrags (z. B. Anpassung des beispielhaften Beitrags von 68 €).

    2. Wir prüfen die Eignung des neuen Tarifs für Ihre aktuelle Lebenssituation und
    führen, falls erforderlich, eine erneute gesundheitliche Prüfung durch.

    3. Nach Ihrer Zustimmung passen wir den Tarif an und senden Ihnen die aktualisierten
    Vertragsunterlagen zu.


    **Wichtige Fristen:**

    Beachten Sie das Widerrufsrecht von 30 Tagen bei Abschluss dieses Produkts. Eine
    Kündigung wird wirksam, sobald Ihnen die Bestätigung unserer Fachabteilung vorliegt.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: cb04162d-6bdc-5335-b605-8ef8c9afac16
  title: Berufsunfähigkeitsversicherung — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'In diesem Leitfaden werden Symptome behandelt, bei denen Kunden Abweichungen
    bei ihren Prämienzahlungen oder Rentenleistungen feststellen.


    **Symptom: Der abgebuchte Betrag weicht vom beispielhaften Beitrag von 68 € ab.**

    - **Mögliche Ursachen:** Es könnte eine vereinbarte Beitragsanpassung vorliegen,
    eine Änderung des Risikoprofils oder die Addition von Verwaltungsgebühren zur
    Deckung administrativer Kosten.

    - **Prüfung:** Überprüfen Sie die letzte Beitragsanpassungsmitteilung in Ihren
    Unterlagen.

    - **Lösung:** Wir gleichen den abgebuchten Betrag mit den vertraglich vereinbarten
    Konditionen ab. Bei einem Fehler korrigieren wir den Betrag und erstatten Differenzen
    umgehend.


    **Symptom: Die ausgezahlte Rentenzahlung entspricht nicht den erwarteten 1.500
    €.**

    - **Mögliche Ursachen:** Die Berufsunfähigkeit wurde möglicherweise nur teilweise
    anerkannt (Grad zwischen 50 % und dem vollversicherten Maximum) oder es liegt
    eine Verrechnung mit anderen Bezügen vor.

    - **Prüfung:** Prüfen Sie das Schreiben der medizinischen Fachabteilung bezüglich
    des festgestellten Grades der Berufsunfähigkeit.

    - **Lösung:** Wir erläutern Ihnen die Berechnungsgrundlage der aktuellen Zahlung.
    Sollte ein Rechenfehler vorliegen, wird die Differenz nachgezahlt.


    **Eskalation:**

    Wenn eine Lösung im Gespräch nicht erzielt wird, leiten wir den Fall strukturiert
    an das Beschwerdemanagement weiter. Der Kunde erhält innerhalb von 14 Tagen eine
    schriftliche Stellungnahme. Bei ausbleibendem Konsens verweisen wir aktiv auf
    den kostenlosen Versicherungsombudsmann.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 251beafc-6beb-536c-8371-636d140505fc
  title: Berufsunfähigkeitsversicherung — erforderliche Unterlagen
  body: 'Für den Abschluss einer Berufsunfähigkeitsversicherung ist eine präzise Dokumentation
    erforderlich, um die risikobasierte Kalkulation (z. B. ein Beitrag von 68 €) zu
    ermöglichen.


    | Erforderliche Unterlage | Zweck | Ergebnis bei Vorliegen |

    | :--- | :--- | :--- |

    | Gültiger Personalausweis / Reisepass | Identitätsprüfung / KYC-Prozess | Identität
    verifiziert; Prozess kann fortgesetzt werden |

    | Vollständige Gesundheitsprüfung (Fragebogen) | Erfüllung der vorvertraglichen
    Anzeigepflicht | Risikoklassifizierung und Beitragsfestlegung |

    | Aktueller Einkommensnachweis / Gehaltsabrechnung | Festlegung der Rentenhöhe
    (z. B. 1.500 €) | Plausibilitätsprüfung der Absicherungshöhe |

    | Berufsbeschreibung / Tätigkeitsnachweis | Einstufung der Berufsgruppe | Festlegung
    des versicherungstechnischen Risikos |


    Sollten Unterlagen unvollständig sein, verzögert sich die Vertragserteilung, bis
    alle Nachweise vorliegen oder eine alternative medizinische Untersuchung durch
    einen unserer Partnerärzte erfolgt ist.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: eligibility_matrix
  source_authority: official
