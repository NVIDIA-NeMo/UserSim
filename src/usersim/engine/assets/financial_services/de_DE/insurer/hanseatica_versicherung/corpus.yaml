- id: c7421a1a-ec23-55ff-9f2d-e12ab83f37c7
  title: 'Fondsgebundene Rentenversicherung — Effektivkosten pro Jahr: Erklärung'
  body: 'Frage: Was genau bedeuten die Effektivkosten von 1,1 % pro Jahr für meine
    Rentenvorsorge?


    Antwort: Die Effektivkosten von 1,1 % fassen alle Kosten zusammen, die während
    der Laufzeit Ihres Vertrages anfallen. Dazu gehören sowohl die Verwaltungskosten
    der Versicherung als auch die Kosten der gewählten Investmentfonds. Diese Kennzahl
    ermöglicht Ihnen einen transparenten Vergleich der Kostenbelastung. Da die Kosten
    direkt aus dem Fondsvolumen oder den Beiträgen entnommen werden, mindern sie die
    Bruttorendite Ihrer Anlagen. Eine geringe Kostenquote ist entscheidend, um den
    Zinseszinseffekt über Jahrzehnte optimal zu nutzen.


    Frage: Sind in diesen 1,1 % auch die Kosten für den Abschluss des Vertrages enthalten?


    Antwort: Die Effektivkosten bilden die laufenden Kosten ab. Die Kosten für den
    Vertragsschluss sind separat geregelt und unterliegen einer Obergrenze (Acquisition
    Cost Cap) von 2,5 %, um die anfängliche Kapitalbildung nicht übermäßig zu beeinträchtigen.
    Details hierzu finden Sie in der Fondsgebundene Rentenversicherung — Preis- und
    Leistungsverzeichnis.'
  domain: insurance
  product_category: fondsrente
  document_type: faq
