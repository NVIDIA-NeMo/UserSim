  institution_id: hanseatica_versicherung
- id: b84e9f57-d1e4-500b-b18b-aab1b8bdaf6b
  title: Privathaftpflicht Komfort — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen der Privathaftpflicht Komfort.


    **Wie hoch ist die Prämie für die Privathaftpflicht Komfort?**

    Als Beispiel für einen Standardtarif beträgt der Jahresbeitrag 59 €. Die endgültige
    Prämie ist risikobasiert und wird transparent kalkuliert, um eine dauerhafte Solvenz
    und höchste Leistungsqualität zu gewährleisten.


    **Gibt es eine Selbstbeteiligung im Schadenfall?**

    Ja, bei der Privathaftpflicht Komfort ist eine Selbstbeteiligung von 150 € vorgesehen.
    Dies bedeutet, dass Sie im Falle eines erstattungsfähigen Schadens die ersten
    150 € selbst tragen.


    **Wie setzen sich die Gebühren zusammen?**

    Unsere Gebühren dienen primär der Deckung administrativer Kosten sowie der Einhaltung
    regulatorischer Sicherheitsmargen unter der Aufsicht der BaFin.


    Für eine detaillierte Aufstellung aller Kostenkomponenten verweisen wir auf das
    Dokument Privathaftpflicht Komfort — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 14583a4e-67ab-5d9a-b28e-56c8deff6721
  title: Privathaftpflicht Komfort — Status oder Verlauf einsehen
  body: 'Wenn Sie den aktuellen Status Ihrer Police oder den Verlauf eines gemeldeten
    Schadensfalls einsehen möchten, führen Sie bitte die folgenden Schritte durch.
    Dieser Prozess ist so gestaltet, dass Ihre Daten durch eine eindeutige Identitätsprüfung
    geschützt bleiben.


    **Voraussetzungen:**

    Sie benötigen Ihren gültigen Zugang zum Kundenportal oder Ihre Versicherungsnummer
    sowie ein verifiziertes Endgerät für die Multi-Faktor-Authentifizierung.


    **Schritte zur Einsichtnahme:**


    1. **Identitätsprüfung:** Fordern Sie den Zugriff auf Ihre Vertragsdaten an. Sie
    müssen sich in diesem Schritt mittels Multi-Faktor-Authentifizierung (MFA) oder
    durch einen validierten KYC-Prozess legitimieren. Erst nach erfolgreicher Prüfung
    schalten wir den Zugriff auf die vertraulichen Daten frei.


    2. **Anforderung des Status:** Teilen Sie uns mit, für welchen Bereich Sie den
    Status einsehen möchten (z. B. ''Aktueller Versicherungsstatus'' oder ''Verlauf
    der Schadensmeldung vom [Datum]'').


    3. **Prüfung der Dokumentation:** Wir rufen den aktuellen Stand Ihrer Akte ab.
    Hierbei prüfen wir, ob alle notwendigen Unterlagen vorliegen oder ob noch Informationen
    für die Bearbeitung fehlen.


    4. **Erhalt der Auskunft:** Wir bestätigen Ihnen den aktuellen Status. Dies kann
    beispielsweise ''In Bearbeitung'', ''Geprüft'' oder ''Abgeschlossen'' sein. Im
    Falle einer Schadensregulierung erhalten Sie eine detaillierte Aufstellung der
    bereits geleisteten Zahlungen abzüglich Ihrer Selbstbeteiligung von 150 €.


    **Woran erkennen Sie, dass der Vorgang erfolgreich war?**

    Der Vorgang ist abgeschlossen, wenn Sie eine schriftliche Bestätigung oder eine
    aktualisierte Statusanzeige in Ihrem Portal erhalten haben, die den präzisen Stand
    Ihrer Angelegenheit widerspiegelt.


    Sollten Sie Änderungen an Ihren Daten wünschen, finden Sie die entsprechenden
    Schritte im Dokument Privathaftpflicht Komfort — etwas ändern.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 6a5a223d-9044-599f-9e35-7c377dcf9b14
  title: Privathaftpflicht Komfort — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf Vertragsänderung oder eine Schadensmeldung
    im System der Hanseatica Versicherung abgelehnt oder gesperrt wird. In der Regel
    äußert sich dies durch eine entsprechende Fehlermeldung im Portal oder eine Benachrichtigung
    per E-Mail.


    **Mögliche Ursachen:**


    1. **Fehlgeschlagene Identitätsprüfung:** Da wir vor jeder zustandsändernden Aktion
    eine zwingende Identitätsprüfung verlangen, kann ein Vorgang gesperrt werden,
    wenn die Multi-Faktor-Authentifizierung (MFA) nicht erfolgreich abgeschlossen
    wurde oder der KYC-Prozess nicht validiert ist.


    2. **Unvollständige Unterlagen:** Wenn bei einer Schadensmeldung die geforderten
    Nachweise fehlen, kann der Vorgang systemseitig gestoppt werden, bis die ''Unverzügliche
    Schadenmeldung'' vollständig dokumentiert ist.


    3. **Regulatorische Sperren:** In seltenen Fällen führen Unstimmigkeiten in den
    Risikoangaben zu einer vorübergehenden Sperre, um die Einhaltung des Versicherungsvertragsgesetzes
    zu prüfen.


    **Vorgehensweise zur Lösung:**


    - **Prüfung der Authentifizierung:** Stellen Sie sicher, dass Ihr verifiziertes
    Gerät für die MFA bereitsteht. Falls Sie keinen Zugriff mehr auf Ihr Gerät haben,
    fordern Sie eine erneute Validierung Ihres KYC-Status an.

    - **Abgleich der Dokumente:** Überprüfen Sie, ob alle erforderlichen Informationen
    (z. B. Schadensdatum, Beteiligte, Fotos) übermittelt wurden.

    - **Anforderung einer manuellen Prüfung:** Wenn die automatisierten Schritte nicht
    helfen, bitten Sie uns um eine manuelle Prüfung durch die Fachabteilung.


    **Eskalationsprozess:**

    Sollte der Vorgang trotz korrekter Daten weiterhin gesperrt bleiben, leiten wir
    die Angelegenheit strukturiert über die zuständige Fachabteilung an unser Beschwerdemanagement
    weiter. Sie erhalten innerhalb der regulären Geschäftszeiten (MEZ) eine Rückmeldung
    über den Fortschritt. Falls kein Konsens erzielt wird, verweisen wir Sie aktiv
    an den kostenlosen Versicherungsombudsmann.


    Weitere Details zu technischen Problemen finden Sie in Privathaftpflicht Komfort
    — Probleme mit Zugang oder Login.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 2cf74ae4-65df-5816-aa91-23b7c3ef9d50
  title: Privathaftpflicht Komfort — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Agenten bei der Entscheidungshilfe für
    Kunden, die ein Upgrade auf die Privathaftpflicht Komfort erwägen.


    Ein Wechsel zur Privathaftpflicht Komfort ist insbesondere dann ratsam, wenn der
    Kunde eine maximale Absicherung seines Privatvermögens anstrebt. Der entscheidende
    Faktor ist die Deckungssumme von 20.000.000 €, welche im Vergleich zu Basis-Tarifen
    einen signifikant höheren Schutz gegen existenzbedrohende Haftungsansprüche bietet.


    **Wann sich das Upgrade lohnt:**

    - **Hoher Vermögenswert:** Für Kunden des Mittelstands, deren Privatvermögen durch
    eine Standarddeckung nicht ausreichend geschützt wäre.

    - **Risikoprofil:** Wenn die Lebenssituation (z. B. Immobilienbesitz, hohe Verantwortung)
    ein potenziell höheres Schadensrisiko birgt.


    **Abwägung:**

    Im Gegenzug akzeptiert der Kunde eine Selbstbeteiligung von 150 € pro Schadenfall.
    Dies ist ein fairer Trade-off für die extrem hohe Deckungssumme. Ein Beispiel
    für die Kostenbelastung ist ein Jahresbeitrag von 59 €.


    **Empfehlung:**

    Das Produkt eignet sich für Kunden, die Sicherheit über die geringste Einzelkostenerstattung
    (wegen der Selbstbeteiligung) stellen. Es ist weniger geeignet für Kunden, die
    eine Versicherung ohne Selbstbeteiligung suchen, auch wenn dies oft zu Lasten
    der Gesamtsumme geht. Für einen detaillierten Vergleich siehe Privathaftpflicht
    Komfort — im Vergleich zu einem ähnlichen Produkt des Hauses.'
