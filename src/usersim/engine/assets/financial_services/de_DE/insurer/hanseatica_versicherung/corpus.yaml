  institution_id: hanseatica_versicherung
- id: 9d272e13-9560-5080-8582-a04c17d7f747
  title: Berufsunfähigkeitsversicherung — Risikohinweise
  body: 'Im Rahmen der Transparenzpflicht der Hanseatica Versicherung weisen wir auf
    folgende regulatorische und vertragliche Risiken hin:


    1. Vorvertragliche Anzeigepflicht: Die Richtigkeit Ihrer Angaben im Gesundheitsfragebogen
    ist essenziell. Eine Verletzung der vorvertraglichen Anzeigepflicht kann dazu
    führen, dass wir im Leistungsfall die Zahlung der monatlichen Rente (z. B. 1.500
    €) ganz oder teilweise verweigern oder den Vertrag kündigen.


    2. Definition der Berufsunfähigkeit: Die Leistung wird erst erbracht, wenn ein
    Grad der Berufsunfähigkeit von mindestens 50 % vorliegt. Eine geringfügige Einschränkung
    der Arbeitsfähigkeit führt nicht zur Rentenzahlung.


    3. Keine Wertentwicklungsgarantie: Wir leisten edukative Erläuterungen zur Produktwahl,
    garantieren jedoch niemals eine spezifische Wertentwicklung oder eine Beitragsstabilität
    über die gesamte Laufzeit, da die Prämien risikobasiert kalkuliert werden.


    4. Widerrufsrecht: Gemäß den gesetzlichen Bestimmungen für Lebens- und Rentenversicherungen
    steht Ihnen ein Widerrufsrecht von 30 Tagen ab Vertragsschluss zu. Für allgemeine
    Versicherungsverträge beträgt diese Frist 14 Tage.


    5. Aufsicht: Wir agieren unter strikter Aufsicht der BaFin und halten das Versicherungsvertragsgesetz
    (VVG) ein. Datenschutzrichtlinien werden proaktiv und transparent kommuniziert.


    Wir leisten keine individuelle Steuer- oder Rechtsberatung. Wir empfehlen dringend,
    die Eignung des Produkts für Ihre individuelle Situation mit einem qualifizierten
    Steuerberater oder Rechtsanwalt zu prüfen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 646d3b29-7dd4-50ae-b933-2fd8ee58fdb9
  title: Berufsunfähigkeitsversicherung — wie Zinsen berechnet und angewendet werden
  body: 'Für Support-Mitarbeiter: Die Berufsunfähigkeitsversicherung ist primär ein
    Risikoprodukt und kein klassisches Anlageprodukt. Daher gibt es keinen Zinsertrag
    für den Kunden, wie er bei einer Fondsrente vorkommen würde.


    Die Berechnung der Beiträge (z. B. der beispielhafte Monatsbeitrag von 68 €) basiert
    auf dem versicherungstechnischen Rechnungszins. Dieser Zins wird intern verwendet,
    um die zukünftigen Rentenverpflichtungen (z. B. 1.500 € monatlich) auf den heutigen
    Barwert abzuzinsen und so die notwendige Prämie zu ermitteln.


    Folgende Faktoren beeinflussen die Prämienkalkulation:

    - **Risikoprofil:** Berücksichtigung des Berufs und des Gesundheitszustands beim
    Abschluss.

    - **Sicherheitsmargen:** Einbeziehung regulatorischer Margen zur Gewährleistung
    der dauerhaften Solvenz.

    - **Inflationsausgleich:** Falls im Vertrag eine Beitragsdynamik vereinbart wurde,
    steigen sowohl die Beiträge als auch die Rentenleistung in festgelegten Intervallen.


    Es gibt keine variablen Zinssätze, die der Kunde auf einem Konto sieht. Die Prämien
    sind fest oder dynamisch gemäß Vertrag fixiert, um die höchste Leistungsqualität
    zu gewährleisten.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: a0413748-8cf4-551a-9fad-c169ea9ea7a2
  title: Berufsunfähigkeitsversicherung — Empfehlungs- und Treueangebot
  body: 'Hanseatica Versicherung schätzt das Vertrauen, das Sie in unsere hanseatische
    Zuverlässigkeit setzen. Um die Absicherung des deutschen Mittelstands weiter zu
    stärken, bieten wir Ihnen ein besonderes Empfehlungs- und Treueangebot an.


    Wenn Sie einen neuen Kunden an unsere Berufsunfähigkeitsversicherung vermitteln,
    profitieren sowohl Sie als auch die geworbene Person von einem einmaligen Beitragsnachlass
    auf die erste Jahresprämie. Die Absicherung Ihrer Existenz ist ein wertvolles
    Gut – ein Beispiel für eine solide Absicherung ist eine monatliche Rente von 1.500
    € bei einem beispielhaften Monatsbeitrag von 68 €.


    Dieses Angebot gilt für alle Abschlüsse, die bis zum 31. Dezember 2024 eingegangen
    sind. Wir laden Sie ein, Ihren Bekannten und Geschäftspartnern den Weg zu einer
    transparenten und fairen Absicherung zu weisen. Bitte wenden Sie sich für die
    Details der Gutschrift an Ihren zuständigen Kundenbetreuer.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 4d999a84-ad8a-505f-be41-3adc8e7a86e2
  title: Berufsunfähigkeitsversicherung — Sicherheitstipps für Ihr Konto
  body: 'Der Schutz Ihrer persönlichen Daten und Ihrer finanziellen Absicherung hat
    bei Hanseatica Versicherung höchste Priorität. Da die Berufsunfähigkeitsversicherung
    sensible Gesundheitsdaten und Finanzinformationen enthält, bitten wir Sie, die
    folgenden Sicherheitshinweise strikt zu beachten.


    Ein zentraler Pfeiler unserer Sicherheit ist die eindeutige Identitätsprüfung.
    Bevor wir zustandsändernde Aktionen an Ihrem Vertrag vornehmen oder Ihnen Zugriff
    auf vertrauliche Daten gewähren, ist eine Multi-Faktor-Authentifizierung oder
    ein validierter KYC-Prozess zwingend erforderlich. Bitte seien Sie wachsam:


    1. Hanseatica Versicherung wird Sie niemals per E-Mail oder SMS dazu auffordern,
    Ihr Passwort oder Ihre MFA-Codes auf einer externen Webseite einzugeben.

    2. Seien Sie misstrauisch gegenüber unerwarteten Anrufen, in denen sich Personen
    als Mitarbeiter ausgeben und dringende Kontenänderungen verlangen.

    3. Nutzen Sie für die Verwaltung Ihres Vertrages ausschließlich unser gesichertes
    Kundenportal.


    Sollten Sie eine verdächtige Kommunikation bemerken oder den Verdacht haben, dass
    Ihre Zugangsdaten kompromittiert wurden, melden Sie uns dies bitte unverzüglich
    über die regulären Geschäftszeiten per Telefon oder E-Mail. Eine zeitnahe Meldung
    ist entscheidend, um unbefugte Änderungen an Ihrem Versicherungsschutz, wie etwa
    Anpassungen der Rentenhöhe oder Beitragszahlungen, zu verhindern. Betrugsversuche
    werden von uns konsequent dokumentiert und an die zuständigen Behörden gemeldet.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 8185404f-ac55-5d9b-9209-d9d4ae63d9ba
  title: Berufsunfähigkeitsversicherung — Änderung der Bedingungen
  body: 'Die Bedingungen der Berufsunfähigkeitsversicherung von Hanseatica Versicherung
    unterliegen dem Versicherungsvertragsgesetz und der Aufsicht der BaFin. Eine Änderung
    der Bedingungen erfolgt transparent und unter Einhaltung der gesetzlichen Fristen.


    Ein wesentlicher Bestandteil Ihres Vertrages ist der Grad der Berufsunfähigkeit.
    Die Leistung tritt ein, wenn eine Berufsunfähigkeit ab 50 % vorliegt. Änderungen
    an dieser Schwelle oder an der Definition der Berufsunfähigkeit werden Ihnen schriftlich
    mitgeteilt. Sie haben in diesem Fall das Recht, den Vertrag gemäß den geltenden
    Bestimmungen zu prüfen.


    Die Prämienkalkulation erfolgt risikobasiert. Sollten sich die regulatorischen
    Sicherheitsmargen oder die administrativen Kosten signifikant ändern, behalten
    wir uns eine Anpassung der Beiträge vor. Ein beispielhafter Beitrag von 68 € kann
    sich somit durch eine Änderung des Risikoprofils oder allgemeine Kostenanpassungen
    verschieben.


    Wir erinnern Sie daran, dass die vorvertragliche Anzeigepflicht die Basis für
    den Versicherungsschutz bildet. Änderungen in Ihrem Gesundheitszustand oder Ihrem
    Berufsbild müssen uns mitgeteilt werden, um die dauerhafte Solvenz und Leistungsqualität
    zu gewährleisten. Die Kündigungsfristen richten sich nach den individuellen Vertragsvereinbarungen
    sowie den gesetzlichen Vorgaben des Versicherungsvertragsgesetzes. Das Widerrufsrecht
    beträgt grundsätzlich 14 Tage nach Vertragsschluss, bei Lebens- und Rentenversicherungen
    30 Tage.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: c0e7ad08-7085-51f8-8cbd-04c02d887987
  title: Berufsunfähigkeitsversicherung — Schritt für Schritt starten
  body: 'Dieser Leitfaden dient Support-Mitarbeitern zur Unterstützung von Kunden
    beim Erstabschluss der Berufsunfähigkeitsversicherung. Ziel ist ein transparenter
    Prozess, der die hanseatische Zuverlässigkeit widerspiegelt.


    Schritt 1: Bedarfsanalyse und Zielgruppenprüfung

    Klären Sie mit dem Kunden seine aktuelle berufliche Situation und die gewünschte
    Absicherungshöhe. Erläutern Sie, dass die Existenzsicherung bei einer Berufsunfähigkeit
    ab 50 % greift.


    Schritt 2: Erfassung der vorvertraglichen Anzeigepflicht

    Führen Sie den Kunden durch den Prozess der Gesundheitsprüfung. Weisen Sie präzise
    auf die Bedeutung der wahrheitsgemäßen Angaben hin, da diese die Basis für die
    spätere Leistungsprüfung bilden.


    Schritt 3: Kalkulation der Konditionen

    Basierend auf den Risikofaktoren wird die Prämie ermittelt. Nutzen Sie zur Illustration
    beispielhafte Werte: Ein monatlicher Beitrag von 68 € kann beispielsweise eine
    monatliche Berufsunfähigkeitsrente von 1.500 € absichern.


    Schritt 4: Identitätsprüfung und KYC

    Bevor der Vertrag final erstellt wird, muss eine eindeutige Identitätsprüfung
    mittels Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses durchgeführt
    werden.


    Schritt 5: Abschluss und Aufklärung

    Übermitteln Sie die Vertragsunterlagen digital über das Kundenportal. Weisen Sie
    den Kunden explizit auf das Widerrufsrecht von 30 Tagen hin, da es sich hierbei
    um ein Rentenprodukt handelt. Stellen Sie sicher, dass der Kunde die Bedingungen
    zur Leistungsfälligkeit (50 % Berufsunfähigkeit) vollständig verstanden hat.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 08109391-3edf-524b-8066-a5df4b799fa0
  title: 'Berufsunfähigkeitsversicherung — Leistung ab Grad der Berufsunfähigkeit:
    Erklärung'
  body: 'Frage: Ab wann genau habe ich Anspruch auf die vereinbarte Rentenzahlung?

    Antwort: Die Leistung unserer Berufsunfähigkeitsversicherung wird fällig, wenn
    eine ärztlich attestierte Berufsunfähigkeit ab 50 % vorliegt. Das bedeutet, dass
    Sie Ihren aktuellen Beruf aufgrund einer Krankheit oder eines Unfalls zu mindestens
    der Hälfte nicht mehr ausüben können.


    Frage: Wie wird dieser Grad von 50 % in der Praxis ermittelt?

    Antwort: Die Feststellung erfolgt durch eine sorgfältige Prüfung Ihrer medizinischen
    Unterlagen sowie die Beurteilung Ihrer spezifischen beruflichen Tätigkeiten. Hierbei
    wird geprüft, ob Sie in der Lage sind, die wesentlichen Aufgaben Ihres Berufs
    noch auszuführen.


    Frage: Was passiert, wenn die Berufsunfähigkeit geringer als 50 % ist?

    Antwort: In diesem Fall ist die Bedingung für die Rentenzahlung nicht erfüllt.
    Wir empfehlen Ihnen, in der Berufsunfähigkeitsversicherung — Überblick die Details
    zu den verschiedenen Tarifoptionen einzusehen, um Ihren Schutz optimal anzupassen.'
  domain: insurance
