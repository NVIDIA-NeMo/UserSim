  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1929421c-f374-50a4-b56b-66c6c6ae7de7
  title: Kfz-Versicherung — ein typisches Anliegen vollständig erledigen
  body: 'Ein typisches Anliegen in der Kfz-Versicherung ist die Meldung und Abwicklung
    eines Schadensfalls. In diesem Leitfaden zeigen wir Ihnen, wie dieser Prozess
    bei uns von Anfang bis Ende funktioniert.


    **Voraussetzungen**

    Sie benötigen Ihre Versicherungsscheinnummer, die Details zum Schadensereignis
    (Ort, Zeit, Beteiligte) sowie idealerweise Fotos der Schäden und ein Polizeiprotokoll
    (bei Unfällen mit anderen Beteiligten oder Diebstahl).


    **Schritte zur Schadensabwicklung**


    1. **Schadensmeldung:** Informieren Sie uns unverzüglich über das eingetretene
    Ereignis. Übermitteln Sie uns dabei die Beschreibung des Hergangs und die beteiligten
    Fahrzeuge.

    2. **Einreichung von Belegen:** Senden Sie uns die erforderlichen Unterlagen zu.
    Dazu gehören Fotos der beschädigten Stellen, der Europäische Unfallbericht oder
    die Bestätigung der Polizei. Diese Dokumente dienen der Beweissicherung und beschleunigen
    die Prüfung.

    3. **Prüfung durch die Fachabteilung:** Wir prüfen den gemeldeten Schaden auf
    Deckungsfähigkeit. Dabei wird geprüft, ob das Ereignis durch Ihren Tarif (Haftpflicht,
    Teilkasko oder Vollkasko) abgedeckt ist.

    4. **Festlegung der Regulierung:** Wir teilen Ihnen mit, wie der Schaden reguliert
    wird. Wenn Sie eine Kaskodeckung haben, wird die vereinbarte Selbstbeteiligung
    (150 € bei Teilkasko oder 300 € bei Vollkasko) in Abzug gebracht.

    5. **Abschluss der Zahlung:** Nach der finalen Freigabe erfolgt die Auszahlung
    der Entschädigung oder die direkte Begleichung der Reparaturkosten bei einem zertifizierten
    Partner.


    **Woran erkennen Sie, dass das Anliegen erledigt ist?**

    Das Anliegen ist vollständig erledigt, wenn Sie eine schriftliche Bestätigung
    über die Schadensregulierung erhalten haben und die entsprechende Zahlung auf
    Ihrem Konto eingegangen ist oder die Reparatur Ihres Fahrzeugs erfolgreich abgeschlossen
    wurde.


    Für Fragen zur Kostenübernahme lesen Sie bitte Kfz-Versicherung — Kosten und Entgelte.'
  domain: insurance
  product_category: kfz
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: c363753a-ea79-5eac-a7a9-a5556c666e67
  title: Kfz-Versicherung — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Bearbeitung von Fällen,
    in denen die vom Kunden gemeldeten Daten nicht mit den eingereichten offiziellen
    Unterlagen übereinstimmen.


    **Symptom**

    Bei der Prüfung eines Antrags oder einer Vertragsänderung stellt der Mitarbeiter
    fest, dass Angaben (z. B. Fahrzeugmodell, Erstzulassungsdatum, Kilometerstand
    oder Halterverhältnisse) von der Zulassungsbescheinigung oder anderen Nachweisen
    abweichen.


    **Mögliche Ursachen**

    * **Tippfehler:** Einfache Übertragungsfehler bei der Eingabe der Daten im Kundenportal.

    * **Veraltete Dokumente:** Der Kunde hat eine alte Kopie der Zulassungsbescheinigung
    eingereicht, obwohl das Fahrzeug bereits umgemeldet wurde.

    * **Fehlinterpretation:** Der Kunde hat technische Begriffe des Fahrzeugs falsch
    zugeordnet.

    * **Vorsätzliche Falschangaben:** Versuch, durch die Angabe eines niedrigeren
    Risikoprofils eine geringere Prämie zu erhalten.


    **Lösungswege für den Support**

    1. **Abgleich und Kommunikation:** Weisen Sie den Kunden höflich auf die spezifische
    Abweichung hin. Fragen Sie nach, ob es sich um einen Übertragungsfehler handelt
    oder ob neue Unterlagen vorliegen.

    2. **Anforderung aktueller Belege:** Fordern Sie den Kunden auf, ein aktuelles,
    gut lesbares Foto oder einen Scan der gültigen Zulassungsbescheinigung Teil I
    einzureichen.

    3. **Identitätsverifizierung:** Bevor Daten im System geändert werden, muss zwingend
    eine erneute Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder eines
    validierten KYC-Prozesses erfolgen.

    4. **Prämienanpassung:** Wenn die korrekten Daten ein höheres Risiko darstellen,
    muss die Prämie neu kalkuliert werden. Informieren Sie den Kunden transparent
    über den neuen Betrag.


    **Eskalation**

    Sollte der Kunde die Korrektur verweigern oder der Verdacht auf vorsätzliche Täuschung
    zur Prämiensenkung bestehen, ist der Vorgang unverzüglich an die Fachabteilung
    für Compliance und das Beschwerdemanagement zu leiten. Solche Fälle werden konsequent
    dokumentiert, da sie die Solvenz und die regulatorischen Sicherheitsmargen gefährden
    können.'
  domain: insurance
  product_category: kfz
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: d66f452d-7afb-50ae-b700-93561251874c
  title: Berufsunfähigkeitsversicherung — Überblick
  body: 'Die Berufsunfähigkeitsversicherung der Hanseatica Versicherung dient der
    essenziellen Absicherung Ihres Lebensstandards und Ihrer Existenz. Im Falle einer
    schweren Erkrankung oder eines Unfalls, der Sie an der Ausübung Ihrer beruflichen
    Tätigkeit hindert, bietet diese Versicherung eine verlässliche finanzielle Grundlage,
    um die Zeit der Genesung oder eine berufliche Neuorientierung ohne existenzbedrohende
    Sorgen zu überbrücken.


    Das Herzstück unserer Absicherung ist die Leistung bei einer Berufsunfähigkeit
    ab 50 %. Wenn medizinisch festgestellt wird, dass Sie Ihren Beruf zu mindestens
    50 % nicht mehr ausüben können, erhalten Sie die vereinbarte monatliche Rente.
    Zur Illustration eines möglichen Szenarios: Bei einem beispielhaften monatlichen
    Beitrag von 68 € könnte eine monatliche Berufsunfähigkeitsrente in Höhe von 1.500
    € gesichert werden. Bitte beachten Sie, dass die tatsächlichen Konditionen individuell
    auf Basis Ihres Risikoprofils kalkuliert werden.


    Ein zentraler Pfeiler unseres Versprechens ist die hanseatische Zuverlässigkeit
    und Transparenz. Wir legen großen Wert auf eine sorgfältige vorvertragliche Anzeigepflicht.
    Dies bedeutet, dass alle gesundheitlichen und beruflichen Informationen wahrheitsgemäß
    und vollständig angegeben werden müssen, um eine reibungslose Leistungsabwicklung
    im Schadensfall zu gewährleisten. Unsere Prämien sind risikobasiert und transparent
    kalkuliert, wodurch wir eine dauerhafte Solvenz und höchste Leistungsqualität
    sicherstellen.


    Die Unterstützung bei allen Fragen erfolgt professionell über unser Kundenportal,
    per E-Mail oder telefonisch während unserer regulären Geschäftszeiten. Wir begleiten
    Sie kompetent bei der Wahl der passenden Deckungssumme, um sicherzustellen, dass
    die Versicherung optimal auf Ihre persönliche Lebenssituation und Ihre beruflichen
    Anforderungen zugeschnitten ist.


    Für weitere Details zur Abgrenzung gegenüber anderen Vorsorgeprodukten verweisen
    wir auf das Dokument Berufsunfähigkeitsversicherung — im Vergleich zu einem ähnlichen
    Produkt des Hauses.'
  domain: insurance
  product_category: berufsunfaehigkeit
