- id: e2e38498-c0bb-5a56-b5a9-98f55756e3b2
  title: Privathaftpflicht Komfort — Sicherheitstipps für Ihr Konto
  body: 'Der Schutz Ihrer persönlichen Daten und Ihres Vermögens hat bei der Hanseatica
    Versicherung höchste Priorität. Da die Privathaftpflicht Komfort sensible Informationen
    über Ihr Privatleben und Ihre finanziellen Verhältnisse enthält, ist ein bewusster
    Umgang mit Ihren Zugangsdaten unerlässlich.


    Um unbefugte Zugriffe auf Ihr Kundenportal zu verhindern, ist die Verwendung einer
    Multi-Faktor-Authentifizierung (MFA) zwingend erforderlich. Bitte stellen Sie
    sicher, dass Sie Ihr verknüpftes Mobiltelefon oder Ihre Authentifizierungs-App
    stets griffbereit haben. Ein validierter KYC-Prozess (Know Your Customer) bildet
    die Grundlage für Ihren Zugang und stellt sicher, dass nur Sie über Ihre Vertragsdaten
    verfügen.


    Bitte beachten Sie die folgenden Sicherheitsrichtlinien:

    1. Hanseatica Versicherung wird Sie niemals per E-Mail oder Telefon dazu auffordern,
    Ihr Passwort, Ihre MFA-Codes oder Ihre vollständigen Bankdaten in einer ungesicherten
    Nachricht zu übermitteln.


    2. Seien Sie skeptisch bei unerwarteten Nachrichten, die eine dringende Handlung
    fordern, um eine vermeintliche Kündigung Ihres Schutzes (mit der Deckungssumme
    von 20.000.000 €) zu verhindern.


    3. Prüfen Sie die Absenderadresse jeder Kommunikation genau. Offizielle Mitteilungen
    erfolgen ausschließlich über unsere verifizierten Kanäle.


    Sollten Sie eine verdächtige Aktivität in Ihrem Konto bemerken oder den Verdacht
    haben, dass Ihre Zugangsdaten kompromittiert wurden, melden Sie dies bitte unverzüglich
    an unseren Kundenservice. Eine zeitnahe Meldung ist entscheidend, um die Integrität
    Ihres Vertrages zu wahren und betrügerische Änderungen an Ihrer Selbstbeteiligung
    von 150 € oder Ihren Zahlungsinformationen zu verhindern.


    Wir erinnern Sie daran, dass Betrugsversuche konsequent dokumentiert und den zuständigen
    Behörden gemeldet werden. Für weitere Informationen zum Schutz vor spezifischen
    Betrugsmustern konsultieren Sie bitte Privathaftpflicht Komfort — Betrugsmaschen
    rund um dieses Produkt erkennen.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: c54dd84a-a1f7-598f-8afe-ad0686d42ba6
  title: Privathaftpflicht Komfort — Änderung der Bedingungen
  body: 'Die Vereinbarung über die Privathaftpflicht Komfort unterliegt den Bestimmungen
    des Versicherungsvertragsgesetzes (VVG) und der Aufsicht der BaFin. Beide Parteien
    verpflichten sich zur Wahrung der Transparenz und Zuverlässigkeit.


    Änderungen der Versicherungsbedingungen können durch Hanseatica Versicherung erfolgen,
    sofern dies zur Einhaltung regulatorischer Sicherheitsmargen oder aufgrund einer
    risikobasierten Neukalkulation der Prämien erforderlich ist. Eine solche Anpassung
    der Bedingungen wird Ihnen schriftlich mitgeteilt. Sie haben das Recht, einer
    Beitragserhöhung oder einer Verschlechterung der Leistungen durch ein Sonderkündigungsrecht
    zu widersprechen, sofern die gesetzlichen oder vertraglichen Voraussetzungen vorliegen.


    Die wesentlichen Parameter dieses Vertrages sind:

    - Die Deckungssumme ist auf 20.000.000 € festgesetzt, um ein Höchstmaß an Schutz
    für Ihr Privatvermögen zu gewährleisten.

    - Die vereinbarte Selbstbeteiligung beträgt 150 €. Dieser Betrag ist bei jedem
    versicherten Schadenfall vom Versicherungsnehmer zu tragen, bevor die Versicherung
    die darüber hinausgehende Leistung erbringt.

    - Die Prämienberechnung basiert auf einem transparenten Risiko-Modell (Beispielbeitrag:
    59 € jährlich).


    Verpflichtungen des Versicherungsnehmers:

    Sie sind verpflichtet, jede Änderung der Risikolage, die eine Anpassung der Prämie
    erforderlich machen könnte, unverzüglich zu melden. Eine Verletzung der vorvertraglichen
    Anzeigepflicht kann Auswirkungen auf die Leistungsfähigkeit des Vertrages haben.


    Beendigung des Vertrages:

    Der Vertrag kann unter Einhaltung der vertraglich vereinbarten Fristen gekündigt
    werden. Das allgemeine Widerrufsrecht beträgt 14 Tage ab Vertragsschluss. Details
    zum Kündigungsprozess finden Sie in Privathaftpflicht Komfort — kündigen, schließen
    oder den Tarif wechseln.'
