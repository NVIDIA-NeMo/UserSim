  institution_id: hanseatica_versicherung
- id: 76a28afe-1f06-5c08-a274-6cf7afd1b783
  title: Kfz-Versicherung — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Hanseatica Versicherung legt höchsten Wert auf die Sicherheit Ihrer Daten
    und den Schutz Ihres Vermögens. Im Zusammenhang mit Kfz-Versicherungen beobachten
    wir vermehrt versuchte Betrugsmuster, insbesondere durch gefälschte Schadensmeldungen
    oder Phishing-Versuche, die darauf abzielen, Zugang zu Ihren Vertragsdaten zu
    erhalten.


    Bitte beachten Sie, dass wir Sie niemals per E-Mail oder Telefon zur Preisgabe
    von Passwörtern, Multi-Faktor-Authentifizierungscodes oder anderen sensiblen Sicherheitsmerkmalen
    auffordern. Jede zustandsändernde Aktion in Ihrem Vertrag sowie der Zugriff auf
    vertrauliche Daten erfordert zwingend eine eindeutige Identitätsprüfung mittels
    Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses.


    Sollten Sie eine Nachricht erhalten, die Ihnen eine sofortige Auszahlung von Versicherungsleistungen
    verspricht, sofern Sie eine Gebühr vorab entrichten oder Ihre Zugangsdaten bestätigen,
    handelt es sich mit an Sicherheit grenzender Wahrscheinlichkeit um einen Betrugsversuch.
    Wir fordern niemals Zahlungen außerhalb der transparent kalkulierten Prämien an,
    um Leistungen freizuschalten.


    Wenn Ihnen Unregelmäßigkeiten in Ihren Vertragsunterlagen auffallen oder Sie den
    Verdacht haben, dass unbefugte Dritte auf Ihr Kundenportal zugegriffen haben,
    informieren Sie uns bitte unverzüglich. Betrugsversuche werden von uns konsequent
    dokumentiert und den zuständigen Behörden gemeldet, um die Integrität unserer
    Versicherungsgemeinschaft zu wahren.


    Um eine vollständige Übersicht über die vertraglichen Rahmenbedingungen zu erhalten,
    empfehlen wir die Lektüre des Dokuments Kfz-Versicherung — Allgemeine Geschäftsbedingungen.'
  domain: insurance
  product_category: kfz
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e6189582-ff5b-5b23-80bd-b2aac5bd9183
  title: Kfz-Versicherung — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Zusammenarbeit zwischen
    der Hanseatica Versicherung und dem Versicherungsnehmer im Rahmen der Kfz-Versicherung.
    Wir agieren unter strikter Aufsicht der BaFin und halten die Bestimmungen des
    Versicherungsvertragsgesetzes (VVG) strikt ein.


    Die Prämien werden risikobasiert und transparent kalkuliert. Diese Kalkulation
    dient der Sicherstellung einer dauerhaften Solvenz sowie der Aufrechterhaltung
    einer höchsten Leistungsqualität. Die erhobenen Gebühren dienen ausschließlich
    der Deckung administrativer Kosten und der Einhaltung regulatorischer Sicherheitsmargen.


    Im Falle einer Vollkaskodeckung wird eine Selbstbeteiligung in Höhe von 300 €
    vereinbart, sofern im individuellen Vertrag nichts anderes festgelegt wurde. Bei
    einer Teilkaskodeckung beläuft sich die Selbstbeteiligung auf 150 €.


    Die vertragliche Laufzeit endet in der Regel durch Kündigung. Beachten Sie bitte,
    dass für die Kfz-Haftpflichtversicherung flexible Kündigungsoptionen bis zum 30.
    November bestehen, um einen rechtzeitigen Wechsel oder Abschluss für das Folgejahr
    zu ermöglichen. Eine außerordentliche Beendigung des Vertrages ist über ein Sonderkündigungsrecht
    möglich, beispielsweise nach einer Beitragserhöhung oder einem eingetretenen Schadenfall.


    Der Versicherungsnehmer ist verpflichtet, ein Schadensereignis ohne schuldhaftes
    Zögern zu melden. Eine unverzügliche Schadenmeldung ist Voraussetzung für eine
    reibungslose Leistungsprüfung. Widerrufsrechte können proaktiv genutzt werden:
    allgemein innerhalb von 14 Tagen nach Vertragsschluss.


    Streitigkeiten werden fair und zeitnah bearbeitet. Sollte kein Konsens erzielt
    werden, verweisen wir aktiv auf den kostenlosen Versicherungsombudsmann.'
  domain: insurance
  product_category: kfz
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: ff81bf6d-aa89-5b6d-aa49-79e6aedb64a7
  title: Kfz-Versicherung — für wen und wofür geeignet
  body: 'Die Kfz-Versicherung der Hanseatica Versicherung ist speziell auf die Bedürfnisse
    des deutschen Mittelstands und privater Fahrzeughalter zugeschnitten, die Wert
    auf hanseatische Zuverlässigkeit, Seriosität und Transparenz legen. Unser Produkt
    kombiniert rechtliche Sicherheit mit modernen, digitalen Prozessen.


    Das Produkt ist ideal für Kunden, die folgende Absicherungen suchen:


    1. Gesetzlich vorgeschriebene Haftpflicht: Ein essenzieller Schutz gegen finanzielle
    Risiken aus Schäden, die Sie mit Ihrem Fahrzeug Dritten zufügen.

    2. Optionale Kaskodeckung: Für Fahrzeugbesitzer, die auch Schäden am eigenen Fahrzeug
    absichern möchten (Teilkasko oder Vollkasko).


    Ein Beispiel für eine kalkulierte Jahresprämie beträgt 780 €, wobei die tatsächlichen
    Kosten individuell auf Basis Ihres Risikoprofils ermittelt werden. Wir setzen
    auf eine faire Preisgestaltung, die eine dauerhafte Solvenz gewährleistet.


    Die Versicherung eignet sich besonders für Personen, die eine klare Sprache und
    eine professionelle Abwicklung bevorzugen und keine versteckten Kosten fürchten.
    Die Integration in unser Kundenportal ermöglicht eine effiziente Verwaltung Ihrer
    Police während der regulären Geschäftszeiten (MEZ).


    Für detaillierte Informationen zur Selbstbeteiligung im Schadensfall lesen Sie
    bitte das Dokument Kfz-Versicherung — Selbstbeteiligung Vollkasko: Erklärung.'
  domain: insurance
  product_category: kfz
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e99bd451-c755-5ac1-8b31-d08cee2ee7e0
  title: 'Kfz-Versicherung — Selbstbeteiligung Vollkasko: Erklärung'
  body: 'Frage: Was bedeutet die Selbstbeteiligung bei meiner Vollkaskoversicherung?

    Antwort: Die Selbstbeteiligung ist der Betrag, den Sie im Falle eines versicherten
    Schadens aus eigener Tasche übernehmen, bevor die Hanseatica Versicherung die
    restlichen Kosten übernimmt. Bei unserem Standardtarif für die Vollkasko beträgt
    diese Selbstbeteiligung 300 €.


    Frage: Warum gibt es eine Selbstbeteiligung?

    Antwort: Durch die Vereinbarung einer Selbstbeteiligung in Höhe von 300 € können
    wir die laufenden Prämien für Sie fairer und wettbewerbsfähiger gestalten, da
    Kleinschäden nicht zu einer allgemeinen Erhöhung der Kosten für alle Versicherten
    führen.


    Frage: Gilt dieser Betrag auch für die Teilkasko?

    Antwort: Nein. Für die Teilkaskodeckung gilt eine separate, niedrigere Selbstbeteiligung
    von 150 €. Weitere Details entnehmen Sie bitte dem Dokument Kfz-Versicherung —
    Allgemeine Geschäftsbedingungen.'
  domain: insurance
  product_category: kfz
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 97d6ff2f-d785-5b47-98b6-d65d2ea7864c
  title: Kfz-Versicherung — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Vertrag beenden oder in einen anderen Tarif wechseln möchten,
    führen Sie bitte die folgenden Schritte aus. Bitte beachten Sie die wichtige Frist
    bis zum 30. November für die Kündigung der Kfz-Haftpflichtversicherung.


    **Voraussetzungen:**

    Sie benötigen Ihre Versicherungsnummer und einen gültigen Identitätsnachweis zur
    Verifizierung Ihres Kontos.


    **Schritte zur Kündigung oder zum Tarifwechsel:**


    1. Teilen Sie uns mit, ob Sie den Vertrag vollständig kündigen möchten oder in
    einen anderen Tarif (z. B. von Vollkasko auf Teilkasko) wechseln wollen.

    2. Geben Sie das gewünschte Datum der Beendigung bzw. des Wechsels an. Beachten
    Sie hierbei die Kündigungsfrist bis zum 30. November.

    3. Wir führen eine Identitätsprüfung mittels Multi-Faktor-Authentifizierung durch,
    um sicherzustellen, dass der Vorgang autorisiert ist.

    4. Wir bestätigen Ihnen die Kündigung oder den Tarifwechsel schriftlich über Ihr
    Kundenportal oder per E-Mail.


    **Erfolgskontrolle:**

    Der Vorgang ist abgeschlossen, sobald Sie die schriftliche Bestätigung mit dem
    genauen Enddatum Ihres aktuellen Vertrages erhalten haben. In Ihrem Kundenportal
    wird der Status Ihres Vertrages entsprechend aktualisiert.


    Sollten Sie Unterstützung bei der Wahl eines neuen Tarifs benötigen, bieten wir
    Ihnen gerne edukative Erläuterungen zur Produktwahl an. Bitte beachten Sie, dass
    wir keine individuelle Rechtsberatung leisten.'
  domain: insurance
  product_category: kfz
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 536c18e3-8e15-5963-a198-5775759d8c90
  title: Kfz-Versicherung — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Symptom: Ein Kunde gibt an, dass der abgebuchte Versicherungsbeitrag nicht
    mit dem erwarteten Betrag übereinstimmt oder eine unerwartete Forderung vorliegt.


    **Mögliche Ursachen:**

    1. Risikobasierte Anpassung: Die Prämien wurden aufgrund einer Änderung des Risikoprofils
    gemäß den allgemeinen Bedingungen angepasst.

    2. Verrechnung der Selbstbeteiligung: Bei einer Schadensregulierung wurde die
    vereinbarte Selbstbeteiligung (z. B. 300 € bei Vollkasko oder 150 € bei Teilkasko)
    direkt mit der Auszahlung verrechnet.

    3. Beitragsnachzahlung: Es handelt sich um eine Nachforderung aufgrund einer fehlerhaften
    vorvertraglichen Anzeige.


    **Vorgehensweise zur Prüfung:**

    1. Prüfen Sie im Kundenportal die aktuelle Beitragsrechnung und vergleichen Sie
    diese mit dem ursprünglichen Beispielwert von 780 €.

    2. Kontrollieren Sie die Historie der Schadenmeldungen, um festzustellen, ob eine
    Selbstbeteiligung abgezogen wurde.

    3. Verifizieren Sie, ob eine schriftliche Mitteilung über eine Beitragsanpassung
    an den Kunden versandt wurde.


    **Lösung und Eskalation:**

    Können die Differenzen transparent erläutert werden, informieren Sie den Kunden
    über die Grundlage der Berechnung. Falls der Kunde mit der Erklärung nicht einverstanden
    ist, leiten Sie den Vorgang strukturiert über die Fachabteilung an das Beschwerdemanagement
    weiter.


    Der Kunde wird über die Bearbeitungszeit informiert und bei ausbleibendem Konsens
    aktiv auf den kostenlosen Versicherungsombudsmann verwiesen.'
  domain: insurance
  product_category: kfz
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 0603894d-a5e7-58ab-a611-b0e31760bd84
  title: Kfz-Versicherung — erforderliche Unterlagen
  body: 'Um eine Kfz-Versicherung bei der Hanseatica Versicherung abzuschließen, müssen
    je nach Fahrzeugstatus folgende Unterlagen eingereicht werden:


    | Fahrzeugstatus | Erforderliche Unterlagen | Ergebnis/Outcome |

    | :--- | :--- | :--- |

    | Neu-Zulassung | Personalausweis, gültige Fahrerlaubnis, Fahrzeugdaten | Erteilung
    der eVB-Nummer |

    | Fahrzeugwechsel | Zulassungsbescheinigung Teil I & II, Fahrerlaubnis | Vertragsumschreibung
    |

    | Tarifwechsel | Aktueller Versicherungsschein, Personalausweis | Anpassung der
    Police |

    | Schadensmeldung | Polizeibericht (falls vorhanden), Fotos des Schadens | Einleitung
    der Leistungsprüfung |


    Die elektronische Versicherungsbestätigung (eVB-Nummer) wird nach erfolgreicher
    Prüfung der Unterlagen und Identitätsverifizierung bereitgestellt und ist für
    die Zulassung bei der Kfz-Zulassungsstelle zwingend erforderlich.'
  domain: insurance
