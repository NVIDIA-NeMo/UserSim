- id: 2f351687-d98e-545e-9e1f-752e80145f0c
  title: Hausratversicherung — abgelehnter oder gesperrter Vorgang
  body: "Es kann vorkommen, dass eine beantragte Änderung an Ihrer Hausratversicherung\
    \ oder eine Schadensmeldung systemseitig abgelehnt oder gesperrt wird. Dies geschieht\
    \ in der Regel aus Sicherheitsgründen oder aufgrund fehlender Informationen.\n\
    \n**Häufige Symptome:**\n- Sie erhalten die Mitteilung, dass ein Vorgang 'nicht\
    \ abgeschlossen werden konnte'.\n- Eine Statusabfrage zeigt den Zustand 'gesperrt'\
    \ oder 'abgelehnt' an.\n\n**Mögliche Ursachen und Lösungen:**\n1. **Fehlende Identitätsprüfung:**\
    \ Die zwingend erforderliche Multi-Faktor-Authentifizierung oder der KYC-Prozess\
    \ wurde nicht erfolgreich durchlaufen. \n   *Lösung:* Bitte führen Sie die Identitätsprüfung\
    \ erneut gemäß unseren Anweisungen durch.\n2. **Unvollständige Unterlagen:** Für\
    \ die Bearbeitung (z. B. bei einem Fahrraddiebstahl bis zu 1.000 €) fehlen notwendige\
    \ Belege wie die polizeiliche Anzeige oder Kaufbelege.\n   *Lösung:* Reichen Sie\
    \ die fehlenden Dokumente vollständig ein.\n3. **Dateninkonsistenz:** Die angegebenen\
    \ Daten stimmen nicht mit den in der Police hinterlegten Informationen überein.\n\
    \   *Lösung:* Überprüfen Sie Ihre Angaben und teilen Sie uns etwaige Korrekturen\
    \ mit.\n\n**Wann erfolgt eine Eskalation?**\nWenn eine Lösung im direkten Dialog\
    \ nicht möglich ist, leiten wir den Vorgang strukturiert über die jeweilige Fachabteilung\
    \ an unser Beschwerdemanagement weiter. Wir informieren Sie über den Eingang der\
    \ Eskalation und nennen Ihnen eine Frist für die abschließende Prüfung. Sollte\
    \ auch hier kein Konsens erzielt werden, verweisen wir Sie aktiv an den kostenlosen\
    \ Versicherungsombudsmann."
  domain: insurance
  product_category: hausrat
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 0e2da62e-a8e8-53b1-8a46-f22cb1a8a65b
  title: Hausratversicherung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter dabei, Kunden zu erkennen,
    für die eine Anpassung ihres aktuellen Hausratversicherungstarifs sinnvoll ist.
    Ein Upgrade lohnt sich immer dann, wenn das aktuelle Risikoprofil nicht mehr mit
    der versicherten Summe korrespondiert.


    **Szenarien für ein Upgrade oder einen Wechsel:**


    - **Vergrößerung des Wohnraums:** Da unsere Versicherungssumme auf einem Wert
    von 650 € pro Quadratmeter basiert, führt eine Vergrößerung der Wohnfläche zu
    einem höheren potenziellen Inventarwert. Hier ist eine Anpassung der Summe notwendig,
    um eine Unterversicherung zu vermeiden.

    - **Anschaffung hochwertiger Güter:** Wenn ein Kunde beispielsweise ein hochwertiges
    E-Bike erwirbt, das den Wert von 1.000 € (der Standarddeckelung für Fahrraddiebstahl)
    übersteigt, ist ein Upgrade auf eine höhere Deckungssumme für Fahrräder ratsam.

    - **Zunahme des Hausratswertes:** Bei einer signifikanten Steigerung des Gesamtwerts
    der Einrichtung (z. B. durch teure Antiquitäten oder Elektronik), die den Standardwert
    von 650 € pro m² übersteigt, sollte die Versicherungssumme manuell erhöht werden.


    **Empfehlung:**

    Ein Wechsel ist dann sinnvoll, wenn der Kunde eine umfassendere Absicherung wünscht,
    die über den Unterversicherungsverzicht hinausgeht oder wenn spezifische Zusatzrisiken
    abgesichert werden müssen. In allen Fällen priorisieren wir die Eignung des Produkts
    für die allgemeine Zielgruppe und beraten edukativ zur optimalen Produktwahl.'
  domain: insurance
  product_category: hausrat
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: fc355ae0-b463-59fb-8988-3d630a0cb054
  title: Hausratversicherung — Vergleich mit Alternativen und wann es nicht passt
  body: 'Die Entscheidung für die richtige Absicherung Ihres Heims erfordert einen
    Vergleich der verfügbaren Optionen. Unsere Hausratversicherung ist darauf ausgelegt,
    Privatpersonen und dem deutschen Mittelstand eine zuverlässige und transparente
    Absicherung zu bieten.


    **Vergleich mit Alternativen:**

    Im Gegensatz zu sehr einfachen Basis-Tarifmodellen bietet unsere Versicherung
    einen integrierten Unterversicherungsverzicht, was bedeutet, dass wir in vielen
    Fällen auf eine proportionale Kürzung der Leistung verzichten, sofern die Summe
    im Rahmen unserer Standardkalkulation liegt. Zudem ist der Schutz gegen Fahrraddiebstahl
    bis zu einem Betrag von 1.000 € bereits spezialisiert integriert, während andere
    Anbieter dies oft nur über teure Zusatzmodule anbieten.


    **Wann unser Produkt besonders geeignet ist:**

    - Wenn Sie Wert auf hanseatische Zuverlässigkeit und eine klare, professionelle
    Kommunikation legen.

    - Wenn Sie eine transparente Kostenstruktur suchen (Beispielbeitrag: 96 € pro
    Jahr).

    - Wenn Sie eine faire, risikobasierte Kalkulation wünschen, die sich an einem
    soliden Wert von 650 € pro Quadratmeter orientiert.


    **Wann unser Produkt weniger geeignet ist:**

    - **Minimal-Ausstattung:** Für Personen mit extrem geringem Hausratwert (z. B.
    in einer sehr kleinen, fast leer geräumten möblierten Wohnung), bei denen die
    Kosten der Versicherung in keinem Verhältnis zum potenziellen Risiko stehen.

    - **Spezialimmobilien:** Für extrem hochwertige Sammlungen (z. B. Museen im privaten
    Rahmen), die eine individuelle Versicherungslösung weit über die Standarddeckung
    von 650 € pro m² hinaus erfordern und spezifische Kunstversicherungs-Klauseln
    benötigen.


    Wir bieten Ihnen edukative Erläuterungen zur Produktwahl an, um sicherzustellen,
    dass die gewählte Lösung optimal zu Ihrer Lebenssituation passt.'
  domain: insurance
  product_category: hausrat
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: aadfba40-e50a-5a25-bf53-b00897e1cd28
  title: Hausratversicherung — Voraussetzungen und Abschluss
  body: 'Hier finden Sie die wichtigsten Informationen zu den Voraussetzungen für
    den Abschluss einer Hausratversicherung bei Hanseatica Versicherung.


    **Welche Voraussetzungen muss ich für den Abschluss erfüllen?**

    Sie müssen eine natürliche Person sein, die eine Wohnung in Deutschland bewohnt.
    Zur Kalkulation der Versicherungssumme benötigen wir die genaue Angabe Ihrer Wohnfläche
    in Quadratmetern, da wir mit einem Standardwert von 650 € pro m² kalkulieren.


    **Wie funktioniert der Abschlussprozess?**

    Der Abschluss erfolgt transparent und digital. Nach der Prüfung Ihrer Angaben
    und der Identitätsverifizierung erhalten Sie Ihre Police. Wir halten uns strikt
    an das Versicherungsvertragsgesetz und die Aufsicht der BaFin.


    **Habe ich ein Widerrufsrecht?**

    Ja. Gemäß unseren Datenschutzrichtlinien und rechtlichen Vorgaben haben Sie ein
    allgemeines Widerrufsrecht von 14 Tagen ab Abschluss des Vertrages. Sie können
    den Vertrag innerhalb dieser Frist ohne Angabe von Gründen stornieren. Weitere
    Informationen finden Sie unter dem Begriff ''Widerrufsrecht'' in unserem Glossar.'
  domain: insurance
  product_category: hausrat
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: efed7ca8-20a3-57eb-b0cd-58357e59a07a
  title: Hausratversicherung — ein typisches Anliegen vollständig erledigen
  body: 'Ein häufiges Anliegen unserer Kunden ist die Meldung eines Schadensfalls,
    beispielsweise der Diebstahl eines Fahrrades. Hier führen wir Sie durch den Prozess,
    um Ihr Anliegen vollständig und effizient zu erledigen.


    **Voraussetzungen:**

    - Ihre Versicherungsnummer.

    - Eine Kopie der polizeilichen Anzeige (bei Diebstahl).

    - Nachweise über den Wert des Gegenstands (z. B. Kaufbeleg).


    **Schritt-für-Schritt-Anleitung:**

    1. Teilen Sie uns das Schadensereignis mit. Geben Sie dabei an, was genau passiert
    ist, wann der Vorfall eintrat und welche Gegenstände betroffen sind.

    2. Reichen Sie die notwendigen Dokumente ein. Im Falle eines Fahrraddiebstahls
    ist die polizeiliche Anzeige zwingend erforderlich. Beachten Sie, dass die Deckung
    für Fahrräder bis zu einem Betrag von 1.000 € besteht.

    3. Wir führen eine Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses durch, um den Zugriff auf Ihre Vertragsdaten zu
    sichern.

    4. Wir prüfen die Unterlagen auf Plausibilität und Übereinstimmung mit Ihren Vertragsbedingungen
    (z. B. die Einhaltung der Versicherungssumme basierend auf 650 € pro m²).

    5. Sie erhalten von uns eine schriftliche Bestätigung über die Anerkennung des
    Schadens und die Information über die Auszahlungsmodalitäten.


    **Woran erkennen Sie, dass das Anliegen erledigt ist?**

    Der Vorgang ist vollständig abgeschlossen, sobald Sie die finale Leistungszusage
    erhalten haben und der entsprechende Betrag (bis maximal 1.000 € für Fahrräder)
    auf Ihrem hinterlegten Konto eingegangen ist.'
  domain: insurance
  product_category: hausrat
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 55787d31-b943-5d80-a7de-e79105735252
  title: Hausratversicherung — Abweichung von Ihren Unterlagen
  body: "In der täglichen Praxis kann es vorkommen, dass die in der Police hinterlegten\
    \ Daten nicht mit den vom Kunden eingereichten Unterlagen übereinstimmen. Dies\
    \ betrifft häufig die Wohnfläche, welche die Grundlage für die Versicherungssumme\
    \ bildet.\n\n**Symptom aus Kundensicht:**\nDer Kunde bemerkt, dass die Versicherungssumme\
    \ in der Police nicht mit der tatsächlichen Größe seiner Wohnung übereinstimmt\
    \ oder dass eine Leistungszahlung aufgrund einer Differenz in den Dokumenten verzögert\
    \ wird.\n\n**Ursachenanalyse und Lösungsschritte für Support-Mitarbeiter:**\n\
    1. **Überprüfung der Wohnfläche:** Vergleichen Sie die in der Police hinterlegte\
    \ Quadratmeterzahl mit dem aktuellen Miet- oder Kaufvertrag. \n   - *Rechnung:*\
    \ Prüfen Sie, ob die Versicherungssumme korrekt mit dem Faktor von 650 € pro Quadratmeter\
    \ berechnet wurde.\n2. **Prüfung der Dokumentenechtheit:** Stellen Sie sicher,\
    \ dass die eingereichten Unterlagen aktuell und validiert sind. Bei Unstimmigkeiten\
    \ fordern Sie ein aktuelles Dokument (z. B. eine aktuelle Meldebescheinigung oder\
    \ einen ergänzten Mietvertrag) an.\n3. **Abgleich der Fahrraddiebstahl-Deckung:**\
    \ Falls eine Abweichung bei der Wertfeststellung eines Fahrrades vorliegt, prüfen\
    \ Sie, ob die Forderung die Grenze von 1.000 € überschreitet und ob entsprechende\
    \ Kaufbelege vorliegen.\n\n**Vorgehensweise bei Klärung:**\nSobald die Abweichung\
    \ durch neue Unterlagen korrigiert wurde, passen Sie die Vertragsdaten an. Informieren\
    \ Sie den Kunden über die Änderung und senden Sie eine aktualisierte Police zu.\n\
    \n**Eskalationsweg:**\nSollte der Kunde die Richtigkeit der Unterlagen bestreiten\
    \ oder eine Anpassung der 650 € pro m² Logik fordern, leiten Sie den Fall an die\
    \ Fachabteilung für Vertragsprüfung weiter. Die Kommunikation erfolgt hierbei\
    \ stets professionell und seriös unter Verwendung der formellen Anrede 'Sie'."
  domain: insurance
  product_category: hausrat
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 7b9c949e-3063-557b-a9d7-494adc2427c7
  title: Kfz-Versicherung — Überblick
  body: 'Willkommen bei der Kfz-Versicherung der Hanseatica Versicherung. Wir bieten
    Ihnen eine Absicherung, die hanseatische Zuverlässigkeit mit modernen Prozessen
    vereint, um Sie und Ihr Fahrzeug optimal zu schützen. Unser Fokus liegt auf Transparenz
    und einer fairen, risikobasierten Preisgestaltung, die speziell auf die Bedürfnisse
    des deutschen Mittelstands zugeschnitten ist.


    Das Kernstück unserer Absicherung ist die gesetzlich vorgeschriebene Kfz-Haftpflichtversicherung.
    Sie schützt Ihr Privatvermögen vor den finanziellen Folgen von Schäden, die Sie
    oder Ihre Fahrer mit dem versicherten Fahrzeug Dritten zufügen. Ergänzend hierzu
    bieten wir Ihnen flexible Kaskodeckungen an, um auch Schäden am eigenen Fahrzeug
    abzusichern.


    Um Ihnen eine erste Orientierung zu geben, führen wir ein Beispiel für einen typischen
    Jahresbeitrag in der Vollkaskodeckung auf, welcher bei 780 € liegen kann. Bitte
    beachten Sie, dass die tatsächliche Prämie individuell auf Basis Ihres Risikoprofils
    kalkuliert wird.


    In unseren Kaskotarifen setzen wir auf klare Regelungen zur Selbstbeteiligung,
    um eine dauerhafte Solvenz und höchste Leistungsqualität zu gewährleisten. Im
    Falle eines Schadensereignisses gelten folgende Pauschalen:

    - Bei einer Vollkaskodeckung beträgt die Selbstbeteiligung 300 €.

    - Bei einer Teilkaskodeckung beträgt die Selbstbeteiligung 150 €.


    Ein wesentlicher Vorteil unserer Kfz-Versicherung sind die flexiblen Kündigungsoptionen.
    Wir ermöglichen Ihnen eine Anpassung Ihres Schutzes mit einer Kündigungsfrist
    bis zum 30. November, was Ihnen maximale Flexibilität bei der Gestaltung Ihrer
    jährlichen Versicherungsstrategie bietet.


    Wir legen großen Wert auf eine transparente Kommunikation. Alle Prämien sind risikobasiert
    kalkuliert, und die Gebühren dienen primär der Deckung administrativer Kosten
    sowie der Einhaltung regulatorischer Sicherheitsmargen. Für eine detaillierte
    Aufstellung der Kosten verweisen wir auf das Kfz-Versicherung — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: kfz
  document_type: product_sheet
  source_authority: official
