- id: 84883ef9-df1d-5feb-a5b8-379296276e87
  title: Hausratversicherung — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Hanseatica Versicherung legt höchsten Wert auf die Sicherheit Ihrer Daten
    und Ihres Vermögens. Im Kontext unserer Hausratversicherung beobachten wir vermehrt
    Versuche des Social Engineering, bei denen Betrüger versuchen, sich als Mitarbeiter
    unseres Hauses auszugeben, um Zugang zu Ihren Vertragsdaten oder Zahlungsmodalitäten
    zu erhalten.


    Bitte beachten Sie, dass wir Sie niemals per E-Mail, SMS oder Telefon dazu auffordern
    werden, Passwörter, Multi-Faktor-Authentifizierungs-Codes oder Ihre vollständigen
    Bankdaten ohne einen zuvor initiierten, validierten Prozess preiszugeben. Ein
    typisches Warnsignal ist die Erzeugung einer künstlichen Dringlichkeit, etwa die
    Behauptung, Ihr Versicherungsschutz für Ihr Inventar oder den speziellen Schutz
    gegen Fahrraddiebstahl bis 1.000 € würde ohne sofortige Aktion erlöschen.


    Wir fordern Sie auf, bei jeder zustandsändernden Aktion – etwa der Änderung Ihrer
    Bankverbindung oder der Anpassung der Versicherungssumme – auf die Einhaltung
    unserer Sicherheitsstandards zu achten. Ein Zugriff auf vertrauliche Daten erfolgt
    bei uns zwingend nur nach einer eindeutigen Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses.


    Sollten Sie eine verdächtige Nachricht erhalten haben oder vermuten, dass unbefugte
    Personen Zugriff auf Ihre Vertragsdetails haben, ist die erste und wichtigste
    Maßnahme die unverzügliche Meldung an uns. Wir dokumentieren Betrugsversuche konsequent
    und melden diese den zuständigen Behörden, um die Integrität unserer Prozesse
    zu gewährleisten. Die Meldung eines Vorfalls sollte ohne schuldhaftes Zögern erfolgen,
    da eine zeitnahe Reaktion die Möglichkeit zur Schadensbegrenzung erheblich verbessert.


    Für weitere Details zur rechtlichen Absicherung Ihrer Verträge verweisen wir auf
    die Hausratversicherung — rechtliche Hinweise.'
  domain: insurance
  product_category: hausrat
  document_type: security_advisory
  source_authority: official
