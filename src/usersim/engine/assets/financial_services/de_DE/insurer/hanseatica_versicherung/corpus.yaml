  institution_id: hanseatica_versicherung
- id: aa7e9221-9eed-5a34-af85-9c2114879882
  title: 'Kfz-Versicherung — Jahresbeitrag Vollkasko (Beispiel): Erklärung'
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen unserer Kfz-Versicherung.


    **Wie kommt der Beispielbetrag von 780 € für den Jahresbeitrag zustande?**

    Der genannte Betrag von 780 € dient als illustratives Beispiel für eine Vollkaskodeckung.
    Die tatsächliche Prämie wird individuell nach dem Versicherungsvertragsgesetz
    kalkuliert. Dabei fließen Faktoren wie die Fahrzeugklasse, Ihre Schadenfreiheitsklasse,
    die jährliche Fahrleistung sowie Ihr Wohnort in die risikobasierte Berechnung
    ein. Ziel ist eine transparente Preisgestaltung, die sowohl Ihren Schutz als auch
    unsere langfristige Leistungsfähigkeit garantiert.


    **Warum variiert der Beitrag zwischen verschiedenen Kunden?**

    Da wir eine strikt risikobasierte Kalkulation verfolgen, spiegelt der Beitrag
    die statistische Eintrittswahrscheinlichkeit eines Schadens wider. Dies stellt
    sicher, dass Kunden mit geringerem Risiko fair bepreist werden. Weitere Details
    zu den Kosten finden Sie im Dokument Kfz-Versicherung — Preis- und Leistungsverzeichnis.'
