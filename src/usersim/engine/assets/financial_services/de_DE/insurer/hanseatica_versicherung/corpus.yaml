  institution_id: hanseatica_versicherung
- id: 21e83bb5-b949-5a68-a202-4a0c95f3328e
  title: Berufsunfähigkeitsversicherung — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf Berufsunfähigkeitsversicherung oder
    die Meldung eines Leistungsfalls nicht wie erwartet abgeschlossen wurde. Hier
    finden Sie die entsprechenden Lösungswege.


    Symptom: Der Antrag auf Versicherungsabschluss verbleibt im Status ''In Prüfung''
    über einen längeren Zeitraum.


    Ursache: Häufig fehlen notwendige Unterlagen zur Gesundheitsprüfung oder die vorvertragliche
    Anzeigepflicht wurde nicht vollständig erfüllt. In anderen Fällen verzögern externe
    ärztliche Atteste den Prozess.


    Prüfungsschritte:

    1. Prüfen Sie, ob alle angeforderten Gesundheitsfragebögen vollständig und unterschrieben
    eingereicht wurden.

    2. Überprüfen Sie, ob Ihre Identitätsprüfung (KYC-Prozess) erfolgreich abgeschlossen
    wurde.

    3. Kontrollieren Sie Ihren Posteingang auf Rückfragen unserer Fachabteilung zur
    präziseren Beschreibung Ihrer beruflichen Tätigkeit.


    Lösung:

    Reichen Sie die fehlenden Dokumente unmittelbar ein oder beantworten Sie die offenen
    Fragen zu Ihrem Risikoprofil. Sobald die Unterlagen vollständig vorliegen, wird
    der Vorgang innerhalb der regulären Geschäftszeiten final bearbeitet.


    Eskalation:

    Sollte ein Konsens über die Risikoeinstufung oder die Ablehnung eines Antrags
    nicht erzielt werden, leiten wir den Fall strukturiert über die jeweilige Fachabteilung
    an unser Beschwerdemanagement weiter. Bei anhaltenden Unstimmigkeiten verweisen
    wir aktiv auf den kostenlosen Versicherungsombudsmann.


    Für detaillierte Informationen zur Identitätsprüfung sehen Sie bitte in den allgemeinen
    Sicherheitsrichtlinien nach oder konsultieren Sie die Berufsunfähigkeitsversicherung
    — rechtliche Hinweise.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 02097cb7-b0cf-59f1-817c-4476b27a1cb1
  title: Berufsunfähigkeitsversicherung — Voraussetzungen
  body: 'Die Inanspruchnahme der Leistungen aus der Berufsunfähigkeitsversicherung
    sowie die Aufrechterhaltung des Versicherungsschutzes unterliegen folgenden Bedingungen:


    | Bedingung | Anforderung | Ergebnis |

    | :--- | :--- | :--- |

    | Leistungsbeginn | Medizinischer Nachweis einer Berufsunfähigkeit ab 50 % | Auszahlung
    der vereinbarten monatlichen Rente (z. B. 1.500 €) |

    | Beitragszahlung | Zeitnahe Zahlung der risikobasierten Prämie (z. B. 68 €) |
    Fortbestand des Versicherungsschutzes |

    | Vertragsschluss | Vollständige Erfüllung der vorvertraglichen Anzeigepflicht
    | Gültiger Vertrag ohne spätere Anfechtungsgründe |

    | Identitätsnachweis | Erfolgreicher Abschluss des KYC-Prozesses oder MFA | Freischaltung
    des Kundenportals und Vertragsaktivierung |

    | Altersgrenze | Eintritt innerhalb der produktseitig definierten Altersgrenzen
    | Annahme des Risikos durch die Hanseatica Versicherung |


    Die Prüfung der Berufsunfähigkeit erfolgt durch unabhängige medizinische Gutachten,
    um eine faire und transparente Leistungsentscheidung zu gewährleisten.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: eligibility_matrix
  source_authority: official
