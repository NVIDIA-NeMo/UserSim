- id: d2b84664-8484-56c0-ad46-28c3b2cb2c61
  title: Hausratversicherung — Zinsübersicht
  body: 'Die Hausratversicherung der Hanseatica Versicherung ist ein klassisches Risikoversicherungsprodukt.
    Im Gegensatz zu kapitalbildenden Lebensversicherungen oder Rentenprodukten (wie
    unserer fondsgebundenen Rentenversicherung) beinhaltet dieses Produkt keine Zinskomponente
    oder eine garantierte Wertentwicklung.


    **Struktur der Beitragszahlung:**

    Es gibt keine Verzinsung der eingezahlten Prämien, da die Beiträge zur Deckung
    des eingegangenen Risikos sowie der administrativen Kosten verwendet werden. Die
    Preisgestaltung folgt einer transparenten, risikobasierten Logik:

    - **Versicherungssumme:** Kalkuliert mit 650 € pro Quadratmeter Wohnfläche.

    - **Beispielhafter Jahresbeitrag:** 96 € für eine Wohnfläche von 70 m².

    - **Spezialdeckung:** Fahrraddiebstahl bis 1.000 €.


    Die Prämien sind fix für die jeweilige Vertragslaufzeit, können jedoch im Falle
    einer Änderung der Objektdaten (z. B. Umzug in eine größere Wohnung) oder bei
    Anpassungen der regulatorischen Sicherheitsmargen überprüft und angepasst werden.
    Wir garantieren eine faire Preisgestaltung, die im Einklang mit unserer Philosophie
    hanseatischer Zuverlässigkeit steht.'
