- id: 742652e9-fc7b-55b7-963a-3049cb02b251
  title: Fondsgebundene Rentenversicherung — für wen und wofür geeignet
  body: 'Die Fondsgebundene Rentenversicherung der Hanseatica Versicherung ist ein
    flexibles Instrument zum langfristigen Vermögensaufbau für die Altersvorsorge.
    Sie richtet sich primär an Kunden des deutschen Mittelstands, die eine Kombination
    aus versicherungstechnischer Absicherung und den Renditechancen der Kapitalmärkte
    suchen.


    Dieses Produkt ist besonders geeignet für Personen, die:

    - Eine langfristige Perspektive für ihre Altersvorsorge haben und Schwankungen
    am Kapitalmarkt durch einen langen Anlagehorizont ausgleichen können.

    - Wert auf Transparenz bei den Kosten legen, wobei die Effektivkosten pro Jahr
    bei 1,1 % liegen.

    - Einen flexiblen Einstieg suchen, da bereits ein Mindestbeitrag von 25 € pro
    Monat möglich ist.

    - Die Absicherung ihres Kapitals durch ein seriöses, BaFin-aufsichtspflichtiges
    Institut bevorzugen.


    Im Gegensatz zu klassischen Rentenversicherungen wird das Kapital hier in Fonds
    investiert. Dies bietet das Potenzial für eine höhere Wertentwicklung, bringt
    jedoch auch Marktrisiken mit sich. Die Hanseatica Versicherung sorgt für eine
    faire Kostenstruktur, indem sie die Abschlusskosten mit einer Obergrenze von 2,5
    % deckelt.


    Das Produkt ermöglicht anpassbare Bezugsreichten und eine transparente Dokumentation
    der Entwicklung Ihres Kapitals. Bitte beachten Sie, dass wir keine spezifische
    Wertentwicklung garantieren können.


    Weitere Informationen zu den Risiken finden Sie in den Fondsgebundene Rentenversicherung
    — Risikohinweise.'
