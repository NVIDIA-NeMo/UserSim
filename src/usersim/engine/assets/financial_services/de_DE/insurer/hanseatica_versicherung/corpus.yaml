- id: c5fe564d-07be-5300-9de4-fdfe369c8e8f
  title: Kfz-Versicherung — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Bereich der Kfz-Versicherung gibt es verschiedene Betrugsmuster, die darauf
    abzielen, sensible Daten zu entwenden oder unrechtmäßige finanzielle Vorteile
    zu erlangen. Wir möchten Sie für diese Gefahren sensibilisieren, damit Sie Ihr
    Vermögen und Ihre Daten schützen können.


    Ein häufiges Muster ist das sogenannte ''Phishing'' über gefälschte E-Mails oder
    SMS, die vorgeben, von der Hanseatica Versicherung zu stammen. In diesen Nachrichten
    wird oft behauptet, dass eine dringende Aktualisierung Ihrer Fahrzeugdaten erforderlich
    sei oder eine Rückerstattung von Prämien ausstehe. Sie werden aufgefordert, auf
    einen Link zu klicken, der zu einer täuschend echt aussehenden Website führt,
    um Ihre Zugangsdaten oder Kreditkarteninformationen einzugeben.


    Ein weiteres Risiko stellen unseriöse Drittanbieter dar, die versprechen, Ihre
    Kfz-Versicherung durch manipulative Angaben bei der Risikoprüfung massiv zu verbilligen.
    Solche Versprechen führen fast immer zu einer Verletzung der vorvertraglichen
    Anzeigepflicht. Im Schadensfall kann dies dazu führen, dass die Versicherung die
    Leistung ganz oder teilweise verweigert, da falsche Angaben zur Fahrzeugnutzung
    oder zum Fahrerprofil gemacht wurden.


    Bitte beachten Sie: Die Hanseatica Versicherung wird Sie niemals per E-Mail oder
    SMS dazu auffordern, Passwörter, PINs oder MFA-Codes direkt in einer Nachricht
    zu übermitteln. Jede zustandsändernde Aktion in Ihrem Vertrag erfordert eine sichere
    Identitätsprüfung über unser Kundenportal oder einen validierten KYC-Prozess.


    Sollten Sie eine verdächtige Kommunikation erhalten haben oder vermuten, dass
    Ihre Daten kompromittiert wurden, informieren Sie uns bitte unverzüglich. Eine
    schnelle Meldung ist entscheidend, um weiteren Missbrauch zu verhindern. Betrugsversuche
    werden von uns konsequent dokumentiert und den zuständigen Behörden gemeldet.
    Für weitere allgemeine Sicherheitshinweise können Sie auch das Dokument Kfz-Versicherung
    — Schutz vor Betrug und nicht autorisierten Vorgängen konsultieren.'
  domain: insurance
  product_category: kfz
