  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: ca649a37-cbec-5d86-be2c-3f9006d4f75b
  title: Privathaftpflicht Komfort — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Sinne der hanseatischen Zuverlässigkeit legen wir bei der Hanseatica Versicherung
    höchsten Wert auf Ihre Sicherheit. Da die Privathaftpflicht Komfort ein essenzieller
    Baustein Ihres Vermögensschutzes ist, wird sie gelegentlich zum Ziel von Betrugsversuchen.


    Ein häufiges Muster ist das sogenannte ''Phishing'', bei dem Sie E-Mails oder
    SMS erhalten, die scheinbar von uns stammen. In diesen Nachrichten wird oft behauptet,
    dass Ihre Police aufgrund eines Fehlers deaktiviert wurde oder dass eine dringende
    Aktualisierung Ihrer Daten erforderlich sei. Diese Nachrichten fordern Sie auf,
    auf einen externen Link zu klicken und dort Ihre Zugangsdaten oder Kreditkarteninformationen
    einzugeben.


    Bitte beachten Sie: Die Hanseatica Versicherung wird Sie niemals per E-Mail oder
    SMS dazu auffordern, Passwörter, PINs oder Multi-Faktor-Authentifizierungs-Codes
    auf einer externen Webseite einzugeben. Wir fordern Sie niemals zur Überweisung
    von Prämien auf private Konten auf; alle Zahlungen erfolgen über die in Ihren
    Vertragsunterlagen festgelegten, transparenten Wege.


    Ein weiteres Warnsignal sind Angebote von Drittanbietern, die eine ''Sofort-Übernahme''
    Ihrer Privathaftpflicht Komfort zu unrealistischen Konditionen versprechen, ohne
    dass eine ordnungsgemäße Kündigung Ihres Altvertrages erfolgt ist. Hierbei wird
    oft versucht, Ihre persönlichen Daten für nicht autorisierte Vertragsabschlüsse
    zu missbrauchen.


    Sollten Sie eine Nachricht erhalten, die Ihnen verdächtig vorkommt, oder bemerken
    Sie ungewöhnliche Aktivitäten in Ihrem Kundenportal, ist die erste und wichtigste
    Maßnahme die sofortige Meldung an uns. Bitte informieren Sie uns umgehend über
    unsere offiziellen Kommunikationskanäle, damit wir Ihren Zugang sichern und eine
    Identitätsprüfung mittels eines validierten KYC-Prozesses einleiten können.


    Betrugsversuche werden von uns konsequent dokumentiert und den zuständigen Behörden
    gemeldet, um die Integrität unseres Service-Modells und den Schutz Ihrer Daten
    zu gewährleisten.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: cfd98901-ec43-5e58-9073-44c538212f37
  title: Privathaftpflicht Komfort — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Erläuterung
    der Versicherungsgrenzen der Privathaftpflicht Komfort gegenüber Kunden.


    Die Privathaftpflicht Komfort bietet einen umfassenden Schutz mit einer Deckungssumme
    von 20.000.000 €, was weit über den Standardbedarfen liegt und eine nachhaltige
    Sicherung des Privatvermögens gewährleistet. Dennoch gibt es klare Grenzen und
    Sonderfälle, die im Beratungsgespräch präzise kommuniziert werden müssen.


    1. Selbstbeteiligung:

    Jeder reguläre Schadenfall unterliegt einer vereinbarten Selbstbeteiligung von
    150 €. Dieser Betrag ist vom Kunden zu tragen, bevor die Versicherung einspringt.
    Dies dient der Vermeidung von Kleinstschäden und trägt zur fairen Preisgestaltung
    der Prämie bei.


    2. Vorsätzliche Handlungen:

    Gemäß den gesetzlichen Bestimmungen und unseren Versicherungsbedingungen ist eine
    vorsätzlich herbeigeführte Schadenslage nicht versichert. Hierzu zählen auch grobe
    Fahrlässigkeiten in spezifischen, vertraglich ausgeschlossenen Szenarien.


    3. Berufliche Tätigkeiten:

    Die Privathaftpflicht Komfort deckt ausschließlich private Aktivitäten ab. Schäden,
    die im Rahmen einer gewerblichen oder beruflichen Tätigkeit entstehen, fallen
    nicht unter diesen Schutz. Kunden im deutschen Mittelstand, die eine Absicherung
    für ihre berufliche Tätigkeit benötigen, sollten auf unsere spezialisierten Betriebshaftpflicht-Lösungen
    hingewiesen werden.


    4. Sonderfälle bei der Nutzung von Fahrzeugen:

    Während die Privathaftpflicht allgemeine Schäden abdeckt, sind spezifische Kfz-Schäden
    über die gesetzlich vorgeschriebene Kfz-Haftpflicht abzusichern. Es ist wichtig,
    dem Kunden den Unterschied zwischen einer privaten Haftpflicht und der Kfz-Versicherung
    deutlich zu machen.


    Bei Unklarheiten bezüglich der Eignung des Produkts für eine spezifische Situation
    verweisen Sie den Kunden bitte an die entsprechende Fachabteilung. Beachten Sie
    dabei stets, dass wir keine individuelle Rechtsberatung leisten, sondern lediglich
    edukative Erläuterungen zur Produktwahl anbieten. Weitere Details entnehmen Sie
    bitte dem Dokument Privathaftpflicht Komfort — Überblick.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: product_sheet
  source_authority: official
