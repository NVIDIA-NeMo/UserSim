- id: b866449d-93fb-5a37-b7a7-42807301abfa
  title: Hausratversicherung — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihren Vertrag beenden oder an Ihre aktuellen Lebensumstände anpassen
    möchten, führen wir Sie durch diesen Prozess. Bitte beachten Sie, dass für eine
    Änderung oder Kündigung eine eindeutige Identitätsprüfung erforderlich ist.


    Schritte zur Kündigung oder zum Tarifwechsel:


    1. Mitteilung Ihres Anliegens: Teilen Sie uns mit, ob Sie den Vertrag vollständig
    kündigen, zum nächstmöglichen Termin schließen oder in einen anderen Tarif wechseln
    möchten. Geben Sie dabei bitte Ihre Versicherungsnummer an.


    2. Identitätsprüfung: Wir führen eine Verifizierung Ihrer Identität durch. Dies
    geschieht in der Regel mittels Multi-Faktor-Authentifizierung oder eines validierten
    KYC-Prozesses, um unbefugte Vertragsänderungen zu verhindern.


    3. Festlegung des Zeitpunkts: Wir klären gemeinsam den gewünschten Zeitpunkt der
    Änderung. Im Falle einer Kündigung prüfen wir, ob ein Sonderkündigungsrecht (z.
    B. nach einer Beitragserhöhung) vorliegt oder ob die ordentliche Kündigungsfrist
    gilt. Bei einem Tarifwechsel besprechen wir die neuen Konditionen, wie beispielsweise
    die Anpassung der Versicherungssumme über die 650 € pro Quadratmeter.


    4. Bestätigung und Abschluss: Wir senden Ihnen eine schriftliche Bestätigung über
    die Kündigung oder den Tarifwechsel zu. In diesem Dokument ist das exakte Datum
    des Vertragsendes bzw. der Tarifumstellung aufgeführt.


    Nach Erhalt dieser Bestätigung ist der Vorgang abgeschlossen. Sollten Sie innerhalb
    der ersten 14 Tage nach Vertragsschluss sein Widerrufsrecht nutzen wollen, teilen
    Sie uns dies bitte unmittelbar mit.'
  domain: insurance
  product_category: hausrat
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 38d744cc-9a64-57fb-bc79-04d9f445550e
  title: Hausratversicherung — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Symptom: Ein Kunde stellt fest, dass der eingezogene Betrag für die Hausratversicherung
    von dem ursprünglich erwarteten Beispielwert von 96 € abweicht oder ein unerwarteter
    Betrag auf dem Kontoauszug erscheint.


    Mögliche Ursachen:

    1. Risikobasierte Anpassung: Da unsere Prämien risikobasiert kalkuliert werden,
    kann es aufgrund geänderter Risikofaktoren (z. B. Änderung des Wohnortes oder
    der Sicherheitsvorkehrungen) zu einer Anpassung kommen.

    2. Administrative Kosten: Gebühren zur Deckung administrativer Kosten oder zur
    Einhaltung regulatorischer Sicherheitsmargen wurden verrechnet.

    3. Tarifwechsel: Es wurde ein Upgrade vorgenommen, beispielsweise eine Erhöhung
    der Versicherungssumme über die standardmäßigen 650 € pro Quadratmeter hinaus.


    Prüfschritte für den Support-Agenten:

    - Prüfen Sie im Kundenkonto, ob eine Beitragsanpassung kommuniziert wurde.

    - Gleichen Sie den aktuellen Tarif mit dem ursprünglichen Abschlussvertrag ab.

    - Überprüfen Sie, ob Sondervereinbarungen (z. B. zusätzliche Deckungen über den
    Fahrraddiebstahl-Schutz von 1.000 € hinaus) aktiv sind.


    Lösung:

    - Erklären Sie dem Kunden die Grundlage der risikobasierten Kalkulation und weisen
    Sie auf die Transparenz unserer Preisgestaltung hin.

    - Falls ein Fehler vorliegt, korrigieren Sie den Betrag unmittelbar und bestätigen
    Sie die Rückerstattung des Differenzbetrags.


    Eskalation:

    Sollte keine Einigung über die Höhe des Betrags erzielt werden, wird der Fall
    strukturiert an die Fachabteilung und anschließend an das Beschwerdemanagement
    geleitet. Wir weisen den Kunden in diesem Fall aktiv auf die Möglichkeit hin,
    den kostenlosen Versicherungsombudsmann zu kontaktieren.'
  domain: insurance
  product_category: hausrat
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: dfb8a610-8190-5318-9e59-de089f04a909
  title: Hausratversicherung — erforderliche Unterlagen
  body: 'Um eine präzise Risikokalkulation und einen reibungslosen Abschluss Ihrer
    Hausratversicherung zu gewährleisten, sind je nach Situation folgende Unterlagen
    erforderlich:


    | Benötigte Unterlage | Zweck / Bedingung | Ergebnis |

    | :--- | :--- | :--- |

    | Aktueller Wohnsitznachweis | Verifizierung der versicherten Adresse | Ermöglicht
    die Berechnung der Versicherungssumme basierend auf 650 € pro Quadratmeter. |

    | Nachweis der Wohnfläche (m²) | Genaue Bestimmung der Quadratmeterzahl | Festlegung
    der finalen Versicherungssumme und Beitragsberechnung. |

    | Liste wertvoller Einzelgegenstände | Bei Werten, die die Pauschale übersteigen
    | Sicherstellung des vollen Schutzes über die Standarddeckung hinaus. |

    | Kaufbelege für Fahrräder | Bei Inanspruchnahme des Diebstahlschutzes | Validierung
    des Anspruchs auf den Schutz bis 1.000 €. |

    | Gültiges Identitätsdokument | KYC-Prozess / Identitätsprüfung | Erfolgreicher
    Vertragsabschluss und Zugang zum Kundenportal. |'
