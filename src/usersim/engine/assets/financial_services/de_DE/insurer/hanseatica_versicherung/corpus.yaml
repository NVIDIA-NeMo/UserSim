- id: 3d0e8f91-6e1d-55ac-bd5b-d6f0b3381dca
  title: Hausratversicherung — zwischen Tarifen wählen
  body: 'Bei der Wahl der passenden Hausratversicherung bietet Hanseatica Versicherung
    verschiedene Abstufungen an, um Ihren individuellen Bedarf an Sicherheit und Budget
    optimal zu decken.


    Unser Basisschutz konzentriert sich auf die essenziellen Risiken. Er bietet eine
    transparente Kalkulation, die sich an einem Standardwert von 650 € pro Quadratmeter
    orientiert, und schützt Ihre wichtigsten Besitztümer vor den häufigsten Gefahren.
    Eine Beispielprämie für ein Standardobjekt liegt hier bei etwa 96 € pro Jahr.


    Der erweiterte Schutz ist ideal für Kunden, die einen höheren Sachwert im Haushalt
    besitzen. Während der Basisschutz bereits eine spezialisierte Deckung für Fahrraddiebstahl
    bis 1.000 € beinhaltet, ermöglicht der erweiterte Tarif die Erhöhung dieser Summe
    sowie eine höhere Gesamtsumme pro Quadratmeter, um auch hochwertige Sammlungen
    oder teure E-Bikes vollständig abzusichern.


    Wer maximale Sicherheit sucht und eine hanseatische Zuverlässigkeit ohne Kompromisse
    wünscht, wählt den erweiterten Schutz. Für Kunden mit einem durchschnittlichen
    Haushalt und einem Fokus auf ein faires Preis-Leistungs-Verhältnis ist die Basisvariante
    die effizienteste Wahl.


    Weitere Details zur Leistungsübersicht finden Sie im Dokument Hausratversicherung
    — Überblick.'
  domain: insurance
  product_category: hausrat
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: bae35710-bf1a-5cca-8458-9c650cb7b6de
  title: Hausratversicherung — Datenschutz und Datenverarbeitung
  body: 'Die Hanseatica Versicherung verarbeitet personenbezogene Daten im Rahmen
    der Hausratversicherung strikt nach den Vorgaben der Datenschutz-Grundverordnung
    (DSGVO) und unter der Aufsicht der BaFin. Wir verpflichten uns zu einer transparenten
    und zweckgebundenen Datenverarbeitung.


    Um eine präzise Risikokalkulation vorzunehmen, erheben wir Daten zu Ihrer Wohnsituation,
    insbesondere zur Quadratmeterzahl, da diese die Grundlage für die Versicherungssumme
    von 650 € pro Quadratmeter bildet. Ebenso erfassen wir Informationen über versicherte
    Gegenstände, wie etwa Fahrräder, um den integrierten Schutz bis 1.000 € korrekt
    zu verwalten.


    Zur Sicherstellung der Vertragssicherheit und zur Prävention von Betrug führen
    wir einen validierten KYC-Prozess durch. Die Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    (MFA) ist zwingende Voraussetzung für den Zugriff auf vertrauliche Daten oder
    zustandsändernde Vertragsanpassungen. Diese Daten werden verschlüsselt gespeichert
    und nur für die Erfüllung des Versicherungsvertrags sowie zur Erfüllung regulatorischer
    Meldepflichten verwendet.


    Sie haben jederzeit das Recht auf Auskunft über Ihre gespeicherten Daten sowie
    das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    (z. B. aus dem Versicherungsvertragsgesetz) entgegenstehen. Wir weisen proaktiv
    auf Ihr allgemeines Widerrufsrecht von 14 Tagen nach Vertragsschluss hin.


    Ein Missbrauch Ihrer Daten wird von uns konsequent dokumentiert und den zuständigen
    Behörden gemeldet. Für weitere Informationen zur rechtlichen Einordnung besuchen
    Sie bitte das Dokument Hausratversicherung — rechtliche Hinweise.'
  domain: insurance
  product_category: hausrat
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 050adce1-191a-559e-b2ab-fb258ff9976b
  title: Hausratversicherung — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Im Interesse Ihrer finanziellen Sicherheit möchten wir Sie auf gängige Betrugsmaschen
    aufmerksam machen, die im Zusammenhang mit Hausratversicherungen auftreten können.
    Betrüger versuchen oft, durch gefälschte Dokumente oder Social Engineering unberechtigte
    Leistungen zu erschleichen oder sensible Daten abzugreifen.


    Ein häufiges Muster ist das sogenannte ''Phishing'' über gefälschte E-Mails, die
    eine dringende Aktualisierung Ihrer Versicherungsdaten fordern oder eine vermeintliche
    Schadenserstattung ankündigen. Seien Sie wachsam: Hanseatica Versicherung wird
    Sie niemals per E-Mail oder SMS dazu auffordern, Passwörter, PINs oder Multi-Faktor-Authentifizierungscodes
    auf einer externen Webseite einzugeben.


    Zudem warnen wir vor Angeboten von Drittanbietern, die eine ''garantierte'' Erhöhung
    Ihrer Deckungssummen ohne Prüfung versprechen. Ein seriöser Abschluss basiert
    stets auf einer transparenten Risikokalkulation. Bitte beachten Sie, dass wir
    bei Verdacht auf Betrug Versuche konsequent dokumentieren und den zuständigen
    Behörden melden.


    Sollten Sie eine verdächtige Anfrage erhalten haben oder bemerken, dass unbefugte
    Änderungen an Ihrem Vertrag vorgenommen wurden, informieren Sie uns bitte unverzüglich.
    Eine schnelle Meldung ist entscheidend, um den Schaden zu begrenzen und Ihre Haftung
    zu minimieren. Bevor wir zustandsändernde Aktionen vornehmen, führen wir grundsätzlich
    eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses durch. Wenn Sie aufgefordert werden, Ihre Identität
    zu bestätigen, stellen Sie sicher, dass dies über unsere offiziellen, gesicherten
    Kanäle erfolgt.'
  domain: insurance
  product_category: hausrat
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1c276649-7afc-5457-bb3d-63e8206cdb06
  title: Hausratversicherung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter, um Kunden über
    die spezifischen Grenzen und Sonderfälle der Hausratversicherung aufzuklären.
    Ein fundiertes Verständnis dieser Einschränkungen ist essenziell, um falsche Erwartungen
    zu vermeiden und die hanseatische Zuverlässigkeit in der Beratung zu gewährleisten.


    Die Deckung umfasst primär bewegliche Gegenstände im Haushalt. Es gibt jedoch
    klare Grenzen: Vorsätzliche Beschädigungen oder Schäden durch grob fahrlässiges
    Verhalten, sofern nicht explizit anders vereinbart, sind vom Versicherungsschutz
    ausgeschlossen. Ebenso sind Gegenstände, die dauerhaft außerhalb der versicherten
    Räumlichkeiten aufbewahrt werden (z. B. in einem externen Lager), nicht automatisch
    mitversichert.


    Besonderes Augenmerk gilt den folgenden Werten:

    - Die Basis der Versicherungssumme berechnet sich nach einem Wert von 650 € pro
    Quadratmeter Wohnfläche. Eine Unterversicherung kann entstehen, wenn der tatsächliche
    Wert des Hausrats diesen Betrag signifikant übersteigt und keine entsprechende
    Anpassung vorgenommen wurde.

    - Für den spezialisierten Schutz gegen Fahrraddiebstahl gilt eine maximale Deckungssumme
    von 1.000 €. Beträge, die über diesen Limit hinausgehen, sind nicht gedeckt, es
    sei denn, es wurde eine individuelle Erweiterung abgeschlossen.


    In Sonderfällen, wie etwa bei der Mitversicherung von wertvollen Kunstgegenständen
    oder Antiquitäten, ist eine detaillierte Auflistung und ggf. ein Gutachten erforderlich.
    Weisen Sie den Kunden darauf hin, dass eine unvollständige Angabe dieser Werte
    im Schadenfall zu einer proportionalen Leistungskürzung führen kann. Für weitere
    Details zum allgemeinen Überblick verweisen Sie bitte auf die Hausratversicherung
    — Überblick.'
  domain: insurance
  product_category: hausrat
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 74163f16-61e8-546c-ad6c-68b55d3d4416
  title: Hausratversicherung — Kosten und Entgelte
  body: 'Hier finden Sie Antworten zu den Kostenstrukturen unserer Hausratversicherung.


    **Wie setzen sich die Kosten für meine Hausratversicherung zusammen?**

    Unsere Prämien sind risikobasiert und transparent kalkuliert. Sie basieren auf
    Faktoren wie der Wohnfläche, dem Standort und dem gewünschten Deckungsumfang.
    Gebühren dienen dabei primär der Deckung administrativer Kosten sowie der Einhaltung
    regulatorischer Sicherheitsmargen, um eine dauerhafte Solvenz und höchste Leistungsqualität
    zu garantieren.


    **Können Sie mir ein Beispiel für die jährlichen Kosten nennen?**

    Zur Orientierung können wir ein Beispiel anführen: Ein beispielhafter Jahresbeitrag
    für eine Standard-Hausratversicherung kann bei 96 € liegen. Bitte beachten Sie,
    dass dies ein Richtwert ist und die tatsächliche Prämie je nach individuellen
    Risikofaktoren variiert.


    **Gibt es versteckte Kosten bei der Verwaltung?**

    Nein. Wir setzen auf Transparenz. Alle Kosten sind in Ihrem Preis- und Leistungsverzeichnis
    aufgeführt. Weitere Informationen entnehmen Sie bitte dem Dokument Hausratversicherung
    — Preis- und Leistungsverzeichnis.'
