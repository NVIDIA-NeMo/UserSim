  institution_id: hanseatica_versicherung
- id: 03ed6f44-ff5a-5d0f-89b7-f0d75ddf1782
  title: Privathaftpflicht Komfort — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Im Vergleich zu unserem Basis-Tarif bietet die Privathaftpflicht Komfort
    ein deutlich höheres Sicherheitsniveau für Personen mit komplexen Vermögensverhältnissen
    oder einem höheren Risikoexponierung im beruflichen Umfeld.


    **Vergleich der Kernmerkmale:**

    - **Deckungssumme:** Während der Basis-Tarif eine Standarddeckung bietet, verfügt
    die Privathaftpflicht Komfort über eine Deckungssumme von 20.000.000 €, was insbesondere
    bei Personenschäden einen essenziellen Schutz bietet.

    - **Selbstbeteiligung:** In der Komfort-Variante ist eine Selbstbeteiligung von
    150 € integriert, was im Gegenzug zu einer stabileren und fairen Preisgestaltung
    der jährlichen Prämien führt (Beispiel: 59 €).

    - **Zielgruppe:** Die Privathaftpflicht Komfort richtet sich an den deutschen
    Mittelstand und Privatpersonen, die eine maximale Absicherung ihres Vermögens
    priorisieren.


    **Welches Produkt passt zu Ihnen?**

    Die Privathaftpflicht Komfort ist die richtige Wahl, wenn Sie maximale finanzielle
    Sicherheit suchen und bereit sind, im Schadensfall eine geringe Selbstbeteiligung
    zu tragen. Der Basis-Tarif eignet sich eher für Personen mit geringerem Risiko
    und geringeren Vermögenswerten. Beides folgt unserem Prinzip der hanseatischen
    Zuverlässigkeit. Details finden Sie in Privathaftpflicht Komfort — Überblick.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 577db031-4d64-59a1-a03b-543e87990f4b
  title: Privathaftpflicht Komfort — rechtliche Hinweise
  body: 'Die Hanseatica Versicherung agiert unter der strikten Aufsicht der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin) und verpflichtet sich zur strikten Einhaltung
    des Versicherungsvertragsgesetzes (VVG). Alle Verträge der Privathaftpflicht Komfort
    werden auf Basis dieser regulatorischen Rahmenbedingungen geführt.


    **Widerrufsrechte:**

    Wir weisen Sie proaktiv auf Ihr gesetzliches Widerrufsrecht hin. Sie können den
    Vertrag innerhalb von 14 Tagen nach Vertragsschluss ohne Angabe von Gründen stornieren.
    Bitte beachten Sie, dass dies die allgemeine Frist ist; für Lebens- und Rentenversicherungen
    gilt eine Frist von 30 Tagen.


    **Leistungsgrenzen und Haftung:**

    Der Versicherungsschutz der Privathaftpflicht Komfort ist auf eine maximale Deckungssumme
    von 20.000.000 € begrenzt. Schäden, die diesen Betrag übersteigen, sind nicht
    versichert. Zudem ist eine vertragliche Selbstbeteiligung von 150 € vereinbart,
    die vom Versicherten im Schadenfall zu tragen ist.


    **Datenschutz und Identitätsprüfung:**

    Zum Schutz Ihrer vertraulichen Daten und zur Vermeidung von Betrug ist vor jeder
    zustandsändernden Aktion eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses zwingend erforderlich. Die Verarbeitung Ihrer
    Daten erfolgt gemäß den geltenden Datenschutzrichtlinien.


    **Beschwerdemanagement:**

    Beschwerden werden fair und zeitnah bearbeitet. Sollte kein Konsens erzielt werden,
    verweisen wir Sie aktiv auf den kostenlosen Versicherungsombudsmann. Betrugsversuche
    werden von uns konsequent dokumentiert und den zuständigen Behörden gemeldet.


    Weitere Details zu den Kosten finden Sie im Dokument Privathaftpflicht Komfort
    — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: f2c8ee16-3f7d-5592-8f7a-69a0e7a83777
  title: Privathaftpflicht Komfort — Zinsübersicht
  body: 'Obwohl die Privathaftpflicht Komfort kein Zinsprodukt ist, basiert die Berechnung
    der Prämien auf einem transparenten, risikobasierten Modell. Es gibt keinen festen
    Zinssatz, sondern eine risikoadaptierte Beitragsstruktur.


    **Prämienkalkulation:**

    Die Beiträge werden so kalkuliert, dass eine dauerhafte Solvenz des Versicherers
    und höchste Leistungsqualität gewährleistet bleiben. Ein beispielhafter Jahresbeitrag
    für einen Einzelversicherten beträgt 59 €.


    **Einflussfaktoren auf die Rate:**

    - **Risikoprofil:** Die individuelle Gefährdungslage beeinflusst die Höhe der
    Prämie.

    - **Regulatorische Margen:** Die Beiträge beinhalten Anteile zur Einhaltung gesetzlicher
    Sicherheitsmargen gemäß BaFin-Vorgaben.

    - **Administrative Kosten:** Die Gebühren decken die Kosten der professionellen
    Vertragsverwaltung ab.


    Wir garantieren keine spezifische Wertentwicklung, da es sich um eine reine Risikoversicherung
    handelt. Eine detaillierte Aufstellung der Kosten entnehmen Sie bitte dem Dokument
    Privathaftpflicht Komfort — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 81a9ca7f-73d4-5534-946a-7f7d40062466
  title: Privathaftpflicht Komfort — aktuelles Angebot
  body: 'Sehr geehrte Kundin, sehr geehrter Kunde,


    um die langfristige Partnerschaft mit unseren Bestandskunden im deutschen Mittelstand
    zu stärken, bietet die Hanseatica Versicherung ein aktuelles Sonderangebot an.


    **Das Angebot:**

    Bei einem Neuabschluss oder einem Upgrade auf die Privathaftpflicht Komfort im
    Zeitraum vom 01. Oktober 2024 bis zum 31. Dezember 2024 gewähren wir einen einmaligen
    Treue-Rabatt von 10 % auf den ersten Jahresbeitrag.


    Basierend auf unserem Beispielbeitrag von 59 € würde dies eine Ersparnis im ersten
    Jahr bedeuten, sofern Ihr individuelles Risikoprofil diesem Beispiel entspricht.
    Die Deckungssumme bleibt unabhängig vom Angebot auf dem erstklassigen Niveau von
    20.000.000 € bei einer Selbstbeteiligung von 150 €.


    Dieses Angebot ist zeitlich begrenzt und kann nicht mit anderen Rabatten kombiniert
    werden. Bitte kontaktieren Sie uns für eine individuelle Berechnung Ihres neuen
    Beitrags. Weitere Informationen finden Sie unter Privathaftpflicht Komfort — Überblick.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: f514f724-4754-5f6f-a81d-4d8fdf436f7f
  title: Privathaftpflicht Komfort — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sicherheit Ihrer Daten und Ihres Vermögens hat bei der Hanseatica Versicherung
    höchste Priorität. Im Zusammenhang mit der Privathaftpflicht Komfort beobachten
    wir vermehrt Versuche, Kunden durch gefälschte Kommunikation dazu zu bewegen,
    sensible Informationen preiszugeben.


    Bitte beachten Sie, dass wir Sie niemals per E-Mail oder SMS auffordern werden,
    Passwörter, PINs oder Ihre vollständigen Identitätsnachweise über unsichere Kanäle
    zu übermitteln. Ein besonderes Augenmerk gilt dem Schutz vor ''Phishing'', bei
    dem gefälschte Portale unsere digitale Umgebung imitieren, um Zugriff auf Ihre
    Vertragsdaten zu erlangen.


    Zum Schutz Ihrer Privathaftpflicht Komfort setzen wir eine strikte Multi-Faktor-Authentifizierung
    (MFA) sowie validierte KYC-Prozesse (Know Your Customer) ein. Jede zustandsändernde
    Aktion – etwa die Änderung Ihrer Bankverbindung oder die Anpassung der Deckungssumme
    von 20.000.000 € – erfordert zwingend diese Verifizierung. Wenn Sie eine Aufforderung
    zur Identitätsprüfung erhalten, die Sie nicht selbst initiiert haben, handeln
    Sie bitte umgehend.


    Sollten Sie den Verdacht haben, dass unbefugte Personen Zugriff auf Ihre Daten
    erlangt haben oder Ihnen eine verdächtige Nachricht vorliegt, informieren Sie
    uns bitte unverzüglich. Eine schnelle Meldung ist entscheidend, um die Haftung
    für nicht autorisierte Vorgänge zu begrenzen und weitere Schäden zu verhindern.
    Betrugsversuche werden von uns konsequent dokumentiert und den zuständigen Behörden
    gemeldet.


    Für weitere Details zu Ihren Rechten und unseren Sicherheitsrichtlinien verweisen
    wir auf das Dokument Privathaftpflicht Komfort — rechtliche Hinweise.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 12fd01b2-58d2-580f-b5e3-3fc8a910751a
  title: Privathaftpflicht Komfort — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Nutzung und die vertraglichen
    Verpflichtungen im Rahmen der Privathaftpflicht Komfort der Hanseatica Versicherung.
    Wir agieren unter strikter Aufsicht der BaFin und halten die Vorgaben des Versicherungsvertragsgesetzes
    (VVG) ein.


    1. Leistungsumfang und Deckung

    Die Privathaftpflicht Komfort bietet einen umfassenden Schutz des Privatvermögens.
    Die maximale Deckungssumme ist auf 20.000.000 € festgesetzt. Diese Summe bildet
    die Obergrenze für die Leistungen, die wir im Schadensfall übernehmen.


    2. Selbstbeteiligung

    Der Versicherungsnehmer trägt im Schadensfall eine vereinbarte Selbstbeteiligung
    in Höhe von 150 €. Dieser Betrag wird von der jeweiligen Leistungssumme abgezogen
    bzw. ist vom Kunden vorab zu leisten.


    3. Prämienzahlung

    Die Prämien sind risikobasiert und transparent kalkuliert. Beispielhaft beträgt
    der Jahresbeitrag 59 €. Die Zahlung der Prämien ist Voraussetzung für den bestehenden
    Versicherungsschutz. Gebühren dienen der Deckung administrativer Kosten und der
    Einhaltung regulatorischer Sicherheitsmargen.


    4. Pflichten des Versicherungsnehmers

    Der Versicherungsnehmer ist zur unverzüglichen Schadenmeldung verpflichtet. Ein
    schuldhaftes Zögern bei der Meldung eines Schadensereignisses kann zu einer Kürzung
    der Leistung führen.


    5. Widerruf und Kündigung

    Es besteht ein gesetzliches Widerrufsrecht von 14 Tagen ab Vertragsschluss. Die
    Kündigung erfolgt gemäß den im Vertrag festgelegten Fristen. Sonderkündigungsrechte
    stehen beispielsweise nach einer Beitragserhöhung zur Verfügung.


    6. Änderungen der Bedingungen

    Die Hanseatica Versicherung behält sich vor, die Bedingungen an gesetzliche Änderungen
    oder regulatorische Vorgaben der BaFin anzupassen. Kunden werden über solche Änderungen
    fristgerecht informiert.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: a380f188-9e9e-5153-992d-366f53440b92
  title: Privathaftpflicht Komfort — für wen und wofür geeignet
  body: 'Die Privathaftpflicht Komfort wurde gezielt für Personen entwickelt, die
    einen höchst zuverlässigen und transparenten Schutz für ihr Privatvermögen suchen.
    Sie ist insbesondere für Angehörige des deutschen Mittelstands, Familien und Berufstätige
    geeignet, die eine Absicherung wünschen, die auch bei schweren, existenzbedrohenden
    Personenschäden oder Sachschäden vollumfänglich greift.


    Warum die Privathaftpflicht Komfort die richtige Wahl ist:


    - Maximale Sicherheit: Mit einer Deckungssumme von 20.000.000 € bieten wir einen
    Schutz, der weit über den Standard vieler Basis-Tarife hinausgeht und so auch
    bei extremen Schadenszenarien Ihr Vermögen schützt.

    - Transparente Kostenstruktur: Ein beispielhafter Jahresbeitrag von 59 € verdeutlicht
    unsere faire Preisgestaltung, die auf einer risikobasierten Kalkulation basiert.

    - Klare Verantwortlichkeit: Durch die feste Selbstbeteiligung von 150 € fördern
    wir ein verantwortungsbewusstes Handeln und halten gleichzeitig die Prämien auf
    einem wettbewerbsfähigen Niveau.

    - Hanseatische Zuverlässigkeit: Wir kombinieren traditionelle Werte wie Seriosität
    und Vertrauenswürdigkeit mit modernen, digitalen Prozessen für eine schnelle Schadenabwicklung.


    Dieses Produkt eignet sich für alle, die nicht nur eine gesetzliche Mindestabsicherung
    suchen, sondern eine hochwertige ''Komfort''-Lösung, die Ruhe und Sicherheit im
    Alltag bietet. Für eine detaillierte Aufstellung der Kosten sehen Sie bitte in
    das Dokument Privathaftpflicht Komfort — Preis- und Leistungsverzeichnis.'
