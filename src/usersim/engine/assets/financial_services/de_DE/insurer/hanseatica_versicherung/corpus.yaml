- id: 2845578a-2d46-5dfc-9336-cd4e1509eed5
  title: Fondsgebundene Rentenversicherung — im Vergleich zu einem typischen Wettbewerbsangebot
  body: 'Beim Vergleich unserer Fondsgebundenen Rentenversicherung mit typischen Wettbewerbsangeboten
    am Markt kristallisieren sich wesentliche Unterschiede in der Kostenstruktur und
    der Transparenz heraus.


    - Kostenstruktur: Während viele Wettbewerber hohe, oft intransparente Abschlussgebühren
    erheben, begrenzt die Hanseatica Versicherung die Abschlusskosten mit einer Obergrenze
    von 2,5 %. Dies bedeutet, dass ein größerer Teil Ihrer Beiträge von Beginn an
    im Fonds investiert wird und für Sie arbeitet.

    - Laufende Kosten: Unsere Effektivkosten pro Jahr liegen bei 1,1 %. Im Marktvergleich
    ist dies ein wettbewerbsfähiges Niveau, das eine hohe Leistungsqualität und Solvenz
    bei gleichzeitiger Kosteneffizienz bietet.

    - Einstiegshürde: Mit einem Mindestbeitrag von 25 € ermöglichen wir einen niederschwelligen
    Zugang zur kapitalmarktbasierten Altersvorsorge, was oft attraktiver ist als die
    höheren Mindestsummen bei exklusiveren Wettbewerbern.


    Wer sollte welches Produkt wählen?

    - Die Hanseatica Versicherung eignet sich für Kunden, die eine hanseatische Zuverlässigkeit
    mit einer modernen, digitalen Abwicklung und einer strikt gedeckelten Kostenstruktur
    kombinieren möchten.

    - Ein Wettbewerbsangebot könnte dann die bessere Wahl sein, wenn sehr spezifische,
    exotische Anlagestrategien gewünscht sind, die über unseren Standard-Fondsrahmen
    hinausgehen.


    Weitere Details zur Kostenstruktur finden Sie in der Fondsgebundene Rentenversicherung
    — Effektivkosten pro Jahr: Erklärung.'
