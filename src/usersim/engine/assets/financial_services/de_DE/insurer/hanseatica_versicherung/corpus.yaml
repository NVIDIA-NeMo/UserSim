  institution_id: hanseatica_versicherung
- id: 1091b4c6-b0a3-5489-8cb1-67ebb11d8bfb
  title: Fondsgebundene Rentenversicherung — Empfehlungs- und Treueangebot
  body: 'Hanseatica Versicherung schätzt die Verbundenheit unserer Kunden und das
    Vertrauen, das Sie in unsere hanseatische Zuverlässigkeit setzen. Um diesen Wert
    zu honorieren, bieten wir Ihnen vom 01.01.2024 bis zum 31.12.2024 ein exklusives
    Empfehlungs- und Treueangebot an.


    Für jeden Neukunden, den Sie erfolgreich für unsere Fondsgebundene Rentenversicherung
    werben, schreiben wir Ihrem Konto eine einmalige Prämie in Höhe von 50 € gut.
    Diese Gutschrift erfolgt unmittelbar nach dem erfolgreichen Abschluss des Vertrages
    durch den geworbenen Kunden. Voraussetzung ist, dass der neue Vertrag den geforderten
    Mindestbeitrag von 25 € pro Monat erfüllt.


    Dieses Angebot gilt parallel zu unseren transparenten Kostenstrukturen, wie den
    effektiven Kosten von 1,1 % pro Jahr. Wir laden Sie ein, die private Absicherung
    Ihres Umfelds mit einem Partner zu stärken, der auf Seriosität und langfristige
    Solvenz setzt. Bitte beachten Sie, dass dieses Angebot nicht mit anderen Rabattaktionen
    kombinierbar ist.'
