- id: 4ad024f2-7d40-5f6a-9653-062464f6e434
  title: Privathaftpflicht Komfort — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugriff auf Ihr Kundenportal für die Privathaftpflicht
    Komfort haben, finden Sie hier die systematische Fehlerbehebung.


    Symptom: Die Fehlermeldung „Zugriff verweigert“ oder ein endloses Lade-Symbol
    beim Login-Versuch.


    Wahrscheinliche Ursachen:

    - Veraltete Browser-Cookies oder Cache-Konflikte.

    - Fehler bei der Multi-Faktor-Authentifizierung (MFA).

    - Ein nicht erfolgreich abgeschlossener oder abgelaufener KYC-Prozess.

    - Inaktive Zugangsdaten aufgrund längerer Inaktivität.


    Schritte zur Lösung:

    1. Browser-Check: Versuchen Sie, das Portal in einem privaten Fenster (Inkognito-Modus)
    zu öffnen. Wenn dies funktioniert, löschen Sie bitte Ihren Browser-Cache und die
    Cookies.

    2. MFA-Verifizierung: Prüfen Sie, ob Sie den MFA-Code korrekt eingegeben haben
    und ob Ihr Gerät mit dem System synchronisiert ist. Stellen Sie sicher, dass die
    Verbindung stabil ist.

    3. KYC-Status prüfen: Überprüfen Sie Ihre E-Mails auf Mitteilungen von Hanseatica
    Versicherung bezüglich einer notwendigen Aktualisierung Ihrer Identitätsnachweise.


    Wenn diese Schritte nicht zum Erfolg führen, lösen wir das Problem gemeinsam in
    der Konversation:


    - Wir führen eine manuelle Identitätsprüfung durch, um Ihren Zugang zu validieren.

    - Wir setzen Ihren MFA-Token bei Bedarf zurück, sofern die Identität zweifelsfrei
    festgestellt wurde.

    - Bei technischen Systemfehlern leiten wir den Vorgang an unsere Fachabteilung
    für digitale Prozesse weiter. Sie erhalten eine Bestätigung über die Ticket-Eröffnung
    und eine geschätzte Zeit bis zur Lösung (in der Regel innerhalb von 24 Stunden
    während der Geschäftszeiten).


    Sobald der Zugriff wiederhergestellt ist, können Sie Ihre Vertragsdetails, wie
    die Deckungssumme von 20.000.000 € und die Selbstbeteiligung von 150 €, wieder
    einsehen. Für weitere Unterstützung bei anderen Fehlern sehen Sie bitte Privathaftpflicht
    Komfort — fehlgeschlagener oder ausstehender Vorgang.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 1076c836-a256-521c-b22c-9d4fdc96c9df
  title: Privathaftpflicht Komfort — Zugangsstufen
  body: 'Die Zuweisung zum Tarif Privathaftpflicht Komfort erfolgt basierend auf der
    Risikoanalyse und dem Bedarf des Kunden. Für Support-Mitarbeiter gilt folgende
    Matrix zur Bestimmung der Zugangseignung:


    | Bedingung / Profil | Ergebnis | Maßnahme |

    | :--- | :--- | :--- |

    | Privatperson mit Bedarf an maximalem Vermögensschutz | Geeignet für Komfort
    | Abschluss mit Deckung 20.000.000 € |

    | Unternehmer im deutschen Mittelstand (Privatausschnitt) | Sehr gut geeignet
    | Abschluss mit Deckung 20.000.000 € |

    | Wunsch nach minimaler Prämie bei geringer Deckung | Nicht geeignet | Verweis
    auf Basis-Tarif |

    | Ablehnung einer Selbstbeteiligung von 150 € | Bedingt geeignet | Aufklärung
    über risikobasierte Kostenfolge |

    | Fehlende KYC-Dokumentation | Nicht zugänglich | Einleitung des Validierungsprozesses
    |


    Alle Kunden der Privathaftpflicht Komfort akzeptieren die standardisierte Selbstbeteiligung
    von 150 €. Die Beispielprämie von 59 € gilt als Richtwert für Standardprofile;
    individuelle Risikozuschläge können anfallen.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: eligibility_matrix
