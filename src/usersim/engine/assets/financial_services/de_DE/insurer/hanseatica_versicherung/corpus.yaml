- id: 3b62e845-df5d-5328-b1f6-042e23d1ff70
  title: Kfz-Versicherung — fehlgeschlagener oder ausstehender Vorgang
  body: 'In bestimmten Fällen kann es vorkommen, dass ein Antrag auf eine Kfz-Versicherung
    nicht wie gewünscht abgeschlossen wird oder die Aktivierung verzögert ist. Hier
    finden Sie die häufigsten Ursachen und Lösungen.


    **Symptom: Der Antrag wurde nicht bestätigt oder die eVB-Nummer fehlt**


    **Mögliche Ursachen**

    1. **Fehlgeschlagene Identitätsprüfung**: Die Multi-Faktor-Authentifizierung oder
    der KYC-Prozess konnte nicht erfolgreich abgeschlossen werden.

    2. **Unvollständige Unterlagen**: Erforderliche Dokumente wie die Zulassungsbescheinigung
    oder der Führerschein wurden nicht oder in unleserlicher Form übermittelt.

    3. **Diskrepanz in den Fahrzeugdaten**: Die angegebenen Daten stimmen nicht mit
    den offiziellen Herstellerdaten oder dem Fahrzeugschein überein.


    **Lösungswege in aufsteigender Reihenfolge**

    - **Überprüfung der Dokumente**: Bitte prüfen Sie, ob alle hochgeladenen Dokumente
    vollständig, aktuell und gut lesbar sind. Falls Unterlagen fehlen, reichen Sie
    diese bitte erneut ein.

    - **Wiederholung der Authentifizierung**: Starten Sie den Prozess der Identitätsprüfung
    erneut. Stellen Sie sicher, dass Sie ein validiertes Gerät für die Multi-Faktor-Authentifizierung
    verwenden.

    - **Korrektur der Fahrzeugdaten**: Vergleichen Sie Ihre Angaben noch einmal präzise
    mit der Zulassungsbescheinigung Teil I. Übermitteln Sie uns die korrigierten Daten.


    **Eskalation**

    Sollten diese Schritte nicht zur Lösung führen, werden wir den Vorgang intern
    an die zuständige Fachabteilung übergeben. Wir prüfen dann manuell, ob eine regulatorische
    Hürde vorliegt. Sie erhalten innerhalb von drei Werktagen eine schriftliche Rückmeldung
    über den Status Ihres Antrags oder eine Aufforderung zur Nachreichung spezifischer
    Nachweise.


    Für eine Übersicht der benötigten Dokumente sehen Sie bitte unter Kfz-Versicherung
    — Voraussetzungen.'
  domain: insurance
  product_category: kfz
  document_type: troubleshooting
  source_authority: official
