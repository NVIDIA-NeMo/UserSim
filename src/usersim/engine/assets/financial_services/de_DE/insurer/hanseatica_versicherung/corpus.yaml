- id: 0e2ab403-cdd0-5091-b254-5a764ad0e055
  title: Kfz-Versicherung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden über
    die spezifischen Grenzen und Einschränkungen der Kfz-Versicherung transparent
    zu informieren. Eine klare Kommunikation dieser Punkte verhindert Missverständnisse
    im Leistungsfall.


    Die Kfz-Versicherung deckt weitreichende Risiken ab, jedoch gibt es definierte
    Ausschlusskriterien. Grundsätzlich sind Schäden, die durch Vorsatz oder grobe
    Fahrlässigkeit des Versicherungsnehmers entstehen, von der Leistung ausgeschlossen
    oder führen zu einer entsprechenden Kürzung der Entschädigung gemäß den gesetzlichen
    Vorgaben des Versicherungsvertragsgesetzes.


    Besonderes Augenmerk gilt der Selbstbeteiligung, die im Schadensfall vom Kunden
    getragen werden muss. Bei der Vollkaskodeckung ist eine Selbstbeteiligung von
    300 € vorgesehen. Dies bedeutet, dass die ersten 300 € eines erstattungsfähigen
    Schadens vom Versicherten selbst zu finanzieren sind. Bei der Teilkaskodeckung
    beträgt die Selbstbeteiligung 150 €. Diese Beträge dienen der Risikosteuerung
    und zur Stabilisierung der Prämienstrukturen.


    Sonderfälle treten häufig bei der Nutzung des Fahrzeugs für gewerbliche Zwecke
    auf. Wenn ein Fahrzeug, das als Privat-Kfz gemeldet wurde, für gewerbliche Transportdienstleistungen
    oder als Taxi genutzt wird, ist dies eine wesentliche Änderung des Risikos. Solche
    Nutzungen müssen zwingend vorab gemeldet und über eine entsprechende Tarifanpassung
    abgesichert werden, da ansonsten der Versicherungsschutz gefährdet ist.


    Zudem ist zu beachten, dass die gesetzliche Haftpflichtversicherung zwar obligatorisch
    ist, Kaskodeckungen jedoch optional sind. Ein Kunde, der lediglich eine Haftpflichtversicherung
    abgeschlossen hat, ist nicht gegen eigene Fahrzeugschäden geschützt. Bei Fragen
    zu den Kostenstrukturen verweisen Sie bitte auf Kfz-Versicherung — Kosten und
    Entgelte.'
  domain: insurance
  product_category: kfz
  document_type: product_sheet
  source_authority: official
