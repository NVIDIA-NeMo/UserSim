- id: 263d6e3c-49ac-5827-9fba-2400571403cf
  title: Hausratversicherung — abschließen und aktivieren
  body: 'Um Ihre Hausratversicherung bei der Hanseatica Versicherung abzuschließen
    und zu aktivieren, führen Sie bitte die folgenden Schritte aus. Dieser Prozess
    ist darauf ausgelegt, Ihnen einen schnellen und digitalen Zugang zu Ihrem Versicherungsschutz
    zu ermöglichen.


    **Voraussetzungen für den Abschluss:**

    Bevor Sie beginnen, halten Sie bitte die genaue Quadratmeterzahl Ihrer Wohnfläche
    sowie Informationen zu Ihren wichtigsten Wertsachen (z. B. hochwertige Fahrräder)
    bereit.


    **Schritte zur Aktivierung:**


    1. **Angabe der Objektdaten:** Nennen Sie uns die Größe Ihrer Wohnung in Quadratmetern
    und die Anschrift des zu versichernden Objekts. Wir berechnen daraufhin die Versicherungssumme
    basierend auf unserem Standardwert von 650 € pro Quadratmeter.


    2. **Wahl der Zusatzoptionen:** Bestätigen Sie, ob der standardmäßige Schutz gegen
    Fahrraddiebstahl bis zu einem Betrag von 1.000 € für Sie ausreichend ist oder
    ob Sie eine höhere Deckungssumme wünschen.


    3. **Identitätsprüfung (KYC):** Zur Sicherung Ihres Kontos und zur Erfüllung regulatorischer
    Anforderungen führen wir eine Identitätsprüfung durch. Sie werden aufgefordert,
    eine Multi-Faktor-Authentifizierung zu durchlaufen, um Ihre Identität eindeutig
    zu verifizieren.


    4. **Prämienzahlung und Bestätigung:** Nach der Prüfung der Daten erhalten Sie
    eine verbindliche Beitragsrechnung (zum Beispiel 96 € bei einer Fläche von 70
    m², sofern keine anderen Risikofaktoren vorliegen). Nach Zahlungseingang wird
    der Vertrag aktiviert.


    5. **Erhalt der Policen:** Wir senden Ihnen die Versicherungspolice sowie die
    detaillierten Versicherungsbedingungen digital in Ihr Kundenportal zu. Damit ist
    Ihr Versicherungsschutz aktiv.


    **Erfolgskontrolle:**

    Der Prozess ist erfolgreich abgeschlossen, wenn Sie in Ihrem Portal den Status
    „Aktiv“ für Ihre Hausratversicherung sehen und das Dokument „Versicherungsschein“
    herunterladen können. Sollten Probleme bei der Identitätsprüfung auftreten, finden
    Sie Unterstützung im Dokument Hausratversicherung — fehlgeschlagener oder ausstehender
    Vorgang.'
