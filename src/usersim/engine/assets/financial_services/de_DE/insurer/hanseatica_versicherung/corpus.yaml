- id: 777af246-6861-51a8-99cd-aac60cacdaa8
  title: Privathaftpflicht Komfort — abschließen und aktivieren
  body: 'Um den umfassenden Schutz der Privathaftpflicht Komfort zu aktivieren, führen
    wir Sie durch einen strukturierten Prozess, der hanseatische Sorgfalt mit digitalen
    Effizienzstandards verbindet. Bitte stellen Sie sicher, dass Sie Ihre persönlichen
    Daten sowie Informationen zu Ihrem aktuellen Wohnsitz und Ihrem beruflichen Status
    bereithalten.


    **Schritt 1: Übermittlung Ihrer Risikodaten**

    Teilen Sie uns Ihre persönlichen Daten und die Details zu Ihrem Risiko-Profil
    mit. Wir benötigen eine wahrheitsgemäße Angabe Ihrer Lebensumstände, da die Versicherung
    auf einer sorgfältigen vorvertraglichen Anzeigepflicht basiert. Wir bestätigen
    Ihnen den Erhalt der Daten unmittelbar.


    **Schritt 2: Festlegung der Vertragsparameter**

    Wir legen gemeinsam die Parameter Ihres Schutzes fest. Für die Privathaftpflicht
    Komfort gilt eine feste Deckungssumme von 20.000.000 € sowie eine vereinbarte
    Selbstbeteiligung von 150 €. Wir senden Ihnen eine Zusammenfassung dieser Konditionen
    zur Prüfung zu.


    **Schritt 3: Identitätsprüfung (KYC)**

    Vor der finalen Aktivierung führen wir eine zwingend erforderliche Identitätsprüfung
    mittels eines validierten KYC-Prozesses oder einer Multi-Faktor-Authentifizierung
    durch. Dies dient Ihrer Sicherheit und der Einhaltung regulatorischer Vorgaben.


    **Schritt 4: Vertragsschluss und Bestätigung**

    Nach erfolgreicher Prüfung unterzeichnen Sie den Vertrag digital. Wir senden Ihnen
    daraufhin Ihre Versicherungspolice sowie eine detaillierte Information über Ihr
    gesetzliches Widerrufsrecht (14 Tage allgemein) zu.


    **Schritt 5: Aktivierung und Zahlungsstart**

    Mit dem Eingang der ersten Prämie (beispielhaft 59 € jährlich) wird Ihr Schutz
    aktiv. Sie erhalten eine schriftliche Bestätigung über den Versicherungsbeginn.


    Sie wissen, dass der Vorgang erfolgreich abgeschlossen ist, wenn Sie die digitale
    Police in Ihren Unterlagen finden und die Bestätigung über den Versicherungsstart
    erhalten haben. Für weitere Details zur Vertragsgestaltung lesen Sie bitte Privathaftpflicht
    Komfort — Überblick.'
