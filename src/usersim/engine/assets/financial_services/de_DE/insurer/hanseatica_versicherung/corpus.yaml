- id: e350ecda-2837-52c3-959b-f966b4bea551
  title: Fondsgebundene Rentenversicherung — Schutz vor Betrug und nicht autorisierten
    Vorgängen
  body: 'Der Schutz Ihres Vermögens und Ihrer persönlichen Daten hat bei der Hanseatica
    Versicherung höchste Priorität. Bei einer Fondsgebundenen Rentenversicherung gibt
    es spezifische Betrugsmuster, vor denen wir Sie warnen möchten.


    Ein häufiges Szenario ist die Kontaktaufnahme durch Personen, die vorgeben, Vertreter
    unseres Hauses oder Finanzexperten zu sein. Diese versprechen oft ungewöhnlich
    hohe, garantierte Renditen oder fordern Sie auf, kurzfristig Fondswechsel vorzunehmen,
    um eine vermeintliche Marktchance zu nutzen. Bitte beachten Sie: Wir garantieren
    niemals eine spezifische Wertentwicklung, da die Erträge von der Marktentwicklung
    der gewählten Fonds abhängen.


    Um nicht autorisierte Vorgänge zu verhindern, setzen wir strikte Sicherheitsmaßnahmen
    ein. Vor jeder zustandsändernden Aktion — etwa einer Änderung der Bezugsrechte
    oder einer Kündigung Ihres Vertrages — ist eine eindeutige Identitätsprüfung mittels
    Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses zwingend erforderlich.
    Die Hanseatica Versicherung wird Sie niemals per E-Mail oder Telefon dazu auffordern,
    Passwörter, PINs oder MFA-Codes an einen Mitarbeiter zu übermitteln.


    Sollten Sie eine verdächtige Anfrage erhalten haben oder Unregelmäßigkeiten in
    Ihrem Depot feststellen, informieren Sie uns bitte unverzüglich. Betrugsversuche
    werden von uns konsequent dokumentiert und den zuständigen Behörden gemeldet.
    Handeln Sie schnell, um mögliche Verluste zu minimieren und die Integrität Ihres
    Vertrages zu gewährleisten.


    Für weitere Details zu den rechtlichen Rahmenbedingungen Ihres Vertrages verweisen
    wir auf die Fondsgebundene Rentenversicherung — Allgemeine Geschäftsbedingungen.'
