  institution_id: hanseatica_versicherung
- id: ef697089-ff63-5a33-afbf-f1ea79ae170a
  title: Berufsunfähigkeitsversicherung — Zugangsstufen
  body: 'Diese Matrix dient Support-Mitarbeitern zur ersten Einschätzung der Versicherungsfähigkeit
    eines Antragstellers für die Berufsunfähigkeitsversicherung.


    Bedingung: Alter und Berufsgruppe

    -> Ergebnis: Standardannahme möglich; Prämienorientierung am Beispielwert von
    68 €.


    Bedingung: Vorliegen von Vorerkrankungen (aus vorvertraglicher Anzeigepflicht)

    -> Ergebnis: Risikozuschlag auf die Prämie oder Ausschluss bestimmter Krankheiten
    aus dem Leistungsfall.


    Bedingung: Berufliche Tätigkeit mit extrem hohem Risiko

    -> Ergebnis: Individuelle Prüfung durch die Fachabteilung; mögliche Ablehnung
    oder stark erhöhte Prämien.


    Bedingung: Gewünschte Rentenhöhe im Verhältnis zum Einkommen (z.B. 1.500 €)

    -> Ergebnis: Prüfung der Angemessenheit zur Vermeidung von Überversicherung; Anpassung
    der Versicherungssumme erforderlich, falls die Grenze überschritten wird.


    Bedingung: Erfolgreich abgeschlossener KYC-Prozess / Identitätsprüfung

    -> Ergebnis: Freigabe zur finalen Vertragserstellung.'
