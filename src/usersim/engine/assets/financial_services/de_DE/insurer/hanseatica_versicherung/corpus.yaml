- id: 712125e9-6531-5ae5-9e8f-625ee999c4d3
  title: Fondsgebundene Rentenversicherung — etwas ändern
  body: 'Wenn Sie Anpassungen an Ihrem bestehenden Vertrag der Fondsgebundenen Rentenversicherung
    vornehmen möchten – beispielsweise eine Änderung Ihres monatlichen Beitrags –,
    folgen Sie bitte diesen Schritten. Wir führen diesen Prozess gemeinsam mit Ihnen
    in der aktuellen Konversation durch.


    **Voraussetzungen:**

    Um Änderungen vorzunehmen, benötigen Sie Ihren gültigen Personalausweis für die
    Identitätsprüfung und die Kenntnis über Ihren gewünschten neuen Beitrag.


    **Schritt 1: Mitteilung der gewünschten Änderung**

    Teilen Sie uns präzise mit, welche Änderung Sie vornehmen möchten. Wenn Sie den
    monatlichen Beitrag anpassen, nennen Sie uns den neuen Betrag. Bitte beachten
    Sie, dass der Mindestbeitrag pro Monat weiterhin bei 25 € liegen muss. Beträge
    unter dieser Grenze können nicht hinterlegt werden.


    **Schritt 2: Identitätsprüfung (Sicherheitssicherung)**

    Da es sich um eine zustandsändernde Aktion handelt, müssen wir Ihre Identität
    zweifelsfrei feststellen. Wir fordern Sie zu einer Multi-Faktor-Authentifizierung
    (MFA) auf oder führen einen validierten KYC-Prozess durch. Sie erhalten hierzu
    eine Aufforderung und bestätigen diese gemäß unseren Sicherheitsrichtlinien.


    **Schritt 3: Prüfung und Kalkulation**

    Wir prüfen die Änderung auf Konformität mit den Vertragsbedingungen. Dabei wird
    sichergestellt, dass die effektiven Kosten von 1,1 % pro Jahr weiterhin korrekt
    auf Basis der neuen Beitragshöhe angewendet werden können und keine regulatorischen
    Margen verletzt werden.


    **Schritt 4: Bestätigung und Umsetzung**

    Sobald die Prüfung erfolgreich abgeschlossen ist, setzen wir die Änderung in Ihrem
    Vertrag um. Sie erhalten von uns eine schriftliche Bestätigung über den neuen
    monatlichen Beitrag und das Datum, ab dem die Änderung wirksam wird.


    **Ergebnis:**

    Der Vorgang ist abgeschlossen, sobald Sie die Bestätigung erhalten haben. Ihr
    aktualisierter Zahlungsplan ist ab diesem Moment in Ihrem Kundenportal einsehbar.'
