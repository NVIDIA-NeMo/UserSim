  institution_id: hanseatica_versicherung
- id: fd143c3d-3357-548a-933e-2a8d20692817
  title: Hausratversicherung — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die vertragliche Beziehung
    zwischen der Hanseatica Versicherung und dem Versicherungsnehmer im Rahmen der
    Hausratversicherung. Der Vertrag basiert auf dem Prinzip der hanseatischen Zuverlässigkeit
    und Transparenz.


    Prämienzahlung und Kalkulation: Unsere Prämien sind risikobasiert und transparent
    kalkuliert. Sie dienen der Deckung administrativer Kosten sowie der Einhaltung
    regulatorischer Sicherheitsmargen, um eine dauerhafte Solvenz zu gewährleisten.
    Ein beispielhafter Jahresbeitrag kann 96 € betragen, wobei die endgültige Höhe
    von den individuellen Risikofaktoren abhängt.


    Leistungsgrundlagen: Die Versicherungssumme wird auf Basis einer Pauschale von
    650 € pro Quadratmeter Wohnfläche ermittelt. Der Schutz umfasst den Hausrat sowie
    spezialisierte Deckungen, wie etwa den Schutz gegen Fahrraddiebstahl bis zu einem
    Betrag von 1.000 €.


    Pflichten des Versicherungsnehmers: Der Versicherungsnehmer ist zur unverzüglichen
    Schadenmeldung verpflichtet. Ein schuldhaftes Zögern bei der Meldung eines Ereignisses
    kann die Leistungsprüfung beeinflussen. Zudem ist die Einhaltung der vorvertraglichen
    Anzeigepflicht essenziell für die Wirksamkeit des Schutzes.


    Änderungen und Kündigung: Anpassungen der Bedingungen erfolgen unter Einhaltung
    der gesetzlichen Fristen. Das allgemeine Widerrufsrecht beträgt 14 Tage ab Vertragsschluss.
    Ein Sonderkündigungsrecht besteht insbesondere nach einer Beitragserhöhung oder
    einem eingetretenen Schadenfall.


    Rechtsaufsicht und Streitbeilegung: Wir agieren unter strikter Aufsicht der BaFin
    und halten das Versicherungsvertragsgesetz ein. Sollte im Rahmen einer Beschwerde
    kein Konsens erzielt werden, verweisen wir aktiv auf den kostenlosen Versicherungsombudsmann.


    Für detaillierte Informationen zu den Kostenstrukturen sehen Sie bitte in der
    Hausratversicherung — Preis- und Leistungsverzeichnis nach.'
