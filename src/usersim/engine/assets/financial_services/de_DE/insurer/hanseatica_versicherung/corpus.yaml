  body: 'Dieses Verzeichnis dient als Referenz für die Konditionen der Privathaftpflicht
    Komfort. Alle Beträge sind in Euro angegeben.


    **Leistungswerte:**

    - Deckungssumme: 20.000.000 €

    - Selbstbeteiligung: 150 €


    **Kostenstruktur:**

    - Beispielhafter Jahresbeitrag (Single): 59 €


    **Hinweise zur Kalkulation:**

    Die Prämien sind risikobasiert und werden transparent kalkuliert. Die Gebühren
    dienen primär der Deckung der administrativen Kosten sowie der Sicherstellung
    regulatorischer Sicherheitsmargen gemäß den Vorgaben der BaFin. Eine dauerhafte
