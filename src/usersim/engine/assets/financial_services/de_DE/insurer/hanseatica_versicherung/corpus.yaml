- id: 00edb188-7957-569a-a5ae-fc2d64de1b93
  title: Berufsunfähigkeitsversicherung — Voraussetzungen und Abschluss
  body: 'Hier finden Sie die wichtigsten Informationen zu den Voraussetzungen für
    den Abschluss einer Berufsunfähigkeitsversicherung.


    **Welche Voraussetzungen müssen für den Abschluss erfüllt sein?**

    Die wichtigste Voraussetzung ist die wahrheitsgemäße Erfüllung der vorvertraglichen
    Anzeigepflicht. Sie müssen alle Fragen zu Ihrem Gesundheitszustand und Ihrem Beruf
    präzise beantworten. Zudem ist eine eindeutige Identitätsprüfung mittels KYC-Prozess
    oder Multi-Faktor-Authentifizierung zwingend erforderlich.


    **Wie funktioniert der Abschlussprozess?**

    Nach der Risikoprüfung erhalten Sie ein Angebot, das auf Ihren individuellen Faktoren
    basiert. Sobald Sie den Vertrag unterzeichnen, beginnt der Versicherungsschutz.


    **Gibt es eine Frist, um den Vertrag rückgängig zu machen?**

    Ja, wir kommunizieren Widerrufsrechte proaktiv: Sie haben ein allgemeines Widerrufsrecht
    von 14 Tagen. Da Berufsunfähigkeitsversicherungen oft eng mit Vorsorgeprodukten
    verknüpft sind, gilt bei entsprechenden Lebens- und Rentenversicherungen eine
    Frist von 30 Tagen.


    **Was passiert, wenn ich Angaben ändere?**

    Änderungen an den Vertragsdaten müssen uns mitgeteilt werden und können eine Neukalkulation
    der Prämie (z. B. Abweichung vom Beispielwert von 68 €) auslösen.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 6e55aa26-bea1-5247-ac1c-985281baee70
  title: Berufsunfähigkeitsversicherung — ein typisches Anliegen vollständig erledigen
  body: 'Ein typisches Anliegen ist die Anpassung der monatlichen Rentenhöhe, um die
    Absicherung an eine neue Lebenssituation anzupassen (z. B. Erhöhung der Rentensumme
    von 1.500 € auf einen höheren Betrag).


    **Schritte zur Erledigung:**


    1. Teilen Sie uns mit, auf welchen Betrag Sie Ihre monatliche Rentenzahlung anpassen
    möchten und aus welchem Grund (z. B. beruflicher Aufstieg oder gestiegene Lebenshaltungskosten).

    2. Da es sich um eine zustandsändernde Aktion handelt, führen wir eine Identitätsprüfung
    durch. Sie verifizieren sich mittels Multi-Faktor-Authentifizierung oder über
    einen validierten KYC-Prozess.

    3. Wir prüfen, ob für die Erhöhung der Rentensumme eine erneute Gesundheitsprüfung
    erforderlich ist. Falls ja, senden wir Ihnen die entsprechenden Fragen zu, die
    Sie wahrheitsgemäß beantworten.

    4. Wir berechnen die neue risikobasierte Prämie. Sie erhalten ein Angebot über
    den neuen monatlichen Beitrag (der sich vom ursprünglichen Beispielwert von 68
    € unterscheiden kann).

    5. Nach Ihrer Zustimmung passen wir den Vertrag an und senden Ihnen eine aktualisierte
    Versicherungsbestätigung zu.


    **Abschluss des Vorgangs**

    Der Vorgang ist vollständig erledigt, wenn Sie die neue Police mit der angepassten
    Rentensumme und dem aktualisierten Beitrag erhalten haben. Sie können den neuen
    Status anschließend jederzeit einsehen (siehe „Berufsunfähigkeitsversicherung
    — Status oder Verlauf einsehen“).'
