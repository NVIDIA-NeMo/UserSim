  institution_id: hanseatica_versicherung
- id: 1fd015d1-c74b-5c1b-afbc-a82b9a323602
  title: Privathaftpflicht Komfort — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Einrichtung der Privathaftpflicht Komfort zu begleiten. Ziel ist ein reibungsloser
    Onboarding-Prozess, der die hanseatischen Werte von Zuverlässigkeit und Transparenz
    widerspiegelt.


    Schritt 1: Bedarfsanalyse und Aufklärung

    Erklären Sie dem Kunden den Kern des Produkts. Heben Sie die außergewöhnlich hohe
    Deckungssumme von 20.000.000 € hervor, die insbesondere für den Schutz des Privatvermögens
    im Kontext des deutschen Mittelstands essenziell ist. Klären Sie den Kunden über
    die Selbstbeteiligung von 150 € auf, die bei jedem Schadenfall gilt.


    Schritt 2: Prüfung der Voraussetzungen

    Stellen Sie sicher, dass der Kunde die notwendigen Angaben zur Risikoprüfung macht.
    Weisen Sie auf die vorvertragliche Anzeigepflicht hin. Prüfen Sie, ob der Kunde
    bereits eine bestehende Versicherung hat und ob ein Wechsel gewünscht ist.


    Schritt 3: Kalkulation und Transparenz

    Nennen Sie dem Kunden die risikobasierte Prämienkalkulation. Als Orientierungshilfe
    kann der Beispielwert eines Jahresbeitrags von 59 € genutzt werden, wobei der
    endgültige Betrag von den individuellen Risikofaktoren abhängt.


    Schritt 4: Identitätsprüfung und Abschluss

    Leiten Sie den Kunden durch den KYC-Prozess. Eine eindeutige Identitätsprüfung
    ist zwingend erforderlich, bevor der Vertrag finalisiert wird. Bestätigen Sie
    dem Kunden nach erfolgreicher Verifizierung den Abschluss und die Aktivierung
    des Schutzes.


    Schritt 5: Dokumentenübergabe

    Stellen Sie sicher, dass der Kunde die Versicherungspolice sowie die Informationen
    zum Widerrufsrecht (14 Tage allgemein) erhält. Verweisen Sie für detaillierte
    Preisinformationen auf das Dokument Privathaftpflicht Komfort — Preis- und Leistungsverzeichnis.


    Nach Abschluss sollte der Kunde in die Lage versetzt werden, sein Konto über das
    Portal selbstständig zu verwalten.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 7ca35f48-919a-51b9-bd27-73a53af1d185
  title: 'Privathaftpflicht Komfort — Selbstbeteiligung: Erklärung'
  body: 'Häufig gestellte Fragen zur Selbstbeteiligung in der Privathaftpflicht Komfort:


    Frage: Was bedeutet die Selbstbeteiligung von 150 € konkret für mich im Schadenfall?

    Antwort: Die Selbstbeteiligung ist der Betrag, den Sie im Falle eines versicherten
    Schadens aus eigener Tasche tragen, bevor die Hanseatica Versicherung die Kosten
    übernimmt. Bei der Privathaftpflicht Komfort beträgt dieser Betrag exakt 150 €.
    Wenn ein Schaden beispielsweise 1.000 € beträgt, zahlen Sie 150 € und wir übernehmen
    die verbleibenden 850 € (bis zur maximalen Deckungssumme von 20.000.000 €).


    Frage: Kann ich die Selbstbeteiligung von 150 € während der Laufzeit ändern?

    Antwort: Eine Anpassung der Selbstbeteiligung ist grundsätzlich möglich und kann
    Einfluss auf die Höhe Ihres Jahresbeitrags (Beispiel: 59 €) haben. Bitte wenden
    Sie sich an unseren Service, um die Auswirkungen einer Änderung auf Ihre Prämien
    zu prüfen. Weitere Details finden Sie in Privathaftpflicht Komfort — Preis- und
    Leistungsverzeichnis.'
  domain: insurance
  product_category: privathaftpflicht
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: e5465c74-7df9-5cbb-abbf-8cf500239780
  title: Privathaftpflicht Komfort — etwas ändern
  body: 'Wenn Sie Änderungen an Ihrem bestehenden Vertrag der Privathaftpflicht Komfort
    vornehmen möchten – beispielsweise eine Adressänderung, die Aktualisierung Ihrer
    persönlichen Daten oder die Anpassung von Vertragsdetails – folgen Sie bitte diesen
    Schritten:


    1. Identitätsprüfung: Da wir höchste Sicherheitsstandards gemäß unseren Compliance-Richtlinien
    einhalten, beginnen wir jede Änderung mit einer Identitätsprüfung. Halten Sie
    Ihre MFA-Daten bereit. Wir bestätigen Ihnen nach erfolgreicher Prüfung Ihren Zugang
    zu den vertraulichen Vertragsdaten.


    2. Mitteilung der Änderung: Nennen Sie uns präzise, welche Information geändert
    werden soll (z. B. „Ich bin in eine neue Wohnung gezogen und möchte meine Adresse
    aktualisieren“ oder „Ich möchte prüfen, ob eine Änderung der Selbstbeteiligung
    von 150 € sinnvoll ist“).


    3. Prüfung und Kalkulation: Wir prüfen, ob die gewünschte Änderung Auswirkungen
    auf Ihr Risikoprofil hat. Sollte eine Anpassung der Vertragsparameter erfolgen,
    berechnen wir die neue risikobasierte Prämie transparent für Sie. Wir teilen Ihnen
    mit, ob sich Ihr Jahresbeitrag (der im Beispiel bei 59 € liegt) dadurch verändert.


    4. Bestätigung der Anpassung: Nach Ihrer Zustimmung zu den neuen Konditionen führen
    wir die Änderung im System durch. Wir bestätigen Ihnen den Vorgang unmittelbar
    in der Konversation.


    5. Dokumentation: Sie erhalten eine aktualisierte Vertragsbestätigung über Ihr
    Kundenportal oder per E-Mail, aus der die unveränderten Kernleistungen wie die
    Deckungssumme von 20.000.000 € hervorgehen.


    Sollten Sie Ihren gesamten Tarif wechseln wollen, beachten Sie bitte die Schritte
    in Privathaftpflicht Komfort — kündigen, schließen oder den Tarif wechseln.'
