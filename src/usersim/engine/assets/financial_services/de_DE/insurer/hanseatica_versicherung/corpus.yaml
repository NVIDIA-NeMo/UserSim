- id: 500670c7-dfcf-5d9e-b9d4-d62cbbe717e0
  title: Hausratversicherung — Preis- und Leistungsverzeichnis
  body: 'Dieses Verzeichnis dient als Grundlage für die Unterstützung von Kunden bei
    Fragen zur Preisgestaltung der Hausratversicherung. Alle Beträge sind in Euro
    angegeben.


    **Leistungswerte und Deckungssummen:**

    - **Kalkulationsbasis Versicherungssumme:** 650 € pro Quadratmeter Wohnfläche.

    - **Standarddeckung Fahrraddiebstahl:** bis zu 1.000 €.


    **Beispielhafte Kostenstruktur:**

    - **Beispiel-Jahresbeitrag (bei 70 m² Wohnfläche):** 96 €.


    **Hinweise zur Preisbildung:**

    - Die Prämien werden risikobasiert kalkuliert, um die dauerhafte Solvenz und höchste
    Leistungsqualität zu gewährleisten.

    - Gebühren innerhalb der Prämie dienen der Deckung administrativer Kosten sowie
    der Einhaltung regulatorischer Sicherheitsmargen gemäß den Vorgaben der BaFin.

    - Eine individuelle Anpassung der Prämie erfolgt basierend auf der vorvertraglichen
    Anzeigepflicht und den spezifischen Risikocharakteristika des versicherten Objekts.'
