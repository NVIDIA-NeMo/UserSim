- id: 74c9ea47-3d3c-535a-bf9e-141b58b478b4
  title: Fondsgebundene Rentenversicherung — Datenschutz und Datenverarbeitung
  body: 'Hanseatica Versicherung agiert unter der strikten Aufsicht der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin) und verpflichtet sich zur Einhaltung
    aller geltenden Datenschutzrichtlinien sowie des Versicherungsvertragsgesetzes.
    Die Verarbeitung personenbezogener Daten erfolgt transparent und ausschließlich
    zum Zweck der Vertragserfüllung und gesetzlichen Compliance.


    **Identitätsprüfung und KYC**

    Zum Schutz Ihres Vermögens und zur Verhinderung von Geldwäsche ist vor jeder zustandsändernden
    Aktion eine eindeutige Identitätsprüfung zwingend erforderlich. Wir setzen hierzu
    einen validierten KYC-Prozess (Know Your Customer) oder eine Multi-Faktor-Authentifizierung
    (MFA) ein. Die hierbei erhobenen Daten werden verschlüsselt gespeichert und nur
    für die Dauer der gesetzlichen Aufbewahrungsfrist vorgehalten.


    **Sicherung und Solvenz**

    Wir weisen darauf hin, dass die Fondsgebundene Rentenversicherung ein Rentenprodukt
    ist. In diesem Zusammenhang wird der Schutz durch den Sicherungsfonds Protektor
    ergänzend zur eigenen Solvenz von Hanseatica Versicherung genutzt, um die Ansprüche
    der Versicherten auch in Krisenzeiten abzusichern. Unsere Prämien sind risikobasiert
    kalkuliert, wobei die effektiven Kosten von 1,1 % pro Jahr der Sicherstellung
    einer dauerhaften Leistungsqualität dienen.


    **Widerrufs- und Kündigungsrechte**

    Wir kommunizieren Ihre Rechte proaktiv: Für Rentenprodukte wie die Fondsgebundene
    Rentenversicherung besteht ein gesetzliches Widerrufsrecht von 30 Tagen ab Vertragsschluss.
    Die Ausübung erfolgt schriftlich oder über das gesicherte Portal. Zudem gelten
    die allgemeinen Datenschutzrechte auf Auskunft, Berichtigung und Löschung Ihrer
    Daten, sofern diese nicht durch aufsichtsrechtliche Aufbewahrungspflichten der
    BaFin eingeschränkt sind.


    **Haftung und Beratung**

    Bitte beachten Sie, dass wir edukative Erläuterungen zur Produktwahl bieten, jedoch
    keine individuelle Steuer- oder Rechtsberatung leisten. Wir garantieren niemals
    eine spezifische Wertentwicklung der fondsgebundenen Anlagen, da diese den Marktschwankungen
    unterliegen. Die maximale Belastung durch Abschlusskosten ist durch die Obergrenze
    von 2,5 % der Beitragssumme begrenzt, um eine faire Kostenstruktur zu gewährleisten.'
