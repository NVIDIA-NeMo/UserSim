- id: 6b82d441-126d-5aa8-91a5-4895dc29d8ad
  title: Fondsgebundene Rentenversicherung — Risikohinweise
  body: 'Diese Risikohinweise dienen der transparenten Information über die Besonderheiten
    der Fondsgebundenen Rentenversicherung. Bitte lesen Sie diese sorgfältig durch,
    bevor Sie eine Entscheidung treffen.


    Kapitalmarktrisiko: Im Gegensatz zu klassischen Rentenprodukten ist die Wertentwicklung
    dieses Produkts an die Performance der gewählten Investmentfonds gebunden. Dies
    bedeutet, dass es keine Garantie für eine spezifische Wertentwicklung gibt. Schwankungen
    an den Finanzmärkten können dazu führen, dass der aktuelle Wert Ihres Vertrages
    unter die Summe der eingezahlten Beiträge sinkt.


    Kostenbelastung: Die Effektivkosten pro Jahr in Höhe von 1,1 % sowie die Abschlusskosten
    (bis maximal 2,5 %) wirken sich mindernd auf die Gesamtrendite aus. Eine sorgfältige
    Kalkulation der Kosten ist für den langfristigen Erfolg der Vorsorge unerlässlich.


    Regulatorischer Schutz: Wir agieren unter strikter Aufsicht der BaFin. Bei Rentenprodukten
    ergänzt der Schutz durch den Sicherungsfonds Protektor die Sicherheit Ihres Kapitals.


    Rechtliche Hinweise:

    - Das Widerrufsrecht für dieses Produkt beträgt 30 Tage ab Vertragsschluss.

    - Die Hanseatica Versicherung leistet ausdrücklich keine individuelle Steuer-
    oder Rechtsberatung. Wir empfehlen, einen qualifizierten Steuerberater oder Rechtsanwalt
    zu konsultieren, um die individuellen steuerlichen Auswirkungen der Rentenversicherung
    zu klären.

    - Wir halten uns an einen Standard der Sorgfalt, der die Eignung des Produkts
    für die allgemeine Zielgruppe priorisiert.


    Für detaillierte Bedingungen verweisen wir auf die Fondsgebundene Rentenversicherung
    — Allgemeine Geschäftsbedingungen.'
