  institution_id: hanseatica_versicherung
- id: c93b00f4-5eb0-5925-acf9-8da9e123ecf8
  title: Kfz-Versicherung — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihrer personenbezogenen Daten und Ihres Versicherungsvertrages
    hat bei der Hanseatica Versicherung höchste Priorität. In Zeiten zunehmender digitaler
    Risiken möchten wir Sie über die notwendigen Schutzmaßnahmen informieren, um den
    Zugriff auf Ihre Kfz-Versicherung abzusichern.


    Ein zentraler Pfeiler unseres Sicherheitssystems ist die Multi-Faktor-Authentifizierung
    (MFA). Vor jeder zustandsändernden Aktion – beispielsweise der Änderung Ihrer
    Bankverbindung oder der Anpassung Ihres Tarifs – ist eine eindeutige Identitätsprüfung
    zwingend erforderlich. Wir fordern Sie dazu auf, MFA konsequent zu nutzen und
    niemals Ihre Sicherheitscodes an Dritte weiterzugeben.


    Bitte seien Sie wachsam gegenüber folgenden Betrugsmustern:

    - Wir werden Sie niemals per E-Mail oder SMS auffordern, Ihr Passwort oder Ihre
    Zugangsdaten auf einer externen Webseite einzugeben.

    - Hanseatica Versicherung fragt keine vertraulichen PINs oder TANs über ungesicherte
    Kommunikationskanäle ab.

    - Seien Sie skeptisch bei unerwarteten Mitteilungen, die eine sofortige Handlung
    unter Androhung von Versicherungsausschluss fordern.


    Sollten Sie eine verdächtige Aktivität bemerken oder den Verdacht haben, dass
    Ihre Zugangsdaten kompromittiert wurden, informieren Sie uns bitte unverzüglich.
    Eine Meldung innerhalb von 24 Stunden nach Entdeckung des Vorfalls ist entscheidend,
    um potenzielle Folgeschäden zu minimieren und die Haftung im Rahmen der regulatorischen
    Vorgaben zu klären. Betrugsversuche werden von uns konsequent dokumentiert und
    den zuständigen Behörden gemeldet.


    Wir empfehlen zudem, Ihre Kontaktdaten im Kundenportal regelmäßig zu überprüfen,
    damit wir Sie im Falle von Sicherheitswarnungen zeitnah erreichen können. Für
    weitere Informationen zum Schutz Ihrer Daten lesen Sie bitte auch Kfz-Versicherung
    — Datenschutz und Datenverarbeitung.'
  domain: insurance
  product_category: kfz
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 3fcdee68-b7d1-57e2-af67-932c4a2f72c1
  title: Kfz-Versicherung — Änderung der Bedingungen
  body: 'Die Hanseatica Versicherung behält sich das Recht vor, die Bedingungen der
    Kfz-Versicherung anzupassen, um eine dauerhafte Solvenz und die Einhaltung der
    regulatorischen Sicherheitsmargen der BaFin zu gewährleisten. Änderungen können
    insbesondere aus Anpassungen des Versicherungsvertragsgesetzes (VVG) oder einer
    Neukalkulation der risikobasierten Prämien resultieren.


    Im Falle einer Beitragsanpassung, wie beispielsweise bei einer Erhöhung der Beispielprämie
    über die 780 € hinaus, werden Sie schriftlich oder über das Kundenportal informiert.
    Gemäß den gesetzlichen Bestimmungen steht Ihnen in diesem Fall ein Sonderkündigungsrecht
    zu. Dieses ermöglicht Ihnen die außerordentliche Beendigung des Vertrages innerhalb
    einer festgesetzten Frist nach Bekanntgabe der Erhöhung.


    Für alle Neukunden gilt das gesetzliche Widerrufsrecht: Sie können Ihren Versicherungsvertrag
    innerhalb von 14 Tagen ohne Angabe von Gründen stornieren. Diese Frist beginnt
    mit dem Erhalt der Versicherungspolice und der entsprechenden Widerrufsbelehrung.


    Die Einhaltung der vorvertraglichen Anzeigepflicht ist eine wesentliche Bedingung
    für die Gültigkeit des Vertrages. Verstöße gegen diese Pflicht können zur Leistungsverweigerung
    oder zur Kündigung des Vertrages durch den Versicherer führen. Wir legen großen
    Wert auf Transparenz bei der Preisgestaltung; alle Gebühren dienen der Deckung
    administrativer Kosten und der Sicherung der Leistungsqualität.


    Sollten Sie die geänderten Bedingungen nicht akzeptieren, können Sie den Vertrag
    unter Einhaltung der regulären Kündigungsfristen (beachten Sie hierbei die Kündigungsoptionen
    bis zum 30. November) beenden. Bei Unstimmigkeiten über die Auslegung der Bedingungen
    verweisen wir aktiv auf den kostenlosen Versicherungsombudsmann.'
  domain: insurance
  product_category: kfz
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 085db9e7-657d-5b57-8357-82e2b17674b8
  title: Kfz-Versicherung — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der initialen Einrichtung ihrer Kfz-Versicherung zu unterstützen. Ziel ist ein
    strukturierter Prozess, der die hanseatische Zuverlässigkeit widerspiegelt.


    Schritt 1: Datenerfassung und Risikoanalyse

    Erfassen Sie alle fahrzeugspezifischen Daten sowie die persönlichen Informationen
    des Versicherungsnehmers. Dies umfasst die Fahrzeugidentifikationsnummer (FIN),
    die geschätzte jährliche Fahrleistung und die Nutzung des Fahrzeugs (privat oder
    geschäftlich). Stellen Sie sicher, dass die vorvertragliche Anzeigepflicht vollständig
    erfüllt ist.


    Schritt 2: Tarifwahl und Kostenklärung

    Erläutern Sie dem Kunden die verschiedenen Deckungsvarianten. Weisen Sie auf die
    risikobasierte Kalkulation hin. Als Beispiel kann eine Jahresprämie von 780 €
    genannt werden, wobei zu betonen ist, dass der endgültige Betrag von den individuellen
    Risikofaktoren abhängt. Klären Sie die gewählte Selbstbeteiligung: Für die Teilkasko
    beträgt diese 150 €, während sie für die Vollkasko bei 300 € liegt.


    Schritt 3: Identitätsprüfung (KYC)

    Bevor der Vertrag final erstellt wird, muss eine eindeutige Identitätsprüfung
    mittels eines validierten KYC-Prozesses oder einer Multi-Faktor-Authentifizierung
    erfolgen. Dies ist zwingend erforderlich, um den Zugriff auf vertrauliche Daten
    zu schützen und regulatorische Vorgaben zu erfüllen.


    Schritt 4: Ausstellung der eVB-Nummer

    Nach erfolgreichem Abschluss und Bestätigung der Zahlungsmodalitäten wird die
    elektronische Versicherungsbestätigung (eVB-Nummer) ausgestellt. Informieren Sie
    den Kunden, dass diese Nummer zwingend für die Zulassung des Fahrzeugs bei der
    Kfz-Zulassungsstelle erforderlich ist.


    Schritt 5: Dokumentenversand und Widerrufsbelehrung

    Übermitteln Sie die Police und die Informationsblätter. Weisen Sie den Kunden
    proaktiv auf das 14-tägige Widerrufsrecht hin. Der Prozess ist abgeschlossen,
    sobald der Kunde den Erhalt der Unterlagen bestätigt hat.'
  domain: insurance
  product_category: kfz
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 2d322ff5-970d-5abf-a192-2d7d5e2bf4cb
  title: 'Kfz-Versicherung — Selbstbeteiligung Teilkasko: Erklärung'
  body: 'Häufig gestellte Fragen zur Selbstbeteiligung in der Teilkaskoversicherung:


    Frage: Was bedeutet die Selbstbeteiligung bei der Teilkasko genau?

    Antwort: Die Selbstbeteiligung ist der Betrag, den Sie im Falle eines versicherten
    Schadensereignisses (z. B. Glasbruch oder Diebstahl) selbst tragen. Bei unserer
    Kfz-Versicherung ist die Selbstbeteiligung für die Teilkasko auf 150 € festgelegt.
    Das bedeutet, dass Hanseatica Versicherung die Reparaturkosten übernimmt, nachdem
    die ersten 150 € durch Sie gedeckt wurden.


    Frage: Warum gibt es eine Selbstbeteiligung?

    Antwort: Die Selbstbeteiligung dient dazu, die Prämien für alle Kunden stabil
    und fair zu halten, indem Kleinschäden, deren Bearbeitung die administrativen
    Kosten übersteigen würde, vom Versicherungsnehmer getragen werden. Dies trägt
    zu unserer dauerhaften Solvenz bei.


    Für einen detaillierten Überblick über alle Kostenstrukturen besuchen Sie bitte
    Kfz-Versicherung — Preis- und Leistungsverzeichnis.'
  domain: insurance
  product_category: kfz
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 9a36b710-038a-5ab5-b039-0de827e97e0f
  title: Kfz-Versicherung — etwas ändern
  body: 'Wenn Sie Änderungen an Ihrem bestehenden Vertrag vornehmen möchten – beispielsweise
    eine Adressänderung, die Meldung eines neuen Fahrzeugs oder die Anpassung Ihrer
    jährlichen Fahrleistung – folgen Sie bitte diesem Prozess:


    1. Mitteilung der Änderungswünsche

    Teilen Sie uns die gewünschten Änderungen präzise mit. Im Falle eines Fahrzeugwechsels
    übermitteln Sie uns bitte die neuen Fahrzeugpapiere sowie die neue Fahrzeugidentifikationsnummer
    (FIN).


    2. Identitätsprüfung

    Um Ihre Daten zu schützen, führen wir eine Identitätsprüfung durch. Dies erfolgt
    über eine Multi-Faktor-Authentifizierung oder einen validierten KYC-Prozess. Erst
    nach erfolgreicher Verifizierung können wir zustandsändernde Aktionen in Ihrem
    Vertrag vornehmen.


    3. Prüfung und Neukalkulation

    Wir prüfen die Auswirkungen der Änderung auf Ihr Risikoprofil. Da unsere Prämien
    risikobasiert kalkuliert sind, kann eine Änderung (z. B. eine höhere Fahrleistung)
    zu einer Anpassung der Jahresprämie führen. Wir teilen Ihnen den neuen Betrag
    transparent mit, bevor die Änderung final wirksam wird.


    4. Bestätigung und Dokumentation

    Nachdem Sie der Anpassung zugestimmt haben, führen wir die Änderung in Ihrem Vertrag
    durch. Sie erhalten eine schriftliche Bestätigung oder eine aktualisierte Police
    über das Kundenportal oder per E-Mail.


    5. Kontrolle der Unterlagen

    Überprüfen Sie die aktualisierten Dokumente auf Richtigkeit. Sollten Sie Fragen
    zur neuen Beitragsberechnung haben, stehen wir Ihnen während der regulären Geschäftszeiten
    (MEZ) gerne telefonisch oder per E-Mail zur Verfügung.'
  domain: insurance
  product_category: kfz
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 209e9ae0-c900-5dba-b53c-d8e731ca412f
  title: Kfz-Versicherung — Probleme mit Zugang oder Login
  body: 'Sollten Sie Schwierigkeiten beim Zugriff auf Ihr Kundenkonto oder Probleme
    beim Login in das Portal der Hanseatica Versicherung haben, prüfen Sie bitte die
    folgenden Punkte in der angegebenen Reihenfolge:


    Symptom: Die Fehlermeldung ''Zugangsdaten ungültig'' erscheint.

    Ursache: Meist liegt ein Tippfehler im Benutzernamen oder Passwort vor, oder das
    Konto wurde aufgrund von Inaktivität vorübergehend gesperrt.

    Lösung: Überprüfen Sie die Groß- und Kleinschreibung. Nutzen Sie die Funktion
    ''Passwort vergessen'', um Ihren Zugang sicher zurückzusetzen. Beachten Sie, dass
    hierfür erneut eine Identitätsprüfung erforderlich ist.


    Symptom: Der Multi-Faktor-Authentifizierungscode (MFA) wird nicht zugestellt.

    Ursache: Verzögerungen im Mobilfunknetz, eine falsch hinterlegte Telefonnummer
    oder ein voller E-Mail-Posteingang.

    Lösung: Warten Sie zwei Minuten und fordern Sie den Code erneut an. Prüfen Sie
    Ihren Spam-Ordner. Sollte die hinterlegte Nummer nicht mehr aktuell sein, ist
    eine manuelle Identitätsprüfung durch uns erforderlich.


    Symptom: Das Portal lädt nicht oder Funktionen sind gesperrt.

    Ursache: Veraltete Browser-Cookies oder eine nicht unterstützte Browserversion.

    Lösung: Leeren Sie den Cache Ihres Browsers oder versuchen Sie es mit einem anderen,
    aktuellen Webbrowser.


    Wenn diese Schritte keine Abhilfe schaffen, leiten wir Ihr Anliegen strukturiert
    über die zuständige Fachabteilung an unser Beschwerdemanagement weiter. Sie erhalten
    innerhalb von drei Werktagen eine Rückmeldung über den Status Ihrer Anfrage. Bitte
    halten Sie für die Bearbeitung Ihre Versicherungsnummer bereit.'
  domain: insurance
  product_category: kfz
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 9a3ccc78-56dc-5d1d-baa4-2473c17d7323
  title: Kfz-Versicherung — Zugangsstufen
  body: 'Die folgende Matrix definiert die erforderlichen Identitätsprüfungen für
    verschiedene Interaktionen innerhalb der Kfz-Versicherung. Diese Stufen stellen
    sicher, dass vertrauliche Daten gemäß BaFin-Richtlinien geschützt bleiben.


    | Gewünschte Aktion | Erforderliche Zugangsstufe | Methode der Verifizierung |

    | :--- | :--- | :--- |

    | Einsicht in allgemeine Tarifinfos | Öffentlich | Keine Prüfung erforderlich
    |

    | Abfrage des aktuellen Versicherungsstatus | Standard | Einfacher Login / E-Mail-Verifizierung
    |

    | Änderung der Adresse oder Kontaktdaten | Verifiziert | Multi-Faktor-Authentifizierung
    (MFA) |

    | Änderung der Bankverbindung / Auszahlung | Hoch | Validierter KYC-Prozess /
    Ausweisprüfung |

    | Kündigung des Vertrages | Hoch | Validierter KYC-Prozess / MFA |

    | Anforderung einer neuen eVB-Nummer | Verifiziert | Multi-Faktor-Authentifizierung
    (MFA) |


    Support-Mitarbeiter müssen die Identität des Kunden strikt gemäß dieser Matrix
    prüfen, bevor eine Aktion durchgeführt wird.'
  domain: insurance
  product_category: kfz
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 78ab28d5-ca43-5c2e-b9e5-5aa36a9d5cf3
  title: Kfz-Versicherung — zwischen Tarifen wählen
  body: 'Bei der Wahl Ihres Versicherungsschutzes stehen Ihnen verschiedene Deckungsstufen
    zur Verfügung. Die Entscheidung hängt primär von Ihrem gewünschten Sicherheitsniveau
    und Ihrer Risikobereitschaft ab.


    Die gesetzlich vorgeschriebene Haftpflicht bildet die Basis und schützt Sie vor
    finanziellen Forderungen Dritter. Für einen umfassenderen Schutz empfehlen wir
    den Aufstieg zu einer Kaskodeckung:


    - Teilkasko: Schützt vor Schäden durch Diebstahl, Glasbruch oder Elementarschäden.
    Hier gilt eine Selbstbeteiligung von 150 €. Dieser Tarif eignet sich für Fahrzeugbesitzer,
    die einen soliden Basisschutz suchen, ohne die Kosten der Vollkasko zu tragen.

    - Vollkasko: Bietet den maximalen Schutz, inklusive selbstverschuldeter Unfälle
    und Vandalismus. Die Selbstbeteiligung liegt hier bei 300 €. Dieser Tarif ist
    ideal für Neuwagen oder hochwertige Fahrzeuge, bei denen ein Totalverlust finanziell
    nicht tragbar wäre.


    Ein beispielhafter Jahresbeitrag von 780 € verdeutlicht die transparente Kalkulation,
    wobei dieser Betrag je nach gewähltem Tarif und individuellem Risiko variiert.
    Während die Teilkasko kostengünstiger in der Prämie ist, bietet die Vollkasko
    die höchste Absicherung Ihres Kapitals. Entscheiden Sie basierend auf dem Fahrzeugwert
    und Ihrer persönlichen Präferenz für Sicherheit.'
  domain: insurance
  product_category: kfz
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 10a4441a-2dcb-5170-ad67-dda57aaa2452
  title: Kfz-Versicherung — Datenschutz und Datenverarbeitung
  body: 'Die Hanseatica Versicherung verarbeitet personenbezogene Daten im Rahmen
    der Kfz-Versicherung strikt nach den Vorgaben der Datenschutz-Grundverordnung
    (DSGVO) und unter der Aufsicht der BaFin. Die Erhebung Ihrer Daten ist notwendig,
    um die risikobasierte Kalkulation Ihrer Prämien vorzunehmen und die vertraglich
    zugesicherten Leistungen zu erbringen.


    Wir verarbeiten insbesondere Daten zu Ihrer Person, Ihrem Fahrzeug sowie Ihren
    bisherigen Schadenverläufen. Diese Informationen fließen in die Berechnung Ihres
    individuellen Beitrags ein, um eine faire Preisgestaltung und die langfristige
    Solvenz unseres Unternehmens zu gewährleisten. Eine Weitergabe Ihrer Daten an
    Dritte erfolgt nur dann, wenn dies zur Schadensregulierung zwingend erforderlich
    ist oder eine gesetzliche Verpflichtung besteht.


    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    entgegenstehen. Beachten Sie, dass für den Zugriff auf diese vertraulichen Informationen
    eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung oder
    eines validierten KYC-Prozesses zwingend erforderlich ist.


    Wir weisen darauf hin, dass wir im Falle von Betrugsversuchen zur Dokumentation
    und Meldung an die zuständigen Behörden verpflichtet sind. Dies dient dem Schutz
    der gesamten Versichertengemeinschaft.


    Im Sinne der Transparenz erinnern wir Sie an Ihre gesetzlichen Rechte: Neuverträge
    können innerhalb von 14 Tagen widerrufen werden. Wir halten uns an einen Standard
    der Sorgfalt, der die Eignung unseres Produkts für die allgemeine Zielgruppe des
    deutschen Mittelstands priorisiert.'
