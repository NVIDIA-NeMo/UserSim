- id: d50e31a1-0f7c-540d-949a-b88c8b88b2b8
  title: Fondsgebundene Rentenversicherung — unerwartetes Entgelt oder unerwarteter
    Betrag
  body: 'In diesem Dokument werden Anhaltspunkte für Support-Mitarbeiter gegeben,
    wenn Kunden Abweichungen bei den abgebuchten Beiträgen oder den ausgewiesenen
    Depotwerten melden.


    Symptom: Der Kunde berichtet, dass ein höherer oder niedrigerer Betrag als die
    vereinbarten 25 € (Mindestbeitrag) eingezogen wurde oder dass die Wertentwicklung
    nicht den Erwartungen entspricht.


    Ursachenprüfung in dieser Reihenfolge:

    1. Beitragsprüfung: Überprüfen Sie im System, ob eine Beitragsänderung durch den
    Kunden beantragt wurde oder ob eine automatische Anpassung aufgrund von Tarifänderungen
    erfolgte.

    2. Kostenanalyse: Prüfen Sie, ob die laufenden Effektivkosten von 1,1 % p.a. korrekt
    verrechnet wurden. Bei Neuverträgen ist zu prüfen, ob die Abschlusskosten (bis
    maximal 2,5 %) bereits in die Berechnung eingegangen sind.

    3. Marktschwankungen: Gleichen Sie den aktuellen Net Asset Value (NAV) der gewählten
    Fonds mit dem Datum der Abrechnung ab, um marktbedingte Wertänderungen zu erklären.


    Lösungsweg:

    - Bei Fehlern in der Abbuchung: Leiten Sie eine Korrektur der Buchung ein und
    bestätigen Sie dem Kunden den korrigierten Betrag.

    - Bei Verständnisfragen zu den Kosten: Erläutern Sie transparent die Struktur
    der Effektivkosten und die Deckelung der Abschlusskosten.


    Eskalation:

    Wenn keine Einigung mit dem Kunden erzielt werden kann oder eine Fehlbuchnung
    systemseitig nicht sofort korrigierbar ist, wird der Fall strukturiert an die
    Fachabteilung und anschließend an das Beschwerdemanagement geleitet. Bei ausbleibendem
    Konsens verweisen wir den Kunden aktiv an den kostenlosen Versicherungsombudsmann.'
  domain: insurance
  product_category: fondsrente
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 6bb91cb0-9edc-571b-a8b4-9ef4fb9c4ab0
  title: Fondsgebundene Rentenversicherung — erforderliche Unterlagen
  body: 'Für den erfolgreichen Abschluss einer Fondsgebundenen Rentenversicherung
    benötigen wir von Ihnen folgende Unterlagen und Informationen. Bitte stellen Sie
    sicher, dass alle Dokumente aktuell und vollständig sind.


    | Dokument / Information | Zweck | Anforderung | Ergebnis bei Vorliegen |

    | :--- | :--- | :--- | :--- |

    | Gültiges Ausweisdokument | Identitätsnachweis (KYC) | Personalausweis oder Reisepass
    (beidseitig lesbar) | Identität validiert |

    | SEPA-Bankverbindung | Beitragszahlung | Kontoinhaber muss mit Versicherungsnehmer
    übereinstimmen | Zahlungsweg eingerichtet |

    | Risiko-Profil-Fragebogen | Anlageeignung | Vollständige Beantwortung der Fragen
    zur Risikotoleranz | Geeignete Fondsstrategie gewählt |

    | Nachweis des Mindestbeitrags | Finanzielle Prüfung | Bestätigung des monatlichen
    Beitrags von mindestens 25 € | Vertrag abgeschlossen |


    Fehlen eine dieser Komponenten, kann der Antrag nicht final bearbeitet werden.
    Die Identitätsprüfung ist gemäß unseren Sicherheitsrichtlinien zwingend erforderlich,
    bevor ein Vertrag aktiviert wird.'
