  institution_id: hanseatica_versicherung
- id: f14b35df-49e5-5329-b0ce-4cff18c9f5f2
  title: Berufsunfähigkeitsversicherung — abschließen und aktivieren
  body: 'Der Abschluss einer Berufsunfähigkeitsversicherung ist ein wichtiger Schritt
    zur langfristigen Existenzsicherung. Damit Ihr Schutz lückenlos und rechtssicher
    aktiviert wird, folgen Sie bitte diesem Prozess:


    1. Bereitstellung der Informationen: Nennen Sie uns Ihre genauen beruflichen Tätigkeiten,
    Ihr aktuelles Einkommen und Ihren Gesundheitszustand. Da die Absicherung auf einer
    sorgfältigen vorvertraglichen Anzeigepflicht basiert, ist eine vollständige Auskunft
    zwingend erforderlich.


    2. Risikoanalyse und Angebotserstellung: Wir prüfen Ihre Angaben und erstellen
    Ihnen ein individuell auf Ihr Profil zugeschnittenes Angebot. Hierbei wird die
    Prämie risikobasiert kalkuliert. Sie erhalten eine detaillierte Aufstellung der
    monatlichen Kosten (z. B. im Bereich von 68 €) und der daraus resultierenden monatlichen
    Rentenzahlung (z. B. 1.500 €).


    3. Medizinische Prüfung (falls erforderlich): Je nach Risikoprofil bitten wir
    Sie, eine ärztliche Untersuchung durchzuführen oder aktuelle Gesundheitsberichte
    einzureichen. Wir bestätigen Ihnen den Erhalt und die Prüfung dieser Unterlagen.


    4. Vertragliche Annahme und Identitätsprüfung: Wenn Sie das Angebot annehmen,
    führen wir eine eindeutige Identitätsprüfung mittels eines validierten KYC-Prozesses
    oder Multi-Faktor-Authentifizierung durch. Dies ist eine zwingende Sicherheitsvorgabe
    vor jeder zustandsändernden Aktion.


    5. Aktivierung durch Zahlung: Der Versicherungsschutz beginnt mit der Zahlung
    der ersten Prämie und der Unterzeichnung des Vertrages. Wir senden Ihnen eine
    schriftliche Bestätigung über den Vertragsbeginn zu.


    Nach Abschluss haben Sie ein gesetzliches Widerrufsrecht von 14 Tagen, um den
    Vertrag ohne Angabe von Gründen zu stornieren. Informationen dazu finden Sie auch
    in der Berufsunfähigkeitsversicherung — rechtliche Hinweise.'
  domain: insurance
  product_category: berufsunfaehigkeit
  document_type: how_to_guide
  source_authority: official
