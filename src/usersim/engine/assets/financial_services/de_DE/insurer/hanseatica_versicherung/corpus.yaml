- id: 423113ca-44d8-5236-b899-38155656c347
  title: Fondsgebundene Rentenversicherung — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass ein Antrag auf Abschluss oder eine Änderung an Ihrer
    Fondsgebundenen Rentenversicherung abgelehnt oder gesperrt wird. Dies tritt häufig
    auf, wenn Kunden unser Produkt mit anderen Marktalternativen vergleichen und während
    des Onboarding-Prozesses auf Hürden stoßen.


    **Mögliche Symptome:**

    Sie erhalten eine Nachricht, dass Ihr Antrag „nicht finalisiert werden konnte“
    oder Ihr Zugang zu bestimmten Vertragsfunktionen temporär gesperrt ist.


    **Häufige Ursachen:**

    1. Fehlgeschlagene Identitätsprüfung: Ein zustandsändernder Zugriff oder der Abschluss
    eines Vertrages erfordert zwingend eine Multi-Faktor-Authentifizierung oder einen
    validierten KYC-Prozess. Wenn die Dokumente unleserlich oder nicht aktuell waren,
    wird der Vorgang gesperrt.

    2. Unterschreitung des Mindestbeitrags: Ein Antrag wird automatisch abgelehnt,
    wenn der angegebene monatliche Beitrag unter dem erforderlichen Mindestbeitrag
    von 25 € liegt.

    3. Unvollständige Risikoaufklärung: Die Bestätigung, dass Sie die Effektivkosten
    von 1,1 % und die Abschlusskosten von bis zu 2,5 % zur Kenntnis genommen haben,
    fehlt.


    **Lösungsschritte:**

    - Überprüfen Sie, ob Ihr gewählter Monatsbeitrag mindestens 25 € beträgt.

    - Stellen Sie sicher, dass alle für den KYC-Prozess hinterlegten Dokumente gültig
    und vollständig sind.

    - Bestätigen Sie uns schriftlich die Kenntnisnahme der Kostenstruktur und der
    Tatsache, dass keine spezifische Wertentwicklung garantiert wird.


    **Eskalation:**

    Falls der Vorgang trotz Korrektur gesperrt bleibt, leiten wir die Angelegenheit
    strukturiert über die Fachabteilung an unser Beschwerdemanagement weiter. Sie
    erhalten innerhalb der regulären Geschäftszeiten eine Rückmeldung über den Status.
    Sollte kein Konsens erzielt werden, verweisen wir Sie aktiv an den kostenlosen
    Versicherungsombudsmann.'
  domain: insurance
  product_category: fondsrente
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 7bbbe92d-ee94-567d-b030-1c6bee011df4
  title: Fondsgebundene Rentenversicherung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Ein Wechsel zu oder ein Upgrade innerhalb der Fondsgebundenen Rentenversicherung
    ist dann sinnvoll, wenn die Risikobereitschaft des Kunden steigt oder die langfristige
    Renditechance gegenüber einer klassischen Rentenversicherung priorisiert wird.


    Vergleichspunkte für die Beratung:

    - Kostenstruktur: Mit Effektivkosten von 1,1 % und einer Obergrenze der Abschlusskosten
    von 2,5 % positioniert sich das Produkt wettbewerbsfähig. Ein Upgrade lohnt sich,
    wenn die bisherige Lösung höhere Verwaltungskosten aufweist.

    - Beitragsflexibilität: Der Mindestbeitrag von 25 € erlaubt einen niederschwelligen
    Einstieg, während Upgrades durch Beitragserhöhungen die Dynamik des Vermögensaufbaus
    steigern.

    - Risiko-Rendite-Profil: Im Gegensatz zu klassischen Produkten gibt es hier keine
    Garantiezinsen, dafür aber die Partizipation an den Kapitalmärkten.


    Empfehlung:

    Das Produkt eignet sich für Kunden des Mittelstands, die eine transparente, risikobasierte
    Absicherung suchen und bereit sind, Marktschwankungen für potenziell höhere Erträge
    in Kauf zu nehmen. Wenn Sicherheit und garantierte Mindestbeträge im Vordergrund
    stehen, ist ein Verbleib in einem klassischen Produkt vorzuziehen.'
  domain: insurance
  product_category: fondsrente
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 5bfa3036-5cdf-56d5-803d-49bbc4140658
  title: Fondsgebundene Rentenversicherung — Vergleich mit Alternativen und wann es
    nicht passt
  body: 'Bei der Entscheidung für eine Altersvorsorge ist es wichtig, die Fondsgebundene
    Rentenversicherung gegen Alternativen abzuwägen. Dieses Produkt kombiniert den
    langfristigen Charakter einer Versicherung mit den Renditechancen des Kapitalmarkts.


    Vergleich mit Alternativen:

    - Gegenüber klassischen Rentenversicherungen bietet unser Produkt durch die Fondsanlage
    eine höhere Chance auf Vermögenszuwachs, allerdings ohne die Garantie einer spezifischen
    Wertentwicklung. Während klassische Produkte oft durch hohe Garantien weniger
    flexibel sind, profitieren Sie hier von transparenten Effektivkosten von 1,1 %.

    - Im Vergleich zu einem privaten ETF-Depot bietet die Versicherung den rechtlichen
    Rahmen eines Versicherungsvertrages, einschließlich des Schutzes durch den Sicherungsfonds
    Protektor bei Rentenprodukten und einer strukturierten steuerlichen Behandlung
    in der Auszahlungsphase.

    - Zur Abgrenzung: Während die Fondsgebundene Rentenversicherung dem Vermögensaufbau
    dient, ist die Berufsunfähigkeitsversicherung (siehe Berufsunfähigkeitsversicherung
    — Überblick) eine existenzielle Absicherung gegen den Einkommensverlust. Beide
    Produkte sollten sich ergänzen, nicht ersetzen.


    Wann das Produkt nicht passt:

    - Kurze Zeithorizonte: Aufgrund der Marktschwankungen und der Abschlusskosten
    von bis zu 2,5 % ist das Produkt nicht für kurzfristige Sparziele geeignet.

    - Geringe Risikotoleranz: Wenn Sie eine absolute Garantie für Ihren Kapitalerhalt
    benötigen, ist dieses Produkt aufgrund der fehlenden Wertentwicklungsgarantie
    nicht geeignet.

    - Sehr geringe Budgetkapazität: Da der Mindestbeitrag pro Monat bei 25 € liegt,
    ist das Produkt für Personen mit einem extrem limitierten monatlichen Sparbudget
    nicht realisierbar.


    Wir weisen darauf hin, dass wir keine individuelle Steuer- oder Rechtsberatung
    leisten und die Eignung des Produkts auf die allgemeine Zielgruppe des deutschen
    Mittelstands priorisieren.'
  domain: insurance
  product_category: fondsrente
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 90ee26b0-7be4-5b03-a799-56a54a9855ea
  title: Fondsgebundene Rentenversicherung — Voraussetzungen und Abschluss
  body: 'Hier erfahren Sie, welche Voraussetzungen für den Abschluss einer Fondsgebundenen
    Rentenversicherung bei uns gelten.


    **Welche finanziellen Voraussetzungen muss ich erfüllen?**

    Für den Abschluss und die Aufrechterhaltung des Vertrages ist ein Mindestbeitrag
    pro Monat von 25 € erforderlich.


    **Welche Dokumente werden für den Abschluss benötigt?**

    Wir führen eine zwingende Identitätsprüfung mittels eines validierten KYC-Prozesses
    oder Multi-Faktor-Authentifizierung durch, bevor der Vertrag finalisiert wird.


    **Gibt es eine Frist, innerhalb der ich den Vertrag rückgängig machen kann?**

    Ja, bei Lebens- und Rentenversicherungen haben Sie ein gesetzliches Widerrufsrecht
    von 30 Tagen ab Vertragsschluss. Innerhalb dieser Zeit können Sie den Vertrag
    ohne Angabe von Gründen stornieren.


    Weitere Details zu den Kosten finden Sie in der Dokumentation Fondsgebundene Rentenversicherung
    — Kosten und Entgelte.'
  domain: insurance
  product_category: fondsrente
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 361752c5-9ee3-5cdc-b50c-068953f570ab
  title: Fondsgebundene Rentenversicherung — ein typisches Anliegen vollständig erledigen
  body: 'Ein typisches Anliegen unserer Kunden ist die Anpassung des monatlichen Beitrags,
    um die Altersvorsorge an geänderte finanzielle Verhältnisse anzupassen. So führen
    Sie diesen Vorgang vollständig durch:


    1. Beitragsänderung mitteilen: Informieren Sie uns über den gewünschten neuen
    Monatsbeitrag. Beachten Sie dabei, dass der Betrag nicht unter den Mindestbeitrag
    von 25 € sinken darf.


    2. Sicherheitsprüfung: Da die Änderung des Beitrags eine zustandsändernde Aktion
    an Ihrem Vertrag darstellt, führen wir eine eindeutige Identitätsprüfung mittels
    Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses durch. Erst
    nach erfolgreicher Prüfung wird der Vorgang bearbeitet.


    3. Kalkulation und Bestätigung: Wir prüfen die Änderung im Kontext Ihrer bestehenden
    Kostenstruktur (Effektivkosten von 1,1 % p.a.). Sie erhalten von uns eine schriftliche
    Bestätigung, ab welchem Monat der neue Beitrag wirksam wird und wie sich dies
    auf die voraussichtliche Entwicklung Ihres Kapitals auswirkt.


    4. Abschluss und Dokumentation: Sobald die Änderung in unserem System hinterlegt
    ist, erhalten Sie eine aktualisierte Vertragsübersicht. Sie wissen, dass das Anliegen
    vollständig erledigt ist, wenn der neue Betrag in Ihrem Kundenportal unter den
    Vertragsdetails aufgeführt ist.


    Bitte beachten Sie, dass wir im Rahmen dieses Prozesses edukative Erläuterungen
    zur Produktwahl bieten, jedoch keine individuelle Steuer- oder Rechtsberatung
    leisten und niemals eine spezifische Wertentwicklung garantieren.'
  domain: insurance
  product_category: fondsrente
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 852dae00-979a-5214-b8eb-50dc333468eb
  title: Fondsgebundene Rentenversicherung — Abweichung von Ihren Unterlagen
  body: 'Wenn ein Kunde eine Abweichung zwischen den ihm vorliegenden Unterlagen und
    den systemseitigen Daten der Fondsgebundenen Rentenversicherung meldet, ist ein
    strukturierter Prüfprozess durch den Support-Agenten erforderlich.


    **Symptome aus Kundensicht:**

    Der Kunde gibt an, dass der ausgewiesene Fondswert nicht mit seinen eigenen Berechnungen
    übereinstimmt oder ein eingezahlter Beitrag (über den Mindestbeitrag von 25 €
    hinaus) nicht in der Historie erscheint.


    **Ursachenanalyse (Prüfschritte):**

    1. Prüfzeitpunkt der Fondswerte: Überprüfen Sie, ob der Kunde den Wert an einem
    anderen Stichtag als das System berechnet hat. Da fondsgebundene Produkte marktabhängig
    sind, führen unterschiedliche Zeitpunkte zu unterschiedlichen Werten.

    2. Kostenabzug prüfen: Verifizieren Sie, ob die Effektivkosten von 1,1 % korrekt
    auf das Fondsvolumen angewendet wurden. Prüfen Sie zudem, ob die Abschlusskosten
    (maximal 2,5 % der Beitragssumme) im ersten Jahr korrekt verrechnet wurden.

    3. Zahlungseingang validieren: Gleichen Sie den Kontoauszug des Kunden mit unseren
    Zahlungseingängen ab, insbesondere bei Sonderzahlungen.


    **Lösung und Behebung:**

    - Bei einem Rechenfehler: Korrigieren Sie den Eintrag nach Rücksprache mit der
    Fachabteilung und senden Sie dem Kunden eine korrigierte Aufstellung zu.

    - Bei einem Missverständnis: Erläutern Sie dem Kunden edukativ, wie die Effektivkosten
    von 1,1 % und die Marktschwankungen den Endwert beeinflussen.


    **Eskalation:**

    Sollte die Abweichung nicht durch die genannten Schritte geklärt werden können,
    muss der Fall strukturiert an die jeweilige Fachabteilung und bei Bedarf an das
    Beschwerdemanagement geleitet werden. Der Kunde wird über die Dauer der Prüfung
    informiert. Bei ausbleibendem Konsens wird aktiv auf den kostenlosen Versicherungsombudsmann
    verwiesen.'
  domain: insurance
  product_category: fondsrente
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 9f00384d-b433-59f4-9def-4426190c4589
  title: Entgelte und Kosten im Überblick
  body: 'Bei der Hanseatica Versicherung basiert unsere Preisgestaltung auf dem Prinzip
    der Transparenz und hanseatischen Zuverlässigkeit. Unsere Prämien sind risikobasiert
    kalkuliert, um eine dauerhafte Solvenz des Unternehmens und eine höchste Leistungsqualität
    für alle Versicherten zu gewährleisten.


    Die erhobenen Gebühren dienen primär der Deckung administrativer Kosten sowie
    der Einhaltung regulatorischer Sicherheitsmargen, wie sie für Versicherungsunternehmen
    vorgeschrieben sind. Während grundlegende Verwaltungsgebühren auf alle Verträge
    Anwendung finden, variieren die spezifischen Kostenstrukturen je nach Produktkategorie
    und individuellem Risikoprofil.


    Details zu den produktbezogenen Kosten, wie beispielsweise die Abschlusskosten
    bei Rentenprodukten oder spezifische Selbstbeteiligungen in der Sachversicherung,
    entnehmen Sie bitte den jeweiligen Preis- und Leistungsverzeichnissen der einzelnen
    Produkte, wie etwa der Fondsgebundene Rentenversicherung — Preis- und Leistungsverzeichnis
    oder der Privathaftpflicht Komfort — Preis- und Leistungsverzeichnis. Wir verzichten
    bewusst auf versteckte Kosten, um eine vertrauenswürdige Partnerschaft mit dem
    deutschen Mittelstand zu pflegen.'
  domain: insurance
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: d9359bc6-cc0e-535b-a358-04aee3a3da15
  title: Häufige Fragen
  body: 'Hier finden Sie Antworten auf allgemeine Fragen zu unseren Dienstleistungen
    und Prozessen.


    Wie kann ich die Hanseatica Versicherung kontaktieren?

    Sie erreichen unseren Service über das Kundenportal, per E-Mail oder telefonisch
    während der regulären Geschäftszeiten (MEZ). Unser Team unterstützt Sie gerne
    bei allen Anliegen zu Ihren Verträgen.


    Was passiert, wenn ich mit einer Entscheidung nicht einverstanden bin?

    Wir bearbeiten jede Beschwerde fair und zeitnah. Sollte kein Konsens erzielt werden,
    verweisen wir Sie aktiv an den kostenlosen Versicherungsombudsmann, um eine neutrale
    Lösung zu finden. Intern werden Eskalationen strukturiert über die jeweilige Fachabteilung
    an unser Beschwerdemanagement geleitet.


    Welche rechtlichen Rahmenbedingungen gelten für meine Verträge?

    Alle unsere Produkte unterliegen der Aufsicht der BaFin und dem Versicherungsvertragsgesetz.
    Detaillierte Informationen hierzu finden Sie im Dokument Aufsichtsrechtliche Hinweise:
    Versicherungen.


    Wie sicher sind meine Daten?

    Wir behandeln Ihre Daten gemäß den aktuellen Datenschutzrichtlinien und führen
    vor jeder zustandsändernden Aktion eine strikte Identitätsprüfung durch.'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: 72ee2f8d-1b2f-51de-8327-6a88e2f861a0
  title: 'Aufsichtsrechtliche Hinweise: Versicherungen'
  body: 'Die Hanseatica Versicherung agiert unter der strikten Aufsicht der Bundesanstalt
    für Finanzdienstleistungsaufsicht (BaFin). Wir verpflichten uns zur Einhaltung
    des Versicherungsvertragsgesetzes (VVG) und aller relevanten regulatorischen Anforderungen,
    um die Sicherheit und Stabilität Ihrer Absicherung zu garantieren.


    Ein besonderer Schutz kommt unseren Rentenprodukten zugute: Diese werden durch
    den Sicherungsfonds Protektor ergänzt, was eine zusätzliche Absicherung des Kapitals
    im Sinne des gesetzlichen Schutzes darstellt.


    Im Sinne der Transparenz weisen wir proaktiv auf Ihre Widerrufsrechte hin. Gemäß
    den gesetzlichen Bestimmungen haben Sie das Recht, einen Versicherungsvertrag
    ohne Angabe von Gründen zu widerrufen. Die Fristen hierfür gestalten sich wie
    folgt:

    - Allgemein gilt ein Widerrufsrecht von 14 Tagen nach Vertragsschluss.

    - Bei Lebens- und Rentenversicherungen beträgt dieses Recht 30 Tage.


    Die Ausübung des Widerrufs muss schriftlich oder in Textform gegenüber der Hanseatica
    Versicherung erfolgen. Wir informieren Sie transparent über alle Datenschutzrichtlinien,
    die die Verarbeitung Ihrer personenbezogenen Daten regeln. Die Einhaltung dieser
    Richtlinien ist integraler Bestandteil unseres Qualitätsversprechens an den deutschen
    Mittelstand.


    Bitte beachten Sie, dass wir im Rahmen unserer Beratung edukative Erläuterungen
    zur Produktwahl anbieten. Wir leisten jedoch ausdrücklich keine individuelle Steuer-
    oder Rechtsberatung. Zudem garantieren wir niemals eine spezifische Wertentwicklung
    für fondsgebundene Produkte, da diese den Marktschwankungen unterliegen. Unsere
    Sorgfaltspflicht priorisiert stets die Eignung des Produkts für die allgemeine
    Zielgruppe, um eine nachhaltige und seriöse Absicherung zu gewährleisten.'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: hanseatica_versicherung
- id: bc74e1e7-a31a-5419-b92a-0d7ac84145a3
  title: Wann issue_evb_number eingesetzt wird
  body: 'Die Ausstellung einer elektronischen Versicherungsbestätigung (eVB-Nummer)
    ist ein notwendiger Schritt für die Zulassung eines Fahrzeugs bei der zuständigen
    Kfz-Zulassungsstelle. Dieses Verfahren wird ausschließlich im Kontext der Kfz-Versicherung
    angewendet.


    Der Agent folgt bei der Bearbeitung dieser Anfrage zwingend diesen Schritten:


    1. Identitätsprüfung: Bevor eine eVB-Nummer ausgestellt wird, muss die Identität
    des Kunden mittels Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses
    eindeutig überprüft werden.

    2. Kontoidentifikation: Der Agent nutzt get_accounts, um die korrekte account_id
    anhand der vom Kunden genannten Daten (z. B. die letzten vier Ziffern der Vertragsnummer)
    zu ermitteln.

    3. Prüfung der Vertragsdetails: Es wird sichergestellt, dass für das betreffende
    Fahrzeug ein gültiger Vertrag besteht oder ein Neuabschluss erfolgt ist.

    4. Tool-Aufruf: Der Agent ruft das Werkzeug issue_evb_number auf. Hierbei werden
    die notwendigen Fahrzeug- und Vertragsdaten übermittelt.

    5. Mitteilung: Die vom System generierte eVB-Nummer wird dem Kunden im Chat oder
    per E-Mail mitgeteilt.


    Die eVB-Nummer dient als Nachweis gegenüber der Behörde, dass die gesetzlich vorgeschriebene
    Haftpflichtversicherung besteht. Ohne diesen Vorgang ist eine Fahrzeugzulassung
    nicht möglich. Sollte es Probleme bei der Generierung geben, ist die Fachabteilung
    Kfz-Versicherung zur Unterstützung hinzuzuziehen.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - issue_evb_number
  institution_id: hanseatica_versicherung
- id: df2fa068-a5a6-5e6c-8180-c3cd4140e933
  title: Werkzeugreferenz issue_evb_number
  body: 'Das Werkzeug issue_evb_number wird vom Agenten direkt aufgerufen, um eine
    elektronische Versicherungsbestätigung (eVB-Nummer) für die Fahrzeugzulassung
    zu generieren.


    Parameter:

    - account_id: Die eindeutige Kennung des Versicherungsvertrags (ermittelt via
    get_accounts).

    - vehicle_details: Die spezifischen Daten des Fahrzeugs, wie sie vom Kunden angegeben
    wurden (z. B. Fahrgestellnummer).


    Effekt:

    Das System erstellt eine gültige eVB-Nummer im Backend und gibt diese als Textstring
    zurück. Der Agent übermittelt diesen Wert anschließend an den Kunden.


    Der Agent führt diese Aktion ausschließlich nach einer erfolgreichen Identitätsprüfung
    durch. Es erfolgt keine Weiterleitung an externe Portale; die Nummer wird direkt
    im Gesprächsprozess bereitgestellt.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - issue_evb_number
  institution_id: hanseatica_versicherung
- id: 8fb2aaf5-abd5-5507-87df-e3f607a56156
  title: Wann pause_contributions eingesetzt wird
  body: 'Die Beitragsfreistellung oder das befristete Pausieren von Beiträgen ist
    eine Option für Kunden unserer Renten- und Berufsunfähigkeitsversicherungen, um
    in finanziell herausfordernden Zeiten die bestehende Absicherung ohne aktive Zuzahlungen
    zu erhalten.


    Der Agent führt den Prozess wie folgt durch:


    1. Identitätsprüfung: Eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    ist zwingend erforderlich, da es sich um eine zustandsändernde Aktion handelt.

    2. Kontoidentifikation: Mittels get_accounts wird die entsprechende account_id
    für die fondsgebundene Rentenversicherung oder die Berufsunfähigkeitsversicherung
    ermittelt.

    3. Bedarfsanalyse: Der Agent klärt, ob die Beiträge dauerhaft (Beitragsfreistellung)
    oder nur für einen befristeten Zeitraum pausiert werden sollen.

    4. Tool-Aufruf: Der Agent setzt das Werkzeug pause_contributions ein. Dabei werden
    die account_id sowie die gewünschte Art und Dauer der Pause definiert.

    5. Bestätigung: Dem Kunden wird die Änderung sowie die Auswirkungen auf die zukünftige
    Rentenhöhe oder den Versicherungsschutz erläutert.


    Es muss darauf hingewiesen werden, dass eine Beitragsfreistellung bei fondsgebundenen
    Produkten dazu führen kann, dass die Verwaltungskosten weiterhin vom vorhandenen
    Kapital abgezogen werden, was die Wertentwicklung beeinflussen kann.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pause_contributions
  institution_id: hanseatica_versicherung
- id: 343320ec-3896-564f-8352-f88b2967935a
  title: Werkzeugreferenz pause_contributions
  body: 'Das Werkzeug pause_contributions ermöglicht es dem Agenten, eine Rentenversicherung
    beitragsfrei zu stellen oder die Beitragszahlungen für einen definierten Zeitraum
    zu unterbrechen.


    Parameter:

    - account_id: Die eindeutige Kennung des betroffenen Vertrags (via get_accounts
    ermittelt).

    - pause_type: Definition, ob es sich um eine dauerhafte Beitragsfreistellung oder
    eine befristete Pause handelt.

    - end_date: Bei befristeten Pausen das Datum, an dem die Beitragszahlung automatisch
    wieder aufgenommen wird.


    Effekt:

    Der Beitragsstatus des Vertrags wird im System aktualisiert. Künftige Lastschriften
    werden gestoppt. Der Agent führt diesen Schritt direkt aus, nachdem die Identität
    des Kunden verifiziert wurde.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pause_contributions
  institution_id: hanseatica_versicherung
- id: 08da7b68-3d11-5d73-9113-a02776bae579
  title: Wann make_additional_payment eingesetzt wird
  body: 'Zuzahlungen dienen dem beschleunigten Vermögensaufbau innerhalb einer fondsgebundenen
    Rentenversicherung. Kunden können so zusätzliche Beträge investieren, um ihre
    Altersvorsorge zu optimieren.


    Der Agent steuert den Vorgang nach diesem Schema:


    1. Identitätsprüfung: Vor der Durchführung einer Zuzahlung ist eine Multi-Faktor-Authentifizierung
    oder ein validierter KYC-Prozess zwingend.

    2. Kontoidentifikation: Über get_accounts wird die account_id der Fondsgebundenen
    Rentenversicherung festgestellt.

    3. Betragserfassung: Der Kunde gibt den gewünschten Zuzahlungsbetrag in € an.

    4. Tool-Aufruf: Der Agent verwendet das Werkzeug make_additional_payment unter
    Angabe der account_id und des exakten Betrags.

    5. Abschluss: Der Agent bestätigt den Eingang des Auftrags und weist darauf hin,
    dass die Gutschrift entsprechend der Fondsbuchungszyklen erfolgt.


    Der Agent darf keine Garantie über die zukünftige Wertentwicklung der Zuzahlung
    geben, da die fondsgebundene Rentenversicherung Marktrisiken unterliegt.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_additional_payment
  institution_id: hanseatica_versicherung
- id: 89dbf8b1-66e2-5a13-a65f-ff3c6a922a1f
  title: Werkzeugreferenz make_additional_payment
  body: 'Das Werkzeug make_additional_payment wird genutzt, um eine einmalige Zuzahlung
    in eine fondsgebundene Rentenversicherung zu buchen.


    Parameter:

    - account_id: Die Kennung des Versicherungsvertrags (via get_accounts ermittelt).

    - amount: Der vom Kunden gewünschte Betrag in €, der zusätzlich investiert werden
    soll.


    Effekt:

    Das System verbucht den Betrag auf das entsprechende Fondskonto des Kunden. Der
    Agent führt diese Aktion direkt aus, sofern die Identität des Kunden bereits verifiziert
    wurde. Es erfolgt kein Verweis auf externe Überweisungsformulare; das Tool initiiert
    den internen Buchungsprozess.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_additional_payment
  institution_id: hanseatica_versicherung
- id: 86f7230e-7d6a-5544-a882-6ba62aebb464
  title: Wann switch_funds eingesetzt wird
  body: 'Ein Fondswechsel ermöglicht es Kunden der Fondsgebundenen Rentenversicherung,
    ihre Anlagestrategie anzupassen, indem sie bestehende Guthaben aus einem Fonds
    in einen anderen umschichten oder die Aufteilung künftiger Beiträge ändern.


    Der Agent folgt diesem Prozess:


    1. Identitätsprüfung: Da der Fondswechsel eine Änderung der Vermögensallokation
    darstellt, ist eine strikte Identitätsprüfung mittels MFA zwingend erforderlich.

    2. Kontoidentifikation: Die account_id wird über get_accounts aufgelöst.

    3. Strategieklärung: Der Agent erfasst die gewünschte neue Aufteilung der Beiträge
    oder den spezifischen Ziel-Fonds, in den gewechselt werden soll.

    4. Tool-Aufruf: Der Agent setzt das Werkzeug switch_funds ein. Hierbei werden
    die account_id sowie die neuen Fondszuweisungen (in Prozent oder absolute Beträge)
    übermittelt.

    5. Dokumentation: Dem Kunden wird bestätigt, dass der Wechsel beauftragt wurde.
    Der Agent weist darauf hin, dass die Umsetzung je nach Fondstyp einige Werktage
    in Anspruch nehmen kann.


    Der Agent bietet edukative Erläuterungen zur Funktionsweise des Fondswechsels
    an, darf jedoch keine individuelle Anlageberatung leisten oder spezifische Renditeversprechen
    machen.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - switch_funds
  institution_id: hanseatica_versicherung
- id: bb4575a8-32c1-5487-a263-f22dd2265502
  title: Werkzeugreferenz switch_funds
  body: "Das Werkzeug `switch_funds` ermöglicht es dem Agenten, eine Umschichtung\
    \ der Fondsanteile innerhalb einer Fondsgebundenen Rentenversicherung vorzunehmen\
    \ oder die Aufteilung zukünftiger Beitragszahlungen an die Investmentfonds zu\
    \ ändern. \n\nDer Agent führt diese Aktion direkt durch den Aufruf des Tools aus,\
    \ nachdem die Identität des Kunden erfolgreich überprüft wurde. \n\nParameter\
    \ des Tools:\n- `account_id`: Die eindeutige Kennung des Versicherungsvertrags,\
    \ welche zuvor über das Werkzeug `get_accounts` ermittelt wurde.\n- `target_funds`:\
    \ Eine Liste der Fonds, in die das Kapital umgeschichtet werden soll, sowie die\
    \ entsprechenden prozentualen Anteile.\n- `contribution_allocation`: Die gewünschte\
    \ neue prozentuale Verteilung für künftige Beiträge auf die verfügbaren Fondsoptionen.\n\
    \nDas Tool bewirkt eine unmittelbare Anpassung des Portfolios gemäß den Vorgaben\
    \ des Kunden und stellt sicher, dass die Summe der prozentualen Aufteilungen exakt\
    \ 100 % ergibt. Eine Bestätigung über die erfolgreiche Umschichtung wird nach\
    \ dem Tool-Aufruf generiert."
  domain: insurance
