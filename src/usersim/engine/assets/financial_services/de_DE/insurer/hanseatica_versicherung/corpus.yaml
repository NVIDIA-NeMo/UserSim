- id: fd49cecc-896d-5cd1-90be-047c289b6481
  title: Wann file_claim eingesetzt wird
  body: 'Die Meldung eines Schadensereignisses ist ein zentraler Prozess zur Sicherung
    der Leistungsansprüche unserer Kunden. Das Werkzeug `file_claim` wird eingesetzt,
    wenn ein Versicherungsnehmer einen Schaden im Rahmen der Privathaftpflicht Komfort,
    der Hausratversicherung oder der Kfz-Versicherung melden möchte. Es ist die vertragliche
    Pflicht des Kunden, eine unverzügliche Schadenmeldung vorzunehmen, um die reibungslose
    Bearbeitung durch unsere Fachabteilungen zu gewährleisten.


    Der Agent folgt bei der Abwicklung dieser Anfrage strikt den folgenden Schritten:


    1. Identitätsprüfung: Vor jeder zustandsändernden Aktion ist eine eindeutige Identitätsprüfung
    mittels Multi-Faktor-Authentifizierung oder eines validierten KYC-Prozesses zwingend
    erforderlich.

    2. Kontenermittlung: Der Agent verwendet `get_accounts`, um die korrekte `account_id`
    des betroffenen Versicherungsvertrags (Privathaftpflicht Komfort, Hausratversicherung
    oder Kfz-Versicherung) anhand der vom Kunden bereitgestellten Informationen zu
    identifizieren.

    3. Informationsaufnahme: Der Agent erfragt detailliert die Umstände des Schadensereignisses,
    insbesondere den Zeitpunkt, den Ort und eine präzise Beschreibung des Vorfalls
    sowie die entstandenen Schäden.

    4. Tool-Aufruf: Nach Erfassung aller notwendigen Daten ruft der Agent das Werkzeug
    `file_claim` auf. Hierbei werden die `account_id`, die Schadendate sowie die detaillierte
    Beschreibung übermittelt.

    5. Abschluss: Das Tool vergibt eine eindeutige Schadennummer, welche der Kunde
    zur weiteren Korrespondenz benötigt.


    Nach dem erfolgreichen Aufruf von `file_claim` wird der Kunde darüber informiert,
    dass die Fachabteilung den Fall prüfen wird. Sollte es im weiteren Verlauf zu
    Unstimmigkeiten kommen, wird der Kunde transparent über den Prozess informiert.
    Bei ausbleibendem Konsens weisen wir aktiv auf den kostenlosen Versicherungsombudsmann
    hin.


    Für detaillierte technische Informationen zum Tool siehe Werkzeugreferenz file_claim.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: hanseatica_versicherung
- id: 675c9ec5-f0cc-50fe-8925-dcdf8ab9f1b3
  title: Werkzeugreferenz file_claim
  body: 'Das Werkzeug `file_claim` dient der formalen Erfassung eines Schadensfalls
    für die Produkte Privathaftpflicht Komfort, Hausratversicherung und Kfz-Versicherung.
    Der Agent führt diese Aktion durch den direkten Aufruf des Tools im Dialog aus.


    Parameter des Tools:

    - `account_id`: Die über `get_accounts` validierte Kennung des Versicherungsvertrags.

    - `incident_date`: Das Datum des Schadensereignisses, wie es vom Kunden angegeben
    wurde.

    - `description`: Eine detaillierte Beschreibung des Vorfalls und der entstandenen
    Schäden.


    Das Tool bewirkt die Eröffnung einer Schadensakte im System und generiert eine
    eindeutige Schadennummer. Diese Nummer ist die Referenz für alle weiteren Schritte
    der Schadensregulierung. Der Agent teilt diese Nummer dem Kunden unmittelbar nach
    dem erfolgreichen Tool-Aufruf mit. Betrugsverdächtige Meldungen werden im Zuge
    dieses Prozesses konsequent dokumentiert und den zuständigen Behörden gemeldet.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: hanseatica_versicherung
- id: 990059e3-f3c1-508b-b6cf-2c0bcc5cd2d2
  title: Wann update_policy eingesetzt wird
  body: 'Im Laufe eines Versicherungsverhältnisses können sich die Risikoparameter
    oder die persönlichen Lebensumstände des Kunden ändern. Das Werkzeug `update_policy`
    wird eingesetzt, um diese Änderungen rechtssicher und zeitnah in den Verträgen
    zu hinterlegen. Dies ist insbesondere dann erforderlich, wenn die Grundlage der
    risikobasierten Prämienkalkulation beeinflusst wird.


    Typische Szenarien für den Einsatz von `update_policy` sind:

    - Umzüge: Änderung der Anschrift sowie Anpassung der Wohnfläche bei der Hausratversicherung.

    - Fahrzeugwechsel: Meldung eines neuen Fahrzeugs in der Kfz-Versicherung.

    - Fahrleistung: Anpassung der jährlichen Kilometerleistung in der Kfz-Versicherung.

    - Personenstand: Änderung von Familienstatus oder anderen relevanten persönlichen
    Daten.


    Der Agent führt den Prozess wie folgt durch:


    1. Identitätsprüfung: Zwingende Durchführung einer Multi-Faktor-Authentifizierung
    oder eines KYC-Prozesses vor dem Zugriff auf vertrauliche Daten.

    2. Kontoidentifikation: Aufruf von `get_accounts`, um die `account_id` des zu
    ändernden Vertrags zu ermitteln.

    3. Datenaufnahme: Der Agent erfragt die spezifischen neuen Werte (z. B. die neue
    Adresse oder die geänderte Fahrleistung).

    4. Tool-Ausführung: Der Agent ruft `update_policy` mit der `account_id`, dem Namen
    des zu ändernden Feldes und dem neuen Wert auf.

    5. Verifizierung: Der Agent bestätigt dem Kunden die Änderung und weist gegebenenfalls
    auf eine daraus resultierende Anpassung der Prämie hin, da unsere Prämien risikobasiert
    kalkuliert sind.


    Die korrekte Aktualisierung der Vertragsdaten ist essenziell, um die dauerhafte
    Solvenz und die höchste Leistungsqualität der Hanseatica Versicherung zu gewährleisten.
    Für technische Details siehe Werkzeugreferenz update_policy.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: hanseatica_versicherung
- id: 112ad430-0616-59b2-9d20-9863796170d9
  title: Werkzeugreferenz update_policy
  body: 'Das Werkzeug `update_policy` wird vom Agenten verwendet, um bestehende Vertragsdetails
    in einem Versicherungsvertrag zu ändern. Der Agent führt diese Aktion durch den
    direkten Tool-Aufruf aus, nachdem die Identität des Kunden verifiziert wurde.


    Parameter des Tools:

    - `account_id`: Die eindeutige Vertragsnummer, die über `get_accounts` ermittelt
    wurde.

    - `field_name`: Die Bezeichnung des zu aktualisierenden Datenfeldes (z. B. ''address'',
    ''annual_mileage'', ''living_area'').

    - `new_value`: Der neue Wert, der in das Feld eingetragen werden soll (z. B. die
    neue Straße und Hausnummer oder die neue Kilometerzahl).


    Das Tool aktualisiert den Datensatz des Versicherungsvertrags unmittelbar. Sollte
    die Änderung eine Neuberechnung der Prämie auslösen, wird dies im System vermerkt.
    Der Agent ist verpflichtet, den Kunden über mögliche finanzielle Auswirkungen
    der Änderung transparent zu informieren.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: hanseatica_versicherung
- id: 5b1c435d-4bf8-5273-a377-7f1fc3b8eb5d
  title: Wann update_beneficiary eingesetzt wird
  body: 'Die Festlegung oder Änderung des Bezugsrechts für den Todesfall ist ein kritischer
    Vorgang bei der Absicherung der Familie und Angehörigen. Das Werkzeug `update_beneficiary`
    wird eingesetzt, wenn Kunden das Bezugsrecht in einer Berufsunfähigkeitsversicherung
    oder einer Fondsgebundenen Rentenversicherung ändern möchten.


    Da es sich hierbei um den Zugriff auf hochvertrauliche Daten und eine zustandsändernde
    Aktion handelt, ist die Einhaltung der Sicherheitsprotokolle zwingend.


    Der Agent geht wie folgt vor:


    1. Identitätsprüfung: Durchführung einer Multi-Faktor-Authentifizierung oder eines
    validierten KYC-Prozesses.

    2. Kontoermittlung: Nutzung von `get_accounts`, um die `account_id` des betreffenden
    Renten- oder Berufsunfähigkeitsprodukts zu finden.

    3. Erfassung der Begünstigten-Daten: Der Agent muss die vollständigen Details
    der neuen begünstigten Person erfragen. Dazu gehören zwingend der vollständige
    Name, das Geburtsdatum sowie die aktuellen Kontaktdaten.

    4. Tool-Aufruf: Der Agent ruft `update_beneficiary` mit der `account_id` und den
    erfassten Personendaten des neuen Begünstigten auf.

    5. Bestätigung: Dem Kunden wird die Änderung des Bezugsrechts schriftlich oder
    systemisch bestätigt.


    Der Agent weist darauf hin, dass wir lediglich die administrative Umsetzung des
    Kundenwunsches durchführen und keine individuelle Rechts- oder Steuerberatung
    bezüglich der Wahl des Begünstigten leisten. Für technische Details siehe Werkzeugreferenz
    update_beneficiary.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: hanseatica_versicherung
- id: e225b172-1a00-5c80-943f-c0f8757b7511
  title: Werkzeugreferenz update_beneficiary
  body: 'Das Werkzeug `update_beneficiary` ermöglicht es dem Agenten, das Bezugsrecht
    für den Todesfall in einer Rentenversicherung oder Berufsunfähigkeitsversicherung
    zu ändern. Die Ausführung erfolgt direkt durch den Agenten im Dialog.


    Parameter des Tools:

    - `account_id`: Die über `get_accounts` validierte Kennung des Vertrags.

    - `beneficiary_full_name`: Der vollständige Name der Person, die als neuer Begünstigter
    eingetragen werden soll.

    - `beneficiary_dob`: Das Geburtsdatum des Begünstigten zur eindeutigen Identifizierung.

    - `beneficiary_contact`: Die aktuellen Kontaktdaten (Adresse, Telefon, E-Mail)
    des Begünstigten.


    Das Tool überschreibt das bestehende Bezugsrecht mit den neuen Daten. Der Agent
    muss sicherstellen, dass alle Parameter vollständig und korrekt vom Kunden übermittelt
    wurden, bevor das Tool aufgerufen wird, da fehlerhafte Angaben die spätere Auszahlung
    der Leistungen gefährden können.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: hanseatica_versicherung
- id: 3d5c81ac-2e71-5eed-9f8a-473d1ef450d4
  title: Wann open_account eingesetzt wird
  body: 'Der Abschluss eines neuen Versicherungsvertrags ist der Beginn einer vertrauensvollen
    Partnerschaft zwischen dem Kunden und der Hanseatica Versicherung. Das Werkzeug
    `open_account` wird eingesetzt, um einen neuen Vertrag für eines unserer Produkte
    (Privathaftpflicht Komfort, Hausratversicherung, Kfz-Versicherung, Berufsunfähigkeitsversicherung
    oder Fondsgebundene Rentenversicherung) zu eröffnen.


    Der Agent steuert den Prozess nach folgendem Schema:


    1. Identitätsprüfung & KYC: Bei Neukunden ist ein vollständiger KYC-Prozess (Know
    Your Customer) zur Identitätsprüfung zwingend erforderlich. Bestehende Kunden
    müssen sich via Multi-Faktor-Authentifizierung verifizieren.

    2. Bedarfsanalyse & Produktwahl: Der Agent bietet edukative Erläuterungen zur
    Produktwahl an. Er priorisiert die Eignung des Produkts für die allgemeine Zielgruppe
    und stellt sicher, dass der Kunde die wesentlichen Merkmale versteht (z. B. die
    Deckungssummen von 20.000.000 € bei der Privathaftpflicht Komfort).

    3. Datenerfassung: Der Agent sammelt alle für das spezifische Produkt erforderlichen
    Informationen (z. B. bei der Berufsunfähigkeitsversicherung die Angaben zur vorvertraglichen
    Anzeigepflicht oder bei der Kfz-Versicherung die Fahrzeugdaten).

    4. Tool-Ausführung: Der Agent ruft `open_account` mit der `product_id`, den persönlichen
    Daten des Kunden und den risikospezifischen Parametern auf.

    5. Aufklärung über Rechte: Der Agent informiert den Kunden proaktiv über das Widerrufsrecht
    (14 Tage allgemein, 30 Tage bei Lebens- und Rentenversicherungen) sowie über die
    Datenschutzrichtlinien.


    Nach dem Aufruf von `open_account` wird der Vertrag erstellt. Bei Kfz-Versicherungen
    folgt im nächsten Schritt die Ausstellung einer eVB-Nummer.


    Für technische Details siehe Werkzeugreferenz open_account.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: hanseatica_versicherung
- id: 5bf13ab0-1fde-5c4f-a561-54fc8a38b4f6
  title: Werkzeugreferenz open_account
  body: 'Das Werkzeug `open_account` wird verwendet, um einen neuen Versicherungsvertrag
    im System der Hanseatica Versicherung zu erstellen. Der Agent führt diesen Vorgang
    direkt durch den Tool-Aufruf aus.


    Parameter des Tools:

    - `product_id`: Die interne Kennung des gewünschten Produkts (z. B. `privathaftpflicht`,
    `hausrat`, `kfz`, `berufsunfaehigkeit`, `fondsrente`).

    - `customer_details`: Ein Datensatz mit dem vollständigen Namen, Geburtsdatum,
    Adresse und den Kontaktinformationen des Antragstellers.

    - `risk_parameters`: Die für die Prämienkalkulation notwendigen spezifischen Angaben
    (z. B. Wohnfläche bei Hausrat, Fahrzeugdaten bei Kfz oder Gesundheitsangaben bei
    BU).


    Das Tool erstellt den Vertrag auf Basis der risikobasierten Kalkulation und generiert
    eine neue `account_id`. Der Agent muss sicherstellen, dass alle regulatorischen
    Pflichtinformationen vor dem Tool-Aufruf mit dem Kunden besprochen wurden.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: hanseatica_versicherung
- id: 6909f2c5-49ab-5c49-ac2f-a7078b16fb82
  title: Wann close_account eingesetzt wird
  body: 'Die Beendigung eines Versicherungsvertrages erfolgt durch das Werkzeug `close_account`.
    Dieses wird eingesetzt, wenn ein Kunde seinen Vertrag kündigen möchte, sei es
    aufgrund eines Wechsels, eines Wegfalls des versicherten Interesses oder der Ausübung
    eines Sonderkündigungsrechts.


    Besondere Szenarien für den Einsatz von `close_account` sind:

    - Kfz-Versicherung: Die Kündigung muss bis zum 30. November erfolgen, um die Beendigung
    zum Jahresende zu bewirken. Ebenso ist dies bei einem Fahrzeugverkauf oder nach
    einer Beitragserhöhung möglich.

    - Sonderkündigungsrecht: Ausübung des Rechts nach einem eingetretenen Schadenfall
    oder einer Beitragsanpassung.

    - Widerrufsrecht: Beendigung innerhalb der gesetzlichen Fristen (14 Tage allgemein,
    30 Tage bei Lebens- und Rentenversicherungen).


    Der Agent führt den Prozess wie folgt durch:


    1. Identitätsprüfung: Durchführung einer Multi-Faktor-Authentifizierung oder eines
    KYC-Prozesses.

    2. Kontoidentifikation: Nutzung von `get_accounts`, um die `account_id` des zu
    kündigenden Vertrags zu ermitteln.

    3. Kündigungsprüfung: Der Agent prüft, ob die Kündigungsfrist (insbesondere der
    30. November bei Kfz) eingehalten wurde oder ein Sonderkündigungsrecht vorliegt.

    4. Tool-Aufruf: Der Agent ruft `close_account` mit der `account_id` und dem spezifischen
    Kündigungsgrund auf.

    5. Bestätigung: Dem Kunden wird das Datum des Vertragsendes und die Bestätigung
    der Kündigung mitgeteilt.


    Der Agent weist darauf hin, dass eine Kündigung den Versicherungsschutz zum genannten
    Zeitpunkt beendet und bei Produkten wie der Berufsunfähigkeitsversicherung zu
    einem Verlust der Absicherung führt. Für technische Details siehe Werkzeugreferenz
    close_account (sofern verfügbar).'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: hanseatica_versicherung
- id: 70bf90b4-1970-58ed-8648-bb798c5adacb
  title: Werkzeugreferenz close_account
  body: 'Das Werkzeug `close_account` wird verwendet, um einen bestehenden Versicherungsvertrag
    bei der Hanseatica Versicherung rechtmäßig zu kündigen und zu schließen. Diese
    Aktion ist irreversibel; einmal durchgeführte Kündigungen können nicht ohne einen
    neuen Vertragsabschluss rückgängig gemacht werden.


    Der Agent führt diese Aktion direkt aus, indem er das Werkzeug aufruft. Es ist
    zwingend erforderlich, dass vor dem Aufruf eine erfolgreiche Identitätsprüfung
    gemäß den Sicherheitsrichtlinien des Hauses erfolgt ist.


    **Parameter:**

    - **Vertragsnummer**: Die eindeutige Kennung des zu kündigenden Versicherungsvertrags.

    - **Kündigungsgrund**: Eine kurze Beschreibung des Grundes für die Vertragsbeendigung
    (z. B. Verkauf des Fahrzeugs, Wechsel zu einem anderen Anbieter oder Ausnutzung
    eines Sonderkündigungsrechts).

    - **Kündigungsdatum**: Das gewünschte Datum, zu dem der Vertrag enden soll, sofern
    dies innerhalb der vertraglichen Fristen liegt.


    Das Werkzeug bestätigt den erfolgreichen Eingang der Kündigung und gibt das offizielle
    Beendigungsdatum des Versicherungsschutzes zurück.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: hanseatica_versicherung
- id: b6c5f49a-83e0-547f-a74a-fbd1a96f19f6
  title: Wann get_accounts eingesetzt wird
  body: 'Das Werkzeug `get_accounts` dient dazu, eine vollständige Übersicht aller
    Versicherungsverträge abzurufen, die auf den Namen des Kunden bei der Hanseatica
    Versicherung geführt werden. Dies ist der notwendige erste Schritt, um die korrekte
    Vertragsnummer für alle weiteren zustandsändernden Aktionen zu ermitteln.


    Der Agent setzt dieses Werkzeug in folgenden Szenarien ein:

    1. Wenn der Kunde eine allgemeine Übersicht über seine bestehenden Absicherungen
    wünscht.

    2. Wenn der Kunde eine Änderung an einem Vertrag vornehmen möchte, aber nur die
    letzten vier Ziffern der Vertragsnummer oder eine allgemeine Produktbezeichnung
    nennt.

    3. Zur Verifizierung, welche Produkte (z. B. Privathaftpflicht Komfort oder Kfz-Versicherung)
    dem Kunden aktuell zugeordnet sind.


    **Verfahrensablauf für den Agenten:**

    1. Führen Sie eine eindeutige Identitätsprüfung mittels Multi-Faktor-Authentifizierung
    oder eines validierten KYC-Prozesses durch, um den Zugriff auf vertrauliche Vertragsdaten
    zu legitimieren.

    2. Rufen Sie das Werkzeug `get_accounts` auf, um die Liste aller aktiven und inaktiven
    Verträge des Kunden abzurufen.

    3. Gleichen Sie die Ergebnisse mit den Angaben des Kunden ab, um die spezifische
    Vertragsnummer für die weitere Bearbeitung zu identifizieren.

    4. Kommunizieren Sie die gefundenen Verträge professionell und transparent an
    den Kunden.


    Für detaillierte technische Informationen zum Aufruf siehe Werkzeugreferenz get_accounts.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: hanseatica_versicherung
- id: 9295eef0-24e5-5223-b952-e12ce6f19b99
  title: Werkzeugreferenz get_accounts
  body: 'Das Werkzeug `get_accounts` ist eine read-only Funktion, die dazu dient,
    alle mit der Identität des Kunden verknüpften Versicherungsverträge abzurufen.
    Es ermöglicht dem Agenten, eine präzise Liste der bestehenden Policen zu erhalten,
    ohne dass der Kunde jede Vertragsnummer auswendig wissen muss.


    Der Agent führt diese Aktion direkt durch den Aufruf des Werkzeugs aus. Da es
    sich um den Zugriff auf personenbezogene und vertrauliche Daten handelt, ist ein
    erfolgreicher Abschluss des Identitätsprüfungsverfahrens eine zwingende Voraussetzung.


    **Parameter:**

    Das Werkzeug benötigt keine zusätzlichen Parameter vom Kunden, da es die Daten
    basierend auf der bereits durch die Authentifizierung verifizierten Kundenidentität
    abruft.


    **Rückgabewerte:**

    Das Werkzeug gibt eine Liste von Objekten zurück, die jeweils die Vertragsnummer,
    die Produktbezeichnung (z. B. Hausratversicherung), den aktuellen Status des Vertrags
    sowie das Datum des letzten Updates enthalten.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: hanseatica_versicherung
- id: 2b14f64b-0eef-5653-8049-8aefb20206cf
  title: Wann update_contact_info eingesetzt wird
  body: 'Die Aktualisierung von Kontaktdaten ist essenziell, um die rechtzeitige Zustellung
    von wichtigen Dokumenten, wie z. B. Kündigungsbestätigungen oder Schadensmeldungen,
    zu gewährleisten. Das Werkzeug `update_contact_info` wird eingesetzt, wenn der
    Kunde Änderungen an seinen Stammdaten meldet.


    Typische Anwendungsfälle sind:

    - Umzug mit Änderung der Privatadresse.

    - Wechsel der primären E-Mail-Adresse für den digitalen Schriftverkehr.

    - Änderung der Telefonnummer für die Erreichbarkeit im Schadenfall.


    **Verfahrensablauf für den Agenten:**

    1. Verifizieren Sie die Identität des Kunden zwingend mittels Multi-Faktor-Authentifizierung
    oder KYC-Prozess, da die Änderung von Kontaktdaten eine zustandsändernde Aktion
    darstellt.

    2. Erfragen Sie die exakten neuen Daten (Straße, Hausnummer, PLZ, Ort, E-Mail
    oder Telefonnummer), die aktualisiert werden sollen.

    3. Rufen Sie das Werkzeug `update_contact_info` mit den vom Kunden bereitgestellten
    Informationen auf.

    4. Bestätigen Sie dem Kunden nach erfolgreichem Tool-Aufruf, dass die Daten in
    seinem Kundenkonto aktualisiert wurden.


    Informationen zur technischen Umsetzung finden Sie in der Werkzeugreferenz update_contact_info.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: hanseatica_versicherung
- id: 460775a5-0158-5adb-8c72-d558a70f5839
  title: Werkzeugreferenz update_contact_info
  body: 'Das Werkzeug `update_contact_info` wird verwendet, um die hinterlegten Kontaktinformationen
    eines Kunden in den Systemen der Hanseatica Versicherung zu ändern. Dies ist eine
    zustandsändernde Aktion, die eine vorherige Identitätsprüfung voraussetzt.


    Der Agent führt diese Änderung direkt durch den Aufruf des Werkzeugs aus und leitet
    den Kunden nicht an ein externes Portal weiter.


    **Parameter:**

    - **Vorname**: Der Vorname des Kunden (zur Validierung).

    - **Nachname**: Der Nachname des Kunden (zur Validierung).

    - **Neue Adresse**: Die vollständige neue Anschrift (Straße, Hausnummer, PLZ,
    Stadt).

    - **Neue E-Mail-Adresse**: Die aktualisierte E-Mail-Adresse für die Korrespondenz.

    - **Neue Telefonnummer**: Die aktualisierte Telefonnummer für den Kontakt.


    Das Werkzeug aktualisiert die entsprechenden Felder im Kundenprofil und gibt eine
    Bestätigung über die erfolgreiche Änderung zurück. Falls Datenfelder leer gelassen
    werden, bleiben die bisherigen Werte unverändert.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: hanseatica_versicherung
- id: d57da06f-4851-5257-b494-ce731a661286
  title: Wann get_statements eingesetzt wird
  body: 'Kunden fordern häufig Belege, jährliche Abrechnungen oder aktuelle Versicherungsscheine
    an. Das Werkzeug `get_statements` wird eingesetzt, um diese Dokumente digital
    abzurufen und dem Kunden den Zugriff darauf zu ermöglichen.


    Dies ist insbesondere relevant bei:

    - Anfragen zu steuerlichen Nachweisen für Rentenprodukte (z. B. Fondsgebundene
    Rentenversicherung).

    - Anforderung eines aktuellen Nachweises über den Versicherungsschutz für Behörden
    oder Vermieter.

    - Einsicht in die Historie der Beitragszahlungen.


    **Verfahrensablauf für den Agenten:**

    1. Führen Sie die obligatorische Identitätsprüfung durch, da Dokumente hochsensible
    personenbezogene Daten enthalten.

    2. Falls noch nicht geschehen, nutzen Sie `get_accounts`, um die relevante Vertragsnummer
    zu identifizieren.

    3. Rufen Sie das Werkzeug `get_statements` auf, um eine Liste der verfügbaren
    Dokumente für den spezifischen Vertrag oder den gesamten Kunden zu erhalten.

    4. Informieren Sie den Kunden über die verfügbaren Dokumente und stellen Sie diese
    gemäß dem Service-Modell (Kundenportal oder E-Mail) bereit.


    Die technische Signatur des Werkzeugs ist in der Werkzeugreferenz get_statements
    dokumentiert.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: hanseatica_versicherung
- id: 39348c70-f3af-56ef-b274-e748bbf144bc
  title: Werkzeugreferenz get_statements
  body: 'Das Werkzeug `get_statements` ist eine read-only Funktion, die dazu dient,
    eine Liste aller für einen Kunden oder einen spezifischen Vertrag verfügbaren
    Dokumente und Abrechnungen abzurufen.


    Der Agent ruft dieses Werkzeug direkt auf, nachdem die Identität des Kunden zweifelsfrei
    festgestellt wurde. Es ermöglicht den schnellen Zugriff auf Dokumente, ohne dass
    diese manuell aus einem Archiv gesucht werden müssen.


    **Parameter:**

    - **Vertragsnummer**: Die Nummer des Vertrags, für den Dokumente angefordert werden.
    Wenn dieses Feld leer bleibt, werden alle Dokumente über alle Verträge des Kunden
    hinweg aufgelistet.

    - **Zeitraum**: Ein optionaler Filter (Start- und Enddatum), um die Ergebnisse
    auf bestimmte Jahre oder Monate einzugrenzen.


    Das Werkzeug gibt eine Liste von Dokumentmetadaten zurück, einschließlich Dokumententyp,
    Ausstellungsdatum und einem Link zum entsprechenden Dokument im gesicherten Kundenportal
    der Hanseatica Versicherung.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: hanseatica_versicherung
- id: 8601525a-9e8b-559f-95f5-35580ac78f29
  title: Wann set_alerts eingesetzt wird
  body: 'Um die Transparenz und Zuverlässigkeit unserer Prozesse zu erhöhen, bietet
    die Hanseatica Versicherung die Möglichkeit, Benachrichtigungen für wichtige Ereignisse
    zu konfigurieren. Das Werkzeug `set_alerts` wird verwendet, um diese Alarme einzurichten
    oder zu ändern.


    Kunden nutzen diesen Service für:

    - Erinnerungen an anstehende Beitragszahlungen.

    - Benachrichtigungen über den Status eines gemeldeten Schadens.

    - Hinweise auf das Ende einer Vertragslaufzeit oder anstehende Kündigungsfristen.


    **Verfahrensablauf für den Agenten:**

    1. Verifizieren Sie die Identität des Kunden mittels Multi-Faktor-Authentifizierung,
    da die Änderung von Benachrichtigungseinstellungen eine zustandsändernde Aktion
    ist.

    2. Klären Sie mit dem Kunden, für welche Ereignisse er Benachrichtigungen wünscht
    und über welchen Kanal (E-Mail, SMS oder Portal-Benachrichtigung) diese erfolgen
    sollen.

    3. Rufen Sie das Werkzeug `set_alerts` mit den gewünschten Konfigurationen auf.

    4. Bestätigen Sie dem Kunden, dass die entsprechenden Alarme nun aktiv sind.


    Weitere Details finden Sie in der Werkzeugreferenz set_alerts.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: hanseatica_versicherung
- id: 953787ca-b6e5-5294-ba1f-c1597f3a3355
  title: Werkzeugreferenz set_alerts
  body: 'Das Werkzeug `set_alerts` dient dazu, die Benachrichtigungspräferenzen eines
    Kunden für verschiedene Ereignisse innerhalb seiner Versicherungsverträge zu verwalten.
    Es handelt sich um eine zustandsändernde Aktion.


    Der Agent führt diese Konfiguration direkt durch den Aufruf des Werkzeugs aus,
    nachdem die Identität des Kunden verifiziert wurde.


    **Parameter:**

    - **Ereignistyp**: Die Art des Ereignisses, für das ein Alarm gesetzt werden soll
    (z. B. "Zahlungserinnerung", "Schadensstatus_Update", "Fristablauf").

    - **Benachrichtigungskanal**: Der gewünschte Übertragungsweg (z. B. "E-Mail",
    "SMS", "App_Push").

    - **Aktivierungsstatus**: Ein boolescher Wert (aktiv/inaktiv), um den Alarm zu
    setzen oder zu entfernen.


    Das Werkzeug aktualisiert die Benachrichtigungseinstellungen im Kundenprofil und
    gibt eine Bestätigung zurück, dass der Alarm erfolgreich konfiguriert wurde.'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: hanseatica_versicherung
- id: 1291f2d9-62d1-544a-b16e-973f4be35093
  title: Wann get_claim_status eingesetzt wird
  body: 'Ein zentraler Teil unseres Serviceversprechens ist die transparente Bearbeitung
    von Schadensfällen. Das Werkzeug `get_claim_status` wird eingesetzt, wenn Kunden
    Informationen über den aktuellen Bearbeitungsstand einer gemeldeten Versicherungssache
    (z. B. bei der Hausratversicherung oder Kfz-Versicherung) anfordern.


    Dieses Werkzeug ist einzusetzen, wenn der Kunde Fragen stellt wie: "Wie ist der
    Status meiner Schadennummer?" oder "Wann kann ich mit der Auszahlung rechnen?".


    **Verfahrensablauf für den Agenten:**

    1. Führen Sie eine eindeutige Identitätsprüfung durch, da Informationen zum Schadensstatus
    vertraulich sind.

    2. Erfragen Sie die spezifische Schadennummer vom Kunden. Falls diese nicht vorliegt,
    verwenden Sie `get_accounts`, um den Vertrag zu identifizieren und suchen anschließend
    nach offenen Schadensakten.

    3. Rufen Sie das Werkzeug `get_claim_status` mit der Schadennummer auf.

    4. Erläutern Sie dem Kunden den aktuellen Status (z. B. "In Prüfung", "Gutachter
    beauftragt", "Auszahlung initiiert") in einer professionellen und seriösen Weise.


    Technische Details zum Aufruf entnehmen Sie der Werkzeugreferenz get_claim_status.'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: hanseatica_versicherung
- id: d0485aa6-4ca9-5bb7-988e-b3d8dc19a822
  title: Werkzeugreferenz get_claim_status
  body: 'Dieses Dokument beschreibt die technische Funktion und den Einsatz des Werkzeugs
    `get_claim_status`. Dieses Instrument ermöglicht es dem Servicemitarbeiter, den
    aktuellen Bearbeitungsstatus eines gemeldeten Schadensereignisses direkt im System
    abzufragen. Es findet primär Anwendung bei Schadensfällen innerhalb der Privathaftpflicht
    Komfort, der Hausratversicherung sowie der Kfz-Versicherung.


    Der Mitarbeiter führt diese Aktion durch den direkten Aufruf des Tools im Dialog
    aus. Voraussetzung hierfür ist eine zuvor erfolgreich durchgeführte, eindeutige
    Identitätsprüfung des Kunden. Der Zugriff auf diese Informationen erfolgt intern;
    der Kunde wird nicht an externe Portale oder Formulare verwiesen, sofern die Auskunft
    über dieses Werkzeug erbracht werden kann.


    **Parameter:**

    - **Schadennummer**: Die eindeutige Kennnummer des Schadensfalles. Diese Nummer
    wird dem Kunden im Rahmen der Schadensmeldung (beispielsweise durch den Aufruf
    von `file_claim`) zugewiesen und muss für die Abfrage vorliegen.


    **Auswirkung:**

    Das Tool liefert den aktuellen Status der Schadensbearbeitung zurück. Diese Information
    wird vom Mitarbeiter genutzt, um den Kunden präzise über den Fortschritt seiner
    Regulierung zu informieren.


    Weitere Details zur operativen Anwendung finden Sie im Dokument „Wann get_claim_status
    eingesetzt wird“. '
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: hanseatica_versicherung
