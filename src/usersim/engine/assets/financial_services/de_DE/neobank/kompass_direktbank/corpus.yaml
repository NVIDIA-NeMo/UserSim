- id: 7bf9f8e0-7e27-5074-9ea1-191362d51a85
  title: Kompass Visa Debitkarte — Status oder Verlauf einsehen
  body: 'Als bestehender Nutzer der Kompass Visa Debitkarte können Sie Ihren Umsatzverlauf
    und den Status Ihrer Karte jederzeit bequem in unserer App einsehen. Folgen Sie
    diesen Schritten, um den Überblick über Ihre Ausgaben zu behalten.


    **Voraussetzungen:**

    Sie benötigen die installierte Kompass Direktbank App und einen aktiven Zugang
    zu Ihrem Girokonto.


    **Schritte zum Einsehen des Verlaufs:**

    1. Öffnen Sie die App und melden Sie sich mit Ihrer gewohnten Methode an.

    2. Navigieren Sie im Hauptmenü zum Bereich ''Karten'' und wählen Sie Ihre Kompass
    Visa Debitkarte aus.

    3. Unter dem Reiter ''Transaktionen'' sehen Sie eine chronologische Liste aller
    Vorgänge. Hier werden sowohl bereits verbuchte Beträge als auch sogenannte ''vorgemerkte''
    Umsätze angezeigt.

    4. Tippen Sie auf einen einzelnen Vorgang, um detaillierte Informationen zu erhalten,
    wie zum Beispiel den Namen des Händlers, den genauen Zeitpunkt und den Ort der
    Zahlung.


    **Den Kartenstatus prüfen:**

    1. Gehen Sie ebenfalls in den Bereich ''Karten''.

    2. Hier sehen Sie auf einen Blick, ob Ihre Karte derzeit ''Aktiv'' ist oder ob
    sie durch Sie oder unsere Sicherheitsabteilung ''Gesperrt'' wurde.

    3. Über einen einfachen Schalter können Sie die Karte bei Bedarf selbstständig
    einfrieren oder wieder aktivieren.


    **Woran erkennen Sie, dass es funktioniert hat?**

    Sobald Sie den Bereich ''Transaktionen'' öffnen, lädt die App die aktuellen Daten
    Ihres Kontos. Ein erfolgreich geladener Verlauf zeigt Ihnen die letzten Umsätze
    inklusive des korrekten Betrags in Euro. Wenn Sie einen Vorgang anklicken und
    die Details erscheinen, ist die Abfrage erfolgreich abgeschlossen.'
