- id: f4dfb886-4203-5e32-b55a-12f0137549b4
  title: Echtzeitüberweisung — rechtliche Hinweise
  body: 'Die Nutzung der Echtzeitüberweisung bei der Kompass Direktbank unterliegt
    den regulatorischen Vorgaben der BaFin und der Deutschen Bundesbank sowie den
    europäischen Richtlinien für den Zahlungsverkehr.


    Ein zentraler Aspekt der Sicherheit ist die starke Kundenauthentifizierung (SCA).
    Gemäß den gesetzlichen Anforderungen müssen alle zustandsändernden Aktionen, insbesondere
    die Auslösung von Zahlungen, durch eine mehrstufige Verifizierung abgesichert
    werden. Ohne erfolgreiche SCA-Prüfung kann keine Echtzeitüberweisung initiiert
    werden.


    Bitte beachten Sie, dass eine Echtzeitüberweisung nach der endgültigen Ausführung
    durch unser Institut im Regelfall nicht mehr zurückgeholt werden kann, da das
    Geld nahezu unmittelbar dem Empfänger gutgeschrieben wird. Im Falle einer Fehlüberweisung
    sind Sie auf die Kooperationsbereitschaft des Empfängers angewiesen. Wir unterstützen
    Sie gerne bei der Kommunikation, können aber keine einseitige Rückbuchung erzwingen.


    Bei Reklamationen und Betrugsmeldungen halten wir uns strikt an die gesetzlichen
    Fristen. Beispielsweise wird die acht-wöchige Rückgabefrist für SEPA-Lastschriften
    sowie die Haftungsbegrenzung bei Kartenverlust gemäß BGB konsequent angewandt.
    Dies gilt auch für Vorgänge, die im Rahmen einer Echtzeitüberweisung initiiert
    wurden, sofern es sich um eine Lastschrift handelt.


    Die Kompass Direktbank übernimmt keine Haftung für Verzögerungen, die durch technische
    Störungen im SEPA-Netzwerk oder durch die mangelnde Unterstützung des Echtzeitstandards
    seitens der Empfängerbank entstehen. Wir gewährleisten jedoch die schnellstmögliche
    Weiterleitung der Zahlung innerhalb unserer Infrastruktur.


    Für allgemeine regulatorische Informationen besuchen Sie bitte Aufsichtsrechtliche
    Hinweise: Zahlungsverkehr.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: d6c33345-c8ef-5df4-a3fe-da5cb381ab74
  title: Echtzeitüberweisung — Zinsübersicht
  body: 'Die Echtzeitüberweisung ist eine reine Zahlungsdienstleistung zur Übertragung
    von Geldbeträgen zwischen Konten. Da es sich nicht um ein Anlageprodukt handelt,
    fallen im Zusammenhang mit der Ausführung einer Echtzeitüberweisung keine Zinsen
    an.


    Es gibt keinen Zinssatz für Beträge, die sich im Prozess einer Echtzeitüberweisung
    befinden. Die Übertragung erfolgt unmittelbar, sodass keine zeitliche Differenz
    entsteht, die eine Verzinsung rechtfertigen würde. Alle Beträge werden in ihrem
    Nominalwert übertragen.


    Wenn Sie auf der Suche nach einer Option sind, Ihr Guthaben verzinst zu parken,
    empfehlen wir unser Produkt Kompass Tagesgeld, das derzeit einen attraktiven Neukundenzins
    von 2,6 % für die ersten 4 Monate bietet. Die Echtzeitüberweisung kann effektiv
    genutzt werden, um Beträge schnell zwischen Ihrem Girokonto und einem Tagesgeldkonto
    zu verschieben.'
