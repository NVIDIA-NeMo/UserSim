- id: fe223bb0-1289-5f7a-b802-af70dd5d8743
  title: Kompass Girokonto — fehlgeschlagener oder ausstehender Vorgang
  body: 'Wenn während des Eröffnungsprozesses Ihres Kompass Girokontos ein Vorgang
    nicht abgeschlossen werden kann oder ausstehend bleibt, gehen Sie bitte wie folgt
    vor:


    **Symptom: Die Identitätsprüfung wird nicht als erfolgreich gemeldet**

    *   **Mögliche Ursachen**: Die Fotos des Ausweisdokuments sind unscharf, überbelichtet
    oder die Ränder sind abgeschnitten. Die Verbindung zum Internet war während des
    Uploads instabil.

    *   **Was zu prüfen ist**: Prüfen Sie in der App, ob Sie eine Fehlermeldung zur
    Bildqualität erhalten haben. Stellen Sie sicher, dass Sie sich in einer hellen
    Umgebung befinden und das Dokument flach auf einer dunklen Unterlage liegt.

    *   **Lösung**: Starten Sie den Verifizierungsprozess in der App erneut und laden
    Sie die Dokumente mit höherer Auflösung hoch.


    **Symptom: Der Kontoantrag steht seit mehr als zwei Werktagen auf „In Prüfung“**

    *   **Mögliche Ursachen**: Manuelle Nachprüfungen aufgrund von Unstimmigkeiten
    in den Daten oder technische Verzögerungen bei der Validierung der SCA-Daten.

    *   **Lösung**: Bitten Sie uns um eine Statusprüfung. Wir prüfen, ob weitere Unterlagen
    erforderlich sind.


    **Eskalationsweg**:

    Sollte der Vorgang weiterhin blockiert sein, werden wir den Fall intern an unsere
    spezialisierten Experten für Onboarding eskalieren. Wir erstellen ein Ticket und
    prüfen die Dokumente manuell. Sie erhalten innerhalb von 24 Stunden eine Benachrichtigung
    in der App über den Fortschritt oder eine Aufforderung zur Einreichung alternativer
    Dokumente.'
  domain: retail_banking
  product_category: girokonto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 5f43f22b-9f62-5d9b-95c2-aa53f1aa0660
  title: Kompass Girokonto — Voraussetzungen
  body: 'Um ein Kompass Girokonto führen zu können, müssen folgende Voraussetzungen
    erfüllt sein:


    | Voraussetzung | Bedingung | Ergebnis |

    | :--- | :--- | :--- |

    | Alter | Vollendung des 18. Lebensjahres | Erforderlich für Vertragsabschluss
    |

    | Wohnsitz | Gesetzlicher Wohnsitz in Deutschland oder EU | Erforderlich für die
    Kontoeröffnung |

    | Identität | Gültiges nationales Ausweisdokument oder Reisepass | Zwingend für
    die Verifizierung via SCA |

    | Technik | Smartphone mit kompatiblem Betriebssystem für unsere App | Erforderlich
    für den Kontozugriff |

    | Steuerstatus | Vorliegen einer gültigen Steuer-Identifikationsnummer | Erforderlich
    für regulatorische Meldungen |


    Kunden, die alle oben genannten Kriterien erfüllen, sind berechtigt, das Konto
    zu eröffnen und von den Konditionen (wie dem Erlass der 4,90 € Gebühr ab 700 €
    Geldeingang) zu profitieren.'
  domain: retail_banking
  product_category: girokonto
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 447f5021-7d48-5d72-a72b-863633e4d6c9
  title: Kompass Girokonto — im Vergleich zu einem ähnlichen Produkt des Hauses
  body: 'Hier vergleichen wir das Kompass Girokonto mit unserem Kompass Tagesgeldkonto,
    um Ihnen bei der Wahl des richtigen Produkts zu helfen.


    **Kompass Girokonto**

    *   **Zweck**: Täglicher Zahlungsverkehr, Gehaltseingang, Lastschriften.

    *   **Kosten**: 4,90 € monatlich (entfällt ab 700 € Geldeingang).

    *   **Flexibilität**: Direkter Zugriff auf Gelder, Kreditlinie mit einem Zinssatz
    von 9,89 %.

    *   **Geeignet für**: Kunden, die ein funktionales Hauptkonto für alle täglichen
    Transaktionen suchen.


    **Kompass Tagesgeld**

    *   **Zweck**: Kurzfristiges Parken von Ersparnissen mit Zinsertrag.

    *   **Kosten**: Keine Kontoführungsgebühren.

    *   **Ertrag**: Attraktiver Neukundenzins von 2,6 % für die ersten 4 Monate.

    *   **Geeignet für**: Kunden, die ihr Geld sicher anlegen möchten und auf eine
    tägliche Transaktionsfähigkeit (wie Überweisungen an Dritte) verzichten können.


    Während das Girokonto die operative Basis Ihres Finanzlebens bildet, dient das
    Tagesgeld der Vermögensbildung. Für eine detaillierte Übersicht zum Sparprodukt
    sehen Sie bitte unter Kompass Tagesgeld — Überblick.'
  domain: retail_banking
  product_category: girokonto
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 1997ba17-e816-55e6-bd37-656ff7919b14
  title: Kompass Girokonto — rechtliche Hinweise
  body: 'Die Führung eines Kompass Girokontos unterliegt den gesetzlichen Rahmenbedingungen
    des deutschen Finanzmarktes. Wir agieren strikt nach den Vorgaben der BaFin und
    der Deutschen Bundesbank.


    **Einlagensicherung**

    Ihrem Guthaben auf dem Kompass Girokonto ist die gesetzliche Einlagensicherung
    beigefügt. Diese gewährleistet den Schutz Ihrer Einlagen bis zu einem Betrag von
    100.000 € pro Kunde und Bank. Dies ist ein zentrales Sicherheitsversprechen unseres
    Hauses.


    **Datenschutz und Authentifizierung**

    Wir halten uns strikt an die europäischen und nationalen Datenschutzrichtlinien.
    Zum Schutz Ihrer Daten wird vor jeder zustandsändernden Aktion oder der Herausgabe
    von Kontodaten die Identität des Nutzers zwingend verifiziert. Wir setzen hierfür
    konsequent die starke Kundenauthentifizierung (SCA) ein.


    **Beratungsbeschränkung**

    Kompass Direktbank bietet allgemeine finanzielle Bildung und Produktinformationen
    an. Wir leisten jedoch keine individualisierte Steuer- oder Rechtsberatung. Produktempfehlungen
    erfolgen auf Basis objektiver Kriterien und eines hohen Sorgfaltsstandards, jedoch
    ohne persönliche Anlageberatung.


    **Gebührenstruktur**

    Die monatliche Kontoführungsgebühr von 4,90 € wird zur Sicherung der digitalen
    Infrastruktur erhoben. Der Erlass dieser Gebühr bei einem Geldeingang von 700
    € ist eine vertragliche Vereinbarung zur Förderung aktiver Nutzer. Alle weiteren
    Konditionen, einschließlich des Dispozinses von 9,89 %, sind in den Allgemeinen
    Geschäftsbedingungen sowie im Dokument Kompass Girokonto — Überblick hinterlegt.'
  domain: retail_banking
  product_category: girokonto
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 8f58e003-c211-537e-9596-7d0d0f8262c5
  title: Kompass Girokonto — Zinsübersicht
  body: 'Im Rahmen des Kompass Girokontos gelten folgende Zinssätze:


    **Sollzinsen (Überziehungszinsen)**

    Für Beträge, die über das Guthaben hinaus im Rahmen eines eingeräumten Dispositionskredits
    in Anspruch genommen werden, gilt ein Zinssatz von 9,89 %.


    *   **Anwendung**: Dieser Satz gilt einheitlich für alle überzogenen Beträge im
    Rahmen des Dispositionskredits.

    *   **Berechnung**: Die Zinsen werden auf Basis des täglich überzogenen Betrags
    berechnet und in regelmäßigen Abständen dem Konto belastet.

    *   **Änderungen**: Wir behalten uns vor, den Zinssatz bei Änderung der Marktlage
    oder der regulatorischen Vorgaben anzupassen. Über Änderungen informieren wir
    Sie transparent über die App.


    Da das Kompass Girokonto als Transaktionskonto konzipiert ist, wird auf dem Guthaben
    dieses Kontos keine Verzinsung gewährt. Für verzinsliche Sparoptionen empfehlen
    wir unser Tagesgeldprodukt.'
  domain: retail_banking
  product_category: girokonto
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 4e177d92-536f-5c6c-8b26-7c150b0c80eb
  title: Kompass Girokonto — aktuelles Angebot
  body: 'Profitieren Sie von unserem aktuellen Willkommens-Angebot für neue Nutzer
    und treue Kunden!


    **Aktion: Kontowechsel-Bonus**

    Wir machen Ihren Start bei uns noch attraktiver. Alle Kunden, die bis zum 31.12.2024
    den digitalen Service der Kontowechselhilfe nutzen, um ihr Hauptkonto zu uns zu
    übertragen, erhalten einen einmaligen Willkommensbonus in Höhe von 25,00 €.


    **Bedingungen für den Erhalt des Bonus**:

    1. Nutzung der Kontowechselhilfe innerhalb des Aktionszeitraums.

    2. Nachweis eines ersten monatlichen Geldeingangs von mindestens 700 € auf dem
    neuen Kompass Girokonto.


    Der Bonus von 25,00 € wird automatisch 30 Tage nach Erfüllung der Bedingungen
    auf Ihr Konto gutgeschrieben. Erinnern Sie sich daran: Ab einem Geldeingang von
    700 € entfällt zudem dauerhaft die monatliche Kontoführungsgebühr von 4,90 €.'
