- id: 4a9ed5e7-9278-50f7-b150-13c8ef6bbe3c
  title: Kompass Tagesgeld — fehlgeschlagener oder ausstehender Vorgang
  body: 'Symptom: Ein Kunde berichtet, dass das Kompass Tagesgeld Konto trotz Antrag
    noch nicht aktiv ist oder eine Einzahlung nicht angezeigt wird.


    Wahrscheinliche Ursachen:

    1. Die Identitätsverifizierung (SCA) wurde nicht vollständig abgeschlossen.

    2. Die Überweisung vom Referenzkonto ist noch nicht im SEPA-System verarbeitet
    worden.

    3. Es liegt eine Diskrepanz zwischen dem Namen des Absenderkontos und dem Namen
    des Tagesgeldkontos vor.


    Prüfschritte in dieser Reihenfolge:

    1. Verifizierungsstatus prüfen: Kontrollieren Sie, ob alle Schritte der Identitätsprüfung
    erfolgreich waren. Falls nicht, fordern wir den Kunden auf, den Prozess erneut
    zu durchlaufen.

    2. Zeitrahmen prüfen: Da wir uns an gesetzliche Fristen und SEPA-Standards halten,
    kann es bis zu einem Werktag dauern, bis Geldeingänge sichtbar sind.

    3. Kontodaten abgleichen: Prüfen Sie, ob die Überweisung von einem Konto aus erfolgte,
    das auf den Namen des Kunden läuft.


    Lösung:

    - Bei fehlender Verifizierung: Wir starten den Identitätsprozess neu, bis die
    SCA erfolgreich abgeschlossen ist.

    - Bei ausstehenden Zahlungen: Wir fordern den Kunden auf, den Beleg der Überweisung
    bereitzustellen. Wenn der Betrag nach drei Werktagen nicht eingegangen ist, leiten
    wir eine Nachforschung ein.


    Eskalation:

    Sollten die Schritte nicht zum Erfolg führen, eskalieren wir den Fall an unsere
    spezialisierten Experten für Onboarding und Zahlungsverkehr. Der Kunde erhält
    eine Benachrichtigung über den Fortschritt der Prüfung in der App. Für allgemeine
    Informationen zum Produkt siehe Kompass Tagesgeld — Überblick.'
