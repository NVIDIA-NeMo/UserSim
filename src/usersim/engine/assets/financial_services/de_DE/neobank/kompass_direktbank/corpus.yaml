- id: bbf93290-7d8e-5cdb-ba92-190c55a94d3d
  title: Kompass Tagesgeld — Risikohinweise
  body: 'Die Nutzung des Kompass Tagesgeld ist mit minimalen Risiken verbunden, jedoch
    ist eine transparente Aufklärung über die regulatorischen Rahmenbedingungen gesetzlich
    vorgeschrieben.


    Ein zentrales Sicherheitsversprechen der Kompass Direktbank ist die gesetzliche
    Einlagensicherung. Ihr Guthaben ist gemäß den europäischen und nationalen Finanzmarktrichtlinien
    bis zu einem Betrag von 100.000 € pro Kunde und Bank geschützt. Dieser Schutz
    greift im Falle einer Insolvenz des Instituts und gewährleistet die Rückzahlung
    Ihrer Einlagen bis zu dieser Grenze.


    Wir agieren strikt nach den Vorgaben der BaFin und der Deutschen Bundesbank. Dies
    bedeutet für Sie, dass alle Prozesse der Geldverwaltung und Verzinsung einer strengen
    aufsichtsrechtlichen Kontrolle unterliegen.


    Bezüglich der Verzinsung weisen wir darauf hin, dass Zinsen variabel sind. Der
    Neukundenzins von 2,6 % ist eine zeitlich befristete Förderung für die ersten
    4 Monate. Nach Ablauf dieses Zeitraums erfolgt eine automatische Anpassung auf
    den aktuellen Standardzinssatz von 1,75 %. Wir übernehmen keine Garantie, dass
    der Standardzinssatz dauerhaft unverändert bleibt; Anpassungen können aufgrund
    von Änderungen am Kapitalmarkt durch die Bank vorgenommen werden.


    Es handelt sich beim Kompass Tagesgeld nicht um ein Anlageprodukt mit einer garantierten
    Endrendite (wie etwa ein Festgeld), sondern um ein verzinstes Einlagenkonto. Es
    gibt kein Risiko eines Kapitalverlusts unterhalb der Grenze der Einlagensicherung
    von 100.000 €. Für weitere rechtliche Details besuchen Sie bitte das Dokument
    Kompass Tagesgeld — rechtliche Hinweise.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: da546159-10c8-5a2b-9d9b-7344c782ec7b
  title: Kompass Tagesgeld — wie Zinsen berechnet und angewendet werden
  body: 'Die Verzinsung des Kompass Tagesgeld folgt einem transparenten, zweistufigen
    Modell, das primär an die Dauer der Kundenbeziehung gebunden ist.


    Zinssätze:

    - Neukundenzins: 2,6 % p.a. Dieser Satz gilt für alle Guthaben ab dem Tag der
    Kontoeröffnung für eine Dauer von exakt 4 Monaten.

    - Standardzinssatz: 1,75 % p.a. Dieser Satz tritt automatisch in Kraft, sobald
    die 4-monatige Neukundenphase abgelaufen ist.


    Berechnung und Gutschrift:

    Die Zinsen werden auf Basis des täglichen Endsaldos berechnet. Dies bedeutet,
    dass jede Einzahlung sofort ab dem Folgetag verzinst wird und jede Auszahlung
    die Zinsbasis unmittelbar reduziert. Die Zinsgutschrift erfolgt in der Regel in
    festgelegten Intervallen auf das Konto, wobei der jeweilige Zinssatz (2,6 % oder
    1,75 %) tagesgenau angewendet wird.


    Änderungsvorbehalt:

    Die Bank kann den Standardzinssatz an die allgemeine Marktentwicklung anpassen.
    Änderungen werden den Kunden über die App mitgeteilt. Der Neukundenzins ist für
    den Zeitraum von 4 Monaten fixiert.'
