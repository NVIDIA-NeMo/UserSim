- id: 268a9308-45fd-578f-a227-f3b2a4b1c6d7
  title: Kompass Girokonto — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Eröffnung und ersten Nutzung des Kompass Girokontos zu unterstützen. Das Ziel
    ist ein nahtloser, rein digitaler Onboarding-Prozess.


    Schritt 1: Identitätsprüfung und Eröffnung

    Der Kunde initiiert die Eröffnung über die App. Unterstützen Sie den Kunden bei
    der Durchführung der starken Kundenauthentifizierung (SCA) und der Identitätsprüfung.
    Ohne eine erfolgreiche Verifizierung ist keine Kontoeröffnung möglich. Stellen
    Sie sicher, dass der Kunde weiß, welche Dokumente für die digitale Verifizierung
    bereitgehalten werden müssen (siehe Kompass Girokonto — erforderliche Unterlagen).


    Schritt 2: Kontoaktivierung

    Nach der erfolgreichen Prüfung erhält der Kunde den Zugriff auf sein Konto in
    der App. Informieren Sie den Kunden, dass er nun seine persönlichen Einstellungen
    vornehmen kann. Weisen Sie darauf hin, dass die Visa Debitkarte kostenfrei ist
    und automatisch im Rahmen des Pakets bereitgestellt wird.


    Schritt 3: Einrichten des Geldeingangs

    Um die monatliche Kontoführungsgebühr von 4,90 € zu vermeiden, muss der Kunde
    einen monatlichen Geldeingang von 700 € erreichen. Helfen Sie dem Kunden dabei,
    seinen Gehaltseingang oder andere regelmäßige Zahlungen auf das neue Konto umzuleiten.
    Erklären Sie hierbei die Funktion unserer digitalen Kontowechselhilfe, die Daueraufträge
    und Lastschriften effizient überträgt.


    Schritt 4: Nutzung der Funktionen

    Führen Sie den Kunden in die grundlegenden Funktionen ein, wie etwa die Echtzeitüberweisung
    (bis 5.000 € täglich gebührenfrei). Erklären Sie dem Kunden, dass im Falle eines
    Überziehungsrahmens ein Dispozins von 9,89 % anfällt.


    Abschluss des Prozesses

    Der Prozess ist abgeschlossen, wenn das Konto aktiv ist und der erste Geldeingang
    verbucht wurde. Der Kunde sollte nun in der Lage sein, alle Vorgänge eigenständig
    über die In-App-Funktionen zu erledigen. Bei komplexeren Fragen erfolgt die Eskalation
    an unsere spezialisierten Experten.'
