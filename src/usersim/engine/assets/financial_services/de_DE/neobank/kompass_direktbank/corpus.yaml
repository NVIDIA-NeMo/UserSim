- id: f329bb48-7a6a-590f-8f53-c2e14687e0c5
  title: 'Kompass Tagesgeld — Neukundenzins: Erklärung'
  body: 'Frage: Wie funktioniert der Neukundenzins beim Kompass Tagesgeld genau?

    Antwort: Neukunden profitieren in den ersten 4 Monaten nach der Kontoeröffnung
    von einem erhöhten Zinssatz in Höhe von 2,6 %. Dieser Zins gilt für das gesamte
    Guthaben auf dem Konto während dieses Zeitraums.


    Frage: Was passiert, wenn die 4 Monate abgelaufen sind?

    Antwort: Nach Ablauf der Aktionsphase von 4 Monaten wird Ihr Guthaben automatisch
    mit dem Standardzinssatz von 1,75 % verzinst. Es ist keine manuelle Umstellung
    oder Kündigung erforderlich; der Übergang erfolgt systemseitig.


    Frage: Gilt der Neukundenzins dauerhaft?

    Antwort: Nein, der Zinssatz von 2,6 % ist zeitlich auf die ersten 4 Monate begrenzt,
    um Ihnen einen attraktiven Start bei uns zu ermöglichen. Danach greift die reguläre
    Verzinsung von 1,75 %.


    Weitere Details zur Zinsgestaltung finden Sie in der Kompass Tagesgeld — Zinsübersicht.'
