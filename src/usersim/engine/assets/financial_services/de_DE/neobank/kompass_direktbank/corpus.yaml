- id: 303679d1-3e75-5e3f-b1c5-6cc4bfdc110a
  title: Echtzeitüberweisung — Abweichung von Ihren Unterlagen
  body: "Dieses Dokument ist für Support-Mitarbeiter gedacht, wenn ein Kunde eine\
    \ Abweichung zwischen seinen Unterlagen (z. B. einer Bestätigung in der App) und\
    \ der tatsächlichen Gutschrift beim Empfänger meldet.\n\nSymptom: Der Kunde gibt\
    \ an, eine Echtzeitüberweisung erfolgreich abgeschlossen zu haben (Status 'Erfolgreich'),\
    \ aber der Empfänger behauptet, das Geld sei nicht eingegangen.\n\nPrüfschritte\
    \ für den Support:\n\n1. Überprüfung des Transaktionsstatus: Prüfen Sie im Backend,\
    \ ob die Transaktion tatsächlich den Status 'Erfolgreich' hat oder ob es eine\
    \ Rückmeldung der Empfängerbank (Return) gab. \n2. Validierung der Empfängerüberprüfung:\
    \ Kontrollieren Sie, ob der automatische Abgleich von Name und IBAN positiv verlaufen\
    \ ist. Gab es Warnmeldungen, die dennoch ignoriert wurden oder vom System überschrieben\
    \ wurden?\n3. Analyse des Limits: Prüfen Sie, ob der Betrag innerhalb des täglichen\
    \ Limits von 5.000 € lag und ob es kurz vor Abschluss des Vorgangs zu einer Limit-Überschreitung\
    \ kam, die den Versand verzögert haben könnte.\n4. Prüfung der Empfängerbank:\
    \ Stellen Sie fest, ob die Empfängerbank den Echtzeit-Standard unterstützt. Falls\
    \ nicht, wurde die Zahlung als Standard-SEPA-Überweisung versendet, was die Verzögerung\
    \ erklärt.\n\nLösung und Kommunikation:\n- Falls die Zahlung als Standard-Überweisung\
    \ lief: Erklären Sie dem Kunden, dass die Echtzeit-Funktion von der Empfängerbank\
    \ unterstützt werden muss und die Gutschrift daher gemäß den normalen Banklaufzeiten\
    \ erfolgt.\n- Falls ein technischer Fehler vorliegt: Eskalieren Sie den Fall an\
    \ die Fachabteilung für Zahlungsverkehr. Wir leiten eine Nachforschung ein und\
    \ informieren den Kunden über die Ergebnisse im Chat.\n- Falls die Daten falsch\
    \ waren: Verweisen Sie auf die Bedeutung der korrekten IBAN-Eingabe und die Wirkung\
    \ der Empfängerüberprüfung."
  domain: payments
  product_category: echtzeitueberweisung
