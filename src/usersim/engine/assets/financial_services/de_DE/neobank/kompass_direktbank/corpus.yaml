- id: 016e3fcb-e124-57a7-a58b-4ebce8e589c3
  title: 'Kompass Visa Debitkarte — Mindestbetrag für kostenlose Bargeldabhebungen:
    Erklärung'
  body: '**Warum gibt es einen Mindestbetrag für Bargeldabhebungen?**

    Um die digitale Infrastruktur unserer Neobank effizient zu warten und Ihnen eine
    Jahresgebühr von 0 € bieten zu können, haben wir einen Mindestbetrag für kostenlose
    Abhebungen festgelegt. Dies hilft uns, die Betriebskosten der Kartenverarbeitung
    zu optimieren.


    **Wie hoch ist dieser Mindestbetrag?**

    Der Mindestbetrag für kostenlose Bargeldabhebungen mit der Kompass Visa Debitkarte
    liegt bei 50 €.


    **Was passiert, wenn ich einen Betrag unter 50 € abhebe?**

    Abhebungen unterhalb dieses Schwellenwerts können mit einer Gebühr belegt werden
    oder je nach Geldautomat technisch eingeschränkt sein. Wir empfehlen daher, Abhebungen
    in Beträgen von mindestens 50 € zu planen.


    **Gilt dies auch für Zahlungen in Geschäften?**

    Nein. Der Mindestbetrag bezieht sich ausschließlich auf die Bargeldauszahlung
    an Geldautomaten. Alle anderen Zahlungen mit der Karte sind unabhängig vom Betrag
    kostenfrei möglich. Weitere Details finden Sie in der Kompass Visa Debitkarte
    — Überblick.'
