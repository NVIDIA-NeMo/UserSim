- id: 8231fa7c-8a09-5263-a6a6-ca1eaaa074af
  title: Kompass Girokonto — wie Zinsen berechnet und angewendet werden
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter zur Erläuterung
    der Zinsmechanismen des Kompass Girokonto.


    Überziehungszinsen (Sollzinsen):

    Das Kompass Girokonto sieht einen Zinssatz von 9,89 % für Überziehungen vor. Dieser
    Satz gilt einheitlich für alle Kunden, unabhängig von der Höhe des überzogenen
    Betrags.


    Berechnungsmethode:

    Die Zinsen werden auf Basis des täglichen Sollsaldos berechnet. Das bedeutet,
    dass jeder Tag, an dem das Konto ein negatives Guthaben aufweist, mit dem Zinssatz
    von 9,89 % (pro Jahr, tagesgenau berechnet) belastet wird.


    Anwendung:

    - Die Zinsen fallen an, sobald der Kontostand unter 0,00 € sinkt.

    - Die Abrechnung und Belastung der aufgelaufenen Zinsen erfolgt in den in den
    AGB festgelegten Intervallen.


    Es gibt für das Kompass Girokonto keine gestaffelten Zinssätze; der Satz von 9,89
    % ist fix. Für Informationen zu verzinsten Sparoptionen verweisen Sie bitte auf
    das Dokument Kompass Tagesgeld — Überblick.'
