- id: 7e78bdff-087d-5655-8ed1-727c7f4a7c71
  title: Echtzeitüberweisung — Datenschutz und Datenverarbeitung
  body: 'Die Nutzung der Echtzeitüberweisung bei der Kompass Direktbank unterliegt
    den strengen Richtlinien der DSGVO sowie den regulatorischen Vorgaben der BaFin
    und der Deutschen Bundesbank. Wir gewährleisten eine transparente und sichere
    Verarbeitung Ihrer Daten.


    **Datenverarbeitung beim Transfer:**

    Um die Ausführung einer Echtzeitüberweisung in Sekundenschnelle zu ermöglichen,
    werden die notwendigen Transaktionsdaten (Name des Empfängers, IBAN, Betrag) unmittelbar
    an die beteiligten Zahlungssysteme übermittelt. Die integrierte Empfängerüberprüfung
    gleicht die Daten ab, um Fehlleitungen zu vermeiden und Betrug vorzubeugen.


    **Sicherheit und Überwachung:**

    Zur Sicherung der digitalen Infrastruktur und zur Betrugsprävention überwacht
    die Bank alle Transaktionen in Echtzeit. Dabei wird insbesondere die Einhaltung
    des täglichen Limits von 5.000 € systemseitig geprüft. Die Anwendung der starken
    Kundenauthentifizierung (SCA) stellt sicher, dass nur der rechtmäßige Kontoinhaber
    zustandsändernde Aktionen vornehmen kann.


    **Aufbewahrung und Rechte:**

    Transaktionsdaten werden gemäß den gesetzlichen Aufbewahrungsfristen für Finanzinstitute
    gespeichert. Sie haben jederzeit das Recht auf Auskunft über die verarbeiteten
    Daten sowie auf Berichtigung fehlerhafter Informationen über unsere In-App-Funktionen.


    **Haftung und Risiko:**

    Bitte beachten Sie, dass Echtzeitüberweisungen aufgrund ihrer technischen Natur
    endgültig sind. Eine Rückforderung ist nur bei nachgewiesener Fehlleistung oder
    mit Zustimmung des Empfängers möglich. Wir handeln strikt nach den gesetzlichen
    Haftungsbegrenzungen des BGB bei nicht autorisierten Zahlungen, sofern die Sicherheitsvorgaben
    eingehalten wurden.'
