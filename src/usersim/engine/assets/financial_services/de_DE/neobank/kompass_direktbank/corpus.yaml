  institution_id: kompass_direktbank
- id: 06696054-e1fd-5f32-aa64-3524cfd64199
  title: Kompass Girokonto — erforderliche Unterlagen
  body: 'Um ein Kompass Girokonto erfolgreich zu eröffnen, müssen bestimmte Dokumentationsanforderungen
    erfüllt werden. Da wir eine rein digitale Bank sind, erfolgt die Einreichung und
    Prüfung vollständig digital.


    | Anforderung | Erforderliches Dokument/Nachweis | Ergebnis bei Erfüllung |

    | :--- | :--- | :--- |

    | Identitätsnachweis | Gültiger Personalausweis oder Reisepass (EU/EWR) | Verifizierung
    gestartet |

    | Wohnsitznachweis | Aktuelle Meldebescheinigung oder Verbrauchsrechnung (falls
    gefordert) | Adressprüfung abgeschlossen |

    | Identitätsprüfung | Durchführung des Video-Ident-Verfahrens oder eID-Funktion
    | Konto-Freischaltung |

    | Steuerliche Ansässigkeit | Angabe der Steuer-Identifikationsnummer (Steuer-ID)
    | Compliance-Prüfung erfolgreich |


    Alle Unterlagen müssen in digitaler, gut lesbarer Form vorliegen. Die Identität
    wird zwingend über die starke Kundenauthentifizierung (SCA) gesichert, bevor das
    Konto aktiviert wird. Weitere Voraussetzungen finden Sie in Kompass Girokonto
    — Voraussetzungen.'
