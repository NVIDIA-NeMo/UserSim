- id: f1259c8a-95f7-56cd-9430-ad1942f12c72
  title: Kompass Visa Debitkarte — fehlgeschlagener oder ausstehender Vorgang
  body: 'Sollte eine Zahlung mit Ihrer Kompass Visa Debitkarte fehlgeschlagen sein
    oder ein Vorgang als ausstehend angezeigt werden, prüfen Sie bitte die folgenden
    Punkte in dieser Reihenfolge:


    Symptom: Die Karte wird am Terminal oder beim Online-Kauf abgelehnt.


    1. Prüfung des Kontostands: Stellen Sie sicher, dass auf Ihrem verknüpften Girokonto
    ausreichend Guthaben für den Betrag vorhanden ist.

    2. Überprüfung des Mindestbetrags: Falls Sie versuchen, Bargeld an einem Automaten
    abzuheben, prüfen Sie, ob der gewünschte Betrag mindestens 50 € beträgt. Beträge
    unter dieser Grenze führen zu einer Ablehnung des Vorgangs.

    3. SCA-Verifizierung: Prüfen Sie, ob Sie die starke Kundenauthentifizierung (SCA)
    in der App bestätigt haben. Ohne diese Freigabe werden sensible Online-Zahlungen
    aus Sicherheitsgründen blockiert.

    4. PIN-Korrektness: Stellen Sie sicher, dass die eingegebene PIN korrekt ist.
    Bei mehrfacher Falscheingabe wird die Karte aus Sicherheitsgründen gesperrt.


    Fix:

    - Erhöhen Sie den Abhebungsbetrag auf mindestens 50 €.

    - Führen Sie die SCA-Bestätigung in der App durch.


    Wenn diese Schritte keine Lösung bringen, teilen Sie uns dies im Chat mit. Wir
    werden den Vorgang an unsere spezialisierten menschlichen Experten eskalieren.
    Diese prüfen die Transaktionslogs und informieren Sie über die genaue Ursache
    sowie die notwendigen Schritte zur Behebung. Sie erhalten eine Benachrichtigung
    über den Status der Prüfung direkt in Ihrer App.'
