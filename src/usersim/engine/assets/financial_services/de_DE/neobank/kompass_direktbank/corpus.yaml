- id: 0c173276-1e94-5c0f-b14e-1cb6c559c057
  title: Kompass Tagesgeld — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Eröffnung und den ersten Schritten mit dem Kompass Tagesgeld zu unterstützen.
    Das Produkt ist als flexible Sparoption für preisbewusste und technikaffine Kunden
    positioniert.


    Produktmerkmale für die Kundenberatung:

    - Neukundenzins: 2,6 % für die ersten 4 Monate.

    - Standardzins: 1,75 % nach Ablauf der Aktionsphase.

    - Verfügbarkeit: Täglich verfügbar ohne Kündigungsfrist.

    - Sicherheit: Gesetzliche Einlagensicherung bis 100.000 €.


    Schritte zur Aktivierung:

    1. Identitätsprüfung: Der Kunde muss die Identität über den digitalen Prozess
    der App verifizieren. Dies ist eine zwingende Voraussetzung vor jeder zustandsändernden
    Aktion.

    2. Kontoeröffnung: Der Kunde wählt in der App das Produkt Kompass Tagesgeld aus
    und bestätigt die Bedingungen. Die Eröffnung erfolgt rein digital ohne physische
    Filialen.

    3. Ersteinzahlung: Der Kunde überweist den gewünschten Betrag von seinem Referenzkonto
    (z. B. dem Kompass Girokonto) auf das neue Tagesgeldkonto. Ab diesem Zeitpunkt
    beginnt die Laufzeit von 4 Monaten für den Neukundenzins von 2,6 %.

    4. Bestätigung: Nach erfolgreicher Eröffnung erhält der Kunde eine Bestätigung
    in der App, aus der das Eröffnungsdatum und der geltende Zinssatz hervorgehen.


    Wichtige Hinweise für den Support:

    - Bei Fragen zur Zinsänderung nach 4 Monaten verweisen Sie bitte auf die Dokumentation
    zum Zinssatznachlauf.

    - Stellen Sie sicher, dass der Kunde weiß, dass die starke Kundenauthentifizierung
    (SCA) für alle zukünftigen Transfers vom Tagesgeldkonto zwingend erforderlich
    ist.

    - Sollte der Kunde Schwierigkeiten bei der digitalen Verifizierung haben, eskalieren
    Sie den Fall nahtlos an die spezialisierten Experten für Onboarding.


    Weitere Informationen zur allgemeinen Kontoverwaltung finden Sie unter Kompass
    Girokonto — Überblick.'
