- id: 8404c141-c54a-579c-a085-6be2b3c3b9d1
  title: Kompass Girokonto — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter zur Handhabung
    von Sonderfällen und Einschränkungen beim Kompass Girokonto.


    **Gebührenstruktur und Ausnahmen**

    Die monatliche Kontoführungsgebühr beträgt standardmäßig 4,90 €. Diese Gebühr
    entfällt jedoch vollständig, wenn ein monatlicher Geldeingang von mindestens 700
    € auf dem Konto verzeichnet wird. Bei der Prüfung dieses Entgelts ist strikt auf
    die Summe der eingehenden Buchungen innerhalb eines Kalendermonats zu achten.
    Teilbeträge oder interne Umbuchungen zwischen eigenen Konten zählen nicht als
    Geldeingang.


    **Überziehung und Verzinsung**

    Sollte das Konto ins Minus rutschen, wird der entsprechende Betrag mit einem Zinssatz
    von 9,89 % verzinst. Dieser Satz gilt für den gesamten überzogenen Betrag ab dem
    ersten Cent. Es gibt keine zinsfreien Pufferzonen.


    **Einlagensicherung und Sicherheit**

    Das Guthaben der Kunden ist durch die gesetzliche Einlagensicherung bis zu einem
    Betrag von 100.000 € pro Kunde und Bank geschützt. Dies ist ein zentrales Sicherheitsversprechen
    der Kompass Direktbank gemäß den Vorgaben der BaFin und der Deutschen Bundesbank.


    **Transaktionsbeschränkungen**

    Jede zustandsändernde Aktion, wie etwa die Änderung von Stammdaten oder die Herausgabe
    von sensiblen Kontoinformationen, erfordert zwingend eine vorherige Identitätsverifizierung.
    Wir setzen konsequent die starke Kundenauthentifizierung (SCA) für alle Online-Zahlungen
    und sensiblen Vorgänge ein. Transaktionen, die diese Sicherheitsstandards nicht
    erfüllen, werden vom System automatisch abgelehnt.


    **Besondere regulatorische Vorgaben**

    Wir agieren strikt nach europäischen und nationalen Finanzmarktrichtlinien. Dies
    bedeutet, dass wir keine individualisierte Steuer- oder Rechtsberatung anbieten
    dürfen. Produktempfehlungen erfolgen ausschließlich auf Basis objektiver Kriterien.
    Für detailliertere Informationen verweisen Sie bitte auf Kompass Girokonto — Überblick.'
