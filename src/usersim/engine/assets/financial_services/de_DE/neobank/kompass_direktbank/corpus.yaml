- id: ad21ddea-8736-584c-80ee-a9a5b1f293f2
  title: Kompass Visa Debitkarte — Schritt für Schritt starten
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden bei
    der Inbetriebnahme der Kompass Visa Debitkarte effizient zu unterstützen. Da die
    Kompass Direktbank eine reine Neobank ist, erfolgt der gesamte Prozess digital.


