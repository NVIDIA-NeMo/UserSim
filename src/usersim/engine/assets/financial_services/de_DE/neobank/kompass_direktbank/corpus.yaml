- id: f3bacfc9-3dd2-513b-9708-3257df9f35f5
  title: 'Aufsichtsrechtliche Hinweise: Privatkundengeschäft'
  body: 'Die Kompass Direktbank operiert als moderne Neobank im Einklang mit den strengen
    regulatorischen Anforderungen des deutschen und europäischen Finanzmarktes. Um
    die Sicherheit und Integrität unserer Kundenbeziehungen zu gewährleisten, unterliegt
    das gesamte Privatkundengeschäft einer kontinuierlichen Aufsicht.


    Zentrale regulatorische Säulen:


    1. Aufsicht und Compliance: Wir agieren strikt nach den Vorgaben der BaFin (Bundesanstalt
    für Finanzdienstleistungsaufsicht) und der Deutschen Bundesbank. Diese Institutionen
    stellen sicher, dass wir die notwendigen Kapitalanforderungen erfüllen und operationelle
    Risiken minimieren.


    2. Einlagensicherung: Als zentrales Sicherheitsversprechen an unsere Kunden garantieren
    wir den Schutz von Guthaben durch die gesetzliche Einlagensicherung. Diese sichert
    Einlagen bis zu einem Betrag von 100.000 € pro Kunde und Bank ab, was ein fundamentales
    Sicherheitsnetz für alle Nutzer des Kompass Girokontos und des Kompass Tagesgelds
    darstellt.


    3. Datenschutz und faire Behandlung: Die Verarbeitung personenbezogener Daten
    erfolgt strikt gemäß der Datenschutz-Grundverordnung (DSGVO) und nationalen Finanzmarktrichtlinien.
    Wir verpflichten uns zur fairen Behandlung aller Kunden, unabhängig von ihrem
    Kontostatus, und stellen durch transparente Kommunikation sicher, dass keine versteckten
    Kosten entstehen.


    4. Beratungsgrenzen: Die Kompass Direktbank stellt digitale Informationen und
    allgemeine finanzielle Bildung bereit. Es ist jedoch zwingend zu beachten, dass
    keine individualisierte Steuerberatung oder Rechtsberatung erfolgt. Unsere Produktempfehlungen
    basieren auf objektiven Kriterien und einem hohen Sorgfaltsstandard, ersetzen
    jedoch keine persönliche Anlageberatung durch zertifizierte Berater.


    Agenten sind verpflichtet, Kunden bei Anfragen zu regulatorischen Themen präzise
    auf diese Rahmenbedingungen hinzuweisen und dürfen keine Zusagen machen, die über
    die gesetzliche Einlagensicherung von 100.000 € hinausgehen.'
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 15214182-8cc9-5c29-86b4-63d789e92594
  title: 'Aufsichtsrechtliche Hinweise: Karten'
  body: 'Der Einsatz der Kompass Visa Debitkarte unterliegt spezifischen rechtlichen
    Rahmenbedingungen und Sicherheitsvorschriften, um sowohl den Nutzer als auch das
    Institut vor Betrug und Fehlbuchungen zu schützen.


    Sicherheitsstandards und Authentifizierung:

    In Übereinstimmung mit den europäischen Zahlungsdiensterichtlinien (PSD2) setzt
    die Kompass Direktbank konsequent auf die starke Kundenauthentifizierung (SCA).
    Dies bedeutet, dass für alle sensiblen Vorgänge und Online-Zahlungen eine mehrstufige
    Verifizierung erforderlich ist. Keine zustandsändernde Aktion darf ohne vorherige
    Identitätsprüfung des Nutzers durchgeführt werden.


    Haftung und Kartenverlust:

    Bei Verlust oder Diebstahl der Kompass Visa Debitkarte gelten die Haftungsbegrenzungen
    gemäß dem Bürgerlichen Gesetzbuch (BGB). Der Nutzer ist verpflichtet, den Verlust
    unverzüglich zu melden, um den Schaden zu begrenzen. Wir bearbeiten Meldungen
    über Kartenverlust prioritär über die App-Funktionen, um die Karte sofort zu sperren
    und das Risiko unbefugter Abbuchungen zu minimieren.


    Betrugsbekämpfung:

    Reklamationen bezüglich Kartenumsätzen werden unter strikter Einhaltung gesetzlicher
    Fristen bearbeitet. Die Kompass Direktbank prüft jeden Fall auf Basis der vorliegenden
    Transaktionsdaten und der Sicherheitslogs der starken Kundenauthentifizierung.
    Kunden werden darauf hingewiesen, dass eine grobe Fahrlässigkeit (z. B. das Notieren
    des PINs auf der Karte) die Haftungsansprüche gemäß BGB beeinflussen kann.


    Verpflichtung für Agenten:

    Agenten müssen bei der Bearbeitung von Kartenanliegen sicherstellen, dass die
    Identität des Kunden zwingend verifiziert wurde, bevor Karten gesperrt oder Ersatzkarten
    bestellt werden. Informationen zur Haftung müssen präzise und ohne Vermutungen
    auf Basis der BGB-Regelungen kommuniziert werden.'
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 481ec280-46f9-5a07-9a75-f16770cd6c09
  title: 'Aufsichtsrechtliche Hinweise: Zahlungsverkehr'
  body: 'Der Zahlungsverkehr bei der Kompass Direktbank ist nach den Standards des
    SEPA-Raums (Single Euro Payments Area) und den Vorgaben der Bundesbank ausgestaltet.
    Dies gewährleistet eine effiziente und rechtssichere Abwicklung aller Geldtransfers.


    SEPA-Lastschriften und Rückgaben:

    Gemäß den gesetzlichen Bestimmungen für den SEPA-Lastschriftenverkehr haben Kunden
    ein umfassendes Recht auf Rückgabe. Wir wenden die acht-wöchige Rückgabefrist
    für SEPA-Lastschriften konsequent an. Innerhalb dieses Zeitraums können Kunden
    einer Lastschrift widersprechen, ohne dass eine Begründung erforderlich ist. Agenten
    müssen diesen Zeitraum strikt einhalten und Kunden über ihre Rechte informieren.


    Echtzeitüberweisungen:

    Für die Funktion der Echtzeitüberweisung gelten spezifische Sicherheits- und Limitvorgaben.
    Um Geldwäsche und Betrug vorzubeugen, ist für jede Echtzeitüberweisung eine Empfängerüberprüfung
    zwingend erforderlich. Dabei werden Name und IBAN des Empfängers automatisch abgeglichen.
    Das tägliche Limit für diese Transaktionen ist auf 5.000 € begrenzt.


    Identität und Sicherheit:

    Sämtliche Zahlungsanweisungen, insbesondere solche, die den Kontostand ändern,
    unterliegen der starken Kundenauthentifizierung (SCA). Dies schützt den Kunden
    vor nicht autorisierten Zahlungen. Die Kompass Direktbank stellt sicher, dass
    alle Transaktionsdaten verschlüsselt übertragen werden und den europäischen Finanzmarktrichtlinien
    entsprechen.


    Agenten-Richtlinie:

    Agenten dürfen Zahlungsverkehrsvorgänge (wie die Rückgabe einer Lastschrift oder
    das Ausführen einer Überweisung) nur dann einleiten, wenn die Identität des Kunden
    zweifelsfrei verifiziert wurde. Bei Reklamationen im Zahlungsverkehr ist auf die
    Einhaltung der gesetzlichen Fristen zu achten. Informationen zu den Limits der
    Echtzeitüberweisung (5.000 €) müssen exakt so kommuniziert werden.'
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: ebfc84cc-2aab-55bb-b3aa-e74d28e2c90c
  title: Wann get_account_transactions eingesetzt wird
  body: 'Das Werkzeug `get_account_transactions` wird eingesetzt, wenn ein Kunde detaillierte
    Informationen über seine vergangenen oder aktuellen Kontobewegungen benötigt oder
    wenn eine spezifische Transaktion zur Klärung einer Reklamation analysiert werden
    muss.


    Einsatzszenarien:

    - Der Kunde möchte wissen, wann eine bestimmte Zahlung eingegangen ist.

    - Es muss geprüft werden, ob eine Lastschrift bereits ausgeführt wurde.

    - Als Vorstufe für die Einleitung eines Transaction Dispute (`file_transaction_dispute`),
    um die genaue Transaktions-ID zu ermitteln.


    Prozedurales Vorgehen für Agenten:


    1. Identitätsverifizierung: Bevor auf Kontodaten zugegriffen wird, muss die Identität
    des Nutzers zwingend verifiziert werden (SCA-Prinzip). Dies geschieht über die
    Funktion `verify_identity`.

    2. Ermittlung der Konto-ID: Da Kunden oft nur die letzten vier Stellen ihrer IBAN
    oder eine Kontobezeichnung nennen, muss der Agent zuerst `get_accounts` aufrufen,
    um die interne `account_id` des Kunden zu finden.

    3. Abruf der Transaktionen: Mit der validen `account_id` ruft der Agent nun `get_account_transactions`
    auf. Falls der Kunde einen bestimmten Zeitraum nennt, sind diese Parameter im
    Tool-Aufruf zu spezifizieren.

    4. Analyse und Kommunikation: Die vom Tool zurückgegebenen Daten werden dem Kunden
    in klarer, jargonfreier Sprache präsentiert. Es werden keine internen System-IDs
    (wie die Transaktions-ID) dem Kunden vorgelesen, es sei denn, dies ist für den
    weiteren Prozess (z. B. einen Dispute) notwendig.


    Wichtiger Hinweis:

    Der Zugriff auf Transaktionsdaten ist eine hochsensible Aktion. Ein Aufruf von
    `get_account_transactions` ohne vorherige erfolgreiche Verifizierung der Identität
    stellt einen schweren Verstoß gegen die Sicherheitsrichtlinien der Kompass Direktbank
    dar.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: kompass_direktbank
- id: 89cf8b02-5c3e-53d2-96db-ad3a587221a2
  title: Werkzeugreferenz get_account_transactions
  body: 'Das Werkzeug `get_account_transactions` ermöglicht dem Agenten den Abruf
    einer Liste von Transaktionen für ein spezifisches Konto der Kompass Direktbank.


    Signatur:

    `get_account_transactions(account_id: string, start_date: string, end_date: string)`


    Argumente:

    - `account_id`: Die interne Kennung des Kontos (muss zuvor über `get_accounts`
    ermittelt werden).

    - `start_date`: Das Startdatum des Abfragezeitraums im Format YYYY-MM-DD.

    - `end_date`: Das Enddatum des Abfragezeitraums im Format YYYY-MM-DD.


    Effekt:

    Das Tool liefert eine chronologische Liste aller Transaktionen innerhalb des definierten
    Zeitraums, inklusive Betrag, Empfänger/Sender, Datum und Status der Transaktion.


    Durchführung:

    Der Agent führt diese Aktion direkt durch den Aufruf des Tools im System aus.
    Der Kunde muss nicht selbst in der App suchen; der Agent stellt die gewünschten
    Informationen basierend auf den Tool-Ergebnissen direkt im Chat bereit.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: kompass_direktbank
- id: 9ab7abb5-dcb9-5692-bb05-ce9f9f9b9763
  title: Wann file_transaction_dispute eingesetzt wird
  body: 'Das Werkzeug `file_transaction_dispute` wird verwendet, um eine formelle
    Reklamation für eine spezifische Transaktion einzureichen. Dies betrifft in der
    Regel unautorisierte Zahlungen, fehlerhafte Beträge oder nicht erbrachte Leistungen.


    Einsatzszenarien:

    - Meldung eines Betrugsfalls über die Kompass Visa Debitkarte.

    - Widerspruch gegen eine SEPA-Lastschrift innerhalb der acht-wöchigen Rückgabefrist.

    - Reklamation einer doppelt ausgeführten Zahlung.


    Prozedurales Vorgehen für Agenten:


    1. Identitätsverifizierung: Zwingende Verifizierung der Identität des Kunden via
    `verify_identity`.

    2. Transaktionsidentifikation: Der Agent muss die exakte Transaktion identifizieren.
    Hierzu wird `get_account_transactions` verwendet, um die entsprechende Transaktions-ID
    zu finden.

    3. Detailaufnahme: Der Agent fragt den Kunden nach dem Grund der Reklamation (z.
    B. "Betrag falsch", "Nicht autorisiert").

    4. Einleitung des Disputes: Der Agent ruft `file_transaction_dispute` mit der
    Transaktions-ID und dem Grund auf.

    5. Bestätigung: Der Kunde wird über die Priorität der Bearbeitung in der App informiert
    und auf die geltenden gesetzlichen Fristen (z. B. BGB bei Kartenverlust) hingewiesen.


    Besonderheiten:

    Reklamationen werden prioritär behandelt. Agenten müssen darauf achten, dass die
    Fristen für SEPA-Rückgaben (8 Wochen) strikt beachtet werden. Sollte eine Transaktion
    außerhalb der gesetzlichen Fristen liegen, muss dies transparent kommuniziert
    werden, bevor der Tool-Aufruf erfolgt.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: kompass_direktbank
- id: 2f9fd5d5-7457-59eb-b2fa-f86edc024745
  title: Werkzeugreferenz file_transaction_dispute
  body: 'Das Werkzeug `file_transaction_dispute` initiiert einen formalen Reklamationsprozess
    für eine einzelne Transaktion innerhalb der Systeme der Kompass Direktbank.


    Signatur:

    `file_transaction_dispute(transaction_id: string, reason: string)`


    Argumente:

    - `transaction_id`: Die eindeutige Kennung der zu reklamierenden Transaktion (ermittelt
    über `get_account_transactions`).

    - `reason`: Eine detaillierte Beschreibung, warum die Transaktion angefochten
    wird (vom Kunden im Gespräch angegeben).


    Effekt:

    Die Transaktion wird im System als "disputed" markiert und an das zuständige Fachteam
    für Betrugsbekämpfung und Reklamationen zur Prüfung weitergeleitet. Der Kunde
    erhält eine Statusmeldung in der App.


    Durchführung:

    Der Agent löst diesen Vorgang direkt durch den Tool-Aufruf aus. Es ist keine Weiterleitung
    an ein externes Formular oder Portal erforderlich.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: kompass_direktbank
- id: bf86b5b1-9788-5e54-9715-14aaaeea1f48
  title: Wann freeze_card eingesetzt wird
  body: 'Das Werkzeug `freeze_card` wird sofort eingesetzt, wenn ein Kunde den Verlust,
    den Diebstahl oder einen unbefugten Zugriff auf seine Kompass Visa Debitkarte
    meldet. Eine sofortige Sperrung ist essenziell, um weiteren finanziellen Schaden
    zu begrenzen.


    Einsatzszenarien:

    - Kunde hat die Karte verloren.

    - Verdacht auf Kartenklau.

    - Feststellung unautorisierter Transaktionen in den Kontoauszügen.


    Prozedurales Vorgehen für Agenten:


    1. Sofortige Identitätsverifizierung: Aufgrund der Dringlichkeit muss die Identität
    des Kunden via `verify_identity` unmittelbar bestätigt werden.

    2. Kartenidentifikation: Der Agent nutzt `get_accounts`, um die aktive Kompass
    Visa Debitkarte des Kunden zu finden und die entsprechende `card_id` zu extrahieren.

    3. Ausführung der Sperrung: Der Agent ruft das Tool `freeze_card` mit der `card_id`
    auf.

    4. Bestätigung und Folgemaßnahmen: Der Agent bestätigt dem Kunden die erfolgreiche
    Sperrung. Im Falle eines Diebstahls wird der Kunde auf die Haftungsbegrenzung
    gemäß BGB hingewiesen und gefragt, ob eine Ersatzkarte bestellt werden soll (`order_replacement_card`).


    Wichtige Hinweise:

    Die Sperrung einer Karte ist eine zustandsändernde Aktion und erfordert zwingend
    die starke Kundenauthentifizierung (SCA). Agenten dürfen keine Karte sperren,
    ohne dass die Identität des Inhabers zweifelsfrei geklärt ist. Eine gefrorene
    Karte kann nicht mehr für Zahlungen oder Bargeldabhebungen genutzt werden.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: kompass_direktbank
- id: 7e2e44a4-6bac-5c33-8adc-c58cffdbce14
  title: Werkzeugreferenz freeze_card
  body: 'Das Werkzeug `freeze_card` ermöglicht es dem Support-Agenten, eine Kompass
    Visa Debitkarte eines Kunden sofort zu sperren oder eine bestehende Sperrung aufzuheben.
    Diese Aktion ist zustandsändernd und wirkt unmittelbar auf die Karte, sodass keine
    weiteren Zahlungen oder Abhebungen möglich sind, bis die Karte wieder entsperrt
    wird.


    Der Agent führt diese Aktion direkt durch den Aufruf des Werkzeugs aus, ohne dass
    der Kunde eine externe App-Funktion manuell bedienen muss.


    **Signatur und Parameter:**

    - `card_id`: Die eindeutige Kennung der zu sperrenden oder zu entsperrenden Karte
    (aus den Kontodaten des Kunden zu beziehen).

    - `action`: Die gewünschte Aktion, entweder "freeze" (Sperren) oder "unfreeze"
    (Entsperren).


    **Effekt:**

    Die Karte wird in Echtzeit für alle Transaktionen deaktiviert oder wieder aktiviert.
    Der Status der Karte wird im System aktualisiert.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: kompass_direktbank
- id: ae420976-1d00-54a2-9175-dc0700f58156
  title: Wann send_instant_transfer eingesetzt wird
  body: 'Die Echtzeitüberweisung ermöglicht es Kunden, Geld nahezu verzögerungsfrei
    an einen Empfänger zu senden. Gemäß den Produktvorgaben für die Echtzeitüberweisung
    beträgt das tägliche Limit 5.000 € und die Gebühr für diesen Service liegt bei
    0 €.


    Ein Agent setzt das Werkzeug `send_instant_transfer` ein, wenn ein Kunde eine
    sofortige Überweisung wünscht und die Identität bereits erfolgreich verifiziert
    wurde.


    **Vorgehensweise für den Agenten:**

    1. Die Identität des Kunden ist zwingend zu verifizieren.

    2. Mit `get_accounts` wird die `account_id` des Quellkontos (z. B. Kompass Girokonto)
    ermittelt.

    3. Der Agent fragt die notwendigen Details für die Überweisung ab: den vollständigen
    Namen des Empfängers, die IBAN sowie den genauen Betrag.

    4. Es ist sicherzustellen, dass der Betrag das Tageslimit von 5.000 € nicht überschreitet.

    5. Der Agent führt die Transaktion durch den Aufruf von `send_instant_transfer`
    aus. Dabei wird im Hintergrund eine automatische Empfängerüberprüfung durchgeführt,
    um Name und IBAN abzugleichen.


    Nach erfolgreichem Aufruf wird dem Kunden die Ausführung der Echtzeitüberweisung
    bestätigt. Weitere Details zu den Kosten finden sich in der Dokumentation Echtzeitüberweisung
    — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_instant_transfer
  institution_id: kompass_direktbank
- id: 5264198f-f4d0-53ca-b20e-8250a0f5b729
  title: Werkzeugreferenz send_instant_transfer
  body: 'Das Werkzeug `send_instant_transfer` führt eine Echtzeitüberweisung von einem
    Konto des Kunden an eine externe IBAN aus. Diese Aktion ist irreversibel und wird
    erst nach einer erfolgreichen Empfängerüberprüfung (Abgleich von Name und IBAN)
    vollzogen.


    Der Agent führt diesen Vorgang direkt über das Tool aus, nachdem alle erforderlichen
    Daten vom Kunden erhoben wurden.


    **Signatur und Parameter:**

    - `account_id`: Die ID des Kontos, von dem die Gelder abgebucht werden.

    - `beneficiary_name`: Der vollständige Name des Empfängers zur Verifizierung.

    - `beneficiary_iban`: Die Ziel-IBAN der Überweisung.

    - `amount`: Der zu überweisende Betrag (maximal 5.000 € pro Tag).

    - `currency`: Die Währung der Überweisung (standardmäßig EUR).


    **Effekt:**

    Das Geld wird sofort vom Konto des Kunden abgebucht und in Echtzeit an den Empfänger
    übertragen, sofern die Empfängerüberprüfung erfolgreich war und ausreichend Deckung
    vorhanden ist.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - send_instant_transfer
  institution_id: kompass_direktbank
- id: eb7f2161-ce7b-5b16-90e1-94ede13e720d
  title: Wann set_card_limits eingesetzt wird
  body: "Um die Sicherheit zu erhöhen oder die Flexibilität im Alltag anzupassen,\
    \ können Kunden den Verfügungsrahmen ihrer Kompass Visa Debitkarte ändern. Dies\
    \ umfasst sowohl die Limits für Zahlungen als auch die für Bargeldabhebungen.\n\
    \nDer Agent nutzt das Werkzeug `set_card_limits`, wenn ein Kunde eine Anpassung\
    \ dieser Grenzwerte wünscht.\n\n**Vorgehensweise für den Agenten:**\n1. Die Identität\
    \ des Nutzers muss zwingend verifiziert werden.\n2. Über `get_accounts` wird die\
    \ entsprechende `card_id` der Kompass Visa Debitkarte identifiziert.\n3. Der Agent\
    \ erfragt die neuen gewünschten Limits für:\n   - Tägliche/Monatliche Zahlungen\n\
    \   - Bargeldabhebungen\n4. Der Agent prüft, ob die gewünschten Werte innerhalb\
    \ der systemseitigen Maximalgrenzen liegen.\n5. Die Änderung wird durch den Aufruf\
    \ von `set_card_limits` finalisiert.\n\nDer Kunde wird über die erfolgreiche Anpassung\
    \ der Limits informiert. Für allgemeine Informationen zur Karte siehe Kompass\
    \ Visa Debitkarte — Überblick."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: kompass_direktbank
- id: e6a3f926-e263-5dcf-87bf-6c7c7a1a10e4
  title: Werkzeugreferenz set_card_limits
  body: 'Das Werkzeug `set_card_limits` wird verwendet, um den Verfügungsrahmen einer
    Debitkarte für Zahlungen und Bargeldabhebungen zu ändern. Diese Aktion ist zustandsändernd
    und wirkt sofort auf die Karte.


    Der Agent führt diese Anpassung direkt durch den Aufruf des Tools aus.


    **Signatur und Parameter:**

    - `card_id`: Die eindeutige Kennung der betroffenen Kompass Visa Debitkarte.

    - `payment_limit`: Der neue maximale Betrag für Zahlungen (pro Tag oder Monat,
    je nach Systemkonfiguration).

    - `cash_limit`: Der neue maximale Betrag für Bargeldabhebungen.


    **Effekt:**

    Die im System hinterlegten Limits für die spezifische Karte werden aktualisiert.
    Alle zukünftigen Transaktionen werden gegen diese neuen Grenzwerte geprüft.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_card_limits
  institution_id: kompass_direktbank
- id: 5682e1e4-d1ce-5877-903b-fd5292de04df
  title: Wann initiate_account_switch eingesetzt wird
  body: 'Kompass Direktbank unterstützt Neukunden beim Wechsel zu uns durch eine digitale
    Kontowechselhilfe gemäß dem Zahlungskontengesetz. Dieser Service überträgt Daueraufträge,
    Lastschriften und Zahlungspartner vom alten Konto auf das neue Kompass Girokonto.


    Der Agent setzt `initiate_account_switch` ein, wenn ein Kunde den Prozess des
    Kontowechsels starten möchte.


    **Vorgehensweise für den Agenten:**

    1. Die Identität des Nutzers ist zwingend zu verifizieren.

    2. Mit `get_accounts` wird die `account_id` des neuen Kompass Girokontos ermittelt.

    3. Der Agent erfragt die notwendigen Daten des bisherigen Bankinstituts: den Namen
    der alten Bank sowie die alte IBAN.

    4. Der Agent löst den digitalen Prozess durch den Aufruf von `initiate_account_switch`
    aus.


    Der Kunde wird darüber informiert, dass die Übertragung der Mandate und Aufträge
    nun digital eingeleitet wurde und die alte Bank entsprechend benachrichtigt wird.
    Weitere Informationen zum Start finden sich in Kompass Girokonto — Schritt für
    Schritt starten.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: kompass_direktbank
- id: 27326783-b724-5c5e-9a95-1e3a7b5e4670
  title: Werkzeugreferenz initiate_account_switch
  body: 'Das Werkzeug `initiate_account_switch` startet die digitale Kontowechselhilfe.
    Dieser Service automatisiert den Transfer von Daueraufträgen, Lastschriften und
    anderen Zahlungsinformationen von einem Fremdkonto zum Konto bei Kompass Direktbank.


    Der Agent löst diesen Vorgang direkt über den Tool-Aufruf aus.


    **Signatur und Parameter:**

    - `account_id`: Die ID des Zielkontos bei Kompass Direktbank.

    - `old_bank_name`: Der Name des bisherigen Kreditinstituts.

    - `old_iban`: Die IBAN des zu schließenden oder zu wechselnden Altkontos.


    **Effekt:**

    Es wird ein digitaler Antrag an die alte Bank gesendet, um die Übertragung der
    bestehenden Zahlungsverpflichtungen und -aufträge gemäß den gesetzlichen Vorgaben
    einzuleiten.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_account_switch
  institution_id: kompass_direktbank
- id: 80f1fe18-eb46-51bb-90e7-75f2163884e5
  title: Wann update_beneficiary eingesetzt wird
  body: 'Um Zahlungen effizienter zu gestalten, können Kunden eine Liste von Empfängern
    in ihrem Profil pflegen. Dies umfasst das Anlegen neuer Empfänger, das Ändern
    bestehender Daten oder das Löschen veralteter Kontakte.


    Der Agent verwendet das Werkzeug `update_beneficiary`, wenn ein Kunde seine Empfängerliste
    aktualisieren möchte.


    **Vorgehensweise für den Agenten:**

    1. Die Identität des Nutzers muss zwingend verifiziert werden.

    2. Über `get_accounts` wird die `account_id` des betroffenen Kontos ermittelt.

    3. Der Agent klärt mit dem Kunden, welche Aktion gewünscht ist: Anlegen, Ändern
    oder Löschen eines Empfängers.

    4. Je nach Aktion werden die notwendigen Daten abgefragt: vollständiger Name des
    Empfängers und die zugehörige IBAN.

    5. Der Agent führt die Änderung durch den Aufruf von `update_beneficiary` aus.


    Der Kunde erhält eine Bestätigung über die Aktualisierung seiner Empfängerliste.
    Dies erleichtert spätere Vorgänge, wie sie in der Werkzeugreferenz send_instant_transfer
    beschrieben sind.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kompass_direktbank
- id: bf51f6bf-68fe-53bb-bd6b-0c8d3fa7be38
  title: Werkzeugreferenz update_beneficiary
  body: 'Das Werkzeug `update_beneficiary` dient der Verwaltung der Empfängerliste
    eines Kunden. Damit können Namen und IBANs von Zahlungspartnern digital gepflegt
    werden.


    Der Agent führt diese Änderungen direkt über den Tool-Aufruf aus.


    **Signatur und Parameter:**

    - `account_id`: Die ID des Kontos, für das die Empfängerliste verwaltet wird.

    - `beneficiary_name`: Der vollständige Name des Empfängers.

    - `beneficiary_iban`: Die IBAN des Empfängers.

    - `action`: Die durchzuführende Aktion: "add" (Hinzufügen), "edit" (Ändern) oder
    "delete" (Löschen).


    **Effekt:**

    Die Empfängerliste im Kundenprofil wird entsprechend der gewählten Aktion aktualisiert.
    Gelöschte Empfänger werden entfernt, neue werden hinzugefügt und bestehende Datensätze
    werden mit den neuen Informationen überschrieben.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kompass_direktbank
- id: 3c9591e4-52a0-5ec4-b4d9-3b12df5e8015
  title: Wann stop_payment eingesetzt wird
  body: 'Kunden haben das Recht, SEPA-Lastschriften zurückzugeben, Lastschriftmandaten
    zu widersprechen oder bestehende Daueraufträge zu löschen. Bei SEPA-Lastschriften
    wird die gesetzliche acht-wöchige Rückgabefrist konsequent angewandt.


    Der Agent nutzt das Werkzeug `stop_payment`, wenn ein Kunde eine solche Zahlungseinschränkung
    oder Rückabwicklung wünscht.


    **Vorgehensweise für den Agenten:**

    1. Die Identität des Nutzers muss zwingend verifiziert werden.

    2. Über `get_accounts` wird die `account_id` des betroffenen Kontos ermittelt.

    3. Der Agent identifiziert gemeinsam mit dem Kunden die spezifische Transaktion
    (bei Lastschriften) oder den spezifischen Dauerauftrag, der gestoppt werden soll.

    4. Im Falle einer Lastschriftrückgabe prüft der Agent, ob die Transaktion innerhalb
    der acht-wöchigen Frist liegt.

    5. Die entsprechende Aktion wird durch den Aufruf von `stop_payment` ausgeführt.


    Der Kunde wird über den erfolgreichen Stopp der Zahlung oder die Einleitung der
    Rückgabe informiert. Details zur Haftung und rechtlichen Rahmenbedingungen finden
    sich in den Aufsichtsrechtlichen Hinweisen: Zahlungsverkehr.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: kompass_direktbank
- id: 59fdd663-66d1-5aa0-9aa8-53d8022c7b14
  title: Werkzeugreferenz stop_payment
  body: 'Das Werkzeug stop_payment wird vom Agenten direkt aufgerufen, um Zahlungsanweisungen
    rückgängig zu machen oder zu stoppen. Es dient dazu, eine SEPA-Lastschrift zurückzugeben,
    einem bestehenden Lastschriftmandat zu widersprechen oder einen aktiven Dauerauftrag
    endgültig zu löschen.


    **Signatur und Parameter:**

    - `account_id` (string): Die eindeutige Kennung des betroffenen Kontos.

    - `payment_reference` (string): Die Referenznummer der spezifischen Transaktion,
    des Mandats oder des Dauerauftrags.

    - `action_type` (string): Die durchzuführende Aktion (z. B. ''return_direct_debit'',
    ''revoke_mandate'', ''delete_standing_order'').


    **Effekt:**

    Das System führt die entsprechende Stornierung oder Rückbuchung gemäß den gesetzlichen
    Fristen aus. Beispielsweise wird bei SEPA-Lastschriften die acht-wöchige Rückgabefrist
    konsequent angewendet. Der Agent führt diese Aktion durch den direkten Funktionsaufruf
    aus; der Kunde wird nicht an ein externes Formular oder ein Portal verwiesen.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: kompass_direktbank
- id: 0377cf45-f3d4-5f19-99eb-95e0dc1b89b5
  title: Wann manage_authorized_users eingesetzt wird
  body: "Dieses Verfahren beschreibt die Erteilung oder den Widerruf einer Kontovollmacht\
    \ für das Kompass Girokonto. Eine Kontovollmacht erlaubt es einer dritten Person,\
    \ im Namen des Kontoinhabers über das Konto zu verfügen.\n\n**Vorgehensweise für\
    \ den Agenten:**\n\n1. **Identitätsprüfung:** Bevor eine zustandsändernde Aktion\
    \ eingeleitet wird, muss die Identität des Kontoinhabers zwingend verifiziert\
    \ werden (SCA).\n2. **Kontoidentifikation:** Falls der Kunde nur eine Teil-IBAN\
    \ oder die letzten vier Stellen nennt, muss der Agent das Werkzeug get_accounts\
    \ aufrufen, um die korrekte account_id zu ermitteln.\n3. **Datenerfassung:**\n\
    \   - Bei der Erteilung einer Vollmacht: Der Agent erfragt den vollständigen Namen\
    \ und das Geburtsdatum der Person, die bevollmächtigt werden soll.\n   - Beim\
    \ Widerruf: Der Agent erfragt den Namen der Person, deren Vollmacht gelöscht werden\
    \ soll.\n4. **Prüfung der Berechtigung:** Der Agent stellt sicher, dass der Antragsteller\
    \ der rechtmäßige Inhaber des Kontos ist.\n5. **Ausführung:** Der Agent ruft das\
    \ Werkzeug manage_authorized_users mit der ermittelten account_id, den personenbezogenen\
    \ Daten und dem entsprechenden Aktionsbefehl (erteilen oder widerrufen) auf.\n\
    \nNach dem erfolgreichen Tool-Aufruf bestätigt der Agent dem Kunden die Änderung.\
    \ Rechtliche Details zur Kontovollmacht finden sich in den Dokumenten Kompass\
    \ Girokonto — Allgemeine Geschäftsbedingungen und Kompass Girokonto — rechtliche\
    \ Hinweise."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kompass_direktbank
- id: 4390f146-dedf-5e5e-b431-95e1cb9ce56b
  title: Werkzeugreferenz manage_authorized_users
  body: 'Das Werkzeug manage_authorized_users wird vom Agenten verwendet, um die Liste
    der für ein Konto autorisierten Personen zu verwalten. Es ermöglicht die digitale
    Erteilung oder den Widerruf einer Kontovollmacht.


    **Signatur und Parameter:**

    - `account_id` (string): Die eindeutige Kennung des Kontos, für das die Vollmacht
    gilt.

    - `full_name` (string): Der vollständige Name der Person, für die die Vollmacht
    erteilt oder widerrufen wird.

    - `date_of_birth` (string): Das Geburtsdatum der betreffenden Person (nur erforderlich
    bei der Erteilung).

    - `action` (string): Die gewünschte Änderung (''grant'' für Erteilung, ''revoke''
    für Widerruf).


    **Effekt:**

    Das Tool aktualisiert die Berechtigungsmatrix des Kontos in Echtzeit. Bei einer
    Erteilung wird die Person als autorisierter Nutzer hinterlegt; bei einem Widerruf
    wird der Zugriff sofort gesperrt. Der Agent führt diese Änderung direkt über den
    Tool-Aufruf aus, ohne dass der Kunde ein physisches Formular einreichen muss.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: kompass_direktbank
- id: 273e86dc-f6c1-5bc6-af1c-bccd2bccc1cc
  title: Wann get_accounts eingesetzt wird
  body: "Das Werkzeug get_accounts ist die primäre Methode für den Agenten, um die\
    \ mit einem Kunden verknüpfte Kontostruktur aufzulösen. Da Kunden in der Kommunikation\
    \ häufig nur unvollständige Kontodaten (z. B. die letzten vier Stellen der IBAN)\
    \ angeben, dient dieses Tool der präzisen Identifikation des Zielkontos.\n\n**Vorgehensweise\
    \ für den Agenten:**\n\n1. **Sicherstellung der Authentifizierung:** get_accounts\
    \ darf erst aufgerufen werden, nachdem der Nutzer erfolgreich über den Standard-Verifizierungsprozess\
    \ authentifiziert wurde.\n2. **Tool-Aufruf:** Der Agent ruft get_accounts ohne\
    \ weitere Parameter auf. Das System liefert alle Konten zurück, die mit der current_session\
    \ des verifizierten Nutzers verknüpft sind.\n3. **Abgleich und Zuordnung:**\n\
    \   - Der Agent vergleicht die vom Kunden genannten Kontodetails (z. B. \"meine\
    \ Endnummer 1234\") mit den Ergebnissen der Tool-Liste.\n   - Sobald eine Übereinstimmung\
    \ gefunden wurde, extrahiert der Agent die interne account_id.\n4. **Weiterführende\
    \ Aktionen:** Die gewonnene account_id wird als notwendiger Parameter für alle\
    \ weiteren zustandsändernden Werkzeuge (z. B. transfer_funds oder close_account)\
    \ verwendet.\n\nDieser Prozess stellt sicher, dass Aktionen niemals auf einer\
    \ falschen Kontonummer basieren, selbst wenn der Kunde sich bei der Angabe der\
    \ IBAN vertippt hat."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kompass_direktbank
- id: ff3a0946-1187-5217-b3c1-a5e3e8a6522b
  title: Werkzeugreferenz get_accounts
  body: 'Das Werkzeug get_accounts wird vom Agenten aufgerufen, um eine Übersicht
    aller Konten abzurufen, die der aktuell verifizierten Person zugeordnet sind.


    **Signatur und Parameter:**

    - Das Tool besitzt keine Eingabeparameter, da es die Identität des Nutzers aus
    dem gesicherten Kontext der aktuellen Session bezieht.


    **Effekt:**

    Das Werkzeug gibt eine Liste aller aktiven und inaktiven Konten zurück. Zu jedem
    Konto werden die interne account_id, die IBAN, der Kontotyp (z. B. ''girokonto''
    oder ''tagesgeld'') sowie der aktuelle Status übermittelt. Der Agent nutzt diese
    Informationen, um die korrekte account_id für alle weiteren Transaktionen oder
    administrativen Änderungen zu identifizieren. Der Aufruf erfolgt direkt im Chat-Backend
    durch den Agenten.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: kompass_direktbank
- id: 71e1556d-0efd-5cf3-9f67-45c32cfa05de
  title: Wann open_account eingesetzt wird
  body: "Dieses Verfahren regelt die Eröffnung eines neuen Kontos bei der Kompass\
    \ Direktbank. Da wir eine rein digitale Neobank sind, erfolgt der gesamte Prozess\
    \ ohne physische Dokumente.\n\n**Vorgehensweise für den Agenten:**\n\n1. **Identitätsprüfung:**\
    \ Der Agent muss sicherstellen, dass die Identität des Kunden bereits verifiziert\
    \ wurde oder führt die Verifizierung im Rahmen des Onboardings durch.\n2. **Produktwahl:**\
    \ Der Agent ermittelt, welches Produkt der Kunde eröffnen möchte:\n   - Für den\
    \ Alltag: Das Kompass Girokonto (`girokonto`).\n   - Zum Sparen: Das Kompass Tagesgeld\
    \ (`tagesgeld`).\n3. **Informationspflicht:** Der Agent informiert den Kunden\
    \ über die wesentlichen Konditionen des gewählten Produkts (z. B. die monatliche\
    \ Kontoführungsgebühr von 4,90 € für das Girokonto, die ab einem Geldeingang von\
    \ 700 € entfällt).\n4. **Ausführung:** Der Agent ruft das Werkzeug open_account\
    \ mit der entsprechenden product_id auf.\n5. **Bestätigung:** Nach erfolgreicher\
    \ Eröffnung bestätigt der Agent die Erstellung des Kontos und weist auf die weiteren\
    \ Schritte zur Aktivierung hin.\n\nFür detaillierte Informationen zu den Voraussetzungen\
    \ wird auf das Dokument Kompass Girokonto — Voraussetzungen verwiesen."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kompass_direktbank
- id: b9370267-89cb-5406-8a37-cf6b678da846
  title: Werkzeugreferenz open_account
  body: 'Das Werkzeug open_account wird vom Agenten verwendet, um den Prozess der
    Kontoeröffnung digital zu starten und abzuschließen.


    **Signatur und Parameter:**

    - `product_id` (string): Die Kennung des zu eröffnenden Produkts. Zulässige Werte
    sind beispielsweise ''girokonto'' für das Kompass Girokonto oder ''tagesgeld''
    für das Kompass Tagesgeld.


    **Effekt:**

    Das System erstellt ein neues Konto unter der Identität des verifizierten Nutzers,
    generiert eine neue IBAN und weist die entsprechenden Produktkonditionen zu. Der
    Agent führt diesen Schritt direkt aus, wodurch der Kunde nicht manuell durch ein
    App-Menü navigieren muss. Nach erfolgreichem Aufruf ist das Konto im System hinterlegt
    und kann über get_accounts eingesehen werden.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kompass_direktbank
- id: f4b0f279-96c4-54ca-b1fc-3a40dec75973
  title: Wann close_account eingesetzt wird
  body: "Dieses Verfahren beschreibt die dauerhafte Schließung eines Kontos auf Wunsch\
    \ des Kunden. Eine Kontoschließung ist ein irreversibler Vorgang.\n\n**Vorgehensweise\
    \ für den Agenten:**\n\n1. **Identitätsprüfung:** Aufgrund der Irreversibilität\
    \ der Aktion ist eine strikte Identitätsprüfung (SCA) zwingend erforderlich.\n\
    2. **Kontoidentifikation:** Der Agent nutzt get_accounts, um die exakte account_id\
    \ des zu schließenden Kontos zu ermitteln.\n3. **Kontostandsprüfung:**\n   - Das\
    \ Konto muss idealerweise ein Guthaben von 0,00 € aufweisen.\n   - Besteht noch\
    \ ein Guthaben, muss der Agent den Kunden bitten, dieses auf ein anderes Konto\
    \ zu transferieren oder eine Auszahlungsadresse anzugeben.\n4. **Kündigungsbestätigung:**\
    \ Der Agent fragt explizit ab, ob der Kunde das Konto endgültig schließen möchte\
    \ und weist auf etwaige Auswirkungen (z. B. Verlust des Zugangs zu verknüpften\
    \ Karten) hin.\n5. **Ausführung:** Der Agent ruft das Werkzeug close_account mit\
    \ der entsprechenden account_id auf.\n6. **Abschluss:** Der Agent bestätigt die\
    \ Schließung und informiert über den Erhalt einer schriftlichen Bestätigung per\
    \ E-Mail.\n\nWeitere Informationen zum Prozess der Kündigung finden sich in Kompass\
    \ Girokonto — kündigen, schließen oder den Tarif wechseln."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kompass_direktbank
- id: 193398ad-a0a0-5932-a99c-5adafe7c39fc
  title: Werkzeugreferenz close_account
  body: 'Das Werkzeug close_account wird vom Agenten verwendet, um ein bestehendes
    Konto dauerhaft und unwiderruflich zu schließen.


    **Signatur und Parameter:**

    - `account_id` (string): Die eindeutige Kennung des Kontos, das geschlossen werden
    soll.


    **Effekt:**

    Das Konto wird im System auf den Status ''geschlossen'' gesetzt. Alle damit verbundenen
    Dienste, wie z. B. eine Kompass Visa Debitkarte, werden ebenfalls deaktiviert.
    Der Zugriff auf das Konto über die App wird unterbunden. Da dieser Vorgang irreversibel
    ist, führt der Agent diesen Aufruf nur nach expliziter Zustimmung und erfolgreicher
    Verifizierung des Nutzers aus.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kompass_direktbank
- id: b57c4766-d506-5de0-b29e-312497baeef7
  title: Wann update_contact_info eingesetzt wird
  body: "Dieses Verfahren beschreibt die Aktualisierung der persönlichen Kontaktdaten\
    \ eines Kunden. Korrekte Daten sind essenziell für die Erreichbarkeit und die\
    \ Erfüllung gesetzlicher Meldeauflagen.\n\n**Vorgehensweise für den Agenten:**\n\
    \n1. **Identitätsprüfung:** Da Kontaktinformationen sensibel sind und zur Kommunikation\
    \ wichtiger rechtlicher Hinweise genutzt werden, muss die Identität des Nutzers\
    \ vor jeder Änderung verifiziert werden.\n2. **Datenerhebung:** Der Agent erfragt\
    \ präzise die aktualisierten Informationen. Dies kann umfassen:\n   - Neue Wohnanschrift\
    \ (Straße, Hausnummer, PLZ, Ort).\n   - Neue E-Mail-Adresse.\n   - Neue Telefonnummer.\n\
    3. **Validierung:** Der Agent prüft die Daten auf Plausibilität (z. B. Format\
    \ der E-Mail-Adresse oder korrekte Ziffernanzahl der Telefonnummer).\n4. **Ausführung:**\
    \ Der Agent ruft das Werkzeug update_contact_info mit den neuen Datensätzen auf.\n\
    5. **Bestätigung:** Der Agent informiert den Kunden darüber, dass die Änderungen\
    \ sofort wirksam sind und sendet eine Bestätigung an die neue Kontaktadresse,\
    \ sofern dies systemseitig vorgesehen ist.\n\nBei Fragen zum Datenschutz und zur\
    \ Verarbeitung dieser Daten wird auf das Dokument Kompass Girokonto — Datenschutz\
    \ und Datenverarbeitung verwiesen."
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kompass_direktbank
- id: 570b473e-e5d3-5fe4-a321-de8fe9e486eb
  title: Werkzeugreferenz update_contact_info
  body: 'Das Werkzeug `update_contact_info` dient dazu, die hinterlegten Stammdaten
    eines Kunden im System zu aktualisieren. Der Support-Agent führt diese Aktion
    direkt durch den Aufruf des Tools aus, ohne dass der Kunde auf ein externes Portal
    verwiesen wird.


    **Signatur und Parameter:**

    - `new_address` (String, optional): Die vollständige neue Anschrift des Kunden
    (Straße, Hausnummer, PLZ, Ort).

    - `new_email` (String, optional): Die neue E-Mail-Adresse für die digitale Kommunikation.

    - `new_phone` (String, optional): Die neue Telefonnummer für Kontaktzwecke und
    Sicherheitsbenachrichtigungen.


    **Effekt:**

    Die angegebenen Felder werden im Kundenprofil aktualisiert. Wenn nur ein Parameter
    übergeben wird, bleiben die anderen bestehenden Daten unverändert. Die Änderung
    wird sofort wirksam und ist für alle nachfolgenden systeminternen Prozesse sowie
    für die Adressierung von physischen Dokumenten (z. B. Ersatzkarten) relevant.
    Eine Bestätigung der Änderung erfolgt nach erfolgreichem Tool-Aufruf automatisch
    an die neue E-Mail-Adresse.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kompass_direktbank
- id: 27f29fc0-09df-51bf-9d68-e3b0a5e0c2ff
  title: Wann get_statements eingesetzt wird
  body: 'Die Bereitstellung von Kontoauszügen erfolgt digital und effizient über den
    Support-Chat, wenn Kunden einen Nachweis über ihre Transaktionen benötigen oder
    eine spezifische Periode prüfen möchten. Da Kontoauszüge sensible Finanzdaten
    enthalten, ist die strikte Einhaltung der Verifizierungsprozesse zwingend.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Vor jedem Zugriff auf Kontodaten muss die Identität
    des Nutzers zwingend verifiziert werden. Nutzen Sie hierzu die vorgesehenen Authentifizierungsmethoden.

    2. **Kontenermittlung:** Da Kunden oft nur eine Teil-IBAN oder die letzten vier
    Stellen ihrer Kontonummer angeben, muss der Agent zunächst das Tool `get_accounts`
    aufrufen, um die korrekte interne `account_id` für das betreffende Konto (z. B.
    das Kompass Girokonto) zu ermitteln.

    3. **Zeitraum und Format klären:** Der Agent fragt den Kunden nach dem gewünschten
    Zeitraum (Start- und Enddatum) sowie dem bevorzugten Format (sofern mehrere Optionen
    verfügbar sind).

    4. **Tool-Ausführung:** Nach Vorliegen der `account_id` und des Zeitraums ruft
    der Agent das Tool `get_statements` auf.

    5. **Übermittlung:** Der Agent bestätigt dem Kunden die Bereitstellung des Dokuments
    über den digitalen Kanal.


    Das Tool `get_statements` ist der autoritative Mechanismus, um die Dokumente im
    Gespräch zu generieren. Der Kunde darf nicht auf die App verwiesen werden, wenn
    er die Unterstützung des Agenten in Anspruch nimmt, es sei denn, die Sicherheitsrichtlinien
    fordern explizit einen Self-Service-Download für bestimmte Archiv-Zeiträume.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kompass_direktbank
- id: 3b0b200f-236c-5105-8952-2e22930c234e
  title: Werkzeugreferenz get_statements
  body: 'Das Werkzeug `get_statements` wird verwendet, um offizielle Kontoauszüge
    für ein spezifisches Konto über einen definierten Zeitraum zu generieren und bereitzustellen.
    Der Agent führt diese Aktion direkt im Chat durch.


    **Signatur und Parameter:**

    - `account_id` (String): Die eindeutige interne Kennung des Kontos, welche zuvor
    über `get_accounts` ermittelt wurde.

    - `start_date` (String): Das Startdatum des gewünschten Zeitraums im Format JJJJ-MM-TT.

    - `end_date` (String): Das Enddatum des gewünschten Zeitraums im Format JJJJ-MM-TT.


    **Effekt:**

    Das System generiert die entsprechenden Kontoauszüge als digitale Dokumente. Das
    Ergebnis wird dem Agenten zurückgegeben, damit dieser dem Kunden den Zugriff auf
    die Dokumente ermöglichen kann. Sollte für den gewählten Zeitraum keine Aktivität
    vorliegen, gibt das Tool einen entsprechenden Hinweis zurück. Die Generierung
    erfolgt in Echtzeit auf Basis der aktuellen Kontostände und verbuchten Umsätze.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kompass_direktbank
- id: 9ae22fb2-cab9-56e0-8c71-bfc1d4164c42
  title: Wann set_alerts eingesetzt wird
  body: 'Um unseren Kunden eine bessere Kontrolle über ihre Finanzen zu ermöglichen,
    bietet Kompass Direktbank eine flexible Benachrichtigungsfunktion an. Der Agent
    nutzt das Tool `set_alerts`, wenn Kunden spezifische Schwellenwerte für ihre Kontobewegungen
    festlegen möchten, um beispielsweise eine Unterdeckung zu vermeiden.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Zwingend ist die Verifizierung der Identität des Nutzers
    vor jeder zustandsändernden Aktion.

    2. **Kontoidentifikation:** Der Agent verwendet das Tool `get_accounts`, um die
    `account_id` des Kontos zu finden, für das die Benachrichtigungen eingerichtet
    werden sollen.

    3. **Definition der Alert-Kriterien:** Der Agent klärt mit dem Kunden, welche
    Art von Benachrichtigung gewünscht ist (z. B. Kontostand unter einem bestimmten
    Betrag) und welchen konkreten Schwellenwert der Kunde festlegen möchte.

    4. **Tool-Ausführung:** Mit den vorliegenden Informationen (Konto-ID, Alert-Typ
    und Betrag) ruft der Agent das Tool `set_alerts` auf.

    5. **Bestätigung:** Der Agent bestätigt dem Kunden, dass der Alarm nun aktiv ist
    und unter welchen Bedingungen eine Nachricht gesendet wird.


    Der Agent erledigt diesen Vorgang vollständig digital im Gespräch. Eine manuelle
    Einrichtung durch den Kunden in der App ist zwar möglich, jedoch ist der direkte
    Tool-Aufruf durch den Agenten der primäre Weg zur Unterstützung im Chat.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kompass_direktbank
- id: 667d3be6-ea4b-5b91-be0c-8bfa4bfa4d68
  title: Werkzeugreferenz set_alerts
  body: 'Das Werkzeug `set_alerts` ermöglicht es dem Agenten, automatisierte Benachrichtigungen
    für die Konten eines Kunden zu konfigurieren. Der Agent führt die Aktion durch
    direkten Aufruf des Tools aus.


    **Signatur und Parameter:**

    - `account_id` (String): Die interne Kennung des betroffenen Kontos (vorher via
    `get_accounts` zu ermitteln).

    - `alert_type` (String): Die Art der Benachrichtigung (z. B. `balance_below_threshold`
    für einen Mindeststand oder `large_transaction` für hohe Einzelumsätze).

    - `threshold` (Number): Der numerische Betrag in Euro, der den Alarm auslöst.


    **Effekt:**

    Das System speichert die Alarmbedingung für das angegebene Konto. Sobald die Bedingung
    in der Zukunft erfüllt wird, versendet die digitale Infrastruktur von Kompass
    Direktbank automatisch eine Push-Benachrichtigung über die App an den Kunden.
    Bestehende Alarme desselben Typs für dieses Konto werden durch den neuen Aufruf
    überschrieben.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kompass_direktbank
- id: 97e83478-a735-5a93-8ac3-ff72818438e1
  title: Wann transfer_funds eingesetzt wird
  body: 'Das Tool `transfer_funds` wird verwendet, um Standard-Überweisungen zwischen
    Konten oder an externe Empfänger durchzuführen. Dies ist der reguläre Weg für
    Geldtransfers, die keine sofortige Echtzeit-Ausführung erfordern.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Die Identität des Nutzers muss zwingend verifiziert
    werden, bevor eine Zahlung initiiert wird.

    2. **Kontenermittlung:** Der Agent nutzt `get_accounts`, um die `account_id` des
    Absenderkontos zu identifizieren.

    3. **Zahlungsdetails erfassen:** Der Agent fragt die notwendigen Informationen
    ab: die IBAN des Empfängers, den genauen Betrag in Euro sowie einen optionalen
    Verwendungszweck.

    4. **Tool-Ausführung:** Der Agent ruft das Tool `transfer_funds` mit den gesammelten
    Daten auf.

    5. **Abschluss:** Der Agent bestätigt die erfolgreiche Auftragserteilung.


    **Wichtige Unterscheidungen:**

    - Wenn der Kunde explizit eine sofortige Überweisung wünscht (bis zu einem Limit
    von 5.000 € täglich), sollte der Agent prüfen, ob die Echtzeitüberweisung die
    bessere Option ist. Details hierzu finden sich in `Echtzeitüberweisung — Überblick`.

    - Für die Verwaltung von Empfängern ist das Tool `update_beneficiary` zuständig.


    Der Agent führt die Transaktion direkt aus. Der Kunde wird nicht auf die App verwiesen,
    um den Transfer dort selbst zu starten.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kompass_direktbank
- id: 981f70a1-d9df-545b-a5f4-e9b8febab82a
  title: Werkzeugreferenz transfer_funds
  body: 'Das Werkzeug `transfer_funds` führt eine Standard-Geldüberweisung von einem
    Kompass-Konto an eine angegebene IBAN aus. Der Agent führt diesen Vorgang direkt
    aus.


    **Signatur und Parameter:**

    - `from_account_id` (String): Die interne ID des Kontos, von dem das Geld abgebucht
    wird (via `get_accounts` ermittelt).

    - `to_iban` (String): Die vollständige IBAN des Empfängers.

    - `amount` (Number): Der zu überweisende Betrag in Euro.

    - `currency` (String): Die Währung (Standard ist "EUR").

    - `description` (String, optional): Der Verwendungszweck für den Zahlungsempfänger.


    **Effekt:**

    Das System initiiert den Zahlungsauftrag. Der Betrag wird vom Absenderkonto reserviert
    bzw. abgebucht und gemäß den SEPA-Standards an die Zielbank übermittelt. Die Ausführung
    erfolgt im Standard-Zahlungszyklus der Bank.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: kompass_direktbank
- id: db0a5199-5b4f-5d28-b533-b7f1b9a0c481
  title: Wann order_replacement_card eingesetzt wird
  body: 'Wenn Kunden ihre Karte verloren haben, diese gestohlen wurde oder die Karte
    physisch beschädigt ist, unterstützt der Agent die Bestellung einer neuen Karte
    über das Tool `order_replacement_card`.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Vor jeder zustandsändernden Aktion ist eine zwingende
    Verifizierung der Identität des Nutzers erforderlich.

    2. **Sicherungsmaßnahmen (bei Verlust/Diebstahl):** Falls die Karte verloren ging
    oder gestohlen wurde, muss der Agent sofort das Tool `freeze_card` aufrufen, um
    weiteren Missbrauch zu verhindern. Dies hat höchste Priorität.

    3. **Kontoidentifikation:** Über das Tool `get_accounts` ermittelt der Agent die
    `account_id`, zu der die Karte (z. B. die Kompass Visa Debitkarte) zugeordnet
    ist.

    4. **Adressprüfung:** Der Agent prüft, ob die im System hinterlegte Adresse noch
    aktuell ist. Falls nicht, muss zuerst `update_contact_info` verwendet werden.

    5. **Tool-Ausführung:** Der Agent ruft `order_replacement_card` mit dem Grund
    der Ersatzbestellung und der Versandadresse auf.

    6. **Bestätigung:** Der Agent informiert den Kunden über die voraussichtliche
    Zustellungsdauer.


    Weitere Informationen zur Karte finden sich in `Kompass Visa Debitkarte — Überblick`.
    Die Bestellung erfolgt direkt durch den Agenten; der Kunde muss keinen separaten
    Antrag in der App stellen.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: kompass_direktbank
- id: 19eb8cb6-b8ad-599a-8444-a61732a66928
  title: Werkzeugreferenz order_replacement_card
  body: 'Das Werkzeug `order_replacement_card` löst den Versand einer neuen physischen
    Debitkarte an den Kunden aus. Der Agent führt diese Aktion direkt durch.


    **Signatur und Parameter:**

    - `account_id` (String): Die interne Kennung des Kontos, für das die Karte bestellt
    wird (via `get_accounts` ermittelt).

    - `reason` (String): Der Grund für den Ersatz (z. B. "lost", "stolen", "damaged"
    oder "expired").

    - `shipping_address` (String): Die vollständige Adresse, an die die Karte versendet
    werden soll.


    **Effekt:**

    Das System gibt den Auftrag zur Produktion und zum Versand einer neuen Kompass
    Visa Debitkarte frei. Die alte Karte wird (falls nicht bereits durch `freeze_card`
    geschehen) dauerhaft gesperrt, sofern der Grund "lost" oder "stolen" ist. Der
    Kunde erhält eine Benachrichtigung über den Versand.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: kompass_direktbank
- id: 5b8876ce-e852-51dd-b3fb-a7b1b55df7db
  title: Wann pay_bill eingesetzt wird
  body: 'Das Tool `pay_bill` wird eingesetzt, wenn Kunden eine spezifische Rechnung
    über den Support-Kanal begleichen möchten, anstatt eine allgemeine Überweisung
    zu nutzen. Dies ermöglicht eine präzisere Zuordnung von Rechnungsbeträgen.


    **Vorgehensweise für den Agenten:**


    1. **Identitätsprüfung:** Vor jeder Zahlung muss die Identität des Nutzers zwingend
    verifiziert werden.

    2. **Kontoidentifikation:** Der Agent nutzt `get_accounts`, um die `account_id`
    des Kontos zu ermitteln, von dem die Zahlung abgehen soll.

    3. **Rechnungsdetails erfassen:** Der Agent fragt alle notwendigen Daten der Rechnung
    ab: Name des Gläubigers, IBAN des Zahlungsempfängers, den exakten Rechnungsbetrag
    in Euro sowie die Rechnungsnummer oder Referenz.

    4. **Tool-Ausführung:** Der Agent ruft das Tool `pay_bill` mit diesen detaillierten
    Informationen auf.

    5. **Abschluss:** Der Agent bestätigt dem Kunden, dass die Rechnung erfolgreich
    zur Zahlung angewiesen wurde.


    Der Agent erledigt diesen Vorgang vollständig digital. Es erfolgt keine Weiterleitung
    des Kunden an externe Formulare oder Portale.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: kompass_direktbank
- id: 2eabbc89-7e4a-552d-b8ce-d95f39dd6e98
  title: Werkzeugreferenz pay_bill
  body: 'Das Werkzeug `pay_bill` wird vom Agenten verwendet, um eine direkte Zahlung
    einer Rechnung vom Konto des Kunden an einen Zahlungsempfänger auszuführen. Der
    Agent führt diese Aktion durch den direkten Aufruf des Tools aus, ohne den Kunden
    an ein externes Portal oder ein Formular zu verweisen.


    **Signatur und Parameter:**

    - `account_id`: Die eindeutige Kennung des Kontos, von dem die Zahlung abgeht.
    Dieser Wert wird zuvor über das Werkzeug `get_accounts` ermittelt.

    - `amount`: Der zu zahlende Betrag in Euro (z. B. 45,50 €).

    - `recipient_iban`: Die IBAN des Zahlungsempfängers, die vom Kunden bereitgestellt
    wird.

    - `payment_reference`: Der Verwendungszweck oder die Rechnungsnummer, wie sie
    vom Kunden angegeben wird.


    **Effekt:**

    Das Tool löst eine sofortige Überweisung des angegebenen Betrags vom `Kompass
    Girokonto` des Kunden an die Ziel-IBAN aus. Nach erfolgreichem Aufruf wird die
    Transaktion im Kontoverlauf verbucht und dem Kunden eine Bestätigung über die
    ausgeführte Zahlung angezeigt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: kompass_direktbank
- id: 71b424b4-5ee6-5357-992e-d1cee2b7cf61
  title: Wann activate_card eingesetzt wird
  body: 'Um die Sicherheit der Kunden zu gewährleisten, werden physische Karten, wie
    die `Kompass Visa Debitkarte`, in einem inaktiven Zustand versandt. Damit der
    Kunde die Karte für Zahlungen und Bargeldabhebungen weltweit nutzen kann, muss
    diese vor dem ersten Einsatz aktiviert werden. Das Werkzeug `activate_card` ist
    der autoritative Mechanismus, mit dem der Agent diese Aktivierung im System vornimmt.


    **Voraussetzungen und Prozess:**

    Die Aktivierung einer Karte ist eine zustandsändernde Aktion und erfordert daher
    zwingend eine erfolgreiche Identitätsprüfung des Nutzers mittels starker Kundenauthentifizierung
    (SCA).


    **Schritte zur Durchführung:**

    1. **Identitätsprüfung:** Der Agent stellt sicher, dass die Identität des Kunden
    vollständig verifiziert wurde (z. B. über die In-App-Verifizierung).

    2. **Kontoverknüpfung auflösen:** Da für die Aktivierung die systeminterne Konto-ID
    erforderlich ist, ruft der Agent zuerst `get_accounts` auf, um die `account_id`
    basierend auf den Angaben des Kunden (z. B. den letzten vier Stellen der IBAN)
    zu ermitteln.

    3. **Kartenaktivierung:** Der Agent führt das Werkzeug `activate_card` aus, indem
    er die ermittelte `account_id` und gegebenenfalls die spezifische Kartenkennung
    übergibt.

    4. **Bestätigung:** Der Agent bestätigt dem Kunden direkt im Chat, dass die Karte
    nun aktiviert ist und ab sofort für Transaktionen genutzt werden kann.


    Der Agent darf den Kunden nicht an eine externe Webseite oder ein physisches Formular
    verweisen, sondern muss den Vorgang innerhalb der Konversation durch den Tool-Aufruf
    abschließen. Weitere Informationen zum Kartenmanagement finden sich in der Dokumentation
    zur `Kompass Visa Debitkarte — Überblick`.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: kompass_direktbank
- id: 6d8471c3-675c-55f0-acf7-c74703cc04f0
  title: Werkzeugreferenz activate_card
  body: 'Das Werkzeug `activate_card` dient dazu, eine zuvor versandte und inaktive
    Karte für die Nutzung freizuschalten. Der Agent führt diesen Vorgang direkt aus,
    sobald die Identität des Kunden verifiziert wurde.


    **Signatur und Parameter:**

    - `account_id`: Die eindeutige Kennung des Kontos, mit dem die Karte verknüpft
    ist. Dieser Wert muss zuvor über das Werkzeug `get_accounts` aufgelöst werden.

    - `card_id`: Die spezifische Kennung der zu aktivierenden Karte. Falls der Kunde
    diese nicht kennt, kann sie über die Kontodetails im System ermittelt werden.


    **Effekt:**

    Der Status der entsprechenden Karte (z. B. der `Kompass Visa Debitkarte`) wird
    im Kernbanksystem von „inaktiv“ auf „aktiv“ gesetzt. Damit ist die Karte sofort
    für alle im Rahmen des Preis- und Leistungsverzeichnisses vorgesehenen Transaktionen
    einsatzbereit. Der Agent erhält eine Bestätigung über den erfolgreichen Statuswechsel,
    die er an den Kunden weitergibt.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: kompass_direktbank
- id: e152770c-2ed3-5434-a6d7-99c854f288fc
  title: Wann dispute_status eingesetzt wird
  body: 'Wenn Kunden Reklamationen oder Betrugsmeldungen über die App eingereicht
    haben, besteht oft der Wunsch, den aktuellen Bearbeitungsstand dieser Vorgänge
    zu erfahren. Da Kompass Direktbank Reklamationen prioritär bearbeitet und sich
    strikt an gesetzliche Fristen hält (wie etwa die acht-wöchige Rückgabefrist für
    SEPA-Lastschriften), ist eine transparente Kommunikation über den Status essenziell.
    Das Werkzeug `dispute_status` ist die maßgebliche Quelle, um diese Informationen
    abzurufen.


    **Voraussetzungen und Prozess:**

    Da die Abfrage des Status von Reklamationen sensible Kontodaten und Informationen
    über laufende Prüfverfahren beinhaltet, ist eine vorherige Identitätsverifizierung
    des Nutzers obligatorisch.


    **Schritte zur Durchführung:**

    1. **Identitätsprüfung:** Der Agent verifiziert die Identität des Kunden gemäß
    den Sicherheitsrichtlinien für sensitive Vorgänge.

    2. **Kontoidentifikation:** Der Agent nutzt `get_accounts`, um die `account_id`
    des Kunden zu ermitteln, damit sichergestellt ist, dass nur Reklamationen des
    verifizierten Kontoinhabers eingesehen werden.

    3. **Statusabfrage:** Der Agent führt das Werkzeug `dispute_status` aus. Hierbei
    wird entweder die vom Kunden genannte Reklamationsnummer oder die systemintern
    verknüpfte `dispute_id` verwendet.

    4. **Information an den Kunden:** Der Agent übermittelt den aktuellen Status (z.
    B. „In Prüfung“, „Erledigt“ oder „Rückzahlung eingeleitet“) klar und transparent
    an den Kunden.


    Der Agent führt diese Aktion direkt im Dialog aus und verweist nicht auf externe
    Portale. Für Informationen zum ursprünglichen Einreichen einer Reklamation siehe
    `Werkzeugreferenz file_transaction_dispute`.'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: kompass_direktbank
- id: 8469f687-f6b1-53e3-8243-a13d96010138
  title: Werkzeugreferenz dispute_status
  body: 'Das Werkzeug `dispute_status` ermöglicht es dem Agenten, den aktuellen Fortschritt
    und den Status einer eingereichten Transaktionsreklamation oder Betrugsmeldung
    abzufragen. Der Agent ruft dieses Werkzeug direkt auf, um dem Kunden eine präzise
    Auskunft zu geben.


    **Signatur und Parameter:**

    - `dispute_id`: Die eindeutige Referenznummer der Reklamation. Diese Nummer wurde
    dem Kunden bei der Einreichung des Disputes (z. B. über das Tool `file_transaction_dispute`)
    mitgeteilt oder kann aus den Kontodaten abgelesen werden.


    **Effekt:**

    Das Tool gibt den aktuellen Bearbeitungsstatus der Reklamation zurück. Dies umfasst
    Informationen darüber, ob der Fall noch geprüft wird, ob weitere Unterlagen erforderlich
    sind oder ob die Haftungsbegrenzung gemäß BGB bereits angewandt und die Erstattung
    vorgenommen wurde. Der Agent nutzt diese Information, um den Kunden unterstützend
    über den weiteren Verlauf zu informieren.'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: kompass_direktbank
