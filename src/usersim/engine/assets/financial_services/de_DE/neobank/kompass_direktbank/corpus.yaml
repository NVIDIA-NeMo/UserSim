- id: fcb23aaf-2ed8-57ce-90d9-cce942d83d45
  title: Echtzeitüberweisung — zwischen Tarifen wählen
  body: 'Bei der Kompass Direktbank bieten wir Ihnen die Wahl zwischen der klassischen
    SEPA-Überweisung und der modernen Echtzeitüberweisung. Beide Optionen sind in
    unser digitales Modell integriert.


    **Vergleich der Merkmale:**


    | Merkmal | Klassische Überweisung | Echtzeitüberweisung |

    | :--- | :--- | :--- |

    | **Geschwindigkeit** | 1-2 Werktage | In wenigen Sekunden |

    | **Kosten** | 0 € | 0 € |

    | **Tägliches Limit** | Individuell / Höher | 5.000 € |

    | **Verfügbarkeit** | Werktage | 24/7/365 |

    | **Sicherheit** | Standard-Prüfung | Starke Kundenauthentifizierung & Empfängerüberprüfung
    |


    **Welche Option passt zu Ihnen?**

    - Die **Echtzeitüberweisung** ist die ideale Wahl für dringende Zahlungen, Mietzahlungen
    am Stichtag oder Geldtransfers an Freunde und Familie, die sofort verfügbar sein
    müssen. Sie profitieren hier von maximaler Geschwindigkeit bei einer Gebühr von
    0 € und einem komfortablen Limit von 5.000 €.

    - Die **klassische Überweisung** eignet sich für größere Beträge, die das tägliche
    Echtzeitlimit von 5.000 € überschreiten, oder für Zahlungen, bei denen die Geschwindigkeit
    keine Rolle spielt.


    Beide Optionen spiegeln unsere Philosophie der maximalen Transparenz wider: Keine
    versteckten Gebühren, nur effiziente digitale Prozesse.'
