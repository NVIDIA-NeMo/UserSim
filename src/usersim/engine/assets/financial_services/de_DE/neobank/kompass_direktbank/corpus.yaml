    Bevor eine Karte beantragt werden kann, muss die Identität des Kunden zwingend
    verifiziert sein. Prüfen Sie, ob der Kunde den Onboarding-Prozess (inklusive VideoIdent
    oder eID) erfolgreich abgeschlossen hat. Ohne eine gültige Verifizierung ist die
    Herausgabe von Kartendaten oder die Bestellung einer physischen Karte nicht möglich.


    **Schritt 2: Beantragung der Karte**

    Der Kunde kann die Kompass Visa Debitkarte direkt in der App anfordern. Weisen
    Sie den Kunden darauf hin, dass die Karte mit einer Jahresgebühr von 0 € kostenfrei
    ist. Es ist keine separate Auswahl eines Kartenpakets erforderlich, da die Debitkarte
    Standard für unser digitales Banking ist.


    **Schritt 3: Versand und Erhalt**

    Nach der Beantragung wird die Karte an die hinterlegte Adresse versandt. Der Versand
    erfolgt in der Regel innerhalb weniger Werktage. Der Kunde kann den Status der
    Bestellung in der App einsehen.


    **Schritt 4: Aktivierung und erste Nutzung**

    Nach Erhalt der physischen Karte muss diese über die App aktiviert werden. Dieser
    Vorgang ist Teil der starken Kundenauthentifizierung (SCA). Sobald die Aktivierung
    erfolgt ist, kann die Karte weltweit für Zahlungen eingesetzt werden.


    **Wichtige Informationen für den Kunden:**

    - **Kosten:** Die Karte ist mit 0 € Jahresgebühr kostenlos.

    - **Währungen:** Es fällt ein Fremdwährungsentgelt von 0 % an, was sie ideal für
    Reisen macht.

    - **Bargeld:** Informieren Sie den Kunden über den Mindestbetrag für kostenlose
    Bargeldabhebungen in Höhe von 50 €, um spätere Rückfragen im Chat zu vermeiden.


    Sollte der Kunde Probleme bei der Aktivierung haben, führen Sie ihn durch den
    Prozess der App-Aktualisierung oder verweisen Sie auf die Dokumentation Kompass
    Visa Debitkarte — Probleme mit Zugang oder Login.'
