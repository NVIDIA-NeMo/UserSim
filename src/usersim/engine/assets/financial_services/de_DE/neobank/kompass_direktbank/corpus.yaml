- id: fbc5e000-8e96-5761-8204-19f843d684c5
  title: Kompass Girokonto — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Um Ihr Kompass Girokonto optimal zu schützen, ist es wichtig, die gängigen
    Betrugsmuster zu kennen, die speziell auf digitale Bankdienstleistungen abzielen.
    Betrüger versuchen oft, durch soziale Manipulation (Social Engineering) Zugang
    zu Ihren Kontodaten zu erlangen.


    Ein häufiges Muster ist das sogenannte Phishing. Hierbei erhalten Sie E-Mails
    oder SMS, die täuschend echt aussehen und angeblich von der Kompass Direktbank
    stammen. Diese Nachrichten fordern Sie oft auf, dringend Ihre Daten zu aktualisieren
    oder ein Konto zu entsperren, indem Sie auf einen Link klicken. Bitte beachten
    Sie: Wir werden Sie niemals per E-Mail oder SMS dazu auffordern, Ihre PIN, Ihr
    Passwort oder TANs auf einer externen Webseite einzugeben.


    Ein weiteres Risiko ist der sogenannte „Support-Betrug“. Dabei geben sich Personen
    am Telefon als Mitarbeiter unseres Sicherheitsteams aus. Sie behaupten, verdächtige
    Aktivitäten auf Ihrem Konto festgestellt zu haben, und bitten Sie, Geld auf ein
    „Sicherungskonto“ zu überweisen oder eine Transaktion zur „Verifizierung“ rückgängig
    zu machen. Dies ist immer ein Betrugsversuch. Die Kompass Direktbank wird Sie
    niemals bitten, Gelder auf andere Konten zu transferieren, um Ihr eigenes Konto
    zu schützen.


    Sollten Sie eine verdächtige Nachricht erhalten haben oder den Verdacht hegen,
    dass Ihre Daten kompromittiert wurden, melden Sie dies bitte prioritär über die
    In-App-Funktionen in unserer App. Je schneller eine Meldung erfolgt, desto effektiver
    können wir Ihr Konto schützen. Bei einem Verlust Ihrer Karte wenden wir die Haftungsbegrenzung
    gemäß BGB konsequent an, sofern Sie uns den Verlust unverzüglich melden.


    Zusätzlich setzen wir für alle sensiblen Vorgänge die starke Kundenauthentifizierung
    (SCA) ein. Wenn Sie eine Anfrage erhalten, die diese Sicherheitsstufe umgeht oder
    Sie dazu drängt, eine SCA-Bestätigung für eine Transaktion freizugeben, die Sie
    nicht selbst initiiert haben, brechen Sie den Vorgang sofort ab.


    Weitere hilfreiche Tipps finden Sie unter Kompass Girokonto — Sicherheitstipps
    für Ihr Konto.'
