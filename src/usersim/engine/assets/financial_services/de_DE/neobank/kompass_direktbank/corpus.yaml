- id: 0601e0aa-c113-586f-a5bd-ad8df0ff2f87
  title: Echtzeitüberweisung — Status oder Verlauf einsehen
  body: "Wenn Sie wissen möchten, ob eine Echtzeitüberweisung bereits erfolgreich\
    \ beim Empfänger eingegangen ist oder Sie Ihre vergangenen Transaktionen prüfen\
    \ wollen, folgen Sie diesen Schritten:\n\n1. Öffnen Sie den Bereich 'Transaktionen'\
    \ oder 'Kontoauszug' in Ihrer App.\n2. Suchen Sie in der Liste der Buchungen nach\
    \ dem entsprechenden Betrag und dem Namen des Empfängers. Echtzeitüberweisungen\
    \ sind in der Regel sofort als solche markiert.\n3. Tippen Sie auf die spezifische\
    \ Transaktion, um die Details zu öffnen.\n4. Überprüfen Sie den Status: \n   -\
    \ 'Ausgeführt' oder 'Erfolgreich' bedeutet, dass das Geld die Kompass Direktbank\
    \ verlassen hat und (sofern die Empfängerbank den Service unterstützt) bereits\
    \ gutgeschrieben wurde.\n   - 'In Bearbeitung' weist darauf hin, dass die Sicherheitsprüfungen\
    \ oder die Empfängerüberprüfung noch laufen.\n\nWie erkenne ich, ob es funktioniert\
    \ hat?\nSobald der Status auf 'Erfolgreich' springt, wurde der Betrag in Echtzeit\
    \ versendet. Da wir eine automatische Empfängerüberprüfung durchführen, sind Sie\
    \ sicher, dass die IBAN und der Name abgeglichen wurden. Sollten Sie eine Unstimmigkeit\
    \ im Verlauf feststellen, können Sie uns direkt über den Chat kontaktieren, um\
    \ den Vorgang zu prüfen. Für weitere Details zu Fehlermeldungen lesen Sie bitte\
    \ Echtzeitüberweisung — abgelehnter oder gesperrter Vorgang."
