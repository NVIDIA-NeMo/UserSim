- id: ee5a600a-597e-5569-b355-5b8a5033ed51
  title: Echtzeitüberweisung — Schritt für Schritt starten
  body: 'Dieser Leitfaden unterstützt Support-Mitarbeiter dabei, Kunden bei der erstmaligen
    Nutzung der Echtzeitüberweisung zu begleiten. Ziel ist eine effiziente digitale
    Aktivierung ohne Jargon.


    Schritte zur Aktivierung und Nutzung:

    1. Identitätsprüfung: Stellen Sie sicher, dass der Kunde bereits erfolgreich verifiziert
    wurde. Vor jeder zustandsändernden Aktion ist eine Identitätsprüfung zwingend
    erforderlich.

    2. Funktionszugriff: Weisen Sie den Kunden an, in der App den Bereich „Zahlungen“
    aufzurufen und die Option für die Echtzeitüberweisung auszuwählen.

    3. Limit-Aufklärung: Informieren Sie den Kunden transparent über das tägliche
    Limit von 5.000 €. Erklären Sie, dass dieser Betrag die maximale Summe aller Echtzeit-Transaktionen
    pro 24 Stunden darstellt.

    4. Kostenkommunikation: Bestätigen Sie dem Kunden, dass dieser Service kostenlos
    ist und pro Überweisung 0 € Gebühren anfallen.

    5. Erste Transaktion: Der Kunde gibt IBAN und Betrag ein. Weisen Sie auf die Empfängerüberprüfung
    hin, die automatisch Name und IBAN abgleicht, bevor die Zahlung ausgelöst wird.

    6. Authentifizierung: Der Vorgang wird über die starke Kundenauthentifizierung
    (SCA) in der App finalisiert.


    Zusammenfassung der Produktmerkmale für den Agenten:

    - Produkt-ID: echtzeitueberweisung

    - Gebühr: 0 €

    - Tageslimit: 5.000 €

    - Kernversprechen: Sofortige Gutschrift beim Empfänger bei voller Transparenz.'
