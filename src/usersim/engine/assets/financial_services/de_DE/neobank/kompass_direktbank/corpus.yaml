- id: 78fc14e8-b0f2-5d25-9cdd-40f48a585d7b
  title: 'Kompass Tagesgeld — Zinssatz nach Ablauf des Neukundenzinses: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zum Übergang der Verzinsung
    bei Ihrem Kompass Tagesgeld.


    **Was passiert, wenn die 4 Monate des Neukundenzinses vorbei sind?**

    Nachdem Sie die ersten 4 Monate mit dem attraktiven Neukundenzins von 2,6 % genossen
    haben, endet dieser Aktionszeitraum automatisch. Ihr Guthaben wird ab dem ersten
    Tag nach Ablauf dieser Frist mit dem Standardzinssatz von 1,75 % verzinst.


    **Muss ich den Wechsel zum Standardzins selbst beantragen?**

    Nein, der Übergang erfolgt vollautomatisch und ohne Ihr Zutun. Es ist keine manuelle
    Umstellung in der App erforderlich; die Verzinsung passt sich systemseitig an.


    **Kann ich den Neukundenzins verlängern?**

    Der Zinssatz von 2,6 % ist exklusiv für die erste Phase von 4 Monaten für Neukunden
    vorgesehen und kann nicht verlängert oder erneut beantragt werden.


    Für eine vollständige Übersicht aller Zinsen schauen Sie bitte in das Dokument
    Kompass Tagesgeld — Zinsübersicht.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: faq
  source_authority: official
