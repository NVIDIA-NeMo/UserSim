- id: 3e2b5eb4-98e3-5b54-b17b-fb5fd6e0b28b
  title: Kompass Girokonto — Änderung der Bedingungen
  body: 'Dieses Dokument beschreibt die Bedingungen und die Verfahren bei Änderungen
    der Vertragsmodalitäten für das Kompass Girokonto. Wir streben maximale Transparenz
    in unserer Preisgestaltung und unseren Bedingungen an, um Ihnen eine verlässliche
    Planung Ihrer Finanzen zu ermöglichen.


    Die Kompass Direktbank behält sich das Recht vor, die Bedingungen des Kontos,
    einschließlich der Entgelte, anzupassen. Aktuell beläuft sich die monatliche Kontoführungsgebühr
    auf 4,90 €. Diese Gebühr wird bei einem monatlichen Geldeingang von 700 € erlassen.
    Sollten wir diese Schwellenwerte oder die Gebührenhöhe ändern, werden Sie darüber
    rechtzeitig und in klarer Sprache informiert.


    Änderungen der Konditionen, wie beispielsweise eine Anpassung des Dispozinses
    (derzeit 9,89 %), werden Ihnen über die In-App-Benachrichtigungen oder per digitaler
    Nachricht mitgeteilt. Die entsprechende Ankündigungsfrist richtet sich nach den
    gesetzlichen Vorgaben und unseren allgemeinen Geschäftsbedingungen. Ihnen steht
    nach einer solchen Mitteilung das Recht zu, das Konto ohne weitere Kosten zu kündigen,
    sofern Sie den neuen Bedingungen nicht zustimmen.


    Die Kündigungsfristen und das Verfahren zur Kontoschließung sind in dem Dokument
    Kompass Girokonto — kündigen, schließen oder den Tarif wechseln detailliert aufgeführt.
    Wir gewährleisten bei einem Wechsel zu einem anderen Anbieter eine reibungslose
    Übertragung Ihrer Daueraufträge und Lastschriften durch unsere digitale Kontowechselhilfe
    gemäß dem Zahlungskontengesetz.


    Alle Änderungen erfolgen unter strikter Einhaltung der Vorgaben der BaFin und
    der Deutschen Bundesbank. Damit bleibt das zentrale Sicherheitsversprechen der
    gesetzlichen Einlagensicherung bis 100.000 € pro Kunde und Bank unangetastet.
    Wir empfehlen, die aktuellen Bedingungen regelmäßig in der App zu prüfen, um stets
    über den neuesten Stand Ihrer Kontokonditionen informiert zu sein.'
