- id: 89028de2-6610-5c9f-9ef5-1ad8f18d32bf
  title: Kompass Tagesgeld — abschließen und aktivieren
  body: 'Um ein Kompass Tagesgeld Konto zu eröffnen und zu aktivieren, folgen Sie
    bitte diesen Schritten. Stellen Sie sicher, dass Sie ein gültiges Ausweisdokument
    bereitliegen haben.


    1. Beantragung: Teilen Sie uns Ihren Wunsch mit, ein Kompass Tagesgeld Konto zu
    eröffnen. Wir erfassen Ihre Basisdaten und informieren Sie über die aktuellen
    Konditionen, einschließlich des Neukundenzinses von 2,6 % für die ersten 4 Monate.


    2. Identitätsprüfung: Zur Erfüllung der gesetzlichen Anforderungen und gemäß BaFin-Vorgaben
    müssen wir Ihre Identität verifizieren. Wir führen eine starke Kundenauthentifizierung
    (SCA) durch. Sie erhalten hierzu eine Aufforderung zur Verifizierung (z. B. via
    Video-Ident oder App-basiertem Verfahren), die Sie abschließen.


    3. Kontoaktivierung: Sobald die Identitätsprüfung erfolgreich abgeschlossen ist,
    richten wir Ihr Konto ein. Wir bestätigen Ihnen die Eröffnung sowie die Aktivierung
    des Kontos direkt in der App oder per Nachricht.


    4. Erste Einzahlung: Überweisen Sie den gewünschten Betrag von einem Referenzkonto
    auf Ihr neues Kompass Tagesgeld Konto. Ab dem Zeitpunkt des Geldeingangs beginnt
    die Verzinsung. In den ersten 4 Monaten profitieren Sie vom Zinssatz von 2,6 %,
    danach gilt der Standardzinssatz von 1,75 %.


    Nach diesen Schritten ist Ihr Konto voll funktionsfähig und Sie können Ihr Guthaben
    jederzeit über die App verwalten. Sollten Sie noch Fragen zu den Voraussetzungen
    haben, lesen Sie bitte die Kompass Tagesgeld — Voraussetzungen.'
