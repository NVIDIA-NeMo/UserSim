- id: d89f891f-d6a2-528f-8a03-0fe1f9b10ea0
  title: Kompass Visa Debitkarte — Datenschutz und Datenverarbeitung
  body: 'Die Kompass Direktbank ist eine moderne Neobank, die strikt nach den Vorgaben
    der BaFin und der Deutschen Bundesbank agiert. Der Schutz Ihrer persönlichen Daten
    bei der Nutzung der Kompass Visa Debitkarte hat für uns höchste Priorität.


    **Verarbeitung von Transaktionsdaten**

    Um Ihnen eine intuitive App-Experience und eine präzise Umsatzübersicht zu ermöglichen,
    verarbeiten wir Ihre Transaktionsdaten im Einklang mit der europäischen Datenschutz-Grundverordnung
    (DSGVO). Dies umfasst die Erfassung von Beträgen, Empfängern und Zeitpunkten Ihrer
    Zahlungen.


    **Sicherheit und Authentifizierung**

    Zur Prävention von Betrug und zur Sicherstellung der rechtmäßigen Nutzung setzen
    wir konsequent auf die starke Kundenauthentifizierung (SCA). Dies bedeutet, dass
    für jede zustandsändernde Aktion – wie die Bestellung einer neuen Karte oder die
    Änderung von Limits – eine mehrstufige Verifizierung Ihrer Identität zwingend
    erforderlich ist.


    **Datenweitergabe an Drittanbieter**

    Da die Kompass Visa Debitkarte im Visa-Netzwerk operiert, werden notwendige Transaktionsdaten
    an Visa und die beteiligten Händler übermittelt, um die Zahlungsabwicklung weltweit
    zu gewährleisten. Es erfolgt keine Weitergabe Ihrer Daten zu Marketingzwecken
    an unbefugte Dritte.


    **Ihre Rechte als Nutzer**

    Sie haben jederzeit das Recht auf Auskunft über die bei uns über Ihre Kartenaktivitäten
    gespeicherten Daten sowie das Recht auf Berichtigung oder Löschung, sofern keine
    gesetzlichen Aufbewahrungspflichten (z.B. Geldwäschegesetz) entgegenstehen.


    **Einlagensicherung**

    Wir erinnern daran, dass Ihr Guthaben, von dem die Kompass Visa Debitkarte gespeist
    wird, durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000
    € geschützt ist. Dies bietet Ihnen maximale Sicherheit bei der Nutzung unserer
    digitalen Bankdienstleistungen.


    Weitere rechtliche Details entnehmen Sie bitte dem Dokument Kompass Visa Debitkarte
    — rechtliche Hinweise.'
