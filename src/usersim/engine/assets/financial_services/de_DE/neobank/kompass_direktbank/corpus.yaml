- id: 79074dba-a646-5b00-9393-860036157ebe
  title: Kompass Visa Debitkarte — Voraussetzungen und Abschluss
  body: 'Häufige Fragen zum Abschluss der Kompass Visa Debitkarte für unsere Bestandskunden.


    **Welche Voraussetzungen muss ich erfüllen, um die Karte zu beantragen?**

    Um eine Kompass Visa Debitkarte zu erhalten, müssen Sie Inhaber eines aktiven
    Kontos bei uns sein. Die Karte ist eng mit Ihrem Girokonto verknüpft, da die Beträge
    direkt von dort abgebucht werden. Weitere Details finden Sie unter Kompass Girokonto
    — Überblick.


    **Wie beantrage ich die Karte, wenn ich bereits ein Konto habe?**

    Der Prozess ist vollständig digital. Öffnen Sie die App, gehen Sie zum Bereich
    ''Produkte'' und wählen Sie die Kompass Visa Debitkarte aus. Bestätigen Sie Ihren
    Antrag mit der starken Kundenauthentifizierung (SCA). Wir senden Ihnen die Karte
    anschließend per Post zu.


    **Wie lange dauert es, bis die Karte bei mir eintrifft?**

    In der Regel erhalten Sie Ihre Karte innerhalb weniger Werktage an die bei uns
    hinterlegte Adresse.'
