- id: a0d4385c-4122-5588-a476-8867a8649241
  title: Kompass Visa Debitkarte — ein typisches Anliegen vollständig erledigen
  body: 'Ein häufiges Anliegen unserer Kunden ist der Umgang mit einer verlorenen
    oder gestohlenen Karte. In diesem Leitfaden zeigen wir Ihnen, wie Sie diesen Vorgang
    sicher und vollständig erledigen, um Ihr Konto zu schützen und schnell eine Ersatzkarte
    zu erhalten.


    **Szenario: Die Karte ist verloren gegangen oder wurde gestohlen.**


    **Schritt 1: Sofortige Sperrung der Karte**

    Da wir maximale Sicherheit gewährleisten, müssen Sie die Karte sofort deaktivieren.
    Sagen Sie uns im Chat einfach: ''Ich habe meine Karte verloren und möchte sie
    sperren''. Wir werden die Karte umgehend für alle weiteren Transaktionen deaktivieren.
    Alternativ können Sie dies in der App unter ''Karten'' über den Schalter ''Karte
    einfrieren'' sofort selbst erledigen.


    **Schritt 2: Überprüfung der letzten Umsätze**

    Wir empfehlen Ihnen, gemeinsam mit uns die letzten Transaktionen zu prüfen. Gehen
    Sie in der App auf Ihren Kartenverlauf. Wenn Sie Umsätze sehen, die Sie nicht
    selbst getätigt haben, melden Sie uns diese direkt. Wir leiten dann prioritär
    eine Reklamation ein und halten uns dabei strikt an die gesetzlichen Fristen und
    die Haftungsbegrenzung gemäß BGB.


    **Schritt 3: Bestellung einer Ersatzkarte**

    Nachdem die alte Karte dauerhaft gesperrt wurde, benötigen Sie eine neue. Bitten
    Sie uns im Chat um eine Ersatzkarte oder wählen Sie in der App die Option ''Neue
    Karte bestellen''. Wir verifizieren Ihre Identität kurz über die starke Kundenauthentifizierung
    (SCA), um sicherzustellen, dass die Karte an die richtige Person geht.


    **Schritt 4: Erhalt und Aktivierung**

    Die neue Karte wird an Ihre hinterlegte Adresse versandt. Sobald diese eintrifft,
    aktivieren Sie die Karte in der App. Sie wissen, dass es funktioniert hat, wenn
    der Status der Karte in der App von ''Versandt'' auf ''Aktiv'' wechselt.


    Durch diesen Prozess ist Ihr Guthaben geschützt und Sie sind schnellstmöglich
    wieder voll einsatzfähig.'
