- id: 459af399-54c0-5f3b-a318-48437c531597
  title: Kompass Tagesgeld — rechtliche Hinweise
  body: 'Dieses Dokument enthält die verbindlichen regulatorischen Hinweise für das
    Produkt Kompass Tagesgeld. Alle Angaben erfolgen unter strikter Einhaltung der
    Vorgaben der BaFin und der Deutschen Bundesbank.


    Einlagensicherung: Ein zentrales Sicherheitsversprechen der Kompass Direktbank
    ist der Schutz Ihres Guthabens. Gemäß der gesetzlichen Einlagensicherung sind
    Einlagen bis zu einem Betrag von 100.000 € pro Kunde und Bank geschützt. Dies
    gewährleistet die Sicherheit Ihrer Ersparnisse auch im Falle einer Insolvenz des
    Instituts.


    Zinskonditionen: Die Verzinsung erfolgt variabel. Der Neukundenzins von 2,6 %
    ist eine zeitlich befristete Sonderkondition, die für die ersten 4 Monate nach
    Kontoeröffnung gilt. Nach Ablauf dieser Frist wird automatisch der Standardzinssatz
    von 1,75 % angewendet. Die Bank behält sich das Recht vor, die Zinsen unter Einhaltung
    angemessener Fristen und basierend auf den Marktbedingungen anzupassen.


    Identitätsprüfung und Sicherheit: Gemäß den europäischen Richtlinien zur starken
    Kundenauthentifizierung (SCA) ist vor jeder zustandsändernden Aktion oder der
    Herausgabe von Kontodaten eine Verifizierung der Identität zwingend erforderlich.
    Die Kompass Direktbank wendet diese Sicherheitsstandards konsequent an, um Betrug
    und nicht autorisierte Zugriffe zu verhindern.


    Datenschutz: Die Verarbeitung Ihrer personenbezogenen Daten erfolgt strikt nach
    den geltenden europäischen und nationalen Finanzmarktrichtlinien sowie der DSGVO.
    Es findet keine individualisierte Steuer- oder Rechtsberatung statt; Produktinformationen
    erfolgen auf Basis objektiver Kriterien.


    Für weitere Details zu den allgemeinen Geschäftsbedingungen referenzieren Sie
    bitte auf das Kompass Tagesgeld — Überblick.'
