  institution_id: kompass_direktbank
- id: 3551d33c-e1e6-5552-b86c-c93a1a507ce4
  title: Kompass Girokonto — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument beschreibt das Vorgehen für Support-Mitarbeiter, wenn bei
    einem Kunden eine Abweichung zwischen den hinterlegten Kontodaten und den eingereichten
    Identitätsunterlagen festgestellt wird.


    **Symptom**

    Bei einer regelmäßigen Überprüfung oder einem Update-Vorgang stellt das System
    oder ein Mitarbeiter fest, dass Namen, Adressen oder Geburtsdaten in den digitalen
    Unterlagen nicht mit den Daten im Kundenprofil übereinstimmen.


    **Ursachenanalyse**

    - **Namensänderung**: Der Kunde hat geheiratet oder den Namen geändert, ohne dies
    mitzuteilen.

    - **Adressumzug**: Die hinterlegte Adresse ist veraltet und weicht vom aktuellen
    Personalausweis ab.

    - **Übertragungsfehler**: Es kam beim digitalen Onboarding zu einem Tippfehler
    in den Stammdaten.

    - **Identitätsmissbrauch**: Es besteht der Verdacht, dass die Unterlagen nicht
    mit der Identität des Kontoinhabers übereinstimmen.


    **Lösungswege und Prüfschritte**


    1. **SCA-Verifizierung**: Bevor Sie Details besprechen, muss die Identität des
    Nutzers zwingend durch die starke Kundenauthentifizierung (SCA) in der App verifiziert
    werden.

    2. **Nachweis anfordern**: Bitten Sie den Kunden über den digitalen Chat, ein
    aktuelles Foto des Personalausweises oder eine aktuelle Meldebescheinigung hochzuladen.

    3. **Abgleich prüfen**: Vergleichen Sie das neue Dokument mit den vorhandenen
    Daten. Handelt es sich um eine offensichtliche Änderung (z. B. Heirat), fordern
    Sie die entsprechende Urkunde an.

    4. **Korrektur durchführen**: Sobald die Dokumente valide sind, aktualisieren
    Sie die Stammdaten im System.


    **Eskalation an Spezialisten**

    Wenn die Unterlagen widersprüchlich bleiben oder ein begründeter Verdacht auf
    Betrug besteht, darf der Vorgang nicht eigenständig gelöst werden. Eskalieren
    Sie den Fall unverzüglich an das Compliance-Team. Das Konto wird vorerst für zustandsändernde
    Aktionen gesperrt, bis eine endgültige Klärung erfolgt ist. Der Kunde wird über
    die Verzögerung transparent im Chat informiert.


    Weitere Richtlinien finden Sie in Kompass Girokonto — Voraussetzungen.'
  domain: retail_banking
  product_category: girokonto
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
