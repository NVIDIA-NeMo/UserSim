- id: 79e66589-0eb1-575e-8dbd-6efa2108dac3
  title: Echtzeitüberweisung — Probleme mit Zugang oder Login
  body: 'Wenn Sie Schwierigkeiten haben, auf die Funktion der Echtzeitüberweisung
    zuzugreifen oder sich in der App einzuloggen, gehen Sie bitte nach diesem Schema
    vor.


    **Symptom: Die Option „Echtzeitüberweisung“ wird in der App nicht angezeigt oder
    ist ausgegraut.**

    - **Mögliche Ursache 1: Fehlende Verifizierung.** Prüfen Sie, ob Ihr Onboarding-Prozess
    vollständig abgeschlossen ist. Ohne vollständige Identitätsprüfung sind zustandsändernde
    Aktionen gesperrt.

    - **Mögliche Ursache 2: App-Version veraltet.** Stellen Sie sicher, dass Sie die
    aktuellste Version der Kompass Direktbank App installiert haben.

    - **Lösung:** Bitte fordern Sie uns im Chat auf, Ihren Verifizierungsstatus zu
    prüfen. Wir werden Ihnen mitteilen, ob noch Unterlagen fehlen.


    **Symptom: Die Zahlung schlägt beim letzten Schritt (SCA) fehl.**

    - **Mögliche Ursache 1: Verbindungsprobleme.** Eine instabile Internetverbindung
    kann die starke Kundenauthentifizierung unterbrechen.

    - **Mögliche Ursache 2: Limit überschritten.** Prüfen Sie, ob Sie das tägliche
    Limit von 5.000 € bereits erreicht haben.

    - **Lösung:** Versuchen Sie es nach einem Neustart der App erneut. Wenn die Fehlermeldung
    „Limit erreicht“ erscheint, müssen Sie bis zum nächsten Kalendertag warten.


    **Symptom: Login in die App ist generell nicht möglich.**

    - **Mögliche Ursache:** Sicherheitsperre aufgrund von mehreren Fehlversuchen beim
    PIN-Code.

    - **Lösung:** Fordern Sie uns über den digitalen Chat zur Identitätsprüfung auf.
    Wir werden Ihr Konto nach erfolgreicher Verifizierung wieder freischalten.


    Falls das Problem weiterhin besteht, werden wir den Vorgang an unsere spezialisierten
    menschlichen Experten eskalieren. Sie erhalten innerhalb von 24 Stunden eine Rückmeldung
    über den Status Ihres Anliegens per Push-Nachricht.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
