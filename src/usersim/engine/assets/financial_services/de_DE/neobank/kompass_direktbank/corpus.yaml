- id: b310635c-12da-54d0-9b97-c23ef1dae093
  title: Kompass Girokonto — Kosten und Entgelte
  body: '### Was kostet die Führung eines Kompass Girokontos?

    Die monatliche Kontoführungsgebühr beträgt 4,90 €. Wir möchten jedoch aktive Nutzer
    belohnen: Wenn Ihr monatlicher Geldeingang mindestens 700 € beträgt, entfällt
    diese Gebühr vollständig für den entsprechenden Monat.


    ### Fallen mir Kosten an, wenn mein Konto ins Minus rutscht?

    Ja, bei einer Kontoüberziehung wird ein Zinssatz von 9,89 % auf den überzogenen
    Betrag angewendet.


    ### Gibt es versteckte Kosten für die digitale Nutzung?

    Nein. Wir setzen auf maximale Transparenz. Alle anfallenden Kosten sind in unserem
    Preis- und Leistungsverzeichnis aufgeführt. Wir verzichten bewusst auf ein physisches
    Filialnetz, um faire Konditionen und eine intuitive App-Experience zu ermöglichen.


    Weitere Details entnehmen Sie bitte dem Dokument Kompass Girokonto — Preis- und
    Leistungsverzeichnis.'
