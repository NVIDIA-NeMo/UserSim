- id: 3236c7a8-5634-5a7e-9f9c-c19ed61f90d7
  title: Echtzeitüberweisung — abschließen und aktivieren
  body: 'Die Echtzeitüberweisung ist ein integrierter Funktionsumfang Ihres Kontos
    und muss nicht separat als Produkt beantragt werden. Sie ist sofort nach der erfolgreichen
    Eröffnung Ihres Kontos einsatzbereit.


    Bevor Sie starten, stellen Sie sicher, dass Sie über ein aktives Konto bei uns
    verfügen und die aktuelle Version unserer App installiert haben. Da wir konsequent
    auf starke Kundenauthentifizierung (SCA) setzen, benötigen Sie Ihr verifiziertes
    Gerät für die Freigabe.


    Folgen Sie diesen Schritten, um eine Zahlung auszuführen:


    1. Öffnen Sie die Überweisungsfunktion in Ihrer App und geben Sie die IBAN sowie
    den Namen des Empfängers ein.

    2. Geben Sie den gewünschten Betrag ein. Beachten Sie dabei, dass das maximale
    tägliche Limit 5.000 € beträgt.

    3. Wählen Sie bei den Überweisungsoptionen explizit die Option „Echtzeitüberweisung“
    aus. Wenn diese Option nicht verfügbar ist, unterstützt die Empfängerbank möglicherweise
    diesen Standard nicht.

    4. Prüfen Sie die automatische Empfängerüberprüfung, die Ihnen anzeigt, ob Name
    und IBAN übereinstimmen.

    5. Bestätigen Sie den Vorgang über die geforderte starke Kundenauthentifizierung
    (SCA), beispielsweise durch einen Fingerabdruck-Scan, Face-ID oder eine PIN.


    Sie wissen, dass der Vorgang erfolgreich war, wenn Sie unmittelbar nach der Bestätigung
    eine Erfolgsmeldung in der App erhalten und der Betrag in Ihrem Umsatzverlauf
    als „ausgeführt“ markiert ist. Das Geld erreicht das Gegenkonto in der Regel innerhalb
    weniger Sekunden.


    Für Informationen zur Konteneröffnung verweisen wir auf Kompass Girokonto — Überblick.'
