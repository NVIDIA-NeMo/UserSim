- id: 0e2524ae-3e67-595e-aed1-c63b250634a5
  title: Kompass Girokonto — ein typisches Anliegen vollständig erledigen
  body: 'Ein häufiges Anliegen unserer Kunden ist die Reklamation einer nicht autorisierten
    oder fehlerhaften Lastschrift. In diesem Leitfaden zeigen wir Ihnen, wie Sie diesen
    Prozess vollständig digital über Ihre App abwickeln.


    **Voraussetzungen**

    Sie müssen in der App eingeloggt sein und die entsprechende Transaktion in Ihrem
    Verlauf identifiziert haben.


    **Schritte zur Reklamation einer SEPA-Lastschrift**


    1. **Transaktion auswählen**: Navigieren Sie in der App zu Ihrem Transaktionsverlauf
    und tippen Sie auf die Lastschrift, die Sie beanstanden möchten.

    2. **Reklamation starten**: Wählen Sie unter den Details der Transaktion die Option
    „Reklamieren“ oder „Betrug melden“.

    3. **Grund angeben**: Wählen Sie aus dem Menü den Grund für die Reklamation aus
    (z. B. „Nicht autorisierte Zahlung“ oder „Falscher Betrag“).

    4. **Details ergänzen**: Geben Sie im Textfeld eine kurze Beschreibung des Problems
    an. Falls Sie Belege haben, können Sie diese direkt in der App hochladen.

    5. **Absenden und Verifizieren**: Bestätigen Sie den Vorgang. Da dies eine zustandsändernde
    Aktion ist, werden wir Sie zur starken Kundenauthentifizierung (SCA) auffordern.
    Bestätigen Sie die Anfrage in der App.

    6. **Bestätigung erhalten**: Sie erhalten sofort eine digitale Bestätigung mit
    einer Ticketnummer und einer Information zum weiteren Verlauf.


    **Zeitliche Rahmenbedingungen und Ergebnis**

    Wir halten uns strikt an die gesetzlichen Fristen. Beispielsweise wird die acht-wöchige
    Rückgabefrist für SEPA-Lastschriften konsequent angewandt. Sobald die Prüfung
    abgeschlossen ist, erhalten Sie eine Nachricht in der App über die Entscheidung
    und gegebenenfalls die Rückbuchung des Betrags.


    Weitere Informationen zum Thema finden Sie unter Kompass Girokonto — Schutz vor
    Betrug und nicht autorisierten Vorgängen.'
