- id: 8be42554-ac02-5eb9-b762-ba3b39ccd984
  title: Kompass Girokonto — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Sicherheit hat bei der Kompass Direktbank höchste Priorität. Da das Kompass
    Girokonto rein digital verwaltet wird, setzen wir auf modernste Sicherheitsstandards,
    um Ihr Guthaben und Ihre Daten zu schützen. Wir agieren strikt nach den Vorgaben
    der BaFin und der Deutschen Bundesbank, wobei die gesetzliche Einlagensicherung
    bis 100.000 € als zentrales Sicherheitsversprechen dient.


    Um nicht autorisierte Vorgänge zu verhindern, setzen wir konsequent auf die starke
    Kundenauthentifizierung (SCA). Vor jeder zustandsändernden Aktion, wie beispielsweise
    einer Adressänderung oder der Herausgabe von Kontodaten, wird Ihre Identität zwingend
    verifiziert. Dies schützt Sie vor Identitätsdiebstahl und unbefugten Zugriffen
    auf Ihr Konto.


    Bitte beachten Sie: Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder
    Telefon dazu auffordern, Passwörter, PINs oder TANs preiszugeben. Jede Anfrage
    dieser Art ist ein Betrugsversuch.


    Sollten Sie eine nicht autorisierte Transaktion feststellen, ist schnelles Handeln
    entscheidend. Reklamationen werden prioritär über die In-App-Funktionen bearbeitet.
    Beispielsweise wenden wir die gesetzliche acht-wöchige Rückgabefrist für SEPA-Lastschriften
    sowie die Haftungsbegrenzung bei Kartenverlust gemäß BGB konsequent an. Je früher
    eine Meldung erfolgt, desto effektiver können wir Gegenmaßnahmen einleiten.


    Wenn Ihnen ein Vorgang verdächtig erscheint, melden Sie dies umgehend über den
    digitalen Chat in der App. Wir prüfen den Vorfall priorisiert und leiten bei Betrugsverdacht
    sofortige Sperrmaßnahmen ein, um weiteren Schaden abzuwenden. Weitere Informationen
    zur allgemeinen Absicherung finden Sie unter Kompass Girokonto — rechtliche Hinweise.'
  domain: retail_banking
  product_category: girokonto
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: b6ee86ad-0055-5ea5-b81a-38113c4bf073
  title: Kompass Girokonto — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Nutzung des Kompass Girokonto.
    Die Vereinbarung basiert auf den Prinzipien maximaler Transparenz und digitaler
    Effizienz.


    1. Kontoführung und Entgelte

    Für die Führung des Kontos wird ein monatliches Kontoführungsentgelt in Höhe von
    4,90 € erhoben. Dieses Entgelt dient der Absicherung und Wartung der digitalen
    Infrastruktur. Wir belohnen aktive Nutzer: Wird ein monatlicher Geldeingang von
    700 € auf dem Konto verzeichnet, wird die Gebühr von 4,90 € für den entsprechenden
    Monat vollständig erlassen.


    2. Überziehung und Verzinsung

    Sollte das Konto in den Soll-Bereich rutschen, wird der überzogene Betrag mit
    einem Zinssatz von 9,89 % verzinst. Die Zinsberechnung erfolgt täglich auf Basis
    des ausstehenden Betrags.


    3. Verpflichtungen und Compliance

    Die Kompass Direktbank führt das Konto strikt nach den Richtlinien der BaFin und
    der Deutschen Bundesbank. Der Nutzer verpflichtet sich, alle zur Identitätsprüfung
    erforderlichen Daten wahrheitsgemäß anzugeben. Die Verifizierung erfolgt über
    die starke Kundenauthentifizierung (SCA).


    4. Kündigung und Beendigung

    Das Konto kann von beiden Seiten unter Einhaltung der gesetzlichen Fristen gekündigt
    werden. Im Falle einer Kündigung unterstützt die Bank den Nutzer durch die digitale
    Kontowechselhilfe gemäß Zahlungskontengesetz, um Daueraufträge und Lastschriften
    effizient zu übertragen.


    5. Haftung und Einlagensicherung

    Das Guthaben ist durch die gesetzliche Einlagensicherung bis zu einem Betrag von
    100.000 € geschützt. Die Haftung bei Kartenverlust oder nicht autorisierten Zahlungen
    richtet sich nach den gesetzlichen Bestimmungen des BGB. Weitere Details entnehmen
    Sie bitte dem Dokument Kompass Girokonto — Preis- und Leistungsverzeichnis.'
  domain: retail_banking
  product_category: girokonto
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 23555fea-aaae-536f-a30e-0c3ade68998d
  title: Kompass Girokonto — für wen und wofür geeignet
  body: 'Das Kompass Girokonto ist die ideale Lösung für preisbewusste und technikaffine
    Menschen, die eine moderne Alternative zu klassischen Filialbanken suchen. Es
    ist speziell für Nutzer konzipiert, die ihre Finanzen vollständig digital steuern
    möchten und auf eine intuitive App-Experience setzen.


    Eignungsprofil:

    - Digitale Nomaden und junge Erwachsene: Personen, die keine physischen Filialen
    benötigen und alle Bankgeschäfte über das Smartphone erledigen.

    - Preisbewusste Nutzer: Kunden, die durch aktive Kontonutzung Kosten sparen möchten.
    Da das Konto ab einem monatlichen Geldeingang von 700 € kostenlos ist, eignet
    es sich hervorragend als Hauptkonto für Gehalts- oder Rentenzahlungen.

    - Effizienzorientierte Personen: Nutzer, die Wert auf schnelle, digitale Prozesse
    und eine klare Kommunikation ohne Bank-Jargon legen.


    Zentrale Merkmale und Kosten:

    - Kontoführungsgebühr: 4,90 € pro Monat (entfällt bei monatlichen Geldeingängen
    ab 700 €).

    - Überziehungskosten: Bei Nutzung eines Dispositionskredits fällt ein Zinssatz
    von 9,89 % an.

    - Infrastruktur: Rein digitales Modell ohne Filialnetz, primärer Support über
    In-App-Chat.


    Das Konto dient als zentraler Knotenpunkt für den täglichen Zahlungsverkehr, den
    Empfang von regelmäßigen Einkünften und die einfache Verwaltung von Ausgaben.
    In Kombination mit unseren anderen Produkten bietet es eine nahtlose digitale
    Finanzverwaltung. Für einen detaillierten Überblick über alle Funktionen besuchen
    Sie bitte Kompass Girokonto — Überblick.'
  domain: retail_banking
  product_category: girokonto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: c75f4c72-fc13-56e7-86e6-6bffa5c318d0
  title: 'Kompass Girokonto — monatlicher Mindestgeldeingang für das kostenlose Konto:
    Erklärung'
  body: 'Frage: Wie funktioniert der monatliche Mindestgeldeingang, um die Kontoführungsgebühr
    zu vermeiden?


    Antwort: Um die monatliche Kontoführungsgebühr in Höhe von 4,90 € zu sparen, muss
    in einem Kalendermonat ein Gesamteingang von mindestens 700 € auf Ihrem Kompass
    Girokonto verzeichnet werden. Sobald diese Schwelle von 700 € erreicht ist, entfällt
    die Gebühr für diesen Monat automatisch.


    Frage: Welche Zahlungen zählen zum Mindestgeldeingang?


    Antwort: Als Geldeingänge zählen alle eingehenden Überweisungen von anderen Konten,
    wie beispielsweise Ihr Gehalt, Rentenzahlungen oder Honorare. Interne Umbuchungen
    zwischen Ihren eigenen Konten bei der Kompass Direktbank werden nicht angerechnet.


    Frage: Was passiert, wenn der Geldeingang in einem Monat unter 700 € liegt?


    Antwort: In diesem Fall wird die reguläre monatliche Kontoführungsgebühr von 4,90
    € fällig. Dies betrifft nur den jeweiligen Monat; in jedem folgenden Monat haben
    Sie erneut die Möglichkeit, die Gebühr durch einen Geldeingang von 700 € zu vermeiden.
    Details entnehmen Sie bitte dem Dokument Kompass Girokonto — Preis- und Leistungsverzeichnis.'
