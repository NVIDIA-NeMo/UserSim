- id: 13635ed4-b7fc-5960-94cf-1d571e404beb
  title: Kompass Tagesgeld — kündigen, schließen oder den Tarif wechseln
  body: 'Das Kompass Tagesgeld ist ein flexibles Produkt ohne feste Bindungsfrist.
    Wenn Sie Ihr Konto schließen möchten oder Ihr Guthaben zu einem anderen Anbieter
    übertragen wollen, führen Sie bitte die folgenden Schritte durch:


    1. Bestimmen Sie das Zielkonto: Halten Sie die IBAN eines Referenzkontos bereit,
    auf welches das gesamte Guthaben inklusive der aufgelaufenen Zinsen überwiesen
    werden soll. Dieses Konto muss auf Ihren Namen laufen.


    2. Beantragen Sie die Kontoschließung: Teilen Sie uns über den digitalen Chat
    in der App mit, dass Sie Ihr Kompass Tagesgeld konto schließen möchten. Wir werden
    Ihre Identität im Rahmen der starken Kundenauthentifizierung (SCA) verifizieren.


    3. Bestätigung des Endsaldos: Wir senden Ihnen eine Aufstellung über das aktuelle
    Guthaben und die bis zum heutigen Tag angefallenen Zinsen (basierend auf dem Neukundenzins
    von 2,6 % für die ersten 4 Monate oder dem Standardzins von 1,75 %). Bestätigen
    Sie die korrekte Summe.


    4. Ausführung der finalen Überweisung: Wir überweisen den gesamten Betrag auf
    Ihr angegebenes Referenzkonto. Sobald der Transfer abgeschlossen ist, wird das
    Konto systemseitig geschlossen.


    5. Erhalt der Schließungsbestätigung: Sie erhalten eine digitale Bestätigung in
    Ihrer App, dass das Konto offiziell geschlossen wurde und keine weiteren Verbindlichkeiten
    bestehen.


    Da das Kompass Tagesgeld nur eine einzige Zinsstruktur (Neukundenphase gefolgt
    von der Standardphase) besitzt, gibt es keinen Tarifwechsel im klassischen Sinne.
    Sollten Sie eine andere Art der Anlage suchen, können Sie uns im Chat nach weiteren
    Optionen fragen. Wenn Sie auch Ihr Girokonto schließen möchten, finden Sie die
    entsprechenden Schritte unter Kompass Girokonto — kündigen, schließen oder den
    Tarif wechseln.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 1e4bc24d-eaec-5bc4-b35c-c0ad0f62caa0
  title: Kompass Tagesgeld — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Sollten Sie eine Differenz bei Ihrem Kontostand oder eine unerwartete Änderung
    der Zinsgutschrift bemerken, gehen Sie bitte nach folgendem Schema vor:


    Symptom: Der monatlich gutgeschriebene Zinsbetrag ist niedriger als in den Vormonaten.


    Mögliche Ursachen:

    1. Ablauf des Aktionszeitraums: Die häufigste Ursache ist das Ende der Neukundenphase.
    Der Neukundenzins von 2,6 % gilt nur für die ersten 4 Monate. Danach greift automatisch
    der Standardzinssatz von 1,75 %.

    2. Änderung des Guthabens: Da Zinsen auf Basis des täglichen Saldos berechnet
    werden, führt eine geringere durchschnittliche Einlage zu einer niedrigeren Zinsgutschrift.


    Was zu prüfen ist:

    - Prüfen Sie in der App das Datum Ihrer Kontoeröffnung. Sind seitdem mehr als
    4 Monate vergangen?

    - Vergleichen Sie die Zinsgutschriften der letzten Monate. Gab es einen abrupten
    Wechsel in der Höhe der Zinsen?


    Lösung:

    Wenn die Zeitspanne von 4 Monaten überschritten ist, ist die Anpassung auf 1,75
    % korrekt und entspricht den Geschäftsbedingungen. Es ist kein Handlungsbedarf
    erforderlich.


    Eskalation:

    Falls Sie glauben, dass der Zinswechsel zu früh erfolgt ist oder Beträge fehlen,
    die nicht durch eine eigene Verfügung erklärt werden können, teilen Sie uns dies
    im Chat mit. Wir werden den Vorgang an unsere spezialisierten Experten im Backoffice
    eskalieren. Diese führen eine detaillierte Zinsprüfung durch und melden sich innerhalb
    von drei Werktagen mit einer schriftlichen Erläuterung oder einer entsprechenden
    Korrekturbuchung bei Ihnen.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 4400919f-2297-5049-882e-a03d1588d9f2
  title: Kompass Tagesgeld — erforderliche Unterlagen
  body: 'Um ein Kompass Tagesgeld konto zu eröffnen, müssen folgende Anforderungen
    an die Dokumentation erfüllt sein:


    | Anforderung | Erforderliche Unterlage | Ergebnis bei Vorliegen |

    | :--- | :--- | :--- |

    | Identitätsnachweis | Gültiger Personalausweis oder Reisepass (via Video-Ident
    oder Foto-Ident) | Verifizierung erfolgreich -> Kontoeröffnung möglich |

    | Steuerliche Ansässigkeit | Angabe der Steueridentifikationsnummer (Steuer-ID)
    | Korrekte steuerliche Einordnung -> Zinsgutschrift möglich |

    | Referenzkonto | IBAN eines bestehenden Girokontos auf denselben Namen | Verknüpfung
    für Ein- und Auszahlungen hergestellt |

    | Alter | Nachweis der Volljährigkeit (über ID-Dokument) | Vollständige Geschäftsfähigkeit
    -> Vertragsabschluss möglich |'
