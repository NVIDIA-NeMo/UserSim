- id: ba130adf-2a05-5a20-94ae-f5670b413142
  title: Kompass Tagesgeld — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie Einstellungen oder Details Ihres
    Kompass Tagesgeldes direkt in Ihrer App anpassen können. Da wir eine rein digitale
    Bank sind, lassen sich die meisten Änderungen effizient über den digitalen Chat
    oder die App-Funktionen erledigen.


    **Voraussetzungen:**

    Sie müssen mit Ihren Zugangsdaten in der App angemeldet sein und verfügen über
    ein aktives Kompass Tagesgeld Konto.


    **Schritte zur Änderung von Kontodetails oder Einstellungen:**


    1. **Anforderung stellen:** Navigieren Sie in der App zum Bereich „Konto-Einstellungen“
    Ihres Tagesgeldkontos oder öffnen Sie den digitalen Chat. Nennen Sie uns dort
    präzise, welche Änderung Sie vornehmen möchten (z. B. die Anpassung des verknüpften
    Referenzkontos).

    2. **Identitätsverifizierung:** Da es sich um eine zustandsändernde Aktion handelt,
    fordern wir Sie zur starken Kundenauthentifizierung (SCA) auf. Bestätigen Sie
    die Anfrage über die In-App-Verifizierung.

    3. **Prüfung durch die Bank:** Wir prüfen Ihren Antrag auf Plausibilität und Richtigkeit.
    Bei komplexen Änderungen wird Ihr Anliegen nahtlos an einen spezialisierten menschlichen
    Experten eskaliert, der die Änderung finalisiert.

    4. **Bestätigung erhalten:** Sobald die Änderung durchgeführt wurde, erhalten
    Sie eine Bestätigung direkt in der App sowie eine entsprechende Benachrichtigung
    in Ihrem Postfach.


    **Wie wissen Sie, dass es funktioniert hat?**

    Die geänderten Daten werden unmittelbar in der Kontoübersicht Ihres Kompass Tagesgeldes
    angezeigt. Zudem finden Sie die Bestätigung der Änderung in Ihrem digitalen Nachrichtenverlauf.


    Sollten Sie Probleme beim Login haben, finden Sie Hilfe unter Kompass Tagesgeld
    — Probleme mit Zugang oder Login.'
