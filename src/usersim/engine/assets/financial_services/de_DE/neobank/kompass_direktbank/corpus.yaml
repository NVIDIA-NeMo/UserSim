- id: 08c37347-e5fc-53b3-ae11-a1695eba7823
  title: Kompass Girokonto — zwischen Tarifen wählen
  body: 'Beim Kompass Girokonto müssen Sie sich nicht zwischen verschiedenen Tarifpaketen
    entscheiden, da wir ein transparentes, einheitliches Modell anbieten. Die Entscheidung
    liegt primär darin, wie Sie Ihr Konto nutzen, um die Kosten zu optimieren.


    **Die Kostenstruktur im Überblick:**

    - **Standard-Modell:** Monatliche Kontoführungsgebühr von 4,90 €.

    - **Aktiver Nutzer-Modus:** Bei einem monatlichen Geldeingang von 700 € wird die
    Gebühr von 4,90 € komplett erlassen.


    **Welches Modell passt zu Ihnen?**

    - **Das kostenlose Modell (bei 700 € Geldeingang):** Ideal für Kunden, die das
    Kompass Girokonto als ihr Hauptkonto für Gehalt, Renten oder andere regelmäßige
    Einkünfte nutzen. Sie profitieren von einer modernen App-Experience ohne monatliche
    Fixkosten.

    - **Das Standard-Modell (mit Gebühr):** Geeignet für Kunden, die unser Konto als
    Zweitkonto nutzen oder deren regelmäßige Geldeingänge unter 700 € liegen. Hier
    zahlen Sie einen fairen Betrag von 4,90 € pro Monat, der die Wartung der digitalen
    Infrastruktur absichert.


    In beiden Fällen profitieren Sie von der kostenlosen Visa Debitkarte und der Einlagensicherung
    bis 100.000 €. Details zu den Kosten finden Sie in Kompass Girokonto — Preis-
    und Leistungsverzeichnis.'
