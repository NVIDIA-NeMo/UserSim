- id: 6133e568-319a-502f-80b8-ffa9c0795606
  title: Kompass Visa Debitkarte — Risikohinweise
  body: 'Die Nutzung der Kompass Visa Debitkarte unterliegt bestimmten regulatorischen
    und operationalen Risiken, über die wir unsere Kunden transparent informieren.


    **Regulatorischer Rahmen:**

    Die Kompass Direktbank agiert strikt nach den Vorgaben der BaFin und der Deutschen
    Bundesbank. Die Sicherheit Ihres Guthabens auf dem verknüpften Konto ist durch
    die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000 € pro Kunde
    und Bank gewährleistet.


    **Betriebliche Risiken:**

    Die Verfügbarkeit der Karte hängt von der Infrastruktur des Visa-Netzwerks sowie
    der digitalen Erreichbarkeit unserer App-Systeme ab. In seltenen Fällen kann es
    zu technischen Störungen kommen, die eine temporäre Nutzung der Karte einschränken.


    **Haftungsrisiken:**

    Bei einem Verlust oder Diebstahl der Karte besteht das Risiko nicht autorisierter
    Zahlungen. Gemäß den Bestimmungen des BGB ist die Haftung des Nutzers begrenzt,
    sofern dieser seine Sorgfaltspflichten erfüllt hat und den Verlust unverzüglich
    meldet. Wir wenden diese Haftungsbegrenzung konsequent an.


    **Währungsrisiken:**

    Obwohl wir mit einem Fremdwährungsentgelt von 0 % arbeiten, unterliegen alle Zahlungen
    in Fremdwährung den Schwankungen der globalen Wechselkurse. Der endgültige Euro-Betrag
    richtet sich nach dem Kurs zum Zeitpunkt der Verarbeitung durch das Netzwerk,
    was zu geringfügigen Abweichungen gegenüber dem Kurs zum Zeitpunkt des Kaufs führen
    kann.


    Für weitere rechtliche Details besuchen Sie bitte das Dokument Kompass Visa Debitkarte
    — rechtliche Hinweise.'
