- id: 7ff82e0e-6f5a-573f-83a9-90e7d15247cc
  title: Kompass Visa Debitkarte — Probleme mit Zugang oder Login
  body: 'Wenn Sie Schwierigkeiten haben, auf Ihre Kontofunktionen zuzugreifen, um
    Ihre Kompass Visa Debitkarte zu verwalten, folgen Sie bitte diesem Leitfaden zur
    Fehlerbehebung.


    **Symptom: Die App lässt mich nicht einloggen oder die Karte wird nicht angezeigt**


    **Mögliche Ursachen:**

    - Veraltete App-Version.

    - Instabile Internetverbindung.

    - Fehler bei der biometrischen Authentifizierung oder falsches Passwort.

    - Sicherheitsperre aufgrund mehrerer Fehlversuche.


    **Schritte zur Lösung:**

    1. **App-Update prüfen:** Stellen Sie sicher, dass Sie die aktuellste Version
    unserer App aus dem Store installiert haben. Veraltete Versionen können zu Login-Problemen
    führen.

    2. **Verbindung prüfen:** Wechseln Sie testweise von WLAN auf mobile Daten, um
    Netzwerkprobleme auszuschließen.

    3. **Passwort-Reset:** Wenn der Login-Fehler fortbesteht, nutzen Sie die Funktion
    „Passwort vergessen“. Sie müssen Ihre Identität erneut verifizieren (SCA), bevor
    ein neues Passwort gesetzt werden kann.

    4. **Geräte-Neustart:** Starten Sie Ihr Smartphone neu, um temporäre Cache-Fehler
    der App zu beheben.


    **Wann Sie uns kontaktieren sollten:**

    Wenn keiner der oben genannten Schritte hilft oder Sie eine Fehlermeldung erhalten,
    die auf eine Kontosperrung hinweist, wenden Sie sich bitte an uns über den digitalen
    Chat.


    **Unser weiteres Vorgehen (Eskalation):**

    - Wir prüfen im Backend Ihren Account-Status und die Verknüpfung zur Kompass Visa
    Debitkarte.

    - Falls ein technischer Defekt vorliegt, wird Ihr Fall an unsere spezialisierten
    IT-Experten eskaliert.

    - Sie erhalten eine Benachrichtigung in der App, sobald das Problem gelöst wurde
    oder weitere Informationen von Ihnen benötigt werden.


    Da wir auf maximale Transparenz und digitale Effizienz setzen, vermeiden wir langwierige
    Telefonwarteschleifen und lösen diese Probleme priorisiert über unsere digitalen
    Kanäle.'
