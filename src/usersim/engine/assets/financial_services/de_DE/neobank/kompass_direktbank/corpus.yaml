- id: 9ea05b70-47fc-53e0-8c1d-d61666f98e86
  title: Echtzeitüberweisung — etwas ändern
  body: "In diesem Leitfaden erfahren Sie, wie Sie Einstellungen im Zusammenhang mit\
    \ Ihren Echtzeitüberweisungen anpassen können, insbesondere wenn es um die Verwaltung\
    \ Ihrer Limits geht.\n\n**Anpassung des täglichen Überweisungslimits**\n\nBevor\
    \ Sie beginnen: Bitte stellen Sie sicher, dass Sie in Ihrer App eingeloggt sind\
    \ und Ihre Identität bereits verifiziert wurde.\n\n1. Fordern Sie uns im digitalen\
    \ Chat auf, Ihr aktuelles Tageslimit für Echtzeitüberweisungen zu prüfen.\n2.\
    \ Wir bestätigen Ihnen den aktuellen Status. Das Standardlimit liegt bei 5.000\
    \ €.\n3. Teilen Sie uns mit, ob Sie eine Anpassung wünschen (sofern dies innerhalb\
    \ der regulatorischen Rahmenbedingungen der BaFin möglich ist). \n4. Wir prüfen\
    \ Ihren Antrag basierend auf Ihren Kontobewegungen und Sicherheitsstufen.\n5.\
    \ Wir bestätigen Ihnen die Änderung des Limits direkt im Chat. Sie erhalten eine\
    \ Bestätigung über den neuen maximalen Tagesbetrag, der höchstens 5.000 € betragen\
    \ kann.\n\n**Änderung von Empfängerdaten**\n\nWenn Sie eine bereits gespeicherte\
    \ Empfängeradresse für eine Echtzeitüberweisung korrigieren möchten:\n1. Nennen\
    \ Sie uns den Namen des Empfängers, dessen Daten geändert werden sollen.\n2. Geben\
    \ Sie uns die korrigierte IBAN und den Namen des Empfängers an.\n3. Wir führen\
    \ eine neue Empfängerüberprüfung durch, um die Korrektheit der Daten sicherzustellen.\n\
    4. Wir bestätigen Ihnen die Aktualisierung der Daten für zukünftige Echtzeitüberweisungen.\n\
    \nNach jedem dieser Vorgänge erhalten Sie eine Push-Benachrichtigung in der App,\
    \ die die Änderung dokumentiert."
