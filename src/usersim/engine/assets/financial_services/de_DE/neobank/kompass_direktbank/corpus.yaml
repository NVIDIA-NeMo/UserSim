- id: d60c9548-97ed-58a4-9c22-f0be4b52834e
  title: Kompass Visa Debitkarte — Abweichung von Ihren Unterlagen
  body: 'Dieses Dokument beschreibt das Vorgehen für Support-Mitarbeiter, wenn ein
    Kunde eine Abweichung zwischen den Daten auf seiner Kompass Visa Debitkarte und
    seinen offiziellen Unterlagen (z. B. Personalausweis) meldet.


    **Symptom: Der Kunde meldet einen Tippfehler im Namen oder eine falsche Adresse
    auf der Karte/im System.**


    **Ursache:**

    Dies kann durch einen Übertragungsfehler bei der Kontoeröffnung oder durch eine
    nachträgliche Namensänderung (z. B. nach Heirat) ohne entsprechende Aktualisierung
    im System geschehen.


    **Vorgehensweise zur Behebung:**

    1. **Identitätsprüfung:** Bevor irgendeine Änderung vorgenommen wird, muss die
    Identität des Nutzers zwingend verifiziert werden. Nutzen Sie die dafür vorgesehenen
    Verfahren zur starken Kundenauthentifizierung (SCA) in der App.

    2. **Prüfung der Unterlagen:** Bitten Sie den Kunden, ein Foto eines gültigen
    Lichtbildausweises über den gesicherten Kanal der App hochzuladen. Vergleichen
    Sie die Daten im System mit dem Dokument.

    3. **Korrektur der Stammdaten:** Wenn die Abweichung bestätigt ist, korrigieren
    Sie zunächst die Stammdaten im Kundenprofil. Dies ist die notwendige Basis für
    alle weiteren Schritte.

    4. **Neuausstellung der Karte:** Da der Name auf dem physischen Kartenchip und
    dem Kunststoff eingraviert ist, kann eine bestehende Karte nicht ''korrigiert''
    werden. Eine neue Karte muss bestellt werden.


    **Eskalation und Abschluss:**

    Sollte die Namensänderung rechtliche Dokumente erfordern, die über einen Standard-Ausweis
    hinausgehen (z. B. spezielle Urkunden), eskalieren Sie den Fall an unsere Compliance-Experten.
    Sobald die Prüfung erfolgreich war, bestellen wir die Ersatzkarte.


    Der Vorgang ist abgeschlossen, wenn der Kunde die Bestätigung über die Datenänderung
    in der App erhalten hat und die neue Karte mit dem korrekten Namen bestellt wurde.
    Informieren Sie den Kunden darüber, dass die alte Karte aufgrund der fehlerhaften
    Daten sofort gesperrt wird.'
  domain: cards
  product_category: visa_debit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 34498387-cb6a-525c-8395-edccd3b140a9
  title: Kompass Tagesgeld — Überblick
  body: 'Das Kompass Tagesgeld ist die ideale digitale Lösung für Kunden, die ihre
    Liquidität bewahren und gleichzeitig von attraktiven Zinsen profitieren möchten.
    Als rein digitales Produkt verzichtet es auf physische Filialen, was uns ermöglicht,
    faire Konditionen und eine maximale Transparenz in der App-Experience zu bieten.


    Im Zentrum des Kompass Tagesgeldes steht die Flexibilität: Ihr Guthaben ist jederzeit
    verfügbar, sodass Sie schnell auf Ihre Ersparnisse zugreifen können, ohne auf
    lange Kündigungsfristen achten zu müssen. Um aktive Nutzer und neue Kunden zu
    belohnen, bieten wir einen speziellen Neukundenzins von 2,6 % für die ersten 4
    Monate. Nach Ablauf dieses Zeitraums wird das Guthaben automatisch mit dem Standardzinssatz
    von 1,75 % verzinst.


    Sicherheit hat bei uns höchste Priorität. Ihr Guthaben ist durch die gesetzliche
    Einlagensicherung geschützt, die Beträge bis zu 100.000 € pro Kunde absichert.
    Wir agieren strikt nach den Vorgaben der BaFin und der Deutschen Bundesbank, um
    ein Höchstmaß an Vertrauen und Stabilität zu gewährleisten. Datenschutz und eine
    faire Behandlung werden dabei durch die konsequente Einhaltung europäischer und
    nationaler Finanzmarktrichtlinien sichergestellt.


    Die Verwaltung Ihres Kontos erfolgt vollständig über unsere intuitive App. Ob
    es um die Überwachung des Zinswachstums oder die Übertragung von Geldern auf Ihr
    Girokonto geht – alle Vorgänge sind digital und effizient gestaltet. Wir setzen
    dabei auf starke Kundenauthentifizierung (SCA), um Ihre Daten und Ihr Vermögen
    vor unbefugten Zugriffen zu schützen. Vor jeder zustandsändernden Aktion wird
    Ihre Identität zwingend verifiziert.


    Zusammenfassend bietet das Kompass Tagesgeld eine transparente Kombination aus
    Sicherheit, einfacher digitaler Bedienung und einer wettbewerbsfähigen Verzinsung,
    die insbesondere in den ersten Monaten einen starken Start für Ihren Vermögensaufbau
    ermöglicht. Für eine detaillierte Auflistung der aktuellen Zinskonditionen besuchen
    Sie bitte die Kompass Tagesgeld — Zinsübersicht.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: product_sheet
