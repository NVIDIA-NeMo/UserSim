- id: 9fcc8933-b7a4-5648-b0ef-5c8535cf52f6
  title: Kompass Girokonto — Risikohinweise
  body: 'Dieses Dokument enthält wichtige regulatorische Hinweise zur Nutzung des
    Kompass Girokonto. Bitte lesen Sie diese sorgfältig durch, um die Rahmenbedingungen
    Ihrer Geschäftsbeziehung zu verstehen.


    Gesetzliche Absicherung:

    Das Guthaben auf Ihrem Kompass Girokonto unterliegt der gesetzlichen Einlagensicherung.
    Dies bedeutet, dass Ihre Einlagen bis zu einem Betrag von 100.000 € pro Kunde
    und Bank geschützt sind. Wir agieren dabei strikt nach den Vorgaben der BaFin
    und der Deutschen Bundesbank.


    Zinsen und Kosten:

    Die Kontoführung ist mit einem monatlichen Entgelt von 4,90 € verbunden, sofern
    kein monatlicher Geldeingang von 700 € verzeichnet wird. Bei einer Kontoüberziehung
    wird ein Zinssatz von 9,89 % angewendet. Bitte beachten Sie, dass Zinsen für Überziehungen
    täglich berechnet werden.


    Beratungsgrenzen:

    Die Kompass Direktbank bietet allgemeine finanzielle Bildung und detaillierte
    Produktinformationen an. Wir leisten jedoch ausdrücklich keine individualisierte
    Steuer- oder Rechtsberatung. Produktempfehlungen erfolgen auf Basis objektiver
    Kriterien und eines hohen Sorgfaltsstandards, stellen jedoch keine persönliche
    Anlageberatung dar.


    Datenschutz und Fairness:

    Der Schutz Ihrer Daten sowie eine faire Behandlung werden durch die strikte Einhaltung
    europäischer und nationaler Finanzmarktrichtlinien gewährleistet. Alle zustandsändernden
    Aktionen erfordern eine starke Kundenauthentifizierung (SCA), um die Integrität
    Ihres Kontos zu wahren. Weitere rechtliche Details finden Sie unter Kompass Girokonto
    — rechtliche Hinweise.'
