  body: 'Die Nutzung der Kompass Visa Debitkarte unterliegt den regulatorischen Vorgaben
    der BaFin und der Deutschen Bundesbank. Wir gewährleisten eine strikte Einhaltung
    europäischer und nationaler Finanzmarktrichtlinien zum Schutz Ihrer Daten und
    Ihrer finanziellen Sicherheit.


    Ein zentrales Sicherheitsversprechen ist die gesetzliche Einlagensicherung, die
    Ihr Guthaben auf dem verknüpften Konto bis zu einem Betrag von 100.000 € schützt.


    In Bezug auf die Sicherheit von Zahlungen setzen wir konsequent auf die starke
    Kundenauthentifizierung (SCA). Dies ist für alle Online-Zahlungen und zustandsändernden
    Aktionen zwingend erforderlich, um unbefugte Transaktionen zu verhindern.


    Im Falle eines Kartenverlusts oder Diebstahls wird die Haftungsbegrenzung gemäß
    den Bestimmungen des Bürgerlichen Gesetzbuches (BGB) konsequent angewandt. Wir
    empfehlen die sofortige Sperrung der Karte über die In-App-Funktionen, um den
    potenziellen Schaden zu minimieren.


    Reklamationen und Meldungen über Betrug werden prioritär über die App bearbeitet.
    Wir halten uns dabei strikt an die gesetzlichen Fristen. Beispielsweise gilt für
    SEPA-Lastschriften die acht-wöchige Rückgabefrist.


    Bitte beachten Sie, dass wir allgemeine Produktinformationen bereitstellen, jedoch
    keine individualisierte Rechts- oder Steuerberatung anbieten. Für detaillierte
    Bedingungen zur Kontoführung verweisen wir auf Kompass Girokonto — rechtliche
    Hinweise.'
