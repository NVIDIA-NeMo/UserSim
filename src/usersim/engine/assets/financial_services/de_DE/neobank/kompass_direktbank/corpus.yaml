  mentions_tools: []
  institution_id: kompass_direktbank
- id: d0585190-d55e-5688-8207-47e2af6e93fd
  title: Kompass Tagesgeld — Abweichung von Ihren Unterlagen
  body: 'In bestimmten Fällen kann es zu Unstimmigkeiten zwischen den im System hinterlegten
    Daten und den uns vorliegenden Dokumenten kommen. Dies betrifft häufig die steuerliche
    Ansässigkeit oder die Aktualität der Identitätsnachweise.


    **Symptome**

    - Das Konto wird trotz Antrag nicht eröffnet.

    - Es erscheint ein Hinweis in der App, dass weitere Unterlagen zur Verifizierung
    erforderlich sind.

    - Zinsgutschriften werden aufgrund fehlender Steuerinformationen einbehalten oder
    anders behandelt.


    **Mögliche Ursachen**

    1. **Veraltete Dokumente:** Die bei der Kontoeröffnung des Girokontos eingereichten
    Ausweisdokumente sind abgelaufen.

    2. **Adressabweichung:** Die gemeldete Adresse weicht von den offiziellen Meldedaten
    ab.

    3. **Steuerliche Unklarheiten:** Es liegen keine validen Informationen zur Steueridentifikationsnummer
    vor, was eine korrekte Abführung der Kapitalertragsteuer erschwert.


    **Vorgehensweise für Support-Mitarbeiter**

    Wenn ein Kunde eine solche Abweichung meldet oder das System eine Sperre auslöst,
    gehen Sie wie folgt vor:

    1. **Abgleich:** Prüfen Sie, welches Feld (z. B. Name, Geburtsdatum, Adresse)
    die Abweichung aufweist.

    2. **Anforderung:** Bitten Sie den Kunden über den digitalen Chat, ein aktuelles,
    hochauflösendes Foto des Personalausweises oder eine aktuelle Meldebescheinigung
    hochzuladen.

    3. **Verifizierung:** Leiten Sie die Dokumente an unser KYC-Team (Know Your Customer)
    weiter. Wir prüfen diese strikt nach den Vorgaben der BaFin und der Deutschen
    Bundesbank.


    **Abschluss und Eskalation**

    Nach erfolgreicher Prüfung der Dokumente wird der Status des Kontos aktualisiert.
    Der Kunde wird per Push-Benachrichtigung informiert. Sollten die Dokumente nicht
    mit den Angaben übereinstimmen, wird der Vorgang an einen spezialisierten Compliance-Experten
    eskaliert, der eine detaillierte Prüfung vornimmt und dem Kunden die notwendigen
    Schritte zur Bereinigung mitteilt.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 2a4aa202-56b5-5c51-b0d5-39603ac35b5b
  title: Echtzeitüberweisung — Überblick
  body: 'Die Echtzeitüberweisung der Kompass Direktbank ermöglicht es Ihnen, Geld
    in Sekundenschnelle an andere Kontoinhaber zu senden – unabhängig von Tageszeiten,
    Wochenenden oder Feiertagen. In einer Welt, die sich immer schneller dreht, bieten
    wir Ihnen eine digitale Zahlungslösung, die sofortige Ergebnisse liefert, ohne
    dass Sie auf die herkömmlichen Banklaufzeiten warten müssen.


    Unser Fokus liegt auf maximaler Transparenz und Nutzerfreundlichkeit. Daher ist
    die Nutzung dieses Services für Sie mit 0 € Gebühren verbunden. Es fallen keine
    versteckten Kosten an, da wir die Wartung unserer digitalen Infrastruktur über
    unser transparentes Preismodell absichern. Sie können so flexibel und kosteneffizient
    über Ihr Guthaben verfügen.


    Um die Sicherheit Ihrer Transaktionen zu gewährleisten, ist jede Echtzeitüberweisung
    durch eine starke Kundenauthentifizierung (SCA) geschützt. Zudem integrieren wir
    eine automatische Empfängerüberprüfung: Hierbei wird der Name des Empfängers mit
    der angegebenen IBAN abgeglichen, bevor die Zahlung ausgeführt wird. Dies minimiert
    das Risiko von Fehlüberweisungen erheblich und gibt Ihnen die Sicherheit, dass
    Ihr Geld genau dort ankommt, wo es hin soll.


    Für die tägliche Nutzung haben wir ein tägliches Limit von 5.000 € festgelegt.
    Dieser Betrag stellt ein ausgewogenes Verhältnis zwischen maximaler Flexibilität
    für Ihren Alltag und notwendigen Sicherheitsvorkehrungen dar. Sollten Sie Beträge
    benötigen, die über dieses Limit hinausgehen, stehen Ihnen unsere Standard-Überweisungsmethoden
    zur Verfügung.


    Zusammenfassend bietet die Echtzeitüberweisung die perfekte Kombination aus Geschwindigkeit,
    Sicherheit und Fairness. Sie ist das ideale Werkzeug für kurzfristige Zahlungen,
    dringende Rechnungen oder Geldtransfers an Freunde und Familie, die sofort verfügbar
    sein müssen. Kombiniert mit unserem filiallosen Ansatz erleben Sie Banking, das
    sich Ihren Bedürfnissen anpasst und nicht umgekehrt.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 8a3ca182-6ba0-5552-b2e7-5338f490bba8
  title: 'Echtzeitüberweisung — Entgelt für Echtzeitüberweisungen: Erklärung'
  body: 'Hier finden Sie Antworten zu den Kosten unserer Echtzeitüberweisungen:


    Frage: Fallen für eine Echtzeitüberweisung zusätzliche Gebühren an?

    Antwort: Nein. Bei der Kompass Direktbank betragen die Gebühren für eine Echtzeitüberweisung
    0 €. Wir möchten, dass Sie Ihre digitalen Zahlungen ohne finanzielle Hürden und
    mit voller Transparenz tätigen können.


    Frage: Gibt es versteckte Kosten, wenn die Empfängerbank eine Gebühr erhebt?

    Antwort: Wir berechnen Ihnen 0 € für die Ausführung des Vorgangs. Ob die Empfängerbank
    Kosten erhebt, liegt im Ermessen des jeweiligen Instituts und deren Preisverzeichnis,
    ist jedoch im SEPA-Raum für Standard-Echtzeitüberweisungen unüblich.


    Frage: Ist dieser kostenlose Service an bestimmte Bedingungen geknüpft?

    Antwort: Die Gebühr von 0 € gilt für alle Nutzer unserer Echtzeitüberweisung,
    solange das tägliche Limit von 5.000 € nicht überschritten wird. Für weitere Details
    zu den Kosten unserer Produkte besuchen Sie bitte das Dokument Echtzeitüberweisung
    — Preis- und Leistungsverzeichnis.'
