- id: 79488210-057d-5c35-b7ee-da799fa58ba4
  title: Echtzeitüberweisung — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Die Geschwindigkeit der Echtzeitüberweisung ist ein großer Vorteil, wird
    jedoch auch von Betrügern gezielt ausgenutzt. Da Gelder innerhalb von Sekunden
    beim Empfänger eingehen, ist eine Rückabwicklung im Falle eines Betrugs extrem
    schwierig.


    Ein häufiges Muster ist der sogenannte ''Druckaufbau''. Betrüger geben vor, in
    einer Notlage zu sein oder eine zeitkritische Gelegenheit (z. B. ein extrem günstiges
    Angebot auf einer Online-Plattform) zu präsentieren. Sie drängen Sie dazu, die
    Echtzeitüberweisung sofort zu tätigen, damit das Geld ''unmittelbar'' verfügbar
    ist. Bitte seien Sie skeptisch, wenn Sie zur Eile angehalten werden, insbesondere
    bei Personen, die Sie nicht persönlich kennen.


    Ein weiteres Warnsignal ist die Aufforderung, Sicherheitsmerkmale zu umgehen oder
    uns mitzuteilen, dass Sie eine Überweisung tätigen, die eigentlich gegen Ihre
    eigenen Sicherheitsregeln verstößt. Beachten Sie, dass Kompass Direktbank Sie
    niemals per E-Mail, SMS oder über den digitalen Chat nach Ihren Zugangsdaten,
    PINs oder TANs fragen wird. Jede zustandsändernde Aktion wird konsequent über
    die starke Kundenauthentifizierung (SCA) in unserer App gesichert.


    Um Ihr Risiko zu minimieren, nutzen Sie die integrierte Empfängerüberprüfung,
    die Name und IBAN abgleicht. Zudem dient unser tägliches Limit von 5.000 € als
    zusätzliche Sicherheitsbarriere, um den potenziellen Schaden bei unbefugten Vorgängen
    zu begrenzen.


    Sollten Sie den Verdacht haben, Opfer eines Betrugs geworden zu sein, melden Sie
    dies bitte prioritär über die App. Wir halten uns strikt an die gesetzlichen Fristen
    und die Bestimmungen des BGB. Weitere allgemeine Sicherheitstipps finden Sie im
    Dokument Kompass Girokonto — Sicherheitstipps für Ihr Konto.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: security_advisory
  source_authority: official
