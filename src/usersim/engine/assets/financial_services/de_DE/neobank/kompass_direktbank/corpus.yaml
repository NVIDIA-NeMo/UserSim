- id: 594856ac-8a6d-5afe-a20e-35bd82a9f506
  title: Kompass Girokonto — Datenschutz und Datenverarbeitung
  body: 'Die Kompass Direktbank legt höchsten Wert auf den Schutz Ihrer persönlichen
    Daten. Die Verarbeitung Ihrer Daten im Rahmen der Nutzung des Kompass Girokontos
    erfolgt strikt nach den Vorgaben der Datenschutz-Grundverordnung (DSGVO) sowie
    den nationalen Finanzmarktrichtlinien Deutschlands.


    **Zweck der Datenverarbeitung**

    Wir verarbeiten Ihre personenbezogenen Daten ausschließlich, um die vertraglichen
    Leistungen Ihres Kontos zu erbringen. Dazu gehört die Abwicklung von Zahlungen,
    die Führung Ihres Kontos sowie die notwendige Identitätsverifizierung. Die starke
    Kundenauthentifizierung (SCA) stellt sicher, dass nur Sie Zugriff auf Ihre Daten
    und Ihr Guthaben haben.


    **Aufsichtsrechtliche Compliance**

    Wir agieren unter der strengen Aufsicht der BaFin und der Deutschen Bundesbank.
    Dies garantiert nicht nur die Einhaltung von Datenschutzstandards, sondern sichert
    auch Ihr Guthaben durch die gesetzliche Einlagensicherung bis zu einem Betrag
    von 100.000 € ab. Wir führen regelmäßige Prüfungen durch, um sicherzustellen,
    dass unsere digitalen Prozesse den höchsten Sicherheitsstandards entsprechen.


    **Datenübermittlung und Sicherheit**

    Ihre Daten werden verschlüsselt übertragen und gespeichert. Eine Weitergabe Ihrer
    Daten an Dritte erfolgt nur dann, wenn dies zur Vertragserfüllung zwingend erforderlich
    ist (z. B. bei der Abwicklung von Zahlungen über das SEPA-Netzwerk) oder wenn
    eine gesetzliche Verpflichtung besteht.


    **Ihre Rechte**

    Als Kunde haben Sie jederzeit das Recht auf Auskunft über die bei uns gespeicherten
    Daten sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen
    Aufbewahrungsfristen (z. B. gemäß Geldwäschegesetz) entgegenstehen.


    Für weitere rechtliche Informationen und detaillierte Hinweise besuchen Sie bitte
    Kompass Girokonto — rechtliche Hinweise. Wir setzen uns für eine faire Behandlung
    aller Kunden ein und gewährleisten, dass Ihre Daten transparent und sicher verwaltet
    werden.'
