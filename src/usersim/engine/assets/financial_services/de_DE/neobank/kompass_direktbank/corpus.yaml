- id: 498f25d8-00fc-5b33-898c-2de8f6e67a8b
  title: Kompass Girokonto — Überblick
  body: "Das Kompass Girokonto ist die zentrale, rein digitale Lösung für Ihren finanziellen\
    \ Alltag. Entwickelt für preisbewusste und technikaffine Nutzer, verzichtet dieses\
    \ Konto vollständig auf ein physisches Filialnetz und setzt stattdessen auf eine\
    \ intuitive App-Experience und maximale Transparenz.\n\nUnser Preismodell ist\
    \ fair und direkt: Die monatliche Kontoführungsgebühr beträgt 4,90 €. Um aktive\
    \ Nutzer zu belohnen, wird diese Gebühr jedoch komplett erlassen, sofern ein monatlicher\
    \ Geldeingang von mindestens 700 € verzeichnet wird. Damit bieten wir eine attraktive\
    \ Option für Kunden, die ihr Konto als Hauptkonto nutzen.\n\nFür finanzielle Flexibilität\
    \ steht Ihnen ein Dispositionskredit zur Verfügung. Der für den überzogenen Betrag\
    \ geltende Zinssatz (Sollzinsen) liegt bei 9,89 %. \n\nSicherheit steht bei uns\
    \ an erster Stelle. Wir agieren strikt nach den Vorgaben der BaFin und der Deutschen\
    \ Bundesbank. Ein zentrales Sicherheitsversprechen ist die gesetzliche Einlagensicherung,\
    \ die Ihr Guthaben bis zu einem Betrag von 100.000 € pro Kunde absichert. Zudem\
    \ setzen wir konsequent auf die starke Kundenauthentifizierung (SCA), um alle\
    \ sensiblen Vorgänge und Online-Zahlungen optimal zu schützen.\n\nZusammenfassend\
    \ bietet das Kompass Girokonto eine moderne Infrastruktur, die Effizienz mit Sicherheit\
    \ verbindet und durch klare Konditionen überzeugt. Weitere Details zu den Kosten\
    \ finden Sie im Dokument Kompass Girokonto — Preis- und Leistungsverzeichnis."
  domain: retail_banking
  product_category: girokonto
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 0daba605-4728-5f29-bbe5-3b372c00f8e0
  title: 'Kompass Girokonto — monatliches Kontoführungsentgelt: Erklärung'
  body: 'Hier finden Sie Antworten zu den monatlichen Kosten Ihres Kontos.


    **Warum wird eine monatliche Kontoführungsgebühr erhoben?**

    Die Gebühr in Höhe von 4,90 € dient dazu, die Wartung und den kontinuierlichen
    Ausbau unserer digitalen Infrastruktur sowie den Betrieb der App-Services sicherzustellen.


    **Wie kann ich die Kontoführungsgebühr vermeiden?**

    Wir belohnen aktive Nutzer: Wenn Ihr Konto einen monatlichen Geldeingang von insgesamt
    700 € aufweist, entfällt die Gebühr von 4,90 € für diesen Monat vollständig.


    **Was zählt als Geldeingang für den Erlass der Gebühr?**

    Als Geldeingang werden alle eingehenden Überweisungen von anderen Konten gewertet.
    Eigenüberweisungen zwischen Ihren eigenen Konten bei der Kompass Direktbank werden
    nicht berücksichtigt.


    Weitere Informationen zur Produktstruktur entnehmen Sie bitte dem Dokument Kompass
    Girokonto — Überblick.'
  domain: retail_banking
  product_category: girokonto
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 3fb27236-cc2e-5387-81ac-062ce992e490
  title: Kompass Girokonto — abschließen und aktivieren
  body: 'Der Weg zu Ihrem neuen digitalen Konto ist einfach und erfolgt vollständig
    in unserer App. Bitte stellen Sie sicher, dass Sie ein gültiges Ausweisdokument
    und ein Smartphone bereit haben.


    1. **Persönliche Daten angeben**: Nennen Sie uns Ihren vollständigen Namen, Ihre
    aktuelle Anschrift sowie Ihre steuerliche Identifikationsnummer.

    2. **Identität verifizieren**: Wir führen eine Identitätsprüfung durch. Hierzu
    nutzen wir die starke Kundenauthentifizierung (SCA). Sie werden aufgefordert,
    Fotos Ihres Ausweises hochzuladen und ein kurzes Selfie-Video zur Bestätigung
    zu erstellen.

    3. **Konditionen prüfen und bestätigen**: Wir legen Ihnen die Vertragsbedingungen
    vor, einschließlich der monatlichen Kontoführungsgebühr von 4,90 € und der Regelung
    zum Erlass dieser Gebühr ab einem Geldeingang von 700 €.

    4. **Vertrag digital unterzeichnen**: Bestätigen Sie den Vertrag mit Ihrer digitalen
    Signatur direkt in der App.

    5. **Konto-Aktivierung**: Sobald unsere Prüfung erfolgreich abgeschlossen ist,
    erhalten Sie eine Bestätigung in der App. Ihr Konto ist nun aktiv und bereit für
    den ersten Geldeingang.

    6. **Karte bereitstellen**: Parallel zur Kontoeröffnung wird Ihre kostenlose Visa
    Debitkarte erstellt und an Ihre hinterlegte Adresse versandt.


    Sie wissen, dass der Vorgang erfolgreich war, wenn Sie in der App Ihren neuen
    IBAN einsehen können und Ihr Kontostand mit 0,00 € angezeigt wird. Falls Sie Unterstützung
    beim Übertrag Ihrer alten Kontodaten benötigen, nutzen Sie unsere Kontowechselhilfe.'
  domain: retail_banking
  product_category: girokonto
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 16ac650f-7e2e-5a43-a06d-d18a1a12df92
  title: Kompass Girokonto — Preis- und Leistungsverzeichnis
  body: 'Nachfolgend sind die geltenden Entgelte für das Kompass Girokonto aufgeführt:


    *   **Monatliche Kontoführungsgebühr**: 4,90 €

    *   **Kondition für Gebührenfreiheit**: 0,00 € bei einem monatlichen Geldeingang
    von mindestens 700 €

    *   **Zinssatz für Dispositionskredite (Sollzinsen)**: 9,89 % p.a.


    Alle Gebühren sind transparent in der App einsehbar. Wir verzichten auf versteckte
    Kosten, um eine maximale Planbarkeit für unsere Kunden zu gewährleisten. Für weitere
    Details zur Zinsgestaltung siehe Kompass Girokonto — Zinsübersicht.'
