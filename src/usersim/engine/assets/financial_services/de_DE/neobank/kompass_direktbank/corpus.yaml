  mentions_tools: []
  institution_id: kompass_direktbank
- id: 7dc6adc7-3284-578e-b19e-f12d0c0f6259
  title: Echtzeitüberweisung — für wen und wofür geeignet
  body: 'Die Echtzeitüberweisung von Kompass Direktbank ist die ideale Lösung für
    Kunden, die maximale Flexibilität und Geschwindigkeit im Zahlungsverkehr benötigen.
    Während Standardüberweisungen oft einen Werktag in Anspruch nehmen, erreicht Ihr
    Geld beim Empfänger innerhalb von Sekunden.


    Für wen ist dieses Produkt geeignet?

    - Technikaffine Nutzer, die ihre Finanzen vollständig digital und in Echtzeit
    steuern möchten.

    - Personen, die häufig dringende Zahlungen tätigen müssen (z. B. kurzfristige
    Rechnungen oder Geldtransfers an Freunde und Familie).

    - Preisbewusste Kunden, die keine zusätzlichen Gebühren für beschleunigte Zahlungen
    akzeptieren.


    Wofür ist die Echtzeitüberweisung besonders nützlich?

    - Sofortige Begleichung von Online-Käufen oder Dienstleistungen, die eine sofortige
    Bestätigung des Zahlungseingangs erfordern.

    - Notfalltransfers, bei denen eine Verzögerung von einem Tag problematisch wäre.

    - Einfache Überweisungen im Alltag, bei denen die Bestätigung des Empfangs unmittelbar
    erfolgen soll.


    Die wichtigsten Konditionen auf einen Blick:

    - Kosten: Die Nutzung ist mit 0 € Gebühr absolut kostenlos.

    - Geschwindigkeit: Geldtransfers erfolgen in Sekunden, rund um die Uhr, an jedem
    Tag des Jahres.

    - Tageslimit: Sie können bis zu 5.000 € täglich per Echtzeitüberweisung senden.

    - Sicherheit: Jede Transaktion wird durch eine starke Kundenauthentifizierung
    (SCA) abgesichert. Zudem integrieren wir eine Empfängerüberprüfung, um sicherzustellen,
    dass Name und IBAN des Empfängers übereinstimmen.


    Die Echtzeitüberweisung ist perfekt in unser digitales Ökosystem integriert und
    ergänzt das Kompass Girokonto optimal, um ein nahtloses Banking-Erlebnis ohne
    Filialnetz zu ermöglichen. Weitere Details zur Kontoführung finden Sie im Dokument
    Kompass Girokonto — Überblick.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 9e1bab4a-daf0-5e3e-ad31-650691ed57e4
  title: 'Echtzeitüberweisung — Tageslimit für Echtzeitüberweisungen: Erklärung'
  body: 'Frage: Warum gibt es ein Tageslimit für Echtzeitüberweisungen und wie hoch
    ist dieses?


    Antwort: Um die Sicherheit Ihres Kontos zu erhöhen und das Risiko durch betrügerische
    Aktivitäten zu minimieren, haben wir ein tägliches Limit festgelegt. Das Tageslimit
    für Echtzeitüberweisungen beträgt 5.000 €. Dieser Betrag umfasst alle über den
    Tag verteilten Echtzeittransaktionen.


    Frage: Was passiert, wenn ich einen Betrag über 5.000 € überweisen möchte?


    Antwort: Beträge, die das Limit von 5.000 € überschreiten, können nicht als Echtzeitüberweisung
    versendet werden. In diesem Fall können Sie die Zahlung als Standardüberweisung
    ausführen. Diese wird wie gewohnt verarbeitet, benötigt jedoch die übliche Bearbeitungszeit
    der Banken. Die Kosten für die Standardüberweisung richten sich nach den Konditionen
    Ihres Kontos, wie in Echtzeitüberweisung — Preis- und Leistungsverzeichnis beschrieben.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: fda2ae06-6022-565e-93f6-1e11b1f82cd9
  title: Echtzeitüberweisung — kündigen, schließen oder den Tarif wechseln
  body: 'Da die Echtzeitüberweisung eine integrierte Funktion Ihres Kontos bei der
    Kompass Direktbank ist und mit 0 € kostenlosen Gebühren angeboten wird, gibt es
    keinen separaten Tarif, den man kündigen oder wechseln kann. Sie können die Funktion
    jedoch entweder deaktivieren oder das gesamte Konto schließen.


    Option 1: Deaktivierung der Echtzeit-Funktion

    Wenn Sie nicht mehr möchten, dass Ihre Überweisungen standardmäßig in Echtzeit
    erfolgen, können Sie dies in Ihren Einstellungen anpassen:

    1. Öffnen Sie die App und navigieren Sie zu den Zahlungseinstellungen.

    2. Wählen Sie den Punkt „Überweisungsmodus“ aus.

    3. Ändern Sie die Einstellung von „Echtzeit“ auf „Standard“.

    4. Bestätigen Sie die Änderung mit Ihrer starken Kundenauthentifizierung (SCA).

    Sie wissen, dass es funktioniert hat, wenn Ihnen bei der nächsten Überweisung
    nur noch die Standardlaufzeit angezeigt wird.


    Option 2: Schließung des Kontos

    Wenn Sie die gesamte Geschäftsbeziehung beenden möchten, um zu einem anderen Anbieter
    zu wechseln, gehen Sie wie folgt vor:

    1. Teilen Sie uns mit, dass Sie Ihr Konto schließen möchten.

    2. Geben Sie uns die IBAN eines Referenzkontos an, auf das das verbleibende Guthaben
    übertragen werden soll.

    3. Wir bestätigen Ihnen den Erhalt des Antrags und prüfen, ob noch offene Posten
    oder Daueraufträge bestehen.

    4. Nach erfolgreicher Abwicklung erhalten Sie eine digitale Bestätigung über die
    Kontoschließung.


    Sollten Sie Hilfe beim Übertrag Ihrer Lastschriften und Daueraufträge zu einem
    neuen Anbieter benötigen, können wir Sie durch unsere Kontowechselhilfe unterstützen.
    Weitere Informationen finden Sie im Dokument Kompass Girokonto — kündigen, schließen
    oder den Tarif wechseln.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 6848ffb4-d259-50c2-936e-cd51339422ff
  title: Echtzeitüberweisung — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Symptom: Ein Kunde berichtet, dass ihm für eine Echtzeitüberweisung eine
    Gebühr berechnet wurde oder der abgebuchte Betrag nicht mit dem eingegebenen Überweisungsbetrag
    übereinstimmt.


    Mögliche Ursachen:

    1. Verwechslung mit einer anderen Zahlungsart: Es wurde keine Echtzeitüberweisung,
    sondern eine andere, kostenpflichtige Transaktionsart genutzt.

    2. Fremdwährungsentgelte: Wenn die Überweisung in eine Währung außerhalb des Euro-Raums
    erfolgte, können Wechselkursgebühren anfallen, die nicht Teil der Transaktionsgebühr
    sind.

    3. Fehlerhafte Eingabe: Der Nutzer hat versehentlich einen anderen Betrag eingegeben.


    Schritte zur Prüfung:

    1. Prüfen Sie in den Transaktionsdetails der App, ob der Vorgang explizit als
    „Echtzeitüberweisung“ gekennzeichnet ist. Die Gebühr für diesen Dienst bei uns
    beträgt immer 0 €.

    2. Kontrollieren Sie, ob die Überweisung in Euro erfolgte. Bei Fremdwährungen
    gelten separate Konditionen.

    3. Gleichen Sie den in der Bestätigung angezeigten Betrag mit dem tatsächlich
    abgebuchten Betrag ab.


    Lösung:

    - Wenn eine Gebühr für eine reine SEPA-Echtzeitüberweisung in Euro berechnet wurde,
    handelt es sich vermutlich um einen Systemfehler. Wir werden den Betrag umgehend
    prüfen und eine entsprechende Korrekturbuchung vornehmen.

    - Wenn der Fehler auf eine falsche Betragseingabe durch den Kunden zurückzuführen
    ist, weisen Sie den Kunden darauf hin, dass Echtzeitüberweisungen aufgrund ihrer
    Geschwindigkeit nach der Autorisierung nicht mehr storniert werden können.


    Eskalation:

    Falls die Ursache nicht unmittelbar ersichtlich ist, wird der Fall an unser spezialisiertes
    Experten-Team für Zahlungsverkehr eskaliert. Der Kunde erhält innerhalb von zwei
    Werktagen eine Rückmeldung über den Status der Prüfung via In-App-Chat. Für weitere
    Informationen zu Kontogebühren sehen Sie bitte unter Kompass Girokonto — Kosten
    und Entgelte.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: ea0c3ce3-d8ea-5b00-bf78-a51765df9552
  title: Echtzeitüberweisung — erforderliche Unterlagen
  body: 'Da die Echtzeitüberweisung ein integriertes Feature unseres digitalen Banking-Angebots
    ist, gibt es keine separaten Antragsunterlagen für diesen Dienst. Die Berechtigung
    ergibt sich aus dem Status Ihres Kontos.


    | Voraussetzung | Erforderliche Unterlagen / Status | Ergebnis |

    | :--- | :--- | :--- |

