    2. Verpflichtungen des Nutzers: Der Karteninhaber ist verpflichtet, die Karte
    sowie die dazugehörige PIN sorgfältig zu verwahren. Die Herausgabe der Karte an
    Dritte ist untersagt. Jede zustandsändernde Aktion oder die Herausgabe von Kontodaten
    erfordert eine zwingende Identitätsverifizierung mittels starker Kundenauthentifizierung
    (SCA).


    3. Verpflichtungen der Bank: Die Kompass Direktbank stellt die digitale Infrastruktur
