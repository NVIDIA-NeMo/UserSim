- id: ad4d83e9-2726-5ef0-a8c5-9caf62b790f2
  title: Kompass Girokonto — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass eine Transaktion über Ihr Kompass Girokonto abgelehnt
    wird oder ein Vorgang gesperrt ist. Hier erfahren Sie, woran das liegen kann und
    wie Sie das Problem lösen.


    **Symptom**

    Sie erhalten in der App eine Fehlermeldung, dass eine Zahlung nicht ausgeführt
    werden konnte, oder eine Transaktion wird im Verlauf als „abgelehnt“ markiert.


    **Mögliche Ursachen und Prüfschritte**


    1. **Ungenügende Deckung**: Prüfen Sie Ihren aktuellen Kontostand. Wenn das Guthaben
    nicht ausreicht und kein eingeräumter Kreditrahmen vorhanden ist, wird die Zahlung
    abgelehnt. Beachten Sie, dass Überziehungen mit einem Zinssatz von 9,89 % verzinst
    werden.

    2. **Fehlende oder nicht abgeschlossene SCA**: Fast jede zustandsändernde Aktion
    erfordert eine starke Kundenauthentifizierung (SCA). Haben Sie die Zahlung in
    der App explizit freigegeben? Wenn die Verifizierung nicht abgeschlossen wurde,
    wird der Vorgang aus Sicherheitsgründen gesperrt.

    3. **Sicherheitsblockierung durch Betrugsschutz**: Unser System blockiert Transaktionen
    automatisch, wenn diese ungewöhnliche Muster aufweisen oder als riskant eingestuft
    werden (z. B. sehr hohe Beträge an neue Empfänger). Dies dient dem Schutz Ihres
    Guthabens.

    4. **Kartenstatus**: Prüfen Sie, ob Ihre zugehörige Karte (z. B. die Visa Debitkarte)
    eventuell gesperrt wurde.


    **Lösung und Fix**

    - **Bei Deckungsproblemen**: Führen Sie eine Überweisung auf Ihr Konto durch.
    Beachten Sie, dass ein monatlicher Geldeingang von 700 € zudem die Kontoführungsgebühr
    von 4,90 € erlastName lässt.

    - **Bei SCA-Problemen**: Starten Sie den Vorgang erneut und folgen Sie den Anweisungen
    zur Verifizierung in der App.

    - **Bei Sicherheitsblockierungen**: Wenn Sie die Transaktion selbst initiiert
    haben, nutzen Sie den digitalen Chat in der App. Wir werden Ihre Identität verifizieren
    und den Vorgang manuell prüfen.


    **Eskalation**

    Falls das Problem nicht unmittelbar gelöst werden kann, wird Ihr Fall an einen
    spezialisierten menschlichen Experten eskaliert. Sie erhalten eine Benachrichtigung
    in der App, sobald die Prüfung abgeschlossen ist. Für weitere Informationen zur
    Sicherheit sehen Sie bitte Kompass Girokonto — Schutz vor Betrug und nicht autorisierten
    Vorgängen.'
