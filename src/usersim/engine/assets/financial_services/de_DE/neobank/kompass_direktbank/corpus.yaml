  institution_id: kompass_direktbank
- id: 0a73c3da-3c8c-548d-b76c-c0aeb4cb3d55
  title: Kompass Tagesgeld — Vergleich mit Alternativen und wann es nicht passt
  body: 'Das Kompass Tagesgeld ist ein Instrument zur kurzfristigen Liquiditätssicherung
    mit Zinsgewinn. Um eine fundierte Entscheidung zu treffen, sollten Sie die Vor-
    und Nachteile gegenüber anderen Optionen abwägen.


    **Vergleich mit dem Girokonto**

    Ein Girokonto (wie unser Kompass Girokonto) dient dem Zahlungsverkehr. Es bietet
    maximale Flexibilität für tägliche Ausgaben, verzinst das Guthaben jedoch in der
    Regel nicht oder nur sehr geringfügig. Das Kompass Tagesgeld hingegen bietet mit
    einem Neukundenzins von 2,6 % (für 4 Monate) und einem Standardzins von 1,75 %
    eine echte Rendite. Der Nachteil: Sie können vom Tagesgeld-Konto nicht direkt
    bezahlen oder Geld abheben.


    **Vergleich mit Festgeld**

    Im Gegensatz zu Festgeldanlagen bleibt Ihr Kapital beim Kompass Tagesgeld jederzeit
    verfügbar. Sie können jederzeit Beträge auf Ihr Girokonto zurücküberweisen. Im
    Gegenzug ist der Zinssatz variabel und nicht über Jahre hinweg garantiert, wie
    es bei Festgeld der Fall wäre.


    **Wann das Produkt NICHT passt**

    Das Kompass Tagesgeld ist nicht die richtige Wahl für Sie, wenn:

    - **Direkter Zugriff benötigt wird:** Wenn Sie Geld für Einkäufe benötigen, ist
    die Kombination aus Kompass Girokonto und der Kompass Visa Debitkarte die einzige
    Lösung, da das Tagesgeld-Konto keine Karte besitzt.

    - **Maximale Rendite ohne Zeitbezug gesucht wird:** Wenn Sie Ihr Geld für einen
    Zeitraum von mehreren Jahren binden können, bieten Festgeldprodukte meist höhere
    Sätze als unser Standardzins von 1,75 %.

    - **Komplexe Anlagestrategien gewünscht sind:** Wir bieten allgemeine finanzielle
    Bildung, aber keine individualisierte Anlageberatung. Wenn Sie ein diversifiziertes
    Portfolio aus Aktien oder Fonds suchen, ist ein reines Tagesgeld-Konto nur ein
    kleiner Baustein Ihrer Strategie.


    Zusammenfassend: Das Produkt ist ideal als „Parkplatz“ für Geld, das Sie eventuell
    bald benötigen, aber bis dahin verzinst wissen wollen.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 04919049-a0e9-596c-ad5f-b28de5ecd2d3
  title: Kompass Tagesgeld — Voraussetzungen und Abschluss
  body: '**Welche Voraussetzungen muss ich erfüllen, um ein Kompass Tagesgeld-Konto
    zu eröffnen?**

    Sie müssen bereits Kunde der Kompass Direktbank sein und über ein aktives Kompass
    Girokonto verfügen. Da wir eine rein digitale Bank sind, setzen wir voraus, dass
    Ihre Identität bereits erfolgreich durch unsere starken Kundenauthentifizierungsprozesse
    (SCA) verifiziert wurde.


    **Wie schließe ich das Konto ab?**

    Der Abschluss erfolgt vollständig digital über die App. Unter dem Menüpunkt „Produkte“
    wählen Sie das Kompass Tagesgeld aus und bestätigen die Eröffnung mit einem Klick.
    Es sind keine physischen Unterlagen oder Unterschriften erforderlich.


    **Erhalte ich den Neukundenzins auch, wenn ich bereits ein Girokonto habe?**

    Ja, der Neukundenzins von 2,6 % bezieht sich auf die erstmalige Eröffnung eines
    Tagesgeld-Kontos bei uns. Dieser Zins gilt für die ersten 4 Monate nach der Kontoeröffnung.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 4e1b263d-bc92-58ca-bad7-5f3e5c0fdf21
  title: Kompass Tagesgeld — ein typisches Anliegen vollständig erledigen
  body: "In diesem Leitfaden zeigen wir Ihnen, wie Sie den gesamten Prozess von der\
    \ Eröffnung des Kompass Tagesgeld-Kontos über die erste Einzahlung bis hin zur\
    \ späteren Nutzung Ihres Geldes vollständig abwickeln.\n\n**Schritt 1: Konto eröffnen**\n\
    Öffnen Sie die App und navigieren Sie zu „Produkte“. Wählen Sie dort das „Kompass\
    \ Tagesgeld“. Bestätigen Sie die Produktbedingungen. Da Sie bereits ein Girokonto\
    \ bei uns haben, ist die Identitätsprüfung bereits hinterlegt. Ihr Konto ist sofort\
    \ nach der Bestätigung aktiv.\n\n**Schritt 2: Guthaben aufbauen (Einzahlung)**\n\
    Um von den Zinsen zu profitieren, müssen Sie Geld auf das Konto übertragen. Gehen\
    \ Sie auf „Transfer“ $\rightarrow$ „Interner Transfer“. Wählen Sie Ihr Girokonto\
    \ als Quelle und das Kompass Tagesgeld als Ziel. Geben Sie den gewünschten Betrag\
    \ ein und bestätigen Sie den Vorgang per SCA. Das Geld ist sofort auf dem Tagesgeld-Konto\
    \ verfügbar und beginnt ab dem nächsten Werktag zu verzinsen.\n\n**Schritt 3:\
    \ Zinsen beobachten**\nIn den ersten 4 Monaten wird Ihr Guthaben mit 2,6 % verzinst.\
    \ Nach Ablauf dieser Zeit wechselt der Satz automatisch auf 1,75 %. Sie können\
    \ die Zinsgutschriften jederzeit in Ihrem Transaktionsverlauf einsehen.\n\n**Schritt\
    \ 4: Geld wieder verwenden (Auszahlung)**\nWenn Sie über Ihr Erspartes verfügen\
    \ möchten, führen Sie erneut einen internen Transfer durch: Wählen Sie diesmal\
    \ das Kompass Tagesgeld als Quelle und das Girokonto als Ziel. Nach der Bestätigung\
    \ steht das Geld auf Ihrem Girokonto zur freien Verfügung, beispielsweise für\
    \ Zahlungen mit der Kompass Visa Debitkarte.\n\n**Ergebnis**\nSie haben Ihr Erspartes\
    \ sicher und verzinst angelegt und konnten es bei Bedarf flexibel wieder abrufen.\
    \ Der gesamte Prozess erfolgte ohne Papierkram und rein digital über die App."
  domain: retail_banking
  product_category: tagesgeld
  document_type: how_to_guide
  source_authority: official
