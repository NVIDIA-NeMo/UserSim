- id: e6d1cab9-65dd-5e1e-b856-fa95c62122bf
  title: Kompass Tagesgeld — Probleme mit Zugang oder Login
  body: 'Wenn Sie Schwierigkeiten haben, auf Ihr Kompass Tagesgeld Konto zuzugreifen
    oder sich nicht einloggen können, finden Sie hier die entsprechenden Lösungsschritte.
    Da wir maximale Transparenz und eine intuitive App-Experience bieten, sind die
    meisten Login-Probleme schnell behebbar.


    **Symptome:**

    - Die App gibt eine Fehlermeldung beim Eingeben der Zugangsdaten aus.

    - Die starke Kundenauthentifizierung (SCA) schlägt fehl oder die Bestätigung wird
    nicht zugestellt.

    - Das Konto erscheint nicht in der Übersicht, obwohl die Eröffnung bestätigt wurde.


    **Ursachenprüfung und Lösungen (in dieser Reihenfolge zu prüfen):**


    1. **Zugangsdaten prüfen:** Stellen Sie sicher, dass keine Tippfehler vorliegen
    und die Tastatur auf der korrekten Sprache steht. Versuchen Sie, Ihr Passwort
    über die „Passwort vergessen“-Funktion in der App zurückzusetzen.

    2. **App-Version aktualisieren:** Prüfen Sie im App Store oder Google Play Store,
    ob ein Update für die Kompass Direktbank App vorliegt. Veraltete Versionen können
    zu Authentifizierungsproblemen führen.

    3. **SCA-Verifizierung prüfen:** Stellen Sie sicher, dass Ihr Smartphone für die
    starke Kundenauthentifizierung korrekt registriert ist. Wenn die App-Bestätigung
    nicht erscheint, versuchen Sie, die App einmal komplett zu schließen und neu zu
    starten.

    4. **Internetverbindung:** Prüfen Sie, ob eine stabile Datenverbindung besteht,
    da unsere Dienste rein digital funktionieren und eine aktive Verbindung für die
    Sicherheitstests zwingend erforderlich ist.


    **Wenn das Problem weiterhin besteht:**

    Sollten diese Schritte nicht zum Erfolg führen, melden Sie dies bitte über den
    digitalen Chat. Wir werden Ihren Fall daraufhin an einen spezialisierten technischen
    Experten eskalieren. Wir prüfen dann die Status Ihrer Identitätsverifizierung
    und die Systemlogs.


    Sie erhalten innerhalb kurzer Zeit eine Rückmeldung in der App, sobald Ihr Zugang
    wieder vollständig hergestellt wurde. Beachten Sie, dass wir aus Sicherheitsgründen
    niemals Passwörter per Chat oder E-Mail versenden.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 9512c771-02fd-53c7-9782-e332c853fde2
  title: Kompass Tagesgeld — Zugangsstufen
  body: 'Diese Matrix dient Support-Mitarbeitern zur schnellen Prüfung, ob ein Kunde
    die Voraussetzungen für die Eröffnung eines Kompass Tagesgeld Kontos erfüllt.


    | Bedingung | Ergebnis | Anmerkung |

    | :--- | :--- | :--- |

    | Volljährigkeit und Wohnsitz in Deutschland | Zugänglich | Gesetzliche Voraussetzung
    für den Kontrag Abschluss. |

    | Erfolgreiche digitale Identitätsprüfung (SCA) | Zugänglich | Zwingend erforderlich
    vor Kontoaktivierung. |

    | Bestehendes Tagesgeldkonto bei Kompass Direktbank | Standardkonditionen | Neukundenzins
    von 2,6 % entfällt; es gilt der Standardzins von 1,75 %. |

    | Erstmalige Eröffnung (Neukunde) | Aktionskonditionen | Berechtigt zum Neukundenzins
    von 2,6 % für die ersten 4 Monate. |

    | Fehlgeschlagene Identitätsprüfung | Nicht zugänglich | Konto kann erst nach
    erfolgreicher Verifizierung aktiviert werden. |


    Bei Fragen zum Onboarding-Prozess verweisen Sie bitte auf Kompass Tagesgeld —
    Schritt für Schritt starten.'
