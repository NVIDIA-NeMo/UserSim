- id: 31435561-4e3f-5646-87bf-0311e2a1e359
  title: Kompass Visa Debitkarte — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Die Sicherheit Ihres Geldes hat für uns höchste Priorität. Da die Kompass
    Visa Debitkarte weltweit einsetzbar ist, gibt es spezifische Betrugsmuster, auf
    die Sie achten sollten, insbesondere wenn Sie unser Angebot mit anderen Banken
    vergleichen.


    Ein häufiges Szenario ist das sogenannte ''Phishing'' oder ''Smishing''. Betrüger
    senden Nachrichten, die wie offizielle Mitteilungen der Kompass Direktbank aussehen,
    und behaupten, Ihre Karte sei gesperrt worden. Sie werden aufgefordert, auf einen
    Link zu klicken und Ihre Zugangsdaten oder Ihre PIN einzugeben. Bitte beachten
    Sie: Wir fordern Sie niemals per SMS, E-Mail oder Telefon dazu auf, Ihre PIN,
    Ihre TAN oder andere Sicherheitscodes preiszugeben.


    Ein weiteres Risiko ist das ''Skimming'', bei dem an Geldautomaten unbefugte Lesegeräte
    installiert werden, um Kartendaten zu stehlen. Wir empfehlen Ihnen, den Kartensteckplatz
    vor der Nutzung kurz zu prüfen. Da wir konsequent auf die starke Kundenauthentifizierung
    (SCA) setzen, sind viele Online-Zahlungen bereits durch eine zusätzliche Verifizierung
    in der App geschützt, was das Risiko bei gestohlenen Kartendaten massiv senkt.


    Sollten Sie den Verdacht haben, dass Ihre Daten kompromittiert wurden oder die
    Karte verloren gegangen ist, ist die schnellstmögliche Meldung entscheidend. Wir
    wenden die Haftungsbegrenzung bei Kartenverlust gemäß BGB konsequent an, jedoch
    ist eine unverzügliche Sperrung notwendig, um weiteren Schaden zu begrenzen. In
    der App können Sie Ihre Karte mit einem Klick sofort deaktivieren.


    Wenn Sie eine unbefugte Abbuchung bemerken, bearbeiten wir diese Reklamation prioritär
    über die App. Beachten Sie dabei die gesetzlichen Fristen, wie beispielsweise
    die acht-wöchige Rückgabefrist für SEPA-Lastschriften, sofern die Transaktion
    über dieses Verfahren erfolgte.


    Bleiben Sie wachsam: Eine dringende Aufforderung zur Preisgabe von Geheimnissen
    ist fast immer ein Zeichen für Betrug.'
  domain: cards
  product_category: visa_debit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: bb10086e-44f2-5a8a-a82b-f28327e095a0
  title: Kompass Visa Debitkarte — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Leitfaden für Support-Mitarbeiter, um Kunden über
    die spezifischen Grenzen und Einschränkungen der Kompass Visa Debitkarte aufzuklären.
    Es ist wichtig, diese Punkte transparent zu kommunizieren, um Fehlbedienungen
    zu vermeiden.


    Die Kompass Visa Debitkarte ist, wie der Name bereits sagt, eine Debitkarte. Das
    bedeutet, dass Zahlungen und Abhebungen in Echtzeit oder mit minimaler Verzögerung
    direkt vom verknüpften Girokonto abgebucht werden. Es gibt keinen Kreditrahmen;
    Transaktionen schlagen fehl, wenn das Guthaben auf dem Konto nicht ausreicht.


    Ein wesentlicher Punkt bei der Bargeldbeziehung ist der Mindestbetrag für Abhebungen.
    An Geldautomaten gibt es einen Mindestbetrag für eine einzelne Auszahlung von
    50 €. Beträge unter dieser Grenze können nicht abgehoben werden. Kunden, die häufig
    kleinere Beträge in bar benötigen, sollten dies bei der Planung berücksichtigen.


    In Bezug auf die Nutzung im Ausland bietet die Karte eine maximale Transparenz:
    Es fällt ein Fremdwährungsentgelt von 0 % an, was bedeutet, dass keine zusätzlichen
    prozentualen Gebühren für die Umrechnung in Fremdwährungen erhoben werden. Dennoch
    können externe Geldautomatenbetreiber eigene Gebühren für die Nutzung ihrer Infrastruktur
    erheben, auf die die Kompass Direktbank keinen Einfluss hat.


    Die Karte ist weltweit einsetzbar, sofern der Händler Visa akzeptiert. In Sonderfällen,
    wie etwa bei Mietwagenfirmen oder einigen Hotels, wird oft eine Kreditkarte (Credit
    Card) zur Hinterlegung einer Kaution verlangt. Da unsere Karte eine Debitkarte
    ist, kann es vorkommen, dass sie für solche spezifischen Reservierungen nicht
    akzeptiert wird oder die Kaution tatsächlich als Betrag vom Konto abgezogen und
    erst später erstattet wird.


    Zusammenfassend: Die Karte ist ideal für den digitalen Alltag und Reisen, stößt
    jedoch dort an Grenzen, wo ein echter Kreditrahmen oder sehr kleine Bargeldauszahlungen
    gefordert sind.'
  domain: cards
  product_category: visa_debit
  document_type: product_sheet
  source_authority: official
