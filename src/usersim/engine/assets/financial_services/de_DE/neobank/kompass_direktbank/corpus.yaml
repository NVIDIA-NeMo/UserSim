- id: 2c958ae1-b4a8-5e6f-8cdd-d7f52605773a
  title: 'Kompass Tagesgeld — Dauer des Neukundenzinses (Monate): Erklärung'
  body: 'Frage: Wie lange genau erhalte ich den Neukundenzins auf meinem Kompass Tagesgeld?


    Antwort: Der attraktive Neukundenzins von 2,6 % ist ein zeitlich befristetes Angebot
    zur Begrüßung neuer Kunden. Dieser Zinssatz gilt für einen Zeitraum von genau
    4 Monaten ab dem Datum der Kontoeröffnung.


    Frage: Was passiert, wenn die 4 Monate abgelaufen sind?


    Antwort: Nach Ablauf der 4 Monate wechselt die Verzinsung automatisch und ohne
    Ihr Zutun in den Standardzinssatz. Dieser beträgt aktuell 1,75 %. Sie müssen keine
    Anträge stellen oder den Tarif manuell wechseln; die Systemumstellung erfolgt
    automatisch. Weitere Details zur Zinsgestaltung finden Sie auch in unserem Dokument
    Kompass Tagesgeld — Zinsübersicht.'
