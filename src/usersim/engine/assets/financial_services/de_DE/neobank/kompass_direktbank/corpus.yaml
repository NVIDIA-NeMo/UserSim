  title: Kompass Visa Debitkarte — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Wenn ein Kunde meldet, dass ein Betrag oder ein Entgelt auf seinem Konto
    erscheint, das er nicht erwartet hat, gehen Sie als Support-Agent nach folgendem
    Schema vor:


    **Symptom:** Der Kunde erkennt eine Abbuchung nicht oder wundert sich über einen
    zusätzlichen Betrag bei einer Auslandstransaktion.


    **Mögliche Ursachen und Prüfschritte:**

    1. **Überprüfung des Fremdwährungsentgelts:** Da unser Fremdwährungsentgelt 0
    % beträgt, darf keine zusätzliche Gebühr der Kompass Direktbank für die Währungsumrechnung
    aufgeführt sein. Prüfen Sie, ob die Differenz durch den Wechselkurs des Netzwerks
    oder durch eine Gebühr des Händlers (Dynamic Currency Conversion) entstanden ist.

    2. **Prüfung des Mindestbetrags:** Bei Bargeldabhebungen ist zu prüfen, ob der
    Kunde den Mindestbetrag für die Auszahlung von 50 € beachtet hat. Fehlermeldungen
    am Automaten sind hier oft die Ursache für nicht durchgeführte Vorgänge.

    3. **Abonnements und versteckte Kosten:** Prüfen Sie, ob es sich um eine wiederkehrende
    Zahlung handelt, die der Kunde eventuell vergessen hat.


    **Lösungsweg:**

    - Wenn es sich um einen Fehler unsererseits handelt, leiten wir eine sofortige
    Korrektur ein.

    - Wenn der Betrag von einem Händler unberechtigt eingezogen wurde, weisen wir
    den Kunden an, die Reklamation prioritär über die In-App-Funktion einzureichen.


    **Eskalation:**

    Wenn die Ursache nicht unmittelbar ersichtlich ist oder der Kunde einen Betrug
    vermutet, eskalieren wir den Fall an unsere spezialisierten Experten für Betrugsprävention.
    Wir eröffnen eine entsprechende Fallnummer und informieren den Kunden über die
    zu erwartende Bearbeitungszeit gemäß den gesetzlichen Fristen.


    Weitere Informationen zu fehlgeschlagenen Vorgängen finden Sie unter Kompass Visa
    Debitkarte — fehlgeschlagener oder ausstehender Vorgang.'
