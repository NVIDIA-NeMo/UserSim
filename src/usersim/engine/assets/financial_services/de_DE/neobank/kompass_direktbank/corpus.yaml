- id: 0c8c13db-fda4-5b0e-a3c0-3b36fbaf7f37
  title: Kompass Visa Debitkarte — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sicherheit Ihrer Finanzen hat bei der Kompass Direktbank höchste Priorität.
    Da die Kompass Visa Debitkarte weltweit einsetzbar ist, gibt es spezifische Betrugsmuster,
    auf die Sie achten sollten.


    Ein häufiges Szenario ist das sogenannte ''Phishing'', bei dem Betrüger versuchen,
    über gefälschte E-Mails oder SMS an Ihre Kartendaten zu gelangen. Bitte beachten
    Sie: Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder im Chat nach
    Ihrer vollständigen PIN, Ihrem CVC-Code oder Ihren vollständigen Zugangsdaten
    fragen. Jede Aufforderung, diese sensiblen Daten über einen unsicheren Kanal preiszugeben,
    ist ein Betrugsversuch.


    Zum Schutz Ihrer Transaktionen setzen wir konsequent auf die starke Kundenauthentifizierung
    (SCA). Dies bedeutet, dass Online-Zahlungen in der Regel durch eine zusätzliche
    Bestätigung in unserer App gesichert werden. Sollten Sie eine Transaktion bemerken,
    die Sie nicht selbst autorisiert haben, ist die erste und wichtigste Maßnahme
    das sofortige Sperren der Karte direkt über die In-App-Funktionen. Dies verhindert
    unmittelbar weitere nicht autorisierte Abbuchungen.


    Bezüglich Ihrer Haftung bei Kartenverlust oder Diebstahl wenden wir die gesetzlichen
    Bestimmungen des Bürgerlichen Gesetzbuches (BGB) konsequent an. Dies schließt
    die Haftungsbegrenzung für nicht autorisierte Zahlungen ein, sofern Sie uns den
    Verlust unverzüglich melden. Reklamationen und Betrugsmeldungen bearbeiten wir
    prioritär über die App, wobei wir uns strikt an die gesetzlichen Fristen halten.
    Für SEPA-Lastschriften gilt beispielsweise eine acht-wöchige Rückgabefrist.


    Um Ihr Konto optimal zu schützen, empfehlen wir die Aktivierung von Echtzeit-Benachrichtigungen
    in der App. So werden Sie über jede Bewegung auf Ihrem Konto sofort informiert
    und können im Ernstfall blitzschnell reagieren. Für weitere allgemeine Sicherheitshinweise
    zu Ihrem Konto besuchen Sie bitte das Dokument Kompass Girokonto — Sicherheitstipps
    für Ihr Konto.'
