- id: 3877cd98-1e30-5327-9e94-f5722dca66b7
  title: Kompass Girokonto — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie Ihre persönlichen Daten oder Kontoeinstellungen
    in Ihrem Kompass Girokonto aktualisieren. Da wir eine rein digitale Bank sind,
    können Sie diese Änderungen schnell und unkompliziert direkt über die App vornehmen.


    **Voraussetzungen:**

    - Ihr Smartphone mit der installierten Kompass Direktbank App.

    - Ein gültiges Identifikationsmittel für die starke Kundenauthentifizierung (SCA).


    **Schritte zur Änderung Ihrer Daten:**


    1. Navigieren Sie in der App zum Bereich „Profil & Einstellungen“.

    2. Wählen Sie den Punkt aus, den Sie ändern möchten (z. B. „Kontaktinformationen“,
    „Adresse“ oder „Benachrichtigungseinstellungen“).

    3. Geben Sie die neuen Informationen in die entsprechenden Felder ein.

    4. Bestätigen Sie die Änderung durch Klicken auf „Speichern“ oder „Aktualisieren“.

    5. Führen Sie die erforderliche Identitätsprüfung mittels SCA durch. Dies ist
    für jede zustandsändernde Aktion zwingend erforderlich, um die Sicherheit Ihres
    Kontos zu gewährleisten.


    **Wie wissen Sie, dass es funktioniert hat?**

    Nach erfolgreicher Verifizierung erhalten Sie eine sofortige Bestätigung innerhalb
    der App. Zudem senden wir Ihnen eine kurze Benachrichtigung an Ihre hinterlegte
    E-Mail-Adresse, dass Ihre Daten erfolgreich aktualisiert wurden.


    Sollten Sie Probleme bei der Änderung Ihrer Daten haben oder eine komplexere Anpassung
    benötigen, die über die Standard-App-Funktionen hinausgeht, können Sie uns über
    den digitalen Chat kontaktieren. Wir werden Ihr Anliegen prüfen und gegebenenfalls
    an einen spezialisierten Experten eskalieren. Weitere Details zur Kontoverwaltung
    finden Sie in Kompass Girokonto — Überblick.'
