- id: ec6d4a82-c856-5008-bafb-e113045ec42e
  title: Kompass Girokonto — Status oder Verlauf einsehen
  body: 'In dieser Anleitung erfahren Sie, wie Sie Ihren aktuellen Kontostand sowie
    den detaillierten Transaktionsverlauf Ihres Kompass Girokontos einsehen können.
    Da wir eine rein digitale Bank sind, erfolgt dieser Prozess vollständig über unsere
    App.


    **Voraussetzungen**

    Sie benötigen die installierte Kompass Direktbank App und Ihre gültigen Zugangsdaten
    zur Authentifizierung.


    **Schritte zum Einsehen des Status und Verlaufs**


    1. **Anmeldung in der App**: Öffnen Sie die App und loggen Sie sich mit Ihrer
    gewohnten Methode (Biometrie oder PIN) ein. Die starke Kundenauthentifizierung
    (SCA) sorgt hierbei für den sicheren Zugang zu Ihren Finanzdaten.

    2. **Kontoeinsicht wählen**: Auf dem Dashboard sehen Sie direkt Ihr Kompass Girokonto.
    Tippen Sie auf die Kachel des Kontos, um die Detailansicht zu öffnen.

    3. **Aktueller Status**: Im oberen Bereich der Detailansicht wird Ihnen der aktuelle
    verfügbare Kontostand in Echtzeit angezeigt. Dieser Betrag ist Ihr tagesaktuelles
    Guthaben.

    4. **Transaktionsverlauf prüfen**: Scrollen Sie nach unten, um die chronologische
    Liste aller Kontobewegungen zu sehen. Hier sind alle eingehenden und ausgehenden
    Zahlungen detailliert mit Datum, Empfänger/Absender und Betrag aufgeführt.

    5. **Suche und Filter**: Nutzen Sie die Suchfunktion oder die Filter-Optionen
    (z. B. Zeitraum oder Kategorie), um gezielt nach bestimmten Buchungen zu suchen.


    **Woran erkenne ich, dass der Vorgang erfolgreich war?**

    Sobald die Liste der Transaktionen geladen wurde und Ihr aktueller Kontostand
    sichtbar ist, haben Sie den gewünschten Status erfolgreich eingesehen.


    Sollten Sie Unstimmigkeiten in Ihrem Verlauf feststellen, finden Sie Unterstützung
    unter Kompass Girokonto — unerwartetes Entgelt oder unerwarteter Betrag.'
