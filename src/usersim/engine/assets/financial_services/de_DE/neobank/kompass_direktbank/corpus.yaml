- id: 40b69878-4fed-5ff9-b614-93e3b20e2564
  title: Häufige Fragen
  body: 'Hier finden Sie Antworten auf allgemeine Fragen zu unseren Services bei der
    Kompass Direktbank.


    Wie funktioniert der Support bei der Kompass Direktbank?

    Unser Support ist primär digital gestaltet. Alle Anliegen können effizient über
    die In-App-Funktionen oder den digitalen Chat erledigt werden. Bei komplexeren
    Themen erfolgt eine nahtlose Eskalation an unsere spezialisierten menschlichen
    Experten.


    Wie sicher sind meine Einlagen?

    Wir agieren strikt nach den Vorgaben der BaFin und der Deutschen Bundesbank. Ihr
    Guthaben ist durch die gesetzliche Einlagensicherung bis zu einem Betrag von 100.000
    € pro Kunde und Bank geschützt.


    Bieten Sie eine individuelle Finanzberatung an?

    Wir bieten allgemeine finanzielle Bildung und Produktinformationen an. Eine individualisierte
    Steuer- oder Rechtsberatung sowie eine persönliche Anlageberatung führen wir jedoch
    nicht durch. Produktempfehlungen erfolgen stets auf Basis objektiver Kriterien.


    Wie kann ich eine fehlerhafte Transaktion melden?

    Reklamationen und Betrugsmeldungen werden prioritär über die App bearbeitet. Melden
    Sie die Zahlung dort oder im Chat, wir prüfen sie umgehend.'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
