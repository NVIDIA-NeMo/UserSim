- id: 01472851-b580-563a-b3f4-9079759e0ee8
  title: Kompass Tagesgeld — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass eine Überweisung von Ihrem Kompass Tagesgeld auf
    ein anderes Konto oder eine Einzahlung darauf abgelehnt oder gesperrt wird. Dies
    ist in der Regel eine Sicherheitsmaßnahme zum Schutz Ihres Vermögens.


    **Mögliche Symptome**

    - Eine Fehlermeldung in der App bei der Ausführung eines Transfers.

    - Der Status einer Transaktion wird als „geblockt“ oder „in Prüfung“ angezeigt.

    - Die Überweisung wird in der Historie als „abgelehnt“ markiert.


    **Häufige Ursachen und Prüfschritte**

    1. **Fehlende starke Kundenauthentifizierung (SCA):** Prüfen Sie, ob Sie den Vorgang
    vollständig durch die geforderte Identitätsprüfung in der App bestätigt haben.
    Ohne erfolgreiche SCA werden zustandsändernde Aktionen strikt unterbunden.

    2. **Sicherheitslimit überschritten:** Überprüfen Sie, ob der Betrag ungewöhnlich
    hoch ist. Unsere Systeme können bei untypischen Mustern eine temporäre Sperre
    auslösen, um Betrug zu verhindern.

    3. **Referenzkonto-Prüfung:** Stellen Sie sicher, dass der Transfer über das verknüpfte
    Girokonto erfolgt. Direkte Überweisungen von Drittkonten auf das Tagesgeld-Konto
    können zur manuellen Prüfung durch unsere Experten führen, wenn die Empfängerüberprüfung
    nicht eindeutig ist.


    **Lösung und Eskalation**

    Wenn der Vorgang trotz korrekter Authentifizierung abgelehnt wurde, teilen Sie
    uns bitte den Zeitpunkt und den genauen Betrag der Transaktion im digitalen Chat
    mit.


    Wir werden dann folgende Schritte einleiten:

    - Wir prüfen den Vorgang im Rahmen unserer Compliance-Richtlinien gemäß BaFin.

    - Falls eine Sicherheitsperre vorliegt, fordern wir Sie ggf. zu einer erneuten
    Verifizierung Ihrer Identität auf.

    - Nach erfolgreicher Prüfung wird der Vorgang entweder manuell freigegeben oder
    mit einer detaillierten Begründung endgültig abgelehnt.


    Sie erhalten eine Benachrichtigung in der App, sobald die Prüfung abgeschlossen
    ist.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: a2217205-8752-5bba-ac60-59b0c68a6e9f
  title: Kompass Tagesgeld — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Ein Wechsel zum Kompass Tagesgeld lohnt sich insbesondere dann, wenn Sie
    kurzfristig verfügbares Kapital parken möchten, ohne auf eine attraktive Verzinsung
    zu verzichten.


    **Vergleich der Konditionen**

    - **Aktiver Zinsvorteil:** Für Neukunden bietet das Produkt einen Zinssatz von
    2,6 % für die ersten 4 Monate. Dies ist signifikant höher als die Verzinsung auf
    einem herkömmlichen Girokonto.

    - **Langfristige Perspektive:** Nach der Aktionsphase bleibt ein Standardzins
    von 1,75 % bestehen, was eine stabile Rendite bei voller Flexibilität bietet.

    - **Kostenstruktur:** Da das Konto keine Kontoführungsgebühren hat, bleibt die
    gesamte Zinsrendite bei Ihnen.


    **Empfehlung**

    - **Lohnt sich für:** Kunden, die einen Notgroschen aufbauen oder kurzfristige
    Ersparnisse sicher (Einlagensicherung bis 100.000 €) und verzinst anlegen wollen.

    - **Weniger geeignet:** Kunden, die ihr Geld für mehrere Jahre fest anlegen möchten,
    um noch höhere Zinsen zu erhalten (hier wären Festgeldprodukte die bessere Wahl).


    Für Informationen zur notwendigen Konto-Infrastruktur lesen Sie bitte Kompass
    Girokonto — Überblick.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: comparison
  source_authority: official
  placeholder: true
