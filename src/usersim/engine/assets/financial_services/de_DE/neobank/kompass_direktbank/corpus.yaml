- id: 4c7a296a-6372-5127-b007-c049a02bf8bf
  title: Echtzeitüberweisung — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter zur Handhabung
    von Sonderfällen und Limitierungen der Echtzeitüberweisung.


    Technische und finanzielle Grenzen:

    Die Echtzeitüberweisung ist an ein striktes tägliches Limit gebunden. Der maximale
    Betrag, der pro Tag via Echtzeitüberweisung transferiert werden kann, liegt bei
    5.000 €. Übersteigt ein gewünschter Transfer diesen Betrag, muss der Kunde auf
    eine Standard-Überweisung ausweichen oder den Betrag über mehrere Tage verteilt
    senden.


    Kostenstruktur:

    Das Produkt ist für den Kunden vollständig kostenfrei. Die Gebühr beträgt 0 €,
    unabhängig von der Anzahl der Transaktionen pro Monat, sofern das tägliche Limit
    eingehalten wird.


    Einschränkungen der Empfängerbanken:

    Ein wesentlicher Sonderfall ist die Kompatibilität der Empfängerbank. Obwohl Kompass
    Direktbank Echtzeitüberweisungen unterstützt, muss auch die Empfängerbank technisch
    in der Lage sein, diese in Echtzeit zu verarbeiten. Falls die Empfängerbank den
    Service nicht unterstützt, wird der Betrag automatisch als Standard-SEPA-Überweisung
    ausgeführt. In diesem Fall verlängert sich die Gutschriftsdauer auf die üblichen
    banküblichen Geschäftszeiten.


    Sicherheitsmechanismen:

    Jede Echtzeitüberweisung unterliegt der Empfängerüberprüfung. Hierbei wird automatisch
    abgeglichen, ob der angegebene Name zum hinterlegten IBAN-Konto passt. Schlägt
    dieser Abgleich fehl oder gibt es Unstimmigkeiten, kann der Vorgang aus Sicherheitsgründen
    blockiert oder zur manuellen Prüfung markiert werden. Alle Vorgänge erfordern
    zwingend eine starke Kundenauthentifizierung (SCA).'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 03fa6249-12f7-5839-9583-63211b38d430
  title: Echtzeitüberweisung — Voraussetzungen und Abschluss
  body: 'Häufig gestellte Fragen zu den Voraussetzungen der Echtzeitüberweisung:


    Frage: Was muss ich tun, um die Echtzeitüberweisung bei Kompass Direktbank zu
