- id: 985ce7f1-d485-5387-af0a-65cdc7f81bf0
  title: Echtzeitüberweisung — fehlgeschlagener oder ausstehender Vorgang
  body: 'Es kann vorkommen, dass eine Echtzeitüberweisung nicht wie erwartet ausgeführt
    wird. Hier sind die häufigsten Symptome, Ursachen und Lösungen aus Kundensicht:


    Symptom: „Die Option ''Echtzeitüberweisung'' ist ausgegraut oder nicht auswählbar.“

    Ursache: Die Empfängerbank unterstützt den SEPA-Echtzeitstandard nicht oder hat
    den Dienst vorübergehend deaktiviert.

    Lösung: Nutzen Sie in diesem Fall eine Standard-Überweisung. Diese wird ebenfalls
    kostenfrei ausgeführt, benötigt jedoch bis zu einem Werktag Zeit.


    Symptom: „Die Überweisung wurde mit einer Fehlermeldung bezüglich des Limits abgelehnt.“

    Ursache: Sie haben das tägliche Limit von 5.000 € bereits erreicht oder der aktuelle
    Betrag übersteigt dieses Limit.

    Lösung: Prüfen Sie Ihre heutigen Umsätze. Wenn das Limit von 5.000 € erreicht
    ist, können Sie den Restbetrag entweder am nächsten Kalendertag senden oder eine
    Standard-Überweisung (sofern diese höhere Limits erlaubt) nutzen.


    Symptom: „Die Zahlung ist als ''in Bearbeitung'' markiert, aber nicht beim Empfänger
    angekommen.“

    Ursache: Es liegt eine technische Störung im SEPA-Netzwerk oder bei der Empfängerbank
    vor.

    Lösung: Warten Sie bis zu 30 Minuten. In den meisten Fällen wird der Vorgang automatisch
    korrigiert. Sollte die Zahlung nach einer Stunde immer noch ausstehen, teilen
    Sie uns dies mit.


    Eskalation:

    Wenn eine Transaktion trotz korrekter Daten und ausreichendem Guthaben fehlschlägt,
    wird unser Team den Vorgang intern prüfen. Wir analysieren die Antwortcodes der
    beteiligten Banken und informieren Sie über den Status direkt in der App. In komplexen
    Fällen erfolgt eine nahtlose Eskalation an unsere spezialisierten Zahlungsexperten,
    die eine manuelle Klärung mit dem Partnerinstitut einleiten.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
