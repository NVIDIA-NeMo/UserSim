- id: 8acf8177-b3c2-5216-bb9d-e454c2a9ac12
  title: Kompass Visa Debitkarte — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihres Guthabens hat bei der Kompass Direktbank oberste Priorität.
    Da wir eine rein digitale Bank sind, setzen wir auf modernste Technologien, um
    Ihre Kompass Visa Debitkarte zu schützen. Bitte beachten Sie die folgenden Sicherheitshinweise,
    um Ihr Konto optimal abzusichern.


    **Starke Kundenauthentifizierung (SCA)**

    Für alle Online-Zahlungen und sensiblen Kontovorgänge setzen wir konsequent auf
    die starke Kundenauthentifizierung (SCA). Das bedeutet, dass Transaktionen über
    Ihre App doppelt verifiziert werden. Geben Sie niemals Ihre App-Zugangsdaten oder
    Bestätigungscodes an Dritte weiter.


    **Wichtige Warnhinweise**

    Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder Telefon dazu auffordern,
    Ihre PIN, Ihr Passwort oder Ihre vollständigen Kartendaten preiszugeben. Solche
    Anfragen sind immer ein Zeichen für Betrugsversuche (Phishing).


    **Verhalten bei Kartenverlust oder Diebstahl**

    Sollten Sie Ihre Kompass Visa Debitkarte verlieren oder den Verdacht auf einen
    Diebstahl haben, ist schnelles Handeln entscheidend. Sperren Sie die Karte sofort
    über die In-App-Funktion. Dies ist der schnellste Weg, um unbefugte Umsätze zu
    verhindern.


    **Haftung und Fristen**

    Wir halten uns strikt an die gesetzlichen Vorgaben des BGB. Im Falle eines Kartenverlusts
    gilt die gesetzliche Haftungsbegrenzung für den Kunden, sofern dieser nicht grob
    fahrlässig gehandelt hat. Bitte melden Sie unbefugte Transaktionen umgehend über
    die App, damit wir eine Priorisierung der Bearbeitung gewährleisten können.


    **Allgemeine Tipps**

    - Nutzen Sie für Online-Einkäufe nur verschlüsselte Verbindungen (https).

    - Überprüfen Sie Ihre Umsatzübersicht regelmäßig in der App.

    - Verwenden Sie für Ihren App-Login ein starkes, individuelles Passwort und ergänzen
    Sie dies durch biometrische Merkmale (Fingerabdruck oder Gesichtserkennung), falls
    Ihr Gerät dies unterstützt.


    Für weitere Informationen zum Schutz Ihres Kontos lesen Sie bitte auch das Dokument
    Kompass Girokonto — Sicherheitstipps für Ihr Konto.'
