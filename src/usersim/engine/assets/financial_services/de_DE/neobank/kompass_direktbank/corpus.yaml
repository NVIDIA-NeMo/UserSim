- id: 9eca77b4-e9a8-550d-a268-4b6a99198ea7
  title: Echtzeitüberweisung — ein typisches Anliegen vollständig erledigen
  body: 'Szenario: Sie müssen dringend eine Zahlung an einen Dienstleister leisten,
    damit eine Leistung sofort freigeschaltet wird. Sie möchten dies schnell, sicher
    und kostenfrei erledigen.


    So führen Sie diesen Vorgang vollständig durch:


    1. Bereiten Sie die Daten vor: Halten Sie den Namen des Empfängers und die vollständige
    IBAN bereit.

    2. Starten Sie die Überweisung: Navigieren Sie in Ihrer App zur Funktion ''Überweisung''.
    Geben Sie die Empfängerdaten und den gewünschten Betrag ein.

    3. Überprüfen Sie das Limit: Stellen Sie sicher, dass die Summe Ihrer heutigen
    Echtzeitüberweisungen einschließlich dieser Zahlung die Grenze von 5.000 € nicht
    überschreitet.

    4. Wählen Sie den Transfer-Typ: Aktivieren Sie explizit die Option ''Echtzeitüberweisung''.
    Sie sehen nun, dass die Gebühr 0 € beträgt.

    5. Durchlaufen Sie die Sicherheitsprüfung: Die App führt nun die Empfängerüberprüfung
    durch, um sicherzustellen, dass die IBAN zum Namen passt. Bestätigen Sie den Vorgang
    anschließend über die starke Kundenauthentifizierung (SCA).

    6. Erhalt der Bestätigung: Sie erhalten unmittelbar eine Meldung in der App, dass
    die Zahlung versendet wurde.


    Wie wissen Sie, dass es funktioniert hat?

    Prüfen Sie Ihren Transaktionsverlauf. Dort erscheint die Buchung sofort mit dem
    Status ''Erfolgreich''. Da es eine Echtzeitüberweisung ist, ist das Geld nun beim
    Empfänger eingegangen (vorausgesetzt, dessen Bank unterstützt den Standard). Sollten
    Sie Probleme mit dem Status haben, lesen Sie bitte Echtzeitüberweisung — Status
    oder Verlauf einsehen.'
