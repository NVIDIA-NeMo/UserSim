  title: Kompass Visa Debitkarte — abschließen und aktivieren
  body: 'Um Ihre Kompass Visa Debitkarte zu beantragen und für die erste Zahlung bereit
    zu machen, folgen Sie diesen einfachen Schritten:


    Was Sie benötigen:

    Ein bestehendes und verifiziertes Kompass Girokonto sowie Zugriff auf unsere App.


    Schritt 1: Beantragung der Karte

    Teilen Sie uns im digitalen Chat mit, dass Sie eine Kompass Visa Debitkarte beantragen
    möchten. Wir prüfen Ihre Berechtigung und bestätigen Ihnen die Bestellung umgehend
    in der Konversation.


    Schritt 2: Erhalt der Karte

    Die Karte wird Ihnen per Post an Ihre hinterlegte Adresse zugestellt. Zusammen
    mit der Karte erhalten Sie einen Brief mit Ihren Zugangsdetails.


    Schritt 3: Digitale Aktivierung

    Öffnen Sie die App und wählen Sie den Bereich Kartenverwaltung. Folgen Sie den
    Anweisungen zur Aktivierung. Hierbei setzen wir eine starke Kundenauthentifizierung
    (SCA) ein, um sicherzustellen, dass nur Sie Zugriff auf die Karte haben. Wir senden
    Ihnen eine Bestätigung der erfolgreichen Aktivierung direkt in die App.


    Schritt 4: Festlegung der PIN

    Vergeben Sie im gesicherten Bereich der App Ihre persönliche Geheimzahl (PIN).
    Sobald dies geschehen ist, ist die Karte einsatzbereit.


    Sie wissen, dass der Vorgang erfolgreich war, wenn in der App der Status Ihrer
    Karte auf „Aktiv“ springt und Sie Ihre erste Zahlung tätigen können.


