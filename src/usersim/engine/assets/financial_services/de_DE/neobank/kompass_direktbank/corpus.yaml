- id: 0cfdc12e-d743-5ca5-befe-bbc4a4027610
  title: Echtzeitüberweisung — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Echtzeitüberweisung bietet den Vorteil, dass Gelder innerhalb weniger
    Sekunden beim Empfänger eintreffen. Diese Geschwindigkeit ist jedoch auch ein
    Risiko, da im Falle eines Betrugs eine Rückholung der Mittel nahezu unmöglich
    ist. Im Gegensatz zu Standardüberweisungen gibt es bei Echtzeittransaktionen kaum
    Zeitfenster für einen Stopp des Vorgangs.


    Besonders vorsichtig sollten Sie bei Angeboten sein, die „zu gut klingen, um wahr
    zu sein“, oder bei dringenden Zahlungsaufforderungen von Personen, die Sie nicht
    persönlich kennen. Betrüger nutzen oft den Zeitdruck aus, um Sie zur Nutzung der
    Echtzeitüberweisung zu bewegen, damit das Geld sofort aus Ihrem Zugriffsbereich
    verschwindet.


    Kompass Direktbank schützt Ihre Transaktionen durch eine konsequente starke Kundenauthentifizierung
    (SCA). Das bedeutet, dass jede zustandsändernde Aktion in der App zwingend verifiziert
    wird. Bitte beachten Sie: Wir werden Sie niemals per E-Mail, SMS oder Telefon
    dazu auffordern, Ihre Zugangsdaten, PINs oder TANs preiszugeben, um eine Überweisung
    zu „freischalten“ oder zu „stornieren“.


    Sollten Sie den Verdacht haben, Opfer eines Betrugs geworden zu sein oder eine
    nicht autorisierte Echtzeitüberweisung in Ihrem Konto bemerkt haben, ist die erste
    Maßnahme die sofortige Meldung über die In-App-Funktionen. Reklamationen werden
    von uns prioritär bearbeitet. Beachten Sie dabei, dass wir uns strikt an die gesetzlichen
    Fristen halten.


    Um Ihr Risiko zu minimieren, empfehlen wir Ihnen, die Empfängerüberprüfung zu
    nutzen. Hierbei gleichen wir automatisch den Namen des Empfängers mit der angegebenen
    IBAN ab, bevor die Ausführung erfolgt. Dies verhindert Fehlüberweisungen an falsche
    Konten.


    Für weitere allgemeine Sicherheitstipps rund um Ihre Kontoführung besuchen Sie
    bitte das Dokument Kompass Girokonto — Sicherheitstipps für Ihr Konto.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 98bda451-3754-5d1e-8401-298f9f8f0f5b
  title: Echtzeitüberweisung — Allgemeine Geschäftsbedingungen
  body: 'Diese Geschäftsbedingungen regeln die Nutzung der Echtzeitüberweisung innerhalb
    der digitalen Infrastruktur der Kompass Direktbank. Die Nutzung dieses Dienstes
    setzt ein bestehendes Girokonto voraus.


    1. Leistungsbeschreibung und Kosten

    Die Kompass Direktbank stellt die Funktion zur Echtzeitüberweisung zur Verfügung,
    sofern die beteiligten Banken diesen Standard unterstützen. Für die Ausführung
    einer Echtzeitüberweisung wird ein Entgelt in Höhe von 0 € erhoben. Diese Gebührenfreiheit
    gilt unabhängig von der Häufigkeit der Nutzung, solange die Transaktionen innerhalb
    der festgelegten Limits bleiben.


    2. Limits und Beschränkungen

    Zur Sicherstellung der Systemstabilität und zur Betrugsprävention gilt ein tägliches
    Limit für Echtzeitüberweisungen in Höhe von 5.000 €. Dieser Betrag ist der kumulierte
    Maximalwert aller Echtzeittransaktionen innerhalb eines Kalendertages. Übersteigt
    ein Einzelvorgang oder die Summe der Tagesvorgänge diesen Betrag, kann die Überweisung
    nur als Standardüberweisung ausgeführt werden.


    3. Ausführung und Verfügbarkeit

    Eine Echtzeitüberweisung wird unmittelbar nach der Autorisierung durch den Nutzer
    verarbeitet. Die Kompass Direktbank agiert hierbei strikt nach den Vorgaben der
    BaFin und der Deutschen Bundesbank. Wir übernehmen keine Haftung für Verzögerungen,
    die durch die technischen Systeme der Empfängerbank oder durch notwendige Sicherheitsprüfungen
    im Rahmen der Geldwäscheprävention entstehen.


    4. Widerruf und Rückbuchung

    Aufgrund der technischen Beschaffenheit von Echtzeitüberweisungen ist eine Stornierung
    nach der Freigabe durch den Nutzer technisch nicht möglich. Rückforderungen sind
    nur über die gesetzlichen Wege (z. B. bei unberechtigten Lastschriften innerhalb
    der acht-wöchigen Rückgabefrist gemäß BGB) möglich, sofern die rechtlichen Voraussetzungen
    erfüllt sind.


    5. Änderungen der Bedingungen

    Die Kompass Direktbank behält sich vor, die Limits oder die Gebührenstruktur bei
    einer entsprechenden Änderung der digitalen Infrastrukturkosten anzupassen. Kunden
    werden über solche Änderungen transparent über die In-App-Kommunikation informiert.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: terms_conditions
  source_authority: official
