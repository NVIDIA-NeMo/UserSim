- id: b2bdc025-ec48-5fde-a02e-9197486e4457
  title: Kompass Girokonto — Probleme mit Zugang oder Login
  body: "Wenn Sie Probleme beim Zugriff auf Ihr Kompass Girokonto haben, finden Sie\
    \ hier die häufigsten Ursachen und die entsprechenden Lösungen. Da Sicherheit\
    \ bei uns an erster Stelle steht, sind die Zugangshürden bewusst hoch angesetzt.\n\
    \n**Symptom: „Login fehlgeschlagen“ oder App-Sperre**\n\n*   **Mögliche Ursachen:**\n\
    \    *   Mehrfache Eingabe eines falschen Passworts oder PINs.\n    *   Veraltete\
    \ App-Version.\n    *   Probleme mit der starken Kundenauthentifizierung (SCA).\n\
    \n*   **Prüfung und Lösung (in dieser Reihenfolge):**\n    1. **App-Update prüfen:**\
    \ Stellen Sie sicher, dass Sie die aktuellste Version der Kompass Direktbank App\
    \ aus dem App Store oder Google Play Store installiert haben.\n    2. **Passwort\
    \ zurücksetzen:** Nutzen Sie die Funktion „Passwort vergessen“ direkt im Login-Bildschirm.\
    \ Sie müssen Ihre Identität erneut verifizieren, um ein neues Passwort zu setzen.\n\
    \    3. **SCA-Verknüpfung prüfen:** Stellen Sie sicher, dass Ihr Gerät weiterhin\
    \ als vertrauenswürdiges Gerät für die starke Kundenauthentifizierung registriert\
    \ ist.\n\n**Symptom: Verifizierung schlägt fehl**\n\n*   **Mögliche Ursachen:**\n\
    \    *   Probleme mit dem Ausweisdokument während des digitalen Onboardings oder\
    \ einer Re-Verifizierung.\n    *   Instabile Internetverbindung.\n\n*   **Lösung:**\n\
    \    Überprüfen Sie die Bildqualität Ihrer Uploads. Stellen Sie sicher, dass alle\
    \ Ecken des Dokuments sichtbar sind und keine Reflexionen das Bild stören.\n\n\
    **Wann erfolgt eine Eskalation?**\nWenn die oben genannten Schritte nicht zum\
    \ Erfolg führen, wird Ihr Fall in unserem digitalen Chat an einen spezialisierten\
    \ Experten eskaliert. Wir werden Ihre Identität manuell prüfen, um den Zugriff\
    \ wiederherzustellen. Rechnen Sie in diesem Fall mit einer Bearbeitungszeit von\
    \ bis zu zwei Werktagen. Sie erhalten eine Bestätigung über den Status der Wiederherstellung\
    \ direkt in Ihre hinterlegte E-Mail-Adresse.\n\nFür weitere Informationen zu Fehlern\
    \ bei Transaktionen sehen Sie bitte Kompass Girokonto — fehlgeschlagener oder\
    \ ausstehender Vorgang."
