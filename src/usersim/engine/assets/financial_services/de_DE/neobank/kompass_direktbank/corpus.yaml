- id: 1a60f765-41f3-5167-9f6b-fc4ea82c182a
  title: Kompass Visa Debitkarte — etwas ändern
  body: 'In diesem Leitfaden erfahren Sie, wie Sie Einstellungen Ihrer Kompass Visa
    Debitkarte anpassen oder Änderungen an Ihrer Karte veranlassen können. Da wir
    ein rein digitales Service-Modell verfolgen, erledigen Sie diese Vorgänge direkt
    über unseren digitalen Chat oder die In-App-Funktionen.


    **Änderung der Kartenlimits**

    Wenn Sie Ihre täglichen oder monatlichen Ausgabenlimits anpassen möchten:

    1. Teilen Sie uns im digitalen Chat mit, dass Sie Ihr Kartenlimit ändern möchten.

    2. Wir fordern Sie zur Verifizierung Ihrer Identität auf (SCA).

    3. Nennen Sie uns den gewünschten neuen Limit-Betrag.

    4. Wir bestätigen Ihnen die Änderung sofort in der App, und das neue Limit ist
    ab diesem Moment aktiv.


    **Bestellung einer Ersatzkarte**

    Falls Ihre Karte beschädigt ist oder Sie eine neue benötigen:

    1. Informieren Sie uns über den Wunsch nach einer Ersatzkarte.

    2. Wir prüfen Ihre hinterlegte Adresse. Wenn Sie eine Adressänderung wünschen,
    führen Sie diesen Schritt zuerst durch.

    3. Wir bestätigen den Auftrag für die neue Karte. Da die Jahresgebühr 0 € beträgt,
    entfallen Grundgebühren für die Kartenführung, jedoch können für den physischen
    Ersatz Kosten anfallen (siehe Preisverzeichnis).

    4. Sie erhalten eine Bestätigung über den Versand der neuen Karte.


    **Änderung der PIN**

    Aus Sicherheitsgründen kann die physische PIN nicht einfach geändert werden. Wenn
    Sie Ihre PIN vergessen haben oder diese ändern möchten:

    1. Fordern Sie im Chat eine neue PIN an.

    2. Nach erfolgreicher Identitätsprüfung wird eine neue PIN generiert oder an Sie
    versandt.

    3. Wir bestätigen Ihnen den Abschluss des Vorgangs.


    Für weitere Informationen zu Ihren Kontoeinstellungen sehen Sie bitte auch Kompass
    Girokonto — etwas ändern.'
