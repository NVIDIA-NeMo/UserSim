- id: d6b04349-d04e-59f0-99cd-443c1c83ad66
  title: Kompass Girokonto — unerwartetes Entgelt oder unerwarteter Betrag
  body: 'Kunden berichten gelegentlich über Beträge auf ihrem Kontoauszug, die sie
    nicht unmittelbar zuordnen können. Hier sind die häufigsten Ursachen und die entsprechenden
    Lösungen.


    Symptom: Eine Abbuchung von 4,90 € als Kontoführungsentgelt.

    Ursache: In dem betreffenden Kalendermonat wurde der erforderliche Mindestgeldeingang
    von 700 € nicht erreicht. Daher wurde die reguläre monatliche Gebühr in Höhe von
    4,90 € erhoben.

    Prüfung: Überprüfen Sie Ihre Umsätze für den Vormonat. Summierten sich alle externen
    Geldeingänge auf mindestens 700 €?

    Lösung: Wenn die 700 € erreicht wurden, die Gebühr aber dennoch abgezogen wurde,
    melden Sie dies im Chat. Wir prüfen den Vorgang und erstatten die 4,90 € umgehend
    zurück.


    Symptom: Abbuchung von Zinsen bei negativem Kontostand.

    Ursache: Ihr Konto wurde überzogen. Überziehungen werden mit einem Zinssatz von
    9,89 % verzinst.

    Prüfung: War Ihr Kontostand zu irgendeinem Zeitpunkt im Monat negativ?

    Lösung: Gleichen Sie den Kontostand aus, um weitere Zinslasten zu vermeiden. Die
    Berechnung erfolgt auf Basis des täglichen Sollsaldos.


    Eskalation:

    Wenn Sie feststellen, dass ein Betrag trotz Erfüllung aller Bedingungen (z. B.
    Geldeingang > 700 €) fälschlicherweise abgezogen wurde, leiten wir den Fall an
    unsere spezialisierten Experten weiter. Wir prüfen die Transaktionshistorie und
    schreiben Ihnen den Betrag bei einem Fehler innerhalb weniger Werktage gut.'
