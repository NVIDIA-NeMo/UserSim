- id: d679f949-bb9a-572f-9933-ebc8b16afbd5
  title: Kompass Girokonto — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihres Guthabens hat bei der Kompass Direktbank höchste Priorität.
    Da wir eine rein digitale Bank sind, setzen wir auf modernste Technologien, um
    Ihr Kompass Girokonto zu schützen. Bitte beachten Sie die folgenden Sicherheitshinweise,
    um Ihr Konto vor unbefugtem Zugriff zu bewahren.


    Die starke Kundenauthentifizierung (SCA) ist das Herzstück unserer Sicherheit.
    Für alle zustandsändernden Aktionen, wie etwa Überweisungen oder die Änderung
    sensibler Kontodaten, ist eine Verifizierung Ihrer Identität zwingend erforderlich.
    Geben Sie Ihre SCA-Bestätigungscodes niemals an Dritte weiter. Beachten Sie: Mitarbeiter
    der Kompass Direktbank werden Sie niemals im Chat oder am Telefon nach Ihrem Passwort
    oder Ihren TANs fragen.


    Seien Sie wachsam gegenüber Phishing-Versuchen. Wir kommunizieren direkt und transparent
    über die In-App-Funktionen. Wenn Sie eine Nachricht erhalten, die Sie auffordert,
    auf einen externen Link zu klicken, um Ihr Konto zu „entsperren“, handelt es sich
    höchstwahrscheinlich um Betrug. Prüfen Sie solche Anliegen immer direkt in Ihrer
    App.


    Im Falle eines Kartenverlusts oder eines Verdachts auf Missbrauch ist schnelles
    Handeln entscheidend. Nutzen Sie die In-App-Funktion, um Ihre Karte sofort zu
    sperren. Wir wenden die Haftungsbegrenzung bei Kartenverlust gemäß BGB konsequent
    an, jedoch ist eine unverzügliche Meldung notwendig, um Ihren Schutz zu maximieren.
    Reklamationen und Betrugsmeldungen werden prioritär über die App bearbeitet, wobei
    wir uns strikt an die gesetzlichen Fristen halten.


    Für eine detaillierte Übersicht über die verschiedenen Betrugsmuster lesen Sie
    bitte auch Kompass Girokonto — Betrugsmaschen rund um dieses Produkt erkennen.
    Denken Sie daran: Ihr Konto ist durch die gesetzliche Einlagensicherung bis zu
    einem Betrag von 100.000 € geschützt, was Ihnen ein sicheres Fundament für Ihre
    Finanzen bietet.'
