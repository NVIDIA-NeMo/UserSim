- id: 19fd8513-cf6e-5a7c-a2fd-f0945f75b327
  title: 'Kompass Girokonto — Dispozins: Erklärung'
  body: 'Hier finden Sie Antworten auf häufig gestellte Fragen zum Thema Dispositionskredit
    und den damit verbundenen Zinsen beim Kompass Girokonto.


    **Was ist der Dispozins beim Kompass Girokonto?**

    Der Dispozins ist der Zinssatz, den Sie zahlen, wenn Ihr Konto ins Minus rutscht
    und Sie einen Ihnen eingeräumten Überziehungsrahmen (Dispositionskredit) in Anspruch
    nehmen. Für das Kompass Girokonto beträgt dieser Zinssatz aktuell 9,89 %.


    **Wie wird der Dispozins berechnet?**

    Die Zinsen fallen nur auf den tatsächlich in Anspruch genommenen Betrag an und
    werden in der Regel variabel berechnet. Das bedeutet, dass die Zinsen nur für
    die Tage berechnet werden, an denen Ihr Konto ein negatives Guthaben aufwies.


    **Gibt es Alternativen zur Kontoüberziehung?**

    Um hohe Zinskosten zu vermeiden, empfehlen wir die Nutzung unseres Tagesgeldes
    als Notfallreserve. Weitere Informationen zu unseren Zinsmodellen finden Sie in
    der Zinsübersicht unter Kompass Girokonto — Zinsübersicht.'
