  title: Kompass Girokonto — Voraussetzungen und Abschluss
  body: '### Welche Voraussetzungen muss ich erfüllen, um ein Kompass Girokonto zu
    eröffnen?

    Sie müssen eine natürliche Person mit einem gültigen Personalausweis oder Reisepass
    sein. Da wir ein rein digitales Institut sind, erfolgt die Identitätsprüfung vollständig
    digital über unsere App.


    ### Wie funktioniert der Abschluss des Kontos?

    Der Abschluss erfolgt in wenigen Schritten direkt in der App: Sie geben Ihre persönlichen
    Daten ein, laden die erforderlichen Dokumente hoch und verifizieren Ihre Identität.
    Sobald die Prüfung durch unsere Compliance-Abteilung abgeschlossen ist, ist Ihr
    Konto aktiv.


    ### Kann ich mein Konto auch wieder schließen?

    Ja, die Schließung Ihres Kontos kann ebenfalls digital über die In-App-Funktionen
    beantragt werden. Wir führen Sie durch den Prozess, stellen sicher, dass alle
    Restguthaben übertragen wurden, und bestätigen Ihnen die Schließung schriftlich
    in der App.


    Details zum Prozess finden Sie unter Kompass Girokonto — abschließen und aktivieren.'
