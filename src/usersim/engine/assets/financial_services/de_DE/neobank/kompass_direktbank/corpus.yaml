- id: b5ca1fad-9213-5c41-bba7-19b3379cbde2
  title: Kompass Girokonto — kündigen, schließen oder den Tarif wechseln
  body: 'Wenn Sie Ihr Kompass Girokonto schließen möchten oder einen anderen Tarif
    wählen, führen wir Sie durch den digitalen Prozess. Da wir eine rein digitale
    Bank sind, erfolgt die gesamte Abwicklung direkt über unsere Kommunikationskanäle.


    Bevor Sie beginnen:

    Stellen Sie sicher, dass alle noch ausstehenden Lastschriften und Daueraufträge
    erledigt sind oder bereits übertragen wurden. Prüfen Sie, ob Ihr Kontostand ausgeglichen
    ist, um Verzögerungen durch eine Überziehung (verzinst mit 9,89 %) zu vermeiden.


    Schritte zur Kontoschließung:

    1. Teilen Sie uns Ihren Wunsch nach einer Kontokündigung im digitalen Chat mit.
    Wir verifizieren Ihre Identität mittels starker Kundenauthentifizierung (SCA).

    2. Geben Sie uns an, wohin das verbleibende Restguthaben überwiesen werden soll.
    Wir bestätigen Ihnen den Empfängerkonto und den Betrag.

    3. Falls Sie Ihr Konto zu einem anderen Institut wechseln, fordern Sie uns zur
    Nutzung der Kontowechselhilfe auf. Wir übernehmen die Übertragung Ihrer Daueraufträge
    und Lastschriften gemäß dem Zahlungskontengesetz.

    4. Wir senden Ihnen eine schriftliche Bestätigung der Kündigung sowie das Datum
    der endgültigen Kontoschließung in die App.


    So wissen Sie, dass es funktioniert hat:

    Sie erhalten eine finale Kontostandmitteilung (Soll/Haben 0,00 €) und die Kündigungsbestätigung
    in Ihrem digitalen Postfach. Der Zugang zum Konto wird nach dem Schließdatum deaktiviert.


    Für Informationen zum ursprünglichen Eröffnungsprozess sehen Sie bitte Kompass
    Girokonto — abschließen und aktivieren.'
