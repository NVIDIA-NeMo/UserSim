- id: b568d09f-c7ae-55c6-a46c-418e7e5d6490
  title: Kompass Tagesgeld — Status oder Verlauf einsehen
  body: 'Um Ihren aktuellen Kontostand, die aufgelaufenen Zinsen oder die Historie
    Ihrer Ein- und Auszahlungen beim Kompass Tagesgeld einzusehen, folgen Sie bitte
    diesen Schritten:


    **Voraussetzungen**

    Sie müssen in Ihrem Konto bei der Kompass Direktbank angemeldet sein und ein aktives
    Kompass Tagesgeld-Konto besitzen.


    **Schritt-für-Schritt-Anleitung**

    1. Navigieren Sie in der App zum Bereich „Konten & Sparen“.

    2. Wählen Sie aus der Liste Ihrer Konten das „Kompass Tagesgeld“ aus.

    3. Sie sehen nun auf der Hauptseite des Produkts Ihren aktuellen Gesamtsaldo.
    Dieser Betrag beinhaltet Ihr eingezahltes Kapital sowie die bereits gutgeschriebenen
    Zinsen.

    4. Scrollen Sie nach unten zum Abschnitt „Transaktionsverlauf“. Hier finden Sie
    eine chronologische Auflistung aller Bewegungen.

    5. Um spezifische Zinsgutschriften zu finden, nutzen Sie die Filterfunktion und
    wählen Sie die Kategorie „Zinsen“ aus.

    6. Wenn Sie einen detaillierten Beleg für eine bestimmte Zinszahlung benötigen,
    tippen Sie auf den entsprechenden Eintrag im Verlauf. Es öffnet sich die Detailansicht
    mit dem Datum der Gutschrift und dem angewendeten Zinssatz (entweder der Neukundenzins
    von 2,6 % oder der Standardzins von 1,75 %).


    **Ergebnis**

    Sie haben nun einen vollständigen Überblick über Ihr Guthaben und können genau
    nachvollziehen, wann welche Zinsen gutgeschrieben wurden. Sollten Sie Unstimmigkeiten
    in Ihrem Verlauf feststellen, können Sie uns direkt über den digitalen Chat kontaktieren,
    damit wir die Buchungen prüfen können.'
