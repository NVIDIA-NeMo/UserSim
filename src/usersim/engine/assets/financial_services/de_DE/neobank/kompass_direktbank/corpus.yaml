- id: 727e31d5-6f28-5ce7-b622-d9aa7e4fbfbe
  title: Echtzeitüberweisung — Risikohinweise
  body: 'Die Nutzung der Echtzeitüberweisung erfolgt auf Basis der technischen Standards
    für den SEPA-Zahlungsverkehr. Kunden werden auf folgende regulatorische und operative
    Risiken hingewiesen:


    Irreversibilität der Transaktion

    Aufgrund der unmittelbaren Ausführung wird eine Echtzeitüberweisung innerhalb
    weniger Sekunden finalisiert. Sobald die Transaktion durch den Nutzer mittels
    starker Kundenauthentifizierung (SCA) freigegeben wurde, kann sie von der Kompass
    Direktbank nicht mehr gestoppt oder rückgängig gemacht werden. Ein Widerruf ist
    technisch nicht möglich.


    Betrugsrisiko

    Die Geschwindigkeit der Echtzeitüberweisung wird häufig von Betrügern ausgenutzt.
    Wir weisen ausdrücklich darauf hin, dass Gelder an unbekannte Empfänger mit hoher
    Dringlichkeit versendet werden, ein erhebliches Risiko darstellen. Die Kompass
    Direktbank übernimmt keine Haftung für Verluste, die aus einer freiwillig durchgeführten
    Überweisung an einen betrügerischen Empfänger resultieren, sofern die Sicherheitsmechanismen
    der Bank korrekt funktioniert haben.


    Limitierungen

    Es gilt ein striktes Tageslimit von 5.000 €. Transaktionen, die diesen Betrag
    überschreiten, werden automatisch als Standardüberweisung behandelt oder abgelehnt,
    sofern sie als Echtzeitvorgang angefordert wurden.


    Compliance und Überwachung

    Alle Echtzeitüberweisungen unterliegen den Überwachungsmechanismen zur Bekämpfung
    von Geldwäsche und Terrorismusfinanzierung gemäß den Vorgaben der BaFin und der
    Deutschen Bundesbank. In seltenen Fällen kann es daher zu kurzzeitigen Verzögerungen
    kommen, wenn eine Transaktion einer manuellen Prüfung unterzogen werden muss.


    Für detaillierte Informationen zur Haftungsbegrenzung bei Zahlungsdienstleistungen
    verweisen wir auf das Dokument Echtzeitüberweisung — Allgemeine Geschäftsbedingungen.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 3c646c80-ed99-5266-8cc6-dae28b2c4797
  title: Echtzeitüberweisung — wie Zinsen berechnet und angewendet werden
  body: 'Die Echtzeitüberweisung ist eine Zahlungsdienstleistung und kein Anlageprodukt.
    Daher fallen im Zusammenhang mit der Ausführung einer Echtzeitüberweisung keine
    Zinsen an.


    Folgende Prinzipien gelten:

    - Keine Verzinsung: Auf Beträge, die per Echtzeitüberweisung versendet werden,
    wird keine Verzinsung berechnet. Die Verzinsung auf dem Konto endet im Moment
    der Belastung des Kontos.

    - Gebührenfreie Ausführung: Die Kosten für den Transfer liegen bei 0 €, was bedeutet,
    dass keine Gebühren den Überweisungsbetrag mindern.

    - Wertstellung: Die Wertstellung erfolgt unmittelbar mit der Ausführung der Transaktion.
    Dies bedeutet, dass das Guthaben sofort vom Konto abgezogen wird und somit ab
    diesem Zeitpunkt nicht mehr für eine Verzinsung (z. B. auf einem Tagesgeldkonto)
    zur Verfügung steht.


    Für Informationen darüber, wie Guthaben auf unseren Sparkonten verzinst wird,
    besuchen Sie bitte das Dokument Kompass Tagesgeld — Zinsübersicht.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: rate_sheet
  source_authority: official
