- id: 1fa6df42-ac04-5c92-84d8-7024e5890b00
  title: Echtzeitüberweisung — abgelehnter oder gesperrter Vorgang
  body: 'Symptom: Sie versuchen eine Echtzeitüberweisung zu tätigen, erhalten jedoch
    eine Fehlermeldung, dass der Vorgang abgelehnt oder gesperrt wurde.


    Mögliche Ursachen und Prüfschritte:


    1. Prüfen Sie das Tageslimit: Haben Sie heute bereits Überweisungen getätigt?
    Das tägliche Limit für Echtzeitüberweisungen beträgt 5.000 €. Wenn die Summe Ihrer
    heutigen Echtzeit-Transfers diesen Betrag erreicht oder überschreitet, wird jeder
    weitere Versuch abgelehnt.

    2. Prüfen Sie die Empfängerdaten: Wurde die Empfängerüberprüfung erfolgreich abgeschlossen?
    Wenn Name und IBAN nicht übereinstimmen, blockiert unser System den Vorgang zum
    Schutz Ihres Geldes.

    3. Prüfen Sie Ihr Guthaben: Ist die entsprechende Summe auf Ihrem Konto verfügbar?
    Da es sich um eine Echtzeit-Transaktion handelt, muss der Betrag zum Zeitpunkt
    der Ausführung vollumfänglich gedeckt sein.

    4. Authentifizierung: Gab es ein Problem bei der starken Kundenauthentifizierung
    (SCA)? Stellen Sie sicher, dass die App aktuell ist und die Verifizierung korrekt
    abgeschlossen wurde.


    Lösung:

    - Wenn das Limit das Problem ist: Warten Sie bis zum nächsten Kalendertag oder
    nutzen Sie eine Standard-Überweisung (falls diese für den gewünschten Betrag verfügbar
    ist).

    - Bei Datenfehlern: Korrigieren Sie Name und IBAN des Empfängers.


    Eskalation:

    Sollte der Vorgang trotz korrekter Daten und ausreichendem Guthaben gesperrt bleiben,
    eskalieren wir Ihr Anliegen intern an unsere spezialisierten Experten für Zahlungsverkehr.
    Wir prüfen die Sicherheitslogs und informieren Sie über den Chat über die Freigabe
    oder die Gründe der Ablehnung.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: f8fb1790-0c18-5555-b47d-928d970bd805
  title: Echtzeitüberweisung — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Die Entscheidung zwischen einer Standard-Überweisung und der Echtzeitüberweisung
    hängt primär von der benötigten Geschwindigkeit ab.


    Vergleich der Dimensionen:

    - Geschwindigkeit: Während eine Standard-Überweisung je nach Bank 1-2 Werktage
    dauern kann, ist das Geld bei der Echtzeitüberweisung in Sekunden beim Empfänger.

    - Kosten: Beide Optionen sind bei Kompass Direktbank mit 0 € Gebühr kostenfrei.

    - Limits: Die Echtzeitüberweisung ist auf ein tägliches Limit von 5.000 € beschränkt.
    Für Beträge, die darüber hinausgehen, ist die Standard-Überweisung die notwendige
    Wahl.

    - Sicherheit: Beide nutzen die starke Kundenauthentifizierung (SCA), wobei die
    Echtzeitüberweisung zusätzlich eine integrierte Empfängerüberprüfung nutzt.


    Empfehlung:

    Die Echtzeitüberweisung eignet sich ideal für dringende Zahlungen, wie etwa die
    Begleichung einer Rechnung kurz vor einer Frist oder Geldtransfers an Freunde
    und Familie. Wenn Zeit keine Rolle spielt oder der Betrag die 5.000 € pro Tag
    überschreitet, ist die Standard-Überweisung die bessere Wahl.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: comparison
