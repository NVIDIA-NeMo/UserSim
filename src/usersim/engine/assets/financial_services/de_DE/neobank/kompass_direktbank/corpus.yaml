- id: cb5f32be-5611-5dfa-84c0-d5ebde7692b4
  title: Kompass Tagesgeld — Schutz vor Betrug und nicht autorisierten Vorgängen
  body: 'Die Sicherheit Ihres Ersparten hat bei der Kompass Direktbank höchste Priorität.
    Da das Kompass Tagesgeld ein rein digitales Produkt ist, konzentrieren sich potenzielle
    Betrugsversuche oft auf den digitalen Zugang zu Ihrem Konto. Wir möchten Sie über
    die gängigsten Muster informieren, damit Sie Ihr Guthaben effektiv schützen können.


    Ein häufiges Szenario ist das sogenannte ''Social Engineering''. Hierbei geben
    sich Betrüger als Mitarbeiter der Bank oder Behörden aus und versuchen, über dringliche
    Nachrichten oder Anrufe an Ihre Zugangsdaten zu gelangen. Bitte beachten Sie:
    Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder Telefon dazu auffordern,
    Ihr Passwort, Ihre PIN oder TANs preiszugeben. Wir fordern Sie niemals auf, Geld
    auf ein ''Sicherheitskonto'' zu transferieren, um Ihr Guthaben zu schützen.


    Um unbefugte Vorgänge zu verhindern, setzen wir konsequent auf die starke Kundenauthentifizierung
    (SCA). Jede zustandsändernde Aktion, wie etwa die Überweisung von Geldbeträgen
    vom Kompass Tagesgeld auf ein anderes Konto, erfordert eine zwingende Identitätsverifizierung.
    Wenn Sie eine Benachrichtigung über eine Authentifizierung erhalten, die Sie nicht
    selbst ausgelöst haben, ist dies ein kritisches Warnsignal.


    Sollten Sie den Verdacht haben, dass Ihre Zugangsdaten kompromittiert wurden oder
    ein nicht autorisierter Vorgang stattgefunden hat, ist die schnellstmögliche Reaktion
    entscheidend. Informieren Sie uns umgehend über den digitalen Chat in der App.
    Wir werden Ihren Zugang sofort prüfen und gegebenenfalls sperren, um weitere Schäden
    zu verhindern.


    Wir halten uns strikt an die gesetzlichen Haftungsbegrenzungen gemäß BGB. Eine
    zeitnahe Meldung von Betrugsfällen ist daher essenziell, um Ihre Ansprüche auf
    Rückerstattung zu sichern. Für weitere allgemeine Sicherheitstipps können Sie
    auch das Dokument Kompass Girokonto — Sicherheitstipps für Ihr Konto konsultieren,
    da die Sicherheitsmechanismen unserer digitalen Plattform bankweit einheitlich
    gelten.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: ae528a3a-fc3b-5f52-8529-371baa367dae
  title: Kompass Tagesgeld — Allgemeine Geschäftsbedingungen
  body: 'Diese Allgemeinen Geschäftsbedingungen regeln die Führung und Verzinsung
    des Kompass Tagesgeld. Durch die Eröffnung des Kontos erkennt der Kunde die folgenden
    Bedingungen an.


    1. Verzinsung und Zinsgrundlage

    Das Konto wird verzinst. Für Neukunden gilt ein Aktionszins von 2,6 % für die
    ersten 4 Monate nach Kontoeröffnung. Nach Ablauf dieses Zeitraums wird die Verzinsung
    automatisch auf den Standardzinssatz von 1,75 % angepasst. Die Zinsberechnung
    erfolgt täglich auf Basis des verfügbaren Guthabens.


    2. Verpflichtungen der Bank

    Die Kompass Direktbank verpflichtet sich, das Guthaben sicher zu verwahren und
    die Zinsen gemäß den vereinbarten Sätzen gutzuschreiben. Wir gewährleisten den
    Zugriff auf das Konto über unsere digitalen Kanäle und führen alle vom Kunden
    autorisierten Verfügungen zeitnah aus.


    3. Verpflichtungen des Kunden

    Der Kunde ist verpflichtet, seine Zugangsdaten geheim zu halten und die starke
    Kundenauthentifizierung (SCA) bei allen sensiblen Vorgängen zu nutzen. Änderungen
    der persönlichen Daten oder der steuerlichen Ansässigkeit sind der Bank unverzüglich
    mitzuteilen, um eine korrekte Abführung der Kapitalertragsteuer zu gewährleisten.


    4. Änderungen und Kündigung

    Die Bank behält sich das Recht vor, die Zinssätze unter Einhaltung einer angemessenen
    Frist zu ändern. Diese Änderungen werden dem Kunden über die App mitgeteilt. Beide
    Parteien können das Konto jederzeit ohne Einhaltung einer Frist kündigen. Im Falle
    einer Kündigung wird das Restguthaben inklusive der bis zum Tag der Schließung
    aufgelaufenen Zinsen auf das vom Kunden angegebene Referenzkonto überwiesen.


    5. Rechtliche Grundlage

    Dieses Produkt unterliegt den Richtlinien der BaFin und der Deutschen Bundesbank.
    Die Einlagensicherung schützt Guthaben bis zu einem Betrag von 100.000 € pro Kunde.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 0b597549-23b7-57ec-a62e-05238fe3d819
  title: Kompass Tagesgeld — für wen und wofür geeignet
  body: 'Das Kompass Tagesgeld ist die ideale Lösung für Kunden, die eine flexible
    und sichere Möglichkeit suchen, ihre Liquiditätsreserven zu parken, ohne auf attraktive
    Renditen verzichten zu müssen. Im Gegensatz zu Festgeldkonten bleibt Ihr Kapital
    hier jederzeit verfügbar, was es zum perfekten Instrument für den Notgroschen
    oder für kurzfristige Sparziele macht.


    Dieses Produkt richtet sich insbesondere an preisbewusste und technikaffine Nutzer,
    die Wert auf eine intuitive App-Experience und maximale Transparenz legen. Da
    wir auf ein physisches Filialnetz verzichten, können wir faire Konditionen direkt
    an unsere Kunden weitergeben.


    Die attraktivität des Kompass Tagesgeld ergibt sich aus einer zweistufigen Verzinsung:

    - Für Neukunden bieten wir einen attraktiven Einstiegszins von 2,6 % an. Dieser
    gilt für die ersten 4 Monate und ermöglicht einen schnellen Vermögensaufbau zu
    Beginn der Kundenbeziehung.

    - Im Anschluss an die Aktionsphase gilt der Standardzinssatz von 1,75 %, der eine
    stabile und wettbewerbsfähige Rendite für die langfristige Nutzung bietet.


    Das Konto ist besonders geeignet für:

    - Personen, die eine sichere Alternative zum klassischen Girokonto suchen, um
    Zinsen auf ihr Erspartes zu erhalten.

    - Kunden, die ihr Geld flexibel umschichten möchten, ohne an lange Bindungsfristen
    gebunden zu sein.

    - Nutzer, die eine rein digitale Kontoverwaltung bevorzugen und alle Vorgänge
    effizient über die App erledigen wollen.


    Sicherheit ist bei uns integriert: Ihr Guthaben ist durch die gesetzliche Einlagensicherung
    bis zu einem Betrag von 100.000 € geschützt. In Kombination mit unserem Kompass
    Girokonto — Überblick ergibt sich ein nahtloses digitales Banking-Ökosystem für
    Ihren Alltag und Ihre Vorsorge.'
