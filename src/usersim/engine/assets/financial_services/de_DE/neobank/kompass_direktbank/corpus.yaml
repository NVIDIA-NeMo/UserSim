- id: 6f71bfed-cbc9-5ede-8df3-ef26da0e7bb6
  title: Kompass Tagesgeld — Änderung der Bedingungen
  body: 'Diese Bedingungen regeln die Modalitäten der Verzinsung und die Anpassung
    der Konditionen für das Kompass Tagesgeld. Die Vereinbarung zwischen der Kompass
    Direktbank und dem Kunden basiert auf dem Grundsatz maximaler Transparenz.


    1. Verzinsung und Zinssätze

    Das Konto wird mit einem variablen Zinssatz verzinst. Für Neukunden gilt ein Aktionszinssatz
    von 2,6 %, der für eine feste Dauer von 4 Monaten ab dem Tag der Kontoeröffnung
    angewendet wird. Nach Ablauf dieser 4 Monate wechselt die Verzinsung automatisch
    auf den Standardzinssatz, der derzeit 1,75 % beträgt. Die Bank behält sich das
    Recht vor, den Standardzinssatz unter Berücksichtigung der Marktlage und regulatorischer
    Vorgaben jederzeit zu ändern.


    2. Ankündigung von Änderungen

    Änderungen der Zinskonditionen oder der allgemeinen Bedingungen werden dem Kunden
    über die In-App-Benachrichtigungen oder per digitaler Nachricht mitgeteilt. Bei
    einer Änderung des Standardzinssatzes erfolgt die Anpassung unmittelbar nach der
    Bekanntgabe. Die präzisen rechtlichen Hinweise zur Zinsanpassung sind in den Produktdetails
    integriert.


    3. Verpflichtungen und Kündigung

    Der Kunde ist verpflichtet, die Identitätsprüfung im Rahmen der starken Kundenauthentifizierung
    (SCA) für alle zustandsändernden Vorgänge zu unterstützen. Die Kündigung des Kompass
    Tagesgelds kann jederzeit über die App erfolgen. Da es sich um ein Tagesgeldkonto
    handelt, ist das Guthaben täglich verfügbar und kann ohne Einhaltung einer Kündigungsfrist
    auf ein Referenzkonto übertragen werden.


    4. Einlagensicherung

    Alle Guthaben unterliegen der gesetzlichen Einlagensicherung bis zu einem Betrag
    von 100.000 €. Diese Absicherung ist integraler Bestandteil des Sicherheitsversprechens
    der Kompass Direktbank und erfolgt gemäß den Richtlinien der BaFin und der Deutschen
    Bundesbank.


    Durch die Eröffnung des Kontos akzeptiert der Kunde diese Bedingungen. Eine detaillierte
    Übersicht aller aktuellen Konditionen finden Sie im Dokument Kompass Tagesgeld
    — Zinsübersicht.'
