- id: 78ae084d-f60f-5702-8bb1-58dd65a25848
  title: Kompass Girokonto — wann sich ein Wechsel oder Upgrade lohnt
  body: 'Dieses Dokument unterstützt Support-Mitarbeiter bei der Beratung von Kunden
    darüber, ob das aktuelle Modell des Kompass Girokontos noch optimal passt oder
    eine Anpassung sinnvoll ist.


    **Analyse der Kosteneffizienz**

    Ein zentraler Punkt ist der monatliche Geldeingang. Wenn ein Kunde derzeit eine
    Kontoführungsgebühr von 4,90 € zahlt, weil sein Geldeingang unter 700 € liegt,
    lohnt sich ein Wechsel des Hauptkontos zu Kompass, sobald dieser Schwellenwert
    von 700 € erreicht wird, da das Konto dann kostenlos ist.


    **Überprüfung der Finanzierungskosten**

    Kunden, die häufig ihr Konto überziehen, sollten auf die Kosten achten. Mit einem
    Zinssatz von 9,89 % für die Überziehung ist das Girokonto auf den täglichen Zahlungsverkehr
    ausgelegt, nicht auf die langfristige Finanzierung. In solchen Fällen sollte geprüft
    werden, ob alternative Spar- oder Kreditoptionen des Hauses besser geeignet sind.


    **Zielgruppen-Check**

    Das Kompass Girokonto ist ideal für technikaffine Nutzer, die eine rein digitale
    Lösung ohne Filialnetz bevorzugen. Kunden, die zwingend physische Beratung oder
    Bargeldeinzahlungen in einer Filiale benötigen, könnten feststellen, dass unser
    rein digitales Modell nicht zu ihren Bedürfnissen passt.


    Für einen detaillierten Vergleich mit anderen internen Optionen nutzen Sie bitte
    Kompass Girokonto — im Vergleich zu einem ähnlichen Produkt des Hauses.'
