  institution_id: kompass_direktbank
- id: 0091d13d-31e3-58b8-8f05-7f7d3bbe2ce6
  title: Kompass Visa Debitkarte — abgelehnter oder gesperrter Vorgang
  body: 'Es kann vorkommen, dass eine Zahlung mit Ihrer Kompass Visa Debitkarte abgelehnt
    wird oder die Karte gesperrt ist. Wenn Sie unser Angebot mit anderen Banken vergleichen,
    werden Sie feststellen, dass wir aus Sicherheitsgründen sehr strikt agieren.


    **Symptom: Die Zahlung wird am Terminal oder im Online-Shop abgelehnt.**


    **Mögliche Ursachen und Prüfschritte:**

    1. **Deckung des Kontos:** Da es sich um eine Debitkarte handelt, wird der Betrag
    direkt vom Konto abgezogen. Prüfen Sie in der App, ob Ihr aktuelles Guthaben ausreicht,
    um die Zahlung zu decken.

    2. **SCA-Verifizierung:** Bei Online-Zahlungen ist eine starke Kundenauthentifizierung
    (SCA) zwingend erforderlich. Prüfen Sie, ob Sie die Push-Benachrichtigung in der
    App erhalten und die Zahlung aktiv bestätigt haben. Ohne diese Bestätigung wird
    der Vorgang aus Sicherheitsgründen abgelehnt.

    3. **Tages- oder Einzellimits:** Überprüfen Sie in den Karteneinstellungen, ob
    Sie ein Limit gesetzt haben, das durch diesen Vorgang überschritten würde.

    4. **Kartenstatus:** Prüfen Sie, ob Sie die Karte versehentlich in der App eingefroren
    haben.


    **Symptom: Die Karte ist komplett gesperrt.**


    **Mögliche Ursachen und Fix:**

    * **Sicherheitsverdacht:** Unsere Systeme haben möglicherweise ein ungewöhnliches
    Zahlungsmuster erkannt (z. B. ein plötzlicher hoher Betrag in einem fremden Land).
    In diesem Fall sperren wir die Karte präventiv.

    * **Falsche PIN-Eingabe:** Nach mehreren Fehlversuchen bei der PIN-Eingabe am
    Automaten wird die Karte automatisch gesperrt.


    **Lösung und Eskalation:**

    Wenn eine einfache Aktivierung in der App nicht möglich ist, melden Sie uns dies
    direkt im Chat. Wir werden Ihre Identität verifizieren und den Fall an unsere
    spezialisierten Experten eskalieren. Diese prüfen die Sicherheitssperre und heben
    sie nach erfolgreicher Prüfung auf. Sie erhalten eine Bestätigung in der App,
