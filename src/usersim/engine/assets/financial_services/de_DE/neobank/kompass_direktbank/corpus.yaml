- id: bb68d8a3-1086-5c8c-9f22-867de57bd247
  title: Kompass Tagesgeld — zwischen Tarifen wählen
  body: 'Wenn Sie überlegen, wie Sie Ihr Geld bei der Kompass Direktbank anlegen,
    stehen Sie vor der Wahl zwischen dem Kompass Girokonto und dem Kompass Tagesgeld.
    Beide Produkte ergänzen sich ideal, haben aber unterschiedliche Zwecke.


    **Vergleich der Kernmerkmale:**


    - **Kompass Tagesgeld:** Dieses Produkt ist für den Vermögensaufbau gedacht. Es
    bietet einen Neukundenzins von 2,6 % für die ersten 4 Monate und danach einen
    Standardzins von 1,75 %. Es gibt keine Kontoführungsgebühren, jedoch ist es nicht
    für den täglichen Zahlungsverkehr geeignet.

    - **Kompass Girokonto:** Dies ist Ihr zentrales Konto für den Alltag. Es ist ab
    einem monatlichen Geldeingang von 700 € kostenlos, ansonsten fällt eine Gebühr
    von 4,90 € an. Es bietet volle Flexibilität für Zahlungen, aber eine deutlich
    geringere Verzinsung als das Tagesgeld.


    **Empfehlung:**

    - Wählen Sie das **Kompass Tagesgeld**, wenn Sie eine sichere Parkmöglichkeit
    für Ihre Ersparnisse suchen, von Zinsen profitieren wollen und die gesetzliche
    Einlagensicherung bis 100.000 € schätzen.

    - Wählen Sie das **Kompass Girokonto**, wenn Sie ein Konto für Gehaltseingänge
    und tägliche Ausgaben benötigen.


    Ideal ist die Kombination beider Produkte: Nutzen Sie das Girokonto für Ihre Transaktionen
    und übertragen Sie Überschüsse auf das Tagesgeld, um die 1,75 % Standardverzinsung
    (oder initial 2,6 %) zu nutzen.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: d9c039f7-c9fd-5085-b496-a117abc876ed
  title: Kompass Tagesgeld — Datenschutz und Datenverarbeitung
  body: 'Die Kompass Direktbank legt größten Wert auf den Schutz Ihrer personenbezogenen
    Daten und agiert strikt nach den Vorgaben der BaFin, der Deutschen Bundesbank
    sowie der europäischen Datenschutz-Grundverordnung (DSGVO).


    Im Zusammenhang mit Ihrem Kompass Tagesgeld werden Daten insbesondere zu folgenden
    Zwecken verarbeitet:


    1. **Identitätsprüfung und Compliance:** Zur Eröffnung Ihres Kontos ist eine Verifizierung
    Ihrer Identität zwingend erforderlich. Wir setzen hierfür starke Kundenauthentifizierung
    (SCA) ein, um sicherzustellen, dass nur Sie Zugriff auf Ihr Guthaben haben. Die
    Verarbeitung erfolgt gemäß den nationalen Finanzmarktrichtlinien zur Bekämpfung
    von Geldwäsche.


    2. **Zinsberechnung und Auszahlung:** Wir verarbeiten Ihre Kontodaten, um die
    Verzinsung korrekt anzuwenden. Dies beinhaltet die Überwachung des Zeitraums von
    4 Monaten für den Neukundenzins von 2,6 % und den anschließenden automatischen
    Wechsel zum Standardzinssatz von 1,75 %.


    3. **Sicherung des Guthabens:** Die Meldung Ihres Guthabens an die zuständigen
    Stellen ist notwendig, um die gesetzliche Einlagensicherung bis zu einem Betrag
    von 100.000 € pro Kunde und Bank gewährleisten zu können.


    Wir garantieren, dass Ihre Daten nicht ohne Ihre ausdrückliche Zustimmung an Dritte
    weitergegeben werden, es sei denn, dies ist aufgrund gesetzlicher Verpflichtungen
    oder aufsichtsrechtlicher Anforderungen (z. B. durch die BaFin) erforderlich.


    Sie haben jederzeit das Recht auf Auskunft über die bei uns gespeicherten Daten
    sowie das Recht auf Berichtigung oder Löschung, sofern keine gesetzlichen Aufbewahrungsfristen
    entgegenstehen. Alle Anfragen zum Datenschutz können effizient über die In-App-Funktionen
    und den digitalen Chat gestellt werden.


    Weitere allgemeine rechtliche Hinweise finden Sie im Dokument Kompass Tagesgeld
    — rechtliche Hinweise.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 0ea2b1a0-49b8-5821-978b-4aa0bf4cace7
  title: Kompass Tagesgeld — Betrugsmaschen rund um dieses Produkt erkennen
  body: 'Beim Vergleich von Sparoptionen ist es wichtig, die spezifischen Betrugsmuster
    zu kennen, die auf attraktive Zinssätze wie unseren Neukundenzins von 2,6 % abzielen.
    Betrüger nutzen oft die Gier nach schnellen Gewinnen aus, um unbefugten Zugriff
    auf Ihre Ersparnisse zu erhalten.


    Ein häufiges Muster ist das sogenannte „Phishing“ über gefälschte E-Mails oder
    SMS, die vorgeben, von der Kompass Direktbank zu stammen. In diesen Nachrichten
    wird oft behauptet, dass Ihr Kompass Tagesgeld-Konto gesperrt wurde oder dass
    Sie eine dringende Aktion ausführen müssen, um den Zinsvorteil von 2,6 % zu sichern.
    Ziel ist es, Sie auf gefälschte Websites zu locken, um Ihre Zugangsdaten oder
    TANs zu stehlen.


    Bitte beachten Sie: Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder
    Telefon dazu auffordern, Ihr Passwort, Ihre PIN oder eine TAN preiszugeben. Wir
    fordern Sie niemals auf, Gelder auf ein „Sicherheitskonto“ bei einer anderen Bank
    zu überweisen, um Ihr Guthaben zu schützen.


    Ein weiteres Warnsignal sind Angebote von Drittanbietern, die versprechen, die
    Laufzeit unseres Neukundenzinses von 4 Monaten durch „Spezialverträge“ zu verlängern.
    Solche Angebote sind betrügerisch; unsere Konditionen sind transparent und direkt
    in der App einsehbar.


    Wenn Ihnen eine Kommunikation verdächtig vorkommt oder Sie bemerken, dass unautorisierte
    Transaktionen von Ihrem Konto abgeflossen sind, ist die erste und wichtigste Maßnahme
    die sofortige Meldung über die In-App-Funktionen. Reklamationen und Betrugsmeldungen
    werden bei uns prioritär bearbeitet. Wir halten uns strikt an die gesetzlichen
    Fristen und die Haftungsbegrenzungen gemäß BGB, um Ihre Sicherheit zu gewährleisten.


    Sollten Sie bereits Daten preisgegeben haben, sperren Sie umgehend Ihren Zugang
    über die App und informieren Sie unseren digitalen Support, damit wir notwendige
    Schutzmaßnahmen einleiten können.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kompass_direktbank
- id: 0b5d8bec-6e3b-5a62-9773-c3512a7a9c37
  title: Kompass Tagesgeld — Grenzen, Einschränkungen und Sonderfälle
  body: 'Dieses Dokument dient als Referenz für Support-Mitarbeiter bei der Beratung
    von Kunden zu den spezifischen Rahmenbedingungen des Kompass Tagesgeld-Kontos.


    **Zinsphasen und Übergänge**

    Das zentrale Merkmal des Produkts ist die zweistufige Verzinsung. Neukunden erhalten
    für die ersten 4 Monate einen attraktiven Zinssatz von 2,6 %. Nach Ablauf dieses
    Zeitraums erfolgt ein automatischer Übergang zum Standardzins von 1,75 %. Es ist
    wichtig, dem Kunden transparent zu kommunizieren, dass keine manuelle Verlängerung
    des Aktionszinses möglich ist und die 4 Monate ab dem Tag der Kontoeröffnung zählen.


    **Einlagensicherung und Limits**

    Das Guthaben auf dem Kompass Tagesgeld-Konto unterliegt der gesetzlichen Einlagensicherung.
    Das bedeutet, dass Guthaben bis zu einem Betrag von 100.000 € pro Kunde und Bank
    geschützt sind. Beträge, die diese Grenze überschreiten, fallen nicht unter diesen
    spezifischen gesetzlichen Schutzschirm.


    **Verfügbarkeit und Transaktionen**

    Obwohl das Tagesgeld-Konto flexibel ist, ist es nicht für den täglichen Zahlungsverkehr
    (wie Einkäufe im Supermarkt) konzipiert. Es besitzt keine eigene Debitkarte. Alle
    Geldbewegungen müssen über das verknüpfte Girokonto abgewickelt werden. Eine direkte
    Auszahlung von Drittkonten auf das Tagesgeld-Konto ist nur möglich, wenn die Identität
    des Absenders zweifelsfrei geklärt ist, um Geldwäschepräventionsrichtlinien gemäß
    BaFin zu entsprechen.


    **Sonderfälle bei Kontoauflösung**

    Bei der Schließung des Kontos werden die bis zum Zeitpunkt der Schließung aufgelaufenen,
    aber noch nicht gutgeschriebenen Zinsen gemäß dem Zinsintervall berechnet und
    auf das Referenzkonto ausgezahlt. Eine anteilige Auszahlung des Neukundenzinses
    von 2,6 % erfolgt nur für die tatsächlich genutzten Monate innerhalb der ersten
    4 Monate.


    Für detaillierte Informationen zu den allgemeinen Kontoführungsgebühren des Referenzkontos
    verweisen Sie bitte auf das Dokument Kompass Girokonto — Überblick.'
  domain: retail_banking
  product_category: tagesgeld
  document_type: product_sheet
  source_authority: official
