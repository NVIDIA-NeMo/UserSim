- id: b95a1099-1bdf-5d4d-93ad-aea864761e84
  title: Kompass Tagesgeld — Sicherheitstipps für Ihr Konto
  body: 'Die Sicherheit Ihres Guthabens beim Kompass Tagesgeld hat für uns höchste
    Priorität. Da wir eine rein digitale Bank sind, setzen wir auf modernste Technologien,
    um Ihr Vermögen zu schützen. Bitte beachten Sie die folgenden Sicherheitshinweise,
    um Ihr Konto vor unbefugtem Zugriff zu bewahren.


    Ein zentrales Sicherheitsversprechen ist die gesetzliche Einlagensicherung, die
    Ihr Guthaben bis zu einem Betrag von 100.000 € pro Kunde und Bank absichert. Damit
    ist Ihr Erspartes nach den Vorgaben der BaFin und der Deutschen Bundesbank geschützt.


    Um Ihre Kontodaten zu schützen, setzen wir konsequent auf die starke Kundenauthentifizierung
    (SCA). Jede zustandsändernde Aktion, wie etwa eine Überweisung Ihres Tagesgeldes
    zurück auf Ihr Girokonto, erfordert eine zwingende Verifizierung Ihrer Identität
    über unsere In-App-Funktionen. Ohne diese Bestätigung kann keine Transaktion ausgeführt
    werden.


    Bitte seien Sie wachsam gegenüber folgenden Betrugsmustern:

    - Die Kompass Direktbank wird Sie niemals per E-Mail, SMS oder Telefon dazu auffordern,
    Ihr Passwort, Ihre PIN oder einen TAN-Code preiszugeben.

    - Wir fordern Sie niemals auf, Ihr Geld zur „Sicherung“ auf ein fremdes Konto
    zu überweisen.

    - Seien Sie skeptisch bei Nachrichten, die eine dringende Handlung fordern, um
    eine vermeintliche Kontosperrung zu verhindern.


    Sollten Ihnen Unregelmäßigkeiten in Ihren Umsätzen auffallen oder haben Sie den
    Verdacht, dass Ihre Zugangsdaten kompromittiert wurden, ist die erste und wichtigste
    Maßnahme die sofortige Meldung über die App. Reklamationen und Betrugsmeldungen
    werden dort prioritär bearbeitet. Wir halten uns dabei strikt an die gesetzlichen
    Fristen und die Haftungsbegrenzungen gemäß BGB, um eine faire und rechtssichere
    Abwicklung zu gewährleisten.


    Für weitere Informationen zum Schutz Ihrer gesamten Banking-Umgebung können Sie
    auch das Dokument Kompass Girokonto — Sicherheitstipps für Ihr Konto konsultieren.'
