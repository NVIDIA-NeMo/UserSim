- id: b6423c96-5fd5-50dc-94eb-195cc5b1e9b5
  title: Echtzeitüberweisung — Sicherheitstipps für Ihr Konto
  body: 'Die Geschwindigkeit der Echtzeitüberweisung bietet großen Komfort, erfordert
    aber auch besondere Aufmerksamkeit bei der Sicherheit. Da Zahlungen nahezu augenblicklich
    beim Empfänger eingehen, ist eine sorgfältige Prüfung vor dem Absenden essenziell.


    Bitte beachten Sie folgende Sicherheitshinweise:

    1. Prüfen Sie die Empfängerdaten genau. Nutzen Sie unsere integrierte Empfängerüberprüfung,
    um sicherzustellen, dass Name und IBAN übereinstimmen.

    2. Seien Sie skeptisch bei dringenden Zahlungsaufforderungen von Unbekannten.
    Betrüger nutzen oft den Zeitdruck der Echtzeitüberweisung aus.

    3. Behalten Sie Ihr tägliches Limit von 5.000 € im Blick. Wenn Sie ungewöhnliche
    Aktivitäten bemerken, sperren Sie Ihr Konto sofort über die App.


    Wichtige Sicherheitsprinzipien der Kompass Direktbank:

    - Wir fordern Sie niemals per E-Mail, SMS oder Telefon auf, Ihre PIN oder TAN
    zu nennen.

    - Für jede Echtzeitüberweisung wird zwingend die starke Kundenauthentifizierung
    (SCA) angewendet.

    - Wir fordern Sie niemals auf, Geld auf ein „Sicherungskonto“ zu überweisen, um
    Ihr Konto zu schützen.


    Im Falle eines Fehlers oder Betrugs: Melden Sie den Vorfall prioritär über die
    App. Beachten Sie, dass bei SEPA-Lastschriften eine gesetzliche Rückgabefrist
    von acht Wochen besteht; bei Echtzeitüberweisungen ist eine Rückbuchung jedoch
    nur mit Zustimmung des Empfängers möglich, da die Ausführung final ist. Handeln
    Sie schnell, um die Haftungsbegrenzung gemäß BGB optimal zu nutzen.'
  domain: payments
  product_category: echtzeitueberweisung
  document_type: security_advisory
  source_authority: official
