  institution_id: kompass_direktbank
- id: 6d138ad3-916a-51df-8a50-33c72ff57492
  title: Echtzeitüberweisung — Schritt-für-Schritt-Anleitung
  body: "Wie führe ich eine Echtzeitüberweisung durch? Hier sind die Antworten auf\
    \ die wichtigsten Fragen zum Ablauf:\n\nFrage: In welchen Schritten sende ich\
    \ Geld in Echtzeit?\nAntwort: \n1. Öffnen Sie die Überweisungsfunktion in Ihrer\
    \ App.\n2. Geben Sie den Namen des Empfängers und die IBAN ein.\n3. Legen Sie\
    \ den Betrag fest (beachten Sie das tägliche Limit von 5.000 €).\n4. Wählen Sie\
    \ die Option 'Echtzeitüberweisung'.\n5. Bestätigen Sie den Vorgang mittels starker\
    \ Kundenauthentifizierung (SCA).\n\nFrage: Was passiert nach der Bestätigung?\n\
    Antwort: Wir führen sofort eine Empfängerüberprüfung durch. Wenn alles korrekt\
    \ ist, wird der Betrag ohne Gebühren (0 €) innerhalb von Sekunden an die Empfängerbank\
    \ übermittelt.\n\nFrage: Woran erkenne ich, dass die Überweisung erfolgreich war?\n\
    Antwort: Sie erhalten eine Bestätigung in der App, und der Status in Ihrem Transaktionsverlauf\
    \ ändert sich auf 'Erfolgreich'."
