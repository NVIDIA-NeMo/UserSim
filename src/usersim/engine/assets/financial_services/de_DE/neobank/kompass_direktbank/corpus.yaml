- id: 08243170-7199-5625-9a47-22e5d8839fa3
  title: Kompass Tagesgeld — Kosten und Entgelte
  body: '**Gibt es eine monatliche Kontoführungsgebühr für das Kompass Tagesgeld?**

    Nein. Die Führung des Kompass Tagesgeld-Kontos ist kostenfrei. Es fallen keine
    monatlichen Grundgebühren für die Bereitstellung des Sparkontos an.


    **Kostet die Einzahlung oder Auszahlung von Geldern auf das Tagesgeld-Konto etwas?**

    Transfers zwischen Ihrem Kompass Girokonto und Ihrem Kompass Tagesgeld-Konto sind
    kostenlos. Es fallen keine Gebühren für den internen Geldtransfer an.


    **Sind alle Funktionen des Tagesgeld-Kontos gratis?**

    Ja, die grundlegenden Funktionen zur Verwaltung Ihrer Ersparnisse sowie die Zinsgutschriften
    sind kostenfrei. Bitte beachten Sie jedoch, dass für das notwendige Referenzkonto
    (das Girokonto) unsere regulären Konditionen gelten. Informationen hierzu finden
    Sie unter Kompass Girokonto — Kosten und Entgelte.'
