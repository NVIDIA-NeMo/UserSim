- id: a0a1f58f-1633-5562-9882-87c553912757
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — रेफरल और लॉयल्टी ऑफर
  body: तरंग इन्वेस्ट अपने मौजूदा ग्राहकों के लिए एक विशेष लॉयल्टी ऑफर लेकर आया है।
    यदि आप किसी नए निवेशक को मार्जिन ट्रेडिंग सुविधा (MTF) के लिए रेफर करते हैं, तो
    सफल खाता सक्रियण पर आपको ₹500 का रेफरल बोनस मिलेगा। यह ऑफर 1 जनवरी 2025 से 31
    मार्च 2025 तक वैध है। नए ग्राहक को अपनी पहली ट्रेडिंग पोजीशन शुरू करने के लिए
    न्यूनतम मार्जिन 25% बनाए रखना होगा। अधिक जानकारी के लिए कृपया हमारे शुल्क ढांचे
    को देखें।
  domain: brokerage_investing
