- id: d1526b66-5162-5095-8f26-7d1c9f5c5406
  title: म्यूचुअल फंड SIP — लागत और शुल्क
  body: 'प्रश्न: म्यूचुअल फंड SIP में निवेश करने की लागत क्या है?

    उत्तर: तरंग इन्वेस्ट कम लागत और पारदर्शिता में विश्वास रखता है। हमारा शुल्क ढांचा
    बुनियादी ढांचे और विनियामक लागतों को कवर करने के लिए डिज़ाइन किया गया है।


    प्रश्न: क्या पैसा निकालने पर कोई शुल्क लगता है?

    उत्तर: हाँ, यदि आप 365 दिनों के भीतर निवेश निकालते हैं, तो 1% का एग्जिट लोड शुल्क
    लागू होता है।


    अधिक विवरण के लिए ''म्यूचुअल फंड SIP — शुल्क अनुसूची'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
