- id: c6869253-c326-59ce-93ba-93e546d034b8
  title: म्यूचुअल फंड SIP — स्थिति या इतिहास देखना
  body: 'अपने म्यूचुअल फंड SIP के निवेश की स्थिति और पिछले ट्रांजेक्शन इतिहास की जांच
    करने के लिए इन चरणों का पालन करें:


    1. हमें अपने खाते की वर्तमान स्थिति और SIP इतिहास देखने का अनुरोध भेजें।

    2. हम आपके खाते से जुड़े सभी सक्रिय SIP और उनके पिछले निवेशों की एक विस्तृत सूची
    तैयार करेंगे।

    3. हम आपको एक स्टेटमेंट प्रदान करेंगे जिसमें प्रत्येक किस्त की तारीख, निवेश की
    गई राशि और वर्तमान यूनिट वैल्यू शामिल होगी।

    4. आप इस विवरण में अपनी कुल निवेशित राशि और वर्तमान पोर्टफोलियो मूल्य की पुष्टि
    कर सकते हैं।


    एक बार जब आप विवरण प्राप्त कर लेते हैं और पुष्टि कर लेते हैं कि सभी रिकॉर्ड सही
    हैं, तो आपका अनुरोध पूर्ण माना जाएगा। यदि आपको किसी विशिष्ट अवधि का इतिहास चाहिए,
    तो कृपया अनुरोध के दौरान वह समय सीमा स्पष्ट करें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
