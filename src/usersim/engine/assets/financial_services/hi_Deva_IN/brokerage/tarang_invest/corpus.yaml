- id: 09de142e-0292-5e52-98a3-4bfbe97024a0
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — सिंहावलोकन
  body: 'तरंग इन्वेस्ट की मार्जिन ट्रेडिंग सुविधा (MTF) एक उन्नत लीवरेज उपकरण है,
    जो आपको उधारित पूंजी के माध्यम से अपनी ट्रेडिंग क्षमता बढ़ाने की अनुमति देता है।
    यह सुविधा उन निवेशकों के लिए है जो उपलब्ध नकदी से अधिक मूल्य के शेयर खरीदना चाहते
    हैं।


    इस सुविधा की मुख्य विशेषताएं और शर्तें निम्नलिखित हैं:

    - न्यूनतम मार्जिन: निवेश के लिए आपको कुल मूल्य का 25% न्यूनतम मार्जिन के रूप में
    देना होगा।

    - वार्षिक ब्याज दर: उधार ली गई राशि पर 14.99% की वार्षिक ब्याज दर लागू होगी।

    - गिरवी शुल्क: प्रति स्क्रिप ₹20 का प्लेज शुल्क लिया जाएगा।


    हमारा शुल्क ढांचा पारदर्शिता और कम लागत पर आधारित है ताकि आपकी शुद्ध कमाई बढ़ सके।
    कृपया ध्यान दें कि मार्जिन ट्रेडिंग में जोखिम शामिल होता है। बाजार जोखिमों के
    अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें। तरंग इन्वेस्ट केवल शैक्षिक
    जानकारी प्रदान करता है; हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं और रिटर्न
    की गारंटी नहीं देते हैं।'
