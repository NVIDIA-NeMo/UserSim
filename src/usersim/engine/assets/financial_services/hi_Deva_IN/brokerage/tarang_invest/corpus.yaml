- id: 529949cd-673c-5ef0-8674-80d18ca14235
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) का उपयोग करते समय आपकी पूंजी की सुरक्षा अत्यंत
    महत्वपूर्ण है। हम एक ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं, इसलिए किसी भी ट्रांजेक्शन
    या खाते में बदलाव से पहले बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication)
    अनिवार्य है।


    सुरक्षा के लिए इन बातों का ध्यान रखें:

    1. कभी भी अपना ओटीपी (OTP) या पासवर्ड किसी के साथ साझा न करें; तरंग इन्वेस्ट का
    कोई भी प्रतिनिधि आपसे यह जानकारी नहीं मांगेगा।

    2. अपने मार्जिन स्तर की नियमित जांच करें ताकि अचानक बाजार गिरावट के कारण अनचाही
    लिक्विडेशन स्थिति से बचा जा सके।

    3. संदिग्ध गतिविधि दिखने पर तुरंत हमें सूचित करें। धोखाधड़ी के मामलों में हम निर्धारित
    समय सीमा के भीतर पारदर्शी जांच करते हैं और विनियामक अधिकारियों को सूचित करते हैं।


    यदि आपको लगता है कि आपका खाता सुरक्षित नहीं है, तो तुरंत पासवर्ड बदलें और हमारे
    सहायता विभाग को सूचित करें।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: security_advisory
  source_authority: official
