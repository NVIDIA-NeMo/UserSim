  title: ELSS टैक्स-सेवर फंड — जोखिम प्रकटीकरण
  body: 'महत्वपूर्ण प्रकटीकरण: ELSS टैक्स-सेवर फंड एक इक्विटी-लिंक्ड सेविंग्स स्कीम
    है। कृपया ध्यान दें कि यह उत्पाद बाजार जोखिमों के अधीन है और हम रिटर्न की कोई
    गारंटी नहीं देते हैं। निवेश का मूल्य बाजार के उतार-चढ़ाव के कारण घट या बढ़ सकता
    है।


    विनियामक सीमाएं:

    - लॉक-इन: इस फंड में निवेश की गई राशि 3 वर्ष तक लॉक रहती है, जिसे किसी भी परिस्थिति
    में समय से पहले नहीं निकाला जा सकता।

    - टैक्स लाभ: धारा 80C के तहत टैक्स कटौती का अधिकतम लाभ ₹150000 तक सीमित है। इससे
    अधिक का निवेश टैक्स लाभ नहीं देगा।


    हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती तरह पालन करते हैं। हम केवल
    उत्पाद की विशेषताओं के आधार पर अनुशंसा करते हैं और व्यक्तिगत टैक्स या कानूनी सलाह
    प्रदान नहीं करते हैं। कृपया सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
