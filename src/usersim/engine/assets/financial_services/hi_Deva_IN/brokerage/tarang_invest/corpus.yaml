- id: 688e21c0-6633-5076-b11c-7236dc51e109
  title: डीमैट और ट्रेडिंग खाता — सिंहावलोकन
  body: 'तरंग इन्वेस्ट का डीमैट और ट्रेडिंग खाता शेयर बाजार में निवेश और ट्रेडिंग
    के लिए आपका प्राथमिक द्वार है। हम नए और अनुभवी निवेशकों को एक ऐसा मंच प्रदान करते
    हैं जो किफायती और पारदर्शी समाधानों पर केंद्रित है। हमारा लक्ष्य तकनीक-संचालित
    पहुंच के माध्यम से आपकी शुद्ध कमाई को बढ़ाना है।


    इस खाते की मुख्य विशेषताएं और शुल्क इस प्रकार हैं:

    - इक्विटी डिलीवरी ब्रोकरेज: ₹0 (लंबी अवधि के निवेश के लिए कोई शुल्क नहीं)

    - इंट्राडे ब्रोकरेज: ₹20 प्रति ऑर्डर

    - DP शुल्क (DP Charges): ₹13.5 प्रति बिक्री (डीमैट खाते से शेयर बेचने पर लागू)

    - वार्षिक रखरखाव शुल्क (AMC): ₹300 प्रति वर्ष


    हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन करते हैं ताकि आपका
    निवेश सुरक्षित रहे। कृपया ध्यान दें कि शेयर बाजार में निवेश बाजार जोखिमों के अधीन
    है, इसलिए सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें। हम केवल उत्पाद की विशेषताओं
    के आधार पर अनुशंसा करते हैं और रिटर्न की गारंटी नहीं देते हैं।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5210f798-aa3c-5a9e-aa63-b563650c722c
  title: डीमैट और ट्रेडिंग खाता — वार्षिक रखरखाव शुल्क (AMC) की व्याख्या
  body: 'प्रश्न: वार्षिक रखरखाव शुल्क (AMC) क्या है और यह कितना है?

    उत्तर: AMC वह शुल्क है जो आपके डीमैट खाते के बुनियादी ढांचे के रखरखाव और विनियामक
    लागतों को कवर करने के लिए लिया जाता है। डीमैट और ट्रेडिंग खाता के लिए यह शुल्क
    ₹300 प्रति वर्ष है।


    प्रश्न: क्या यह शुल्क हर महीने लिया जाता है?

    उत्तर: नहीं, यह एक वार्षिक शुल्क है जो साल में एक बार आपके खाते से काटा जाता है।


    अधिक जानकारी के लिए कृपया डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची देखें।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5080ff86-c362-50ef-b8f1-d6056c7f7a76
  title: डीमैट और ट्रेडिंग खाता — सेटअप और सक्रियण
  body: 'अपना डीमैट और ट्रेडिंग खाता शुरू करने के लिए इन चरणों का पालन करें:


    1. अपनी बुनियादी जानकारी और पैन (PAN) विवरण प्रदान करें।

    2. अपनी पहचान और पते के प्रमाण के लिए आवश्यक दस्तावेज़ साझा करें।

    3. अपनी वित्तीय स्थिति और ट्रेडिंग अनुभव की घोषणा करें।

    4. हमारे द्वारा भेजे गए ई-केवाईसी (e-KYC) लिंक के माध्यम से डिजिटल हस्ताक्षर पूरा
    करें।

    5. अपने बैंक खाते के सत्यापन के लिए एक छोटा परीक्षण डिपॉजिट करें या कैंसिल चेक
    प्रदान करें।


    सक्रियण प्रक्रिया पूरी होने पर, हम आपको एक पुष्टिकरण संदेश और आपका क्लाइंट आईडी
    भेजेंगे। इसके बाद आप ₹0 इक्विटी डिलीवरी ब्रोकरेज का लाभ उठाते हुए निवेश शुरू कर
    सकते हैं। सुरक्षा के लिए, आपके खाते में किसी भी बदलाव से पहले बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) अनिवार्य होगा।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 8e7272d6-73bd-594e-81e5-fe01764cc01f
  title: डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची
  body: 'डीमैट और ट्रेडिंग खाता के लिए लागू शुल्क विवरण निम्नलिखित हैं:


    - इक्विटी डिलीवरी ब्रोकरेज: ₹0

    - इंट्राडे ब्रोकरेज (प्रति ऑर्डर): ₹20

    - DP शुल्क (प्रति बिक्री): ₹13.5

    - वार्षिक रखरखाव शुल्क (AMC): ₹300


    हमारा शुल्क ढांचा पारदर्शिता पर आधारित है ताकि निवेशकों की शुद्ध कमाई बढ़ सके।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 8ccaccb9-748e-5e1d-bcce-0ed1c70ca18d
  title: डीमैट और ट्रेडिंग खाता — विफल या लंबित कार्रवाई
  body: 'यदि आपकी कोई ट्रेड या फंड ट्रांसफर कार्रवाई विफल या लंबित दिख रही है, तो
    कृपया यह प्रक्रिया अपनाएं:


    1. सबसे पहले अपने उपलब्ध फंड बैलेंस और डीमैट होल्डिंग्स की जांच करें कि क्या पर्याप्त
    मात्रा मौजूद है।

    2. यह सुनिश्चित करें कि आपका खाता केवाईसी (KYC) अनुपालन में है और कोई दस्तावेज़
    लंबित नहीं है।

    3. यदि समस्या बनी रहती है, तो हमें विवरण बताएं। हम एक निर्धारित समय सीमा के भीतर
    पारदर्शी जांच प्रक्रिया का पालन करेंगे।


    संभावित कारण:

    - विनियामक रोक या मार्जिन की कमी।

    - बैंक सर्वर या एक्सचेंज की तकनीकी समस्या।


    समाधान:

    यदि समस्या हमारे स्तर पर है, तो हम मामले को वरिष्ठ अनुपालन अधिकारियों को भेजेंगे
    और आपको अपडेट प्रदान करेंगे। धोखाधड़ी के संदेह वाले मामलों में, हम तुरंत विनियामक
    अधिकारियों को सूचित करते हैं।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 7bbdaec6-0be8-5d49-9152-58ffa8b244d9
  title: डीमैट और ट्रेडिंग खाता — पात्रता शर्तें
  body: 'खाता खोलने के लिए पात्रता मानदंड:


    - भारतीय नागरिकता: अनिवार्य -> परिणाम: पात्र

    - वैध पैन (PAN) कार्ड: उपलब्ध -> परिणाम: पात्र

    - वैध बैंक खाता: उपलब्ध -> परिणाम: पात्र

    - आयु 18 वर्ष से कम: उपलब्ध -> परिणाम: केवल अभिभावक के माध्यम से पात्र

    - केवाईसी दस्तावेज़: अपूर्ण -> परिणाम: खाता सक्रियण लंबित'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: eligibility_matrix
  source_authority: official
