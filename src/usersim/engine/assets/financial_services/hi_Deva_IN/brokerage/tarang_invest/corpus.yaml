- id: 63abb3f0-2a11-52d8-98e9-f6ad76fc7823
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — पात्रता श्रेणियाँ
  body: "मार्जिन ट्रेडिंग सुविधा (MTF) की पात्रता निम्नलिखित मानदंडों पर आधारित है:\n\
    \n- पूर्ण केवाईसी (KYC) खाता $\rightarrow$ पात्र\n- अधूरा केवाईसी $\rightarrow$\
    \ अपात्र\n- न्यूनतम मार्जिन उपलब्धता 25% $\rightarrow$ सुविधा सक्रिय\n- न्यूनतम\
    \ मार्जिन उपलब्धता < 25% $\rightarrow$ केवल पोजीशन क्लोजिंग की अनुमति\n- स्वीकृत\
    \ स्क्रिप लिस्ट में शेयर $\rightarrow$ गिरवी रखने के लिए पात्र\n- गैर-स्वीकृत\
    \ स्क्रिप $\rightarrow$ गिरवी रखने के लिए अपात्र"
