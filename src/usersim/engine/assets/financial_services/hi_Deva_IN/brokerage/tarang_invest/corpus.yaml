  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: tarang_invest
- id: d0266128-2877-5202-b512-3a223a1eb4fd
  title: get_order_status का उपयोग कब करें
  body: 'जब ग्राहक अपने द्वारा दिए गए किसी विशेष ऑर्डर की वर्तमान स्थिति (जैसे: Pending,
    Executed, Rejected या Cancelled) के बारे में जानना चाहता है, तो इस प्रक्रिया का
    उपयोग करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके account_id की पुष्टि करें।

    3. ग्राहक से विशिष्ट Order ID मांगें।

    4. get_order_status टूल कॉल करके वर्तमान स्थिति प्राप्त करें और ग्राहक को सूचित
    करें।


    यह टूल डीमैट और ट्रेडिंग खाता के माध्यम से की गई सभी गतिविधियों के लिए उपलब्ध
    है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_order_status
  institution_id: tarang_invest
- id: 3dea1e78-6fae-52b4-bf81-67c50ccb673f
  title: get_order_status टूल संदर्भ
  body: "यह टूल एजेंट को किसी विशिष्ट ऑर्डर की वर्तमान स्थिति (जैसे कि लंबित, निष्पादित,\
    \ या रद्द) की जांच करने की अनुमति देता है। \n\nहस्ताक्षर: get_order_status(order_id:\
    \ string)\n\nप्रभाव: यह टूल निर्दिष्ट ऑर्डर आईडी के लिए वास्तविक समय की स्थिति\
    \ विवरण पुनर्प्राप्त करता है। एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता\
    \ है, जिससे ग्राहक को उनके ट्रेड की प्रगति के बारे में सटीक जानकारी मिलती है।"
