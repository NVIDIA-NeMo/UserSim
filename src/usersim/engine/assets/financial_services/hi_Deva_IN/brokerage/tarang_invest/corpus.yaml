- id: e4d6400c-d6f7-53c6-9852-46e2796e8054
  title: म्यूचुअल फंड SIP — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके निवेश विवरण या यूनिट बैलेंस में कोई विसंगति है,
    तो निम्नलिखित प्रक्रिया अपनाएं:


    सम्पट: आपके द्वारा ट्रैक की गई निवेश राशि और हमारे स्टेटमेंट में दिखाई गई राशि
    के बीच अंतर होना।


    जांच के चरण:

    1. सबसे पहले, अपने बैंक स्टेटमेंट की जांच करें कि क्या सभी किस्तें सही तारीख पर
    डेबिट हुई हैं।

    2. यह जांचें कि क्या कोई किस्त ₹500 की न्यूनतम राशि से कम होने के कारण विफल तो
    नहीं हुई।

    3. पिछले 365 दिनों के भीतर की गई किसी भी निकासी और उस पर लगे 1% एग्जिट लोड के
    प्रभाव की जांच करें।


    समाधान:

    - यदि अंतर स्पष्ट नहीं है, तो हमें अपने बैंक ट्रांजेक्शन का प्रमाण प्रदान करें।

    - हम आपके रिकॉर्ड का मिलान फंड हाउस के डेटा के साथ करेंगे।


    यदि विसंगति पाई जाती है, तो हम इसे ठीक करने के लिए फंड हाउस के साथ समन्वय करेंगे।
    यदि यह एक जटिल मामला है, तो इसे वरिष्ठ अनुपालन अधिकारियों को भेजा जाएगा और समाधान
    की पारदर्शी जांच प्रक्रिया शुरू की जाएगी।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
