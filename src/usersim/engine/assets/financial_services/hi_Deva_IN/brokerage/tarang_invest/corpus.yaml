- id: 86222e3b-b511-5fa5-9ab4-1da21d808d95
  title: म्यूचुअल फंड SIP — शुरुआत कैसे करें
  body: 'म्यूचुअल फंड SIP अनुशासित बचत और दीर्घकालिक धन सृजन के लिए एक सरल विकल्प
    है। सपोर्ट एजेंटों के लिए ग्राहक मार्गदर्शन निर्देश निम्नलिखित हैं:


    मुख्य विवरण:

    - न्यूनतम निवेश: ग्राहक ₹500 की न्यूनतम SIP राशि के साथ शुरुआत कर सकते हैं।

    - एग्जिट लोड: यदि निवेश 365 दिनों के भीतर निकाला जाता है, तो 1% का एग्जिट लोड
    लागू होगा।

    - लचीलापन: ग्राहक अपनी SIP को अधिकतम 6 महीने तक रोक (Pause) सकते हैं।


    शुरुआत की प्रक्रिया:

    1. ग्राहक की केवाईसी (KYC) स्थिति सत्यापित करें।

    2. वांछित फंड और मासिक निवेश राशि (न्यूनतम ₹500) का चयन करें।

    3. ऑटो-डेबिट के लिए बैंक मैंडेट सेटअप सुनिश्चित करें।

    4. ग्राहक को निवेश की पुष्टि और संबंधित योजना दस्तावेजों की प्रतियां प्रदान करें।


    हम केवल उत्पाद की विशेषताओं के आधार पर अनुशंसा करते हैं और व्यक्तिगत टैक्स या
    कानूनी सलाह नहीं देते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
