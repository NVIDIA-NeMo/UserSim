  title: मार्जिन ट्रेडिंग सुविधा (MTF) — विफल या लंबित कार्रवाई
  body: 'यदि आपकी मार्जिन ट्रेडिंग सुविधा (MTF) के माध्यम से कोई ट्रेड विफल हो जाता
    है या लंबित रहता है, तो कृपया निम्नलिखित की जांच करें:


    - अपर्याप्त मार्जिन: सुनिश्चित करें कि आपके खाते में कुल निवेश मूल्य का कम से
    कम 25% न्यूनतम मार्जिन उपलब्ध है।

    - प्लेज विफलता: जांचें कि क्या प्रति स्क्रिप ₹20 का प्लेज शुल्क आपके बैलेंस से
    कट गया है।

    - सत्यापन लंबित: यदि आपने हाल ही में सुविधा सक्रिय की है, तो जांचें कि आपका बहु-स्तरीय
    प्रमाणीकरण पूर्ण हुआ है या नहीं।


    यदि ये सभी बिंदु सही हैं और समस्या बनी रहती है, तो हमें सूचित करें। हम इस मामले
    की पारदर्शी जांच प्रक्रिया के तहत समीक्षा करेंगे और यदि आवश्यक हुआ तो इसे वरिष्ठ
    अनुपालन अधिकारियों को भेजा जाएगा। आपको समाधान के लिए एक निर्धारित समय सीमा के
    भीतर अपडेट प्राप्त होगा।'
