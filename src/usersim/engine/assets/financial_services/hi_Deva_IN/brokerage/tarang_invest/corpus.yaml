- id: 744071e3-f285-5399-9b52-6f864f0ea51b
  title: डीमैट और ट्रेडिंग खाता — खाता अनुबंध
  body: 'यह अनुबंध तरंग इन्वेस्ट और खाताधारक के बीच डीमैट और ट्रेडिंग खाता के उपयोग
    को नियंत्रित करता है। ग्राहक इस बात से सहमत है कि वह बुनियादी ढांचे के रखरखाव
    के लिए ₹300 का वार्षिक रखरखाव शुल्क (AMC) भुगतान करेगा।


    ट्रेडिंग शुल्क के संबंध में, इंट्राडे ऑर्डर के लिए ₹20 प्रति ऑर्डर का ब्रोकरेज
    लागू होगा, जबकि इक्विटी डिलीवरी ब्रोकरेज ₹0 रखा गया है। डीमैट खाते से शेयर बेचने
    पर डिपॉजिटरी द्वारा निर्धारित ₹13.5 का DP शुल्क प्रति बिक्री लिया जाएगा।


    तरंग इन्वेस्ट SEBI और NSE/BSE के दिशा-निर्देशों का पालन करता है। हम विनियामक आवश्यकताओं
    के कारण शुल्क संरचना में बदलाव का अधिकार सुरक्षित रखते हैं, जिसकी सूचना आपको समय
    रहते दी जाएगी। यह अनुबंध तब समाप्त होता है जब ग्राहक खाता बंद करने का अनुरोध करता
    है और सभी बकाया शुल्क का निपटान कर दिया जाता है। किसी भी विवाद की स्थिति में,
    हम एक निर्धारित समय सीमा के भीतर पारदर्शी जांच प्रक्रिया का पालन करेंगे।'
