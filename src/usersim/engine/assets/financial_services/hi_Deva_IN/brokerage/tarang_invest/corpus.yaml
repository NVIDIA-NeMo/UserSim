- id: a17ad46e-1416-5e68-b107-dcb0039f7fec
  title: डीमैट और ट्रेडिंग खाता — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'एक सपोर्ट एजेंट के रूप में, कृपया ग्राहकों को डीमैट और ट्रेडिंग खाता की निम्नलिखित
    सीमाओं और प्रतिबंधों के बारे में सूचित करें:


    1. शुल्क सीमाएं: सभी खातों पर ₹300 का वार्षिक रखरखाव शुल्क (AMC) लागू होता है।

    2. ट्रेडिंग प्रतिबंध: इंट्राडे ट्रेडिंग के लिए प्रति ऑर्डर ₹20 का ब्रोकरेज शुल्क
    अनिवार्य है।

    3. बिक्री शुल्क: शेयर बेचने पर ₹13.5 का DP शुल्क लागू होता है, जो डिपॉजिटरी द्वारा
    लिया जाता है।

    4. अपवाद: इक्विटी डिलीवरी ब्रोकरेज ₹0 है, लेकिन यह केवल उन ट्रेडों पर लागू होता
    है जो डिलीवरी के लिए हैं।


    किसी भी ट्रांजेक्शन या खाते में बदलाव से पहले बहु-स्तरीय प्रमाणीकरण अनिवार्य है।
    यदि ग्राहक का खाता विनियामक कारणों से या अपूर्ण केवाईसी के कारण अवरुद्ध है, तो
    वे ट्रेडिंग नहीं कर पाएंगे। अधिक विवरण के लिए ''डीमैट और ट्रेडिंग खाता — नियामक
    प्रकटीकरण'' देखें।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: product_sheet
  source_authority: official
