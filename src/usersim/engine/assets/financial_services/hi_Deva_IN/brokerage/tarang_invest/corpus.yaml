- id: c69fd152-bbf2-51b8-954a-ebeaec8475c3
  title: डीमैट और ट्रेडिंग खाता — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'अपने डीमैट और ट्रेडिंग खाता में फंड जोड़ने और पहला ट्रेड करने की पूर्ण प्रक्रिया
    यहाँ दी गई है:


    1. हमें फंड जमा करने का अनुरोध भेजें और आवश्यक राशि बताएं।

    2. हम आपको भुगतान का तरीका प्रदान करेंगे; भुगतान पूरा होने पर हम आपके ट्रेडिंग
    बैलेंस की पुष्टि करेंगे।

    3. अब हमें बताएं कि आप कौन सा शेयर खरीदना चाहते हैं और कितनी मात्रा में।

    4. यदि यह डिलीवरी ट्रेड है, तो आपका ब्रोकरेज ₹0 होगा। यदि यह इंट्राडे ट्रेड है,
    तो ₹20 प्रति ऑर्डर ब्रोकरेज लगेगा।

    5. हम ट्रेड निष्पादित करेंगे और पुष्टि करेंगे कि शेयर आपके डीमैट खाते में जमा
    हो गए हैं या इंट्राडे पोजीशन ओपन हो गई है।

    6. भविष्य में जब आप इन शेयरों को बेचेंगे, तो आपके खाते से ₹13.5 का DP शुल्क काटा
    जाएगा।


    इस प्रकार आपका निवेश अनुरोध पूर्ण होता है।'
