  institution_id: tarang_invest
- id: dfcd451d-b993-530e-968c-a0973823dc5f
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: ग्राहक को मार्जिन ट्रेडिंग सुविधा (MTF) के विकल्प नहीं दिख रहे हैं
    या लॉगिन के बाद ''MTF एक्सेस अस्वीकृत'' का संदेश मिल रहा है।


    संभावित कारण:

    1. आपका खाता केवाईसी (KYC) अपडेट नहीं है या दस्तावेज़ अधूरे हैं।

    2. आपके खाते में न्यूनतम मार्जिन 25% से कम हो गया है, जिससे सुविधा अस्थायी रूप
    से प्रतिबंधित हो गई है।

    3. बहु-स्तरीय प्रमाणीकरण (MFA) विफल हो रहा है।


    समाधान के चरण:

    - सबसे पहले अपने प्रोफाइल सेक्शन में केवाईसी स्थिति की जाँच करें।

    - अपने फंड बैलेंस और मार्जिन स्तर की जाँच करें। यदि मार्जिन 25% से कम है, तो अतिरिक्त
    फंड जमा करें।

    - यदि समस्या बनी रहती है, तो हमें सूचित करें।


    यदि हम इसे तुरंत हल नहीं कर पाते हैं, तो मामला वरिष्ठ अनुपालन अधिकारियों को भेजा
    जाएगा, और आपको 2 कार्यदिवस के भीतर समाधान या स्थिति अपडेट प्राप्त होगा।'
