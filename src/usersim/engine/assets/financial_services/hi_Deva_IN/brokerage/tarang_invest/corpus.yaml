- id: 48a81e54-9571-5471-beee-8ac5fc7392d5
  title: म्यूचुअल फंड SIP — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी SIP किस्त अस्वीकृत हो जाती है या निवेश कार्रवाई अवरुद्ध हो जाती
    है, तो समस्या का समाधान इस प्रकार करें:


    लक्षण: आपको ''Payment Failed'' या ''Action Blocked'' का संदेश प्राप्त होना।


    संभावित कारण:

    1. बैंक खाते में पर्याप्त शेष राशि न होना।

    2. न्यूनतम SIP राशि ₹500 से कम का प्रयास करना।

    3. केवाईसी (KYC) दस्तावेज़ों का पुराना होना या अपडेट न होना।

    4. बैंक द्वारा ऑटो-डेबिट (Mandate) निर्देश को अस्वीकार करना।


    जांच के चरण:

    - पहले अपने बैंक बैलेंस की जांच करें।

    - पुष्टि करें कि निवेश राशि ₹500 की सीमा को पूरा करती है।

    - अपने प्रोफाइल में केवाईसी स्थिति की जांच करें।


    समाधान:

    - यदि राशि कम है, तो इसे सही करें और पुनः प्रयास करें।

    - यदि केवाईसी लंबित है, तो हमें अपडेटेड दस्तावेज़ प्रदान करें।


    यदि समस्या बनी रहती है, तो हम मामले को वरिष्ठ अनुपालन अधिकारियों को भेजेंगे, और
    आप 3-5 कार्यदिवसों के भीतर समाधान प्राप्त करेंगे।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
