- id: 03f9846e-413d-5e2c-b735-f3374adbfd03
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — शर्तों में बदलाव की नीति
  body: 'तरंग इन्वेस्ट को बाजार की स्थितियों और विनियामक परिवर्तनों के आधार पर मार्जिन
    ट्रेडिंग सुविधा (MTF) की शर्तों को संशोधित करने का अधिकार है।


    मुख्य शर्तें और बदलाव की नीति:

    1. ब्याज दर: वर्तमान में वार्षिक ब्याज दर 14.99% है। किसी भी बदलाव की स्थिति में,
    आपको ईमेल या संदेश के माध्यम से 15 कार्यदिवसों के अग्रिम नोटिस द्वारा सूचित किया
    जाएगा।

    2. मार्जिन आवश्यकता: न्यूनतम मार्जिन 25% निर्धारित है। जोखिम प्रबंधन के आधार पर,
    हम इस सीमा को बढ़ा सकते हैं, जिसकी सूचना तुरंत दी जाएगी।

    3. शुल्क: प्रति स्क्रिप गिरवी शुल्क ₹20 है। प्रशासनिक या विनियामक लागतों के कारण
    इसमें बदलाव संभव है।


    शर्तों में बदलाव के बाद भी यदि आप सेवा का उपयोग जारी रखते हैं, तो इसे संशोधित
    शर्तों की स्वीकृति माना जाएगा। यदि आप नए नियमों से सहमत नहीं हैं, तो आप अपनी पोजीशन
    बंद करके सुविधा का उपयोग समाप्त कर सकते हैं।'
