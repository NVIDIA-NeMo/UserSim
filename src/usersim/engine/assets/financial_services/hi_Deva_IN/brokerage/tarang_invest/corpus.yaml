- id: 2a4e9c57-236e-5ee1-8d3a-94346a7414e3
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — विकल्पों से तुलना और कब न चुनें
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) उधारित पूंजी के माध्यम से आपकी क्षमता बढ़ाती
    है, लेकिन यह हर निवेशक के लिए उपयुक्त नहीं है।


    तुलना:

    - बनाम नकद ट्रेडिंग: नकद ट्रेडिंग में कोई ब्याज नहीं लगता, लेकिन आपकी क्षमता आपके
    फंड तक सीमित होती है। MTF में आप 25% न्यूनतम मार्जिन के साथ अधिक निवेश कर सकते
    हैं, लेकिन 14.99% वार्षिक ब्याज देना पड़ता है।

    - बनाम अन्य ऋण: MTF विशेष रूप से शेयरों के लिए है और इसमें ₹20 का प्रति स्क्रिप
    गिरवी शुल्क लगता है, जो इसे सामान्य व्यक्तिगत ऋण से अलग बनाता है।


    आपको MTF कब नहीं चुनना चाहिए:

    1. यदि आप ब्याज लागत वहन नहीं कर सकते।

    2. यदि आप बाजार की अस्थिरता से डरते हैं; क्योंकि मार्जिन कॉल की स्थिति में आपको
    तुरंत फंड देना होगा।

    3. यदि आप केवल दीर्घकालिक, जोखिम-मुक्त निवेश चाहते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: product_sheet
  source_authority: official
