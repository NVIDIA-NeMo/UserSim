  title: मार्जिन ट्रेडिंग सुविधा (MTF) — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) एक उन्नत लीवरेज उपकरण है जिसे उन निवेशकों के
    लिए डिज़ाइन किया गया है जो अपनी ट्रेडिंग क्षमता बढ़ाना चाहते हैं।


    यह किसके लिए उपयुक्त है:

    - अनुभवी ट्रेडर्स जो अल्पकालिक अवसरों का लाभ उठाने के लिए उधारित पूंजी का उपयोग
    करना चाहते हैं।

    - वे निवेशक जिनके पास उच्च विश्वास है कि चयनित शेयरों का रिटर्न उनकी लागत से अधिक
    होगा।


    मुख्य विवरण:

    - वार्षिक ब्याज दर: 14.99%

    - न्यूनतम मार्जिन आवश्यकता: 25%

    - प्रति स्क्रिप गिरवी शुल्क: ₹20


    सामान्य उपयोग: इसका उपयोग तब किया जाता है जब निवेशक के पास पर्याप्त नकदी नहीं
    होती, लेकिन वह एक बड़ी पोजीशन लेना चाहता है। उदाहरण के लिए, 25% मार्जिन देकर आप
    शेष राशि तरंग इन्वेस्ट से उधार ले सकते हैं।


    चेतावनी: बाजार जोखिमों के अधीन। हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं।
    अधिक जानकारी के लिए मार्जिन ट्रेडिंग सुविधा (MTF) — जोखिम प्रकटीकरण पढ़ें।'
