- id: 38879a27-9879-5c45-a6a2-b33d2823a323
  title: डीमैट और ट्रेडिंग खाता — शुरुआत कैसे करें
  body: 'तरंग इन्वेस्ट के ''डीमैट और ट्रेडिंग खाता'' के साथ निवेश शुरू करना सरल और
    पारदर्शी है। यह उत्पाद उन लोगों के लिए प्राथमिक द्वार है जो न्यूनतम लागत पर शेयर
    बाजार में प्रवेश करना चाहते हैं।


    शुरुआत करने के लिए आवश्यक विवरण और लागत:

    - वार्षिक रखरखाव शुल्क (AMC): ₹300

    - इक्विटी डिलीवरी ब्रोकरेज: ₹0 (लंबी अवधि के निवेश के लिए आदर्श)

    - इंट्राडे ब्रोकरेज प्रति ऑर्डर: ₹20

    - DP शुल्क: ₹13.5 प्रति बिक्री (जब आप अपने डीमैट खाते से शेयर बेचते हैं)


    प्रक्रिया:

    एक बार जब आप आवश्यक दस्तावेज़ जमा कर देते हैं और केवाईसी (KYC) प्रक्रिया पूरी
    हो जाती है, तो आपका खाता सक्रिय कर दिया जाता है। इसके बाद आप अपने बैंक खाते से
    फंड जमा कर सकते हैं और ट्रेडिंग शुरू कर सकते हैं। विस्तृत सेटअप चरणों के लिए ''डीमैट
    और ट्रेडिंग खाता — सेटअप और सक्रियण'' देखें।'
