- id: de627065-64f9-5f82-9827-638be6102f8d
  title: डीमैट और ट्रेडिंग खाता — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने ''डीमैट और ट्रेडिंग खाता'' में लॉगिन नहीं कर पा रहे हैं, तो कृपया
    निम्नलिखित जांच करें:


    लक्षण: ''गलत क्रेडेंशियल्स'' का संदेश मिलना या ओटीपी (OTP) प्राप्त न होना।


    संभावित कारण और समाधान:

    1. क्रेडेंशियल जांचें: सुनिश्चित करें कि आप सही यूजर आईडी और पासवर्ड का उपयोग
    कर रहे हैं। यदि पासवर्ड भूल गए हैं, तो हमें रीसेट करने के लिए कहें; हम आपकी पंजीकृत
    ईमेल पर लिंक भेजेंगे।

    2. नेटवर्क और ओटीपी: यदि ओटीपी नहीं मिल रहा है, तो नेटवर्क कनेक्शन जांचें। यदि
    समस्या बनी रहती है, तो हमें बताएं; हम आपके पंजीकृत मोबाइल नंबर की स्थिति की जांच
    करेंगे।

    3. खाता फ्रीज: यदि लंबे समय तक निष्क्रियता के कारण खाता फ्रीज हो गया है, तो हम
    पुनः केवाईसी (Re-KYC) प्रक्रिया शुरू करेंगे।


    यदि ये चरण काम नहीं करते हैं, तो हम मामले को वरिष्ठ अनुपालन अधिकारियों को भेजेंगे,
    और आपको 3 कार्यदिवस के भीतर समाधान प्राप्त होगा। अधिक जानकारी के लिए ''डीमैट और
    ट्रेडिंग खाता — विफल या लंबित कार्रवाई'' देखें।'
