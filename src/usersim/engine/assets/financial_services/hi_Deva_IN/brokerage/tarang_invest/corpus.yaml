- id: 0198b2a3-e604-5590-8400-f39f16ba440a
  title: deposit_funds का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने डीमैट और ट्रेडिंग खाता या अन्य निवेश खातों में नई
    पूंजी जोड़नी हो, तो इस प्रक्रिया का पालन करें। फंड जमा करना निवेश शुरू करने या
    मार्जिन आवश्यकताओं को पूरा करने के लिए आवश्यक है।


    प्रक्रिया:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक के पास कई खाते हैं, तो get_accounts का उपयोग करके सही account_id
    की पहचान करें।

    3. ग्राहक से जमा की जाने वाली राशि (₹) और स्रोत खाते का विवरण मांगें।

    4. अंत में, फंड जमा करने की प्रक्रिया को पूरा करने के लिए deposit_funds टूल को
    कॉल करें।


    हमारा शुल्क ढांचा पारदर्शिता पर आधारित है, और फंड जमा करने की प्रक्रिया बुनियादी
    ढांचे के रखरखाव के सिद्धांतों के अनुरूप है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: tarang_invest
- id: 846429c5-3abf-52f6-b4e9-9a5012c1408f
  title: deposit_funds टूल संदर्भ
  body: 'यह टूल ग्राहक के निवेश खाते में धन जमा करने की प्रक्रिया शुरू करने के लिए
    उपयोग किया जाता है।


    हस्ताक्षर: deposit_funds(account_id: string, amount: number, payment_method: string)


    प्रभाव: यह टूल निर्दिष्ट खाते में फंड जोड़ने के लिए भुगतान गेटवे या बैंक हस्तांतरण
    प्रक्रिया को ट्रिगर करता है। एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता
    है, ग्राहक को किसी बाहरी पोर्टल पर भेजने के बजाय।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - deposit_funds
  institution_id: tarang_invest
- id: e6673b7c-1fc2-55a0-ad3b-02b9a40133ff
  title: withdraw_funds का उपयोग कब करें
  body: 'जब ग्राहक अपने निवेश खाते से शेष राशि निकालना चाहते हैं, तो इस प्रक्रिया
    का पालन करें। कृपया ध्यान दें कि यह एक अपरिवर्तनीय (irreversible) क्रिया है।


    प्रक्रिया:

    1. verify_identity टूल के माध्यम से ग्राहक की पहचान की पुष्टि करें।

    2. get_accounts का उपयोग करके संबंधित account_id प्राप्त करें और उपलब्ध शेष राशि
    की जांच करें।

    3. ग्राहक से वह सटीक राशि (₹) पूछें जिसे वे निकालना चाहते हैं और पुष्टि करें कि
    यह राशि किसी लॉक-इन अवधि (जैसे ELSS टैक्स-सेवर फंड में) के अधीन नहीं है।

    4. धन निकासी को अंतिम रूप देने के लिए withdraw_funds टूल का उपयोग करें।


    निकासी के दौरान लागू होने वाले किसी भी शुल्क के लिए ग्राहक को ''संस्था-व्यापी
    शुल्क और प्रभार'' दस्तावेज़ देखने की सलाह दी जा सकती है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - withdraw_funds
  institution_id: tarang_invest
- id: ee25ba6c-c919-54db-99d1-bf801de19c4a
  title: withdraw_funds टूल संदर्भ
  body: 'यह टूल ग्राहक के खाते से धनराशि निकालने के अनुरोध को संसाधित करने के लिए
    उपयोग किया जाता है।


    हस्ताक्षर: withdraw_funds(account_id: string, amount: number)


    प्रभाव: यह टूल खाते से राशि घटाता है और उसे ग्राहक के पंजीकृत बैंक खाते में स्थानांतरित
    करने की प्रक्रिया शुरू करता है। यह एक अपरिवर्तनीय क्रिया है। एजेंट इसे सीधे टूल
    कॉल के माध्यम से निष्पादित करता है।'
