- id: 67abfbd8-2fca-5c12-b05a-46ce6a78641d
  title: म्यूचुअल फंड SIP — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'एक नई म्यूचुअल फंड SIP शुरू करने के पूर्ण समाधान के लिए इन चरणों का पालन
    करें:


    1. हमें सूचित करें कि आप म्यूचुअल फंड SIP शुरू करना चाहते हैं और अपनी पसंद की
    योजना का विवरण दें।

    2. अपनी मासिक निवेश राशि बताएं (सुनिश्चित करें कि यह न्यूनतम ₹500 है) और निवेश
    की तारीख चुनें।

    3. अपने बैंक खाते का विवरण प्रदान करें जिससे ऑटो-डेबिट मैंडेट सेट किया जा सके।

    4. हम आपके अनुरोध को प्रोसेस करेंगे और आपसे डिजिटल रूप से मैंडेट की पुष्टि करने
    के लिए कहेंगे।

    5. एक बार पुष्टि हो जाने पर, हम आपको एक पुष्टिकरण संदेश भेजेंगे कि आपकी SIP सफलतापूर्वक
    सेटअप हो गई है।


    आपकी पहली किस्त आपकी चुनी हुई तारीख पर डेबिट होगी, और उसके बाद नियमित अंतराल पर
    निवेश जारी रहेगा। यदि आप भविष्य में इसे रोकना चाहते हैं, तो याद रखें कि आप अधिकतम
    6 माह तक SIP पॉज कर सकते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
