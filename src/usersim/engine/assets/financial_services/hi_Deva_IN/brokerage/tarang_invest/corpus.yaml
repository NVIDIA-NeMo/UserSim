- id: 57310ba6-3aeb-5dc0-93d0-71efde7cdb1a
  title: ELSS टैक्स-सेवर फंड — नियामक प्रकटीकरण
  body: 'तरंग इन्वेस्ट SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन करता
    है। ELSS टैक्स-सेवर फंड के संबंध में निम्नलिखित प्रकटीकरण अनिवार्य हैं:


    1. टैक्स लाभ: धारा 80C के तहत ₹150000 की कटौती वर्तमान आयकर कानूनों के अधीन है।
    कानून में बदलाव होने पर यह लाभ प्रभावित हो सकता है।

    2. लॉक-इन: विनियामक आवश्यकताओं के अनुसार, निवेश की तारीख से 3 वर्ष तक कोई भी निकासी
    संभव नहीं है।

    3. जोखिम: यह एक इक्विटी-आधारित उत्पाद है, इसलिए यह बाजार जोखिमों के अधीन है। हम
    रिटर्न की गारंटी नहीं देते हैं।


    हम डेटा गोपनीयता को प्राथमिकता देते हैं और बहु-स्तरीय प्रमाणीकरण (MFA) के माध्यम
    से आपके निवेश की सुरक्षा सुनिश्चित करते हैं। बाजार जोखिमों के अधीन, सभी योजना
    संबंधित दस्तावेजों को ध्यान से पढ़ें।'
