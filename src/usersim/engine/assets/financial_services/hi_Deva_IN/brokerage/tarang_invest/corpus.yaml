- id: 6b343b88-8212-5af4-8340-70334b741449
  title: ELSS टैक्स-सेवर फंड — पात्रता और सेटअप
  body: 'प्रश्न: ELSS टैक्स-सेवर फंड में निवेश करने के लिए कौन पात्र है?

    उत्तर: कोई भी भारतीय निवासी जो केवाईसी (KYC) मानदंडों को पूरा करता है और एक डीमैट
    खाते का स्वामी है, वह निवेश कर सकता है।


    प्रश्न: मैं अपना सेटअप कैसे शुरू कर सकता हूँ?

    उत्तर: आप न्यूनतम ₹500 के निवेश के साथ शुरुआत कर सकते हैं। सेटअप प्रक्रिया के
    लिए कृपया ''ELSS टैक्स-सेवर फंड — सेटअप और सक्रियण'' मार्गदर्शिका देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
