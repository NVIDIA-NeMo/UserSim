- id: 8786cccf-ac6c-5887-887b-73be6399ed39
  title: म्यूचुअल फंड SIP — रेफरल और लॉयल्टी ऑफर
  body: 'तरंग इन्वेस्ट के साथ अपनी निवेश यात्रा शुरू करें! यदि आप किसी मित्र को म्यूचुअल
    फंड SIP के लिए रेफर करते हैं, तो सफल खाता खोलने और पहली SIP राशि (न्यूनतम ₹500)
    जमा होने पर आपको ₹200 का रेफरल बोनस मिलेगा। यह ऑफर 1 जनवरी 2024 से 31 दिसंबर 2024
    तक वैध है। हमारे वफादार निवेशकों के लिए, 12 लगातार महीनों तक SIP बनाए रखने पर
    अगले निवेश पर विशेष शुल्क छूट प्रदान की जाएगी।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
