  institution_id: tarang_invest
- id: 752658ee-da85-5a1f-86e8-76886f40625e
  title: म्यूचुअल फंड SIP — ब्याज दर अनुसूची
  body: 'म्यूचुअल फंड SIP एक बाजार-लिंक्ड उत्पाद है, इसलिए इसमें कोई निश्चित ब्याज
    दर लागू नहीं होती है। रिटर्न संबंधित फंड के प्रदर्शन (NAV) पर निर्भर करता है।


    महत्वपूर्ण दरें:

    - एग्जिट लोड: 1% (केवल 365 दिनों के भीतर निकासी पर लागू)।


    चूंकि यह एक इक्विटी या डेट फंड हो सकता है, इसलिए वास्तविक रिटर्न बाजार की स्थितियों
    के अनुसार बदलता रहता है। हम रिटर्न की कोई गारंटी नहीं देते हैं। विस्तृत विवरण
    के लिए म्यूचुअल फंड SIP — सिंहावलोकन देखें।'
