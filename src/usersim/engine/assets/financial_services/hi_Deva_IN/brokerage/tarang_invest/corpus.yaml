  institution_id: tarang_invest
- id: 4f3986e9-cc3a-54cd-b1c6-e373cafed152
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — पात्रता और सेटअप
  body: 'प्रश्न: मार्जिन ट्रेडिंग सुविधा (MTF) के लिए कौन पात्र है?

    उत्तर: हमारे सभी सक्रिय डीमैट खाताधारक जिनके पास आवश्यक दस्तावेज़ पूर्ण हैं, वे
    MTF के लिए आवेदन कर सकते हैं। हालांकि, ट्रेड निष्पादित करने के लिए 25% न्यूनतम
    मार्जिन होना अनिवार्य है।


    प्रश्न: सेटअप प्रक्रिया क्या है?

    उत्तर: आपको बस हमें MTF सक्रिय करने का अनुरोध करना होगा। हम आपकी पात्रता की जांच
    करेंगे और सक्रियण के बाद आप 14.99% वार्षिक ब्याज दर पर लीवरेज का उपयोग कर पाएंगे।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 70d48878-f53c-5eeb-a9cc-402e1992ec4a
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) के माध्यम से शेयर खरीदने के एक पूर्ण अनुरोध
    की प्रक्रिया यहाँ दी गई है:


    1. हमें वह शेयर और मात्रा बताएं जिसे आप MTF के तहत खरीदना चाहते हैं।

    2. हम आपके खाते में आवश्यक 25% न्यूनतम मार्जिन की उपलब्धता की जांच करेंगे।

    3. हम आपको सूचित करेंगे कि इस ट्रेड के लिए प्रति स्क्रिप ₹20 का गिरवी शुल्क लागू
    होगा और उधार ली गई राशि पर 14.99% वार्षिक ब्याज लगेगा।

    4. एक बार जब आप इन शुल्कों और शर्तों से सहमत हो जाते हैं, तो हम ट्रेड निष्पादित
    करेंगे।

    5. हम आपको ट्रेड पुष्टिकरण भेजेंगे, जिसमें आपकी अपनी पूंजी और उधार ली गई राशि
    का स्पष्ट विवरण होगा।

    6. आप अपनी स्थिति की जांच कर सकते हैं और बाद में या तो पोजीशन बेचकर या उधार राशि
    का भुगतान करके इस सुविधा को समाप्त कर सकते हैं।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: how_to_guide
  source_authority: official
