- id: 234b4f0a-344b-53c4-84df-ff6d8dc7aabc
  title: डीमैट और ट्रेडिंग खाता — स्थिति या इतिहास देखना
  body: 'अपने डीमैट और ट्रेडिंग खाता की वर्तमान स्थिति या पिछले लेनदेन का इतिहास देखने
    के लिए इन चरणों का पालन करें:


    1. हमें बताएं कि आप अपनी होल्डिंग्स की स्थिति या पिछले ट्रेडों का इतिहास देखना
    चाहते हैं।

    2. यदि आप विशिष्ट समय अवधि (जैसे पिछला महीना या वित्तीय वर्ष) का विवरण चाहते हैं,
    तो कृपया वह अवधि हमें प्रदान करें।

    3. हम आपके खाते का सत्यापन करेंगे और आपकी वर्तमान पोजीशन (मौजूदा शेयर) और ट्रेड
    इतिहास का विवरण आपके साथ साझा करेंगे।

    4. आपको एक विस्तृत स्टेटमेंट प्राप्त होगा जिसमें आपके द्वारा खरीदे/बेचे गए शेयर,
    लागू ब्रोकरेज (जैसे इंट्राडे के लिए ₹20 प्रति ऑर्डर) और DP शुल्क (बिक्री पर ₹13.5)
    का स्पष्ट उल्लेख होगा।


    जब आपको विवरण मिल जाए और आप पुष्टि कर लें कि सभी प्रविष्टियां सही हैं, तो आपकी
    अनुरोध प्रक्रिया पूरी हो जाती है।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
  source_authority: official
