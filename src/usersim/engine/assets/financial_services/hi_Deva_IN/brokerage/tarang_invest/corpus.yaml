- id: 01e0d89f-65c7-58cf-ac39-7bbc24399043
  title: म्यूचुअल फंड SIP — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'म्यूचुअल फंड SIP निवेशकों को निशाना बनाने वाले स्कैम अक्सर ''गारंटीड रिटर्न''
    या ''इनसाइडर टिप्स'' का वादा करते हैं। कृपया ध्यान दें कि तरंग इन्वेस्ट कभी भी
    रिटर्न की गारंटी नहीं देता है।


    सावधान रहें यदि कोई व्यक्ति आपसे निम्नलिखित मांग करता है:

    1. आपके खाते का पासवर्ड या मल्टी-फैक्टर ऑथेंटिकेशन (MFA) कोड।

    2. किसी व्यक्तिगत खाते में फंड ट्रांसफर करने के लिए कहे, यह दावा करते हुए कि यह
    आपके म्यूचुअल फंड निवेश का हिस्सा है।

    3. बिना किसी आधिकारिक दस्तावेज़ के बहुत अधिक मुनाफ़े का लालच दे।


    हमारा सुरक्षा दृष्टिकोण ''जीरो-ट्रस्ट'' पर आधारित है, इसलिए किसी भी संदिग्ध गतिविधि
    की स्थिति में तुरंत हमें सूचित करें। याद रखें, हम आपसे कभी भी आपके गोपनीय क्रेडेंशियल्स
    नहीं मांगेंगे। यदि आपको लगता है कि आपके साथ धोखाधड़ी हुई है, तो तुरंत रिपोर्ट
    करें ताकि हम विनियामक अधिकारियों को सूचित कर सकें और आपकी सुरक्षा सुनिश्चित कर
    सकें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
