- id: 91655e5c-851a-528e-b8dd-8bff9a22f802
  title: म्यूचुअल फंड SIP — विफल या लंबित कार्रवाई
  body: 'यदि आपकी SIP किस्त विफल हो जाती है या लंबित दिख रही है, तो निम्नलिखित चरणों
    का पालन करें:


    लक्षण: आपके बैंक खाते से पैसा नहीं कटा या निवेश पोर्टफोलियो में अपडेट नहीं हुआ।


    जांच की शर्तें:

    1. बैंक बैलेंस: सुनिश्चित करें कि आपके खाते में SIP राशि (कम से कम ₹500) उपलब्ध
    थी।

    2. मैंडेट स्थिति: जांचें कि क्या आपका बैंक मैंडेट अभी भी सक्रिय है या समाप्त हो
    गया है।


    समाधान:

    - यदि अपर्याप्त फंड के कारण विफलता हुई है, तो बैंक में राशि जमा करें; अगली किस्त
    स्वचालित रूप से प्रोसेस होगी।

    - यदि मैंडेट समस्या है, तो हमें नया मैंडेट अपडेट करने के लिए कहें।


    यदि समस्या बनी रहती है, तो हम मामले को अपने वरिष्ठ अनुपालन अधिकारियों को भेजेंगे
    और निर्धारित समय सीमा के भीतर आपको पारदर्शी जांच परिणाम प्रदान करेंगे।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 5a67cedf-9f85-5757-a949-18dcff76d417
  title: म्यूचुअल फंड SIP — पात्रता शर्तें
  body: 'म्यूचुअल फंड SIP के लिए पात्रता मानदंड नीचे दिए गए हैं:


    | शर्त | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | निवेश राशि | ₹500 या उससे अधिक | पात्र |

    | निवेश राशि | ₹500 से कम | अपात्र |

    | केवाईसी (KYC) स्थिति | पूर्ण और सत्यापित | पात्र |

    | केवाईसी (KYC) स्थिति | अपूर्ण या लंबित | अपात्र |

    | बैंक खाता | सक्रिय और लिंक | पात्र |

    | बैंक खाता | निष्क्रिय या अनलिंक्ड | अपात्र |'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: eligibility_matrix
  source_authority: official
