- id: cec02c4a-6c72-540e-93ba-b67c260bd732
  title: redeem_mutual_fund का उपयोग कब करें
  body: 'जब कोई ग्राहक अपने म्यूचुअल फंड निवेश से पैसा निकालना चाहता है, तब redeem_mutual_fund
    टूल का उपयोग किया जाता है।


    प्रक्रिया:

    1. verify_identity के माध्यम से ग्राहक का प्रमाणीकरण करें।

    2. get_accounts का उपयोग करके सही account_id की पहचान करें।

    3. get_positions के माध्यम से उपलब्ध यूनिट्स की जाँच करें।

    4. ग्राहक को लागू एग्जिट लोड (यदि कोई हो) के बारे में सूचित करें।

    5. रिडेम्पशन निष्पादित करने के लिए redeem_mutual_fund टूल को कॉल करें।


    एजेंट को यह सुनिश्चित करना चाहिए कि रिडेम्पशन अनुरोध केवल सत्यापित खातों से ही
    प्रोसेस किया जाए।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - redeem_mutual_fund
  institution_id: tarang_invest
