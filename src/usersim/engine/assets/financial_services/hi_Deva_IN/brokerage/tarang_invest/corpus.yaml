- id: a714240f-5836-51ec-8d2e-ee5a50a0bd50
  title: ELSS टैक्स-सेवर फंड — लागत और शुल्क
  body: 'प्रश्न: ELSS टैक्स-सेवर फंड में निवेश करने की लागत क्या है?

    उत्तर: इस फंड में निवेश के लिए न्यूनतम निवेश ₹500 है। हमारा शुल्क ढांचा पारदर्शिता
    पर आधारित है ताकि आपकी शुद्ध कमाई बढ़ सके।


    प्रश्न: क्या इस फंड से पैसा निकालने पर कोई शुल्क लगता है?

    उत्तर: म्यूचुअल फंड से एक निश्चित अवधि से पहले पैसा निकालने पर एग्जिट लोड (Exit
    Load) लग सकता है। हालांकि, ELSS के मामले में, आप 3 वर्ष की लॉक-इन अवधि से पहले
    पैसा नहीं निकाल सकते।


    विस्तृत जानकारी के लिए ''ELSS टैक्स-सेवर फंड — शुल्क अनुसूची'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
