- id: c88b4e7c-53e0-56fc-9c67-8f2dffcb93ed
  title: डीमैट और ट्रेडिंग खाता — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: "तरंग इन्वेस्ट के ग्राहकों को डीमैट और ट्रेडिंग खाता से जुड़े कुछ आम स्कैम्स\
    \ के प्रति सतर्क रहना चाहिए। अक्सर जालसाज 'टिप्स' देने वाले ग्रुप्स के माध्यम\
    \ से आपसे संपर्क करते हैं और गारंटीकृत रिटर्न का वादा करते हैं। याद रखें, तरंग\
    \ इन्वेस्ट कभी भी आपसे आपका पासवर्ड, OTP या पिन नहीं मांगेगा। \n\nएक आम स्कैम\
    \ में धोखाधड़ी करने वाले लोग आपसे आपके डीमैट खाते का एक्सेस मांगते हैं या आपको\
    \ किसी अनधिकृत लिंक पर क्लिक करने के लिए प्रेरित करते हैं ताकि वे आपके फंड्स को\
    \ स्थानांतरित कर सकें। हम सुरक्षा के लिए 'जीरो-ट्रस्ट' दृष्टिकोण अपनाते हैं, इसलिए\
    \ किसी भी अनजान व्यक्ति द्वारा भेजे गए स्क्रीन-शेयरिंग ऐप के अनुरोध को स्वीकार\
    \ न करें।\n\nयदि आपको अपनी गतिविधि में कुछ भी संदिग्ध लगता है, तो तुरंत हमें सूचित\
    \ करें। हम धोखाधड़ी के मामलों में तुरंत विनियामक अधिकारियों को सूचित करते हैं।\
    \ सुरक्षा के लिए हमारे बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication) का\
    \ हमेशा उपयोग करें।"
  domain: brokerage_investing
