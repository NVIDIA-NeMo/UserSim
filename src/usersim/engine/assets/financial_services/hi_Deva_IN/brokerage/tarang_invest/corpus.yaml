- id: d18b76a1-a8b2-519e-adb9-d70131d9add7
  title: डीमैट और ट्रेडिंग खाता — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'डीमैट और ट्रेडिंग खाता के लिए शुल्क एक सरल और सपाट (flat) संरचना का पालन
    करते हैं, जो सभी ग्राहकों पर समान रूप से लागू होते हैं:


    - वार्षिक रखरखाव शुल्क: ₹300 (प्रति वर्ष, सभी खातों के लिए समान)

    - इक्विटी डिलीवरी ब्रोकरेज: ₹0 (कोई शुल्क नहीं)

    - इंट्राडे ब्रोकरेज: ₹20 प्रति ऑर्डर (ट्रेड के निष्पादन पर लागू)

    - DP शुल्क: ₹13.5 प्रति बिक्री (केवल शेयर बेचने पर लागू)


    इन दरों में कोई श्रेणीबद्ध (tier-based) अंतर नहीं है। विनियामक कर (जैसे GST) इन
    शुल्कों के अतिरिक्त लागू होंगे।'
