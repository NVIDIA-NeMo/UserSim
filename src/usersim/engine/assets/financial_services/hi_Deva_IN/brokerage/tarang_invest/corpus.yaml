- id: 6b412dae-df81-55fa-bb18-08ae4b9f5062
  title: ELSS टैक्स-सेवर फंड — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'तरंग इन्वेस्ट में आपकी सुरक्षा हमारी प्राथमिकता है। ELSS टैक्स-सेवर फंड के
    निवेशकों को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ जालसाज ''टैक्स रिफंड''
    या ''गारंटीड रिटर्न'' का लालच देकर आपके खाते का विवरण मांगते हैं। कृपया ध्यान
    दें कि हम आपसे कभी भी आपका पासवर्ड, ओटीपी (OTP) या पिन साझा करने के लिए नहीं कहेंगे।


    धोखाधड़ी के सामान्य पैटर्न में फर्जी ईमेल या मैसेज शामिल हैं जो दावा करते हैं
    कि आपकी धारा 80C की कटौती में समस्या है और उसे ठीक करने के लिए तत्काल भुगतान या
    विवरण की आवश्यकता है। यदि आपको कोई भी संदिग्ध गतिविधि दिखती है, तो तुरंत हमें
    सूचित करें। हम धोखाधड़ी के मामलों में तुरंत विनियामक अधिकारियों को सूचित करते
    हैं। किसी भी ट्रांजेक्शन के लिए हमारा बहु-स्तरीय प्रमाणीकरण अनिवार्य है, इसलिए
    यदि आपको बिना किसी अनुरोध के ओटीपी प्राप्त होता है, तो उसे साझा न करें। किसी भी
    विसंगति की रिपोर्ट करने में देरी न करें ताकि हम आपकी निवेश राशि को सुरक्षित कर
    सकें।'
