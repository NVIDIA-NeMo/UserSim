- id: 1433fbf1-6f91-547f-b679-d0cab4e87040
  title: डीमैट और ट्रेडिंग खाता — गोपनीयता और डेटा प्रबंधन
  body: 'तरंग इन्वेस्ट आपके ''डीमैट और ट्रेडिंग खाता'' से जुड़ी व्यक्तिगत और वित्तीय
    जानकारी की गोपनीयता के लिए प्रतिबद्ध है। हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों
    का सख्ती तरह से पालन करते हैं।


    डेटा प्रबंधन के मुख्य बिंदु:

    1. डेटा संग्रह: हम केवल वही जानकारी एकत्र करते हैं जो केवाईसी और विनियामक आवश्यकताओं
    के लिए आवश्यक है।

    2. सुरक्षा: हम सुरक्षा के लिए ''जीरो-ट्रस्ट'' दृष्टिकोण और बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) का उपयोग करते हैं ताकि अनधिकृत पहुंच को रोका जा
    सके।

    3. डेटा साझाकरण: आपका डेटा केवल विनियामक अधिकारियों या कानूनी आदेशों के तहत साझा
    किया जाता है।

    4. शुल्क पारदर्शिता: हम स्पष्ट रूप से सूचित करते हैं कि वार्षिक रखरखाव शुल्क ₹300
    है और प्रत्येक बिक्री पर ₹13.5 का DP शुल्क लिया जाता है।


    हम यह सुनिश्चित करते हैं कि सभी निवेशक सुरक्षा योजनाओं और विनियामक खुलासों के
    बारे में पूरी तरह जागरूक हों। विस्तृत जोखिम जानकारी के लिए ''डीमैट और ट्रेडिंग
    खाता — जोखिम प्रकटीकरण'' देखें।'
