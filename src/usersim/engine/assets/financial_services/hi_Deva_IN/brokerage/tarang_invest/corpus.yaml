- id: da839551-db8b-5dc6-a30d-a929af48243d
  title: म्यूचुअल फंड SIP — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके म्यूचुअल फंड SIP निवेश की सुरक्षा हमारी सर्वोच्च प्राथमिकता है। तरंग
    इन्वेस्ट में हम ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं, इसलिए किसी भी ट्रांजेक्शन
    या खाते में बदलाव से पहले बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication)
    अनिवार्य है।


    सुरक्षित रहने के लिए इन प्रथाओं का पालन करें:

    1. अपना पासवर्ड या ओटीपी कभी किसी के साथ साझा न करें; तरंग इन्वेस्ट के कर्मचारी
    आपसे कभी भी आपकी गोपनीय लॉगिन जानकारी नहीं मांगेंगे।

    2. नियमित रूप से अपने निवेश पोर्टफोलियो की समीक्षा करें और किसी भी अनधिकृत ट्रांजेक्शन
    की तुरंत रिपोर्ट करें।

    3. केवल हमारे आधिकारिक संचार माध्यमों पर भरोसा करें।


    यदि आपको कोई संदिग्ध गतिविधि दिखती है, तो कृपया हमें तुरंत सूचित करें। हम धोखाधड़ी
    के मामलों में तुरंत विनियामक अधिकारियों को सूचित करते हैं और एक पारदर्शी जांच
    प्रक्रिया का पालन करते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
