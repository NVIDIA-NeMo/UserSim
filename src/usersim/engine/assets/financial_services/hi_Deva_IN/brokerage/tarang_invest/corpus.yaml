- id: 1e63070b-f2a6-5107-af8e-bc5ec90abd12
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी मार्जिन ट्रेडिंग कार्रवाई अस्वीकृत या अवरुद्ध हो जाती है, तो इसके
    निम्नलिखित कारण हो सकते हैं:


    लक्षण: ट्रेड निष्पादित करते समय ''अपर्याप्त मार्जिन'' या ''अस्वीकृत'' त्रुटि संदेश
    मिलना।


    जांच के चरण:

    1. अपने फंड की जांच करें: सुनिश्चित करें कि आपके पास आवश्यक 25% न्यूनतम मार्जिन
    उपलब्ध है।

    2. शेयर की पात्रता: जांचें कि क्या वह विशेष शेयर MTF के लिए स्वीकृत है; सभी शेयर
    मार्जिन ट्रेडिंग के लिए उपलब्ध नहीं होते हैं।

    3. गिरवी शुल्क राशि: पुष्टि करें कि आपके खाते में प्रति स्क्रिप ₹20 के गिरवी शुल्क
    का भुगतान करने के लिए पर्याप्त शेष राशि है।


    समाधान:

    - यदि मार्जिन कम है, तो अतिरिक्त फंड जमा करें।

    - यदि शेयर स्वीकृत नहीं है, तो किसी अन्य पात्र शेयर का चयन करें।


    यदि सब कुछ सही होने के बावजूद कार्रवाई अवरुद्ध रहती है, तो हम मामले को अपने वरिष्ठ
    अनुपालन अधिकारियों को भेजेंगे। समाधान प्रक्रिया के दौरान हम आपको अपडेट रखेंगे।'
