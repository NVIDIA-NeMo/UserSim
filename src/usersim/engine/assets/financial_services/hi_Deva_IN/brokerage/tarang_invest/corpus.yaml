- id: dfdabe1b-aaf9-5f40-8862-6c306cd3623b
  title: ELSS टैक्स-सेवर फंड — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'ELSS टैक्स-सेवर फंड में निवेश करने वाले ग्राहकों को अक्सर ऐसे स्कैमर्स निशाना
    बनाते हैं जो धारा 80C के तहत ₹150000 की टैक्स कटौती का लालच देकर आपसे आपकी गोपनीय
    जानकारी मांगते हैं।


    सावधान रहें यदि कोई व्यक्ति आपसे दावा करता है कि वे लॉक-इन अवधि (Lock-in Period)
    को कम कर सकते हैं या 3 वर्ष की अनिवार्य अवधि से पहले पैसा निकलवा सकते हैं। तरंग
    इन्वेस्ट या कोई भी विनियामक संस्था कभी भी लॉक-इन अवधि को बदलने का वादा नहीं करती
    है। इसके अलावा, हम आपसे कभी भी आपका पासवर्ड, OTP या पिन नहीं मांगेंगे।


    यदि आपको कोई ऐसा संदेश मिलता है जो आपसे तुरंत निवेश करने के लिए कहता है ताकि आप
    टैक्स छूट का लाभ उठा सकें और बदले में आपके खाते का विवरण मांगता है, तो यह एक धोखाधड़ी
    हो सकती है। यदि आपको कुछ संदिग्ध लगता है, तो तुरंत हमें सूचित करें। हम धोखाधड़ी
    के मामलों में तुरंत विनियामक अधिकारियों को सूचित करते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
