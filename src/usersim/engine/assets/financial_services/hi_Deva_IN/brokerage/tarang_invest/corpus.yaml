- id: 9fbc7965-b243-5b77-8978-1e4707054459
  title: ELSS टैक्स-सेवर फंड — शुल्क अनुसूची
  body: 'ELSS टैक्स-सेवर फंड के लिए लागू शुल्क निम्नलिखित हैं:


    - निवेश शुल्क: ₹0 (कोई प्रवेश शुल्क नहीं)।

    - एग्जिट लोड: लागू नहीं (क्योंकि 3 वर्ष की लॉक-इन अवधि के कारण समय से पहले निकासी
    संभव नहीं है)।

    - प्रबंधन शुल्क: फंड हाउस द्वारा निर्धारित व्यय अनुपात (Expense Ratio) के अनुसार,
    जो सीधे NAV से काटा जाता है।


    हमारा शुल्क ढांचा बुनियादी बुनियादी ढांचे के रखरखाव और विनियामक लागतों को कवर
    करने के लिए डिज़ाइन किया गया है।'
