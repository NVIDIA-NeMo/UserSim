  title: मार्जिन ट्रेडिंग सुविधा (MTF) — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'तरंग इन्वेस्ट में आपकी सुरक्षा हमारी प्राथमिकता है। मार्जिन ट्रेडिंग सुविधा
    (MTF) का उपयोग करते समय, कृपया ध्यान रखें कि कोई भी अधिकृत कर्मचारी आपसे आपके
    बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication) कोड, पासवर्ड या ओटीपी साझा
    करने के लिए नहीं कहेगा।


    सावधान रहें: जालसाज अक्सर ''गारंटीड रिटर्न'' या ''विशेष ट्रेडिंग टिप्स'' का वादा
    करके आपके खाते तक पहुंच प्राप्त करने की कोशिश करते हैं। हम स्पष्ट करते हैं कि
    हम रिटर्न की गारंटी नहीं देते हैं। यदि आपको अपने मार्जिन खाते में कोई अनपेक्षित
    लेनदेन या अनधिकृत गतिविधि दिखाई देती है, तो तुरंत हमें सूचित करें। धोखाधड़ी के
    मामलों में, हम विनियामक अधिकारियों को तुरंत सूचित करते हैं और एक पारदर्शी जांच
    प्रक्रिया का पालन करते हैं।


    सुरक्षा के लिए ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाएं और किसी भी संदिग्ध लिंक पर क्लिक
    न करें। किसी भी बदलाव से पहले प्रमाणीकरण अनिवार्य है। अधिक जानकारी के लिए आप डीमैट
