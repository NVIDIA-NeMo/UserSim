- id: 3d819e17-e520-50cf-8f0b-f59be962e036
  title: ELSS टैक्स-सेवर फंड — आवश्यक दस्तावेज़
  body: 'ELSS टैक्स-सेवर फंड में निवेश के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पैन कार्ड (PAN Card) -> अनिवार्य (टैक्स कटौती और केवाईसी के लिए)

    - आधार कार्ड (Aadhaar) -> अनिवार्य (पहचान और पते के सत्यापन के लिए)

    - बैंक खाता विवरण (Cancelled Cheque/Statement) -> अनिवार्य (रिडेम्पशन राशि के
    हस्तांतरण के लिए)

    - केवाईसी अनुपालन (KYC Compliance) -> अनिवार्य (निवेश सक्रिय करने के लिए)'
