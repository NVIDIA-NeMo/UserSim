- id: d7093a62-3229-563a-bc28-cc79847eb66a
  title: म्यूचुअल फंड SIP — SIP रोकने की अधिकतम अवधि (माह) की व्याख्या
  body: 'प्रश्न: क्या मैं अपनी SIP भुगतान को कुछ समय के लिए रोक सकता हूँ? यदि हाँ,
    तो अधिकतम कितने समय के लिए?


    उत्तर: हाँ, तरंग इन्वेस्ट आपको अपनी SIP को अस्थायी रूप से रोकने की सुविधा देता
    है। आप अपनी SIP को अधिकतम 6 महीने तक रोक सकते हैं। इस अवधि के बाद, आपकी SIP स्वचालित
    रूप से फिर से शुरू हो जाएगी या आपको इसे मैन्युअल रूप से सक्रिय करना होगा।


    अधिक विवरण के लिए कृपया ''म्यूचुअल फंड SIP — शुरुआत कैसे करें'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
