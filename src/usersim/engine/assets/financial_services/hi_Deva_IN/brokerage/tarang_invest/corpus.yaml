- id: 2aad8ef2-3912-5415-9b49-ed09d1f088a4
  title: डीमैट और ट्रेडिंग खाता — बदलाव या अद्यतन करना
  body: 'अपने ''डीमैट और ट्रेडिंग खाता'' में व्यक्तिगत विवरण या बैंक जानकारी को अद्यतन
    करने के लिए इन चरणों का पालन करें:


    1. हमें वह विशिष्ट जानकारी बताएं जिसे आप बदलना चाहते हैं (जैसे मोबाइल नंबर, ईमेल
    या बैंक खाता विवरण)।

    2. हम आपसे परिवर्तन के समर्थन में आवश्यक दस्तावेज़ (जैसे नया कैंसिल चेक या आईडी
    प्रूफ) प्रदान करने का अनुरोध करेंगे।

    3. दस्तावेज़ प्राप्त होने के बाद, हम सुरक्षा के लिए बहु-स्तरीय प्रमाणीकरण (Multi-factor
    Authentication) प्रक्रिया शुरू करेंगे।

    4. आपको एक सत्यापन कोड प्राप्त होगा जिसे आपको हमारे साथ साझा करना होगा।

    5. सत्यापन सफल होने पर, हम आपके विवरण अपडेट कर देंगे और आपको 24-48 घंटों के भीतर
    एक पुष्टिकरण ईमेल भेजेंगे।


    यह प्रक्रिया सुनिश्चित करती है कि आपके खाते की गोपनीयता और सुरक्षा बनी रहे।'
