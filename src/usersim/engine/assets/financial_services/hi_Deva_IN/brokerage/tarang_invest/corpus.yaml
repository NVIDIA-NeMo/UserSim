- id: 8c840db8-d7bb-565c-93e0-5618d5bf14ce
  title: म्यूचुअल फंड SIP — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'म्यूचुअल फंड SIP के लिए शुल्क और दरें सभी निवेशकों के लिए समान और पारदर्शी
    हैं। इसमें कोई जटिल श्रेणी (Tier) नहीं है।


    लागू दरें:

    - एग्जिट लोड: 1% की एक समान दर लागू होती है, यदि निवेश की गई राशि को 365 दिनों
    की अवधि से पहले निकाला जाता है।

    - न्यूनतम निवेश: सभी निवेशकों के लिए न्यूनतम SIP राशि ₹500 निर्धारित है।


    यह दरें फंड हाउस की नीतियों और विनियामक लागतों के आधार पर तय की गई हैं। किसी भी
    बदलाव की स्थिति में, हम निर्धारित नोटिस अवधि के भीतर आपको सूचित करेंगे।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
