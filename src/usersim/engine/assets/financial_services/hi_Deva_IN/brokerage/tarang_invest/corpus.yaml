- id: 209d0744-e2d4-5933-80e1-5f4336f5f03d
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — कब स्विच या अपग्रेड करें
  body: 'यदि आप वर्तमान में केवल नकद (Cash) ट्रेडिंग कर रहे हैं, तो आपको मार्जिन ट्रेडिंग
    सुविधा (MTF) पर स्विच करना चाहिए जब आप अपनी ट्रेडिंग क्षमता बढ़ाना चाहते हों और
    आपके पास 25% न्यूनतम मार्जिन उपलब्ध हो। MTF आपको उधार पूंजी के माध्यम से अधिक
    शेयरों में निवेश करने की अनुमति देता है, जिसके लिए 14.99% वार्षिक ब्याज देना होता
    है।


    वहीं, यदि आप जोखिम कम करना चाहते हैं और ब्याज लागत (Interest cost) से बचना चाहते
    हैं, तो साधारण डीमैट ट्रेडिंग आपके लिए बेहतर है। MTF उन अनुभवी ट्रेडर्स के लिए
    है जो लीवरेज का उपयोग करके रिटर्न बढ़ाना चाहते हैं।'
  domain: brokerage_investing
  product_category: margin_trading_facility
