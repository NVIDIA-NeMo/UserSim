- id: 1d3aa878-8372-59e3-9a72-af9d29dccb3a
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — सेटअप और सक्रियण
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) को सक्रिय करने के लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपने खाते में मार्जिन ट्रेडिंग सुविधा (MTF) सक्रिय करना
    चाहते हैं।

    2. हम आपकी पात्रता की जांच करेंगे और आपको आवश्यक मार्जिन आवश्यकताओं के बारे में
    बताएंगे, जिसमें 25% न्यूनतम मार्जिन की आवश्यकता शामिल है।

    3. आप हमें डिजिटल रूप से आवश्यक सहमति दस्तावेज़ प्रदान करेंगे और बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) के माध्यम से अपनी पहचान सत्यापित करेंगे।

    4. हम आपके खाते में सुविधा को सक्रिय करेंगे और आपको एक पुष्टिकरण संदेश भेजेंगे।


    एक बार सक्रिय होने के बाद, आप पात्र शेयरों को चुन सकते हैं और प्रति स्क्रिप ₹20
    का प्लेज शुल्क भुगतान करके अपनी पोजीशन ले सकते हैं। यह प्रक्रिया आपको कम पूंजी
    के साथ अधिक ट्रेडिंग क्षमता प्रदान करती है।'
