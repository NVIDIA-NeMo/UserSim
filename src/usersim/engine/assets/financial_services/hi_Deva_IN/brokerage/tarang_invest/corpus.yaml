- id: 7e19bab5-5bd2-54c0-8ced-058c29d2310b
  title: म्यूचुअल फंड SIP — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपनी म्यूचुअल फंड SIP को रद्द करने, बंद करने या राशि कम (डाउनग्रेड) करने
    के लिए इन चरणों का पालन करें:


    1. हमें वह विशिष्ट म्यूचुअल फंड SIP योजना बताएं जिसे आप बदलना या बंद करना चाहते
    हैं।

    2. यदि आप राशि कम करना चाहते हैं, तो नई राशि बताएं (सुनिश्चित करें कि यह ₹500
    की न्यूनतम SIP राशि से कम न हो)। यदि आप पूरी तरह बंद करना चाहते हैं, तो बंद करने
    का अनुरोध करें।

    3. हम आपसे आपकी पहचान की पुष्टि करने के लिए बहु-स्तरीय प्रमाणीकरण (Multi-factor
    Authentication) पूरा करने के लिए कहेंगे।

    4. प्रमाणीकरण सफल होने के बाद, हम आपके अनुरोध को प्रोसेस करेंगे और आपको पुष्टिकरण
    संदेश भेजेंगे।


    ध्यान दें: यदि आप अपनी यूनिट्स को अभी भुनाते (redeem) हैं और निवेश को 365 दिनों
    से कम समय हुआ है, तो 1% एग्जिट लोड लागू होगा।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: how_to_guide
  source_authority: official
