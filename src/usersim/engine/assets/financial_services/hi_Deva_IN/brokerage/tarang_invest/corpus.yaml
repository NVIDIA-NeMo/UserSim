  title: redeem_mutual_fund टूल संदर्भ
  body: 'टूल: redeem_mutual_fund

    विवरण: यह टूल म्यूचुअल फंड निवेश से यूनिट्स या राशि निकालने की प्रक्रिया शुरू
    करता है।

    तर्क (Arguments): account_id, fund_id, amount_or_units

    प्रभाव: यह एक state_changing क्रिया है जो पोर्टफोलियो से संपत्ति कम करती है।

    एजेंट इसे सीधे टूल कॉल द्वारा निष्पादित करता है।'
