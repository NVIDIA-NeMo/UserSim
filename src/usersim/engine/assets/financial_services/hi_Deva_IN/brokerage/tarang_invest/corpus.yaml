- id: ace6a8bd-29a1-542e-8056-e9f9d884193c
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — स्थिति या इतिहास देखना
  body: 'अपनी मार्जिन ट्रेडिंग स्थिति और पिछले लेनदेन के इतिहास की समीक्षा करने के
    लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपनी वर्तमान MTF स्थिति और इतिहास देखना चाहते हैं।

    2. हम आपके खाते से जुड़ी सभी सक्रिय मार्जिन पोजीशन की एक सूची प्रदान करेंगे, जिसमें
    उधार ली गई राशि और वर्तमान मार्जिन मूल्य शामिल होगा।

    3. यदि आप इतिहास देखना चाहते हैं, तो हमें वह विशिष्ट समय अवधि (जैसे पिछला महीना
    या तिमाही) बताएं जिसके लिए आप विवरण चाहते हैं।

    4. हम आपको एक विस्तृत विवरण भेजेंगे जिसमें आपके द्वारा लिए गए सभी मार्जिन ट्रेड,
    भुगतान किया गया 14.99% वार्षिक ब्याज और लगाए गए ₹20 के प्रति स्क्रिप गिरवी शुल्क
    का विवरण होगा।


    आप यह पुष्टि कर सकते हैं कि विवरण सही है या यदि आपको किसी विशिष्ट लेनदेन पर स्पष्टीकरण
    की आवश्यकता है, तो हमसे पूछ सकते हैं।'
