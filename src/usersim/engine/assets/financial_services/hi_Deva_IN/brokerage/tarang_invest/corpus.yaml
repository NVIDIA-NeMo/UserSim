- id: 7c0ae85e-78fc-54e6-b55a-dc4af9c93f72
  title: सामान्य अक्सर पूछे जाने वाले प्रश्न
  body: 'प्रश्न: मैं तरंग इन्वेस्ट से सहायता कैसे प्राप्त कर सकता हूँ?

    उत्तर: आप ईमेल, चैट और फोन के माध्यम से हमसे संपर्क कर सकते हैं। हमारी सेवाएँ
    भारतीय मानक समय (IST) के अनुसार कार्यदिवस के दौरान उपलब्ध हैं।


    प्रश्न: यदि मेरी समस्या का समाधान नहीं होता है तो क्या होगा?

    उत्तर: यदि प्रथम स्तर के समाधान विफल होते हैं, तो आपका मामला वरिष्ठ अनुपालन अधिकारियों
    को भेजा जाएगा।


    प्रश्न: क्या तरंग इन्वेस्ट व्यक्तिगत टैक्स सलाह देता है?

    उत्तर: नहीं, हम केवल शैक्षिक जानकारी प्रदान करते हैं। कानूनी या टैक्स सलाह के
    लिए कृपया विशेषज्ञ से मिलें।'
  domain: brokerage_investing
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: b59ab425-e080-58ac-b578-db721a10f676
  title: ब्रोकरेज और निवेश के लिए नियामक नोट्स
  body: 'तरंग इन्वेस्ट SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन करता
    है। एजेंटों के लिए यह अनिवार्य है कि वे ग्राहकों को सूचित करें कि सभी निवेश बाजार
    जोखिमों के अधीन हैं। म्यूचुअल फंड से संबंधित किसी भी संचार में ''बाजार जोखिमों
    के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें'' चेतावनी शामिल करना अनिवार्य
    है।


    हम डेटा गोपनीयता को प्राथमिकता देते हैं और यह सुनिश्चित करते हैं कि निवेशक सुरक्षा
    योजनाओं और विनियामक खुलासों से पूरी तरह अवगत हों। एजेंटों को यह स्पष्ट करना चाहिए
    कि हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं और रिटर्न की कोई गारंटी नहीं
    देते हैं। धोखाधड़ी के किसी भी संदिग्ध मामले में, विनियामक अधिकारियों को तुरंत
    सूचित करना हमारी कानूनी प्रतिबद्धता है।'
  domain: brokerage_investing
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 32070d09-556e-5198-8151-f99d85dd9131
  title: get_positions का उपयोग कब करें
  body: 'जब किसी निवेशक को अपने वर्तमान पोर्टफोलियो, होल्डिंग्स या सक्रिय निवेशों
    की वर्तमान स्थिति जानने की आवश्यकता हो, तब get_positions टूल का उपयोग किया जाता
    है।


    प्रक्रिया:

    1. सबसे पहले verify_identity टूल के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक के पास कई खाते हैं, तो get_accounts का उपयोग करके सही account_id
    प्राप्त करें।

    3. ग्राहक के पोर्टफोलियो का विवरण प्राप्त करने के लिए get_positions टूल को कॉल
    करें।

    4. प्राप्त डेटा को सरल भाषा में ग्राहक को प्रस्तुत करें।


    यह प्रक्रिया यह सुनिश्चित करती है कि संवेदनशील वित्तीय डेटा केवल प्रमाणित उपयोगकर्ता
    को ही प्रदान किया जाए।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_positions
  institution_id: tarang_invest
- id: f12237a8-746b-5fd2-a489-f5a5df740630
  title: get_positions टूल संदर्भ
  body: 'टूल: get_positions

    विवरण: यह टूल ग्राहक के खाते में वर्तमान निवेश स्थितियों (positions) और होल्डिंग्स
    की सूची प्राप्त करता है।

    तर्क (Arguments): account_id (अनिवार्य)

    प्रभाव: यह एक read_only क्रिया है जो केवल डेटा प्रदर्शित करती है।

    एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है; ग्राहक को किसी बाहरी पोर्टल
    पर जाने के लिए नहीं कहा जाता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
