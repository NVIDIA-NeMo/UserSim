- id: 494a6f72-0c3d-5304-858c-64ce8381518a
  title: transfer_funds का उपयोग कब करें
  body: 'जब ग्राहक अपने एक खाते से दूसरे खाते में धन स्थानांतरित करना चाहता है या
    ट्रेडिंग फंड को व्यवस्थित करना चाहता है, तो इस प्रक्रिया का पालन करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके प्रेषक और प्राप्तकर्ता account_id की पुष्टि
    करें।

    3. स्थानांतरित की जाने वाली सटीक राशि (₹) और फंड के स्रोत की पुष्टि करें।

    4. स्थानांतरण को अंतिम रूप देने के लिए transfer_funds टूल का उपयोग करें।


    हम सुरक्षा के लिए ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं, इसलिए किसी भी राशि के
    हस्तांतरण से पहले बहु-स्तरीय प्रमाणीकरण अनिवार्य है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: tarang_invest
- id: 9bb14673-e698-5351-b5f1-5581b72931a5
  title: transfer_funds टूल संदर्भ
  body: 'यह टूल एजेंट को खातों के बीच धन के हस्तांतरण को सुविधाजनक बनाने की अनुमति
    देता है। एजेंट इस कार्रवाई को सीधे transfer_funds टूल कॉल करके निष्पादित करता
    है।


    **टूल हस्ताक्षर:**

    - **नाम:** transfer_funds

    - **तर्क (Arguments):** source_account_id (आवश्यक), destination_account_id (आवश्यक),
    amount (₹ में आवश्यक), currency (INR)।

    - **प्रभाव:** फंड को एक खाते से दूसरे में स्थानांतरित करता है और लेनदेन आईडी उत्पन्न
    करता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
