- id: e2768598-16ad-51d6-9ebf-c6fe98e1ca08
  title: initiate_dis का उपयोग कब करें
  body: 'जब किसी ग्राहक को डीमैट खाते से शेयर बेचने या स्थानांतरित करने के लिए डिलीवरी
    इंस्ट्रक्शन स्लिप (DIS) की आवश्यकता होती है, तब initiate_dis टूल का उपयोग किया
    जाता है।


    प्रक्रिया:

    1. verify_identity का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts का उपयोग करके संबंधित account_id प्राप्त करें।

    3. ग्राहक की विशिष्ट आवश्यकता (शेयर बेचना या ट्रांसफर) की पुष्टि करें।

    4. DIS प्रक्रिया शुरू करने के लिए initiate_dis टूल को कॉल करें।

    5. ग्राहक को अगले चरणों और संभावित DP शुल्क (DP Charges) के बारे में सूचित करें।


    यह प्रक्रिया सुरक्षा के लिए बहु-स्तरीय प्रमाणीकरण के बाद ही पूरी की जाती है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_dis
  institution_id: tarang_invest
- id: 4c6b6da2-9fef-55e5-8c02-fc0f65547634
  title: initiate_dis टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक की ओर से औपचारिक विवाद (dispute) प्रक्रिया शुरू करने
    की अनुमति देता है। एजेंट इस टूल को सीधे कॉल करके विवाद दर्ज करता है, जिससे ग्राहक
    को किसी बाहरी पोर्टल पर जाने की आवश्यकता नहीं होती।


    **सिग्नेचर:** `initiate_dis(account_id: string, transaction_id: string, dispute_reason:
    string, amount: number)`


    **प्रभाव:** यह सिस्टम में एक विवाद टिकट बनाता है और जांच प्रक्रिया शुरू करता है।
    तरंग इन्वेस्ट एक निर्धारित समय सीमा के भीतर पारदर्शी जांच सुनिश्चित करता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - initiate_dis
  institution_id: tarang_invest
- id: 9076b66c-1e0c-5dfc-b607-d676a2ea824f
  title: get_accounts का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने खातों की जानकारी चाहिए होती है या जब एजेंट को किसी
    विशिष्ट लेनदेन के लिए खाता आईडी (account_id) की पहचान करनी होती है, तब इस प्रक्रिया
    का पालन करें। यह विशेष रूप से तब उपयोगी है जब ग्राहक केवल अपने खाते के अंतिम चार
    अंक प्रदान करता है।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान को `verify_identity` टूल के माध्यम से सत्यापित करें।

    2. ग्राहक द्वारा प्रदान किए गए विवरणों (जैसे मोबाइल नंबर या अंतिम 4 अंक) का उपयोग
    करके `get_accounts` टूल को कॉल करें।

    3. प्राप्त परिणामों से सही `account_id` की पहचान करें।

    4. इस आईडी का उपयोग आगे की किसी भी कार्रवाई (जैसे फंड ट्रांसफर या स्टेटमेंट प्राप्त
    करना) के लिए करें।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tarang_invest
- id: a54152d3-a370-571f-9b93-0fe3ce461154
  title: get_accounts टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक से जुड़े सभी सक्रिय खातों की सूची प्राप्त करने की
    अनुमति देता है। एजेंट इस क्रिया को सीधे कॉल करके निष्पादित करता है।


    **सिग्नेचर:** `get_accounts(customer_id: string)`


    **प्रभाव:** यह ग्राहक से संबंधित सभी खातों के विवरण, जिसमें खाता प्रकार और उनकी
    वर्तमान स्थिति शामिल है, वापस करता है। इसका उपयोग मुख्य रूप से `account_id` को
    हल करने और खाते के अस्तित्व की पुष्टि करने के लिए किया जाता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: tarang_invest
- id: b25f368d-45cd-5057-9213-2c538cbf04b6
  title: open_account का उपयोग कब करें
  body: 'जब कोई नया ग्राहक तरंग इन्वेस्ट की सेवाओं का लाभ उठाना चाहता है या मौजूदा
    ग्राहक एक नया निवेश उत्पाद (जैसे डीमैट और ट्रेडिंग खाता या म्यूचुअल फंड SIP) शुरू
    करना चाहता है, तो इस प्रक्रिया का पालन करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पात्रता की जाँच करें और आवश्यक दस्तावेज़ों की पुष्टि करें।

    2. ग्राहक की पहचान सत्यापित करें और उनकी सहमति प्राप्त करें।

    3. आवश्यक विवरण (जैसे उत्पाद प्रकार और व्यक्तिगत जानकारी) एकत्र करें।

    4. `open_account` टूल को कॉल करके खाता खोलने की प्रक्रिया पूरी करें।


    खाता खोलने के बाद, ग्राहक को उत्पाद के विशिष्ट विवरणों के बारे में सूचित करें।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tarang_invest
- id: 89b07260-744e-5cb1-a98a-97036da87d6c
  title: open_account टूल संदर्भ
  body: 'यह टूल एजेंट को सिस्टम में एक नया निवेश खाता बनाने की अनुमति देता है। एजेंट
    इस टूल को सीधे कॉल करके खाता खोलता है।


    **सिग्नेचर:** `open_account(customer_id: string, product_id: string, details:
    object)`


    **प्रभाव:** यह निर्दिष्ट `product_id` के लिए एक नया खाता बनाता है और उसे ग्राहक
    की प्रोफाइल से जोड़ता है। सफल निष्पादन के बाद, खाता सक्रिय हो जाता है और उपयोग
    के लिए उपलब्ध होता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: tarang_invest
- id: 50891f7c-6df8-5e02-bd47-5d42815dcc5a
  title: close_account का उपयोग कब करें
  body: 'जब कोई ग्राहक अपना खाता स्थायी रूप से बंद करना चाहता है, तो इस सख्त प्रक्रिया
    का पालन किया जाना चाहिए। ध्यान दें कि यह एक अपरिवर्तनीय (irreversible) कार्रवाई
    है।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान को `verify_identity` के माध्यम से पूरी तरह सत्यापित करें।

    2. `get_positions` का उपयोग करके यह सुनिश्चित करें कि खाते में कोई बकाया राशि,
    ओपन पोजीशन या लंबित फंड नहीं हैं।

    3. ग्राहक को खाता बंद करने के परिणामों और भविष्य के टैक्स प्रभाव के बारे में सूचित
    करें।

    4. अंतिम पुष्टि के बाद, `close_account` टूल को कॉल करें।


    खाता बंद होने के बाद, ग्राहक को अंतिम क्लोजर स्टेटमेंट भेजने की व्यवस्था करें।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tarang_invest
- id: 4f9b4610-d5ed-5b6e-b0b6-2b76dcde9fe9
  title: close_account टूल संदर्भ
  body: 'यह टूल एजेंट को किसी ग्राहक के निर्दिष्ट खाते को स्थायी रूप से बंद करने की
    अनुमति देता है। एजेंट इस क्रिया को सीधे कॉल करके निष्पादित करता है।


    **सिग्नेचर:** `close_account(account_id: string)`


    **प्रभाव:** यह खाता स्थिति को ''बंद'' में बदल देता है और आगे के सभी लेनदेन को
    रोकता है। यह एक अपरिवर्तनीय प्रक्रिया है; एक बार बंद होने के बाद, खाते को पुनः
    सक्रिय नहीं किया जा सकता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: tarang_invest
- id: f613f4c9-14a5-5183-bdab-c864a6b1a038
  title: update_contact_info का उपयोग कब करें
  body: 'जब ग्राहक अपने पंजीकृत मोबाइल नंबर, ईमेल पते या पते में बदलाव करना चाहता
    है, तो इस प्रक्रिया का उपयोग करें। सुरक्षा कारणों से, संपर्क विवरण में कोई भी
    बदलाव बहु-स्तरीय प्रमाणीकरण के अधीन है।


    **प्रक्रिया के चरण:**

    1. ग्राहक की वर्तमान पहचान सत्यापित करें।

    2. अपडेट किए जाने वाले विवरणों (नया फोन नंबर, ईमेल, आदि) की सटीक जानकारी लें।

    3. सुरक्षा प्रोटोकॉल के अनुसार बहु-स्तरीय प्रमाणीकरण (MFA) पूरा करें।

    4. `update_contact_info` टूल को कॉल करके विवरण अपडेट करें।


    अपडेट सफल होने के बाद, ग्राहक को उनके नए पंजीकृत विवरणों पर एक पुष्टिकरण संदेश
    भेजें।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tarang_invest
- id: e888e6fa-8beb-502f-9a2b-af0f249efe55
  title: update_contact_info टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के प्रोफाइल में संपर्क विवरणों को संशोधित करने की
    अनुमति देता है। एजेंट इस क्रिया को सीधे कॉल करके करता है।


    **सिग्नेचर:** `update_contact_info(customer_id: string, updated_fields: object)`


    **प्रभाव:** यह डेटाबेस में ग्राहक के संपर्क विवरणों को अपडेट करता है। यह परिवर्तन
    तुरंत प्रभावी होता है और भविष्य के सभी संचारों के लिए उपयोग किया जाता है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: tarang_invest
- id: 16e98058-da51-5ad2-9307-54346f65089f
  title: get_statements का उपयोग कब करें
  body: 'जब किसी ग्राहक को उनके निवेश का विवरण, टैक्स रिपोर्ट, या लेनदेन का इतिहास
    चाहिए होता है, तो इस प्रक्रिया का पालन करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. `get_accounts` का उपयोग करके सही `account_id` प्राप्त करें।

    3. ग्राहक से वांछित समय सीमा (जैसे मासिक, त्रैमासिक या वार्षिक) और स्टेटमेंट का
    प्रकार पूछें।

    4. `get_statements` टूल को कॉल करें।


    स्टेटमेंट जेनरेट होने के बाद, एजेंट को ग्राहक को सूचित करना चाहिए कि दस्तावेज़
    उनके पंजीकृत ईमेल पर भेज दिया गया है या सिस्टम में उपलब्ध है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: tarang_invest
- id: 3768e1f3-fb4d-5b52-8f4d-1918b92981b0
  title: get_statements टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के लिए निवेश विवरण और खाता विवरण (statements) प्राप्त
    करने की अनुमति देता है। एजेंट इस कार्रवाई को सीधे get_statements टूल कॉल करके
    निष्पादित करता है।


    **टूल हस्ताक्षर:**

    - **नाम:** get_statements

    - **तर्क (Arguments):** account_id (आवश्यक), statement_type (जैसे: मासिक, वार्षिक),
    date_range (आरंभ और समाप्ति तिथि)।

    - **प्रभाव:** निर्दिष्ट समय अवधि के लिए खाता विवरण दस्तावेज़ प्राप्त करता है।'
