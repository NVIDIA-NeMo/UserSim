    करने के लिए उपयोग किया जाता है।


    हस्ताक्षर: manage_authorized_users(account_id: string, user_details: object, action:
    string)


    प्रभाव: यह टूल निर्दिष्ट खाते के लिए उपयोगकर्ता की पहुँच को जोड़ता है, हटाता है
    या संशोधित करता है। एजेंट इस संवेदनशील सुरक्षा क्रिया को सीधे टूल कॉल करके निष्पादित
    करता है।'
