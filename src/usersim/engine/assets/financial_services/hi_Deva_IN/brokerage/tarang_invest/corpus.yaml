- id: cdbdb298-066c-500e-849a-923841a2dabc
  title: ELSS टैक्स-सेवर फंड — पात्रता श्रेणियाँ
  body: 'ELSS टैक्स-सेवर फंड के लिए पात्रता मानदंड निम्नलिखित हैं:


    - भारतीय निवासी व्यक्ति: पात्र (न्यूनतम निवेश ₹500 आवश्यक)

    - हिंदू अविभाजित परिवार (HUF): पात्र (न्यूनतम निवेश ₹500 आवश्यक)

    - नाबालिग (अभिभावक के माध्यम से): पात्र (न्यूनतम निवेश ₹500 आवश्यक)

    - गैर-निवासी भारतीय (NRI): पात्रता के लिए विशिष्ट नियामक दस्तावेज़ आवश्यक


    सभी पात्र श्रेणियों के लिए धारा 80C के तहत ₹150000 तक की कटौती सीमा लागू होती
    है।'
