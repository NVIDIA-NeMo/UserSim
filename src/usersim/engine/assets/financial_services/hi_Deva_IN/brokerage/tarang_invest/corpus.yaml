- id: fa2d426b-84b2-540a-a844-612608d5e150
  title: manage_authorized_users का उपयोग कब करें
  body: 'जब किसी खाताधारक को अपने खाते तक पहुँचने के लिए अतिरिक्त उपयोगकर्ताओं को
    जोड़ने, हटाने या उनकी अनुमति बदलने की आवश्यकता होती है, तब इस प्रक्रिया का उपयोग
    करें। तरंग इन्वेस्ट सुरक्षा के लिए ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाता है, इसलिए
    यह प्रक्रिया अत्यंत संवेदनशील है।


    प्रक्रिया:

    1. verify_identity टूल का उपयोग करके प्राथमिक खाताधारक की पहचान का कड़ाई से सत्यापन
    करें।

    2. get_accounts के माध्यम से सही account_id का पता लगाएं।

    3. ग्राहक से नए अधिकृत उपयोगकर्ता का विवरण या हटाए जाने वाले उपयोगकर्ता की जानकारी
    प्राप्त करें।

    4. पहुंच स्तर (जैसे केवल देखना या ट्रेडिंग करना) निर्धारित करें।

    5. इन बदलावों को लागू करने के लिए manage_authorized_users टूल को कॉल करें।


    किसी भी बदलाव से पहले बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication) अनिवार्य
    है।'
  domain: brokerage_investing
