- id: 34070360-36e2-5e84-abf7-be648407a130
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — आवश्यक दस्तावेज़
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) सक्रिय करने के लिए निम्नलिखित दस्तावेज़ अनिवार्य
    हैं:


    - पैन कार्ड (PAN Card) -> अनिवार्य

    - आधार कार्ड (KYC सत्यापित) -> अनिवार्य

    - बैंक स्टेटमेंट/प्रूफ (पिछले 6 महीने) -> आय सत्यापन के लिए अनिवार्य

    - डिजिटल हस्ताक्षर (e-sign) -> अनुबंध स्वीकृति के लिए अनिवार्य


    इन दस्तावेजों के सत्यापन के बाद ही 25% न्यूनतम मार्जिन की शर्त पर सुविधा प्रदान
    की जाएगी। विस्तृत पात्रता के लिए डीमैट और ट्रेडिंग खाता — पात्रता शर्तें देखें।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: eligibility_matrix
  source_authority: official
