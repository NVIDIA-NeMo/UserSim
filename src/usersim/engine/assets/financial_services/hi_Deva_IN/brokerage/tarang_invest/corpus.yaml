- id: 0a6dcc77-0d21-5e2d-ba22-0e9f32441006
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — शुरुआत कैसे करें
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) उधारित पूंजी के माध्यम से आपकी ट्रेडिंग क्षमता
    बढ़ाने के लिए एक उन्नत लीवरेज उपकरण है। यह उन निवेशकों के लिए है जो कम पूंजी के
    साथ बड़े शेयरों में पोजीशन बनाना चाहते हैं।


    शुरुआत करने के लिए आवश्यक विवरण:

    - न्यूनतम मार्जिन: आपको कुल ट्रेड मूल्य का 25% स्वयं जमा करना होगा।

    - वार्षिक ब्याज दर: उधार ली गई राशि पर 14.99% की वार्षिक ब्याज दर लागू होगी।

    - गिरवी शुल्क: प्रत्येक स्क्रिप को गिरवी रखने पर ₹20 का शुल्क लिया जाएगा।


    सक्रियण प्रक्रिया:

    1. अपने सक्रिय ट्रेडिंग खाते से MTF के लिए अनुरोध करें।

    2. उपलब्ध कोलैटरल (शेयरों) का चयन करें जिन्हें आप गिरवी रखना चाहते हैं।

    3. अपनी ट्रेडिंग लिमिट की पुष्टि करें और ट्रेड निष्पादित करें।


    हम SEBI और NSE/BSE के दिशा-निर्देशों का सख्ती से पालन करते हैं ताकि आपकी निवेश
    प्रक्रिया पारदर्शी और सुरक्षित रहे।'
