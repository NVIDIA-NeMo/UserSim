- id: 239cbb88-fe82-5086-b910-b22d19d73f8d
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — लागत और शुल्क
  body: 'प्रश्न: मार्जिन ट्रेडिंग सुविधा (MTF) का उपयोग करने की कुल लागत क्या है?

    उत्तर: MTF के लिए मुख्य लागतें इस प्रकार हैं: उधार ली गई राशि पर 14.99% की वार्षिक
    ब्याज दर, प्रत्येक शेयर को गिरवी रखने के लिए ₹20 का प्रति स्क्रिप गिरवी शुल्क,
    और आपके द्वारा बनाए रखा जाने वाला 25% न्यूनतम मार्जिन।


    प्रश्न: क्या ब्याज की गणना दैनिक आधार पर की जाती है?

    उत्तर: हाँ, ब्याज की गणना आपके द्वारा उपयोग की गई उधार राशि और समय के आधार पर
    की जाती है। विस्तृत विवरण के लिए ''मार्जिन ट्रेडिंग सुविधा (MTF) — शुल्क अनुसूची''
    देखें।'
