- id: b49a7cad-6cdc-540c-9696-0691e36eb3bd
  title: म्यूचुअल फंड SIP — वर्तमान ऑफर
  body: 'विशेष ऑफर: अनुशासित निवेश को प्रोत्साहित करने के लिए, तरंग इन्वेस्ट अपने
    मौजूदा ग्राहकों के लिए एक सीमित समय का ऑफर लाया है।


    ऑफर विवरण: यदि आप 1 नवंबर 2024 से 31 दिसंबर 2024 के बीच अपनी मासिक SIP राशि को
    ₹500 से बढ़ाकर ₹2000 या उससे अधिक करते हैं, तो आप हमारे विशेष रिवॉर्ड पॉइंट्स के
    पात्र होंगे।


    नियम और शर्तें: यह ऑफर केवल सक्रिय म्यूचुअल फंड SIP खातों के लिए है। रिवॉर्ड पॉइंट्स
    का विवरण आपके पंजीकृत ईमेल पर भेजा जाएगा।'
