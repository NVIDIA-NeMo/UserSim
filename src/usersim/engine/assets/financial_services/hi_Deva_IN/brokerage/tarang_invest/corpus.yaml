- id: ab1eb5d9-717a-582a-95d2-69815d438226
  title: डीमैट और ट्रेडिंग खाता — लागत और शुल्क
  body: 'प्रश्न: इस खाते को बनाए रखने की कुल लागत क्या है?

    उत्तर: इस खाते के लिए ₹300 का वार्षिक रखरखाव शुल्क (AMC) लिया जाता है।


    प्रश्न: क्या शेयर खरीदने और बेचने पर कोई शुल्क लगता है?

    उत्तर: इक्विटी डिलीवरी के लिए ब्रोकरेज ₹0 है। हालांकि, शेयर बेचने पर ₹13.5 का
    DP शुल्क लगता है और इंट्राडे ट्रेड के लिए प्रति ऑर्डर ₹20 का ब्रोकरेज शुल्क लिया
    जाता है। अधिक जानकारी के लिए ''डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची'' देखें।'
