- id: 7339fdf7-6d2a-5fc0-a662-afe71eeed9a2
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) के साथ लीवरेज का उपयोग करने वाले निवेशकों को
    अक्सर ''गारंटीकृत रिटर्न'' या ''टिप-आधारित'' स्कैम का सामना करना पड़ता है। जालसाज
    आपको लुभाने के लिए कह सकते हैं कि वे आपको ऐसे शेयर बताएंगे जिनमें 100% लाभ निश्चित
    है, और इसके लिए वे आपको मार्जिन का अधिकतम उपयोग करने की सलाह देते हैं।


    कृपया ध्यान दें कि तरंग इन्वेस्ट के प्रतिनिधि आपसे कभी भी आपका पासवर्ड, ओटीपी
    (OTP) या किसी तीसरे पक्ष के निजी वॉलेट में फंड ट्रांसफर करने के लिए नहीं कहेंगे।
    हम कभी भी ऐसी किसी ''गुप्त टिप'' का वादा नहीं करते जो बाजार जोखिमों से मुक्त हो।


    यदि आपको कोई ऐसा संदेश या कॉल प्राप्त होता है जो हमारे नाम पर मार्जिन ट्रेडिंग
    के माध्यम से त्वरित धन कमाने का दावा करता है, तो यह एक धोखाधड़ी हो सकती है। यदि
    आपको कुछ संदिग्ध लगता है, तो तुरंत हमें सूचित करें। किसी भी अनधिकृत गतिविधि की
    रिपोर्ट करना आपके फंड की सुरक्षा के लिए महत्वपूर्ण है। हम डेटा गोपनीयता को प्राथमिकता
    देते हैं और सुरक्षा के लिए ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं।'
