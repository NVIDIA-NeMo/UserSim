- id: fb6f4e22-2dc5-5ebd-bc6e-0f692c586845
  title: डीमैट और ट्रेडिंग खाता — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपने डीमैट और ट्रेडिंग खाता को बंद करने के लिए कृपया इन चरणों का पालन करें:


    1. अपनी सभी मौजूदा पोजीशन को स्क्वायर-ऑफ करें और सुनिश्चित करें कि आपके डीमैट
    खाते में कोई शेयर शेष न हों।

    2. अपने खाते में मौजूद सभी नकदी शेष (cash balance) को अपने लिंक किए गए बैंक खाते
    में स्थानांतरित करने का अनुरोध करें।

    3. हमसे खाता बंद करने का औपचारिक अनुरोध करें।

    4. हम आपके खाते के सभी बकाया शुल्कों, जैसे कि लंबित ₹300 वार्षिक रखरखाव शुल्क
    (यदि लागू हो), की जांच करेंगे और आपको अंतिम देय राशि बताएंगे।

    5. सभी शुल्कों के भुगतान के बाद, हम आपके खाते को बंद करने की प्रक्रिया शुरू करेंगे।


    प्रक्रिया पूरी होने पर, आपको एक पुष्टिकरण ईमेल प्राप्त होगा जिसमें यह स्पष्ट होगा
    कि आपका खाता सफलतापूर्वक बंद कर दिया गया है और अब कोई भविष्य का शुल्क लागू नहीं
    होगा।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: how_to_guide
