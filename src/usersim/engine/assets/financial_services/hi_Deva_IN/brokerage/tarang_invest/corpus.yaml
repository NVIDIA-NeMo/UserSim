- id: 0970a30a-8292-5a34-a836-4379a82ab240
  title: डीमैट और ट्रेडिंग खाता — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने स्टेटमेंट में कोई ऐसा शुल्क दिखता है जिसकी आप अपेक्षा नहीं
    कर रहे थे, तो कृपया निम्नलिखित चरणों की जांच करें:


    - क्या यह ₹300 का वार्षिक रखरखाव शुल्क है? यह शुल्क बुनियादी ढांचे के रखरखाव के
    लिए साल में एक बार लिया जाता है।

    - क्या आपने हाल ही में शेयर बेचे हैं? यदि हाँ, तो प्रति बिक्री ₹13.5 का DP शुल्क
    लागू होगा।

    - क्या आपने इंट्राडे ट्रेडिंग की है? प्रत्येक ऐसे ऑर्डर के लिए ₹20 का ब्रोकरेज
    लिया जाता है।


    यदि शुल्क ऊपर दिए गए विवरणों से मेल नहीं खाता है, तो हमें सूचित करें। हम एक पारदर्शी
    जांच प्रक्रिया शुरू करेंगे। यदि शुल्क त्रुटिवश लिया गया है, तो हम उसे आपके खाते
    में वापस जमा (reverse) कर देंगे। यदि मामला जटिल है, तो इसे वरिष्ठ अनुपालन अधिकारियों
    को भेजा जाएगा ताकि समाधान सुनिश्चित हो सके।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
