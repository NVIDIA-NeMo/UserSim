  institution_id: tarang_invest
- id: f07ad9c0-5613-559a-bbca-656501df4661
  title: डीमैट और ट्रेडिंग खाता — प्रति ऑर्डर इंट्राडे ब्रोकरेज की व्याख्या
  body: 'प्रश्न: इंट्राडे ट्रेडिंग के लिए मुझे कितना शुल्क देना होगा?

    उत्तर: तरंग इन्वेस्ट में, इंट्राडे ट्रेडिंग के लिए प्रति ऑर्डर ₹20 का ब्रोकरेज
    शुल्क लिया जाता है। यह शुल्क प्रत्येक निष्पादित ट्रेड पर लागू होता है।


    प्रश्न: क्या यह शुल्क डिलीवरी ट्रेडों पर भी लागू है?

    उत्तर: नहीं, इक्विटी डिलीवरी के लिए ब्रोकरेज ₹0 है। इंट्राडे शुल्क केवल उन्हीं
    ट्रेडों के लिए है जो एक ही ट्रेडिंग सत्र के भीतर खरीदे और बेचे जाते हैं। विस्तृत
    जानकारी के लिए ''डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची'' देखें।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: faq
