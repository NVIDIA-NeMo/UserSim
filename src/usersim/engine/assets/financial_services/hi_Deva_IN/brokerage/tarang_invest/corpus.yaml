- id: b48a859d-6293-55bb-8d96-bbb9fff25aec
  title: ELSS टैक्स-सेवर फंड — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके ELSS टैक्स-सेवर फंड के रिकॉर्ड या निवेश विवरण में
    कोई विसंगति है, तो कृपया निम्न चरणों का पालन करें:


    लक्षण: स्टेटमेंट में निवेश की गई राशि या यूनिट्स का आपके रिकॉर्ड से मेल न खाना।


    जांच प्रक्रिया:

    1. अपनी निवेश तिथि की जांच करें: सुनिश्चित करें कि आप लॉक-इन अवधि की गणना सही
    कर रहे हैं (निवेश की तारीख से ठीक 3 वर्ष)।

    2. टैक्स कटौती की जांच करें: यदि आपको ₹150000 से अधिक का निवेश दिख रहा है, तो
    याद रखें कि टैक्स लाभ केवल इसी सीमा तक सीमित है।

    3. ट्रांजेक्शन हिस्ट्री देखें: पुष्टि करें कि क्या कोई निवेश लंबित (Pending) है।


    समाधान:

    यदि विवरण अभी भी गलत हैं, तो हमें विवरण के साथ सूचित करें। हम आपके रिकॉर्ड की
    तुलना हमारे विनियामक डेटा से करेंगे। यदि त्रुटि पाई जाती है, तो मामला वरिष्ठ अनुपालन
    अधिकारियों को भेजा जाएगा और एक निर्धारित समय सीमा के भीतर पारदर्शी जांच के बाद
    सुधार किया जाएगा।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
