  institution_id: tarang_invest
- id: b50eb84d-2c94-5695-821e-5f62acbd8e4f
  title: start_sip का उपयोग कब करें
  body: 'जब कोई ग्राहक म्यूचुअल फंड SIP के माध्यम से अनुशासित बचत और दीर्घकालिक धन
    सृजन शुरू करना चाहता है, तब start_sip टूल का उपयोग किया जाता है।


    प्रक्रिया:

    1. verify_identity का उपयोग करके ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts का उपयोग करके ग्राहक का सक्रिय account_id प्राप्त करें।

    3. ग्राहक से निवेश राशि, फंड का चयन और तिथि जैसी आवश्यक जानकारी प्राप्त करें।

    4. निवेश प्रक्रिया शुरू करने के लिए start_sip टूल को कॉल करें।

    5. सफल निष्पादन के बाद ग्राहक को पुष्टि प्रदान करें और उन्हें याद दिलाएं कि निवेश
    बाजार जोखिमों के अधीन है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - start_sip
  institution_id: tarang_invest
- id: 39549c5e-a794-5aad-9ea4-00b17acede78
  title: start_sip टूल संदर्भ
  body: 'टूल: start_sip

    विवरण: यह टूल ग्राहक के लिए एक नया म्यूचुअल फंड SIP निवेश शुरू करता है।

    तर्क (Arguments): account_id, fund_id, amount, frequency, start_date

    प्रभाव: यह एक state_changing क्रिया है जो खाते में निवेश अनुसूची बनाती है।

    एजेंट इस कार्रवाई को सीधे टूल कॉल के माध्यम से पूरा करता है।'
