  title: डीमैट और ट्रेडिंग खाता — शर्तों में बदलाव की नीति
  body: "यह नीति 'डीमैट और ट्रेडिंग खाता' की सेवा शर्तों में संशोधन की प्रक्रिया को\
    \ निर्धारित करती है। तरंग इन्वेस्ट को विनियामक परिवर्तनों या परिचालन आवश्यकताओं\
    \ के कारण शुल्क संरचना या शर्तों को बदलने का अधिकार है। \n\nशुल्क परिवर्तनों के\
    \ संबंध में शर्तें:\n- यदि वार्षिक रखरखाव शुल्क (जो वर्तमान में ₹300 है) या इंट्राडे\
    \ ब्रोकरेज प्रति ऑर्डर (वर्तमान में ₹20) में कोई बदलाव किया जाता है, तो आपको 30\
    \ कार्यदिवसों के नोटिस की अवधि दी जाएगी।\n- इक्विटी डिलीवरी ब्रोकरेज (वर्तमान\
    \ में ₹0) और DP शुल्क (वर्तमान में ₹13.5 प्रति बिक्री) में किसी भी संशोधन की सूचना\
    \ ईमेल के माध्यम से प्रेषित की जाएगी।\n\nपरिवर्तनों की स्वीकृति:\nनोटिस अवधि के\
    \ बाद भी यदि आप अपने खाते के माध्यम से ट्रेड करना जारी रखते हैं, तो इसे संशोधित\
    \ शर्तों की स्वीकृति माना जाएगा। यदि आप नई शर्तों से सहमत नहीं हैं, तो आप 'डीमैट\
    \ और ट्रेडिंग खाता — रद्द करना, बंद करना या डाउनग्रेड करना' के अनुसार अपना खाता\
    \ बंद कर सकते हैं।"
