- id: 0e1e762d-2a15-5af4-b976-3ede70ac80ab
  title: ELSS टैक्स-सेवर फंड — न्यूनतम निवेश की व्याख्या
  body: 'प्रश्न: ELSS टैक्स-सेवर फंड में निवेश शुरू करने के लिए मुझे कम से कम कितनी
    राशि की आवश्यकता है?

    उत्तर: आप न्यूनतम ₹500 के निवेश के साथ इस फंड में शुरुआत कर सकते हैं। यह किफायती
    सीमा नए निवेशकों को टैक्स बचत की दिशा में पहला कदम उठाने में मदद करती है। अधिक
    विवरण के लिए कृपया ''ELSS टैक्स-सेवर फंड — सिंहावलोकन'' देखें।


    प्रश्न: क्या मैं न्यूनतम राशि से कम निवेश कर सकता हूँ?

    उत्तर: नहीं, निवेश प्रक्रिया को पूरा करने के लिए ₹500 की न्यूनतम सीमा का पालन
    करना अनिवार्य है।'
