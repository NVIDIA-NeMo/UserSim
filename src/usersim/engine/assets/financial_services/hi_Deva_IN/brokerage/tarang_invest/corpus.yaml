- id: 4b892613-6854-5e98-9a55-641678871834
  title: ELSS टैक्स-सेवर फंड — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी ELSS टैक्स-सेवर फंड से संबंधित कोई कार्रवाई (जैसे निकासी या निवेश)
    अस्वीकृत या अवरुद्ध हो जाती है, तो इसके निम्नलिखित कारण हो सकते हैं:


    लक्षण: ''निकासी अनुरोध अस्वीकृत'' या ''ट्रांजेक्शन ब्लॉक'' का संदेश मिलना।


    संभावित कारण और समाधान:

    1. लॉक-इन अवधि की समाप्ति न होना: यदि आप 3 वर्ष की लॉक-इन अवधि पूरी होने से पहले
    निकासी का प्रयास कर रहे हैं, तो सिस्टम इसे स्वचालित रूप से अवरुद्ध कर देगा। कृपया
    अपनी निवेश तिथि और लॉक-इन समाप्ति तिथि की जांच करें।

    2. अपर्याप्त राशि: यदि आपका निवेश ₹500 की न्यूनतम सीमा से कम है (संशोधन के मामले
    में), तो यह अस्वीकृत हो सकता है।

    3. प्रमाणीकरण विफलता: यदि बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication)
    पूरा नहीं हुआ है, तो सुरक्षा कारणों से कार्रवाई अवरुद्ध रहेगी।


    यदि लॉक-इन अवधि समाप्त हो चुकी है और फिर भी कार्रवाई अवरुद्ध है, तो हमें सूचित
    करें। हम इस मामले को वरिष्ठ अनुपालन अधिकारियों को भेजेंगे और एक पारदर्शी जांच
    प्रक्रिया के माध्यम से इसका समाधान करेंगे।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
