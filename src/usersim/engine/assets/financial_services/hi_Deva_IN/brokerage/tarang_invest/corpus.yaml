- id: e148f06e-649b-5162-9ca7-54bef65edd07
  title: म्यूचुअल फंड SIP — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'तरंग इन्वेस्ट में आपकी निवेश सुरक्षा हमारी प्राथमिकता है। म्यूचुअल फंड SIP
    के साथ धोखाधड़ी के मामलों में अक्सर जालसाज खुद को फंड मैनेजर या बैंक अधिकारी बताकर
    आपसे आपकी निजी जानकारी मांगते हैं।


    कृपया ध्यान दें कि तरंग इन्वेस्ट आपसे कभी भी आपके पासवर्ड, ओटीपी (OTP) या पिन
    की मांग नहीं करेगा। किसी भी संदिग्ध कॉल या संदेश पर भरोसा न करें जो आपको निवेश
    के बदले ''गारंटीड रिटर्न'' का वादा करता हो, क्योंकि हम रिटर्न की गारंटी नहीं देते
    हैं।


    सुरक्षा के लिए हम ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं और किसी भी ट्रांजेक्शन
    या खाते में बदलाव से पहले बहु-स्तरीय प्रमाणीकरण (Multi-factor Authentication)
    अनिवार्य है। यदि आपको अपने म्यूचुअल फंड SIP खाते में कोई अनधिकृत गतिविधि या संदिग्ध
    ट्रांजेक्शन दिखाई देता है, तो तुरंत हमें सूचित करें। हम शिकायतों के त्वरित समाधान
    के लिए प्रतिबद्ध हैं और धोखाधड़ी के मामलों में तुरंत विनियामक अधिकारियों को सूचित
    करते हैं। सतर्क रहें और अपनी गोपनीय जानकारी किसी के साथ साझा न करें।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: security_advisory
