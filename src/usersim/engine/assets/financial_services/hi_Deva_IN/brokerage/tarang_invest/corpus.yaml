  mentions_tools:
  - transfer_funds
  institution_id: tarang_invest
- id: c0374301-35de-5078-a149-1a42e39443c2
  title: cancel_order का उपयोग कब करें
  body: 'यदि कोई ग्राहक अपने द्वारा रखे गए किसी लंबित ऑर्डर (Pending Order) को रद्द
    करना चाहता है जो अभी तक निष्पादित (Executed) नहीं हुआ है, तो इस प्रक्रिया का उपयोग
    करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल से account_id प्राप्त करें।

    3. get_order_status टूल का उपयोग करके ऑर्डर की वर्तमान स्थिति की जांच करें। यदि
    ऑर्डर ''Executed'' है, तो उसे रद्द नहीं किया जा सकता।

    4. यदि ऑर्डर लंबित है, तो cancel_order टूल का उपयोग करके उसे रद्द करें।


    सभी ऑर्डर रद्दीकरण SEBI और एक्सचेंज के दिशा-निर्देशों के अनुसार किए जाते हैं।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - cancel_order
  institution_id: tarang_invest
- id: 5a50fefd-6e1f-59d3-ae9b-3c6f3d7c5190
  title: cancel_order टूल संदर्भ
  body: 'यह टूल एजेंट को किसी ग्राहक के लंबित ट्रेडिंग ऑर्डर को रद्द करने की अनुमति
    देता है। एजेंट इस कार्रवाई को सीधे cancel_order टूल कॉल करके निष्पादित करता है।


    **टूल हस्ताक्षर:**

    - **नाम:** cancel_order

    - **तर्क (Arguments):** order_id (आवश्यक), account_id (आवश्यक)।

    - **प्रभाव:** निर्दिष्ट ऑर्डर को रद्द करता है और संबंधित मार्जिन या फंड को मुक्त
    करता है।'
  domain: brokerage_investing
  product_category: procedure
