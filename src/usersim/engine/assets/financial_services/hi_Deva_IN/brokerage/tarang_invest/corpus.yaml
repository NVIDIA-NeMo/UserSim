- id: 39df5a0d-9195-5889-ae64-bfb95ed20ff0
  title: डीमैट और ट्रेडिंग खाता — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक को लगता है कि उनके लेजर बैलेंस या होल्डिंग्स में विसंगति है,
    या उन्हें लगता है कि गलत शुल्क लगाया गया है।


    जांच के चरण (सपोर्ट एजेंट के लिए):

    1. शुल्क मिलान: जांचें कि क्या ग्राहक ने इंट्राडे ट्रेड किया है (₹20 प्रति ऑर्डर)
    या शेयर बेचे हैं (₹13.5 DP शुल्क)।

    2. AMC जांच: पुष्टि करें कि क्या ₹300 का वार्षिक रखरखाव शुल्क हाल ही में काटा
    गया है।

    3. ट्रेड निष्पादन: पुष्टि करें कि क्या कोई ऑर्डर लंबित है या आंशिक रूप से निष्पादित
    हुआ है।


    समाधान:

    यदि शुल्क गणना में त्रुटि पाई जाती है, तो हम तुरंत सुधार करेंगे और ग्राहक को सूचित
    करेंगे। यदि विवरण सही हैं, तो हम ग्राहक को उनके ट्रेड इतिहास का विस्तृत विवरण
    प्रदान करेंगे ताकि वे विसंगति को समझ सकें। यदि समस्या का समाधान नहीं होता है,
    तो मामला वरिष्ठ अनुपालन अधिकारियों को भेजा जाएगा।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
