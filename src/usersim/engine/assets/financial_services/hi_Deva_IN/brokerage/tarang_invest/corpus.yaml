- id: e49be692-308f-5fd7-825a-6a9038186fcc
  title: म्यूचुअल फंड SIP — जोखिम प्रकटीकरण
  body: 'यह दस्तावेज़ म्यूचुअल फंड SIP के साथ जुड़े जोखिमों के बारे में औपचारिक प्रकटीकरण
    है।


    1. बाजार जोखिम: म्यूचुअल फंड निवेश बाजार जोखिमों के अधीन हैं। निवेश का मूल्य बाजार
    की स्थितियों के आधार पर घट या बढ़ सकता है। हम रिटर्न की कोई गारंटी नहीं देते हैं।

    2. तरलता जोखिम: हालांकि म्यूचुअल फंड आम तौर पर तरल होते हैं, लेकिन समय से पहले
    निकासी पर शुल्क लग सकता है। विशेष रूप से, 365 दिनों के भीतर निकासी करने पर 1%
    का एग्जिट लोड लागू होता है।

    3. निवेश सलाह: तरंग इन्वेस्ट केवल शैक्षिक जानकारी और उत्पाद विवरण प्रदान करता
    है। हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं। हमारी अनुशंसाएं केवल उत्पाद
    की विशेषताओं पर आधारित होती हैं।

    4. विनियामक अनुपालन: हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन
    करते हैं और डेटा गोपनीयता को प्राथमिकता देते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
