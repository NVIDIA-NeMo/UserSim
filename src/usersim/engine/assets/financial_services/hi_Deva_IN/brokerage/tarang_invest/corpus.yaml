- id: dff7abbe-2ea3-577b-b8fa-7a613f21a7a7
  title: म्यूचुअल फंड SIP — पात्रता श्रेणियाँ
  body: 'म्यूचुअल फंड SIP के लिए पात्रता मानदंड निम्नलिखित हैं:


    | श्रेणी | आवश्यक शर्त | परिणाम |

    | :--- | :--- | :--- |

    | व्यक्तिगत निवेशक | पूर्ण केवाईसी और न्यूनतम ₹500 मासिक निवेश | पात्र |

    | नाबालिग (अभिभावक के माध्यम से) | वैध जन्म प्रमाण पत्र और अभिभावक केवाईसी | पात्र
    |

    | अनिवासी भारतीय (NRI) | NRE/NRO खाता और NRI केवाईसी | पात्र |

    | संस्थागत निवेशक | बोर्ड प्रस्ताव और संस्थागत केवाईसी | पात्र |


    सभी श्रेणियों के लिए SEBI और AMFI के दिशा-निर्देशों का पालन अनिवार्य है।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: eligibility_matrix
  source_authority: official
