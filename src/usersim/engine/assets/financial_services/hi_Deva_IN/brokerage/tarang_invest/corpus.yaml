  mentions_tools: []
  institution_id: tarang_invest
- id: cd004f87-1604-5d18-a065-9290c16f8f5e
  title: डीमैट और ट्रेडिंग खाता — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: ग्राहक को ट्रेड निष्पादित करने या शेयर बेचने के दौरान ''कार्रवाई अस्वीकृत''
    या ''खाता अवरुद्ध'' का संदेश मिल रहा है।


    संभावित कारण और समाधान:

    1. अपर्याप्त फंड: जांचें कि क्या आपके पास ट्रेड के लिए पर्याप्त बैलेंस है या इंट्राडे
    के लिए आवश्यक मार्जिन उपलब्ध है।

    2. प्रमाणीकरण विफलता: सुनिश्चित करें कि आपने बहु-स्तरीय प्रमाणीकरण (MFA) प्रक्रिया
    पूरी की है।

    3. विनियामक रोक: यदि केवाईसी अपडेट नहीं है, तो खाता अस्थायी रूप से अवरुद्ध हो
    सकता है।

    4. डीमैट होल्ड: यदि शेयर किसी अन्य विनियामक कारण से फ्रीज हैं, तो बिक्री संभव
    नहीं होगी।


    समाधान प्रक्रिया: पहले अपना फंड बैलेंस और केवाईसी स्टेटस जांचें। यदि समस्या बनी
    रहती है, तो हमें विवरण दें। हम आपके खाते की पारदर्शी जांच करेंगे। यदि यह एक तकनीकी
    त्रुटि है, तो हम इसे तुरंत ठीक करेंगे; यदि यह विनियामक है, तो हम आपको आवश्यक दस्तावेज़ों
    के बारे में सूचित करेंगे।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 3f4faf02-9414-5715-922a-d42cef69c0d4
  title: डीमैट और ट्रेडिंग खाता — कब स्विच या अपग्रेड करें
  body: एक सपोर्ट एजेंट के रूप में, ग्राहक को तब स्विच या अपग्रेड करने का सुझाव दें
    जब उनकी ट्रेडिंग रणनीति बदल जाए। यदि ग्राहक केवल दीर्घकालिक निवेश करता है, तो
    हमारा ₹0 इक्विटी डिलीवरी ब्रोकरेज उनके लिए आदर्श है। हालांकि, यदि ग्राहक उच्च-वॉल्यूम
    इंट्राडे ट्रेडिंग शुरू करता है, तो उन्हें प्रति ऑर्डर ₹20 के शुल्क के साथ अपनी
    लागत का विश्लेषण करना चाहिए। यदि ग्राहक को अधिक पूंजी की आवश्यकता है, तो उन्हें
    'मार्जिन ट्रेडिंग सुविधा (MTF) — सिंहावलोकन' की ओर निर्देशित करें ताकि वे अपनी
    ट्रेडिंग क्षमता बढ़ा सकें।
