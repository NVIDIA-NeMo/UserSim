  title: डीमैट और ट्रेडिंग खाता — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपका ''डीमैट और ट्रेडिंग खाता'' आपकी मेहनत की कमाई का केंद्र है, इसलिए इसकी
    सुरक्षा सर्वोपरि है। तरंग इन्वेस्ट में हम ''जीरो-ट्रस्ट'' दृष्टिकोण अपनाते हैं।
    कृपया याद रखें कि किसी भी ट्रांजेक्शन या खाते में बदलाव से पहले बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) अनिवार्य है।


    सुरक्षा के लिए इन नियमों का पालन करें:

    1. अपना पासवर्ड, पिन या ओटीपी कभी भी किसी के साथ साझा न करें।

    2. तरंग इन्वेस्ट के प्रतिनिधि आपसे कभी भी आपके क्रेडेंशियल्स या गोपनीय विवरण नहीं
    मांगेंगे।

    3. अपने खाते की गतिविधियों की नियमित निगरानी करें।


    यदि आपको कोई भी संदिग्ध गतिविधि दिखाई देती है, तो तुरंत हमें सूचित करें। धोखाधड़ी
    के मामलों में हम तुरंत विनियामक अधिकारियों को सूचित करते हैं। त्वरित समाधान के
    लिए समय सीमा के भीतर पारदर्शी जांच प्रक्रिया का पालन किया जाता है। अधिक जानकारी
    के लिए ''डीमैट और ट्रेडिंग खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा'' देखें।'
