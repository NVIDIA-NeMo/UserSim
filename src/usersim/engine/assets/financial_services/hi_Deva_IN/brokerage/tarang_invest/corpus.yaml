- id: 0c2796e0-3d0d-5edf-9923-8cb6bf80df36
  title: ELSS टैक्स-सेवर फंड — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'ELSS टैक्स-सेवर फंड का उपयोग करते समय निम्नलिखित सीमाओं और प्रतिबंधों का
    ध्यान रखना अनिवार्य है:


    1. लॉक-इन अवधि: इस उत्पाद में निवेश की गई राशि 3 वर्ष की अनिवार्य लॉक-इन अवधि
    के अधीन है। इस अवधि के दौरान निवेश को किसी भी स्थिति में निकाला नहीं जा सकता है।

    2. टैक्स कटौती सीमा: आयकर अधिनियम की धारा 80C के तहत मिलने वाली अधिकतम कटौती ₹150000
    तक सीमित है। इस सीमा से अधिक का निवेश टैक्स बचत के उद्देश्य से मान्य नहीं होगा।

    3. न्यूनतम निवेश: इस फंड में निवेश शुरू करने के लिए न्यूनतम निवेश राशि ₹500 निर्धारित
    है।

    4. अपवाद स्थितियाँ: लॉक-इन अवधि एक विनियामक आवश्यकता है, इसलिए व्यक्तिगत आपात
    स्थितियों में भी समय से पहले निकासी संभव नहीं है।


    हम SEBI और AMFI के दिशा-निर्देशों का सख्ती से पालन करते हैं ताकि आपके निवेश की
    सुरक्षा सुनिश्चित हो सके।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
