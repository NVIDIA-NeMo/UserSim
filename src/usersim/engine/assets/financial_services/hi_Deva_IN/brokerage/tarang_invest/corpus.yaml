- id: 7f1bc575-86d7-565d-8e02-9e449887bc12
  title: म्यूचुअल फंड SIP — शर्तों में बदलाव की नीति
  body: 'यह नीति म्यूचुअल फंड SIP से जुड़ी शर्तों और शुल्कों में संशोधन की प्रक्रिया
    को निर्धारित करती है। तरंग इन्वेस्ट को विनियामक आवश्यकताओं या बुनियादी ढांचे के
    रखरखाव के कारण शुल्क ढांचे में बदलाव करने का अधिकार है।


    मुख्य शर्तें:

    1. शुल्क परिवर्तन: यदि न्यूनतम SIP राशि (वर्तमान में ₹500) या एग्जिट लोड (वर्तमान
    में 365 दिनों के भीतर 1%) में कोई बदलाव होता है, तो हम आपको 30 दिनों के नोटिस
    पीरियड के माध्यम से सूचित करेंगे।

    2. नोटिस अवधि: किसी भी महत्वपूर्ण नीति परिवर्तन के लिए ईमेल या एसएमएस के माध्यम
    से औपचारिक सूचना दी जाएगी।

    3. स्वीकृति: परिवर्तन के प्रभावी होने के बाद भी निवेश जारी रखना इन संशोधित शर्तों
    की स्वीकृति माना जाएगा।

    4. समाप्ति: यदि आप नई शर्तों से असहमत हैं, तो आप अपनी SIP को बंद कर सकते हैं,
    बशर्ते कि लागू एग्जिट लोड का भुगतान किया गया हो।


    हम पारदर्शिता और कम लागत के प्रति प्रतिबद्ध हैं ताकि आपकी शुद्ध कमाई बढ़ सके।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
