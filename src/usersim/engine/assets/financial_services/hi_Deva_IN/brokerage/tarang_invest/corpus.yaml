- id: 0f1875c5-3bed-5e23-9abd-a4120520c874
  title: ELSS टैक्स-सेवर फंड — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: आप अपने निवेश पोर्टफोलियो को देखने या खाते में लॉगिन करने में असमर्थ
    हैं।


    संभावित कारण:

    - गलत क्रेडेंशियल्स का उपयोग।

    - बहु-स्तरीय प्रमाणीकरण (MFA) ओटीपी प्राप्त न होना।

    - खाते का अस्थायी रूप से लॉक होना।


    समाधान के चरण:

    1. जाँचें कि क्या आपका इंटरनेट कनेक्शन स्थिर है और आप सही यूजर आईडी का उपयोग कर
    रहे हैं।

    2. यदि ओटीपी नहीं मिल रहा है, तो ''रीसेंड ओटीपी'' विकल्प का उपयोग करें और अपने
    पंजीकृत मोबाइल नंबर की जाँच करें।

    3. यदि खाता लॉक है, तो हमें सूचित करें। हम आपकी पहचान सत्यापित करेंगे और सुरक्षा
    प्रोटोकॉल के बाद आपके एक्सेस को पुनः बहाल करेंगे।


    यदि समस्या बनी रहती है, तो मामला हमारे वरिष्ठ अनुपालन अधिकारियों को भेजा जाएगा,
    जो निर्धारित समय सीमा के भीतर पारदर्शी जांच प्रक्रिया के माध्यम से इसका समाधान
    करेंगे।'
