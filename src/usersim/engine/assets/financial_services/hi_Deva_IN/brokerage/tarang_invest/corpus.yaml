- id: cb64845a-644a-5ec1-897d-e62371f9632f
  title: म्यूचुअल फंड SIP — पात्रता और सेटअप
  body: 'प्रश्न: म्यूचुअल फंड SIP शुरू करने के लिए पात्रता क्या है?

    उत्तर: कोई भी व्यक्ति जिसके पास वैध केवाईसी (KYC) और एक सक्रिय बैंक खाता है, वह
    ₹500 की न्यूनतम SIP राशि के साथ निवेश शुरू कर सकता है।


    प्रश्न: सेटअप प्रक्रिया में कितना समय लगता है?

    उत्तर: एक बार जब आप विवरण प्रदान कर देते हैं और बैंक मैंडेट स्वीकृत हो जाता है,
    तो आपकी SIP सक्रिय हो जाती है।


    अधिक जानकारी के लिए ''म्यूचुअल फंड SIP — सेटअप और सक्रियण'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
