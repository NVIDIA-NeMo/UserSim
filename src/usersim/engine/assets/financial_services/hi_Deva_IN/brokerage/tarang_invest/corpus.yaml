- id: 621a4589-3dbc-5d35-8733-5171e5bc8738
  title: म्यूचुअल फंड SIP — सिंहावलोकन
  body: 'तरंग इन्वेस्ट का म्यूचुअल फंड SIP एक आधुनिक और किफायती समाधान है, जो अनुशासित
    बचत और दीर्घकालिक धन सृजन के लिए डिज़ाइन किया गया है। यह उन निवेशकों के लिए आदर्श
    है जो एकमुश्त बड़ी राशि के बजाय नियमित रूप से निवेश करना चाहते हैं।


    इस उत्पाद की मुख्य विशेषताएं और शर्तें निम्नलिखित हैं:

    - न्यूनतम SIP राशि: आप मात्र ₹500 की न्यूनतम राशि के साथ अपना निवेश शुरू कर सकते
    हैं।

    - एग्जिट लोड: यदि आप निवेश की तारीख से 365 दिनों के भीतर पैसा निकालते हैं, तो
    1% का एग्जिट लोड लागू होगा।

    - SIP पॉज़ सुविधा: हम लचीलापन प्रदान करते हैं, जिससे आप अपनी SIP को अधिकतम 6 महीने
    तक रोक (pause) सकते हैं।


    हमारा शुल्क ढांचा पारदर्शिता और कम लागत पर आधारित है ताकि आपकी शुद्ध कमाई बढ़ सके।
    कृपया ध्यान दें: बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान
    से पढ़ें। तरंग इन्वेस्ट केवल शैक्षिक जानकारी प्रदान करता है और हम रिटर्न की गारंटी
    नहीं देते हैं।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: product_sheet
