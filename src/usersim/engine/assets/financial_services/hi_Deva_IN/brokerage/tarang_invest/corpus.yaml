- id: 40441a13-b8be-5275-8bc9-9644f8648a16
  title: डीमैट और ट्रेडिंग खाता — वर्तमान ऑफर
  body: 'विशेष ऑफर: नए निवेशकों के लिए स्वागत लाभ!


    दिनांक 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक खाता खोलने वाले ग्राहकों के लिए, हम
    पहले वर्ष के लिए वार्षिक रखरखाव शुल्क (AMC) में छूट प्रदान कर रहे हैं। इस अवधि
    के दौरान खाता सक्रिय करने पर आपको ₹300 का वार्षिक शुल्क नहीं देना होगा।


    शर्तें: यह ऑफर केवल उन नए खातों पर लागू है जो निर्दिष्ट समय सीमा के भीतर पूरी
    तरह से केवाईसी सत्यापित हो जाते हैं।'
