    1. वित्तीय दायित्व: ग्राहक इस सुविधा के तहत उधार ली गई पूंजी पर 14.99% की वार्षिक
    ब्याज दर का भुगतान करने के लिए सहमत है।

    2. मार्जिन आवश्यकता: ग्राहक को निवेश मूल्य का न्यूनतम 25% मार्जिन बनाए रखना अनिवार्य
    है। यदि मार्जिन इस स्तर से नीचे गिरता है, तो हम अतिरिक्त फंड की मांग कर सकते हैं
    या पोजीशन को liquidate कर सकते हैं।

    3. शुल्क: प्रत्येक स्क्रिप को गिरवी रखने पर ₹20 का शुल्क लागू होगा।

    4. अनुपालन: हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन करते
    हैं।

    5. अनुबंध की समाप्ति: ग्राहक किसी भी समय इस सुविधा को बंद करने का अनुरोध कर सकता
    है, बशर्ते सभी बकाया ब्याज और शुल्क का भुगतान कर दिया गया हो।


    शुल्क संरचना में कोई भी बदलाव पारदर्शी रूप से सूचित किया जाएगा। विस्तृत विवरण
    के लिए मार्जिन ट्रेडिंग सुविधा (MTF) — शुल्क अनुसूची देखें।'
