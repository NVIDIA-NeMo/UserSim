  institution_id: tarang_invest
- id: c5bc20dc-e347-5f30-bf71-fa919b51f24e
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — जोखिम प्रकटीकरण
  body: 'यह महत्वपूर्ण है कि आप मार्जिन ट्रेडिंग सुविधा (MTF) से जुड़े जोखिमों को
    समझें। लीवरेज ट्रेडिंग आपके लाभ को बढ़ा सकती है, लेकिन यह आपके नुकसान को भी उसी
    अनुपात में बढ़ा सकती है।


    प्रमुख जोखिम:

    - मार्जिन कॉल: यदि आपके निवेश का मूल्य गिरता है और मार्जिन 25% से कम हो जाता है,
    तो आपको तुरंत फंड जमा करना होगा, अन्यथा हम आपकी पोजीशन बेच सकते हैं।

    - ब्याज लागत: 14.99% की वार्षिक ब्याज दर आपके शुद्ध लाभ को कम कर सकती है।

    - बाजार जोखिम: बाजार में अस्थिरता के कारण आपकी मूल पूंजी और उधार ली गई राशि दोनों
    प्रभावित हो सकते हैं।


    तरंग इन्वेस्ट केवल शैक्षिक जानकारी प्रदान करता है; हम व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देते। हम रिटर्न की गारंटी नहीं देते।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
