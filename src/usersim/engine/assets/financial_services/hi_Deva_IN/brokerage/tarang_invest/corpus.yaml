- id: fc68c2f7-0d2b-5bba-ab40-cb4f641703b4
  title: डीमैट और ट्रेडिंग खाता — इक्विटी डिलीवरी ब्रोकरेज की व्याख्या
  body: 'प्रश्न: इक्विटी डिलीवरी ब्रोकरेज क्या है और तरंग इन्वेस्ट में इसका शुल्क
    कितना है?

    उत्तर: जब आप शेयर खरीदते हैं और उन्हें उसी दिन बेचने के बजाय अपने डीमैट खाते में
    होल्ड (डिलीवरी) करते हैं, तो उसे इक्विटी डिलीवरी कहा जाता है। तरंग इन्वेस्ट में,
    हम निवेशकों की शुद्ध कमाई बढ़ाने के लिए इक्विटी डिलीवरी ब्रोकरेज ₹0 रखते हैं।


    प्रश्न: क्या इसका मतलब है कि डिलीवरी ट्रेडिंग पूरी तरह से मुफ्त है?

    उत्तर: ब्रोकरेज ₹0 है, लेकिन अन्य विनियामक शुल्क और शेयर बेचने पर ₹13.5 का DP
    शुल्क लागू होगा। विस्तृत जानकारी के लिए ''डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची''
    देखें।'
