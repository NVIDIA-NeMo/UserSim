- id: 19b29cda-acbb-59e2-98aa-6df019b67e1c
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — प्रति स्क्रिप गिरवी शुल्क की व्याख्या
  body: 'प्रश्न: प्रति स्क्रिप गिरवी शुल्क (Pledge Charge) क्या है और यह कैसे लागू
    होता है?

    उत्तर: जब आप मार्जिन ट्रेडिंग सुविधा (MTF) का उपयोग करते हैं, तो आपको अपने शेयरों
    को कोलैटरल के रूप में गिरवी रखना पड़ता है। इस प्रक्रिया के लिए डिपॉजिटरी द्वारा
    प्रति स्क्रिप ₹20 का शुल्क लिया जाता है। यह शुल्क प्रत्येक अलग शेयर (स्क्रिप)
    पर लागू होता है जिसे आप मार्जिन प्राप्त करने के लिए गिरवी रखते हैं। अधिक विवरण
    के लिए मार्जिन ट्रेडिंग सुविधा (MTF) — शुल्क अनुसूची देखें।'
  domain: brokerage_investing
  product_category: margin_trading_facility
