  title: मार्जिन ट्रेडिंग सुविधा (MTF) — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) को बंद करने या डाउनग्रेड करने के लिए इन चरणों
    का पालन करें:


    1. अपनी सभी खुली MTF पोजीशन को बंद करें या उन्हें पूर्ण भुगतान करके डिलीवरी में
    बदलें।

    2. सुनिश्चित करें कि आपके खाते में सभी बकाया ब्याज (14.99% वार्षिक दर पर आधारित)
    और गिरवी शुल्क (₹20 प्रति स्क्रिप) का भुगतान हो चुका है।

    3. हमें इस सुविधा को बंद करने या डाउनग्रेड करने का अनुरोध भेजें।

    4. हम आपके खाते की जांच करेंगे और पुष्टि करेंगे कि कोई बकाया राशि शेष नहीं है।

    5. आपको एक पुष्टिकरण संदेश प्राप्त होगा कि आपकी मार्जिन ट्रेडिंग सुविधा (MTF)
    सफलतापूर्वक बंद या डाउनग्रेड कर दी गई है।


    ध्यान दें कि बंद करने की प्रक्रिया के बाद आप नई मार्जिन पोजीशन नहीं ले पाएंगे।
    यदि आप सामान्य ट्रेडिंग पर लौटना चाहते हैं, तो डीमैट और ट्रेडिंग खाता — रद्द करना,
