- id: 702155d8-6bc3-56eb-87b1-d6ded3b2f8f5
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) के लिए एक समान शुल्क ढांचा लागू होता है, जो
    सभी ग्राहकों के लिए पारदर्शी है:


    - वार्षिक ब्याज दर: 14.99% (यह दर सभी बैलेंस पर समान रूप से लागू होती है)।

    - गिरवी शुल्क: ₹20 प्रति स्क्रिप (यह शुल्क प्रति प्रतिभूति गिरवी रखने पर एक बार
    लिया जाता है)।

    - न्यूनतम मार्जिन: 25% (निवेश मूल्य का यह हिस्सा ग्राहक द्वारा वहन किया जाना चाहिए)।


    यह दरें बुनियादी ढांचे के रखरखाव और विनियामक लागतों को कवर करने के लिए ली जाती
    हैं। दरों में किसी भी बदलाव की सूचना आपको अग्रिम रूप से दी जाएगी।'
