- id: 08ab8e78-08c7-50e4-bb59-2e5d9dac55ed
  title: डीमैट और ट्रेडिंग खाता — जोखिम प्रकटीकरण
  body: 'निवेशकों को सूचित किया जाता है कि शेयर बाजार में निवेश जोखिमों के अधीन है।
    तरंग इन्वेस्ट केवल उत्पाद विवरण और शैक्षिक जानकारी प्रदान करता है; हम व्यक्तिगत
    टैक्स या कानूनी सलाह नहीं देते हैं। हम किसी भी निवेश पर रिटर्न की गारंटी नहीं
    देते हैं।


    उपयोगकर्ताओं को पता होना चाहिए कि उनके निवेश का मूल्य बाजार की स्थितियों के कारण
    घट या बढ़ सकता है। हमारे शुल्क, जैसे ₹300 वार्षिक रखरखाव शुल्क, ₹20 इंट्राडे ब्रोकरेज
    और ₹13.5 DP शुल्क, विनियामक लागतों और बुनियादी ढांचे के रखरखाव के लिए लिए जाते
    हैं।


    हम SEBI, NSE और BSE के सभी दिशा-निर्देशों का सख्ती से पालन करते हैं। हम यह सुनिश्चित
    करते हैं कि निवेशक सभी विनियामक खुलासों से अवगत हों। कृपया निवेश करने से पहले
    अपने वित्तीय सलाहकार से परामर्श करें और सभी संबंधित दस्तावेजों को ध्यान से पढ़ें।'
