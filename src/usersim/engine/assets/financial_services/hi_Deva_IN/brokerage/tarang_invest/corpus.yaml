- id: 2e364957-9e87-51e9-8a83-3a8c8fd74092
  title: ELSS टैक्स-सेवर फंड — सेटअप और सक्रियण
  body: 'ELSS टैक्स-सेवर फंड में निवेश शुरू करने के लिए इन चरणों का पालन करें:


    1. निवेश राशि का चयन करें: हमें बताएं कि आप कितनी राशि निवेश करना चाहते हैं। ध्यान
    रखें कि न्यूनतम निवेश ₹500 होना चाहिए।

    2. टैक्स लाभ की पुष्टि करें: हमें सूचित करें कि आप इस निवेश का उपयोग धारा 80C
    के तहत ₹150000 तक की कटौती के लिए करना चाहते हैं।

    3. लॉक-इन अवधि की स्वीकृति: हम आपको 3 वर्ष की अनिवार्य लॉक-इन अवधि के बारे में
    सूचित करेंगे; इस शर्त पर अपनी सहमति प्रदान करें।

    4. भुगतान पूर्ण करें: अपने लिंक किए गए बैंक खाते से राशि का भुगतान करें।

    5. पुष्टि प्राप्त करें: एक बार ट्रांजेक्शन सफल होने पर, हम आपको निवेश की पुष्टि
    और यूनिट आवंटन का विवरण प्रदान करेंगे।


    सफलतापूर्वक सक्रियण के बाद, आप अपने पोर्टफोलियो में निवेशित राशि देख पाएंगे। याद
    रखें, बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
