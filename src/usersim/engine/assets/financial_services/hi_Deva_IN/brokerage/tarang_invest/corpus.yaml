  title: मार्जिन ट्रेडिंग सुविधा (MTF) — अनपेक्षित शुल्क या राशि
  body: 'यदि आप अपने स्टेटमेंट में अनपेक्षित शुल्क देखते हैं, तो कृपया निम्न की जांच
    करें:


    लक्षण: खाते से ऐसी राशि कटना जिसकी आपने उम्मीद नहीं की थी।


    संभावित कारण:

    1. ब्याज गणना: क्या आपने 14.99% की वार्षिक ब्याज दर को ध्यान में रखा है? यह राशि
    दैनिक आधार पर गणना की जाती है और मासिक रूप से ली जाती है।

    2. गिरवी शुल्क: क्या आपने नए शेयर गिरवी रखे हैं? प्रति स्क्रिप ₹20 का शुल्क लागू
    होता है।

    3. मार्जिन शॉर्टेज: क्या आपके पोर्टफोलियो का मूल्य 25% न्यूनतम मार्जिन से नीचे
    गिर गया था?


    समाधान:

    - अपने लेजर और ट्रेड विवरण की जांच करें।

    - यदि आपको लगता है कि शुल्क गलत है, तो हमें विवरण प्रदान करें।


    अगला कदम: यदि समाधान नहीं होता है, तो हम मामले को वरिष्ठ अनुपालन अधिकारियों को
    भेजेंगे, जो पारदर्शी जांच प्रक्रिया के माध्यम से समाधान करेंगे।'
