- id: c6a85452-5c2c-5a7d-83b7-69e5d31b8937
  title: ELSS टैक्स-सेवर फंड — गोपनीयता और डेटा प्रबंधन
  body: 'तरंग इन्वेस्ट आपके डेटा की गोपनीयता को सर्वोच्च प्राथमिकता देता है। ELSS
    टैक्स-सेवर फंड के प्रबंधन के दौरान, हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों
    का सख्ती से पालन करते हैं।


    डेटा प्रबंधन नीतियां:

    - हम आपके व्यक्तिगत और वित्तीय डेटा को सुरक्षित रखने के लिए ''जीरो-ट्रस्ट'' सुरक्षा
    मॉडल का उपयोग करते हैं।

    - आपका डेटा केवल विनियामक खुलासों और आपके निवेश के प्रबंधन के लिए आवश्यक तृतीय
    पक्षों (जैसे कि डिपॉजिटरी और फंड हाउस) के साथ साझा किया जाता है।

    - हम यह सुनिश्चित करते हैं कि सभी निवेशक सुरक्षा योजनाओं और नियामक प्रकटीकरणों
    के बारे में पूरी तरह जागरूक हों।


    हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं। हम केवल उत्पाद की विशेषताओं,
    जैसे कि 3 वर्ष की लॉक-इन अवधि और ₹150000 की कटौती सीमा, के आधार पर अनुशंसा करते
    हैं।'
