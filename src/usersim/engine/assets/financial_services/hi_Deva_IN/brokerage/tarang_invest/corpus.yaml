- id: c813e0da-4fd0-5196-b49b-e3addcde53f7
  title: म्यूचुअल फंड SIP — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'म्यूचुअल फंड SIP के प्रबंधन के लिए निम्नलिखित सीमाओं और प्रतिबंधों का पालन
    करना अनिवार्य है:


    1. न्यूनतम निवेश सीमा: किसी भी नए SIP सेटअप के लिए न्यूनतम SIP राशि ₹500 होनी
    चाहिए। इससे कम राशि के अनुरोध स्वीकार नहीं किए जाएंगे।

    2. SIP पॉज (Pause) सीमा: यदि कोई निवेशक अपनी SIP को अस्थायी रूप से रोकना चाहता
    है, तो SIP रोकने की अधिकतम अवधि 6 माह है। इस अवधि के बाद, निवेश को पुनः सक्रिय
    करना आवश्यक है।

    3. एग्जिट लोड प्रतिबंध: यदि आप निवेश के 365 दिनों के भीतर म्यूचुअल फंड से पैसा
    निकालते हैं, तो 1% का एग्जिट लोड शुल्क लागू होगा।


    अपवाद स्थितियाँ:

    - विनियामक परिवर्तनों के कारण शुल्क या सीमाओं में बदलाव हो सकता है, जिसकी सूचना
    पारदर्शी तरीके से दी जाएगी।

    - खाता फ्रीज होने या केवाईसी (KYC) लंबित होने की स्थिति में SIP भुगतान अवरुद्ध
    हो सकते हैं।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
