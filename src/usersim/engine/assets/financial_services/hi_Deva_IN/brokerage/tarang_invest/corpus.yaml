- id: a8082866-b81b-5739-b9ff-5e1d3044c62f
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — गोपनीयता और डेटा प्रबंधन
  body: 'तरंग इन्वेस्ट आपकी गोपनीयता और डेटा सुरक्षा के प्रति प्रतिबद्ध है। मार्जिन
    ट्रेडिंग सुविधा (MTF) का उपयोग करते समय, हम आपके वित्तीय लेनदेन और कोलैटरल विवरणों
    को अत्यंत सुरक्षित रखते हैं।


    डेटा प्रबंधन नीति:

    1. हम केवल वही डेटा एकत्र करते हैं जो SEBI और विनियामक अनुपालन के लिए आवश्यक है।

    2. आपकी गिरवी रखी गई संपत्ति और ब्याज गणना (14.99% वार्षिक दर पर) का विवरण केवल
    अधिकृत अनुपालन अधिकारियों और नियामक संस्थाओं के साथ साझा किया जाता है।

    3. हम डेटा गोपनीयता के लिए ''जीरो-ट्रस्ट'' मॉडल का पालन करते हैं और बहु-स्तरीय
    प्रमाणीकरण अनिवार्य करते हैं।


    हम यह सुनिश्चित करते हैं कि सभी निवेशक सुरक्षा योजनाओं और विनियामक खुलासों के
    बारे में पूरी तरह जागरूक हों। हम किसी भी स्थिति में व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देते हैं; हमारा उद्देश्य केवल उत्पाद विवरण और शैक्षिक जानकारी प्रदान
    करना है।'
