- id: b0f6b1dd-ac7a-51e3-84d2-4cbbc57e72ea
  title: डीमैट और ट्रेडिंग खाता — प्रति बिक्री DP शुल्क की व्याख्या
  body: 'प्रश्न: DP शुल्क क्या है और यह मेरे खाते पर कैसे लागू होता है?

    उत्तर: DP शुल्क वह शुल्क है जो डिपॉजिटरी द्वारा आपके डीमैट खाते से शेयर बेचने
    पर लिया जाता है। तरंग इन्वेस्ट में, यह शुल्क ₹13.5 प्रति बिक्री है। यह शुल्क केवल
    तभी लागू होता है जब आप अपनी होल्डिंग से शेयर बेचते हैं, न कि हर ट्रेड पर। अधिक
    जानकारी के लिए डीमैट और ट्रेडिंग खाता — शुल्क अनुसूची देखें।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: faq
  source_authority: official
  placeholder: true
