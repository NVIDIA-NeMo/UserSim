- id: 37d1738a-241f-57d3-aa20-2e637afd8cf2
  title: डीमैट और ट्रेडिंग खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'तरंग इन्वेस्ट में आपकी सुरक्षा हमारी प्राथमिकता है। डीमैट और ट्रेडिंग खाता
    उपयोगकर्ताओं को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ जालसाज खुद को ब्रोकरेज
    अधिकारी बताकर आपका पासवर्ड या ओटीपी मांगते हैं। कृपया ध्यान दें कि हम आपसे कभी
    भी आपका लॉगिन पासवर्ड, ट्रांजेक्शन पिन या ओटीपी साझा करने के लिए नहीं कहेंगे।


    एक सामान्य धोखाधड़ी पैटर्न में आपको ''गारंटीड रिटर्न'' या ''इनसाइडर टिप्स'' का
    लालच देकर आपके खाते का एक्सेस मांगा जाता है। हम स्पष्ट करते हैं कि तरंग इन्वेस्ट
    रिटर्न की गारंटी नहीं देता है।


    यदि आपको कोई संदिग्ध गतिविधि दिखाई देती है या आपको लगता है कि आपके खाते के साथ
    छेड़छाड़ हुई है, तो तुरंत हमें सूचित करें। हम धोखाधड़ी के मामलों में तुरंत विनियामक
    अधिकारियों को सूचित करते हैं। किसी भी ट्रांजेक्शन से पहले हमारा बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) अनिवार्य है, जो आपके निवेश को सुरक्षित रखता है।
    सतर्क रहें और अपनी गोपनीय जानकारी किसी के साथ साझा न करें।'
