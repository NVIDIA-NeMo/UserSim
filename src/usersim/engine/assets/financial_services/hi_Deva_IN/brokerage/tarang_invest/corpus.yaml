- id: fa42ffa7-7360-5f07-89d6-bd452667b4dd
  title: set_alerts का उपयोग कब करें
  body: 'जब ग्राहक अपने पोर्टफोलियो की गतिविधियों, जैसे कि मूल्य परिवर्तन, ऑर्डर निष्पादन
    या फंड डिपॉजिट के लिए सूचनाएं (notifications) प्राप्त करना चाहता है, तो इस प्रक्रिया
    का उपयोग करें। यह निवेशकों को उनके निवेश पर सतर्क रहने में मदद करता है।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल के माध्यम से संबंधित account_id प्राप्त करें।

    3. ग्राहक से पूछें कि वे किस प्रकार के अलर्ट (जैसे: मूल्य अलर्ट, ट्रांजेक्शन अलर्ट)
    और किस माध्यम (ईमेल/एसएमएस) से चाहते हैं।

    4. निर्धारित वरीयताओं के आधार पर set_alerts टूल कॉल करें।


    यह सुविधा तरंग इन्वेस्ट की पारदर्शी और तकनीक-संचालित पहुंच का हिस्सा है।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: tarang_invest
- id: 516f5b1d-622a-5db4-a3d6-501bb579388d
  title: set_alerts टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के खाते के लिए अलर्ट और सूचनाएं कॉन्फ़िगर करने की
    अनुमति देता है। एजेंट इस कार्रवाई को सीधे set_alerts टूल कॉल करके निष्पादित करता
