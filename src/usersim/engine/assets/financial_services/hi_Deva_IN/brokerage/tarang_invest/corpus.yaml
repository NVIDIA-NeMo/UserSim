- id: 6852bd64-d44c-5307-93f8-d5985b021146
  title: ELSS टैक्स-सेवर फंड — विफल या लंबित कार्रवाई
  body: 'लक्षण: आपने निवेश के लिए राशि भेजी है, लेकिन वह आपके पोर्टफोलियो में नहीं
    दिख रही है या ट्रांजेक्शन ''विफल'' दिखा रहा है।


    संभावित कारण:

    1. निवेश राशि ₹500 की न्यूनतम सीमा से कम थी।

    2. बैंक से फंड ट्रांसफर के दौरान तकनीकी समस्या।

    3. केवाईसी (KYC) विवरण अपडेट न होना।


    समाधान प्रक्रिया:

    1. सबसे पहले जांचें कि क्या आपके बैंक खाते से राशि कट गई है।

    2. सुनिश्चित करें कि निवेश राशि ₹500 या उससे अधिक थी।

    3. यदि राशि कट गई है लेकिन यूनिट्स नहीं मिली हैं, तो हमें ट्रांजेक्शन आईडी प्रदान
    करें।


    यदि समस्या बनी रहती है, तो हम इस मामले को वरिष्ठ अनुपालन अधिकारियों को भेजेंगे
    और एक निर्धारित समय सीमा के भीतर पारदर्शी जांच कर समाधान प्रदान करेंगे।'
