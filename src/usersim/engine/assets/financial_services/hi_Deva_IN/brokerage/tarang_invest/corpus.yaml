- id: 1b1518ef-7892-5758-88fe-47787b10e58c
  title: ELSS टैक्स-सेवर फंड — लॉक-इन अवधि (वर्ष) की व्याख्या
  body: 'प्रश्न: ELSS टैक्स-सेवर फंड में लॉक-इन अवधि क्या है?

    उत्तर: इस फंड में निवेश की गई राशि पर 3 वर्ष की अनिवार्य लॉक-इन अवधि लागू होती
    है। इसका अर्थ है कि निवेश की तारीख से 3 वर्ष पूरे होने से पहले आप अपनी धनराशि
    नहीं निकाल सकते हैं।


    प्रश्न: क्या मैं लॉक-इन अवधि से पहले पैसा निकाल सकता हूँ?

    उत्तर: नहीं, विनियामक नियमों के कारण 3 वर्ष की अवधि पूरी होने तक निकासी संभव नहीं
    है। अधिक विवरण के लिए ''ELSS टैक्स-सेवर फंड — सिंहावलोकन'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
  domain: brokerage_investing
  product_category: elss_tax_saver
