- id: 63762126-691a-5946-820f-9fd1094f15a7
  title: डीमैट और ट्रेडिंग खाता — पात्रता श्रेणियाँ
  body: ' ''डीमैट और ट्रेडिंग खाता'' खोलने के लिए पात्रता मानदंड निम्नलिखित हैं:


    - भारतीय निवासी (Individual): वैध पैन कार्ड और आधार कार्ड अनिवार्य -> पात्र

    - अनिवासी भारतीय (NRI): पीआईओ/एनआरआई स्टेटस और एनआरई/एनआरओ खाता अनिवार्य -> पात्र

    - कॉर्पोरेट/संस्थागत: बोर्ड रिज़ॉल्यूशन और संस्थागत पैन अनिवार्य -> पात्र

    - नाबालिग (Minor): अभिभावक की सहमति और दस्तावेज़ अनिवार्य -> पात्र


    सभी श्रेणियों के लिए केवाईसी (KYC) अनुपालन अनिवार्य है। अधिक विवरण के लिए ''डीमैट
    और ट्रेडिंग खाता — पात्रता शर्तें'' देखें।'
  domain: brokerage_investing
  product_category: demat_trading_account
