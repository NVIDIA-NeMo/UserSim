- id: c62c2a5a-c217-5897-a245-436641d4862f
  title: ELSS टैक्स-सेवर फंड — बदलाव या अद्यतन करना
  body: 'अपने ELSS टैक्स-सेवर फंड निवेश के विवरण को अद्यतन करने के लिए इन चरणों का
    पालन करें:


    1. हमें वह विशिष्ट विवरण बताएं जिसे आप बदलना चाहते हैं (जैसे कि आपका संपर्क विवरण
    या नामांकित व्यक्ति/नॉमिनी)।

    2. यदि आप नॉमिनी अपडेट कर रहे हैं, तो नामांकित व्यक्ति का पूरा नाम, संबंध और जन्म
    तिथि प्रदान करें।

    3. हम आपके अनुरोध का सत्यापन करेंगे और आवश्यक दस्तावेज़ मांग सकते हैं।

    4. सत्यापन सफल होने के बाद, हम आपके विवरण अपडेट करेंगे और आपको एक पुष्टिकरण संदेश
    भेजेंगे।


    ध्यान दें: आप निवेश की गई राशि या लॉक-इन अवधि (3 वर्ष) में कोई बदलाव नहीं कर सकते,
    क्योंकि यह विनियामक नियमों के अधीन है। निवेश राशि में वृद्धि के लिए आप नया निवेश
    शुरू कर सकते हैं, जिसका न्यूनतम निवेश ₹500 है।'
