- id: 1dcd6c4c-11ca-53d5-a2f2-0b529f552347
  title: म्यूचुअल फंड SIP — सेटअप और सक्रियण
  body: 'म्यूचुअल फंड SIP सेटअप करने के लिए नीचे दिए गए चरणों का पालन करें। शुरू करने
    से पहले सुनिश्चित करें कि आपका बैंक खाता तरंग इन्वेस्ट के साथ लिंक है।


    1. हमें वह म्यूचुअल फंड योजना बताएं जिसमें आप निवेश करना चाहते हैं और अपनी मासिक
    निवेश राशि चुनें (न्यूनतम ₹500)।

    2. वह तारीख चुनें जिस दिन आप चाहते हैं कि आपके खाते से पैसा कटे।

    3. हम आपको एक ऑटो-डेबिट मैंडेट (Auto-debit mandate) विवरण प्रदान करेंगे; आप इसे
    अपनी स्वीकृति दें।

    4. एक बार मैंडेट सत्यापित हो जाने के बाद, हम आपको पुष्टिकरण संदेश भेजेंगे कि आपकी
    SIP सक्रिय हो गई है।


    आपकी SIP के सफल सक्रियण के बाद, आपकी चुनी हुई तारीख को निवेश स्वचालित रूप से होने
    लगेगा। यदि आप भविष्य में निवेश रोकना चाहते हैं, तो आप इसे अधिकतम 6 महीने के लिए
    पॉज़ कर सकते हैं।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 4d6d8ce4-eb16-56a7-b10c-3bcf63ed6210
  title: म्यूचुअल फंड SIP — शुल्क अनुसूची
  body: 'म्यूचुअल फंड SIP से जुड़े शुल्क निम्नलिखित हैं:


    - निवेश शुल्क: ₹0 (कोई अग्रिम शुल्क नहीं)।

    - एग्जिट लोड: 1% (केवल तभी लागू जब निवेश के 365 दिनों के भीतर निकासी की जाए)।

    - SIP पॉज़ शुल्क: ₹0 (अधिकतम 6 महीने तक के लिए)।


    हमारे सभी शुल्क बुनियादी बुनियादी ढांचे के रखरखाव और विनियामक लागतों को कवर करने
    के लिए लिए जाते हैं। विस्तृत नियमों के लिए म्यूचुअल फंड SIP — सिंहावलोकन देखें।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: fee_schedule
