- id: 96695124-8ff0-5cfd-bb60-90a8ef71b588
  title: update_beneficiary का उपयोग कब करें
  body: 'जब कोई ग्राहक अपने निवेश खातों में नामांकित व्यक्ति (Nominee) की जानकारी
    बदलना चाहता है या नया लाभार्थी जोड़ना चाहता है, तो इस प्रक्रिया का पालन करें।
    यह सुरक्षा और विरासत नियोजन के लिए महत्वपूर्ण है।


    **प्रक्रिया के चरण:**

    1. सबसे पहले, ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके ग्राहक के खाते की ID (account_id) का पता लगाएं।

    3. ग्राहक से नए लाभार्थी का विवरण (नाम, संबंध और जन्म तिथि) मांगें।

    4. विवरणों की पुष्टि करने के बाद, update_beneficiary टूल का उपयोग करके जानकारी
    अपडेट करें।


    कृपया ध्यान दें कि किसी भी बदलाव के लिए बहु-स्तरीय प्रमाणीकरण अनिवार्य है ताकि
    डेटा गोपनीयता बनी रहे।'
  domain: brokerage_investing
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: tarang_invest
- id: f145b9f7-0b6d-53e5-b0cc-8116b8179a61
  title: update_beneficiary टूल संदर्भ
  body: 'यह टूल एजेंट को किसी ग्राहक के खाते में लाभार्थी या नामांकित व्यक्ति की जानकारी
    को अपडेट करने की अनुमति देता है। एजेंट इस कार्रवाई को सीधे update_beneficiary
    टूल कॉल करके पूरा करता है।


