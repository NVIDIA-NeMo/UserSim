- id: a8a87ff5-1be3-5edc-ade7-2c3539f71db3
  title: म्यूचुअल फंड SIP — 365 दिनों के भीतर एग्जिट लोड की व्याख्या
  body: 'प्रश्न: यदि मैं अपनी SIP राशि 365 दिनों से पहले निकालता हूँ, तो क्या कोई
    शुल्क लगेगा?

    उत्तर: हाँ, यदि आप निवेश की तारीख से 365 दिनों के भीतर म्यूचुअल फंड से पैसा निकालते
    हैं, तो 1% का एग्जिट लोड शुल्क लिया जाएगा। यह शुल्क फंड हाउस द्वारा निवेश को अल्पकालिक
    निकासी से बचाने के लिए लगाया जाता है।


    अधिक जानकारी के लिए कृपया ''म्यूचुअल फंड SIP — शुल्क अनुसूची'' देखें।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
