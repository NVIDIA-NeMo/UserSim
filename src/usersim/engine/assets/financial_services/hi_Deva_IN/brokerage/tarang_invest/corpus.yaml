- id: 2b27e587-42a3-5186-b5d7-eb9c529614a1
  title: म्यूचुअल फंड SIP — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: आप अपने म्यूचुअल फंड SIP पोर्टफोलियो को एक्सेस नहीं कर पा रहे हैं
    या लॉगिन के दौरान त्रुटि संदेश प्राप्त हो रहा है।


    संभावित कारण:

    - गलत क्रेडेंशियल्स का उपयोग।

    - बहु-स्तरीय प्रमाणीकरण (MFA) विफल होना।

    - विनियामक अपडेट के कारण खाते का अस्थायी फ्रीज होना।


    जांच और समाधान:

    1. सुनिश्चित करें कि आप सही पंजीकृत ईमेल और पासवर्ड का उपयोग कर रहे हैं।

    2. यदि ओटीपी प्राप्त नहीं हो रहा है, तो अपने नेटवर्क कनेक्शन की जांच करें और पुनः
    प्रयास करें।

    3. यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके केवाईसी दस्तावेजों की वैधता
    की जांच करेंगे।


    समाधान और एस्केलेशन:

    यदि समस्या तकनीकी है, तो हम इसे अपनी तकनीकी टीम को भेजेंगे। यदि समस्या अनुपालन
    से जुड़ी है, तो मामला वरिष्ठ अनुपालन अधिकारियों को भेजा जाएगा। आपको 3-5 कार्यदिवस
    के भीतर समाधान या स्थिति अपडेट प्राप्त होगा।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
