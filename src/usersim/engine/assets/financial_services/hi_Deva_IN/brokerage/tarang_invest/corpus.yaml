  title: मार्जिन ट्रेडिंग सुविधा (MTF) — खाता अनुबंध
  body: 'यह अनुबंध तरंग इन्वेस्ट और ग्राहक के बीच मार्जिन ट्रेडिंग सुविधा (MTF) के
