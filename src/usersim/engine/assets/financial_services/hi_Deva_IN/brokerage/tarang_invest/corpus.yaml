- id: 262eb21b-ac84-5b69-b549-7c8de9ccfe41
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'मार्जिन ट्रेडिंग सुविधा (MTF) का उपयोग करते समय कुछ महत्वपूर्ण सीमाएँ और
    प्रतिबंध लागू होते हैं जिन्हें समझना आवश्यक है:


    1. न्यूनतम मार्जिन आवश्यकता: किसी भी मार्जिन ट्रेड को शुरू करने के लिए आपको कम
    से कम 25% न्यूनतम मार्जिन बनाए रखना होगा। यदि आपके पोर्टफोलियो का मूल्य गिरता
    है और मार्जिन इस स्तर से नीचे चला जाता है, तो आपको तुरंत अतिरिक्त फंड जमा करना
    होगा या पोजीशन बेचनी होगी।


    2. ब्याज दर: इस सुविधा के तहत ली गई उधार पूंजी पर 14.99% की वार्षिक ब्याज दर लागू
    होती है। यह शुल्क आपकी शुद्ध कमाई को प्रभावित कर सकता है।


    3. गिरवी शुल्क: प्रत्येक स्क्रिप (शेयर) को गिरवी रखने के लिए ₹20 का प्रति स्क्रिप
    गिरवी शुल्क लिया जाता है।


    4. प्रतिबंध: सभी शेयर मार्जिन ट्रेडिंग के लिए उपलब्ध नहीं होते हैं। केवल विनियामक
    मानदंडों और हमारी जोखिम नीति के अनुसार स्वीकृत शेयरों का ही MTF के तहत व्यापार
    किया जा सकता है।


    5. अपवाद: बाजार में अत्यधिक अस्थिरता के दौरान, हम बिना किसी पूर्व सूचना के मार्जिन
    सीमाओं को संशोधित कर सकते हैं या कुछ शेयरों पर MTF सुविधा को अस्थायी रूप से रोक
    सकते हैं।'
