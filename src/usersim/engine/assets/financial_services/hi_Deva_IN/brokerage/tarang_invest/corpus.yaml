- id: 2776adeb-4899-5f41-9afa-794dfceae5f2
  title: म्यूचुअल फंड SIP — खाता अनुबंध
  body: 'यह अनुबंध तरंग इन्वेस्ट और निवेशक के बीच म्यूचुअल फंड SIP सेवाओं के उपयोग
    को नियंत्रित करता है।


    1. निवेश प्रतिबद्धता: निवेशक सहमत है कि वह न्यूनतम SIP राशि ₹500 के साथ निवेश
    शुरू करेगा।

    2. निकासी और शुल्क: यदि निवेशक 365 दिनों के भीतर अपनी निवेशित राशि निकालता है,
    तो उस पर 1% का एग्जिट लोड लागू होगा।

    3. SIP स्थगन: निवेशक अपनी SIP को अधिकतम 6 माह की अवधि के लिए रोक (pause) सकता
    है। इस सीमा से अधिक समय तक रोक रखने पर SIP बंद मानी जा सकती है।

    4. शुल्क संरचना: हमारा शुल्क ढांचा पारदर्शिता पर आधारित है, जिसका उद्देश्य बुनियादी
    ढांचे के रखरखाव और विनियामक लागतों को कवर करना है।

    5. विनियामक अनुपालन: हम SEBI और AMFI के दिशा-निर्देशों का सख्ती से पालन करते हैं।

    6. अनुबंध की समाप्ति: यह अनुबंध निवेशक द्वारा लिखित अनुरोध या विनियामक उल्लंघन
    के मामले में तरंग इन्वेस्ट द्वारा समाप्त किया जा सकता है।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
