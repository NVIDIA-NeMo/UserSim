- id: ef92352c-448d-52be-a42f-2048dce0afea
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — वार्षिक ब्याज दर की व्याख्या
  body: 'प्रश्न: मार्जिन ट्रेडिंग सुविधा (MTF) के लिए ब्याज की गणना कैसे की जाती है?

    उत्तर: जब आप MTF का उपयोग करते हैं, तो तरंग इन्वेस्ट द्वारा प्रदान की गई उधार
    राशि पर 14.99% की वार्षिक ब्याज दर लागू होती है। यह ब्याज उस राशि पर लगता है जिसे
    आपने फंडेड पोजीशन के रूप में रखा है।


    प्रश्न: क्या यह दर सभी ग्राहकों के लिए समान है?

    उत्तर: हाँ, वर्तमान में सभी पात्र खातों के लिए 14.99% की एक समान वार्षिक ब्याज
    दर निर्धारित है। अधिक जानकारी के लिए मार्जिन ट्रेडिंग सुविधा (MTF) — ब्याज दर
    अनुसूची देखें।'
