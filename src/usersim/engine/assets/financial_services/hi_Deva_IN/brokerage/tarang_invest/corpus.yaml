- id: 547fd296-86e6-5018-86bd-c167a1ea059b
  title: म्यूचुअल फंड SIP — गोपनीयता और डेटा प्रबंधन
  body: 'तरंग इन्वेस्ट आपके निवेश डेटा की गोपनीयता और सुरक्षा के लिए प्रतिबद्ध है।
    हम SEBI, AMFI, NSE और BSE के दिशा-निर्देशों का सख्ती से पालन करते हैं।


    डेटा प्रबंधन सिद्धांत:

    1. डेटा संग्रहण: हम केवल वही जानकारी एकत्र करते हैं जो केवाईसी और विनियामक रिपोर्टिंग
    के लिए आवश्यक है।

    2. सुरक्षा: हम डेटा सुरक्षा के लिए ''जीरो-ट्रस्ट'' मॉडल और बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) का उपयोग करते हैं ताकि यह सुनिश्चित हो सके कि केवल
    अधिकृत उपयोगकर्ता ही आपके म्यूचुअल फंड SIP विवरण तक पहुँच सकें।

    3. प्रकटीकरण: हम आपका व्यक्तिगत डेटा किसी तीसरे पक्ष को नहीं बेचते हैं। डेटा केवल
    विनियामक अधिकारियों या कानूनी आदेश के तहत साझा किया जाता है।

    4. पारदर्शिता: निवेशक अपनी डेटा गोपनीयता सेटिंग्स और साझा किए गए विवरणों के बारे
    में अनुरोध कर सकते हैं।


    हमारा लक्ष्य तकनीक-संचालित पहुंच और लागत-कुशल ट्रेडिंग के माध्यम से आपको एक पारदर्शी
    अनुभव प्रदान करना है।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
