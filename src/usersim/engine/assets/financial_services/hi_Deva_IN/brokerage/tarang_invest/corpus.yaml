- id: 028dbb21-17e3-5016-94c8-59976852c309
  title: ELSS टैक्स-सेवर फंड — खाता अनुबंध
  body: 'यह अनुबंध तरंग इन्वेस्ट और निवेशक के बीच ELSS टैक्स-सेवर फंड के प्रबंधन के
    लिए है। निवेशक की यह बाध्यता है कि वह निवेश के लिए न्यूनतम ₹500 की राशि प्रदान
    करे।


    मुख्य शर्तें:

    1. लॉक-इन अवधि: इस फंड में निवेश की गई राशि 3 वर्ष की अनिवार्य लॉक-इन अवधि के
    अधीन है। इस अवधि से पहले धन निकालना कानूनी रूप से प्रतिबंधित है।

    2. टैक्स लाभ: निवेशक धारा 80C के तहत अधिकतम ₹150000 तक की कटौती का दावा कर सकते
    हैं।

    3. शुल्क: सभी शुल्क हमारे पारदर्शी शुल्क ढांचे के अनुसार लागू होंगे, जो बुनियादी
    ढांचे के रखरखाव और विनियामक लागतों को कवर करते हैं।

    4. अनुबंध समाप्ति: लॉक-इन अवधि समाप्त होने के बाद, निवेशक पूर्ण या आंशिक निकासी
    का अनुरोध कर सकता है।


    तरंग इन्वेस्ट SEBI और AMFI के दिशा-निर्देशों का पालन करता है। हम उत्पाद की विशेषताओं
    के आधार पर अनुशंसा करते हैं और रिटर्न की गारंटी नहीं देते हैं। शर्तों में किसी
    भी बदलाव की सूचना आपको निर्धारित समय सीमा के भीतर दी जाएगी।'
