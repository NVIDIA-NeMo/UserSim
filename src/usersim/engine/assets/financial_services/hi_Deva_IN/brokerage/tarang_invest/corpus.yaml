- id: 6fc42d0b-f371-599e-9ce2-76579a0656c9
  title: ELSS टैक्स-सेवर फंड — स्थिति या इतिहास देखना
  body: 'अपने ELSS टैक्स-सेवर फंड के निवेश की वर्तमान स्थिति या पिछले लेनदेन का इतिहास
    देखने के लिए इन चरणों का पालन करें:


    1. हमें यह बताएं कि आप अपने ELSS निवेश का विवरण या स्टेटमेंट देखना चाहते हैं।

    2. हम आपसे आपके पंजीकृत खाते का विवरण और पहचान की पुष्टि के लिए बहु-स्तरीय प्रमाणीकरण
    (Multi-factor Authentication) पूरा करने का अनुरोध करेंगे।

    3. प्रमाणीकरण सफल होने के बाद, हम आपको आपके निवेश की वर्तमान वैल्यू, निवेश की
    गई कुल राशि और प्रत्येक यूनिट की लॉक-इन समाप्ति तिथि का विवरण प्रदान करेंगे।

    4. यदि आपको पिछले वित्तीय वर्षों का टैक्स स्टेटमेंट चाहिए, तो हमें विशिष्ट समय
    अवधि बताएं, और हम वह दस्तावेज़ आपको भेज देंगे।


    आपको यह पुष्टि हो जाएगी कि आपका अनुरोध पूरा हो गया है जब आपको आपके पंजीकृत ईमेल
    या चैट विंडो पर विस्तृत स्टेटमेंट प्राप्त होगा।


    बाजार जोखिमों के अधीन, सभी योजना संबंधित दस्तावेजों को ध्यान से पढ़ें।'
