- id: 6dca3f57-eed4-51fc-8c2a-02fd3280a31b
  title: ELSS टैक्स-सेवर फंड — पात्रता शर्तें
  body: "पात्रता मानदंड और परिणाम:\n\n- न्यूनतम निवेश राशि ≥ ₹500 $\rightarrow$ निवेश\
    \ स्वीकार्य है।\n- न्यूनतम निवेश राशि < ₹500 $\rightarrow$ निवेश अस्वीकृत।\n-\
    \ वैध पैन (PAN) और केवाईसी $\rightarrow$ खाता सक्रियण संभव।\n- धारा 80C निवेश\
    \ सीमा $\rightarrow$ अधिकतम ₹150000 तक की टैक्स कटौती के लिए पात्र।\n- आयु और\
    \ कानूनी स्थिति $\rightarrow$ भारतीय निवासी और वयस्क (या कानूनी अभिभावक के साथ\
    \ नाबालिग)।"
  domain: brokerage_investing
  product_category: elss_tax_saver
  document_type: eligibility_matrix
