- id: 6c4e3005-2f7a-557e-925c-46c015c34370
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके MTF रिकॉर्ड या शुल्क विवरण में कोई विसंगति है, तो
    कृपया निम्न चरणों का पालन करें:


    लक्षण: आपके द्वारा गणना किए गए ब्याज या गिरवी शुल्क और हमारे विवरण में अंतर होना।


    जांच के चरण:

    1. ब्याज गणना: जांचें कि क्या आपने 14.99% वार्षिक ब्याज दर का उपयोग किया है और
    वह केवल उधार ली गई राशि पर लागू है।

    2. गिरवी शुल्क की गिनती: पुष्टि करें कि आपके द्वारा गिरवी रखे गए शेयरों की कुल
    संख्या और ₹20 प्रति स्क्रिप शुल्क का मिलान हो रहा है या नहीं।

    3. मार्जिन स्तर: देखें कि क्या आपके खाते में 25% न्यूनतम मार्जिन बनाए रखा गया
    था या किसी समय वह उससे नीचे गया था।


    समाधान:

    - यदि गणना में त्रुटि मिलती है, तो हमें विवरण भेजें। हम पारदर्शी जांच प्रक्रिया
    का पालन करेंगे और एक निर्धारित समय सीमा के भीतर विसंगति को दूर करेंगे।

    - यदि समस्या जटिल है, तो हम इसे वरिष्ठ अनुपालन अधिकारियों को भेजेंगे जो अंतिम
    समाधान प्रदान करेंगे।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: troubleshooting
  source_authority: official
