- id: 182f1b14-28ab-55a9-9086-138f3d499134
  title: मार्जिन ट्रेडिंग सुविधा (MTF) — बदलाव या अद्यतन करना
  body: 'यदि आप अपनी मार्जिन ट्रेडिंग सुविधा (MTF) की सेटिंग्स या कोलैटरल में बदलाव
    करना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें वह विशिष्ट स्क्रिप या राशि बताएं जिसे आप अपने गिरवी रखे हुए कोलैटरल से
    हटाना या जोड़ना चाहते हैं।

    2. यदि आप नया कोलैटरल जोड़ रहे हैं, तो सुनिश्चित करें कि आपके डीमैट खाते में पर्याप्त
    शेयर उपलब्ध हैं।

    3. हम आपके अनुरोध की समीक्षा करेंगे और यह सुनिश्चित करेंगे कि बदलाव के बाद भी
    आपका न्यूनतम मार्जिन 25% से कम न हो।

    4. यदि आप नया स्क्रिप जोड़ते हैं, तो प्रति स्क्रिप ₹20 का गिरवी शुल्क आपके खाते
    से लिया जाएगा।

    5. एक बार प्रक्रिया पूरी होने पर, हम आपको अपडेटेड मार्जिन लिमिट और संशोधित कोलैटरल
    विवरण का पुष्टिकरण संदेश भेजेंगे।


    यह प्रक्रिया कार्यदिवस के दौरान भारतीय मानक समय (IST) के अनुसार पूर्ण की जाती
    है।'
  domain: brokerage_investing
  product_category: margin_trading_facility
  document_type: how_to_guide
