- id: 686c7f15-ac8c-5a89-aaa0-1198035f4d31
  title: म्यूचुअल फंड SIP — अनपेक्षित शुल्क या राशि
  body: 'लक्षण: ग्राहक को अपने बैंक विवरण में SIP राशि से अधिक कटौती या निवेश निकासी
    के समय कम राशि प्राप्त होने की शिकायत है।


    संभावित कारण और जांच प्रक्रिया:

    1. एग्जिट लोड की जांच: क्या फंड की निकासी निवेश के 365 दिनों के भीतर की गई है?
    यदि हाँ, तो 1% एग्जिट लोड काटा गया होगा।

    2. बैंक शुल्क: जांचें कि क्या कटौती तरंग इन्वेस्ट द्वारा की गई है या आपके बैंक
    ने ऑटो-डेबिट शुल्क लगाया है।

    3. SIP राशि: पुष्टि करें कि क्या आपने हाल ही में SIP राशि में कोई बदलाव किया था।


    समाधान:

    यदि शुल्क 1% एग्जिट लोड के अनुरूप है, तो यह उत्पाद की शर्तों के अनुसार है। यदि
    शुल्क गलत प्रतीत होता है, तो हम मामले की पारदर्शी जांच करेंगे।


    एस्केलेशन: यदि समस्या का समाधान प्रथम स्तर पर नहीं होता है, तो हम मामले को वरिष्ठ
    अनुपालन अधिकारियों को भेजेंगे, जो एक निर्धारित समय सीमा के भीतर समाधान प्रदान
    करेंगे।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: tarang_invest
- id: 1d93f34f-1fa4-55a2-92b4-11f74be19d09
  title: म्यूचुअल फंड SIP — आवश्यक दस्तावेज़
  body: 'म्यूचुअल फंड SIP शुरू करने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पैन कार्ड (PAN Card) -> अनिवार्य (KYC के लिए)

    - आधार कार्ड (Aadhaar Card) -> पते के प्रमाण और ई-केवाईसी के लिए

    - बैंक खाता विवरण (Cancelled Cheque/Bank Statement) -> ₹500 की न्यूनतम SIP राशि
    के ऑटो-डेबिट सेटअप के लिए

    - पासपोर्ट साइज फोटो -> डिजिटल केवाईसी प्रक्रिया के लिए


    इन सभी दस्तावेजों के सत्यापन के बाद ही आपका निवेश खाता सक्रिय किया जाएगा।'
  domain: brokerage_investing
  product_category: mutual_fund_sip
  document_type: eligibility_matrix
  source_authority: official
