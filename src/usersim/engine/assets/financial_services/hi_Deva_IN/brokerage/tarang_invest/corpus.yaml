- id: 104c3ab7-e863-50f0-8bd6-b38872a1542f
  title: ELSS टैक्स-सेवर फंड — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'ELSS टैक्स-सेवर फंड में निवेश को प्रबंधित करने के लिए निम्नलिखित चरणों का
    पालन करें:


    1. अपनी निवेश स्थिति की जाँच करें: सबसे पहले यह सुनिश्चित करें कि आपके निवेश की
    3 वर्ष की लॉक-इन अवधि पूरी हो चुकी है। लॉक-इन अवधि से पहले निवेश रद्द करना या
    बंद करना संभव नहीं है।

    2. निकासी अनुरोध दें: यदि अवधि पूरी हो गई है, तो हमें अपनी यूनिट्स को रिडीम (redeem)
    करने का अनुरोध भेजें।

    3. विवरण सत्यापित करें: हम आपसे आपके बैंक खाते और यूनिट विवरण की पुष्टि करने के
    लिए कहेंगे।

    4. पुष्टि प्राप्त करें: एक बार अनुरोध संसाधित हो जाने के बाद, हम आपको रिडेम्पशन
    राशि और ट्रांजेक्शन विवरण के साथ एक पुष्टिकरण संदेश भेजेंगे।


    यदि आप भविष्य के लिए कोई नियमित निवेश (SIP) बंद करना चाहते हैं, तो बस हमें SIP
    रोकने का निर्देश दें; हम इसे अगले चक्र से पहले बंद कर देंगे और आपको इसकी पुष्टि
    भेजेंगे।'
