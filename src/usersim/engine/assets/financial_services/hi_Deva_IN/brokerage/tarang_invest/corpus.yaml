- id: 6c11f841-55ba-5f0b-a518-b289a86b44ed
  title: डीमैट और ट्रेडिंग खाता — आवश्यक दस्तावेज़
  body: 'डीमैट और ट्रेडिंग खाता खोलने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पैन कार्ड (PAN Card) -> अनिवार्य (पहचान और टैक्स उद्देश्यों के लिए)

    - आधार कार्ड (Aadhaar Card) -> अनिवार्य (e-KYC और पते के प्रमाण के लिए)

    - बैंक विवरण/कैंसिल चेक -> अनिवार्य (फंड ट्रांसफर के लिए)

    - पासपोर्ट साइज फोटो -> अनिवार्य (डिजिटल सत्यापन के लिए)


    इन सभी दस्तावेज़ों के सत्यापन के बाद ही खाता सक्रिय किया जाएगा।'
  domain: brokerage_investing
  product_category: demat_trading_account
  document_type: eligibility_matrix
