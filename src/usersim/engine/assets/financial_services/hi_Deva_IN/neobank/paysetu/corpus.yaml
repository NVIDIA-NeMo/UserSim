- id: 1a810cc4-0c3d-5a19-8de4-e4c73beeddc4
  title: पेसेतु डिजिटल बचत खाता — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'पेसेतु डिजिटल बचत खाता आधुनिक बैंकिंग को सरल बनाने के लिए डिज़ाइन किया गया
    है, लेकिन इसकी कुछ परिचालन सीमाएँ और शर्तें हैं जिन्हें समझना आवश्यक है।


    मुख्य सीमाएँ और प्रतिबंध:

    1. KYC स्तर: खाते की पूर्ण कार्यक्षमता और उच्च लेनदेन सीमाएँ केवल Full-KYC पूरा
    होने के बाद ही उपलब्ध होती हैं।

    2. समय सीमा: खाता खोलने के बाद, Full-KYC प्रक्रिया को पूरा करने के लिए 30 दिन
    की निर्धारित अवधि होती है। इस अवधि के भीतर सत्यापन पूरा न करने पर खाते की सेवाओं
    पर प्रतिबंध लग सकता है।

    3. न्यूनतम शेष: इस खाते में न्यूनतम शेष राशि की आवश्यकता ₹0 है, जिसका अर्थ है
    कि कम बैलेंस के लिए कोई जुर्माना नहीं लगाया जाता है।

    4. ब्याज दर: खाते पर 3.5% की वार्षिक बचत ब्याज दर लागू होती है।


    अपवाद स्थितियाँ: यदि कोई खाता संदिग्ध गतिविधि या नियामक अनुपालन (compliance) के
    अभाव में पाया जाता है, तो पेसेतु सुरक्षा कारणों से लेनदेन को अस्थायी रूप से अवरुद्ध
    कर सकता है।


    डिस्क्लेमर: हम RBI और NPCI के दिशा-निर्देशों का सख्ती से पालन करते हैं।'
