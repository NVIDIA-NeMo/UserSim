- id: 2b428998-d786-5543-ac6c-0ca87f655afe
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड के उपयोग के लिए कुछ महत्वपूर्ण सीमाएँ और शर्तें
    निर्धारित हैं जिन्हें एजेंटों को ग्राहकों को स्पष्ट करना चाहिए। कार्ड का उपयोग
    केवल उन्हीं सेवाओं के लिए किया जा सकता है जो प्रीपेड फॉरेक्स नियमों के अंतर्गत
    आती हैं।


    शुल्क संरचना और सीमाएँ:

    - कार्ड जारी करने का शुल्क (Issuance Fee): ₹150

    - कार्ड रीलोड करने का शुल्क (Reload Fee): ₹100

    - क्रॉस-करेंसी मार्कअप: 2%

    - विदेश में ATM निकासी शुल्क: ₹200 प्रति लेनदेन


    प्रतिबंध और अपवाद:

    1. कार्ड का उपयोग केवल प्रमाणित KYC स्तरों के आधार पर ही किया जा सकता है। बिना
    पूर्ण सत्यापन के उच्च लेनदेन सीमाएं उपलब्ध नहीं होंगी।

    2. कुछ देशों या विशिष्ट मर्चेंट श्रेणियों में स्थानीय नियमों के कारण कार्ड अस्वीकार
    किया जा सकता है।

    3. यह कार्ड ऋण सुविधा प्रदान नहीं करता है; आप केवल उतनी ही राशि खर्च कर सकते हैं
    जितनी आपने लोड की है।


    विफल लेनदेन के मामलों में, हम RBI के सामंजस्यपूर्ण टर्न-अराउंड समय (TAT) का पालन
    करते हैं।'
  domain: cards
  product_category: prepaid_forex_card
