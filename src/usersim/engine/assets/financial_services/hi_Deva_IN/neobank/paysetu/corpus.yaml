- id: b937d4cf-5d18-5c69-a6fb-8aa7badd8702
  title: पेसेतु डिजिटल बचत खाता — सिंहावलोकन
  body: 'पेसेतु डिजिटल बचत खाता एक आधुनिक, डिजिटल-फर्स्ट बचत समाधान है जिसे तकनीकी
    रूप से जागरूक युवाओं और डिजिटल प्रवासियों के लिए डिज़ाइन किया गया है। यह खाता
    शून्य शेष राशि की सुविधा के साथ आता है, जिसका अर्थ है कि न्यूनतम शेष राशि ₹0 है,
    जिससे आप बिना किसी वित्तीय दबाव के अपनी बचत शुरू कर सकते हैं।


    मुख्य विशेषताएं:

    - ब्याज दर: आपके जमा धन पर 3.5% की वार्षिक ब्याज दर प्रदान की जाती है।

    - न्यूनतम बैलेंस: ₹0 का न्यूनतम शेष, जिसका अर्थ है कि कोई न्यूनतम बैलेंस बनाए
    रखने का दबाव नहीं है।

    - आसान ऑनबोर्डिंग: डिजिटल प्रक्रिया के माध्यम से खाता खोलें और पूर्ण KYC प्रक्रिया
    को 30 दिनों के भीतर पूरा करें ताकि उच्च लेनदेन सीमाएं प्राप्त की जा सकें।


    यह खाता उन लोगों के लिए आदर्श है जो ऋण के बजाय निर्बाध भुगतान और सुरक्षित बचत
    को प्राथमिकता देते हैं। हम RBI के दिशा-निर्देशों का पालन करते हैं और आपका जमा
    DICGC बीमा के तहत ₹5,00,000 तक सुरक्षित है।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं।'
  domain: retail_banking
  product_category: digital_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: c4a47d81-9c25-57c3-a8f5-9ef46f5db712
  title: पेसेतु डिजिटल बचत खाता — न्यूनतम शेष की व्याख्या
  body: 'प्रश्न: क्या मुझे अपने पेसेतु डिजिटल बचत खाता में कोई न्यूनतम राशि रखनी होगी?

    उत्तर: नहीं, हमारे इस खाते के लिए न्यूनतम शेष राशि ₹0 है। आपको खाते को सक्रिय
    रखने के लिए कोई न्यूनतम बैलेंस बनाए रखने की आवश्यकता नहीं है।


    प्रश्न: यदि मेरा बैलेंस ₹0 हो जाता है, तो क्या मुझ पर कोई जुर्माना लगेगा?

    उत्तर: नहीं, ₹0 न्यूनतम शेष राशि की नीति के कारण, बैलेंस कम होने पर कोई जुर्माना
    या शुल्क नहीं लगाया जाता है। अधिक जानकारी के लिए ''पेसेतु डिजिटल बचत खाता — शुल्क
    अनुसूची'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 0f6fe76e-e594-56b5-96cd-3ca991f8469d
  title: पेसेतु डिजिटल बचत खाता — सेटअप और सक्रियण
  body: 'पेसेतु डिजिटल बचत खाता सेटअप करने के लिए इन चरणों का पालन करें:


    1. अपनी बुनियादी पहचान जानकारी और मोबाइल नंबर प्रदान करें। हम आपके विवरण का सत्यापन
    करेंगे और आपके खाते का प्रारंभिक सेटअप पूरा करेंगे।

    2. अपनी डिजिटल पहचान के लिए आवश्यक दस्तावेज़ (जैसे आधार और पैन) साझा करें।

    3. हम आपके दस्तावेज़ों की समीक्षा करेंगे और आपके खाते को सक्रिय करेंगे। अब आप
    ₹0 न्यूनतम शेष राशि के साथ बैंकिंग शुरू कर सकते हैं।

    4. उच्च लेनदेन सीमाओं को अनलॉक करने के लिए, अगले 30 दिनों के भीतर अपनी Full-KYC
    प्रक्रिया पूरी करें।

    5. एक बार जब हम Full-KYC की पुष्टि कर देते हैं, तो आपको सूचित किया जाएगा कि आपकी
    उच्च सीमाएं अब प्रभावी हैं।


    सफलता की पहचान: जब आपको ऐप में ''खाता सक्रिय'' का संदेश मिले और आप अपना बैलेंस
    देख सकें, तो समझें कि सेटअप पूरा हो गया है।'
  domain: retail_banking
  product_category: digital_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
