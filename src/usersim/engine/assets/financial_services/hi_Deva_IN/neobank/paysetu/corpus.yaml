- id: d06efec8-b79e-5058-8855-f1814fabbe13
  title: पेसेतु डिजिटल बचत खाता — स्थिति या इतिहास देखना
  body: 'अपने पेसेतु डिजिटल बचत खाता का वर्तमान बैलेंस और लेनदेन इतिहास देखने के लिए
    इन चरणों का पालन करें:


    1. हमें बताएं कि आप अपने खाते का विवरण या स्टेटमेंट देखना चाहते हैं।

    2. हम आपकी पहचान सत्यापित करने के लिए एक संक्षिप्त सत्यापन प्रक्रिया शुरू करेंगे।

    3. सत्यापन सफल होने के बाद, हम आपको आपके खाते का वर्तमान बैलेंस (जो ₹0 या उससे
    अधिक हो सकता है) प्रदर्शित करेंगे।

    4. यदि आप लेनदेन इतिहास चाहते हैं, तो हमें वह समय अवधि (जैसे पिछले 30 दिन) बताएं
    जिसका विवरण आप देखना चाहते हैं।

    5. हम आपके अनुरोधित समय अवधि के सभी लेनदेन का विस्तृत विवरण प्रदान करेंगे, जिसमें
    प्रत्येक लेनदेन की राशि, तिथि और स्थिति शामिल होगी।


    यह प्रक्रिया पूरी होने पर आपको अपने सभी वित्तीय लेनदेन का स्पष्ट और पारदर्शी विवरण
    मिल जाएगा।'
  domain: retail_banking
  product_category: digital_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 5397d744-9ca9-56cc-9b86-9cb52cb88c2d
  title: पेसेतु डिजिटल बचत खाता — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: जब आप लेनदेन करने या खाता विवरण बदलने का प्रयास करते हैं, तो आपको
    ''Action Declined'' या ''Account Blocked'' का संदेश मिलता है।


    संभावित कारण:

    - Full-KYC अधूरा होना: यदि खाता खोलने के 30 दिन बीत चुके हैं और Full-KYC पूरा
    नहीं हुआ है।

    - सुरक्षा लॉक: संदिग्ध लेनदेन गतिविधि के कारण सुरक्षा कारणों से खाता अवरुद्ध किया
    गया हो।

    - गलत विवरण: पहचान सत्यापन के दौरान प्रदान की गई जानकारी का मेल न खाना।


    समाधान के चरण:

    1. पहले जांचें कि क्या आपने अपनी Full-KYC प्रक्रिया पूरी कर ली है।

    2. यदि KYC लंबित है, तो हमें आवश्यक पहचान और पते के प्रमाण प्रदान करें।

    3. यदि खाता सुरक्षा कारणों से अवरुद्ध है, तो हमें अपनी पहचान सत्यापित करने के
    लिए कहें।


    यदि समस्या बनी रहती है, तो हम मामले को आंतरिक विशेषज्ञों के पास भेजेंगे। समाधान
    के लिए RBI के सामंजस्यपूर्ण TAT (Turn-around-Time) का पालन किया जाएगा।'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
