- id: f62c5516-b249-5ef5-9f98-6026c44281f6
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — पात्रता श्रेणियाँ
  body: 'पात्रता शर्तें और परिणाम:

    - न्यूनतम KYC पूरा ग्राहक -> कार्ड जारी करने की अनुमति (सीमित लेनदेन सीमाएं)।

    - Full-KYC पूरा ग्राहक -> कार्ड जारी करने की अनुमति (उच्च लेनदेन सीमाएं)।

    - भारतीय निवासी (वैध पासपोर्ट धारक) -> अंतरराष्ट्रीय मुद्रा लोड करने की पात्रता।

    - गैर-अनुपालन दस्तावेज़ -> आवेदन अस्वीकृत।'
