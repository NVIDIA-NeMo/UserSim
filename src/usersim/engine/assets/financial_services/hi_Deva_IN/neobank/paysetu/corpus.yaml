- id: d7ac71e6-8972-5609-adcd-c07285cd9768
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — बदलाव या अद्यतन करना
  body: 'अपने पेसेतु प्रीपेड फॉरेक्स कार्ड से जुड़े विवरणों को अपडेट करने के लिए इन
    चरणों का पालन करें:


    1. हमें वह विवरण बताएं जिसे आप बदलना चाहते हैं (जैसे संपर्क नंबर या पता)।

    2. पहचान सत्यापन के लिए आवश्यक दस्तावेज़ प्रदान करें। सुरक्षा कारणों से, विवरण
    में किसी भी बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य है।

    3. हम आपके दस्तावेज़ों की समीक्षा करेंगे और सत्यापन पूरा होने पर आपको पुष्टिकरण
    भेजेंगे।

    4. एक बार सत्यापित होने के बाद, आपके खाते में अपडेट प्रभावी हो जाएगा और आपको ऐप
    में एक सफल अद्यतन का संदेश दिखाई देगा।


    ध्यान दें: यदि आप अपनी लेनदेन सीमा बढ़ाना चाहते हैं, तो आपको Full-KYC प्रक्रिया
    पूरी करनी होगी, जिसके बाद ही उच्च सीमाएं प्रदान की जाती हैं।'
  domain: cards
