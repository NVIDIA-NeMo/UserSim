- id: 8935f9a1-6b40-569c-a656-7ea52413e218
  title: पेसेतु वॉलेट और UPI — UPI प्रति लेनदेन सीमा की व्याख्या
  body: 'प्रश्न: मैं एक बार में अधिकतम कितनी राशि भेज सकता हूँ?

    उत्तर: पेसेतु वॉलेट और UPI के माध्यम से आप प्रति लेनदेन ₹100000 तक की राशि भेज
    सकते हैं। यह सीमा सुरक्षा और नियामक मानकों को सुनिश्चित करने के लिए निर्धारित
    की गई है।


    प्रश्न: क्या यह सीमा मेरे KYC स्तर पर निर्भर करती है?

    उत्तर: नहीं, ₹100000 की प्रति लेनदेन सीमा सभी सत्यापित उपयोगकर्ताओं के लिए समान
    है, हालांकि आपके वॉलेट में रखे जा सकने वाले कुल बैलेंस की सीमा आपके KYC स्तर (न्यूनतम
    या Full-KYC) पर निर्भर करती है। अधिक जानकारी के लिए पेसेतु वॉलेट और UPI — सिंहावलोकन
    देखें।'
  domain: payments
  product_category: upi_wallet
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 9a680eef-1724-5a4e-abc0-b1b3993c7234
  title: पेसेतु वॉलेट और UPI — बदलाव या अद्यतन करना
  body: 'अपने पेसेतु वॉलेट और UPI विवरणों को अद्यतन करने के लिए इन चरणों का पालन करें:


    1. अनुरोध करें: हमें बताएं कि आप कौन सी जानकारी (जैसे मोबाइल नंबर, ईमेल या पता)
    बदलना चाहते हैं।

    2. पहचान सत्यापन: सुरक्षा के लिए, हम आपसे आपकी पहचान सत्यापित करने के लिए कुछ
    विवरण या दस्तावेज़ मांगेंगे। याद रखें, हम कभी भी आपका PIN या OTP नहीं मांगते हैं।

    3. दस्तावेज़ जमा करना: यदि आप न्यूनतम KYC से Full-KYC पर अपग्रेड करना चाहते हैं,
    तो अपने पूर्ण पहचान और पते के प्रमाण प्रदान करें। इससे आपकी वॉलेट बैलेंस सीमा
    ₹10000 से बढ़कर ₹200000 हो जाएगी।

    4. पुष्टि: हमारी टीम विवरणों की जांच करेगी और अपडेट पूरा होने पर आपको एक पुष्टिकरण
    संदेश भेजा जाएगा।


    एक बार अद्यतन होने के बाद, आप अपनी नई सीमाओं और विवरणों का उपयोग तुरंत शुरू कर
    सकते हैं।'
  domain: payments
  product_category: upi_wallet
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: ad4366b3-9d92-5b37-81dd-22e61f60eef7
  title: पेसेतु वॉलेट और UPI — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने पेसेतु वॉलेट और UPI खाते में लॉगिन नहीं कर पा रहे हैं, तो कृपया
    निम्नलिखित जांचें:


    लक्षण: ''गलत क्रेडेंशियल'' त्रुटि या ऐप का लॉगिन स्क्रीन पर अटक जाना।


    जांच और समाधान:

    1. नेटवर्क कनेक्शन: सुनिश्चित करें कि आपका इंटरनेट सक्रिय है।

    2. ऐप अपडेट: जांचें कि आप ऐप का नवीनतम संस्करण उपयोग कर रहे हैं।

    3. सिम सत्यापन: सुनिश्चित करें कि आपका पंजीकृत मोबाइल नंबर उसी फोन में है जिससे
    आप लॉगिन कर रहे हैं।


    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति की जांच करेंगे
    और यदि आवश्यक हो, तो सुरक्षा सत्यापन के बाद आपका एक्सेस बहाल करेंगे। जटिल मुद्दों
    के लिए, हम मामले को आंतरिक विशेषज्ञों के पास भेजेंगे। यदि समाधान संतोषजनक नहीं
    है, तो आप नियामक लोकपाल (Ombudsman) से संपर्क कर सकते हैं।


    डिस्क्लेमर: सुरक्षा कारणों से, बार-बार गलत पिन डालने पर खाता अस्थायी रूप से अवरुद्ध
    किया जा सकता है।'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 9fb03bac-57db-58eb-8bce-1dfd14f9045f
  title: पेसेतु वॉलेट और UPI — पात्रता श्रेणियाँ
  body: 'पेसेतु वॉलेट और UPI के लिए पात्रता और सीमाएं:


    - न्यूनतम KYC पूरा उपयोगकर्ता -> वॉलेट बैलेंस सीमा: ₹10000 | UPI लेनदेन सीमा:
    ₹100000

    - Full-KYC पूरा उपयोगकर्ता -> वॉलेट बैलेंस सीमा: ₹200000 | UPI लेनदेन सीमा: ₹100000

    - अपूर्ण KYC उपयोगकर्ता -> केवल सीमित डिजिटल ऑनबोर्डिंग, पूर्ण वॉलेट सेवाओं के
    लिए KYC अनिवार्य है।


    सभी श्रेणियों के लिए RBI और NPCI के दिशा-निर्देश अनिवार्य हैं।'
  domain: payments
  product_category: upi_wallet
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 3d06333c-d9d0-5fdb-b5cc-25d25d41ba1f
  title: पेसेतु वॉलेट और UPI — श्रेणियों या विकल्पों में से चुनाव
  body: 'अपनी आवश्यकता के अनुसार सही विकल्प चुनें:


    1. न्यूनतम KYC वॉलेट: उन लोगों के लिए जो त्वरित सेटअप चाहते हैं और जिनका मासिक
    खर्च कम है (बैलेंस सीमा ₹10000)।

    2. Full-KYC वॉलेट: उन उपयोगकर्ताओं के लिए जिन्हें उच्च बैलेंस रखने की आवश्यकता
    है (बैलेंस सीमा ₹200000) और अधिक लेनदेन करते हैं।


    दोनों ही विकल्पों में ₹100000 की प्रति लेनदेन UPI सीमा मिलती है। यदि आप केवल बचत
    और ब्याज पर ध्यान केंद्रित करना चाहते हैं, तो पेसेतु डिजिटल बचत खाता — सिंहावलोकन
    देखें। पेसेतु वॉलेट और UPI उन लोगों के लिए सर्वश्रेष्ठ है जो निर्बाध भुगतान और
    त्वरित वॉलेट अनुभव चाहते हैं।'
