- id: e9ca21f8-f333-52ff-be39-071b9c866598
  title: get_account_transactions का उपयोग कब करें
  body: 'जब किसी ग्राहक को उनके खाते के हालिया लेनदेन, विशिष्ट भुगतान की स्थिति, या
    स्टेटमेंट विवरण की आवश्यकता हो, तब इस प्रक्रिया का पालन करें:


    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक ने केवल अपने खाते के अंतिम 4 अंक दिए हैं, तो get_accounts टूल का
    उपयोग करके सही account_id प्राप्त करें।

    3. ग्राहक द्वारा अनुरोधित समय सीमा या विशिष्ट लेनदेन के आधार पर get_account_transactions
    टूल को कॉल करें।

    4. प्राप्त परिणामों को सरल हिंदी में ग्राहक को प्रस्तुत करें, यह सुनिश्चित करते
    हुए कि कोई संवेदनशील जानकारी (जैसे पूरा कार्ड नंबर) उजागर न हो।


    इस टूल का उपयोग केवल तभी करें जब ग्राहक ने स्पष्ट रूप से अपने लेनदेन इतिहास या
    किसी विशिष्ट डेबिट/क्रेडिट की पुष्टि मांगी हो।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: paysetu
- id: 79167a41-a1f8-5ece-8189-d272d7f894d8
  title: get_account_transactions टूल संदर्भ
  body: 'टूल: get_account_transactions

    विवरण: यह टूल एक विशिष्ट खाते के लिए लेनदेन इतिहास प्राप्त करता है।

    तर्क (Arguments): account_id (अनिवार्य), start_date (वैकल्पिक), end_date (वैकल्पिक)।

    प्रभाव: यह खाते के लेनदेन की एक सूची प्रदान करता है।

    नोट: एजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है; ग्राहक को ऐप के
    स्टेटमेंट सेक्शन में जाने के लिए निर्देशित नहीं किया जाता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
