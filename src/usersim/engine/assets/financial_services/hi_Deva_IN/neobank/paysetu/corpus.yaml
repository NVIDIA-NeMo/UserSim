- id: 5f8f8afc-f3d6-5ded-9238-0f3ac7c5fb00
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — नियामक प्रकटीकरण
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड RBI और NPCI के सभी नियामक दिशा-निर्देशों के
    अधीन है। हम डेटा गोपनीयता और ग्राहकों के निष्पक्ष उपचार के प्रति प्रतिबद्ध हैं।


    महत्वपूर्ण नियामक जानकारी:

    - शुल्क संरचना: जारी करने का शुल्क ₹150, रीलोड शुल्क ₹100, और विदेश में ATM निकासी
    पर ₹200 का शुल्क लागू है।

    - विनिमय दर: सभी लेनदेन पर 2% का क्रॉस-करेंसी मार्कअप लागू होगा।

    - सुरक्षा: किसी भी विवरण में बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य है। हम
    कभी भी UPI PIN, OTP या CVV नहीं मांगते हैं।

    - बीमा: ग्राहकों को नियामक सुरक्षा ढांचे के बारे में सूचित किया जाता है।


    किसी भी विवाद की स्थिति में, समाधान RBI के निर्धारित TAT के अनुसार किया जाएगा
    और यदि आवश्यक हो, तो मामला नियामक लोकपाल (Ombudsman) के पास भेजा जा सकता है।'
  domain: cards
  product_category: prepaid_forex_card
  document_type: disclosure
