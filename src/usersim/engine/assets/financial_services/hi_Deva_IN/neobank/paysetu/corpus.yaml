- id: 899a7897-d5c8-5b1c-b192-3dac3a998095
  title: पेसेतु वॉलेट और UPI — लागत और शुल्क
  body: 'प्रश्न: पेसेतु वॉलेट और UPI का उपयोग करने का मासिक शुल्क क्या है?

    उत्तर: हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है। बुनियादी वॉलेट
    और UPI सेवाओं के लिए कोई मासिक रखरखाव शुल्क नहीं है।


    प्रश्न: क्या लेनदेन पर कोई शुल्क लगता है?

    उत्तर: अधिकांश मानक UPI लेनदेन निःशुल्क हैं। शुल्क केवल परिचालन लागतों को कवर
    करने के लिए लिए जाते हैं। विशिष्ट उच्च-मूल्य खातों के लिए कुछ शुल्क माफ किए जा
    सकते हैं। विस्तृत जानकारी के लिए ''पेसेतु वॉलेट और UPI — शुल्क अनुसूची'' देखें।'
  domain: payments
  product_category: upi_wallet
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 2b3cc4b8-18f0-5530-865e-806a9d2e88ed
  title: पेसेतु वॉलेट और UPI — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'वॉलेट में राशि जोड़ने या सीमा बढ़ाने के एक सामान्य अनुरोध को पूरा करने के
    लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप वॉलेट में राशि जोड़ना चाहते हैं या अपना KYC स्तर अपग्रेड
    करना चाहते हैं।

    2. राशि जोड़ने के लिए, अपने स्रोत बैंक खाते का विवरण प्रदान करें और राशि बताएं।

    3. KYC अपग्रेड के लिए, अपने पहचान और पते के प्रमाण (जैसे आधार या पैन) साझा करें।

    4. हम आपके द्वारा प्रदान किए गए दस्तावेज़ों का सत्यापन करेंगे।

    5. सत्यापन सफल होने के बाद, हम पुष्टि करेंगे कि आपकी सीमा अब ₹10000 (Min-KYC)
    से बढ़कर ₹200000 (Full-KYC) हो गई है।

    6. आपको एक पुष्टिकरण संदेश प्राप्त होगा कि आपका अनुरोध पूर्ण हो गया है और अब आप
    उच्च सीमा का उपयोग कर सकते हैं।


    डिस्क्लेमर: किसी भी बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य है।'
