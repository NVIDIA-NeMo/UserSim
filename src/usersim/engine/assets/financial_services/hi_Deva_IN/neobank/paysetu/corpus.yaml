- id: 79e2641d-5a2a-593f-8d6c-99b3f0ce598d
  title: पेसेतु वॉलेट और UPI — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: "पेसेतु वॉलेट और UPI की कार्यक्षमता आपके सत्यापन स्तर (KYC) पर निर्भर करती\
    \ है। \n\nवॉलेट शेष सीमाएँ:\n- न्यूनतम KYC (Min-KYC) उपयोगकर्ताओं के लिए वॉलेट\
    \ शेष सीमा ₹10000 है।\n- पूर्ण KYC (Full-KYC) उपयोगकर्ताओं के लिए वॉलेट शेष सीमा\
    \ ₹200000 है।\n\nलेनदेन सीमाएँ:\n- UPI के माध्यम से प्रति लेनदेन सीमा ₹100000\
    \ निर्धारित है।\n\nअपवाद और प्रतिबंध:\n- बिना पूर्ण KYC के उच्च लेनदेन सीमाएं\
    \ उपलब्ध नहीं हैं।\n- सुरक्षा कारणों से, संदिग्ध गतिविधियों की पहचान होने पर अस्थायी\
    \ रूप से लेनदेन अवरुद्ध किए जा सकते हैं।\n- वॉलेट में राशि जमा करने और निकालने\
    \ की प्रक्रियाएं RBI और NPCI के दिशा-निर्देशों के अधीन हैं।\n\nडिस्क्लेमर: शुल्क\
    \ केवल परिचालन लागतों को कवर करने के लिए लिए जाते हैं।"
  domain: payments
  product_category: upi_wallet
