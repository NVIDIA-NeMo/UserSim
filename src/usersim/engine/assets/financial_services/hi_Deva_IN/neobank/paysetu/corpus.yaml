- id: 7858d604-ebdc-58f2-9b27-cf0936958535
  title: पेसेतु वॉलेट और UPI — शर्तों में बदलाव की नीति
  body: 'पेसेतु वॉलेट और UPI की सेवा शर्तों में बदलाव की नीति निम्नलिखित है:


    1. संशोधन का अधिकार: पेसेतु समय-समय पर नियामक दिशा-निर्देशों (RBI/NPCI) या परिचालन
    आवश्यकताओं के आधार पर अपनी शर्तों, सीमाओं और शुल्कों में बदलाव कर सकता है।

    2. सूचना अवधि: किसी भी महत्वपूर्ण बदलाव, जैसे कि वॉलेट बैलेंस कैप (वर्तमान में
    न्यूनतम KYC के लिए ₹10000 और पूर्ण KYC के लिए ₹200000) या UPI लेनदेन सीमा (वर्तमान
    में ₹100000) में परिवर्तन, की सूचना ग्राहकों को प्रभावी होने से 15 दिन पहले दी
    जाएगी।

    3. सहमति: अपडेट की गई शर्तों के लागू होने के बाद सेवा का निरंतर उपयोग आपकी स्वीकृति
    माना जाएगा।

    4. समाप्ति: यदि आप संशोधित शर्तों से सहमत नहीं हैं, तो आप अपना खाता बंद करने के
    लिए अनुरोध कर सकते हैं।


    हम न्यूनतम शुल्क और अधिकतम पारदर्शिता के सिद्धांत पर काम करते हैं, इसलिए किसी
    भी नए शुल्क की जानकारी स्पष्ट रूप से साझा की जाएगी।


    डिस्क्लेमर: यह एक कानूनी अनुबंध है; कृपया इसे ध्यान से पढ़ें।'
  domain: payments
  product_category: upi_wallet
  document_type: terms_conditions
