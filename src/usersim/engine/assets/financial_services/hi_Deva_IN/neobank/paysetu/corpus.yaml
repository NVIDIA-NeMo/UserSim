- id: 4eb3d12c-2399-50c2-9de8-3f248a21255b
  title: load_wallet का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने पेसेतु वॉलेट और UPI में धनराशि जोड़नी हो ताकि वे त्वरित
    भुगतान कर सकें, तब इस प्रक्रिया का पालन करें। वॉलेट लोड करने की सीमाएं ग्राहक
    के KYC स्तर पर निर्भर करती हैं।


    **प्रक्रिया:**

    1. सबसे पहले ग्राहक की पहचान सत्यापित करें।

    2. get_accounts का उपयोग करके ग्राहक का सक्रिय खाता और उपलब्ध फंड की जांच करें।

    3. ग्राहक से वह राशि पूछें जिसे वे वॉलेट में लोड करना चाहते हैं।

    4. यदि राशि उनकी KYC सीमा के भीतर है, तो load_wallet टूल का उपयोग करके फंड ट्रांसफर
    करें।

    5. सफल लेनदेन की पुष्टि ग्राहक को सूचित करें।


    अधिक जानकारी के लिए ''पेसेतु वॉलेट और UPI — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ''
    देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - load_wallet
  institution_id: paysetu
- id: 5db981d2-ad51-58fe-8d23-1cc67fc8b414
  title: load_wallet टूल संदर्भ
  body: 'यह टूल ग्राहक के बैंक खाते से उनके डिजिटल वॉलेट में धनराशि स्थानांतरित करने
    के लिए उपयोग किया जाता है। एजेंट इस प्रक्रिया को सीधे load_wallet टूल कॉल करके
    निष्पादित करता है।


    **पैरामीटर्स:**

    - `account_id`: स्रोत बैंक खाते की आईडी।

    - `wallet_id`: लक्ष्य वॉलेट की आईडी।

    - `amount`: लोड की जाने वाली राशि (₹)।


    **प्रभाव:** स्रोत खाते से राशि डेबिट होती है और वॉलेट बैलेंस में तुरंत अपडेट हो
    जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - load_wallet
  institution_id: paysetu
- id: eed23ab1-f072-55b3-9094-8c3e0e86777a
  title: freeze_upi का उपयोग कब करें
  body: 'यदि किसी ग्राहक ने अपने फोन के खोने, अनधिकृत लेनदेन के संदेह या सुरक्षा कारणों
    से अपनी UPI सेवाओं को तत्काल रोकने का अनुरोध किया है, तो इस प्रक्रिया का उपयोग
    करें।


    **प्रक्रिया:**

    1. ग्राहक की पहचान का सख्त सत्यापन (Identity Verification) करें।

    2. get_accounts का उपयोग करके संबंधित UPI आईडी और खाते की पहचान करें।

    3. सुरक्षा जोखिम को देखते हुए, तुरंत freeze_upi टूल का उपयोग करें ताकि कोई भी
    नया लेनदेन न हो सके।

    4. ग्राहक को सूचित करें कि उनकी UPI सेवाएं अब सुरक्षित रूप से फ्रीज कर दी गई हैं।

    5. ग्राहक को भविष्य में सेवाओं को पुनः सक्रिय करने की प्रक्रिया समझाएं।


    सुरक्षा युक्तियों के लिए ''पेसेतु वॉलेट और UPI — धोखाधड़ी और अनधिकृत गतिविधि से
    सुरक्षा'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_upi
  institution_id: paysetu
- id: 8a823961-f295-52b2-971e-d5802d4d5a6e
  title: freeze_upi टूल संदर्भ
  body: 'यह टूल सुरक्षा कारणों से किसी ग्राहक की UPI भुगतान क्षमताओं को तत्काल रोकने
    के लिए उपयोग किया जाता है। एजेंट इसे सीधे freeze_upi टूल कॉल करके सक्रिय करता
    है।


    **पैरामीटर्स:**

    - `upi_id`: वह विशिष्ट UPI आईडी जिसे फ्रीज किया जाना है।

    - `reason`: फ्रीज करने का कारण (जैसे: ''Lost Phone'' या ''Fraud Suspected'')।


    **प्रभाव:** संबंधित UPI आईडी से सभी आउटगोइंग लेनदेन तुरंत ब्लॉक कर दिए जाते हैं।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_upi
  institution_id: paysetu
- id: ea102ab4-a9a8-528f-bfee-ebb5950967ad
  title: get_accounts का उपयोग कब करें
  body: 'जब भी किसी ग्राहक को उनके खाते के विवरण, शेष राशि या उनके द्वारा पेसेतु के
    साथ रखे गए विभिन्न उत्पादों (जैसे बचत खाता या वॉलेट) की जानकारी चाहिए हो, तब इस
    प्रक्रिया का उपयोग करें।


    **प्रक्रिया:**

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके ग्राहक से जुड़े सभी खातों की सूची प्राप्त करें।

    3. प्राप्त जानकारी से account_id और वर्तमान बैलेंस की पुष्टि करें।

    4. ग्राहक को केवल वही विवरण प्रदान करें जो उन्होंने मांगा है, पेशेवर और पारदर्शी
    तरीके से।


    यह टूल अन्य लेनदेन संबंधी टूल्स (जैसे transfer_funds) के लिए सही खाता आईडी खोजने
    का आधार है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: paysetu
- id: a7462201-3317-5f14-8229-0df371edf870
  title: get_accounts टूल संदर्भ
  body: 'यह टूल एक ग्राहक से जुड़े सभी सक्रिय वित्तीय खातों और उनके वर्तमान बैलेंस
    की जानकारी प्राप्त करने के लिए उपयोग किया जाता है। एजेंट इसे सीधे get_accounts
    टूल कॉल करके निष्पादित करता है।


    **पैरामीटर्स:**

    - `customer_id`: ग्राहक की विशिष्ट पहचान संख्या।


    **प्रभाव:** यह टूल ग्राहक के सभी खातों (जैसे डिजिटल बचत खाता और वॉलेट) की एक सूची
    और उनकी वर्तमान स्थिति प्रदान करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: paysetu
- id: 9233d3c6-712a-5f0c-8755-941ee0ea6be3
  title: open_account का उपयोग कब करें
  body: 'जब कोई नया या मौजूदा ग्राहक पेसेतु के किसी उत्पाद (जैसे पेसेतु डिजिटल बचत
    खाता या पेसेतु वॉलेट और UPI) में खाता खोलने का अनुरोध करता है, तब इस प्रक्रिया
    का पालन करें।


    **प्रक्रिया:**

    1. ग्राहक की पात्रता की जांच करें (पात्रता मैट्रिक्स देखें)।

    2. आवश्यक KYC दस्तावेज़ों की उपलब्धता सुनिश्चित करें।

    3. ग्राहक से पसंदीदा उत्पाद प्रकार (product_id) की पुष्टि करें।

    4. open_account टूल का उपयोग करके डिजिटल खाता खोलने की प्रक्रिया शुरू करें।

    5. ग्राहक को उनके नए खाते की आईडी और सक्रियण चरणों के बारे में सूचित करें।


    शुरुआत करने के तरीके के लिए ''पेसेतु डिजिटल बचत खाता — शुरुआत कैसे करें'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: paysetu
- id: d09665e4-e658-5758-8b73-9e79b2d90c81
  title: open_account टूल संदर्भ
  body: 'यह टूल पेसेतु के भीतर एक नया डिजिटल वित्तीय खाता बनाने के लिए उपयोग किया
    जाता है। एजेंट इस क्रिया को सीधे open_account टूल कॉल करके पूरा करता है।


    **पैरामीटर्स:**

    - `customer_id`: ग्राहक की पहचान संख्या।

    - `product_id`: उत्पाद की आईडी (जैसे: ''digital_savings'' या ''upi_wallet'')।

    - `initial_deposit`: यदि कोई प्रारंभिक जमा राशि है (₹)।


    **प्रभाव:** एक नया खाता बनाया जाता है और ग्राहक को एक विशिष्ट account_id आवंटित
    की जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: paysetu
- id: b0ad85d9-4678-5f49-a6d4-d29a7e3cfd48
  title: close_account का उपयोग कब करें
  body: 'जब कोई ग्राहक अपने पेसेतु खाते को स्थायी रूप से बंद करने का अनुरोध करता है,
    तो इस प्रक्रिया का पालन करें। ध्यान दें कि यह एक अपरिवर्तनीय (irreversible) क्रिया
    है।


    **प्रक्रिया:**

    1. ग्राहक की पहचान का गहन सत्यापन करें।

    2. get_accounts का उपयोग करके सुनिश्चित करें कि खाते में कोई शेष राशि (balance)
    नहीं है या शेष राशि को स्थानांतरित करने का निर्देश लें।

    3. पुष्टि करें कि कोई लंबित लेनदेन या सक्रिय UPI मैंडेट नहीं है।

    4. close_account टूल का उपयोग करके खाता बंद करें।

    5. ग्राहक को सूचित करें कि खाता अब स्थायी रूप से बंद कर दिया गया है।


    विस्तृत गाइड के लिए ''पेसेतु डिजिटल बचत खाता — रद्द करना, बंद करना या डाउनग्रेड
    करना'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: paysetu
- id: 9a79d1b1-fc26-5eda-baf5-03ae92143409
  title: close_account टूल संदर्भ
  body: 'close_account टूल का उपयोग ग्राहक के अनुरोध पर उनके पेसेतु खाते को स्थायी
    रूप से बंद करने के लिए किया जाता है।


    हस्ताक्षर:

    close_account(account_id: string)


    प्रभाव:

    यह एक अपरिवर्तनीय (irreversible) क्रिया है। इसे कॉल करने पर संबंधित खाता तुरंत
    निष्क्रिय हो जाता है और भविष्य के सभी लेनदेन रोक दिए जाते हैं। एजेंट इस क्रिया
    को सीधे टूल कॉल करके निष्पादित करता है, ग्राहक को किसी बाहरी पोर्टल पर नहीं भेजता
    है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: paysetu
- id: 2bd4bfc4-ad25-54b5-9638-01dc28f6a47a
  title: update_contact_info का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने पंजीकृत मोबाइल नंबर, ईमेल पते या आवासीय पते में बदलाव
    करना हो, तब इस प्रक्रिया का पालन करें। संपर्क विवरण का सटीक होना सुरक्षा और नियामक
    अनुपालन के लिए अनिवार्य है।


    प्रक्रिया:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके ग्राहक के सक्रिय खाते की account_id प्राप्त
    करें।

    3. ग्राहक से वह नई जानकारी मांगें जिसे वे अपडेट करना चाहते हैं।

    4. अंत में, update_contact_info टूल का उपयोग करके सिस्टम में विवरण अपडेट करें।


    विवरण अपडेट होने के बाद ग्राहक को पुष्टिकरण संदेश भेजा जाएगा।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: paysetu
- id: 05f6ad9c-e4cb-537f-a9e8-a5c6a3674cc4
  title: update_contact_info टूल संदर्भ
  body: 'update_contact_info टूल का उपयोग ग्राहक के प्रोफाइल विवरण जैसे फोन नंबर या
    ईमेल को बदलने के लिए किया जाता है।


    हस्ताक्षर:

    update_contact_info(account_id: string, contact_fields: object)


    प्रभाव:

    यह टूल ग्राहक के खाते से जुड़े संपर्क विवरणों को तुरंत अपडेट कर देता है। एजेंट
    इस कार्रवाई को सीधे टूल कॉल के माध्यम से पूरा करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: paysetu
- id: 4c632378-77f0-50c8-901b-d718e9e56ffd
  title: get_statements का उपयोग कब करें
  body: 'जब ग्राहक अपने खाते के लेनदेन का विवरण, मासिक विवरण या विशिष्ट समय अवधि का
    स्टेटमेंट मांगता है, तो इस प्रक्रिया का उपयोग करें। यह वित्तीय रिकॉर्ड रखने और
    विसंगतियों की जांच के लिए आवश्यक है।


    प्रक्रिया:

    1. verify_identity टूल के माध्यम से ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts टूल का उपयोग करके संबंधित खाते की account_id निकालें।

    3. ग्राहक से वांछित समय अवधि (जैसे मासिक या त्रैमासिक) पूछें।

    4. get_statements टूल को कॉल करें ताकि स्टेटमेंट जेनरेट किया जा सके और ग्राहक
    को उपलब्ध कराया जा सके।


    यदि ग्राहक को पिछले लेनदेन की विस्तृत सूची चाहिए, तो आप get_account_transactions
    का भी संदर्भ दे सकते हैं।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: paysetu
- id: cb626670-cd53-5c20-9fa7-c8188b4ebdfa
  title: get_statements टूल संदर्भ
  body: 'get_statements टूल का उपयोग किसी विशिष्ट खाते के लिए आधिकारिक बैंक स्टेटमेंट
    प्राप्त करने के लिए किया जाता है।


    हस्ताक्षर:

    get_statements(account_id: string, period: string)


    प्रभाव:

    यह टूल चयनित अवधि के लिए स्टेटमेंट फाइल तैयार करता है। एजेंट इसे सीधे कॉल करके
    ग्राहक को विवरण प्रदान करता है।'
