- id: 75e22ebf-63a4-5ec7-a931-f7ed910feda6
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ पेसेतु प्रीपेड फॉरेक्स कार्ड की शर्तों में संशोधन की प्रक्रिया
    को निर्धारित करता है। पेसेतु को परिचालन लागतों को कवर करने के लिए शुल्कों को समायोजित
    करने का अधिकार है। वर्तमान में, जारी करने का शुल्क ₹150, रीलोड शुल्क ₹100 और विदेश
    में ATM निकासी शुल्क ₹200 निर्धारित है।


    शर्तों में बदलाव की नीति:

    1. किसी भी शुल्क वृद्धि या नीति परिवर्तन के लिए हम ग्राहकों को कम से कम 30 दिनों
    का अग्रिम नोटिस देंगे।

    2. नोटिस ऐप नोटिफिकेशन या पंजीकृत ईमेल के माध्यम से भेजा जाएगा।

    3. यदि ग्राहक नए शुल्कों से सहमत नहीं है, तो वे अपना कार्ड बंद कर सकते हैं।


    क्रॉस-करेंसी मार्कअप वर्तमान में 2% है, जिसे वैश्विक विनिमय दरों और नियामक दिशा-निर्देशों
    के आधार पर बदला जा सकता है। सभी बदलाव RBI और NPCI के नियमों के अधीन होंगे।'
