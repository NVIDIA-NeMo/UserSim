  mentions_tools:
  - get_account_transactions
  institution_id: paysetu
- id: 37a9d4f8-5f9c-510a-8fdf-31ec68fb2ffa
  title: make_upi_payment का उपयोग कब करें
  body: 'जब ग्राहक किसी मर्चेंट या अन्य व्यक्ति को UPI के माध्यम से तत्काल भुगतान
    करने का अनुरोध करता है, तो इन चरणों का पालन करें:


    1. verify_identity का उपयोग करके ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts के माध्यम से ग्राहक के सक्रिय खाते और उपलब्ध शेष राशि (Balance)
    की जाँच करें।

    3. भुगतान के लिए आवश्यक विवरण (जैसे UPI ID/VPA और सटीक राशि ₹) प्राप्त करें।

    4. make_upi_payment टूल का उपयोग करके लेनदेन शुरू करें।

    5. लेनदेन सफल होने के बाद, ग्राहक को पुष्टिकरण संदेश प्रदान करें।


    चेतावनी: यदि लेनदेन विफल हो जाता है, तो ग्राहक को सूचित करें कि रिफंड RBI के निर्धारित
    TAT के अनुसार संसाधित किया जाएगा।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: paysetu
- id: cafb2d43-0b28-5f93-a77a-a810ecd428ed
  title: make_upi_payment टूल संदर्भ
  body: 'टूल: make_upi_payment

    विवरण: एक खाते से निर्दिष्ट UPI ID पर धनराशि स्थानांतरित करता है।

    तर्क (Arguments): account_id (अनिवार्य), payee_vpa (अनिवार्य), amount (अनिवार्य),
    remarks (वैकल्पिक)।

    प्रभाव: यह एक भुगतान लेनदेन शुरू करता है और उसकी स्थिति (सफल/विफल) लौटाता है।

    नोट: एजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है।'
