- id: 3513798b-72d5-5627-8312-cffa13a38757
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: ग्राहक को अपने कार्ड विवरण देखने या ऐप के माध्यम से कार्ड प्रबंधित
    करने में समस्या हो रही है।


    संभावित कारण:

    - गलत लॉगिन क्रेडेंशियल।

    - अधूरा KYC स्तर।

    - ऐप का पुराना संस्करण।


    समाधान प्रक्रिया:

    1. सबसे पहले सुनिश्चित करें कि आप सही क्रेडेंशियल का उपयोग कर रहे हैं।

    2. जांचें कि क्या आपका Full-KYC पूरा है, क्योंकि कुछ सुविधाओं के लिए यह अनिवार्य
    है।

    3. यदि समस्या बनी रहती है, तो हमें बताएं; हम आपके खाते की स्थिति की जांच करेंगे।


    एस्केलेशन: यदि समस्या आंतरिक तकनीकी खराबी के कारण है, तो हम इसे अपने विशेषज्ञ
    टीम को भेजेंगे। आपको एक टिकट नंबर दिया जाएगा और समाधान के लिए निर्धारित TAT के
    भीतर अपडेट प्राप्त होगा। जटिल मुद्दों को अंततः नियामक लोकपाल (Ombudsman) के पास
    भेजा जा सकता है।'
