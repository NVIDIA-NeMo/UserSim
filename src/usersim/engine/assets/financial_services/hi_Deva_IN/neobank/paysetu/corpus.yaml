- id: d23f8440-741c-537d-b3c7-ecbb052c2c0d
  title: पेसेतु वॉलेट और UPI — पूर्ण KYC वॉलेट शेष सीमा की व्याख्या
  body: 'प्रश्न: पूर्ण KYC (Full-KYC) करवाने के बाद मेरे वॉलेट की शेष सीमा क्या होगी?

    उत्तर: जब आप अपनी पहचान और पते के प्रमाण के साथ Full-KYC प्रक्रिया पूरी कर लेते
    हैं, तो आपके पेसेतु वॉलेट और UPI खाते की अधिकतम शेष सीमा बढ़कर ₹200000 हो जाती
    है।


    प्रश्न: क्या न्यूनतम KYC के साथ भी मैं ₹200000 रख सकता हूँ?

    उत्तर: नहीं, न्यूनतम KYC वाले वॉलेट के लिए अधिकतम शेष सीमा ₹10000 है। उच्च सीमा
    प्राप्त करने के लिए Full-KYC अनिवार्य है।


    अधिक जानकारी के लिए ''पेसेतु वॉलेट और UPI — पात्रता शर्तें'' देखें।'
  domain: payments
  product_category: upi_wallet
  document_type: faq
  source_authority: official
