- id: 62959bb1-9967-5452-82b4-812ce2913a51
  title: पेसेतु वॉलेट और UPI — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: आपके द्वारा ट्रैक किए गए लेनदेन और पेसेतु स्टेटमेंट के बीच राशि या
    विवरण में अंतर है।


    संभावित कारण:

    - लंबित लेनदेन (Pending Transactions) जो अभी तक पूरी तरह से प्रोसेस नहीं हुए हैं।

    - रिफंड राशि जो अभी तक क्रेडिट नहीं हुई है (जिसमें 5 दिन तक का TAT लग सकता है)।

    - गलत लेनदेन की पहचान या डुप्लिकेट प्रविष्टियां।


    समाधान के चरण:

    1. अपने लेनदेन इतिहास की जांच करें और उस विशिष्ट प्रविष्टि की पहचान करें जिसमें
    अंतर है।

    2. हमें लेनदेन आईडी और वह राशि बताएं जो आपके अनुसार गलत है।

    3. हम अपने आंतरिक रिकॉर्ड और NPCI/बैंक डेटा के साथ मिलान करेंगे।

    4. यदि कोई त्रुटि पाई जाती है, तो हम उसे सही करेंगे या रिफंड की प्रक्रिया शुरू
    करेंगे।


    हम रिफंड के लिए RBI के निर्धारित TAT का पालन करते हैं। यदि समस्या का समाधान नहीं
    होता है, तो मामला आंतरिक विशेषज्ञों को भेजा जाएगा।'
