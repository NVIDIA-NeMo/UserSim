- id: 1ab8af6f-5ea8-5142-a159-b29ea9cd6926
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — लागत और शुल्क
  body: 'प्रश्न: पेसेतु प्रीपेड फॉरेक्स कार्ड के मुख्य शुल्क क्या हैं?

    उत्तर: कार्ड के लिए निम्नलिखित शुल्क लागू हैं:

    - कार्ड जारी करने का शुल्क: ₹150

    - रीलोड करने का शुल्क: ₹100

    - क्रॉस-करेंसी मार्कअप: 2%

    - विदेश में ATM निकासी शुल्क: ₹200


    प्रश्न: क्या कोई वार्षिक रखरखाव शुल्क है?

    उत्तर: वर्तमान में, इस कार्ड के लिए कोई वार्षिक शुल्क नहीं है; केवल परिचालन लागतों
    को कवर करने के लिए ऊपर बताए गए शुल्क लिए जाते हैं।'
