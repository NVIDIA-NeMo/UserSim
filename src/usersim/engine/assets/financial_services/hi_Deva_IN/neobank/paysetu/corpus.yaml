- id: e25c0b78-4197-5a5a-9fd4-5959a7743fc2
  title: भुगतान के लिए नियामक नोट्स
  body: सभी UPI और वॉलेट लेनदेन NPCI और RBI के नियामक ढांचे के भीतर संचालित होते हैं।
    UPI Mandate के मामले में, एजेंट को यह स्पष्ट करना चाहिए कि यह एक डिजिटल अनुमति
    है जो स्वचालित भुगतान की सुविधा देती है। विफल लेनदेन के मामले में, रिफंड के लिए
    RBI के सामंजस्यपूर्ण टर्न-अराउंड समय (TAT) का पालन करना अनिवार्य है। एजेंटों को
    ग्राहकों को सचेत करना चाहिए कि पेसेतु कभी भी UPI PIN या OTP नहीं मांगता है। उच्च
    लेनदेन सीमाएं केवल Full-KYC प्रक्रिया पूरी करने के बाद ही प्रदान की जा सकती हैं।
    किसी भी संदिग्ध गतिविधि या धोखाधड़ी की रिपोर्ट त्वरित और पारदर्शी प्रक्रिया के
    माध्यम से की जानी चाहिए ताकि ग्राहक के फंड की सुरक्षा सुनिश्चित हो सके।
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
