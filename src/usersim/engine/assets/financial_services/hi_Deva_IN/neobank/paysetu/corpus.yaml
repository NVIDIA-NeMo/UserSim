- id: 6066744f-f15f-50da-b140-485e463cdba2
  title: पेसेतु डिजिटल बचत खाता — रेफरल और लॉयल्टी ऑफर
  body: अपने दोस्तों को आधुनिक बैंकिंग से जोड़ें और लाभ उठाएं! यदि आप किसी नए ग्राहक
    को 'पेसेतु डिजिटल बचत खाता' खोलने के लिए रेफर करते हैं, तो सफल खाता सक्रियण पर
    आपको और आपके मित्र दोनों को ₹100 का रेफरल बोनस मिलेगा। यह ऑफर 1 जनवरी 2024 से
    31 दिसंबर 2024 तक वैध है। साथ ही, हमारे लॉयल्टी प्रोग्राम के तहत, निरंतर सक्रिय
    रहने वाले ग्राहकों को विशेष ट्रांजेक्शन लाभ दिए जाएंगे। अधिक जानकारी के लिए 'पेसेतु
    डिजिटल बचत खाता — वर्तमान ऑफर' देखें।
  domain: retail_banking
