  institution_id: paysetu
- id: 2820eb80-5d5f-5d76-8b37-33e098c6673f
  title: पेसेतु वॉलेट और UPI — नियामक प्रकटीकरण
  body: 'पेसेतु वॉलेट और UPI सेवा RBI और NPCI के दिशा-निर्देशों के पूर्ण अनुपालन में
    संचालित होती है।


    नियामक सीमाएं:

    - वॉलेट में अधिकतम शेष राशि उपयोगकर्ता के KYC स्तर पर निर्भर करती है (न्यूनतम
    KYC के लिए ₹10000 और Full-KYC के लिए ₹200000)।

    - UPI लेनदेन की अधिकतम सीमा प्रति लेनदेन ₹100000 निर्धारित है।

    - विफल लेनदेन के लिए रिफंड प्रक्रिया RBI द्वारा निर्धारित TAT का पालन करती है,
    जिसमें अधिकतम 5 दिन का समय लगता है।


    सुरक्षा और गोपनीयता:

    हम डेटा गोपनीयता को सर्वोपरि मानते हैं। हम कभी भी आपका UPI PIN, OTP या CVV नहीं
    मांगते हैं। वॉलेट में रखी राशि DICGC बीमा के दायरे में नहीं आती है क्योंकि यह
    एक प्रीपेड इंस्ट्रूमेंट है, न कि बैंक जमा।'
  domain: payments
  product_category: upi_wallet
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: fc90d838-55d8-583d-b9c3-aada108f6e43
  title: पेसेतु वॉलेट और UPI — ब्याज दर अनुसूची
  body: 'पेसेतु वॉलेट और UPI एक भुगतान-केंद्रित उत्पाद है, बचत उत्पाद नहीं। इसलिए,
    वॉलेट में रखे गए किसी भी शेष राशि (Balance) पर 0% की वार्षिक ब्याज दर लागू होती
    है।


    यह दर सभी ग्राहकों और सभी बैलेंस स्तरों के लिए समान है। यदि आप अपनी राशि पर ब्याज
    अर्जित करना चाहते हैं, तो हम आपको ''पेसेतु डिजिटल बचत खाता — सिंहावलोकन'' देखने
    की सलाह देते हैं।'
  domain: payments
  product_category: upi_wallet
  document_type: rate_sheet
  source_authority: official
