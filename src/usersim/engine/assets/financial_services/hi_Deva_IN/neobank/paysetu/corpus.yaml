  institution_id: paysetu
- id: d55f7c05-991f-5bf9-a30e-cc34f8e7dbb8
  title: पेसेतु डिजिटल बचत खाता — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आपको अपने ''पेसेतु डिजिटल बचत खाता'' में लॉगिन करने या एक्सेस करने में
    समस्या आ रही है, तो कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: ऐप खोलते समय ''Invalid Credentials'' त्रुटि या लॉगिन स्क्रीन का बार-बार
    रिफ्रेश होना।


    संभावित कारण और समाधान:

    1. गलत क्रेडेंशियल: सुनिश्चित करें कि आप सही मोबाइल नंबर और पासवर्ड का उपयोग कर
    रहे हैं। यदि पासवर्ड भूल गए हैं, तो ''पासवर्ड रीसेट'' विकल्प का उपयोग करें।

    2. नेटवर्क समस्या: अपने इंटरनेट कनेक्शन की जांच करें। कमजोर सिग्नल के कारण एक्सेस
    में समस्या हो सकती है।

    3. ऐप अपडेट: जांचें कि आप ऐप का नवीनतम संस्करण उपयोग कर रहे हैं। पुराने संस्करण
    लॉगिन त्रुटियां दे सकते हैं।


    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति की जांच करेंगे
    और यदि आवश्यक हो, तो आपके एक्सेस को पुनः सक्रिय करने के लिए सुरक्षा सत्यापन शुरू
    करेंगे। समाधान के लिए निर्धारित TAT (Turn-around-Time) का पालन किया जाएगा। अधिक
    सहायता के लिए ''पेसेतु डिजिटल बचत खाता — विफल या लंबित कार्रवाई'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: f120ecf1-a411-5817-b43b-a8ddf785d1e8
  title: पेसेतु डिजिटल बचत खाता — पात्रता श्रेणियाँ
  body: 'सपोर्ट एजेंट के लिए पात्रता गाइड:


    | श्रेणी | मुख्य आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | डिजिटल प्रवासियों/युवा | वैध मोबाइल नंबर और आधार/PAN | बुनियादी खाता सक्रियण
    (सीमित सीमाएं) |

    | पूर्ण सेवा उपयोगकर्ता | Full-KYC दस्तावेज़ सत्यापन | उच्च लेनदेन सीमाएं और पूर्ण
    पहुंच |

    | निष्क्रिय उपयोगकर्ता | 30 दिन तक KYC अधूरा | खाते पर लेनदेन प्रतिबंध |


    सभी पात्र ग्राहकों के लिए न्यूनतम शेष राशि ₹0 और वार्षिक ब्याज दर 3.5% लागू है।'
