- id: 1e0e9441-14da-5f0d-85ee-48966213ac46
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — स्थिति या इतिहास देखना
  body: 'अपने पेसेतु प्रीपेड फॉरेक्स कार्ड के शेष और पिछले लेनदेन के इतिहास की जांच
    करने के लिए इन चरणों का पालन करें:


    1. हमें बताएं कि आप अपने फॉरेक्स कार्ड का बैलेंस या स्टेटमेंट देखना चाहते हैं।

    2. हम आपकी पहचान सत्यापित करने के लिए आपसे आपका पंजीकृत मोबाइल नंबर या कार्ड के
    अंतिम चार अंक मांगेंगे।

    3. सत्यापन सफल होने के बाद, हम आपको आपके कार्ड की वर्तमान स्थिति (सक्रिय/अवरुद्ध)
    और उपलब्ध शेष राशि की जानकारी देंगे।

    4. यदि आप इतिहास देखना चाहते हैं, तो हमें वह समय अवधि (जैसे: पिछला एक महीना) बताएं
    जिसके लिए आपको विवरण चाहिए।

    5. हम आपके अनुरोधित समय अवधि के सभी लेनदेन का विवरण आपके साथ साझा करेंगे, जिसमें
    खर्च की गई राशि और लागू शुल्क शामिल होंगे।


    आपको एक पुष्टिकरण संदेश प्राप्त होगा जिससे पता चलेगा कि विवरण सफलतापूर्वक साझा
    कर दिए गए हैं।'
  domain: cards
  product_category: prepaid_forex_card
  document_type: how_to_guide
