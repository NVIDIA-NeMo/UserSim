- id: 7d7df6a4-312a-5ada-9c10-5c92835a33f4
  title: बिल ऑटोपे — नियामक प्रकटीकरण
  body: 'यह दस्तावेज़ ''बिल ऑटोपे'' के उपयोग से संबंधित नियामक शर्तों को स्पष्ट करता
    है।


    1. अनुपालन: यह सेवा RBI और NPCI के दिशा-निर्देशों के पूर्ण अनुपालन में संचालित
    होती है।

    2. मैंडेट प्रबंधन: ग्राहक द्वारा प्रदान किया गया UPI Mandate एक कानूनी डिजिटल
    अनुमति है। पेसेतु केवल मैंडेट में निर्धारित सीमा (AFA के बिना अधिकतम ₹15000) तक
    ही राशि डेबिट कर सकता है।

    3. अधिसूचना: पारदर्शिता के लिए, डेबिट होने से 24 घंटे पहले सूचना देना अनिवार्य
    है।

    4. शुल्क: विलंबित भुगतान की स्थिति में ₹20 का शुल्क परिचालन लागत के रूप में लिया
    जाएगा।

    5. विवाद: विफल लेनदेन के लिए RBI के सामंजस्यपूर्ण टर्न-अराउंड समय (TAT) का पालन
    किया जाएगा।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, लेकिन व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देता है।'
