  institution_id: paysetu
- id: 6c415ac5-8a56-5f1c-bcea-09de13958254
  title: पेसेतु वॉलेट और UPI — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी पेसेतु वॉलेट और UPI सेवा को बंद करना या डाउनग्रेड करना चाहते
    हैं, तो इन चरणों का पालन करें:


    1. शेष राशि शून्य करें: सबसे पहले अपने वॉलेट में मौजूद सभी फंड को अपने लिंक किए
    गए बैंक खाते में ट्रांसफर करें या भुगतान के माध्यम से समाप्त करें। सुनिश्चित करें
    कि आपका बैलेंस ₹0 है।

    2. बंद करने का अनुरोध करें: हमें सूचित करें कि आप अपना खाता बंद करना चाहते हैं।
    हम आपकी पहचान सत्यापित करने के लिए एक अंतिम सत्यापन प्रक्रिया शुरू करेंगे।

    3. पुष्टिकरण प्राप्त करें: सत्यापन सफल होने के बाद, हम आपको सूचित करेंगे कि आपका
    खाता बंद कर दिया गया है।


    डाउनग्रेड करने के लिए (जैसे Full-KYC से न्यूनतम स्तर पर जाना):

    1. हमें डाउनग्रेड करने का अनुरोध भेजें।

    2. यदि आपके वॉलेट में ₹10000 से अधिक राशि है, तो आपको पहले उसे कम करना होगा क्योंकि
    न्यूनतम KYC की सीमा ₹10000 है।

    3. हम आपके खाते की सीमाओं को अपडेट करेंगे और आपको पुष्टि संदेश भेजेंगे।


    डिस्क्लेमर: खाता बंद होने के बाद पिछले लेनदेन का इतिहास केवल नियामक अवधि तक ही
    उपलब्ध होगा।'
  domain: payments
  product_category: upi_wallet
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: b87a856d-fd7e-5f9d-b65b-f17fb42dc3f8
  title: पेसेतु वॉलेट और UPI — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते में कोई अनपेक्षित शुल्क या राशि का अंतर दिखाई देता है,
    तो कृपया इस प्रक्रिया का पालन करें:


    लक्षण: वॉलेट बैलेंस में अचानक कमी या किसी ऐसे शुल्क का दिखना जिसकी जानकारी आपको
    नहीं थी।


    जांच के चरण:

    1. लेनदेन इतिहास देखें: जांचें कि क्या कोई ऑटो-पेमेंट या UPI मैंडेट सक्रिय था।

    2. शुल्क विवरण: पुष्टि करें कि क्या यह कोई परिचालन लागत है। पेसेतु केवल न्यूनतम
    परिचालन शुल्क लेता है।

    3. विफल लेनदेन: देखें कि क्या कोई हालिया लेनदेन विफल हुआ था।


    समाधान:

    - यदि कोई लेनदेन विफल हुआ है और राशि कट गई है, तो रिफंड के लिए 5 दिन का समय (TAT)
    लग सकता है।

    - यदि शुल्क अभी भी स्पष्ट नहीं है, तो हमें विवरण प्रदान करें। हम आंतरिक विशेषज्ञों
    के माध्यम से इसकी जांच करेंगे।


    यदि समस्या 5 दिन के भीतर हल नहीं होती है, तो हम इस मामले को नियामक लोकपाल (Ombudsman)
    के पास भेजने की प्रक्रिया शुरू करेंगे।


    डिस्क्लेमर: पेसेतु व्यक्तिगत टैक्स सलाह नहीं देता है।'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
