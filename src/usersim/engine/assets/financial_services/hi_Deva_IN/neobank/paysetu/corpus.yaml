- id: cc9193b4-07c8-5f3e-b463-f8b4db272fc0
  title: बिल ऑटोपे — सेटअप और सक्रियण
  body: 'अपने बिल भुगतान को स्वचालित करने के लिए इन चरणों का पालन करें:


    शुरुआत करने से पहले: सुनिश्चित करें कि आपका पेसेतु खाता सक्रिय है और आपके पास
    उस बिलर का विवरण है जिसे आप जोड़ना चाहते हैं।


    1. हमें बताएं कि आप किस बिलर के लिए ''बिल ऑटोपे'' सक्रिय करना चाहते हैं और वह
    अधिकतम राशि बताएं जिसे आप मैंडेट के रूप में निर्धारित करना चाहते हैं (ध्यान रखें
    कि AFA के बिना सीमा ₹15000 है)।

    2. हम आपसे उस विशिष्ट सेवा या उपयोगिता प्रदाता की पुष्टि करने के लिए कहेंगे।

    3. आपको डिजिटल अनुमति (UPI Mandate) प्रदान करनी होगी, जिससे पेसेतु को आपकी ओर
    से भविष्य में स्वचालित भुगतान करने का अधिकार मिल जाएगा।

    4. हम आपको एक पुष्टिकरण संदेश भेजेंगे कि आपका मैंडेट सफलतापूर्वक सेट हो गया है।


    सफलता की पहचान: जब आपको पहले बिल चक्र के लिए भुगतान से 24 घंटे पहले प्री-डेबिट
    नोटिफिकेशन प्राप्त होगा, तो समझ लें कि सेटअप सक्रिय है।'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
