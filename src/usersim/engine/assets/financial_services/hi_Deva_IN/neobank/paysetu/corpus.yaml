- id: 91dbf0b3-fe14-5a18-8812-4009d6aea0f9
  title: पेसेतु वॉलेट और UPI — आवश्यक दस्तावेज़
  body: 'पेसेतु वॉलेट और UPI के विभिन्न स्तरों के लिए आवश्यक दस्तावेज़ निम्नलिखित
    हैं:


    - न्यूनतम KYC के लिए: वैध सरकारी पहचान पत्र (जैसे आधार या पैन) और मोबाइल नंबर
    सत्यापन। (परिणाम: ₹10000 तक की वॉलेट शेष सीमा)

    - Full-KYC के लिए: पूर्ण पहचान प्रमाण, पते का प्रमाण (Address Proof), और वीडियो
    सत्यापन या बायोमेट्रिक प्रमाणीकरण। (परिणाम: ₹200000 तक की वॉलेट शेष सीमा और उच्च
    लेनदेन सीमाएं)


    सभी दस्तावेज़ डिजिटल रूप से प्रस्तुत किए जाने चाहिए।'
  domain: payments
  product_category: upi_wallet
