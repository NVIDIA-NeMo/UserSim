- id: a6494bd2-6932-51ad-a87b-448166fb52f3
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — गोपनीयता और डेटा प्रबंधन
  body: 'पेसेतु में, हम डेटा गोपनीयता और निष्पक्ष उपचार को सर्वोपरि मानते हैं। हम
    RBI और NPCI के दिशा-निर्देशों का सख्ती तरह से पालन करते हैं।


    डेटा प्रबंधन नीति:

    1. आपका व्यक्तिगत डेटा केवल सत्यापन और विनियामक अनुपालन के लिए उपयोग किया जाता
    है।

    2. Full-KYC के दौरान एकत्र किए गए दस्तावेज़ सुरक्षित एन्क्रिप्टेड सर्वर पर संग्रहीत
    किए जाते हैं।

    3. हम किसी भी तीसरे पक्ष के साथ आपकी जानकारी साझा नहीं करते हैं, जब तक कि कानूनी
    या नियामक आवश्यकता न हो।


    वित्तीय सुरक्षा:

    ग्राहकों को सूचित किया जाता है कि उनके फंड नियामक सुरक्षा ढांचे के अंतर्गत हैं।
    हम DICGC बीमा (₹5,00,000 तक) के बारे में स्पष्ट जानकारी प्रदान करते हैं, जिससे
    आपकी जमा राशि सुरक्षित रहती है। आपके द्वारा भुगतान किए गए ₹150 जारी करने का शुल्क
    और ₹100 रीलोड शुल्क परिचालन लागतों को कवर करने के लिए हैं।'
