- id: bd32bc20-abb2-5d72-958b-faf944a5b6c9
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — सेटअप और सक्रियण
  body: 'अपने पेसेतु प्रीपेड फॉरेक्स कार्ड को सेटअप और सक्रिय करने के लिए इन चरणों
    का पालन करें:


    शुरू करने से पहले: सुनिश्चित करें कि आपका Full-KYC पूरा हो चुका है और आपके पास
    आवश्यक पहचान प्रमाण हैं।


    1. हमें अपना प्रीपेड फॉरेक्स कार्ड जारी करने का अनुरोध करें। हम आपसे ₹150 का जारी
    करने का शुल्क लेंगे और आपके सत्यापन के बाद कार्ड प्रोसेस करेंगे।

    2. एक बार जब आपको भौतिक कार्ड प्राप्त हो जाए, तो हमें इसे सक्रिय करने के लिए सूचित
    करें।

    3. हम आपसे कार्ड के विवरण और आपकी पहचान की पुष्टि करने के लिए कहेंगे।

    4. कार्ड सक्रिय करने के बाद, अपनी यात्रा की जरूरतों के अनुसार राशि लोड करें। ध्यान
    रखें कि प्रत्येक रीलोड पर ₹100 का शुल्क लागू होगा।

    5. जब हम सक्रियण की पुष्टि कर देंगे, तो आपका कार्ड अंतरराष्ट्रीय लेनदेन के लिए
    तैयार होगा।


    सफल सक्रियण के बाद, आप अपने कार्ड का उपयोग विदेश में भुगतान और ATM निकासी के लिए
    कर सकते हैं।'
