- id: 5fd15e85-a4e9-5e82-b5a5-6ddb49626fe4
  title: पेसेतु वॉलेट और UPI — विफल लेनदेन की राशि वापसी में लगने वाले दिन की व्याख्या
  body: 'प्रश्न: यदि मेरा UPI लेनदेन विफल हो जाता है, तो मुझे रिफंड कब तक मिलेगा?

    उत्तर: विफल लेनदेन के लिए रिफंड प्रक्रिया पारदर्शी है। हम RBI के सामंजस्यपूर्ण
    टर्न-अराउंड समय (TAT) का पालन करते हैं। आम तौर पर, विफल लेनदेन की राशि वापसी के
    लिए 5 दिन का समय लगता है।


    प्रश्न: क्या मुझे रिफंड के लिए अलग से आवेदन करना होगा?

    उत्तर: नहीं, विफल लेनदेन की राशि स्वचालित रूप से आपके स्रोत खाते या वॉलेट में
    वापस कर दी जाती है। अधिक जानकारी के लिए ''पेसेतु वॉलेट और UPI — विफल या लंबित
    कार्रवाई'' देखें।'
  domain: payments
  product_category: upi_wallet
  document_type: faq
  source_authority: official
