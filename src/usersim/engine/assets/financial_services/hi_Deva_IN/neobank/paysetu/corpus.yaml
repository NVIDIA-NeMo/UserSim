- id: 72e4b0ab-332f-5120-856d-341593e47827
  title: पेसेतु डिजिटल बचत खाता — लागत और शुल्क
  body: 'प्रश्न: पेसेतु डिजिटल बचत खाता खोलने या बनाए रखने का शुल्क क्या है?

    उत्तर: पेसेतु डिजिटल बचत खाता में न्यूनतम शेष राशि ₹0 है, इसलिए बैलेंस बनाए रखने
    का कोई शुल्क नहीं है। हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है।


    प्रश्न: क्या इस खाते पर कोई छिपे हुए प्रभार हैं?

    उत्तर: नहीं, शुल्क केवल परिचालन लागतों को कवर करने के लिए लिए जाते हैं। विशिष्ट
    श्रेणियों के लिए कुछ शुल्क माफ किए जा सकते हैं। विस्तृत जानकारी के लिए ''पेसेतु
    डिजिटल बचत खाता — शुल्क अनुसूची'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: faq
  source_authority: official
