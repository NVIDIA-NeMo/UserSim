  institution_id: paysetu
- id: c204bca0-4e36-5376-91a1-c594fa470f48
  title: पेसेतु डिजिटल बचत खाता — यहाँ के समान उत्पाद से तुलना
  body: 'पेसेतु डिजिटल बचत खाता बनाम पेसेतु वॉलेट और UPI:


    - बचत और ब्याज: डिजिटल बचत खाता 3.5% की वार्षिक ब्याज दर प्रदान करता है, जबकि
    वॉलेट में कोई ब्याज नहीं मिलता।

    - न्यूनतम शेष: दोनों में ₹0 की लचीली नीति है।

    - सुरक्षा: बचत खाता DICGC बीमा द्वारा ₹5,00,000 तक सुरक्षित है, जो वॉलेट की तुलना
    में अधिक नियामक सुरक्षा प्रदान करता है।


    किसे क्या चुनना चाहिए?

    - यदि आप अपने पैसे पर ब्याज कमाना चाहते हैं और नियामक सुरक्षा चाहते हैं, तो ''पेसेतु
    डिजिटल बचत खाता'' चुनें।

    - यदि आपको केवल त्वरित, छोटे भुगतान और वॉलेट सुविधा चाहिए, तो ''पेसेतु वॉलेट और
    UPI'' बेहतर है।'
  domain: retail_banking
  product_category: digital_savings
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: eb03c36c-33cb-5b9c-831c-d02e2146cd42
  title: पेसेतु डिजिटल बचत खाता — नियामक प्रकटीकरण
  body: 'पेसेतु डिजिटल बचत खाता RBI और NPCI के दिशा-निर्देशों के पूर्ण अनुपालन में
    संचालित होता है। हम डेटा गोपनीयता और निष्पक्ष उपचार को सर्वोपरि मानते हैं।


    नियामक सुरक्षा:

    इस खाते में जमा राशि DICGC (Deposit Insurance and Credit Guarantee Corporation)
    बीमा द्वारा ₹5,00,000 तक सुरक्षित है। यह सुनिश्चित करता है कि आपकी बचत नियामक
    सुरक्षा ढांचे के भीतर सुरक्षित रहे।


    परिचालन मानक:

    - हम Full-KYC प्रक्रिया के माध्यम से उच्च लेनदेन सीमाएं प्रदान करते हैं।

    - किसी भी विवाद या विफल लेनदेन के लिए, हम RBI के टर्न-अराउंड समय (TAT) का कड़ाई
    से पालन करते हैं।

    - सुरक्षा के लिए, हम कभी भी आपका UPI PIN, OTP या CVV नहीं मांगते हैं।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता और उत्पाद शिक्षा प्रदान करता है, लेकिन व्यक्तिगत
    टैक्स या कानूनी सलाह नहीं देता है।'
  domain: retail_banking
  product_category: digital_savings
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: c282e679-6544-549b-bb3d-0496eefdb445
  title: पेसेतु डिजिटल बचत खाता — ब्याज दर अनुसूची
  body: 'पेसेतु डिजिटल बचत खाता के लिए ब्याज दर विवरण:


    - लागू ब्याज दर: 3.5% वार्षिक।


    यह एक फ्लैट दर है जो सभी बैलेंस श्रेणियों पर समान रूप से लागू होती है। ब्याज की
    गणना दैनिक शेष के आधार पर की जाती है और समय-समय पर आपके खाते में जमा की जाती है।
    दरें नियामक परिवर्तनों या आंतरिक नीति समीक्षा के अधीन हो सकती हैं, जिसकी सूचना
    ग्राहकों को पहले दी जाएगी।'
  domain: retail_banking
  product_category: digital_savings
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 29cf51d9-bbbd-56a0-9a33-1c9f1d7d04ab
  title: पेसेतु डिजिटल बचत खाता — वर्तमान ऑफर
  body: 'विशेष ऑफर: अपने बचत की यात्रा को गति दें!


    आज ही अपना पेसेतु डिजिटल बचत खाता खोलें और ₹0 न्यूनतम शेष राशि का लाभ उठाएं। यदि
    आप खाता खोलने के पहले 30 दिनों के भीतर अपनी Full-KYC प्रक्रिया पूरी करते हैं,
    तो आप तुरंत उच्च लेनदेन सीमाओं के पात्र हो जाएंगे और 3.5% की वार्षिक ब्याज दर
    का लाभ उठाना शुरू कर देंगे।


    यह ऑफर वर्तमान में सभी नए डिजिटल ग्राहकों के लिए खुला है।'
  domain: retail_banking
  product_category: digital_savings
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 8bf9ec9f-0adb-576c-83ee-1cdf6f03799c
  title: पेसेतु डिजिटल बचत खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'पेसेतु डिजिटल बचत खाता का उपयोग करते समय आपकी सुरक्षा हमारी सर्वोच्च प्राथमिकता
    है। डिजिटल बैंकिंग में कुछ सामान्य धोखाधड़ी पैटर्न जैसे कि फर्जी लॉटरी कॉल, केवाईसी
    अपडेट के नाम पर डराना, या लुभावने निवेश ऑफर शामिल हैं। कृपया याद रखें कि पेसेतु
    आपसे कभी भी आपका UPI PIN, OTP या CVV नहीं मांगेगा। यदि कोई व्यक्ति खुद को पेसेतु
    अधिकारी बताकर ये विवरण मांगता है, तो वह एक धोखाधड़ी है।


    अनधिकृत गतिविधि की स्थिति में, तुरंत हमें सूचित करें ताकि हम आपके खाते को सुरक्षित
    कर सकें। हम विफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के लिए एक त्वरित और पारदर्शी
    प्रक्रिया अपनाते हैं। रिफंड के लिए हम RBI के सामंजस्यपूर्ण टर्न-अराउंड समय (TAT)
    का पालन करते हैं ताकि आपका पैसा सुरक्षित रूप से वापस मिल सके। किसी भी संदिग्ध
    लेनदेन की सूचना जितनी जल्दी हो सके दें, क्योंकि समय पर रिपोर्टिंग आपके दायित्व
    को सीमित करने में मदद करती है।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, लेकिन व्यक्तिगत कानूनी सलाह
    नहीं देता।'
