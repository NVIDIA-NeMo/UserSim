- id: f4ef7d11-0870-535b-8e6c-f1f72d1f59f0
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'यहाँ कार्ड के लिए एक सामान्य अनुरोध (जैसे: कार्ड रीलोड करना) को पूरा करने
    की चरण-दर-चरण प्रक्रिया दी गई है:


    1. हमें बताएं कि आप अपने पेसेतु प्रीपेड फॉरेक्स कार्ड में धनराशि जोड़ना (reload)
    चाहते हैं।

    2. हम आपसे वह राशि पूछेंगे जो आप लोड करना चाहते हैं और आपके खाते की वर्तमान स्थिति
    की पुष्टि करेंगे।

    3. हम आपको सूचित करेंगे कि इस लेनदेन के लिए ₹100 का रीलोड शुल्क लागू होगा।

    4. आप हमें भुगतान के लिए अपनी सहमति दें।

    5. हम आपके संबंधित खाते से (लोड राशि + ₹100 शुल्क) की कटौती करेंगे।

    6. एक बार भुगतान सफल होने के बाद, हम आपको पुष्टि करेंगे कि धनराशि आपके फॉरेक्स
    कार्ड में जोड़ दी गई है।

    7. आप अपने अपडेटेड बैलेंस की जांच कर सकते हैं।


    पूरी प्रक्रिया पूरी होने पर आपको एक पुष्टिकरण रसीद प्राप्त होगी।'
