- id: 1976399e-fd9d-58ff-9ca9-b4998ac218e3
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: ग्राहक को सूचित किया जाता है कि उनका पेसेतु प्रीपेड फॉरेक्स कार्ड
    लेनदेन अस्वीकृत कर दिया गया है या कार्ड अवरुद्ध (blocked) है।


    संभावित कारण और जाँच के चरण:

    1. अपर्याप्त शेष: जाँचें कि क्या कार्ड में लेनदेन की राशि और लागू शुल्क (जैसे
    क्रॉस-करेंसी मार्कअप 2% या ATM शुल्क ₹200) के लिए पर्याप्त बैलेंस है।

    2. गलत विवरण: सुनिश्चित करें कि PIN या CVV सही दर्ज किया गया है।

    3. सुरक्षा अवरोध: यदि कार्ड पर संदिग्ध लेनदेन देखा गया है, तो सुरक्षा कारणों से
    इसे स्वचालित रूप से अवरुद्ध किया गया होगा।

    4. KYC स्थिति: जाँचें कि क्या आपका KYC स्तर उस लेनदेन की सीमा के लिए पर्याप्त
    है।


    समाधान:

    - यदि शेष कम है, तो ₹100 के रीलोड शुल्क के साथ कार्ड को टॉप-अप करें।

    - यदि कार्ड सुरक्षा कारणों से अवरुद्ध है, तो हमें सूचित करें। हम सख्त पहचान सत्यापन
    के बाद कार्ड को फिर से सक्रिय करेंगे।

    - यदि समस्या बनी रहती है, तो हम मामले को आंतरिक विशेषज्ञों के पास भेजेंगे और समाधान
    का समय (TAT) साझा करेंगे।'
  domain: cards
  product_category: prepaid_forex_card
  document_type: troubleshooting
  source_authority: official
