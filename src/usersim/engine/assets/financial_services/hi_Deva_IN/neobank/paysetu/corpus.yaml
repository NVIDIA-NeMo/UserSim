- id: 68f90a0e-8ea6-5125-a710-12e7c3953de4
  title: पेसेतु वॉलेट और UPI — जोखिम प्रकटीकरण
  body: 'पेसेतु वॉलेट और UPI का उपयोग करते समय कृपया निम्नलिखित जोखिमों और नियामक
    सीमाओं को समझें:


    1. शेष सीमा जोखिम: आपके वॉलेट में रखी जा सकने वाली राशि सीमित है। न्यूनतम KYC
    के लिए यह ₹10000 और Full-KYC के लिए ₹200000 है। इस सीमा से अधिक राशि जमा नहीं
    की जा सकती।

    2. लेनदेन सीमा: प्रति लेनदेन UPI सीमा ₹100000 है। इससे अधिक की राशि भेजने के लिए
    आपको अन्य माध्यमों का उपयोग करना होगा।

    3. रिफंड समय: विफल लेनदेन के मामले में, रिफंड के लिए 5 दिन का TAT (Turn-around-Time)
    निर्धारित है। यह समय बैंकिंग प्रणालियों के बीच सामंजस्य पर निर्भर करता है।

    4. सुरक्षा जोखिम: डिजिटल भुगतान में फिशिंग और सोशल इंजीनियरिंग के जोखिम होते हैं।
    पेसेतु कभी भी PIN या OTP नहीं मांगता।


    हम RBI और NPCI के सभी दिशा-निर्देशों का पालन करते हैं ताकि आपकी धनराशि और डेटा
    की गोपनीयता सुनिश्चित हो सके।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, लेकिन व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देता।'
