- id: 0db5c657-66ec-541f-b0b7-362b7882b2d5
  title: add_upi_mandate का उपयोग कब करें
  body: 'जब ग्राहक भविष्य के स्वचालित भुगतानों (जैसे बिल भुगतान या सब्सक्रिप्शन) के
    लिए UPI मैंडेट सेट करना चाहता है, तो निम्न प्रक्रिया अपनाएं:


    1. verify_identity का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts के माध्यम से उपयुक्त खाता आईडी (account_id) की पहचान करें।

    3. ग्राहक से मैंडेट की राशि, आवृत्ति (Frequency), और मर्चेंट विवरण प्राप्त करें।

    4. add_upi_mandate टूल को कॉल करें ताकि डिजिटल अनुमति सेट की जा सके।

    5. ग्राहक को सूचित करें कि अब भुगतान स्वचालित रूप से होंगे और उन्हें बिल भुगतान
    के लिए ''बिल ऑटोपे'' सुविधा का लाभ मिल रहा है।


    सुनिश्चित करें कि ग्राहक समझता है कि मैंडेट एक डिजिटल अनुमति है जिसे बाद में रद्द
    किया जा सकता है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_upi_mandate
  institution_id: paysetu
- id: fd99f65c-b9c7-5307-9002-394cd7c94be9
  title: add_upi_mandate टूल संदर्भ
  body: 'यह टूल एक नया UPI मैंडेट बनाने के लिए उपयोग किया जाता है, जो पेसेतु को ग्राहक
    की ओर से भविष्य में स्वचालित भुगतान करने की अनुमति देता है। एजेंट इस क्रिया को
    सीधे add_upi_mandate टूल कॉल करके पूरा करता है।


    **पैरामीटर्स:**

    - `account_id`: वह खाता जिससे पैसा कटेगा।

    - `amount`: मैंडेट की अधिकतम राशि।

    - `beneficiary_vpa`: प्राप्तकर्ता का UPI एड्रेस।

    - `start_date`: मैंडेट शुरू होने की तिथि।

    - `end_date`: मैंडेट समाप्त होने की तिथि।


    **प्रभाव:** ग्राहक के खाते पर एक डिजिटल अनुमति सेट की जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
