  institution_id: paysetu
- id: c7c15493-8ed3-5254-b9bb-c39bd45bb77b
  title: बिल ऑटोपे — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपका बिल ऑटोपे भुगतान अस्वीकृत या अवरुद्ध हो गया है, तो इसके निम्नलिखित
    कारण और समाधान हो सकते हैं:


    संभावित कारण:

    - अपर्याप्त शेष राशि: भुगतान के समय आपके खाते में आवश्यक राशि उपलब्ध नहीं थी।

    - सीमा उल्लंघन: भुगतान राशि ₹15000 की बिना AFA वाली सीमा से अधिक थी और प्रमाणीकरण
    पूरा नहीं हुआ।

    - मैंडेट की समाप्ति: आपका UPI Mandate समाप्त हो गया है या बिलर द्वारा रद्द कर
    दिया गया है।


    जाँच और समाधान के चरण:

    1. सबसे पहले अपने खाते का शेष चेक करें। यदि राशि कम है, तो फंड जोड़ें।

    2. अपने मैंडेट की स्थिति की जाँच करें कि वह अभी भी ''सक्रिय'' है या नहीं।

    3. यदि राशि ₹15000 से अधिक है, तो सुनिश्चित करें कि आपने आवश्यक प्रमाणीकरण पूरा
    किया है।


    यदि समस्या बनी रहती है, तो हम आपके मामले को आंतरिक विशेषज्ञों के पास भेजेंगे।
    रिफंड या विफल लेनदेन के समाधान के लिए RBI के निर्धारित TAT का पालन किया जाएगा।'
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
