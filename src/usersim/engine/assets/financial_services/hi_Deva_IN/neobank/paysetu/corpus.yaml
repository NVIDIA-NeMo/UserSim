- id: b8fbd4b1-1bf4-5481-b255-95247b25d0bd
  title: पेसेतु वॉलेट और UPI — खाता अनुबंध
  body: 'यह अनुबंध पेसेतु और ग्राहक के बीच ''पेसेतु वॉलेट और UPI'' सेवाओं के उपयोग
    को नियंत्रित करता है।


    1. शेष सीमाएं: ग्राहक के वॉलेट में रखी जा सकने वाली अधिकतम राशि उसके KYC स्तर
    पर निर्भर करती है। न्यूनतम KYC वाले वॉलेट के लिए शेष सीमा ₹10000 है, जबकि Full-KYC
    पूर्ण करने वाले ग्राहकों के लिए यह सीमा ₹200000 तक है।

    2. लेनदेन सीमा: सुरक्षा और नियामक अनुपालन के लिए, प्रति लेनदेन UPI सीमा ₹100000
    निर्धारित की गई है।

    3. शुल्क और प्रभार: हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है।
    शुल्क केवल परिचालन लागतों को कवर करने के लिए लिए जाते हैं।

    4. विफलता और रिफंड: विफल लेनदेन के मामले में, रिफंड के लिए RBI के सामंजस्यपूर्ण
    टर्न-अराउंड समय (TAT) का पालन किया जाएगा।

    5. अनुबंध की समाप्ति: ग्राहक किसी भी समय अपना खाता बंद करने का अनुरोध कर सकता
    है, बशर्ते वॉलेट का शेष शून्य हो और सभी लंबित लेनदेन पूरे हो चुके हों।


    डिस्क्लेमर: यह दस्तावेज़ केवल सूचना के लिए है और व्यक्तिगत वित्तीय सलाह प्रदान
    नहीं करता है।'
