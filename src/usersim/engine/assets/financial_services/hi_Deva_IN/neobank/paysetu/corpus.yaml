- id: 8254369c-5ccd-5ded-b640-5d4f50b32cc4
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — विफल या लंबित कार्रवाई
  body: 'यदि आपको पेसेतु प्रीपेड फॉरेक्स कार्ड के साथ किसी समस्या का सामना करना पड़
    रहा है, तो कृपया निम्नलिखित जांचें:


    लक्षण: लेनदेन विफल होना या कार्ड सक्रिय न होना।


    संभावित कारण और समाधान:

    1. अपर्याप्त शेष राशि: जांचें कि क्या आपके कार्ड में पर्याप्त विदेशी मुद्रा है।
    यदि नहीं, तो ₹100 रीलोड शुल्क के साथ राशि जोड़ें।

    2. गलत पिन या विवरण: सुनिश्चित करें कि आप सही पिन का उपयोग कर रहे हैं। सुरक्षा
    कारणों से, हम कभी भी आपका पिन या OTP नहीं मांगते हैं।

    3. अंतरराष्ट्रीय प्रतिबंध: जांचें कि क्या आपका कार्ड उस विशिष्ट देश में उपयोग
    के लिए सक्षम है।


    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम विफल लेनदेन के लिए RBI के सामंजस्यपूर्ण
    TAT (Turn-around-Time) का पालन करते हुए समाधान सुनिश्चित करेंगे। यदि मामला जटिल
    है, तो हम इसे आंतरिक विशेषज्ञों के पास भेजेंगे।'
