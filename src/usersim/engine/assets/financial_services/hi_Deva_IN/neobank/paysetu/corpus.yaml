  institution_id: paysetu
- id: 7c32651d-1509-5fe8-b349-f67d45e03b11
  title: बिल ऑटोपे — शर्तों में बदलाव की नीति
  body: 'पेसेतु ''बिल ऑटोपे'' की सेवा शर्तों में समय-समय पर बदलाव करने का अधिकार सुरक्षित
    रखता है।


    1. शुल्क परिवर्तन: परिचालन लागतों को कवर करने के लिए, विलंबित बिल सुविधा शुल्क,
    जो वर्तमान में ₹20 है, इसमें बदलाव किया जा सकता है।

    2. सीमाएं: AFA के बिना मैंडेट की सीमा ₹15000 है। नियामक परिवर्तनों के कारण इस
    सीमा को संशोधित किया जा सकता है।

    3. सूचना अवधि: हम डेबिट से पहले 24 घंटे की सूचना प्रदान करते हैं। इस सूचना अवधि
    में किसी भी बदलाव की जानकारी ग्राहकों को पहले से दी जाएगी।

    4. अधिसूचना: शर्तों में किसी भी महत्वपूर्ण बदलाव की सूचना आपको ऐप नोटिफिकेशन या
    ईमेल के माध्यम से दी जाएगी। यदि आप बदलाव के बाद सेवा का उपयोग जारी रखते हैं, तो
    इसे आपकी सहमति माना जाएगा।


    सेवा का समापन ग्राहक द्वारा मैंडेट रद्द करने या पेसेतु द्वारा सुरक्षा कारणों से
    इसे रोकने पर प्रभावी होगा।


    डिस्क्लेमर: अंतिम निर्णय नियामक दिशा-निर्देशों के अधीन होगा।'
