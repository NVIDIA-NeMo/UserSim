- id: 80180f8a-627d-53b0-b038-12984419c929
  title: संस्था-व्यापी शुल्क और प्रभार
  body: पेसेतु में हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है। हमारे
    अधिकांश मानक डिजिटल संचालन निःशुल्क हैं, और शुल्क केवल परिचालन लागतों को कवर करने
    के लिए लिए जाते हैं। कुछ विशिष्ट श्रेणियों या उच्च-मूल्य वाले खातों के लिए शुल्क
    माफ किए जा सकते हैं। उत्पाद-विशिष्ट शुल्क (जैसे कि फॉरेक्स मार्कअप या कार्ड जारी
    करने का शुल्क) संबंधित उत्पाद की शुल्क अनुसूची में दिए गए हैं। हम किसी भी छिपे
    हुए शुल्क का विरोध करते हैं और सभी प्रभारों को स्पष्ट रूप से सूचित करते हैं।
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 7a68f9ce-7aa3-5c7a-98db-ff1eb38dc666
  title: सामान्य अक्सर पूछे जाने वाले प्रश्न
  body: 'प्रश्न: मैं पेसेतु सहायता टीम से कैसे संपर्क कर सकता हूँ?

    उत्तर: हम मुख्य रूप से ऐप-आधारित सहायता प्रदान करते हैं, जो भारतीय मानक समय (IST)
    के अनुसार 24/7 उपलब्ध है।


    प्रश्न: यदि मेरी शिकायत का समाधान नहीं होता है तो मैं क्या करूँ?

    उत्तर: जटिल मुद्दों को पहले हमारे आंतरिक विशेषज्ञों के पास भेजा जाता है और अंततः
    नियामक लोकपाल (Ombudsman) के पास भेजा जा सकता है।


    प्रश्न: क्या मेरा पैसा पेसेतु में सुरक्षित है?

    उत्तर: हाँ, हम RBI के दिशा-निर्देशों का पालन करते हैं और ग्राहकों को DICGC बीमा
    (₹5,00,000 तक) की सुरक्षा प्रदान करते हैं।'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 4156efb2-3d18-5984-bf69-70a2c5911049
  title: रिटेल बैंकिंग के लिए नियामक नोट्स
  body: पेसेतु रिटेल बैंकिंग परिचालन में RBI और NPCI के दिशा-निर्देशों का सख्ती से
    पालन करता है। एजेंटों के लिए यह अनिवार्य है कि वे ग्राहकों को DICGC बीमा के बारे
    में स्पष्ट जानकारी दें, जिसके तहत ₹5,00,000 तक की जमा राशि सुरक्षित है। डेटा गोपनीयता
    और निष्पक्ष उपचार हमारी प्राथमिकता है। एजेंटों को यह सुनिश्चित करना चाहिए कि कोई
    भी खाता विवरण परिवर्तन केवल सख्त पहचान सत्यापन के बाद ही किया जाए। किसी भी वित्तीय
    सलाह के संदर्भ में, एजेंट केवल वित्तीय साक्षरता और उत्पाद शिक्षा प्रदान करेंगे;
    व्यक्तिगत टैक्स या कानूनी सलाह देना प्रतिबंधित है। अनुपालन मानकों का उल्लंघन करने
    वाली किसी भी कार्रवाई की तुरंत रिपोर्ट की जानी चाहिए।
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: ac398928-b4b0-5501-9855-5ab325f523f2
  title: कार्ड के लिए नियामक नोट्स
  body: पेसेतु प्रीपेड फॉरेक्स कार्ड का संचालन विदेशी मुद्रा प्रबंधन अधिनियम (FEMA)
    और RBI के प्रीपेड पेमेंट इंस्ट्रूमेंट्स (PPI) दिशानिर्देशों के अधीन है। एजेंटों
    को यह सुनिश्चित करना चाहिए कि कार्ड जारी करने से पहले ग्राहक का KYC स्तर सत्यापित
    किया गया हो। सुरक्षा के दृष्टिकोण से, एजेंट कभी भी ग्राहक से उनका CVV, OTP या
    पिन नहीं मांगेंगे। कार्ड के विवरण में किसी भी बदलाव के लिए सख्त पहचान सत्यापन
    अनिवार्य है। किसी भी विवाद या धोखाधड़ी की रिपोर्टिंग के मामले में, एजेंटों को
    RBI के निर्धारित टर्न-अराउंड समय (TAT) का पालन करना होगा ताकि समय पर समाधान सुनिश्चित
    किया जा सके। सभी कार्ड लेनदेन पारदर्शी होने चाहिए और लागू शुल्क स्पष्ट रूप से
    बताए जाने चाहिए।
  domain: cards
