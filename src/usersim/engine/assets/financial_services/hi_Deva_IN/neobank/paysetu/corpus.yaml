- id: 1ead9051-994d-563f-8e28-8735a24568fc
  title: बिल ऑटोपे — बदलाव या अद्यतन करना
  body: 'अपने मौजूदा बिल ऑटोपे मैंडेट को अपडेट करने के लिए इन चरणों का पालन करें:


    1. हमें बताएं कि आप किस विशिष्ट बिलर के लिए मैंडेट राशि या तिथि बदलना चाहते हैं।

    2. हम आपके वर्तमान मैंडेट का विवरण (जैसे वर्तमान सीमा ₹15000 तक) और नई मांगी गई
    राशि की पुष्टि करेंगे।

    3. सुरक्षा के लिए, हम आपकी पहचान का सत्यापन करेंगे।

    4. सत्यापन के बाद, हम मैंडेट में बदलाव करेंगे और आपको एक पुष्टिकरण संदेश भेजेंगे।

    5. आप अपने ऐप के ''सक्रिय मैंडेट'' सेक्शन में अपडेटेड विवरण देख सकते हैं।


    एक बार बदलाव सफल हो जाने पर, अगले भुगतान चक्र से नई शर्तें लागू होंगी और आपको
    डेबिट से 24 घंटे पहले की सूचना प्राप्त होती रहेगी।


    डिस्क्लेमर: कुछ बिलर सीधे बदलाव की अनुमति नहीं देते, ऐसी स्थिति में नया मैंडेट
    बनाना होगा।'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: b4614553-f48d-53a1-952f-54c8eccb12c9
  title: बिल ऑटोपे — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: आप अपने बिल ऑटोपे डैशबोर्ड तक नहीं पहुँच पा रहे हैं या मैंडेट प्रबंधित
    करते समय ऐप त्रुटि दिखा रहा है।


    संभावित कारण:

    - इंटरनेट कनेक्शन की अस्थिरता।

    - ऐप का पुराना संस्करण।

    - पहचान सत्यापन की आवश्यकता।


    समाधान के चरण:

    1. अपना इंटरनेट कनेक्शन जांचें और ऐप को रीस्टार्ट करें।

    2. सुनिश्चित करें कि आप ऐप का नवीनतम संस्करण उपयोग कर रहे हैं।

    3. यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति और KYC स्तर
    की जांच करेंगे।


    यदि यह एक तकनीकी खराबी है, तो हम आंतरिक विशेषज्ञों के पास मामला भेजेंगे। समाधान
    के लिए लगने वाला TAT (Turn-around-Time) RBI के मानकों के अनुसार होगा। यदि समस्या
    जटिल है, तो इसे नियामक लोकपाल (Ombudsman) तक ले जाया जा सकता है।


    डिस्क्लेमर: लॉगिन समस्याओं के लिए कभी भी अपना PIN साझा न करें।'
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
