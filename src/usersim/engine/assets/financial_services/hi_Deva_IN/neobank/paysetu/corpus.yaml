  institution_id: paysetu
- id: 303208ff-8849-5ca4-8e44-15ec350b9c99
  title: पेसेतु डिजिटल बचत खाता — शुल्क अनुसूची
  body: 'पेसेतु में हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है। पेसेतु
    डिजिटल बचत खाता के लिए शुल्क विवरण निम्नानुसार हैं:


    - खाता खोलना: ₹0

    - न्यूनतम शेष राशि बनाए रखने का शुल्क: ₹0 (क्योंकि न्यूनतम शेष ₹0 है)

    - मासिक रखरखाव शुल्क: ₹0


    हम केवल परिचालन लागतों को कवर करने के लिए शुल्क लेते हैं। विशिष्ट उच्च-मूल्य खातों
    के लिए कुछ अन्य परिचालन शुल्क माफ किए जा सकते हैं।'
  domain: retail_banking
  product_category: digital_savings
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: a8bb9bb2-f0b5-561a-b299-c396169b8df1
  title: पेसेतु डिजिटल बचत खाता — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने खाते में किसी लेनदेन या अपडेट के साथ समस्या आ रही है, तो कृपया
    यह जांचें:


    लक्षण: ''लेनदेन लंबित'' या ''KYC विफल'' संदेश दिखना।


    संभावित कारण और समाधान:

    1. KYC दस्तावेज स्पष्ट नहीं हैं: यदि आपकी Full-KYC विफल हुई है, तो कृपया सुनिश्चित
    करें कि अपलोड किए गए दस्तावेज़ स्पष्ट हैं। याद रखें कि पूर्ण सत्यापन के लिए 30
    दिनों की समय सीमा होती है।

    2. नेटवर्क त्रुटि: इंटरनेट कनेक्शन की जांच करें और पुनः प्रयास करें।


    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम मामले की जांच करेंगे और RBI के
    निर्धारित टर्न-अराउंड समय (TAT) के भीतर समाधान सुनिश्चित करेंगे। विफल लेनदेन के
    मामले में, रिफंड प्रक्रिया सामंजस्यपूर्ण TAT के अनुसार पूरी की जाएगी।


    डिस्क्लेमर: पेसेतु केवल उन्हीं उत्पादों की सिफारिश करता है जो ग्राहक की वित्तीय
    स्थिति के अनुकूल हों।'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 9a99fa8c-dff1-53a5-914e-d6ecb8cf5556
  title: पेसेतु डिजिटल बचत खाता — पात्रता शर्तें
  body: "पेसेतु डिजिटल बचत खाता के लिए पात्रता मानदंड:\n\n- मूल पात्रता: भारतीय निवासी,\
    \ डिजिटल रूप से सक्षम।\n- न्यूनतम आयु: 18 वर्ष और उससे अधिक।\n- आवश्यक दस्तावेज़:\
    \ वैध पैन कार्ड और आधार (या अन्य स्वीकृत पहचान प्रमाण)।\n\nपरिणाम:\n- बुनियादी\
    \ KYC पूर्ण $\rightarrow$ खाता सक्रिय, सीमित लेनदेन सीमाएं।\n- Full-KYC पूर्ण\
    \ (30 दिनों के भीतर) $\rightarrow$ उच्च लेनदेन सीमाएं प्रदान की जाती हैं।"
  domain: retail_banking
  product_category: digital_savings
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
