- id: 765c8719-fdd5-56ac-989d-9ad3ba7792af
  title: पेसेतु डिजिटल बचत खाता — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके ''पेसेतु डिजिटल बचत खाता'' की सुरक्षा हमारी सर्वोच्च प्राथमिकता है।
    अपने फंड्स को सुरक्षित रखने के लिए कृपया इन सर्वोत्तम प्रथाओं का पालन करें:


    1. गोपनीय जानकारी साझा न करें: पेसेतु आपसे कभी भी आपका UPI PIN, OTP या CVV नहीं
    मांगता है। यदि कोई व्यक्ति खुद को बैंक अधिकारी बताकर ये विवरण मांगे, तो वह धोखाधड़ी
    हो सकती है।

    2.strong पासवर्ड का उपयोग करें: अपने ऐप लॉगिन के लिए एक जटिल पासवर्ड रखें और इसे
    समय-समय पर बदलते रहें।

    3. आधिकारिक संचार: हम केवल प्रमाणित माध्यमों से ही आपसे संपर्क करते हैं। किसी
    भी संदिग्ध लिंक पर क्लिक न करें जो आपसे व्यक्तिगत विवरण या पिन अपडेट करने को कहे।

    4. तत्काल रिपोर्टिंग: यदि आपको अपने खाते में कोई अनधिकृत लेनदेन दिखता है, तो तुरंत
    हमें सूचित करें। त्वरित रिपोर्टिंग से धोखाधड़ी के प्रभाव को कम करने और रिफंड प्रक्रिया
    को तेज करने में मदद मिलती है।


    हम RBI और NPCI के दिशा-निर्देशों का सख्ती से पालन करते हैं ताकि आपका डेटा और पैसा
    सुरक्षित रहे। अधिक सुरक्षा युक्तियों के लिए ''पेसेतु डिजिटल बचत खाता — धोखाधड़ी
    और अनधिकृत गतिविधि से सुरक्षा'' पढ़ें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: security_advisory
  source_authority: official
