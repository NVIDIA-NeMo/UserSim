- id: 2f3fe361-18fd-5958-a6c1-09a701159bf1
  title: पेसेतु डिजिटल बचत खाता — पात्रता और सेटअप
  body: 'प्रश्न: पेसेतु डिजिटल बचत खाता खोलने के लिए कौन पात्र है?

    उत्तर: तकनीकी रूप से जागरूक युवा और डिजिटल प्रवासी जो सरल भुगतान और बचत समाधान
    चाहते हैं, वे इसके लिए पात्र हैं।


    प्रश्न: सेटअप प्रक्रिया में कितना समय लगता है?

    उत्तर: डिजिटल सेटअप तुरंत होता है, लेकिन पूर्ण सेवाओं और उच्च सीमाओं के लिए Full-KYC
    अनिवार्य है, जिसे खाता खोलने के 30 दिन के भीतर पूरा किया जाना चाहिए। अधिक जानकारी
    के लिए ''पेसेतु डिजिटल बचत खाता — पात्रता शर्तें'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: faq
  source_authority: official
  placeholder: true
