- id: 3f33c08b-bef8-5cc2-9df0-44c37239d136
  title: पेसेतु डिजिटल बचत खाता — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'पेसेतु डिजिटल बचत खाते के लिए एक सरल और पारदर्शी ब्याज संरचना अपनाई गई है।
    इस उत्पाद के लिए कोई जटिल टियर या श्रेणी नहीं है।


    सभी पात्र जमा राशियों पर 3.5% की एक समान वार्षिक ब्याज दर लागू होती है। यह दर
    खाते में मौजूद दैनिक शेष राशि पर गणना की जाती है। ब्याज की गणना और क्रेडिट की
    आवृत्ति आंतरिक बैंक नीतियों और नियामक मानकों के अनुसार होती है। दर में किसी भी
    बदलाव की सूचना ग्राहकों को समय पर दी जाएगी।'
