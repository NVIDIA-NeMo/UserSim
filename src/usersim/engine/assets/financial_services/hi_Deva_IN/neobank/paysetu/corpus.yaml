- id: 02e57fc4-8284-5bab-9226-bab28888fbfe
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — पात्रता शर्तें
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड की पात्रता निम्नलिखित शर्तों पर आधारित है:


    - Full-KYC स्थिति: पूर्ण पहचान और पते के प्रमाण के बाद ही कार्ड जारी किया जाएगा।

    - खाता स्थिति: आपका पेसेतु खाता सक्रिय होना चाहिए।

    - अनुपालन: ग्राहक को RBI और NPCI के विदेशी मुद्रा प्रबंधन दिशा-निर्देशों का पालन
    करना होगा।


    इन शर्तों को पूरा करने वाले सभी पात्र ग्राहकों को ₹150 के जारी करने के शुल्क के
    भुगतान के बाद कार्ड प्रदान किया जाता है।'
