  institution_id: paysetu
- id: 29cc9eda-ae48-5193-951e-3e9ca61fddad
  title: पेसेतु वॉलेट और UPI — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: आपका लेनदेन ''अस्वीकृत'' (Declined) या ''अवरुद्ध'' (Blocked) दिखा
    रहा है।


    संभावित कारण:

    - आपका वॉलेट शेष ₹10000 (Min-KYC) या ₹200000 (Full-KYC) की सीमा से अधिक हो गया
    है।

    - एकल लेनदेन राशि ₹100000 की UPI प्रति लेनदेन सीमा से अधिक है।

    - अपूर्ण KYC दस्तावेज़ या सुरक्षा कारणों से खाता फ्रीज होना।


    समाधान के चरण:

    1. जांचें कि क्या लेनदेन राशि ₹100000 से अधिक है; यदि हाँ, तो राशि कम करके पुनः
    प्रयास करें।

    2. अपने KYC स्तर की जांच करें; यदि आप Min-KYC पर हैं और सीमा समाप्त हो गई है,
    तो Full-KYC के लिए आवेदन करें।

    3. पुष्टि करें कि आपका वॉलेट बैलेंस निर्धारित सीमा के भीतर है।


    यदि समस्या बनी रहती है, तो हम आंतरिक विशेषज्ञों के माध्यम से आपके खाते की समीक्षा
    करेंगे और समाधान सुनिश्चित करेंगे। जटिल मुद्दों को नियामक लोकपाल (Ombudsman) के
    पास भेजा जा सकता है।'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: b0bb6d29-a043-5bc3-8edc-bc3637d9767c
  title: पेसेतु वॉलेट और UPI — कब स्विच या अपग्रेड करें
  body: "आपको अपने वर्तमान स्तर को अपग्रेड करने की आवश्यकता तब होती है जब आपकी वित्तीय\
    \ ज़रूरतें बढ़ जाती हैं। यदि आप वर्तमान में Min-KYC पर हैं और आपका वॉलेट बैलेंस\
    \ ₹10000 की सीमा तक पहुँच गया है, तो आपको Full-KYC पर स्विच करना चाहिए ताकि आप\
    \ ₹200000 तक की उच्च बैलेंस सीमा का लाभ उठा सकें। \n\nयदि आप केवल छोटे भुगतानों\
    \ के लिए UPI का उपयोग करते हैं, तो वर्तमान सेटअप पर्याप्त है, लेकिन उच्च-मूल्य\
    \ लेनदेन के लिए Full-KYC अनिवार्य है। यह स्विच आपको अधिक लचीलापन और बेहतर सीमाएं\
    \ प्रदान करता है।"
