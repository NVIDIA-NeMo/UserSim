- id: d07898d9-d4f6-5309-ae9a-fb5ff3c45551
  title: पेसेतु डिजिटल बचत खाता — बचत ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरे पेसेतु डिजिटल बचत खाते पर कितनी ब्याज दर मिलती है?

    उत्तर: आपके खाते में जमा राशि पर 3.5% की वार्षिक ब्याज दर लागू होती है।


    प्रश्न: क्या ब्याज दर न्यूनतम शेष राशि के आधार पर बदलती है?

    उत्तर: नहीं, पेसेतु डिजिटल बचत खाता में न्यूनतम शेष राशि ₹0 है, और 3.5% की दर
    सभी पात्र जमा राशियों पर समान रूप से लागू होती है।


    अधिक विवरण के लिए ''पेसेतु डिजिटल बचत खाता — ब्याज दर अनुसूची'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: faq
  source_authority: official
  placeholder: true
