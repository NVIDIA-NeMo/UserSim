- id: e873cab5-a6b0-5316-b597-4739a8b9369c
  title: बिल ऑटोपे — डेबिट से पहले सूचना की अवधि (घंटे) की व्याख्या
  body: 'प्रश्न: मुझे पता कैसे चलेगा कि मेरे खाते से बिल की राशि कब काटी जाएगी?

    उत्तर: पारदर्शिता सुनिश्चित करने के लिए, बिल ऑटोपे के तहत प्रत्येक भुगतान से ठीक
    24 घंटे पहले आपको एक पूर्व-डेबिट सूचना भेजी जाती है।


    प्रश्न: क्या मैं इस सूचना अवधि को बदल सकता हूँ?

    उत्तर: नहीं, 24 घंटे की यह अवधि सभी ग्राहकों के लिए मानक है ताकि आपको अपने खाते
    में पर्याप्त राशि सुनिश्चित करने का समय मिल सके। अधिक जानकारी के लिए बिल ऑटोपे
    — सिंहावलोकन देखें।'
  domain: payments
  product_category: bill_autopay
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 7e1cd3a1-c4e7-58d2-badf-14d4c6170142
  title: बिल ऑटोपे — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपने बिल ऑटोपे मैंडेट को रद्द या बंद करने के लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप किस विशिष्ट बिलर या मैंडेट को रद्द करना चाहते हैं।

    2. हम आपके खाते से जुड़े सक्रिय मैंडेट की सूची प्रदर्शित करेंगे; कृपया वह मैंडेट
    चुनें जिसे आप बंद करना चाहते हैं।

    3. आपसे पुष्टि मांगी जाएगी कि क्या आप भविष्य के सभी स्वचालित भुगतानों को रोकना
    चाहते हैं।

    4. एक बार पुष्टि होने के बाद, हम मैंडेट को रद्द कर देंगे और आपको एक पुष्टिकरण
    संदेश भेजेंगे।


    यदि आप मैंडेट की राशि को कम (डाउनग्रेड) करना चाहते हैं, तो आपको वर्तमान मैंडेट
    को रद्द करना होगा और नई सीमा के साथ एक नया मैंडेट सेट करना होगा। यह सुनिश्चित
    करें कि नया मैंडेट ₹15000 की बिना AFA वाली सीमा का पालन करता हो यदि आप अतिरिक्त
    प्रमाणीकरण से बचना चाहते हैं।


    सफलतापूर्वक रद्द होने पर, आपको भविष्य में उस बिलर के लिए कोई स्वचालित डेबिट या
    ₹20 का विलंबित शुल्क नहीं लगेगा।'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: aebeb765-aa55-5321-b44e-525317485a1b
  title: बिल ऑटोपे — अनपेक्षित शुल्क या राशि
  body: "यदि आपको अपने खाते में कोई ऐसा शुल्क या राशि दिखाई देती है जिसकी आपने अपेक्षा\
    \ नहीं की थी, तो कृपया निम्नलिखित चरणों का पालन करें:\n\n- लक्षण: खाते से ₹20\
    \ की कटौती या मैंडेट सीमा से अधिक राशि का डेबिट।\n- संभावित कारण: \n  1. बिल का\
    \ समय पर भुगतान न होने के कारण ₹20 का विलंबित बिल सुविधा शुल्क लागू हुआ हो।\n\
    \  2. बिलर ने मैंडेट सीमा के भीतर राशि का अनुरोध किया हो।\n\nजाँच प्रक्रिया:\n\
    1. अपने लेनदेन इतिहास में देखें कि क्या शुल्क का विवरण 'Late Bill Convenience\
    \ Fee' के रूप में दर्ज है।\n2. यह जाँचें कि क्या भुगतान की तारीख आपके बिल की देय\
    \ तिथि के बाद थी।\n\nसमाधान:\nयदि आपको लगता है कि ₹20 का शुल्क गलत तरीके से लगाया\
    \ गया है, तो हमें विवरण प्रदान करें। हम आंतरिक विशेषज्ञों के माध्यम से इसकी समीक्षा\
    \ करेंगे। यदि त्रुटि पाई जाती है, तो RBI के TAT के अनुसार रिफंड संसाधित किया जाएगा।\
    \ यदि मामला जटिल है, तो इसे नियामक लोकपाल (Ombudsman) के पास भेजा जा सकता है।"
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 6330f2ee-ecb2-5cfb-aee4-62cb0f288128
  title: बिल ऑटोपे — आवश्यक दस्तावेज़
  body: "बिल ऑटोपे सेवा का उपयोग करने के लिए दस्तावेज़ आवश्यकताओं का विवरण नीचे दिया\
    \ गया है:\n\n- बुनियादी मैंडेट सेटअप $\rightarrow$ केवल एक सक्रिय पेसेतु खाता\
    \ और सत्यापित मोबाइल नंबर।\n- उच्च मूल्य लेनदेन सीमाएँ $\rightarrow$ Full-KYC\
    \ पूर्ण होना अनिवार्य है (पूर्ण पहचान और पते के प्रमाण के साथ)।\n- स्वचालित भुगतान\
    \ सक्रियण $\rightarrow$ बिलर द्वारा स्वीकार्य डिजिटल अनुमति (UPI Mandate)।"
  domain: payments
  product_category: bill_autopay
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
