- id: bce4d8ee-7bc5-522f-8935-b9e5c0b7ed64
  title: बिल ऑटोपे — AFA के बिना मैंडेट की सीमा की व्याख्या
  body: 'प्रश्न: AFA के बिना मैंडेट की सीमा क्या है और इसका क्या मतलब है?

    उत्तर: ''बिल ऑटोपे'' के तहत, यदि आप प्रत्येक लेनदेन के लिए अतिरिक्त प्रमाणीकरण
    (Additional Factor Authentication) का उपयोग नहीं करना चाहते हैं, तो आप अधिकतम
    ₹15000 तक की सीमा के लिए मैंडेट सेट कर सकते हैं। इस राशि तक के भुगतान स्वचालित
    रूप से संसाधित होंगे।


    प्रश्न: क्या मैं इस सीमा को बढ़ा सकता हूँ?

    उत्तर: सीमाएं नियामक मानकों और आपके KYC स्तर पर आधारित होती हैं। अधिक जानकारी
    के लिए ''बिल ऑटोपे — पात्रता शर्तें'' देखें।'
  domain: payments
  product_category: bill_autopay
  document_type: faq
  source_authority: official
