- id: acb5c876-e490-5fed-aa9a-4da37dfaf467
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड का उपयोग करते समय आपकी सुरक्षा हमारी प्राथमिकता
    है। अंतरराष्ट्रीय यात्रा के दौरान, ''स्किमिंग'' (ATM से कार्ड की जानकारी चुराना)
    और फिशिंग ईमेल सबसे आम खतरे हैं। कृपया ध्यान दें कि पेसेतु आपसे कभी भी आपका UPI
    PIN, OTP या CVV नहीं मांगेगा।


    यदि आपको अपने कार्ड पर कोई अनधिकृत लेनदेन दिखता है या आपका कार्ड खो जाता है, तो
    तुरंत हमें सूचित करें। हम विफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के लिए एक त्वरित
    और पारदर्शी प्रक्रिया अपनाते हैं। रिफंड के लिए हम RBI के सामंजस्यपूर्ण टर्न-अराउंड
    समय (TAT) का पालन करते हैं।


    सुरक्षित रहने के लिए: केवल विश्वसनीय ATM का उपयोग करें और अपने कार्ड के विवरण
    किसी के साथ साझा न करें। किसी भी संदिग्ध गतिविधि की रिपोर्ट करने में देरी न करें,
    क्योंकि त्वरित रिपोर्टिंग आपके दायित्व को सीमित करने में मदद करती है।'
  domain: cards
  product_category: prepaid_forex_card
  document_type: security_advisory
