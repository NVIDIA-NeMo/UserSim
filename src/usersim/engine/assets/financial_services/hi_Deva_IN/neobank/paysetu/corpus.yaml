- id: 6594980d-2182-51c1-a9d6-2f783587809d
  title: बिल ऑटोपे — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'बिल ऑटोपे का उपयोग करते समय आपकी सुरक्षा हमारी प्राथमिकता है। कृपया निम्नलिखित
    सर्वोत्तम प्रथाओं का पालन करें:


    1. गोपनीयता बनाए रखें: पेसेतु आपसे कभी भी आपका UPI PIN, OTP या CVV नहीं मांगेगा।
    यदि कोई व्यक्ति ऐसा दावा करता है, तो वह धोखाधड़ी हो सकती है।

    2. मैंडेट की निगरानी करें: समय-समय पर अपने सक्रिय UPI Mandates की जांच करें ताकि
    यह सुनिश्चित हो सके कि केवल अधिकृत बिलों के लिए ही भुगतान हो रहा है।

    3. संदिग्ध गतिविधि: यदि आपको कोई ऐसा डेबिट नोटिफिकेशन मिलता है जिसे आपने अधिकृत
    नहीं किया है, तो तुरंत हमें सूचित करें।

    4. सत्यापन: किसी भी खाते के विवरण में बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य
    है।


    यदि आपको कोई संदिग्ध लेनदेन दिखता है, तो तत्काल रिपोर्ट करें ताकि हम RBI के सामंजस्यपूर्ण
    TAT के भीतर समाधान सुनिश्चित कर सकें।


    डिस्क्लेमर: सुरक्षा प्रोटोकॉल का पालन न करने पर जोखिम उपयोगकर्ता का होगा।'
  domain: payments
  product_category: bill_autopay
  document_type: security_advisory
  source_authority: official
