  institution_id: paysetu
- id: 287affec-d3ff-597c-b7ef-54b1ca52f544
  title: पेसेतु डिजिटल बचत खाता — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'अपने पेसेतु डिजिटल बचत खाता में Full-KYC पूरा करने के अनुरोध का समाधान करने
    के लिए इन चरणों का पालन करें:


    1. हमें बताएं कि आप अपने खाते का Full-KYC पूरा करना चाहते हैं।

    2. हम आपसे आपके आधिकारिक पहचान प्रमाण (जैसे आधार या पैन कार्ड) और पते के प्रमाण
    की डिजिटल प्रतियां मांगेंगे।

    3. आप हमें ये दस्तावेज प्रदान करें।

    4. हम आपके द्वारा प्रदान किए गए दस्तावेजों का सत्यापन करेंगे।

    5. सत्यापन सफल होने पर, हम आपको पुष्टिकरण भेजेंगे कि अब आपका Full-KYC पूरा हो
    गया है और आपकी लेनदेन सीमाएं बढ़ा दी गई हैं।


    याद रखें कि यह प्रक्रिया खाता खोलने के 30 दिन के भीतर पूरी की जानी चाहिए। इस समाधान
    के बाद आप बिना किसी प्रतिबंध के 3.5% ब्याज दर और उच्च सीमाओं का लाभ उठा सकते हैं।'
  domain: retail_banking
  product_category: digital_savings
  document_type: how_to_guide
  source_authority: official
