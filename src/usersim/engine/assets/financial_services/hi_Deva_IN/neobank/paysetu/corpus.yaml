- id: 562b2646-5e37-5f98-9072-2f4ad0083b1d
  title: पेसेतु वॉलेट और UPI — गोपनीयता और डेटा प्रबंधन
  body: 'पेसेतु आपके डेटा की गोपनीयता और सुरक्षा के लिए प्रतिबद्ध है। हम RBI और NPCI
    के दिशा-निर्देशों का सख्ती से पालन करते हैं।


    डेटा उपयोग: आपके द्वारा प्रदान किए गए KYC विवरणों का उपयोग केवल पहचान सत्यापन
    और नियामक अनुपालन के लिए किया जाता है। हम आपका डेटा केवल प्रमाणित भागीदारों के
    साथ साझा करते हैं जो भुगतान प्रसंस्करण के लिए आवश्यक हैं।


    सुरक्षा मानक: हम डेटा एन्क्रिप्शन और सख्त एक्सेस कंट्रोल का उपयोग करते हैं। किसी
    भी लेनदेन से पहले सख्त पहचान सत्यापन अनिवार्य है। आपका डेटा DICGC बीमा ढांचे (₹5,00,000
    तक) के तहत सुरक्षित बचत खातों के समान सुरक्षा वातावरण में प्रबंधित किया जाता है
    जहाँ लागू हो।


    हम ग्राहकों को उनके डेटा के निष्पक्ष उपचार का आश्वासन देते हैं और किसी भी तीसरे
    पक्ष को आपकी सहमति के बिना व्यक्तिगत जानकारी नहीं बेचते हैं।


    डिस्क्लेमर: डेटा गोपनीयता नीतियां नियामक परिवर्तनों के अधीन हैं।'
  domain: payments
