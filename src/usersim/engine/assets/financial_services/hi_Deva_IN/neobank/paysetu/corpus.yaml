- id: 91747b77-08b9-594c-8683-d0919dd069a2
  title: पेसेतु डिजिटल बचत खाता — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक को लगता है कि उनके खाते के बैलेंस या लेनदेन इतिहास में कोई
    त्रुटि है या यह उनके व्यक्तिगत रिकॉर्ड से मेल नहीं खाता।


    जांच के चरण:

    1. ग्राहक से अनुरोध करें कि वे जिस विशिष्ट लेनदेन या राशि में अंतर देख रहे हैं,
    उसका विवरण (तिथि और राशि) प्रदान करें।

    2. सिस्टम में दर्ज लेनदेन इतिहास की तुलना ग्राहक द्वारा बताए गए विवरण से करें।

    3. जांचें कि क्या कोई लंबित लेनदेन है जो अभी तक बैलेंस में अपडेट नहीं हुआ है।

    4. यह सुनिश्चित करें कि क्या कोई परिचालन शुल्क काटा गया है (हालांकि हमारा दृष्टिकोण
    न्यूनतम शुल्क का है)।


    समाधान:

    - यदि कोई तकनीकी त्रुटि पाई जाती है, तो हम उसे तुरंत सुधारेंगे।

    - यदि लेनदेन विफल हुआ है, तो हम RBI के TAT के अनुसार रिफंड प्रक्रिया शुरू करेंगे।

    - यदि अंतर स्पष्ट नहीं है, तो हम मामले को आंतरिक विशेषज्ञों के पास भेजेंगे और
    ग्राहक को समाधान की समय सीमा के बारे में सूचित करेंगे।'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 7455d6b3-bcca-5a62-b989-b071e9a53978
  title: पेसेतु वॉलेट और UPI — सिंहावलोकन
  body: 'पेसेतु वॉलेट और UPI एक आधुनिक डिजिटल भुगतान समाधान है जो तेज़ और आसान भुगतान
    के लिए UPI और वॉलेट का संयोजन प्रदान करता है। यह तकनीकी रूप से जागरूक युवाओं और
    डिजिटल प्रवासियों के लिए डिज़ाइन किया गया है, जो बिना किसी जटिलता के निर्बाध भुगतान
    अनुभव चाहते हैं।


    मुख्य विशेषताएं और सीमाएं:

    - वॉलेट बैलेंस सीमा (न्यूनतम KYC): ₹10000 तक

    - वॉलेट बैलेंस सीमा (Full-KYC): ₹200000 तक

    - UPI प्रति लेनदेन सीमा: ₹100000


    यह उत्पाद आपको अपने दैनिक खर्चों के लिए वॉलेट का उपयोग करने और बड़े भुगतानों के
    लिए UPI का लाभ उठाने की सुविधा देता है। आपकी लेनदेन सीमा आपके द्वारा पूरे किए
    गए सत्यापन (KYC) स्तर पर निर्भर करती है।


    डिस्क्लेमर: पेसेतु RBI और NPCI के दिशा-निर्देशों का पालन करता है। वॉलेट बैलेंस
    पर DICGC बीमा लागू नहीं होता है।'
  domain: payments
  product_category: upi_wallet
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 46c635a8-b49e-544c-85ce-e47202bfd506
  title: पेसेतु वॉलेट और UPI — न्यूनतम KYC वॉलेट शेष सीमा की व्याख्या
  body: 'प्रश्न: न्यूनतम KYC के साथ मैं अपने वॉलेट में अधिकतम कितनी राशि रख सकता हूँ?

    उत्तर: यदि आपने केवल न्यूनतम KYC प्रक्रिया पूरी की है, तो आपके वॉलेट बैलेंस की
    अधिकतम सीमा ₹10000 है।


    प्रश्न: यदि मुझे इस सीमा से अधिक राशि रखने की आवश्यकता है तो मुझे क्या करना चाहिए?

    उत्तर: आप Full-KYC प्रक्रिया पूरी करके अपनी वॉलेट बैलेंस सीमा को बढ़ाकर ₹200000
    तक कर सकते हैं।


    अधिक जानकारी के लिए ''पेसेतु वॉलेट और UPI — पात्रता शर्तें'' देखें।'
  domain: payments
  product_category: upi_wallet
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: da419a9f-13ba-5c23-898b-5bc4bbec1396
  title: पेसेतु वॉलेट और UPI — सेटअप और सक्रियण
  body: 'पेसेतु वॉलेट और UPI को सक्रिय करने के लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपना वॉलेट और UPI सेटअप करना चाहते हैं।

    2. अपना आधार और पैन विवरण प्रदान करें ताकि हम आपकी प्रारंभिक पहचान का सत्यापन
    कर सकें।

    3. अपने बैंक खाते को लिंक करने के लिए अपना मोबाइल नंबर साझा करें, जो आपके बैंक
    में पंजीकृत हो।

    4. हम आपके विवरण सत्यापित करेंगे और आपका डिजिटल वॉलेट सक्रिय कर देंगे।

    5. अपना UPI PIN सेट करें। एक बार PIN सेट हो जाने पर, आप ₹100000 तक की प्रति लेनदेन
    सीमा के साथ भुगतान शुरू कर सकते हैं।


    सत्यापन सफल होने पर आपको एक पुष्टिकरण संदेश प्राप्त होगा, जो दर्शाता है कि आपकी
    सेवा सक्रिय हो गई है।'
  domain: payments
  product_category: upi_wallet
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: d7fe8ae5-a5a7-58c4-8c2e-be36f69e1ce7
  title: पेसेतु वॉलेट और UPI — शुल्क अनुसूची
  body: 'पेसेतु में हमारा दृष्टिकोण न्यूनतम शुल्क और अधिकतम पारदर्शिता का है। पेसेतु
    वॉलेट और UPI के लिए शुल्क इस प्रकार हैं:


    - वॉलेट खोलना और सक्रियण: ₹0

    - मानक UPI लेनदेन: ₹0

    - वॉलेट में राशि लोड करना: ₹0

    - मासिक रखरखाव शुल्क: ₹0


    सभी शुल्क केवल परिचालन लागतों को कवर करने के लिए लिए जाते हैं, और वर्तमान में
    इस उत्पाद के लिए कोई सेवा शुल्क नहीं है।'
  domain: payments
  product_category: upi_wallet
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: fde18175-9c3e-5e42-bd4f-d27a3eeca9f0
  title: पेसेतु वॉलेट और UPI — विफल या लंबित कार्रवाई
  body: 'यदि आपका लेनदेन विफल हो जाता है या लंबित रहता है, तो कृपया निम्नलिखित चरणों
    का पालन करें:


    लक्षण: ''लेनदेन विफल'' का संदेश या वॉलेट से राशि कटना लेकिन प्राप्तकर्ता तक न
    पहुँचना।


    जांच के चरण:

    1. अपना इंटरनेट कनेक्शन और बैंक सर्वर की स्थिति की जाँच करें।

    2. सुनिश्चित करें कि लेनदेन राशि ₹100000 की प्रति लेनदेन सीमा से अधिक नहीं है।

    3. अपने वॉलेट बैलेंस की जाँच करें कि वह आपकी KYC सीमा (₹10000 या ₹200000) के भीतर
    है या नहीं।


    समाधान:

    यदि राशि कट गई है और लेनदेन विफल रहा है, तो हम RBI के सामंजस्यपूर्ण टर्न-अराउंड
    समय (TAT) का पालन करते हैं। विफल लेनदेन की राशि वापसी के लिए निर्धारित समय 5 दिन
    है।


    यदि 5 दिन बाद भी समाधान नहीं होता है, तो हम इस मामले को आंतरिक विशेषज्ञों और अंततः
    नियामक लोकपाल (Ombudsman) के पास भेजेंगे।'
  domain: payments
  product_category: upi_wallet
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 8aa13a3c-df0c-5e51-8402-2a0cb7e0eb5c
  title: पेसेतु वॉलेट और UPI — पात्रता शर्तें
  body: 'पात्रता और मिलने वाली सीमाएं नीचे दी गई हैं:


    - न्यूनतम KYC पूरा होने पर -> वॉलेट बैलेंस सीमा: ₹10000

    - Full-KYC (पूर्ण पहचान और पते के प्रमाण) पूरा होने पर -> वॉलेट बैलेंस सीमा: ₹200000

    - सक्रिय UPI लिंक होने पर -> प्रति लेनदेन सीमा: ₹100000


    सभी उपयोगकर्ताओं के लिए अनिवार्य: भारतीय नागरिकता और एक मान्य मोबाइल नंबर जो बैंक
    खाते से जुड़ा हो।'
  domain: payments
  product_category: upi_wallet
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 3a52c63c-27fc-5bcb-b3dd-aeff6b2e675a
  title: पेसेतु वॉलेट और UPI — यहाँ के समान उत्पाद से तुलना
  body: 'पेसेतु वॉलेट और UPI की तुलना ''पेसेतु डिजिटल बचत खाता — सिंहावलोकन'' से नीचे
    दी गई है:


    - उद्देश्य: वॉलेट और UPI त्वरित भुगतानों और छोटे खर्चों के लिए है, जबकि डिजिटल
    बचत खाता लंबी अवधि की बचत के लिए है।

    - सीमाएं: वॉलेट में KYC के आधार पर ₹10000 से ₹200000 की सीमा है, जबकि बचत खाते
    में कोई ऊपरी सीमा नहीं है।

    - लागत: दोनों ही उत्पादों में न्यूनतम शुल्क दर्शन का पालन किया जाता है।


    यदि आपको केवल तेजी से भुगतान करना है, तो पेसेतु वॉलेट और UPI बेहतर है। यदि आपको
    ब्याज कमाना है और बड़ी राशि सुरक्षित रखनी है, तो डिजिटल बचत खाता चुनें।'
  domain: payments
  product_category: upi_wallet
  document_type: comparison
  source_authority: official
  placeholder: true
