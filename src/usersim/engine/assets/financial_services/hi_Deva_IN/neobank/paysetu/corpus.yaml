- id: be2bd419-cd52-51d2-9be5-dc80ef1c4f05
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — रीलोड शुल्क की व्याख्या
  body: 'प्रश्न: पेसेतु प्रीपेड फॉरेक्स कार्ड में रीलोड शुल्क क्या है?

    उत्तर: जब आप अपने कार्ड में अतिरिक्त विदेशी मुद्रा जोड़ते हैं, तो प्रत्येक रीलोड
    लेनदेन के लिए ₹100 का शुल्क लिया जाता है। यह शुल्क परिचालन लागतों को कवर करने
    के लिए लिया जाता है।


    प्रश्न: क्या यह शुल्क हर बार लागू होगा?

    उत्तर: हाँ, कार्ड में धनराशि जोड़ने के हर प्रयास पर ₹100 का शुल्क लागू होगा। अधिक
    जानकारी के लिए पेसेतु प्रीपेड फॉरेक्स कार्ड — शुल्क अनुसूची देखें।'
