- id: 138889c2-d5dd-54b8-bc91-4dae76dcf729
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — ब्याज दर अनुसूची
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड एक प्रीपेड उत्पाद है, इसलिए इस पर कोई ब्याज
    अर्जित नहीं होता है। सभी शेष राशि 0% ब्याज दर पर रखी जाती है।


    लागत दरें:

    - क्रॉस-करेंसी मार्कअप: सभी विदेशी मुद्रा रूपांतरणों पर 2% की एक समान दर लागू
    होती है।


    यह दर सभी ग्राहकों और सभी शेष राशि श्रेणियों पर समान रूप से लागू होती है। विनिमय
    दरें वास्तविक समय के बाजार मूल्यों के आधार पर निर्धारित की जाती हैं, जिनमें हमारा
    मार्कअप जोड़ा जाता है।'
