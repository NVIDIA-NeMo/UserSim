- id: 5461ef61-77cd-5539-a1f6-6b5983889baa
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपने पेसेतु प्रीपेड फॉरेक्स कार्ड को बंद करने या रद्द करने के लिए इन चरणों
    का पालन करें:


    1. हमें कार्ड बंद करने का अनुरोध भेजें।

    2. हम आपके कार्ड के वर्तमान शेष की जांच करेंगे।

    3. यदि कार्ड में राशि शेष है, तो हम आपसे रिफंड के लिए बैंक विवरण प्रदान करने को
    कहेंगे।

    4. हम लागू शुल्कों (यदि कोई हों) को काटेंगे और शेष राशि आपके खाते में वापस भेजेंगे।

    5. एक बार प्रक्रिया पूरी होने पर, हम आपको पुष्टिकरण संदेश भेजेंगे कि आपका कार्ड
    अब निष्क्रिय है।


    नोट: यदि आप केवल कार्ड की सीमा कम करना चाहते हैं या सेवाओं को बदलना चाहते हैं,
    तो आप डाउनग्रेड के लिए अनुरोध कर सकते हैं, जिसे हम सत्यापन के बाद पूरा करेंगे।'
