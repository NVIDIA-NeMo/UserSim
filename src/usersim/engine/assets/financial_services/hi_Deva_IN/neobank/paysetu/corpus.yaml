- id: d4c36004-3cfd-5453-97cc-a119d2873b49
  title: बिल ऑटोपे — पात्रता और सेटअप
  body: 'प्रश्न: बिल ऑटोपे सेटअप करने के लिए क्या आवश्यक है?

    उत्तर: आपके पास एक सक्रिय पेसेतु खाता और एक मान्य UPI ID होनी चाहिए। साथ ही, जिस
    बिलर को आप भुगतान करना चाहते हैं, वह हमारे नेटवर्क में समर्थित होना चाहिए।


    प्रश्न: क्या इसके लिए Full-KYC अनिवार्य है?

    उत्तर: बुनियादी मैंडेट के लिए सामान्य KYC पर्याप्त है, लेकिन उच्च लेनदेन सीमाओं
    और बेहतर सेवाओं के लिए Full-KYC की सिफारिश की जाती है।


    प्रश्न: सेटअप में कितना समय लगता है?

    उत्तर: मैंडेट सेटअप लगभग तुरंत हो जाता है, हालांकि बिलर के साथ समन्वय में कुछ
    समय लग सकता है।'
  domain: payments
  product_category: bill_autopay
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 447608f5-dd87-51f8-b0b4-951e22ba73c4
  title: बिल ऑटोपे — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'एक नए बिल ऑटोपे मैंडेट को सेट करने की पूर्ण प्रक्रिया यहाँ दी गई है:


    1. हमें बताएं कि आप किस बिलर (जैसे: बिजली विभाग या ब्रॉडबैंड प्रदाता) के लिए ऑटोपे
    सेट करना चाहते हैं और अपना ग्राहक आईडी/खाता नंबर प्रदान करें।

    2. हम बिलर की उपलब्धता की जाँच करेंगे और आपको मैंडेट की शर्तों, जैसे अधिकतम सीमा
    (बिना AFA के ₹15000) के बारे में सूचित करेंगे।

    3. आप अपनी सहमति दें और मैंडेट राशि या ऊपरी सीमा निर्धारित करें।

    4. हम आपसे प्रमाणीकरण के लिए अनुरोध करेंगे, जिसे आप अपने UPI पिन के माध्यम से
    पूरा करेंगे।

    5. एक बार सफल होने के बाद, हम पुष्टि करेंगे कि आपका ''बिल ऑटोपे'' सक्रिय हो गया
    है।

    6. अब से, प्रत्येक भुगतान से 24 घंटे पहले आपको एक सूचना प्राप्त होगी और राशि स्वचालित
    रूप से डेबिट हो जाएगी।


    इस तरह आपका अनुरोध पूर्ण समाधान तक पहुँचता है और आपके बिल बिना किसी चिंता के भुगतान
    होते रहते हैं।'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 2efa2dba-0e99-51fd-b831-53cbf8295b61
  title: बिल ऑटोपे — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके बिल ऑटोपे के रिकॉर्ड और आपके व्यक्तिगत रिकॉर्ड (जैसे
    बिलर की रसीद) में अंतर है, तो निम्नलिखित चरणों का पालन करें:


    1. सबसे पहले अपने पेसेतु ऐप में ''भुगतान इतिहास'' की जाँच करें और देखें कि क्या
    डेबिट की गई राशि बिलर द्वारा मांगी गई राशि से मेल खाती है।

    2. यह जाँचें कि क्या ₹20 का विलंबित बिल सुविधा शुल्क तो नहीं लगा है, जिसने कुल
    राशि को बढ़ा दिया है।

    3. यदि राशि का अंतर अभी भी बना हुआ है, तो हमें सूचित करें और संबंधित बिलर का लेनदेन
    संदर्भ नंबर प्रदान करें।


    हम क्या करेंगे:

    - हम आंतरिक रूप से लेनदेन लॉग की जाँच करेंगे और बिलर के साथ डेटा का मिलान करेंगे।

    - यदि कोई त्रुटि पाई जाती है, तो हम सुधार प्रक्रिया शुरू करेंगे और आपको अपडेट
    करेंगे।

    - किसी भी विवाद के मामले में, हम RBI के सामंजस्यपूर्ण TAT का पालन करेंगे।

    - जटिल मुद्दों को नियामक लोकपाल (Ombudsman) के पास भेजा जा सकता है।'
  domain: payments
  product_category: bill_autopay
  document_type: troubleshooting
  source_authority: official
