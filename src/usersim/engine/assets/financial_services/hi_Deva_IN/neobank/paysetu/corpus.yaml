  institution_id: paysetu
- id: 20732b41-7c68-52fd-9847-5a7126ea2809
  title: बिल ऑटोपे — स्थिति या इतिहास देखना
  body: 'अपने बिल ऑटोपे मैंडेट की स्थिति या पिछले भुगतानों का इतिहास देखने के लिए
    इन चरणों का पालन करें:


    1. हमें बताएं कि आप अपने बिल ऑटोपे का इतिहास देखना चाहते हैं और उस विशिष्ट बिलर
    का नाम दें जिसके लिए आपने मैंडेट सेट किया है।

    2. हम आपके खाते से जुड़े सभी सक्रिय मैंडेट्स की सूची और उनकी वर्तमान स्थिति (जैसे:
    सक्रिय, लंबित या समाप्त) की पुष्टि करेंगे।

    3. यदि आप पिछले भुगतानों का विवरण चाहते हैं, तो हमें विशिष्ट समयावधि (जैसे: पिछला
    एक महीना) बताएं।

    4. हम आपको भुगतान की तारीख, राशि और लेनदेन की स्थिति का पूरा विवरण प्रदान करेंगे।

    5. जब आप पुष्टि कर लेते हैं कि विवरण सही हैं, तो आपकी अनुरोध प्रक्रिया पूर्ण हो
    जाती है।


    यह प्रक्रिया आपको यह सुनिश्चित करने में मदद करती है कि आपके सभी बिल समय पर भुगतान
    किए जा रहे हैं और कोई भी अनपेक्षित शुल्क नहीं लगा है।'
  domain: payments
  product_category: bill_autopay
  document_type: how_to_guide
  source_authority: official
