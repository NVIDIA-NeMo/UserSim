- id: e45fad6e-5b8c-5c72-a1dc-7fcec8523b07
  title: बिल ऑटोपे — खाता अनुबंध
  body: 'यह अनुबंध पेसेतु और ग्राहक के बीच बिल ऑटोपे सेवा के उपयोग को नियंत्रित करता
    है।


    1. मैंडेट सीमाएँ: AFA (अतिरिक्त कारक प्रमाणीकरण) के बिना, प्रति लेनदेन अधिकतम
    सीमा ₹15000 निर्धारित है। इस सीमा से अधिक की राशि के लिए अतिरिक्त प्रमाणीकरण अनिवार्य
    होगा।

    2. शुल्क: ग्राहक सहमत है कि विलंबित बिल भुगतान की स्थिति में ₹20 का विलंबित बिल
    सुविधा शुल्क लागू होगा।

    3. सूचना अवधि: पेसेतु ग्राहक को डेबिट होने से 24 घंटे पहले एक पूर्व-डेबिट सूचना
    भेजने के लिए प्रतिबद्ध है।

    4. दायित्व: ग्राहक यह सुनिश्चित करने के लिए जिम्मेदार है कि उनके खाते में पर्याप्त
    शेष राशि उपलब्ध है। शेष राशि की कमी के कारण विफल भुगतान पर लागू शुल्क या दंड के
    लिए ग्राहक उत्तरदायी होगा।

    5. समाप्ति: ग्राहक किसी भी समय अपना मैंडेट रद्द कर सकता है। पेसेतु नियामक अनुपालन
    या सुरक्षा कारणों से किसी भी समय सेवा को निलंबित करने का अधिकार सुरक्षित रखता
    है।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, लेकिन व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देता।'
