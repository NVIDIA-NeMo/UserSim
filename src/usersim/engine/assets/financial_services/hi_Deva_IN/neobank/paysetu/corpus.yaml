- id: 916468a8-4ba9-5fe4-a2e1-fa1b19815ca7
  title: बिल ऑटोपे — पात्रता शर्तें
  body: " 'बिल ऑटोपे' सुविधा के लिए पात्रता मानदंड नीचे दिए गए हैं:\n\n- सक्रिय पेसेतु\
    \ खाता $\rightarrow$ आवश्यक (अनिवार्य)\n- न्यूनतम KYC स्तर $\rightarrow$ डिजिटल\
    \ वॉलेट/बचत खाता सक्रिय होना चाहिए\n- मैंडेट सीमा $\\le$ ₹15000 $\rightarrow$\
    \ बिना AFA के स्वचालित भुगतान के लिए पात्र\n- मैंडेट सीमा $>$ ₹15000 $\rightarrow$\
    \ प्रत्येक लेनदेन के लिए अतिरिक्त प्रमाणीकरण (AFA) आवश्यक\n- खाता स्थिति $\rightarrow$\
    \ गैर-निलंबित और सक्रिय"
