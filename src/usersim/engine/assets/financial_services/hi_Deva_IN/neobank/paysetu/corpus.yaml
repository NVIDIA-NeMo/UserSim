- id: 8391443e-11a8-5213-ba88-557796b99506
  title: set_alerts का उपयोग कब करें
  body: 'ग्राहकों को उनके खाते में होने वाली गतिविधियों (जैसे क्रेडिट, डेबिट या कम
    बैलेंस) की रीयल-टाइम सूचनाएं प्राप्त करने में मदद करने के लिए इस प्रक्रिया का
    उपयोग करें।


    प्रक्रिया:

    1. verify_identity टूल के साथ ग्राहक की पहचान सत्यापित करें।

    2. get_accounts का उपयोग करके उनकी account_id प्राप्त करें।

    3. ग्राहक से पूछें कि वे किस प्रकार के अलर्ट (उदा. ₹500 से अधिक के लेनदेन) सेट
    करना चाहते हैं।

    4. set_alerts टूल का उपयोग करके उनकी पसंद के अनुसार नोटिफिकेशन सक्रिय करें।


    यह सुविधा ग्राहकों को उनके खर्चों पर नज़र रखने और धोखाधड़ी का शीघ्र पता लगाने
    में मदद करती है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: paysetu
- id: f8d1cc9b-fec6-5a60-8015-a6bb76bd7cf0
  title: set_alerts टूल संदर्भ
  body: 'set_alerts टूल का उपयोग ग्राहक के खाते के लिए ट्रांजेक्शनल और बैलेंस अलर्ट
    कॉन्फ़िगर करने के लिए किया जाता है।


    हस्ताक्षर:

    set_alerts(account_id: string, alert_preferences: object)


    प्रभाव:

    यह टूल सिस्टम में अलर्ट सेटिंग्स को अपडेट करता है, जिससे ग्राहक को उनके द्वारा
    चुने गए ट्रिगर्स पर सूचनाएं मिलनी शुरू हो जाती हैं। एजेंट इसे सीधे कॉल करता है।'
