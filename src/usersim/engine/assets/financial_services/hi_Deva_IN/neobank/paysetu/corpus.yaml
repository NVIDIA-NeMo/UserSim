- id: 7650c819-9984-5ab3-9439-7f071345e075
  title: बिल ऑटोपे — रेफरल और लॉयल्टी ऑफर
  body: 'पेसेतु के साथ अपने बिल भुगतान को सरल बनाएं! यदि आप अपने किसी मित्र को ''बिल
    ऑटोपे'' के लिए रेफर करते हैं और वे अपना पहला सफल ऑटो-पेमेंट पूरा करते हैं, तो
    आपको और आपके मित्र दोनों को ₹50 का कैशबैक रिवॉर्ड मिलेगा। यह ऑफर 1 जनवरी 2025
    से 31 मार्च 2025 तक वैध है। अपने दोस्तों को डिजिटल बैंकिंग की सुविधा से जोड़ें
    और बचत करें।


    डिस्क्लेमर: यह ऑफर केवल नए उपयोगकर्ताओं के लिए है और पेसेतु के नियमों और शर्तों
    के अधीन है।'
