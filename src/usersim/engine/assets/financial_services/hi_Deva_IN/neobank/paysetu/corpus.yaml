- id: 36696c59-db24-5b33-8fc8-7cbd7786a9e8
  title: पेसेतु डिजिटल बचत खाता — बदलाव या अद्यतन करना
  body: 'अपने ''पेसेतु डिजिटल बचत खाता'' में व्यक्तिगत विवरण या संपर्क जानकारी अपडेट
    करने के लिए इन चरणों का पालन करें:


    1. अपडेट का अनुरोध: हमें वह जानकारी बताएं जिसे आप बदलना चाहते हैं (जैसे मोबाइल
    नंबर, ईमेल या पता)।

    2. दस्तावेज़ प्रदान करना: सत्यापन के लिए आवश्यक वैध पहचान प्रमाण या पते का प्रमाण
    साझा करें। सख्त पहचान सत्यापन अनिवार्य है।

    3. सत्यापन प्रक्रिया: हम आपके द्वारा प्रदान किए गए दस्तावेज़ों की जांच करेंगे।
    यह प्रक्रिया आंतरिक सुरक्षा मानकों के अनुसार पूरी की जाएगी।

    4. पुष्टिकरण प्राप्त करना: एक बार सत्यापन सफल हो जाने पर, हम आपको ऐप नोटिफिकेशन
    के माध्यम से सूचित करेंगे कि आपका विवरण अपडेट कर दिया गया है।


    ध्यान दें: सुरक्षा कारणों से, हम कभी भी आपसे आपका UPI PIN या OTP नहीं मांगेंगे।
    यदि आप अपनी केवाईसी स्थिति को अपग्रेड करना चाहते हैं, तो कृपया ''पेसेतु डिजिटल
    बचत खाता — सेटअप और सक्रियण'' का संदर्भ लें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
