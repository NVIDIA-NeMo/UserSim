- id: eecd85f5-7259-57ff-9dc7-fa35cb96a221
  title: पेसेतु डिजिटल बचत खाता — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ ''पेसेतु डिजिटल बचत खाता'' की सेवा शर्तों में संशोधन की प्रक्रिया
    को निर्धारित करता है।


    1. बदलाव का अधिकार: पेसेतु को परिचालन लागतों, नियामक बदलावों (RBI/NPCI) या व्यावसायिक
    आवश्यकताओं के आधार पर ब्याज दरों, शुल्कों और अन्य नियमों को बदलने का अधिकार है।
    वर्तमान में, इस खाते के लिए वार्षिक ब्याज दर 3.5% है और न्यूनतम शेष राशि ₹0 है।

    2. सूचना अवधि: किसी भी महत्वपूर्ण बदलाव, जैसे शुल्क में वृद्धि या ब्याज दर में
    कमी, की सूचना ग्राहकों को प्रभावी होने से कम से कम 30 दिन पहले ऐप नोटिफिकेशन या
    ईमेल के माध्यम से दी जाएगी।

    3. सहमति और निरंतरता: यदि आप सूचित बदलावों के बाद भी अपने खाते का उपयोग जारी रखते
    हैं, तो इसे नई शर्तों के प्रति आपकी सहमति माना जाएगा।

    4. अनुबंध की समाप्ति: यदि कोई ग्राहक नई शर्तों से सहमत नहीं है, तो वह अपना खाता
    बंद करने का अनुरोध कर सकता है। खाता बंद करने की प्रक्रिया ''पेसेतु डिजिटल बचत
    खाता — रद्द करना, बंद करना या डाउनग्रेड करना'' में विस्तृत है।


    हम पारदर्शिता के प्रति प्रतिबद्ध हैं और यह सुनिश्चित करते हैं कि शुल्क केवल आवश्यक
    परिचालन लागतों को कवर करने के लिए हों।'
  domain: retail_banking
  product_category: digital_savings
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 69a262a9-446b-5835-adbd-400aeb82cf2f
  title: पेसेतु डिजिटल बचत खाता — शुरुआत कैसे करें
  body: 'एक सपोर्ट एजेंट के रूप में, ग्राहकों को ''पेसेतु डिजिटल बचत खाता'' शुरू करने
    में मदद करने के लिए इन चरणों का पालन करें:


    1. प्राथमिक ऑनबोर्डिंग: ग्राहक को ऐप के माध्यम से अपना विवरण दर्ज करने और बुनियादी
    पहचान सत्यापन पूरा करने के लिए निर्देशित करें।

    2. खाता सक्रियण: एक बार बुनियादी सत्यापन सफल होने के बाद, खाता सक्रिय हो जाता
    है। ग्राहक ₹0 की न्यूनतम शेष राशि के साथ बैंकिंग शुरू कर सकते हैं और उनके जमा
    पर 3.5% की वार्षिक ब्याज दर लागू होगी।

    3. Full-KYC की आवश्यकता: ग्राहक को सूचित करें कि उच्च लेनदेन सीमाएं प्राप्त करने
    के लिए उन्हें Full-KYC प्रक्रिया पूरी करनी होगी। इसके लिए पूर्ण पहचान और पते के
    प्रमाण की आवश्यकता होती है।

    4. समय सीमा का महत्व: यह स्पष्ट करें कि खाता खोलने के बाद Full-KYC पूरा करने के
    लिए उनके पास 30 दिन की अवधि है। यदि यह समय सीमा समाप्त हो जाती है, तो खाता सुविधाओं
    पर प्रतिबंध लग सकता है।


    ग्राहक को यह भी बताएं कि उनका पैसा DICGC बीमा के तहत ₹5,00,000 तक सुरक्षित है।
    विस्तृत विवरण के लिए ''पेसेतु डिजिटल बचत खाता — सिंहावलोकन'' देखें।'
  domain: retail_banking
  product_category: digital_savings
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: ed1af9a0-5762-565d-869f-5b7b1c97775b
  title: पेसेतु डिजिटल बचत खाता — पूर्ण KYC पूरा करने की अवधि (दिन) की व्याख्या
  body: 'प्रश्न: मुझे Full-KYC कब तक पूरा करना होगा?

    उत्तर: ''पेसेतु डिजिटल बचत खाता'' खोलने के बाद, आपको उच्च लेनदेन सीमाएं और पूर्ण
    बैंकिंग सेवाओं का लाभ उठाने के लिए 30 दिन के भीतर Full-KYC प्रक्रिया पूरी करनी
    होगी।


    प्रश्न: क्या होगा यदि मैं 30 दिन में KYC पूरा नहीं करता हूँ?

    उत्तर: यदि आप निर्धारित 30 दिन की अवधि के भीतर Full-KYC पूरा नहीं करते हैं, तो
    आपके खाते की लेनदेन सीमाओं पर प्रतिबंध लग सकता है या खाता सीमित हो सकता है।


    अधिक जानकारी के लिए ''पेसेतु डिजिटल बचत खाता — पात्रता शर्तें'' देखें।'
  domain: retail_banking
  product_category: digital_savings
