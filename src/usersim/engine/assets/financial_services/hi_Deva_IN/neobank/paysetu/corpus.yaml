- id: bf56c831-83f6-556f-b2c5-eb55374db853
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — जारी करने का शुल्क की व्याख्या
  body: 'प्रश्न: पेसेतु प्रीपेड फॉरेक्स कार्ड के लिए जारी करने का शुल्क क्या है और
    यह कब लिया जाता है?

    उत्तर: पेसेतु प्रीपेड फॉरेक्स कार्ड के लिए ₹150 का एकमुश्त जारी करने का शुल्क
    लिया जाता है। यह शुल्क आपके कार्ड के आवेदन और उसे जारी करने की प्रक्रिया के दौरान
    लागू होता है।


    प्रश्न: क्या यह शुल्क वापस किया जा सकता है?

    उत्तर: नहीं, जारी करने का शुल्क परिचालन लागतों को कवर करने के लिए है और यह गैर-वापसी
    योग्य है। अधिक विवरण के लिए ''पेसेतु प्रीपेड फॉरेक्स कार्ड — शुल्क अनुसूची'' देखें।'
