- id: f628d7a5-914a-54e5-a6f3-395fb92b4987
  title: transfer_funds का उपयोग कब करें
  body: 'जब ग्राहक एक खाते से दूसरे खाते में पैसा स्थानांतरित करना चाहता है, तो इस
    प्रक्रिया का उपयोग करें। यह पेसेतु के डिजिटल-फर्स्ट अनुभव का मुख्य हिस्सा है।


    प्रक्रिया:

    1. verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल से प्रेषक (sender) की account_id प्राप्त करें।

    3. ग्राहक से प्राप्तकर्ता का विवरण और स्थानांतरित की जाने वाली सटीक राशि (₹) पूछें।

    4. transfer_funds टूल का उपयोग करके राशि स्थानांतरित करें।


    सुनिश्चित करें कि ग्राहक के खाते में पर्याप्त शेष राशि है। विफल लेनदेन के मामले
    में, RBI के TAT का पालन करते हुए रिफंड प्रक्रिया शुरू की जाएगी।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: paysetu
- id: 641f290e-cf32-52f3-8598-5c1fc23970fe
  title: dispute_status टूल संदर्भ
  body: "dispute_status टूल का उपयोग किसी ग्राहक द्वारा रिपोर्ट किए गए विफल लेनदेन\
    \ या धोखाधड़ी की शिकायत की वर्तमान स्थिति की जांच करने के लिए किया जाता है। \n\
    \nएजेंट इस टूल को सीधे कॉल करके कार्रवाई करता है। यह टूल शिकायत की प्रगति और रिफंड\
    \ की स्थिति के बारे में वास्तविक समय की जानकारी प्रदान करता है, जिससे यह सुनिश्चित\
    \ होता है कि समाधान RBI के निर्धारित टर्न-अराउंड समय (TAT) के भीतर हो रहा है।\n\
    \nतर्क (Arguments):\n- dispute_id: शिकायत की विशिष्ट पहचान संख्या।"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: paysetu
- id: 4a3cce77-679c-5377-8c78-e4ae8967ea45
  title: manage_authorized_users का उपयोग कब करें
  body: 'यह नीति उन स्थितियों को परिभाषित करती है जब एक खाताधारक अपने खाते के लिए
    अधिकृत उपयोगकर्ताओं (authorized users) को जोड़ने, हटाने या उनके अधिकारों को बदलने
    का अनुरोध करता है। सुरक्षा के लिए, किसी भी बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य
    है।


    प्रक्रिया के चरण:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक के पास एक से अधिक खाते हैं, तो account_id प्राप्त करने के लिए get_accounts
    टूल का उपयोग करें।

    3. ग्राहक से अधिकृत उपयोगकर्ता का विवरण (जैसे नाम और पहचान प्रमाण) मांगें।

    4. अधिकृत उपयोगकर्ता को जोड़ने, हटाने या उनके विवरण अपडेट करने के लिए manage_authorized_users
    टूल को कॉल करें।

    5. सफल निष्पादन के बाद, ग्राहक को पुष्टि करें कि परिवर्तन कर दिए गए हैं।


    यह प्रक्रिया सुनिश्चित करती है कि केवल प्रमाणित व्यक्ति ही खाते तक पहुंच प्राप्त
    करें और डेटा गोपनीयता के RBI मानकों का पालन हो।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: paysetu
- id: 9b1f6495-1fb1-56bd-83eb-0010d597ce34
  title: manage_authorized_users टूल संदर्भ
  body: "manage_authorized_users टूल का उपयोग खाते से जुड़े अधिकृत उपयोगकर्ताओं की\
    \ सूची को प्रबंधित करने के लिए किया जाता है। \n\nएजेंट इस टूल को सीधे कॉल करके\
    \ अधिकृत उपयोगकर्ताओं को जोड़ सकता है, हटा सकता है या उनकी अनुमतियों में बदलाव\
    \ कर सकता है। यह टूल केवल तभी उपयोग किया जाना चाहिए जब ग्राहक की पहचान पूरी तरह\
    \ से सत्यापित हो चुकी हो।\n\nतर्क (Arguments):\n- account_id: संबंधित खाते की\
    \ विशिष्ट आईडी।\n- user_details: उपयोगकर्ता की जानकारी और उनके लिए निर्धारित एक्सेस\
    \ स्तर।\n- action: किया जाने वाला कार्य (जैसे: ADD, REMOVE, UPDATE)।"
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - manage_authorized_users
  institution_id: paysetu
- id: 0c9939ca-9d41-5796-9e6a-2a901797e937
  title: transfer_funds टूल संदर्भ
  body: 'transfer_funds टूल का उपयोग एक खाते से दूसरे खाते में धनराशि स्थानांतरित
    करने के लिए किया जाता है। एजेंट इस टूल को सीधे कॉल करके लेनदेन पूरा करता है।


    तर्क (Arguments):

    - source_account_id: वह खाता आईडी जिससे पैसे भेजे जाने हैं।

    - destination_account_id: वह खाता आईडी जिसमें पैसे प्राप्त होने हैं।

    - amount: स्थानांतरित की जाने वाली राशि (₹)।

    - currency: मुद्रा का कोड (उदा. INR)।


    प्रभाव: यह टूल स्रोत खाते से राशि डेबिट करता है और गंतव्य खाते में जमा करता है,
    जिससे शेष राशि तुरंत अपडेट हो जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: paysetu
- id: 8e2d4567-5575-5395-89e5-ffe82b65e257
  title: order_replacement_card का उपयोग कब करें
  body: 'जब किसी ग्राहक का कार्ड खो गया हो, चोरी हो गया हो, या शारीरिक रूप से क्षतिग्रस्त
    हो गया हो, तब नए कार्ड का अनुरोध किया जाता है। यह प्रक्रिया मुख्य रूप से पेसेतु
    प्रीपेड फॉरेक्स कार्ड के लिए लागू होती है।


    प्रक्रिया:

    1. ग्राहक की पहचान की पुष्टि करें और verify_identity का उपयोग करें।

    2. get_accounts टूल का उपयोग करके ग्राहक का सक्रिय कार्ड खाता विवरण प्राप्त करें।

    3. ग्राहक से पुष्टि करें कि कार्ड खो गया है या क्षतिग्रस्त है।

    4. order_replacement_card टूल को कॉल करें ताकि नया कार्ड जारी किया जा सके।


    नया कार्ड जारी करने के लिए लागू शुल्क ''संस्था-व्यापी शुल्क और प्रभार'' के अनुसार
    लिए जाएंगे।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: paysetu
- id: ba09dd29-1952-5c97-83ce-945dc64faf29
  title: order_replacement_card टूल संदर्भ
  body: 'order_replacement_card टूल का उपयोग खोए हुए, चोरी हुए या क्षतिग्रस्त कार्ड
    के बदले नया कार्ड मंगवाने के लिए किया जाता है। एजेंट इस कार्रवाई को सीधे टूल कॉल
    के माध्यम से निष्पादित करता है।


    तर्क (Arguments):

    - account_id: उस खाते की आईडी जिसके लिए प्रतिस्थापन कार्ड आवश्यक है।

    - reason: कार्ड बदलने का कारण (जैसे: LOST, STOLEN, DAMAGED)।


    प्रभाव: यह अनुरोध सिस्टम में दर्ज करता है और ग्राहक के पंजीकृत पते पर एक नया भौतिक
    कार्ड भेजने की प्रक्रिया शुरू करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: paysetu
- id: 39273287-9a7e-51ee-89da-d63e569e51c7
  title: stop_payment का उपयोग कब करें
  body: 'stop_payment सुविधा का उपयोग तब किया जाता है जब ग्राहक किसी लंबित लेनदेन
    या चेक के भुगतान को रोकने का अनुरोध करता है, विशेष रूप से धोखाधड़ी के संदेह या
    गलत भुगतान निर्देश के मामले में।


    प्रक्रिया:

    1. verify_identity के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. get_account_transactions टूल का उपयोग करके उस विशिष्ट लेनदेन की पहचान करें
    जिसे रोकना है।

    3. सुनिश्चित करें कि लेनदेन अभी तक अंतिम रूप से प्रोसेस (Settle) नहीं हुआ है।

    4. stop_payment टूल को कॉल करके भुगतान रोकने की प्रक्रिया पूरी करें।


    कृपया ध्यान दें कि कुछ तत्काल भुगतान प्रणालियों में भुगतान रोकना संभव नहीं हो
    सकता है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: paysetu
- id: 3142cc99-446d-5c86-944a-99660e8be859
  title: stop_payment टूल संदर्भ
  body: 'stop_payment टूल का उपयोग किसी लंबित भुगतान निर्देश को रद्द करने के लिए किया
    जाता है। एजेंट इस कार्य को सीधे टूल कॉल द्वारा पूरा करता है।


    तर्क (Arguments):

    - account_id: संबंधित खाते की आईडी।

    - transaction_id: उस विशिष्ट लेनदेन की आईडी जिसे रोका जाना है।


    प्रभाव: यह टूल संबंधित लेनदेन को ''Stopped'' स्थिति में बदल देता है, जिससे धनराशि
    ग्राहक के खाते से बाहर नहीं जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: paysetu
- id: 56cb7943-4ab7-5040-9a92-f5837c83426d
  title: pay_bill का उपयोग कब करें
  body: 'pay_bill सुविधा का उपयोग ग्राहकों द्वारा अपने उपयोगिता बिलों (Utility Bills)
    का त्वरित भुगतान करने के लिए किया जाता है। यह प्रक्रिया उन ग्राहकों के लिए है
    जो बिल ऑटोपे के बजाय मैन्युअल भुगतान करना चाहते हैं।


    प्रक्रिया:

    1. verify_identity का उपयोग करके ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts के माध्यम से वह खाता चुनें जिससे भुगतान किया जाना है।

    3. बिलर विवरण और देय राशि की पुष्टि करें।

    4. pay_bill टूल को कॉल करके भुगतान प्रक्रिया पूरी करें।


    यदि ग्राहक भविष्य के भुगतानों को स्वचालित करना चाहता है, तो उन्हें ''बिल ऑटोपे
    — सिंहावलोकन'' देखने की सलाह दें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: paysetu
- id: 61d8e600-0b0a-5b60-9e97-5b70eea855b9
  title: pay_bill टूल संदर्भ
  body: 'pay_bill टूल का उपयोग किसी निर्दिष्ट बिलर को भुगतान करने के लिए किया जाता
    है। एजेंट इस क्रिया को सीधे टूल कॉल के माध्यम से निष्पादित करता है।


    तर्क (Arguments):

    - account_id: वह खाता आईडी जिससे राशि काटी जानी है।

    - biller_id: बिल प्राप्त करने वाली कंपनी या सेवा की आईडी।

    - amount: भुगतान की जाने वाली राशि (₹)।

    - payment_date: भुगतान की तारीख।


    प्रभाव: यह टूल खाते से राशि डेबिट करता है और बिलर को भुगतान भेजता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: paysetu
- id: e49f6800-33d1-5e13-9aa8-56e87ab223cf
  title: activate_card का उपयोग कब करें
  body: 'जब कोई नया या प्रतिस्थापन पेसेतु प्रीपेड फॉरेक्स कार्ड ग्राहक को प्राप्त
    होता है, तो सुरक्षा कारणों से वह निष्क्रिय होता है। कार्ड के उपयोग की अनुमति देने
    के लिए इसे सक्रिय करना अनिवार्य है।


    प्रक्रिया:

    1. verify_identity का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts के माध्यम से नए कार्ड की आईडी प्राप्त करें।

    3. ग्राहक से कार्ड के भौतिक विवरण (जैसे अंतिम 4 अंक) की पुष्टि करें।

    4. activate_card टूल को कॉल करें ताकि कार्ड उपयोग के लिए तैयार हो जाए।


    सक्रियण के बाद, ग्राहक अंतरराष्ट्रीय यात्रा के लिए भुगतान करना शुरू कर सकता है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: paysetu
- id: 5d1e0cf1-b175-5383-946b-6d3b164a619d
  title: activate_card टूल संदर्भ
  body: 'activate_card टूल का उपयोग किसी नए या प्रतिस्थापन कार्ड को सक्रिय करने के
    लिए किया जाता है। एजेंट इस कार्य को सीधे टूल कॉल द्वारा पूरा करता है।


    तर्क (Arguments):

    - card_id: सक्रिय किए जाने वाले कार्ड की विशिष्ट आईडी।


    प्रभाव: यह टूल कार्ड की स्थिति को ''Inactive'' से ''Active'' में बदल देता है,
    जिससे ग्राहक लेनदेन करने में सक्षम हो जाता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: paysetu
- id: 686e2db0-5045-583b-ad2d-44c2ae792192
  title: dispute_status का उपयोग कब करें
  body: 'जब कोई ग्राहक किसी विफल लेनदेन या अनधिकृत गतिविधि की रिपोर्ट करता है, तो
    वह अपने विवाद (Dispute) की वर्तमान स्थिति जानने के लिए संपर्क करता है। पेसेतु
    RBI के सामंजस्यपूर्ण टर्न-अराउंड समय (TAT) का पालन करता है।


    प्रक्रिया:

    1. verify_identity के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. संबंधित लेनदेन या विवाद आईडी प्राप्त करें।

    3. dispute_status टूल को कॉल करें ताकि विवाद की वर्तमान प्रगति (जैसे: Pending,
    Under Investigation, Resolved) का पता चल सके।

    4. ग्राहक को समाधान के लिए अपेक्षित TAT के बारे में सूचित करें।


    यदि समस्या का समाधान नहीं होता है, तो इसे आंतरिक विशेषज्ञों या नियामक लोकपाल (Ombudsman)
    के पास भेजा जा सकता है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: paysetu
