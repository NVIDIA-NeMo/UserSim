  institution_id: paysetu
- id: 3aabb77f-6200-55eb-bd22-edfff37a74ed
  title: बिल ऑटोपे — पात्रता श्रेणियाँ
  body: 'बिल ऑटोपे पात्रता विवरण:


    - बुनियादी KYC उपयोगकर्ता -> ₹15000 तक की मैंडेट सीमा (AFA के बिना)।

    - Full-KYC उपयोगकर्ता -> उच्च लेनदेन सीमाएं और सभी बिलर श्रेणियों तक पहुंच।

    - खाता स्थिति -> केवल सक्रिय और गैर-फ्रीज खातों के लिए उपलब्ध।

    - डिजिटल डिवाइस -> पेसेतु प्रमाणित ऐप का उपयोग अनिवार्य।


    डिस्क्लेमर: पात्रता मानदंड नियामक बदलावों के साथ बदल सकते हैं।'
  domain: payments
  product_category: bill_autopay
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 1d7064f2-f8bb-511f-afb7-8c61773a73a5
  title: बिल ऑटोपे — श्रेणियों या विकल्पों में से चुनाव
  body: 'बिल भुगतान के लिए आपके पास दो मुख्य विकल्प हैं:


    1. मैनुअल भुगतान: हर बार भुगतान करते समय नियंत्रण रहता है, लेकिन भूलने पर विलंब
    शुल्क का जोखिम होता है।

    2. बिल ऑटोपे: यह पूर्णतः स्वचालित है। इसमें AFA के बिना ₹15000 तक की सीमा और डेबिट
    से 24 घंटे पहले सूचना मिलती है।


    यदि आप समय की बचत करना चाहते हैं और बार-बार भुगतान की प्रक्रिया से बचना चाहते
    हैं, तो ''बिल ऑटोपे'' सबसे उपयुक्त है। यदि आप अपनी हर छोटी राशि पर मैन्युअल नियंत्रण
    चाहते हैं, तो मैनुअल भुगतान बेहतर है।


    डिस्क्लेमर: ऑटोपे के लिए पर्याप्त बैंक बैलेंस बनाए रखना आवश्यक है।'
  domain: payments
  product_category: bill_autopay
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 6d24b514-aa6f-5cc7-ad41-01523bb1d016
  title: बिल ऑटोपे — गोपनीयता और डेटा प्रबंधन
  body: 'पेसेतु आपके डेटा की गोपनीयता और सुरक्षा के प्रति प्रतिबद्ध है। ''बिल ऑटोपे''
    सेवा के अंतर्गत:


    1. डेटा संग्रह: हम केवल वही जानकारी एकत्र करते हैं जो UPI Mandate सेट करने और
    बिलर के साथ समन्वय करने के लिए आवश्यक है।

    2. डेटा साझाकरण: आपकी अनुमति के बिना आपका डेटा किसी तीसरे पक्ष को नहीं बेचा जाता
    है। हम केवल RBI और NPCI के दिशा-निर्देशों के अनुसार नियामक संस्थाओं के साथ जानकारी
    साझा करते हैं।

    3. सुरक्षा मानक: सभी लेनदेन एन्क्रिप्टेड हैं और सख्त पहचान सत्यापन के बाद ही संसाधित
    किए जाते हैं।

    4. नियंत्रण: आप किसी भी समय अपना मैंडेट रद्द कर सकते हैं, जिससे भविष्य के स्वचालित
    भुगतानों के लिए डेटा साझाकरण रुक जाएगा।


    हम डेटा गोपनीयता और निष्पक्ष उपचार को सर्वोपरि मानते हैं और भारतीय बैंकिंग नियामक
    ढांचे का पूरी तरह पालन करते हैं।


    डिस्क्लेमर: डेटा प्रबंधन नीतियां समय-समय पर अपडेट की जा सकती हैं।'
  domain: payments
  product_category: bill_autopay
  document_type: disclosure
