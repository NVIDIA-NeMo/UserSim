- id: 3cddd3b2-d959-5311-b1fd-4ae09bb10ed1
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक दावा करता है कि उनके द्वारा देखे गए लेनदेन इतिहास या शेष राशि
    में पेसेतु के रिकॉर्ड के साथ विसंगति है।


    जाँच और समाधान प्रक्रिया (एजेंट के लिए):

    1. ग्राहक के दावे की गई राशि और तारीख को नोट करें।

    2. कार्ड के ट्रांजैक्शन लॉग की जाँच करें और देखें कि क्या कोई लंबित (pending)
    लेनदेन है।

    3. शुल्क की गणना दोबारा करें: क्या ग्राहक ने 2% क्रॉस-करेंसी मार्कअप या ₹200 ATM
    शुल्क को ध्यान में रखा है?

    4. यदि कोई त्रुटि मिलती है, तो ग्राहक को स्पष्ट करें कि शुल्क किस मद में कटा है।

    5. यदि लेनदेन वास्तव में विफल रहा है लेकिन राशि कट गई है, तो हम एक विवाद (dispute)
    दर्ज करेंगे।


    समाधान और एस्केलेशन:

    - हम RBI के TAT का पालन करते हुए रिफंड प्रक्रिया शुरू करेंगे।

    - यदि मामला जटिल है, तो इसे आंतरिक विशेषज्ञों को भेजा जाएगा।

    - ग्राहक को एक केस आईडी प्रदान की जाएगी और समाधान होने पर उन्हें सूचित किया जाएगा।


    डिस्क्लेमर: पेसेतु केवल उत्पाद शिक्षा प्रदान करता है, टैक्स सलाह नहीं।'
