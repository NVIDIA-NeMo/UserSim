  institution_id: paysetu
- id: 77c3b84d-846a-5213-b818-f3c19308eb36
  title: पेसेतु डिजिटल बचत खाता — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपना पेसेतु डिजिटल बचत खाता बंद करना चाहते हैं, तो इन चरणों का पालन
    करें:


    1. अपने खाते से पूरी शेष राशि किसी अन्य बैंक खाते में स्थानांतरित करें ताकि अंतिम
    बैलेंस ₹0 हो जाए।

    2. हमें अपना खाता बंद करने का अनुरोध भेजें।

    3. हम आपके खाते से जुड़े सभी सक्रिय मैंडेट और सेवाओं की समीक्षा करेंगे और आपको
    पुष्टि करेंगे कि कोई बकाया शुल्क नहीं है।

    4. हमारी टीम आपकी पहचान का सत्यापन करेगी और खाते को बंद करने की प्रक्रिया शुरू
    करेगी।

    5. एक बार प्रक्रिया पूरी हो जाने पर, आपको एक पुष्टिकरण संदेश प्राप्त होगा कि आपका
    खाता सफलतापूर्वक बंद कर दिया गया है।


    चूंकि यह उत्पाद पहले से ही न्यूनतम शेष राशि ₹0 के साथ एक सरल डिजिटल अनुभव प्रदान
    करता है, इसलिए इसमें कोई निम्न-स्तर (downgrade) विकल्प उपलब्ध नहीं है।


    डिस्क्लेमर: खाता बंद करने से पहले सुनिश्चित करें कि आपके सभी लंबित लेनदेन पूरे
    हो चुके हैं।'
  domain: retail_banking
  product_category: digital_savings
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: cfb097f5-fc6d-53aa-9d43-6be4fbf4c547
  title: पेसेतु डिजिटल बचत खाता — अनपेक्षित शुल्क या राशि
  body: 'लक्षण: ग्राहक को अपने खाते के विवरण में कोई ऐसा शुल्क या राशि कटौती दिखती
    है जिसकी उन्हें उम्मीद नहीं थी।


    संभावित कारण:

    - किसी तीसरे पक्ष के सेवा प्रदाता द्वारा लिया गया शुल्क।

    - किसी सक्रिय UPI Mandate के माध्यम से स्वचालित भुगतान।

    - परिचालन लागतों को कवर करने वाले न्यूनतम आवश्यक शुल्क।


    समाधान के चरण:

    1. अपने लेनदेन इतिहास में कटौती के विवरण और मर्चेंट का नाम जांचें।

    2. जांचें कि क्या यह राशि किसी पूर्व-निर्धारित स्वचालित भुगतान (autopay) से संबंधित
    है।

    3. यदि शुल्क पेसेतु द्वारा लगाया गया है, तो हमसे स्पष्टीकरण मांगें। हम अपनी शुल्क
    पारदर्शिता नीति के तहत विवरण प्रदान करेंगे।


    यदि समस्या का समाधान नहीं होता है, तो हम इस मामले को आंतरिक विशेषज्ञों के पास
    भेजेंगे। रिफंड के मामलों में, हम RBI के निर्धारित TAT का पालन करेंगे। गंभीर विवादों
    को नियामक लोकपाल (Ombudsman) के पास भेजा जा सकता है।'
  domain: retail_banking
  product_category: digital_savings
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 01ef5982-0667-5cfc-9b09-c684e26018a9
  title: पेसेतु डिजिटल बचत खाता — आवश्यक दस्तावेज़
  body: 'खाता सक्रियण और सीमाओं के लिए आवश्यक दस्तावेज़:


    - बुनियादी खाता खोलना: वैध पैन (PAN) कार्ड और आधार (Aadhaar) विवरण।

    - Full-KYC पूर्ण करना: पूर्ण पहचान प्रमाण और पते का प्रमाण (जैसे वोटर आईडी, पासपोर्ट
    या ड्राइविंग लाइसेंस)।


    परिणाम: Full-KYC सफलतापूर्वक पूरा करने पर, ग्राहक को उच्च लेनदेन सीमाएं प्रदान
    की जाती हैं। यह प्रक्रिया खाता खोलने के 30 दिनों के भीतर पूरी होनी चाहिए।'
  domain: retail_banking
  product_category: digital_savings
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: c18fe9ab-107c-5d01-a04e-1a0cb70db2c1
  title: पेसेतु डिजिटल बचत खाता — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'पारंपरिक बैंकों की तुलना में, पेसेतु डिजिटल बचत खाता आधुनिक डिजिटल उपयोगकर्ताओं
    के लिए अधिक लचीला है। जहाँ कई पारंपरिक बैंक न्यूनतम मासिक औसत शेष (MAB) की मांग
    करते हैं और उसे न रखने पर जुर्माना लगाते हैं, वहीं पेसेतु में न्यूनतम शेष राशि
    ₹0 है।


    ब्याज के मामले में, हम 3.5% की प्रतिस्पर्धी वार्षिक दर प्रदान करते हैं, जो कई
    मानक बचत खातों के बराबर या उससे बेहतर है। पारंपरिक बैंकों में KYC प्रक्रिया अक्सर
    भौतिक रूप से शाखा जाने की मांग करती है, जबकि पेसेतु एक डिजिटल-फर्स्ट अनुभव देता
    है जहाँ 30 दिनों के भीतर Full-KYC पूरा किया जा सकता है।


    यह उन लोगों के लिए बेहतर है जो शून्य-लागत रखरखाव और पूर्ण डिजिटल नियंत्रण चाहते
    हैं।'
  domain: retail_banking
  product_category: digital_savings
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: paysetu
- id: 97c7c6f2-a8a3-5001-9474-ed25aa35d5c8
  title: पेसेतु डिजिटल बचत खाता — जोखिम प्रकटीकरण
  body: 'पेसेतु डिजिटल बचत खाता एक डिजिटल बैंकिंग उत्पाद है। ग्राहकों को सूचित किया
    जाता है कि उनके जमा को DICGC बीमा के तहत ₹5,00,000 तक की सुरक्षा प्राप्त है, जो
    RBI के नियामक ढांचे के अंतर्गत आता है।


    जोखिम कारक:

    1. ब्याज दर जोखिम: 3.5% की वार्षिक ब्याज दर स्थिर नहीं है और बाजार की स्थितियों
    या RBI के दिशा-निर्देशों के आधार पर बदल सकती है।

    2. डिजिटल जोखिम: हालांकि हम सख्त सुरक्षा मानकों का पालन करते हैं, लेकिन डिजिटल
    लेनदेन में फिशिंग और सोशल इंजीनियरिंग के जोखिम होते हैं।

    3. अनुपालन जोखिम: यदि Full-KYC प्रक्रिया खाता खोलने के 30 दिनों के भीतर पूरी नहीं
    की जाती है, तो नियामक नियमों के अनुसार खाते की कार्यक्षमता सीमित की जा सकती है।


    हम डेटा गोपनीयता और निष्पक्ष उपचार सुनिश्चित करने के लिए NPCI और RBI के सभी दिशा-निर्देशों
    का सख्ती से पालन करते हैं।


    डिस्क्लेमर: पेसेतु वित्तीय साक्षरता प्रदान करता है, लेकिन व्यक्तिगत टैक्स या कानूनी
    सलाह नहीं देता।'
  domain: retail_banking
  product_category: digital_savings
  document_type: disclosure
  source_authority: official
