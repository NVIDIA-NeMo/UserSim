  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने स्टेटमेंट में कोई ऐसा शुल्क दिखता है जिसकी आप अपेक्षा नहीं
    कर रहे थे, तो कृपया निम्नलिखित चरणों की जांच करें:


    1. शुल्क के प्रकार की पहचान करें: क्या यह ₹200 का विदेश ATM निकासी शुल्क है या
    ₹100 का रीलोड शुल्क?

    2. मुद्रा की जांच करें: यदि आपने मूल मुद्रा के अलावा किसी अन्य मुद्रा में खर्च
    किया है, तो 2% का क्रॉस-करेंसी मार्कअप लागू होगा।

    3. जारी करने का शुल्क: नए कार्ड के लिए ₹150 का शुल्क एक बार लिया जाता है।


    यदि शुल्क अभी भी गलत लगता है, तो हमें सूचित करें। हम लेनदेन की जांच करेंगे और
    यदि कोई त्रुटि पाई जाती है, तो RBI के TAT के भीतर रिफंड प्रक्रिया शुरू करेंगे।
    हमारी टीम इस मामले को आंतरिक विशेषज्ञों के पास भेजकर इसका समाधान सुनिश्चित करेगी।'
