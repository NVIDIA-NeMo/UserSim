  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — शुल्क अनुसूची
  body: 'पेसेतु प्रीपेड फॉरेक्स कार्ड के लिए लागू शुल्कों की विस्तृत सूची नीचे दी
