- id: abf2e141-b4df-5647-a78d-505966d6c79e
  title: पेसेतु वॉलेट और UPI — वर्तमान ऑफर
  body: 'विशेष ऑफर: Full-KYC अपग्रेड बोनस!


    अवधि: 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक।


    प्रस्ताव: जो उपयोगकर्ता इस अवधि के दौरान अपने न्यूनतम KYC खाते को Full-KYC में
    अपग्रेड करेंगे और अपनी वॉलेट सीमा को ₹200000 तक बढ़ाएंगे, उन्हें उनके अगले तीन
    बिल भुगतानों पर ₹50 का कैशबैक प्राप्त होगा।


    शर्तें: यह ऑफर केवल एक बार प्रति ग्राहक लागू है।'
