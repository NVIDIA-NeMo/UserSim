  institution_id: paysetu
- id: 22187b1a-65fb-5716-9feb-d63448c9eb23
  title: पेसेतु प्रीपेड फॉरेक्स कार्ड — खाता अनुबंध
  body: 'यह अनुबंध पेसेतु और कार्डधारक के बीच कानूनी रूप से बाध्यकारी है। इस सेवा
    के उपयोग के लिए निम्नलिखित शर्तें लागू होती हैं:


    1. शुल्क संरचना: कार्ड जारी करने के लिए ₹150 का एकमुश्त शुल्क लिया जाएगा। प्रत्येक
    रीलोड पर ₹100 का शुल्क लागू होगा। विदेश में ATM से निकासी करने पर ₹200 का शुल्क
    लिया जाएगा और अन्य मुद्राओं में लेनदेन पर 2% का क्रॉस-करेंसी मार्कअप लागू होगा।

    2. उपयोगकर्ता की जिम्मेदारी: कार्डधारक कार्ड की सुरक्षा और उसके उपयोग के लिए जिम्मेदार
    है। किसी भी विवरण में बदलाव से पहले सख्त पहचान सत्यापन अनिवार्य है।

    3. अनुपालन: यह कार्ड RBI और NPCI के दिशा-निर्देशों के अधीन है। हम नियामक मानकों
    के अनुसार डेटा गोपनीयता सुनिश्चित करते हैं।

    4. अनुबंध की समाप्ति: ग्राहक किसी भी समय अपना कार्ड बंद करने का अनुरोध कर सकता
    है। बकाया राशि और लागू शुल्कों के समायोजन के बाद खाता बंद कर दिया जाएगा।'
