- id: 20255d67-6ae6-54ea-a51b-305427a37bdf
  title: update_beneficiary का उपयोग कब करें
  body: 'जब ग्राहक को अपने फंड ट्रांसफर के लिए किसी मौजूदा लाभार्थी (beneficiary)
    के विवरण बदलने हों या नया लाभार्थी जोड़ना हो, तो इस प्रक्रिया का पालन करें।


    प्रक्रिया:

    1. सबसे पहले verify_identity टूल का उपयोग करके सुरक्षा सत्यापन पूरा करें।

    2. get_accounts के माध्यम से ग्राहक की account_id प्राप्त करें।

    3. ग्राहक से लाभार्थी का सही नाम, खाता संख्या और IFSC कोड प्राप्त करें।

    4. update_beneficiary टूल का उपयोग करके लाभार्थी की जानकारी अपडेट करें।


    सुरक्षा कारणों से, उच्च-मूल्य वाले लेनदेन के लिए लाभार्थी अपडेट के बाद एक संक्षिप्त
    प्रतीक्षा अवधि (Cooling-off period) लागू हो सकती है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: paysetu
- id: 2afa4d08-aee2-5ce8-b8b1-b09a81702b87
  title: update_beneficiary टूल संदर्भ
  body: 'update_beneficiary टूल का उपयोग ग्राहक की लाभार्थी सूची में बदलाव करने या
    विवरण संशोधित करने के लिए किया जाता है।


    हस्ताक्षर:

    update_beneficiary(account_id: string, beneficiary_details: object)


    प्रभाव:

    यह टूल लाभार्थी के रिकॉर्ड को अपडेट करता है जिससे भविष्य में फंड ट्रांसफर संभव
    हो पाता है। एजेंट इसे सीधे कॉल करके निष्पादित करता है।'
