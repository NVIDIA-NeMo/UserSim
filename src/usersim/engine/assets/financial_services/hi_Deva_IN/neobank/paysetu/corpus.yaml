    - जारी करने का शुल्क (Issuance Fee): ₹150

    - रीलोड शुल्क (Reload Fee): ₹100

    - क्रॉस-करेंसी मार्कअप (Cross-currency Markup): 2%

    - विदेश में ATM निकासी शुल्क (ATM Withdrawal Fee Abroad): ₹200


    ये शुल्क परिचालन लागतों को कवर करने के लिए लिए जाते हैं। उच्च-मूल्य वाले खातों
    के लिए कुछ शुल्क माफ किए जा सकते हैं।'
