- id: 2e24da86-f95a-5ccd-8cdd-db4285d170e9
  title: पेसेतु डिजिटल बचत खाता — खाता अनुबंध
  body: 'यह अनुबंध पेसेतु और खाताधारक के बीच के संबंधों को नियंत्रित करता है। पेसेतु
    डिजिटल बचत खाता एक शून्य शेष राशि वाला खाता है, जिसका अर्थ है कि न्यूनतम शेष राशि
    ₹0 रखी गई है; इस सीमा से नीचे जाने पर कोई जुर्माना नहीं लगाया जाएगा।


    खाताधारक की यह जिम्मेदारी है कि वह खाता खोलने के बाद 30 दिनों के भीतर Full-KYC
    की प्रक्रिया पूरी करे। निर्धारित 30 दिनों की अवधि के बाद, विनियामक अनुपालन के
    कारण खाते की सेवाओं को सीमित किया जा सकता है। पेसेतु जमा राशि पर 3.5% की वार्षिक
    ब्याज दर प्रदान करने का वचन देता है, जिसे समय-समय पर संशोधित किया जा सकता है।


    हमारा शुल्क दर्शन न्यूनतम शुल्क और अधिकतम पारदर्शिता पर आधारित है। किसी भी शुल्क
    में बदलाव की स्थिति में, हम ग्राहकों को उचित नोटिस अवधि प्रदान करेंगे। यह अनुबंध
    तब समाप्त होता है जब ग्राहक खाता बंद करने का अनुरोध करता है या सुरक्षा कारणों
    से पेसेतु खाते को स्थायी रूप से बंद करने का निर्णय लेता है।


    डिस्क्लेमर: यह दस्तावेज़ केवल सूचना के लिए है और व्यक्तिगत टैक्स सलाह नहीं देता।'
  domain: retail_banking
  product_category: digital_savings
