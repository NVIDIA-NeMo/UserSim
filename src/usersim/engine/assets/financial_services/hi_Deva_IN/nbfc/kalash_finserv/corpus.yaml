- id: 599105e1-e7fb-554a-8597-31fcdd4a07c6
  title: दोपहिया वाहन ऋण — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'यह दस्तावेज़ सपोर्ट एजेंटों के लिए ''दोपहिया वाहन ऋण'' की परिचालन सीमाओं
    और प्रतिबंधों को स्पष्ट करने हेतु है।


    मुख्य सीमाएँ और शर्तें:

    1. डाउन पेमेंट: ग्राहक को वाहन की कुल कीमत का न्यूनतम 15% डाउन पेमेंट के रूप में
    देना अनिवार्य है।

    2. ऋण अवधि: इस उत्पाद के लिए अधिकतम पुनर्भुगतान अवधि 36 महीने निर्धारित है।

    3. ब्याज दर: सभी पात्र ग्राहकों के लिए वार्षिक ब्याज दर 12.9% तय की गई है।

    4. प्रोसेसिंग शुल्क: ऋण आवेदन के समय ₹1500 का एकमुश्त प्रोसेसिंग शुल्क लिया जाता
    है, जो संचालन लागत को कवर करता है।


    अपवाद और प्रतिबंध:

    - ऋण केवल नए और अनुमोदित दोपहिया वाहनों के लिए उपलब्ध है।

    - शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन के अधीन है ताकि ऋण अनुशासन बना रहे।

    - हर ऋण के लिए ''Key Fact Statement'' प्रदान करना अनिवार्य है ताकि ग्राहक कुल
    वार्षिक लागत को समझ सके।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
