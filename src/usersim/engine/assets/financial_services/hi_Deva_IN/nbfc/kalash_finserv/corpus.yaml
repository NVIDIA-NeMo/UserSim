- id: f0ae5ca5-4c1a-545d-96f7-d58ebea868e7
  title: व्यक्तिगत ऋण (पर्सनल लोन) — पात्रता शर्तें
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) के लिए पात्रता मानदंड नीचे दिए गए हैं:


    - आय स्तर: मध्यम और निम्न आय वाले परिवार (न्यूनतम आय मानदंड आंतरिक नीति के अनुसार)।

    - ऋण अवधि: अधिकतम 60 माह तक की अवधि के लिए पात्र।

    - क्रेडिट इतिहास: RBI के फेयर प्रैक्टिस कोड के अनुसार संतोषजनक क्रेडिट रिकॉर्ड।

    - दस्तावेज़ीकरण: पूर्ण KYC और आय प्रमाण उपलब्ध होने पर ऋण स्वीकृत किया जाएगा।


    पात्रता पूरी होने पर, ग्राहक 14.5% वार्षिक ब्याज दर पर ऋण के लिए आवेदन कर सकते
    हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
