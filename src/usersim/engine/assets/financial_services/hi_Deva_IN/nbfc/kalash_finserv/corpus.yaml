- id: 5a3ab2d6-33ce-58a9-be6b-d6761b156dba
  title: EMI भुगतान मैंडेट — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'कलश फिनसर्व में आपकी वित्तीय सुरक्षा हमारी प्राथमिकता है। EMI भुगतान मैंडेट
    के साथ धोखाधड़ी से बचने के लिए कृपया ध्यान दें कि हम आपसे कभी भी आपका UPI PIN,
    OTP या CVV साझा करने के लिए नहीं कहेंगे।


    सावधान रहें: कुछ जालसाज बैंक अधिकारी बनकर आपको कॉल कर सकते हैं और मैंडेट ''अपडेट''
    करने या ''सत्यापित'' करने के नाम पर आपसे गोपनीय जानकारी मांग सकते हैं। कृपया याद
    रखें कि मैंडेट सेटअप या संशोधन की प्रक्रिया आधिकारिक और सुरक्षित चैनलों के माध्यम
    से होती है।


    यदि आपको अपने खाते में कोई अनधिकृत गतिविधि दिखती है या कोई संदिग्ध कॉल आता है,
    तो तुरंत हमें सूचित करें। धोखाधड़ी के मामलों को त्वरित रिपोर्टिंग और चार्जबैक
    प्रक्रिया के माध्यम से हल किया जाता है। हम आपसे अनुरोध करते हैं कि किसी भी संदिग्ध
    लेन-देन की सूचना मिलते ही बिना देरी किए हमें दें ताकि हम समय रहते कार्रवाई कर
    सकें और आपकी राशि सुरक्षित रहे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
