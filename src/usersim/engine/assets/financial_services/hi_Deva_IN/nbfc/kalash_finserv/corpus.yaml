- id: 76043f9d-a9d1-5b79-8f22-607cc76aecf2
  title: दोपहिया वाहन ऋण — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आपको अपने ऋण विवरण देखने या डिजिटल सेवाओं का उपयोग करने में समस्या आ
    रही है, तो कृपया निम्नलिखित जांचें:


    लक्षण: लॉगिन विफल होना या खाता विवरण न दिखना।

    संभावित कारण: गलत क्रेडेंशियल, पुराना मोबाइल नंबर, या केवाईसी (KYC) का अधूरा होना।


    समाधान के चरण:

    1. विवरण जांचें: सुनिश्चित करें कि आप वही पंजीकृत मोबाइल नंबर और पासवर्ड उपयोग
    कर रहे हैं जो ऋण आवेदन के समय दिया गया था।

    2. केवाईसी स्थिति: यदि आपका विवरण अपडेट नहीं है, तो हमें आवश्यक दस्तावेज़ प्रदान
    करें।

    3. प्रमाणीकरण: यदि आपको ओटीपी (OTP) प्राप्त नहीं हो रहा है, तो नेटवर्क कनेक्शन
    की जांच करें और पुनः प्रयास करें।


    यदि समस्या बनी रहती है, तो हम आपके मामले को आंतरिक विशेषज्ञ टीम के पास भेजेंगे
    (escalate)। हम आपके विवरण की जांच करेंगे और समाधान होने पर आपको ईमेल या संदेश
    के माध्यम से सूचित करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
