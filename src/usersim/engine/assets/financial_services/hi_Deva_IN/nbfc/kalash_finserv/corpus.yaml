- id: 4aad0582-a3a7-59a9-99f6-b3e35e384b59
  title: स्वर्ण ऋण (गोल्ड लोन) — स्थिति या इतिहास देखना
  body: 'यदि आप अपने स्वर्ण ऋण (गोल्ड लोन) की वर्तमान स्थिति या पिछले लेन-देन का इतिहास
    देखना चाहते हैं, तो इन चरणों का पालन करें:


    1. अपने पंजीकृत मोबाइल नंबर या ऋण खाता संख्या के साथ हमसे संपर्क करें।

    2. हमें बताएं कि आप अपने ऋण का ''स्टेटमेंट'' या ''वर्तमान स्थिति'' (Current Status)
    जानना चाहते हैं।

    3. हम आपसे आपकी पहचान सत्यापित करने के लिए कुछ बुनियादी विवरण मांगेंगे (जैसे जन्म
    तिथि या पता)।

    4. सत्यापन के बाद, हम आपको आपके ऋण का पूरा विवरण प्रदान करेंगे, जिसमें शेष मूलधन,
    अब तक भुगतान किया गया ब्याज और अगली देय तिथि शामिल होगी।

    5. यदि आपने ₹500 का प्रोसेसिंग शुल्क चुकाया है, तो वह आपके इतिहास में स्पष्ट रूप
    से दर्ज होगा।


    आपको एक विस्तृत विवरण प्राप्त होगा जिससे आप पुष्टि कर सकते हैं कि आपकी ऋण स्थिति
    आपकी गणना के अनुसार है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
