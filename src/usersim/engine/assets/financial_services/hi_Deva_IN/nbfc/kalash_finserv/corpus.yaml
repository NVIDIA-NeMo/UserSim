- id: fb9cc4dd-ed4f-5949-9dad-a726b258c965
  title: व्यक्तिगत ऋण (पर्सनल लोन) — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने व्यक्तिगत ऋण (पर्सनल लोन) खाते में कोई ऐसा शुल्क दिखता है जिसकी
    आप अपेक्षा नहीं कर रहे थे, तो निम्नलिखित चरणों का पालन करें:


    1. शुल्क की पहचान करें: देखें कि क्या यह ₹500 का EMI Bounce Charge है। यह तब लगता
    है जब किस्त की तारीख को आपके खाते में पर्याप्त राशि नहीं होती है।

    2. फोरक्लोज़र की जाँच करें: यदि आपने ऋण समय से पहले चुकाया है, तो देखें कि क्या
    4% का फोरक्लोज़र शुल्क लगाया गया है।

    3. प्रोसेसिंग शुल्क का मिलान करें: जाँचें कि क्या ऋण वितरण के समय 2% प्रोसेसिंग
    शुल्क काटा गया था।


    यदि आपको लगता है कि शुल्क गलत लगाया गया है, तो हमें विवरण दें। हम RBI के टर्न-अराउंड-टाइम
    (TAT) ढांचे के अनुसार इसकी जांच करेंगे। यदि गलती पाई जाती है, तो हम आवश्यक सुधार
    करेंगे और आपको सूचित करेंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
