- id: c5a29bf8-b0fa-527c-b413-2d8f2f22b6ba
  title: EMI भुगतान मैंडेट — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ ''EMI भुगतान मैंडेट'' की शर्तों में संशोधन से संबंधित नीतियों
    को स्पष्ट करता है:


    1. शुल्क संशोधन: कलश फिनसर्व को परिचालन लागत के आधार पर शुल्क ढांचे को बदलने का
    अधिकार है। वर्तमान में, किस्त के भुगतान के लिए खाते में पर्याप्त राशि न होने पर
    ₹500 का बाउंस शुल्क लागू होता है। किसी भी शुल्क परिवर्तन की सूचना ग्राहकों को
    समय पर दी जाएगी।

    2. प्रोसेसिंग समय: मैंडेट विवरण में किसी भी संशोधन के लिए 3 दिन की प्रोसेसिंग
    अवधि निर्धारित है। इस अवधि के दौरान अनुरोध का सत्यापन और कार्यान्वयन किया जाता
    है।

    3. अधिसूचनाएँ: हम डेबिट प्रक्रिया शुरू होने से 24 घंटे पहले एक प्री-डेबिट अधिसूचना
    भेजते हैं। इस समय सीमा में बदलाव कंपनी की नीति के अनुसार किया जा सकता है।

    4. अनुपालन: यह सेवा RBI के फेयर प्रैक्टिस कोड और डिजिटल लेंडिंग दिशा-निर्देशों
    के अधीन है।


    इन शर्तों का उद्देश्य ऋण अनुशासन बनाए रखना और पारदर्शिता सुनिश्चित करना है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
