- id: 6b069c0e-d25d-5985-9af3-22208227b8d6
  title: स्वर्ण ऋण (गोल्ड लोन) — बदलाव या अद्यतन करना
  body: 'यदि आप अपने मौजूदा स्वर्ण ऋण (गोल्ड लोन) खाते में कोई विवरण बदलना चाहते हैं,
    तो इन चरणों का पालन करें:


    1. हमें वह जानकारी बताएं जिसे आप अद्यतन करना चाहते हैं (जैसे पता या मोबाइल नंबर)।

    2. अद्यतन के लिए आवश्यक नए KYC दस्तावेज (जैसे आधार कार्ड या बिजली बिल) हमें प्रस्तुत
    करें।

    3. हम आपके दस्तावेजों का सत्यापन करेंगे और बहु-स्तरीय प्रमाणीकरण प्रक्रिया के
    माध्यम से आपकी पहचान की पुष्टि करेंगे।

    4. विवरण अपडेट होने के बाद, हम आपको एक पुष्टिकरण संदेश भेजेंगे।


    यदि आप अपनी ऋण राशि या अवधि में बदलाव चाहते हैं, तो कृपया हमसे ऋण पुनर्गठन (Restructuring)
    के लिए बात करें। हम आपकी पात्रता और वर्तमान LTV सीमा (75%) की समीक्षा करेंगे और
    संभव होने पर बदलाव करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
