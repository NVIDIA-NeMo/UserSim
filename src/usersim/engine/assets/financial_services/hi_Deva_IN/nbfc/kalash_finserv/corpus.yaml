- id: a7dc1bd4-2e6c-5a91-82a5-b3b57f3dba8e
  title: व्यक्तिगत ऋण (पर्सनल लोन) — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपने व्यक्तिगत ऋण (पर्सनल लोन) को समय से पहले बंद करना चाहते हैं या
    आवेदन रद्द करना चाहते हैं, तो इन चरणों का पालन करें:


    1. ऋण बंद करने का अनुरोध: हमें सूचित करें कि आप अपना ऋण खाता बंद करना चाहते हैं।

    2. बकाया राशि की गणना: हम आपको शेष मूलधन और उस पर लागू ब्याज का विवरण प्रदान करेंगे।

    3. फोरक्लोज़र शुल्क का भुगतान: समय से पहले बंद करने पर, शेष मूलधन पर 4% का फोरक्लोज़र
    शुल्क लागू होगा।

    4. भुगतान पूरा करना: कुल बकाया राशि और फोरक्लोज़र शुल्क का भुगतान करें।

    5. पुष्टिकरण प्राप्त करना: भुगतान सफल होने के बाद, हम आपको ऋण बंद होने का पुष्टिकरण
    और ''नो ड्यूज सर्टिफिकेट'' प्रदान करेंगे।


    यदि आपने अभी आवेदन किया है और ऋण राशि स्वीकृत होने से पहले उसे रद्द करना चाहते
    हैं, तो बस हमें सूचित करें और हम आपके आवेदन को बिना किसी शुल्क के रद्द कर देंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
