  title: स्वर्ण ऋण (गोल्ड लोन) — ब्याज दर अनुसूची
  body: 'स्वर्ण ऋण (गोल्ड लोन) के लिए ब्याज दर संरचना सरल और स्थिर है:


    - लागू वार्षिक ब्याज दर: 11.5%


