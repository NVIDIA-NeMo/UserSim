- id: 401c5ec4-0030-558c-a276-488a95b53cc8
  title: request_gold_loan_topup टूल संदर्भ
  body: 'टूल नाम: request_gold_loan_topup

    विवरण: यह टूल मौजूदा स्वर्ण ऋण ग्राहकों के लिए अतिरिक्त ऋण राशि (top-up) का अनुरोध
    प्रोसेस करता है।

    तर्क (Arguments):

    - account_id (अनिवार्य): मौजूदा स्वर्ण ऋण खाता आईडी।

    - requested_amount (अनिवार्य): वह अतिरिक्त राशि जो ग्राहक चाहता है।


    प्रभाव: यह टूल पात्रता की जांच करता है और टॉप-अप अनुरोध को सिस्टम में दर्ज करता
    है। एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है।'
