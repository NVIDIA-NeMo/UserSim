- id: 522f07d9-cc5c-51d2-b644-24d0864ed249
  title: दोपहिया वाहन ऋण — लागत और शुल्क
  body: 'प्रश्न: मेरे दोपहिया वाहन ऋण की कुल लागत क्या होगी?

    उत्तर: आपके ऋण की कुल लागत मुख्य रूप से तीन घटकों पर आधारित है: 12.9% की वार्षिक
    ब्याज दर, ₹1500 का एकमुश्त प्रोसेसिंग शुल्क, और आपके द्वारा भुगतान किया जाने वाला
    15% डाउन पेमेंट। इसके अलावा, यदि कोई किस्त बाउंस होती है, तो EMI बाउंस शुल्क लागू
    होगा। विस्तृत विवरण के लिए अपना ''Key Fact Statement'' देखें।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
