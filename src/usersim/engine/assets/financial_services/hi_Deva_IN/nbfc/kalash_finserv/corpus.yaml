- id: b875cb22-5742-5567-aa56-1b1e263b2452
  title: स्वर्ण ऋण (गोल्ड लोन) — सिंहावलोकन
  body: 'कलश फिनसर्व का स्वर्ण ऋण (गोल्ड लोन) आपके सोने की सुरक्षा के साथ आपको तत्काल
    वित्तीय सहायता प्रदान करने के लिए डिज़ाइन किया गया है। यह मध्यम और निम्न आय वाले
    परिवारों के लिए एक सरल और पारदर्शी ऋण समाधान है।


    मुख्य विवरण निम्नलिखित हैं:

    - न्यूनतम ऋण राशि: ₹25000

    - वार्षिक ब्याज दर: 11.5%

    - ऋण-मूल्य अनुपात (LTV) सीमा: 75% (आपके सोने के बाजार मूल्य का अधिकतम 75% तक ऋण
    उपलब्ध है)

    - ऋण की अवधि: 12 महीने

    - प्रोसेसिंग शुल्क: ₹500 (एक बार का शुल्क)


    हम प्रत्येक ऋण के लिए एक ''Key Fact Statement (KFS)'' प्रदान करते हैं ताकि आप
    ब्याज और प्रोसेसिंग फीस सहित अपनी कुल वार्षिक लागत को स्पष्ट रूप से समझ सकें।
    हमारा उद्देश्य आपको बिना किसी जटिलता के आपकी तत्काल जरूरतों को पूरा करने में मदद
    करना है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
