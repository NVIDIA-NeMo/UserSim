- id: a57174c4-ec83-597b-9eff-1cb16090d4b2
  title: कंज्यूमर ड्यूरेबल EMI — सेटअप और सक्रियण
  body: 'कंज्यूमर ड्यूरेबल EMI को सक्रिय करने के लिए नीचे दिए गए चरणों का पालन करें:


    1. आवश्यक दस्तावेज़: अपने साथ वैध पहचान पत्र और पते का प्रमाण (KYC दस्तावेज़)
    तैयार रखें।

    2. उत्पाद का चयन: उस इलेक्ट्रॉनिक सामान का विवरण दें जिसे आप खरीदना चाहते हैं।

    3. आवेदन प्रक्रिया: हमें अपनी पात्रता के लिए आवश्यक विवरण प्रदान करें। हम आपके
    आवेदन की समीक्षा करेंगे और त्वरित स्वीकृति प्रदान करेंगे।

    4. शुल्क भुगतान: ऋण प्रक्रिया को आगे बढ़ाने के लिए ₹499 का प्रोसेसिंग शुल्क जमा
    करें।

    5. दस्तावेज़ हस्ताक्षर: हम आपको एक ''Key Fact Statement (KFS)'' प्रदान करेंगे
    जिसमें 0% वार्षिक ब्याज दर और 9 माह की अवधि का विवरण होगा। इस पर हस्ताक्षर करें।

    6. सक्रियण: एक बार औपचारिकताएं पूरी होने के बाद, हम विक्रेता को भुगतान कर देंगे
    और आपका ऋण सक्रिय हो जाएगा।


    सक्रियण सफल होने पर आपको एक पुष्टिकरण संदेश प्राप्त होगा और आपकी पहली किस्त की
    तारीख निर्धारित कर दी जाएगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
