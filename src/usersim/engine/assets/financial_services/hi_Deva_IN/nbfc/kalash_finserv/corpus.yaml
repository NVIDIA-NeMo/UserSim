- id: 5e9a8446-e05b-5243-b5d0-ba01ff743578
  title: दोपहिया वाहन ऋण — बदलाव या अद्यतन करना
  body: 'यदि आप अपने ''दोपहिया वाहन ऋण'' खाते से जुड़ी व्यक्तिगत जानकारी या बैंक विवरण
    बदलना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें सूचित करें: हमें बताएं कि आप कौन सा विवरण (जैसे मोबाइल नंबर, पता या बैंक
    खाता) अपडेट करना चाहते हैं।

    2. दस्तावेज़ जमा करें: अपडेट किए जाने वाले विवरण के समर्थन में आवश्यक केवाईसी
    (KYC) दस्तावेज़ हमें प्रदान करें।

    3. सत्यापन: हम आपके द्वारा दिए गए दस्तावेज़ों का बहु-स्तरीय प्रमाणीकरण करेंगे
    ताकि सुरक्षा सुनिश्चित की जा सके।

    4. पुष्टीकरण: सत्यापन सफल होने के बाद, हम आपको सूचित करेंगे कि आपके विवरण अद्यतन
    कर दिए गए हैं।


    ध्यान दें: यदि आप वह बैंक खाता बदल रहे हैं जिससे आपकी ईएमआई (EMI) कटती है, तो
    आपको एक नया ''EMI भुगतान मैंडेट'' प्रदान करना होगा ताकि समय पर भुगतान सुनिश्चित
    हो सके और आप ''EMI Bounce Charge'' से बच सकें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
