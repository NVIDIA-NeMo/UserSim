- id: 34ce3847-14de-5d61-862b-f2da7b9f8613
  title: व्यक्तिगत ऋण (पर्सनल लोन) — नियामक प्रकटीकरण
  body: 'कलश फिनसर्व RBI के डिजिटल लेंडिंग दिशा-निर्देशों और फेयर प्रैक्टिस कोड का
    कड़ाई से पालन करता है। व्यक्तिगत ऋण (पर्सनल लोन) के लिए हम निम्नलिखित नियामक मानकों
    को सुनिश्चित करते हैं:


    - पारदर्शिता: प्रत्येक ग्राहक को एक ''Key Fact Statement'' दिया जाएगा, जिसमें
    14.5% वार्षिक ब्याज दर, 2% प्रोसेसिंग शुल्क और अन्य सभी लागू प्रभारों का स्पष्ट
    विवरण होगा।

    - वसूली प्रक्रिया: हम केवल गैर-दबावपूर्ण वसूली (Non-coercive Collection) का पालन
    करते हैं। किसी भी परिस्थिति में मानसिक या शारीरिक दबाव का उपयोग नहीं किया जाएगा।

    - डेटा गोपनीयता: हम ग्राहक डेटा की गोपनीयता का पूर्ण सम्मान करते हैं और इसे केवल
    विहित उद्देश्यों के लिए उपयोग करते हैं।

    - शुल्क: ₹500 का EMI बाउंस शुल्क और 4% फोरक्लोज़र शुल्क केवल ऋण समझौते की शर्तों
    के अनुसार लागू होंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
