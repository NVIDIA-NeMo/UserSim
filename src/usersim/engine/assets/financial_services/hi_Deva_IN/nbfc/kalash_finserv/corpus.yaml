- id: b16c2b78-2254-5378-b34d-534c7488d35f
  title: EMI भुगतान मैंडेट — जोखिम प्रकटीकरण
  body: 'कृपया EMI भुगतान मैंडेट का उपयोग करने से पहले निम्नलिखित जोखिमों को समझ लें:


    1. अपर्याप्त निधि का जोखिम: यदि आपके खाते में किस्त की राशि उपलब्ध नहीं है, तो
    आपका बैंक और कलश फिनसर्व दोनों शुल्क लगा सकते हैं। कलश फिनसर्व द्वारा ₹500 का
    EMI Bounce Charge लगाया जाएगा।

    2. समय सीमा: मैंडेट में किसी भी बदलाव के लिए 3 दिन की प्रोसेसिंग अवधि अनिवार्य
    है; इस अवधि के दौरान पुराना मैंडेट प्रभावी रह सकता है।

    3. पूर्व-सूचना: हम 24 घंटे पहले सूचना प्रदान करते हैं, लेकिन अंतिम जिम्मेदारी
    ग्राहक की है कि वह खाते में पर्याप्त राशि सुनिश्चित करे।


    हम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं और बिना किसी दबाव के वसूली (non-coercive
    collection) के प्रति प्रतिबद्ध हैं। हमारा उद्देश्य आपको सरल और पारदर्शी ऋण समाधान
    प्रदान करना है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
