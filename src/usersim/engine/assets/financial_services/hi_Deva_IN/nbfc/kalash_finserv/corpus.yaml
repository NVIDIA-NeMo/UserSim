- id: 4649669c-417f-5891-afee-84acf0ff9f8c
  title: EMI भुगतान मैंडेट — सिंहावलोकन
  body: 'कलश फिनसर्व का EMI भुगतान मैंडेट एक स्वचालित भुगतान व्यवस्था है, जिसे विशेष
    रूप से हमारे मध्यम और निम्न आय वाले ग्राहकों की सुविधा के लिए बनाया गया है। इसका
    मुख्य उद्देश्य समय पर भुगतान सुनिश्चित करना और ग्राहकों को याद रखने के तनाव से
    मुक्त करना है।


    इस सुविधा के माध्यम से, आपकी ऋण किस्तें सीधे आपके बैंक खाते से निर्धारित तिथि
    पर काट ली जाती हैं। हम पारदर्शिता में विश्वास रखते हैं, इसलिए खाते से राशि कटने
    से 24 घंटे पहले आपको एक प्री-डेबिट सूचना भेजी जाती है। यदि किसी कारणवश आपके खाते
    में पर्याप्त राशि नहीं होती है और किस्त बाउंस हो जाती है, तो ₹500 का EMI बाउंस
    शुल्क लगाया जाता है। यदि आप अपने मैंडेट के विवरण में कोई बदलाव करना चाहते हैं,
    तो मैंडेट संशोधन के लिए 3 दिनों की प्रोसेसिंग अवधि लगती है।


    यह सुविधा हमारे विभिन्न ऋण उत्पादों जैसे व्यक्तिगत ऋण और स्वर्ण ऋण के साथ सहजता
    से काम करती है ताकि आपका ऋण अनुशासन बना रहे और आपका क्रेडिट स्कोर सुरक्षित रहे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
