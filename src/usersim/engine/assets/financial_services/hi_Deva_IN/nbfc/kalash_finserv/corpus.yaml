- id: cd1d356f-d8c0-5a09-91d9-4ab266c9dd25
  title: व्यक्तिगत ऋण (पर्सनल लोन) — सिंहावलोकन
  body: 'कलश फिनसर्व का व्यक्तिगत ऋण (पर्सनल लोन) एक लचीला ऋण विकल्प है, जिसे बिना
    किसी विशेष गारंटी के आपकी तत्काल वित्तीय जरूरतों को पूरा करने के लिए डिज़ाइन किया
    गया है। हम मध्यम और निम्न आय वाले परिवारों को सरल और पारदर्शी ऋण समाधान प्रदान
    करने के लिए प्रतिबद्ध हैं।


    इस उत्पाद की मुख्य विशेषताएं और लागत विवरण निम्नलिखित हैं:

    - वार्षिक ब्याज दर: 14.5%

    - प्रोसेसिंग शुल्क: ऋण राशि का 2%

    - अधिकतम ऋण अवधि: 60 माह

    - फोरक्लोज़र शुल्क (समय से पहले बंद करने पर): बकाया राशि का 4%

    - EMI बाउंस शुल्क: ₹500 (किस्त भुगतान विफल होने पर)


    हम प्रत्येक ऋण के लिए ''Key Fact Statement'' प्रदान करते हैं ताकि आप कुल वार्षिक
    लागत को स्पष्ट रूप से समझ सकें। हमारी प्रक्रिया त्वरित स्वीकृति और पूर्ण पारदर्शिता
    पर आधारित है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: product_sheet
  source_authority: official
