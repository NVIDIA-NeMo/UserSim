  institution_id: kalash_finserv
- id: c81cf412-7713-5ea3-9541-2d297c1c32be
  title: दोपहिया वाहन ऋण — जोखिम प्रकटीकरण
  body: 'दोपहिया वाहन ऋण (two_wheeler_loan) लेते समय ग्राहकों को निम्नलिखित जोखिमों
    और शर्तों के बारे में सूचित किया जाता है:


    1. ब्याज लागत: इस ऋण पर 12.9% की वार्षिक ब्याज दर लागू होती है। भुगतान में देरी
    से कुल ब्याज लागत बढ़ सकती है।

    2. भुगतान चूक: EMI का समय पर भुगतान न करने पर ''EMI Bounce Charge'' लगाया जाएगा
    और इसका प्रभाव आपके क्रेडिट स्कोर पर पड़ सकता है।

    3. संपत्ति का अधिकार: ऋण की पूरी अवधि (अधिकतम 36 महीने) के दौरान वाहन पर कलश फिनसर्व
    का कानूनी अधिकार (Hypothecation) रहेगा।

    4. शुल्क: ₹1500 का प्रोसेसिंग शुल्क गैर-वापसी योग्य है।


    हम RBI के डिजिटल लेंडिंग दिशा-निर्देशों और फेयर प्रैक्टिस कोड का कड़ाई से पालन
    करते हैं। प्रत्येक ग्राहक को एक ''Key Fact Statement (KFS)'' प्रदान किया जाता
    है ताकि वे ऋण लेने से पहले सभी वित्तीय निहितार्थों को समझ सकें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
