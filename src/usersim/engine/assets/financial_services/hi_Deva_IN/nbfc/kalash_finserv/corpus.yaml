    \ कोई संदिग्ध गतिविधि दिखाई देती है, तो तुरंत हमें रिपोर्ट करें ताकि हम चार्जबैक\
    \ और सुरक्षा प्रक्रियाओं के माध्यम से इसे हल कर सकें।\n\nडिस्क्लेमर: हम कोई जमा\
    \ राशि (deposits) स्वीकार नहीं करते हैं।"
