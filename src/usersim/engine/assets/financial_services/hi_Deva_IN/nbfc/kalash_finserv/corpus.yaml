- id: 14908340-f3c4-5a4f-b198-040e9134839b
  title: व्यक्तिगत ऋण (पर्सनल लोन) — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'कलश फिनसर्व के ग्राहकों को व्यक्तिगत ऋण (पर्सनल लोन) के नाम पर होने वाले
    स्कैम्स से सावधान रहना चाहिए। जालसाज अक्सर ''तत्काल मंजूरी'' या ''बिना किसी दस्तावेज़
    के ऋण'' का लालच देकर आपसे संपर्क करते हैं।


    इन स्कैम्स की पहचान कैसे करें:

    1. अग्रिम शुल्क की मांग: यदि कोई व्यक्ति ऋण स्वीकृत करने के लिए आपसे एडवांस में
    फाइल चार्ज या बीमा शुल्क मांगता है, तो यह एक स्कैम है।

    2. संदिग्ध लिंक: व्हाट्सएप या एसएमएस के माध्यम से भेजे गए अनजान लिंक पर क्लिक
    न करें जो आपसे आपकी व्यक्तिगत जानकारी मांगते हों।

    3. दबाव बनाना: स्कैमर्स आपको डरा सकते हैं कि यदि आपने तुरंत भुगतान नहीं किया तो
    ऑफर समाप्त हो जाएगा।


    याद रखें, कलश फिनसर्व आपसे कभी भी आपका UPI PIN, OTP या CVV साझा करने के लिए नहीं
    कहेगा। यदि आपको कोई संदिग्ध गतिविधि दिखती है, तो तुरंत हमें रिपोर्ट करें। हम धोखाधड़ी
    के मामलों को तुरंत रिपोर्टिंग और चार्जबैक प्रक्रिया के माध्यम से हल करने के लिए
    प्रतिबद्ध हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
