- id: b5d5ebfa-9708-56ec-9ef8-ff6ae5c4b7e0
  title: कंज्यूमर ड्यूरेबल EMI — गोपनीयता और डेटा प्रबंधन
  body: 'कलश फिनसर्व आपके डेटा की गोपनीयता का पूर्ण सम्मान करता है। कंज्यूमर ड्यूरेबल
    EMI के उपयोग के दौरान एकत्र किया गया आपका डेटा केवल ऋण प्रसंस्करण, केवाईसी सत्यापन
    और नियामक अनुपालन के लिए उपयोग किया जाता है।


    1. डेटा संग्रहण: हम केवल वही जानकारी एकत्र करते हैं जो RBI के डिजिटल लेंडिंग दिशा-निर्देशों
    के अनुसार आवश्यक है।

    2. सुरक्षा: आपकी व्यक्तिगत और वित्तीय जानकारी को सुरक्षित रखने के लिए हम बहु-स्तरीय
    प्रमाणीकरण और एन्क्रिप्शन का उपयोग करते हैं।

    3. तृतीय पक्ष साझाकरण: हम आपका डेटा किसी भी बाहरी एजेंसी के साथ तब तक साझा नहीं
    करते जब तक कि वह कानूनी रूप से अनिवार्य न हो या ऋण वसूली के लिए आवश्यक न हो।

    4. वसूली प्रक्रिया: हम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं और बिना किसी
    मानसिक या शारीरिक दबाव के (non-coercive collection) वसूली सुनिश्चित करते हैं।


    हम स्पष्ट करते हैं कि हम कोई जमा राशि स्वीकार नहीं करते हैं।


