- id: 7a49d79d-f0b9-5226-ba31-6209963ec3c7
  title: स्वर्ण ऋण (गोल्ड लोन) — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने स्वर्ण ऋण (गोल्ड लोन) की प्रक्रिया में समस्या आ रही है, तो
    कृपया निम्नलिखित जांचें:


    लक्षण: ऋण राशि खाते में जमा नहीं हुई है या आवेदन लंबित है।

    संभावित कारण:

    1. KYC दस्तावेजों में विसंगति या अधूरा प्रमाणीकरण।

    2. सोने के मूल्यांकन में देरी या शुद्धता संबंधी समस्या।

    3. बैंक खाते का विवरण गलत होना।


    समाधान के चरण:

    - सबसे पहले यह सुनिश्चित करें कि आपने सभी आवश्यक KYC दस्तावेज़ जमा कर दिए हैं
    और वे अपडेटेड हैं।

    - अपने बैंक खाते की जानकारी की दोबारा जांच करें कि वह सही है या नहीं।

    - यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके मामले की जांच करेंगे और
    विवरण अपडेट करेंगे।


    एस्केलेशन: यदि समस्या का समाधान तुरंत नहीं होता है, तो हम इसे अपने आंतरिक शिकायत
    निवारण सेल को भेजेंगे और RBI के टर्न-अराउंड-टाइम (TAT) ढांचे के अनुसार आपको समाधान
    प्रदान करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
