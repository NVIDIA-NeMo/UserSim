- id: 1a4c5773-5c2a-5f62-8fb6-5ef27fc5912c
  title: दोपहिया वाहन ऋण — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके ''दोपहिया वाहन ऋण'' खाते की सुरक्षा हमारी प्राथमिकता है। डिजिटल धोखाधड़ी
    से बचने के लिए कृपया इन सर्वोत्तम प्रथाओं का पालन करें:


    1. गोपनीय जानकारी: कलश फिनसर्व के प्रतिनिधि आपसे कभी भी आपका UPI PIN, OTP या CVV
    साझा करने के लिए नहीं कहेंगे। यदि कोई ऐसा अनुरोध करता है, तो वह धोखाधड़ी हो सकती
    है।

    2. प्रमाणीकरण: किसी भी वित्तीय लेन-देन या आपके खाते के विवरण में बदलाव से पहले
    हम सख्त KYC और बहु-स्तरीय प्रमाणीकरण प्रक्रिया का पालन करते हैं।

    3. संदिग्ध लिंक: ईमेल या SMS के माध्यम से आने वाले अज्ञात लिंक पर क्लिक न करें
    जो आपसे व्यक्तिगत जानकारी मांगते हों।


    यदि आपको अपने खाते में कोई संदिग्ध गतिविधि दिखाई देती है, तो तुरंत हमें रिपोर्ट
    करें। हम RBI के टर्न-अराउंड-टाइम (TAT) ढांचे के अनुसार शिकायतों का त्वरित समाधान
    करते हैं और धोखाधड़ी के मामलों को चार्जबैक प्रक्रिया के माध्यम से हल किया जाता
    है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
