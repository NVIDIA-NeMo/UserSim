  body: 'एक सपोर्ट एजेंट के रूप में, ग्राहक को कंज्यूमर ड्यूरेबल EMI की सीमाओं के
    बारे में स्पष्ट जानकारी दें:


    1. ऋण अवधि: इस उत्पाद के तहत अधिकतम ऋण अवधि 9 महीने निर्धारित है। इससे अधिक समय
    के लिए ऋण उपलब्ध नहीं है।

    2. शुल्क: प्रत्येक ऋण आवेदन पर ₹499 का एकमुश्त प्रोसेसिंग शुल्क लागू होता है।
    यह शुल्क संचालन लागत को कवर करने के लिए लिया जाता है और केवल विशेष प्रबंधकीय अनुमोदन
    के अधीन ही माफ किया जा सकता है।

    3. ब्याज दर: इस उत्पाद की सबसे बड़ी विशेषता इसकी 0% वार्षिक ब्याज दर है, जिससे
    ग्राहक बिना किसी अतिरिक्त ब्याज बोझ के सामान खरीद सकते हैं।

    4. भुगतान अनुशासन: यदि किस्त समय पर जमा नहीं होती है, तो ₹350 का विलंब भुगतान
    शुल्क लगाया जाएगा।


    अपवाद स्थितियाँ: यदि ग्राहक का क्रेडिट स्कोर या KYC दस्तावेज़ अपूर्ण हैं, तो ऋण
    अस्वीकृत किया जा सकता है। किसी भी ऋण के लिए ''Key Fact Statement'' अनिवार्य है
    ताकि पारदर्शिता बनी रहे।


