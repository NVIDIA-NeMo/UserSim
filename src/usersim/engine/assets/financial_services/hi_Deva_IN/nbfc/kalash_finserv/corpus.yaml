- id: 9c1e8c47-f861-52bc-9669-4766ad35e829
  title: स्वर्ण ऋण (गोल्ड लोन) — वार्षिक ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरे स्वर्ण ऋण (गोल्ड लोन) पर वार्षिक ब्याज दर क्या है और यह कैसे
    काम करती है?

    उत्तर: आपके ऋण पर 11.5% की वार्षिक ब्याज दर लागू होती है। इसका मतलब है कि एक वर्ष
    की अवधि के लिए आपके द्वारा लिए गए मूलधन पर यह प्रतिशत ब्याज जोड़ा जाता है।


    प्रश्न: क्या यह दर समय के साथ बदल सकती है?

    उत्तर: यह दर आपके ऋण अनुबंध के समय तय की जाती है। विस्तृत जानकारी के लिए कृपया
    ''स्वर्ण ऋण (गोल्ड लोन) — दरें कैसे श्रेणीबद्ध और लागू होती हैं'' देखें।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
