- id: 2a3d0060-a8dd-5719-88da-a6def2c95e4d
  title: स्वर्ण ऋण (गोल्ड लोन) — शर्तों में बदलाव की नीति
  body: 'कलश फिनसर्व को बाजार की स्थितियों और नियामक परिवर्तनों के आधार पर स्वर्ण
    ऋण (गोल्ड लोन) की शर्तों में बदलाव करने का अधिकार है। वर्तमान में, हमारी वार्षिक
    ब्याज दर 11.5% है और प्रोसेसिंग शुल्क ₹500 निर्धारित है। यदि इन शुल्कों या ब्याज
    दरों में कोई बदलाव होता है, तो हम ग्राहकों को पूर्व सूचना प्रदान करेंगे।


    शर्तों में बदलाव के मुख्य बिंदु:

    1. ब्याज दर में परिवर्तन: बाजार की दरों के अनुसार वार्षिक ब्याज दर को संशोधित
    किया जा सकता है।

    2. LTV सीमा: वर्तमान 75% की Loan-to-Value (LTV) सीमा सोने के बाजार मूल्य में भारी
    उतार-चढ़ाव के कारण बदली जा सकती है।

    3. शुल्क संशोधन: संचालन लागत को कवर करने के लिए प्रोसेसिंग शुल्क में बदलाव किया
    जा सकता है, जो प्रबंधकीय अनुमोदन के अधीन होगा।


    किसी भी बदलाव के बाद, संशोधित शर्तें आपके ऋण अनुबंध का हिस्सा बन जाएंगी। हम पूर्ण
    पारदर्शिता बनाए रखने के लिए प्रतिबद्ध हैं और हर बदलाव की जानकारी स्पष्ट रूप से
    साझा करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
