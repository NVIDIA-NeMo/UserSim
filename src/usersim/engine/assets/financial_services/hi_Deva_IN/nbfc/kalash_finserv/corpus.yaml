- id: 00f89d48-9670-5036-b550-a2aa16a42b99
  title: कंज्यूमर ड्यूरेबल EMI — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपका कंज्यूमर ड्यूरेबल EMI आवेदन अस्वीकृत हो गया है या कोई कार्रवाई अवरुद्ध
    है, तो निम्नलिखित जांचें:


    संभावित कारण:

    - अपूर्ण KYC: यदि आपके दस्तावेज़ अपडेट नहीं हैं, तो सुरक्षा कारणों से कार्रवाई
    अवरुद्ध हो सकती है।

    - पात्रता मानदंड: यदि आप हमारी आंतरिक ऋण नीति के मानदंडों को पूरा नहीं करते हैं।

    - दस्तावेज़ विसंगति: आपके द्वारा दिए गए विवरणों और आधिकारिक रिकॉर्ड में अंतर होना।


    समाधान प्रक्रिया:

    1. हमसे अपनी अस्वीकृति का सटीक कारण पूछें।

    2. यदि समस्या KYC की है, तो आवश्यक दस्तावेज़ पुनः प्रदान करें।

    3. यदि विवरण में अंतर है, तो सही दस्तावेज़ जमा करें ताकि हम उसे सत्यापित कर सकें।


    यदि समस्या बनी रहती है, तो हम मामले को अपनी विशेषज्ञ टीम को भेजेंगे (एस्केलेट
    करेंगे), और आपको 3-5 कार्य दिवसों के भीतर अंतिम निर्णय की सूचना दी जाएगी।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
