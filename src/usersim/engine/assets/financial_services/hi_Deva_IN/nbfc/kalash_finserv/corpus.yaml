  title: कंज्यूमर ड्यूरेबल EMI — स्थिति या इतिहास देखना
  body: 'अपने कंज्यूमर ड्यूरेबल EMI ऋण की वर्तमान स्थिति या पिछले भुगतानों का इतिहास
    देखने के लिए इन चरणों का पालन करें:


    1. हमसे अपने ऋण खाते का विवरण मांगें।

    2. हम आपसे आपकी पहचान सत्यापित करने के लिए बुनियादी विवरण मांगेंगे (जैसे पंजीकृत
    मोबाइल नंबर या ऋण खाता संख्या)।

    3. सत्यापन के बाद, हम आपको आपके ऋण की वर्तमान स्थिति (जैसे: सक्रिय, बंद, या बकाया)
    प्रदान करेंगे।

    4. यदि आप भुगतान इतिहास देखना चाहते हैं, तो हमसे अपना ''स्टेटमेंट'' मांगें।

    5. हम आपको अब तक भुगतान की गई सभी किस्तों और यदि कोई ₹350 का विलंब भुगतान शुल्क
    लगा है, तो उसका पूर्ण विवरण देंगे।


    आपको एक स्पष्ट विवरण प्राप्त होगा जिसमें आपकी शेष राशि और अगली किस्त की तारीख
    शामिल होगी।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
