- id: 21a66397-2a2d-5b77-bcb2-6f8ef827809d
  title: EMI भुगतान मैंडेट — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने EMI भुगतान मैंडेट के साथ समस्या आ रही है, तो कृपया निम्नलिखित
    विवरण देखें:


    लक्षण: किस्त की तारीख होने के बावजूद राशि नहीं कटी या मैंडेट सक्रिय नहीं हुआ।

    संभावित कारण:

    - बैंक खाते में पर्याप्त राशि का न होना।

    - बैंक द्वारा मैंडेट अनुरोध को अस्वीकार करना।

    - KYC विवरण में विसंगति।


    समाधान प्रक्रिया:

    1. सबसे पहले अपने बैंक स्टेटमेंट में जांचें कि क्या ₹500 का EMI बाउंस शुल्क कटा
    है।

    2. यदि मैंडेट लंबित है, तो पुष्टि करें कि आपने बैंक के प्रमाणीकरण अनुरोध को पूरा
    कर लिया है।

    3. यदि विवरण गलत हैं, तो हमें मैंडेट संशोधन के लिए सूचित करें (इस प्रक्रिया में
    3 दिनों की प्रोसेसिंग अवधि लगती है)।


    यदि समस्या बनी रहती है, तो हम आपके मामले को आंतरिक परिचालन टीम के पास भेजेंगे,
    और समाधान होने पर आपको सूचित किया जाएगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
