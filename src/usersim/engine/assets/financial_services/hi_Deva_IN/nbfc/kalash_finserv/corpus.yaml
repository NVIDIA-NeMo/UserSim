- id: 68a15e2a-182e-5891-a262-f7e7379cac70
  title: व्यक्तिगत ऋण (पर्सनल लोन) — गोपनीयता और डेटा प्रबंधन
  body: 'कलश फिनसर्व आपके व्यक्तिगत और वित्तीय डेटा की गोपनीयता का पूर्ण सम्मान करता
    है।


    डेटा संग्रह और उपयोग:

    1. हम केवल वही जानकारी एकत्र करते हैं जो KYC और ऋण मूल्यांकन के लिए आवश्यक है।

    2. आपके डेटा का उपयोग ऋण स्वीकृति, क्रेडिट स्कोरिंग और नियामक रिपोर्टिंग के लिए
    किया जाता है।

    3. हम आपके डेटा को किसी भी तीसरे पक्ष को नहीं बेचते हैं, सिवाय उन मामलों के जहाँ
    RBI या कानूनी अधिकारियों द्वारा अनिवार्य हो।


    सुरक्षा उपाय:

    हम डेटा सुरक्षा के लिए उन्नत एन्क्रिप्शन का उपयोग करते हैं और यह सुनिश्चित करते
    हैं कि आपकी जानकारी केवल अधिकृत कर्मचारियों तक ही सीमित रहे। हम RBI के डिजिटल
    लेंडिंग दिशा-निर्देशों का कड़ाई से पालन करते हैं। ग्राहकों को सूचित किया जाता
    है कि 14.5% वार्षिक ब्याज दर और अन्य शुल्कों का विवरण उनके ''Key Fact Statement''
    में स्पष्ट रूप से दर्ज है।


