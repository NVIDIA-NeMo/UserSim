- id: 6a4cdf7c-369c-5d7b-8ae1-3498cf07271d
  title: EMI भुगतान मैंडेट — ब्याज दर अनुसूची
  body: 'EMI भुगतान मैंडेट स्वयं एक भुगतान सुविधा है, न कि कोई ऋण उत्पाद, इसलिए इस
    पर कोई अलग से ब्याज दर लागू नहीं होती है।


    यह सुविधा आपके मौजूदा ऋण (जैसे व्यक्तिगत ऋण या स्वर्ण ऋण) के पुनर्भुगतान को आसान
    बनाती है। आपके ऋण पर लागू ब्याज दरें आपके संबंधित ऋण अनुबंध और ''Key Fact Statement
    (KFS)'' में स्पष्ट रूप से उल्लेखित हैं। यह मैंडेट केवल उन किस्तों के स्वचालित
    संग्रह के लिए है जिनकी गणना आपके मूल ऋण की दरों के आधार पर की गई है।'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: rate_sheet
  source_authority: official
