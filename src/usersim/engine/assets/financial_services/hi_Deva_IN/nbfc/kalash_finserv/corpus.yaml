- id: 2744e26d-bf4c-5ffe-b48e-db38eb1b43f2
  title: व्यक्तिगत ऋण (पर्सनल लोन) — खाता अनुबंध
  body: 'यह अनुबंध ग्राहक और कलश फिनसर्व के बीच व्यक्तिगत ऋण (पर्सनल लोन) के नियमों
    को निर्धारित करता है।


    1. ब्याज और शुल्क: ऋण पर 14.5% की वार्षिक ब्याज दर लागू होगी। ऋण स्वीकृति के समय
    2% का प्रोसेसिंग शुल्क लिया जाएगा, जो संचालन लागत को कवर करता है।

    2. पुनर्भुगतान: ऋण की अधिकतम अवधि 60 महीने निर्धारित है। ग्राहक समय पर EMI का
    भुगतान करने के लिए बाध्य है।

    3. दंड शुल्क: यदि किस्त के भुगतान के समय खाते में पर्याप्त राशि नहीं है, तो ₹500
    का EMI Bounce Charge लगाया जाएगा।

    4. समयपूर्व बंद करना: यदि ग्राहक ऋण अवधि समाप्त होने से पहले ऋण बंद करना चाहता
    है, तो 4% का फोरक्लोज़र शुल्क देय होगा।

    5. वसूली: हम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं और केवल Non-coercive Collection
    (बिना दबाव के वसूली) प्रक्रिया अपनाते हैं।

    6. समाप्ति: सभी बकाया राशि और शुल्कों के भुगतान के बाद ही ऋण खाता बंद माना जाएगा।


