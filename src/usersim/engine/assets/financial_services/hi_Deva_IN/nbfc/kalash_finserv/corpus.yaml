  title: स्वर्ण ऋण (गोल्ड लोन) — शुल्क अनुसूची
  body: 'स्वर्ण ऋण (गोल्ड लोन) के लिए लागू शुल्क निम्नलिखित हैं:


    - प्रोसेसिंग शुल्क: ₹500 (ऋण आवेदन के समय एक बार लिया जाने वाला शुल्क)

    - वार्षिक ब्याज दर: 11.5%


    हमारा शुल्क ढांचा पूरी तरह पारदर्शी है। प्रोसेसिंग शुल्क का उपयोग केवल संचालन
    लागत को कवर करने के लिए किया जाता है। ऋण अनुशासन बनाए रखने के लिए, शुल्क माफी
    केवल विशेष प्रबंधकीय अनुमोदन के अधीन है।'
