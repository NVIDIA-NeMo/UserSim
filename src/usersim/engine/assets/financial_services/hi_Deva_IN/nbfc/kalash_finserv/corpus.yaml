- id: 5b1394c8-fcc4-543a-a459-14ee18d1f206
  title: व्यक्तिगत ऋण (पर्सनल लोन) — पात्रता श्रेणियाँ
  body: 'एजेंटों के लिए व्यक्तिगत ऋण (पर्सनल लोन) पात्रता मार्गदर्शिका:


    - वेतनभोगी कर्मचारी: न्यूनतम मासिक आय ₹15,000 और 2 वर्ष का कार्य अनुभव -> स्वीकृत
    (प्रोसेसिंग शुल्क 2%, ब्याज 14.5%)

    - स्व-नियोजित व्यक्ति: न्यूनतम वार्षिक टर्नओवर ₹3 लाख और 3 वर्ष का व्यवसाय इतिहास
    -> स्वीकृत (प्रोसेसिंग शुल्क 2%, ब्याज 14.5%)

    - कम क्रेडिट स्कोर (<600): अतिरिक्त संपार्श्विक की आवश्यकता या आवेदन अस्वीकृत
    -> समीक्षा आवश्यक


    सभी स्वीकृत ऋणों के लिए अधिकतम अवधि 60 महीने होगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
