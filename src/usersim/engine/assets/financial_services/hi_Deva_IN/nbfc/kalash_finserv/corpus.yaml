  title: स्वर्ण ऋण (गोल्ड लोन) — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'एक सहायता एजेंट के रूप में, ग्राहकों को स्वर्ण ऋण (गोल्ड लोन) की निम्नलिखित
    सीमाओं और प्रतिबंधों के बारे में स्पष्ट रूप से सूचित करें:


    1. ऋण राशि की सीमा: इस उत्पाद के लिए न्यूनतम ऋण राशि ₹25000 है। इससे कम राशि के
    अनुरोध स्वीकार नहीं किए जा सकते।

    2. LTV कैप: हम अधिकतम 75% के ऋण-मूल्य अनुपात (LTV) का पालन करते हैं। इसका अर्थ
    है कि ग्राहक को उसके सोने के वर्तमान बाजार मूल्य के 75% से अधिक ऋण नहीं मिल सकता।

    3. ब्याज और शुल्क: वार्षिक ब्याज दर 11.5% है और एकमुश्त प्रोसेसिंग शुल्क ₹500
    है। ये शुल्क अनिवार्य हैं और केवल विशेष प्रबंधकीय अनुमोदन के साथ ही माफ किए जा
    सकते हैं ताकि ऋण अनुशासन बना रहे।

    4. अवधि: ऋण की अधिकतम अवधि 12 महीने निर्धारित है।


    अपवाद स्थितियाँ: यदि ग्राहक के पास आवश्यक KYC दस्तावेज़ नहीं हैं या सोने की शुद्धता
