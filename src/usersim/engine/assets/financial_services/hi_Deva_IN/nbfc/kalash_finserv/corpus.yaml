  title: स्वर्ण ऋण (गोल्ड लोन) — गोपनीयता और डेटा प्रबंधन
  body: 'कलश फिनसर्व आपके व्यक्तिगत और वित्तीय डेटा की गोपनीयता का पूर्ण सम्मान करता
    है। स्वर्ण ऋण (गोल्ड लोन) प्रक्रिया के दौरान एकत्र किया गया आपका डेटा (KYC, संपर्क
    विवरण और सोने का विवरण) केवल ऋण प्रबंधन और नियामक रिपोर्टिंग के लिए उपयोग किया
    जाता है।


    डेटा प्रबंधन के प्रमुख बिंदु:

    1. सुरक्षा: हम डेटा सुरक्षा के लिए बहु-स्तरीय प्रमाणीकरण और एन्क्रिप्शन का उपयोग
    करते हैं।

    2. साझाकरण: हम आपका डेटा किसी तीसरे पक्ष को नहीं बेचते हैं; इसे केवल RBI के दिशा-निर्देशों
    और कानूनी आवश्यकताओं के तहत साझा किया जाता है।

    3. पारदर्शिता: हर ऋण के लिए ''Key Fact Statement'' अनिवार्य है, ताकि आप 11.5%
    ब्याज दर और ₹500 प्रोसेसिंग शुल्क सहित कुल वार्षिक लागत को स्पष्ट रूप से समझ सकें।

    4. अधिकार: ग्राहकों को अपने रिकॉर्ड की समीक्षा करने और उन्हें अद्यतन करने का अधिकार
    है।


    हम RBI के फेयर प्रैक्टिस कोड का कड़ाई से पालन करते हैं ताकि आपकी गोपनीयता और अधिकार
    सुरक्षित रहें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
