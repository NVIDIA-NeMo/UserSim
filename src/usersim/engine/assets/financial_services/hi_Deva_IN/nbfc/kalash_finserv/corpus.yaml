- id: 13071c80-dfce-5e4b-acab-3e4b00aa97a6
  title: स्वर्ण ऋण (गोल्ड लोन) — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपको स्वर्ण ऋण (गोल्ड लोन) आवेदन या किसी भुगतान के दौरान ''अस्वीकृत''
    (Rejected) या ''अवरुद्ध'' (Blocked) का संदेश मिलता है, तो इसके संभावित कारण और
    समाधान नीचे दिए गए हैं:


    संभावित कारण:

    - न्यूनतम राशि की कमी: यदि आपका ऋण अनुरोध ₹25000 से कम है, तो आवेदन अस्वीकृत हो
    जाएगा।

    - LTV सीमा का उल्लंघन: यदि अनुरोधित राशि सोने के मूल्य के 75% से अधिक है, तो यह
    अवरुद्ध हो जाएगा।

    - KYC अधूरा होना: अपूर्ण पहचान दस्तावेजों के कारण कार्रवाई रोकी जा सकती है।


    क्या करें:

    1. जांचें कि क्या आपकी ऋण राशि ₹25000 या उससे अधिक है।

    2. सुनिश्चित करें कि आप सोने के बाजार मूल्य के 75% से अधिक की मांग नहीं कर रहे
    हैं।

    3. अपने KYC दस्तावेजों की वैधता जांचें।


    यदि सब कुछ सही है और समस्या बनी रहती है, तो हम आपके मामले को आंतरिक अनुपालन टीम
    को भेजेंगे। आपको 3-5 कार्य दिवसों में समाधान या स्पष्टीकरण प्राप्त होगा।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
