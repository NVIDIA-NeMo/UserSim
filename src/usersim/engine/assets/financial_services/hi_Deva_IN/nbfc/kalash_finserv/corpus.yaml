- id: 1cd51f46-9ba0-5647-8650-0238458b9b6f
  title: व्यक्तिगत ऋण (पर्सनल लोन) — शुल्क अनुसूची
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) के लिए लागू शुल्क विवरण नीचे दिए गए हैं। ये शुल्क
    ऋण अनुशासन बनाए रखने और परिचालन लागत को कवर करने के लिए हैं:


    - प्रोसेसिंग शुल्क: ऋण राशि का 2%

    - फोरक्लोज़र शुल्क: बकाया मूलधन का 4%

    - EMI बाउंस शुल्क: ₹500 प्रति विफलता


    विशेष प्रबंधकीय अनुमोदन के बिना किसी भी शुल्क को माफ नहीं किया जाएगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
