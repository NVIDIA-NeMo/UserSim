- id: e4b3937f-091b-56f2-bf0d-4e4d3c253b87
  title: स्वर्ण ऋण (गोल्ड लोन) — शुरुआत कैसे करें
  body: 'स्वर्ण ऋण (गोल्ड लोन) के माध्यम से अपनी तत्काल वित्तीय जरूरतों को पूरा करना
    बहुत सरल है। यह उत्पाद उन लोगों के लिए आदर्श है जो अपने सोने की सुरक्षा के साथ
    त्वरित नकदी चाहते हैं।


    मुख्य विवरण:

    - न्यूनतम ऋण राशि: ₹25,000

    - वार्षिक ब्याज दर: 11.5%

    - प्रोसेसिंग शुल्क: ₹500 (एक बार लिया जाने वाला शुल्क)

    - ऋण अवधि (Tenure): अधिकतम 12 महीने

    - LTV सीमा: सोने के बाजार मूल्य का अधिकतम 75%


    शुरुआत करने की प्रक्रिया:

    1. अपने शुद्ध सोने के आभूषणों के साथ हमारी निकटतम शाखा पर आएं।

    2. हमारे विशेषज्ञों द्वारा सोने का मूल्यांकन किया जाएगा और LTV सीमा (75%) के आधार
    पर ऋण राशि तय होगी।

    3. आवश्यक KYC दस्तावेज जमा करें और Key Fact Statement (KFS) की समीक्षा करें, जिसमें
    कुल वार्षिक लागत का स्पष्ट विवरण होगा।

    4. स्वीकृति के बाद, ऋण राशि सीधे आपके खाते में स्थानांतरित कर दी जाएगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
