- id: af9a8de8-34fb-51c2-9198-ff78cf75f1a4
  title: व्यक्तिगत ऋण (पर्सनल लोन) — आवश्यक दस्तावेज़
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) की स्वीकृति के लिए निम्नलिखित दस्तावेज़ अनिवार्य
    हैं:


    - पहचान प्रमाण: आधार कार्ड, पैन कार्ड या वोटर आईडी (सत्यापित KYC के लिए)।

    - आय प्रमाण: पिछले 3-6 महीनों का बैंक स्टेटमेंट या वेतन पर्ची (Salary Slip)।

    - निवास प्रमाण: बिजली बिल, रेंट एग्रीमेंट या आधार कार्ड।

    - फोटो: हाल ही की पासपोर्ट साइज फोटो।


    सभी दस्तावेज़ों के सत्यापन के बाद ही ऋण प्रक्रिया आगे बढ़ेगी।'
