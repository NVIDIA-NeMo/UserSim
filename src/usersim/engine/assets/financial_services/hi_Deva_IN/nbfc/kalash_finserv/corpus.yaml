- id: 283dc33d-60b7-5240-93c8-bbc2bbf68e1f
  title: भुगतान के लिए नियामक नोट्स
  body: 'भुगतान और लेनदेन के प्रबंधन में, कलश फिनसर्व सुरक्षा और नियामक अनुपालन को
    प्राथमिकता देता है। किसी भी वित्तीय लेन-देन या खाता परिवर्तन से पहले सख्त KYC
    और बहु-स्तरीय प्रमाणीकरण अनिवार्य है। एजेंटों को यह सुनिश्चित करना चाहिए कि ग्राहक
    की पहचान पूरी तरह सत्यापित हो।


    धोखाधड़ी के मामलों को रोकने और हल करने के लिए, हम तत्काल रिपोर्टिंग और एक मानक
    चार्जबैक प्रक्रिया का पालन करते हैं। एजेंटों का यह कर्तव्य है कि वे ग्राहकों को
    सुरक्षा के प्रति जागरूक करें और उन्हें स्पष्ट रूप से सलाह दें कि वे अपना UPI PIN,
    OTP या CVV कभी भी किसी के साथ साझा न करें। डेटा गोपनीयता का पूर्ण सम्मान करना
    हमारी अनिवार्य नीति है।


    भुगतान संबंधी किसी भी विवाद के मामले में, हम RBI द्वारा निर्धारित समय-सीमा (TAT)
    के भीतर समाधान प्रदान करने के लिए प्रतिबद्ध हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
  domain: payments
  product_category: compliance
