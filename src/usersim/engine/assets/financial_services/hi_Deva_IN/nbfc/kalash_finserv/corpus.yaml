- id: cbf6a98b-272c-5cc6-b7b5-c23255a28bb0
  title: स्वर्ण ऋण (गोल्ड लोन) — ऋण-मूल्य अनुपात (LTV) सीमा की व्याख्या
  body: 'प्रश्न: ऋण-मूल्य अनुपात (LTV) क्या है और यह मेरे स्वर्ण ऋण (गोल्ड लोन) को
    कैसे प्रभावित करता है?

    उत्तर: LTV का अर्थ है कि हम आपके द्वारा गिरवी रखे गए सोने के वर्तमान बाजार मूल्य
    के मुकाबले अधिकतम कितना ऋण दे सकते हैं। स्वर्ण ऋण (गोल्ड लोन) के लिए हमारी LTV
    सीमा 75% है। उदाहरण के लिए, यदि आपके सोने का बाजार मूल्य ₹1,00,000 है, तो आप अधिकतम
    ₹75,000 तक का ऋण प्राप्त कर सकते हैं।


    प्रश्न: क्या LTV सीमा समय के साथ बदल सकती है?

    उत्तर: हाँ, सोने की बाजार कीमतों में उतार-चढ़ाव के कारण LTV प्रभावित हो सकता है।
    अधिक जानकारी के लिए कृपया स्वर्ण ऋण (गोल्ड लोन) — सिंहावलोकन देखें।'
