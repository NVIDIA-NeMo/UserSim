- id: d4f4f52b-82af-5cef-a46f-ab89f669ba3c
  title: दोपहिया वाहन ऋण — खाता अनुबंध
  body: 'यह अनुबंध कलश फिनसर्व और ग्राहक के बीच दोपहिया वाहन ऋण (two_wheeler_loan)
    के नियमों को निर्धारित करता है।


    1. ऋण शर्तें: ग्राहक को 12.9% की वार्षिक ब्याज दर पर ऋण प्रदान किया जाएगा। ऋण
    की अधिकतम अवधि 36 महीने तय की गई है।

    2. वित्तीय दायित्व: ऋण स्वीकृति के समय ग्राहक को वाहन के मूल्य का 15% डाउन पेमेंट
    के रूप में भुगतान करना अनिवार्य है। इसके अतिरिक्त, संचालन लागत को कवर करने के
    लिए ₹1500 का प्रोसेसिंग शुल्क देय होगा।

    3. भुगतान अनुशासन: समय पर EMI का भुगतान करना ग्राहक की जिम्मेदारी है। किस्त के
    भुगतान के लिए खाते में पर्याप्त राशि न होने पर ''EMI Bounce Charge'' लगाया जाएगा।

    4. वसूली प्रक्रिया: हम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं और केवल बिना
    किसी मानसिक या शारीरिक दबाव के ऋण वसूली (Non-coercive Collection) की प्रक्रिया
    अपनाते हैं।

    5. अनुबंध की समाप्ति: ऋण की पूरी राशि, ब्याज और लागू शुल्कों के भुगतान के बाद
    यह अनुबंध समाप्त माना जाएगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
