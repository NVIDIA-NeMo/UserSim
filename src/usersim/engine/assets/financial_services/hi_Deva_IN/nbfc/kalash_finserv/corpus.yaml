- id: 24de62fa-52e6-5397-bf1e-fc1fb8a2f54f
  title: open_account टूल संदर्भ
  body: 'open_account टूल का उपयोग कलश फिनसर्व के भीतर एक नया ग्राहक खाता और संबंधित
    ऋण आवेदन शुरू करने के लिए किया जाता है।


    एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है। यह टूल ग्राहक की व्यक्तिगत
    जानकारी, चयनित उत्पाद आईडी और आवश्यक केवाईसी विवरणों को स्वीकार करता है ताकि ऑनबोर्डिंग
    प्रक्रिया को डिजिटल रूप से पूरा किया जा सके। ग्राहक को किसी बाहरी पोर्टल पर भेजने
    के बजाय, एजेंट बातचीत के दौरान ही इस टूल के माध्यम से खाता खोलता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: kalash_finserv
- id: 952f0067-1b41-5158-83fe-3e50f039d91c
  title: close_account का उपयोग कब करें
  body: 'खाता बंद करने की प्रक्रिया तब अपनाई जाती है जब कोई ग्राहक अपनी ऋण अवधि पूरी
    कर लेता है या ऋण का पूर्ण भुगतान (Foreclosure) कर देता है और अब कलश फिनसर्व के
    साथ कोई सक्रिय संबंध नहीं रखना चाहता।


    एजेंट के लिए निर्धारित चरण:

    1. सबसे पहले get_accounts टूल का उपयोग करके ग्राहक की खाता आईडी (account_id) का
    पता लगाएं।

    2. पुष्टि करें कि संबंधित ऋण का पूरा भुगतान कर दिया गया है और कोई बकाया शुल्क
    या ब्याज शेष नहीं है।

    3. यदि स्वर्ण ऋण (गोल्ड लोन) है, तो सुनिश्चित करें कि संपार्श्विक (सोना) वापस
    करने की प्रक्रिया शुरू हो गई है।

    4. खाते को स्थायी रूप से बंद करने के लिए close_account टूल का उपयोग करें।


    ध्यान दें कि खाता बंद करना एक अपरिवर्तनीय (irreversible) क्रिया है, इसलिए इसे
    निष्पादित करने से पहले ग्राहक की स्पष्ट पुष्टि अनिवार्य है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kalash_finserv
- id: 4522f4e1-7512-582c-820c-49981a49691e
  title: close_account टूल संदर्भ
  body: 'close_account टूल का उपयोग किसी मौजूदा ऋण खाते को स्थायी रूप से बंद करने
    के लिए किया जाता है।


    यह टूल एक ''irreversible'' (अपरिवर्तनीय) क्रिया है। एजेंट को इस टूल को कॉल करने
    के लिए एक वैध account_id की आवश्यकता होती है। जब एजेंट इस टूल का उपयोग करता है,
    तो संबंधित खाता निष्क्रिय हो जाता है और भविष्य के लिए बंद कर दिया जाता है। यह
    प्रक्रिया एजेंट द्वारा सीधे सिस्टम में की जाती है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: kalash_finserv
- id: 18715fe8-43e4-5730-bbc2-c30e64e3f1b7
  title: update_contact_info का उपयोग कब करें
  body: 'ग्राहकों के साथ संचार सुचारू रखने और RBI के दिशा-निर्देशों का पालन करने के
    लिए संपर्क जानकारी को अद्यतित रखना आवश्यक है। इस प्रक्रिया का उपयोग तब करें जब
    ग्राहक अपना मोबाइल नंबर, ईमेल पता या आवासीय पता बदलना चाहता हो।


    एजेंट के लिए निर्धारित चरण:

    1. verify_identity टूल के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. get_accounts का उपयोग करके सही खाता आईडी की पहचान करें।

    3. ग्राहक से नई संपर्क जानकारी प्राप्त करें और उसे सत्यापित करें।

    4. सिस्टम में रिकॉर्ड अपडेट करने के लिए update_contact_info टूल का उपयोग करें।


    सटीक संपर्क विवरण यह सुनिश्चित करते हैं कि ग्राहकों को उनके EMI भुगतान और महत्वपूर्ण
    सूचनाएं समय पर प्राप्त हों, जिससे वे EMI Bounce Charge से बच सकें।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kalash_finserv
- id: 708acaf4-47cf-5544-bd41-56174e854dc6
  title: update_contact_info टूल संदर्भ
  body: 'update_contact_info टूल का उपयोग ग्राहक के पंजीकृत संपर्क विवरणों (जैसे फोन
    नंबर, ईमेल या पता) को बदलने के लिए किया जाता है।


    एजेंट इस टूल को सीधे कॉल करके जानकारी अपडेट करता है। इसके लिए एक वैध account_id
    और उन विशिष्ट क्षेत्रों (fields) की आवश्यकता होती है जिन्हें अपडेट किया जाना है।
    यह सुनिश्चित करता है कि संस्था के पास ग्राहक का सबसे नवीनतम डेटा उपलब्ध रहे।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: kalash_finserv
- id: 2e52013f-3c9d-5a69-bb5d-df42f96e5a55
  title: get_statements का उपयोग कब करें
  body: 'खाता विवरण (Statements) ग्राहकों को उनके ऋण भुगतान के इतिहास, शेष राशि और
    लगाए गए शुल्कों की पारदर्शिता प्रदान करने के लिए दिए जाते हैं। इसका उपयोग तब करें
    जब ग्राहक अपने पिछले भुगतानों की जांच करना चाहता हो या कर उद्देश्यों के लिए दस्तावेज़
    मांगता हो।


    एजेंट के लिए निर्धारित चरण:

    1. ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके संबंधित खाता आईडी प्राप्त करें।

    3. ग्राहक से वांछित समयावधि (तारीख से तारीख तक) पूछें।

    4. विवरण जेनरेट करने और ग्राहक को उपलब्ध कराने के लिए get_statements टूल का उपयोग
    करें।


    हमारा उद्देश्य पारदर्शिता बनाए रखना है ताकि ग्राहक को उनके ऋण की कुल वार्षिक लागत
    और शुल्कों का स्पष्ट पता रहे।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: kalash_finserv
- id: 247ba1f3-75ca-5438-abde-956d7ed5359e
  title: get_statements टूल संदर्भ
  body: 'get_statements टूल का उपयोग किसी विशिष्ट ऋण खाते के लिए वित्तीय विवरण या
    ट्रांजेक्शन हिस्ट्री निकालने के लिए किया जाता है।


    एजेंट इस टूल को कॉल करता है जिसमें account_id और समय सीमा (start_date और end_date)
    पैरामीटर के रूप में दिए जाते हैं। यह टूल सिस्टम से विवरण प्राप्त कर एजेंट को प्रदान
    करता है, जिसे वह ग्राहक के साथ साझा कर सकता है।'
  domain: lending_mortgage
