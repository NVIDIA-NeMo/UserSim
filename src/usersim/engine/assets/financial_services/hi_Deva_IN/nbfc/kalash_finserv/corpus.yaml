- id: b9e59e73-e7a4-5538-a532-6507b136633c
  title: EMI भुगतान मैंडेट — पात्रता श्रेणियाँ
  body: 'यह मैट्रिक्स एजेंटों को यह निर्धारित करने में मदद करता है कि कौन सा ग्राहक
    ''EMI भुगतान मैंडेट'' के लिए पात्र है:


    - सक्रिय ऋण खाता (जैसे Personal Loan, Gold Loan) -> पात्र (सहमति अनिवार्य)

    - वैध भारतीय बैंक खाता (बचत या चालू) -> पात्र (KYC अनिवार्य)

    - अधूरे KYC दस्तावेज़ -> अपात्र (पहले KYC पूरा करना होगा)

    - बंद या निष्क्रिय ऋण खाता -> अपात्र


    सभी पात्र ग्राहकों को ₹500 के बाउंस शुल्क से बचने के लिए इस स्वचालित व्यवस्था
    को अपनाने की सलाह दी जाती है।'
