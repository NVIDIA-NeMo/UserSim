  institution_id: kalash_finserv
- id: eed524da-d40a-5cd7-8131-5fa47fd2a188
  title: EMI भुगतान मैंडेट — नियामक प्रकटीकरण
  body: 'कलश फिनसर्व RBI के डिजिटल लेंडिंग दिशा-निर्देशों और फेयर प्रैक्टिस कोड का
    कड़ाई से पालन करता है। EMI भुगतान मैंडेट के संबंध में निम्नलिखित प्रकटीकरण अनिवार्य
    हैं:


    1. ग्राहक को भुगतान कटने से 24 घंटे पहले एक सूचना दी जाएगी, जो पारदर्शिता सुनिश्चित
    करती है।

    2. किसी भी भुगतान विफलता की स्थिति में, ₹500 का EMI बाउंस शुल्क लिया जाएगा। यह
    शुल्क परिचालन लागत और ऋण अनुशासन बनाए रखने के लिए है।

    3. मैंडेट में किसी भी संशोधन या अद्यतन के लिए 3 दिनों की प्रोसेसिंग अवधि लागू
    होगी।

    4. हम ग्राहकों के डेटा की गोपनीयता का सम्मान करते हैं और केवल ऋण वसूली के उद्देश्यों
    के लिए ही बैंक विवरण का उपयोग करते हैं।


    हम स्पष्ट करते हैं कि कलश फिनसर्व एक NBFC है और हम कोई जमा राशि (deposits) स्वीकार
    नहीं करते हैं। सभी वसूली प्रक्रियाएं बिना किसी मानसिक या शारीरिक दबाव के (Non-coercive
    Collection) संपन्न की जाती हैं।'
