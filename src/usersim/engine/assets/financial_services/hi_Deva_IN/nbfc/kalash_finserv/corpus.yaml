- id: 14141874-ba06-528e-a998-229d16de24c5
  title: स्वर्ण ऋण (गोल्ड लोन) — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'स्वर्ण ऋण (गोल्ड लोन) प्राप्त करने की संपूर्ण प्रक्रिया इस प्रकार है:


    1. अपने सोने के गहनों और पहचान प्रमाण (KYC) के साथ हमारी निकटतम शाखा में आएं।

    2. हमारे विशेषज्ञ आपके सोने का मूल्यांकन करेंगे। ध्यान रखें कि हम अधिकतम 75% के
    LTV (ऋण-मूल्य अनुपात) तक ऋण प्रदान करते हैं।

    3. आप अपनी आवश्यक ऋण राशि बताएं (जो न्यूनतम ₹25000 होनी चाहिए)।

    4. हम आपको 11.5% की वार्षिक ब्याज दर और ₹500 के प्रोसेसिंग शुल्क के बारे में सूचित
    करेंगे।

    5. एक बार जब आप ''Key Fact Statement'' (KFS) पर हस्ताक्षर कर देते हैं, तो ऋण राशि
    आपके खाते में जमा कर दी जाएगी।

    6. अब आप 12 महीने की अवधि के भीतर अपने ऋण का पुनर्भुगतान कर सकते हैं।


    प्रक्रिया पूरी होने पर आपको एक ऋण स्वीकृति पत्र और आपके सोने की सुरक्षित जमा रसीद
    प्राप्त होगी।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
