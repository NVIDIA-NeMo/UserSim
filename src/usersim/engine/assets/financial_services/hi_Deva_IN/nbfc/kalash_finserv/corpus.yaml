- id: 3c2c1ea3-0840-5de0-b518-1b9d9b410211
  title: EMI भुगतान मैंडेट — लागत और शुल्क
  body: 'प्रश्न: EMI भुगतान मैंडेट के लिए क्या कोई शुल्क है?

    उत्तर: मैंडेट सेटअप करने के लिए कोई शुल्क नहीं है, लेकिन यदि आपकी किस्त आपके खाते
    में पर्याप्त राशि न होने के कारण बाउंस हो जाती है, तो ₹500 का EMI बाउंस शुल्क
    लिया जाएगा।


    प्रश्न: क्या मैं बाउंस शुल्क को माफ करवा सकता हूँ?

    उत्तर: शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन के अधीन है, क्योंकि हम ऋण अनुशासन
    को प्राथमिकता देते हैं। अधिक जानकारी के लिए ''EMI भुगतान मैंडेट — शुल्क अनुसूची''
    देखें।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
