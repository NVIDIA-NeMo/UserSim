- id: f901c253-87f1-5352-b2a8-4955c0ca3a34
  title: स्वर्ण ऋण (गोल्ड लोन) — अनपेक्षित शुल्क या राशि
  body: 'यदि आप अपने खाते में कोई ऐसा शुल्क देखते हैं जिसकी आप उम्मीद नहीं कर रहे
    थे, तो निम्नलिखित चरणों का पालन करें:


    लक्षण: आपके स्टेटमेंट में ₹500 से अधिक का प्रोसेसिंग शुल्क या कोई अतिरिक्त दंड
    शुल्क दिखना।


    जांच के चरण:

    1. प्रोसेसिंग शुल्क की पुष्टि करें: जांचें कि क्या यह ₹500 का मानक प्रोसेसिंग
    शुल्क है जो ऋण की शुरुआत में लिया जाता है।

    2. EMI बाउंस चेक करें: यदि आपने समय पर किस्त नहीं चुकाई है, तो यह ''EMI Bounce
    Charge'' हो सकता है।

    3. ब्याज गणना: सुनिश्चित करें कि ब्याज 11.5% की वार्षिक दर से ही लगाया गया है।


    समाधान:

    यदि शुल्क अभी भी गलत लगता है, तो हमें विवरण प्रदान करें। हम इसका आंतरिक ऑडिट करेंगे।
    यदि शुल्क गलती से लगाया गया है, तो हम उसे वापस (reverse) कर देंगे। यदि यह नियमों
    के अनुसार है, तो हम आपको इसका कारण स्पष्ट करेंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
