- id: 77a19c90-c9a6-5f3e-9776-22f6bb4c594b
  title: दोपहिया वाहन ऋण — नियामक प्रकटीकरण
  body: 'कलश फिनसर्व RBI के डिजिटल लेंडिंग दिशा-निर्देशों और फेयर प्रैक्टिस कोड का
    कड़ाई से पालन करता है। हम सुनिश्चित करते हैं कि ऋण वसूली की प्रक्रिया ''Non-coercive
    Collection'' (बिना किसी मानसिक या शारीरिक दबाव के) के सिद्धांतों पर आधारित हो।


    नियामक विवरण:

    - ब्याज दर: इस उत्पाद पर 12.9% की वार्षिक ब्याज दर लागू है।

    - शुल्क: ₹1500 का प्रोसेसिंग शुल्क लिया जाता है।

    - पारदर्शिता: प्रत्येक ग्राहक को एक Key Fact Statement (KFS) प्रदान किया जाएगा,
    जिसमें ऋण की कुल वार्षिक लागत का स्पष्ट विवरण होगा।

    - डेटा गोपनीयता: हम ग्राहकों के डेटा की गोपनीयता का पूर्ण सम्मान करते हैं।


    हम स्पष्ट करते हैं कि कलश फिनसर्व एक NBFC है और हम कोई जमा राशि (deposits) स्वीकार
    नहीं करते हैं। किसी भी विवाद की स्थिति में, हम RBI के टर्न-अराउंड-टाइम (TAT) ढांचे
    के अनुसार त्वरित समाधान के लिए प्रतिबद्ध हैं।'
