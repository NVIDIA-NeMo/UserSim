- id: 3000eba7-d968-5bd3-8814-6fc5b03b13d0
  title: EMI भुगतान मैंडेट — मैंडेट संशोधन प्रोसेसिंग अवधि (दिन) की व्याख्या
  body: 'प्रश्न: यदि मैं अपने ''EMI भुगतान मैंडेट'' में बदलाव करना चाहता हूँ, तो इसमें
    कितना समय लगेगा?


    उत्तर: आपके मैंडेट विवरण में किसी भी बदलाव या अद्यतन को प्रोसेस करने के लिए 3
    दिन की अवधि लगती है। इस समय का उपयोग बैंक के साथ समन्वय और विवरणों के सत्यापन
    के लिए किया जाता है।


    प्रश्न: क्या मैं इस अवधि के दौरान अपनी किस्त बदल सकता हूँ?


    उत्तर: मैंडेट संशोधन केवल भुगतान के स्रोत (बैंक खाते) या व्यवस्था से संबंधित है।
    किस्त की राशि ऋण अनुबंध पर निर्भर करती है। अधिक जानकारी के लिए ''EMI भुगतान मैंडेट
    — सिंहावलोकन'' देखें।'
