- id: a2b081c9-2dbe-5d64-b1e6-2b3d7a5d1f4d
  title: व्यक्तिगत ऋण (पर्सनल लोन) — शुरुआत कैसे करें
  body: "व्यक्तिगत ऋण (पर्सनल लोन) प्राप्त करने की प्रक्रिया सरल और पारदर्शी है। एजेंट\
    \ के रूप में, कृपया ग्राहक को निम्नलिखित चरणों और विवरणों के बारे में सूचित करें:\n\
    \n1. आवेदन प्रक्रिया: ग्राहक को अपनी आय का प्रमाण और KYC दस्तावेज़ प्रदान करने\
    \ होंगे।\n2. मुख्य वित्तीय शर्तें:\n   - वार्षिक ब्याज दर: 14.5%\n   - प्रोसेसिंग\
    \ शुल्क: ऋण राशि का 2%\n   - अधिकतम अवधि: 60 महीने\n3. पारदर्शिता: ऋण स्वीकृति\
    \ से पहले ग्राहक को 'Key Fact Statement (KFS)' प्रदान करना अनिवार्य है, जिसमें\
    \ ब्याज और सभी शुल्कों का स्पष्ट विवरण होता है।\n4. वितरण: सत्यापन के बाद, ऋण\
    \ राशि सीधे ग्राहक के बैंक खाते में जमा की जाती है।\n\nग्राहक को यह भी बताएं कि\
    \ समय पर भुगतान न करने पर ₹500 का EMI बाउंस शुल्क लागू होगा।\n\nडिस्क्लेमर: कलश\
    \ फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।"
