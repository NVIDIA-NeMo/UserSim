- id: 89764513-bffd-58ba-bd50-f621750850e8
  title: स्वर्ण ऋण (गोल्ड लोन) — पात्रता श्रेणियाँ
  body: 'स्वर्ण ऋण (गोल्ड लोन) के लिए पात्रता मानदंड निम्नलिखित हैं:


    - शुद्ध सोना (Collateral): अनिवार्य (मूल्यांकन के बाद)।

    - न्यूनतम ऋण राशि: ₹25,000 या उससे अधिक।

    - LTV सीमा: सोने के बाजार मूल्य का अधिकतम 75%।

    - आयु: 18 वर्ष या उससे अधिक।

    - KYC दस्तावेज़: वैध पहचान और पते का प्रमाण अनिवार्य।


    परिणाम: यदि ऊपर दी गई सभी शर्तें पूरी होती हैं, तो ग्राहक त्वरित स्वीकृति और 11.5%
    वार्षिक ब्याज दर के साथ ऋण के लिए पात्र है।


