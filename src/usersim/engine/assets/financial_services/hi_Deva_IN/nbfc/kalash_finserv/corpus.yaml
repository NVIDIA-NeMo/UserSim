    EMI का उपयोग करते समय, कुछ जालसाज़ आपको ''लोन अप्रूवल'' या ''कैशबैक'' का लालच
    देकर आपके व्यक्तिगत विवरण चुराने की कोशिश कर सकते हैं।


    कृपया ध्यान दें कि कलश फिनसर्व आपसे कभी भी आपका UPI PIN, OTP या CVV साझा करने
    के लिए नहीं कहेगा। यदि आपको कोई ऐसा संदेश मिलता है जिसमें आपसे इन विवरणों की मांग
    की गई हो, तो उसे तुरंत अनदेखा करें। किसी भी संदिग्ध गतिविधि या अनधिकृत लेन-देन
    की सूचना हमें तुरंत दें ताकि हम चार्जबैक प्रक्रिया और त्वरित समाधान शुरू कर सकें।


    हमारा सुझाव है कि आप केवल आधिकारिक माध्यमों से ही अपनी ऋण स्थिति की जाँच करें।
    किसी भी वित्तीय लेन-देन से पहले सख्त KYC और बहु-स्तरीय प्रमाणीकरण अनिवार्य है।
    सतर्क रहें और अपनी गोपनीय जानकारी सुरक्षित रखें।


