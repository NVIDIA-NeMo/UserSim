  title: स्वर्ण ऋण (गोल्ड लोन) — जोखिम प्रकटीकरण
  body: 'स्वर्ण ऋण (गोल्ड लोन) लेने से पहले कृपया निम्नलिखित जोखिमों को ध्यान से पढ़ें:


    1. संपार्श्विक का जोखिम: यह एक सुरक्षित ऋण है। यदि आप ₹25,000 की न्यूनतम राशि
    या उससे अधिक के ऋण का भुगतान करने में विफल रहते हैं, तो कलश फिनसर्व के पास आपके
    द्वारा गिरवी रखे गए सोने को बेचकर बकाया राशि वसूलने का अधिकार है।

    2. LTV और बाजार मूल्य: ऋण की राशि सोने के बाजार मूल्य के 75% (LTV) तक सीमित है।
    यदि सोने की वैश्विक कीमतों में भारी गिरावट आती है, तो आपके ऋण का मूल्य संपार्श्विक
    के मूल्य से अधिक हो सकता है।

    3. ब्याज लागत: 11.5% की वार्षिक ब्याज दर लागू होती है। समय पर भुगतान न करने पर
    दंड शुल्क लग सकता है जो आपकी कुल लागत को बढ़ा देगा।

    4. अवधि सीमा: ऋण की अधिकतम अवधि 12 महीने है, जिसके भीतर पूर्ण निपटान आवश्यक है।


    हम RBI के डिजिटल लेंडिंग दिशा-निर्देशों का पालन करते हैं और हर ऋण के लिए ''Key
    Fact Statement'' प्रदान करते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
