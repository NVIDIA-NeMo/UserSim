- id: 567fbb54-226f-5217-81e1-27911cc73783
  title: स्वर्ण ऋण (गोल्ड लोन) — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपना स्वर्ण ऋण (गोल्ड लोन) बंद करना चाहते हैं या उसे रद्द करना चाहते
    हैं, तो कृपया इन चरणों का पालन करें:


    1. शेष राशि का विवरण मांगें: हमसे अपने ऋण की वर्तमान कुल बकाया राशि (मूलधन + 11.5%
    वार्षिक ब्याज) और किसी भी लंबित शुल्क का विवरण मांगें।

    2. पूर्ण भुगतान करें: कुल देय राशि का भुगतान करें। यदि आपने ऋण अवधि (12 महीने)
    से पहले भुगतान किया है, तो हम इसे फोरक्लोज़र के रूप में संसाधित करेंगे।

    3. सत्यापन और रसीद: भुगतान सफल होने के बाद, हमसे भुगतान की पुष्टि और ''नो ड्यूज
    सर्टिफिकेट'' (NOC) प्राप्त करें।

    4. संपार्श्विक की वापसी: अपनी मूल रसीद प्रस्तुत करें और हमारे अधिकृत प्रतिनिधि
    की उपस्थिति में अपना सोना वापस प्राप्त करें।


    यदि आप ऋण राशि को कम (डाउनग्रेड) करना चाहते हैं, तो आप आंशिक भुगतान कर सकते हैं
    और शेष राशि के लिए नए विवरण मांग सकते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
