- id: d134be14-deb9-5282-b777-a5434cfb34c6
  title: update_beneficiary का उपयोग कब करें
  body: 'ऋण खातों में लाभार्थी (beneficiary) या नामांकित व्यक्ति का विवरण अपडेट करना
    एक महत्वपूर्ण सुरक्षा प्रक्रिया है। इसका उपयोग तब करें जब ग्राहक अपने नामांकित
    व्यक्ति को बदलना चाहता हो या पहली बार विवरण जोड़ना चाहता हो।


    एजेंट के लिए निर्धारित चरण:

    1. सुरक्षा प्रोटोकॉल के तहत बहु-स्तरीय प्रमाणीकरण और verify_identity टूल का उपयोग
    करके ग्राहक की पुष्टि करें।

    2. get_accounts के माध्यम से खाता विवरण की जांच करें।

    3. नए लाभार्थी का नाम, संबंध और पहचान विवरण प्राप्त करें।

    4. सिस्टम में लाभार्थी अपडेट करने के लिए update_beneficiary टूल का उपयोग करें।


    यह प्रक्रिया यह सुनिश्चित करती है कि किसी भी अप्रत्याशित स्थिति में ऋण खाते का
    निपटान सही व्यक्ति के साथ किया जा सके।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: kalash_finserv
- id: c87fe63a-11ae-5241-b323-cb1e75ce8999
  title: update_beneficiary टूल संदर्भ
  body: 'update_beneficiary टूल का उपयोग ऋण खाते से जुड़े नामांकित व्यक्ति या लाभार्थी
    की जानकारी को बदलने या जोड़ने के लिए किया जाता है।


    एजेंट इस टूल को सीधे कॉल करता है, जिसके लिए account_id और नए लाभार्थी की विस्तृत
    जानकारी अनिवार्य होती है। यह एक संवेदनशील सुरक्षा अपडेट है, इसलिए इसे केवल पूर्ण
    सत्यापन के बाद ही निष्पादित किया जाता है।'
