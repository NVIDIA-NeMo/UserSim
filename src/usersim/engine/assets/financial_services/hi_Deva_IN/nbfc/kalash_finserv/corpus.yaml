- id: 87403a00-bec8-598b-9bd6-65e05cdbcdc6
  title: दोपहिया वाहन ऋण — शर्तों में बदलाव की नीति
  body: 'कलश फिनसर्व और ग्राहक के बीच ''दोपहिया वाहन ऋण'' के अनुबंध की शर्तें निम्नलिखित
    नीति के अधीन हैं:


    1. दरों में संशोधन: वार्षिक ब्याज दर 12.9% है। बाजार की स्थितियों या नियामक बदलावों
    के आधार पर, हम इस दर में संशोधन कर सकते हैं, जिसकी सूचना ग्राहक को लिखित रूप में
    दी जाएगी।

    2. शुल्क संरचना: ऋण की प्रोसेसिंग फीस ₹1500 है, जो संचालन लागत को कवर करने के
    लिए ली जाती है। यह शुल्क गैर-वापसी योग्य है, जब तक कि विशेष प्रबंधकीय अनुमोदन
    न हो।

    3. भुगतान दायित्व: ग्राहक 36 महीने की निर्धारित अवधि के भीतर सभी किस्तों का भुगतान
    करने के लिए बाध्य है। किस्तों के भुगतान में विफलता पर ''EMI Bounce Charge'' लागू
    होगा।

    4. डाउन पेमेंट: ग्राहक को वाहन मूल्य का न्यूनतम 15% डाउन पेमेंट के रूप में देना
    अनिवार्य है।

    5. अनुबंध की समाप्ति: ऋण का पूर्ण भुगतान करने पर या ऋण राशि की वसूली के बाद यह
    अनुबंध समाप्त माना जाएगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
