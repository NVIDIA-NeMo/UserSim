- id: fcbe5702-13a6-5888-99f9-09fe5cf519f3
  title: EMI भुगतान मैंडेट — शुल्क अनुसूची
  body: 'EMI भुगतान मैंडेट के अंतर्गत लागू होने वाले शुल्क निम्नलिखित हैं:


    - EMI बाउंस शुल्क: ₹500 (यह शुल्क तब लगाया जाता है जब किस्त की तारीख पर खाते में
    पर्याप्त राशि न होने के कारण भुगतान विफल हो जाता है)।


    कृपया ध्यान दें कि हम ऋण अनुशासन बनाए रखने के लिए केवल विशेष प्रबंधकीय अनुमोदन
    के अधीन ही शुल्कों को माफ करते हैं।'
