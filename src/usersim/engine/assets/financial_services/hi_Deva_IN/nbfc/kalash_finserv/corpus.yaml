  mentions_tools: []
  institution_id: kalash_finserv
- id: ac846ad0-b8a6-566b-b787-4e9835a92f3e
  title: दोपहिया वाहन ऋण — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने दोपहिया वाहन ऋण (two_wheeler_loan) खाते में कोई ऐसा शुल्क दिखता
    है जिसकी आप अपेक्षा नहीं कर रहे थे, तो कृपया यह जांचें:


    - क्या यह ₹1500 का प्रोसेसिंग शुल्क है? यह ऋण की शुरुआत में संचालन लागत के लिए
    लिया जाता है।

    - क्या यह ''EMI Bounce Charge'' है? यदि आपके खाते में किस्त की तारीख पर पर्याप्त
    राशि नहीं थी, तो यह दंड शुल्क लगाया जाता है।

    - क्या ब्याज दर 12.9% के अनुसार सही ढंग से गणना की गई है?


    यदि शुल्क अभी भी अस्पष्ट है, तो हमें सूचित करें। हम आपके ऋण विवरण की समीक्षा करेंगे
    और यदि कोई त्रुटि पाई जाती है, तो उसे तुरंत ठीक करेंगे। यदि समस्या जटिल है, तो
    हम इसे अपने आंतरिक एस्केलेशन मैट्रिक्स के माध्यम से विशेषज्ञ टीम को भेजेंगे और
    RBI के टर्न-अराउंड-टाइम (TAT) ढांचे के भीतर आपको समाधान प्रदान करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
