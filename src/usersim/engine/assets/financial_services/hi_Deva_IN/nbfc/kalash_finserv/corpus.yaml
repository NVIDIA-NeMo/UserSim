  title: व्यक्तिगत ऋण (पर्सनल लोन) — वर्तमान ऑफर
  body: 'विशेष ऑफर: हमारे मौजूदा ग्राहकों के लिए! यदि आप 1 अक्टूबर 2023 से 31 दिसंबर
    2023 के बीच नए व्यक्तिगत ऋण (पर्सनल लोन) के लिए आवेदन करते हैं, तो आप हमारी त्वरित
    स्वीकृति प्रक्रिया का लाभ उठा सकते हैं।


    इस अवधि के दौरान आवेदन करने पर आपको 14.5% की मानक वार्षिक ब्याज दर और 60 माह तक
    की लचीली अवधि का लाभ मिलेगा। कृपया ध्यान दें कि प्रोसेसिंग शुल्क 2% और EMI बाउंस
    शुल्क ₹500 यथावत रहेंगे।


    आज ही अपनी वित्तीय जरूरतों को पूरा करने के लिए हमसे संपर्क करें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
