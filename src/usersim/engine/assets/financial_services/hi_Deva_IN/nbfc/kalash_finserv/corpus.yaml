- id: 06527151-95d7-5cdd-b43c-72227d29461d
  title: EMI भुगतान मैंडेट — गोपनीयता और डेटा प्रबंधन
  body: 'कलश फिनसर्व आपके वित्तीय डेटा की गोपनीयता का पूर्ण सम्मान करता है। ''EMI
    भुगतान मैंडेट'' के अंतर्गत डेटा प्रबंधन के नियम निम्नलिखित हैं:


    1. डेटा संग्रह: हम केवल वही जानकारी एकत्र करते हैं जो मैंडेट सेटअप और RBI के KYC
    मानदंडों के लिए आवश्यक है, जैसे बैंक खाता विवरण और पहचान प्रमाण।

    2. डेटा उपयोग: आपके विवरणों का उपयोग केवल आपकी किस्तों के स्वचालित डेबिट और विनियामक
    रिपोर्टिंग के लिए किया जाता है।

    3. सुरक्षा उपाय: सभी संवेदनशील डेटा को एन्क्रिप्ट किया जाता है और केवल अधिकृत
    कर्मियों द्वारा ही एक्सेस किया जा सकता है।

    4. साझाकरण: हम आपका डेटा किसी तीसरे पक्ष को नहीं बेचते हैं। जानकारी केवल कानूनी
    आवश्यकताओं या RBI के दिशा-निर्देशों के तहत साझा की जा सकती है।

    5. अधिकार: आप किसी भी समय अपने डेटा की स्थिति जानने या मैंडेट को रद्द करने का
    अनुरोध कर सकते हैं (जिसके लिए 3 दिन की प्रोसेसिंग अवधि होगी)।


    हम पारदर्शी संचालन और डेटा गोपनीयता के उच्चतम मानकों के प्रति प्रतिबद्ध हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
