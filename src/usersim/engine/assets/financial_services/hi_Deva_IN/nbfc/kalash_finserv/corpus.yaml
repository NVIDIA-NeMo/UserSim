- id: 096682f7-a904-56f7-8be8-c58b3bb1b2bf
  title: दोपहिया वाहन ऋण — पात्रता श्रेणियाँ
  body: 'एक सहायता एजेंट के लिए पात्रता गाइड:


    | ग्राहक श्रेणी | अनिवार्य शर्त | परिणाम |

    | :--- | :--- | :--- |

    | नियमित वेतनभोगी | न्यूनतम आय प्रमाण + केवाईसी | ऋण स्वीकृत (12.9% ब्याज) |

    | स्वरोजगार/छोटे व्यापारी | व्यापार प्रमाण + केवाईसी | ऋण स्वीकृत (12.9% ब्याज)
    |

    | निम्न आय समूह | आय का वैकल्पिक प्रमाण + केवाईसी | समीक्षा के बाद स्वीकृति |

    | सभी श्रेणियाँ | 15% डाउन पेमेंट जमा करना | ऋण वितरण के लिए अनिवार्य |


    सभी स्वीकृत ऋणों के लिए 36 महीने की अवधि और ₹1500 प्रोसेसिंग शुल्क लागू होगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: eligibility_matrix
