- id: a7f03ed9-b295-53a9-bc06-b84f2546d5a9
  title: दोपहिया वाहन ऋण — शुरुआत कैसे करें
  body: 'एक सहायता एजेंट के रूप में, ग्राहक को ''दोपहिया वाहन ऋण'' की प्रक्रिया समझाने
    के लिए निम्नलिखित विवरणों का उपयोग करें। यह उत्पाद मध्यम और निम्न आय वाले परिवारों
    को किफायती किस्तों में दोपहिया वाहन दिलाने के लिए डिज़ाइन किया गया है।


    उत्पाद के मुख्य वित्तीय विवरण:

    - वार्षिक ब्याज दर: 12.9%

    - ऋण अवधि (Tenure): 36 महीने

    - न्यूनतम डाउन पेमेंट: वाहन मूल्य का 15%

    - प्रोसेसिंग शुल्क: ₹1500


    प्रक्रिया के चरण:

    1. ग्राहक की पात्रता की जांच करें और उन्हें आवश्यक दस्तावेज़ प्रदान करने को कहें।

    2. ग्राहक को ''Key Fact Statement (KFS)'' प्रदान करें ताकि उन्हें कुल वार्षिक
    लागत, ब्याज और ₹1500 के प्रोसेसिंग शुल्क की स्पष्ट जानकारी हो।

    3. डाउन पेमेंट के 15% भुगतान की पुष्टि करें।

    4. ऋण स्वीकृति के बाद, पुनर्भुगतान के लिए ''EMI भुगतान मैंडेट'' सेटअप करने में
    उनकी सहायता करें ताकि वे बाउंस शुल्क से बच सकें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
