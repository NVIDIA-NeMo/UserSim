- id: 4493c4a6-1ff7-565c-81f1-de87109ac76b
  title: EMI भुगतान मैंडेट — बदलाव या अद्यतन करना
  body: 'यदि आप अपने मौजूदा ''EMI भुगतान मैंडेट'' से जुड़े बैंक खाते या विवरणों को
    बदलना चाहते हैं, तो इन चरणों का पालन करें:


    1. विवरण प्रदान करें: हमें वह नया बैंक खाता विवरण प्रदान करें जिससे आप अपनी EMI
    का भुगतान करना चाहते हैं।

    2. सत्यापन: हम आपसे नए खाते की पुष्टि के लिए आवश्यक दस्तावेज़ और KYC सत्यापन मांगेंगे।

    3. सहमति: आपको नए मैंडेट के लिए एक डिजिटल या भौतिक सहमति पत्र पर हस्ताक्षर करने
    होंगे।

    4. पुष्टि: हमारे द्वारा विवरण सत्यापित करने के बाद, आपको एक पुष्टिकरण संदेश प्राप्त
    होगा।


    महत्वपूर्ण जानकारी:

    - इस पूरी प्रक्रिया और अद्यतन को लागू करने में 3 दिन की प्रोसेसिंग अवधि लगेगी।

    - यह सुनिश्चित करें कि बदलाव आपकी अगली किस्त की तारीख से पर्याप्त समय पहले किया
    जाए ताकि ₹500 के बाउंस शुल्क से बचा जा सके।


    एक बार जब 3 दिन की अवधि पूरी हो जाती है, तो आपका नया मैंडेट सक्रिय हो जाएगा और
    अगली किस्त नए खाते से डेबिट होगी।'
