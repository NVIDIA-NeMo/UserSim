- id: a5d82e11-dd90-54ca-a79d-31d22a8918eb
  title: दोपहिया वाहन ऋण — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपने दोपहिया वाहन ऋण (two_wheeler_loan) को समय से पहले बंद करना चाहते
    हैं या रद्द करना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें ऋण बंद करने के अपने अनुरोध के बारे में बताएं और अपना ऋण खाता नंबर प्रदान
    करें।

    2. हम आपके खाते का वर्तमान विवरण निकालेंगे, जिसमें शेष मूलधन, 12.9% की दर से गणना
    किया गया बकाया ब्याज और कोई भी लंबित शुल्क शामिल होगा।

    3. हम आपको कुल देय राशि (Foreclosure Amount) का विवरण प्रदान करेंगे।

    4. आप इस कुल राशि का भुगतान करें।

    5. भुगतान की पुष्टि के बाद, हम ऋण खाते को बंद कर देंगे और वाहन पर मौजूद हाइपोथेकेशन
    (Hypothecation) हटाने के लिए आवश्यक अनापत्ति प्रमाण पत्र (NOC) जारी करेंगे।


    यदि आप ऋण की शर्तों में बदलाव या डाउनग्रेड करना चाहते हैं, तो कृपया हमसे चर्चा
    करें; हालांकि, यह विशेष प्रबंधकीय अनुमोदन के अधीन होता है ताकि ऋण अनुशासन बना
    रहे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
