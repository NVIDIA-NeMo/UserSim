- id: c3cea5a2-512b-502c-b2b2-f66334b05cf4
  title: EMI भुगतान मैंडेट — डेबिट से पहले सूचना की अवधि (घंटे) की व्याख्या
  body: 'प्रश्न: क्या मुझे पता चलेगा कि मेरे खाते से EMI कब कटने वाली है?

    उत्तर: हाँ, कलश फिनसर्व अपने ग्राहकों की सुविधा के लिए एक प्री-डेबिट अधिसूचना
    प्रणाली का उपयोग करता है। आपके बैंक खाते से किस्त की राशि डेबिट होने से ठीक 24
    घंटे पहले आपको सूचित किया जाएगा, ताकि आप पर्याप्त राशि सुनिश्चित कर सकें और किसी
    भी बाउंस शुल्क से बच सकें।


    प्रश्न: यदि मैं सूचना मिलने के बाद राशि जमा नहीं कर पाता हूँ तो क्या होगा?

    उत्तर: यदि डेबिट के समय खाते में पर्याप्त फंड नहीं होते हैं, तो ₹500 का EMI बाउंस
    शुल्क लागू होगा। अधिक जानकारी के लिए ''EMI भुगतान मैंडेट — शुल्क अनुसूची'' देखें।'
