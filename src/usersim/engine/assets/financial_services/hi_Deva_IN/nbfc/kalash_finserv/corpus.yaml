- id: d85ef26c-a90c-5d7d-ad46-37aa0a554ee3
  title: open_account का उपयोग कब करें
  body: 'कलश फिनसर्व में नए ग्राहकों को उनके वित्तीय लक्ष्यों के आधार पर ऋण सुविधा
    प्रदान करने के लिए खाता खोलने की प्रक्रिया अपनाई जाती है। इस प्रक्रिया का उपयोग
    तब करें जब कोई नया ग्राहक हमारे उत्पादों जैसे व्यक्तिगत ऋण (पर्सनल लोन), स्वर्ण
    ऋण (गोल्ड लोन), या दोपहिया वाहन ऋण के लिए आवेदन करना चाहता हो।


    एजेंट के लिए निर्धारित चरण:

    1. ग्राहक की पहचान और पात्रता की पुष्टि करने के लिए आवश्यक KYC दस्तावेज़ प्राप्त
    करें।

    2. ग्राहक की विशिष्ट आवश्यकता के अनुसार उपयुक्त उत्पाद का चयन करें।

    3. ग्राहक की सहमति और सभी अनिवार्य प्रकटीकरणों (जैसे Key Fact Statement) की पुष्टि
    करें।

    4. सिस्टम में नए खाते के निर्माण और ऋण आवेदन को प्रोसेस करने के लिए open_account
    टूल का उपयोग करें।


    यह सुनिश्चित करें कि खाता खोलने से पहले ग्राहक को यह स्पष्ट कर दिया गया है कि
    हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
