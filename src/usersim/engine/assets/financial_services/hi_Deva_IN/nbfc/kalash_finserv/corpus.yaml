- id: 65c4c678-8bb9-5eb3-beb3-4f3f20fda4bd
  title: स्वर्ण ऋण (गोल्ड लोन) — आवश्यक दस्तावेज़
  body: 'स्वर्ण ऋण (गोल्ड लोन) के लिए आवश्यक दस्तावेज़ों का विवरण नीचे दिया गया है:


    - पहचान प्रमाण (ID Proof): आधार कार्ड, पैन कार्ड या वोटर आईडी (अनिवार्य) -> केवाईसी
    सत्यापन के लिए।

    - पता प्रमाण (Address Proof): बिजली बिल, राशन कार्ड या आधार कार्ड (अनिवार्य) ->
    पते की पुष्टि के लिए।

    - संपार्श्विक: भौतिक सोना (अनिवार्य) -> मूल्यांकन और LTV 75% की गणना के लिए।

    - न्यूनतम ऋण राशि: ₹25,000 या उससे अधिक का ऋण अनुरोध।


    इन दस्तावेज़ों के पूर्ण होने पर ही ऋण प्रक्रिया शुरू की जा सकती है।


