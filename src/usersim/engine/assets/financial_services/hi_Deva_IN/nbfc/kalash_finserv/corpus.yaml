- id: 4a14556b-65ea-59e5-ad40-f8aa6a60b54f
  title: कंज्यूमर ड्यूरेबल EMI — आपके रिकॉर्ड या विवरण में अंतर
  body: "यदि आपको लगता है कि आपके ऋण विवरण या भुगतान रिकॉर्ड में कोई गलती है, तो एक\
    \ सपोर्ट एजेंट के रूप में इस प्रक्रिया का पालन करें:\n\n1. अंतर की पहचान करें:\
    \ ग्राहक से पूछें कि उन्हें विवरण में क्या अंतर दिख रहा है (जैसे: किस्त जमा करने\
    \ के बाद भी बकाया दिखना या ₹350 का गलत विलंब भुगतान शुल्क लगना)।\n2. प्रमाण मांगें:\
    \ ग्राहक से उनके बैंक स्टेटमेंट या भुगतान रसीद की प्रति मांगें।\n3. रिकॉर्ड का\
    \ मिलान करें: ग्राहक द्वारा दिए गए प्रमाण का हमारे आंतरिक भुगतान रिकॉर्ड से मिलान\
    \ करें।\n4. सुधार की कार्रवाई:\n   - यदि भुगतान प्राप्त हो गया है लेकिन अपडेट\
    \ नहीं हुआ, तो हम रिकॉर्ड को तुरंत ठीक करेंगे।\n   - यदि शुल्क गलत तरीके से लगाया\
    \ गया है, तो हम प्रबंधकीय अनुमोदन के बाद उसे समायोजित करेंगे।\n5. समाधान की पुष्टि:\
    \ सुधार के बाद, ग्राहक को अद्यतन विवरण प्रदान करें और पुष्टि करें कि अब रिकॉर्ड\
    \ सही हैं।\n\nयदि समाधान में समय लगता है, तो हम एक केस दर्ज करेंगे और RBI के TAT\
    \ ढांचे के अनुसार समाधान करेंगे।\n\nडिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार\
    \ नहीं करते हैं।"
