- id: a2a571ec-7d2a-58fc-8bc1-c7d88fb9c289
  title: get_accounts का उपयोग कब करें
  body: 'जब कोई ग्राहक अपने खाते के विवरण मांगता है या जब एजेंट को किसी अन्य टूल (जैसे
    ऋण विवरण या पुनर्भुगतान विवरण) का उपयोग करने के लिए खाता आईडी (account_id) की
    आवश्यकता होती है, तब get_accounts टूल का उपयोग किया जाता है।


    प्रक्रिया:

    1. ग्राहक की पहचान verify_identity टूल के माध्यम से सत्यापित करें।

    2. यदि ग्राहक ने केवल अपने खाते के अंतिम चार अंक बताए हैं या अपने सभी सक्रिय खातों
    की सूची मांगी है, तो get_accounts टूल कॉल करें।

    3. टूल द्वारा प्रदान की गई सूची से सही account_id की पहचान करें।

    4. इस ID का उपयोग करके ग्राहक को उनके सक्रिय उत्पादों (जैसे व्यक्तिगत ऋण (पर्सनल
    लोन) या स्वर्ण ऋण (गोल्ड लोन)) की जानकारी दें।


    यह टूल सभी खाता-विशिष्ट अनुरोधों के लिए प्रारंभिक चरण है ताकि सही खाते पर कार्रवाई
    सुनिश्चित हो सके।'
