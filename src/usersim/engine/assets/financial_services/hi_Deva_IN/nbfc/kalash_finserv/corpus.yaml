- id: b57026a7-f901-5e9b-9548-b74321125e5f
  title: कंज्यूमर ड्यूरेबल EMI — विफल या लंबित कार्रवाई
  body: 'यदि आपकी EMI प्रक्रिया विफल हो जाती है या लंबित रहती है, तो कृपया निम्नलिखित
    चरणों का पालन करें:


    लक्षण: "मेरी किस्त का भुगतान नहीं हुआ" या "ऋण आवेदन लंबित है"


    संभावित कारण और समाधान:

    1. बैंक खाते में राशि की कमी: जांचें कि क्या आपके खाते में किस्त की राशि और यदि
    लागू हो तो ₹350 का विलंब भुगतान शुल्क कवर करने के लिए पर्याप्त बैलेंस है।

    2. KYC अधूरा होना: सुनिश्चित करें कि आपके सभी केवाईसी दस्तावेज़ अपडेटेड हैं।

    3. मैंडेट विफलता: यदि आपका ऑटो-डेबिट (ECS) विफल हुआ है, तो हमें सूचित करें।


    समाधान प्रक्रिया:

    - हमें त्रुटि के बारे में बताएं; हम आपके खाते की स्थिति की जांच करेंगे।

    - यदि कोई तकनीकी त्रुटि है, तो हम उसे ठीक करेंगे और आपको अपडेट करेंगे।


    यदि समस्या का समाधान तुरंत नहीं होता है, तो हम इसे अपनी आंतरिक टीम को भेजेंगे
    (Escalate करेंगे) और RBI के टर्न-अराउंड-टाइम (TAT) ढांचे के भीतर आपको समाधान प्रदान
    करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
