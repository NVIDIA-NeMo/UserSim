- id: 29f7f8fc-cdc9-56c2-8596-36d2e3c8358a
  title: कंज्यूमर ड्यूरेबल EMI — अवधि (माह) की व्याख्या
  body: 'प्रश्न: मेरे कंज्यूमर ड्यूरेबल EMI ऋण की पुनर्भुगतान अवधि क्या है?

    उत्तर: इस उत्पाद के तहत, आपके ऋण की अवधि 9 माह निर्धारित की गई है। इसका मतलब है
    कि आपको अपने खरीदे गए सामान की कुल राशि को 9 समान मासिक किस्तों में चुकाना होगा।


    प्रश्न: क्या मैं इस अवधि को बदल सकता हूँ?

    उत्तर: वर्तमान में, इस उत्पाद के लिए 9 माह की एक निश्चित अवधि है। अधिक जानकारी
    के लिए आप कंज्यूमर ड्यूरेबल EMI — सिंहावलोकन देख सकते हैं।'
