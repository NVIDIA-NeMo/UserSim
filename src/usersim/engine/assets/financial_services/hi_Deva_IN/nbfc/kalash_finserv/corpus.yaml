- id: b355ae22-2d8c-59e6-9679-bb22582d7ba1
  title: EMI भुगतान मैंडेट — शुरुआत कैसे करें
  body: 'यह गाइड सहायता एजेंटों के लिए है ताकि वे ग्राहकों को ''EMI भुगतान मैंडेट''
    सेटअप करने में मदद कर सकें।


    उत्पाद का उद्देश्य: समय पर भुगतान सुनिश्चित करना और ग्राहकों को बाउंस शुल्क से
    बचाना।


    मुख्य विवरण और शुल्क:

    - प्री-डेबिट सूचना: ग्राहक को राशि कटने से 24 घंटे पहले सूचित किया जाता है।

    - बाउंस शुल्क: यदि खाते में पर्याप्त राशि नहीं है, तो ₹500 का शुल्क लिया जाएगा।

    - संशोधन समय: मैंडेट में बदलाव के लिए 3 दिन का समय लगता है।


    सेटअप प्रक्रिया:

    1. ग्राहक के ऋण खाते की पहचान करें।

    2. ग्राहक से उनके बैंक खाते के विवरण और मैंडेट के लिए सहमति मांगें।

    3. KYC और बहु-स्तरीय प्रमाणीकरण प्रक्रिया पूरी करें।

    4. ग्राहक को ''Key Fact Statement (KFS)'' प्रदान करें ताकि उन्हें कुल लागत और
    शुल्कों का पता हो।


    एजेंट सुनिश्चित करें कि ग्राहक को यह स्पष्ट हो कि यह एक स्वचालित व्यवस्था है जिससे
    उन्हें बार-बार मैन्युअल भुगतान करने की आवश्यकता नहीं होगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
