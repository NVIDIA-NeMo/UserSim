- id: 38b51e51-bd69-50f0-9840-d28fb82fb934
  title: व्यक्तिगत ऋण (पर्सनल लोन) — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: ग्राहक को अपना ऋण आवेदन अस्वीकृत होने या किसी लेन-देन (जैसे फोरक्लोज़र)
    के अवरुद्ध होने का संदेश मिलता है।


    संभावित कारण:

    1. दस्तावेज़ीकरण की कमी: यदि KYC दस्तावेज़ अधूरे हैं या सत्यापन विफल हो गया है।

    2. पात्रता मानदंड: यदि क्रेडिट स्कोर या आय विवरण हमारी पात्रता शर्तों से मेल नहीं
    खाते।

    3. तकनीकी त्रुटि: सिस्टम में अस्थायी समस्या या डेटा बेमेल।


    समाधान प्रक्रिया:

    - सबसे पहले, यह जांचें कि क्या सभी आवश्यक दस्तावेज़ जमा किए गए हैं।

    - यदि आवेदन अस्वीकृत हुआ है, तो हम आपको अस्वीकृति का विशिष्ट कारण बताएंगे।

    - यदि कोई कार्रवाई अवरुद्ध है, तो हम आपके विवरणों का पुनः मिलान करेंगे।


    यदि समस्या बनी रहती है, तो हम मामले को आंतरिक समीक्षा टीम के पास भेजेंगे (escalate
    करेंगे), और आपको 3-5 कार्य दिवसों के भीतर समाधान या स्पष्टीकरण प्राप्त होगा।


