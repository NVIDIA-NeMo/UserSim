- id: fe23a7b9-2e7d-5eb2-b930-696e593afdcd
  title: व्यक्तिगत ऋण (पर्सनल लोन) — विफल या लंबित कार्रवाई
  body: 'यदि आपका ऋण आवेदन लंबित है या वितरण विफल हो गया है, तो कृपया निम्नलिखित चरणों
    की जाँच करें:


    1. दस्तावेज़ की पूर्णता: जाँचें कि क्या आपके द्वारा दिए गए KYC दस्तावेज़ स्पष्ट
    हैं और अद्यतित हैं। यदि कोई दस्तावेज़ अधूरा है, तो हम आपसे उसे पुनः माँगेंगे।

    2. बैंक विवरण का सत्यापन: सुनिश्चित करें कि आपके द्वारा प्रदान किया गया खाता नंबर
    और IFSC कोड सही है। गलत विवरण के कारण फंड वितरण विफल हो सकता है।

    3. पात्रता समीक्षा: यदि आवेदन लंबित है, तो हो सकता है कि हम आपकी क्रेडिट प्रोफाइल
    की समीक्षा कर रहे हों।


    समाधान:

    - यदि विवरण गलत हैं, तो हमें सही जानकारी प्रदान करें और हम वितरण प्रक्रिया को
    फिर से शुरू करेंगे।

    - यदि समस्या बनी रहती है, तो हम इस मामले को अपनी आंतरिक क्रेडिट टीम के पास भेजेंगे,
    और आपको 3 कार्य दिवसों के भीतर स्थिति की सूचना दी जाएगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
