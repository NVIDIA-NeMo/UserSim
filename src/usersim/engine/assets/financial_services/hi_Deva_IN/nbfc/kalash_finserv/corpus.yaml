- id: 864c64bd-fcca-540c-aa5a-0216ad3bca81
  title: कंज्यूमर ड्यूरेबल EMI — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'कंज्यूमर ड्यूरेबल EMI के माध्यम से खरीदारी करने का पूरा तरीका यहाँ दिया गया
    है:


    1. सामान का चुनाव: उस इलेक्ट्रॉनिक उत्पाद को चुनें जिसे आप खरीदना चाहते हैं।

    2. आवेदन: हमसे इस उत्पाद के लिए ऋण आवेदन शुरू करने का अनुरोध करें।

    3. दस्तावेज़ीकरण: हम आपसे KYC दस्तावेज़ मांगेंगे। इन्हें प्रदान करें ताकि हम आपकी
    पात्रता की जांच कर सकें।

    4. शुल्क भुगतान: स्वीकृत होने पर, ₹499 का प्रोसेसिंग शुल्क जमा करें।

    5. विवरण की समीक्षा: हम आपको ''Key Fact Statement'' प्रदान करेंगे जिसमें 0% वार्षिक
    ब्याज दर और 9 महीने की अवधि का विवरण होगा। इसे ध्यान से पढ़ें।

    6. अंतिम स्वीकृति: आपके हस्ताक्षर/सहमति के बाद, ऋण राशि सीधे विक्रेता को हस्तांतरित
    कर दी जाएगी और आपका सामान सुरक्षित हो जाएगा।


    आपकी किस्तों का भुगतान आपके द्वारा सेट किए गए मैंडेट के अनुसार शुरू होगा।


