- id: 2e55c5b4-3ce6-5ce4-9751-394aa0a961d0
  title: EMI भुगतान मैंडेट — आवश्यक दस्तावेज़
  body: 'EMI भुगतान मैंडेट सेटअप करने के लिए निम्नलिखित दस्तावेज़ों की आवश्यकता होती
    है:


    - सक्रिय बचत या चालू खाता: अनिवार्य (स्वचालित डेबिट के लिए)।

    - रद्द किया गया चेक (Cancelled Cheque) या बैंक स्टेटमेंट: बैंक विवरण और IFSC कोड
    के सत्यापन के लिए अनिवार्य।

    - वैध KYC दस्तावेज़: आधार कार्ड या पैन कार्ड (पहचान और पते के प्रमाण के लिए)।

    - डिजिटल हस्ताक्षर या भौतिक हस्ताक्षर: मैंडेट फॉर्म के प्रमाणीकरण के लिए।


    इन सभी दस्तावेज़ों के सत्यापन के बाद ही मैंडेट सक्रिय किया जाता है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
