- id: d6ea7c65-82bf-5ac3-89a0-d4128bbf0dc5
  title: कंज्यूमर ड्यूरेबल EMI — शर्तों में बदलाव की नीति
  body: 'कलश फिनसर्व के कंज्यूमर ड्यूरेबल EMI समझौते के तहत, हम बाजार की स्थितियों
    और नियामक दिशा-निर्देशों के आधार पर शर्तों में बदलाव का अधिकार सुरक्षित रखते हैं।


    1. शुल्क और दरें: वर्तमान में, वार्षिक ब्याज दर 0% है और प्रोसेसिंग शुल्क ₹499
    है। यदि इन शुल्कों में कोई बदलाव होता है, तो हम ग्राहकों को 30 दिनों की अग्रिम
    सूचना देंगे।

    2. दंड शुल्क: विलंब भुगतान शुल्क ₹350 है। ऋण अनुशासन बनाए रखने के लिए, यह शुल्क
    तब लागू होता है जब किस्त की नियत तिथि तक भुगतान प्राप्त नहीं होता है।

    3. बदलाव की प्रक्रिया: किसी भी नीतिगत बदलाव की सूचना आपको ईमेल या एसएमएस के माध्यम
    से दी जाएगी।

    4. ऋण अवधि: स्वीकृत ऋण की अवधि 9 माह है। इस अवधि में किसी भी बदलाव के लिए विशेष
    प्रबंधकीय अनुमोदन की आवश्यकता होगी।


    हम RBI के फेयर प्रैक्टिस कोड का कड़ाई से पालन करते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
