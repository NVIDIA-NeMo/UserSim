  title: व्यक्तिगत ऋण (पर्सनल लोन) — जोखिम प्रकटीकरण
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) लेते समय ग्राहकों को निम्नलिखित जोखिमों के प्रति
    सचेत रहना चाहिए:


    1. ब्याज लागत: 14.5% की वार्षिक ब्याज दर के कारण, ऋण की कुल लागत मूल राशि से अधिक
    होगी।

    2. भुगतान विफलता: EMI के भुगतान में विफलता न केवल आपके क्रेडिट स्कोर को प्रभावित
    करती है, बल्कि प्रत्येक बाउंस पर ₹500 का EMI Bounce Charge भी लगाया जाता है।

    3. समयपूर्व भुगतान लागत: यदि आप ऋण को अवधि से पहले बंद करते हैं, तो आपको 4% का
    फोरक्लोज़र शुल्क देना होगा, जो आपकी कुल बचत को प्रभावित कर सकता है।

    4. ऋण अनुशासन: हम प्रोसेसिंग शुल्क (2%) को केवल विशेष अनुमति से माफ करते हैं ताकि
    ग्राहक ऋण अनुशासन बनाए रखें।


    हम RBI के डिजिटल लेंडिंग दिशा-निर्देशों का पालन करते हैं और यह सुनिश्चित करते
    हैं कि आपको ऋण के सभी शुल्कों का विवरण ''Key Fact Statement'' में मिले।


