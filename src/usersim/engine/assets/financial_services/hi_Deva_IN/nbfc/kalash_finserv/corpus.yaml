    नहीं करते हैं।


    नियामक विवरण:

    - ब्याज दर: इस उत्पाद पर 0% की वार्षिक ब्याज दर लागू है।

    - पारदर्शिता: हर ऋण के लिए ''Key Fact Statement (KFS)'' अनिवार्य है, जिसमें ₹499
    का प्रोसेसिंग शुल्क और 9 माह की अवधि स्पष्ट रूप से अंकित होगी।

    - वसूली प्रक्रिया: हम ''Non-coercive Collection'' (बिना किसी दबाव के वसूली) की
    नीति का पालन करते हैं। किसी भी ग्राहक पर मानसिक या शारीरिक दबाव नहीं डाला जाएगा।

    - डेटा गोपनीयता: हम ग्राहक की डेटा गोपनीयता का पूर्ण सम्मान करते हैं और इसे सुरक्षित
    रखते हैं।

    - शिकायत निवारण: शिकायतों का समाधान RBI के निर्धारित टर्न-अराउंड-टाइम (TAT) के
    भीतर किया जाता है।'
