- id: 832f4ee4-8717-55e6-9671-0a61aecd488f
  title: स्वर्ण ऋण (गोल्ड लोन) — खाता अनुबंध
  body: 'यह अनुबंध कलश फिनसर्व और ग्राहक के बीच स्वर्ण ऋण (गोल्ड लोन) की शर्तों को
    निर्धारित करता है।


    1. ऋण की शर्तें: ग्राहक को 11.5% की वार्षिक ब्याज दर पर ऋण प्रदान किया जाएगा।
    ऋण की अधिकतम अवधि 12 महीने निर्धारित है।

    2. संपार्श्विक और LTV: ऋण की राशि आपके द्वारा जमा किए गए सोने के बाजार मूल्य के
    75% (Loan-to-Value) तक सीमित होगी।

    3. शुल्क: ऋण स्वीकृति के समय ₹500 का एकमुश्त प्रोसेसिंग शुल्क देय होगा। यह शुल्क
    परिचालन लागत को कवर करने के लिए है और केवल विशेष प्रबंधकीय अनुमोदन के बाद ही माफ
    किया जा सकता है।

    4. ऋण राशि: इस उत्पाद के तहत न्यूनतम ऋण राशि ₹25,000 है।

    5. डिफ़ॉल्ट और वसूली: किस्तों के भुगतान में विफलता पर EMI बाउंस शुल्क लागू होगा।
    हम RBI के फेयर प्रैक्टिस कोड का पालन करते हुए केवल नॉन-कोर्सिव कलेक्शन (बिना दबाव
    के वसूली) प्रक्रिया अपनाएंगे।

    6. अनुबंध की समाप्ति: पूर्ण भुगतान और ब्याज के निपटान के बाद, आपका सोना सुरक्षित
    रूप से वापस कर दिया जाएगा।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
