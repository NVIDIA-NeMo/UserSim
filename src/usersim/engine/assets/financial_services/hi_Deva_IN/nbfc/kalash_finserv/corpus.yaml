- id: 279059b5-4bf7-566e-ab6c-b457a23e6d6a
  title: कंज्यूमर ड्यूरेबल EMI — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आपको अपने ऋण खाते या विवरणों तक पहुँचने में समस्या आ रही है, तो कृपया
    निम्न चरणों का पालन करें:


    - समस्या: "मैं अपने ऋण की वर्तमान स्थिति या शेष राशि नहीं देख पा रहा हूँ।"

    - संभावित कारण: गलत क्रेडेंशियल्स, केवाईसी का अधूरा होना, या सिस्टम अपडेट।

    - क्या जांचें: सबसे पहले सुनिश्चित करें कि आपका पंजीकृत मोबाइल नंबर सक्रिय है।
    यदि आप पासवर्ड भूल गए हैं, तो हमसे रीसेट करने का अनुरोध करें।

    - समाधान: हम आपके पहचान विवरणों को सत्यापित करेंगे और आपके एक्सेस को पुनः सक्रिय
    करेंगे।

    - एस्केलेशन: यदि समस्या बनी रहती है, तो हम इस मामले को अपनी तकनीकी टीम को भेजेंगे।
    आपको 48 कार्य घंटों के भीतर समाधान या स्थिति अपडेट प्राप्त होगा।


    हम RBI के टर्न-अराउंड-टाइम (TAT) ढांचे का पालन करते हैं ताकि आपकी शिकायतों का
    त्वरित समाधान हो सके।


