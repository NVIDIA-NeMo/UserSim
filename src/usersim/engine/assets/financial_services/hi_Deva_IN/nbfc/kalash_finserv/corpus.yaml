- id: f2321ec9-8318-53ff-be2e-4aa4f03123a4
  title: दोपहिया वाहन ऋण — ब्याज दर अनुसूची
  body: 'दोपहिया वाहन ऋण के लिए ब्याज दर विवरण निम्नलिखित है:


    - लागू वार्षिक ब्याज दर: 12.9%


    यह एक फ्लैट दर है जो सभी पात्र ग्राहकों के लिए समान रूप से लागू होती है। यह ब्याज
    दर ऋण की मूल राशि पर वार्षिक आधार पर गणना की जाती है। दर में कोई भी परिवर्तन RBI
    के दिशा-निर्देशों और संस्था की नीति के अनुसार किया जा सकता है, जिसकी सूचना ग्राहकों
    को अग्रिम रूप से दी जाएगी।'
