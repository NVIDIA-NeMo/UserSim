- id: 7a013c7c-5cf0-5d0b-a11c-3e5de14ae0f9
  title: EMI भुगतान मैंडेट — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपने वर्तमान EMI भुगतान मैंडेट को रद्द करना या बंद करना चाहते हैं,
    तो इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपना मैंडेट बंद करना चाहते हैं और वह ऋण खाता संख्या बताएं
    जिससे यह जुड़ा है।

    2. हम आपसे पहचान सत्यापन के लिए आवश्यक KYC विवरण मांगेंगे, जिन्हें आपको प्रदान
    करना होगा।

    3. हम आपके अनुरोध की समीक्षा करेंगे और आपको सूचित करेंगे कि मैंडेट बंद करने की
    प्रक्रिया शुरू हो गई है।

    4. यदि आप मैंडेट में कोई बदलाव (जैसे बैंक खाता बदलना) करना चाहते हैं, तो कृपया
    नया विवरण दें; इस संशोधन प्रक्रिया में 3 दिन का समय लगेगा।

    5. जब प्रक्रिया पूरी हो जाएगी, तो हम आपको एक पुष्टि संदेश भेजेंगे कि आपका मैंडेट
    सफलतापूर्वक रद्द या अपडेट कर दिया गया है।


    ध्यान दें: मैंडेट बंद करने से पहले सुनिश्चित करें कि आपके ऋण की बकाया राशि का
    भुगतान करने का वैकल्पिक तरीका तैयार है, ताकि आपको ₹500 के बाउंस शुल्क से न जूझना
    पड़े।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
