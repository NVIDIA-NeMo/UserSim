- id: b8b051db-6284-5679-aa72-73ae4e3ca535
  title: EMI भुगतान मैंडेट — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: "यह दस्तावेज़ सहायता एजेंटों के लिए EMI भुगतान मैंडेट की परिचालन सीमाओं को\
    \ स्पष्ट करता है। \n\nमुख्य सीमाएँ और प्रतिबंध:\n1. संशोधन अवधि: यदि ग्राहक अपने\
    \ मैंडेट विवरण में बदलाव का अनुरोध करता है, तो मैंडेट संशोधन प्रोसेसिंग अवधि 3\
    \ दिन है। इस समय सीमा से पहले बदलाव प्रभावी नहीं होंगे।\n2. अधिसूचना समय: सिस्टम\
    \ डेबिट होने से 24 घंटे पहले एक पूर्व-डेबिट अधिसूचना (pre-debit notification)\
    \ भेजता है। इस समय सीमा को कम या बदला नहीं जा सकता।\n3. शुल्क प्रतिबंध: यदि खाते\
    \ में पर्याप्त राशि न होने के कारण किस्त विफल होती है, तो ₹500 का EMI बाउंस शुल्क\
    \ लगाया जाएगा। यह शुल्क ऋण अनुशासन बनाए रखने के लिए है और केवल विशेष प्रबंधकीय\
    \ अनुमोदन के अधीन ही माफ किया जा सकता है।\n\nअपवाद स्थितियाँ:\n- यदि तकनीकी खराबी\
    \ के कारण बैंक की ओर से विफलता होती है, तो मामला जांच के लिए भेजा जाएगा और RBI\
    \ के TAT ढांचे के अनुसार हल किया जाएगा।\n\nडिस्क्लेमर: हम कोई जमा राशि (deposits)\
