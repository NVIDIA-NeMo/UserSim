  title: व्यक्तिगत ऋण (पर्सनल लोन) — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके व्यक्तिगत ऋण (पर्सनल लोन) खाते की सुरक्षा हमारी सर्वोच्च प्राथमिकता
    है। कृपया इन सर्वोत्तम प्रथाओं का पालन करें:


    1. गोपनीय जानकारी: कलश फिनसर्व के प्रतिनिधि आपसे कभी भी आपका UPI PIN, OTP या CVV
    साझा करने के लिए नहीं कहेंगे। यदि कोई ऐसा करता है, तो यह धोखाधड़ी का प्रयास हो
    सकता है।

    2. प्रमाणीकरण: किसी भी वित्तीय लेन-देन या खाते में बदलाव से पहले हम सख्त KYC और
    बहु-स्तरीय प्रमाणीकरण का पालन करते हैं।

    3. सतर्कता: संदिग्ध ईमेल या संदेशों में दिए गए लिंक पर क्लिक न करें जो तत्काल
    ऋण टॉप-अप का दावा करते हों।


    यदि आपको अपने खाते में कोई अनधिकृत गतिविधि दिखाई देती है, तो कृपया तुरंत हमें
    सूचित करें। हम RBI के दिशा-निर्देशों के अनुसार शिकायतों का त्वरित समाधान करते
    हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
