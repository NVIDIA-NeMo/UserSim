  title: कंज्यूमर ड्यूरेबल EMI — श्रेणियों या विकल्पों में से चुनाव
  body: 'यदि आप यह तय नहीं कर पा रहे हैं कि कौन सा विकल्प चुनें, तो यह तुलना देखें:


