- id: eecd2b9a-1c42-55ed-900b-2c5c61bbfbcd
  title: व्यक्तिगत ऋण (पर्सनल लोन) — फोरक्लोज़र शुल्क की व्याख्या
  body: 'प्रश्न: यदि मैं अपने व्यक्तिगत ऋण (पर्सनल लोन) को अवधि समाप्त होने से पहले
    बंद करना चाहता हूँ, तो क्या कोई शुल्क लगेगा?

    उत्तर: हाँ, समय से पहले ऋण बंद करने (फोरक्लोज़र) पर 4% का फोरक्लोज़र शुल्क लागू
    होता है। यह शुल्क बकाया मूलधन राशि पर लगाया जाता है।


    प्रश्न: क्या इस शुल्क को माफ किया जा सकता है?

    उत्तर: शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन के अधीन है ताकि ऋण अनुशासन बना
    रहे। अधिक जानकारी के लिए व्यक्तिगत ऋण (पर्सनल लोन) — शुल्क अनुसूची देखें।


