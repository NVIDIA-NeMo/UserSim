- id: e994a495-7362-5f1a-9c84-e74f0cae5a24
  title: स्वर्ण ऋण (गोल्ड लोन) — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने स्वर्ण ऋण (गोल्ड लोन) खाते की जानकारी प्राप्त करने में असमर्थ
    हैं या लॉगिन समस्या का सामना कर रहे हैं, तो कृपया निम्नलिखित जाँचें:


    संभावित समस्या: लॉगिन विफल हो रहा है या विवरण नहीं दिख रहे हैं।

    कारण:

    - पंजीकृत मोबाइल नंबर या ईमेल में बदलाव।

    - KYC दस्तावेजों का पुराना होना या एक्सपायर होना।

    - तकनीकी त्रुटि या प्रमाणीकरण विफल होना।


    समाधान के चरण:

    1. सुनिश्चित करें कि आप उसी मोबाइल नंबर का उपयोग कर रहे हैं जो ऋण लेते समय दिया
    गया था।

    2. यदि आपने हाल ही में मोबाइल नंबर बदला है, तो हमें सूचित करें ताकि हम आपके रिकॉर्ड
    अपडेट कर सकें।

    3. यदि समस्या बनी रहती है, तो हम आपके खाते का आंतरिक ऑडिट करेंगे और प्रमाणीकरण
    के बाद एक्सेस बहाल करेंगे।


    यदि हम इसे तुरंत हल नहीं कर पाते हैं, तो हम इस मामले को विशेषज्ञ टीम को भेजेंगे
    (escalate करेंगे), और आप 3 कार्य दिवसों के भीतर समाधान प्राप्त करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
