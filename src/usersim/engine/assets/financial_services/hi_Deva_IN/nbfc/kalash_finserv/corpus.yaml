- id: a6ea36a3-5c7b-566e-823b-d2eb085bb3e4
  title: व्यक्तिगत ऋण (पर्सनल लोन) — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'यह दस्तावेज़ व्यक्तिगत ऋण (पर्सनल लोन) से जुड़ी परिचालन सीमाओं और प्रतिबंधों
    को स्पष्ट करता है ताकि सहायता एजेंट ग्राहकों को सही जानकारी दे सकें।


    मुख्य सीमाएँ और शर्तें:

    - ऋण अवधि: इस उत्पाद के लिए अधिकतम ऋण अवधि 60 माह है। इससे अधिक समय के लिए ऋण
    उपलब्ध नहीं है।

    - शुल्क संरचना: ऋण की कुल लागत में 2% का प्रोसेसिंग शुल्क शामिल है, जो ऋण राशि
    पर लगाया जाता है।

    - ब्याज दर: सभी पात्र ग्राहकों के लिए वार्षिक ब्याज दर 14.5% निर्धारित है।

    - फोरक्लोज़र प्रतिबंध: यदि ग्राहक समय से पहले ऋण बंद करना चाहता है, तो 4% का फोरक्लोज़र
    शुल्क लागू होगा।

    - भुगतान अनुशासन: किस्त के भुगतान में विफलता पर ₹500 का EMI बाउंस शुल्क लगाया
    जाएगा।


    अपवाद स्थितियाँ:

    शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन के अधीन है, ताकि ऋण अनुशासन बना रहे। हम
    RBI के फेयर प्रैक्टिस कोड का पालन करते हैं और किसी भी स्थिति में दबावपूर्ण वसूली
    (coercive collection) नहीं करते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
