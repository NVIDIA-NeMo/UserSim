- id: 1e561f66-ed11-5468-b1e8-e724a7916858
  title: दोपहिया वाहन ऋण — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके ऋण विवरण (जैसे ब्याज दर या शेष राशि) में कोई विसंगति
    है, तो कृपया निम्नलिखित प्रक्रिया अपनाएं:


    लक्षण:

    - आपके रिकॉर्ड के अनुसार भुगतान किया गया, लेकिन स्टेटमेंट में वह अभी भी लंबित
    दिख रहा है।

    - ब्याज दर 12.9% से भिन्न दिखाई दे रही है।


    जांच के चरण:

    1. अपने बैंक स्टेटमेंट से भुगतान की तारीख और ट्रांजेक्शन आईडी (UTR) की जांच करें।

    2. अपने मूल ऋण समझौते और ''Key Fact Statement'' में उल्लिखित शुल्कों (जैसे ₹1500
    प्रोसेसिंग शुल्क) का मिलान करें।


    समाधान:

    - यदि भुगतान अपडेट नहीं हुआ है, तो हमें ट्रांजेक्शन आईडी प्रदान करें। हम 3-5 कार्य
    दिवसों में इसे अपडेट कर देंगे।

    - यदि ब्याज दर में अंतर है, तो हम आपके खाते की समीक्षा करेंगे और त्रुटि पाए जाने
    पर उसे तुरंत ठीक करेंगे।


    यदि विसंगति हल नहीं होती है, तो हम एक औपचारिक शिकायत दर्ज करेंगे और RBI के टर्न-अराउंड-टाइम
    (TAT) ढांचे के अनुसार इसका समाधान करेंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
