- id: 2a591fa1-ced3-5f85-931a-8171dfd8ea52
  title: दोपहिया वाहन ऋण — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'कलश फिनसर्व के दोपहिया वाहन ऋण (two_wheeler_loan) के लिए एक सरल और फ्लैट
    ब्याज दर संरचना लागू होती है।


    - लागू वार्षिक ब्याज दर: 12.9%


    यह दर सभी पात्र ग्राहकों पर समान रूप से लागू होती है, चाहे ऋण राशि कितनी भी हो।
    ब्याज की गणना ऋण के मूलधन पर की जाती है और इसे 36 महीने की अधिकतम अवधि के दौरान
    मासिक किस्तों (EMI) में वितरित किया जाता है। दर में कोई बदलाव केवल नियामक परिवर्तनों
    या विशेष प्रबंधकीय अनुमोदन के अधीन होने पर ही संभव है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
