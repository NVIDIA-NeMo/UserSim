- id: b270b285-3461-5896-925f-dbd6e51c01b2
  title: व्यक्तिगत ऋण (पर्सनल लोन) — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'कलश फिनसर्व में आपकी सुरक्षा हमारी प्राथमिकता है। व्यक्तिगत ऋण (पर्सनल लोन)
    के आवेदकों को अक्सर ऐसे स्कैमर्स निशाना बनाते हैं जो तत्काल ऋण स्वीकृति का वादा
    करते हैं। कृपया ध्यान दें कि हम आपसे कभी भी आपका UPI PIN, OTP या CVV साझा करने
    के लिए नहीं कहेंगे।


    सावधान रहें यदि कोई व्यक्ति आपसे ऋण राशि जारी करने से पहले ''प्रोसेसिंग फीस''
    या ''बीमा शुल्क'' के रूप में अग्रिम नकद भुगतान की मांग करता है। हमारा 2% प्रोसेसिंग
    शुल्क पारदर्शी है और ऋण प्रक्रिया के आधिकारिक हिस्से के रूप में प्रबंधित किया
    जाता है।


    यदि आपको कोई संदिग्ध कॉल या मैसेज प्राप्त होता है, या आपके खाते में कोई अनधिकृत
    गतिविधि दिखती है, तो तुरंत हमें सूचित करें। धोखाधड़ी के मामलों को हमारी त्वरित
    रिपोर्टिंग और चार्जबैक प्रक्रिया के माध्यम से हल किया जाता है। सुरक्षा के लिए
    हम सख्त KYC और बहु-स्तरीय प्रमाणीकरण का पालन करते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
