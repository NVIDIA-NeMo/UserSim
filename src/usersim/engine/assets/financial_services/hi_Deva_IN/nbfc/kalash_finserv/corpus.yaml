- id: 0752e393-eed8-53c9-840e-75a8e39371f4
  title: EMI भुगतान मैंडेट — खाता अनुबंध
  body: 'यह अनुबंध कलश फिनसर्व और ग्राहक के बीच EMI भुगतान मैंडेट के संचालन को नियंत्रित
    करता है।


    1. भुगतान दायित्व: ग्राहक अपने बैंक खाते में पर्याप्त राशि बनाए रखने के लिए सहमत
    है। यदि किस्त के भुगतान के समय खाते में पर्याप्त राशि नहीं होती है, तो ₹500 का
    EMI Bounce Charge लगाया जाएगा।

    2. सूचना अवधि: हम ऋण की किस्त डेबिट करने से 24 घंटे पहले ग्राहक को एक पूर्व-डेबिट
    सूचना भेजेंगे।

    3. संशोधन: मैंडेट के विवरण में किसी भी बदलाव के लिए अनुरोध करने पर, प्रोसेसिंग
    में 3 दिन का समय लगेगा।

    4. समाप्ति: यह अनुबंध ऋण के पूर्ण भुगतान या ग्राहक द्वारा निर्धारित प्रक्रिया
    के माध्यम से मैंडेट रद्द करने पर समाप्त होगा।

    5. अनुशासन: ऋण अनुशासन बनाए रखने के लिए, शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन
    के अधीन होगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
