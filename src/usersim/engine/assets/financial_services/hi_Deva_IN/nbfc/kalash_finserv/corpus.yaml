  title: स्वर्ण ऋण (गोल्ड लोन) — अवधि (माह) की व्याख्या
  body: 'प्रश्न: मैं अपने स्वर्ण ऋण (गोल्ड लोन) के लिए अधिकतम कितनी अवधि चुन सकता
