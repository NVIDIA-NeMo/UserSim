- id: 5daa666d-7a3a-5820-befc-ad5e5f1eac8b
  title: सामान्य अक्सर पूछे जाने वाले प्रश्न
  body: 'प्रश्न: मैं कलश फिनसर्व से सहायता कैसे प्राप्त कर सकता हूँ?

    उत्तर: आप हमारी सहायता के लिए फोन, ईमेल या अपने नजदीकी शाखा केंद्र पर संपर्क कर
    सकते हैं। हमारी सेवाएं भारतीय मानक समय (IST) के अनुसार कार्य दिवसों पर उपलब्ध
    हैं।


    प्रश्न: यदि मुझे अपनी शिकायत का समाधान नहीं मिलता है, तो क्या होगा?

    उत्तर: हम RBI के टर्न-अराउंड-टाइम (TAT) ढांचे का पालन करते हैं और शिकायतों के
    त्वरित समाधान के लिए एक निर्धारित एस्केलेशन मैट्रिक्स का उपयोग करते हैं।


    प्रश्न: क्या मैं कलश फिनसर्व में पैसा जमा कर सकता हूँ?

    उत्तर: नहीं, हम एक NBFC हैं और हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
  domain: lending_mortgage
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 063e5d6c-4ec2-5efc-b04e-8c5b08f735dd
  title: ऋण और वित्तपोषण के लिए नियामक नोट्स
  body: 'कलश फिनसर्व RBI के फेयर प्रैक्टिस कोड और डिजिटल लेंडिंग दिशा-निर्देशों का
    कड़ाई से पालन करता है। एजेंटों के लिए यह अनिवार्य है कि वे सुनिश्चित करें कि हर
    ऋण के लिए एक ''Key Fact Statement (KFS)'' प्रदान किया गया है। KFS एक ऐसा दस्तावेज़
    है जो ऋण की कुल वार्षिक लागत, ब्याज दर और सभी शुल्कों का स्पष्ट विवरण देता है,
    ताकि ग्राहक पूरी तरह सूचित रहे।


    वसूली की प्रक्रिया के संबंध में, हम ''Non-coercive Collection'' नीति का पालन करते
    हैं, जिसका अर्थ है कि ऋण वसूली RBI के दिशा-निर्देशों के अनुसार बिना किसी मानसिक
    या शारीरिक दबाव के की जानी चाहिए। किसी भी परिस्थिति में ग्राहक के साथ अभद्र व्यवहार
    या दबाव डालना सख्त मना है। एजेंटों को पारदर्शिता के उच्चतम मानकों का पालन करना
    चाहिए और केवल शैक्षिक जानकारी प्रदान करनी चाहिए; व्यक्तिगत कर या कानूनी सलाह देना
    वर्जित है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
  domain: lending_mortgage
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
