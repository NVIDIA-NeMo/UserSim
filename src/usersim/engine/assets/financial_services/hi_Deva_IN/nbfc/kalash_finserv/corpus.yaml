- id: 1823eafc-7a03-5ae9-a372-9593fdb91580
  title: व्यक्तिगत ऋण (पर्सनल लोन) — ब्याज दर अनुसूची
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) के लिए ब्याज दर संरचना इस प्रकार है:


    - लागू वार्षिक ब्याज दर: 14.5%


    यह एक फ्लैट वार्षिक दर है जो सभी पात्र ग्राहकों पर समान रूप से लागू होती है। यह
    दर आपके ऋण की कुल मूल राशि पर गणना की जाती है। ब्याज दरों में कोई भी परिवर्तन
    केवल संस्था की नीतिगत समीक्षा या नियामक बदलावों के बाद ही किया जाएगा, जिसकी सूचना
    ग्राहकों को समय पर दी जाएगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
