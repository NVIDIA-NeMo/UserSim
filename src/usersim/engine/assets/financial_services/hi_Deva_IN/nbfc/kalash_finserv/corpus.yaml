  title: स्वर्ण ऋण (गोल्ड लोन) — वर्तमान ऑफर
  body: 'विशेष उत्सव ऑफर! अपने सोने के साथ वित्तीय स्वतंत्रता पाएं।


    दिनांक 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक, स्वर्ण ऋण (गोल्ड लोन) लेने वाले सभी
    मौजूदा ग्राहकों के लिए त्वरित प्रसंस्करण उपलब्ध है।


    ऑफर विवरण:

    - वार्षिक ब्याज दर: 11.5%

    - न्यूनतम ऋण राशि: ₹25000

    - प्रोसेसिंग शुल्क: ₹500


    अपने सोने की सुरक्षा सुनिश्चित करें और अपनी वित्तीय जरूरतों को पूरा करें। अधिक
    जानकारी के लिए स्वर्ण ऋण (गोल्ड लोन) — सिंहावलोकन देखें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
