  title: EMI भुगतान मैंडेट — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'EMI भुगतान मैंडेट के लिए कोई वार्षिक ब्याज दर या सदस्यता शुल्क लागू नहीं
    होता है। यह एक सेवा सुविधा है। इसमें केवल निम्नलिखित शुल्क लागू होते हैं:


    - EMI Bounce Charge: ₹500 (यह शुल्क केवल तभी लागू होता है जब खाते में पर्याप्त
    राशि न होने के कारण किस्त विफल हो जाती है)।


    यह शुल्क सभी ग्राहकों पर समान रूप से लागू होता है, चाहे उनके ऋण की राशि या श्रेणी
    कुछ भी हो। शुल्क माफी केवल विशेष प्रबंधकीय अनुमोदन के माध्यम से संभव है, ताकि
    ऋण अनुशासन बना रहे।


