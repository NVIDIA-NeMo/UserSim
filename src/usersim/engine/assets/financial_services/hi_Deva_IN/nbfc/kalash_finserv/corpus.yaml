- id: a87debf3-7b0a-522a-8bb6-fbb65a7359d9
  title: दोपहिया वाहन ऋण — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'कलश फिनसर्व का दोपहिया वाहन ऋण (two_wheeler_loan) उन मध्यम और निम्न आय वाले
    परिवारों के लिए सबसे उपयुक्त है जो किफायती किस्तों के साथ अपने स्वयं के दोपहिया
    वाहन के सपने को साकार करना चाहते हैं। यह उन लोगों के लिए एक आदर्श विकल्प है जिन्हें
    दैनिक आवागमन के लिए एक विश्वसनीय वाहन की तत्काल आवश्यकता है और जो एक पारदर्शी
    ऋण प्रक्रिया की तलाश में हैं।


    उत्पाद विवरण:

    - वार्षिक ब्याज दर: 12.9%

    - ऋण अवधि: 36 महीने

    - डाउन पेमेंट: वाहन मूल्य का 15%

    - प्रोसेसिंग शुल्क: ₹1500


    हमारा उद्देश्य आपको त्वरित स्वीकृति और सरल दस्तावेज़ीकरण प्रदान करना है ताकि आपकी
    वित्तीय ज़रूरतें बिना किसी जटिलता के पूरी हो सकें। हर ऋण के साथ एक ''Key Fact
    Statement (KFS)'' प्रदान किया जाता है, जिससे आपको ब्याज और शुल्कों सहित कुल वार्षिक
    लागत की स्पष्ट जानकारी मिलती है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
