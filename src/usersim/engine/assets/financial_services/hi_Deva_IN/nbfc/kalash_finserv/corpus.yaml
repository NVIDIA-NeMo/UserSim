  title: कंज्यूमर ड्यूरेबल EMI — जोखिम प्रकटीकरण
  body: 'कलश फिनसर्व पारदर्शिता के प्रति प्रतिबद्ध है। कंज्यूमर ड्यूरेबल EMI लेते
    समय कृपया निम्नलिखित जोखिमों को समझें:


    1. भुगतान जोखिम: यद्यपि वार्षिक ब्याज दर 0% है, लेकिन समय पर भुगतान न करने पर
    ₹350 का विलंब भुगतान शुल्क लगाया जाएगा। बार-बार बाउंस होने से आपके क्रेडिट स्कोर
    पर नकारात्मक प्रभाव पड़ सकता है।

    2. शुल्क जोखिम: ₹499 का प्रोसेसिंग शुल्क ऋण की शुरुआत में ही देय होता है और यह
    वापस नहीं किया जाता है।

    3. ऋण अनुशासन: हम RBI के दिशा-निर्देशों के अनुसार वसूली करते हैं, लेकिन भुगतान
    न करने की स्थिति में कानूनी कार्यवाही की जा सकती है।


    हम केवल शैक्षिक जानकारी प्रदान करते हैं और व्यक्तिगत कर या कानूनी सलाह नहीं देते
    हैं। ऋण लेने से पहले अपने ''Key Fact Statement'' को ध्यान से पढ़ें ताकि आप कुल
    लागत से अवगत रहें।


