- id: 9a4ad8e8-f7ad-5d22-902c-77dea063d508
  title: apply_loan का उपयोग कब करें
  body: 'जब कोई नया ग्राहक या मौजूदा ग्राहक हमारे उत्पादों जैसे व्यक्तिगत ऋण (पर्सनल
    लोन), स्वर्ण ऋण (गोल्ड लोन), दोपहिया वाहन ऋण, या कंज्यूमर ड्यूरेबल EMI के लिए
    आवेदन करना चाहता है, तब apply_loan टूल का उपयोग किया जाता है।


    प्रक्रिया के चरण:

    1. verify_identity का उपयोग करके आवेदक की पहचान सत्यापित करें।

    2. ग्राहक से उनकी ऋण आवश्यकता और पसंदीदा उत्पाद (product_id) के बारे में पूछें।

    3. यह सुनिश्चित करें कि ग्राहक ने Key Fact Statement (KFS) की अवधारणा को समझ लिया
    है।

    4. आवश्यक विवरणों के साथ apply_loan टूल को कॉल करें ताकि आवेदन प्रक्रिया शुरू
    हो सके।


    एजेंट को यह स्पष्ट करना चाहिए कि ऋण की स्वीकृति पात्रता मानदंडों और दस्तावेज़
    सत्यापन के अधीन है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: kalash_finserv
- id: 39753c18-c44a-58ad-9ae3-00f46cd59446
  title: apply_loan टूल संदर्भ
  body: 'apply_loan टूल का उपयोग नए ऋण आवेदन को सिस्टम में दर्ज करने के लिए किया जाता
    है। एजेंट इस प्रक्रिया को सीधे टूल कॉल करके शुरू करता है।


    पैरामीटर्स:

    - customer_id: सत्यापित ग्राहक की विशिष्ट आईडी।

    - product_id: ऋण उत्पाद की आईडी (जैसे: personal_loan, gold_loan)।

    - loan_amount: आवेदन की गई ऋण राशि।

    - tenure: ऋण की अवधि (माहों में)।


    प्रभाव: यह टूल आवेदन को प्रोसेसिंग के लिए भेजता है और क्रेडिट मूल्यांकन प्रक्रिया
    शुरू करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - apply_loan
  institution_id: kalash_finserv
- id: cbe69dd3-0641-5ac1-aef4-6b7f2023df1a
  title: pay_emi का उपयोग कब करें
  body: 'जब कोई ग्राहक अपनी मासिक किस्त (EMI) का भुगतान मैन्युअल रूप से करना चाहता
    है, या यदि उनका स्वचालित भुगतान विफल हो गया है, तो एजेंट को pay_emi टूल का उपयोग
    करना चाहिए।


    प्रक्रिया के चरण:

    1. verify_identity के माध्यम से ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts का उपयोग करके संबंधित ऋण खाते का account_id प्राप्त करें।

    3. ग्राहक से भुगतान की जाने वाली राशि और भुगतान विधि की पुष्टि करें।

    4. pay_emi टूल को कॉल करें ताकि भुगतान प्रक्रिया पूरी हो सके।


    समय पर भुगतान करने से ग्राहक EMI Bounce Charge से बच सकते हैं और अपना क्रेडिट
    स्कोर बेहतर रख सकते हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: kalash_finserv
- id: 848bac3d-d483-5160-ab35-f25a14b9469f
  title: pay_emi टूल संदर्भ
  body: 'pay_emi टूल का उपयोग ग्राहक के ऋण खाते में किस्त के भुगतान को संसाधित करने
    के लिए किया जाता है। एजेंट इस भुगतान को सीधे टूल कॉल करके निष्पादित करता है।


    पैरामीटर्स:

    - account_id: ऋण खाते की विशिष्ट आईडी।

    - amount: भुगतान की जाने वाली किस्त की राशि।

    - payment_method: भुगतान का तरीका (उदा. UPI, NetBanking)।


    प्रभाव: यह टूल ग्राहक के बकाया ऋण को कम करता है और भुगतान की रसीद उत्पन्न करता
    है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_emi
  institution_id: kalash_finserv
- id: 9a24163a-eacc-5f94-b615-bdb238c1b30a
  title: foreclose_loan का उपयोग कब करें
  body: 'फोरक्लोज़र का अर्थ है ऋण की पूरी शेष राशि का समय से पहले भुगतान करके खाता
    बंद करना। जब ग्राहक अपने ऋण को पूरी तरह समाप्त करना चाहता है, तब एजेंट को foreclose_loan
    टूल का उपयोग करना चाहिए।


    प्रक्रिया के चरण:

    1. verify_identity का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts के माध्यम से सही account_id की पहचान करें।

    3. ग्राहक को सूचित करें कि फोरक्लोज़र के समय कुल देय राशि में शेष मूलधन, ब्याज
    और लागू फोरक्लोज़र शुल्क शामिल होंगे।

    4. ग्राहक की सहमति के बाद foreclose_loan टूल को कॉल करें।


    यह एक अपरिवर्तनीय (irreversible) क्रिया है, इसलिए एजेंट को सुनिश्चित करना चाहिए
    कि ग्राहक इस निर्णय से पूरी तरह अवगत है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - foreclose_loan
  institution_id: kalash_finserv
- id: d4f39197-f6a4-5ace-a373-3fc152b42259
  title: foreclose_loan टूल संदर्भ
  body: 'foreclose_loan टूल का उपयोग ऋण खाते को पूरी तरह से बंद करने और शेष राशि का
    निपटान करने के लिए किया जाता है। एजेंट इसे सीधे टूल कॉल के माध्यम से करता है।


    पैरामीटर्स:

    - account_id: बंद किए जाने वाले ऋण खाते की आईडी।

    - settlement_amount: भुगतान की जाने वाली कुल अंतिम राशि।


    प्रभाव: सफल निष्पादन के बाद, ऋण खाता ''बंद'' के रूप में चिह्नित किया जाता है और
    ग्राहक का दायित्व समाप्त हो जाता है। यह एक अपरिवर्तनीय क्रिया है।'
  domain: lending_mortgage
