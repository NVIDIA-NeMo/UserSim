- id: 73f557a6-2fd1-5838-bcd8-bc7ad6d013f2
  title: दोपहिया वाहन ऋण — गोपनीयता और डेटा प्रबंधन
  body: 'कलश फिनसर्व आपके डेटा की गोपनीयता का पूर्ण सम्मान करता है और RBI के डिजिटल
    लेंडिंग दिशा-निर्देशों का कड़ाई से पालन करता है।


    1. डेटा संग्रह: हम केवल वही जानकारी एकत्र करते हैं जो आपके ''दोपहिया वाहन ऋण''
    के प्रसंस्करण और सेवा के लिए आवश्यक है, जिसमें केवाईसी और आय के दस्तावेज़ शामिल
    हैं।

    2. डेटा उपयोग: आपके डेटा का उपयोग ऋण पात्रता जांच, ₹1500 प्रोसेसिंग शुल्क के प्रबंधन
    और 12.9% ब्याज दर के अनुसार किस्तों की गणना के लिए किया जाता है।

    3. साझाकरण: हम आपका डेटा केवल नियामक आवश्यकताओं को पूरा करने के लिए या आपकी स्पष्ट
    सहमति से क्रेडिट ब्यूरो के साथ साझा करते हैं।

    4. वसूली प्रक्रिया: हम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं। हमारी ऋण वसूली
    प्रक्रिया पूरी तरह से ''Non-coercive Collection'' (बिना किसी मानसिक या शारीरिक
    दबाव के) पर आधारित है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
