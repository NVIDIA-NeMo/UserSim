- id: 8a10d2a4-beb6-5890-b1dd-bd20fa3029ed
  title: दोपहिया वाहन ऋण — सिंहावलोकन
  body: 'कलश फिनसर्व का दोपहिया वाहन ऋण उन मध्यम और निम्न आय वाले परिवारों के लिए
    डिज़ाइन किया गया है जो अपने स्वयं के दोपहिया वाहन के सपने को किफायती किस्तों के
    साथ साकार करना चाहते हैं। हम त्वरित स्वीकृति और पूर्ण पारदर्शिता के साथ आपकी तत्काल
    वित्तीय जरूरतों को पूरा करते हैं।


    इस ऋण उत्पाद की मुख्य विशेषताएं और वित्तीय विवरण निम्नलिखित हैं:

    - वार्षिक ब्याज दर: 12.9%

    - डाउन पेमेंट: वाहन की कीमत का 15%

    - ऋण की अधिकतम अवधि: 36 महीने

    - प्रोसेसिंग शुल्क: ₹1500 (एक बार का शुल्क)


    हम RBI के फेयर प्रैक्टिस कोड का कड़ाई से पालन करते हैं और हर ऋण के लिए एक ''Key
    Fact Statement'' (KFS) अनिवार्य रूप से प्रदान करते हैं, ताकि आपको ब्याज और प्रोसेसिंग
    फीस सहित कुल वार्षिक लागत का स्पष्ट पता रहे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 7c3b305e-e0d5-586a-b339-2b2e8bb6ddb4
  title: दोपहिया वाहन ऋण — वार्षिक ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरे दोपहिया वाहन ऋण पर लागू वार्षिक ब्याज दर क्या है और इसका क्या
    अर्थ है?

    उत्तर: आपके ऋण पर 12.9% की वार्षिक ब्याज दर लागू है। इसका अर्थ है कि आपके द्वारा
    लिए गए ऋण की मूल राशि पर एक वर्ष की अवधि के लिए यह प्रतिशत ब्याज लिया जाएगा।


    प्रश्न: क्या यह ब्याज दर समय के साथ बदल सकती है?

    उत्तर: हम अपनी ब्याज दरों में पारदर्शिता रखते हैं। वर्तमान में यह दर स्थिर है,
    लेकिन किसी भी बदलाव की सूचना आपको समय रहते दी जाएगी। अधिक विवरण के लिए कृपया ''दोपहिया
    वाहन ऋण — ब्याज दर अनुसूची'' देखें।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: d87ce3dc-ae6a-5e0f-983c-ba4337a23d67
  title: दोपहिया वाहन ऋण — सेटअप और सक्रियण
  body: 'अपने पसंदीदा दोपहिया वाहन के लिए ऋण प्राप्त करने की प्रक्रिया सरल और पारदर्शी
    है। कृपया इन चरणों का पालन करें:


    1. अपनी पसंद के वाहन का विवरण और आवश्यक केवाईसी (KYC) दस्तावेज़ हमें प्रदान करें।

    2. हम आपके दस्तावेज़ों का सत्यापन करेंगे और आपकी पात्रता की पुष्टि करेंगे।

    3. वाहन की कुल कीमत का 15% डाउन पेमेंट जमा करें।

    4. ₹1500 का प्रोसेसिंग शुल्क भुगतान करें।

    5. हम आपको एक ''Key Fact Statement'' (KFS) प्रदान करेंगे जिसमें 12.9% की वार्षिक
    ब्याज दर और 36 महीने तक की अवधि का पूरा विवरण होगा। इसे ध्यान से पढ़ें और हस्ताक्षर
    करें।

    6. ऋण स्वीकृति के बाद, हम डीलर को भुगतान करेंगे और आपका ऋण खाता सक्रिय हो जाएगा।


    आपको एक पुष्टिकरण संदेश प्राप्त होगा जिसमें आपकी मासिक किस्तों (EMI) और भुगतान
    तिथि का विवरण होगा।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: a2a570de-3ecf-51c8-af0a-0c84979ad127
  title: दोपहिया वाहन ऋण — शुल्क अनुसूची
  body: 'कलश फिनसर्व का शुल्क ढांचा पूरी तरह पारदर्शी है। दोपहिया वाहन ऋण के लिए लागू
    शुल्क नीचे दिए गए हैं:


    - प्रोसेसिंग शुल्क: ₹1500 (यह शुल्क ऋण के संचालन लागत को कवर करने के लिए लिया
    जाता है और एक बार देय होता है)।

    - डाउन पेमेंट: वाहन मूल्य का 15%।


    हम केवल उन्हीं शुल्कों को माफ करते हैं जो विशेष प्रबंधकीय अनुमोदन के अधीन हों,
    ताकि ऋण अनुशासन बना रहे। किसी भी अन्य प्रभार के लिए कृपया ''दोपहिया वाहन ऋण —
    लागत और शुल्क'' देखें।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
