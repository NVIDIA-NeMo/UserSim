    हैं और उनका ऋण स्वीकृत हो जाता है, तो आपको ₹200 का रेफरल बोनस मिलेगा। यह ऑफर 1
    जनवरी 2025 से 31 मार्च 2025 तक वैध है। आप जितने अधिक पात्र ग्राहकों को जोड़ेंगे,
    उतनी ही अधिक राशि आप कमा सकते हैं। सरल शर्तों के साथ अपने प्रियजनों को भी आसान
