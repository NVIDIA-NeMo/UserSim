    1. हमें ऋण बंद करने की अपनी इच्छा बताएं और अपना ऋण खाता नंबर प्रदान करें।

    2. हम आपके खाते की वर्तमान बकाया राशि की गणना करेंगे, जिसमें शेष किस्तों और यदि
    कोई हो, तो लंबित विलंब भुगतान शुल्क (₹350 प्रति मामला) शामिल होंगे।

    3. हम आपको कुल देय राशि का विवरण प्रदान करेंगे।

    4. आप कुल बकाया राशि का एकमुश्त भुगतान करें।

    5. भुगतान सफल होने के बाद, हम आपके ऋण खाते को बंद कर देंगे और इसकी पुष्टि आपको
    सूचित करेंगे।


    कृपया ध्यान दें कि एक बार ऋण स्वीकृत और उत्पाद वितरित हो जाने के बाद, योजना को
    ''डाउनग्रेड'' करने का विकल्प उपलब्ध नहीं है क्योंकि यह एक निश्चित अवधि (9 महीने)
    का उत्पाद है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
