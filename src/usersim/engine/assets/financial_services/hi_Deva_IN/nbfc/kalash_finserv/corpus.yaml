- id: 93563900-8357-5360-bbf7-cf98cea8358d
  title: EMI भुगतान मैंडेट — पात्रता शर्तें
  body: 'EMI भुगतान मैंडेट के लिए पात्रता मानदंड नीचे दिए गए हैं:


    - सक्रिय ऋण खाता (व्यक्तिगत, स्वर्ण या दोपहिया ऋण): अनिवार्य -> पात्र

    - वैध भारतीय बचत खाता (Savings Account): अनिवार्य -> पात्र

    - पूर्ण केवाईसी (KYC) सत्यापन: अनिवार्य -> पात्र

    - सक्रिय मोबाइल नंबर और ईमेल: अनिवार्य -> सूचना प्राप्त करने हेतु आवश्यक


    यदि उपर्युक्त शर्तें पूरी होती हैं, तो ग्राहक इस स्वचालित भुगतान सुविधा को सक्रिय
    कर सकते हैं।'
  domain: payments
  product_category: emi_repayment_mandate
  document_type: eligibility_matrix
  source_authority: official
