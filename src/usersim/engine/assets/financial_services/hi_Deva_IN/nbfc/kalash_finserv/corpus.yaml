- id: beb02d9a-b77e-56ce-adb5-e7b1182955b7
  title: कंज्यूमर ड्यूरेबल EMI — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'कलश फिनसर्व के ग्राहकों को सावधान किया जाता है कि कंज्यूमर ड्यूरेबल EMI की
    लोकप्रियता का फायदा उठाकर कुछ जालसाज ''इंस्टेंट अप्रूवल'' या ''प्रोसेसिंग शुल्क
    माफी'' का लालच दे सकते हैं।


    सावधान रहें यदि:

    1. कोई व्यक्ति आपको कॉल करके यह कहे कि आपका ऋण स्वीकृत हो गया है, लेकिन उसे सक्रिय
    करने के लिए आपको तुरंत कुछ राशि जमा करनी होगी।

    2. आपसे आपका UPI PIN, OTP या CVV मांगा जाए। याद रखें, कलश फिनसर्व कभी भी आपसे
    ये गोपनीय विवरण साझा करने के लिए नहीं कहता है।

    3. आपको किसी असुरक्षित लिंक पर क्लिक करके अपनी व्यक्तिगत जानकारी भरने के लिए कहा
    जाए।


    यदि आपको कोई संदिग्ध गतिविधि दिखती है, तो तुरंत हमें सूचित करें। धोखाधड़ी के मामलों
    को हम त्वरित रिपोर्टिंग और चार्जबैक प्रक्रिया के माध्यम से हल करते हैं। सुरक्षा
    के लिए सख्त KYC और बहु-स्तरीय प्रमाणीकरण अनिवार्य है।


