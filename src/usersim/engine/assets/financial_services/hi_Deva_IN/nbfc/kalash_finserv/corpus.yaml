- id: 640d4dfc-6a53-5e9f-b08a-43e5b237b8f1
  title: व्यक्तिगत ऋण (पर्सनल लोन) — वार्षिक ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरे व्यक्तिगत ऋण (पर्सनल लोन) पर वार्षिक ब्याज दर क्या है और यह
    कैसे लागू होती है?

    उत्तर: आपके ऋण पर 14.5% की वार्षिक ब्याज दर लागू होती है। यह दर आपके द्वारा लिए
    गए ऋण की कुल राशि पर वार्षिक आधार पर गणना की जाती है।


    प्रश्न: क्या यह ब्याज दर समय के साथ बदल सकती है?

    उत्तर: आपकी ऋण अवधि के दौरान लागू दरें आपके ऋण समझौते के अनुसार होती हैं। ब्याज
    दरों और अन्य शुल्कों की विस्तृत जानकारी के लिए कृपया व्यक्तिगत ऋण (पर्सनल लोन)
    — शुल्क अनुसूची देखें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: personal_loan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 547eec6a-70ea-5473-b411-2cb20af1473b
  title: व्यक्तिगत ऋण (पर्सनल लोन) — सेटअप और सक्रियण
  body: 'व्यक्तिगत ऋण (पर्सनल लोन) प्राप्त करने और उसे सक्रिय करने के लिए इन चरणों
    का पालन करें:


    1. आवेदन की इच्छा जताएं: हमें बताएं कि आपको ऋण की आवश्यकता है। हम आपसे आपकी आवश्यक
    ऋण राशि और पसंदीदा अवधि (अधिकतम 60 माह तक) पूछेंगे।

    2. दस्तावेज़ प्रदान करें: अपनी पहचान और आय के प्रमाण के लिए आवश्यक KYC दस्तावेज़
    हमें सौंपें।

    3. विवरण की समीक्षा करें: हम आपको ''Key Fact Statement'' प्रदान करेंगे जिसमें
    14.5% वार्षिक ब्याज दर और 2% प्रोसेसिंग शुल्क का स्पष्ट विवरण होगा। इसे ध्यान
    से पढ़ें।

    4. स्वीकृति और हस्ताक्षर: एक बार पात्रता की पुष्टि हो जाने के बाद, ऋण समझौते पर
    हस्ताक्षर करें।

    5. फंड का वितरण: अनुमोदन के बाद, ऋण राशि सीधे आपके बैंक खाते में जमा कर दी जाएगी।


    सक्रियण की पुष्टि आपको एक पुष्टिकरण संदेश और आपके ऋण खाते के विवरण के माध्यम से
    होगी।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
