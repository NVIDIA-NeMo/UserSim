  title: कंज्यूमर ड्यूरेबल EMI — बदलाव या अद्यतन करना
  body: 'यदि आप अपने मौजूदा कंज्यूमर ड्यूरेबल EMI खाते में कोई विवरण बदलना चाहते हैं,
    तो इन चरणों का पालन करें:


    1. विवरण प्रदान करें: हमें वह जानकारी बताएं जिसे आप अपडेट करना चाहते हैं (जैसे
    आपका संपर्क नंबर या पता)।

    2. दस्तावेज़ जमा करें: पहचान या पते के प्रमाण के लिए आवश्यक केवाईसी दस्तावेज़
    साझा करें।

    3. सत्यापन: हम आपके द्वारा दिए गए विवरणों का बहु-स्तरीय प्रमाणीकरण करेंगे ताकि
    सुरक्षा सुनिश्चित हो सके।

    4. पुष्टि प्राप्त करें: सत्यापन सफल होने के बाद, हम आपको एक पुष्टिकरण संदेश भेजेंगे
    कि आपके खाते में बदलाव कर दिया गया है।


    कृपया ध्यान दें कि ऋण की अवधि (9 माह) या स्वीकृत राशि में बदलाव केवल विशेष प्रबंधकीय
    अनुमोदन के अधीन होते हैं ताकि ऋण अनुशासन बना रहे।


