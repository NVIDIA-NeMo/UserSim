- id: 052abbcf-cadb-5884-b05d-0a18ecf91716
  title: EMI भुगतान मैंडेट — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आपको अपने मैंडेट की स्थिति देखने या उसमें बदलाव करने के दौरान समस्याओं
    का सामना करना पड़ रहा है, तो कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: ''अनधिकृत एक्सेस'' का संदेश मिलना या प्रमाणीकरण विफल होना।


    जांच और समाधान:

    1. विवरण जांचें: सुनिश्चित करें कि आप वही पंजीकृत मोबाइल नंबर और पहचान विवरण दे
    रहे हैं जो आपके ऋण खाते से जुड़े हैं।

    2. प्रमाणीकरण त्रुटि: यदि OTP प्राप्त नहीं हो रहा है, तो नेटवर्क की जांच करें
    और पुनः प्रयास करें।

    3. KYC स्थिति: जांचें कि क्या आपका KYC अपडेटेड है, क्योंकि पुराने दस्तावेज़ एक्सेस
    को बाधित कर सकते हैं।


    यदि समस्या बनी रहती है, तो हम आपके खाते की सुरक्षा जांच के लिए एक आंतरिक मामला
    (case) दर्ज करेंगे और हमारे विशेषज्ञ आपकी पहचान सत्यापित करने के बाद एक्सेस बहाल
    करेंगे। आपको इस प्रक्रिया के पूरा होने पर एक पुष्टिकरण संदेश प्राप्त होगा।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
