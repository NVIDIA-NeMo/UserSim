- id: 1767c47c-54ac-501a-8b10-3b4c3e3e3b9d
  title: कंज्यूमर ड्यूरेबल EMI — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते में कोई ऐसा शुल्क दिखता है जिसकी आप अपेक्षा नहीं कर रहे
    थे, तो कृपया निम्नलिखित की जाँच करें:


    - लक्षण: आपके बैंक खाते से अपेक्षित EMI राशि से अधिक पैसे कट गए हैं।

    - संभावित कारण: सबसे सामान्य कारण ₹350 का विलंब भुगतान शुल्क (Late Payment Charge)
    है, जो तब लगता है जब किस्त की तारीख को खाते में पर्याप्त राशि नहीं होती है।

    - जाँच का क्रम: पहले अपने बैंक स्टेटमेंट में किस्त की तारीख और भुगतान की स्थिति
    देखें। यदि किस्त बाउंस हुई थी, तो यह शुल्क मान्य है।

    - समाधान: यदि आपको लगता है कि शुल्क गलत लगाया गया है, तो हमें सूचित करें। हम आपके
    भुगतान इतिहास की समीक्षा करेंगे।

    - अगला कदम: यदि त्रुटि पाई जाती है, तो हम मामला संबंधित टीम को भेजेंगे और शुल्क
    वापस करने की प्रक्रिया शुरू करेंगे, जिसकी पुष्टि आपको ईमेल या एसएमएस के माध्यम
    से मिलेगी।


