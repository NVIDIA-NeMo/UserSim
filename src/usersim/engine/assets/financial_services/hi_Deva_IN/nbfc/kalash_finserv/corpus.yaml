- id: 8e2e786c-3404-5493-970c-e1157d3f10db
  title: set_alerts का उपयोग कब करें
  body: 'कलश फिनसर्व अपने ग्राहकों को उनके ऋण खातों की गतिविधियों के प्रति सचेत रखने
    के लिए अलर्ट सुविधा प्रदान करता है। एजेंट को set_alerts टूल का उपयोग तब करना चाहिए
    जब ग्राहक अपनी किस्तों (EMI) की याद दिलाने, भुगतान की पुष्टि या खाते में किसी
    महत्वपूर्ण बदलाव की सूचना प्राप्त करना चाहता हो।


    प्रक्रिया के चरण:

    1. सबसे पहले verify_identity का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक ने केवल अंतिम चार अंक दिए हैं, तो get_accounts का उपयोग करके सही
    account_id प्राप्त करें।

    3. ग्राहक से पूछें कि वे किस प्रकार के अलर्ट (जैसे: EMI रिमाइंडर, भुगतान सफल)
    और किस माध्यम से प्राप्त करना चाहते हैं।

    4. निर्धारित विवरणों के साथ set_alerts टूल को कॉल करें ताकि अलर्ट सक्रिय हो सकें।


    यह प्रक्रिया सुनिश्चित करती है कि ग्राहक समय पर भुगतान करें और EMI Bounce Charge
    जैसे दंड शुल्कों से बच सकें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kalash_finserv
- id: a85e7d2a-6500-5773-93b5-ac3a3d72b9fb
  title: set_alerts टूल संदर्भ
  body: 'set_alerts टूल का उपयोग ग्राहक के खाते के लिए विशिष्ट सूचनाएं (notifications)
    और रिमाइंडर सेट करने के लिए किया जाता है। एजेंट इस टूल को सीधे कॉल करके अलर्ट
    सक्रिय करता है।


    पैरामीटर्स:

    - account_id: ग्राहक के ऋण खाते की विशिष्ट पहचान आईडी।

    - alert_type: अलर्ट का प्रकार (उदा. EMI_REMINDER, PAYMENT_CONFIRMATION)।

    - channel: सूचना भेजने का माध्यम (उदा. SMS, EMAIL)।


    प्रभाव: यह टूल ग्राहक के प्रोफाइल में अलर्ट प्राथमिकताएं अपडेट करता है जिससे उन्हें
    समय पर वित्तीय सूचनाएं मिलती रहें।'
  domain: lending_mortgage
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: kalash_finserv
- id: 52453f05-f043-5cbc-9d22-c14ba61dfa8f
  title: get_loan_details का उपयोग कब करें
  body: 'जब किसी ग्राहक को उनके ऋण की वर्तमान स्थिति, शेष राशि, लागू ब्याज दर या अन्य
    विशिष्ट विवरणों की आवश्यकता होती है, तो एजेंट को get_loan_details टूल का उपयोग
    करना चाहिए। यह टूल ऋण की पारदर्शिता बनाए रखने के लिए आवश्यक है।


    प्रक्रिया के चरण:

    1. verify_identity के माध्यम से ग्राहक की पहचान की पुष्टि करें।

    2. यदि account_id उपलब्ध नहीं है, तो get_accounts का उपयोग करके संबंधित ऋण खाता
    खोजें।

    3. ग्राहक की विशिष्ट पूछताछ (जैसे: ''मेरा कितना मूलधन बचा है?'') के आधार पर get_loan_details
    टूल कॉल करें।

    4. टूल से प्राप्त जानकारी को सरल हिंदी में ग्राहक को समझाएं।


    एजेंट को यह सुनिश्चित करना चाहिए कि वे केवल वही जानकारी साझा करें जो टूल द्वारा
    प्रदान की गई है, ताकि सटीकता बनी रहे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
