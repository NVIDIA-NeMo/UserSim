- id: 4096cf2b-70fa-5385-b769-4ed16e760212
  title: दोपहिया वाहन ऋण — स्थिति या इतिहास देखना
  body: 'यदि आप अपने दोपहिया वाहन ऋण की वर्तमान स्थिति या भुगतान इतिहास जानना चाहते
    हैं, तो इन चरणों का पालन करें:


    1. अपनी पंजीकृत पहचान (जैसे ऋण खाता संख्या या पंजीकृत मोबाइल नंबर) हमें प्रदान
    करें।

    2. हमें बताएं कि आप अपनी वर्तमान बकाया राशि (outstanding balance) देखना चाहते
    हैं या अब तक भुगतान की गई किस्तों का विवरण।

    3. हम आपके खाते का सत्यापन करेंगे और आपको आपके ऋण की वर्तमान स्थिति, जैसे कि शेष
    किश्तें और भुगतान की तारीख, की जानकारी देंगे।

    4. यदि आप विस्तृत इतिहास चाहते हैं, तो हम आपको आपका स्टेटमेंट (Statement of Account)
    प्रदान करेंगे, जिसमें हर भुगतान और ब्याज का विवरण होगा।


    इस प्रक्रिया के बाद आपको स्पष्ट रूप से पता चल जाएगा कि आपका ऋण ट्रैक पर है या
    कोई किस्त लंबित है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: a0a59707-1ddc-537a-8acc-c36199726d71
  title: दोपहिया वाहन ऋण — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपका ऋण आवेदन अस्वीकृत हो गया है या कोई प्रक्रिया अवरुद्ध (block) हो
    गई है, तो इसके संभावित कारण और समाधान नीचे दिए गए हैं:


    संभावित कारण:

    - डाउन पेमेंट की कमी: यदि आपने 15% की न्यूनतम डाउन पेमेंट सीमा को पूरा नहीं किया
    है।

    - दस्तावेज़ों में कमी: यदि KYC या आय प्रमाण पत्र अपूर्ण हैं।

    - क्रेडिट स्कोर: यदि आपका क्रेडिट इतिहास हमारी पात्रता शर्तों के अनुरूप नहीं है।


    क्या जांचें:

    1. सुनिश्चित करें कि आपके द्वारा जमा की गई डाउन पेमेंट राशि वाहन मूल्य के 15%
    के बराबर है।

    2. जांचें कि आपके सभी दस्तावेज़ स्पष्ट और अद्यतित हैं।


    समाधान:

    - यदि दस्तावेज़ अपूर्ण हैं, तो सही दस्तावेज़ प्रदान करें और हम आपके आवेदन को पुनः
    प्रोसेस करेंगे।

    - यदि डाउन पेमेंट कम है, तो शेष राशि का भुगतान करें।


    यदि समस्या बनी रहती है, तो हम इस मामले को अपनी क्रेडिट समीक्षा टीम के पास भेजेंगे,
    जो 7 कार्य दिवसों के भीतर आपको अंतिम निर्णय की सूचना देंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
