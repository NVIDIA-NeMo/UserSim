- id: 591d319c-ac54-537e-b676-c061980a850a
  title: दोपहिया वाहन ऋण — आवश्यक दस्तावेज़
  body: 'दोपहिया वाहन ऋण (two_wheeler_loan) की स्वीकृति के लिए निम्नलिखित दस्तावेज़
    अनिवार्य हैं:


    - पहचान प्रमाण: आधार कार्ड, पैन कार्ड या वोटर आईडी (अनिवार्य)।

    - पता प्रमाण: बिजली बिल, राशन कार्ड या रेंट एग्रीमेंट।

    - आय प्रमाण: पिछले 3-6 महीने का बैंक स्टेटमेंट या वेतन पर्ची (Salary Slip)।

    - वाहन विवरण: डीलर का कोटेशन पत्र।


    सभी आवेदकों के लिए सख्त KYC और बहु-स्तरीय प्रमाणीकरण अनिवार्य है ताकि सुरक्षा
    सुनिश्चित की जा सके।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
