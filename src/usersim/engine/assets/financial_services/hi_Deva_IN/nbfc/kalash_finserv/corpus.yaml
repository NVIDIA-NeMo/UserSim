- id: 7432d72e-4b16-5f8b-bbca-0a2bd234c0be
  title: व्यक्तिगत ऋण (पर्सनल लोन) — बदलाव या अद्यतन करना
  body: 'अपने व्यक्तिगत ऋण (पर्सनल लोन) खाते में विवरण अपडेट करने के लिए इन चरणों
    का पालन करें:


    1. अनुरोध करें: हमें बताएं कि आप कौन सा विवरण (जैसे पता, मोबाइल नंबर या ईमेल)
    बदलना चाहते हैं।

    2. दस्तावेज़ जमा करें: अद्यतन विवरण की पुष्टि के लिए आवश्यक KYC दस्तावेज़ (जैसे
    आधार या पैन कार्ड) हमें प्रदान करें।

    3. सत्यापन: हम आपके द्वारा प्रदान किए गए दस्तावेज़ों का बहु-स्तरीय प्रमाणीकरण
    करेंगे।

    4. पुष्टि: सत्यापन सफल होने के बाद, हम आपको सूचित करेंगे कि आपके खाते में विवरण
    अपडेट कर दिए गए हैं।


    कृपया ध्यान दें कि बैंक खाता विवरण बदलने पर आपके EMI भुगतान मैंडेट को भी अपडेट
    करना होगा ताकि ₹500 के EMI बाउंस शुल्क से बचा जा सके।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
