- id: 7deb62fa-0edf-532e-83b7-b8cd4ff81506
  title: स्वर्ण ऋण (गोल्ड लोन) — सेटअप और सक्रियण
  body: 'स्वर्ण ऋण (गोल्ड लोन) प्राप्त करने की प्रक्रिया सरल और त्वरित है। इसे सक्रिय
    करने के लिए इन चरणों का पालन करें:


    1. अपने मूल KYC दस्तावेज़ और वह सोना लेकर हमारे शाखा केंद्र पर आएं जिसे आप गिरवी
    रखना चाहते हैं।

    2. हम आपके सोने की शुद्धता और वजन की जांच करेंगे ताकि उसका वर्तमान बाजार मूल्य
    निर्धारित किया जा सके।

    3. हम आपको बताएंगे कि 75% की LTV सीमा के आधार पर आप कितनी राशि के लिए पात्र हैं।
    ध्यान दें कि न्यूनतम ऋण राशि ₹25000 होनी चाहिए।

    4. एक बार राशि तय हो जाने पर, आप ऋण समझौते और Key Fact Statement (KFS) पर हस्ताक्षर
    करें, जिसमें 11.5% की वार्षिक ब्याज दर और ₹500 का प्रोसेसिंग शुल्क स्पष्ट रूप
    से लिखा होगा।

    5. सत्यापन पूरा होने के बाद, स्वीकृत ऋण राशि सीधे आपके बैंक खाते में जमा कर दी
    जाएगी।


    सफलता की पुष्टि: जब राशि आपके खाते में क्रेडिट हो जाती है और आपको ऋण स्वीकृति
    पत्र प्राप्त हो जाता है, तो आपका ऋण सक्रिय माना जाता है।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
