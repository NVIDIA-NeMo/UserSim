- id: 6b2d68dd-e31d-52a9-8e2a-81e2e4fb6946
  title: get_repayment_schedule का उपयोग कब करें
  body: 'जब कोई ग्राहक अपने ऋण की आगामी किस्तों, भुगतान की तारीखों या शेष बकाया राशि
    के बारे में जानकारी मांगता है, तो एजेंट को get_repayment_schedule टूल का उपयोग
    करना चाहिए।


    प्रक्रिया:

    1. सबसे पहले, verify_identity टूल के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक के पास कई खाते हैं, तो get_accounts टूल का उपयोग करके संबंधित ऋण
    खाता ID (account_id) प्राप्त करें।

    3. खाता ID प्राप्त करने के बाद, get_repayment_schedule टूल कॉल करें ताकि ऋण के
    पुनर्भुगतान की पूरी समय-सारणी प्राप्त की जा सके।

    4. प्राप्त विवरणों को विनम्रतापूर्वक ग्राहक के साथ साझा करें, जिसमें किस्त की
    राशि और देय तिथियां स्पष्ट हों।


    इस टूल का उपयोग तब करें जब ग्राहक को अपनी वित्तीय योजना बनाने के लिए भविष्य के
    भुगतान विवरणों की आवश्यकता हो।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_repayment_schedule
  institution_id: kalash_finserv
- id: 58fee3b8-de47-571a-b592-201aa1cc57f4
  title: get_repayment_schedule टूल संदर्भ
  body: 'टूल नाम: get_repayment_schedule

    विवरण: यह टूल किसी विशिष्ट ऋण खाते के लिए पूर्ण पुनर्भुगतान समय-सारणी (repayment
    schedule) प्राप्त करता है।

    तर्क (Arguments):

    - account_id (अनिवार्य): वह विशिष्ट ऋण खाता आईडी जिसके लिए समय-सारणी चाहिए।


    प्रभाव: यह टूल आगामी किस्तों, देय तिथियों और शेष मूलधन का विवरण प्रदान करता है।
    एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है।'
