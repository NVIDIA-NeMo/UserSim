- id: 2630672e-509b-51b2-b05b-9177b4e5dc3c
  title: EMI भुगतान मैंडेट — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते में कोई ऐसा शुल्क या राशि दिखती है जिसकी आप अपेक्षा नहीं
    कर रहे थे, तो कृपया निम्नलिखित जाँच करें:


    1. क्या आपके खाते से ₹500 कटे हैं? यदि हाँ, तो जाँचें कि क्या किस्त की तारीख को
    आपके खाते में पर्याप्त राशि थी। यदि राशि कम थी, तो यह एक EMI Bounce Charge है।

    2. क्या यह राशि आपकी नियमित किस्त है? अपनी ऋण किस्तों की तारीख और राशि की पुष्टि
    करें।

    3. क्या आपने हाल ही में मैंडेट में कोई बदलाव किया है? याद रखें कि किसी भी संशोधन
    को लागू होने में 3 दिन लगते हैं।


    यदि आपको लगता है कि शुल्क गलत लगाया गया है, तो हमें विवरण दें। हम इसकी समीक्षा
    करेंगे और यदि त्रुटि पाई जाती है, तो RBI के टर्न-अराउंड-टाइम (TAT) ढांचे के अनुसार
    इसका त्वरित समाधान करेंगे। हमारे विशेषज्ञ आपकी शिकायत को आंतरिक स्तर पर एस्केलेट
    करेंगे और आपको समाधान की समय-सीमा सूचित करेंगे।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
