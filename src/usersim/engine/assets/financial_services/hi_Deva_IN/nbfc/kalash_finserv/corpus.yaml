- id: e90bb36d-9ef4-545d-8ec2-feb54e897a62
  title: EMI भुगतान मैंडेट — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपका मैंडेट सेटअप या संशोधन अनुरोध अस्वीकृत या अवरुद्ध हो जाता है, तो
    कृपया नीचे दिए गए चरणों का पालन करें:


    लक्षण: आपको संदेश मिलता है कि ''मैंडेट अनुरोध अस्वीकृत'' कर दिया गया है या कार्रवाई
    अवरुद्ध है।


    संभावित कारण:

    - केवाईसी (KYC) दस्तावेजों का अधूरा होना या पुराना होना।

    - बैंक खाते का विवरण (IFSC कोड या खाता संख्या) गलत होना।

    - आपके बैंक द्वारा डिजिटल मैंडेट को अनुमति न देना।


    समाधान प्रक्रिया:

    1. सबसे पहले अपने बैंक खाते के विवरण की पुनः जांच करें।

    2. सुनिश्चित करें कि आपके द्वारा प्रदान किए गए दस्तावेज़ नवीनतम हैं।

    3. यदि विवरण सही हैं, तो हमसे अनुरोध करें कि हम बैंक से विफलता का सटीक कारण पता
    करें।


    यदि समस्या बनी रहती है, तो हम आपके मामले को अपनी विशेषज्ञ टीम को भेजेंगे। हम RBI
    के टर्न-अराउंड-टाइम (TAT) ढांचे के भीतर समाधान प्रदान करेंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
