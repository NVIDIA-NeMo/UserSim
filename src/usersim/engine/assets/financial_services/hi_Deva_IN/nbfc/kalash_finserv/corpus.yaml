- id: 7eb61cf0-e1cf-53f7-8b5d-58ba42ac92ce
  title: EMI भुगतान मैंडेट — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'कलश फिनसर्व के ग्राहकों को सचेत किया जाता है कि कुछ जालसाज ''EMI भुगतान मैंडेट''
    अपडेट करने या बाउंस शुल्क माफ करने के बहाने आपको निशाना बना सकते हैं। वे आपसे
    कॉल या मैसेज पर आपका UPI PIN, OTP या CVV मांग सकते हैं। कृपया याद रखें कि कलश
    फिनसर्व आपसे कभी भी ये गोपनीय विवरण नहीं मांगेगा।


    एक सामान्य स्कैम यह है जहाँ जालसाज दावा करते हैं कि आपके मैंडेट में कोई तकनीकी
    खराबी है और इसे ठीक करने के लिए आपको एक लिंक पर क्लिक करना होगा या एक विशिष्ट
    राशि ''सत्यापन'' के लिए भेजनी होगी। ऐसे किसी भी अनुरोध पर विश्वास न करें।


    यदि आपको कोई संदिग्ध कॉल या संदेश मिलता है, तो तुरंत हमें सूचित करें। किसी भी
    अनधिकृत लेन-देन की रिपोर्टिंग तुरंत करना आवश्यक है ताकि हम चार्जबैक प्रक्रिया
    शुरू कर सकें। आपकी सुरक्षा हमारी प्राथमिकता है और हम डेटा गोपनीयता का पूर्ण सम्मान
    करते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
