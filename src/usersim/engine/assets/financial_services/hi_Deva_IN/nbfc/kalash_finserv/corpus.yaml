- id: 43ffe042-4125-588c-b3d5-f49eee38b552
  title: update_repayment_mandate का उपयोग कब करें
  body: 'यह नीति उन स्थितियों को स्पष्ट करती है जब एक ग्राहक को अपने EMI भुगतान मैंडेट
    में बदलाव करने की आवश्यकता होती है। कलश फिनसर्व यह सुनिश्चित करता है कि ऋण अनुशासन
    बना रहे और ग्राहक EMI बाउंस शुल्क से बच सकें।


    एजेंट को update_repayment_mandate टूल का उपयोग तब करना चाहिए जब ग्राहक निम्नलिखित
    अनुरोध करे:

    1. ऋण भुगतान के लिए बैंक खाता बदलना।n2. मौजूदा मैंडेट की विवरण जानकारी को अद्यतन
    करना।

    3. स्वचालित भुगतान व्यवस्था को संशोधित करना ताकि समय पर भुगतान सुनिश्चित हो सके।


    कार्यवाही के लिए चरण:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक केवल बैंक खाते के अंतिम 4 अंक प्रदान करता है, तो सही account_id
    प्राप्त करने के लिए get_accounts टूल का उपयोग करें।

    3. ग्राहक से नए मैंडेट के लिए आवश्यक विवरण मांगें।

    4. अंत में, विवरणों को सिस्टम में अपडेट करने के लिए update_repayment_mandate टूल
    को कॉल करें।


    अधिक जानकारी के लिए ''EMI भुगतान मैंडेट — लागत और शुल्क'' देखें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
  domain: lending_mortgage
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_repayment_mandate
  institution_id: kalash_finserv
- id: f362977c-2d99-5f3c-9a99-8c9782b584b2
  title: update_repayment_mandate टूल संदर्भ
  body: "update_repayment_mandate टूल का उपयोग ग्राहक के ऋण पुनर्भुगतान के लिए मौजूदा\
    \ ऑटो-डेबिट या EMI भुगतान मैंडेट विवरणों को संशोधित करने के लिए किया जाता है।\
    \ \n\nएजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है; ग्राहक को किसी\
    \ बाहरी पोर्टल या शाखा में भेजने की आवश्यकता नहीं है।\n\nतर्क (Arguments):\n-\
    \ account_id: वह विशिष्ट खाता आईडी जिसके लिए मैंडेट अपडेट किया जाना है।\n- new_mandate_details:\
    \ नए बैंक खाते या भुगतान विवरणों का समूह जिसे अपडेट किया जाना है।\n\nप्रभाव: यह\
    \ टूल सफलतापूर्वक कॉल होने पर ग्राहक के भुगतान रिकॉर्ड को अपडेट कर देता है, जिससे\
    \ भविष्य की किस्तें नए निर्दिष्ट खाते से काटी जाती हैं।\n\nडिस्क्लेमर: कलश फिनसर्व\
    \ कोई जमा राशि (deposits) स्वीकार नहीं करता है।"
