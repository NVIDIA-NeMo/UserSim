  institution_id: kalash_finserv
- id: 20b92df5-4db6-513c-ab13-8a0014f6c17b
  title: EMI भुगतान मैंडेट — वर्तमान ऑफर
  body: 'विशेष ऑफर: कलश फिनसर्व अपने मौजूदा ग्राहकों को डिजिटल अनुशासन अपनाने के लिए
    प्रोत्साहित कर रहा है। यदि आप 1 नवंबर 2023 से 31 दिसंबर 2023 के बीच अपना EMI भुगतान
    मैंडेट सक्रिय करते हैं और लगातार 3 किस्तों का सफल भुगतान करते हैं, तो आप हमारे
    लॉयल्टी रिवॉर्ड्स के पात्र हो सकते हैं।


    कृपया ध्यान दें कि यह ऑफर केवल नए मैंडेट पंजीकरण पर लागू है। बाउंस शुल्क ₹500
    इस ऑफर के दौरान भी लागू रहेगा यदि खाता पर्याप्त रूप से वित्त पोषित नहीं है।'
