- id: abae255d-904a-57d8-8a6c-08ac48526576
  title: दोपहिया वाहन ऋण — डाउन पेमेंट प्रतिशत की व्याख्या
  body: 'प्रश्न: दोपहिया वाहन ऋण के लिए मुझे कितना डाउन पेमेंट करना होगा?

    उत्तर: कलश फिनसर्व के दोपहिया वाहन ऋण (two_wheeler_loan) के तहत, आपको वाहन की
    कुल कीमत का 15% डाउन पेमेंट के रूप में देना होता है। शेष राशि को ऋण के रूप में
    वित्तपोषित किया जाता है, जिसे आप 36 महीने की अवधि में किस्तों में चुका सकते हैं।
    विस्तृत शुल्क जानकारी के लिए आप ''दोपहिया वाहन ऋण — लागत और शुल्क'' देख सकते हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
