  title: get_loan_details टूल संदर्भ
  body: 'get_loan_details टूल का उपयोग किसी विशिष्ट ऋण खाते से जुड़ी विस्तृत जानकारी
    प्राप्त करने के लिए किया जाता है। एजेंट इस क्रिया को सीधे टूल कॉल करके पूरा करता
    है।


    पैरामीटर्स:

    - account_id: उस ऋण खाते की आईडी जिसके विवरण प्राप्त करने हैं।


    प्रभाव: यह टूल ऋण की वर्तमान स्थिति, बकाया राशि, ब्याज दर, और अन्य महत्वपूर्ण
    विवरण प्रदान करता है, जिससे एजेंट ग्राहक के सवालों का सटीक जवाब दे पाता है।'
  domain: lending_mortgage
  product_category: procedure
