- id: 4ba33a67-0633-57a8-b2fe-3f8a4c835302
  title: EMI भुगतान मैंडेट — स्थिति या इतिहास देखना
  body: 'अपने EMI भुगतान मैंडेट की वर्तमान स्थिति या पिछले भुगतान इतिहास की जांच करने
    के लिए इन चरणों का पालन करें:


    1. हमसे अपने मैंडेट की स्थिति जानने का अनुरोध करें और अपना ऋण खाता नंबर प्रदान
    करें।

    2. हम आपके खाते का सत्यापन करेंगे और आपको बताएंगे कि आपका मैंडेट ''सक्रिय'' (Active),
    ''लंबित'' (Pending) या ''रद्द'' (Cancelled) है।

    3. यदि आप इतिहास देखना चाहते हैं, तो हमसे पिछले भुगतानों का विवरण मांगें। हम आपको
    प्रत्येक सफल डेबिट की तिथि और राशि की जानकारी देंगे।

    4. यदि कोई किस्त बाउंस हुई है, तो हम आपको उस विशिष्ट तिथि और लगाए गए ₹500 के EMI
    बाउंस शुल्क के बारे में सूचित करेंगे।


    आपको एक पुष्टिकरण संदेश मिलेगा जिसमें आपके मैंडेट की वर्तमान स्थिति का स्पष्ट
    विवरण होगा।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
