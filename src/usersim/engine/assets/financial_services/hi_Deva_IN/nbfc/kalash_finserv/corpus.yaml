- id: 70038c90-eeaf-5fe8-9cb1-3c8e025faaa7
  title: व्यक्तिगत ऋण (पर्सनल लोन) — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'कलश फिनसर्व का व्यक्तिगत ऋण (पर्सनल लोन) उन मध्यम और निम्न आय वाले परिवारों
    के लिए डिज़ाइन किया गया है जिन्हें बिना किसी विशेष गारंटी के तत्काल वित्तीय सहायता
    की आवश्यकता है।


    यह उत्पाद निम्नलिखित उपयोगों के लिए सबसे उपयुक्त है:

    - घर की मरम्मत या नवीनीकरण के लिए।

    - अचानक आए चिकित्सा खर्चों को पूरा करने के लिए।

    - बच्चों की शिक्षा या फीस का भुगतान करने के लिए।

    - अन्य महंगे ऋणों को एक जगह समेकित करने के लिए।


    मुख्य विवरण:

    - वार्षिक ब्याज दर: 14.5%

    - प्रोसेसिंग शुल्क: 2%

    - अधिकतम अवधि: 60 महीने

    - फोरक्लोज़र शुल्क: 4%

    - EMI बाउंस शुल्क: ₹500


    हम त्वरित स्वीकृति और पूर्ण पारदर्शिता सुनिश्चित करते हैं ताकि आप अपनी तत्काल
    जरूरतों को बिना किसी तनाव के पूरा कर सकें। हर ऋण के साथ एक ''Key Fact Statement
    (KFS)'' प्रदान किया जाता है जिसमें कुल वार्षिक लागत का स्पष्ट विवरण होता है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
