- id: 0584ce7b-992b-5495-a9ee-969e51c070eb
  title: व्यक्तिगत ऋण (पर्सनल लोन) — स्थिति या इतिहास देखना
  body: 'अपने व्यक्तिगत ऋण (पर्सनल लोन) की वर्तमान स्थिति या भुगतान इतिहास जानने के
    लिए इन चरणों का पालन करें:


    1. हमसे अपने ऋण खाते का विवरण मांगें।

    2. हम आपसे आपकी पहचान सत्यापित करने के लिए आपका पंजीकृत मोबाइल नंबर या ग्राहक
    आईडी मांगेंगे।

    3. सत्यापन सफल होने के बाद, हम आपको आपके ऋण की वर्तमान स्थिति (जैसे: सक्रिय, बंद,
    या विलंबित) बताएंगे।

    4. यदि आप भुगतान इतिहास चाहते हैं, तो हमें बताएं; हम आपको अब तक भुगतान की गई सभी
    किस्तों और शेष राशि का विवरण प्रदान करेंगे।

    5. अंत में, हम आपको पुष्टि करेंगे कि आपका रिकॉर्ड अपडेटेड है और आपके पास विवरण
    पहुँच गया है।


    आप अपने ऋण की कुल वार्षिक लागत और ब्याज विवरण के लिए व्यक्तिगत ऋण (पर्सनल लोन)
    — नियामक प्रकटीकरण भी देख सकते हैं।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
