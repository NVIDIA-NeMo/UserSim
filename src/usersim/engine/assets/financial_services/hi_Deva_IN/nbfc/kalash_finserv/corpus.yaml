- id: e06e7e0b-6f36-5968-979a-c4c4cc9ebdcd
  title: व्यक्तिगत ऋण (पर्सनल लोन) — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक का दावा है कि उनके द्वारा भुगतान की गई EMI उनके ऋण स्टेटमेंट
    में नहीं दिख रही है या ब्याज दर गलत दिखाई दे रही है।


    जांच के चरण:

    1. भुगतान की तारीख और लेनदेन संदर्भ संख्या (Transaction ID) की पुष्टि करें।

    2. जांचें कि क्या भुगतान सही ऋण खाता संख्या में जमा किया गया है।

    3. ब्याज दर की पुष्टि करें कि वह 14.5% वार्षिक के अनुरूप है या नहीं।


    समाधान:

    - यदि भुगतान हो चुका है लेकिन अपडेट नहीं हुआ है, तो हम बैंक स्टेटमेंट के आधार
    पर रिकॉर्ड को मैन्युअल रूप से अपडेट करेंगे।

    - यदि कोई गणना त्रुटि है, तो हम विवरण को संशोधित करेंगे और ग्राहक को अपडेटेड स्टेटमेंट
    भेजेंगे।


    यदि विवरण में अंतर का समाधान तुरंत नहीं होता है, तो हम इसे हमारे लेखा विभाग (Accounts
    Dept) को भेजेंगे और 7 कार्य दिवसों के भीतर समाधान प्रदान करेंगे।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
