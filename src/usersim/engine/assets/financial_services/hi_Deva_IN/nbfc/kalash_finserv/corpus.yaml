  title: स्वर्ण ऋण (गोल्ड लोन) — नियामक प्रकटीकरण
  body: 'कलश फिनसर्व RBI के फेयर प्रैक्टिस कोड और डिजिटल लेंडिंग दिशा-निर्देशों का
    कड़ाई से पालन करता है। स्वर्ण ऋण (गोल्ड लोन) के संबंध में निम्नलिखित प्रकटीकरण
    अनिवार्य हैं:


    1. कुल लागत: प्रत्येक ग्राहक को एक ''Key Fact Statement (KFS)'' प्रदान किया जाएगा,
    जिसमें 11.5% की वार्षिक ब्याज दर और ₹500 के प्रोसेसिंग शुल्क सहित ऋण की कुल वार्षिक
    लागत का विवरण होगा।

    2. वसूली प्रक्रिया: हम केवल ''Non-coercive Collection'' (गैर-दबावपूर्ण वसूली)
    का पालन करते हैं, जिसका अर्थ है कि ऋण वसूली की प्रक्रिया बिना किसी मानसिक या शारीरिक
    दबाव के की जाएगी।

    3. ऋण सीमा: स्वीकृत ऋण राशि आपके सोने के बाजार मूल्य के 75% (LTV) से अधिक नहीं
    हो सकती।

    4. अवधि: ऋण की अधिकतम अवधि 12 महीने निर्धारित है।


    हम डेटा गोपनीयता का पूर्ण सम्मान करते हैं और सख्त KYC प्रक्रियाओं का पालन करते
    हैं।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
