- id: 8744b185-f6fd-5a73-a3b6-d8042bc2ead2
  title: स्वर्ण ऋण (गोल्ड लोन) — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'कलश फिनसर्व में आपकी सुरक्षा हमारी प्राथमिकता है। स्वर्ण ऋण (गोल्ड लोन) लेते
    समय कुछ स्कैमर्स आपसे संपर्क कर सकते हैं जो त्वरित स्वीकृति या कम ब्याज दर का
    लालच देते हैं। कृपया ध्यान दें कि हम आपसे कभी भी आपका UPI PIN, OTP या CVV साझा
    करने के लिए नहीं कहेंगे।


    एक सामान्य धोखाधड़ी का तरीका यह है कि जालसाज आपको कॉल करके कहते हैं कि आपके सोने
    के मूल्यांकन (valuation) के लिए एक मामूली शुल्क ऑनलाइन जमा करना होगा। हम स्पष्ट
    करते हैं कि हमारा ₹500 का प्रोसेसिंग शुल्क केवल आधिकारिक प्रक्रिया का हिस्सा है
    और इसे किसी व्यक्तिगत खाते में जमा नहीं किया जाता है।


    यदि आपको कोई संदिग्ध कॉल या संदेश मिलता है, तो तुरंत हमें सूचित करें। धोखाधड़ी
    के मामलों को हम त्वरित रिपोर्टिंग और चार्जबैक प्रक्रिया के माध्यम से हल करते हैं।
    किसी भी अनधिकृत गतिविधि की सूचना जितनी जल्दी देंगे, समाधान उतना ही प्रभावी होगा।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
