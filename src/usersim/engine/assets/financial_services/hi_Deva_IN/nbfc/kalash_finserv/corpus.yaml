  title: व्यक्तिगत ऋण (पर्सनल लोन) — शर्तों में बदलाव की नीति
  body: "कलश फिनसर्व को बाजार की स्थितियों या नियामक परिवर्तनों के आधार पर व्यक्तिगत\
    \ ऋण (पर्सनल लोन) की शर्तों को संशोधित करने का अधिकार है। \n\nशर्तों में बदलाव\
    \ की प्रक्रिया:\n1. सूचना अवधि: किसी भी महत्वपूर्ण बदलाव, जैसे कि 14.5% की वार्षिक\
    \ ब्याज दर में परिवर्तन, के लिए हम ग्राहकों को कम से कम 30 दिन पहले सूचित करेंगे।\n\
    2. शुल्क संशोधन: प्रोसेसिंग शुल्क (2%) या फोरक्लोज़र शुल्क (4%) में किसी भी बदलाव\
    \ की सूचना लिखित रूप में दी जाएगी।\n3. स्वीकृति: यदि आप संशोधित शर्तों से सहमत\
    \ नहीं हैं, तो आप ऋण को फोरक्लोज़ कर सकते हैं, जिस पर लागू फोरक्लोज़र शुल्क देय\
    \ होगा।\n\nहम RBI के फेयर प्रैक्टिस कोड का पालन करते हैं ताकि पारदर्शिता बनी रहे।\
    \ ऋण अनुशासन बनाए रखने के लिए, केवल विशेष प्रबंधकीय अनुमोदन के अधीन ही शुल्कों\
    \ को माफ किया जाएगा।\n\nडिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार\
    \ नहीं करता है।"
