  body: "जब आप स्वर्ण ऋण (गोल्ड लोन) के लिए विभिन्न विकल्पों की तुलना कर रहे हों,\
    \ तो सावधानी बरतना आवश्यक है। जालसाज अक्सर 'बिना किसी शुल्क' या 'बाज़ार से बहुत\
    \ कम ब्याज दर' का लालच देकर ग्राहकों को आकर्षित करते हैं। \n\nकृपया ध्यान दें\
    \ कि कलश फिनसर्व के प्रतिनिधि आपसे कभी भी आपका UPI PIN, OTP या CVV साझा करने के\
    \ लिए नहीं कहेंगे। यदि कोई व्यक्ति आपको कॉल करके कहता है कि वह आपके स्वर्ण ऋण\
    \ की प्रोसेसिंग फीस (जो कि ₹500 है) को माफ कर देगा यदि आप उसे एक गुप्त कोड भेजें,\
    \ तो यह एक धोखाधड़ी है। \n\nएक अन्य सामान्य स्कैम में जालसाज आपसे आपके सोने के\
    \ गहनों को 'मूल्यांकन' के लिए किसी तीसरे पक्ष को भेजने के लिए कह सकते हैं। याद\
