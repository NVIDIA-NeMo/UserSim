- id: 182a6436-50b0-5fb0-bed3-e94ecca794b8
  title: EMI भुगतान मैंडेट — आपके रिकॉर्ड या विवरण में अंतर
  body: 'जब एक ग्राहक रिपोर्ट करता है कि उनके बैंक स्टेटमेंट और कलश फिनसर्व के रिकॉर्ड
    में अंतर है, तो सहायता एजेंट को निम्नलिखित प्रक्रिया अपनानी चाहिए:


    1. ग्राहक से उनके बैंक स्टेटमेंट की प्रति मांगें जिसमें विवादित डेबिट या बाउंस
    शुल्क दिख रहा हो।

    2. हमारे आंतरिक रिकॉर्ड में उस विशिष्ट तिथि के लेन-देन की जांच करें।

    3. यदि बैंक ने राशि काट ली है लेकिन हमारे रिकॉर्ड में वह ''विफल'' दिख रहा है,
    तो बैंक के साथ मिलान (reconciliation) शुरू करें।

    4. यदि ₹500 का EMI बाउंस शुल्क गलत तरीके से लगाया गया है (उदा. तकनीकी विफलता के
    कारण), तो इसे प्रबंधकीय अनुमोदन के लिए भेजें।

    5. यदि विवरण में कोई त्रुटि मिलती है, तो उसे सुधारें। याद रखें कि मैंडेट संशोधन
    प्रोसेसिंग अवधि 3 दिन है।


    समाधान होने पर ग्राहक को एक लिखित पुष्टिकरण प्रदान करें और सुनिश्चित करें कि उनका
    ऋण खाता अपडेट हो गया है।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
