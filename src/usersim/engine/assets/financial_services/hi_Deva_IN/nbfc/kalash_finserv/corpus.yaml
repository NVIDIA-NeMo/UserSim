- id: 0ef294af-7899-5848-bf7f-3ed9ba4cd86f
  title: दोपहिया वाहन ऋण — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'यदि आप अपने दोपहिया वाहन ऋण के लिए आवेदन से लेकर वितरण तक की पूरी प्रक्रिया
    जानना चाहते हैं, तो इन चरणों का पालन करें:


    1. अपनी पसंदीदा बाइक/स्कूटर का विवरण और उसकी कुल कीमत हमें बताएं।

    2. वाहन कीमत का 15% डाउन पेमेंट जमा करें और अपना KYC विवरण (आधार, पैन, आय प्रमाण)
    प्रदान करें।

    3. हम आपके दस्तावेजों का सत्यापन करेंगे और ₹1500 का प्रोसेसिंग शुल्क लागू करेंगे।

    4. हम आपको एक ''Key Fact Statement'' प्रदान करेंगे जिसमें 12.9% वार्षिक ब्याज
    दर और 36 महीने की अवधि का स्पष्ट विवरण होगा। इसे ध्यान से पढ़ें और अपनी सहमति
    दें।

    5. हम आपके बैंक खाते में ऋण राशि वितरित करेंगे या सीधे डीलर को भुगतान करेंगे।

    6. समय पर भुगतान सुनिश्चित करने के लिए ''EMI भुगतान मैंडेट — सिंहावलोकन'' के अनुसार
    स्वचालित भुगतान व्यवस्था सेट करें।


    प्रक्रिया पूरी होने पर आपको ऋण स्वीकृति पत्र और भुगतान अनुसूची प्राप्त होगी।


