- id: cb6bbedb-eaa4-53f6-9e7f-78f22c7dff5e
  title: दोपहिया वाहन ऋण — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'कलश फिनसर्व के ग्राहकों को सचेत किया जाता है कि कुछ जालसाज ''दोपहिया वाहन
    ऋण'' की त्वरित स्वीकृति का लालच देकर धोखाधड़ी करने का प्रयास कर सकते हैं। अक्सर
    स्कैमर्स आपको कॉल या मैसेज करके कह सकते हैं कि आपका ऋण स्वीकृत हो गया है, लेकिन
    फाइल चार्ज या बीमा के नाम पर आपसे अग्रिम राशि (advance payment) की मांग करेंगे।


    कृपया ध्यान दें कि कलश फिनसर्व कभी भी ऋण राशि वितरित करने से पहले आपसे किसी व्यक्तिगत
    खाते में पैसे ट्रांसफर करने को नहीं कहता है। हम आपसे आपका UPI PIN, OTP या CVV
    साझा करने के लिए कभी नहीं कहेंगे। यदि कोई व्यक्ति आपसे इन विवरणों की मांग करता
    है, तो वह एक स्कैमर हो सकता है।


    यदि आपको कोई संदिग्ध कॉल या संदेश प्राप्त होता है, तो तुरंत हमें इसकी रिपोर्ट
    करें। धोखाधड़ी के मामलों को हम तुरंत रिपोर्टिंग और चार्जबैक प्रक्रिया के माध्यम
    से हल करते हैं। सतर्क रहें और सुरक्षित रहें।


    डिस्क्लेमर: हम कोई जमा राशि (deposits) स्वीकार नहीं करते हैं।'
