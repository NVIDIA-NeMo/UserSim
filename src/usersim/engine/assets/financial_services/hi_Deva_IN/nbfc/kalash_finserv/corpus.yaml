- id: 60772c2b-0c28-5258-9306-5a7c1765b8d0
  title: दोपहिया वाहन ऋण — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने ऋण आवेदन या किस्त भुगतान के दौरान किसी समस्या का सामना करना
    पड़ रहा है, तो कृपया निम्नलिखित जाँच करें:


    लक्षण: ऋण आवेदन लंबित है या अस्वीकृत हो गया है।

    कारण: अक्सर यह अधूरे केवाईसी (KYC) दस्तावेज़ों या डाउन पेमेंट (15%) के अपर्याप्त
    भुगतान के कारण होता है।

    समाधान: कृपया सुनिश्चित करें कि सभी दस्तावेज़ स्पष्ट हैं और आवश्यक राशि जमा कर
    दी गई है। हम आपके दस्तावेज़ों की पुनः समीक्षा करेंगे और स्थिति अपडेट करेंगे।


    लक्षण: EMI भुगतान विफल हो गया है।

    कारण: खाते में पर्याप्त राशि न होना या मैंडेट में समस्या।

    समाधान: अपने बैंक खाते की शेष राशि जाँचें। यदि राशि पर्याप्त है, तो हमें सूचित
    करें; हम आपके बैंक के साथ समन्वय कर समस्या का समाधान करेंगे।


    यदि समस्या बनी रहती है, तो हम इसे आंतरिक रूप से एस्केलेट करेंगे और आपको निर्धारित
    टर्न-अराउंड-टाइम (TAT) के भीतर समाधान प्रदान करेंगे।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 6dfd6ae1-afbf-5192-9cce-a59e1972b1ed
  title: दोपहिया वाहन ऋण — पात्रता शर्तें
  body: 'दोपहिया वाहन ऋण के लिए पात्रता मानदंड निम्नलिखित हैं:


    - डाउन पेमेंट क्षमता: वाहन की कुल कीमत का न्यूनतम 15% भुगतान करने में सक्षम।

    - पुनर्भुगतान अवधि: अधिकतम 36 महीने तक की अवधि के लिए किस्तों का भुगतान करने की
    क्षमता।

    - दस्तावेज़ीकरण: वैध केवाईसी (KYC) और आय का प्रमाण प्रदान करने में सक्षम।


    यदि आप इन शर्तों को पूरा करते हैं, तो आप ऋण के लिए पात्र हैं। अधिक जानकारी के
    लिए ''दोपहिया वाहन ऋण — आवश्यक दस्तावेज़'' देखें।'
  domain: lending_mortgage
  product_category: two_wheeler_loan
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: kalash_finserv
- id: 230f949c-47ab-599c-a8f2-1d2a7a7747ed
  title: दोपहिया वाहन ऋण — यहाँ के समान उत्पाद से तुलना
  body: 'यदि आप हमारे उत्पादों के बीच तुलना कर रहे हैं, तो दोपहिया वाहन ऋण और व्यक्तिगत
    ऋण (पर्सनल लोन) के बीच मुख्य अंतर यहाँ दिए गए हैं:


    - दोपहिया वाहन ऋण: यह विशेष रूप से वाहन खरीदने के लिए है। इसमें 12.9% की वार्षिक
    ब्याज दर है और इसके लिए 15% डाउन पेमेंट आवश्यक है। यह उन लोगों के लिए सबसे अच्छा
    है जिन्हें वाहन के लिए किस्तों की सुविधा चाहिए।

    - व्यक्तिगत ऋण: यह बिना किसी विशेष गारंटी के लचीला विकल्प है। इसका उपयोग किसी
    भी व्यक्तिगत जरूरत के लिए किया जा सकता है।


    वाहन खरीदने के उद्देश्य के लिए ''दोपहिया वाहन ऋण'' अधिक उपयुक्त और किफायती है
    क्योंकि यह विशिष्ट परिसंपत्ति आधारित ऋण है।'
