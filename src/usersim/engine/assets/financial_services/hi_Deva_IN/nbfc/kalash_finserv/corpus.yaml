- id: c107c0f3-1540-5fb5-8eb7-9fe2bdda9274
  title: कंज्यूमर ड्यूरेबल EMI — आवश्यक दस्तावेज़
  body: 'कंज्यूमर ड्यूरेबल EMI प्राप्त करने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पहचान का प्रमाण (ID Proof): आधार कार्ड, पैन कार्ड या वोटर आईडी (अनिवार्य)।

    - पते का प्रमाण (Address Proof): बिजली बिल, राशन कार्ड या आधार कार्ड।

    - आय का प्रमाण: पिछले 3 महीने का बैंक स्टेटमेंट या वेतन पर्ची (पात्रता जांच के
    लिए)।

    - फोटो: हालिया पासपोर्ट आकार की तस्वीर।


    इन दस्तावेज़ों के सफल सत्यापन (KYC) के बाद ही 0% ब्याज दर और 9 महीने की अवधि वाला
    ऋण स्वीकृत किया जाएगा।'
