- id: a0118fdd-52c9-570b-9387-0d41a68e9399
  title: कंज्यूमर ड्यूरेबल EMI — सिंहावलोकन
  body: 'कलश फिनसर्व का कंज्यूमर ड्यूरेबल EMI एक समावेशी ऋण समाधान है, जिसे मध्यम
    और निम्न आय वाले परिवारों के लिए डिज़ाइन किया गया है। यह उत्पाद आपको महंगे इलेक्ट्रॉनिक
    सामानों और घरेलू उपकरणों को बिना किसी ब्याज बोझ के अपनी पसंद के अनुसार खरीदने
    की सुविधा देता है।


    इस उत्पाद की मुख्य विशेषताएं और शुल्क निम्नलिखित हैं:

    - वार्षिक ब्याज दर: 0% (बिना किसी ब्याज के आसान किस्तें)

    - ऋण की अवधि: 9 माह

    - प्रोसेसिंग शुल्क: ₹499 (एक बार देय)

    - विलंब भुगतान शुल्क: ₹350 (प्रत्येक विलंबित किस्त पर)


    हम पूर्ण पारदर्शिता में विश्वास करते हैं, इसलिए हर ऋण के साथ एक ''Key Fact Statement
    (KFS)'' प्रदान किया जाता है, जिससे आप कुल वार्षिक लागत को स्पष्ट रूप से समझ सकें।
    हमारा लक्ष्य आपको त्वरित स्वीकृति प्रदान करना है ताकि आपकी तत्काल वित्तीय जरूरतें
    पूरी हो सकें।


    डिस्क्लेमर: कलश फिनसर्व कोई जमा राशि (deposits) स्वीकार नहीं करता है।'
