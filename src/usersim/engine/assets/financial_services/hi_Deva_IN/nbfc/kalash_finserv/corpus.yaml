- id: 331ec845-396e-5f6e-b685-2aa62bd0891f
  title: request_gold_loan_topup का उपयोग कब करें
  body: 'जब स्वर्ण ऋण (गोल्ड लोन) के मौजूदा ग्राहक अपनी वर्तमान ऋण सीमा को बढ़ाने या
    अतिरिक्त राशि का अनुरोध करते हैं, तो एजेंट को request_gold_loan_topup टूल का उपयोग
    करना चाहिए।


    प्रक्रिया:

    1. verify_identity टूल का उपयोग करके ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts टूल का उपयोग करके ग्राहक के सक्रिय स्वर्ण ऋण खाता आईडी (account_id)
    की पहचान करें।

    3. ग्राहक से वांछित टॉप-अप राशि के बारे में पूछें।

    4. request_gold_loan_topup टूल कॉल करें। यह टूल मौजूदा संपार्श्विक (सोने) के बाजार
    मूल्य और Loan-to-Value (LTV) सीमाओं की जांच करेगा।

    5. यदि पात्रता है, तो ग्राहक को टॉप-अप की स्वीकृति और लागू शर्तों के बारे में
    सूचित करें।


    यह प्रक्रिया केवल तभी शुरू करें जब ग्राहक के पास पहले से ही एक सक्रिय स्वर्ण ऋण
    खाता हो।'
