  title: कंज्यूमर ड्यूरेबल EMI — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'कंज्यूमर ड्यूरेबल EMI के लिए दर संरचना अत्यंत सरल और सभी ग्राहकों के लिए
    समान है। इसमें कोई श्रेणीबद्ध (tiered) दरें नहीं हैं।


    - वार्षिक ब्याज दर: 0%। यह दर सभी पात्र ग्राहकों और सभी ऋण राशियों पर समान रूप
    से लागू होती है।

    - लागू होने की विधि: यह दर ऋण की पूरी 9 महीने की अवधि के लिए स्थिर रहती है।


    चूंकि यह एक शून्य-ब्याज उत्पाद है, इसलिए ब्याज दर में कोई बदलाव नहीं होता है।
    केवल विलंब भुगतान की स्थिति में ₹350 का दंड शुल्क लागू होगा, जो ब्याज नहीं बल्कि
    एक जुर्माना है।'
