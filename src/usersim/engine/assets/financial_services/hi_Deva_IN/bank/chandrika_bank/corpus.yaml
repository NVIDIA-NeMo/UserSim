  institution_id: chandrika_bank
- id: b82f26d8-2bc5-56a7-96e5-e84f12a449bd
  title: आवर्ती जमा (RD) — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'चंद्रिका बैंक का आवर्ती जमा (RD) उन मध्यम वर्ग के परिवारों और व्यक्तियों
    के लिए एक आदर्श समाधान है जो एक साथ बड़ी राशि निवेश करने के बजाय अनुशासित तरीके
    से छोटी-छोटी मासिक बचत करना चाहते हैं।


    यह उत्पाद उन ग्राहकों के लिए सबसे उपयुक्त है जो भविष्य के लक्ष्यों, जैसे बच्चों
    की शिक्षा, त्यौहारों या किसी विशेष खरीदारी के लिए एक निश्चित कोष बनाना चाहते हैं।


    मुख्य विशेषताएं और वित्तीय विवरण:

    - न्यूनतम मासिक किस्त: ₹500

    - निश्चित अवधि: 24 माह

    - वार्षिक ब्याज दर: 6.8%

    - किस्त चूकने पर जुर्माना: ₹10 प्रति किस्त


    यह उत्पाद बचत खाते की तुलना में अधिक ब्याज प्रदान करता है और सावधि जमा (FD) की
    तुलना में लचीला है क्योंकि इसमें एकमुश्त राशि की आवश्यकता नहीं होती। यह उन लोगों
    के लिए बेहतरीन है जो अपनी मासिक आय से एक हिस्सा सुरक्षित रूप से निवेश करना चाहते
    हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: dce8015c-7ebf-5998-aed1-45537a704ca8
  title: आवर्ती जमा (RD) — अवधि (माह) की व्याख्या
  body: 'प्रश्न: मेरे आवर्ती जमा (RD) खाते की अवधि क्या है और इसका क्या अर्थ है?

    उत्तर: आपके आवर्ती जमा (RD) खाते की अवधि 24 माह है। इसका अर्थ है कि आपको इस समय
    सीमा तक हर महीने एक निश्चित राशि जमा करनी होगी। इस अवधि के पूरा होने पर, आपकी
    कुल जमा राशि और उस पर अर्जित 6.8% ब्याज आपको भुगतान कर दिया जाएगा।


    प्रश्न: क्या मैं इस अवधि को बदल सकता हूँ?

    उत्तर: नहीं, यह एक निश्चित अवधि का निवेश है। समय-पूर्व बंद करने के नियम आवर्ती
    जमा (RD) — खाता अनुबंध में दिए गए हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 88d9a652-3d48-5dfc-9348-6f419a2a1da2
  title: आवर्ती जमा (RD) — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी आवर्ती जमा (RD) को समय से पहले बंद करना चाहते हैं, तो इन चरणों
    का पालन करें:


    1. हमें अपना खाता नंबर और बंद करने का कारण बताएं।

    2. हम आपके PAN और आधार-आधारित KYC सत्यापन की पुष्टि करेंगे।

    3. हम आपको सूचित करेंगे कि समयपूर्व निकासी के कारण आपकी अर्जित ब्याज दर पर क्या
    प्रभाव पड़ेगा और कितना ''समयपूर्व निकासी दंड'' लगाया जाएगा।

    4. अपनी सहमति प्रदान करें।

    5. हम खाते को बंद कर देंगे और शेष राशि, दंड काटकर, आपके लिंक किए गए बचत खाते में
    जमा कर देंगे।


    पुष्टि: आपको एक एसएमएस और ईमेल प्राप्त होगा जिसमें बंद किए गए खाते का विवरण और
    क्रेडिट की गई अंतिम राशि का उल्लेख होगा।


    कृपया ध्यान दें कि यदि आप अपनी बचत रणनीति बदलना चाहते हैं, तो आप एक बार 1-वर्षीय
    सावधि जमा (FD) — सिंहावलोकन के विकल्पों पर विचार कर सकते हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: deeff3fb-9841-53a7-b6a4-649adaef1f95
  title: आवर्ती जमा (RD) — अनपेक्षित शुल्क या राशि
  body: 'यदि आप अपने खाते के विवरण में कोई अनपेक्षित शुल्क या राशि का अंतर देखते हैं,
    तो निम्नलिखित चरणों का पालन करें:


    संभावित कारण:

    - किस्त समय पर जमा न होने के कारण ₹10 का जुर्माना लगाया गया हो।n- समयपूर्व निकासी
    के कारण दंड काटा गया हो।


    जाँच के चरण:

    1. अपना नवीनतम स्टेटमेंट देखें और जाँचें कि क्या किसी महीने की किस्त छूट गई थी।

    2. यदि किस्त छूटी है, तो ₹10 का जुर्माना मानक शुल्क है।

    3. यदि किस्त समय पर जमा हुई थी फिर भी शुल्क कटा है, तो हमें सूचित करें।


    समाधान:

    हम आपके लेनदेन इतिहास की समीक्षा करेंगे। यदि शुल्क गलती से लगाया गया है, तो हम
    उसे आपके खाते में वापस जमा (Reverse) कर देंगे। यदि समस्या का समाधान तुरंत नहीं
    होता है, तो हम इसे आंतरिक शिकायत अधिकारी के पास भेजेंगे और आवश्यकतानुसार RBI लोकपाल
    तक ले जाया जाएगा।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c1130c1e-d9d5-5a5b-97ce-9e23125978c5
  title: आवर्ती जमा (RD) — आवश्यक दस्तावेज़
  body: 'आवर्ती जमा (RD) खाता खोलने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पहचान का प्रमाण: PAN कार्ड (अनिवार्य) और आधार कार्ड।

    - पते का प्रमाण: आधार कार्ड या हालिया उपयोगिता बिल (बिजली/पानी)।

    - फोटोग्राफ: दो नवीनतम पासपोर्ट साइज फोटो।

    - बैंक खाता: एक सक्रिय चंद्रिका बैंक बचत खाता (किस्त ऑटो-डेबिट के लिए)।


    परिणाम: इन सभी दस्तावेजों के सफल सत्यापन (KYC) के बाद ही ₹500 की न्यूनतम मासिक
    किस्त के साथ खाता खोला जा सकता है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: da66da8b-c9e2-5476-a6b6-78fab864e9a2
  title: आवर्ती जमा (RD) — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'चंद्रिका बैंक का आवर्ती जमा (RD) अन्य संस्थानों की तुलना में अधिक पारदर्शी
    है। जहाँ कई प्रतिस्पर्धी बैंक जटिल ब्याज गणना और छिपे हुए शुल्क रखते हैं, हम 24
    माह की अवधि के लिए एक स्थिर 6.8% वार्षिक ब्याज दर प्रदान करते हैं।


    मुख्य अंतर:

    - लागत: हमारा किस्त चूकने का जुर्माना केवल ₹10 है, जो बाजार की औसत दरों से काफी
    कम और किफायती है।

    - सुरक्षा: हम DICGC द्वारा ₹5,00,000 तक का बीमा कवर सुनिश्चित करते हैं।


    यह उत्पाद उन ग्राहकों के लिए बेहतर है जो बिना किसी जटिलता के निश्चित रिटर्न चाहते
    हैं, जबकि उच्च जोखिम वाले बाजार निवेश उन लोगों के लिए हो सकते हैं जिन्हें अधिक
    उतार-चढ़ाव स्वीकार्य है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f7e259da-0f11-5408-bffd-87b497fa1ebf
  title: आवर्ती जमा (RD) — जोखिम प्रकटीकरण
  body: 'इस आवर्ती जमा (RD) उत्पाद में निवेश करने से पहले कृपया निम्नलिखित नियामक
    प्रकटीकरणों को ध्यान से पढ़ें:


    1. तरलता जोखिम: यह एक निश्चित अवधि (24 माह) का निवेश है। यदि आप समय से पहले धन
    निकालते हैं, तो आपको समयपूर्व निकासी दंड का सामना करना होगा और ब्याज दर कम हो
    सकती है।

    2. जमा सुरक्षा: आपकी जमा राशि ₹5,00,000 तक DICGC बीमा द्वारा सुरक्षित है। इस सीमा
    से अधिक की राशि नियामक सुरक्षा के अधीन नहीं है।

    3. शुल्क प्रकटीकरण: मासिक किस्त जमा न करने पर ₹10 का जुर्माना लगाया जाता है।

    4. ब्याज दर: 6.8% की वार्षिक दर खाता खोलने के समय तय की जाती है और पूरी अवधि के
    लिए स्थिर रहती है।


    हम केवल अपने उत्पादों की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं;
    हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं। यह निवेश बैंक की मानक शर्तों
    और ग्राहक की पात्रता के आधार पर निष्पक्ष रूप से किया जाता है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 88dae638-0be3-5d8b-b0d6-2e065965d492
  title: आवर्ती जमा (RD) — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'चंद्रिका बैंक के आवर्ती जमा (RD) के लिए एक सरल और पारदर्शी ब्याज संरचना लागू
    है।


    वर्तमान दर: सभी ग्राहकों के लिए एक समान 6.8% की वार्षिक ब्याज दर लागू होती है।


    लागू करने का तरीका:

    - यह दर आपके द्वारा जमा की गई प्रत्येक मासिक किस्त पर लागू होती है।

    - ब्याज की गणना चक्रवृद्धि आधार पर की जाती है और परिपक्वता (24 माह के अंत) पर
    मूलधन के साथ भुगतान किया जाता है।

    - इस दर में कोई श्रेणीबद्ध (tier-based) अंतर नहीं है; यह ₹500 की न्यूनतम किस्त
    से लेकर अधिकतम सीमा तक सभी के लिए समान है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e2660732-870f-56cc-a84e-6d1545021f85
  title: आवर्ती जमा (RD) — रेफरल और लॉयल्टी ऑफर
  body: चंद्रिका बैंक के साथ अपनी बचत की यात्रा को और अधिक लाभदायक बनाएं! यदि आप अपने
    किसी मित्र या परिवार के सदस्य को हमारे आवर्ती जमा (RD) खाते के लिए रेफर करते हैं
    और वे ₹500 की न्यूनतम मासिक किस्त के साथ खाता खोलते हैं, तो आप दोनों को ₹100 का
    लॉयल्टी बोनस मिलेगा। यह ऑफर 1 नवंबर 2024 से 31 दिसंबर 2024 तक वैध है। यह आपके
    भविष्य के लक्ष्यों को पूरा करने का एक शानदार अवसर है। नियम और शर्तें लागू।
  domain: retail_banking
  product_category: recurring_deposit
  document_type: promo_notice
  source_authority: official
