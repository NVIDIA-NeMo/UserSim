- id: bb740d89-0826-5bc7-8c9b-e48d48332116
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — रेफरल और लॉयल्टी ऑफर
  body: अपने दोस्तों और परिवार को चंद्रिका बैंक के साथ जुड़ने के लिए आमंत्रित करें!
    यदि आप किसी नए ग्राहक को 'चंद्रिका एवरीडे क्रेडिट कार्ड' के लिए रेफर करते हैं
    और उनका कार्ड सफलतापूर्वक जारी हो जाता है, तो आपको ₹500 का रेफरल बोनस मिलेगा।
    यह ऑफर 1 जनवरी 2024 से 31 दिसंबर 2024 तक वैध है। इसके अतिरिक्त, हमारे वफादार ग्राहकों
    के लिए, यदि आप पिछले एक वर्ष में ₹1,50,000 से अधिक का खर्च करते हैं, तो आपका वार्षिक
    शुल्क पूरी तरह माफ कर दिया जाएगा। आज ही साझा करें और लाभ उठाएं!
  domain: cards
  product_category: chandrika_credit_card
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 474606b0-0603-5e86-8416-50ebdab4c7c3
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके चंद्रिका एवरीडे क्रेडिट कार्ड की सुरक्षा हमारी प्राथमिकता है। कृपया
    ध्यान दें कि चंद्रिका बैंक के प्रतिनिधि आपसे कभी भी आपका UPI PIN, OTP, या कार्ड
    का CVV साझा करने के लिए नहीं कहेंगे।


    सुरक्षित बैंकिंग के लिए इन प्रथाओं का पालन करें:

    1. अपने कार्ड का पिन समय-समय पर बदलते रहें।

    2. किसी भी अज्ञात लिंक पर क्लिक करके अपनी कार्ड जानकारी दर्ज न करें।

    3. यदि आपको कोई संदिग्ध लेनदेन दिखता है, तो तुरंत हमें सूचित करें।


    धोखाधड़ी की रिपोर्टिंग के लिए हम RBI के समय-सीमा ढांचे (turn-around-time) का पालन
    करते हैं। किसी भी अनधिकृत गतिविधि की सूचना मिलने पर, हम प्राथमिकता के आधार पर
    मामले की जांच करेंगे और गंभीर मामलों को तुरंत चार्जबैक प्रक्रिया के लिए नियामक
    पथ पर भेजेंगे। सुरक्षा संबंधी अधिक जानकारी के लिए ''चंद्रिका एवरीडे क्रेडिट कार्ड
    — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा'' देखें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: dc6b7e36-682f-58ba-8d9d-e6573cae3112
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — शर्तों में बदलाव की नीति
  body: "चंद्रिका बैंक को परिचालन लागत और नियामक आवश्यकताओं के आधार पर 'चंद्रिका एवरीडे\
    \ क्रेडिट कार्ड' की शर्तों में बदलाव करने का अधिकार है। \n\nमुख्य शर्तें:\n- शुल्क\
    \ परिवर्तन: जॉइनिंग शुल्क ₹500 और वार्षिक शुल्क ₹500 में किसी भी बदलाव की सूचना\
    \ ग्राहकों को 30 दिन पहले दी जाएगी।\n- ब्याज दरें: मासिक वित्त प्रभार 3.5% और\
    \ वार्षिक वित्त प्रभार 42% बाजार की स्थितियों के अनुसार बदल सकते हैं।\n- शुल्क\
    \ माफी: वार्षिक शुल्क माफी के लिए आवश्यक ₹1,50,000 की खर्च सीमा को बैंक किसी भी\
    \ समय संशोधित कर सकता है।\n\nकिसी भी बदलाव के प्रभावी होने से पहले आपको ईमेल या\
    \ एसएमएस के माध्यम से सूचित किया जाएगा। यदि आप संशोधित शर्तों से सहमत नहीं हैं,\
    \ तो आप अपना कार्ड बंद करने का अनुरोध कर सकते हैं। यह अनुबंध बैंक और ग्राहक दोनों\
    \ के लिए बाध्यकारी है जब तक कि कार्ड बंद न कर दिया जाए।"
  domain: cards
  product_category: chandrika_credit_card
  document_type: terms_conditions
