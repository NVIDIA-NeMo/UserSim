- id: 2d2531a0-ece6-5665-84f2-8226827036c5
  title: UPI और बिल भुगतान — गोपनीयता और डेटा प्रबंधन
  body: 'चंद्रिका बैंक आपके डेटा की गोपनीयता और सुरक्षा के प्रति प्रतिबद्ध है। ''UPI
    और बिल भुगतान'' सेवा का उपयोग करते समय, हम NPCI और RBI के डेटा सुरक्षा दिशानिर्देशों
    का कड़ाई से पालन करते हैं।


    हम आपके लेनदेन डेटा को केवल सेवा वितरण, धोखाधड़ी की रोकथाम और नियामक रिपोर्टिंग
    के उद्देश्यों के लिए संसाधित करते हैं। आपके जमा पर DICGC द्वारा ₹5,00,000 तक का
    बीमा कवर शामिल है, जो आपकी जमा राशि की सुरक्षा सुनिश्चित करता है।


    हमारा डेटा प्रबंधन ढांचा यह सुनिश्चित करता है कि आपकी व्यक्तिगत जानकारी केवल अधिकृत
    कर्मियों और नियामक अधिकारियों के साथ साझा की जाए। हम ग्राहकों को अपना UPI PIN
    या OTP किसी के साथ साझा न करने की कड़ी सलाह देते हैं। किसी भी डेटा संबंधी विवाद
    की स्थिति में, मामला आंतरिक शिकायत अधिकारी से होते हुए RBI लोकपाल तक जा सकता है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 189882fc-de52-5598-9c7a-ee80769f9b9d
  title: UPI और बिल भुगतान — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'चंद्रिका बैंक अपने ग्राहकों की सुरक्षा के लिए प्रतिबद्ध है। UPI और बिल भुगतान
    का उपयोग करते समय, कृपया इन सामान्य स्कैम से सावधान रहें:


    1. ''पैसे प्राप्त करने'' के लिए PIN मांगना: यह सबसे आम धोखा है। याद रखें, पैसे
    प्राप्त करने के लिए आपको कभी भी अपना UPI PIN दर्ज करने की आवश्यकता नहीं होती है।

    2. फर्जी क्यूआर (QR) कोड: स्कैमर आपको पैसे भेजने का झांसा देकर एक QR कोड स्कैन
    करने को कह सकते हैं, जिससे आपके खाते से पैसे कट सकते हैं।

    3. स्क्रीन शेयरिंग ऐप्स: कोई भी बैंक कर्मचारी आपसे AnyDesk या TeamViewer जैसे
    ऐप्स डाउनलोड करने के लिए नहीं कहेगा।


    चंद्रिका बैंक आपसे कभी भी आपका UPI PIN, OTP या पासवर्ड साझा करने के लिए नहीं कहेगा।
    यदि आपको कोई संदिग्ध गतिविधि दिखती है, तो तुरंत हमें सूचित करें। हम RBI के समय-सीमा
    ढांचे के अनुसार धोखाधड़ी की रिपोर्टिंग का पालन करते हैं। त्वरित कार्रवाई आपके
    हितों की रक्षा करने में मदद करती है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: security_advisory
