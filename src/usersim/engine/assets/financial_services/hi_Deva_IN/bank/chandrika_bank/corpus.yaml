- id: dcf566df-d7d3-5c6f-a5f9-b5da6f778618
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — वार्षिक वित्त प्रभार की व्याख्या
  body: 'प्रश्न: वार्षिक वित्त प्रभार क्या है?

    उत्तर: वार्षिक वित्त प्रभार वह वार्षिक दर है जिस पर बकाया राशि पर ब्याज की गणना
    की जाती है। चंद्रिका एवरीडे क्रेडिट कार्ड के लिए यह वार्षिक दर 42% है।


    प्रश्न: क्या यह शुल्क हर साल लिया जाता है?

    उत्तर: नहीं, यह वार्षिक शुल्क से अलग है। यह केवल तभी लागू होता है जब आप अपने क्रेडिट
    कार्ड के बिल का पूरा भुगतान नहीं करते हैं। यह आपके मासिक 3.5% प्रभार का वार्षिक
    रूप है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2bb86e0d-b30b-53c1-b4bb-3dd773ce0e13
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'यदि आप अपने चंद्रिका एवरीडे क्रेडिट कार्ड के वार्षिक शुल्क (₹500) की माफी
    के लिए अनुरोध करना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें अपने कार्ड विवरण के साथ अनुरोध भेजें कि आप अपनी वार्षिक खर्च सीमा की जाँच
    करना चाहते हैं।

    2. हम आपके पिछले 12 महीनों के खर्चों का विश्लेषण करेंगे।

    3. यदि हमारा रिकॉर्ड यह पुष्टि करता है कि आपने ₹1,50,000 की निर्धारित खर्च सीमा
    पूरी कर ली है, तो हम शुल्क माफी के लिए आपकी पात्रता की पुष्टि करेंगे।

    4. हम आपके खाते में ₹500 के वार्षिक शुल्क को क्रेडिट (रिवर्स) करेंगे या यदि शुल्क
    अभी तक नहीं लगा है, तो उसे माफ कर देंगे।

    5. हम आपको एक पुष्टिकरण संदेश भेजेंगे कि शुल्क माफी सफलतापूर्वक लागू कर दी गई
    है।


    यदि आपका खर्च ₹1,50,000 से कम है, तो हम आपको सूचित करेंगे कि शुल्क लागू रहेगा,
    और आप इस राशि का भुगतान अपने अगले बिल चक्र में कर सकते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5593faa4-2f48-5c3c-be95-749eb7e52c43
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: आपको लगता है कि आपके क्रेडिट कार्ड स्टेटमेंट में कोई लेनदेन गलत है,
    या आपके रिवॉर्ड पॉइंट्स (1% की दर से) सही ढंग से क्रेडिट नहीं हुए हैं।


    जाँच के चरण:

    1. अपने स्टेटमेंट की तुलना अपने व्यक्तिगत खर्च रिकॉर्ड से करें और उस विशिष्ट लेनदेन
    की तारीख और राशि की पहचान करें जिसमें अंतर है।

    2. जाँचें कि क्या वह लेनदेन किसी ऐसी श्रेणी का है जिसमें रिवॉर्ड्स लागू नहीं होते
    हैं।

    3. यदि अंतर अभी भी बना हुआ है, तो हमें वह लेनदेन विवरण प्रदान करें जिसे आप विवादित
    करना चाहते हैं।


    समाधान और निवारण:

    - हम विवरणों की समीक्षा करेंगे और यदि त्रुटि पाई जाती है, तो हम उसे तुरंत ठीक
    करेंगे।

    - यदि मामला जटिल है, तो हम इसे RBI के समय-सीमा ढांचे (turn-around-time) के अनुसार
    औपचारिक विवाद प्रक्रिया में डालेंगे।

    - गंभीर मामलों को तुरंत चार्जबैक और नियामक पथ पर भेजा जाता है।

    - समाधान होने पर, आपको ईमेल या संदेश के माध्यम से सूचित किया जाएगा कि राशि या
    रिवॉर्ड पॉइंट्स वापस कर दिए गए हैं।'
