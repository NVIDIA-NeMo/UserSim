- id: 5444cd88-26bb-5467-a0b8-14fe78558dbc
  title: 1-वर्षीय सावधि जमा (FD) — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: '1-वर्षीय सावधि जमा (FD) के लिए ब्याज दरों का निर्धारण ग्राहक की श्रेणी के
    आधार पर किया जाता है। इस उत्पाद के लिए कोई बैलेंस-आधारित टियर नहीं है; एक ही दर
    सभी जमा राशियों पर लागू होती है बशर्ते न्यूनतम जमा ₹10,000 हो।


    - सामान्य नागरिक: 7.1% वार्षिक ब्याज दर।

    - वरिष्ठ नागरिक: 7.6% वार्षिक ब्याज दर (7.1% मानक दर + 0.5% अतिरिक्त लाभ)।


    ये दरें जमा की तारीख से पूरे 12 महीने की अवधि के लिए प्रभावी रहती हैं। यदि जमा
    राशि को समय से पहले निकाला जाता है, तो प्रभावी ब्याज दर में 1% की कटौती की जाती
    है।'
