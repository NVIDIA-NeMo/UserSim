- id: 414f9784-6e0b-5025-9e49-17fc7b244dc4
  title: UPI और बिल भुगतान — शुरुआत कैसे करें
  body: 'चंद्रिका बैंक के ''UPI और बिल भुगतान'' सेवा का उपयोग शुरू करने के लिए निम्नलिखित
    प्रक्रिया का पालन करें। यह सेवा ग्राहकों को NPCI रेल के माध्यम से त्वरित और सुरक्षित
    भुगतान अनुभव प्रदान करती है।


    मुख्य सीमाएं और विशेषताएं:

    - प्रति लेनदेन सीमा: ₹1,00,000

    - दैनिक लेनदेन सीमा: ₹1,00,000

    - UPI Lite प्रति लेनदेन सीमा: ₹500

    - AFA के बिना ऑटोपे मैंडेट सीमा: ₹15,000


    सक्रियण प्रक्रिया:

    1. सुनिश्चित करें कि आपका मोबाइल नंबर बैंक खाते से लिंक है और आपके पास एक सक्रिय
    डेबिट कार्ड है।

    2. अपनी पहचान सत्यापित करने के लिए PAN और आधार-आधारित KYC सत्यापन अनिवार्य है।

    3. अपनी UPI आईडी बनाएं और अपना सुरक्षित UPI PIN सेट करें।

    4. अब आप बिल भुगतान और फंड ट्रांसफर शुरू कर सकते हैं।


    यह उत्पाद मध्यम वर्ग के परिवारों के लिए दैनिक खर्चों के प्रबंधन का एक सरल और डिजिटल
    साधन है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
