  institution_id: chandrika_bank
- id: d44bd1e7-f277-5c33-991e-3697b80aaf15
  title: नियमित बचत खाता — बचत ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरे नियमित बचत खाते पर कितनी ब्याज दर मिलती है?

    उत्तर: नियमित बचत खाते में जमा राशि पर 3.5% की वार्षिक ब्याज दर प्रदान की जाती
    है।


    प्रश्न: यह ब्याज कब जमा किया जाता है?

    उत्तर: ब्याज की गणना आपके दैनिक शेष के आधार पर की जाती है और बैंक की मानक शर्तों
    के अनुसार समय-समय पर आपके खाते में जमा किया जाता है। अधिक विवरण के लिए ''नियमित
    बचत खाता — ब्याज दर अनुसूची'' देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
