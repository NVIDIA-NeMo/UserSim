- id: ebad9c8c-c35b-5895-9003-0f808dd13747
  title: UPI और बिल भुगतान — सिंहावलोकन
  body: 'चंद्रिका बैंक का ''UPI और बिल भुगतान'' समाधान आपको NPCI रेल के माध्यम से
    त्वरित, सुरक्षित और डिजिटल भुगतान का अनुभव प्रदान करता है। यह सेवा आपके दैनिक
    खर्चों और बिलों के भुगतान को सरल बनाने के लिए डिज़ाइन की गई है।


    इस सेवा की मुख्य सीमाएँ और विशेषताएं निम्नलिखित हैं:

    - प्रति लेनदेन UPI सीमा: ₹100000

    - दैनिक UPI लेनदेन सीमा: ₹100000

    - UPI Lite प्रति लेनदेन सीमा: ₹500

    - AFA (अतिरिक्त प्रमाणीकरण) के बिना ऑटोपे मैंडेट की अधिकतम सीमा: ₹15000


    यह सेवा हमारे ग्राहकों को बिना किसी परेशानी के तत्काल फंड ट्रांसफर और यूटिलिटी
    बिल भुगतान की सुविधा देती है। हम सुरक्षा के उच्चतम मानकों का पालन करते हैं ताकि
    आपके लेनदेन सुरक्षित रहें। अधिक जानकारी के लिए कृपया ''UPI और बिल भुगतान — पात्रता
    शर्तें'' देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
