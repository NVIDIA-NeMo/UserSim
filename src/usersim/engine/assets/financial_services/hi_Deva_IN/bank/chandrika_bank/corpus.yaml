- id: e7683635-8233-53a9-b443-11f7a4da32cb
  title: 1-वर्षीय सावधि जमा (FD) — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपकी 1-वर्षीय सावधि जमा (FD) के विवरण (जैसे ब्याज दर
    या परिपक्वता राशि) आपके रिकॉर्ड से अलग हैं, तो कृपया यह प्रक्रिया अपनाएं:


    जाँच के चरण:

    1. अपनी मूल FD रसीद की जाँच करें और देखें कि क्या आपने वरिष्ठ नागरिक श्रेणी के
    तहत आवेदन किया था (जिसमें 0.5% की अतिरिक्त दर मिलती है)।

    2. यह जाँचें कि क्या आपने समय-पूर्व निकासी की थी, जिससे 1% का जुर्माना लागू हुआ
    हो।

    3. पुष्टि करें कि जमा की गई राशि न्यूनतम ₹10,000 की शर्त को पूरा करती थी।


    समाधान:

    - यदि अंतर अभी भी बना हुआ है, तो हमें विवरण के साथ सूचित करें।

    - हम आपके खाते के इतिहास और लागू ब्याज दरों (7.1% आधार दर) का मिलान करेंगे।

    - यदि कोई गणना त्रुटि पाई जाती है, तो हम उसे तुरंत ठीक करेंगे और आपको संशोधित
    विवरण भेजेंगे।

    - किसी भी विवाद की स्थिति में, हम RBI के समय-सीमा ढांचे का पालन करते हुए मामले
    को प्राथमिकता के आधार पर हल करेंगे।'
