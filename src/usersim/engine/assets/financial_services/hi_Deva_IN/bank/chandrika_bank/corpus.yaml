- id: b79e1581-7808-599a-987e-d48d8b9e0820
  title: manage_authorized_users टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के खाते से जुड़े अधिकृत उपयोगकर्ताओं की सूची को प्रबंधित
    करने की क्षमता प्रदान करता है।


    **टूल विवरण:**

    - **टूल का नाम:** manage_authorized_users

    - **कार्य:** इस टूल का उपयोग नए अधिकृत उपयोगकर्ताओं को जोड़ने, मौजूदा उपयोगकर्ताओं
    को हटाने या उनकी पहुंच सीमाओं को बदलने के लिए किया जाता है।

    - **प्रभाव:** स्थिति परिवर्तनकारी (state_changing)।


    एजेंट इस कार्रवाई को पूरा करने के लिए सीधे टूल को कॉल करता है, जिससे ग्राहक को
    बाहरी पोर्टल पर जाने की आवश्यकता नहीं होती है।'
