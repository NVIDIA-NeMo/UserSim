  mentions_tools: []
  institution_id: chandrika_bank
- id: b223db20-93d7-5a91-ad97-b6f29e397417
  title: 1-वर्षीय सावधि जमा (FD) — खाता अनुबंध
  body: 'यह अनुबंध ग्राहक और चंद्रिका बैंक के बीच 1-वर्षीय सावधि जमा (FD) की शर्तों
    को निर्धारित करता है।


    1. जमा शर्तें: इस खाते के लिए न्यूनतम जमा राशि ₹10,000 अनिवार्य है। जमा की अवधि
    ठीक 12 महीने (tenure) होगी।

    2. ब्याज दर: बैंक इस जमा पर 7.1% की वार्षिक ब्याज दर प्रदान करेगा। पात्र वरिष्ठ
    नागरिकों के लिए इस दर में 0.5% की अतिरिक्त वृद्धि की जाएगी।

    3. समयपूर्व निकासी: यदि ग्राहक 12 महीने की परिपक्वता अवधि से पहले जमा राशि निकालता
    है, तो लागू ब्याज दर पर 1% का समयपूर्व निकासी दंड लगाया जाएगा।

    4. सत्यापन: खाता खोलने और संचालन के लिए वैध PAN और आधार-आधारित KYC पूर्ण होना
    अनिवार्य है।

    5. अनुबंध की समाप्ति: यह अनुबंध जमा की परिपक्वता तिथि पर या समयपूर्व निकासी के
    अनुरोध पर समाप्त होगा। बैंक RBI के दिशानिर्देशों के अनुसार शर्तों में बदलाव का
    अधिकार सुरक्षित रखता है, जिसकी सूचना ग्राहकों को दी जाएगी।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: terms_conditions
  source_authority: official
