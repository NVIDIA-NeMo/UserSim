- id: a7b40d2e-4845-59f3-b667-a7c414e204c1
  title: 1-वर्षीय सावधि जमा (FD) — आवश्यक दस्तावेज़
  body: '1-वर्षीय सावधि जमा (FD) खोलने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    | दस्तावेज़ का प्रकार | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | पहचान प्रमाण | PAN कार्ड | अनिवार्य (KYC सत्यापन हेतु) |

    | पता प्रमाण | आधार कार्ड | अनिवार्य (KYC सत्यापन हेतु) |

    | न्यूनतम जमा | ₹10,000 | खाता खोलने के लिए आवश्यक राशि |

    | आयु प्रमाण | सरकारी आईडी | वरिष्ठ नागरिक दर (अतिरिक्त 0.5%) प्राप्त करने हेतु
    आवश्यक |'
