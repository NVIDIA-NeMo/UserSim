- id: b3d30b93-cdc5-5e80-8336-6e5c32348c85
  title: UPI और बिल भुगतान — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'चंद्रिका बैंक ''UPI और बिल भुगतान'' के लिए एक पारदर्शी शुल्क ढांचा अपनाता
    है। वर्तमान में, व्यक्तिगत ग्राहकों के लिए मानक UPI लेनदेन और बिल भुगतान पर कोई
    अतिरिक्त शुल्क नहीं लगाया जाता है।


    लागू सीमाएं:

    - सामान्य UPI सीमा: ₹100,000 (दैनिक और प्रति लेनदेन)।

    - UPI Lite सीमा: ₹500 (प्रति लेनदेन)।

    - ऑटोपे (बिना AFA): ₹15,000 तक की सीमा।


    ये दरें और सीमाएं सभी व्यक्तिगत बचत खाताधारकों पर समान रूप से लागू होती हैं, चाहे
    उनका बैलेंस कुछ भी हो। किसी भी बदलाव की स्थिति में, अपडेटेड शुल्क अनुसूची जारी
    की जाएगी।'
