  mentions_tools: []
  institution_id: chandrika_bank
- id: dd27f606-73f1-5b65-a76d-bb71305717e8
  title: UPI और बिल भुगतान — खाता अनुबंध
  body: 'यह अनुबंध चंद्रिका बैंक और ग्राहक के बीच ''UPI और बिल भुगतान'' सेवा के उपयोग
    को नियंत्रित करता है। ग्राहक यह स्वीकार करता है कि वह NPCI और RBI के सभी दिशानिर्देशों
    का पालन करेगा।


    लेनदेन सीमाएं: बैंक प्रति लेनदेन ₹100,000 की अधिकतम सीमा और ₹100,000 की दैनिक
    कुल सीमा निर्धारित करता है। UPI Lite के लिए प्रति लेनदेन सीमा ₹500 है। बिना AFA
    (Additional Factor Authentication) के ऑटोपे मैंडेट की अधिकतम सीमा ₹15,000 निर्धारित
    है। इन सीमाओं का उल्लंघन करने वाले लेनदेन अस्वीकृत कर दिए जाएंगे।


    बैंक इन सीमाओं या नियमों में बदलाव करने का अधिकार सुरक्षित रखता है, जिसकी सूचना
    ग्राहक को उचित समय पूर्व दी जाएगी। यह सेवा तब तक प्रभावी रहेगी जब तक ग्राहक इसे
    बंद नहीं करता या बैंक सुरक्षा कारणों से इसे निलंबित नहीं करता। किसी भी विवाद की
    स्थिति में, बैंक आंतरिक शिकायत अधिकारी और उसके बाद RBI लोकपाल की प्रक्रिया का
    पालन करेगा।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: terms_conditions
  source_authority: official
