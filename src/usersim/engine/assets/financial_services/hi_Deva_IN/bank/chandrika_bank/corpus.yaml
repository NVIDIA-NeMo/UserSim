- id: 108a4efa-a31d-546a-8b97-9f2575688624
  title: UPI और बिल भुगतान — सेटअप और सक्रियण
  body: 'अपने खाते के लिए ''UPI और बिल भुगतान'' सेवा को सक्रिय करने के लिए इन चरणों
    का पालन करें:


    1. हमें सूचित करें कि आप UPI सेवा सक्रिय करना चाहते हैं।

    2. हम आपके PAN और आधार-आधारित KYC सत्यापन की पुष्टि करेंगे। यह प्रक्रिया सुरक्षा
    मानकों के लिए अनिवार्य है।

    3. अपना वह मोबाइल नंबर प्रदान करें जो आपके बैंक खाते से लिंक है।

    4. हम आपके मोबाइल नंबर पर एक सत्यापन लिंक या निर्देश भेजेंगे, जिसके बाद आप अपनी
    UPI ID बना सकेंगे।

    5. अपना UPI PIN सेट करें। याद रखें, सुरक्षा के लिए अपना UPI PIN या OTP कभी किसी
    के साथ साझा न करें।


    एक बार जब आप सफलतापूर्वक अपना पहला छोटा लेनदेन पूरा कर लेते हैं या अपनी UPI ID
    सक्रिय देख लेते हैं, तो आपकी सेवा चालू हो जाएगी।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
