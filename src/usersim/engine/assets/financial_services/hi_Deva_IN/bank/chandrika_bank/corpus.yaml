- id: 89906146-f72a-5da9-8dc4-4d84d9b6eadd
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — शुरुआत कैसे करें
  body: 'सपोर्ट एजेंटों के लिए निर्देश: ग्राहक को चंद्रिका एवरीडे क्रेडिट कार्ड के
    साथ शुरू करने में सहायता करने के लिए निम्नलिखित चरणों का पालन करें:


    1. पात्रता और केवाईसी: सबसे पहले ग्राहक का PAN और आधार-आधारित KYC सत्यापन सुनिश्चित
    करें। यह अनिवार्य प्रक्रिया है।

    2. शुल्क स्पष्टता: ग्राहक को बताएं कि इस कार्ड का जॉइनिंग शुल्क ₹500 है और वार्षिक
    शुल्क ₹500 है।

    3. लाभ समझाएं: ग्राहक को 1% की रिवॉर्ड दर के बारे में जानकारी दें जो उनके खर्चों
    पर लागू होती है।

    4. खर्च सीमा: उन्हें सूचित करें कि यदि वे वर्ष में ₹1,50,000 खर्च करते हैं, तो
    उनका वार्षिक शुल्क माफ हो जाएगा।

    5. वित्त प्रभार: स्पष्ट करें कि बकाया राशि पर 3.5% मासिक वित्त प्रभार (42% वार्षिक)
    लागू होगा।


    एक बार जब ग्राहक सभी शर्तों से सहमत हो जाता है और दस्तावेज जमा कर देता है, तो
    आवेदन प्रक्रिया पूरी करें और कार्ड जारी होने की समय-सीमा साझा करें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 017a4467-184b-56a5-96c2-91b70378a62a
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — वार्षिक शुल्क माफी हेतु आवश्यक खर्च की व्याख्या
  body: 'प्रश्न: क्या मैं अपने चंद्रिका एवरीडे क्रेडिट कार्ड का वार्षिक शुल्क माफ
    करवा सकता हूँ?

    उत्तर: हाँ, यदि आप एक कैलेंडर वर्ष के भीतर अपने कार्ड से कुल ₹1,50,000 या उससे
    अधिक का खर्च करते हैं, तो आपका ₹500 का वार्षिक शुल्क माफ कर दिया जाएगा।


    प्रश्न: क्या शुल्क माफी तुरंत लागू होती है?

    उत्तर: नहीं, वार्षिक खर्च की सीमा ₹1,50,000 पूरी होने के बाद, अगले बिलिंग चक्र
    में शुल्क माफी या क्रेडिट समायोजित किया जाता है। अधिक विवरण के लिए ''चंद्रिका
    एवरीडे क्रेडिट कार्ड — शुल्क अनुसूची'' देखें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9802b814-faea-57ab-bb8c-27c85ccf1dc2
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — बदलाव या अद्यतन करना
  body: 'अपने चंद्रिका एवरीडे क्रेडिट कार्ड से जुड़ी जानकारी अपडेट करने के लिए इन
    चरणों का पालन करें:


    1. आवश्यक दस्तावेज: अपना वर्तमान कार्ड विवरण और अपडेट किए जाने वाले दस्तावेज (जैसे
    नया पता प्रमाण या फोन नंबर) तैयार रखें।

    2. अनुरोध जमा करें: हमें बताएं कि आप कौन सी जानकारी बदलना चाहते हैं। यदि आप पता
    या पहचान विवरण बदल रहे हैं, तो हम आपसे पुनः PAN और आधार-आधारित KYC सत्यापन प्रदान
    करने के लिए कहेंगे।

    3. सत्यापन प्रक्रिया: हम आपके द्वारा दिए गए दस्तावेजों का सत्यापन करेंगे।

    4. पुष्टि प्राप्त करें: एक बार सत्यापन सफल होने के बाद, हम आपको एक पुष्टिकरण संदेश
    भेजेंगे कि आपकी जानकारी अपडेट कर दी गई है।


    यदि आप अपने कार्ड की क्रेडिट सीमा में बदलाव का अनुरोध करना चाहते हैं, तो हम आपकी
    पात्रता और पिछले भुगतान इतिहास की समीक्षा करेंगे और आपको अंतिम निर्णय के बारे
    में सूचित करेंगे।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 026ed323-4c5c-5db7-bd8d-9b1e69b46d54
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — एक्सेस या लॉगिन समस्याएँ
  body: "यदि आप अपने कार्ड विवरण देखने या डिजिटल सेवाओं में लॉगिन नहीं कर पा रहे हैं,\
    \ तो कृपया निम्नलिखित जाँचें:\n\n- लक्षण: 'गलत क्रेडेंशियल' का संदेश आना या लॉगिन\
    \ पेज का लोड न होना।\n- संभावित कारण: गलत पासवर्ड, पुराना ऐप वर्जन, या सुरक्षा\
    \ कारणों से खाता लॉक होना।\n- समाधान के चरण:\n  1. सुनिश्चित करें कि आप सही यूजर\
    \ आईडी और पासवर्ड का उपयोग कर रहे हैं।\n  2. यदि पासवर्ड भूल गए हैं, तो 'पासवर्ड\
    \ रीसेट' विकल्प का उपयोग करें।\n  3. जाँचें कि आपका इंटरनेट कनेक्शन स्थिर है।\n\
    \nयदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति की जाँच करेंगे।\
    \ यदि खाता सुरक्षा कारणों से लॉक है, तो हम आपसे दोबारा KYC सत्यापन करने के लिए\
    \ कहेंगे। समाधान के बाद, हम आपको एक पुष्टिकरण सूचना भेजेंगे। गंभीर तकनीकी त्रुटियों\
    \ के मामले में, हम इस मामले को अपनी आंतरिक तकनीकी टीम को भेजेंगे और आपको 3-5 कार्य\
    \ दिवसों के भीतर अपडेट प्रदान करेंगे।"
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d60a2f4d-d799-56d8-b900-1d5437bf8d66
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — पात्रता श्रेणियाँ
  body: 'सपोर्ट एजेंटों के लिए पात्रता मैट्रिक्स:


    | ग्राहक श्रेणी | आवश्यक शर्तें | परिणाम |

    | :--- | :--- | :--- |

    | वेतनभोगी कर्मचारी | न्यूनतम मासिक आय और वैध PAN/आधार | कार्ड जारी करने हेतु
    पात्र |

    | स्व-नियोजित व्यक्ति | पिछले 2 वर्षों का ITR और वैध KYC | क्रेडिट सीमा के अधीन
    पात्र |

    | मौजूदा बचत खाता धारक | संतोषजनक MAB इतिहास और KYC | त्वरित स्वीकृति के लिए पात्र
    |

    | अन्य आवेदक | पूर्ण KYC और क्रेडिट स्कोर सत्यापन | समीक्षा के बाद निर्णय |


    सभी श्रेणियों के लिए PAN और आधार-आधारित KYC सत्यापन अनिवार्य है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: db5af91a-8a76-5dc9-b086-ea393ba09807
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — श्रेणियों या विकल्पों में से चुनाव
  body: 'यदि आप अपने लिए सही विकल्प चुन रहे हैं, तो चंद्रिका एवरीडे क्रेडिट कार्ड
    एक उत्कृष्ट विकल्प है, विशेष रूप से उन लोगों के लिए जिन्हें दैनिक खर्चों के लिए
    लचीलापन चाहिए।


    इस कार्ड की मुख्य विशेषताएं:

    - लागत: ₹500 जॉइनिंग और ₹500 वार्षिक शुल्क (₹1,50,000 खर्च पर माफ)।

    - रिवॉर्ड: हर खर्च पर 1% की दर से रिवॉर्ड।

    - लागत प्रभावी: यदि आप मध्यम खर्च करते हैं, तो यह बुनियादी बैंकिंग समाधानों की
    तुलना में अधिक लाभ देता है।


    यदि आप केवल सुरक्षित बचत और शून्य ऋण जोखिम चाहते हैं, तो ''नियमित बचत खाता — सिंहावलोकन''
    आपके लिए बेहतर हो सकता है। हालांकि, रिवॉर्ड्स और क्रेडिट सुविधा के लिए यह कार्ड
    सबसे उपयुक्त है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 869eaa0e-e1eb-546b-afd9-313be5b5e786
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — गोपनीयता और डेटा प्रबंधन
  body: 'चंद्रिका बैंक आपके डेटा की गोपनीयता और निष्पक्ष व्यवहार के प्रति प्रतिबद्ध
    है। ''चंद्रिका एवरीडे क्रेडिट कार्ड'' का उपयोग करते समय, हम RBI और NPCI के दिशानिर्देशों
    का कड़ाई से पालन करते हैं।


    डेटा प्रबंधन नीति:

    - हम आपकी व्यक्तिगत जानकारी, जैसे PAN और आधार, का उपयोग केवल अनिवार्य KYC सत्यापन
    और नियामक रिपोर्टिंग के लिए करते हैं।

    - आपका लेनदेन डेटा केवल क्रेडिट सीमा के निर्धारण और रिवॉर्ड गणना (1% दर) के लिए
    उपयोग किया जाता है।

    - हम आपकी सहमति के बिना आपकी जानकारी किसी तीसरे पक्ष के साथ साझा नहीं करते हैं,
    सिवाय कानूनी आवश्यकताओं के।


    सुरक्षा आश्वासन: हम सख्त प्रमाणीकरण मानकों का पालन करते हैं। ग्राहकों को सलाह
    दी जाती है कि वे अपना UPI PIN या OTP किसी के साथ साझा न करें। किसी भी डेटा संबंधी
    चिंता के लिए, आप हमारे आंतरिक शिकायत अधिकारी से संपर्क कर सकते हैं, और यदि समाधान
    नहीं होता है, तो मामला RBI लोकपाल तक जा सकता है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d1fd15d5-4ebe-5595-85f0-efd8e7e87841
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड के ग्राहकों को अक्सर ''रिवॉर्ड पॉइंट अपडेट''
    या ''वार्षिक शुल्क माफी'' के नाम पर आने वाले फर्जी कॉल और संदेशों से सावधान रहना
    चाहिए। स्कैमर्स अक्सर यह दावा करते हैं कि यदि आप ₹1,50,000 की वार्षिक खर्च सीमा
    पूरी नहीं करते हैं, तो आपका कार्ड ब्लॉक कर दिया जाएगा, और वे इसे रोकने के लिए
    आपसे आपका OTP या UPI PIN मांगते हैं।


    कृपया ध्यान दें कि चंद्रिका बैंक आपसे कभी भी आपका UPI PIN, OTP या कार्ड का CVV
    साझा करने के लिए नहीं कहेगा। हम आपकी व्यक्तिगत जानकारी केवल आधिकारिक KYC प्रक्रिया
    के दौरान ही मांगते हैं।


    यदि आपको कोई संदिग्ध गतिविधि दिखाई देती है या आपके कार्ड से कोई अनधिकृत लेनदेन
    होता है, तो तुरंत हमें सूचित करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के
    लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं। त्वरित रिपोर्टिंग
    आपके दायित्व को सीमित करने में मदद करती है। सुरक्षा के लिए, किसी भी संदेह की स्थिति
    में अपने कार्ड को तुरंत फ्रीज करवाएं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f1d51c9e-61da-56c3-ac1c-dc42950293e0
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड का उपयोग करते समय निम्नलिखित सीमाओं और प्रतिबंधों
    का ध्यान रखें:


    1. शुल्क और छूट: इस कार्ड के लिए ₹500 का जॉइनिंग शुल्क और ₹500 का वार्षिक शुल्क
    लागू है। वार्षिक शुल्क में छूट केवल तभी दी जाती है जब ग्राहक एक वर्ष में ₹1,50,000
    की न्यूनतम खर्च सीमा पूरी करता है।


    2. वित्त प्रभार: यदि मासिक देय राशि का भुगतान समय पर नहीं किया जाता है, तो 3.5%
    का मासिक वित्त प्रभार लगाया जाता है, जो वार्षिक आधार पर 42% होता है।


    3. रिवॉर्ड्स: कार्ड पर 1% की रिवॉर्ड दर लागू है। कुछ विशिष्ट लेनदेन श्रेणियों
    (जैसे सरकारी कर भुगतान या वॉलेट लोड) को रिवॉर्ड पॉइंट गणना से बाहर रखा जा सकता
    है।


    4. केवाईसी और सुरक्षा: किसी भी विवरण में बदलाव या कार्ड की स्थिति बदलने के लिए
    PAN और आधार-आधारित KYC सत्यापन अनिवार्य है।


    अपवाद स्थितियों में, जैसे कि गंभीर धोखाधड़ी के मामलों में, बैंक नियामक पथ पर चार्जबैक
    प्रक्रिया शुरू कर सकता है। अधिक विवरण के लिए ''चंद्रिका एवरीडे क्रेडिट कार्ड —
    शुल्क अनुसूची'' देखें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
