  institution_id: chandrika_bank
- id: 6a3dbeec-8225-5a5a-b22e-c25774ddabfc
  title: नियमित बचत खाता — शुरुआत कैसे करें
  body: 'नियमित बचत खाता खोलना एक सरल प्रक्रिया है। इस उत्पाद के मुख्य विवरण इस प्रकार
    हैं:


    - ब्याज दर: आपको अपनी जमा राशि पर 3.5% की वार्षिक ब्याज दर मिलती है।

    - न्यूनतम शेष: आपको अपने खाते में ₹10,000 का मासिक औसत शेष (MAB) बनाए रखना होगा।

    - कम शेष शुल्क: यदि MAB ₹10,000 से कम होता है, तो ₹500 का शुल्क लगाया जाएगा।

    - डेबिट कार्ड: वार्षिक ₹250 के शुल्क पर आपको एक डेबिट कार्ड प्रदान किया जाता है।

    - ATM सुविधा: आपको प्रति माह 5 निःशुल्क ATM लेनदेन की सुविधा मिलती है।


    शुरुआत करने के लिए, ग्राहक को PAN और आधार-आधारित KYC सत्यापन प्रक्रिया से गुजरना
    होगा। एक बार सत्यापन पूरा हो जाने पर, खाता सक्रिय कर दिया जाता है और ग्राहक बैंकिंग
    सेवाओं का लाभ उठाना शुरू कर सकते हैं। विस्तृत शुल्क विवरण के लिए ''नियमित बचत
    खाता — शुल्क अनुसूची'' देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4174ab93-05be-5437-90c0-06f87057b14a
  title: नियमित बचत खाता — प्रति माह निःशुल्क ATM लेनदेन की व्याख्या
  body: 'प्रश्न: मेरे नियमित बचत खाते में कितने निःशुल्क ATM लेनदेन उपलब्ध हैं?

    उत्तर: आपको प्रति कैलेंडर माह 5 निःशुल्क ATM लेनदेन की सुविधा मिलती है।


    प्रश्न: यदि मैं 5 लेनदेन की सीमा पार कर जाता हूँ तो क्या होगा?

    उत्तर: 5 से अधिक लेनदेन करने पर, बैंक के मानक शुल्क लागू होंगे जो आपके द्वारा
    उपयोग किए गए ATM नेटवर्क पर निर्भर करते हैं।


    अधिक जानकारी के लिए ''नियमित बचत खाता — शुल्क अनुसूची'' देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7f99f175-bf09-5c5a-a89c-be2c2cb1cc53
  title: नियमित बचत खाता — बदलाव या अद्यतन करना
  body: 'अपने नियमित बचत खाते में अपनी व्यक्तिगत जानकारी या विवरण अपडेट करने के लिए
    इन चरणों का पालन करें:


    1. अपडेट का अनुरोध: हमें बताएं कि आप कौन सी जानकारी (जैसे पता, मोबाइल नंबर या
    ईमेल) बदलना चाहते हैं।

    2. दस्तावेज़ जमा करना: पहचान और पते के सत्यापन के लिए अपना अद्यतन आधार कार्ड या
    PAN कार्ड साझा करें। सुरक्षा कारणों से PAN और आधार-आधारित KYC सत्यापन अनिवार्य
    है।

    3. सत्यापन प्रक्रिया: हम आपके द्वारा दिए गए दस्तावेज़ों की जांच करेंगे और उनकी
    पुष्टि करेंगे।

    4. पुष्टिकरण: एक बार सत्यापन सफल होने पर, हम आपको सूचित करेंगे कि आपके खाते का
    विवरण अपडेट कर दिया गया है।


    यह प्रक्रिया सुनिश्चित करती है कि आपके खाते की सुरक्षा बनी रहे और केवल अधिकृत
    व्यक्ति ही विवरण बदल सके।'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 32a4e1f4-3572-5040-8948-6acfcd6b35ff
  title: नियमित बचत खाता — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने खाते तक पहुँचने या लॉगिन करने में समस्या का सामना कर रहे हैं,
    तो कृपया निम्न चरणों का पालन करें:


    लक्षण: लॉगिन के समय ''गलत क्रेडेंशियल'' या ''खाता अवरुद्ध'' का संदेश दिखना।


    संभावित कारण और समाधान:

    1. गलत पासवर्ड: सुनिश्चित करें कि आप सही पासवर्ड का उपयोग कर रहे हैं। यदि भूल
    गए हैं, तो हमसे पासवर्ड रीसेट करने का अनुरोध करें।

    2. KYC लंबित: यदि आपका KYC अपडेट नहीं है, तो सुरक्षा कारणों से खाता एक्सेस प्रतिबंधित
    हो सकता है। कृपया अपना PAN और आधार प्रदान करें।

    3. तकनीकी खराबी: कभी-कभी सिस्टम रखरखाव के कारण लॉगिन समस्याएँ होती हैं। कृपया
    15 मिनट बाद प्रयास करें।


    समाधान न होने पर: यदि समस्या बनी रहती है, तो हम आपके खाते की स्थिति की आंतरिक
    जांच करेंगे और समस्या का समाधान कर आपको सूचित करेंगे। गंभीर मामलों में, यह मामला
    हमारे आंतरिक शिकायत अधिकारी को भेजा जाएगा।'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ff3e1786-402e-5521-a38f-1653b086c767
  title: नियमित बचत खाता — पात्रता श्रेणियाँ
  body: 'नियमित बचत खाता खोलने के लिए पात्रता मानदंड निम्न हैं:


    - भारतीय निवासी: पात्र (आयु 18 वर्ष और उससे अधिक), अनिवार्य KYC दस्तावेज़ों के
    साथ।

    - नाबालिग: पात्र (अभिभावक के माध्यम से), जन्म प्रमाण पत्र और अभिभावक के KYC के
    साथ।

    - मध्यम वर्ग/परिवार: पात्र, नियमित आय प्रमाण या न्यूनतम ₹10,000 की प्रारंभिक जमा
    राशि के साथ।

    - दस्तावेज़ आवश्यकता: सभी श्रेणियों के लिए PAN और आधार अनिवार्य हैं।'
  domain: retail_banking
  product_category: savings_regular
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 10b6f7b8-876f-5281-bd41-55e9ea1f42c1
  title: नियमित बचत खाता — श्रेणियों या विकल्पों में से चुनाव
  body: 'यदि आप चंद्रिका बैंक में निवेश की योजना बना रहे हैं, तो नियमित बचत खाता और
    सावधि जमा (FD) के बीच चुनाव इस प्रकार करें:


    - नियमित बचत खाता: यह उन लोगों के लिए है जिन्हें अपने पैसों तक तुरंत पहुँच चाहिए
    और जो दैनिक लेनदेन करना चाहते हैं। इसमें 3.5% वार्षिक ब्याज मिलता है और ₹10,000
    का MAB बनाए रखना होता है।

    - 1-वर्षीय सावधि जमा (FD): यह उन लोगों के लिए है जो एक निश्चित अवधि के लिए पैसा
    जमा करके उच्च ब्याज दर प्राप्त करना चाहते हैं, लेकिन इसमें तरलता कम होती है।


    यदि आपको लचीलापन चाहिए तो बचत खाता चुनें, और यदि आप अधिकतम सुरक्षा के साथ अधिक
    रिटर्न चाहते हैं तो FD चुनें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: dd9c8de1-149f-59c7-987c-1ed5514a2faa
  title: नियमित बचत खाता — गोपनीयता और डेटा प्रबंधन
  body: 'चंद्रिका बैंक आपके डेटा की गोपनीयता और सुरक्षा के प्रति प्रतिबद्ध है। नियमित
    बचत खाता धारकों के लिए हमारी डेटा प्रबंधन नीति इस प्रकार है:


    1. डेटा संग्रह: हम केवल वही जानकारी एकत्र करते हैं जो KYC सत्यापन (जैसे PAN और
    आधार) और नियामक अनुपालन के लिए आवश्यक है।

    2. डेटा उपयोग: आपका डेटा केवल आपके बैंकिंग अनुभव को बेहतर बनाने, धोखाधड़ी रोकने
    और RBI/NPCI के दिशानिर्देशों का पालन करने के लिए उपयोग किया जाता है।

    3. तृतीय पक्ष प्रकटीकरण: हम आपकी व्यक्तिगत जानकारी को किसी बाहरी संस्था के साथ
    साझा नहीं करते हैं, जब तक कि कानूनी रूप से आवश्यक न हो या नियामक अधिकारियों द्वारा
    मांगा न गया हो।

    4. सुरक्षा मानक: हम डेटा गोपनीयता के लिए सख्त प्रमाणीकरण मानकों का पालन करते हैं।


    हमारा संचालन निष्पक्ष व्यवहार के केंद्र में है ताकि ग्राहकों के हितों की रक्षा
    सुनिश्चित हो सके। विस्तृत नियामक जानकारी के लिए ''नियमित बचत खाता — नियामक प्रकटीकरण''
    देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f6c05347-d3fb-5d90-b4a8-742f9d2bc911
  title: नियमित बचत खाता — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: "चंद्रिका बैंक के नियमित बचत खाता ग्राहकों को अक्सर 'KYC अपडेट' या 'खाता फ्रीज'\
    \ होने के फर्जी संदेशों के माध्यम से निशाना बनाया जाता है। जालसाज आपसे आपके PAN\
    \ और आधार विवरण के साथ-साथ OTP या UPI PIN साझा करने का अनुरोध कर सकते हैं ताकि\
    \ वे आपके खाते तक अनधिकृत पहुंच प्राप्त कर सकें।\n\nकृपया ध्यान दें कि चंद्रिका\
    \ बैंक आपसे कभी भी आपका UPI PIN, OTP या पासवर्ड नहीं मांगेगा। यदि आपको कोई ऐसा\
    \ कॉल या संदेश मिलता है जो तत्काल कार्रवाई की धमकी देता है, तो वह एक स्कैम हो\
    \ सकता है। \n\nयदि आपको लगता है कि आपके साथ धोखाधड़ी हुई है, तो तुरंत हमें सूचित\
    \ करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के लिए RBI के समय-सीमा ढांचे\
    \ (turn-around-time) का पालन करते हैं। गंभीर मामलों को तुरंत चार्जबैक और नियामक\
    \ पथ पर भेजा जाता है। सुरक्षा के लिए अधिक जानकारी के लिए 'नियमित बचत खाता — धोखाधड़ी\
    \ और अनधिकृत गतिविधि से सुरक्षा' देखें।"
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3076890f-7221-5316-a329-b6e87f31621e
  title: नियमित बचत खाता — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'नियमित बचत खाता दैनिक बैंकिंग के लिए डिज़ाइन किया गया है, लेकिन इसमें कुछ
    परिचालन सीमाएँ और प्रतिबंध लागू होते हैं:


    1. शेष राशि की सीमा: ग्राहकों को अपने खाते में ₹10000 का Monthly Average Balance
    (MAB) बनाए रखना अनिवार्य है। यदि शेष राशि इस सीमा से नीचे जाती है, तो ₹500 का
    below_mab_charge लगाया जाएगा।

    2. ATM लेनदेन: प्रति माह केवल 5 निःशुल्क ATM लेनदेन की अनुमति है। इस सीमा से अधिक
    लेनदेन पर मानक शुल्क लागू होंगे।

    3. वार्षिक लागत: इस खाते के साथ जुड़े डेबिट कार्ड के लिए ₹250 का वार्षिक शुल्क
    लिया जाता है।

    4. ब्याज दर: खाते में जमा राशि पर 3.5% की वार्षिक ब्याज दर लागू होती है।


    अपवाद स्थितियाँ: उच्च मूल्य वाले ग्राहकों के लिए, विशिष्ट खर्च सीमाएं पूरी करने
    पर वार्षिक शुल्क में छूट दी जा सकती है। किसी भी बदलाव के लिए PAN और आधार-आधारित
    KYC सत्यापन अनिवार्य है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
