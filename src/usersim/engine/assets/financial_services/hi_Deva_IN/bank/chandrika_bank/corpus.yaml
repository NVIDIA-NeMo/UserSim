- id: 31b7a926-d323-55e6-8e5e-cebc0101e249
  title: UPI और बिल भुगतान — शर्तों में बदलाव की नीति
  body: 'चंद्रिका बैंक को परिचालन आवश्यकताओं या नियामक परिवर्तनों के आधार पर ''UPI
    और बिल भुगतान'' की सेवा शर्तों और सीमाओं को संशोधित करने का अधिकार है।


    वर्तमान सीमाओं में प्रति लेनदेन ₹1,00,000 की सीमा और ₹1,00,000 की दैनिक सीमा शामिल
    है। इसके अतिरिक्त, AFA के बिना ऑटोपे मैंडेट की सीमा ₹15,000 निर्धारित है।


    शर्तों में किसी भी बदलाव की स्थिति में, बैंक ग्राहकों को उचित पूर्व सूचना प्रदान
    करेगा, जो आधिकारिक ईमेल, एसएमएस या बैंक के नोटिस बोर्ड के माध्यम से दी जाएगी।
    यदि आप संशोधित शर्तों से सहमत नहीं हैं, तो आप अपनी सेवा को बंद करने का विकल्प
    चुन सकते हैं। बैंक द्वारा निर्धारित समय-सीमा के भीतर सूचित न करने पर, निरंतर सेवा
    का उपयोग संशोधित शर्तों की स्वीकृति माना जाएगा। सभी बदलाव NPCI और RBI के दिशानिर्देशों
    के अनुरूप होंगे।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: terms_conditions
  source_authority: official
