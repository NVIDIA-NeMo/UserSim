- id: bf6bc6a4-b4d7-55c6-8da0-c62f1950e4cd
  title: आवर्ती जमा (RD) — स्थिति या इतिहास देखना
  body: "अपने आवर्ती जमा (RD) खाते की वर्तमान स्थिति और जमा इतिहास की जाँच करने के\
    \ लिए इन चरणों का पालन करें:\n\n1. हमें अपना खाता नंबर प्रदान करें और पुष्टि करें\
    \ कि आप अपनी RD का विवरण देखना चाहते हैं।\n2. सुरक्षा उद्देश्यों के लिए, हम आपसे\
    \ आपकी पहचान सत्यापित करने के लिए कहेंगे (जैसे PAN या आधार आधारित KYC विवरण)।\n\
    3. सत्यापन सफल होने के बाद, हम आपको आपके खाते का पूरा विवरण प्रदान करेंगे, जिसमें\
    \ निम्नलिखित शामिल होंगे:\n   - अब तक जमा की गई कुल किस्तों की संख्या।\n   - वर्तमान\
    \ जमा राशि।\n   - अगली किस्त की देय तिथि।\n   - परिपक्वता तिथि और अपेक्षित परिपक्वता\
    \ राशि (6.8% ब्याज दर के आधार पर)।\n4. आप हमसे अपने खाते का विस्तृत स्टेटमेंट\
    \ भेजने का अनुरोध भी कर सकते हैं, जिसे हम आपके पंजीकृत ईमेल या पते पर भेज देंगे।\n\
    \nएक बार जब आप विवरण प्राप्त कर लेते हैं, तो आप अपनी बचत की प्रगति को ट्रैक कर\
    \ सकते हैं और सुनिश्चित कर सकते हैं कि कोई किस्त नहीं चूकी है।"
