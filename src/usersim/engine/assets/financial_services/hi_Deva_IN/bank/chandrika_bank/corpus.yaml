- id: 501d31ad-419a-5c3e-98d7-ed9c2c45a009
  title: आवर्ती जमा (RD) — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'आपके आवर्ती जमा (RD) खाते की सुरक्षा हमारी सर्वोच्च प्राथमिकता है। कृपया
    ध्यान दें कि चंद्रिका बैंक के कर्मचारी आपसे कभी भी आपका UPI PIN, OTP या नेट बैंकिंग
    पासवर्ड नहीं मांगेंगे। यदि आपको कोई ऐसा कॉल या संदेश मिलता है जो इन विवरणों की
    मांग करता है, तो वह धोखाधड़ी हो सकती है।


    अपनी सुरक्षा के लिए इन प्रथाओं का पालन करें:

    1. अपने लॉगिन क्रेडेंशियल्स को किसी के साथ साझा न करें।

    2. केवल आधिकारिक चैनलों के माध्यम से ही लेनदेन करें।

    3. यदि आपको अपने खाते में कोई संदिग्ध गतिविधि दिखती है, तो तुरंत हमें सूचित करें।


    धोखाधड़ी की रिपोर्टिंग के लिए हम RBI के समय-सीमा ढांचे (turn-around-time) का पालन
    करते हैं। किसी भी अनधिकृत लेनदेन की सूचना हमें तुरंत दें ताकि हम इसे प्राथमिकता
    के आधार पर हल कर सकें और आवश्यक होने पर इसे चार्जबैक पथ पर भेज सकें। सुरक्षा के
    लिए सख्त प्रमाणीकरण मानकों का पालन करना अनिवार्य है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cbf12c16-b9c1-59cd-934c-853cb935a3b8
  title: आवर्ती जमा (RD) — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ आवर्ती जमा (RD) की शर्तों में संशोधन की प्रक्रिया को स्पष्ट
    करता है। चंद्रिका बैंक को उत्पाद की विशेषताओं, जैसे कि 6.8% की ब्याज दर या ₹500
    की न्यूनतम मासिक किस्त में बदलाव करने का अधिकार है। किसी भी महत्वपूर्ण बदलाव की
    स्थिति में, बैंक ग्राहकों को 30 दिनों की अग्रिम सूचना प्रदान करेगा।


    यदि आप नई शर्तों से सहमत नहीं हैं, तो आप अपना खाता बंद कर सकते हैं, हालांकि इस
    पर समयपूर्व निकासी दंड लागू होगा। किस्त जमा करने में विफलता पर ₹10 का जुर्माना
    प्रति चूक लगाया जाएगा, जिसे बैंक बिना किसी पूर्व सूचना के लागू कर सकता है। यह
    खाता 24 महीने की निर्धारित अवधि के लिए संचालित होता है। सभी बदलाव RBI के दिशानिर्देशों
    और निष्पक्ष व्यवहार संहिता के अनुरूप होंगे। हम केवल शैक्षिक जानकारी प्रदान करते
    हैं और यह कानूनी सलाह नहीं है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: terms_conditions
  source_authority: official
