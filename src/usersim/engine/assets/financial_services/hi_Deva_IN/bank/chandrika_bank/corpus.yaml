- id: 21fcd4ba-0a1f-514d-9c5c-81fc6d199ee7
  title: नियमित बचत खाता — विफल या लंबित कार्रवाई
  body: 'यदि आपको नियमित बचत खाता के साथ किसी लेनदेन या कार्रवाई में समस्या आ रही
    है, तो कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: ATM से पैसे नहीं निकले या डिजिटल लेनदेन ''लंबित'' (Pending) दिख रहा है।

    संभावित कारण: सर्वर डाउन होना, गलत PIN का उपयोग, या खाते में अपर्याप्त शेष।


    जांच और समाधान:

    1. सबसे पहले अपना शेष जांचें कि वह ₹10000 के MAB स्तर के आसपास है या नहीं और क्या
    पर्याप्त राशि उपलब्ध है।

    2. यदि लेनदेन विफल हो गया है लेकिन राशि कट गई है, तो हम RBI के समय-सीमा ढांचे
    (turn-around-time) के अनुसार इसकी जांच करेंगे।

    3. यदि समस्या बनी रहती है, तो हमें विवरण दें। हम मामले को प्राथमिकता के आधार पर
    लेंगे और यदि आवश्यक हुआ तो इसे चार्जबैक प्रक्रिया पर भेजेंगे।


    यदि आपको कोई अनपेक्षित शुल्क दिखता है, तो कृपया नियमित बचत खाता — शुल्क अनुसूची
    के साथ अपने विवरण का मिलान करें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 990e3ff8-3797-5027-90ac-aef465653047
  title: नियमित बचत खाता — पात्रता शर्तें
  body: 'नियमित बचत खाता पात्रता मैट्रिक्स:


    - शर्त: वैध PAN और आधार कार्ड (KYC पूर्ण) -> परिणाम: खाता खोलने के लिए पात्र

    - शर्त: न्यूनतम औसत मासिक शेष (MAB) ₹10000 बनाए रखना -> परिणाम: शून्य MAB दंड
    शुल्क

    - शर्त: औसत मासिक शेष ₹10000 से कम होना -> परिणाम: ₹500 शुल्क लागू'
  domain: retail_banking
  product_category: savings_regular
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ccebd96b-0a32-5601-9ef9-4815bcd3860b
  title: नियमित बचत खाता — यहाँ के समान उत्पाद से तुलना
  body: 'नियमित बचत खाता बनाम 1-वर्षीय सावधि जमा (FD):


    - तरलता: नियमित बचत खाता आपको किसी भी समय पैसे निकालने की सुविधा देता है, जबकि
    1-वर्षीय सावधि जमा (FD) में राशि एक निश्चित अवधि के लिए लॉक रहती है।

    - ब्याज: नियमित बचत खाता पर 3.5% की दर मिलती है, जबकि FD में आम तौर पर उच्च ब्याज
    दरें होती हैं।

    - लागत: नियमित बचत खाता में ₹10000 का MAB बनाए रखना होता है अन्यथा ₹500 शुल्क
    लगता है; FD में MAB की ऐसी आवश्यकता नहीं होती।


    यदि आपको दैनिक खर्चों के लिए पैसे चाहिए, तो नियमित बचत खाता चुनें। यदि आप एक साल
    के लिए निवेश करना चाहते हैं, तो 1-वर्षीय सावधि जमा (FD) — सिंहावलोकन देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5d74f521-62be-5f1c-926f-ebc661668332
  title: नियमित बचत खाता — नियामक प्रकटीकरण
  body: 'नियामक प्रकटीकरण: चंद्रिका बैंक RBI और NPCI के दिशानिर्देशों का कड़ाई से
    पालन करता है। नियमित बचत खाता के तहत ग्राहकों की जमा राशि DICGC बीमा द्वारा ₹5,00,000
    तक सुरक्षित है, जो बैंक विफल होने की स्थिति में सुरक्षा प्रदान करता है।


    शुल्क और शर्तें: इस खाते में ₹10000 का Monthly Average Balance (MAB) बनाए रखना
    आवश्यक है; इस सीमा से नीचे जाने पर ₹500 का शुल्क लगाया जाएगा। डेबिट कार्ड के लिए
    ₹250 का वार्षिक शुल्क लागू है।


    डिस्क्लेमर: हम केवल अपने उत्पादों की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान
    करते हैं; हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं। उत्पाद अनुशंसाएं ग्राहक
    की पात्रता और बैंक की मानक शर्तों के आधार पर निष्पक्ष रूप से की जाती हैं। किसी
    भी विवाद की स्थिति में, RBI लोकपाल के दिशा-निर्देश प्रभावी होंगे।'
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cc331617-f58d-591b-9537-a97915c1470f
  title: नियमित बचत खाता — ब्याज दर अनुसूची
  body: 'नियमित बचत खाता के लिए ब्याज दर विवरण:


    - लागू दर: सभी शेष राशियों के लिए 3.5% की एक समान वार्षिक ब्याज दर लागू है।

    - गणना: ब्याज की गणना दैनिक शेष के आधार पर की जाती है और समय-समय पर खाते में जमा
    की जाती है।

    - परिवर्तन: बैंक बाजार की स्थितियों और RBI के नियमों के अनुसार समय-समय पर दरों
    में बदलाव कर सकता है, जिसकी सूचना ग्राहकों को दी जाएगी।'
  domain: retail_banking
  product_category: savings_regular
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: eba456dd-6d25-50e2-a70a-c1104721f3f6
  title: नियमित बचत खाता — वर्तमान ऑफर
  body: "विशेष ऑफर: अपने नियमित बचत खाता को और अधिक लाभकारी बनाएं! \n\nअवधि: यह ऑफर\
    \ 1 अप्रैल 2024 से 31 मार्च 2025 तक वैध है।\n\nऑफर विवरण: जो ग्राहक अपने नियमित\
    \ बचत खाता में लगातार 6 महीनों तक ₹25000 से अधिक का औसत मासिक शेष बनाए रखते हैं,\
    \ उन्हें उनके डेबिट कार्ड के ₹250 वार्षिक शुल्क पर 50% की छूट दी जाएगी।\n\nनियम\
    \ और शर्तें लागू। अधिक जानकारी के लिए नियमित बचत खाता — उत्पाद विवरण देखें।"
  domain: retail_banking
  product_category: savings_regular
  document_type: promo_notice
  source_authority: official
  placeholder: true
