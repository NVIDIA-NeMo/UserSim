  institution_id: chandrika_bank
- id: 40ef41bd-c667-5cf5-88d0-93ace82fc512
  title: UPI और बिल भुगतान — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'चंद्रिका बैंक की ''UPI और बिल भुगतान'' सेवा उन ग्राहकों के लिए सबसे उपयुक्त
    है जो अपने दैनिक खर्चों, छोटे भुगतान और उपयोगिता बिलों (जैसे बिजली, पानी, गैस)
    के लिए एक त्वरित, सुरक्षित और डिजिटल समाधान चाहते हैं। यह विशेष रूप से उन मध्यम
    वर्गीय परिवारों के लिए डिज़ाइन किया गया है जो नकदी रहित लेनदेन को अपनाना चाहते
    हैं।


    मुख्य विशेषताएं और सीमाएं:

    - सामान्य UPI लेनदेन: प्रति लेनदेन ₹100,000 तक और कुल दैनिक सीमा ₹100,000 तक।

    - छोटे भुगतान (UPI Lite): प्रति लेनदेन ₹500 तक की सीमा, जो बिना पिन के त्वरित
    भुगतान की अनुमति देती है।

    - ऑटोपे सुविधा: बिना AFA के ₹15,000 तक के ऑटोपे मैंडेट की सुविधा, जिससे नियमित
    बिलों का भुगतान आसान हो जाता है।


    यह सेवा NPCI रेल के माध्यम से संचालित होती है, जो इसे भारत में कहीं भी भुगतान
    करने के लिए एक भरोसेमंद विकल्प बनाती है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 25ab19bd-4932-5674-9ade-300f2b34f0ef
  title: UPI और बिल भुगतान — UPI दैनिक सीमा की व्याख्या
  body: 'प्रश्न: मेरी UPI दैनिक लेनदेन सीमा क्या है?

    उत्तर: चंद्रिका बैंक के ''UPI और बिल भुगतान'' उत्पाद के तहत, आपकी कुल दैनिक लेनदेन
    सीमा ₹100,000 है। इसका मतलब है कि आप एक दिन में कुल मिलाकर ₹100,000 तक भेज सकते
    हैं। इसके अतिरिक्त, एक एकल लेनदेन की अधिकतम राशि भी ₹100,000 तक सीमित है। अधिक
    जानकारी के लिए ''UPI और बिल भुगतान — खाता अनुबंध'' देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
