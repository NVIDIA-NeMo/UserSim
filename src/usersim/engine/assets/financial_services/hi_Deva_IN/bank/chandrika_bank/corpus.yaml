- id: 1715ace3-88eb-50f2-adc8-03b289fc7dc0
  title: UPI और बिल भुगतान — UPI प्रति लेनदेन सीमा की व्याख्या
  body: 'प्रश्न: मैं एक बार में अधिकतम कितनी राशि UPI के माध्यम से भेज सकता हूँ?

    उत्तर: चंद्रिका बैंक के ''UPI और बिल भुगतान'' के तहत, आपके लिए प्रति लेनदेन UPI
    सीमा ₹100000 निर्धारित की गई है।


    प्रश्न: क्या यह सीमा सभी प्रकार के UPI लेनदेन पर लागू होती है?

    उत्तर: हाँ, यह मानक UPI लेनदेन के लिए है। यदि आप छोटे भुगतानों के लिए UPI Lite
    का उपयोग कर रहे हैं, तो उसकी प्रति लेनदेन सीमा ₹500 है।


    विस्तृत विवरण के लिए ''UPI और बिल भुगतान — सिंहावलोकन'' देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
