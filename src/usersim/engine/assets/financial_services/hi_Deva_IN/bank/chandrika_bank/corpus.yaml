  institution_id: chandrika_bank
- id: 8ede7b6b-24be-5118-8d94-9d536d543109
  title: नियमित बचत खाता — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'अपने नियमित बचत खाता को सुरक्षित रखना आपकी और हमारी साझा जिम्मेदारी है। कृपया
    इन सर्वोत्तम प्रथाओं का पालन करें:


    1. गोपनीय जानकारी: चंद्रिका बैंक आपसे कभी भी आपका UPI PIN, नेट बैंकिंग पासवर्ड
    या OTP साझा करने के लिए नहीं कहेगा। यदि कोई व्यक्ति बैंक अधिकारी बनकर यह जानकारी
    मांगता है, तो वह धोखाधड़ी हो सकती है।

    2. पिन सुरक्षा: अपने डेबिट कार्ड का पिन समय-समय पर बदलते रहें और इसे किसी भी डायरी
    या फोन में लिखकर न रखें।

    3. संदिग्ध लेनदेन: यदि आपको अपने खाते में कोई ऐसा लेनदेन दिखता है जो आपने नहीं
    किया है, तो तुरंत हमें सूचित करें।

    4. आधिकारिक चैनल: केवल बैंक के प्रमाणित चैनलों के माध्यम से ही संवाद करें।


    याद रखें, किसी भी संदिग्ध गतिविधि की रिपोर्ट करने के लिए RBI के समय-सीमा ढांचे
    का पालन किया जाता है। त्वरित कार्रवाई आपकी जमा राशि की सुरक्षा सुनिश्चित करती
    है। अधिक जानकारी के लिए ''नियमित बचत खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा''
    देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
