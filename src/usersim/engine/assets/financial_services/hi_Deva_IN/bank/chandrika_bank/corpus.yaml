- id: 6773b2fa-932f-505a-8ac3-32dd4ba46e99
  title: नियमित बचत खाता — डेबिट कार्ड वार्षिक शुल्क की व्याख्या
  body: 'प्रश्न: मेरे नियमित बचत खाते के लिए डेबिट कार्ड का वार्षिक शुल्क क्या है?

    उत्तर: नियमित बचत खाता के साथ प्रदान किए गए डेबिट कार्ड के लिए ₹250 का वार्षिक
    शुल्क लिया जाता है। यह शुल्क कार्ड के रखरखाव और परिचालन लागत को कवर करने के लिए
    है।


    प्रश्न: क्या इस शुल्क में कोई छूट संभव है?

    उत्तर: हाँ, उच्च मूल्य वाले ग्राहक यदि बैंक द्वारा निर्धारित विशिष्ट वार्षिक खर्च
    सीमाएं पूरी करते हैं, तो वे इस वार्षिक शुल्क में छूट के पात्र हो सकते हैं। विस्तृत
    जानकारी के लिए ''नियमित बचत खाता — शुल्क अनुसूची'' देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
