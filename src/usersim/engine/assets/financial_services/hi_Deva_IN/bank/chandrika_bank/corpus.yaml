- id: 45a98f8a-6c42-5752-9dc3-6813de322921
  title: 1-वर्षीय सावधि जमा (FD) — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: "आपके निवेश की सुरक्षा हमारी प्राथमिकता है। 1-वर्षीय सावधि जमा (FD) के संबंध\
    \ में, कृपया ध्यान रखें कि चंद्रिका बैंक के अधिकारी आपसे कभी भी आपका UPI PIN,\
    \ नेट बैंकिंग पासवर्ड या OTP साझा करने के लिए नहीं कहेंगे। \n\nसावधानी बरतें:\
    \ यदि आपको कोई ऐसा कॉल या मैसेज मिलता है जो आपकी FD को 'अपग्रेड' करने या अधिक\
    \ ब्याज दर देने के लिए आपकी गोपनीय जानकारी मांगता है, तो यह धोखाधड़ी हो सकती है।\
    \ किसी भी संदिग्ध गतिविधि की स्थिति में, तुरंत हमें सूचित करें। हम असफल लेनदेन\
    \ और धोखाधड़ी की रिपोर्टिंग के लिए RBI के समय-सीमा ढांचे (turn-around-time) का\
    \ पालन करते हैं।\n\nसुरक्षा के लिए हमेशा आधिकारिक माध्यमों का उपयोग करें। याद\
    \ रखें, किसी भी खाते की जानकारी साझा करने से पहले PAN और आधार-आधारित KYC सत्यापन\
    \ अनिवार्य है। अधिक जानकारी के लिए 1-वर्षीय सावधि जमा (FD) — धोखाधड़ी और अनधिकृत\
    \ गतिविधि से सुरक्षा देखें।"
