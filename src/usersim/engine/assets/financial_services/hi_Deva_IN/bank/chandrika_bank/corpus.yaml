  institution_id: chandrika_bank
- id: 9d13cdb1-c6ad-50c9-8b17-9ffadec9cad0
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपना चंद्रिका एवरीडे क्रेडिट कार्ड बंद करना या डाउनग्रेड करना चाहते
    हैं, तो इन चरणों का पालन करें:


    1. अपने वर्तमान बकाया की जांच करें। सुनिश्चित करें कि कार्ड पर कोई भी लंबित भुगतान,
    ब्याज या शुल्क शेष नहीं है।

    2. हमें कार्ड बंद करने या किसी अन्य विकल्प में डाउनग्रेड करने का अनुरोध करें।

    3. अपने पहचान प्रमाण के लिए आवश्यक KYC दस्तावेज़ (जैसे PAN या आधार) प्रदान करें
    ताकि सत्यापन पूरा हो सके।

    4. हम आपके अनुरोध की समीक्षा करेंगे और पुष्टि करेंगे कि सभी बकाया राशि का भुगतान
    कर दिया गया है।

    5. एक बार पुष्टि हो जाने के बाद, हम आपके खाते को बंद या डाउनग्रेड कर देंगे और
    आपको एक पुष्टिकरण संदेश या ईमेल भेजेंगे।


    ध्यान दें: कार्ड बंद करने से पहले अपने संचित रिवॉर्ड्स का उपयोग कर लें, क्योंकि
    खाता बंद होने पर शेष रिवॉर्ड्स समाप्त हो सकते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c1894f27-9deb-523f-b40a-881640874530
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने क्रेडिट कार्ड स्टेटमेंट में कोई ऐसा शुल्क या राशि दिखती है
    जिसकी आप अपेक्षा नहीं कर रहे थे, तो निम्नलिखित कदम उठाएं:


    1. शुल्क की प्रकृति की जांच करें: देखें कि क्या यह ₹500 का वार्षिक शुल्क है। यदि
    आपने पिछले वर्ष ₹1,50,000 की खर्च सीमा पूरी नहीं की थी, तो यह शुल्क लागू होगा।

    2. ब्याज की गणना देखें: यदि आपने पूरी राशि का भुगतान नहीं किया है, तो बकाया राशि
    पर 3.5% मासिक वित्त प्रभार लगाया गया होगा।

    3. लेनदेन का मिलान करें: अपने बिलों का मिलान करें कि कहीं कोई दोहरा लेनदेन तो
    नहीं हुआ है।


    समाधान और वृद्धि:

    यदि आपको लगता है कि शुल्क गलत तरीके से लगाया गया है, तो हमें विवरण प्रदान करें।
    हम इसकी जांच करेंगे। यदि यह एक असफल लेनदेन या त्रुटि है, तो हम RBI के समय-सीमा
    ढांचे (turn-around-time) के अनुसार इसका समाधान करेंगे। गंभीर विवादों के मामले
    में, हम इसे तुरंत चार्जबैक और नियामक पथ पर भेजेंगे और आपको समाधान की स्थिति के
    बारे में सूचित करेंगे।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b06b0ab1-792c-5bae-91e6-cf3b291b48c8
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — आवश्यक दस्तावेज़
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड के आवेदन और सत्यापन के लिए निम्नलिखित दस्तावेज़
    अनिवार्य हैं:


    - पहचान प्रमाण: PAN कार्ड (अनिवार्य)

    - पते का प्रमाण: आधार कार्ड या अन्य सरकारी मान्यता प्राप्त दस्तावेज़

    - आय प्रमाण: वेतन पर्ची (Salary Slip) या आयकर रिटर्न (ITR) दस्तावेज़

    - सत्यापन स्थिति: सफल KYC सत्यापन -> कार्ड जारी करने की प्रक्रिया शुरू

    - सत्यापन स्थिति: अधूरा या विफल KYC -> आवेदन अस्वीकृत'
  domain: cards
  product_category: chandrika_credit_card
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 442dc54a-4b9d-565c-8f32-fa333df6dd63
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'बाज़ार के अन्य सामान्य क्रेडिट कार्डों की तुलना में, चंद्रिका एवरीडे क्रेडिट
    कार्ड एक संतुलित दृष्टिकोण प्रदान करता है। जहाँ कई प्रतिस्पर्धी कार्ड बहुत अधिक
    वार्षिक शुल्क लेते हैं, हमारा शुल्क ₹500 है, जिसे ₹1,50,000 के वार्षिक खर्च पर
    आसानी से माफ किया जा सकता है।


    ब्याज दरों के मामले में, हमारा 3.5% मासिक वित्त प्रभार पारदर्शी है। रिवॉर्ड्स
    के लिए हम 1% की स्थिर दर देते हैं, जो दैनिक उपयोग के लिए प्रतिस्पर्धी है। यह कार्ड
    उन ग्राहकों के लिए बेहतर है जो सादगी और स्पष्टता चाहते हैं, जबकि उच्च-स्तरीय लग्जरी
    कार्ड उन लोगों के लिए बेहतर हो सकते हैं जिन्हें हवाई यात्रा या विशिष्ट लाउंज एक्सेस
    की आवश्यकता है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 032cfd22-1edd-5a5c-9633-763eab2290e8
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — जोखिम प्रकटीकरण
  body: 'क्रेडिट कार्ड का उपयोग वित्तीय जोखिम के साथ आता है। कृपया निम्नलिखित बिंदुओं
    को ध्यान से पढ़ें:


    1. ब्याज लागत: यदि आप मासिक देय राशि का पूर्ण भुगतान नहीं करते हैं, तो शेष राशि
    पर 3.5% मासिक (42% वार्षिक) का वित्त प्रभार लगेगा। यह उच्च ब्याज दर आपके कुल ऋण
    को तेज़ी से बढ़ा सकती है।

    2. शुल्क दायित्व: कार्डधारक ₹500 के जॉइनिंग और वार्षिक शुल्क के लिए उत्तरदायी
    है, जब तक कि ₹1,50,000 की वार्षिक खर्च सीमा पूरी न हो जाए।

    3. क्रेडिट स्कोर पर प्रभाव: भुगतान में देरी या चूक आपके क्रेडिट स्कोर को नकारात्मक
    रूप से प्रभावित कर सकती है, जिससे भविष्य में ऋण लेना कठिन हो सकता है।

    4. नियामक अनुपालन: हम RBI और NPCI के दिशानिर्देशों का कड़ाई से पालन करते हैं।


    हम केवल अपने उत्पादों की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं;
    हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 0bab534c-e271-5562-ac6e-4c0ea5ea864a
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड के लिए दरें सभी ग्राहकों के लिए समान रूप से
    लागू होती हैं। इसमें कोई जटिल टियर संरचना नहीं है:


    - वित्त प्रभार: सभी बकाया राशियों पर 3.5% का मासिक वित्त प्रभार लागू होता है (वार्षिक
    दर 42%)। यह दर तब लागू होती है जब ग्राहक देय तिथि तक कुल बकाया राशि का भुगतान
    नहीं करता है।

    - रिवॉर्ड दर: सभी पात्र खर्चों पर 1% की फ्लैट रिवॉर्ड दर लागू होती है।

    - शुल्क माफी: यदि एक वर्ष का कुल खर्च ₹1,50,000 तक पहुँच जाता है, तो ₹500 का वार्षिक
    शुल्क माफ कर दिया जाता है।'
