  institution_id: chandrika_bank
- id: 01f72085-73b3-5308-aba7-9d5ddcb36d95
  title: नियमित बचत खाता — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'एक सामान्य अनुरोध (जैसे कि डेबिट कार्ड रिप्लेसमेंट या पता अपडेट) के पूर्ण
    समाधान के लिए इन चरणों का पालन करें:


    1. हमें बताएं कि आप किस सेवा का अनुरोध करना चाहते हैं (उदाहरण के लिए: ''मुझे नया
    डेबिट कार्ड चाहिए'')।

    2. हम आपसे आपका खाता नंबर और पहचान सत्यापन के लिए PAN या आधार विवरण मांगेंगे।

    3. यदि आप पता बदल रहे हैं, तो हमें एक वैध पते का प्रमाण साझा करें।

    4. हम अनुरोध को संसाधित करेंगे और आपको एक पुष्टिकरण संदर्भ संख्या प्रदान करेंगे।

    5. यदि यह कार्ड का अनुरोध है, तो ₹250 का शुल्क (यदि लागू हो) आपके खाते से काटा
    जाएगा और कार्ड आपके पते पर भेज दिया जाएगा।


    प्रक्रिया तब पूर्ण मानी जाती है जब आपको सेवा की पुष्टि करने वाला संदेश प्राप्त
    हो जाता है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
