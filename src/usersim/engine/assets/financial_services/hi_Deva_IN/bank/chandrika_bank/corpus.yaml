- id: d71275e6-cf77-5343-b7ea-747a3d2b4d3e
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — वार्षिक शुल्क की व्याख्या
  body: 'प्रश्न: मेरे चंद्रिका एवरीडे क्रेडिट कार्ड पर वार्षिक शुल्क कितना है और इसे
    कैसे माफ किया जा सकता है?

    उत्तर: इस कार्ड का वार्षिक शुल्क ₹500 है। यदि आप एक वर्ष के भीतर कुल ₹1,50,000
    या उससे अधिक का खर्च करते हैं, तो बैंक आपके लिए वार्षिक शुल्क माफ कर देता है।
    अधिक जानकारी के लिए कृपया ''चंद्रिका एवरीडे क्रेडिट कार्ड — शुल्क अनुसूची'' देखें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
