- id: 254e8984-5f08-507a-849b-23f1db99c13c
  title: 1-वर्षीय सावधि जमा (FD) — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'जब आप हमारी 1-वर्षीय सावधि जमा (FD) की तुलना बाजार के अन्य विकल्पों से करते
    हैं, तो मुख्य अंतर सुरक्षा और निश्चित रिटर्न में होता है। बाजार के कई विकल्प अस्थिर
    रिटर्न दे सकते हैं, लेकिन चंद्रिका बैंक 7.1% की स्थिर वार्षिक दर (और वरिष्ठ नागरिकों
    के लिए अतिरिक्त 0.5%) की गारंटी देता है।


    तुलना बिंदु:

    - लॉक-इन: अन्य उत्पादों के विपरीत, यहाँ 12 महीने का निश्चित लॉक-इन है। समयपूर्व
    निकासी पर 1% दंड लगता है।

    - सुरक्षा: हम DICGC बीमा के माध्यम से ₹5,00,000 तक की सुरक्षा प्रदान करते हैं,
    जो कई गैर-बैंकिंग वित्तीय कंपनियों (NBFCs) में उपलब्ध नहीं होता।


    यह उत्पाद उन ग्राहकों के लिए सर्वश्रेष्ठ है जो जोखिम नहीं लेना चाहते, जबकि लचीलेपन
    की तलाश करने वाले ग्राहकों के लिए नियमित बचत खाता — सिंहावलोकन अधिक उपयुक्त हो
    सकता है।'
