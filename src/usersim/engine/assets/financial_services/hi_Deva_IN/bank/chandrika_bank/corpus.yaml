- id: d60a3961-bd81-5dac-9411-a2886c8fdd28
  title: आवर्ती जमा (RD) — शुरुआत कैसे करें
  body: 'चंद्रिका बैंक के आवर्ती जमा (RD) के साथ बचत शुरू करना एक सरल प्रक्रिया है।
    यह उत्पाद उन परिवारों के लिए है जो अनुशासित मासिक बचत के माध्यम से अपने भविष्य
    के लक्ष्यों को पूरा करना चाहते हैं।


    मुख्य विवरण:

    - न्यूनतम मासिक किस्त: ₹500

    - निवेश अवधि: 24 महीने

    - ब्याज दर: 6.8% वार्षिक

    - किस्त चूकने पर जुर्माना: ₹10 प्रति किस्त


    शुरुआत करने के लिए, आपके पास एक सक्रिय चंद्रिका बैंक बचत खाता होना चाहिए। आपको
    अपनी मासिक किस्त की राशि और 24 महीने की अवधि चुननी होगी। एक बार खाता खुलने के
    बाद, आपकी चुनी हुई राशि हर महीने आपके खाते से स्वतः डेबिट हो जाएगी। याद रखें कि
    किसी भी खाते की स्थिति बदलने से पहले PAN और आधार-आधारित KYC सत्यापन अनिवार्य है।
    आपका जमा DICGC बीमा के माध्यम से ₹5,00,000 तक सुरक्षित है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 20580454-d462-512a-b775-8511757dfd97
  title: आवर्ती जमा (RD) — ब्याज दर की व्याख्या
  body: 'प्रश्न: आवर्ती जमा (RD) पर मुझे कितनी ब्याज दर मिलेगी?

    उत्तर: चंद्रिका बैंक के आवर्ती जमा (RD) खाते पर वर्तमान में 6.8% की वार्षिक ब्याज
    दर प्रदान की जाती है।


    प्रश्न: क्या यह ब्याज दर पूरी अवधि के लिए स्थिर रहती है?

    उत्तर: हाँ, जिस दर पर आप अपना खाता खोलते हैं, वह 24 महीने की पूरी अवधि के लिए
    स्थिर रहती है। अधिक जानकारी के लिए ''आवर्ती जमा (RD) — ब्याज दर अनुसूची'' देखें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3c116898-ae03-5e8d-aed9-2b0f6e63820d
  title: आवर्ती जमा (RD) — बदलाव या अद्यतन करना
  body: 'अपने मौजूदा आवर्ती जमा (RD) खाते में जानकारी अपडेट करने के लिए इन चरणों का
    पालन करें:


    1. हमें वह विशिष्ट जानकारी बताएं जिसे आप अपडेट करना चाहते हैं (जैसे आपका संपर्क
    विवरण या नामांकित व्यक्ति)।

    2. यदि आप केवाईसी विवरण अपडेट कर रहे हैं, तो अपना अद्यतन PAN और आधार कार्ड हमें
    प्रदान करें।

    3. हम आपके दस्तावेज़ों का सत्यापन करेंगे और पुष्टि करेंगे कि KYC प्रक्रिया पूरी
    हो गई है।

    4. हम आपको सूचित करेंगे कि आपके खाते में बदलाव सफलतापूर्वक कर दिए गए हैं।


    कृपया ध्यान दें कि आप अपनी मासिक किस्त की राशि या 24 महीने की निर्धारित अवधि को
    खाता सक्रिय होने के बाद नहीं बदल सकते। यदि आप राशि बदलना चाहते हैं, तो आपको मौजूदा
    खाता बंद करना होगा और नया खाता खोलना होगा। खाता बंद करने पर समयपूर्व निकासी दंड
    लागू हो सकता है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3df4f272-411c-56e5-a4c9-61299c716149
  title: आवर्ती जमा (RD) — एक्सेस या लॉगिन समस्याएँ
  body: "यदि आप अपने डिजिटल बैंकिंग के माध्यम से आवर्ती जमा (RD) विवरण देखने या प्रबंधित\
    \ करने में समस्या का सामना कर रहे हैं, तो कृपया निम्नलिखित चरणों की जाँच करें:\n\
    \n- लक्षण: 'खाता नहीं मिला' या 'अधूरी जानकारी' जैसा त्रुटि संदेश दिखना।\n- संभावित\
    \ कारण: अधूरा KYC सत्यापन या तकनीकी सिंक्रोनाइज़ेशन समस्या।\n- समाधान प्रक्रिया:\n\
    \  1. सुनिश्चित करें कि आपका PAN और आधार-आधारित KYC पूरी तरह से अपडेट है।\n  2.\
    \ यदि KYC पूर्ण है, तो हमें समस्या की रिपोर्ट करें।\n  3. हम आपके खाते की स्थिति\
    \ की जाँच करेंगे और बैक-एंड डेटा को रिफ्रेश करेंगे।\n- समाधान: हम आपको सूचित करेंगे\
    \ कि आपका खाता अब डिजिटल रूप से दृश्यमान है।\n\nयदि समस्या बनी रहती है, तो हम\
    \ इस मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे। हम RBI के समय-सीमा ढांचे का\
    \ पालन करते हैं ताकि आपकी समस्या का प्राथमिकता के आधार पर समाधान हो सके।"
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c1fcd1b4-646b-5044-ba27-20f3ed22c8e7
  title: आवर्ती जमा (RD) — पात्रता श्रेणियाँ
  body: 'आवर्ती जमा (RD) के लिए पात्रता मानदंड निम्नलिखित हैं:


    | श्रेणी | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | व्यक्तिगत ग्राहक | वैध PAN और आधार (KYC) | पात्र |

    | संयुक्त खाते | दोनों आवेदकों का KYC पूर्ण | पात्र |

    | न्यूनतम जमा क्षमता | ₹500 प्रति माह | पात्र |

    | केवाईसी स्थिति | अपूर्ण या एक्सपायर्ड | अपात्र (अपडेट आवश्यक) |


    सभी पात्र ग्राहकों को 24 महीने की अवधि के लिए 6.8% की ब्याज दर प्रदान की जाती
    है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 86ff05b9-36dc-5e68-913c-58c60605db1d
  title: आवर्ती जमा (RD) — श्रेणियों या विकल्पों में से चुनाव
  body: 'सही बचत विकल्प का चुनाव आपकी वित्तीय स्थिति पर निर्भर करता है:


    - आवर्ती जमा (RD): उन लोगों के लिए सर्वश्रेष्ठ जो हर महीने एक निश्चित राशि (न्यूनतम
    ₹500) बचाना चाहते हैं। यह 24 महीने की अवधि के लिए 6.8% ब्याज देता है।

    - सावधि जमा (FD): उन लोगों के लिए बेहतर है जिनके पास एकमुश्त राशि उपलब्ध है जिसे
    वे एक निश्चित समय के लिए लॉक करना चाहते हैं।

    - नियमित बचत खाता: दैनिक लेनदेन और लचीलेपन के लिए उपयुक्त है, लेकिन इसमें ब्याज
    दर RD की तुलना में कम होती है।


    यदि आप अनुशासित बचत और उच्च ब्याज चाहते हैं, तो आवर्ती जमा (RD) सबसे उपयुक्त विकल्प
    है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: a4906302-1de1-58d9-ac9a-55fd0f7ff88d
  title: आवर्ती जमा (RD) — गोपनीयता और डेटा प्रबंधन
  body: 'चंद्रिका बैंक आपके डेटा की गोपनीयता और सुरक्षा के प्रति प्रतिबद्ध है। आवर्ती
    जमा (RD) खाते के प्रबंधन के लिए हम आपके PAN, आधार और वित्तीय लेनदेन के विवरण एकत्र
    करते हैं। यह डेटा केवल KYC सत्यापन, नियामक रिपोर्टिंग और आपकी बैंकिंग सेवाओं को
    बेहतर बनाने के लिए उपयोग किया जाता है।


    हम RBI और NPCI के दिशानिर्देशों का कड़ाई से पालन करते हैं। आपका डेटा केवल कानूनी
    आवश्यकताओं या नियामक अधिकारियों के अनुरोध पर ही साझा किया जाएगा। हम निष्पक्ष व्यवहार
    के सिद्धांतों का पालन करते हैं और सुनिश्चित करते हैं कि आपकी व्यक्तिगत जानकारी
    का दुरुपयोग न हो।


    कृपया ध्यान दें कि आपके जमा पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर उपलब्ध है,
    जो बैंक की विफलता की स्थिति में आपकी जमा राशि की सुरक्षा सुनिश्चित करता है। हम
    केवल अपने उत्पादों की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं और
    व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 89d35930-5460-5c75-9fc7-43d3a8f7ec26
  title: आवर्ती जमा (RD) — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'चंद्रिका बैंक अपने ग्राहकों की सुरक्षा के लिए प्रतिबद्ध है। आवर्ती जमा (RD)
    के संदर्भ में, जालसाज अक्सर ''गारंटीड रिटर्न'' या ''किस्त माफी'' के झूठे वादों
    के साथ संपर्क करते हैं। वे आपसे आपके खाते का विवरण या व्यक्तिगत जानकारी मांग सकते
    हैं ताकि वे आपकी RD को ''अपग्रेड'' कर सकें।


    कृपया ध्यान दें कि चंद्रिका बैंक के कर्मचारी आपसे कभी भी आपका UPI PIN, OTP या
    नेट बैंकिंग पासवर्ड नहीं मांगेंगे। यदि कोई व्यक्ति आपको कॉल करके यह दावा करता
    है कि वह आपकी मासिक किस्त में छूट दिला सकता है या बिना किसी दस्तावेज़ के ब्याज
    दर बढ़ा सकता है, तो यह एक धोखाधड़ी का प्रयास हो सकता है।


    यदि आपको कोई संदिग्ध संदेश या कॉल प्राप्त होता है, तो तुरंत हमें सूचित करें। हम
    RBI के समय-सीमा ढांचे के अनुसार शिकायतों का निवारण करते हैं। सुरक्षा सुनिश्चित
    करने के लिए, किसी भी खाते की स्थिति बदलने से पहले PAN और आधार-आधारित KYC सत्यापन
    अनिवार्य है। सतर्क रहें और अपनी गोपनीय जानकारी किसी के साथ साझा न करें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: be77b95d-64f5-52a8-b38f-49c279e4c251
  title: आवर्ती जमा (RD) — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'आवर्ती जमा (RD) खाता अनुशासन के साथ बचत करने के लिए बनाया गया है, इसलिए इसमें
    कुछ विशिष्ट सीमाएँ और शर्तें लागू होती हैं:


    1. न्यूनतम जमा सीमा: इस खाते को शुरू करने और बनाए रखने के लिए न्यूनतम मासिक किस्त
    ₹500 अनिवार्य है।

    2. निर्धारित अवधि: इस उत्पाद के लिए निवेश की अवधि 24 महीने निर्धारित है।

    3. ब्याज दर: इस अवधि के लिए लागू ब्याज दर 6.8% है।

    4. किस्त चूकने का प्रभाव: यदि किसी महीने की किस्त समय पर जमा नहीं की जाती है,
    तो ₹10 का जुर्माना लगाया जाएगा।

    5. समयपूर्व निकासी: यदि आप परिपक्वता अवधि से पहले खाता बंद करते हैं, तो समयपूर्व
    निकासी दंड लागू होगा।


    अपवाद स्थितियाँ: उच्च मूल्य वाले ग्राहकों के लिए बैंक की मानक शर्तों के आधार पर
    कुछ शुल्क छूट प्रदान की जा सकती है। सभी जमाएं DICGC बीमा के तहत ₹5,00,000 तक सुरक्षित
    हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 976e963e-fb7f-5997-b9a7-2764e4defa51
  title: आवर्ती जमा (RD) — किस्त चूकने पर जुर्माना की व्याख्या
  body: 'प्रश्न: यदि मैं अपनी मासिक किस्त जमा करना भूल जाता हूँ, तो क्या होगा?

    उत्तर: आवर्ती जमा (RD) में निरंतरता आवश्यक है। यदि आप अपनी निर्धारित मासिक किस्त
    समय पर जमा नहीं करते हैं, तो आपके खाते पर ₹10 का जुर्माना लगाया जाएगा।


    प्रश्न: क्या यह जुर्माना हर महीने लगेगा?

    उत्तर: हाँ, प्रत्येक चूकी हुई किस्त के लिए यह शुल्क लागू होता है। नियमित बचत सुनिश्चित
    करने के लिए हम ऑटो-डेबिट सुविधा की सलाह देते हैं। अधिक जानकारी के लिए ''आवर्ती
    जमा (RD) — लागत और शुल्क'' देखें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
