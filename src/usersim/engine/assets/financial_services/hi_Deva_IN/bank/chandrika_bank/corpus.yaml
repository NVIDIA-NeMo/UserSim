- id: ec9ead67-d078-5ea6-99a5-3e20ddd54453
  title: 1-वर्षीय सावधि जमा (FD) — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपनी 1-वर्षीय सावधि जमा (FD) को बंद करने या समय से पहले रद्द करने के लिए
    इन चरणों का पालन करें:


    1. हमें अपनी FD खाता संख्या प्रदान करें और राशि निकालने का अनुरोध करें।

    2. हम आपके PAN और आधार-आधारित KYC विवरणों का सत्यापन करेंगे ताकि आपकी पहचान सुनिश्चित
    हो सके।

    3. हम आपको सूचित करेंगे कि यदि आप 12 महीने की अवधि पूरी होने से पहले पैसा निकाल
    रहे हैं, तो आपकी ब्याज राशि से 1% का समयपूर्व निकासी दंड काटा जाएगा।

    4. आप यह चुन सकते हैं कि परिपक्वता राशि और ब्याज आपके मौजूदा चंद्रिका बैंक बचत
    खाते में स्थानांतरित किए जाएं या चेक के माध्यम से दिए जाएं।

    5. एक बार अनुरोध संसाधित हो जाने के बाद, हम आपको बंद किए गए खाते और अंतिम भुगतान
    राशि का पुष्टिकरण विवरण प्रदान करेंगे।


    सफलतापूर्वक बंद होने पर, आपके खाते के विवरण में जमा राशि और अर्जित ब्याज (दंड
    काटकर) दिखाई देगी।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
