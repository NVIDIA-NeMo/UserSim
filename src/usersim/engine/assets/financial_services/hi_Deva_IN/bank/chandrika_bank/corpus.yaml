- id: f3a462bf-cabd-50f0-b199-af3ca5be04ed
  title: UPI और बिल भुगतान — रेफरल और लॉयल्टी ऑफर
  body: चंद्रिका बैंक के साथ अपनी डिजिटल भुगतान यात्रा शुरू करें! यदि आप हमारे 'UPI
    और बिल भुगतान' सेवा का उपयोग पहली बार कर रहे हैं, तो आप हमारे विशेष रेफरल प्रोग्राम
    का लाभ उठा सकते हैं। अपने किसी मित्र या परिवार के सदस्य को हमारे सुरक्षित बैंकिंग
    अनुभव से जोड़ें। जब आपका रेफरल सफलतापूर्वक अपना पहला लेनदेन पूरा करता है, तो आप
    और आपके मित्र दोनों एक निश्चित कैशबैक पुरस्कार के पात्र होंगे। यह ऑफर केवल सीमित
    समय के लिए उपलब्ध है। अधिक जानकारी के लिए कृपया अपनी पात्रता की जांच करें।
  domain: payments
