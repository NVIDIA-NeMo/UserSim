- id: 71a68fef-0e6a-50f7-b4f1-f6563bfbf4ea
  title: 1-वर्षीय सावधि जमा (FD) — विफल या लंबित कार्रवाई
  body: 'यदि आपकी FD बुकिंग विफल हो जाती है या लंबित रहती है, तो कृपया निम्नलिखित
    जांचें:


    लक्षण: आपके खाते से राशि कट गई है लेकिन FD रसीद प्राप्त नहीं हुई है, या ''लेनदेन
    विफल'' का संदेश मिला है।


    संभावित कारण और समाधान:

    1. अपर्याप्त शेष: जांचें कि आपके खाते में न्यूनतम ₹10000 और आवश्यक करों के लिए
    पर्याप्त राशि थी।

    2. KYC अधूरा होना: यदि आपका PAN या आधार अद्यतित नहीं है, तो सुरक्षा कारणों से
    कार्रवाई लंबित हो सकती है। कृपया अपना KYC विवरण सत्यापित करें।

    3. तकनीकी त्रुटि: कभी-कभी बैंकिंग सर्वर में देरी के कारण रसीद अपडेट होने में समय
    लगता है।


    समाधान प्रक्रिया:

    - हम सबसे पहले आपके खाते के लेनदेन और KYC स्थिति की जांच करेंगे।

    - यदि राशि कट गई है और FD नहीं बनी है, तो हम इसे प्राथमिकता के आधार पर ठीक करेंगे
    और राशि वापस करेंगे या FD सक्रिय करेंगे।

    - गंभीर मामलों में, हम RBI के समय-सीमा ढांचे (TAT) के अनुसार शिकायत दर्ज करेंगे
    और आपको अपडेट प्रदान करेंगे।'
