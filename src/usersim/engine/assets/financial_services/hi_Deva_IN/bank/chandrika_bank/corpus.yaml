- id: 74d6435f-d283-5691-9faa-62ef677f02ba
  title: UPI और बिल भुगतान — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी ''UPI और बिल भुगतान'' सेवा को बंद करना या रद्द करना चाहते हैं,
    तो इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपनी UPI सेवा को बंद करना चाहते हैं और अपना पंजीकृत मोबाइल
    नंबर प्रदान करें।

    2. सुरक्षा सत्यापन के लिए, हम आपसे आपका PAN या आधार-आधारित KYC विवरण मांगेंगे।

    3. यदि आपके पास कोई सक्रिय ऑटोपे मैंडेट (जैसे ₹15,000 तक की सीमा वाले) हैं, तो
    हमें उन्हें रद्द करने का निर्देश दें।

    4. हम आपके खाते से UPI आईडी को डी-रजिस्टर करेंगे और पुष्टि करेंगे कि सेवा अब निष्क्रिय
    है।


    सफलतापूर्वक बंद होने पर, आपको एक पुष्टिकरण संदेश प्राप्त होगा। यदि आप केवल अपनी
    लेनदेन सीमा को कम (डाउनग्रेड) करना चाहते हैं, तो आप हमें नई वांछित सीमा बताने
    का अनुरोध कर सकते हैं, जो हमारी अधिकतम ₹100,000 की सीमा के भीतर होनी चाहिए।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 729cbd5c-6d00-5377-a8ab-08135096597f
  title: UPI और बिल भुगतान — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते में कोई अनपेक्षित शुल्क या गलत राशि कटी हुई दिखाई देती
    है, तो निम्न चरणों का पालन करें:


    - लक्षण: बैंक स्टेटमेंट में ऐसी राशि का दिखना जो आपने अधिकृत नहीं की थी या शुल्क
    का कटना।

    - संभावित कारण: असफल लेनदेन जो बाद में प्रोसेस हो गया, गलत ऑटोपे मैंडेट निष्पादन,
    या तकनीकी त्रुटि।

    - जाँच करें: पहले अपना लेनदेन इतिहास देखें और जाँचें कि क्या राशि ₹500 (UPI Lite)
    या ₹15,000 (बिना AFA ऑटोपे) जैसी विशिष्ट सीमाओं से संबंधित है।

    - समाधान: हमें लेनदेन आईडी के साथ समस्या बताएं। हम RBI के समय-सीमा ढांचे के अनुसार
    इसकी जाँच करेंगे।

    - निवारण: यदि यह बैंक की गलती है, तो राशि आपके खाते में वापस जमा कर दी जाएगी।
    गंभीर मामलों को तुरंत चार्जबैक प्रक्रिया के लिए भेजा जाता है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 016c5709-c48b-5aad-8d12-6c5c9fd8421c
  title: UPI और बिल भुगतान — आवश्यक दस्तावेज़
  body: 'सेवा सक्रियण के लिए आवश्यक दस्तावेज़ और शर्तें:


    - पहचान प्रमाण: PAN कार्ड (अनिवार्य)

    - पता प्रमाण: आधार कार्ड (अनिवार्य)

    - मोबाइल नंबर: बैंक खाते से लिंक सक्रिय मोबाइल नंबर

    - सत्यापन प्रक्रिया: पूर्ण KYC (Know Your Customer) प्रक्रिया का पूरा होना अनिवार्य
    है।


    उपरोक्त सभी दस्तावेज़ प्रदान करने के बाद ही ग्राहक ₹100,000 की दैनिक सीमा के साथ
    UPI सेवा का लाभ उठा सकता है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: eligibility_matrix
  source_authority: official
