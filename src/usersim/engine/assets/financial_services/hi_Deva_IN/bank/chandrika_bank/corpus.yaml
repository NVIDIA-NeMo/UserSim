  institution_id: chandrika_bank
- id: c4af8b0e-babb-5947-a861-3814ec29a9ef
  title: 1-वर्षीय सावधि जमा (FD) — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'चंद्रिका बैंक में आपकी जमा राशि की सुरक्षा हमारी प्राथमिकता है। 1-वर्षीय
    सावधि जमा (FD) के ग्राहकों को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ जालसाज
    आपको ''गारंटीड रिटर्न'' बढ़ाने या FD को ''अपग्रेड'' करने का लालच देते हैं। कृपया
    ध्यान दें कि चंद्रिका बैंक के प्रतिनिधि आपसे कभी भी आपका UPI PIN, OTP, या नेट
    बैंकिंग पासवर्ड साझा करने के लिए नहीं कहेंगे।


    हमारा सुरक्षा मानक यह है कि किसी भी खाते की स्थिति बदलने या जानकारी साझा करने
    से पहले PAN और आधार-आधारित KYC सत्यापन अनिवार्य है। यदि आपको कोई संदिग्ध कॉल या
    संदेश प्राप्त होता है, तो तुरंत हमें सूचित करें। असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग
    के लिए हम RBI के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं। याद रखें,
    आपकी जमा राशि पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर उपलब्ध है, जो बैंक विफल
    होने की स्थिति में आपकी सुरक्षा सुनिश्चित करता है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: security_advisory
  source_authority: official
