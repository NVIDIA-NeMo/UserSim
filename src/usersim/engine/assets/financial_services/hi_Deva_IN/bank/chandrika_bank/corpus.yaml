- id: fbc9a49d-9009-5938-a0a9-d58da35cdbdb
  title: UPI और बिल भुगतान — AFA के बिना ऑटोपे मैंडेट की सीमा की व्याख्या
  body: 'प्रश्न: ऑटोपे मैंडेट क्या है और बिना AFA के इसकी सीमा क्या है?

    उत्तर: ऑटोपे मैंडेट आपको अपने आवर्ती बिलों के लिए स्वचालित भुगतान निर्धारित करने
    की अनुमति देता है। सुरक्षा और सुविधा के बीच संतुलन बनाने के लिए, हमने बिना अतिरिक्त
    प्रमाणीकरण (AFA) के ऑटोपे मैंडेट के लिए ₹15000 की सीमा तय की है। यदि आपका भुगतान
    इस राशि से अधिक है, तो प्रत्येक लेनदेन के लिए प्रमाणीकरण आवश्यक होगा। अधिक जानकारी
    के लिए UPI और बिल भुगतान — सिंहावलोकन देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7165414a-daa4-5ed0-91c9-059c950ebbe4
  title: UPI और बिल भुगतान — स्थिति या इतिहास देखना
  body: 'अपने UPI और बिल भुगतान लेनदेन का इतिहास और वर्तमान स्थिति देखने के लिए इन
    चरणों का पालन करें:


    1. हमें बताएं कि आप अपने लेनदेन का इतिहास या किसी विशिष्ट भुगतान की स्थिति देखना
    चाहते हैं।

    2. सत्यापन के लिए अपना पंजीकृत मोबाइल नंबर और PAN विवरण साझा करें।

    3. यदि आप किसी विशेष समय अवधि (जैसे पिछला एक महीना) या किसी विशेष मर्चेंट के लेनदेन
    देखना चाहते हैं, तो वह विवरण दें।

    4. हम आपके अनुरोध को प्रोसेस करेंगे और आपको आपके हालिया लेनदेन की सूची, जिसमें
    राशि, दिनांक और भुगतान की स्थिति (सफल, लंबित या विफल) शामिल है, प्रदान करेंगे।


    आप यह पुष्टि कर सकते हैं कि विवरण सही हैं। यदि किसी लेनदेन की स्थिति ''लंबित''
    है, तो हम आपको अपेक्षित समाधान समय के बारे में सूचित करेंगे।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
