- id: bc290a71-02df-5762-90cc-3062301cb9b4
  title: आवर्ती जमा (RD) — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: ग्राहक को अपनी आवर्ती जमा (RD) में किस्त जमा करने या खाता बंद करने
    का अनुरोध करने पर ''अस्वीकृत'' या ''अवरुद्ध'' त्रुटि प्राप्त हो रही है।


    संभावित कारण:

    - अधूरा KYC: यदि आपका PAN या आधार-आधारित KYC अपडेट नहीं है, तो सुरक्षा कारणों
    से खाते की कार्रवाइयां अवरुद्ध की जा सकती हैं।

    - अपर्याप्त शेष: यदि ऑटो-डेबिट सेट है और आपके बचत खाते में ₹500 से कम राशि है,
    तो लेनदेन विफल हो सकता है।

    - तकनीकी समस्या: सिस्टम रखरखाव के कारण अस्थायी रुकावट।


    समाधान प्रक्रिया:

    1. सबसे पहले अपना KYC स्टेटस चेक करें। यदि अधूरा है, तो आवश्यक दस्तावेज़ जमा करें।

    2. सुनिश्चित करें कि आपके लिंक्ड खाते में न्यूनतम मासिक किस्त ₹500 उपलब्ध है।

    3. यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति की आंतरिक
    समीक्षा करेंगे।


    निवारण: यदि यह एक तकनीकी त्रुटि है, तो हम मामले को प्राथमिकता के आधार पर हल करेंगे।
    गंभीर मामलों को नियामक पथ पर भेजा जाएगा।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
