- id: 5c29bf73-ecd3-5826-8e51-d538d3ce1e5e
  title: 1-वर्षीय सावधि जमा (FD) — यहाँ के समान उत्पाद से तुलना
  body: 'यदि आप 1-वर्षीय सावधि जमा (FD) की तुलना हमारे अन्य उत्पादों से कर रहे हैं:


    - बनाम नियमित बचत खाता: नियमित बचत खाता तरलता प्रदान करता है, जबकि 1-वर्षीय सावधि
    जमा (FD) 12 माह के लॉक-इन के साथ 7.1% की उच्च और निश्चित ब्याज दर प्रदान करता
    है।

    - बनाम आवर्ती जमा (RD): RD मासिक बचत के लिए है, जबकि 1-वर्षीय सावधि जमा (FD) एकमुश्त
    निवेश (न्यूनतम ₹10000) के लिए है।


    यह उत्पाद उन ग्राहकों के लिए बेहतर है जिनके पास एकमुश्त राशि उपलब्ध है और वे इसे
    एक वर्ष के लिए सुरक्षित निवेश करना चाहते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: comparison
  source_authority: official
  placeholder: true
