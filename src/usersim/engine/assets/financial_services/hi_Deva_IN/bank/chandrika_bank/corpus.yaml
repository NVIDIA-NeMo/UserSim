  institution_id: chandrika_bank
- id: 850ee36c-093b-5ff2-af11-69a5ca2bfcc3
  title: UPI और बिल भुगतान — विफल या लंबित कार्रवाई
  body: 'यदि आपका ''UPI और बिल भुगतान'' लेनदेन विफल हो जाता है या लंबित रहता है, तो
    कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: राशि खाते से कट गई है लेकिन प्राप्तकर्ता को नहीं मिली, या ''लेनदेन लंबित''
    (Transaction Pending) संदेश दिख रहा है।


    संभावित कारण:

    1. बैंक सर्वर या NPCI रेल में तकनीकी समस्या।

    2. इंटरनेट कनेक्टिविटी की कमी।

    3. लेनदेन सीमा (जैसे ₹100000 की दैनिक सीमा) का पार होना।


    समाधान:

    - सबसे पहले अपना खाता विवरण जांचें कि राशि वास्तव में डेबिट हुई है या नहीं।

    - 48 से 72 घंटे तक प्रतीक्षा करें, क्योंकि अधिकांश लंबित लेनदेन इस समय सीमा में
    स्वतः सुलझ जाते हैं।


    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम RBI के समय-सीमा ढांचे (TAT) का
    पालन करते हुए आपकी शिकायत का प्राथमिकता के आधार पर निवारण करेंगे। गंभीर मामलों
    को तुरंत चार्जबैक और नियामक पथ पर भेजा जाएगा।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 324a7914-eb78-5a37-a70f-7c4803f2902a
  title: UPI और बिल भुगतान — पात्रता शर्तें
  body: 'सेवा का लाभ उठाने के लिए निम्नलिखित पात्रता शर्तें अनिवार्य हैं:


    | शर्त | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | खाता स्थिति | सक्रिय बचत या चालू खाता | सेवा के लिए पात्र |

    | KYC स्थिति | पूर्ण (PAN और आधार सत्यापित) | सक्रियण संभव |

    | मोबाइल नंबर | बैंक खाते से लिंक और सक्रिय | UPI ID निर्माण संभव |

    | पहचान सत्यापन | अनिवार्य KYC प्रक्रिया | अनिवार्य आवश्यकता |


    यदि आपकी KYC लंबित है, तो कृपया इसे पूर्ण करें ताकि आप ₹100000 तक की दैनिक लेनदेन
    सीमा का लाभ उठा सकें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 0eebbf07-46b0-5f87-9836-a63aca53a1c7
  title: UPI और बिल भुगतान — यहाँ के समान उत्पाद से तुलना
  body: '''UPI और बिल भुगतान'' की तुलना जब हम ''चंद्रिका एवरीडे क्रेडिट कार्ड'' से
    करते हैं, तो मुख्य अंतर निम्नलिखित हैं:


    - गति और लागत: UPI तत्काल है और लेनदेन शुल्क ₹0 है, जबकि क्रेडिट कार्ड में क्रेडिट
    अवधि मिलती है लेकिन कुछ मामलों में वार्षिक शुल्क लागू हो सकता है।

    - सीमाएँ: UPI में ₹100000 की दैनिक सीमा है, जबकि क्रेडिट कार्ड की सीमा आपकी क्रेडिट
    पात्रता पर निर्भर करती है।

    - उपयोग: UPI छोटे और मध्यम दैनिक भुगतानों के लिए सर्वोत्तम है, जबकि क्रेडिट कार्ड
    उच्च मूल्य की खरीदारी और रिवॉर्ड्स के लिए उपयुक्त है।


    यदि आप तत्काल और मुफ्त स्थानांतरण चाहते हैं, तो UPI चुनें। यदि आप उधार सुविधा
    और रिवॉर्ड्स चाहते हैं, तो क्रेडिट कार्ड बेहतर है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 717e4b67-67de-5182-b38c-87f4ed3217ee
  title: UPI और बिल भुगतान — नियामक प्रकटीकरण
  body: 'यह सेवा RBI और NPCI के दिशा-निर्देशों के अनुसार संचालित होती है। ''UPI और
    बिल भुगतान'' का उपयोग करते समय कृपया निम्नलिखित विनियामक शर्तों को ध्यान से पढ़ें:


    1. लेनदेन सीमाएँ: सुरक्षा कारणों से, प्रति लेनदेन और दैनिक सीमा ₹100000 निर्धारित
    है। UPI Lite के लिए यह सीमा ₹500 है।

    2. ऑटोपे सीमा: AFA के बिना ऑटोपे मैंडेट के लिए अधिकतम सीमा ₹15000 है।

    3. सुरक्षा: हम ग्राहकों को सख्त निर्देश देते हैं कि अपना UPI PIN या OTP किसी भी
    व्यक्ति या संस्था के साथ साझा न करें।

    4. जमा सुरक्षा: आपके खाते में मौजूद जमा पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर
    उपलब्ध है।

    5. विवाद निवारण: असफल लेनदेन की रिपोर्टिंग और समाधान RBI के समय-सीमा ढांचे (TAT)
    के तहत किए जाते हैं।


    हम केवल शैक्षिक जानकारी प्रदान करते हैं और व्यक्तिगत वित्तीय सलाह नहीं देते हैं।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9910bebb-1035-5ab5-a7de-73a1151b4808
  title: UPI और बिल भुगतान — ब्याज दर अनुसूची
  body: '''UPI और बिल भुगतान'' एक भुगतान सेवा है, कोई निवेश उत्पाद नहीं है। इसलिए,
    इस सेवा के माध्यम से किए गए लेनदेन या इस सेवा के उपयोग पर कोई ब्याज नहीं दिया
    जाता है। आपके खाते में शेष राशि पर ब्याज की दरें आपके द्वारा चुने गए खाते के प्रकार
    (जैसे ''नियमित बचत खाता'') पर निर्भर करती हैं। विस्तृत ब्याज दरों के लिए कृपया
    ''नियमित बचत खाता — ब्याज दर अनुसूची'' देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 1ca55416-445f-5df5-a83c-6c42afdbe269
  title: UPI और बिल भुगतान — वर्तमान ऑफर
  body: 'विशेष ऑफर: डिजिटल इंडिया को बढ़ावा देने के लिए, चंद्रिका बैंक अपने सभी ग्राहकों
    के लिए ''UPI और बिल भुगतान'' सेवा पर कैशबैक ऑफर लाया है।


    अवधि: यह ऑफर 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक वैध है।


    ऑफर विवरण: इस अवधि के दौरान अपने पहले 5 बिल भुगतानों पर ₹50 का फ्लैट कैशबैक प्राप्त
    करें। यह लाभ केवल उन खातों के लिए उपलब्ध है जिन्होंने इस अवधि के दौरान अपनी UPI
    सेवा सक्रिय की है। नियम और शर्तें लागू हैं।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e77d19ca-5dd7-5e39-b52f-2abf06d97751
  title: UPI और बिल भुगतान — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'चंद्रिका बैंक अपने ग्राहकों की सुरक्षा को प्राथमिकता देता है। UPI और बिल
    भुगतान का उपयोग करते समय, कृपया ध्यान रखें कि धोखाधड़ी करने वाले अक्सर ''पैसे
    प्राप्त करने'' के लिए आपको UPI PIN दर्ज करने या OTP साझा करने के लिए कह सकते हैं।
    याद रखें, पैसे प्राप्त करने के लिए PIN की आवश्यकता नहीं होती है; PIN केवल पैसे
    भेजने के लिए होता है।


    हम आपसे कभी भी आपका UPI PIN, पासवर्ड या OTP नहीं मांगेंगे। यदि आपको कोई संदिग्ध
    कॉल या संदेश प्राप्त होता है, तो उसे तुरंत अनदेखा करें। यदि आपके खाते से कोई अनधिकृत
    लेनदेन होता है, तो उसकी रिपोर्ट तुरंत करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग
    के लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं। गंभीर मामलों
    को प्राथमिकता के आधार पर चार्जबैक और नियामक पथ पर भेजा जाता है। सुरक्षा सुनिश्चित
    करने के लिए, अपने डिवाइस का लॉक पिन मजबूत रखें और किसी भी अनजान लिंक पर क्लिक
    न करें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: security_advisory
  source_authority: official
