- id: 4388f2fb-c6fc-5ca0-a0c0-15b7eeaf9c59
  title: UPI और बिल भुगतान — जोखिम प्रकटीकरण
  body: 'कृपया ध्यान दें कि ''UPI और बिल भुगतान'' सेवा का उपयोग करते समय कुछ जोखिम
    शामिल होते हैं। डिजिटल लेनदेन में तकनीकी विफलता या नेटवर्क त्रुटियों के कारण लेनदेन
    लंबित हो सकते हैं।


    सीमाओं का प्रकटीकरण: आपकी सुरक्षा के लिए, प्रति लेनदेन और दैनिक सीमा ₹100,000
    निर्धारित है। बिना AFA के ऑटोपे मैंडेट ₹15,000 तक सीमित हैं। इन सीमाओं का उद्देश्य
    बड़े पैमाने पर अनधिकृत लेनदेन के जोखिम को कम करना है।


    बैंक किसी भी ऐसे नुकसान के लिए उत्तरदायी नहीं होगा जो ग्राहक द्वारा अपना UPI PIN
    या OTP साझा करने के कारण हुआ हो। हम केवल उत्पाद की विशेषताओं के बारे में शैक्षिक
    जानकारी देते हैं और व्यक्तिगत कानूनी सलाह नहीं देते हैं। सभी लेनदेन NPCI के नियमों
    और RBI के नियामक ढांचे के अधीन हैं।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: disclosure
