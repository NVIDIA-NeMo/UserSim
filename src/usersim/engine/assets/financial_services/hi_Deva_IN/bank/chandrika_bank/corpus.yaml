- id: 3edad48d-abe4-5630-b0eb-f66b96217223
  title: 1-वर्षीय सावधि जमा (FD) — बदलाव या अद्यतन करना
  body: 'यदि आप अपनी मौजूदा 1-वर्षीय सावधि जमा (FD) में कोई विवरण बदलना चाहते हैं,
    तो इन चरणों का पालन करें:


    1. हमें वह विशिष्ट जानकारी बताएं जिसे आप अपडेट करना चाहते हैं (जैसे कि नामांकित
    व्यक्ति/नॉमिनी का नाम या संपर्क विवरण)।

    2. अपनी पहचान सत्यापित करने के लिए अपना PAN और आधार विवरण प्रदान करें; हम सुरक्षा
    के लिए अनिवार्य KYC सत्यापन करेंगे।

    3. यदि आप परिपक्वता निर्देश (Maturity Instructions) बदलना चाहते हैं, तो स्पष्ट
    करें कि क्या आप मूल राशि और ब्याज को नवीनीकृत (Renew) करना चाहते हैं या अपने बचत
    खाते में स्थानांतरित करना चाहते हैं।

    4. हम आपके अनुरोध को संसाधित करेंगे और आपको एक पुष्टिकरण संदेश भेजेंगे कि विवरण
    अपडेट कर दिए गए हैं।


    ध्यान दें: FD की मूल अवधि (12 महीने) या न्यूनतम जमा राशि (₹10,000) में बदलाव संभव
    नहीं है। यदि आप राशि निकालना चाहते हैं, तो 1% का समयपूर्व निकासी दंड लागू होगा।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e28303a9-a7d1-5196-bd99-eafb24669d16
  title: 1-वर्षीय सावधि जमा (FD) — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: ग्राहक अपनी सावधि जमा (FD) का विवरण देखने या डिजिटल रसीद एक्सेस करने
    में असमर्थ हैं।


    संभावित कारण और समाधान:

    1. KYC लंबित: यदि आपका KYC अपडेट नहीं है, तो सुरक्षा कारणों से एक्सेस प्रतिबंधित
    हो सकता है। कृपया अपना PAN और आधार सत्यापित करें।

    2. प्रमाणीकरण विफलता: गलत OTP या पासवर्ड का उपयोग। कृपया पुनः प्रयास करें।

    3. खाता स्थिति: यदि खाता ''फ्रीज'' है, तो एक्सेस नहीं मिलेगा।


    समाधान प्रक्रिया:

    - सबसे पहले अपने पंजीकृत मोबाइल नंबर पर प्राप्त OTP की जाँच करें।

    - यदि समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते की स्थिति की समीक्षा
    करेंगे।

    - यदि यह एक तकनीकी त्रुटि है, तो हम इसे अपनी तकनीकी टीम को भेजेंगे और 2-3 कार्य
    दिवसों में समाधान प्रदान करेंगे।


    यदि समस्या का समाधान नहीं होता है, तो मामला आंतरिक शिकायत अधिकारी को भेजा जाएगा,
    और आवश्यकता पड़ने पर इसे RBI लोकपाल तक ले जाया जा सकता है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e34fa63b-70dd-51c5-9291-02104dfd92c8
  title: 1-वर्षीय सावधि जमा (FD) — पात्रता श्रेणियाँ
  body: 'पात्रता मानदंड और परिणाम:


    - मानदंड: न्यूनतम जमा राशि ₹10,000 और वैध KYC (PAN/आधार) -> परिणाम: खाता खोलने
    के लिए पात्र (ब्याज दर: 7.1%)

    - मानदंड: आयु 60 वर्ष या उससे अधिक और न्यूनतम जमा ₹10,000 -> परिणाम: वरिष्ठ नागरिक
    श्रेणी के लिए पात्र (ब्याज दर: 7.1% + 0.5% = 7.6%)

    - मानदंड: जमा राशि ₹10,000 से कम -> परिणाम: इस विशिष्ट उत्पाद (fixed_deposit_1yr)
    के लिए अपात्र

    - मानदंड: अधूरा KYC दस्तावेज़ -> परिणाम: सत्यापन पूरा होने तक खाता खोलने में असमर्थ'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5be08fa6-4f6a-5e43-ac06-9ea986833372
  title: 1-वर्षीय सावधि जमा (FD) — श्रेणियों या विकल्पों में से चुनाव
  body: 'सही निवेश विकल्प का चुनाव करें:


    1-वर्षीय सावधि जमा (FD):

    - लाभ: 7.1% की निश्चित ब्याज दर और उच्च सुरक्षा।

    - लॉक-इन: 12 महीने की निश्चित अवधि।

    - जोखिम: कम, DICGC द्वारा ₹5,00,000 तक बीमा कवर।

    - उपयुक्त: उन लोगों के लिए जो एक साल के लिए एकमुश्त राशि सुरक्षित निवेश करना चाहते
    हैं।


    आवर्ती जमा (RD):

    - संरचना: मासिक किस्तों के माध्यम से बचत।

    - उपयुक्त: उन लोगों के लिए जो एकमुश्त राशि के बजाय हर महीने छोटी बचत करना पसंद
    करते हैं।


    नियमित बचत खाता:

    - लाभ: धन की तत्काल निकासी की सुविधा।

    - उपयुक्त: दैनिक लेनदेन और आपातकालीन फंड के लिए।


    यदि आप अधिकतम निश्चित रिटर्न चाहते हैं, तो 1-वर्षीय सावधि जमा (FD) सबसे बेहतर
    विकल्प है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: dd58586d-8b6b-55c1-ba70-1172f2dc0c03
  title: 1-वर्षीय सावधि जमा (FD) — गोपनीयता और डेटा प्रबंधन
  body: 'चंद्रिका बैंक आपकी गोपनीयता और डेटा सुरक्षा के प्रति प्रतिबद्ध है। 1-वर्षीय
    सावधि जमा (FD) खाते के संचालन के दौरान एकत्र की गई सभी जानकारी, जिसमें PAN, आधार
    और वित्तीय विवरण शामिल हैं, RBI के डेटा गोपनीयता दिशानिर्देशों के अनुसार प्रबंधित
    की जाती है।


    मुख्य प्रकटीकरण:

    - डेटा उपयोग: आपके विवरणों का उपयोग केवल KYC सत्यापन, विनियामक रिपोर्टिंग और उत्पाद
    सेवाओं के प्रबंधन के लिए किया जाता है।

    - सुरक्षा मानक: हम सख्त प्रमाणीकरण मानकों का पालन करते हैं ताकि आपके निवेश विवरण
    अनधिकृत एक्सेस से सुरक्षित रहें।

    - नियामक सुरक्षा: आपका जमा DICGC बीमा द्वारा ₹5,00,000 तक सुरक्षित है, जो बैंक
    विफल होने की स्थिति में सुरक्षा प्रदान करता है।

    - साझाकरण: हम आपकी व्यक्तिगत जानकारी किसी तीसरे पक्ष को तब तक साझा नहीं करते जब
    तक कि कानूनी रूप से आवश्यक न हो या नियामक अधिकारियों द्वारा अनुरोध न किया गया
    हो।


    हम ग्राहकों के हितों की रक्षा और निष्पक्ष व्यवहार को अपने संचालन के केंद्र में
    रखते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: dd968034-5db3-5d72-a568-541d8d988f4d
  title: आवर्ती जमा (RD) — सिंहावलोकन
  body: 'चंद्रिका बैंक का आवर्ती जमा (RD) मध्यम वर्ग और बचत करने वाले परिवारों के
    लिए एक आदर्श समाधान है, जो अनुशासित मासिक बचत के माध्यम से भविष्य के लक्ष्यों
    को पूरा करने का साधन प्रदान करता है। यह उत्पाद आपको एक निश्चित अवधि के लिए नियमित
    रूप से एक छोटी राशि जमा करने और उस पर आकर्षक ब्याज अर्जित करने की अनुमति देता
    है।


    मुख्य विशेषताएं और शर्तें:

    - न्यूनतम मासिक किस्त: ₹500

    - निर्धारित अवधि: 24 माह

    - वार्षिक ब्याज दर: 6.8%

    - किस्त चूकने पर जुर्माना: ₹10 प्रति छूटी हुई किस्त


    यह खाता उन ग्राहकों के लिए उपयुक्त है जो एकमुश्त बड़ी राशि निवेश नहीं कर सकते
    लेकिन समय के साथ एक सुरक्षित कोष बनाना चाहते हैं। हम यह सुनिश्चित करते हैं कि
    आपकी जमा राशि सुरक्षित रहे और आपको पारदर्शी बैंकिंग का अनुभव मिले।


    डिस्क्लेमर: यह उत्पाद बैंक की मानक शर्तों और ग्राहक की पात्रता के आधार पर प्रदान
    किया जाता है। हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 82c7fbfa-bb68-5fb6-af73-3707bba3efc3
  title: आवर्ती जमा (RD) — न्यूनतम मासिक किस्त की व्याख्या
  body: 'प्रश्न: मैं अपने आवर्ती जमा (RD) खाते में हर महीने कम से कम कितनी राशि जमा
    कर सकता हूँ?

    उत्तर: आवर्ती जमा (RD) खाता शुरू करने और उसे सक्रिय रखने के लिए न्यूनतम मासिक
    किस्त ₹500 है। आपको हर महीने इस राशि या इससे अधिक का योगदान देना होगा।


    प्रश्न: यदि मैं किसी महीने न्यूनतम किस्त जमा नहीं कर पाता हूँ तो क्या होगा?

    उत्तर: यदि आप मासिक किस्त जमा करने में विफल रहते हैं, तो ₹10 का जुर्माना लगाया
    जाएगा। अधिक जानकारी के लिए कृपया आवर्ती जमा (RD) — शुल्क अनुसूची देखें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: e6096b91-874b-50fc-896c-48775f2e5846
  title: आवर्ती जमा (RD) — सेटअप और सक्रियण
  body: 'अपने भविष्य के लक्ष्यों के लिए आवर्ती जमा (RD) खाता सेटअप करने के लिए इन
    चरणों का पालन करें:


    1. हमें सूचित करें कि आप आवर्ती जमा (RD) खाता खोलना चाहते हैं और वह मासिक राशि
    बताएं जिसे आप निवेश करना चाहते हैं (न्यूनतम ₹500)।

    2. अपनी पहचान सत्यापित करने के लिए हमें अपना PAN और आधार प्रदान करें। हम अनिवार्य
    KYC सत्यापन प्रक्रिया पूरी करेंगे।

    3. हम आपसे पुष्टि करेंगे कि आपकी चुनी हुई अवधि 24 माह है और इस पर 6.8% की वार्षिक
    ब्याज दर लागू होगी।

    4. अपनी पहली मासिक किस्त जमा करें।

    5. एक बार जमा हो जाने पर, हम आपको आपके खाते के विवरण और सक्रियण की पुष्टि प्रदान
    करेंगे।


    सफलता का संकेत: आपको एक खाता विवरण प्राप्त होगा जिसमें आपकी मासिक किस्त की राशि,
    24 माह की अवधि और 6.8% की ब्याज दर स्पष्ट रूप से अंकित होगी।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 04dd1577-8411-533a-8966-81abdc01f5d4
  title: आवर्ती जमा (RD) — शुल्क अनुसूची
  body: 'चंद्रिका बैंक आवर्ती जमा (RD) के लिए एक पारदर्शी शुल्क ढांचा अपनाता है ताकि
    परिचालन लागत को कवर किया जा सके। इस उत्पाद के लिए लागू शुल्क निम्नलिखित है:


    - छूटी हुई मासिक किस्त पर जुर्माना: ₹10 (प्रति किस्त)


    अन्य किसी भी शुल्क या सेवा प्रभार के बारे में जानकारी के लिए आप अपनी शाखा से संपर्क
    कर सकते हैं। कृपया ध्यान दें कि शुल्क संरचनाएं बैंक की नीतियों के अनुसार बदली
    जा सकती हैं।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: accabcca-9145-5bca-ac8f-f445c45939b0
  title: आवर्ती जमा (RD) — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने आवर्ती जमा (RD) खाते में किसी समस्या का सामना करना पड़ रहा है,
    तो कृपया नीचे दिए गए समाधान देखें:


    लक्षण: "मेरी मासिक किस्त जमा नहीं हुई है या खाते में अपडेट नहीं हुई है।"


    संभावित कारण:

    1. आपके लिंक किए गए बचत खाते में पर्याप्त शेष राशि नहीं थी।

    2. तकनीकी समस्या के कारण लेनदेन लंबित है।


    जांच के चरण:

    - सबसे पहले अपने बचत खाते का बैलेंस चेक करें कि क्या उसमें ₹500 या आपकी निर्धारित
    किस्त की राशि उपलब्ध थी।

    - अपने हालिया लेनदेन इतिहास की जांच करें कि क्या राशि डेबिट हुई है।


    समाधान:

    - यदि राशि डेबिट नहीं हुई है, तो कृपया तुरंत किस्त जमा करें ताकि ₹10 का जुर्माना
    न लगे।

    - यदि राशि डेबिट हो गई है लेकिन RD में जमा नहीं हुई है, तो हमें सूचित करें।


    एस्केलेशन: यदि समस्या हल नहीं होती है, तो हम इसे प्राथमिकता के आधार पर आंतरिक
    शिकायत अधिकारी के पास भेजेंगे। हम RBI के समय-सीमा ढांचे (TAT) का पालन करते हैं
    और आपको समाधान की स्थिति अपडेट करेंगे।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c522ed9b-5c6b-51c3-8a5c-3e348de53a7b
  title: आवर्ती जमा (RD) — पात्रता शर्तें
  body: 'आवर्ती जमा (RD) खाता खोलने के लिए पात्रता शर्तें नीचे दी गई हैं:


    | शर्त | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | पहचान सत्यापन | वैध PAN और आधार | KYC पूर्ण होने पर खाता खोलने की अनुमति |

    | न्यूनतम निवेश क्षमता | ₹500 प्रति माह | खाता सक्रियण हेतु पात्र |

    | आयु/स्थिति | बैंक के मानक केवाईसी नियमों के अनुसार | खाता खोलने की पात्रता |

    | दस्तावेज | पूर्ण KYC दस्तावेज़ | खाता खोलने की प्रक्रिया शुरू होगी |'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 673fac8a-79f7-5921-951e-78404722c26f
  title: आवर्ती जमा (RD) — यहाँ के समान उत्पाद से तुलना
  body: 'यदि आप बचत के विकल्पों की तुलना कर रहे हैं, तो आवर्ती जमा (RD) और सावधि जमा
    (FD) के बीच मुख्य अंतर इस प्रकार हैं:


    - आवर्ती जमा (RD): इसमें आप हर महीने ₹500 जैसी छोटी राशि जमा करते हैं। यह 24 माह
    की अवधि और 6.8% ब्याज दर के साथ अनुशासित बचत के लिए है।

    - 1-वर्षीय सावधि जमा (FD): इसमें एकमुश्त बड़ी राशि जमा की जाती है।


    RD उन लोगों के लिए बेहतर है जिनकी मासिक आय है और जो धीरे-धीरे बचत करना चाहते हैं।
    FD उन लोगों के लिए उपयुक्त है जिनके पास पहले से ही एक बड़ी राशि उपलब्ध है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4c332d07-ce14-5368-bb78-d333a793a7b2
  title: आवर्ती जमा (RD) — नियामक प्रकटीकरण
  body: 'चंद्रिका बैंक RBI और NPCI के सभी दिशा-निर्देशों का कड़ाई से पालन करता है।
    आवर्ती जमा (RD) के संबंध में निम्नलिखित नियामक प्रकटीकरण अनिवार्य हैं:


    1. जमा सुरक्षा: आपके सभी जमा पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर प्रदान किया
    जाता है, जो बैंक विफल होने की स्थिति में आपकी सुरक्षा सुनिश्चित करता है।

    2. ब्याज और अवधि: इस उत्पाद पर 6.8% की वार्षिक ब्याज दर 24 माह की अवधि के लिए
    लागू है।

    3. शुल्क: किस्त चूकने पर ₹10 का जुर्माना लगाया जाएगा, जो हमारे पारदर्शी शुल्क
    ढांचे का हिस्सा है।

    4. केवाईसी अनुपालन: खाता खोलने और संचालित करने के लिए PAN और आधार-आधारित KYC सत्यापन
    अनिवार्य है।


    हम डेटा गोपनीयता और निष्पक्ष व्यवहार के प्रति प्रतिबद्ध हैं। यह दस्तावेज़ केवल
    शैक्षिक जानकारी प्रदान करता है और इसे व्यक्तिगत कानूनी या टैक्स सलाह नहीं माना
    जाना चाहिए।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cb6682d2-52ca-5608-8599-4c924dd4dc5a
  title: आवर्ती जमा (RD) — ब्याज दर अनुसूची
  body: 'चंद्रिका बैंक आवर्ती जमा (RD) के लिए वर्तमान ब्याज दर निम्नलिखित है:


    - वार्षिक ब्याज दर: 6.8%

    - लागू अवधि: 24 माह


    यह एक स्थिर दर है जो सभी पात्र ग्राहकों के लिए समान रूप से लागू होती है। ब्याज
    की गणना बैंक के मानक नियमों के अनुसार की जाती है और परिपक्वता (maturity) पर देय
    होती है। ब्याज दरों में किसी भी बदलाव की सूचना बैंक द्वारा समय-समय पर दी जाएगी।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f35d9559-a169-52d8-8716-9a86f52d51ab
  title: आवर्ती जमा (RD) — वर्तमान ऑफर
  body: 'अपने भविष्य को सुरक्षित करें! चंद्रिका बैंक अपने मौजूदा ग्राहकों के लिए एक
    विशेष बचत अवसर लेकर आया है।


    आज ही अपना आवर्ती जमा (RD) खाता शुरू करें और 6.8% की प्रतिस्पर्धी वार्षिक ब्याज
    दर का लाभ उठाएं। केवल ₹500 की न्यूनतम मासिक किस्त के साथ 24 माह की अवधि के लिए
    निवेश करें और अपनी बचत को बढ़ते हुए देखें।


    यह ऑफर सीमित समय के लिए उपलब्ध है। अधिक विवरण के लिए अपनी निकटतम शाखा में आएं
    या हमारे डिजिटल चैट के माध्यम से हमसे जुड़ें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 30973de6-f1ac-5b13-99fb-9dfb25cabe60
  title: आवर्ती जमा (RD) — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'चंद्रिका बैंक में आपकी बचत की सुरक्षा हमारी सर्वोच्च प्राथमिकता है। आवर्ती
    जमा (RD) खातों को निशाना बनाने वाले सामान्य स्कैम में फर्जी ''बोनस ब्याज'' या
    ''प्रीमियम रिवॉर्ड'' के वादे शामिल होते हैं, जहाँ जालसाज आपसे आपके खाते का विवरण
    मांगते हैं।


    कृपया ध्यान दें कि चंद्रिका बैंक के कर्मचारी आपसे कभी भी आपका UPI PIN, OTP, या
    नेट बैंकिंग पासवर्ड साझा करने के लिए नहीं कहेंगे। किसी भी अनधिकृत गतिविधि या संदिग्ध
    संदेश की रिपोर्ट तुरंत करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के लिए RBI
    के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं। यदि आपको लगता है कि आपके
    खाते के साथ कोई छेड़छाड़ हुई है, तो तुरंत हमें सूचित करें ताकि हम सुरक्षात्मक
    कदम उठा सकें और गंभीर मामलों को चार्जबैक और नियामक पथ पर भेज सकें।


    सुरक्षा के लिए याद रखें कि किसी भी जानकारी को साझा करने से पहले PAN और आधार-आधारित
    KYC सत्यापन अनिवार्य है। अपनी गोपनीय जानकारी को सुरक्षित रखें ताकि आपकी मेहनत
    की कमाई सुरक्षित रहे।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: cac6c9bb-670d-5978-8a05-e705aa5947be
  title: आवर्ती जमा (RD) — खाता अनुबंध
  body: 'यह अनुबंध चंद्रिका बैंक और खाताधारक के बीच आवर्ती जमा (RD) के संचालन के लिए
    बाध्यकारी शर्तों को निर्धारित करता है।


    1. जमा दायित्व: ग्राहक प्रत्येक माह न्यूनतम ₹500 की किस्त जमा करने के लिए सहमत
    है।

    2. अवधि और ब्याज: खाता 24 माह की निश्चित अवधि के लिए खोला जाएगा, जिस पर 6.8% की
    वार्षिक ब्याज दर लागू होगी।

    3. दंड प्रावधान: यदि कोई मासिक किस्त समय पर जमा नहीं की जाती है, तो प्रति चूक
    ₹10 का जुर्माना लगाया जाएगा।

    4. समयपूर्व निकासी: परिपक्वता अवधि से पहले खाता बंद करने पर ''समयपूर्व निकासी
    दंड'' लागू होगा, जैसा कि हमारी शब्दावली में परिभाषित है।

    5. बैंक के अधिकार: बैंक RBI और NPCI के दिशानिर्देशों के अनुसार शर्तों में बदलाव
    करने का अधिकार सुरक्षित रखता है।

    6. समाप्ति: यह अनुबंध 24 माह की अवधि पूरी होने या ग्राहक द्वारा वैध समयपूर्व निकासी
    अनुरोध के बाद समाप्त होगा।


    सभी जमा राशि पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर प्रदान किया जाता है।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: terms_conditions
  source_authority: official
