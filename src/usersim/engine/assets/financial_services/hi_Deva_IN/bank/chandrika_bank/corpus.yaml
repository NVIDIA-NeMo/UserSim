  mentions_tools: []
  institution_id: chandrika_bank
- id: e152282c-7b65-5854-8934-6b5056493494
  title: UPI और बिल भुगतान — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपका UPI लेनदेन अस्वीकृत या अवरुद्ध हो जाता है, तो कृपया निम्नलिखित जांचें:


    - पर्याप्त शेष राशि: सुनिश्चित करें कि आपके खाते में आवश्यक राशि उपलब्ध है।

    - सीमा उल्लंघन: जांचें कि क्या आपका लेनदेन ₹100000 की प्रति लेनदेन सीमा या ₹100000
    की दैनिक सीमा को पार कर रहा है।

    - UPI Lite सीमा: यदि आप Lite का उपयोग कर रहे हैं, तो सुनिश्चित करें कि राशि ₹500
    से अधिक नहीं है।

    - KYC स्थिति: जांचें कि आपका KYC अपडेटेड है, क्योंकि अधूरा KYC सेवाओं को अवरुद्ध
    कर सकता है।


    समाधान:

    यदि उपरोक्त सब सही है और समस्या बनी रहती है, तो हमें सूचित करें। हम आपके खाते
    की तकनीकी स्थिति की जांच करेंगे। यदि समस्या बैंक के स्तर पर है, तो हम इसे आंतरिक
    तकनीकी टीम को भेजेंगे और आपको 2-3 कार्य दिवसों के भीतर समाधान प्रदान करेंगे। असफल
    लेनदेन के लिए हम RBI के समय-सीमा ढांचे का पालन करते हैं।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 486f1dd5-ff6b-508e-9f48-5e942dceea06
  title: UPI और बिल भुगतान — कब स्विच या अपग्रेड करें
  body: 'ग्राहक को UPI और बिल भुगतान से अन्य विकल्पों पर तब स्विच करने की सलाह दें
    जब:


    1. उनकी दैनिक लेनदेन आवश्यकता ₹100000 की सीमा से अधिक हो।

    2. उन्हें बड़े कॉर्पोरेट भुगतान करने हों जो UPI की सीमाओं के अधीन नहीं होने चाहिए।

    3. यदि वे क्रेडिट आधारित लचीलेपन की तलाश में हैं, तो उन्हें चंद्रिका एवरीडे क्रेडिट
    कार्ड की अनुशंसा करें।


    UPI उन ग्राहकों के लिए सर्वोत्तम है जिन्हें त्वरित, डिजिटल और मुफ्त दैनिक भुगतान
    की आवश्यकता है।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 0ee15978-331a-5a2b-83d3-c5f00b8306f8
  title: UPI और बिल भुगतान — विकल्पों से तुलना और कब न चुनें
  body: 'UPI और बिल भुगतान एक अत्यंत कुशल डिजिटल समाधान है, लेकिन यह हर स्थिति के
    लिए आदर्श नहीं है।


    तुलना और चयन:

    - बनाम नेट बैंकिंग: नेट बैंकिंग उच्च मूल्य के हस्तांतरण के लिए बेहतर है, जबकि
    UPI ₹100000 की दैनिक सीमा के साथ त्वरित छोटे भुगतानों के लिए श्रेष्ठ है।

    - बनाम क्रेडिट कार्ड: यदि ग्राहक को तत्काल नकदी प्रवाह की आवश्यकता है या रिवॉर्ड्स
    चाहिए, तो चंद्रिका एवरीडे क्रेडिट कार्ड बेहतर विकल्प है।

    - बनाम UPI Lite: बहुत छोटे भुगतानों के लिए UPI Lite (सीमा ₹500 प्रति लेनदेन) का
    उपयोग करें ताकि बैंक स्टेटमेंट अनावश्यक रूप से न भरे।


    कब न चुनें:

    - जब आपको ₹100000 से अधिक का एकल भुगतान करना हो।

    - जब आपके पास सक्रिय इंटरनेट कनेक्शन या स्मार्टफोन उपलब्ध न हो।

    - जब आपको ऋण सुविधा की आवश्यकता हो।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 7f1a6a5c-abbf-567d-9ed5-15ab41eaf20c
  title: UPI और बिल भुगतान — लागत और शुल्क
  body: 'प्रश्न: क्या UPI और बिल भुगतान सेवाओं के लिए कोई शुल्क लिया जाता है?

    उत्तर: चंद्रिका बैंक द्वारा प्रदान की जाने वाली मानक UPI और बिल भुगतान सेवाएँ
    ग्राहकों के लिए पारदर्शी और निःशुल्क हैं। हम परिचालन लागत को कवर करने के लिए केवल
    उन शुल्कों को लागू करते हैं जो नियामक दिशानिर्देशों के अनुसार हैं। विस्तृत जानकारी
    के लिए UPI और बिल भुगतान — शुल्क अनुसूची देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5b705d75-9feb-578a-a8ba-2b6409ac1019
  title: UPI और बिल भुगतान — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'एक नए बिलर को जोड़ने और उसका भुगतान करने की पूर्ण प्रक्रिया यहाँ दी गई है:


    1. हमें सूचित करें कि आप एक नया बिल भुगतान (जैसे बिजली या पानी का बिल) सेटअप करना
    चाहते हैं।

    2. बिलर का नाम, उपभोक्ता संख्या (Consumer Number) और सेवा प्रदाता का विवरण प्रदान
    करें।

    3. हम बिलर की पुष्टि करेंगे और देय राशि (Amount Due) की जांच करेंगे।

    4. यदि आप भुगतान को ऑटोपे (Autopay) पर सेट करना चाहते हैं, तो हमें बताएं। याद
    रखें कि बिना AFA के इसकी सीमा ₹15000 है।

    5. भुगतान की पुष्टि के लिए अपना UPI PIN दर्ज करें (यदि आवश्यक हो)।

    6. एक बार भुगतान सफल होने पर, हम आपको एक पुष्टिकरण संदेश और लेनदेन संदर्भ संख्या
    प्रदान करेंगे।


    इस तरह आपका बिल भुगतान अनुरोध सफलतापूर्वक पूरा हो जाएगा।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c57f2e6c-2a82-5243-b3dd-5f3acab52824
  title: UPI और बिल भुगतान — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि ग्राहक दावा करता है कि उनके रिकॉर्ड और बैंक स्टेटमेंट में UPI लेनदेन
    के विवरण में अंतर है, तो सहायता एजेंट को निम्नलिखित कदम उठाने चाहिए:


    1. ग्राहक से विवादित लेनदेन की तिथि, राशि और ट्रांजेक्शन आईडी मांगें।

    2. बैंक के आंतरिक लेजर और NPCI के स्टेटस के साथ मिलान करें।

    3. यदि राशि खाते से कट गई है लेकिन मर्चेंट को नहीं मिली है, तो लेनदेन की वर्तमान
    स्थिति (Pending/Failed) की जांच करें।

    4. यदि विवरण में विसंगति पाई जाती है, तो इसे ''असफल लेनदेन'' के रूप में दर्ज करें।


    समाधान और समय-सीमा:

    हम RBI के समय-सीमा ढांचे (TAT) का पालन करते हैं। यदि मामला गंभीर है, तो इसे तुरंत
    चार्जबैक और नियामक पथ पर भेजा जाएगा। ग्राहक को सूचित करें कि समाधान होने तक उन्हें
    एक शिकायत संदर्भ संख्या दी जाएगी और प्रगति के बारे में अपडेट किया जाएगा।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c827cf02-3bca-5d71-9201-91dfa7ecdd59
  title: संस्था-व्यापी शुल्क और प्रभार
  body: चंद्रिका बैंक में हमारा शुल्क ढांचा पूरी तरह से पारदर्शी है और इसे परिचालन
    लागत को कवर करने के लिए डिज़ाइन किया गया है। हमारे सभी खातों पर मानक सेवा शुल्क
    लागू होते हैं। उदाहरण के लिए, नियमित बचत खाते में Monthly Average Balance (MAB)
    बनाए रखने का शुल्क लागू होता है यदि शेष निर्धारित सीमा से कम हो जाता है। इसके
    अतिरिक्त, कुछ विशिष्ट सेवाओं के लिए उत्पाद-आधारित शुल्क अलग-अलग हो सकते हैं। उच्च
    मूल्य वाले ग्राहकों के लिए, विशिष्ट वार्षिक खर्च सीमाएं पूरी करने पर वार्षिक शुल्क
    में छूट प्रदान की जाती है।
  domain: retail_banking
  product_category: general
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: af1020b2-4f2a-5815-96e0-87f69ceaf16d
  title: सामान्य अक्सर पूछे जाने वाले प्रश्न
  body: 'प्रश्न: मैं अपनी पहचान कैसे सत्यापित कर सकता हूँ?

    उत्तर: हम सुरक्षा के लिए PAN और आधार-आधारित KYC सत्यापन का उपयोग करते हैं।


    प्रश्न: यदि मेरा लेनदेन विफल हो जाता है तो क्या होगा?

    उत्तर: हम असफल लेनदेन के लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन
    करते हैं। विवरण के लिए ''भुगतान के लिए नियामक नोट्स'' देखें।


    प्रश्न: सहायता के लिए मैं बैंक से कैसे संपर्क करूँ?

    उत्तर: आप हमारी शाखाओं, फोन बैंकिंग या डिजिटल चैट के माध्यम से भारतीय मानक समय
    (IST) के अनुसार सहायता प्राप्त कर सकते हैं।'
  domain: retail_banking
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: d4df5d2f-32b4-5e7a-8552-6c121e564ce1
  title: रिटेल बैंकिंग के लिए नियामक नोट्स
  body: "चंद्रिका बैंक रिटेल बैंकिंग संचालन में RBI के सभी दिशा-निर्देशों का कड़ाई\
    \ से पालन करता है। एजेंटों के लिए यह अनिवार्य है कि वे ग्राहकों के साथ निष्पक्ष\
    \ व्यवहार सुनिश्चित करें और डेटा गोपनीयता के मानकों को बनाए रखें। \n\nएक महत्वपूर्ण\
    \ नियामक सुरक्षा यह है कि हमारे सभी ग्राहकों के जमा पर DICGC बीमा कवर उपलब्ध है,\
    \ जो बैंक विफल होने की स्थिति में जमाकर्ताओं को ₹5,00,000 तक की सुरक्षा प्रदान\
    \ करता है। एजेंट को ग्राहकों को इस सुरक्षा के बारे में सूचित करना चाहिए। इसके\
    \ अलावा, किसी भी खाते की स्थिति बदलने या संवेदनशील जानकारी साझा करने से पहले PAN\
    \ और आधार-आधारित KYC सत्यापन करना अनिवार्य है। किसी भी स्थिति में, ग्राहकों को\
    \ अपना UPI PIN या OTP साझा न करने की सलाह दी जानी चाहिए।"
  domain: retail_banking
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 87b56f7c-d1e8-5f2c-97fe-1551cd80b9d8
  title: कार्ड के लिए नियामक नोट्स
  body: "चंद्रिका एवरीडे क्रेडिट कार्ड और अन्य कार्ड सेवाओं का प्रबंधन RBI के क्रेडिट\
    \ कार्ड और उपभोक्ता संरक्षण दिशानिर्देशों के तहत किया जाता है। एजेंटों को यह सुनिश्चित\
    \ करना चाहिए कि सभी शुल्क और ब्याज दरों का खुलासा स्पष्ट रूप से किया गया है। \n\
    \nधोखाधड़ी या अनधिकृत लेनदेन की रिपोर्टिंग के मामले में, बैंक RBI के निर्धारित\
    \ समय-सीमा ढांचे (turn-around-time) का पालन करता है। गंभीर मामलों को प्राथमिकता\
    \ के आधार पर तुरंत चार्जबैक और नियामक पथ पर भेजा जाना चाहिए। एजेंटों को ग्राहकों\
    \ को सुरक्षा अलर्ट सेट करने के लिए प्रोत्साहित करना चाहिए और किसी भी संदिग्ध गतिविधि\
    \ की रिपोर्ट तुरंत करने के लिए मार्गदर्शन करना चाहिए। कार्ड जारी करने से पहले\
    \ पूर्ण KYC सत्यापन अनिवार्य है।"
  domain: cards
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ae3206a4-2432-5dc1-888c-bd806f48993c
  title: भुगतान के लिए नियामक नोट्स
  body: "UPI और अन्य डिजिटल भुगतान सेवाओं के लिए, चंद्रिका बैंक NPCI और RBI के नियमों\
    \ का पालन करता है। सभी डिजिटल लेनदेन सुरक्षित प्रमाणीकरण मानकों के अधीन हैं। \n\
    \nविफल लेनदेन के समाधान के लिए, बैंक RBI के समय-सीमा ढांचे (turn-around-time)\
    \ के अनुसार कार्य करता है। यदि कोई ग्राहक किसी भुगतान विवाद की रिपोर्ट करता है,\
    \ तो एजेंट को निर्धारित समय सीमा के भीतर समाधान सुनिश्चित करना चाहिए। ग्राहकों\
    \ को बार-बार यह चेतावनी दी जानी चाहिए कि बैंक कभी भी उनका UPI PIN या OTP नहीं\
    \ मांगता है। किसी भी भुगतान संबंधी शिकायत का निवारण प्राथमिकता के आधार पर किया\
    \ जाता है, और यदि आंतरिक शिकायत अधिकारी द्वारा समाधान नहीं होता है, तो मामला RBI\
    \ लोकपाल तक जा सकता है।"
  domain: payments
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: fe64ed54-c153-5c7a-b92a-35d5fc3ec44c
  title: get_account_transactions का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने खाते के हालिया लेनदेन, विशिष्ट भुगतान की स्थिति, या
    बैलेंस में आए बदलावों की जांच करनी हो, तब एजेंट को get_account_transactions टूल
    का उपयोग करना चाहिए।


    प्रक्रिया:

    1. सबसे पहले, verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक ने केवल खाते के अंतिम चार अंक दिए हैं, तो get_accounts का उपयोग
    करके संबंधित account_id प्राप्त करें।

    3. विशिष्ट समय सीमा या लेनदेन विवरण के आधार पर get_account_transactions टूल को
    कॉल करें।

    4. प्राप्त लेनदेन इतिहास को सरल और विनम्र भाषा में ग्राहक को प्रस्तुत करें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: chandrika_bank
- id: 743c1345-cd25-54a2-88eb-c7f7dc35a695
  title: get_account_transactions टूल संदर्भ
  body: 'टूल: get_account_transactions

    विवरण: यह टूल किसी विशिष्ट खाते के लिए लेनदेन का विवरण और इतिहास प्राप्त करता
    है।

    तर्क (Arguments): account_id (अनिवार्य), start_date (वैकल्पिक), end_date (वैकल्पिक)।

    प्रभाव: यह खाते के लेनदेन की एक सूची प्रदान करता है।

    एजेंट इस कार्रवाई को सीधे टूल कॉल करके पूरा करता है; ग्राहक को किसी बाहरी पोर्टल
    या ऐप पर भेजने की आवश्यकता नहीं है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_account_transactions
  institution_id: chandrika_bank
- id: 44ea043b-26ee-5d45-931e-071f4f818443
  title: make_upi_payment का उपयोग कब करें
  body: 'जब कोई ग्राहक UPI के माध्यम से त्वरित और डिजिटल भुगतान करना चाहता है, तब
    एजेंट को make_upi_payment टूल का उपयोग करना चाहिए।


    प्रक्रिया:

    1. verify_identity टूल के माध्यम से ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts का उपयोग करके सही account_id का पता लगाएं जिससे राशि काटी जानी
    है।

    3. ग्राहक से प्राप्तकर्ता की UPI ID और सटीक भुगतान राशि (₹) की पुष्टि करें।

    4. make_upi_payment टूल को आवश्यक विवरणों के साथ कॉल करें।

    5. लेनदेन सफल होने के बाद, ग्राहक को पुष्टि संदेश भेजें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: chandrika_bank
- id: 146535b3-b005-5bb2-a983-89b3fbb35d5e
  title: make_upi_payment टूल संदर्भ
  body: 'टूल: make_upi_payment

    विवरण: NPCI रेल के माध्यम से एक खाते से दूसरे खाते में त्वरित डिजिटल भुगतान करता
    है।

    तर्क (Arguments): account_id (अनिवार्य), payee_upi_id (अनिवार्य), amount (अनिवार्य)।

    प्रभाव: ग्राहक के खाते से राशि डेबिट होती है और प्राप्तकर्ता को भेजी जाती है।

    एजेंट इस कार्रवाई को सीधे टूल कॉल करके पूरा करता है, ग्राहक को स्वयं भुगतान करने
    के लिए निर्देशित नहीं करता।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - make_upi_payment
  institution_id: chandrika_bank
- id: 19d13d3f-63b9-5c6b-b6ed-3c3b5799ee00
  title: book_fixed_deposit का उपयोग कब करें
  body: 'जब कोई ग्राहक एक निश्चित अवधि के लिए उच्च ब्याज दर पर सुरक्षित निवेश करना
    चाहता है, तो एजेंट को book_fixed_deposit टूल का उपयोग करना चाहिए।


    प्रक्रिया:

    1. verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts के माध्यम से वह स्रोत खाता (source account) खोजें जिससे निवेश
    राशि ली जानी है।

    3. ग्राहक से जमा राशि (₹) और वांछित अवधि (जैसे 1-वर्षीय सावधि जमा (FD)) की पुष्टि
    करें।

    4. book_fixed_deposit टूल को कॉल करें।

    5. ग्राहक को निवेश की पुष्टि करें और उन्हें समयपूर्व निकासी दंड के बारे में सूचित
    करें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - book_fixed_deposit
  institution_id: chandrika_bank
- id: 4171dd44-8dc6-533d-b6c7-33898a1d1167
  title: book_fixed_deposit टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के लिए नया सावधि जमा खाता खोलने की अनुमति देता है।


    **टूल सिग्नेचर:** `book_fixed_deposit(account_id: string, amount: number, tenure_months:
    integer)`


    **प्रभाव:** यह निर्दिष्ट बचत खाते से धनराशि डेबिट करता है और एक नया FD खाता बनाता
    है। एजेंट इस टूल को सीधे कॉल करके यह कार्रवाई पूरी करता है। इसका उपयोग मुख्य रूप
    से 1-वर्षीय सावधि जमा (FD) जैसे उत्पादों के लिए किया जाता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - book_fixed_deposit
  institution_id: chandrika_bank
- id: a30ed83a-9b81-52f5-b394-ed50971a9e7d
  title: file_transaction_dispute का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने खाते में किसी अनधिकृत या गलत लेनदेन का अनुभव होता
    है, तो एजेंट को इस प्रक्रिया का पालन करना चाहिए। चंद्रिका बैंक असफल लेनदेन और
    धोखाधड़ी के लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन करता है।


    **कार्यवाही के चरण:**

    1. ग्राहक की पहचान सत्यापित करने के लिए `verify_identity` का उपयोग करें।

    2. `get_accounts` का उपयोग करके ग्राहक का सही खाता विवरण प्राप्त करें।

    3. `get_account_transactions` के माध्यम से विवादित लेनदेन की पहचान करें।

    4. विवाद के विवरण और लेनदेन आईडी के साथ `file_transaction_dispute` टूल को कॉल
    करें।


    गंभीर मामलों को तुरंत चार्जबैक और नियामक पथ पर भेजा जाता है। अधिक जानकारी के लिए
    ''रिटेल बैंकिंग के लिए नियामक नोट्स'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: chandrika_bank
- id: 9bcb91d6-738b-5677-8f80-c5cac6fd1f74
  title: file_transaction_dispute टूल संदर्भ
  body: 'यह टूल किसी विशिष्ट लेनदेन के लिए औपचारिक विवाद दर्ज करने के लिए उपयोग किया
    जाता है।


    **टूल सिग्नेचर:** `file_transaction_dispute(transaction_id: string, reason: string)`


    **प्रभाव:** यह सिस्टम में एक विवाद टिकट बनाता है जिसे प्राथमिकता के आधार पर बैंक
    की जांच टीम द्वारा देखा जाता है। एजेंट इस कार्रवाई को सीधे टूल कॉल के माध्यम से
    निष्पादित करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_transaction_dispute
  institution_id: chandrika_bank
- id: 9992743b-692d-5219-b817-b643e1fe6352
  title: freeze_card का उपयोग कब करें
  body: 'जब ग्राहक रिपोर्ट करता है कि उनका कार्ड खो गया है, चोरी हो गया है, या उन्हें
    अनधिकृत गतिविधि का संदेह है, तो सुरक्षा के लिए कार्ड को तुरंत फ्रीज करना आवश्यक
    है।


    **कार्यवाही के चरण:**

    1. सबसे पहले `verify_identity` टूल का उपयोग करके ग्राहक की पहचान सुनिश्चित करें।

    2. `get_accounts` का उपयोग करके उस खाते की पहचान करें जिससे कार्ड जुड़ा है।

    3. कार्ड को तत्काल प्रभाव से ब्लॉक करने के लिए `freeze_card` टूल को कॉल करें।


    हम ग्राहकों को अपना UPI PIN या OTP कभी साझा न करने की सलाह देते हैं। कार्ड फ्रीज
    होने के बाद, ग्राहक नया कार्ड मंगवा सकते हैं। विस्तृत सुरक्षा निर्देशों के लिए
    ''नियमित बचत खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: chandrika_bank
- id: ac3d7600-ab34-571c-b670-12ea30086bba
  title: freeze_card टूल संदर्भ
  body: 'यह टूल किसी ग्राहक के डेबिट या क्रेडिट कार्ड को तुरंत निष्क्रिय (freeze)
    करने के लिए उपयोग किया जाता है।


    **टूल सिग्नेचर:** `freeze_card(card_id: string)`


    **प्रभाव:** यह कार्ड पर सभी नए लेनदेन को रोकता है, जिससे अनधिकृत उपयोग का जोखिम
    समाप्त हो जाता है। एजेंट इस कार्रवाई को सीधे टूल कॉल करके पूरा करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - freeze_card
  institution_id: chandrika_bank
- id: ccc4faeb-f05f-55b0-a5a3-8956631725f6
  title: get_accounts का उपयोग कब करें
  body: 'एजेंट को किसी भी खाता-विशिष्ट विवरण या कार्रवाई से पहले ग्राहक के साथ जुड़े
    सभी खातों की सूची प्राप्त करनी चाहिए।


    **कार्यवाही के चरण:**

    1. ग्राहक की पहचान सत्यापित करने के लिए `verify_identity` का उपयोग करें।

    2. ग्राहक के प्रोफाइल से जुड़े सभी सक्रिय खातों, उनकी आईडी और प्रकार की सूची प्राप्त
    करने के लिए `get_accounts` टूल को कॉल करें।

    3. यदि ग्राहक ने केवल खाते के अंतिम 4 अंक बताए हैं, तो `get_accounts` के परिणामों
    का उपयोग करके पूर्ण `account_id` का मिलान करें।


    यह प्रक्रिया सुनिश्चित करती है कि सही खाते पर कार्रवाई की जा रही है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: chandrika_bank
- id: 9ff2c1be-e2a3-51eb-944e-2f31620b94ad
  title: get_accounts टूल संदर्भ
  body: 'यह टूल एक सत्यापित ग्राहक से जुड़े सभी बैंक खातों की सूची पुनः प्राप्त करता
    है।


    **टूल सिग्नेचर:** `get_accounts()`


    **प्रभाव:** यह ग्राहक के नाम पर मौजूद सभी खातों की सूची (जैसे नियमित बचत खाता,
    सावधि जमा) प्रदान करता है, जिसमें प्रत्येक खाते की विशिष्ट आईडी शामिल होती है।
    एजेंट इसे सीधे कॉल करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: chandrika_bank
- id: 64d7362a-1f30-5eae-8344-4c1191babec6
  title: open_account का उपयोग कब करें
  body: 'नया खाता खोलने के लिए, एजेंट को बैंक की पात्रता शर्तों और नियामक दिशानिर्देशों
    का पालन करना चाहिए।


    **कार्यवाही के चरण:**

    1. यह सुनिश्चित करें कि ग्राहक के पास PAN और आधार-आधारित KYC सत्यापन पूरा है।

    2. यदि ग्राहक पहले से बैंक का सदस्य नहीं है, तो बुनियादी पहचान सत्यापन करें।

    3. उत्पाद का चयन करें (जैसे: नियमित बचत खाता)।

    4. आवश्यक विवरणों के साथ `open_account` टूल को कॉल करें।


    हम केवल अपने उत्पादों की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं;
    हम व्यक्तिगत टैक्स या कानूनी सलाह नहीं देते हैं। पात्रता के बारे में अधिक जानकारी
    के लिए ''नियमित बचत खाता — पात्रता शर्तें'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: chandrika_bank
- id: 0d104474-a0b7-510e-8570-37a61129b995
  title: open_account टूल संदर्भ
  body: 'यह टूल ग्राहक के लिए एक नया बैंकिंग खाता बनाने के लिए उपयोग किया जाता है।


    **टूल सिग्नेचर:** `open_account(product_id: string, customer_details: object)`


    **प्रभाव:** यह सिस्टम में एक नया खाता खाता (account record) बनाता है और एक विशिष्ट
    `account_id` आवंटित करता है। एजेंट इस टूल को सीधे कॉल करके खाता खोलता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: chandrika_bank
- id: 6e410191-9e5f-5e2d-9790-7ae00a8a0d1b
  title: close_account का उपयोग कब करें
  body: 'खाता बंद करना एक अपरिवर्तनीय (irreversible) कार्रवाई है, इसलिए एजेंट को अत्यधिक
    सावधानी बरतनी चाहिए।


    **कार्यवाही के चरण:**

    1. `verify_identity` का उपयोग करके ग्राहक की पहचान का कड़ाई से सत्यापन करें।

    2. `get_accounts` का उपयोग करके बंद किए जाने वाले खाते की पुष्टि करें।

    3. सुनिश्चित करें कि खाते में कोई बकाया राशि या लंबित लेनदेन नहीं है।

    4. अंतिम पुष्टि के बाद, `close_account` टूल को कॉल करें।


    ग्राहक को सूचित करें कि एक बार बंद होने के बाद इस खाते को पुनः सक्रिय नहीं किया
    जा सकता। बचत खातों को बंद करने की विस्तृत प्रक्रिया के लिए ''नियमित बचत खाता —
    रद्द करना, बंद करना या डाउनग्रेड करना'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: chandrika_bank
- id: 456f94f9-edd2-5ce9-8e8f-5d43dfc1a8ff
  title: close_account टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के अनुरोध पर उनके बैंक खाते को स्थायी रूप से बंद करने
    की अनुमति देता है।


    हस्ताक्षर (Signature):

    `close_account(account_id: string)`


    प्रभाव:

    यह टूल निर्दिष्ट account_id वाले खाते को बंद कर देता है। यह एक अपरिवर्तनीय (irreversible)
    कार्रवाई है। एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है, ग्राहक को
    किसी बाहरी पोर्टल या शाखा में भेजने के बजाय।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: chandrika_bank
- id: 7e2f70d9-26f3-505f-b321-fb12a7b0c0f3
  title: update_contact_info का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने पंजीकृत मोबाइल नंबर, ईमेल पते या आवासीय पते को बदलने
    की आवश्यकता होती है, तब इस प्रक्रिया का पालन किया जाता है। यह सुनिश्चित करना अनिवार्य
    है कि संचार विवरण सटीक हैं ताकि बैंक के महत्वपूर्ण अलर्ट और सूचनाएं सही व्यक्ति
    तक पहुंचें।


    प्रक्रिया के चरण:

    1. सबसे पहले, `verify_identity` टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक केवल खाते के अंतिम चार अंक प्रदान करता है, तो सटीक account_id प्राप्त
    करने के लिए `get_accounts` टूल का उपयोग करें।

    3. ग्राहक से वह नई संपर्क जानकारी मांगें जिसे वे अपडेट करना चाहते हैं।

    4. अंत में, `update_contact_info` टूल को कॉल करके सिस्टम में विवरण अपडेट करें।


    नोट: सुरक्षा कारणों से, किसी भी बदलाव से पहले PAN और आधार-आधारित KYC सत्यापन अनिवार्य
    है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: chandrika_bank
- id: d8a21e19-5d3d-5263-abdb-01b758b46527
  title: update_contact_info टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के खाते से जुड़े संपर्क विवरण (जैसे फोन नंबर, ईमेल
    या पता) को अपडेट करने की सुविधा देता है।


    हस्ताक्षर (Signature):

    `update_contact_info(account_id: string, contact_details: object)`


    प्रभाव:

    यह टूल निर्दिष्ट खाते के लिए संपर्क जानकारी को बदल देता है। एजेंट इस कार्रवाई
    को सीधे टूल कॉल के माध्यम से पूरा करता है, जिससे ग्राहक को मैन्युअल फॉर्म भरने
    की आवश्यकता नहीं होती।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: chandrika_bank
- id: a3ed76b3-0265-524a-9b86-23a1cb57ccab
  title: get_statements का उपयोग कब करें
  body: 'जब ग्राहक अपने खाते के लेनदेन इतिहास, मासिक सारांश या कर उद्देश्यों के लिए
    विवरण (Statements) की मांग करते हैं, तब इस प्रक्रिया का उपयोग किया जाता है। बैंक
    पारदर्शी बैंकिंग के लिए डिजिटल स्टेटमेंट प्रदान करता है।


    प्रक्रिया के चरण:

    1. `verify_identity` टूल के माध्यम से ग्राहक की पहचान सत्यापित करें।

    2. यदि आवश्यक हो, तो `get_accounts` का उपयोग करके सही account_id का पता लगाएं।

    3. ग्राहक से स्टेटमेंट की अवधि (जैसे कि विशिष्ट महीना या तिमाही) पूछें।

    4. `get_statements` टूल को कॉल करके अनुरोधित अवधि के लिए विवरण प्राप्त करें और
    ग्राहक के साथ साझा करें।


    यह प्रक्रिया नियमित बचत खाता और अन्य जमा खातों के लिए उपलब्ध है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: chandrika_bank
- id: 276d4385-74dc-5d5f-b77f-205a6eb13c49
  title: get_statements टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के खाते के लिए आधिकारिक लेनदेन विवरण (Statements)
    निकालने की अनुमति देता है।


    हस्ताक्षर (Signature):

    `get_statements(account_id: string, period: string)`


    प्रभाव:

    यह टूल निर्दिष्ट समय अवधि के लिए खाते का विवरण पुनः प्राप्त करता है। एजेंट इस
    टूल का उपयोग करके सीधे बातचीत में विवरण प्रदान करता है, ग्राहक को बैंक की वेबसाइट
    या ऐप पर निर्देशित किए बिना।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: chandrika_bank
- id: 497241d8-1617-5607-a72c-c18323d5393d
  title: update_beneficiary का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपने फंड ट्रांसफर के लिए नए लाभार्थी (Beneficiary) को जोड़ना
    हो, मौजूदा लाभार्थी की जानकारी बदलनी हो या किसी पुराने लाभार्थी को हटाना हो, तब
    इस नीति का पालन करें। यह सुरक्षित डिजिटल भुगतान सुनिश्चित करने के लिए आवश्यक है।


    प्रक्रिया के चरण:

    1. `verify_identity` टूल का उपयोग करके ग्राहक की पहचान की पुष्टि करें।

    2. `get_accounts` का उपयोग करके ग्राहक के सक्रिय खाते की account_id प्राप्त करें।

    3. ग्राहक से लाभार्थी का विवरण (जैसे नाम, खाता संख्या और IFSC कोड) प्राप्त करें।

    4. `update_beneficiary` टूल का उपयोग करके लाभार्थी सूची को अपडेट करें।


    सुरक्षा चेतावनी: ग्राहकों को हमेशा सलाह दें कि वे केवल ज्ञात और सत्यापित व्यक्तियों
    को ही लाभार्थी के रूप में जोड़ें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: chandrika_bank
- id: 187ac323-ce30-5f91-ab73-63b22130c1c6
  title: update_beneficiary टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक की लाभार्थी सूची में बदलाव करने (जोड़ने, हटाने या
    संशोधित करने) की अनुमति देता है।


    हस्ताक्षर (Signature):

    `update_beneficiary(account_id: string, beneficiary_details: object)`


    प्रभाव:

    यह टूल खाते से जुड़े लाभार्थियों के विवरण को अपडेट करता है। एजेंट इस क्रिया को
    सीधे कॉल करके पूरा करता है, जिससे ग्राहक को बाहरी पोर्टल पर जाने की जरूरत नहीं
    पड़ती।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: chandrika_bank
- id: a172687b-48a9-5d0d-9fe3-40ec2e7f9ea5
  title: set_alerts का उपयोग कब करें
  body: 'ग्राहकों को उनके खाते की गतिविधियों, जैसे कि जमा, निकासी या कम शेष राशि की
    वास्तविक समय में सूचना प्राप्त करने के लिए अलर्ट सेट करने की सुविधा दी जाती है।
    यह सुरक्षा और बेहतर वित्तीय प्रबंधन में मदद करता है।


    प्रक्रिया के चरण:

    1. `verify_identity` का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. `get_accounts` के माध्यम से संबंधित account_id की पुष्टि करें।

    3. ग्राहक से पूछें कि वे किस प्रकार के अलर्ट (जैसे SMS, ईमेल, या पुश नोटिफिकेशन)
    और किन सीमाओं के लिए अलर्ट चाहते हैं।

    4. `set_alerts` टूल को कॉल करके ग्राहक की प्राथमिकताओं के अनुसार अलर्ट कॉन्फ़िगर
    करें।


    यह सेवा सभी डिजिटल बैंकिंग उपयोगकर्ताओं के लिए उपलब्ध है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: chandrika_bank
- id: e88a97b2-aa70-5020-ae7b-e15ec9be1cff
  title: set_alerts टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के खाते के लिए सूचनाएं और अलर्ट (Notifications/Alerts)
    सेट करने की अनुमति देता है।


    हस्ताक्षर (Signature):

    `set_alerts(account_id: string, alert_preferences: object)`


    प्रभाव:

    यह टूल निर्दिष्ट खाते के लिए अलर्ट सेटिंग्स को अपडेट करता है। एजेंट इस कार्रवाई
    को सीधे टूल कॉल के माध्यम से निष्पादित करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: chandrika_bank
- id: e47efb4f-15e3-5e9b-b153-c02a77bd7a3a
  title: transfer_funds का उपयोग कब करें
  body: 'जब ग्राहक अपने एक खाते से दूसरे खाते में या किसी अन्य व्यक्ति के खाते में
    धन स्थानांतरित (Transfer) करना चाहते हैं, तब इस प्रक्रिया का पालन किया जाता है।


    प्रक्रिया के चरण:

    1. `verify_identity` टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. `get_accounts` के माध्यम से प्रेषक (Sender) की account_id प्राप्त करें।

    3. ग्राहक से प्रेषित की जाने वाली राशि और प्राप्तकर्ता (Receiver) के विवरण मांगें।

    4. यह सुनिश्चित करें कि प्रेषक के खाते में पर्याप्त शेष राशि है।

    5. `transfer_funds` टूल को कॉल करके लेनदेन पूरा करें।


    सुरक्षा निर्देश: ग्राहकों को याद दिलाएं कि वे अपना UPI PIN या OTP किसी के साथ
    साझा न करें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: chandrika_bank
- id: d4d231c3-a4e6-5b79-a13b-9a39554520f9
  title: transfer_funds टूल संदर्भ
  body: 'transfer_funds टूल का उपयोग ग्राहक के एक खाते से दूसरे खाते में धनराशि स्थानांतरित
    करने के लिए किया जाता है। एजेंट इस टूल को सीधे कॉल करके लेनदेन पूरा करता है।


    तर्क (Arguments):

    - source_account_id: वह खाता जिससे पैसा निकाला जाना है।

    - destination_account_id: वह खाता जिसमें पैसा जमा किया जाना है।

    - amount: स्थानांतरित की जाने वाली राशि (₹ में)।

    - currency: मुद्रा का प्रकार (डिफ़ॉल्ट ''INR'')।


    प्रभाव: यह टूल स्रोत खाते से राशि डेबिट करता है और गंतव्य खाते में क्रेडिट करता
    है, जिससे वास्तविक समय में शेष राशि अपडेट हो जाती है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - transfer_funds
  institution_id: chandrika_bank
- id: c3e7d476-ae08-5ea3-b319-2f7346e7898a
  title: order_replacement_card का उपयोग कब करें
  body: 'जब किसी ग्राहक का डेबिट या क्रेडिट कार्ड (जैसे कि चंद्रिका एवरीडे क्रेडिट
    कार्ड) खो जाता है, चोरी हो जाता है, या भौतिक रूप से क्षतिग्रस्त हो जाता है, तो
    एक नया कार्ड जारी करने की आवश्यकता होती है। इस प्रक्रिया के लिए निम्नलिखित चरणों
    का पालन करें:


    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके ग्राहक के सक्रिय खातों की सूची प्राप्त करें
    और संबंधित कार्ड से जुड़े account_id की पहचान करें।

    3. यदि कार्ड चोरी या खो गया है, तो सुरक्षा के लिए पहले freeze_card टूल का उपयोग
    करें।

    4. अंत में, order_replacement_card टूल कॉल करें ताकि ग्राहक के पंजीकृत पते पर
    नया कार्ड भेजा जा सके।


    नया कार्ड जारी करने के लिए लागू शुल्क के विवरण के लिए ''संस्था-व्यापी शुल्क और
    प्रभार'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: chandrika_bank
- id: fb143089-9034-580b-9c75-f78359eef589
  title: order_replacement_card टूल संदर्भ
  body: 'order_replacement_card टूल का उपयोग खोए हुए या क्षतिग्रस्त कार्ड के बदले
    नया कार्ड मंगवाने के लिए किया जाता है। एजेंट इस क्रिया को सीधे टूल कॉल के माध्यम
    से निष्पादित करता है।


    तर्क (Arguments):

    - account_id: उस खाते की विशिष्ट पहचान जिससे कार्ड जुड़ा है।

    - card_type: कार्ड का प्रकार (जैसे कि डेबिट या क्रेडिट)।

    - reason: प्रतिस्थापन का कारण (जैसे ''Lost'', ''Stolen'', या ''Damaged'')।


    प्रभाव: यह अनुरोध बैंक के कार्ड जारीकरण सिस्टम में दर्ज करता है और ग्राहक के पते
    पर एक नया भौतिक कार्ड डिस्पैच करने की प्रक्रिया शुरू करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - order_replacement_card
  institution_id: chandrika_bank
- id: feab5bd3-9593-5514-bdf8-a550f14edcc0
  title: stop_payment का उपयोग कब करें
  body: 'स्टॉप पेमेंट सुविधा का उपयोग तब किया जाता है जब ग्राहक किसी विशिष्ट चेक या
    पूर्व-निर्धारित भुगतान के प्रसंस्करण को रोकना चाहता है (उदाहरण के लिए, यदि चेक
    खो गया है या भुगतान की शर्तें बदल गई हैं)।


    प्रक्रिया:

    1. verify_identity टूल के माध्यम से ग्राहक की पहचान सुनिश्चित करें।

    2. get_accounts टूल का उपयोग करके संबंधित खाते का विवरण प्राप्त करें।

    3. ग्राहक से भुगतान का विवरण (जैसे चेक नंबर, राशि और तिथि) मांगें।

    4. stop_payment टूल का उपयोग करके उस विशिष्ट लेनदेन के लिए भुगतान रोकें।


    कृपया ध्यान दें कि यह सुविधा केवल उन भुगतानों के लिए उपलब्ध है जो अभी तक बैंक
    द्वारा क्लियर नहीं किए गए हैं। विफल या लंबित लेनदेन की अधिक जानकारी के लिए ''नियमित
    बचत खाता — विफल या लंबित कार्रवाई'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: chandrika_bank
- id: 2caf9d0b-3bca-501c-8509-dd0061384365
  title: stop_payment टूल संदर्भ
  body: 'stop_payment टूल का उपयोग किसी लंबित चेक या भुगतान के भुगतान को रोकने के
    लिए किया जाता है। एजेंट इस क्रिया को सीधे टूल कॉल करके पूरा करता है।


    तर्क (Arguments):

    - account_id: वह खाता जिससे भुगतान होना था।

    - transaction_id: चेक नंबर या विशिष्ट लेनदेन संदर्भ संख्या।

    - amount: भुगतान की राशि (₹ में)।


    प्रभाव: यह सिस्टम में एक ''स्टॉप'' निर्देश लगा देता है, जिससे उस विशिष्ट लेनदेन
    का भुगतान बैंक द्वारा रोक दिया जाता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - stop_payment
  institution_id: chandrika_bank
- id: 47df7ea8-8329-511d-abb8-ed8a4e615ef8
  title: pay_bill का उपयोग कब करें
  body: 'जब ग्राहक अपने उपयोगिताओं (जैसे बिजली, पानी, गैस) या अन्य सेवा प्रदाताओं
    के बिलों का भुगतान करना चाहता है, तो pay_bill सुविधा का उपयोग किया जाता है। यह
    ''UPI और बिल भुगतान'' सेवा का हिस्सा है।


    चरण-दर-चरण प्रक्रिया:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल का उपयोग करके वह खाता चुनें जिससे भुगतान किया जाना है।

    3. ग्राहक से बिलर का नाम, उपभोक्ता आईडी (Consumer ID) और देय राशि की पुष्टि करें।

    4. pay_bill टूल कॉल करें ताकि भुगतान सुरक्षित रूप से पूरा हो सके।


    भुगतान की सीमाओं और नियमों के लिए ''UPI और बिल भुगतान — सीमाएँ, प्रतिबंध और अपवाद
    स्थितियाँ'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: chandrika_bank
- id: 1fc0c70b-1803-54c3-94e2-2762a5b40cd4
  title: pay_bill टूल संदर्भ
  body: 'pay_bill टूल का उपयोग पंजीकृत बिलरों को डिजिटल भुगतान भेजने के लिए किया जाता
    है। एजेंट इस कार्य को सीधे टूल कॉल के माध्यम से पूरा करता है।


    तर्क (Arguments):

    - account_id: वह खाता जिससे धनराशि डेबिट की जानी है।

    - biller_id: सेवा प्रदाता की विशिष्ट पहचान संख्या।

    - customer_reference_id: बिलर के पास ग्राहक की पहचान (जैसे कंज्यूमर नंबर)।

    - amount: भुगतान की जाने वाली राशि (₹ में)।


    प्रभाव: यह टूल निर्दिष्ट खाते से राशि डेबिट करता है और बिलर को भुगतान स्थानांतरित
    करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_bill
  institution_id: chandrika_bank
- id: 0a0561bb-a22e-581d-a401-640d216e1b3e
  title: activate_card का उपयोग कब करें
  body: 'जब किसी ग्राहक को नया डेबिट कार्ड या ''चंद्रिका एवरीडे क्रेडिट कार्ड'' प्राप्त
    होता है, तो सुरक्षा कारणों से वह डिफ़ॉल्ट रूप से निष्क्रिय होता है। कार्ड को उपयोग
    के लिए तैयार करने हेतु सक्रियण अनिवार्य है।


    सक्रियण प्रक्रिया:

    1. verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. get_accounts टूल के माध्यम से ग्राहक के खाते और उससे जुड़े कार्ड का विवरण जांचें।

    3. ग्राहक से कार्ड के अंतिम चार अंक और अन्य आवश्यक विवरण मांगें।

    4. activate_card टूल कॉल करें ताकि कार्ड को तुरंत सक्रिय किया जा सके।


    सक्रियण के बाद, ग्राहक अपने कार्ड का उपयोग लेनदेन के लिए कर सकते हैं। सेटअप के
    बारे में अधिक जानकारी ''चंद्रिका एवरीडे क्रेडिट कार्ड — सेटअप और सक्रियण'' में
    उपलब्ध है।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: chandrika_bank
- id: ea985886-e283-545b-a558-ee1e45b7ea02
  title: activate_card टूल संदर्भ
  body: 'activate_card टूल का उपयोग नए या प्रतिस्थापन कार्ड को सक्रिय करने के लिए
    किया जाता है। एजेंट इस क्रिया को सीधे टूल कॉल करके निष्पादित करता है।


    तर्क (Arguments):

    - card_id: कार्ड की विशिष्ट पहचान संख्या।

    - account_id: वह खाता जिससे कार्ड जुड़ा है।

    - activation_code: ग्राहक को प्राप्त सत्यापन कोड (यदि लागू हो)।


    प्रभाव: यह टूल कार्ड की स्थिति को ''निष्क्रिय'' से ''सक्रिय'' में बदल देता है,
    जिससे ग्राहक कार्ड के माध्यम से लेनदेन करने में सक्षम हो जाते हैं।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - activate_card
  institution_id: chandrika_bank
- id: f504e6ea-0fee-5957-a5fb-451f0f80ca04
  title: dispute_status का उपयोग कब करें
  body: 'जब किसी ग्राहक ने पहले से ही किसी असफल या अनधिकृत लेनदेन के लिए शिकायत दर्ज
    की हो, तो वे अपनी शिकायत की वर्तमान स्थिति जानने के लिए संपर्क करते हैं।


    स्थिति जांचने की प्रक्रिया:

    1. सबसे पहले verify_identity टूल का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. ग्राहक से शिकायत संदर्भ संख्या या संबंधित लेनदेन की जानकारी मांगें।

    3. dispute_status टूल कॉल करें ताकि शिकायत की वर्तमान प्रगति (जैसे ''Under Review'',
    ''Resolved'', या ''Chargedback'') का पता चल सके।

    4. ग्राहक को वर्तमान स्थिति और संभावित समाधान समय के बारे में सूचित करें।


    हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के लिए RBI के समय-सीमा ढांचे का पालन
    करते हैं। नई शिकायत दर्ज करने की प्रक्रिया के लिए ''file_transaction_dispute का
    उपयोग कब करें'' देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: chandrika_bank
- id: 0f215344-3edc-5bd7-9ca5-61edd15c5b61
  title: dispute_status टूल संदर्भ
  body: 'यह टूल एजेंट को किसी ग्राहक द्वारा दर्ज की गई लेनदेन संबंधी शिकायत या विवाद
    की वर्तमान स्थिति की जांच करने की अनुमति देता है।


    **टूल विवरण:**

    - **टूल का नाम:** dispute_status

    - **कार्य:** यह टूल विशिष्ट विवाद आईडी का उपयोग करके मामले की प्रगति, वर्तमान
    चरण और समाधान की स्थिति प्राप्त करता है।

    - **प्रभाव:** केवल पढ़ने योग्य (read_only)।


    एजेंट इस टूल को सीधे कॉल करके ग्राहक को उनके विवाद की स्थिति के बारे में वास्तविक
    समय की जानकारी प्रदान करता है।'
  domain: retail_banking
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - dispute_status
  institution_id: chandrika_bank
- id: 79165ba4-c730-5d4d-b57e-49f2e35ff020
  title: manage_authorized_users का उपयोग कब करें
  body: 'यह नीति उन स्थितियों को निर्धारित करती है जब एक ग्राहक अपने खाते के लिए अधिकृत
    उपयोगकर्ताओं (authorized users) को जोड़ना, हटाना या उनके अधिकारों को संशोधित करना
    चाहता है। यह सुविधा मुख्य रूप से परिवार के सदस्यों या विश्वसनीय प्रतिनिधियों को
    खाता प्रबंधन में सहायता के लिए दी जाती है।


    **प्रक्रिया के चरण:**

    1. सबसे पहले, एजेंट को ग्राहक की पहचान सत्यापित करने के लिए verify_identity टूल
    का उपयोग करना चाहिए।

    2. यदि ग्राहक केवल पिछले 4 अंकों का संदर्भ देता है, तो सही account_id प्राप्त
    करने के लिए get_accounts टूल का उपयोग करें।

    3. ग्राहक से उस व्यक्ति का विवरण और प्रदान किए जाने वाले एक्सेस स्तर की पुष्टि
    करें जिसे अधिकृत किया जाना है।

    4. निर्धारित विवरणों के आधार पर, एजेंट अधिकृत उपयोगकर्ताओं की सूची को अपडेट करने
    के लिए manage_authorized_users टूल को कॉल करेगा।

    5. सफल अपडेट के बाद, ग्राहक को पुष्टि संदेश भेजें।


    अधिक विस्तृत तकनीकी विवरण के लिए manage_authorized_users टूल संदर्भ देखें।'
  domain: retail_banking
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
