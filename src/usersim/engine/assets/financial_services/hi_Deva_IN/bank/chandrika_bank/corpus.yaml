  institution_id: chandrika_bank
- id: f0316f6c-fe18-5ca6-a8e8-843e52b7c2c3
  title: UPI और बिल भुगतान — UPI Lite प्रति लेनदेन सीमा की व्याख्या
  body: 'प्रश्न: UPI Lite क्या है और इसकी लेनदेन सीमा क्या है?

    उत्तर: UPI Lite छोटे भुगतानों के लिए एक ऑन-डिवाइस वॉलेट समाधान है जिसे बिना PIN
    के तेजी से लेनदेन करने के लिए डिज़ाइन किया गया है। ''UPI और बिल भुगतान'' सेवा
    के तहत, UPI Lite के लिए प्रति लेनदेन सीमा ₹500 निर्धारित है। यह सुविधा छोटे दैनिक
    खर्चों के लिए आदर्श है। अधिक विवरण के लिए ''UPI और बिल भुगतान — शुरुआत कैसे करें''
    देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: faq
