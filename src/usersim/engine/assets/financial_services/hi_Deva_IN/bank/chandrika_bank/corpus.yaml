- id: f755d9c7-573c-593a-b75d-f8489b837ce6
  title: नियमित बचत खाता — शुल्क अनुसूची
  body: 'नियमित बचत खाता के लिए लागू शुल्क निम्नलिखित हैं:


    - औसत मासिक शेष (MAB) बनाए रखने का शुल्क: ₹500 (जब मासिक औसत शेष ₹10000 से कम
    होता है)

    - डेबिट कार्ड वार्षिक शुल्क: ₹250

    - प्रति माह निःशुल्क ATM लेनदेन सीमा: 5 लेनदेन तक निःशुल्क'
  domain: retail_banking
  product_category: savings_regular
  document_type: fee_schedule
  source_authority: official
