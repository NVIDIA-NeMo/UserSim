  mentions_tools: []
  institution_id: chandrika_bank
- id: 37aea44f-a3cf-58de-a00d-8ebbe7d2dabe
  title: 1-वर्षीय सावधि जमा (FD) — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: '1-वर्षीय सावधि जमा (FD) एक सुरक्षित निवेश विकल्प है जो उन ग्राहकों के लिए
    सबसे उपयुक्त है जो एक निश्चित अवधि के लिए अपनी बचत को सुरक्षित रखना चाहते हैं
    और साथ ही उच्च ब्याज अर्जित करना चाहते हैं। यह उन परिवारों के लिए आदर्श है जो
    अगले 12 महीनों में किसी विशिष्ट लक्ष्य (जैसे कि वार्षिक बीमा प्रीमियम या त्योहारों
    के खर्च) के लिए धन संचित कर रहे हैं।


    मुख्य विशेषताएं और शर्तें:

    - न्यूनतम जमा राशि: ₹10,000

    - निवेश अवधि: 12 महीने

    - वार्षिक ब्याज दर: 7.1%

    - वरिष्ठ नागरिक लाभ: अतिरिक्त 0.5% ब्याज दर

    - समयपूर्व निकासी दंड: 1%


    यह उत्पाद उन लोगों के लिए एक बेहतर विकल्प है जो नियमित बचत खाता — सिंहावलोकन की
    तुलना में अधिक रिटर्न चाहते हैं और जिन्हें एक वर्ष तक अपनी पूंजी की आवश्यकता नहीं
    है। यह DICGC द्वारा ₹5,00,000 तक बीमित है, जो इसे मध्यम वर्ग के परिवारों के लिए
    एक विश्वसनीय विकल्प बनाता है।'
