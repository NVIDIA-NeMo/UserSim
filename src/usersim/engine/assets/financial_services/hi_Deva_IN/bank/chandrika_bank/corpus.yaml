  institution_id: chandrika_bank
- id: a5eb955a-a339-5e74-ae40-cb505cba1688
  title: नियमित बचत खाता — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'चंद्रिका बैंक में आपकी जमा राशि की सुरक्षा हमारी सर्वोच्च प्राथमिकता है।
    नियमित बचत खाता उपयोगकर्ताओं को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ जालसाज
    बैंक अधिकारी बनकर आपका विश्वास जीतने की कोशिश करते हैं।


    कृपया ध्यान दें कि चंद्रिका बैंक आपसे कभी भी आपका UPI PIN, OTP, या नेट बैंकिंग
    पासवर्ड साझा करने के लिए नहीं कहेगा। यदि आपको कोई ऐसा संदेश या कॉल मिलता है जो
    तत्काल कार्रवाई या खाते के बंद होने की धमकी देता है, तो वह धोखाधड़ी हो सकती है।


    सुरक्षा के लिए हमेशा याद रखें कि किसी भी संवेदनशील जानकारी को साझा करने से पहले
    PAN और आधार-आधारित KYC सत्यापन अनिवार्य है। यदि आप अपने खाते में कोई भी अनधिकृत
    लेनदेन देखते हैं, तो तुरंत हमें सूचित करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग
    के लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं ताकि आपकी राशि
    सुरक्षित रहे। समय पर रिपोर्टिंग आपके दायित्व को सीमित करने में मदद करती है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5db30967-d566-56f9-9969-9a0bd8f663f6
  title: नियमित बचत खाता — खाता अनुबंध
  body: 'यह अनुबंध चंद्रिका बैंक और खाताधारक के बीच नियमित बचत खाता के संचालन को नियंत्रित
    करता है।


    1. शेष राशि का रखरखाव: ग्राहक को अपने खाते में ₹10000 का Monthly Average Balance
    (MAB) बनाए रखना अनिवार्य है। यदि इस सीमा का पालन नहीं किया जाता है, तो बैंक ₹500
    का शुल्क लागू करेगा।

    2. सेवा शुल्क: खाते के साथ दिए गए डेबिट कार्ड के लिए ₹250 का वार्षिक शुल्क देय
    होगा।

    3. लेनदेन सीमाएँ: ग्राहक को प्रति माह 5 निःशुल्क ATM लेनदेन की सुविधा दी जाएगी;
    इसके बाद मानक शुल्क लागू होंगे।

    4. ब्याज: बैंक जमा राशि पर 3.5% की वार्षिक ब्याज दर प्रदान करेगा, जिसकी गणना और
    भुगतान बैंक की मानक नीति के अनुसार होगा।

    5. अनुबंध की समाप्ति: खाताधारक लिखित अनुरोध के माध्यम से खाता बंद कर सकता है।
    बैंक को नियामक कारणों या KYC अपडेट न करने की स्थिति में खाता फ्रीज करने का अधिकार
    है।


    किसी भी विवाद की स्थिति में, मामला आंतरिक शिकायत अधिकारी के माध्यम से RBI लोकपाल
    तक जा सकता है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: terms_conditions
  source_authority: official
