- id: ceaeedac-c9fa-5ed4-8ec7-3889615297db
  title: आवर्ती जमा (RD) — विकल्पों से तुलना और कब न चुनें
  body: 'आवर्ती जमा (RD) अनुशासन आधारित बचत के लिए एक उत्कृष्ट साधन है, लेकिन यह हर
    किसी के लिए सही नहीं हो सकता है।


    तुलना:

    - RD बनाम बचत खाता: बचत खाते में आप कभी भी पैसा निकाल सकते हैं, लेकिन RD में आपको
    24 महीने की अवधि तक प्रतिबद्ध रहना होता है ताकि 6.8% की बेहतर ब्याज दर का लाभ
    मिल सके।

    - RD बनाम FD: सावधि जमा (FD) में एक बड़ी राशि एक बार में जमा की जाती है, जबकि
    RD में आप हर महीने ₹500 जमा करते हैं।


    आपको आवर्ती जमा (RD) कब नहीं चुनना चाहिए:

    - यदि आपको आने वाले 24 महीनों के भीतर धन की तत्काल आवश्यकता पड़ सकती है, क्योंकि
    समयपूर्व निकासी पर जुर्माना लगता है।

    - यदि आप मासिक रूप से ₹500 की किस्त जमा करने में असमर्थ हैं, क्योंकि प्रत्येक
    चूक पर ₹10 का जुर्माना लगेगा।

    - यदि आप उच्च जोखिम और उच्च रिटर्न वाले निवेश की तलाश में हैं, क्योंकि RD एक सुरक्षित,
    निश्चित-आय वाला उत्पाद है जो DICGC बीमा द्वारा ₹5,00,000 तक सुरक्षित है।'
