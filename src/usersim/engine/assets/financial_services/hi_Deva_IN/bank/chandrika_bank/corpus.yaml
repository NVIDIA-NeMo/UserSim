- id: 3bdc60b5-49b1-5f29-b4e8-177b8b651338
  title: 1-वर्षीय सावधि जमा (FD) — ब्याज दर की व्याख्या
  body: 'प्रश्न: मेरी 1-वर्षीय सावधि जमा (FD) पर मुझे कितना ब्याज मिलेगा?

    उत्तर: इस उत्पाद पर मानक वार्षिक ब्याज दर 7.1% है। यदि आप एक वरिष्ठ नागरिक के
    रूप में पात्र हैं, तो आपको 0.5% की अतिरिक्त दर मिलेगी, जिससे आपकी कुल प्रभावी
    दर 7.6% हो जाएगी।


    प्रश्न: क्या ब्याज दरें समय के साथ बदलती हैं?

    उत्तर: सावधि जमा की विशेषता यह है कि जिस दर पर यह बुक की जाती है, वह पूरी 12 महीने
    की अवधि के लिए स्थिर रहती है। विस्तृत जानकारी के लिए 1-वर्षीय सावधि जमा (FD) —
    दरें कैसे श्रेणीबद्ध और लागू होती हैं देखें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
