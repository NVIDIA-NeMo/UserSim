- id: 950c1364-a3f9-526d-8e0e-5ee4d29aadbb
  title: UPI और बिल भुगतान — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'UPI और बिल भुगतान सेवा के सुचारू संचालन के लिए निम्नलिखित सीमाएँ और प्रतिबंध
    लागू हैं, जिन्हें सहायता एजेंटों को ग्राहकों को स्पष्ट करना चाहिए:


    - प्रति लेनदेन सीमा: एक एकल UPI लेनदेन के लिए अधिकतम सीमा ₹100000 है।

    - दैनिक सीमा: एक कैलेंडर दिन में कुल लेनदेन की अधिकतम सीमा ₹100000 निर्धारित है।

    - UPI Lite सीमा: छोटे भुगतानों के लिए, UPI Lite के माध्यम से प्रति लेनदेन अधिकतम
    ₹500 तक भेजे जा सकते हैं।

    - ऑटोपे मैंडेट: बिना अतिरिक्त प्रमाणीकरण (AFA) के ऑटोपे मैंडेट के लिए अधिकतम सीमा
    ₹15000 है।


    अपवाद स्थितियाँ: कुछ विशिष्ट मर्चेंट श्रेणियों या सरकारी भुगतानों के लिए ये सीमाएं
    भिन्न हो सकती हैं, जो NPCI के दिशानिर्देशों के अधीन हैं। यदि कोई ग्राहक इन सीमाओं
    को पार करने का प्रयास करता है, तो लेनदेन विफल हो जाएगा। विस्तृत विवरण के लिए UPI
    और बिल भुगतान — सिंहावलोकन देखें।'
