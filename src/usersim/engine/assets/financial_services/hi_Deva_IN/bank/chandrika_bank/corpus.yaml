- id: d34c1023-b318-5c0e-b4a7-dacef61c848c
  title: 1-वर्षीय सावधि जमा (FD) — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'चंद्रिका बैंक के ग्राहकों को सतर्क रहना चाहिए कि जालसाज अक्सर 1-वर्षीय सावधि
    जमा (FD) के नाम पर ''असाधारण ब्याज दरों'' या ''गारंटीकृत सरकारी लाभ'' का लालच
    देकर संपर्क करते हैं। याद रखें, हमारे आधिकारिक उत्पाद की ब्याज दर 7.1% है, और
    वरिष्ठ नागरिकों के लिए इसमें 0.5% की अतिरिक्त दर उपलब्ध है। यदि कोई व्यक्ति आपको
    इससे कहीं अधिक रिटर्न का वादा करता है, तो यह एक स्कैम हो सकता है।


    हम आपसे कभी भी आपका UPI PIN, OTP, या पासवर्ड साझा करने के लिए नहीं कहेंगे। धोखाधड़ी
    करने वाले अक्सर आपसे ''FD एक्टिवेशन'' या ''बोनस क्रेडिट'' के नाम पर लिंक पर क्लिक
    करने या ऐप डाउनलोड करने को कह सकते हैं; कृपया ऐसा न करें। यदि आपको कोई संदिग्ध
    संदेश मिलता है या आपकी जमा राशि के संबंध में कोई विसंगति दिखती है, तो तुरंत हमें
    सूचित करें। हम RBI के समय-सीमा ढांचे (turn-around-time) के अनुसार धोखाधड़ी की
    रिपोर्टिंग और समाधान सुनिश्चित करते हैं। सुरक्षा के लिए हमेशा याद रखें कि आपकी
    जमा राशि पर DICGC द्वारा ₹5,00,000 तक का बीमा कवर उपलब्ध है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 727ed29d-bebe-5239-a221-537e6a0d1a6a
  title: 1-वर्षीय सावधि जमा (FD) — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: '1-वर्षीय सावधि जमा (FD) एक सुरक्षित निवेश विकल्प है, लेकिन इसके साथ कुछ महत्वपूर्ण
    सीमाएँ और प्रतिबंध जुड़े हुए हैं जिन्हें समझना आवश्यक है:


    1. न्यूनतम जमा सीमा: इस उत्पाद को शुरू करने के लिए न्यूनतम ₹10,000 की राशि जमा
    करना अनिवार्य है। इससे कम राशि के निवेश अनुरोध स्वीकार नहीं किए जाएंगे।

    2. समय-सीमा: इस विशिष्ट उत्पाद की अवधि 12 महीने निर्धारित है।

    3. समय-पूर्व निकासी: यदि आप अपनी जमा राशि को परिपक्वता अवधि (12 महीने) से पहले
    निकालते हैं, तो लागू ब्याज दर पर 1% का समय-पूर्व निकासी दंड लगाया जाएगा।

    4. पात्रता और सत्यापन: खाता खोलने या स्थिति बदलने के लिए PAN और आधार-आधारित KYC
    सत्यापन अनिवार्य है।

    5. कर और नियामक: ब्याज आय पर लागू नियमों के अनुसार TDS काटा जा सकता है। आपकी जमा
    राशि DICGC बीमा के तहत ₹5,00,000 तक सुरक्षित है।


    ये शर्तें बैंक की मानक परिचालन लागत और नियामक अनुपालन को सुनिश्चित करने के लिए
    लागू की गई हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
