- id: 6bde1b5b-d41b-5269-a08e-7f3c1e892cf2
  title: आवर्ती जमा (RD) — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक को लगता है कि उनकी जमा की गई किस्तों की संख्या या कुल शेष राशि
    बैंक के रिकॉर्ड से मेल नहीं खाती है।


    जाँच के चरण:

    1. ग्राहक को उनके बैंक स्टेटमेंट और अपनी जमा रसीदों की जाँच करने के लिए कहें।

    2. पुष्टि करें कि क्या कोई किस्त ₹500 से कम जमा की गई थी, जिसके कारण वह प्रक्रिया
    में नहीं आई।

    3. जाँचें कि क्या किसी महीने किस्त चूकने के कारण ₹10 का जुर्माना काटा गया है,
    जिससे कुल राशि में अंतर दिख रहा है।


    समाधान:

    - यदि अंतर स्पष्ट है (जैसे जुर्माना), तो ग्राहक को विवरण समझाएं।

    - यदि राशि वास्तव में जमा हुई है लेकिन रिकॉर्ड में नहीं दिख रही, तो हम लेनदेन
    आईडी (Transaction ID) के साथ आंतरिक ऑडिट करेंगे।


    निवारण:

    त्रुटि पाए जाने पर, हम राशि को तुरंत ठीक करेंगे। यदि यह एक असफल लेनदेन है, तो
    हम RBI के समय-सीमा ढांचे (TAT) के अनुसार रिफंड या क्रेडिट प्रक्रिया शुरू करेंगे।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9cd95f3b-4259-5fa6-b454-1b973e6ec3f2
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — सिंहावलोकन
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड आपके दैनिक खर्चों और रिवॉर्ड्स के लिए एक लचीली
    क्रेडिट सुविधा है, जिसे विशेष रूप से मध्यम वर्ग और बचत करने वाले परिवारों की जरूरतों
    को पूरा करने के लिए डिज़ाइन किया गया है। यह कार्ड आपको सुरक्षित और आसान डिजिटल
    भुगतान का अनुभव प्रदान करता है।


    मुख्य वित्तीय विवरण:

    - जॉइनिंग शुल्क: ₹500

    - वार्षिक शुल्क: ₹500

    - वार्षिक शुल्क माफी: यदि वर्ष भर में कुल खर्च ₹1,50,000 या उससे अधिक होता है,
    तो वार्षिक शुल्क माफ कर दिया जाता है।

    - रिवॉर्ड दर: प्रत्येक पात्र खर्च पर 1% रिवॉर्ड दर उपलब्ध है।

    - मासिक वित्त प्रभार: बकाया राशि पर 3.5% मासिक शुल्क लागू होता है।

    - वार्षिक वित्त प्रभार: वार्षिक आधार पर यह शुल्क 42% होता है।


    यह कार्ड उन ग्राहकों के लिए आदर्श है जो अपने नियमित खर्चों को प्रबंधित करने के
    साथ-साथ रिवॉर्ड्स कमाना चाहते हैं। कृपया ध्यान दें कि हम केवल उत्पाद की विशेषताओं
    की शैक्षिक जानकारी प्रदान करते हैं और व्यक्तिगत वित्तीय सलाह नहीं देते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ebde0f26-f429-5c34-8b21-1782dad67653
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — जॉइनिंग शुल्क की व्याख्या
  body: 'प्रश्न: चंद्रिका एवरीडे क्रेडिट कार्ड के लिए जॉइनिंग शुल्क क्या है?

    उत्तर: इस कार्ड को प्राप्त करने के लिए ₹500 का एकमुश्त जॉइनिंग शुल्क लिया जाता
    है, जो आपके पहले स्टेटमेंट में शामिल होता है।


    प्रश्न: क्या यह शुल्क वापस मिल सकता है?

    उत्तर: जॉइनिंग शुल्क गैर-वापसी योग्य है। शुल्क और अन्य प्रभारों की विस्तृत जानकारी
    के लिए कृपया ''चंद्रिका एवरीडे क्रेडिट कार्ड — शुल्क अनुसूची'' देखें।


    प्रश्न: क्या यह शुल्क हर साल लिया जाएगा?

    उत्तर: नहीं, ₹500 का जॉइनिंग शुल्क केवल एक बार खाता खोलते समय लिया जाता है। इसके
    बाद वार्षिक शुल्क लागू होता है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
