- id: f928c952-d310-5b86-861f-e392f8954517
  title: आवर्ती जमा (RD) — लागत और शुल्क
  body: 'प्रश्न: आवर्ती जमा (RD) खाता खोलने का कोई शुल्क है?

    उत्तर: नहीं, चंद्रिका बैंक में आवर्ती जमा (RD) खाता खोलने के लिए कोई प्रारंभिक
    शुल्क नहीं है।


    प्रश्न: इस खाते से जुड़े अन्य प्रभार क्या हैं?

    उत्तर: इस उत्पाद में मुख्य रूप से किस्त चूकने पर जुर्माना लागू होता है। यदि आप
    किसी महीने की किस्त समय पर जमा नहीं करते हैं, तो ₹10 का शुल्क लिया जाएगा। अधिक
    जानकारी के लिए ''आवर्ती जमा (RD) — किस्त चूकने पर जुर्माना की व्याख्या'' देखें।'
  domain: retail_banking
  product_category: recurring_deposit
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 922fe85d-7da4-5479-bea7-ef6a66fa101d
  title: आवर्ती जमा (RD) — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'एक नया आवर्ती जमा (RD) खाता खोलने की पूरी प्रक्रिया नीचे दी गई है:


    1. हमें बताएं कि आप एक नया आवर्ती जमा (RD) खाता खोलना चाहते हैं।

    2. हम आपसे आपके वर्तमान खाते का विवरण मांगेंगे और पुष्टि करेंगे कि आप न्यूनतम
    मासिक किस्त ₹500 और 24 महीने की अवधि के लिए सहमत हैं।

    3. हम आपका PAN और आधार-आधारित KYC सत्यापन करेंगे। यदि आपका KYC अपडेटेड नहीं है,
    तो आपको ये दस्तावेज़ हमें प्रदान करने होंगे।

    4. एक बार सत्यापन पूरा होने के बाद, हम आपके खाते में पहली किस्त के रूप में ₹500
    जमा करने का अनुरोध करेंगे।

    5. राशि जमा होने के बाद, हम आपके खाते को सक्रिय कर देंगे और आपको खाता संख्या,
    6.8% की लागू ब्याज दर और परिपक्वता तिथि की पुष्टि प्रदान करेंगे।


    यह प्रक्रिया पूरी होने पर आपको एक पुष्टिकरण संदेश प्राप्त होगा, और आपकी मासिक
    बचत यात्रा शुरू हो जाएगी।'
