  institution_id: chandrika_bank
- id: 7e43f0af-6f71-5dc4-87de-0d1e5a3fba09
  title: नियमित बचत खाता — स्थिति या इतिहास देखना
  body: 'अपने नियमित बचत खाते की वर्तमान स्थिति और लेनदेन इतिहास देखने के लिए इन चरणों
    का पालन करें:


    1. हमसे अनुरोध करें कि आप अपने खाते का विवरण या स्टेटमेंट देखना चाहते हैं।

    2. अपनी पहचान सत्यापित करने के लिए अपना पंजीकृत मोबाइल नंबर और खाता संख्या प्रदान
    करें।

    3. सुरक्षा के लिए, हम आपसे आधार या PAN आधारित KYC विवरणों का सत्यापन करने के लिए
    कहेंगे।

    4. सत्यापन सफल होने के बाद, हम आपको आपके खाते का वर्तमान शेष (Balance) और पिछले
    लेनदेन का विवरण प्रदान करेंगे।


    आप यह पुष्टि कर सकते हैं कि प्रक्रिया पूर्ण हो गई है जब आपको अपने पंजीकृत ईमेल
    या संदेश के माध्यम से विवरण प्राप्त हो जाएं या बातचीत में विवरण प्रदर्शित हों।'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2c553a3c-d98e-5248-b926-e07ecfd93730
  title: नियमित बचत खाता — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: आपका लेनदेन अस्वीकृत हो रहा है या आपका खाता अवरुद्ध (Blocked) दिखाई
    दे रहा है।


    संभावित कारण:

    - KYC दस्तावेजों का पुराना होना या अधूरा होना।

    - खाते में लंबे समय तक कोई गतिविधि न होना (Dormant account)।

    - सुरक्षा कारणों से बैंक द्वारा संदिग्ध गतिविधि पाए जाने पर खाता फ्रीज करना।


    समाधान के चरण:

    1. सबसे पहले जाँचें कि क्या आपका KYC अपडेट है। यदि नहीं, तो हमें अपना अद्यतन PAN
    और आधार विवरण प्रदान करें।

    2. यदि खाता निष्क्रिय है, तो एक छोटा जमा लेनदेन करके इसे पुन: सक्रिय करने का अनुरोध
    करें।

    3. यदि सुरक्षा कारणों से अवरुद्ध है, तो हमारे सत्यापन मानकों के अनुसार पहचान पुष्टि
    करें।


    यदि समस्या बनी रहती है, तो हम इस मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे।
    समाधान न होने पर आप इसे RBI लोकपाल तक ले जा सकते हैं।'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 3c11e923-81f3-516e-a42c-b35842a387b8
  title: नियमित बचत खाता — कब स्विच या अपग्रेड करें
  body: 'यदि आप अपने नियमित बचत खाते से आगे बढ़ना चाहते हैं, तो इन स्थितियों पर विचार
    करें:


    - यदि आपकी राशि ₹10000 (MAB) से काफी अधिक है और आप केवल बचत नहीं बल्कि उच्च रिटर्न
    चाहते हैं, तो ''1-वर्षीय सावधि जमा (FD) — सिंहावलोकन'' पर स्विच करना बेहतर है,
    जहाँ ब्याज दरें अधिक होती हैं।

    - यदि आप मासिक अनुशासन के साथ बचत करना चाहते हैं, तो ''आवर्ती जमा (RD) — सिंहावलोकन''
    एक बेहतर विकल्प है।


    नियमित बचत खाता उन लोगों के लिए सर्वोत्तम है जिन्हें दैनिक लेनदेन के लिए तरलता
    और सुरक्षित बचत की आवश्यकता है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 8338c43f-8a9c-5fde-83b4-f2ecfc586b70
  title: नियमित बचत खाता — विकल्पों से तुलना और कब न चुनें
  body: 'नियमित बचत खाता एक लचीला विकल्प है, लेकिन यह हर वित्तीय लक्ष्य के लिए सही
    नहीं है।


    इस उत्पाद को तब न चुनें जब:

    1. आप अधिकतम ब्याज दर की तलाश में हों: इस खाते पर 3.5% की ब्याज दर मिलती है। यदि
    आप अपनी पूंजी को एक निश्चित समय के लिए लॉक कर सकते हैं, तो सावधि जमा (FD) अधिक
    लाभ देती है।

    2. आप Monthly Average Balance बनाए रखने में असमर्थ हों: यदि आप ₹10000 का MAB बनाए
    नहीं रख सकते, तो आपको ₹500 का below_mab_charge देना होगा, जो आपकी छोटी बचत को
    प्रभावित कर सकता है।

    3. आपको उच्च क्रेडिट सीमा की आवश्यकता हो: बचत खाता केवल जमा के लिए है; ऋण या क्रेडिट
    सुविधाओं के लिए ''चंद्रिका एवरीडे क्रेडिट कार्ड — सिंहावलोकन'' देखें।


    यह खाता मध्यम वर्ग के उन परिवारों के लिए आदर्श है जो अपनी दैनिक जरूरतों के लिए
    पैसे सुरक्षित रखना चाहते हैं और समय-समय पर निकासी करना चाहते हैं।'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
