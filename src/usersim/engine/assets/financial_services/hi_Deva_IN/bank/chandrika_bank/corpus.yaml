- id: 37305c39-fea1-59ba-b072-a01f528bc8a2
  title: 1-वर्षीय सावधि जमा (FD) — वर्तमान ऑफर
  body: 'विशेष बचत अवसर!


    चंद्रिका बैंक अपने मौजूदा ग्राहकों के लिए 1-वर्षीय सावधि जमा (FD) पर एक विशेष
    अवसर प्रदान कर रहा है। 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक अपनी जमा राशि बुक करें
    और 7.1% की आकर्षक ब्याज दर का लाभ उठाएं। वरिष्ठ नागरिकों के लिए यह दर 7.6% होगी।


    न्यूनतम निवेश राशि ₹10000 है। अपनी बचत को सुरक्षित करें और भविष्य के लक्ष्यों
    की ओर बढ़ें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: promo_notice
  source_authority: official
