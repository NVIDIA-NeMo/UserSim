- id: fc5ffd30-1dc7-573f-a3b7-17edd0f208e8
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — मासिक वित्त प्रभार की व्याख्या
  body: 'प्रश्न: मासिक वित्त प्रभार क्या है और यह कैसे लागू होता है?

    उत्तर: यदि आप अपने क्रेडिट कार्ड बिल की कुल देय राशि का भुगतान नियत तिथि तक नहीं
    करते हैं, तो बकाया राशि पर 3.5% का मासिक वित्त प्रभार लगाया जाता है।


    प्रश्न: क्या यह शुल्क हर महीने लगता है?

    उत्तर: यह शुल्क केवल तभी लगता है जब पिछले महीने का पूरा भुगतान नहीं किया गया हो।
    समय पर पूर्ण भुगतान करने पर कोई वित्त प्रभार नहीं लगता। अधिक जानकारी के लिए ''चंद्रिका
    एवरीडे क्रेडिट कार्ड — ब्याज दर अनुसूची'' देखें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 83140499-5b48-5fc2-8fdc-08cabc9eb4b6
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — स्थिति या इतिहास देखना
  body: 'अपने चंद्रिका एवरीडे क्रेडिट कार्ड की वर्तमान स्थिति और लेनदेन इतिहास देखने
    के लिए इन चरणों का पालन करें:


    1. हमें अपने पंजीकृत मोबाइल नंबर और PAN विवरण के साथ अनुरोध भेजें कि आप अपने कार्ड
    का विवरण देखना चाहते हैं।

    2. हम आपकी पहचान सत्यापित करने के लिए एक सुरक्षा प्रमाणीकरण प्रक्रिया (जैसे OTP)
    शुरू करेंगे।

    3. सत्यापन सफल होने के बाद, हम आपको आपके कार्ड की वर्तमान स्थिति (जैसे: सक्रिय,
    अस्थायी रूप से अवरुद्ध, या बंद) की पुष्टि करेंगे।

    4. यदि आप लेनदेन इतिहास चाहते हैं, तो हमें वह समय अवधि (जैसे: पिछला एक महीना या
    पिछला त्रैमासिक) बताएं जिसका विवरण आप देखना चाहते हैं।

    5. हम आपको आपके पंजीकृत ईमेल या सुरक्षित संदेश के माध्यम से विस्तृत विवरण भेजेंगे,
    जिसमें आपके द्वारा किए गए खर्च, भुगतान की गई राशि और अर्जित रिवॉर्ड पॉइंट्स शामिल
    होंगे।


    जब आपको विवरण प्राप्त हो जाएं और आप उनमें संतुष्ट हों, तो आपका अनुरोध पूर्ण माना
    जाएगा।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 65e63c64-5908-5bf3-8d1c-cbd7157eb468
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: आपका चंद्रिका एवरीडे क्रेडिट कार्ड किसी स्टोर या ऑनलाइन प्लेटफॉर्म
    पर ''Transaction Declined'' या ''Card Blocked'' दिखा रहा है।


    संभावित कारण:

    - उपलब्ध क्रेडिट सीमा का समाप्त होना।

    - गलत PIN या CVV का प्रवेश।

    - सुरक्षा कारणों से बैंक द्वारा कार्ड का अस्थायी रूप से अवरुद्ध किया जाना (जैसे
    संदिग्ध लेनदेन)।

    - KYC विवरण का पुराना होना।


    समाधान के चरण:

    1. सबसे पहले जांचें कि क्या आपने अपनी क्रेडिट सीमा पार कर ली है या पिछला भुगतान
    बकाया है।

    2. यदि विवरण सही हैं, तो हमसे पुष्टि करें कि क्या आपका कार्ड सुरक्षा कारणों से
    लॉक किया गया है।

    3. यदि KYC लंबित है, तो अपना नवीनतम PAN और आधार विवरण साझा करें ताकि हम सत्यापन
    पूरा कर सकें।


    यदि समस्या हमारे स्तर पर है, तो हम इसे प्राथमिकता के आधार पर हल करेंगे। गंभीर
    तकनीकी त्रुटि होने पर, हम मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे और आपको
    एक संदर्भ संख्या प्रदान करेंगे। समाधान की समय-सीमा RBI के दिशानिर्देशों के अनुसार
    होगी।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
