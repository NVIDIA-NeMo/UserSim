  institution_id: chandrika_bank
- id: bd06cea9-17a3-5862-95af-2af4d6112d77
  title: 1-वर्षीय सावधि जमा (FD) — वरिष्ठ नागरिकों के लिए अतिरिक्त दर की व्याख्या
  body: 'प्रश्न: वरिष्ठ नागरिकों के लिए 1-वर्षीय सावधि जमा (FD) में क्या विशेष लाभ
    है?

    उत्तर: चंद्रिका बैंक वरिष्ठ नागरिकों को प्रोत्साहित करने के लिए मानक ब्याज दर
    पर अतिरिक्त लाभ प्रदान करता है। इस उत्पाद की सामान्य ब्याज दर 7.1% है, लेकिन वरिष्ठ
    नागरिकों को इस पर 0.5% की अतिरिक्त दर मिलती है, जिससे उनकी कुल प्रभावी ब्याज दर
    7.6% हो जाती है।


    प्रश्न: क्या यह अतिरिक्त दर सभी जमा राशियों पर लागू है?

    उत्तर: हाँ, न्यूनतम ₹10,000 की जमा राशि पूरी करने वाले सभी पात्र वरिष्ठ नागरिकों
    के लिए यह दर लागू है। अधिक विवरण के लिए 1-वर्षीय सावधि जमा (FD) — ब्याज दर अनुसूची
    देखें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
  placeholder: true
