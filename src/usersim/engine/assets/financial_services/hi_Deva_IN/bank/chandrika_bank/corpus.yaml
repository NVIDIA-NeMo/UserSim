- id: 1992a37c-b02b-5ec7-9a61-12cb2fb6b671
  title: 1-वर्षीय सावधि जमा (FD) — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपनी 1-वर्षीय सावधि जमा (FD) की परिपक्वता राशि या ब्याज में कमी
    महसूस होती है, तो निम्नलिखित जांच करें:


    - लक्षण: परिपक्वता पर प्राप्त राशि अपेक्षित गणना से कम है।

    - संभावित कारण: सबसे आम कारण ''समयपूर्व निकासी'' है। यदि आपने 12 महीने पूरे होने
    से पहले FD बंद की है, तो 1% का समयपूर्व निकासी दंड लगाया जाता है।

    - जाँच क्रम: पहले अपनी FD की परिपक्वता तिथि जांचें। फिर देखें कि क्या निकासी उस
    तिथि से पहले की गई थी।

    - समाधान: यदि निकासी समयपूर्व थी, तो यह शुल्क मानक शर्तों के अनुसार है। यदि आप
    मानते हैं कि यह एक गलती है, तो हमें सूचित करें।

    - एस्केलेशन: यदि समस्या का समाधान नहीं होता है, तो हम मामले को आंतरिक शिकायत अधिकारी
    के पास भेजेंगे। गंभीर मामलों में, हम इसे नियामक पथ पर भेजते हैं और RBI के समय-सीमा
    ढांचे के अनुसार समाधान सुनिश्चित करते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: troubleshooting
