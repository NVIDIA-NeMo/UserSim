  mentions_tools: []
  institution_id: chandrika_bank
- id: e9dbe27b-516d-5b69-8496-9c70a59718b2
  title: नियमित बचत खाता — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक का दावा है कि उनके द्वारा दर्ज किया गया लेनदेन बैंक स्टेटमेंट
    में नहीं दिख रहा है या शुल्क गलत लगाया गया है।


    जाँच प्रक्रिया:

    1. सबसे पहले ग्राहक से लेनदेन की तारीख, राशि और संदर्भ संख्या (Transaction ID)
    मांगें।

    2. यदि यह Monthly Average Balance से संबंधित शुल्क है, तो पिछले महीने के दैनिक
    शेष की जाँच करें कि क्या वह ₹10000 से कम था। यदि हाँ, तो ₹500 का below_mab_charge
    सही है।

    3. यदि यह ATM शुल्क है, तो जाँचें कि क्या ग्राहक ने महीने के 5 निःशुल्क लेनदेन
    की सीमा पार कर ली है।


    समाधान:

    - यदि बैंक की गलती पाई जाती है, तो हम तुरंत राशि को वापस (Reverse) करने की प्रक्रिया
    शुरू करेंगे।

    - यदि लेनदेन विफल हुआ था लेकिन राशि कट गई थी, तो हम RBI के TAT ढांचे के अनुसार
    इसकी जांच करेंगे और समाधान प्रदान करेंगे।


    अधिक विवरण के लिए ''नियमित बचत खाता — अनपेक्षित शुल्क या राशि'' देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 4f55fe8c-f1ad-51b9-902b-fe61a5308b88
  title: 1-वर्षीय सावधि जमा (FD) — सिंहावलोकन
  body: 'चंद्रिका बैंक का 1-वर्षीय सावधि जमा (FD) उन ग्राहकों के लिए एक आदर्श विकल्प
    है जो अपनी बचत पर सुरक्षित और गारंटीकृत रिटर्न चाहते हैं। यह उत्पाद मध्यम वर्ग
    और बचत करने वाले परिवारों को वित्तीय स्थिरता प्रदान करने के लिए डिज़ाइन किया गया
    है।


    मुख्य विशेषताएं और शर्तें:

    - निवेश अवधि: इस जमा की अवधि 12 माह है।

    - ब्याज दर: सामान्य ग्राहकों के लिए ब्याज दर 7.1% है।

    - वरिष्ठ नागरिक लाभ: वरिष्ठ नागरिकों को 0.5% की अतिरिक्त ब्याज दर प्रदान की जाती
    है।

    - न्यूनतम जमा राशि: इस खाते को खोलने के लिए न्यूनतम ₹10000 जमा करना आवश्यक है।

    - समयपूर्व निकासी: यदि आप परिपक्वता से पहले राशि निकालते हैं, तो 1% का समयपूर्व
    निकासी दंड लागू होगा।


    यह उत्पाद उन लोगों के लिए सबसे उपयुक्त है जो एक निश्चित समय के लिए अपनी पूंजी
    को लॉक करना चाहते हैं और प्रतिस्पर्धी दरों का लाभ उठाना चाहते हैं। कृपया ध्यान
    दें कि हम केवल शैक्षिक जानकारी प्रदान करते हैं और व्यक्तिगत वित्तीय सलाह नहीं
    देते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 6d083fcc-c254-566c-8599-3499ee2ea1ca
  title: 1-वर्षीय सावधि जमा (FD) — अवधि (माह) की व्याख्या
  body: 'प्रश्न: मेरे 1-वर्षीय सावधि जमा (FD) की वास्तविक अवधि क्या है?

    उत्तर: इस उत्पाद के लिए निर्धारित अवधि ठीक 12 माह है। इसका अर्थ है कि आपकी जमा
    राशि और उस पर अर्जित ब्याज इस अवधि के पूरा होने पर देय होंगे।


    प्रश्न: क्या मैं अवधि पूरी होने से पहले पैसा निकाल सकता हूँ?

    उत्तर: हाँ, आप ऐसा कर सकते हैं, लेकिन ऐसी स्थिति में आपको 1% का समयपूर्व निकासी
    दंड देना होगा। अधिक जानकारी के लिए ''1-वर्षीय सावधि जमा (FD) — शुल्क अनुसूची''
    देखें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 76e6d28f-2c52-5c68-bd29-1a298e79ace7
  title: 1-वर्षीय सावधि जमा (FD) — सेटअप और सक्रियण
  body: '1-वर्षीय सावधि जमा (FD) शुरू करने के लिए निम्नलिखित चरणों का पालन करें:


    शुरुआत करने से पहले: सुनिश्चित करें कि आपके पास अपना PAN और आधार कार्ड तैयार है
    और आपका KYC सत्यापन पूर्ण है।


    1. हमें सूचित करें कि आप 1-वर्षीय सावधि जमा (FD) खोलना चाहते हैं और वह राशि बताएं
    जिसे आप निवेश करना चाहते हैं (न्यूनतम ₹10000)।

    2. अपनी पहचान सत्यापित करने के लिए अपना PAN और आधार विवरण प्रदान करें। हम आपके
    KYC दस्तावेजों का सत्यापन करेंगे।

    3. उस खाते का विवरण दें जिससे निवेश राशि का डेबिट किया जाना है।

    4. हम आपको निवेश की पुष्टि, 7.1% की ब्याज दर (वरिष्ठ नागरिकों के लिए अतिरिक्त
    0.5%) और 12 माह की अवधि का विवरण प्रदान करेंगे।

    5. एक बार जब आप शर्तों से सहमत हो जाते हैं, तो हम राशि डेबिट करेंगे और आपको एक
    सावधि जमा रसीद (FD Receipt) प्रदान करेंगे।


    आपकी FD अब सक्रिय है और परिपक्वता तिथि तक ब्याज अर्जित करेगी।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 582a67d2-9a35-5511-ae98-23a749a0c00c
  title: 1-वर्षीय सावधि जमा (FD) — शुल्क अनुसूची
  body: '1-वर्षीय सावधि जमा (FD) के लिए लागू शुल्क निम्नलिखित हैं:


    - खाता खोलने का शुल्क: निःशुल्क

    - समयपूर्व निकासी दंड: लागू ब्याज दर पर 1% का जुर्माना (यदि जमा राशि को 12 माह
    की परिपक्वता अवधि से पहले निकाला जाता है)।

    - रखरखाव शुल्क: कोई मासिक या वार्षिक रखरखाव शुल्क लागू नहीं है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
