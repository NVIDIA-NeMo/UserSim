  institution_id: chandrika_bank
- id: ea03393e-b0ae-5328-9821-5f577b63bbf6
  title: 1-वर्षीय सावधि जमा (FD) — नियामक प्रकटीकरण
  body: 'चंद्रिका बैंक नियामक अनुपालन के प्रति प्रतिबद्ध है। 1-वर्षीय सावधि जमा (FD)
    के संबंध में निम्नलिखित प्रकटीकरण अनिवार्य हैं:


    - जमा बीमा: RBI के दिशानिर्देशों के अनुसार, आपके जमा पर DICGC द्वारा ₹5,00,000
    तक का बीमा कवर प्रदान किया जाता है, जो बैंक की विफलता की स्थिति में आपकी पूंजी
    की सुरक्षा सुनिश्चित करता है।

    - ब्याज दरें: वर्तमान ब्याज दर 7.1% है, और वरिष्ठ नागरिकों के लिए यह 0.5% अधिक
    है। दरें बैंक की मानक शर्तों के अधीन हैं।

    - समयपूर्व निकासी: परिपक्वता से पहले निकासी पर 1% का दंड लागू होता है, जो अर्जित
    ब्याज से काटा जाता है।

    - कर उत्तरदायित्व: अर्जित ब्याज पर लागू TDS नियमों के अनुसार कर कटौती की जाएगी।


    हम केवल उत्पाद की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं; हम व्यक्तिगत
    टैक्स या कानूनी सलाह नहीं देते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 1956c1a9-a792-5ae4-a74b-189b344d53a0
  title: 1-वर्षीय सावधि जमा (FD) — ब्याज दर अनुसूची
  body: '1-वर्षीय सावधि जमा (FD) के लिए ब्याज दरें निम्नानुसार हैं:


    - सामान्य श्रेणी के ग्राहक: 7.1%

    - वरिष्ठ नागरिक: 7.6% (7.1% आधार दर + 0.5% अतिरिक्त लाभ)


    ये दरें सभी जमा राशियों (न्यूनतम ₹10000 से ऊपर) पर समान रूप से लागू होती हैं।
    ब्याज की गणना बैंक की मानक शर्तों के अनुसार की जाती है और 12 माह की परिपक्वता
    अवधि के बाद भुगतान किया जाता है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: rate_sheet
  source_authority: official
