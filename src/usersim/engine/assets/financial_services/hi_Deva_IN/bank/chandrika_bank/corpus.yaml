- id: 24380cfc-3866-58fc-a85e-5a81a127e6b9
  title: नियमित बचत खाता — शर्तों में बदलाव की नीति
  body: "चंद्रिका बैंक को परिचालन आवश्यकताओं और नियामक दिशानिर्देशों के आधार पर नियमित\
    \ बचत खाता की शर्तों, शुल्क और ब्याज दरों में बदलाव करने का अधिकार है। \n\nबदलाव\
    \ की प्रक्रिया:\n- शुल्क और दरें: यदि हम मासिक औसत शेष (MAB) की सीमा ₹10,000 या\
    \ कम शेष होने पर लगने वाले ₹500 के शुल्क में कोई बदलाव करते हैं, तो इसकी सूचना\
    \ ग्राहकों को 30 दिन पहले दी जाएगी।\n- ब्याज दर: वर्तमान 3.5% की वार्षिक ब्याज\
    \ दर बाजार की स्थितियों के अनुसार बदली जा सकती है।\n- अधिसूचना: सभी महत्वपूर्ण\
    \ बदलाव आपके पंजीकृत मोबाइल नंबर या ईमेल के माध्यम से सूचित किए जाएंगे।\n\nग्राहक\
    \ की सहमति: नई शर्तों के लागू होने के बाद खाते का निरंतर संचालन यह माना जाएगा\
    \ कि ग्राहक ने संशोधित शर्तों को स्वीकार कर लिया है। यदि आप बदलावों से सहमत नहीं\
    \ हैं, तो आप 'नियमित बचत खाता — रद्द करना, बंद करना या डाउनग्रेड करना' के अनुसार\
    \ अपना खाता बंद कर सकते हैं।"
  domain: retail_banking
  product_category: savings_regular
  document_type: terms_conditions
  source_authority: official
  placeholder: true
