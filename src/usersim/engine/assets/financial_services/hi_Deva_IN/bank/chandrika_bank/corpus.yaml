- id: 4b863a15-0c0e-5cba-9263-9d61f20e5e76
  title: UPI और बिल भुगतान — बदलाव या अद्यतन करना
  body: 'यदि आप अपने ''UPI और बिल भुगतान'' प्रोफाइल या संबद्ध विवरणों में बदलाव करना
    चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें वह विवरण बताएं जिसे आप अपडेट करना चाहते हैं (जैसे कि आपका मोबाइल नंबर
    या लिंक किया गया बैंक खाता)।

    2. सुरक्षा के लिए, हम आपसे आपके PAN और आधार-आधारित KYC सत्यापन को पुनः प्रमाणित
    करने के लिए कहेंगे।

    3. विवरण अपडेट करने के लिए आवश्यक सत्यापन कोड (OTP) प्रदान करें।

    4. हम आपके अनुरोध को प्रोसेस करेंगे और विवरणों के सफलतापूर्वक अपडेट होने की पुष्टि
    करेंगे।

    5. यदि आपने अपना मोबाइल नंबर बदला है, तो आपको अपनी UPI आईडी को फिर से रजिस्टर
    करना होगा और एक नया UPI PIN बनाना होगा।


    एक बार जब हम आपको पुष्टि संदेश भेज देते हैं, तो आप अपने अद्यतित विवरणों के साथ
    भुगतान सेवाएं फिर से शुरू कर सकते हैं।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: aeffdc13-d061-57a1-afe2-90460b54f4a8
  title: UPI और बिल भुगतान — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: ग्राहक को UPI आईडी लिंक करने या भुगतान ऐप में लॉगिन करने में समस्या
    आ रही है।


    संभावित कारण:

    - बैंक खाते के साथ पंजीकृत मोबाइल नंबर का मेल न खाना।

    - अधूरा या पुराना KYC दस्तावेज़।

    - सर्वर डाउन होना या नेटवर्क समस्या।


    समाधान के चरण:

    1. जांचें कि क्या आपका वर्तमान सिम कार्ड उसी मोबाइल नंबर का है जो बैंक में पंजीकृत
    है।

    2. सुनिश्चित करें कि आपका सिम सक्रिय है और उसमें SMS भेजने/प्राप्त करने के लिए
    पर्याप्त बैलेंस है।

    3. अपने KYC स्टेटस की जांच करें; यदि वह अपडेट नहीं है, तो आधार-आधारित सत्यापन
    पूरा करें।


    यदि समस्या बनी रहती है, तो हम आपके खाते की स्थिति की तकनीकी जांच करेंगे और समस्या
    का समाधान करेंगे। गंभीर मामलों में, हम मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे।
    समाधान की समय-सीमा RBI के नियामक ढांचे के अनुसार होगी।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2d512cfd-e709-546b-9766-b1f582d86843
  title: UPI और बिल भुगतान — पात्रता श्रेणियाँ
  body: 'सेवा पात्रता विवरण:


    - व्यक्तिगत बचत खाता धारक: पात्र (सक्रिय KYC और लिंक मोबाइल नंबर के साथ)।

    - संयुक्त खाता धारक: पात्र (प्राथमिक खाता धारक के सत्यापन के बाद)।

    - नाबालिग खाते: केवल अभिभावक की सहमति और सीमित नियंत्रण के साथ पात्र।

    - कॉर्पोरेट खाते: केवल विशिष्ट व्यापारिक UPI श्रेणियों के तहत पात्र।


    सभी श्रेणियों के लिए, PAN और आधार-आधारित KYC सत्यापन अनिवार्य है ताकि ₹1,00,000
    की दैनिक और प्रति लेनदेन सीमा का लाभ उठाया जा सके।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: eligibility_matrix
  source_authority: official
