- id: 07b0d02a-af94-5bda-a8e9-158702cbbecd
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — सेटअप और सक्रियण
  body: 'अपने चंद्रिका एवरीडे क्रेडिट कार्ड को सक्रिय करने के लिए इन सरल चरणों का
    पालन करें:


    1. अपने PAN और आधार कार्ड की प्रतियां प्रदान करें ताकि हम अनिवार्य KYC सत्यापन
    प्रक्रिया को पूरा कर सकें।

    2. बैंक द्वारा आपके क्रेडिट स्कोर और पात्रता की जांच करने के बाद, आपको आपका भौतिक
    कार्ड प्राप्त होगा।

    3. हमसे अपना पिन (PIN) सेट करने का अनुरोध करें। हम आपको एक सुरक्षित प्रमाणीकरण
    प्रक्रिया के माध्यम से निर्देशित करेंगे।

    4. एक बार पिन सेट हो जाने के बाद, हम आपके कार्ड के सक्रिय होने की पुष्टि करेंगे।


    सफलता की पुष्टि: जब आप अपना पहला लेनदेन सफलतापूर्वक पूरा कर लेते हैं या बैलेंस
    जांचते हैं, तो आपका कार्ड पूरी तरह सक्रिय माना जाता है। सुरक्षा के लिए याद रखें
    कि अपना UPI PIN या OTP कभी भी किसी के साथ साझा न करें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 128e91e7-f14f-50ca-adf4-697ebcfc73e5
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — शुल्क अनुसूची
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड के लिए लागू शुल्क निम्नलिखित हैं:

    - जॉइनिंग शुल्क: ₹500

    - वार्षिक शुल्क: ₹500

    - वार्षिक शुल्क माफी सीमा: ₹1,50,000 (वार्षिक खर्च होने पर)

    - मासिक वित्त प्रभार: 3.5%

    - वार्षिक वित्त प्रभार: 42%


    सभी शुल्क पारदर्शी हैं और परिचालन लागत को कवर करने के लिए लिए जाते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f961b2cd-a47f-5e39-8540-b09f3734ca84
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने चंद्रिका एवरीडे क्रेडिट कार्ड के साथ किसी समस्या का सामना करना
    पड़ रहा है, तो कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: लेनदेन विफल होना या भुगतान लंबित (Pending) दिखना।


    जांच के चरण:

    1. जांचें कि क्या आपके कार्ड की क्रेडिट सीमा समाप्त हो गई है।

    2. सुनिश्चित करें कि आपका कार्ड सक्रिय है और KYC अपडेटेड है।

    3. यदि लेनदेन विफल हुआ है लेकिन राशि कट गई है, तो कृपया 24-48 घंटे प्रतीक्षा करें।


    समाधान:

    यदि समस्या बनी रहती है, तो हमें सूचित करें। हम RBI के समय-सीमा ढांचे (TAT) के
    अनुसार आपके लेनदेन की जांच करेंगे। यदि लेनदेन वास्तव में विफल रहा है, तो हम राशि
    को आपके खाते में वापस क्रेडिट करेंगे।


    एस्केलेशन: गंभीर धोखाधड़ी या विवाद के मामलों में, हम मामले को तुरंत चार्जबैक और
    नियामक पथ पर भेजेंगे। समाधान न होने पर आप आंतरिक शिकायत अधिकारी और अंततः RBI लोकपाल
    से संपर्क कर सकते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2383acd2-9947-54f0-8654-6fac85369329
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — पात्रता शर्तें
  body: 'पात्रता मानदंड और परिणाम:

    - अनिवार्य दस्तावेज़ (PAN और आधार) उपलब्ध हैं -> KYC सत्यापन संभव (अनिवार्य)।

    - क्रेडिट स्कोर बैंक के मानक मानदंडों के अनुरूप है -> कार्ड जारी करने के लिए पात्र।

    - आय के प्रमाण बैंक की न्यूनतम आवश्यकता को पूरा करते हैं -> क्रेडिट सीमा का निर्धारण।

    - केवाईसी सत्यापन विफल -> आवेदन अस्वीकृत।


    कृपया ध्यान दें कि अंतिम अनुमोदन बैंक की आंतरिक क्रेडिट नीति और मानक शर्तों के
    अधीन है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: a97e930a-cc99-5660-b250-807b05be4d4f
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — यहाँ के समान उत्पाद से तुलना
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड की तुलना हमारे अन्य बचत विकल्पों से करने पर:


    - रिवॉर्ड्स: यह कार्ड 1% रिवॉर्ड दर प्रदान करता है, जो इसे नियमित बचत खाते (जैसे
    ''नियमित बचत खाता — सिंहावलोकन'') से अलग बनाता है जहाँ रिवॉर्ड्स के बजाय ब्याज
    मिलता है।

    - लागत: इसमें ₹500 का वार्षिक शुल्क है, जबकि बचत खातों में MAB बनाए रखने पर शुल्क
    लग सकता है।

    - उपयोग: यह अल्पकालिक क्रेडिट सुविधा के लिए है, जबकि सावधि जमा (FD) दीर्घकालिक
    निवेश के लिए है।


    यह कार्ड उन लोगों के लिए बेहतर है जिन्हें दैनिक खर्चों के लिए लचीलेपन और रिवॉर्ड्स
    की आवश्यकता है। यदि आप केवल सुरक्षित बचत चाहते हैं, तो हमारा बचत खाता अधिक उपयुक्त
    है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 704f3852-698e-51aa-8ec9-a86d6af58670
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — नियामक प्रकटीकरण
  body: 'यह दस्तावेज़ चंद्रिका एवरीडे क्रेडिट कार्ड के उपयोग से संबंधित नियामक शर्तों
    को स्पष्ट करता है।


    1. शुल्क प्रकटीकरण: ग्राहक ₹500 के जॉइनिंग शुल्क और ₹500 के वार्षिक शुल्क के लिए
    उत्तरदायी हैं। ₹1,50,000 के वार्षिक खर्च पर वार्षिक शुल्क की छूट दी जाएगी।

    2. ब्याज दरें: बकाया राशि पर 3.5% मासिक वित्त प्रभार लागू होगा, जो वार्षिक रूप
    से 42% होता है।

    3. नियामक अनुपालन: चंद्रिका बैंक RBI और NPCI के सभी दिशानिर्देशों का कड़ाई से
    पालन करता है।

    4. डेटा गोपनीयता: ग्राहकों का डेटा और KYC जानकारी (PAN/आधार) पूरी तरह सुरक्षित
    रखी जाती है और केवल कानूनी या नियामक आवश्यकताओं के लिए उपयोग की जाती है।

    5. जिम्मेदारी: ग्राहकों को सलाह दी जाती है कि वे अपना UPI PIN या OTP किसी के साथ
    साझा न करें। हम केवल उत्पाद की विशेषताओं की शैक्षिक जानकारी प्रदान करते हैं और
    व्यक्तिगत कानूनी या टैक्स सलाह नहीं देते हैं।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: fff1d8e3-a989-5a22-8329-d74e23f42689
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — ब्याज दर अनुसूची
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड के लिए लागू ब्याज दरें निम्नलिखित हैं:


    - मासिक वित्त प्रभार: 3.5%

    - वार्षिक वित्त प्रभार: 42%

    - रिवॉर्ड दर: 1%


    ये दरें सभी कार्डधारकों पर समान रूप से लागू होती हैं। मासिक वित्त प्रभार केवल
    उस राशि पर लगाया जाता है जो देय तिथि तक भुगतान नहीं की गई है। रिवॉर्ड दर पात्र
    श्रेणियों में किए गए खर्चों पर लागू होती है। दरों में किसी भी बदलाव की सूचना बैंक
    द्वारा निर्धारित समय सीमा के भीतर ग्राहकों को दी जाएगी।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 5d47f940-d247-5b0d-a1fe-258a385e538f
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — वर्तमान ऑफर
  body: 'विशेष ऑफर: अपने खर्चों को रिवॉर्ड्स में बदलें!


    सभी मौजूदा ग्राहकों के लिए, यदि आप वर्तमान वित्तीय वर्ष में ₹1,50,000 का कुल खर्च
    पूरा करते हैं, तो आपका ₹500 का वार्षिक शुल्क पूरी तरह माफ कर दिया जाएगा।


    यह ऑफर वर्तमान कैलेंडर वर्ष के अंत तक वैध है। अपनी पात्रता और खर्च की स्थिति जांचने
    के लिए ''चंद्रिका एवरीडे क्रेडिट कार्ड — शुल्क अनुसूची'' का संदर्भ लें।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: ad7201c6-a599-5022-afea-51ad672c1dcb
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'चंद्रिका बैंक अपने ग्राहकों की सुरक्षा को प्राथमिकता देता है। चंद्रिका एवरीडे
    क्रेडिट कार्ड का उपयोग करते समय, कृपया ध्यान दें कि जालसाज अक्सर बैंक अधिकारी
    बनकर आपसे आपका कार्ड विवरण या ओटीपी (OTP) मांग सकते हैं। याद रखें, चंद्रिका बैंक
    आपसे कभी भी आपका UPI PIN, पासवर्ड या ओटीपी साझा करने के लिए नहीं कहेगा।


    एक सामान्य धोखाधड़ी पैटर्न में आपको एक फर्जी लिंक भेजा जा सकता है जिसमें ''रिवॉर्ड
    पॉइंट्स'' या ''केवाईसी अपडेट'' का दावा किया जाता है। ऐसे किसी भी लिंक पर क्लिक
    न करें। यदि आपको अपने खाते में कोई भी अनधिकृत लेनदेन या संदिग्ध गतिविधि दिखाई
    देती है, तो तुरंत हमें सूचित करें। हम असफल लेनदेन और धोखाधड़ी की रिपोर्टिंग के
    लिए RBI के समय-सीमा ढांचे (turn-around-time) का पालन करते हैं। समय पर रिपोर्टिंग
    आपके वित्तीय जोखिम को कम करने में मदद करती है। सुरक्षा के लिए, हम आपको नियमित
    रूप से अपने लेनदेन विवरणों की जांच करने की सलाह देते हैं ताकि किसी भी विसंगति
    को तुरंत पकड़ा जा सके।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b8fcd770-5648-58a2-897f-0c17c0c6a8d5
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — खाता अनुबंध
  body: 'यह अनुबंध चंद्रिका बैंक और कार्डधारक के बीच चंद्रिका एवरीडे क्रेडिट कार्ड
    के उपयोग की शर्तों को निर्धारित करता है।


    1. शुल्क और भुगतान: कार्डधारक ₹500 के जॉइनिंग शुल्क और ₹500 के वार्षिक शुल्क का
    भुगतान करने के लिए सहमत है। यदि कार्डधारक एक वर्ष में ₹1,50,000 की खर्च सीमा पूरी
    करता है, तो बैंक वार्षिक शुल्क में छूट प्रदान करेगा।

    2. ब्याज और प्रभार: बकाया राशि पर 3.5% का मासिक वित्त प्रभार लागू होगा, जो कि
    42% वार्षिक दर के बराबर है। यह शुल्क भुगतान देय तिथि के बाद शेष राशि पर लगाया
    जाता है।

    3. रिवॉर्ड्स: पात्र लेनदेन पर 1% की दर से रिवॉर्ड दिए जाएंगे।

    4. सत्यापन: किसी भी जानकारी के बदलाव के लिए PAN और आधार-आधारित KYC सत्यापन अनिवार्य
    है।

    5. अनुबंध की समाप्ति: बैंक या ग्राहक किसी भी समय लिखित सूचना देकर इस खाते को बंद
    कर सकते हैं। खाता बंद करने से पहले सभी बकाया राशि और लागू शुल्कों का पूर्ण भुगतान
    करना अनिवार्य है। बैंक RBI के नियमों के अनुसार शर्तों में बदलाव करने का अधिकार
    सुरक्षित रखता है।'
  domain: cards
  product_category: chandrika_credit_card
  document_type: terms_conditions
  source_authority: official
  placeholder: true
