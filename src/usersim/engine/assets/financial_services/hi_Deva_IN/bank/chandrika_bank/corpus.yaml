- id: 188eccfb-7e9d-52ea-a920-643cdbaeb2c9
  title: 1-वर्षीय सावधि जमा (FD) — पात्रता शर्तें
  body: "1-वर्षीय सावधि जमा (FD) के लिए पात्रता मानदंड:\n\n- न्यूनतम जमा राशि: ₹10000\
    \ या अधिक $\rightarrow$ पात्र\n- न्यूनतम जमा राशि: ₹10000 से कम $\rightarrow$\
    \ अपात्र\n- KYC स्थिति: PAN और आधार सत्यापित $\rightarrow$ पात्र\n- KYC स्थिति:\
    \ असत्यापित $\rightarrow$ अपात्र\n- आयु (सामान्य): 18 वर्ष या उससे अधिक $\rightarrow$\
    \ पात्र (ब्याज दर 7.1%)\n- आयु (वरिष्ठ नागरिक): 60 वर्ष या उससे अधिक $\rightarrow$\
    \ पात्र (ब्याज दर 7.1% + 0.5% अतिरिक्त)"
