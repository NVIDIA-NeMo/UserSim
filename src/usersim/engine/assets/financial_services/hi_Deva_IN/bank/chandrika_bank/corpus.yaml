- id: 0f99a089-4652-5bc0-92da-5e7e8fcc2aa5
  title: 1-वर्षीय सावधि जमा (FD) — शुरुआत कैसे करें
  body: 'सहायता एजेंटों के लिए मार्गदर्शिका: ग्राहकों को 1-वर्षीय सावधि जमा (FD) शुरू
    करने में मदद करने के लिए निम्नलिखित विवरणों का पालन करें।


    उत्पाद विवरण:

    - निवेश अवधि: 12 महीने

    - ब्याज दर: 7.1% (सामान्य नागरिकों के लिए)

    - वरिष्ठ नागरिक लाभ: अतिरिक्त 0.5% ब्याज दर

    - न्यूनतम जमा राशि: ₹10,000

    - समयपूर्व निकासी शुल्क: 1% दंड


    प्रक्रिया:

    1. ग्राहक की पात्रता की पुष्टि करें और सुनिश्चित करें कि उनका KYC (PAN और आधार)
    अपडेटेड है।

    2. ग्राहक से निवेश की राशि (न्यूनतम ₹10,000) और ब्याज भुगतान की प्राथमिकता (मासिक/तिमाही/परिपक्वता
    पर) पूछें।

    3. यदि ग्राहक वरिष्ठ नागरिक है, तो उन्हें 7.6% (7.1% + 0.5%) की प्रभावी दर के
    बारे में सूचित करें।

    4. जमा प्रक्रिया पूरी होने के बाद, ग्राहक को डिजिटल रसीद प्रदान करें और उन्हें
    सूचित करें कि उनका जमा DICGC बीमा के तहत ₹5,00,000 तक सुरक्षित है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
