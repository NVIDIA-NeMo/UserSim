- id: f8282aac-72d5-5a23-b3d2-f9f6fddea530
  title: UPI और बिल भुगतान — शुल्क अनुसूची
  body: 'चंद्रिका बैंक ''UPI और बिल भुगतान'' सेवा के लिए निम्नलिखित शुल्क ढांचा अपनाता
    है:


    - UPI लेनदेन शुल्क: ₹0 (निःशुल्क)

    - बिल भुगतान शुल्क: ₹0 (निःशुल्क)

    - UPI Lite सेटअप शुल्क: ₹0 (निःशुल्क)


    हमारी शुल्क नीति पारदर्शी है और हम परिचालन लागत को कवर करने के लिए केवल मानक बैंकिंग
    शुल्क लेते हैं। किसी भी अन्य शुल्क के लिए ''संस्था-व्यापी शुल्क और प्रभार'' देखें।'
  domain: payments
  product_category: upi_and_bill_payments
  document_type: fee_schedule
  source_authority: official
  placeholder: true
