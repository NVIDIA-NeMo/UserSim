- id: 24f33f2b-1c01-5947-9df5-e64af04d39c2
  title: 1-वर्षीय सावधि जमा (FD) — न्यूनतम जमा की व्याख्या
  body: 'प्रश्न: मैं 1-वर्षीय सावधि जमा (FD) खाता खोलने के लिए न्यूनतम कितनी राशि
    जमा कर सकता हूँ?

    उत्तर: 1-वर्षीय सावधि जमा (FD) शुरू करने के लिए न्यूनतम जमा राशि ₹10,000 है। आप
    इस राशि या इससे अधिक के साथ अपना निवेश शुरू कर सकते हैं।


    प्रश्न: क्या मैं ₹10,000 से कम राशि के साथ FD खोल सकता हूँ?

    उत्तर: नहीं, इस विशिष्ट उत्पाद के लिए ₹10,000 की न्यूनतम सीमा अनिवार्य है। यदि
    आप छोटी राशि से बचत करना चाहते हैं, तो आप आवर्ती जमा (RD) — सिंहावलोकन देख सकते
    हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 96815f99-a703-58e9-b6e0-1e44c7c3be53
  title: 1-वर्षीय सावधि जमा (FD) — स्थिति या इतिहास देखना
  body: 'अपनी 1-वर्षीय सावधि जमा (FD) की वर्तमान स्थिति या लेनदेन का इतिहास जानने
    के लिए इन चरणों का पालन करें:


    1. हमें अपनी FD खाता संख्या या पंजीकृत ग्राहक आईडी प्रदान करें।

    2. हम आपकी पहचान सत्यापित करने के लिए आपसे कुछ बुनियादी विवरण मांगेंगे या आपका
    PAN/आधार आधारित KYC सत्यापन सुनिश्चित करेंगे।

    3. सत्यापन के बाद, हमसे अपनी FD की ''वर्तमान स्थिति'' या ''ब्याज इतिहास'' देखने
    का अनुरोध करें।

    4. हम आपको आपकी जमा राशि, अब तक अर्जित ब्याज, परिपक्वता तिथि (Maturity Date) और
    शेष अवधि की पूरी जानकारी प्रदान करेंगे।

    5. यदि आप लिखित विवरण चाहते हैं, तो हमें विवरण भेजने का अनुरोध करें, और हम आपके
    पंजीकृत ईमेल या पते पर आधिकारिक स्टेटमेंट भेज देंगे।


    जब आपको आपकी जमा राशि और अर्जित ब्याज का विवरण प्राप्त हो जाए, तो आपकी पूछताछ
    पूरी हो जाती है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 766026cf-10c9-5a9b-be72-9069d50f63ea
  title: 1-वर्षीय सावधि जमा (FD) — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी 1-वर्षीय सावधि जमा (FD) खोलने या बंद करने का अनुरोध अस्वीकृत या
    अवरुद्ध हो गया है, तो कृपया निम्नलिखित की जाँच करें:


    संभावित कारण और समाधान:

    - अपर्याप्त धनराशि: यदि आप अपने बचत खाते से FD खोल रहे हैं, तो सुनिश्चित करें
    कि आपके खाते में न्यूनतम ₹10,000 उपलब्ध हैं।

    - अधूरा KYC: यदि आपका PAN या आधार विवरण अपडेट नहीं है, तो सुरक्षा कारणों से कार्रवाई
    अवरुद्ध हो सकती है। अपना KYC विवरण अपडेट करवाएं।

    - समय-पूर्व निकासी प्रतिबंध: यदि FD पर कोई बाहरी लीन (lien) या ऋण है, तो इसे बंद
    करने का अनुरोध अस्वीकृत हो सकता है।


    समाधान प्रक्रिया:

    1. पहले अपने खाते का शेष और KYC स्थिति की जाँच करें।

    2. यदि विवरण सही हैं, तो हमें त्रुटि संदेश के साथ पुनः अनुरोध करें।

    3. यदि समस्या बनी रहती है, तो हम इस मामले को आंतरिक जांच के लिए अपनी विशेषज्ञ
    टीम को भेजेंगे।

    4. समाधान होने पर आपको SMS या ईमेल के माध्यम से सूचित किया जाएगा। गंभीर विसंगतियों
    के मामले में, हम नियामक पथ का पालन करेंगे।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 1cf5719f-9723-5cde-9deb-4d5f9e4a4dc1
  title: 1-वर्षीय सावधि जमा (FD) — कब स्विच या अपग्रेड करें
  body: आपको अपनी वर्तमान निवेश योजना से 1-वर्षीय सावधि जमा (FD) पर तब स्विच करना
    चाहिए जब आप 12 महीने की एक निश्चित अवधि के लिए अपनी राशि को सुरक्षित रखना चाहते
    हैं और 7.1% (वरिष्ठ नागरिकों के लिए 7.6%) की गारंटीकृत ब्याज दर प्राप्त करना चाहते
    हैं। यदि आप मासिक बचत करना चाहते हैं, तो आवर्ती जमा (RD) बेहतर है। यदि आपको फंड
    की तुरंत जरूरत पड़ सकती है, तो नियमित बचत खाता — सिंहावलोकन अधिक लचीला है, हालांकि
    वहां ब्याज दरें कम होती हैं।
