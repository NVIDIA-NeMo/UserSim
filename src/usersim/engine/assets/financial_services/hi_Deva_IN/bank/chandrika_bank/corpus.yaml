- id: a129b4aa-eb2f-58a4-8311-43c93a143ab7
  title: नियमित बचत खाता — सिंहावलोकन
  body: 'चंद्रिका बैंक का नियमित बचत खाता उन परिवारों और व्यक्तियों के लिए एक आदर्श
    समाधान है जो अपनी मेहनत की कमाई को सुरक्षित रखना चाहते हैं और साथ ही अपनी दैनिक
    वित्तीय जरूरतों के लिए लचीलापन चाहते हैं। यह खाता आपको सुरक्षित बचत और आसान बैंकिंग
    का अनुभव प्रदान करता है।


    इस खाते की मुख्य विशेषताएं और शर्तें निम्नलिखित हैं:

    - ब्याज दर: आपके जमा पर 3.5% की वार्षिक ब्याज दर प्रदान की जाती है।

    - औसत मासिक शेष (MAB): इस खाते में ₹10000 का Monthly Average Balance बनाए रखना
    अनिवार्य है।

    - MAB कम होने पर शुल्क: यदि औसत मासिक शेष ₹10000 से कम हो जाता है, तो ₹500 का
    शुल्क लगाया जाएगा।

    - ATM सुविधा: आपको प्रति माह 5 निःशुल्क ATM लेनदेन की सुविधा मिलती है।

    - डेबिट कार्ड शुल्क: इस खाते के साथ मिलने वाले डेबिट कार्ड के लिए ₹250 का वार्षिक
    शुल्क लागू है।


    हमारा उद्देश्य मध्यम वर्ग के ग्राहकों को पारदर्शी बैंकिंग और प्रतिस्पर्धी दरों
    के माध्यम से सशक्त बनाना है। अधिक विवरण के लिए कृपया नियमित बचत खाता — शुल्क अनुसूची
    देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 0942c63f-aef9-52a4-92f1-6baf1612d6ad
  title: नियमित बचत खाता — औसत मासिक शेष (MAB) की व्याख्या
  body: 'प्रश्न: नियमित बचत खाता में Monthly Average Balance (MAB) क्या है और इसकी
    गणना कैसे की जाती है?

    उत्तर: MAB वह औसत शेष है जिसे आपको एक कैलेंडर महीने के दौरान अपने खाते में बनाए
    रखना होता है। नियमित बचत खाता के लिए यह राशि ₹10000 है। इसकी गणना महीने के प्रत्येक
    दिन के अंतिम शेष के योग को उस महीने के दिनों की कुल संख्या से विभाजित करके की
    जाती है।


    प्रश्न: यदि मेरा शेष ₹10000 से कम हो जाता है तो क्या होगा?

    उत्तर: यदि आपका औसत मासिक शेष ₹10000 की निर्धारित सीमा से नीचे गिर जाता है, तो
    बैंक ₹500 का शुल्क लागू करेगा। अधिक जानकारी के लिए नियमित बचत खाता — शुल्क अनुसूची
    देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f925ddf1-8e9c-52d8-bbc1-3a7b5c4cff0a
  title: नियमित बचत खाता — सेटअप और सक्रियण
  body: 'नियमित बचत खाता खोलने और सक्रिय करने के लिए इन चरणों का पालन करें:


    1. अपनी पहचान और पते के प्रमाण के रूप में मूल PAN कार्ड और आधार कार्ड प्रस्तुत
    करें। हम आपके दस्तावेजों का KYC सत्यापन करेंगे।

    2. खाते के प्रकार के रूप में ''नियमित बचत खाता'' का चयन करें और अपनी व्यक्तिगत
    जानकारी साझा करें।

    3. अपनी प्रारंभिक जमा राशि जमा करें। सुनिश्चित करें कि आप भविष्य में ₹10000 का
    औसत मासिक शेष (MAB) बनाए रखने की योजना बना रहे हैं ताकि शुल्क से बचा जा सके।

    4. हम आपके खाते को सक्रिय करेंगे और आपको आपका खाता नंबर और स्वागत किट प्रदान करेंगे।

    5. अपने डेबिट कार्ड को सक्रिय करने के लिए हमसे अनुरोध करें, जिसके लिए ₹250 का
    वार्षिक शुल्क लागू होगा।


    जब आपको आपका खाता नंबर मिल जाता है और आपका पहला लेनदेन सफल हो जाता है, तो आपका
    खाता पूरी तरह से सक्रिय माना जाता है। पात्रता के बारे में अधिक जानने के लिए नियमित
    बचत खाता — पात्रता शर्तें देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
