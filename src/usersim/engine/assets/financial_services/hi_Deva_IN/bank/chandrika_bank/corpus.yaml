- id: 9f19f4cc-ce77-51bb-b170-b78e0532358e
  title: 1-वर्षीय सावधि जमा (FD) — जोखिम प्रकटीकरण
  body: 'यह प्रकटीकरण 1-वर्षीय सावधि जमा (FD) से जुड़े जोखिमों और नियामक पहलुओं को
    स्पष्ट करता है।


    1. तरलता जोखिम: यह एक सावधि जमा है, जिसका अर्थ है कि आपका पैसा 12 महीने के लिए
    लॉक रहता है। यद्यपि समयपूर्व निकासी संभव है, लेकिन इसके लिए 1% का समयपूर्व निकासी
    दंड लागू होगा, जिससे आपका वास्तविक रिटर्न कम हो जाएगा।

    2. जमा बीमा: RBI के दिशानिर्देशों के अनुसार, आपके जमा पर DICGC द्वारा ₹5,00,000
    तक का बीमा कवर शामिल है। इस सीमा से ऊपर की राशि नियामक सुरक्षा के दायरे से बाहर
    हो सकती है।

    3. टैक्स दायित्व: इस उत्पाद से अर्जित ब्याज पर लागू कर कानूनों के अनुसार TDS काटा
    जा सकता है। हम केवल उत्पाद की विशेषताओं की शैक्षिक जानकारी देते हैं; हम व्यक्तिगत
    टैक्स या कानूनी सलाह नहीं देते हैं।

    4. पात्रता: सभी लाभों (जैसे वरिष्ठ नागरिक अतिरिक्त 0.5% दर) का लाभ उठाने के लिए
    अनिवार्य KYC और पात्रता शर्तों का पालन करना आवश्यक है।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: disclosure
