  institution_id: chandrika_bank
- id: 44b1016b-7f85-50ee-bc4e-7448b1cc05ad
  title: नियमित बचत खाता — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'चंद्रिका बैंक का नियमित बचत खाता उन व्यक्तियों और परिवारों के लिए डिज़ाइन
    किया गया है जो अपनी दैनिक बचत को सुरक्षित रखना चाहते हुए तरलता (liquidity) बनाए
    रखना चाहते हैं।


    यह उत्पाद निम्नलिखित के लिए सबसे उपयुक्त है:

    - मध्यम वर्गीय परिवार जो भविष्य के लिए छोटी-छोटी बचत करना चाहते हैं।

    - ऐसे व्यक्ति जिन्हें नियमित लेनदेन के लिए एक भरोसेमंद बैंकिंग समाधान की आवश्यकता
    है।

    - वे ग्राहक जो अपनी जमा राशि पर 3.5% की स्थिर ब्याज दर चाहते हैं।


    मुख्य विशेषताएं और शुल्क:

    - न्यूनतम औसत मासिक शेष (MAB): ₹10000

    - MAB बनाए न रखने पर शुल्क: ₹500

    - डेबिट कार्ड वार्षिक शुल्क: ₹250

    - निःशुल्क ATM लेनदेन: प्रति माह 5


    यह खाता दैनिक खर्चों के प्रबंधन और आपातकालीन निधि के रूप में उपयोग करने के लिए
    एक आदर्श विकल्प है। आपकी जमा राशि DICGC बीमा के माध्यम से ₹5,00,000 तक सुरक्षित
    है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2ce2cae6-ae2e-563b-89b9-1ba5b1e387c4
  title: नियमित बचत खाता — MAB से कम शेष होने पर शुल्क की व्याख्या
  body: 'प्रश्न: यदि मेरे नियमित बचत खाते में औसत मासिक शेष (MAB) ₹10000 से कम हो
    जाता है, तो क्या होगा?

    उत्तर: यदि आपका Monthly Average Balance (MAB) निर्धारित ₹10000 की सीमा से नीचे
    गिर जाता है, तो बैंक परिचालन लागत को कवर करने के लिए ₹500 का शुल्क लगाएगा।


    प्रश्न: यह शुल्क कब काटा जाता है?

    उत्तर: यह शुल्क महीने के अंत में औसत शेष की गणना करने के बाद लागू किया जाता है।
    अधिक विवरण के लिए कृपया नियमित बचत खाता — औसत मासिक शेष (MAB) की व्याख्या देखें।'
  domain: retail_banking
  product_category: savings_regular
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 64145109-b8d3-5f4a-9f40-fb48aef77bab
  title: नियमित बचत खाता — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'अपने नियमित बचत खाते को बंद करने या उसे किसी अन्य श्रेणी में डाउनग्रेड करने
    के लिए इन चरणों का पालन करें:


    1. हमें अपना खाता बंद करने या डाउनग्रेड करने का अनुरोध बताएं।

    2. हम आपसे आपके पहचान प्रमाण और PAN/आधार-आधारित KYC सत्यापन की पुष्टि करने के
    लिए कहेंगे।

    3. यदि आपके खाते में शेष राशि है, तो हमें बताएं कि आप इसे नकद लेना चाहते हैं या
    किसी अन्य बैंक खाते में स्थानांतरित करना चाहते हैं।

    4. अपना सक्रिय डेबिट कार्ड हमें सौंपें या पुष्टि करें कि आपने उसे नष्ट कर दिया
    है, ताकि ₹250 के वार्षिक शुल्क जैसी भविष्य की देनदारियां समाप्त हो जाएं।

    5. हम आपके खाते के अंतिम विवरण की समीक्षा करेंगे और सभी लंबित शुल्कों का निपटान
    करेंगे।

    6. एक बार प्रक्रिया पूरी होने पर, हम आपको खाते के बंद होने या डाउनग्रेड होने की
    औपचारिक पुष्टि प्रदान करेंगे।'
  domain: retail_banking
  product_category: savings_regular
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: c69adeb4-195f-594d-b61e-f0ff4d1cb2f9
  title: नियमित बचत खाता — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने नियमित बचत खाते में कोई ऐसा शुल्क दिखता है जिसे आप नहीं पहचानते,
    तो कृपया इस प्रक्रिया का पालन करें:


    संभावित कारण:

    - Monthly Average Balance (MAB) ₹10000 से कम होने पर ₹500 का शुल्क।

    - वार्षिक डेबिट कार्ड शुल्क ₹250 की कटौती।

    - प्रति माह 5 निःशुल्क ATM लेनदेन की सीमा पार करने पर प्रभार।


    क्या जांचें:

    1. अपना मासिक स्टेटमेंट देखें और जांचें कि क्या आपका औसत शेष ₹10000 रहा है।

    2. जांचें कि क्या आपके कार्ड का वार्षिक नवीनीकरण शुल्क कटने का समय हो गया है।

    3. अपने ATM लेनदेन की संख्या गिनें।


    समाधान:

    यदि आपको लगता है कि शुल्क गलत तरीके से लगाया गया है, तो हमें सूचित करें। हम लेनदेन
    की समीक्षा करेंगे। यदि त्रुटि पाई जाती है, तो हम राशि को वापस क्रेडिट करेंगे।
    गंभीर विसंगतियों के मामले में, हम मामले को तुरंत चार्जबैक और नियामक पथ पर भेजेंगे।'
  domain: retail_banking
  product_category: savings_regular
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 13b9f6ca-3409-5a3c-bdda-a7feaacc0a6d
  title: नियमित बचत खाता — आवश्यक दस्तावेज़
  body: 'नियमित बचत खाता खोलने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पहचान प्रमाण (Identity Proof): आधार कार्ड या पासपोर्ट (सत्यापित)।

    - पता प्रमाण (Address Proof): वर्तमान पते का वैध प्रमाण (आधार या उपयोगिता बिल)।

    - टैक्स पहचान: PAN कार्ड (अनिवार्य)।

    - फोटो: हाल ही की पासपोर्ट साइज तस्वीरें।


    परिणाम: यदि सभी दस्तावेज़ प्रदान किए जाते हैं और KYC सत्यापन सफल होता है, तो खाता
    तुरंत सक्रिय कर दिया जाएगा। दस्तावेजों की कमी होने पर आवेदन लंबित रखा जा सकता
    है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: f00d4219-614a-5a63-8c41-41d570ee3219
  title: नियमित बचत खाता — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'चंद्रिका बैंक का नियमित बचत खाता बाजार की अन्य पेशकशों की तुलना में पारदर्शिता
    और सुरक्षा पर केंद्रित है। जहाँ अन्य बैंक जटिल शुल्क संरचनाएं रख सकते हैं, हम
    ₹10000 के स्पष्ट MAB और ₹500 के सरल शुल्क का पालन करते हैं। हम 3.5% की प्रतिस्पर्धी
    ब्याज दर प्रदान करते हैं, जो बचत करने वाले परिवारों के लिए आकर्षक है।


    यह खाता उन लोगों के लिए बेहतर है जो कम कागजी कार्रवाई और स्पष्ट नियमों को प्राथमिकता
    देते हैं। यदि आप बहुत उच्च तरलता और सुरक्षित DICGC बीमा (₹5,00,000 तक) चाहते हैं,
    तो यह एक उत्कृष्ट विकल्प है।'
  domain: retail_banking
  product_category: savings_regular
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: b3be5ac7-4f33-5c75-8fe9-a565296b7c28
  title: नियमित बचत खाता — जोखिम प्रकटीकरण
  body: 'नियमित बचत खाता एक कम जोखिम वाला निवेश उत्पाद है, लेकिन ग्राहकों को निम्नलिखित
    बातों का ध्यान रखना चाहिए:


    1. ब्याज दर जोखिम: 3.5% की वार्षिक ब्याज दर परिवर्तनीय है और बैंक की नीतियों या
    नियामक परिवर्तनों के आधार पर बदल सकती है।

    2. शुल्क जोखिम: यदि खाते में ₹10000 का Monthly Average Balance (MAB) बनाए नहीं
    रखा जाता है, तो ₹500 का शुल्क लगाया जाएगा, जो प्रभावी रूप से आपकी वास्तविक आय
    को कम कर सकता है।

    3. जमा सुरक्षा: आपकी जमा राशि DICGC द्वारा ₹5,00,000 तक बीमित है। इस सीमा से अधिक
    की राशि नियामक सुरक्षा के दायरे से बाहर हो सकती है।


    हम केवल उत्पाद की विशेषताओं के बारे में शैक्षिक जानकारी प्रदान करते हैं; हम व्यक्तिगत
    टैक्स या कानूनी सलाह नहीं देते हैं। सभी उत्पाद अनुशंसाएं ग्राहक की पात्रता और
    बैंक की मानक शर्तों के आधार पर निष्पक्ष रूप से की जाती हैं।'
  domain: retail_banking
  product_category: savings_regular
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 1e33c4cc-5c95-58cc-82aa-d54b78dd44f8
  title: नियमित बचत खाता — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'नियमित बचत खाते के लिए ब्याज दरों की संरचना सरल और पारदर्शी है। इस खाते में
    सभी जमा राशि पर 3.5% की एक समान वार्षिक ब्याज दर लागू होती है, चाहे शेष राशि कितनी
    भी हो।


    ब्याज की गणना दैनिक उपलब्ध शेष के आधार पर की जाती है और इसे बैंक के निर्धारित
    चक्र के अनुसार खाते में जमा किया जाता है। ब्याज दरों में कोई श्रेणीबद्ध (tiered)
    अंतर नहीं है। दरों में कोई भी बदलाव RBI के दिशानिर्देशों और बैंक की आंतरिक मौद्रिक
    नीति के अधीन होगा, जिसकी सूचना ग्राहकों को समय पर दी जाएगी।'
  domain: retail_banking
  product_category: savings_regular
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 687ccac2-5d1e-5565-bcb5-dc770a2a1795
  title: नियमित बचत खाता — रेफरल और लॉयल्टी ऑफर
  body: चंद्रिका बैंक के साथ अपनी बचत की यात्रा शुरू करें! यदि आप हमारे नियमित बचत
    खाता में अपना खाता खोलते हैं और अपने किसी मित्र या परिवार के सदस्य को हमारे साथ
    जुड़ने के लिए रेफर करते हैं, तो आप विशेष लॉयल्टी लाभ प्राप्त कर सकते हैं। यह ऑफर
    1 अप्रैल 2024 से 30 सितंबर 2024 तक मान्य है। सफल रेफरल के बाद, आपके खाते में ₹500
    का एकमुश्त बोनस जमा किया जाएगा। यह हमारे उन ग्राहकों के लिए एक छोटा सा धन्यवाद
    है जो चंद्रिका बैंक के भरोसेमंद परिवार को बढ़ाने में हमारी मदद करते हैं।
  domain: retail_banking
  product_category: savings_regular
  document_type: promo_notice
  source_authority: official
  placeholder: true
