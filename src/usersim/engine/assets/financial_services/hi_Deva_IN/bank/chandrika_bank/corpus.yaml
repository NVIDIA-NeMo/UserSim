- id: 134c39aa-6cab-5d57-bedf-a8cf3c1c564b
  title: 1-वर्षीय सावधि जमा (FD) — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ 1-वर्षीय सावधि जमा (FD) की शर्तों में संशोधन की प्रक्रिया को
    परिभाषित करता है। चंद्रिका बैंक को नियामक परिवर्तनों या परिचालन आवश्यकताओं के
    कारण ब्याज दरों या शुल्क संरचना में बदलाव करने का अधिकार है।


    मुख्य शर्तें:

    1. ब्याज दर: वर्तमान दर 7.1% है, जिसे बैंक पूर्व सूचना के साथ बदल सकता है।

    2. अवधि: इस उत्पाद की निश्चित अवधि 12 महीने है।

    3. दंड: यदि ग्राहक परिपक्वता से पहले राशि निकालता है, तो 1% का समयपूर्व निकासी
    दंड लागू होगा।

    4. न्यूनतम सीमा: खाते को बनाए रखने के लिए न्यूनतम ₹10,000 का जमा अनिवार्य है।


    किसी भी बदलाव की सूचना ग्राहकों को उनके पंजीकृत मोबाइल नंबर या ईमेल के माध्यम
    से दी जाएगी। यह समझौता RBI के दिशानिर्देशों के अधीन है। विस्तृत नियमों के लिए
    1-वर्षीय सावधि जमा (FD) — खाता अनुबंध देखें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: terms_conditions
  source_authority: official
