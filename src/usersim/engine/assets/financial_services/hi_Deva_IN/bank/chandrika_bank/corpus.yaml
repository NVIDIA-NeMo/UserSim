- id: f3d24c0f-1de3-5f45-9ed7-1595b5c44175
  title: 1-वर्षीय सावधि जमा (FD) — विकल्पों से तुलना और कब न चुनें
  body: '1-वर्षीय सावधि जमा (FD) उन ग्राहकों के लिए आदर्श है जो कम जोखिम में स्थिर
    रिटर्न चाहते हैं। इसकी तुलना अन्य विकल्पों से यहाँ दी गई है:


    - बनाम नियमित बचत खाता: बचत खाते में तरलता अधिक होती है, लेकिन 1-वर्षीय सावधि
    जमा (FD) की 7.1% ब्याज दर आमतौर पर अधिक होती है।

    - बनाम आवर्ती जमा (RD): RD मासिक निवेश के लिए है, जबकि FD के लिए एकमुश्त न्यूनतम
    ₹10,000 की आवश्यकता होती है।


    आपको 1-वर्षीय सावधि जमा (FD) नहीं चुनना चाहिए यदि:

    1. आपको आने वाले 12 महीनों के भीतर अपनी धनराशि की आवश्यकता होने की संभावना है,
    क्योंकि समय-पूर्व निकासी पर 1% का दंड लगता है।

    2. आपके पास निवेश के लिए न्यूनतम ₹10,000 की राशि उपलब्ध नहीं है।

    3. आप बहुत उच्च जोखिम वाले निवेशों के माध्यम से अस्थिर लेकिन संभावित रूप से अधिक
    रिटर्न की तलाश में हैं।


    हम केवल शैक्षिक जानकारी प्रदान करते हैं और व्यक्तिगत वित्तीय सलाह नहीं देते हैं।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 9033aa5d-f407-5b22-882a-dc5d30ec8651
  title: 1-वर्षीय सावधि जमा (FD) — समय-पूर्व निकासी पर जुर्माना की व्याख्या
  body: 'प्रश्न: यदि मैं अपनी 1-वर्षीय सावधि जमा (FD) को 12 महीने से पहले बंद करता
    हूँ, तो क्या कोई शुल्क लगेगा?

    उत्तर: हाँ, यदि आप अपनी FD को उसकी परिपक्वता अवधि से पहले तोड़ते हैं, तो इसे ''समयपूर्व
    निकासी'' माना जाता है और इस पर 1% का समय-पूर्व निकासी दंड लगाया जाता है।


    प्रश्न: यह जुर्माना कैसे लागू होता है?

    उत्तर: यह जुर्माना लागू ब्याज दर से घटाया जाता है, जिससे आपकी कुल प्राप्त राशि
    कम हो जाती है। विवरण के लिए 1-वर्षीय सावधि जमा (FD) — शुल्क अनुसूची देखें।'
  domain: retail_banking
  product_category: fixed_deposit_1yr
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: chandrika_bank
- id: 2f420f49-6a36-5f59-9640-a2b83a69dd34
  title: 1-वर्षीय सावधि जमा (FD) — एक सामान्य अनुरोध का पूर्ण समाधान
  body: '1-वर्षीय सावधि जमा (FD) खोलने के एक सामान्य अनुरोध को पूरा करने के लिए इन
    चरणों का पालन करें:


    1. हमें सूचित करें कि आप 1-वर्षीय सावधि जमा (FD) खोलना चाहते हैं और वह राशि बताएं
    जिसे आप निवेश करना चाहते हैं (न्यूनतम ₹10,000)।

    2. हम आपके PAN और आधार का उपयोग करके KYC सत्यापन प्रक्रिया पूरी करेंगे।

    3. हम आपसे पुष्टि करेंगे कि आप 12 महीने की अवधि और 7.1% की ब्याज दर (वरिष्ठ नागरिकों
    के लिए अतिरिक्त 0.5% जोड़कर) से सहमत हैं।

    4. हम आपके द्वारा निर्दिष्ट बचत खाते से निवेश राशि डेबिट करेंगे।

    5. प्रक्रिया पूरी होने पर, हम आपको एक डिजिटल FD रसीद प्रदान करेंगे जिसमें आपकी
    जमा राशि, ब्याज दर और परिपक्वता तिथि का विवरण होगा।


    जब आपको रसीद प्राप्त हो जाए और आपके खाते से राशि कट जाए, तो आपका अनुरोध सफलतापूर्वक
    पूर्ण हो गया है।'
