- id: c85ce4fd-573d-5ad2-80e0-64634dbc0159
  title: 1-वर्षीय सावधि जमा (FD) — रेफरल और लॉयल्टी ऑफर
  body: चंद्रिका बैंक के साथ अपनी बचत बढ़ाएं! यदि आप हमारे मौजूदा ग्राहक हैं, तो अपने
    मित्रों या परिवार के सदस्यों को 1-वर्षीय सावधि जमा (FD) के लिए रेफर करें। यह ऑफर
    1 अगस्त 2024 से 31 दिसंबर 2024 तक वैध है। सफल रेफरल पर, रेफर करने वाले और नए ग्राहक
    दोनों को ₹500 का लॉयल्टी बोनस दिया जाएगा। नए ग्राहक को इस योजना का लाभ उठाने के
    लिए न्यूनतम ₹10,000 जमा करने होंगे और 12 महीने की अवधि पूरी करनी होगी।
