- id: 328279a6-c63a-5ceb-a211-13e8cfc2b566
  title: चंद्रिका एवरीडे क्रेडिट कार्ड — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'चंद्रिका एवरीडे क्रेडिट कार्ड उन मध्यम वर्गीय परिवारों और व्यक्तियों के लिए
    डिज़ाइन किया गया है जो अपने दैनिक खर्चों के लिए एक सरल और पारदर्शी क्रेडिट सुविधा
    चाहते हैं। यह कार्ड विशेष रूप से उन लोगों के लिए उपयुक्त है जो अनुशासन के साथ
    खर्च करते हैं और डिजिटल भुगतान के माध्यम से रिवॉर्ड्स अर्जित करना चाहते हैं।


    मुख्य विशेषताएं और शुल्क:

    - जॉइनिंग शुल्क: ₹500

    - वार्षिक शुल्क: ₹500

    - वार्षिक शुल्क माफी: वर्ष में ₹1,50,000 या उससे अधिक खर्च करने पर शुल्क माफ किया
    जाता है।

    - रिवॉर्ड दर: प्रत्येक पात्र खर्च पर 1% रिवॉर्ड।

    - वित्त प्रभार: बकाया राशि पर 3.5% मासिक (42% वार्षिक) ब्याज।


    सामान्य उपयोग: इसका उपयोग किराना, उपयोगिता बिलों के भुगतान और दैनिक खरीदारी के
    लिए किया जा सकता है। यह उन ग्राहकों के लिए आदर्श है जो समय पर भुगतान करके ब्याज
    लागत से बचना चाहते हैं और अपनी खर्च करने की आदतों के आधार पर वार्षिक शुल्क की
    छूट प्राप्त करना चाहते हैं।'
  domain: cards
  product_category: chandrika_credit_card
