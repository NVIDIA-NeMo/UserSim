  institution_id: abhaya_insurance
- id: 61357147-8d89-5ec3-898d-18105d600400
  title: ULIP वेल्थ प्लान — नियामक प्रकटीकरण
  body: 'अभय इंश्योरेंस IRDAI के सभी नियमों का सख्ती से पालन करता है। ULIP वेल्थ प्लान
    के संबंध में निम्नलिखित प्रकटीकरण अनिवार्य हैं:


    1. लॉक-इन अवधि: इस पॉलिसी में 5 वर्ष की लॉक-इन अवधि है, जिसके दौरान फंड नहीं निकाला
    जा सकता।

    2. शुल्क प्रकटीकरण: हम 3% का प्रीमियम आवंटन शुल्क और 1.35% का फंड प्रबंधन शुल्क
    लेते हैं।

    3. फ्री-लुक अवधि: पॉलिसी दस्तावेज़ प्राप्त होने के बाद, ग्राहक शर्तों से असहमत
    होने पर इसे रद्द कर सकते हैं।

    4. डेटा गोपनीयता: ग्राहक डेटा की गोपनीयता हमारी सर्वोच्च प्राथमिकता है।


    हम धोखाधड़ी के प्रति शून्य-सहनशीलता की नीति अपनाते हैं और सभी दावों की निष्पक्ष
    जांच करते हैं। किसी भी विवाद का समाधान निर्धारित समय सीमा के भीतर किया जाता है।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। हमारे सुझाव उत्पाद विवरणों
    पर आधारित होते हैं, जिन्हें निवेश के रूप में नहीं बल्कि सुरक्षा के रूप में देखा
    जाना चाहिए।'
