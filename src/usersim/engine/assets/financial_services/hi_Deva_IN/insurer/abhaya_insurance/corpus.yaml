- id: b9bed68e-164e-5651-a61e-31dd23b80b4e
  title: update_policy का उपयोग कब करें
  body: 'पॉलिसी की शर्तों में बदलाव, कवरेज राशि में वृद्धि, या अन्य विवरणों के संशोधन
    के लिए update_policy का उपयोग किया जाता है। यह तब आवश्यक होता है जब ग्राहक की
    सुरक्षा आवश्यकताएं बदलती हैं, जैसे कि ''ULIP वेल्थ प्लान'' में निवेश विकल्पों
    को बदलना या ''परिवार स्वास्थ्य बीमा'' में नए सदस्यों को जोड़ना। हम यह सुनिश्चित
    करते हैं कि सभी बदलाव नैतिक अंडरराइटिंग के माध्यम से हों।


    **कार्यवाही के चरण:**

    1. `verify_identity` का उपयोग करके ग्राहक की पहचान सत्यापित करें।

    2. `get_accounts` के माध्यम से वर्तमान पॉलिसी विवरण प्राप्त करें।

    3. ग्राहक से अपेक्षित बदलावों की विस्तृत जानकारी लें।

    4. यदि बदलाव के लिए अतिरिक्त प्रीमियम की आवश्यकता है, तो उसकी गणना करें और ग्राहक
    को सूचित करें।

    5. पॉलिसी में संशोधन लागू करने के लिए `update_policy` टूल को कॉल करें।


    सभी बदलाव IRDAI के दिशा-निर्देशों और पॉलिसी दस्तावेज़ की शर्तों के अनुसार किए
    जाते हैं।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: abhaya_insurance
- id: cceb4b64-32da-5b81-aac8-c22165a22cdd
  title: update_policy टूल संदर्भ
  body: 'update_policy टूल का उपयोग मौजूदा बीमा पॉलिसी के विवरणों में संशोधन करने
    के लिए किया जाता है। एजेंट इस टूल को सीधे कॉल करके ग्राहक की पॉलिसी में बदलाव
    कर सकते हैं, जिससे ग्राहक को किसी बाहरी पोर्टल पर जाने की आवश्यकता नहीं होती।


    **टूल हस्ताक्षर और तर्क:**

    - `policy_id` (अनिवार्य): उस पॉलिसी की विशिष्ट पहचान संख्या जिसे अपडेट किया जाना
    है।

    - `update_fields` (अनिवार्य): उन क्षेत्रों की सूची जिन्हें बदला जाना है (जैसे
    कि कवर राशि या अन्य विवरण)।


    **प्रभाव:** यह टूल पॉलिसी के रिकॉर्ड को वास्तविक समय में अपडेट करता है। किसी भी
    बदलाव से पहले बहु-स्तरीय पहचान सत्यापन अनिवार्य है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_policy
  institution_id: abhaya_insurance
