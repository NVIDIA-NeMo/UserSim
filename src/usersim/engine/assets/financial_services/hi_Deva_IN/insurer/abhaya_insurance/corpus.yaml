  institution_id: abhaya_insurance
- id: ea2f1983-7c16-527c-8564-52cb23ab19b3
  title: मोटर ओन-डैमेज कवर — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ मोटर ओन-डैमेज कवर की शर्तों में संशोधन की प्रक्रिया को परिभाषित
    करता है।


    1. शुल्क और प्रीमियम: हम ₹7500 के वार्षिक प्रीमियम और ₹1000 की अनिवार्य कटौती
    योग्य राशि (Compulsory Deductible) में बदलाव का अधिकार सुरक्षित रखते हैं। किसी
    भी बदलाव की सूचना ग्राहकों को 30 दिन पहले दी जाएगी।

    2. लाभ संशोधन: पहले वर्ष के लिए 20% नो-क्लेम बोनस (NCB) की गणना और पात्रता शर्तें
    कंपनी की अंडरराइटिंग नीति के अधीन हैं।

    3. दावा प्रक्रिया: हम 30 दिनों की दावा निपटान अवधि बनाए रखने के लिए प्रतिबद्ध
    हैं। यदि नियामक कारणों से इसमें परिवर्तन होता है, तो हम पारदर्शी तरीके से इसकी
    सूचना देंगे।

    4. अनुबंध की समाप्ति: ग्राहक फ्री-लुक अवधि के दौरान शर्तों से असहमत होने पर पॉलिसी
    रद्द कर सकते हैं।


    सभी बदलाव IRDAI के नियमों के अनुसार किए जाएंगे और लिखित रूप में सूचित किए जाएंगे।'
  domain: insurance
  product_category: motor_own_damage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 49e965ad-c32a-5d29-bc0d-0605a7c99546
  title: मोटर ओन-डैमेज कवर — शुरुआत कैसे करें
  body: 'सहायता एजेंटों के लिए मार्गदर्शिका: मोटर ओन-डैमेज कवर एक व्यापक सुरक्षा प्लान
    है। ग्राहक को ऑनबोर्ड करते समय निम्नलिखित मुख्य विवरण साझा करें:


    - वार्षिक प्रीमियम: ₹7500

    - अनिवार्य कटौती योग्य राशि: ₹1000 (यह वह राशि है जो प्रत्येक दावे के समय ग्राहक
    द्वारा वहन की जाएगी)।

    - पहले वर्ष का नो-क्लेम बोनस: 20% (यदि पॉलिसी अवधि के दौरान कोई दावा नहीं किया
    जाता है)।

    - दावा निपटान समय: हम दावे की सूचना से निपटान तक अधिकतम 30 दिनों की समय सीमा का
    पालन करते हैं।


    शुरुआत करने के लिए, ग्राहक के वाहन का विवरण और नामांकित व्यक्ति (Nominee) की अनिवार्य
    जानकारी एकत्र करें। सुनिश्चित करें कि ग्राहक ने सभी बहिष्करणों (Exclusions) और
    प्रतीक्षा अवधि को समझ लिया है। एक बार सत्यापन पूरा हो जाने पर, पॉलिसी दस्तावेज़
    जारी किया जाएगा, जिसके बाद फ्री-लुक अवधि शुरू होगी।'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 998cc4da-2235-5bcf-b878-14e4beeeb1b5
  title: मोटर ओन-डैमेज कवर — पहले वर्ष का नो-क्लेम बोनस की व्याख्या
  body: 'प्रश्न: पहले वर्ष का नो-क्लेम बोनस (NCB) क्या है और यह कैसे काम करता है?

    उत्तर: मोटर ओन-डैमेज कवर के तहत, यदि आप पॉलिसी के पहले वर्ष में कोई दावा नहीं
    करते हैं, तो हम आपको 20% का नो-क्लेम बोनस प्रदान करते हैं। यह आपकी सुरक्षित ड्राइविंग
    के लिए एक प्रोत्साहन है जो अगले प्रीमियम पर लाभ के रूप में मिलता है।


    प्रश्न: क्या यह बोनस हर साल मिलता है?

    उत्तर: हाँ, यह आपकी दावा-मुक्त अवधि पर निर्भर करता है। विस्तृत विवरण के लिए ''मोटर
    ओन-डैमेज कवर — शुल्क अनुसूची'' देखें।'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 2a2e440f-1758-5677-a705-1940c80e228d
  title: मोटर ओन-डैमेज कवर — बदलाव या अद्यतन करना
  body: 'अपनी पॉलिसी में विवरण बदलने के लिए इन चरणों का पालन करें:


    1. हमें वह जानकारी प्रदान करें जिसे आप अपडेट करना चाहते हैं (जैसे वाहन का पंजीकरण
    नंबर या संपर्क विवरण)।

    2. यदि आप नामांकित व्यक्ति (Nominee) बदलना चाहते हैं, तो नए नामांकित व्यक्ति का
    पूरा नाम और आपसे उनका संबंध स्पष्ट करें।

    3. हम आपसे आपकी पहचान सत्यापित करने के लिए ओटीपी (OTP) या बायोमेट्रिक प्रमाणीकरण
    की मांग करेंगे।

    4. सत्यापन सफल होने के बाद, हम आपके अनुरोध को प्रोसेस करेंगे और अपडेट किए गए विवरणों
    की पुष्टि करेंगे।

    5. आपको एक संशोधित पॉलिसी दस्तावेज़ या पुष्टिकरण ईमेल प्राप्त होगा, जिससे यह सुनिश्चित
    होगा कि बदलाव प्रभावी हो गए हैं।


    कृपया ध्यान दें कि कुछ बदलावों के कारण आपके ₹7500 के वार्षिक प्रीमियम में परिवर्तन
    हो सकता है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8f91a97b-3d74-509f-8ebf-ee7c698d43a0
  title: मोटर ओन-डैमेज कवर — एक्सेस या लॉगिन समस्याएँ
  body: 'लक्षण: ग्राहक को अपने पॉलिसी विवरण देखने या लॉगिन करने में कठिनाई हो रही
    है।


    संभावित कारण:

    - गलत क्रेडेंशियल्स या पुराना पासवर्ड।

    - पहचान सत्यापन (OTP/Biometric) की विफलता।

    - खाता निष्क्रियता।


    समाधान प्रक्रिया:

    1. सबसे पहले यह जाँचें कि क्या आप सही पंजीकृत मोबाइल नंबर या ईमेल का उपयोग कर
    रहे हैं।

    2. यदि ओटीपी प्राप्त नहीं हो रहा है, तो नेटवर्क कनेक्शन की जाँच करें और पुनः प्रयास
    करें।

    3. यदि समस्या बनी रहती है, तो हमें पासवर्ड रीसेट करने का अनुरोध करें। हम बहु-स्तरीय
    सत्यापन के बाद एक नया एक्सेस लिंक प्रदान करेंगे।


    एस्केलेशन: यदि लॉगिन समस्या 24 घंटों के भीतर हल नहीं होती है, तो हम मामले को आंतरिक
    तकनीकी टीम को भेजेंगे। आपको एक टिकट नंबर प्राप्त होगा और समाधान की सूचना ईमेल
    के माध्यम से दी जाएगी।'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 759c0ed2-04d6-5e3f-ac42-6d1ea8796e4b
  title: मोटर ओन-डैमेज कवर — पात्रता श्रेणियाँ
  body: 'मोटर ओन-डैमेज कवर के लिए पात्रता मानदंड निम्नलिखित हैं:


    | श्रेणी | शर्त | परिणाम |

    | :--- | :--- | :--- |

    | व्यक्तिगत वाहन स्वामी | वैध आरसी और ड्राइविंग लाइसेंस | पात्र (प्रीमियम ₹7500)
    |

    | वाणिज्यिक वाहन | व्यावसायिक परमिट और फिटनेस प्रमाण पत्र | विशेष मूल्यांकन के
    अधीन |

    | पुराने वाहन | वाहन की आयु < 15 वर्ष | पात्र (सत्यापित मूल्य पर) |

    | नए वाहन | शून्य-डेप्रिसिएशन विकल्प के साथ | पात्र |


    सभी आवेदकों के लिए नामांकित व्यक्ति (Nominee) की जानकारी अनिवार्य है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: b9c05ff7-b368-5583-b83e-704eb1d93f6c
  title: मोटर ओन-डैमेज कवर — श्रेणियों या विकल्पों में से चुनाव
  body: 'यदि आप सुरक्षा विकल्पों के बीच चयन कर रहे हैं, तो मोटर ओन-डैमेज कवर उन लोगों
    के लिए सबसे उपयुक्त है जो अपने वाहन की क्षति के लिए एक पारदर्शी और निश्चित लागत
    वाला प्लान चाहते हैं।


    इस प्लान की मुख्य विशेषताएं ₹7500 का वार्षिक प्रीमियम, ₹1000 की अनिवार्य कटौती
    योग्य राशि और पहले वर्ष के लिए 20% नो-क्लेम बोनस हैं।


    तुलना:

    - यदि आप केवल कानूनी आवश्यकताओं को पूरा करना चाहते हैं, तो थर्ड-पार्टी कवर पर्याप्त
    हो सकता है।

    - यदि आप व्यापक सुरक्षा और त्वरित दावा निपटान (30 दिन) चाहते हैं, तो हमारा मोटर
    ओन-डैमेज कवर एक बेहतर विकल्प है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0e525c9b-4bad-5f2d-9a2c-39870ee5a588
  title: मोटर ओन-डैमेज कवर — गोपनीयता और डेटा प्रबंधन
  body: 'अभय इंश्योरेंस आपके डेटा की गोपनीयता और सुरक्षा को सर्वोच्च प्राथमिकता देता
    है। मोटर ओन-डैमेज कवर के तहत एकत्रित की गई सभी जानकारी, जिसमें वाहन विवरण, व्यक्तिगत
    पहचान और नामांकित व्यक्ति (Nominee) का डेटा शामिल है, IRDAI के नियमों के अनुसार
    प्रबंधित की जाती है।


    हम संवेदनशील जानकारी साझा करने से पहले अनिवार्य रूप से बहु-स्तरीय पहचान सत्यापन,
    जैसे बायोमेट्रिक या ओटीपी (OTP) प्रमाणीकरण का उपयोग करते हैं। आपका डेटा केवल दावा
    निपटान (जिसकी अवधि 30 दिन है), प्रीमियम गणना (वार्षिक ₹7500) और नियामक रिपोर्टिंग
    के उद्देश्यों के लिए उपयोग किया जाता है।


    हमारा वादा है कि हम आपकी जानकारी को किसी भी अनधिकृत तीसरे पक्ष के साथ साझा नहीं
    करेंगे, सिवाय उन कानूनी मामलों के जहां नियामक अधिकारियों द्वारा इसकी मांग की गई
    हो।'
  domain: insurance
  product_category: motor_own_damage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 4ac64e64-b343-5074-883c-f7aa3ce6177e
  title: मोटर ओन-डैमेज कवर — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'हम अपने ग्राहकों को मोटर ओन-डैमेज कवर से संबंधित धोखाधड़ी के प्रति सतर्क
    करना चाहते हैं। अक्सर स्कैमर्स फर्जी ''त्वरित क्लेम सेटलमेंट'' या ''प्रीमियम रिफंड''
    का लालच देकर आपकी व्यक्तिगत जानकारी चुराने की कोशिश करते हैं।


    सावधान रहें यदि कोई व्यक्ति आपसे निम्नलिखित की मांग करता है:

    1. आपके बैंक खाते का ओटीपी (OTP) या बायोमेट्रिक डेटा किसी अनौपचारिक कॉल पर।

    2. पॉलिसी नवीनीकरण के नाम पर किसी व्यक्तिगत खाते में पैसे ट्रांसफर करने का अनुरोध।

    3. आपके संवेदनशील दस्तावेज़ों की मांग, जो हमारी आधिकारिक सत्यापन प्रक्रिया का
    हिस्सा नहीं हैं।


    हम स्पष्ट करना चाहते हैं कि अभय इंश्योरेंस कभी भी आपसे आपका पासवर्ड या पिन नहीं
    मांगेगा। किसी भी संदिग्ध गतिविधि की स्थिति में, तुरंत हमें सूचित करें। हम धोखाधड़ी
    के प्रति शून्य-सहनशीलता की नीति अपनाते हैं। यदि आपको कोई संदिग्ध ईमेल या संदेश
    मिलता है, तो उस पर क्लिक न करें।


    ***

    **कानूनी डिस्क्लेमर:** यह सुरक्षा सलाह केवल जानकारी के लिए है। हम व्यक्तिगत कानूनी
    सलाहकार के रूप में कार्य नहीं करते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8c3ecaca-b422-5093-ba2a-9544bc997c48
  title: मोटर ओन-डैमेज कवर — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'एक सपोर्ट एजेंट के रूप में, ग्राहक को मोटर ओन-डैमेज कवर की सीमाओं के बारे
    में स्पष्ट रूप से सूचित करना आवश्यक है ताकि भविष्य में विवाद न हों।


    **मुख्य सीमाएं और शुल्क:**

    - **अनिवार्य कटौती योग्य राशि (Compulsory Deductible):** प्रत्येक दावे के लिए
    ₹1000 की अनिवार्य कटौती लागू होती है, जिसे पॉलिसीधारक को वहन करना होगा।

    - **बहिष्करण (Exclusions):** उन विशिष्ट स्थितियों या घटनाओं के लिए दावा भुगतान
    नहीं किया जाता है जो पॉलिसी दस्तावेज़ में ''बहिष्करण'' के रूप में सूचीबद्ध हैं
    (जैसे कि नशे की स्थिति में ड्राइविंग या बिना वैध लाइसेंस के वाहन चलाना)।

    - **प्रतीक्षा अवधि (Waiting Period):** कुछ विशिष्ट संशोधनों या ऐड-ऑन के लिए प्रतीक्षा
    अवधि लागू हो सकती है।


    **महत्वपूर्ण निर्देश:**

    हम IRDAI के नियमों का सख्ती से पालन करते हैं। सुनिश्चित करें कि ग्राहक ने पॉलिसी
    दस्तावेज़ प्राप्त करने के बाद अपनी ''फ्री-लुक अवधि'' का उपयोग कर लिया है यदि वे
    इन शर्तों से असहमत हैं।


    ***

    **कानूनी डिस्क्लेमर:** हमारे सुझाव उत्पाद विवरणों पर आधारित होते हैं, जिन्हें
    सुरक्षा के रूप में देखा जाना चाहिए, न कि निवेश के रूप में।'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
