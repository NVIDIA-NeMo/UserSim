- id: abcfdd53-925b-5d47-ae8f-83b30f96eecb
  title: अभय टर्म लाइफ कवर — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'एक सहायता एजेंट के रूप में, ग्राहकों को अभय टर्म लाइफ कवर की सीमाओं के बारे
    में स्पष्ट करना आपकी जिम्मेदारी है। यह उत्पाद शुद्ध सुरक्षा प्रदान करता है, जिसका
    अर्थ है कि यह केवल मृत्यु की स्थिति में ₹10000000 की बीमित राशि का भुगतान करता
    है; इसमें कोई परिपक्वता लाभ (maturity benefit) नहीं है।


    मुख्य प्रतिबंध और अपवाद:

    1. आत्महत्या: पॉलिसी शुरू होने के एक निश्चित समय (पॉलिसी दस्तावेज़ के अनुसार)
    के भीतर आत्महत्या करने पर दावा देय नहीं होता है।

    2. पूर्व-मौजूदा बीमारियाँ: यदि आवेदन के समय किसी बीमारी को छिपाया गया है, तो दावा
    खारिज किया जा सकता है।

    3. खतरनाक गतिविधियाँ: गैर-मानक जोखिम वाली गतिविधियों में शामिल होने पर कवर सीमित
    हो सकता है।


    यह उत्पाद 30 वर्ष की पॉलिसी अवधि के लिए डिज़ाइन किया गया है। किसी भी दावे के निपटान
    से पहले हम निष्पक्ष जांच करते हैं ताकि धोखाधड़ी को रोका जा सके।


    ***

    कानूनी डिस्क्लेमर: सभी बहिष्करण और शर्तें पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखी
    गई हैं। हम केवल सुरक्षा प्रदान करते हैं, निवेश नहीं।'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 235e3217-734e-5c6b-ab51-da6525f62cbe
  title: अभय टर्म लाइफ कवर — फ्री-लुक अवधि (दिन) की व्याख्या
  body: 'प्रश्न: फ्री-लुक अवधि क्या है और अभय टर्म लाइफ कवर में यह कितने समय की होती
    है?

    उत्तर: फ्री-लुक अवधि वह समय है जब ग्राहक पॉलिसी दस्तावेज़ प्राप्त करने के बाद
    उसकी शर्तों की समीक्षा कर सकता है। यदि आप शर्तों से असहमत हैं, तो आप इस अवधि के
    भीतर पॉलिसी रद्द कर सकते हैं। अभय टर्म लाइफ कवर के लिए यह अवधि 15 दिन है।


    प्रश्न: क्या इस अवधि में पॉलिसी रद्द करने पर प्रीमियम वापस मिलता है?

    उत्तर: हाँ, नियमानुसार प्रशासनिक शुल्क और चिकित्सा व्यय काटकर शेष प्रीमियम वापस
    कर दिया जाता है। अधिक जानकारी के लिए अभय टर्म लाइफ कवर — नियामक प्रकटीकरण देखें।'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ed7629ef-3958-5a2c-b05d-f4623c13db0b
  title: अभय टर्म लाइफ कवर — स्थिति या इतिहास देखना
  body: 'अपनी पॉलिसी की वर्तमान स्थिति और भुगतान इतिहास देखने के लिए इन चरणों का पालन
    करें:


    1. अपनी पॉलिसी संख्या और पहचान विवरण प्रदान करें ताकि हम आपका बहु-स्तरीय पहचान
    सत्यापन कर सकें।

    2. हमसे अपनी ''पॉलिसी स्थिति'' (Policy Status) और ''प्रीमियम भुगतान इतिहास'' (Premium
    Payment History) देखने का अनुरोध करें।

    3. हम आपको आपकी वर्तमान स्थिति की पुष्टि करेंगे, जिसमें यह स्पष्ट होगा कि आपका
    ₹12000 का वार्षिक प्रीमियम भुगतान अपडेट है या नहीं।

    4. यदि आपकी पॉलिसी की अवधि (30 वर्ष) के संबंध में कोई विवरण चाहिए, तो हम आपको
    उसका पूरा विवरण प्रदान करेंगे।

    5. अंत में, हम आपको आपके नामांकित व्यक्ति (Nominee) के विवरण की पुष्टि करेंगे
    ताकि आप सुनिश्चित कर सकें कि रिकॉर्ड सही हैं।


    एक बार जब हम विवरण साझा कर देते हैं, तो आप पुष्टि कर सकते हैं कि जानकारी आपकी
    अपेक्षा के अनुरूप है।'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
