- id: a81f3c0e-5c9a-56cf-b582-d36010a1a237
  title: set_alerts का उपयोग कब करें
  body: 'हम अपने ग्राहकों को उनकी पॉलिसियों के प्रति जागरूक रखने के लिए अलर्ट सेवा
    प्रदान करते हैं। set_alerts का उपयोग तब किया जाता है जब ग्राहक प्रीमियम भुगतान
    की देय तारीखों, पॉलिसी नवीनीकरण की समय सीमा, या दावों की स्थिति में बदलाव के लिए
    सूचनाएं प्राप्त करना चाहता हो। यह सुविधा मानसिक शांति सुनिश्चित करती है ताकि कोई
    भी महत्वपूर्ण समय सीमा न छूटे।


    **कार्यवाही के चरण:**

    1. सबसे पहले `verify_identity` के माध्यम से ग्राहक की पहचान सुनिश्चित करें।

    2. `get_accounts` का उपयोग करके संबंधित पॉलिसी आईडी प्राप्त करें।

    3. ग्राहक से पूछें कि वे किस प्रकार के अलर्ट (जैसे ईमेल, एसएमएस) और किन घटनाओं
    के लिए सूचनाएं चाहते हैं।

    4. इन प्राथमिकताओं को सक्रिय करने के लिए `set_alerts` टूल का उपयोग करें।


    यह प्रक्रिया ग्राहकों को उनकी सुरक्षा और निवेश के प्रति अपडेट रखती है।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: abhaya_insurance
- id: 668e4fff-747b-5815-bdac-73507e36ec51
  title: set_alerts टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के लिए विशिष्ट अधिसूचनाएं और अलर्ट सेट करने की अनुमति
    देता है। एजेंट इस क्रिया को सीधे set_alerts टूल को कॉल करके निष्पादित करता है।


    **सिग्नेचर:** `set_alerts(account_id: string, alert_preferences: object)`

    **तर्क (Args):**

    - `account_id`: उस पॉलिसी खाते की आईडी जिसके लिए अलर्ट सेट किए जाने हैं।

    - `alert_preferences`: अलर्ट के प्रकार (जैसे प्रीमियम रिमाइंडर, क्लेम अपडेट) और
    संचार माध्यम का विवरण।

    **प्रभाव:** ग्राहक के खाते पर विशिष्ट ट्रिगर्स के लिए सूचनाएं सक्रिय हो जाती हैं।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - set_alerts
  institution_id: abhaya_insurance
- id: 79030feb-2a65-52bb-a788-d96c86b187ee
  title: file_claim का उपयोग कब करें
  body: 'जब पॉलिसी के तहत कवर की गई कोई घटना घटित होती है, तो ग्राहक बीमा राशि प्राप्त
    करने के लिए दावा दायर करता है। file_claim का उपयोग ''अभय टर्म लाइफ कवर'', ''परिवार
    स्वास्थ्य बीमा'' या ''मोटर ओन-डैमेज कवर'' जैसी पॉलिसियों के लिए किया जाता है।
    हम धोखाधड़ी के प्रति शून्य-सहनशीलता की नीति अपनाते हैं और सभी दावों की निष्पक्ष
    जांच करते हैं।


    **कार्यवाही के चरण:**

    1. सुरक्षा प्रोटोकॉल के तहत `verify_identity` का उपयोग करके ग्राहक या नामांकित
    व्यक्ति की पहचान सत्यापित करें।

    2. `get_accounts` के माध्यम से संबंधित पॉलिसी आईडी की पुष्टि करें।

    3. घटना का विवरण, तिथि और आवश्यक दस्तावेज़ एकत्र करें।

    4. आधिकारिक दावा प्रक्रिया शुरू करने के लिए `file_claim` टूल को कॉल करें।


    विवादों का समाधान निर्धारित समय सीमा के भीतर किया जाता है।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - file_claim
  institution_id: abhaya_insurance
- id: de2d0a5c-f24a-5706-abca-8c22f9790d36
  title: file_claim टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक की ओर से औपचारिक दावा आवेदन प्रस्तुत करने की अनुमति
    देता है। एजेंट इस प्रक्रिया को सीधे file_claim टूल को कॉल करके पूरा करता है।


    **सिग्नेचर:** `file_claim(account_id: string, claim_details: object)`

    **तर्क (Args):**

    - `account_id`: वह पॉलिसी आईडी जिसके तहत दावा किया जा रहा है।

    - `claim_details`: घटना का प्रकार, तिथि, दावा राशि और संलग्न दस्तावेज़ों की सूची।

    **प्रभाव:** यह सिस्टम में एक नया दावा केस बनाता है और इसे जांच के लिए अंडरराइटिंग
    टीम को भेजता है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
