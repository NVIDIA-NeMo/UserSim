- id: c743fcca-ba96-5860-961f-ffc6e0e0da7b
  title: परिवार स्वास्थ्य बीमा — खाता अनुबंध
  body: 'यह अनुबंध अभय इंश्योरेंस और पॉलिसीधारक के बीच के संबंधों को परिभाषित करता
    है।


    1. कवरेज और सीमाएँ: हम ₹500,000 की कुल बीमा राशि प्रदान करते हैं। अस्पताल में
    भर्ती होने पर, कमरे के किराये की सीमा कुल बीमा राशि के 1% तक सीमित है।

    2. प्रीमियम भुगतान: पॉलिसी को सक्रिय रखने के लिए ₹9,500 का वार्षिक प्रीमियम समय
    पर भुगतान करना अनिवार्य है।

    3. प्रतीक्षा अवधि: पॉलिसी शुरू होने के बाद 30 दिनों की प्रारंभिक प्रतीक्षा अवधि
    लागू होती है। पूर्व-मौजूद बीमारियों के लिए, कवर शुरू होने से पहले 36 महीनों की
    प्रतीक्षा अवधि अनिवार्य है।

    4. रद्दीकरण: ग्राहक पॉलिसी दस्तावेज़ प्राप्त करने के बाद ''फ्री-लुक अवधि'' के
    भीतर शर्तों से असहमत होने पर पॉलिसी रद्द कर सकते हैं।

    5. दायित्व: हम IRDAI के नियमों का पालन करते हैं और दावों की निष्पक्ष जांच करते
    हैं। किसी भी गलत जानकारी या धोखाधड़ी की स्थिति में, हम दावे को अस्वीकार करने का
    अधिकार सुरक्षित रखते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: terms_conditions
