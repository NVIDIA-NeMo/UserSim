- id: 7e19b828-aa0e-5d6d-81b7-d30c340db203
  title: अभय टर्म लाइफ कवर — ब्याज दर अनुसूची
  body: 'अभय टर्म लाइफ कवर एक शुद्ध सुरक्षा (Pure Protection) प्लान है। चूंकि यह कोई
    निवेश उत्पाद नहीं है, इसलिए इसमें कोई ब्याज दर या रिटर्न लागू नहीं होता है।


    इस उत्पाद के लिए एक निश्चित वार्षिक प्रीमियम ₹12000 लागू है, जो ₹10000000 की बीमित
    राशि के लिए सुरक्षा प्रदान करता है। यह दर पॉलिसी अवधि (30 वर्ष) के लिए तय की जाती
    है और इसमें कोई बाजार-आधारित बदलाव नहीं होता है।'
  domain: insurance
  product_category: term_life_cover
  document_type: rate_sheet
  source_authority: official
  placeholder: true
