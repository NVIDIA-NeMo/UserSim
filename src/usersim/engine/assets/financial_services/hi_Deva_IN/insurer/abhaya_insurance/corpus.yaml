  institution_id: abhaya_insurance
- id: 597e752c-6046-5ea4-b93e-bd3876f34eb2
  title: अभय टर्म लाइफ कवर — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'अभय टर्म लाइफ कवर एक शुद्ध सुरक्षा प्लान है, जिसे न्यूनतम प्रीमियम पर अधिकतम
    जीवन सुरक्षा प्रदान करने के लिए डिज़ाइन किया गया है। यह उन मध्यम और उच्च-आय वाले
    भारतीय परिवारों के लिए सबसे उपयुक्त है जिनके ऊपर वित्तीय निर्भरताएँ हैं और जो
    अपने परिवार के भविष्य को सुरक्षित करना चाहते हैं।


    **प्रमुख विवरण:**

    - **बीमित राशि:** ₹10000000 की व्यापक सुरक्षा।

    - **वार्षिक प्रीमियम:** मात्र ₹12000।

    - **पॉलिसी अवधि:** 30 वर्ष की दीर्घकालिक सुरक्षा।

    - **फ्री-लुक अवधि:** 15 दिन, ताकि आप संतुष्ट होकर निर्णय ले सकें।

    - **छूट अवधि:** प्रीमियम भुगतान के लिए 30 दिनों का अतिरिक्त समय।


    यह प्लान उन लोगों के लिए आदर्श है जो निवेश और सुरक्षा को अलग रखना चाहते हैं और
    बहुत कम लागत में एक बड़ा लाइफ कवर प्राप्त करना चाहते हैं।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: हमारे सुझाव उत्पाद विवरणों पर आधारित होते हैं, हम व्यक्तिगत कानूनी
    या कर सलाहकार के रूप में कार्य नहीं करते हैं।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
