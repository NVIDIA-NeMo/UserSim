- id: 60bd2f1a-888d-50f9-87c1-b419e60fe41c
  title: परिवार स्वास्थ्य बीमा — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपने ''परिवार स्वास्थ्य बीमा'' के साथ किसी समस्या का सामना करना
    पड़ रहा है, तो कृपया निम्नलिखित विवरण देखें:


    लक्षण: "मेरा दावा (claim) लंबित है या अस्वीकृत हो गया है।"

    संभावित कारण:

    1. दावा 30 दिन की प्रारंभिक प्रतीक्षा अवधि के दौरान किया गया हो।

    2. दावा किसी ऐसी बीमारी के लिए हो जो 36 महीने की पूर्व-मौजूद बीमारी प्रतीक्षा
    अवधि के भीतर आती हो।

    3. दावा पॉलिसी के ''बहिष्करण (Exclusions)'' अनुभाग में शामिल स्थिति के लिए हो।


    समाधान प्रक्रिया:

    - सबसे पहले अपने पॉलिसी दस्तावेज़ में प्रतीक्षा अवधि और बहिष्करणों की जाँच करें।

    - यदि आपको लगता है कि दावा सही है, तो हमें सूचित करें। हम दावे की निष्पक्ष जांच
    करेंगे।

    - यदि समस्या बनी रहती है, तो हम इसे आंतरिक शिकायत अधिकारी के पास भेजेंगे और अंततः
    इसे बीमा लोकपाल (Insurance Ombudsman) तक ले जाया जा सकता है।'
