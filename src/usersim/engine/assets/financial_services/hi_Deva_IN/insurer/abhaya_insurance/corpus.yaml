- id: 21a7b6a3-6ee5-5d3b-9448-15ad62074b2e
  title: अभय टर्म लाइफ कवर — रेफरल और लॉयल्टी ऑफर
  body: हम अपने मौजूदा ग्राहकों के विश्वास की सराहना करते हैं। यदि आप किसी मित्र या
    परिवार के सदस्य को 'अभय टर्म लाइफ कवर' की सुरक्षा से परिचित कराते हैं और वे पॉलिसी
    लेते हैं, तो हम आपको एक विशेष लॉयल्टी बोनस प्रदान करेंगे। यह ऑफर 1 अप्रैल 2024
    से 31 दिसंबर 2024 तक वैध है। प्रत्येक सफल रेफरल पर, हम आपके अगले वार्षिक प्रीमियम
    में ₹500 की छूट देंगे। सुरक्षा के इस सफर में हमारे साथ जुड़ने के लिए धन्यवाद।
  domain: insurance
