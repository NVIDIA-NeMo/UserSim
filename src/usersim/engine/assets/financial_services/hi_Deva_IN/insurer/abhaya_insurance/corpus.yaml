- id: 17a560d3-dabc-5d34-9355-cec2e3d35dc0
  title: अभय टर्म लाइफ कवर — सिंहावलोकन
  body: 'अभय टर्म लाइफ कवर एक शुद्ध सुरक्षा योजना है, जिसे न्यूनतम प्रीमियम पर आपके
    परिवार को अधिकतम जीवन सुरक्षा प्रदान करने के लिए डिज़ाइन किया गया है। हमारा उद्देश्य
    मध्यम और उच्च-आय वाले परिवारों को मानसिक शांति प्रदान करना है।


    इस योजना की मुख्य विशेषताएं इस प्रकार हैं:

    - बीमित राशि (Sum Assured): ₹10000000

    - वार्षिक प्रीमियम: ₹12000

    - पॉलिसी अवधि: 30 वर्ष

    - फ्री-लुक अवधि: 15 दिन

    - प्रीमियम भुगतान के लिए छूट अवधि: 30 दिन


    हम पारदर्शी प्रक्रियाओं और नैतिक अंडरराइटिंग में विश्वास करते हैं, जिससे यह सुनिश्चित
    होता है कि आपके प्रियजन आपकी अनुपस्थिति में आर्थिक रूप से सुरक्षित रहें।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। हमारे सुझाव उत्पाद विवरणों
    पर आधारित होते हैं, जिन्हें निवेश के रूप में नहीं बल्कि सुरक्षा के रूप में देखा
    जाना चाहिए।'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 58c0f527-b104-521e-891d-b05ea3724e91
  title: अभय टर्म लाइफ कवर — बीमित राशि की व्याख्या
  body: 'प्रश्न: अभय टर्म लाइफ कवर में बीमित राशि से आपका क्या तात्पर्य है?

    उत्तर: बीमित राशि वह निश्चित राशि है जो पॉलिसीधारक की मृत्यु की स्थिति में नामांकित
    व्यक्ति (Nominee) को भुगतान की जाती है। आपके प्लान के लिए यह राशि ₹10000000 है।


    प्रश्न: क्या बीमित राशि समय के साथ बदलती है?

    उत्तर: नहीं, यह एक निश्चित सुरक्षा राशि है जो पूरी पॉलिसी अवधि के दौरान स्थिर
    रहती है, बशर्ते सभी प्रीमियम समय पर भुगतान किए जाएं। अधिक विवरण के लिए ''अभय टर्म
    लाइफ कवर — सिंहावलोकन'' देखें।'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 79e14b0d-40b4-59de-bea0-965e627ca3c9
  title: अभय टर्म लाइफ कवर — सेटअप और सक्रियण
  body: 'अभय टर्म लाइफ कवर को सक्रिय करने के लिए इन चरणों का पालन करें:


    1. अपनी पहचान और आय के प्रमाण के साथ आवेदन विवरण प्रदान करें।

    2. अपने नामांकित व्यक्ति (Nominee) की अनिवार्य जानकारी साझा करें, जो सुरक्षा के
    लिए अत्यंत आवश्यक है।

    3. हमारे द्वारा निर्धारित चिकित्सा परीक्षण (यदि आवश्यक हो) को पूरा करें।

    4. ₹12000 का वार्षिक प्रीमियम भुगतान करें।

    5. भुगतान सफल होने के बाद, हम आपको आपका पॉलिसी दस्तावेज़ भेजेंगे।


    एक बार जब आपको पॉलिसी दस्तावेज़ मिल जाता है, तो आपके पास 15 दिन की फ्री-लुक अवधि
    होती है। यदि आप शर्तों से असहमत हैं, तो इस समय सीमा के भीतर पॉलिसी रद्द करने का
    अनुरोध कर सकते हैं। सक्रियण की पुष्टि आपको ईमेल और एसएमएस के माध्यम से प्राप्त
    होगी।'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 6d889efc-5500-5742-a37b-494e28b3b96c
  title: अभय टर्म लाइफ कवर — शुल्क अनुसूची
  body: 'अभय टर्म लाइफ कवर के लिए लागू शुल्क विवरण नीचे दिए गए हैं:


    - वार्षिक प्रीमियम: ₹12000

    - पॉलिसी प्रबंधन शुल्क: जैसा कि पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखा गया है।


    हमारा मूल्य निर्धारण प्रतिस्पर्धी है और प्रीमियम का उपयोग जोखिम प्रबंधन और परिचालन
    लागतों को कवर करने के लिए किया जाता है। सभी शुल्क पारदर्शिता के साथ पॉलिसी दस्तावेज़
    में अंकित होते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 92f1b3ed-a38f-5718-8ad0-083cb427f52f
  title: अभय टर्म लाइफ कवर — विफल या लंबित कार्रवाई
  body: 'यदि आपको पॉलिसी सक्रियण या प्रीमियम भुगतान में समस्या आ रही है, तो कृपया
    निम्नलिखित चरणों की जांच करें:


    लक्षण: ''भुगतान लंबित'' या ''दस्तावेज़ अपूर्ण'' का संदेश दिखना।


    जांच और समाधान:

    1. सत्यापित करें कि क्या भुगतान के लिए उपयोग किया गया बैंक खाता सही है और पर्याप्त
    शेष राशि उपलब्ध है।

    2. जांचें कि क्या सभी केवाईसी (KYC) दस्तावेज़ और नामांकित व्यक्ति की जानकारी पूरी
    तरह से भरी गई है।

    3. यदि भुगतान कट गया है लेकिन अपडेट नहीं हुआ है, तो कृपया हमें लेनदेन आईडी प्रदान
    करें।


    यदि समस्या बनी रहती है, तो हम आपके मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे।
    हम निर्धारित समय सीमा के भीतर समाधान सुनिश्चित करते हैं। यदि आंतरिक स्तर पर समाधान
    नहीं होता है, तो आप बीमा लोकपाल (Insurance Ombudsman) से संपर्क कर सकते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 310c9b82-7b56-549f-932c-7f49f1ff385b
  title: अभय टर्म लाइफ कवर — पात्रता शर्तें
  body: 'अभय टर्म लाइफ कवर के लिए पात्रता मानदंड:


    - आयु सीमा: निर्धारित न्यूनतम और अधिकतम आयु सीमा के भीतर (पॉलिसी दस्तावेज़ देखें)
    -> पात्र

    - आय प्रमाण: वैध आय दस्तावेज़ प्रस्तुत करना -> पात्र

    - चिकित्सा स्थिति: अंडरराइटिंग मानदंडों को पूरा करना -> पात्र

    - नामांकित व्यक्ति: नामांकित व्यक्ति की जानकारी प्रदान न करना -> अपात्र


    सभी पात्र आवेदकों के लिए पॉलिसी अवधि 30 वर्ष होगी और वार्षिक प्रीमियम ₹12000 देय
    होगा।'
  domain: insurance
  product_category: term_life_cover
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 52d404db-097b-5c0d-88bf-83820dbc1b02
  title: अभय टर्म लाइफ कवर — यहाँ के समान उत्पाद से तुलना
  body: 'अभय टर्म लाइफ कवर की तुलना जब हम ''ULIP वेल्थ प्लान'' से करते हैं:


    - उद्देश्य: अभय टर्म लाइफ कवर शुद्ध सुरक्षा के लिए है, जबकि ULIP वेल्थ प्लान सुरक्षा
    और बाजार-आधारित धन सृजन का मिश्रण है।

    - लागत: अभय टर्म लाइफ कवर का वार्षिक प्रीमियम ₹12000 है, जो शुद्ध सुरक्षा के कारण
    अधिक किफायती है।

    - लाभ: टर्म कवर में केवल मृत्यु लाभ (बीमित राशि ₹10000000) मिलता है, जबकि ULIP
    में निवेश रिटर्न भी शामिल होता है।


    यह उत्पाद उन लोगों के लिए सबसे उपयुक्त है जो न्यूनतम प्रीमियम पर अधिकतम जीवन सुरक्षा
    चाहते हैं। यदि आप निवेश के साथ सुरक्षा चाहते हैं, तो ULIP वेल्थ प्लान बेहतर विकल्प
    हो सकता है।'
  domain: insurance
  product_category: term_life_cover
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 13255d63-411d-5493-9866-ca1a06dd7445
  title: अभय टर्म लाइफ कवर — नियामक प्रकटीकरण
  body: 'हम IRDAI के नियमों का सख्ती से पालन करते हैं। इस पॉलिसी के तहत निम्नलिखित
    नियामक खुलासे अनिवार्य हैं:


    1. फ्री-लुक अवधि: पॉलिसी दस्तावेज़ प्राप्त होने के बाद 15 दिन की अवधि दी जाती
    है, जिसमें ग्राहक शर्तों से असहमत होने पर पॉलिसी रद्द कर सकता है।

    2. छूट अवधि (Grace Period): प्रीमियम भुगतान के लिए 30 दिन की अतिरिक्त समय सीमा
    प्रदान की जाती है।

    3. बहिष्करण (Exclusions): कुछ विशिष्ट स्थितियाँ ऐसी हो सकती हैं जिनके लिए बीमा
    कंपनी दावा भुगतान नहीं करती है। इनका पूर्ण विवरण पॉलिसी दस्तावेज़ के बहिष्करण
    खंड में दिया गया है।

    4. गोपनीयता: ग्राहक डेटा की गोपनीयता और नामांकित व्यक्ति की जानकारी सुनिश्चित
    करना हमारी सर्वोच्च प्राथमिकता है।


    किसी भी पॉलिसी बदलाव से पहले बहु-स्तरीय पहचान सत्यापन (OTP या बायोमेट्रिक) अनिवार्य
    है।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: disclosure
  source_authority: official
