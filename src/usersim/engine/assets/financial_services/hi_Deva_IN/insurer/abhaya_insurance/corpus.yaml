- id: f366f423-857d-5ac9-a894-3a21e9691eb2
  title: update_beneficiary का उपयोग कब करें
  body: 'जब किसी पॉलिसीधारक को अपने नामांकित व्यक्ति (Nominee) या लाभार्थी की जानकारी
    बदलनी हो, तब इस प्रक्रिया का उपयोग किया जाता है। यह जीवन की महत्वपूर्ण घटनाओं
    जैसे विवाह, जन्म या कानूनी उत्तराधिकार में बदलाव के समय आवश्यक होता है। हम यह
    सुनिश्चित करते हैं कि नामांकित व्यक्ति की जानकारी सटीक हो ताकि भविष्य में दावों
    का निपटान पारदर्शी तरीके से हो सके।


    **कार्यवाही के चरण:**

    1. ग्राहक की पहचान सत्यापित करने के लिए `verify_identity` का उपयोग करें।

    2. यदि पूर्ण खाता आईडी उपलब्ध नहीं है, तो खाते का विवरण खोजने के लिए `get_accounts`
    का उपयोग करें।

    3. ग्राहक से नए लाभार्थी का नाम, संबंध और विवरण प्राप्त करें।

    4. नामांकित व्यक्ति की अनिवार्य जानकारी अपडेट करने के लिए `update_beneficiary`
    टूल को कॉल करें।


    कृपया ध्यान दें कि सभी परिवर्तन IRDAI के नियमों के अधीन हैं।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_beneficiary
  institution_id: abhaya_insurance
- id: e8f22027-084c-50fd-88de-efde89cb07a9
  title: update_beneficiary टूल संदर्भ
  body: 'यह टूल एजेंट को किसी पॉलिसी के नामांकित व्यक्ति (Nominee) या लाभार्थी के
    विवरण को संशोधित करने की अनुमति देता है। एजेंट इस कार्य को सीधे update_beneficiary
    टूल का उपयोग करके पूरा करता है।


    **सिग्नेचर:** `update_beneficiary(account_id: string, nominee_details: object)`

    **तर्क (Args):**

    - `account_id`: उस पॉलिसी खाते की आईडी जिसमें बदलाव करना है।

    - `nominee_details`: नए नामांकित व्यक्ति का नाम, आयु, संबंध और हिस्सेदारी का प्रतिशत
    शामिल करने वाला ऑब्जेक्ट।

    **प्रभाव:** यह पॉलिसी रिकॉर्ड में लाभार्थी की जानकारी को अपडेट करता है, जो मृत्यु
    दावे के समय भुगतान के लिए निर्णायक होता है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
