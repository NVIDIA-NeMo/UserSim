- id: 2515ff27-adfe-5713-bba5-4b27521ad81e
  title: ULIP वेल्थ प्लान — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: 'एक सहायता एजेंट के रूप में, कृपया ग्राहक को ULIP वेल्थ प्लान की निम्नलिखित
    सीमाओं और प्रतिबंधों के बारे में स्पष्ट रूप से सूचित करें:


    1. लॉक-इन अवधि: इस उत्पाद में 5 वर्ष की अनिवार्य लॉक-इन अवधि है। इस समय से पहले
    फंड की निकासी संभव नहीं है।

    2. शुल्क संरचना: प्रत्येक निवेश पर 3% का प्रीमियम आवंटन शुल्क लागू होता है। इसके
    अतिरिक्त, फंड के प्रबंधन के लिए 1.35% का फंड प्रबंधन शुल्क लिया जाता है।

    3. प्रीमियम प्रतिबद्धता: इस योजना के लिए ₹50000 का वार्षिक प्रीमियम निर्धारित
    है।

    4. बहिष्करण: पॉलिसी दस्तावेज़ में उल्लिखित विशिष्ट स्थितियाँ और घटनाएँ ऐसी होती
    हैं जिनके लिए बीमा कंपनी दावा भुगतान नहीं करती है।


    यह सुनिश्चित करें कि ग्राहक को पता हो कि यह उत्पाद सुरक्षा और बाजार-आधारित धन
    सृजन का मिश्रण है, इसलिए इसका मूल्य बाजार के उतार-चढ़ाव के अधीन है।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c0454abc-b24c-5b34-9927-4e0df8cda977
  title: ULIP वेल्थ प्लान — प्रीमियम आवंटन शुल्क की व्याख्या
  body: 'प्रश्न: प्रीमियम आवंटन शुल्क क्या है और यह मेरे ULIP वेल्थ प्लान पर कैसे
    लागू होता है?

    उत्तर: प्रीमियम आवंटन शुल्क वह राशि है जो आपके द्वारा भुगतान किए गए प्रीमियम से
    पॉलिसी सेटअप और प्रशासनिक लागतों को कवर करने के लिए काटी जाती है। ULIP वेल्थ प्लान
    के लिए यह शुल्क 3% है। इसका मतलब है कि आपके वार्षिक प्रीमियम ₹50000 में से 3%
    हिस्सा शुल्क के रूप में लिया जाएगा और शेष राशि आपके द्वारा चुने गए फंड में निवेश
    की जाएगी।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a7378e27-aa20-5762-8d41-1aa0d00a2e75
  title: ULIP वेल्थ प्लान — स्थिति या इतिहास देखना
  body: 'अपनी पॉलिसी की वर्तमान स्थिति और निवेश इतिहास देखने के लिए इन चरणों का पालन
    करें:


    1. हमें अपनी पॉलिसी संख्या और पहचान विवरण प्रदान करें।

    2. हम आपके विवरणों के सत्यापन के लिए एक ओटीपी (OTP) भेजेंगे; कृपया इसे साझा करें
    ताकि हम आपकी संवेदनशील जानकारी सुरक्षित रूप से एक्सेस कर सकें।

    3. सत्यापन के बाद, हम आपको आपकी वर्तमान फंड वैल्यू, अब तक जमा किए गए कुल प्रीमियम
    (₹50000 प्रति वर्ष की दर से) और आपके निवेश के प्रदर्शन का विवरण प्रदान करेंगे।

    4. यदि आपने लॉक-इन अवधि (5 वर्ष) पूरी कर ली है, तो हम आपको आपकी निकासी योग्य राशि
    की सटीक स्थिति भी बताएंगे।


    जब हम आपको अंतिम सारांश भेज देंगे, तब आपकी स्थिति देखने की प्रक्रिया पूर्ण मानी
    जाएगी।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 44024feb-9c08-5ccc-b8db-5ab1d61ccb7f
  title: ULIP वेल्थ प्लान — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'लक्षण: ग्राहक को फंड स्विच करने या निकासी अनुरोध के दौरान ''कार्रवाई अस्वीकृत''
    (Action Rejected) का संदेश मिल रहा है।


    संभावित कारण:

    - लॉक-इन अवधि: यदि पॉलिसी को शुरू हुए 5 वर्ष नहीं हुए हैं, तो निकासी अनुरोध अवरुद्ध
    हो जाएगा।

    - सत्यापन विफलता: यदि बायोमेट्रिक या ओटीपी प्रमाणीकरण विफल रहा है।

    - अपूर्ण जानकारी: नामांकित व्यक्ति (nominee) का विवरण अपडेट न होना।


    समाधान:

    1. सबसे पहले अपनी पॉलिसी की लॉक-इन स्थिति की जांच करें।

    2. सुनिश्चित करें कि आप सत्यापन प्रक्रिया के दौरान सही ओटीपी प्रदान कर रहे हैं।

    3. यदि विवरण अधूरे हैं, तो हमें नामांकित व्यक्ति की जानकारी प्रदान करें।


    यदि समस्या बनी रहती है, तो हम आपके अनुरोध को आंतरिक शिकायत अधिकारी के पास भेजेंगे,
    जो निर्धारित समय सीमा के भीतर इसका समाधान करेंगे।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d99885a6-1fa8-59a8-a8bb-cb9868954060
  title: ULIP वेल्थ प्लान — कब स्विच या अपग्रेड करें
  body: एक एजेंट के रूप में, ग्राहक को तब स्विच करने की सलाह दें जब उनकी वित्तीय प्राथमिकताएं
    बदल जाएं। यदि ग्राहक को बाजार जोखिम के बजाय केवल शुद्ध सुरक्षा चाहिए, तो वे 'अभय
    टर्म लाइफ कवर — सिंहावलोकन' की ओर देख सकते हैं। हालांकि, यदि वे ₹50000 के वार्षिक
    प्रीमियम के साथ सुरक्षा और धन सृजन दोनों चाहते हैं, तो ULIP वेल्थ प्लान सबसे उपयुक्त
    है। स्विच करने से पहले याद दिलाएं कि 5 वर्ष की लॉक-इन अवधि का पालन करना अनिवार्य
    है।
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: comparison
