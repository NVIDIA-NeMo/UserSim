- id: ea9d61ba-f7a9-511f-b70a-cc30dcbf0b09
  title: परिवार स्वास्थ्य बीमा — नियामक प्रकटीकरण
  body: 'हम IRDAI के सभी नियामक दिशानिर्देशों का सख्ती से पालन करते हैं। ''परिवार
    स्वास्थ्य बीमा'' के संबंध में निम्नलिखित प्रकटीकरण अनिवार्य हैं:


    1. प्रतीक्षा अवधि: पॉलिसी सक्रिय होने के बाद 30 दिन की प्रारंभिक प्रतीक्षा अवधि
    और पूर्व-मौजूद बीमारियों के लिए 36 महीने की प्रतीक्षा अवधि लागू होती है।

    2. रूम रेंट कैप: अस्पताल में भर्ती होने पर कमरे के किराये की सीमा कुल बीमा राशि
    (₹500000) के 1% तक सीमित है।

    3. पारदर्शिता: सभी प्रबंधन शुल्क और आवंटन आपके पॉलिसी दस्तावेज़ में स्पष्ट रूप
    से उल्लेखित हैं।

    4. गोपनीयता: हम ग्राहक डेटा की गोपनीयता को सर्वोच्च प्राथमिकता देते हैं और किसी
    भी बदलाव से पहले बहु-स्तरीय सत्यापन अनिवार्य करते हैं।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। हमारे सुझाव उत्पाद विवरणों
    पर आधारित होते हैं, जिन्हें निवेश के रूप में नहीं बल्कि सुरक्षा के रूप में देखा
    जाना चाहिए।

    ***'
