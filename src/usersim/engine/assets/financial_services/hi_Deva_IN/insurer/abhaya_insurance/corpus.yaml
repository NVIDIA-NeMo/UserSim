- id: 8df6ac37-f6cb-54a3-8c2c-8bf88d85c903
  title: अभय टर्म लाइफ कवर — शुरुआत कैसे करें
  body: 'एक सपोर्ट एजेंट के रूप में, ग्राहक को ''अभय टर्म लाइफ कवर'' शुरू कराने के
    लिए इन विवरणों का उपयोग करें:


    मुख्य उत्पाद विवरण:

    - बीमा राशि (Sum Assured): ₹10000000

    - वार्षिक प्रीमियम: ₹12000

    - पॉलिसी अवधि: 30 वर्ष

    - फ्री-लुक अवधि: 15 दिन

    - प्रीमियम छूट अवधि (Grace Period): 30 दिन


    ऑनबोर्डिंग प्रक्रिया:

    1. ग्राहक की पात्रता की जांच करें।

    2. नामांकित व्यक्ति (Nominee) की अनिवार्य जानकारी प्राप्त करें।

    3. बीमा राशि ₹10000000 और वार्षिक प्रीमियम ₹12000 की पुष्टि करें।

    4. ग्राहक को स्पष्ट करें कि यह एक शुद्ध सुरक्षा प्लान है और निवेश नहीं है।

    5. पॉलिसी दस्तावेज़ जारी होने के बाद उन्हें 15 दिन की फ्री-लुक अवधि के बारे में
    शिक्षित करें।'
  domain: insurance
  product_category: term_life_cover
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f5f6ca54-21d7-5593-aaa2-a459e388238d
  title: अभय टर्म लाइफ कवर — पॉलिसी अवधि (वर्ष) की व्याख्या
  body: 'प्रश्न: ''अभय टर्म लाइफ कवर'' के लिए पॉलिसी अवधि (वर्ष) क्या है और इसका क्या
    अर्थ है?

    उत्तर: इस प्लान के लिए पॉलिसी अवधि 30 वर्ष है। इसका अर्थ है कि आपको 30 वर्ष की
    निरंतर अवधि तक सुरक्षा प्रदान की जाएगी, बशर्ते प्रीमियम का भुगतान समय पर किया
    जाए।


    प्रश्न: क्या मैं अपनी 30 वर्ष की अवधि को बढ़ा सकता हूँ?

    उत्तर: नहीं, यह एक निश्चित अवधि का शुद्ध सुरक्षा प्लान है। अधिक जानकारी के लिए
    ''अभय टर्म लाइफ कवर — सिंहावलोकन'' देखें।'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 9f0e0273-fd59-55c2-a080-2cce79a9e7fc
  title: अभय टर्म लाइफ कवर — बदलाव या अद्यतन करना
  body: 'यदि आप अपनी पॉलिसी में विवरण बदलना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें वह विवरण बताएं जिसे आप अपडेट करना चाहते हैं (जैसे पता, फोन नंबर, या नामांकित
    व्यक्ति का नाम)।

    2. हम आपसे आपकी पहचान सत्यापित करने के लिए ओटीपी (OTP) या बायोमेट्रिक प्रमाणीकरण
    प्रदान करने का अनुरोध करेंगे।

    3. सत्यापन सफल होने के बाद, हमें आवश्यक सहायक दस्तावेज़ (जैसे नामांकित व्यक्ति
    का आईडी प्रमाण) प्रदान करें।

    4. हम आपके अनुरोध की जांच करेंगे और अपडेट की पुष्टि करेंगे।

    5. एक बार अपडेट हो जाने पर, हम आपको संशोधित पॉलिसी दस्तावेज़ का एक डिजिटल संस्करण
    भेजेंगे।


    सत्यापन प्रक्रिया पूर्ण होने तक कोई भी बदलाव प्रभावी नहीं होगा।'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 90a61617-85e9-57e1-9050-c62beb8cf491
  title: अभय टर्म लाइफ कवर — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने डिजिटल पोर्टल पर लॉगिन नहीं कर पा रहे हैं, तो कृपया निम्नलिखित
    चरणों का पालन करें:


    लक्षण: ''गलत क्रेडेंशियल'' या ''खाता लॉक'' का संदेश दिखना।


    जांच के चरण:

    1. सुनिश्चित करें कि आप सही पंजीकृत मोबाइल नंबर या ईमेल का उपयोग कर रहे हैं।

    2. यदि पासवर्ड भूल गए हैं, तो हमसे पासवर्ड रीसेट करने का अनुरोध करें।

    3. यदि ओटीपी (OTP) प्राप्त नहीं हो रहा है, तो अपने नेटवर्क कनेक्शन की जांच करें
    और पुनः प्रयास करें।


    समाधान:

    - यदि समस्या बनी रहती है, तो हम आपके खाते के लिए बहु-स्तरीय पहचान सत्यापन शुरू
    करेंगे।

    - हम आपकी पहचान सत्यापित करने के बाद आपके एक्सेस को मैन्युअल रूप से रीसेट करेंगे।


    यदि लॉगिन समस्या किसी तकनीकी खराबी के कारण है, तो हम इसे अपनी आईटी टीम को भेजेंगे
    और आपको 48 कार्य घंटों के भीतर समाधान प्राप्त होगा।'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 767de25c-693c-5a19-ab8d-5a1b0d366300
  title: अभय टर्म लाइफ कवर — पात्रता श्रेणियाँ
  body: 'ग्राहक श्रेणी और पात्रता परिणाम:


    - मध्यम आय वर्ग (भारतीय निवासी): ₹12000 वार्षिक प्रीमियम और ₹10000000 बीमा राशि
    के लिए पात्र।

    - उच्च आय वर्ग (भारतीय निवासी): ₹10000000 से अधिक की बीमा राशि के लिए अतिरिक्त
    आय प्रमाण के साथ पात्र।

    - गैर-निवासी भारतीय (NRI): विशिष्ट केवाईसी और नामांकित व्यक्ति के विवरण के साथ
    पात्र।

    - आयु सीमा: पॉलिसी अवधि 30 वर्ष पूर्ण करने तक की आयु सीमा के भीतर होना अनिवार्य
    है।'
  domain: insurance
  product_category: term_life_cover
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 75275a6c-b897-5cb6-857a-c9e5317ef91e
  title: अभय टर्म लाइफ कवर — श्रेणियों या विकल्पों में से चुनाव
  body: 'यदि आप सुरक्षा के विकल्पों की तलाश में हैं, तो ''अभय टर्म लाइफ कवर'' एक शुद्ध
    सुरक्षा प्लान है जो ₹12000 के वार्षिक प्रीमियम पर ₹10000000 की अधिकतम जीवन सुरक्षा
    प्रदान करता है।


    इसके विपरीत, यदि आप सुरक्षा के साथ-साथ बाजार-आधारित धन सृजन चाहते हैं, तो ''ULIP
    वेल्थ प्लान'' एक बेहतर विकल्प है। जबकि टर्म प्लान केवल मृत्यु लाभ के लिए है, ULIP
    निवेश और बीमा का मिश्रण है। यदि आपका प्राथमिक लक्ष्य परिवार के लिए न्यूनतम लागत
    पर अधिकतम वित्तीय सुरक्षा सुनिश्चित करना है, तो ''अभय टर्म लाइफ कवर'' सबसे उपयुक्त
    है।'
  domain: insurance
  product_category: term_life_cover
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0d8cdda7-fc0d-5c06-80ef-cea16e3bfa69
  title: अभय टर्म लाइफ कवर — गोपनीयता और डेटा प्रबंधन
  body: 'हम अभय इंश्योरेंस में आपके डेटा की गोपनीयता को सर्वोच्च प्राथमिकता देते हैं।
    ''अभय टर्म लाइफ कवर'' के तहत एकत्र की गई सभी व्यक्तिगत और वित्तीय जानकारी IRDAI
    के नियमों के अनुसार प्रबंधित की जाती है।


    डेटा उपयोग नीति:

    - हम आपके डेटा का उपयोग केवल पॉलिसी अंडरराइटिंग, प्रीमियम संग्रह (₹12000 वार्षिक)
    और दावे के निपटान के लिए करते हैं।

    - नामांकित व्यक्ति (Nominee) की जानकारी को सख्ती से गोपनीय रखा जाता है और केवल
    दावा प्रक्रिया के दौरान उपयोग किया जाता है।

    - हम किसी भी तीसरे पक्ष को आपका डेटा नहीं बेचते हैं।


    सत्यापन और सुरक्षा:

    - डेटा एक्सेस के लिए बहु-स्तरीय पहचान सत्यापन अनिवार्य है।

    - संवेदनशील जानकारी साझा करने के लिए हम केवल बायोमेट्रिक या ओटीपी (OTP) प्रमाणीकरण
    का उपयोग करते हैं।


    ग्राहक के पास किसी भी समय अपने डेटा की सटीकता की जांच करने और उसे अपडेट करने का
    अधिकार है।'
  domain: insurance
  product_category: term_life_cover
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 2af31bd4-97a0-5a43-a65b-7b793e8e7763
  title: अभय टर्म लाइफ कवर — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'हम चाहते हैं कि आप अभय टर्म लाइफ कवर के माध्यम से सुरक्षित महसूस करें। हाल
    ही में, हमने देखा है कि कुछ जालसाज ग्राहकों को यह कहकर निशाना बना रहे हैं कि वे
    आपके ₹12000 के वार्षिक प्रीमियम को कम कर सकते हैं या आपको बिना किसी मेडिकल जांच
    के तुरंत ₹10000000 की बीमित राशि दिला सकते हैं।


    कृपया ध्यान दें कि हम कभी भी आपसे आपका ओटीपी (OTP), पासवर्ड, या बायोमेट्रिक डेटा
    किसी अनौपचारिक कॉल या ईमेल पर नहीं मांगेंगे। यदि कोई व्यक्ति आपसे दावा राशि को
    जल्दी प्राप्त करने के लिए ''प्रोसेसिंग शुल्क'' के रूप में अग्रिम भुगतान की मांग
    करता है, तो यह एक स्कैम है। अभय इंश्योरेंस ऐसी किसी भी प्रक्रिया का पालन नहीं
    करता है।


    यदि आपको कोई संदिग्ध संदेश मिलता है या आपको लगता है कि आपकी जानकारी के साथ छेड़छाड़
    की गई है, तो तुरंत हमें सूचित करें। किसी भी संदिग्ध गतिविधि की रिपोर्ट करने में
    देरी न करें, क्योंकि यह आपके दावे की प्रक्रिया को प्रभावित कर सकती है।


    ***

    कानूनी डिस्क्लेमर: हम IRDAI के नियमों का पालन करते हैं। किसी भी धोखाधड़ी के प्रयास
    के खिलाफ हमारी शून्य-सहनशीलता की नीति है।'
  domain: insurance
  product_category: term_life_cover
  document_type: security_advisory
