- id: 640460df-59dd-5942-9cef-2930e036c7f4
  title: ULIP वेल्थ प्लान — शुरुआत कैसे करें
  body: 'एक सहायता एजेंट के रूप में, ग्राहक को ''ULIP वेल्थ प्लान'' शुरू करने में
    मदद करने के लिए इन विवरणों का उपयोग करें:


    मुख्य विशेषताएं:

    - यह सुरक्षा और बाजार-आधारित धन सृजन का एक संतुलित मिश्रण है।

    - वार्षिक प्रीमियम: ₹50000

    - लॉक-इन अवधि: 5 वर्ष


    लागू शुल्क:

    - प्रीमियम आवंटन शुल्क: 3% (यह राशि प्रीमियम निवेश से पहले काटी जाती है।)

    - फंड प्रबंधन शुल्क: 1.35% (यह शुल्क फंड के मूल्य से वार्षिक रूप से लिया जाता
    है।)


    प्रक्रिया:

    1. पात्रता जांचें और आवश्यक केवाईसी (KYC) दस्तावेज़ एकत्र करें।

    2. ग्राहक से एक नामांकित व्यक्ति (Nominee) की अनिवार्य जानकारी प्राप्त करें।

    3. प्रीमियम भुगतान विकल्प और फंड चयन में ग्राहक की सहायता करें।

    4. पॉलिसी दस्तावेज़ जारी होने के बाद, उन्हें ''फ्री-लुक अवधि'' के बारे में शिक्षित
    करें।


    सुनिश्चित करें कि ग्राहक को पता है कि यह उत्पाद सुरक्षा के रूप में देखा जाना चाहिए,
    न कि केवल निवेश के रूप में।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: e5dd283e-a406-5721-a5bc-b31b1b01ede7
  title: ULIP वेल्थ प्लान — फंड प्रबंधन शुल्क की व्याख्या
  body: 'प्रश्न: फंड प्रबंधन शुल्क (Fund Management Charge) क्या है और यह कैसे लिया
    जाता है?

    उत्तर: यह शुल्क पेशेवर फंड मैनेजरों द्वारा आपके निवेश को प्रबंधित करने की लागत
    को कवर करता है। ''ULIP वेल्थ प्लान'' के लिए यह शुल्क 1.35% है, जो आपके फंड मूल्य
    से लिया जाता है।


    प्रश्न: क्या यह शुल्क मेरे ₹50000 के वार्षिक प्रीमियम से सीधे काटा जाता है?

    उत्तर: नहीं, प्रीमियम आवंटन शुल्क (3%) प्रीमियम से काटा जाता है, जबकि फंड प्रबंधन
    शुल्क (1.35%) आपके निवेशित फंड की वैल्यू के आधार पर लिया जाता है। अधिक विवरण के
    लिए ''ULIP वेल्थ प्लान — लागत और शुल्क'' देखें।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 5d096adb-018d-530d-8a10-b59cd2a66f5a
  title: ULIP वेल्थ प्लान — बदलाव या अद्यतन करना
  body: 'अपने ''ULIP वेल्थ प्लान'' में विवरण अपडेट करने के लिए इन चरणों का पालन करें:


    आवश्यकताएँ: आपका पॉलिसी नंबर और पहचान सत्यापन के लिए आधार या पैन कार्ड।


    चरण 1: हमें बताएं कि आप क्या बदलना चाहते हैं (जैसे: पता, फोन नंबर, या नामांकित
    व्यक्ति)।

    चरण 2: हम आपकी पहचान सत्यापित करने के लिए आपके पंजीकृत मोबाइल नंबर पर एक ओटीपी
    (OTP) भेजेंगे।

    चरण 3: ओटीपी साझा करें और अपडेट किए जाने वाले नए विवरण प्रदान करें। यदि आप नामांकित
    व्यक्ति बदल रहे हैं, तो नए नामांकित व्यक्ति का पूरा नाम और संबंध बताएं।

    चरण 4: हम आपके अनुरोध की समीक्षा करेंगे और विवरण अपडेट होने के बाद आपको एक पुष्टिकरण
    संदेश भेजेंगे।


    सत्यापन पूर्ण होने के बाद, आप अपने अपडेटेड विवरणों की जांच कर सकते हैं।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a9a25dae-09b4-5967-804b-d9511ff8b7bc
  title: ULIP वेल्थ प्लान — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने ''ULIP वेल्थ प्लान'' के विवरण एक्सेस करने में असमर्थ हैं, तो
    कृपया निम्नलिखित चरणों का पालन करें:


    लक्षण: लॉगिन विफल होना, ओटीपी प्राप्त न होना, या ''अवैध उपयोगकर्ता'' का संदेश
    मिलना।


    जांच और समाधान:

    1. क्रेडेंशियल जांचें: सुनिश्चित करें कि आप सही पॉलिसी नंबर और पंजीकृत मोबाइल
    नंबर का उपयोग कर रहे हैं।

    2. नेटवर्क स्थिति: यदि ओटीपी नहीं मिल रहा है, तो अपना नेटवर्क सिग्नल जांचें और
    2 मिनट प्रतीक्षा करें।

    3. विवरण मिलान: यदि लॉगिन विफल रहता है, तो हमें सूचित करें कि आपके रिकॉर्ड में
    मोबाइल नंबर या ईमेल में कोई बदलाव तो नहीं हुआ है।


    यदि समस्या बनी रहती है, तो हम आपके खाते का आंतरिक सत्यापन करेंगे और एक नया एक्सेस
    लिंक या पासवर्ड रीसेट विकल्प प्रदान करेंगे। इस प्रक्रिया में आमतौर पर 24-48 कार्य
    घंटे लगते हैं।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
