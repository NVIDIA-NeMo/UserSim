  institution_id: abhaya_insurance
- id: 8b7eab4d-f7c9-577e-89eb-4199cee0ca7f
  title: ULIP वेल्थ प्लान — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'ULIP वेल्थ प्लान के लिए शुल्क संरचना सभी पॉलिसीधारकों के लिए समान और पारदर्शी
    है। इसमें कोई श्रेणीबद्ध (tiered) दरें नहीं हैं।


    - प्रीमियम आवंटन शुल्क: 3% (यह प्रत्येक प्रीमियम भुगतान पर एक बार लागू होता है)।

    - फंड प्रबंधन शुल्क: 1.35% (यह वार्षिक आधार पर फंड मूल्य से काटा जाता है)।


    ये दरें सभी ₹50000 वार्षिक प्रीमियम वाली पॉलिसियों पर समान रूप से लागू होती हैं।
    शुल्क में कोई भी बदलाव IRDAI के दिशा-निर्देशों और पॉलिसी दस्तावेज़ की शर्तों के
    अनुसार केवल पूर्व सूचना के बाद ही किया जाएगा।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 40ca2b55-d5de-5142-9c78-f041ac39fecd
  title: ULIP वेल्थ प्लान — रेफरल और लॉयल्टी ऑफर
  body: हम अपने मौजूदा ग्राहकों के भरोसे की सराहना करते हैं। यदि आप अपने किसी मित्र
    या परिवार के सदस्य को 'ULIP वेल्थ प्लान' के लिए रेफर करते हैं, और वे ₹50000 के
    वार्षिक प्रीमियम के साथ पॉलिसी शुरू करते हैं, तो हम आपको एक विशेष लॉयल्टी बोनस
    प्रदान करेंगे। यह ऑफर 1 जनवरी 2025 से 31 मार्च 2025 तक मान्य है। रेफरल बोनस की
    राशि आपके फंड मूल्य में जोड़ी जाएगी। अधिक जानकारी के लिए कृपया हमारे प्रतिनिधि
    से संपर्क करें।
  domain: insurance
