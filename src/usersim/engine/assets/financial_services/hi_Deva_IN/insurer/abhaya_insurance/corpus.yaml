- id: efc32179-f1f0-5178-b034-462bed2b0d28
  title: मोटर ओन-डैमेज कवर — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'अभय इंश्योरेंस में, हम आपके वाहन की सुरक्षा के साथ-साथ आपकी वित्तीय जानकारी
    की गोपनीयता को भी प्राथमिकता देते हैं। मोटर ओन-डैमेज कवर के ग्राहकों को अक्सर
    फर्जी दुर्घटना दावों या प्रीमियम नवीनीकरण के नाम पर होने वाले स्कैम का सामना करना
    पड़ता है।


    कृपया ध्यान दें कि हम आपसे कभी भी आपके ओटीपी (OTP), पासवर्ड या बायोमेट्रिक विवरण
    फोन कॉल या ईमेल के माध्यम से नहीं मांगेंगे। किसी भी पॉलिसी बदलाव या भुगतान से
    पहले हम हमेशा बहु-स्तरीय पहचान सत्यापन का उपयोग करते हैं। यदि आपको कोई ऐसा संदेश
    मिलता है जो आपसे तत्काल भुगतान की मांग करता है या दावा राशि जारी करने के लिए शुल्क
    मांगता है, तो वह धोखाधड़ी हो सकती है।


    यदि आपको अपनी पॉलिसी में कोई अनधिकृत गतिविधि दिखाई देती है, तो तुरंत हमें सूचित
    करें। हम धोखाधड़ी के प्रति शून्य-सहनशीलता की नीति अपनाते हैं और सभी संदिग्ध दावों
    की निष्पक्ष जांच करते हैं। त्वरित रिपोर्टिंग आपकी सुरक्षा और दावा प्रक्रिया को
    सुगम बनाती है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0a8a0f40-1f53-5583-b0c8-26e8fff9d16b
  title: मोटर ओन-डैमेज कवर — खाता अनुबंध
  body: 'यह अनुबंध अभय इंश्योरेंस और पॉलिसीधारक के बीच मोटर ओन-डैमेज कवर के नियमों
    को निर्धारित करता है।


    1. प्रीमियम और भुगतान: ग्राहक ₹7500 के वार्षिक प्रीमियम का भुगतान करने के लिए
    सहमत है। प्रीमियम का उपयोग जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए
    किया जाता है।

    2. कटौती योग्य राशि: प्रत्येक दावे के दौरान, ₹1000 की अनिवार्य कटौती योग्य राशि
    (compulsory deductible) लागू होगी, जिसका भुगतान पॉलिसीधारक द्वारा किया जाएगा।

    3. नो-क्लेम बोनस: यदि पहले वर्ष में कोई दावा नहीं किया जाता है, तो ग्राहक 20%
    के नो-क्लेम बोनस का पात्र होगा।

    4. दावा निपटान: हम दावा सूचना प्राप्त होने के बाद 30 दिनों के भीतर निपटान प्रक्रिया
    को पूरा करने के लिए प्रतिबद्ध हैं।

    5. समाप्ति और रद्दीकरण: पॉलिसीधारक फ्री-लुक अवधि के भीतर शर्तों से असहमत होने
    पर पॉलिसी रद्द कर सकता है।


    हम IRDAI के नियमों का सख्ती से पालन करते हैं। किसी भी विवाद की स्थिति में, समाधान
    निर्धारित समय सीमा के भीतर आंतरिक शिकायत अधिकारी और फिर बीमा लोकपाल के माध्यम
    से किया जाएगा।'
  domain: insurance
  product_category: motor_own_damage
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 18d58169-f6e5-5bf7-abfd-668db1b5302a
  title: मोटर ओन-डैमेज कवर — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'मोटर ओन-डैमेज कवर उन वाहन मालिकों के लिए सबसे उपयुक्त है जो अपने वाहन को
    दुर्घटना, चोरी या प्राकृतिक आपदाओं से होने वाले नुकसान से सुरक्षित करना चाहते
    हैं। यह विशेष रूप से उन मध्यम और उच्च-आय वाले परिवारों के लिए डिज़ाइन किया गया
    है जो मानसिक शांति और पारदर्शी प्रक्रियाओं की तलाश में हैं।


    मुख्य विशेषताएं और लागत विवरण:

    - वार्षिक प्रीमियम: ₹7500

    - अनिवार्य कटौती योग्य राशि: ₹1000 (प्रत्येक दावे पर)

    - पहले वर्ष का नो-क्लेम बोनस: 20%

    - दावा निपटान अवधि: 30 दिन


    सामान्य उपयोग के मामले: इस कवर का उपयोग तब किया जाता है जब वाहन का स्वयं का नुकसान
    (Own Damage) हो, जैसे कि टक्कर, आग, या बाढ़। हम त्वरित दावा निपटान के माध्यम से
    आपके वाहन की मरम्मत और पुनर्प्राप्ति सुनिश्चित करते हैं। यह सुरक्षा और नैतिक अंडरराइटिंग
    का एक संतुलित मिश्रण है, जिससे आप बिना किसी वित्तीय तनाव के यात्रा कर सकते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
