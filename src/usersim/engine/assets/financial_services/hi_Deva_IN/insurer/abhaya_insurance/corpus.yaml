- id: 186c3201-a363-54f4-85a4-327e842668cd
  title: परिवार स्वास्थ्य बीमा — बीमा राशि की व्याख्या
  body: 'प्रश्न: ''परिवार स्वास्थ्य बीमा'' के तहत मेरी कुल बीमा राशि क्या है?

    उत्तर: आपकी कुल बीमा राशि ₹500000 है। यह वह अधिकतम राशि है जो हम एक पॉलिसी वर्ष
    के दौरान कवर की गई स्वास्थ्य स्थितियों के लिए भुगतान करेंगे।


    प्रश्न: क्या बीमा राशि का उपयोग रूम रेंट के लिए किया जा सकता है?

    उत्तर: हाँ, लेकिन रूम रेंट के लिए एक विशिष्ट सीमा है जो आपकी कुल बीमा राशि का
    1% है। अधिक जानकारी के लिए कृपया ''परिवार स्वास्थ्य बीमा — बीमा राशि के प्रतिशत
    में कमरे के किराये की सीमा की व्याख्या'' देखें।'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
