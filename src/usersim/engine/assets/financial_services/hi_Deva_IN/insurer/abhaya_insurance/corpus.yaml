- id: 7508808c-2e86-5d56-bfa5-c76915960b16
  title: अभय टर्म लाइफ कवर — वार्षिक प्रीमियम की व्याख्या
  body: '**प्रश्न: अभय टर्म लाइफ कवर के लिए मेरा वार्षिक प्रीमियम कितना है?**

    उत्तर: इस प्लान के तहत आपका वार्षिक प्रीमियम ₹12000 है, जो आपको ₹10000000 की बीमित
    राशि के लिए सुरक्षा प्रदान करता है।


    **प्रश्न: यदि मैं वार्षिक प्रीमियम का भुगतान समय पर नहीं कर पाता हूँ तो क्या होगा?**

    उत्तर: हम आपको 30 दिनों की छूट अवधि (Grace Period) देते हैं। इस अवधि के भीतर भुगतान
    करने पर आपकी सुरक्षा निरंतर बनी रहती है।


    अधिक विवरण के लिए कृपया अभय टर्म लाइफ कवर — शुल्क अनुसूची देखें।'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: cf00e62f-1930-5871-8172-3d4ea69f04dd
  title: अभय टर्म लाइफ कवर — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी पॉलिसी को रद्द करना या बंद करना चाहते हैं, तो कृपया इन चरणों
    का पालन करें:


    1. **अनुरोध प्रस्तुत करें**: हमें सूचित करें कि आप अपनी पॉलिसी रद्द करना चाहते
    हैं। यदि आप 15 दिनों की फ्री-लुक अवधि के भीतर हैं, तो आप बिना किसी दंड के ऐसा
    कर सकते हैं।

    2. **दस्तावेज़ सत्यापन**: हम आपके पहचान प्रमाण और मूल पॉलिसी दस्तावेज़ की मांग
    करेंगे।

    3. **नामांकित व्यक्ति की पुष्टि**: हम सुरक्षा उद्देश्यों के लिए आपके नामांकित
    व्यक्ति (Nominee) के विवरण की पुष्टि करेंगे।

    4. **रद्दीकरण पुष्टिकरण**: सत्यापन के बाद, हम आपको रद्दीकरण की पुष्टि और यदि लागू
    हो, तो रिफंड की राशि के बारे में सूचित करेंगे।


    पॉलिसी डाउनग्रेड करने के लिए, आप अपनी बीमित राशि को कम करने का अनुरोध कर सकते
    हैं, जिसके बाद हम आपके नए प्रीमियम की गणना करके आपको सूचित करेंगे।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: पॉलिसी रद्द करने से आपकी जीवन सुरक्षा समाप्त हो जाएगी।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 5f1b1b34-be12-5774-9fcd-d97d65ec3494
  title: अभय टर्म लाइफ कवर — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने बैंक विवरण में अभय टर्म लाइफ कवर से संबंधित कोई अनपेक्षित शुल्क
    या राशि दिखाई देती है, तो कृपया निम्नलिखित जाँच करें:


    - **प्रीमियम मिलान**: जाँचें कि क्या वह राशि आपके ₹12000 के वार्षिक प्रीमियम के
    बराबर है।

    - **बकाया शुल्क**: क्या आपने छूट अवधि (30 दिन) के बाद भुगतान किया है, जिससे कोई
    विलंब शुल्क लगा हो?

    - **पॉलिसी अपडेट**: क्या आपने हाल ही में बीमित राशि में कोई बदलाव किया है?


    **समाधान:**

    यदि राशि अभी भी अस्पष्ट है, तो हमें विवरण प्रदान करें। हम आपके भुगतान इतिहास की
    जांच करेंगे। यदि कोई त्रुटि पाई जाती है, तो हम आंतरिक शिकायत अधिकारी के माध्यम
    से इसका समाधान करेंगे और सही राशि का समायोजन करेंगे।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: शुल्क पारदर्शिता बनाए रखने के लिए सभी प्रबंधन शुल्क पॉलिसी दस्तावेज़
    में स्पष्ट लिखे होते हैं।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c4d0508a-3380-5f95-9925-77f50cd46780
  title: अभय टर्म लाइफ कवर — आवश्यक दस्तावेज़
  body: 'अभय टर्म लाइफ कवर के लिए आवेदन करने हेतु निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    | दस्तावेज़ प्रकार | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | आयु प्रमाण (Age Proof) | अनिवार्य | पात्रता और प्रीमियम निर्धारण |

    | आय प्रमाण (Income Proof) | अनिवार्य | ₹10000000 की बीमित राशि की पुष्टि |

    | पहचान प्रमाण (KYC) | अनिवार्य | पॉलिसी जारी करने के लिए आवश्यक |

    | नामांकित व्यक्ति का विवरण | अनिवार्य | मृत्यु लाभ के भुगतान हेतु आवश्यक |

    | चिकित्सा रिपोर्ट | अंडरराइटर के आधार पर | जोखिम मूल्यांकन और स्वीकृति |'
  domain: insurance
  product_category: term_life_cover
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1e820e34-973b-54f1-9f98-38cde293fd31
  title: अभय टर्म लाइफ कवर — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'जब आप अभय टर्म लाइफ कवर की तुलना अन्य सामान्य बाजार पेशकशों से करते हैं,
    तो मुख्य अंतर सुरक्षा की लागत और पारदर्शिता में होता है।


    - **लागत**: हमारा वार्षिक प्रीमियम ₹12000 है, जो ₹10000000 के उच्च कवर के लिए
    अत्यधिक प्रतिस्पर्धी है।

    - **पारदर्शिता**: हम 15 दिनों की स्पष्ट फ्री-लुक अवधि और 30 दिनों की छूट अवधि
    प्रदान करते हैं, जबकि कई प्रतिस्पर्धी इन शर्तों को जटिल बनाते हैं।

    - **दृष्टिकोण**: अन्य उत्पाद अक्सर निवेश के साथ बीमा जोड़ते हैं, लेकिन हम शुद्ध
    सुरक्षा पर ध्यान केंद्रित करते हैं ताकि आप अधिकतम कवर प्राप्त कर सकें।


    यह उत्पाद उन लोगों के लिए श्रेष्ठ है जो बिना किसी अनावश्यक निवेश घटक के केवल उच्च
    जीवन सुरक्षा चाहते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c82bb7f0-5f8f-5d9e-995f-db25c88dfb72
  title: अभय टर्म लाइफ कवर — जोखिम प्रकटीकरण
  body: 'हम IRDAI के नियमों का सख्ती से पालन करते हैं और आपको निम्नलिखित जोखिमों के
    बारे में सूचित करते हैं:


    1. **शुद्ध सुरक्षा**: अभय टर्म लाइफ कवर एक शुद्ध सुरक्षा उत्पाद है। यदि पॉलिसी
    अवधि 30 वर्ष समाप्त हो जाती है और बीमित व्यक्ति जीवित रहता है, तो इस पॉलिसी के
    तहत कोई मैच्योरिटी लाभ या पैसा वापस नहीं मिलता है।

    2. **बहिष्करण (Exclusions)**: कुछ विशिष्ट स्थितियाँ या घटनाएँ ऐसी होती हैं जिनके
    लिए बीमा कंपनी दावा भुगतान नहीं करती है। कृपया अपने पॉलिसी दस्तावेज़ में ''बहिष्करण''
    अनुभाग ध्यान से पढ़ें।

    3. **दावा अस्वीकृति**: गलत जानकारी देने या महत्वपूर्ण तथ्यों को छिपाने पर दावे
    को अस्वीकार किया जा सकता है।

    4. **प्रीमियम चूक**: यदि ₹12000 के प्रीमियम का भुगतान 30 दिनों की छूट अवधि के
    बाद भी नहीं किया जाता है, तो सुरक्षा समाप्त हो जाएगी।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: इस उत्पाद को निवेश के रूप में नहीं, बल्कि वित्तीय सुरक्षा के रूप में
    देखा जाना चाहिए।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 2c134ae4-f290-578b-82a9-d330dec166e4
  title: अभय टर्म लाइफ कवर — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'अभय टर्म लाइफ कवर के लिए प्रीमियम दरें जोखिम मूल्यांकन और अंडरराइटिंग के
    आधार पर निर्धारित की जाती हैं।


    इस विशिष्ट प्लान के लिए, ₹10000000 की बीमित राशि के लिए एक निश्चित वार्षिक प्रीमियम
    ₹12000 लागू है। यह दर पॉलिसीधारक की आयु, स्वास्थ्य स्थिति और जीवनशैली के कारकों
    पर आधारित है।


    प्रीमियम में बदलाव केवल पॉलिसी के नवीनीकरण के समय या यदि पॉलिसी की शर्तों (जैसे
    बीमित राशि) में परिवर्तन किया जाता है, तभी संभव है। हम शुल्क पारदर्शिता सुनिश्चित
    करते हैं और सभी विवरण पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: rate_sheet
  source_authority: official
  placeholder: true
