  institution_id: abhaya_insurance
- id: b116b4c6-2a43-5563-8725-d17a7058d435
  title: अभय टर्म लाइफ कवर — छूट अवधि (दिन) की व्याख्या
  body: 'प्रश्न: छूट अवधि (Grace Period) क्या है?

    उत्तर: छूट अवधि वह अतिरिक्त समय है जो प्रीमियम की देय तिथि (due date) के बाद दिया
    जाता है ताकि आपकी पॉलिसी सक्रिय रहे।


    प्रश्न: अभय टर्म लाइफ कवर के लिए छूट अवधि कितने दिन की है?

    उत्तर: इस पॉलिसी के लिए छूट अवधि 30 दिन है। यदि आप देय तिथि के 30 दिन के भीतर
    अपना ₹12000 का वार्षिक प्रीमियम जमा कर देते हैं, तो आपकी सुरक्षा निरंतर बनी रहती
    है। इस अवधि के बाद, पॉलिसी लैप्स हो सकती है।'
  domain: insurance
  product_category: term_life_cover
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 39b505cb-deab-550e-b004-eac883324a8d
  title: अभय टर्म लाइफ कवर — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'नामांकित व्यक्ति (Nominee) को अपडेट करने के सामान्य अनुरोध को पूरा करने के
    लिए इन चरणों का पालन करें:


    1. हमें सूचित करें कि आप अपने नामांकित व्यक्ति का विवरण बदलना चाहते हैं।

    2. हम आपसे नए नामांकित व्यक्ति का पूरा नाम, उम्र, आपसे संबंध और पहचान प्रमाण मांगेंगे।

    3. हम आपकी पहचान की पुष्टि के लिए ओटीपी (OTP) आधारित प्रमाणीकरण प्रक्रिया पूरी
    करेंगे।

    4. विवरण प्राप्त करने के बाद, हम आपके अनुरोध को प्रोसेस करेंगे और पुष्टि करेंगे
    कि नया नामांकित व्यक्ति अब ₹10000000 की बीमित राशि प्राप्त करने के लिए अधिकृत
    है।

    5. अंत में, हम आपको एक अपडेटेड पॉलिसी सारांश भेजेंगे जिसमें नया विवरण अंकित होगा।


    इस प्रक्रिया के पूरा होने के बाद, आपका रिकॉर्ड हमारे सिस्टम में अपडेट हो जाएगा
    और आपको इसकी लिखित पुष्टि प्राप्त होगी।'
  domain: insurance
  product_category: term_life_cover
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 90726fcf-e127-5885-9a4d-55ecb9220e52
  title: अभय टर्म लाइफ कवर — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक को लगता है कि उनके द्वारा दिए गए विवरण (जैसे नाम, पता या नामांकित
    व्यक्ति) और पॉलिसी दस्तावेज़ में दर्ज विवरण अलग-अलग हैं।


    जांच के चरण:

    1. सबसे पहले, अपने पास मौजूद नवीनतम पॉलिसी दस्तावेज़ और हमारे द्वारा प्रदान किए
    गए डिजिटल सारांश की तुलना करें।

    2. जांचें कि क्या ₹12000 के प्रीमियम भुगतान के बाद कोई विवरण अपडेट अनुरोध किया
    गया था जो अभी लंबित है।

    3. यदि बीमित राशि (₹10000000) या पॉलिसी अवधि (30 वर्ष) में कोई त्रुटि दिखती है,
    तो इसे तुरंत रिपोर्ट करें।


    समाधान:

    - हमें सही दस्तावेज़ (जैसे आधार या पैन कार्ड) प्रदान करें।

    - हम बहु-स्तरीय पहचान सत्यापन के बाद विवरणों को संशोधित करेंगे।

    - यदि यह एक लिपिकीय त्रुटि है, तो हम इसे तुरंत ठीक कर एक संशोधित दस्तावेज़ जारी
    करेंगे।


    यदि समाधान में देरी होती है, तो मामला आंतरिक शिकायत अधिकारी को भेजा जाएगा और आप
    बीमा लोकपाल (Insurance Ombudsman) के पास भी जा सकते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: baab9845-167c-526f-9dbf-84cd5180f4fd
  title: परिवार स्वास्थ्य बीमा — सिंहावलोकन
  body: 'अभय इंश्योरेंस के ''परिवार स्वास्थ्य बीमा'' के साथ अपने प्रियजनों को व्यापक
    सुरक्षा प्रदान करें। हम मध्यम और उच्च-आय वाले परिवारों के लिए एक पारदर्शी और विश्वसनीय
    स्वास्थ्य समाधान पेश करते हैं, जो अस्पताल के खर्चों और रूम-रेंट के प्रबंधन में
    आपकी सहायता करता है।


    मुख्य विवरण:

    - कुल बीमा राशि: ₹500000

    - वार्षिक प्रीमियम: ₹9500

    - रूम रेंट लिमिट: बीमा राशि का 1%

    - प्रारंभिक प्रतीक्षा अवधि: 30 दिन

    - पूर्व-मौजूद बीमारियों के लिए प्रतीक्षा अवधि: 36 महीने


    हमारा लक्ष्य सरल प्रक्रियाओं के माध्यम से आपको मानसिक शांति प्रदान करना है। हम
    IRDAI के नियमों का सख्ती से पालन करते हैं ताकि आपकी सुरक्षा सुनिश्चित हो सके।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। हमारे सुझाव उत्पाद विवरणों
    पर आधारित होते हैं, जिन्हें निवेश के रूप में नहीं बल्कि सुरक्षा के रूप में देखा
    जाना चाहिए।

    ***'
  domain: insurance
  product_category: health_indemnity
