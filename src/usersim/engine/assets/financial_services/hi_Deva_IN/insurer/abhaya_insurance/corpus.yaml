- id: 4f4a3f69-4dce-5dc4-8390-9e7370ec1bd0
  title: परिवार स्वास्थ्य बीमा — विकल्पों से तुलना और कब न चुनें
  body: '''परिवार स्वास्थ्य बीमा'' एक पारदर्शी और नैतिक अंडरराइटिंग वाला उत्पाद है।
    इसकी तुलना अन्य विकल्पों से इस प्रकार की जा सकती है:


    - **किफायती सुरक्षा:** ₹9,500 के वार्षिक प्रीमियम पर ₹5,00,000 की बीमा राशि इसे
    मध्यम आय वाले परिवारों के लिए एक प्रतिस्पर्धी विकल्प बनाती है।

    - **स्पष्ट सीमाएँ:** रूम रेंट के लिए बीमा राशि का 1% का कैप स्पष्ट है, जिससे दावों
    के समय कोई भ्रम नहीं रहता।


    **इसे कब न चुनें:**

    - यदि आपको तत्काल (बिना किसी प्रतीक्षा अवधि के) पूर्व-मौजूद बीमारियों के लिए कवर
    चाहिए, तो यह उत्पाद उपयुक्त नहीं है क्योंकि यहाँ 36 महीने की प्रतीक्षा अवधि है।

    - यदि आप अस्पताल में केवल प्रीमियम सुइट्स (High-end suites) में रहना चाहते हैं,
    तो 1% की रूम रेंट सीमा आपके लिए पर्याप्त नहीं होगी।

    - यदि आप बीमा के साथ-साथ निवेश/धन सृजन भी चाहते हैं, तो आप ''ULIP वेल्थ प्लान
    — सिंहावलोकन'' पर विचार कर सकते हैं।


    ***

    **कानूनी डिस्क्लेमर:** हम व्यक्तिगत कर या कानूनी सलाहकार नहीं हैं; हमारा सुझाव
    उत्पाद विवरणों पर आधारित है।'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d567d1af-a250-56f2-96e6-af5e90752057
  title: परिवार स्वास्थ्य बीमा — बीमा राशि के प्रतिशत में कमरे के किराये की सीमा की
    व्याख्या
  body: 'प्रश्न: ''परिवार स्वास्थ्य बीमा'' में रूम रेंट कैप (Room Rent Cap) का क्या
    मतलब है?


    उत्तर: इसका मतलब है कि अस्पताल में कमरे के किराये के लिए हम आपकी कुल बीमा राशि
    का अधिकतम 1% ही कवर करेंगे। चूंकि आपकी बीमा राशि ₹5,00,000 है, इसलिए आपके कमरे
    का किराया अधिकतम ₹5,000 प्रति दिन तक ही सीमित होगा। यदि आप इससे महंगा कमरा चुनते
    हैं, तो अतिरिक्त लागत आपको वहन करनी होगी।'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1f6247d7-7928-5767-87f3-76f64651f4b7
  title: परिवार स्वास्थ्य बीमा — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'अपनी ''परिवार स्वास्थ्य बीमा'' पॉलिसी में नामांकित व्यक्ति (Nominee) को अपडेट
    करने की पूरी प्रक्रिया यहाँ दी गई है:


    1. हमें नामांकित व्यक्ति के परिवर्तन का अनुरोध भेजें और नए नामांकित व्यक्ति का
    पूरा नाम, उम्र और आपके साथ संबंध बताएं।

    2. हम आपसे नए नामांकित व्यक्ति का पहचान प्रमाण और पते का प्रमाण (जैसे आधार या
    पैन कार्ड) मांगेंगे; कृपया ये दस्तावेज़ हमें प्रदान करें।

    3. सुरक्षा के लिए, हम आपके पंजीकृत मोबाइल नंबर पर एक ओटीपी (OTP) भेजेंगे, जिसे
    आपको सत्यापित करना होगा।

    4. एक बार सत्यापन और दस्तावेज़ जांच पूरी हो जाने के बाद, हम आपके पॉलिसी रिकॉर्ड
    को अपडेट करेंगे।

    5. अंत में, हम आपको एक पुष्टिकरण संदेश भेजेंगे और संशोधित पॉलिसी दस्तावेज़ प्रदान
    करेंगे जिसमें नए नामांकित व्यक्ति का विवरण दर्ज होगा।


    इस प्रक्रिया के बाद आपकी पॉलिसी की सुरक्षा और नामांकित व्यक्ति की जानकारी पूरी
    तरह अपडेट हो जाएगी।'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d8f130b6-2258-5548-87de-1e19721303ce
  title: परिवार स्वास्थ्य बीमा — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको अपनी ''परिवार स्वास्थ्य बीमा'' पॉलिसी के विवरण (जैसे नाम की स्पेलिंग,
    पता या प्रीमियम राशि) में कोई अंतर दिखाई देता है, तो इन चरणों का पालन करें:


    **जांच के चरण:**

    1. अपने मूल पॉलिसी दस्तावेज़ की जांच करें और देखें कि क्या त्रुटि डेटा प्रविष्टि
    के समय हुई है।

    2. पुष्टि करें कि क्या आपने हाल ही में कोई बदलाव अनुरोध किया था जो अभी तक अपडेट
    नहीं हुआ है।


    **समाधान:**

    - हमें वह विवरण बताएं जो गलत है और साथ में सही विवरण वाला एक आधिकारिक दस्तावेज़
    (जैसे आधार या पासपोर्ट) साझा करें।

    - हम आपकी पहचान के लिए बहु-स्तरीय सत्यापन (OTP/बायोमेट्रिक) करेंगे।

    - सत्यापन के बाद, हम आंतरिक रूप से रिकॉर्ड अपडेट करेंगे और आपको 7-10 कार्य दिवसों
    के भीतर संशोधित विवरण भेजेंगे।


    **एस्केलेशन:**

    यदि विवरण सही नहीं किए जाते हैं, तो हम मामले को शिकायत अधिकारी को भेजेंगे ताकि
    यह सुनिश्चित हो सके कि IRDAI के नियमों के अनुसार आपकी जानकारी सटीक है।'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 2b62b95b-9155-5a79-a20a-c1b38435a85a
  title: ULIP वेल्थ प्लान — सिंहावलोकन
  body: 'अभय इंश्योरेंस का ULIP वेल्थ प्लान सुरक्षा और बाजार-आधारित धन सृजन का एक
    संतुलित मिश्रण है, जो विशेष रूप से मध्यम और उच्च-आय वाले परिवारों के लिए डिज़ाइन
    किया गया है। हम इस योजना के माध्यम से आपको जीवन बीमा का सुरक्षा कवच प्रदान करने
    के साथ-साथ आपके निवेश को बढ़ाने का अवसर देते हैं।


    इस योजना की मुख्य वित्तीय शर्तें निम्नलिखित हैं:

    - वार्षिक प्रीमियम: ₹50000

    - लॉक-इन अवधि: 5 वर्ष

    - प्रीमियम आवंटन शुल्क: 3%

    - फंड प्रबंधन शुल्क: 1.35%


    हमारा उद्देश्य सरल प्रक्रियाओं और नैतिक अंडरराइटिंग के माध्यम से आपको मानसिक शांति
    प्रदान करना है। यह उत्पाद उन लोगों के लिए आदर्श है जो लंबी अवधि के लिए निवेश करना
    चाहते हैं और साथ ही अपने परिवार का भविष्य सुरक्षित करना चाहते हैं।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। हमारे सुझाव उत्पाद विवरणों
    पर आधारित होते हैं, जिन्हें निवेश के रूप में नहीं बल्कि सुरक्षा के रूप में देखा
    जाना चाहिए।'
