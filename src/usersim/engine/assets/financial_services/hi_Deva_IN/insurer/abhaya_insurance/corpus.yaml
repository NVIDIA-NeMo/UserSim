- id: 1862afd8-6813-59dd-9c9c-734111d6b08e
  title: मोटर ओन-डैमेज कवर — वार्षिक प्रीमियम की व्याख्या
  body: 'प्रश्न: मोटर ओन-डैमेज कवर के लिए मुझे प्रति वर्ष कितना भुगतान करना होगा?

    उत्तर: इस पॉलिसी के लिए वार्षिक प्रीमियम ₹7500 है।


    प्रश्न: क्या इस प्रीमियम में कोई छूट उपलब्ध है?

    उत्तर: यदि आप पहले वर्ष में कोई दावा नहीं करते हैं, तो आप 20% के नो-क्लेम बोनस
    के पात्र हो सकते हैं।


    अधिक जानकारी के लिए कृपया ''मोटर ओन-डैमेज कवर — शुल्क अनुसूची'' देखें।'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 234d5c7e-01f0-5abb-974a-cf3c3a3a40d2
  title: मोटर ओन-डैमेज कवर — सेटअप और सक्रियण
  body: 'अपने वाहन के लिए मोटर ओन-डैमेज कवर सक्रिय करने के लिए इन चरणों का पालन करें:


    1. हमें अपने वाहन का पंजीकरण विवरण (RC), ड्राइविंग लाइसेंस और वाहन की वर्तमान
    स्थिति की तस्वीरें प्रदान करें।

    2. हम आपके वाहन का भौतिक या डिजिटल निरीक्षण करेंगे ताकि उसकी वर्तमान स्थिति का
    आकलन किया जा सके।

    3. हम आपको ₹7500 का अंतिम वार्षिक प्रीमियम उद्धृत करेंगे, जिसकी आप पुष्टि करेंगे।

    4. प्रीमियम का भुगतान करें। भुगतान सफल होने के बाद, हम आपको आपका पॉलिसी दस्तावेज़
    ईमेल के माध्यम से भेजेंगे।

    5. पॉलिसी दस्तावेज़ प्राप्त होने पर, आप फ्री-लुक अवधि का उपयोग करके शर्तों की
    समीक्षा कर सकते हैं।


    एक बार पॉलिसी दस्तावेज़ प्राप्त हो जाने और भुगतान सत्यापित हो जाने के बाद, आपका
    कवर सक्रिय माना जाता है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 26067915-7d22-5438-824a-b6064d4cfa9b
  title: मोटर ओन-डैमेज कवर — शुल्क अनुसूची
  body: 'मोटर ओन-डैमेज कवर के लिए लागू शुल्क निम्नलिखित हैं:


    - वार्षिक प्रीमियम: ₹7500

    - अनिवार्य कटौती योग्य राशि (Compulsory Deductible): ₹1000 (प्रत्येक दावे के समय
    देय)


    हम पारदर्शिता बनाए रखने के लिए प्रतिबद्ध हैं; सभी प्रबंधन शुल्क और आवंटन आपके
    पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखे गए हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 9416c80e-117d-5179-97dc-086d4fe2a007
  title: मोटर ओन-डैमेज कवर — विफल या लंबित कार्रवाई
  body: 'यदि आपका पॉलिसी सक्रियण या दावा अनुरोध लंबित है, तो कृपया निम्नलिखित की जांच
    करें:


    लक्षण: ''पॉलिसी सक्रिय नहीं हुई'' या ''दावा लंबित'' संदेश।


    संभावित कारण और समाधान:

    1. अधूरा दस्तावेजीकरण: जांचें कि क्या आपने वाहन की RC और वैध ड्राइविंग लाइसेंस
    जमा किया है। यदि नहीं, तो हमें ये दस्तावेज़ प्रदान करें।

    2. भुगतान विफलता: सुनिश्चित करें कि ₹7500 का प्रीमियम सफलतापूर्वक डेबिट हो गया
    है।

    3. सत्यापन लंबित: संवेदनशील जानकारी के लिए ओटीपी (OTP) आधारित प्रमाणीकरण पूरा
    करें।


    यदि समस्या बनी रहती है, तो हम आपके मामले को आंतरिक शिकायत अधिकारी के पास भेजेंगे।
    यदि वहां समाधान नहीं होता है, तो आप बीमा लोकपाल (Insurance Ombudsman) से संपर्क
    कर सकते हैं। दावा निपटान की हमारी मानक समय सीमा 30 दिन है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 0cb0c41b-60b4-5354-95be-16c91a2c5ee0
  title: मोटर ओन-डैमेज कवर — पात्रता शर्तें
  body: 'पात्रता मानदंड और परिणाम:


    - वैध वाहन पंजीकरण (RC) और ड्राइविंग लाइसेंस: पॉलिसी जारी करने के लिए अनिवार्य।

    - वाहन का सफल निरीक्षण: कवर सक्रियण के लिए आवश्यक।

    - प्रीमियम भुगतान (₹7500): पॉलिसी की शुरुआत के लिए अनिवार्य।

    - नामांकित व्यक्ति (Nominee) की जानकारी: अनिवार्य (IRDAI नियमों के अनुसार)।'
  domain: insurance
  product_category: motor_own_damage
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: b46dcd8d-2c26-512e-9744-8b64744012e8
  title: मोटर ओन-डैमेज कवर — यहाँ के समान उत्पाद से तुलना
  body: 'हमारा मोटर ओन-डैमेज कवर शुद्ध वाहन सुरक्षा पर केंद्रित है, जबकि अन्य व्यापक
    योजनाएं तीसरे पक्ष (Third-party) के दायित्वों को जोड़ सकती हैं।


    मुख्य अंतर:

    - लागत: हमारा वार्षिक प्रीमियम ₹7500 है और हम पहले वर्ष में 20% नो-क्लेम बोनस
    प्रदान करते हैं।

    - दावा प्रक्रिया: हम 30 दिन की निश्चित दावा निपटान समय सीमा का पालन करते हैं।

    - कटौती: इसमें ₹1000 की अनिवार्य कटौती योग्य राशि शामिल है।


    यह उत्पाद उन ग्राहकों के लिए सबसे उपयुक्त है जो अपने स्वयं के वाहन के नुकसान के
    लिए एक पारदर्शी और त्वरित निपटान प्रक्रिया चाहते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 69cd9619-1d42-5f6c-977c-2b18fca9b2cf
  title: मोटर ओन-डैमेज कवर — नियामक प्रकटीकरण
  body: 'अभय इंश्योरेंस IRDAI के सभी दिशा-निर्देशों का सख्ती से पालन करता है। हम पुष्टि
    करते हैं कि इस पॉलिसी में फ्री-लुक अवधि, प्रतीक्षा अवधि और बहिष्करणों (Exclusions)
    का पूर्ण खुलासा किया गया है।


    महत्वपूर्ण नियामक विवरण:

    - प्रीमियम: वार्षिक प्रीमियम ₹7500 है।

    - कटौती योग्य: प्रत्येक दावे पर ₹1000 की अनिवार्य कटौती लागू होगी।

    - दावा समय सीमा: दावे की सूचना से निपटान तक की प्रक्रिया अधिकतम 30 दिनों में पूरी
    की जाएगी।

    - डेटा सुरक्षा: हम बहु-स्तरीय पहचान सत्यापन और ओटीपी आधारित प्रमाणीकरण का उपयोग
    करते हैं।


    ***

    कानूनी डिस्क्लेमर: हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन व्यक्तिगत
    कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं। सभी दावों की निष्पक्ष जांच
    की जाती है और धोखाधड़ी के प्रति हमारी शून्य-सहनशीलता की नीति है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 84c1f0a7-daec-5d58-9cba-799aac92112c
  title: मोटर ओन-डैमेज कवर — ब्याज दर अनुसूची
  body: 'मोटर ओन-डैमेज कवर एक शुद्ध सुरक्षा उत्पाद है, इसलिए इसमें कोई निवेश ब्याज
    दर लागू नहीं होती है।


    लागू दरें:

    - वार्षिक प्रीमियम दर: सभी पात्र वाहनों के लिए ₹7500 का फ्लैट प्रीमियम लागू है।

    - नो-क्लेम बोनस (NCB): पहले वर्ष के लिए 20% की दर से लागू होता है यदि कोई दावा
    नहीं किया गया हो।


    यह प्रीमियम जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए उपयोग किया जाता
    है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c7ab31f2-8378-5812-9cd5-4dbdf2fc06c6
  title: मोटर ओन-डैमेज कवर — वर्तमान ऑफर
  body: 'मौजूदा ग्राहकों के लिए विशेष ऑफर!


    यदि आप अपनी पॉलिसी का नवीनीकरण समय पर करते हैं और पिछले वर्ष कोई दावा नहीं किया
    है, तो आप अपने ₹7500 के वार्षिक प्रीमियम पर 20% नो-क्लेम बोनस का लाभ उठा सकते
    हैं।


    यह ऑफर नवीनीकरण तिथि से 15 दिनों तक वैध है। कृपया विवरणों की पुष्टि के लिए अपने
    पॉलिसी दस्तावेज़ की जांच करें।'
  domain: insurance
  product_category: motor_own_damage
  document_type: promo_notice
