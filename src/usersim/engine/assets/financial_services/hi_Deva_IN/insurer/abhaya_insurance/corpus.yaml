  institution_id: abhaya_insurance
- id: e2139043-1714-5ae3-9f43-aa2aa65b1691
  title: अभय टर्म लाइफ कवर — वर्तमान ऑफर
  body: "मौजूदा ग्राहकों के लिए विशेष सूचना: यदि आप अपने परिवार के लिए अतिरिक्त सुरक्षा\
    \ बढ़ाना चाहते हैं, तो हम वर्तमान में अपने मौजूदा पॉलिसीधारकों को प्राथमिकता दे\
    \ रहे हैं। \n\nआप अपनी ₹10000000 की बीमित राशि के साथ अन्य सदस्यों के लिए नए कवर\
    \ जोड़ने पर विशेष सुविधा प्राप्त कर सकते हैं। कृपया विवरण के लिए अपने समर्पित\
    \ सलाहकार से बात करें। यह ऑफर केवल सीमित समय के लिए उपलब्ध है।"
  domain: insurance
  product_category: term_life_cover
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1bb0807b-30a9-591a-9793-f8aeac9f654c
  title: अभय टर्म लाइफ कवर — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'हम अभय इंश्योरेंस में आपकी सुरक्षा को प्राथमिकता देते हैं। अभय टर्म लाइफ
    कवर के ग्राहकों को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ जालसाज खुद को हमारा
    प्रतिनिधि बताकर पॉलिसी के ''मैच्योरिटी लाभ'' या ''प्रीमियम रिफंड'' का लालच देते
    हैं, जबकि यह एक शुद्ध सुरक्षा प्लान है।


    कृपया ध्यान दें कि हम आपसे कभी भी आपका ओटीपी (OTP), पासवर्ड या बायोमेट्रिक डेटा
    फोन या ईमेल पर साझा करने के लिए नहीं कहेंगे। किसी भी पॉलिसी बदलाव या भुगतान से
    पहले बहु-स्तरीय पहचान सत्यापन अनिवार्य है। यदि आपको कोई संदिग्ध कॉल या संदेश प्राप्त
    होता है, तो तुरंत हमें सूचित करें। किसी भी अनधिकृत गतिविधि की रिपोर्ट करने के
    लिए जितनी जल्दी हो सके हमसे संपर्क करें ताकि हम आपके खाते को सुरक्षित कर सकें।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: हम धोखाधड़ी के प्रति शून्य-सहनशीलता की नीति अपनाते हैं और सभी संदिग्ध
    दावों की निष्पक्ष जांच करते हैं।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: security_advisory
