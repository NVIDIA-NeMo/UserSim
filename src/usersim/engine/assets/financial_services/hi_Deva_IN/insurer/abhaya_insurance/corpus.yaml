  institution_id: abhaya_insurance
- id: cb08270e-b821-5dd3-a8d2-840a5777409b
  title: परिवार स्वास्थ्य बीमा — श्रेणियों या विकल्पों में से चुनाव
  body: "यदि आप सुरक्षा विकल्पों पर विचार कर रहे हैं, तो परिवार स्वास्थ्य बीमा ₹5,00,000\
    \ की बीमित राशि और ₹9,500 के वार्षिक प्रीमियम के साथ व्यापक पारिवारिक कवरेज प्रदान\
    \ करता है। \n\nयह उन लोगों के लिए सबसे उपयुक्त है जो अस्पताल के खर्चों और रूम-रेंट\
    \ लिमिट (बीमा राशि का 1%) का प्रबंधन करना चाहते हैं। यदि आप केवल जीवन सुरक्षा\
    \ की तलाश में हैं, तो 'अभय टर्म लाइफ कवर — सिंहावलोकन' एक बेहतर विकल्प हो सकता\
    \ है। हम सुरक्षा और मानसिक शांति के लिए इस स्वास्थ्य योजना की अनुशंसा करते हैं।"
  domain: insurance
  product_category: health_indemnity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 43e576c2-4559-526f-b940-6231bc25b85f
  title: परिवार स्वास्थ्य बीमा — गोपनीयता और डेटा प्रबंधन
  body: 'अभय इंश्योरेंस आपकी गोपनीयता और डेटा की सुरक्षा के लिए प्रतिबद्ध है। हम IRDAI
    के नियमों का सख्ती से पालन करते हैं।


    डेटा प्रबंधन विवरण:

    1. संग्रहण: हम केवल पॉलिसी जारी करने, दावों के निपटान और नियामक रिपोर्टिंग के
    लिए आवश्यक व्यक्तिगत और चिकित्सा जानकारी एकत्र करते हैं।

    2. सत्यापन: किसी भी संवेदनशील जानकारी के साझाकरण या पॉलिसी बदलाव से पहले बायोमेट्रिक
    या ओटीपी (OTP) आधारित प्रमाणीकरण अनिवार्य है।

    3. नामांकित व्यक्ति (Nominee): नामांकित व्यक्ति की जानकारी का संग्रहण हमारी सर्वोच्च
    प्राथमिकता है ताकि मृत्यु या अक्षमता की स्थिति में बीमा राशि का सही वितरण सुनिश्चित
    हो सके।

    4. गोपनीयता: आपका डेटा किसी तीसरे पक्ष को तब तक साझा नहीं किया जाता जब तक कि वह
    दावा सत्यापन या कानूनी आवश्यकताओं के लिए आवश्यक न हो।


    हम डेटा गोपनीयता के उच्चतम मानकों को बनाए रखते हैं ताकि आपको पूर्ण मानसिक शांति
    मिले।'
  domain: insurance
  product_category: health_indemnity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 6be250bb-a7d6-5747-8fac-fc560b619464
  title: परिवार स्वास्थ्य बीमा — इस उत्पाद को निशाना बनाने वाले स्कैम की पहचान
  body: 'हम अपने ग्राहकों को ''परिवार स्वास्थ्य बीमा'' से जुड़े संभावित घोटालों के
    प्रति सतर्क करना चाहते हैं। कुछ जालसाज आपको कॉल या ईमेल करके यह दावा कर सकते हैं
    कि आपकी ₹5,00,000 की बीमा राशि (Sum Insured) को बिना किसी अतिरिक्त शुल्क के बढ़ाया
    जा सकता है, बशर्ते आप उन्हें अपना ओटीपी (OTP) या बैंक विवरण दें।


    कृपया ध्यान दें कि अभय इंश्योरेंस कभी भी आपसे फोन पर आपका पासवर्ड, पिन या ओटीपी
    नहीं मांगेगा। हम किसी भी पॉलिसी बदलाव के लिए बहु-स्तरीय पहचान सत्यापन का पालन
    करते हैं। यदि कोई व्यक्ति आपसे दावा राशि को जल्दी जारी करने के लिए ''प्रोसेसिंग
    शुल्क'' के रूप में अग्रिम भुगतान की मांग करता है, तो यह एक स्कैम है।


    यदि आपको कोई संदिग्ध गतिविधि दिखाई देती है, तो तुरंत हमें सूचित करें। सुरक्षा
    के लिए हम बायोमेट्रिक या ओटीपी आधारित प्रमाणीकरण का उपयोग करते हैं। किसी भी अनधिकृत
    एक्सेस की रिपोर्ट जितनी जल्दी हो सके करें ताकि हम आपके डेटा की गोपनीयता सुनिश्चित
    कर सकें।


    ***

    **कानूनी डिस्क्लेमर:** यह सुरक्षा सलाह केवल जागरूकता के लिए है। हम व्यक्तिगत कानूनी
    सलाह नहीं देते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: security_advisory
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 963b647e-551c-525c-befe-06b3b06d9de5
  title: परिवार स्वास्थ्य बीमा — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ
  body: "एक सहायता एजेंट के रूप में, ग्राहकों को 'परिवार स्वास्थ्य बीमा' की निम्नलिखित\
    \ सीमाओं और प्रतिबंधों के बारे में स्पष्ट रूप से सूचित करें:\n\n1. **बीमा राशि\
    \ और रूम रेंट:** इस प्लान की कुल बीमा राशि ₹5,00,000 है। अस्पताल में भर्ती होने\
    \ के दौरान, रूम रेंट की सीमा बीमा राशि के 1% तक सीमित है।\n2. **प्रतीक्षा अवधियाँ:**\
    \ \n   - पॉलिसी शुरू होने के बाद पहले 30 दिनों की प्रारंभिक प्रतीक्षा अवधि होती\
    \ है, जिसमें सामान्य बीमारियाँ कवर नहीं होती हैं।\n   - पूर्व-मौजूद बीमारियों\
    \ (Pre-existing diseases) के लिए 36 महीने की प्रतीक्षा अवधि लागू है।\n3. **बहिष्करण\
    \ (Exclusions):** पॉलिसी दस्तावेज़ में वर्णित विशिष्ट स्थितियाँ, जैसे कि जानबूझकर\
    \ स्वयं को पहुंचाई गई चोट या कुछ कॉस्मेटिक सर्जरी, कवर नहीं की जाती हैं।\n4. **प्रीमियम:**\
    \ इस सुरक्षा के लिए वार्षिक प्रीमियम ₹9,500 निर्धारित है।\n\nहमारा उद्देश्य पूर्ण\
    \ पारदर्शिता सुनिश्चित करना है ताकि ग्राहक अपनी सुरक्षा योजना को सही ढंग से समझ\
    \ सकें।\n\n***\n**कानूनी डिस्क्लेमर:** सभी विवरण पॉलिसी दस्तावेज़ के अधीन हैं।\
    \ इसे निवेश के बजाय सुरक्षा के रूप में देखा जाना चाहिए।"
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
