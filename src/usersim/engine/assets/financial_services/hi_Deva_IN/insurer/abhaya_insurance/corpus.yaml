- id: eaf0a62d-722c-5bd5-82a1-4ddeafa0441a
  title: pay_premium का उपयोग कब करें
  body: 'प्रीमियम का समय पर भुगतान पॉलिसी की निरंतरता सुनिश्चित करने के लिए आवश्यक
    है। जब ग्राहक अपना प्रीमियम भुगतान करना चाहता है, तो एजेंट को निम्नलिखित कदम उठाने
    चाहिए:


    1. ग्राहक की पहचान सत्यापित करें और `get_policy_details` के माध्यम से देय प्रीमियम
    राशि की पुष्टि करें।

    2. ग्राहक को भुगतान राशि और देय तिथि के बारे में स्पष्ट रूप से बताएं।

    3. भुगतान विधि की पुष्टि करने के बाद, `pay_premium` टूल का उपयोग करके लेनदेन प्रक्रिया
    शुरू करें।

    4. सफल भुगतान के बाद, ग्राहक को पुष्टिकरण संदेश भेजें और उन्हें रसीद प्राप्त करने
    का तरीका बताएं।


    हम यह सुनिश्चित करते हैं कि सभी प्रीमियम लेनदेन पारदर्शी हों और शुल्क पॉलिसी दस्तावेज़
    के अनुसार ही लिए जाएं।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - pay_premium
  institution_id: abhaya_insurance
- id: 17a37019-38c9-5995-88d2-7081a842044f
  title: pay_premium टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक की बीमा पॉलिसी के लिए प्रीमियम भुगतान प्रक्रिया को
    निष्पादित करने की अनुमति देता है। एजेंट इस कार्रवाई को सीधे pay_premium टूल को
    कॉल करके पूरा करता है।


    **तर्क (Arguments):**

    - policy_id: वह विशिष्ट पहचानकर्ता जिसके लिए भुगतान किया जाना है।

    - amount: भुगतान की जाने वाली सटीक राशि (₹ में)।

    - payment_method: भुगतान का माध्यम।


    **प्रभाव:** यह टूल निर्दिष्ट पॉलिसी के लिए प्रीमियम राशि को प्रोसेस करता है और
    भुगतान की स्थिति को अपडेट करता है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
