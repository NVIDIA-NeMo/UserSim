- id: e027d6e7-42d7-52e7-a5bb-785fb9483103
  title: परिवार स्वास्थ्य बीमा — ब्याज दर अनुसूची
  body: 'कृपया ध्यान दें कि ''परिवार स्वास्थ्य बीमा'' एक क्षतिपूर्ति (indemnity) आधारित
    स्वास्थ्य उत्पाद है, न कि कोई निवेश उत्पाद। इसलिए, इस पर कोई ब्याज दर या निवेश
    रिटर्न लागू नहीं होता है।


    इस उत्पाद के लिए एकमात्र निश्चित वित्तीय दर आपका वार्षिक प्रीमियम है, जो ₹9500
    है। यह प्रीमियम आपके जोखिम प्रबंधन और हमारी परिचालन लागतों को कवर करता है।'
