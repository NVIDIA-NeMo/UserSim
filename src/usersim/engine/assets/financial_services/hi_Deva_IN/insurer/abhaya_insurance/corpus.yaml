- id: 3a9cb244-b876-5ecd-a08a-746921a3870b
  title: ULIP वेल्थ प्लान — लॉक-इन अवधि (वर्ष) की व्याख्या
  body: 'प्रश्न: ULIP वेल्थ प्लान में लॉक-इन अवधि क्या है और यह कैसे काम करती है?

    उत्तर: इस योजना में 5 वर्ष की लॉक-इन अवधि होती है। इसका अर्थ है कि पॉलिसी शुरू
    होने की तारीख से पहले 5 वर्ष तक आप अपने फंड की निकासी या सरेंडर नहीं कर सकते।
    यह अवधि नियामक आवश्यकताओं के अनुसार है ताकि दीर्घकालिक सुरक्षा और धन सृजन सुनिश्चित
    हो सके।


    प्रश्न: क्या मैं लॉक-इन अवधि समाप्त होने से पहले पॉलिसी बंद कर सकता हूँ?

    उत्तर: नहीं, 5 वर्ष की अवधि पूरी होने से पहले फंड निकासी संभव नहीं है, हालांकि
    पॉलिसीधारक की मृत्यु की स्थिति में नामांकित व्यक्ति को लाभ प्राप्त होता है।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8df1377d-f004-5a0e-adcc-cdfd35f081dd
  title: ULIP वेल्थ प्लान — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपने ULIP वेल्थ प्लान को रद्द करना या बंद करना चाहते हैं, तो कृपया
    इन चरणों का पालन करें:


    1. पात्रता जांचें: सबसे पहले यह सुनिश्चित करें कि आपकी 5 वर्ष की लॉक-इन अवधि पूरी
    हो चुकी है। यदि आप फ्री-लुक अवधि के भीतर हैं, तो आप बिना किसी लॉक-इन के रद्द कर
    सकते हैं।

    2. अनुरोध प्रस्तुत करें: हमें अपना पॉलिसी नंबर और रद्दीकरण का कारण बताएं।

    3. पहचान सत्यापन: हम आपकी पहचान की पुष्टि के लिए ओटीपी (OTP) या बायोमेट्रिक सत्यापन
    प्रक्रिया पूरी करेंगे।

    4. दस्तावेज़ जमा करें: अपनी पहचान का प्रमाण और बैंक विवरण (रिफंड के लिए) प्रदान
    करें।

    5. पुष्टि प्राप्त करें: सत्यापन और प्रोसेसिंग के बाद, हम आपको रद्दीकरण की पुष्टि
    और देय राशि का विवरण ईमेल या संदेश के माध्यम से भेजेंगे।


    डाउनग्रेड करने के लिए, आप हमें अपने वार्षिक प्रीमियम को कम करने का अनुरोध कर सकते
    हैं, बशर्ते वह उत्पाद की न्यूनतम सीमा के भीतर हो।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 3ae3ad6f-1791-5c2a-93e4-9281f37965a9
  title: ULIP वेल्थ प्लान — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने फंड स्टेटमेंट में कोई ऐसी राशि या शुल्क दिखता है जिसकी आप अपेक्षा
    नहीं कर रहे थे, तो कृपया निम्नलिखित चरणों का पालन करें:


    1. शुल्क की पहचान करें: जांचें कि क्या यह 3% प्रीमियम आवंटन शुल्क है (जो प्रीमियम
    भुगतान के समय काटा जाता है) या 1.35% का वार्षिक फंड प्रबंधन शुल्क है।

    2. गणना का मिलान करें: अपने ₹50000 के वार्षिक प्रीमियम के आधार पर शुल्क की गणना
    करें।

    3. विवरण मांगें: यदि राशि फिर भी अस्पष्ट है, तो हमसे विस्तृत शुल्क विवरण (break-up)
    मांगें।

    4. समाधान: यदि हमारी गणना में कोई त्रुटि पाई जाती है, तो हम इसे सुधारेंगे और अंतर
    की राशि आपके फंड में वापस जमा करेंगे।


    यदि विवाद बना रहता है, तो हम इसे आंतरिक शिकायत अधिकारी और फिर बीमा लोकपाल (Insurance
    Ombudsman) के पास भेजने की प्रक्रिया शुरू करेंगे।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a3e621ab-9e4f-5d5d-8ff5-25309b7a0c03
  title: ULIP वेल्थ प्लान — आवश्यक दस्तावेज़
  body: 'ULIP वेल्थ प्लान के लिए आवेदन करते समय निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पहचान प्रमाण (KYC): आधार कार्ड / पैन कार्ड -> अनिवार्य

    - आय प्रमाण: वेतन पर्ची / आईटीआर (₹50000 वार्षिक प्रीमियम के सत्यापन के लिए) ->
    अनिवार्य

    - बैंक विवरण: रद्द किया गया चेक / पासबुक (ऑटो-डेबिट के लिए) -> अनिवार्य

    - नामांकित व्यक्ति का विवरण: नाम और संबंध -> अनिवार्य

    - आयु प्रमाण: जन्म प्रमाण पत्र / पासपोर्ट -> अनिवार्य'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: eligibility_matrix
  source_authority: official
