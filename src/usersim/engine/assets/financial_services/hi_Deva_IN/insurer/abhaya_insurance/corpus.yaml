- id: 3b23a44d-d40d-5f59-981a-54e38d3950f4
  title: open_account का उपयोग कब करें
  body: 'जब कोई नया ग्राहक अभय इंश्योरेंस के साथ सुरक्षा यात्रा शुरू करना चाहता है
    या कोई मौजूदा ग्राहक एक नया उत्पाद (जैसे अभय टर्म लाइफ कवर या परिवार स्वास्थ्य
    बीमा) लेना चाहता है, तब इस प्रक्रिया का पालन करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक की पात्रता की जांच करें और उन्हें उत्पाद के लाभों के बारे में शिक्षित
    करें।

    2. आवश्यक केवाईसी (KYC) दस्तावेज़ और नामांकित व्यक्ति (nominee) की अनिवार्य जानकारी
    एकत्र करें।

    3. ग्राहक की पहचान का बहु-स्तरीय सत्यापन (OTP या बायोमेट्रिक) पूरा करें।

    4. नया बीमा खाता बनाने और पॉलिसी जारी करने के लिए open_account टूल का उपयोग करें।

    5. सफल खाता निर्माण के बाद, ग्राहक को उनके पॉलिसी दस्तावेज़ और शर्तों की जानकारी
    प्रदान करें।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: abhaya_insurance
- id: 5f31b9a4-a8d4-5835-a5c9-3e2d369732f9
  title: open_account टूल संदर्भ
  body: 'यह टूल एजेंट को अभय इंश्योरेंस के भीतर एक नया बीमा खाता या पॉलिसी खोलने की
    अनुमति देता है। एजेंट इस प्रक्रिया को सीधे open_account टूल को कॉल करके पूरा करता
    है।


    **तर्क (Arguments):**

    - customer_details: ग्राहक की व्यक्तिगत और संपर्क जानकारी।

    - product_id: चयनित उत्पाद का आईडी (जैसे ''term_life_cover'' या ''health_indemnity'')।

    - nominee_details: नामांकित व्यक्ति की आवश्यक जानकारी।

    - premium_amount: प्रारंभिक प्रीमियम राशि।


    **प्रभाव:** एक नया पॉलिसी खाता बनाया जाता है और ग्राहक को एक विशिष्ट पॉलिसी आईडी
    आवंटित की जाती है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - open_account
  institution_id: abhaya_insurance
- id: 02932025-0f7c-5c84-91bf-8d8ef7e719e1
  title: close_account का उपयोग कब करें
  body: 'जब कोई ग्राहक अपनी पॉलिसी को स्थायी रूप से समाप्त करना चाहता है या फ्री-लुक
    अवधि (Free-look Period) के दौरान पॉलिसी रद्द करना चाहता है, तब इस प्रक्रिया का
    उपयोग किया जाता है। कृपया ध्यान दें कि यह एक अपरिवर्तनीय क्रिया है।


    **प्रक्रिया के चरण:**

    1. ग्राहक के अनुरोध को दर्ज करें और उनके निर्णय का कारण समझें।

    2. ग्राहक की पहचान का सख्त सत्यापन करें ताकि अनधिकृत रद्दीकरण को रोका जा सके।

    3. यदि लागू हो, तो सरेंडर वैल्यू या रिफंड राशि की गणना करें।

    4. खाते को स्थायी रूप से बंद करने के लिए close_account टूल का उपयोग करें।

    5. ग्राहक को रद्दीकरण की पुष्टि और अगले चरणों के बारे में सूचित करें।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: abhaya_insurance
- id: 2bb81bd7-e3fe-5ac1-a23c-cf1c1680c0af
  title: close_account टूल संदर्भ
  body: 'यह टूल एजेंट को किसी मौजूदा बीमा खाते या पॉलिसी को स्थायी रूप से बंद करने
    की अनुमति देता है। एजेंट इस कार्रवाई को सीधे close_account टूल को कॉल करके निष्पादित
    करता है।


    **तर्क (Arguments):**

    - account_id: बंद किए जाने वाले खाते की विशिष्ट आईडी।

    - reason_for_closure: खाता बंद करने का कारण।


    **प्रभाव:** यह क्रिया अपरिवर्तनीय है। यह पॉलिसी को समाप्त कर देता है और संबंधित
    सभी कवर और लाभों को रोक देता है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - close_account
  institution_id: abhaya_insurance
- id: 9bd501ba-7d50-5d01-b3ba-3656ea2846f3
  title: update_contact_info का उपयोग कब करें
  body: 'पॉलिसीधारक के संपर्क विवरण जैसे मोबाइल नंबर, ईमेल पता या आवासीय पता बदलने
    के अनुरोध पर इस प्रक्रिया का उपयोग किया जाता है ताकि संचार निर्बाध बना रहे।


    **प्रक्रिया के चरण:**

    1. ग्राहक से वह नया विवरण मांगें जिसे वे अपडेट करना चाहते हैं।

    2. सुरक्षा प्रोटोकॉल के अनुसार, बहु-स्तरीय पहचान सत्यापन (जैसे OTP आधारित प्रमाणीकरण)
    पूरा करें।

    3. अपडेट किए जाने वाले सटीक विवरणों की दोबारा पुष्टि करें।

    4. ग्राहक के रिकॉर्ड में संपर्क जानकारी को संशोधित करने के लिए update_contact_info
    टूल का उपयोग करें।

    5. सफल अपडेट के बाद ग्राहक को पुष्टिकरण संदेश भेजें।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: abhaya_insurance
- id: 4fd40aef-3153-5379-a081-1c649ca969e0
  title: update_contact_info टूल संदर्भ
  body: 'यह टूल एजेंट को ग्राहक के पंजीकृत संपर्क विवरणों को अपडेट करने की अनुमति
    देता है। एजेंट इस कार्य को सीधे update_contact_info टूल कॉल करके पूरा करता है।


    **तर्क (Arguments):**

    - customer_id: ग्राहक की विशिष्ट पहचान संख्या।

    - updated_fields: उन क्षेत्रों की सूची जिन्हें बदला जाना है (जैसे ''email'', ''phone_number'',
    ''address'')।


    **प्रभाव:** ग्राहक का प्रोफाइल डेटा अपडेट हो जाता है, जिससे भविष्य के सभी संचार
    नए विवरणों पर भेजे जाते हैं।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - update_contact_info
  institution_id: abhaya_insurance
- id: 93939946-a612-586f-9a09-78edfed0f1b2
  title: get_statements का उपयोग कब करें
  body: 'जब ग्राहक अपने प्रीमियम भुगतान का इतिहास, टैक्स प्रमाणन या अपने निवेश (जैसे
    ULIP वेल्थ प्लान के मामले में) की वर्तमान स्थिति देखना चाहते हैं, तब इस प्रक्रिया
    का उपयोग करें।


    **प्रक्रिया के चरण:**

    1. ग्राहक से अनुरोधित विवरण (जैसे वार्षिक स्टेटमेंट या विशिष्ट अवधि का विवरण)
    पूछें।

    2. ग्राहक की पहचान सत्यापित करें।

    3. यदि ग्राहक के पास कई खाते हैं, तो get_accounts का उपयोग करके सही पॉलिसी आईडी
    की पहचान करें।

    4. संबंधित अवधि के लिए आधिकारिक विवरण उत्पन्न करने के लिए get_statements टूल का
    उपयोग करें।

    5. स्टेटमेंट को ग्राहक के पंजीकृत ईमेल पर भेजें या उन्हें डिजिटल पोर्टल के माध्यम
    से एक्सेस करने का तरीका बताएं।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_statements
  institution_id: abhaya_insurance
- id: 47899a0c-cc19-541f-8daa-03a593164d79
  title: get_statements टूल संदर्भ
  body: "यह टूल एजेंट को ग्राहक के पॉलिसी खातों के लिए आधिकारिक विवरण या स्टेटमेंट\
    \ प्राप्त करने की अनुमति देता है। एजेंट इस क्रिया को सीधे get_statements टूल को\
    \ कॉल करके निष्पादित करता है। \n\n**सिग्नेचर:** `get_statements(account_id: string,\
    \ statement_type: string, period: string)`\n**तर्क (Args):** \n- `account_id`:\
    \ ग्राहक के खाते की विशिष्ट पहचान संख्या।\n- `statement_type`: विवरण का प्रकार\
    \ (जैसे वार्षिक, त्रैमासिक)।\n- `period`: वह समय सीमा जिसके लिए विवरण आवश्यक है।\n\
    **प्रभाव:** यह टूल निर्दिष्ट खाते के लिए वित्तीय लेनदेन और पॉलिसी स्थिति का विस्तृत\
    \ विवरण प्रदान करता है।"
  domain: insurance
  product_category: procedure
