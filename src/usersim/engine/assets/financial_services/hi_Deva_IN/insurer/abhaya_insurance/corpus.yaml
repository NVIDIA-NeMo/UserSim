  institution_id: abhaya_insurance
- id: af893f59-af3e-5337-9ded-1f2d90dcaa80
  title: मोटर ओन-डैमेज कवर — अनिवार्य कटौती योग्य राशि की व्याख्या
  body: 'प्रश्न: मोटर ओन-डैमेज कवर में ''अनिवार्य कटौती योग्य राशि'' क्या है?

    उत्तर: यह वह निश्चित राशि है जो प्रत्येक दावे के समय पॉलिसीधारक द्वारा वहन की
    जाती है। आपके प्लान के लिए यह राशि ₹1000 है। इसका मतलब है कि दावे की कुल स्वीकृत
    राशि में से ₹1000 घटाकर शेष भुगतान किया जाएगा।


    प्रश्न: क्या यह राशि हर दावे पर लागू होती है?

    उत्तर: हाँ, यह ₹1000 की राशि प्रत्येक व्यक्तिगत दावे पर अनिवार्य रूप से लागू होती
    है, जैसा कि आपके पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखा गया है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 390515ef-9634-5985-9afb-29bbb7137d84
  title: मोटर ओन-डैमेज कवर — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी पॉलिसी को रद्द करना, बंद करना या डाउनग्रेड करना चाहते हैं, तो
    कृपया इन चरणों का पालन करें:


    1. हमें अपनी पॉलिसी संख्या और रद्दीकरण या डाउनग्रेड का कारण बताएं।

    2. यदि आप फ्री-लुक अवधि के भीतर हैं, तो हमें सूचित करें ताकि हम शर्तों के अनुसार
    रद्दीकरण प्रक्रिया शुरू कर सकें।

    3. हम आपसे आपके पहचान सत्यापन के लिए ओटीपी (OTP) या बायोमेट्रिक प्रमाणीकरण पूरा
    करने का अनुरोध करेंगे।

    4. रद्दीकरण या डाउनग्रेड के अनुरोध की पुष्टि होने के बाद, हम आपको संशोधित पॉलिसी
    दस्तावेज़ या रद्दीकरण पुष्टिकरण ईमेल भेजेंगे।

    5. यदि कोई प्रीमियम रिफंड देय है, तो हम आपके पंजीकृत बैंक खाते में राशि स्थानांतरित
    करेंगे।


    पॉलिसी बंद करने से पहले यह सुनिश्चित कर लें कि आपके पास वैकल्पिक सुरक्षा उपलब्ध
    है, क्योंकि रद्दीकरण के बाद वाहन के नुकसान के लिए कोई कवर नहीं मिलेगा।'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 11bf4813-6824-5330-9e62-239f7524b0ac
  title: मोटर ओन-डैमेज कवर — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते में या प्रीमियम भुगतान के दौरान कोई अनपेक्षित शुल्क या
    राशि दिखाई देती है, तो कृपया निम्नलिखित चरणों का पालन करें:


    - लक्षण: प्रीमियम राशि ₹7500 से अधिक दिखना या दावे के समय कटौती योग्य राशि का
    मिलान न होना।

    - जांचें: सबसे पहले अपने पॉलिसी दस्तावेज़ में वार्षिक प्रीमियम और ₹1000 की अनिवार्य
    कटौती योग्य राशि की जांच करें।

    - सत्यापन: यह देखें कि क्या आपने कोई अतिरिक्त राइडर जोड़ा है या कोई विलंब शुल्क
    (late fee) लागू हुआ है।

    - समाधान: यदि विसंगति बनी रहती है, तो हमें विवरण प्रदान करें। हम आपके भुगतान इतिहास
    और पॉलिसी शर्तों की समीक्षा करेंगे।

    - समाधान प्रक्रिया: यदि शुल्क गलत पाया जाता है, तो हम उसे समायोजित करेंगे या रिफंड
    प्रक्रिया शुरू करेंगे। यदि समस्या जटिल है, तो हम इसे आंतरिक शिकायत अधिकारी के
    पास भेजेंगे, जो निर्धारित समय सीमा के भीतर आपको समाधान प्रदान करेंगे।'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 1e0525fa-897f-510e-a463-2fb6cac0149d
  title: मोटर ओन-डैमेज कवर — आवश्यक दस्तावेज़
  body: 'मोटर ओन-डैमेज कवर प्राप्त करने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    | दस्तावेज़ | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | वाहन पंजीकरण प्रमाणपत्र (RC) | अनिवार्य | पॉलिसी जारी करने के लिए आवश्यक |

    | वैध ड्राइविंग लाइसेंस | अनिवार्य | दावा पात्रता के लिए आवश्यक |

    | पिछले बीमा का विवरण (यदि हो) | वैकल्पिक | नो-क्लेम बोनस गणना के लिए |

    | नामांकित व्यक्ति (Nominee) का विवरण | अनिवार्य | कानूनी अनुपालन के लिए आवश्यक
    |

    | केवाईसी (पैन/आधार) | अनिवार्य | पहचान सत्यापन के लिए |


    सभी दस्तावेज़ों का पूर्ण सत्यापन होने के बाद ही पॉलिसी सक्रिय की जाएगी।'
  domain: insurance
  product_category: motor_own_damage
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c6949d75-2edf-5a40-baae-68975df3f010
  title: मोटर ओन-डैमेज कवर — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'बाजार की सामान्य पेशकशों की तुलना में, मोटर ओन-डैमेज कवर पारदर्शिता और निश्चितता
    पर केंद्रित है। जहाँ कई प्रतिस्पर्धी जटिल शुल्क संरचनाएँ रखते हैं, हम ₹7500 का
    स्पष्ट वार्षिक प्रीमियम और ₹1000 की पारदर्शी अनिवार्य कटौती योग्य राशि प्रदान
    करते हैं।


    मुख्य अंतर:

    - दावा निपटान: हम 30 दिनों की स्पष्ट समय सीमा का पालन करते हैं, जबकि अन्य में
    यह अनिश्चित हो सकता है।

    - बोनस: हम पहले वर्ष में ही 20% का नो-क्लेम बोनस प्रदान करते हैं, जो ग्राहकों
    को सुरक्षित ड्राइविंग के लिए प्रोत्साहित करता है।


    यह उत्पाद उन ग्राहकों के लिए बेहतर है जो छिपे हुए शुल्कों के बजाय सरल और नैतिक
    बीमा प्रक्रिया पसंद करते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f8895e16-3c78-5708-84ff-3b47ffa9a287
  title: मोटर ओन-डैमेज कवर — जोखिम प्रकटीकरण
  body: 'हम अपने ग्राहकों को सूचित करना चाहते हैं कि मोटर ओन-डैमेज कवर सुरक्षा प्रदान
    करता है, लेकिन यह कुछ सीमाओं के अधीन है।


    जोखिम और सीमाएं:

    - कटौती योग्य राशि: प्रत्येक दावे पर ₹1000 की अनिवार्य कटौती योग्य राशि लागू होगी,
    जिसे बीमा राशि से घटाया जाएगा।

    - दावा समय सीमा: दावा निपटान में आमतौर पर 30 दिन लगते हैं।

    - बहिष्करण (Exclusions): वे विशिष्ट स्थितियाँ जिनके लिए बीमा कंपनी भुगतान नहीं
    करती है, पॉलिसी दस्तावेज़ में स्पष्ट रूप से दी गई हैं।


    हम IRDAI के नियमों का सख्ती से पालन करते हैं और फ्री-लुक अवधि, प्रतीक्षा अवधि
    और बहिष्करणों का पूर्ण खुलासा सुनिश्चित करते हैं। कृपया ध्यान दें कि हमारे सुझाव
    उत्पाद विवरणों पर आधारित होते हैं और इन्हें निवेश के बजाय केवल सुरक्षा के रूप
    में देखा जाना चाहिए। हम व्यक्तिगत कानूनी या कर सलाहकार के रूप में कार्य नहीं करते
    हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 46de80d8-4ecd-5a6b-991d-cee489a1187f
  title: मोटर ओन-डैमेज कवर — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'मोटर ओन-डैमेज कवर के लिए एक सरल और फ्लैट दर संरचना लागू होती है ताकि पारदर्शिता
    बनी रहे।


    - वार्षिक प्रीमियम: सभी पात्र वाहनों के लिए मानक वार्षिक प्रीमियम ₹7500 है।

    - नो-क्लेम बोनस (NCB): यदि पॉलिसी के पहले वर्ष में कोई दावा नहीं किया जाता है,
    तो प्रीमियम पर 20% की दर से नो-क्लेम बोनस लागू होता है।

    - अनिवार्य कटौती: प्रत्येक दावे पर ₹1000 की एक निश्चित राशि कटौती के रूप में लागू
    होती है।


    ये दरें पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखी गई हैं और इनका उपयोग जोखिम प्रबंधन
    और परिचालन लागतों को कवर करने के लिए किया जाता है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: rate_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: e834198f-3543-5a27-a416-8bb9f6a21f96
  title: मोटर ओन-डैमेज कवर — रेफरल और लॉयल्टी ऑफर
  body: अभय इंश्योरेंस अपने मौजूदा ग्राहकों के लिए एक विशेष रेफरल प्रोग्राम पेश करता
    है। यदि आप किसी मित्र या परिवार के सदस्य को हमारे मोटर ओन-डैमेज कवर के लिए सफलतापूर्वक
    रेफर करते हैं, तो आपको अपने अगले नवीनीकरण पर विशेष लॉयल्टी लाभ प्राप्त होंगे।
    यह ऑफर 1 जनवरी 2025 से 31 मार्च 2025 तक मान्य है। हम आपको प्रोत्साहित करते हैं
    कि आप अपने करीबियों को ₹7500 के वार्षिक प्रीमियम वाले इस भरोसेमंद सुरक्षा प्लान
    से जोड़ें और अपनी वफादारी का लाभ उठाएं।
  domain: insurance
  product_category: motor_own_damage
  document_type: promo_notice
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 192a787b-3ac8-5149-bbe6-bf979a78dfae
  title: मोटर ओन-डैमेज कवर — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'हम आपके मोटर ओन-डैमेज कवर की सुरक्षा सुनिश्चित करने के लिए प्रतिबद्ध हैं।
    कृपया ध्यान दें कि अभय इंश्योरेंस कभी भी आपसे फोन या ईमेल पर आपका पासवर्ड, पिन
    या ओटीपी (OTP) नहीं मांगेगा।


    सावधान रहें: कुछ जालसाज आपके पॉलिसी विवरण या दावा निपटान राशि के नाम पर आपसे प्रोसेसिंग
    शुल्क की मांग कर सकते हैं। हम स्पष्ट करते हैं कि हमारे सभी शुल्क पॉलिसी दस्तावेज़
    में पारदर्शी रूप से लिखे होते हैं।


    सुरक्षा के लिए सर्वोत्तम प्रथाएँ:

    1. किसी भी पॉलिसी बदलाव से पहले हमारे बहु-स्तरीय पहचान सत्यापन का पालन करें।

    2. संवेदनशील जानकारी साझा करने के लिए केवल बायोमेट्रिक या ओटीपी प्रमाणीकरण का
    उपयोग करें।

    3. यदि आपको कोई संदिग्ध कॉल या संदेश प्राप्त होता है, तो तुरंत हमें सूचित करें।


    किसी भी संदिग्ध गतिविधि की रिपोर्ट करने की समय सीमा दावा सूचना की निर्धारित अवधि
    के भीतर होनी चाहिए ताकि आपकी सुरक्षा और लाभ प्रभावित न हों।'
  domain: insurance
  product_category: motor_own_damage
  document_type: security_advisory
  source_authority: official
