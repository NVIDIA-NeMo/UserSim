- id: f0f478c5-5f20-5814-8dc3-de1d53764db2
  title: परिवार स्वास्थ्य बीमा — पूर्व-मौजूद बीमारी की प्रतीक्षा अवधि (माह) की व्याख्या
  body: 'प्रश्न: ''परिवार स्वास्थ्य बीमा'' में पूर्व-मौजूद बीमारियों के लिए प्रतीक्षा
    अवधि क्या है?


    उत्तर: यदि आपको पॉलिसी लेने से पहले से कोई बीमारी है, तो उसके लिए 36 महीने की
    प्रतीक्षा अवधि लागू होती है। इसका मतलब है कि पॉलिसी सक्रिय होने के 36 महीने पूरे
    होने के बाद ही उन विशिष्ट स्थितियों के लिए दावा किया जा सकता है।


    प्रश्न: क्या यह अवधि सभी बीमारियों के लिए समान है?


    उत्तर: नहीं, सामान्य बीमारियों के लिए प्रतीक्षा अवधि अलग होती है। विस्तृत जानकारी
    के लिए कृपया ''परिवार स्वास्थ्य बीमा — प्रारंभिक प्रतीक्षा अवधि (दिन) की व्याख्या''
    देखें।'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 67f2baa0-58d0-5731-84d5-a60f614d769b
  title: परिवार स्वास्थ्य बीमा — स्थिति या इतिहास देखना
  body: 'अपनी ''परिवार स्वास्थ्य बीमा'' पॉलिसी की स्थिति या दावों का इतिहास देखने
    के लिए इन चरणों का पालन करें:


    1. अपनी पॉलिसी आईडी और पंजीकृत मोबाइल नंबर प्रदान करें।

    2. हमसे अपनी वर्तमान पॉलिसी की स्थिति (सक्रिय/लैप्स) या पिछले दावों का विवरण मांगें।

    3. हम आपकी पहचान सत्यापित करने के लिए एक ओटीपी (OTP) भेजेंगे; कृपया वह ओटीपी हमें
    बताएं।

    4. सत्यापन सफल होने के बाद, हम आपको आपकी बीमा राशि (₹5,00,000), प्रीमियम भुगतान
    की तारीख और यदि कोई दावा किया गया है, तो उसके निपटान की स्थिति की जानकारी देंगे।


    आपको यह विवरण एक संक्षिप्त सारांश के रूप में प्राप्त होगा, जिससे आप जान पाएंगे
    कि आपकी सुरक्षा वर्तमान में किस स्तर पर है और आपका प्रीमियम भुगतान अपडेट है या
    नहीं।'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a1636d9e-8074-59d5-9f4f-41874bfc4046
  title: परिवार स्वास्थ्य बीमा — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी ''परिवार स्वास्थ्य बीमा'' से संबंधित कोई कार्रवाई (जैसे दावा अनुरोध
    या पॉलिसी अपडेट) अस्वीकृत या अवरुद्ध हो जाती है, तो कृपया निम्नलिखित की जांच करें:


    **संभावित कारण और समाधान:**

    - **प्रतीक्षा अवधि:** यदि दावा पहले 30 दिनों के भीतर किया गया है या पूर्व-मौजूद
    बीमारी के लिए 36 महीने पूरे नहीं हुए हैं, तो दावा अस्वीकृत हो सकता है।

    - **दस्तावेज़ की कमी:** यदि नामांकित व्यक्ति (Nominee) की जानकारी या आवश्यक केवाईसी
    दस्तावेज़ अधूरे हैं, तो कार्रवाई अवरुद्ध हो सकती है।

    - **प्रीमियम बकाया:** सुनिश्चित करें कि आपका ₹9,500 का वार्षिक प्रीमियम भुगतान
    किया जा चुका है।


    **अगला कदम:**

    यदि सब कुछ सही है और फिर भी समस्या बनी रहती है, तो हम आपके मामले को आंतरिक शिकायत
    अधिकारी के पास भेजेंगे। आप समाधान के लिए निर्धारित समय सीमा के भीतर अपडेट प्राप्त
    करेंगे। यदि वहाँ समाधान नहीं होता है, तो आप बीमा लोकपाल (Insurance Ombudsman)
    से संपर्क कर सकते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ff201092-b1e1-5dbe-ad61-9175023872a8
  title: परिवार स्वास्थ्य बीमा — कब स्विच या अपग्रेड करें
  body: "आपको 'परिवार स्वास्थ्य बीमा' से अपग्रेड करने पर तब विचार करना चाहिए जब आपकी\
    \ पारिवारिक ज़रूरतें बढ़ जाएं। वर्तमान में यह ₹5,00,000 की बीमा राशि और ₹9,500\
    \ के वार्षिक प्रीमियम के साथ एक संतुलित सुरक्षा प्रदान करता है। \n\nयदि आपको लगता\
    \ है कि रूम रेंट की 1% की सीमा आपके क्षेत्र के अस्पतालों के लिए अपर्याप्त है,\
    \ या यदि आपके परिवार में सदस्यों की संख्या बढ़ गई है, तो अपग्रेड करना बेहतर है।\
    \ यह उत्पाद उन परिवारों के लिए आदर्श है जो किफायती प्रीमियम पर बुनियादी और व्यापक\
    \ सुरक्षा चाहते हैं, जबकि उच्च कवरेज चाहने वाले ग्राहक हमारे प्रीमियम प्लान की\
    \ ओर स्विच कर सकते हैं।"
  domain: insurance
  product_category: health_indemnity
  document_type: comparison
  source_authority: official
