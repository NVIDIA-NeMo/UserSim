- id: 1882e4fb-4bcf-54b6-b408-7a9b5e48c2bc
  title: अभय टर्म लाइफ कवर — खाता सुरक्षा की सर्वोत्तम प्रथाएँ
  body: 'हम आपके और आपके परिवार की वित्तीय सुरक्षा के प्रति प्रतिबद्ध हैं। ''अभय टर्म
    लाइफ कवर'' के साथ अपने खाते को सुरक्षित रखने के लिए कृपया इन सर्वोत्तम प्रथाओं
    का पालन करें:


    1. प्रमाणीकरण: हम किसी भी संवेदनशील बदलाव या भुगतान से पहले बायोमेट्रिक या ओटीपी
    (OTP) आधारित प्रमाणीकरण का उपयोग करते हैं। अपना ओटीपी कभी भी किसी के साथ साझा
    न करें।

    2. सत्यापन: याद रखें कि किसी भी पॉलिसी बदलाव से पहले बहु-स्तरीय पहचान सत्यापन
    अनिवार्य है।

    3. सतर्कता: हम आपसे कभी भी आपके पासवर्ड या पिन की मांग नहीं करेंगे।


    यदि आपको कोई संदिग्ध गतिविधि दिखाई देती है, तो तुरंत हमें सूचित करें। धोखाधड़ी
    की रिपोर्ट करने में देरी आपके दावे की प्रक्रिया को प्रभावित कर सकती है। हम धोखाधड़ी
    के प्रति शून्य-सहनशीलता की नीति अपनाते हैं।'
  domain: insurance
  product_category: term_life_cover
  document_type: security_advisory
  source_authority: official
