- id: ccc6ec6f-ede4-5eb5-b2ad-c055b1a43b73
  title: ULIP वेल्थ प्लान — पात्रता श्रेणियाँ
  body: 'एजेंटों के लिए पात्रता गाइड:


    - मध्यम आय वर्ग: ₹50000 वार्षिक प्रीमियम भुगतान करने में सक्षम व्यक्ति।

    - उच्च आय वर्ग: ₹50000 या उससे अधिक प्रीमियम भुगतान करने में सक्षम व्यक्ति।

    - आयु सीमा: निर्धारित न्यूनतम और अधिकतम आयु मानदंडों को पूरा करने वाले भारतीय
    निवासी।

    - दस्तावेज़: वैध केवाईसी और नामांकित व्यक्ति की अनिवार्य जानकारी उपलब्ध होनी चाहिए।


    परिणाम: उपरोक्त शर्तें पूरी करने पर ग्राहक ''ULIP वेल्थ प्लान'' के लिए पात्र माना
    जाएगा।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: eligibility_matrix
  source_authority: official
