- id: 95095b16-e11e-562c-935c-c6e1e859a97a
  title: अभय टर्म लाइफ कवर — शर्तों में बदलाव की नीति
  body: "अभय इंश्योरेंस को नियामक आवश्यकताओं या जोखिम प्रोफाइल में बदलाव के कारण 'अभय\
    \ टर्म लाइफ कवर' की शर्तों को संशोधित करने का अधिकार है। \n\nनियम और शर्तें:\n\
    - यदि वार्षिक प्रीमियम ₹12000 से अधिक या कम करने का निर्णय लिया जाता है, तो हम\
    \ ग्राहक को 30 दिन पूर्व लिखित सूचना देंगे।\n- पॉलिसी अवधि (वर्ष) 30 के निश्चित\
    \ कार्यकाल पर आधारित है; इसे बीच में बदला नहीं जा सकता।\n- किसी भी बदलाव के बाद,\
    \ यदि ग्राहक नई शर्तों से असहमत है, तो वे अपनी फ्री-लुक अवधि (15 दिन) के भीतर\
    \ पॉलिसी रद्द कर सकते हैं।\n- प्रीमियम भुगतान के लिए दी गई 30 दिन की छूट अवधि\
    \ (Grace Period) अपरिवर्तनीय है।\n\nहम यह सुनिश्चित करते हैं कि सभी बदलाव IRDAI\
    \ के नियमों के अनुसार पारदर्शी हों और पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखे\
    \ जाएं।"
  domain: insurance
  product_category: term_life_cover
  document_type: terms_conditions
  source_authority: official
