- id: 7a76c4cf-f498-5d98-ba2a-5b2b3aaa51f3
  title: सामान्य अक्सर पूछे जाने वाले प्रश्न
  body: 'प्रश्न: मैं अभय इंश्योरेंस की सहायता टीम से कैसे संपर्क कर सकता हूँ?

    उत्तर: हम भारतीय मानक समय (IST) के अनुसार सुबह 9 से शाम 6 बजे तक डिजिटल पोर्टल,
    ईमेल और फोन के माध्यम से उपलब्ध हैं।


    प्रश्न: यदि मुझे अपनी पॉलिसी के संबंध में कोई शिकायत है तो क्या करें?

    उत्तर: शिकायतें पहले हमारे आंतरिक शिकायत अधिकारी के पास भेजी जाती हैं, और यदि
    समाधान नहीं होता है, तो उन्हें बीमा लोकपाल (Insurance Ombudsman) के पास भेजा जा
    सकता है।


    प्रश्न: मुझे अपनी पॉलिसी की शर्तों को समझने में मदद कहाँ मिलेगी?

    उत्तर: आप हमारे नियामक नोट्स और उत्पाद विवरणों को देख सकते हैं। विस्तृत मार्गदर्शन
    के लिए ''बीमा के लिए नियामक नोट्स'' देखें।'
  domain: insurance
  product_category: general
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f8a09f47-807e-5b1f-be37-37b36acdcbe9
  title: बीमा के लिए नियामक नोट्स
  body: 'अभय इंश्योरेंस IRDAI के सभी नियमों और दिशानिर्देशों का सख्ती से पालन करता
    है। हमारी प्राथमिकता ग्राहकों को पूर्ण पारदर्शिता और सुरक्षा प्रदान करना है।


    नियामक अनुपालन के तहत, हम निम्नलिखित का पूर्ण खुलासा सुनिश्चित करते हैं:

    1. फ्री-लुक अवधि (Free-look Period): पॉलिसी दस्तावेज़ प्राप्त होने के बाद वह समय
    जब ग्राहक शर्तों से असहमत होने पर पॉलिसी रद्द कर सकता है।

    2. प्रतीक्षा अवधि (Waiting Period): वह समय जिसके बाद ही कुछ विशिष्ट बीमारियों
    या स्थितियों के लिए बीमा कवर शुरू होता है।

    3. बहिष्करण (Exclusions): वे विशिष्ट स्थितियाँ या घटनाएँ जिनके लिए बीमा कंपनी
    दावा भुगतान नहीं करती है।


    एजेंटों का यह अनिवार्य दायित्व है कि वे ग्राहक को इन शर्तों के बारे में स्पष्ट
    रूप से शिक्षित करें। इसके अतिरिक्त, ग्राहक डेटा की गोपनीयता और नामांकित व्यक्ति
    (Nominee) की अनिवार्य जानकारी सुनिश्चित करना हमारी सर्वोच्च प्राथमिकता है। हम
    यह स्पष्ट करते हैं कि हम उत्पादों के लाभों के बारे में शिक्षित करते हैं, लेकिन
    व्यक्तिगत कानूनी या कर सलाहकार के रूप में कार्य नहीं करते हैं।'
  domain: insurance
  product_category: compliance
  document_type: regulatory_note
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d46d56c7-50cc-5f7f-b89c-93ad9fa83b0a
  title: get_policy_details का उपयोग कब करें
  body: 'जब किसी ग्राहक को अपनी वर्तमान पॉलिसी की स्थिति, कवर की राशि, प्रीमियम भुगतान
    की तारीख या अन्य विशिष्ट विवरणों की आवश्यकता होती है, तो एजेंट को इस प्रक्रिया
    का पालन करना चाहिए:


    1. सबसे पहले, ग्राहक की पहचान सत्यापित करें।

    2. यदि ग्राहक के पास पॉलिसी आईडी नहीं है, तो `get_accounts` का उपयोग करके उनके
    विवरण प्राप्त करें।

    3. ग्राहक की विशिष्ट पॉलिसी आईडी का उपयोग करते हुए `get_policy_details` टूल को
    कॉल करें।

    4. टूल से प्राप्त जानकारी को सरल और सहानुभूतिपूर्ण भाषा में ग्राहक के साथ साझा
    करें।


    यह प्रक्रिया सुनिश्चित करती है कि ग्राहक को उनकी सुरक्षा योजना के बारे में सटीक
    और पारदर्शी जानकारी मिले।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_policy_details
  institution_id: abhaya_insurance
- id: 20882e1d-571a-5ab8-b88f-fcb6dadad565
  title: get_policy_details टूल संदर्भ
  body: 'टूल नाम: `get_policy_details`

    विवरण: यह टूल एक विशिष्ट पॉलिसी आईडी के लिए विस्तृत कवरेज जानकारी, प्रीमियम विवरण
    और पॉलिसी की वर्तमान स्थिति पुनर्प्राप्त करता है।

    तर्क (Arguments): `policy_id` (अनिवार्य)

    प्रभाव: यह केवल डेटा पढ़ने वाला (read-only) टूल है।


    एजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है। ग्राहक को किसी बाहरी
    पोर्टल पर जाने के लिए निर्देशित न करें।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_policy_details
  institution_id: abhaya_insurance
- id: 0c41b8da-4ddd-51d6-86cd-407fb0b1b0f1
  title: renew_policy का उपयोग कब करें
  body: 'जब कोई ग्राहक अपनी समाप्त हो रही या समाप्त हो चुकी पॉलिसी को नवीनीकृत करना
    चाहता है, तो एजेंट को निम्नलिखित चरणों का पालन करना चाहिए:


    1. `verify_identity` के माध्यम से ग्राहक का बहु-स्तरीय पहचान सत्यापन पूरा करें।

    2. `get_policy_details` का उपयोग करके वर्तमान पॉलिसी की समाप्ति तिथि और नवीनीकरण
    प्रीमियम की जांच करें।

    3. ग्राहक को नवीनीकरण की शर्तों और किसी भी बदलाव के बारे में सूचित करें।

    4. ग्राहक की सहमति मिलने पर, `renew_policy` टूल को कॉल करके नवीनीकरण प्रक्रिया
    पूरी करें।


    नवीनीकरण के बाद, ग्राहक को पुष्टिकरण प्रदान करें और उन्हें अपडेटेड पॉलिसी दस्तावेज़
    देखने के लिए प्रोत्साहित करें।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - renew_policy
  institution_id: abhaya_insurance
- id: b47a83c2-57a3-5c5d-b072-fa6a93653d67
  title: renew_policy टूल संदर्भ
  body: 'टूल नाम: `renew_policy`

    विवरण: यह टूल एक मौजूदा बीमा पॉलिसी की अवधि को बढ़ाता है और उसे सक्रिय रखता है।

    तर्क (Arguments): `policy_id` (अनिवार्य), `renewal_term` (वैकल्पिक)

    प्रभाव: यह एक स्टेट-चेंजिंग (state_changing) टूल है जो पॉलिसी की समाप्ति तिथि
    को अपडेट करता है।


    एजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
  source_authority: official
  placeholder: true
  mentions_tools:
  - renew_policy
  institution_id: abhaya_insurance
- id: f3ef02a2-e11d-58d4-8673-3a13fbd9a59a
  title: add_nominee का उपयोग कब करें
  body: 'बीमा सुरक्षा का मुख्य उद्देश्य नामांकित व्यक्ति (Nominee) को वित्तीय सुरक्षा
    प्रदान करना है। यदि कोई ग्राहक नई नामांकन जानकारी जोड़ना चाहता है या मौजूदा नामांकित
    व्यक्ति को बदलना चाहता है, तो एजेंट को यह प्रक्रिया अपनानी चाहिए:


    1. ग्राहक की पहचान का पूर्ण सत्यापन करें।

    2. नामांकित व्यक्ति का पूरा नाम, संबंध और संपर्क विवरण प्राप्त करें।

    3. `add_nominee` टूल का उपयोग करके विवरण सिस्टम में अपडेट करें।

    4. ग्राहक को सूचित करें कि नामांकित व्यक्ति की जानकारी अब उनकी पॉलिसी का हिस्सा
    है।


    यह प्रक्रिया IRDAI के नियमों के अनुसार अनिवार्य है ताकि दावे के समय भुगतान सही
    व्यक्ति को मिल सके।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - add_nominee
  institution_id: abhaya_insurance
- id: 2fdf6366-75bb-5955-bfe3-419188ec0f8c
  title: add_nominee टूल संदर्भ
  body: 'टूल नाम: `add_nominee`

    विवरण: यह टूल पॉलिसीधारक की मृत्यु के बाद बीमा राशि प्राप्त करने के लिए नामांकित
    व्यक्ति की जानकारी जोड़ता या अपडेट करता है।

    तर्क (Arguments): `policy_id` (अनिवार्य), `nominee_details` (अनिवार्य)

    प्रभाव: यह एक स्टेट-चेंजिंग (state_changing) टूल है।


    एजेंट इस कार्रवाई को सीधे टूल कॉल करके निष्पादित करता है।'
