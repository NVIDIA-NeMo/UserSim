- id: ff05ab75-2c6d-53f4-a805-1e6dcc2efbb7
  title: get_accounts का उपयोग कब करें
  body: 'जब किसी ग्राहक के पास एक से अधिक पॉलिसी हों या जब उनके पास अपनी पूरी पॉलिसी
    आईडी उपलब्ध न हो, तब उनके खातों की पहचान करने के लिए इस प्रक्रिया का उपयोग किया
    जाता है। हम यह सुनिश्चित करते हैं कि सही खाते पर कार्रवाई की जाए।


    **प्रक्रिया के चरण:**

    1. ग्राहक से उनकी पहचान सत्यापित करने के लिए आवश्यक विवरण मांगें।

    2. पहचान सत्यापन के बाद, ग्राहक द्वारा प्रदान किए गए विवरण (जैसे कि पॉलिसी के
    अंतिम 4 अंक) का उपयोग करें।

    3. ग्राहक से जुड़े सभी सक्रिय बीमा खातों और उनकी आईडी की सूची प्राप्त करने के
    लिए get_accounts टूल का उपयोग करें।

    4. प्राप्त सूची में से सही पॉलिसी आईडी की पुष्टि ग्राहक से करें ताकि आगे की प्रक्रिया
    सटीक रहे।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_accounts
  institution_id: abhaya_insurance
- id: a4c89346-7b12-5afb-99b7-7856467edbf9
  title: get_accounts टूल संदर्भ
  body: 'यह टूल एजेंट को एक ग्राहक से जुड़े सभी बीमा खातों और संबंधित पॉलिसी विवरणों
    को पुनः प्राप्त करने की अनुमति देता है। एजेंट इस कार्य को सीधे get_accounts टूल
    कॉल करके निष्पादित करता है।


    **तर्क (Arguments):**

    - customer_id: ग्राहक की विशिष्ट पहचान संख्या।


    **प्रभाव:** यह टूल ग्राहक के नाम पर पंजीकृत सभी सक्रिय और निष्क्रिय पॉलिसियों
    की एक विस्तृत सूची प्रदान करता है, जिससे पॉलिसी आईडी की पहचान करना आसान हो जाता
    है।'
  domain: insurance
  product_category: procedure
  document_type: discoverable_tool_doc
