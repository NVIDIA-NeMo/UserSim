- id: fcfaf1ee-27ec-5026-983e-814790511818
  title: ULIP वेल्थ प्लान — वार्षिक प्रीमियम की व्याख्या
  body: 'प्रश्न: ULIP वेल्थ प्लान के लिए मुझे प्रति वर्ष कितना भुगतान करना होगा?

    उत्तर: इस योजना के तहत आपका वार्षिक प्रीमियम ₹50000 निर्धारित है।


    प्रश्न: क्या प्रीमियम की राशि का उपयोग पूरी तरह से निवेश के लिए किया जाता है?

    उत्तर: नहीं, प्रीमियम के एक हिस्से का उपयोग जोखिम प्रबंधन और परिचालन लागतों को
    कवर करने के लिए किया जाता है। प्रीमियम आवंटन के समय 3% का प्रीमियम आवंटन शुल्क
    काटा जाता है। विस्तृत जानकारी के लिए कृपया ''ULIP वेल्थ प्लान — शुल्क अनुसूची''
    देखें।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 54b4e90e-9006-5cdb-b6c5-5a77de263243
  title: ULIP वेल्थ प्लान — सेटअप और सक्रियण
  body: 'ULIP वेल्थ प्लान को सक्रिय करने के लिए इन चरणों का पालन करें:


    1. अपनी व्यक्तिगत जानकारी और नामांकित व्यक्ति (Nominee) का विवरण हमें प्रदान करें।
    नामांकित व्यक्ति की जानकारी देना अनिवार्य है।

    2. अपने पहचान और पते के प्रमाण के लिए आवश्यक दस्तावेज़ जमा करें।

    3. ₹50000 के पहले वार्षिक प्रीमियम का भुगतान करें।

    4. हम आपके द्वारा चुने गए फंड विकल्पों के आधार पर निवेश प्रक्रिया शुरू करेंगे
    और आपकी पहचान के लिए ओटीपी (OTP) आधारित प्रमाणीकरण पूरा करेंगे।

    5. एक बार सत्यापन पूरा हो जाने पर, हम आपका पॉलिसी दस्तावेज़ जारी करेंगे।


    सफलता की पुष्टि: जब आपको आपका पॉलिसी दस्तावेज़ प्राप्त हो जाता है, तो आपकी योजना
    सक्रिय मानी जाती है। दस्तावेज़ मिलने के बाद, आप ''फ्री-लुक अवधि'' का उपयोग कर
    सकते हैं यदि आप शर्तों से असहमत हैं।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 316b17bd-0b50-5310-8ea6-45750af4cac0
  title: ULIP वेल्थ प्लान — शुल्क अनुसूची
  body: 'ULIP वेल्थ प्लान से जुड़े सभी शुल्क पारदर्शी हैं और पॉलिसी दस्तावेज़ में
    स्पष्ट रूप से लिखे गए हैं। लागू शुल्क इस प्रकार हैं:


    - प्रीमियम आवंटन शुल्क (Premium Allocation Charge): 3%

    - फंड प्रबंधन शुल्क (Fund Management Charge): 1.35%


    इन शुल्कों का उपयोग जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए किया जाता
    है।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: fee_schedule
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d38066d7-8c9e-5414-936d-a39e11c780e8
  title: ULIP वेल्थ प्लान — विफल या लंबित कार्रवाई
  body: 'यदि आपको अपनी पॉलिसी के साथ किसी समस्या का सामना करना पड़ रहा है, तो कृपया
    निम्नलिखित विवरण देखें:


    लक्षण: ''प्रीमियम भुगतान विफल'' या ''पॉलिसी सक्रियण लंबित'' का संदेश मिलना।


    संभावित कारण:

    1. ओटीपी (OTP) सत्यापन का पूरा न होना।

    2. नामांकित व्यक्ति (Nominee) की अनिवार्य जानकारी का अधूरा होना।

    3. भुगतान गेटवे पर तकनीकी त्रुटि।


    समाधान प्रक्रिया:

    - सबसे पहले जाँचें कि क्या आपने सभी अनिवार्य दस्तावेज़ जमा कर दिए हैं।

    - यदि भुगतान विफल हुआ है, तो अपने बैंक विवरण की जाँच करें और हमें सूचित करें।

    - यदि प्रमाणीकरण लंबित है, तो पुनः बायोमेट्रिक या ओटीपी सत्यापन के लिए अनुरोध
    करें।


    एस्केलेशन: यदि समस्या हल नहीं होती है, तो हम इस मामले को आंतरिक शिकायत अधिकारी
    के पास भेजेंगे। समाधान निर्धारित समय सीमा के भीतर किया जाएगा।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ec8898cf-2dd2-52bc-936d-790f4d56c3db
  title: ULIP वेल्थ प्लान — पात्रता शर्तें
  body: 'ULIP वेल्थ प्लान के लिए पात्रता मानदंड निम्नलिखित हैं:


    | शर्त | आवश्यकता | परिणाम |

    | :--- | :--- | :--- |

    | आय स्तर | मध्यम से उच्च आय | पात्र |

    | वार्षिक निवेश क्षमता | ₹50000 या अधिक | पात्र |

    | दस्तावेज़ीकरण | पूर्ण केवाईसी (KYC) और नामांकित व्यक्ति का विवरण | सक्रियण संभव
    |

    | आयु/स्वास्थ्य | अंडरराइटिंग मानदंडों के अनुसार | पॉलिसी जारी होगी |'
  domain: insurance
  product_category: ulip_wealth_plan
