- id: ccf11b07-e5c8-5f7d-9954-9ebbee2c9e55
  title: मोटर ओन-डैमेज कवर — दावा निपटान में लगने वाले दिन की व्याख्या
  body: 'प्रश्न: यदि मैं मोटर ओन-डैमेज कवर के तहत दावा करता हूँ, तो मुझे भुगतान मिलने
    में कितना समय लगेगा?

    उत्तर: हम पारदर्शिता में विश्वास करते हैं। हमारे मानक प्रक्रिया के अनुसार, दावा
    निपटान में लगने वाले दिन 30 हैं। यह अवधि दावे की उचित जांच और सत्यापन के बाद निपटान
    तक की प्रक्रिया को कवर करती है।


    प्रश्न: क्या यह समय सीमा सभी दावों के लिए समान है?

    उत्तर: हाँ, हम सभी दावों की निष्पक्ष जांच करते हैं और निर्धारित 30 दिनों की समय
    सीमा के भीतर समाधान करने का प्रयास करते हैं। अधिक जानकारी के लिए मोटर ओन-डैमेज
    कवर — सिंहावलोकन देखें।'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 5e175955-3444-54ba-a388-f7e16bd9fe7c
  title: मोटर ओन-डैमेज कवर — स्थिति या इतिहास देखना
  body: 'अपनी पॉलिसी की वर्तमान स्थिति या पिछले दावों का इतिहास देखने के लिए इन चरणों
    का पालन करें:


    1. हमें अपनी पॉलिसी संख्या और पंजीकृत मोबाइल नंबर प्रदान करें।

    2. हम आपके विवरणों के सत्यापन के लिए एक ओटीपी (OTP) आधारित प्रमाणीकरण प्रक्रिया
    शुरू करेंगे।

    3. सत्यापन सफल होने के बाद, हमसे अपनी ''पॉलिसी स्थिति'' या ''दावा इतिहास'' (Claim
    History) साझा करने का अनुरोध करें।

    4. हम आपको आपकी वर्तमान पॉलिसी की स्थिति, शेष अवधि और यदि कोई पिछला दावा किया
    गया है, तो उसका विवरण प्रदान करेंगे।


    **सफलता की पहचान:** जब आपको हमारी ओर से एक विस्तृत सारांश प्राप्त होता है जिसमें
    आपकी पॉलिसी की सक्रियता और दावों का विवरण होता है, तो आपकी प्रक्रिया पूरी हो जाती
    है।


    सुरक्षा सुनिश्चित करने के लिए, हम किसी भी विवरण को साझा करने से पहले बहु-स्तरीय
    पहचान सत्यापन अनिवार्य रूप से करते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a5bfbb16-9a0b-531f-b8b9-67bed49a0ca7
  title: मोटर ओन-डैमेज कवर — अस्वीकृत या अवरुद्ध कार्रवाई
  body: 'यदि आपकी कोई कार्रवाई (जैसे पॉलिसी नवीनीकरण या दावा अनुरोध) अस्वीकृत या अवरुद्ध
    हो गई है, तो कृपया निम्नलिखित चरणों की जांच करें:


    **लक्षण:** आपको ''अनधिकृत'' या ''कार्रवाई अस्वीकृत'' का संदेश प्राप्त होता है।


    **संभावित कारण और समाधान:**

    1. **दस्तावेज़ की कमी:** जांचें कि क्या आपके सभी अनिवार्य दस्तावेज़ जमा हैं। यदि
    नहीं, तो हमें आवश्यक दस्तावेज़ प्रदान करें।

    2. **सत्यापन विफल:** यदि ओटीपी (OTP) सत्यापन विफल रहा है, तो कृपया दोबारा प्रयास
    करें।

    3. **पॉलिसी लैप्स:** सुनिश्चित करें कि आपका वार्षिक प्रीमियम ₹7500 समय पर भुगतान
    किया गया है।


    **अगला कदम:**

    यदि उपरोक्त जांच के बाद भी समस्या बनी रहती है, तो हम इस मामले को अपने आंतरिक शिकायत
    अधिकारी के पास भेजेंगे। हम निर्धारित समय सीमा के भीतर आपको समाधान प्रदान करेंगे।
    यदि आप संतुष्ट नहीं हैं, तो आप बीमा लोकपाल (Insurance Ombudsman) से संपर्क कर
    सकते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c5aa1600-ca10-5aa5-8475-f1238c38d22c
  title: मोटर ओन-डैमेज कवर — कब स्विच या अपग्रेड करें
  body: 'मोटर ओन-डैमेज कवर से अपग्रेड या स्विच करने का निर्णय आपकी वाहन स्थिति और
    जोखिम प्रोफाइल पर निर्भर करता है।


    **आपको स्विच/अपग्रेड करना चाहिए यदि:**

    - आपके वाहन का मूल्य काफी बढ़ गया है और वर्तमान कवर अपर्याप्त है।

    - आप अधिक व्यापक सुरक्षा चाहते हैं जिसमें वर्तमान बहिष्करण (Exclusions) शामिल
    न हों।

    - आप अपने नो-क्लेम बोनस का लाभ उठाकर प्रीमियम कम करना चाहते हैं (पहले वर्ष के
    लिए 20% नो-क्लेम बोनस उपलब्ध है)।


    यह उत्पाद उन लोगों के लिए सबसे अच्छा है जो त्वरित दावा निपटान (30 दिन) और पारदर्शी
    शुल्क संरचना चाहते हैं। यदि आपको केवल बुनियादी कानूनी सुरक्षा चाहिए, तो एक सरल
    तृतीय-पक्ष कवर बेहतर हो सकता है, लेकिन पूर्ण सुरक्षा के लिए हमारा मोटर ओन-डैमेज
    कवर ही श्रेष्ठ विकल्प है।'
  domain: insurance
  product_category: motor_own_damage
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: bc051b41-c458-5985-88d2-61c53684d6f0
  title: मोटर ओन-डैमेज कवर — विकल्पों से तुलना और कब न चुनें
  body: 'मोटर ओन-डैमेज कवर एक व्यापक समाधान है, लेकिन यह हर किसी के लिए उपयुक्त नहीं
    हो सकता है।


    **तुलना और चयन:**

    - **हमारा उत्पाद:** ₹7500 के वार्षिक प्रीमियम और ₹1000 की अनिवार्य कटौती योग्य
    राशि के साथ, हम त्वरित दावा निपटान (30 दिन) और पहले वर्ष में 20% नो-क्लेम बोनस
    प्रदान करते हैं। यह मध्यम और उच्च-आय वाले परिवारों के लिए आदर्श है जो मानसिक शांति
    चाहते हैं।

    - **कब न चुनें:** यदि आपका वाहन बहुत पुराना है और उसकी वर्तमान बाजार कीमत ₹1000
    की अनिवार्य कटौती से बहुत कम है, तो यह कवर आपके लिए आर्थिक रूप से व्यावहारिक नहीं
    हो सकता है। साथ ही, यदि आप केवल अनिवार्य कानूनी आवश्यकताओं को पूरा करना चाहते
    हैं, तो शुद्ध तृतीय-पक्ष बीमा अधिक किफायती विकल्प हो सकता है।


    हम नैतिक अंडरराइटिंग के माध्यम से सुरक्षा प्रदान करते हैं और IRDAI के सभी नियमों
    का पालन करते हैं।


    ***

    **कानूनी डिस्क्लेमर:** हमारे सुझाव उत्पाद विवरणों पर आधारित होते हैं, जिन्हें
    सुरक्षा के रूप में देखा जाना चाहिए, न कि निवेश के रूप में।'
  domain: insurance
  product_category: motor_own_damage
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: d4d14d43-dc15-5ecf-b0a6-a26206d4a422
  title: मोटर ओन-डैमेज कवर — लागत और शुल्क
  body: 'प्रश्न: मोटर ओन-डैमेज कवर के लिए मेरा वार्षिक प्रीमियम कितना है?

    उत्तर: इस पॉलिसी के लिए वार्षिक प्रीमियम ₹7500 है।


    प्रश्न: क्या दावे के समय मुझे कोई राशि चुकानी होगी?

    उत्तर: हाँ, इस पॉलिसी में ₹1000 की अनिवार्य कटौती योग्य राशि (Compulsory Deductible)
    है, जो प्रत्येक दावे के समय लागू होती है।


    प्रश्न: नो-क्लेम बोनस क्या है?

    उत्तर: यदि आप पहले वर्ष में कोई दावा नहीं करते हैं, तो हम 20% का नो-क्लेम बोनस
    प्रदान करते हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: a5e9f5fa-3eb8-537f-8974-03ded277fbb8
  title: मोटर ओन-डैमेज कवर — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'अपनी पॉलिसी में विवरण अपडेट करने या किसी सामान्य अनुरोध को पूरा करने के लिए
    इन चरणों का पालन करें:


    1. हमें वह विशिष्ट विवरण बताएं जिसे आप बदलना चाहते हैं (जैसे पता या नामांकित व्यक्ति)।

    2. यदि आप नामांकित व्यक्ति (Nominee) बदल रहे हैं, तो हमें नामांकित व्यक्ति की
    अनिवार्य जानकारी प्रदान करें।

    3. हम आपकी पहचान की पुष्टि के लिए एक बहु-स्तरीय सत्यापन (OTP या बायोमेट्रिक) करेंगे।

    4. सत्यापन के बाद, हम आपके अनुरोध को संसाधित करेंगे और पुष्टि करेंगे कि बदलाव
    कर दिए गए हैं।

    5. हम आपको अपडेट किया गया पॉलिसी दस्तावेज़ ईमेल के माध्यम से भेजेंगे।


    **सफलता की पहचान:** जब आप अपने पंजीकृत ईमेल पर संशोधित पॉलिसी दस्तावेज़ प्राप्त
    करते हैं और विवरण सही होते हैं, तो अनुरोध पूर्ण माना जाता है।


    कृपया ध्यान दें कि सभी शुल्क और आवंटन पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखे
    जाते हैं ताकि पारदर्शिता बनी रहे।'
  domain: insurance
  product_category: motor_own_damage
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 37287e2b-60de-5f2a-b32f-bd6acea787c8
  title: मोटर ओन-डैमेज कवर — आपके रिकॉर्ड या विवरण में अंतर
  body: 'यदि आपको लगता है कि आपके रिकॉर्ड या पॉलिसी विवरण में कोई त्रुटि है, तो इसे
    इस प्रकार हल करें:


    **लक्षण:** पॉलिसी दस्तावेज़ में नाम, वाहन विवरण या प्रीमियम राशि (जैसे ₹7500 के
    बजाय कुछ और) गलत दिखना।


    **जांच के चरण:**

    1. अपने मूल आवेदन पत्र और भुगतान रसीद की जांच करें।

    2. जांचें कि क्या आपने हाल ही में कोई संशोधन अनुरोध किया था जो अभी तक अपडेट नहीं
    हुआ है।

    3. यदि विवरण अभी भी गलत हैं, तो हमें सही दस्तावेज़ प्रदान करें।


    **समाधान:**

    हम आपके द्वारा प्रदान किए गए दस्तावेज़ों का सत्यापन करेंगे। यदि त्रुटि हमारी ओर
    से है, तो हम इसे तुरंत सुधारेंगे और 30 दिनों के भीतर अपडेटेड दस्तावेज़ प्रदान
    करेंगे।


    **एस्केलेशन:**

    यदि विवरण में अंतर का समाधान नहीं होता है, तो हम इसे आंतरिक शिकायत अधिकारी को
    भेजेंगे। हम IRDAI के नियमों के अनुसार डेटा गोपनीयता और सटीकता सुनिश्चित करने के
    लिए प्रतिबद्ध हैं।'
  domain: insurance
  product_category: motor_own_damage
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: fab50cbe-ee91-58f1-bcf8-64a41cfd1339
  title: संस्था-व्यापी शुल्क और प्रभार
  body: "अभय इंश्योरेंस में, हम पूर्ण शुल्क पारदर्शिता में विश्वास करते हैं। हमारा\
    \ मूल्य निर्धारण प्रतिस्पर्धी है और आपके द्वारा भुगतान किए गए प्रीमियम का उपयोग\
    \ जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए किया जाता है। \n\nसभी सामान्य\
    \ आवंटन और प्रबंधन शुल्क सीधे आपके पॉलिसी दस्तावेज़ में स्पष्ट रूप से लिखे जाते\
    \ हैं। जबकि कुछ शुल्क सभी खातों पर समान रूप से लागू होते हैं, अन्य शुल्क आपके\
    \ द्वारा चुनी गई विशिष्ट योजना के आधार पर भिन्न हो सकते हैं। विस्तृत जानकारी के\
    \ लिए कृपया अपनी व्यक्तिगत पॉलिसी के विवरण की समीक्षा करें।"
  domain: insurance
  product_category: general
  document_type: fee_schedule
