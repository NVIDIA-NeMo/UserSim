- id: 34d1d365-b101-58eb-890b-9b4db3ebf664
  title: परिवार स्वास्थ्य बीमा — पात्रता शर्तें
  body: "पात्रता और कवरेज की शर्तें:\n\n- बुनियादी पात्रता: मध्यम और उच्च-आय वाले\
    \ भारतीय परिवार $\rightarrow$ पात्र\n- नामांकित व्यक्ति (Nominee) की जानकारी:\
    \ प्रदान की गई $\rightarrow$ पॉलिसी जारी होगी; प्रदान नहीं की गई $\rightarrow$\
    \ आवेदन लंबित\n- प्रारंभिक प्रतीक्षा अवधि: 30 दिन पूरे $\rightarrow$ सामान्य बीमारियाँ\
    \ कवर; 30 दिन से कम $\rightarrow$ कवर उपलब्ध नहीं\n- पूर्व-मौजूद बीमारियाँ: 36\
    \ महीने पूरे $\rightarrow$ कवर उपलब्ध; 36 महीने से कम $\rightarrow$ कवर उपलब्ध\
    \ नहीं"
