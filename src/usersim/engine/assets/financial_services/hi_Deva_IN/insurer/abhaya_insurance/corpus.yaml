- id: 3a9b978f-392d-5360-965f-83bb88d46690
  title: परिवार स्वास्थ्य बीमा — शर्तों में बदलाव की नीति
  body: 'हम अपनी सेवाओं में पारदर्शिता बनाए रखने के लिए प्रतिबद्ध हैं। परिवार स्वास्थ्य
    बीमा की शर्तों में बदलाव की नीति निम्नलिखित है:


    1. संशोधन का अधिकार: हम नियामक आवश्यकताओं या जोखिम प्रबंधन लागतों के आधार पर पॉलिसी
    की शर्तों, जैसे कि ₹9,500 का वार्षिक प्रीमियम, में बदलाव कर सकते हैं।

    2. सूचना अवधि: किसी भी महत्वपूर्ण बदलाव की सूचना हम आपको पॉलिसी दस्तावेज़ में
    दिए गए पते पर कम से कम 30 दिन पहले देंगे।

    3. सहमति और रद्दीकरण: यदि आप संशोधित शर्तों से असहमत हैं, तो आप निर्धारित फ्री-लुक
    अवधि या रद्दीकरण नियमों के तहत पॉलिसी समाप्त कर सकते हैं।

    4. स्थिरता: बीमा राशि (Sum Insured) जो ₹5,00,000 है, और कमरे के किराये की सीमा
    (जो बीमा राशि का 1% है), केवल पॉलिसी नवीनीकरण के समय या आपसी सहमति से संशोधित
    की जा सकती हैं।


    हम सुनिश्चित करते हैं कि सभी बदलाव IRDAI के दिशा-निर्देशों के अनुरूप हों।'
  domain: insurance
  product_category: health_indemnity
  document_type: terms_conditions
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 56adca45-8d03-5313-9d11-80f71ee6f58c
  title: परिवार स्वास्थ्य बीमा — शुरुआत कैसे करें
  body: 'एक सहायता एजेंट के रूप में, ग्राहक को परिवार स्वास्थ्य बीमा शुरू करने में
    मदद करने के लिए इन मुख्य विवरणों का उपयोग करें:


    उत्पाद विवरण:

    - बीमा राशि (Sum Insured): ₹5,00,000

    - वार्षिक प्रीमियम: ₹9,500

    - कमरे के किराये की सीमा: बीमा राशि का 1%


    प्रतीक्षा अवधियाँ:

    - प्रारंभिक प्रतीक्षा अवधि: 30 दिन (इस अवधि के बाद सामान्य बीमारियाँ कवर होती
    हैं)

    - पूर्व-मौजूद बीमारियों के लिए प्रतीक्षा अवधि: 36 महीने


    शुरुआत की प्रक्रिया:

    1. ग्राहक की पात्रता और स्वास्थ्य विवरण सत्यापित करें।

    2. नामांकित व्यक्ति (nominee) की अनिवार्य जानकारी प्राप्त करें।

    3. प्रीमियम भुगतान प्राप्त करें और पॉलिसी दस्तावेज़ जारी करें।

    4. ग्राहक को ''फ्री-लुक अवधि'' के बारे में शिक्षित करें, जहाँ वे शर्तों की समीक्षा
    कर सकते हैं।


    यह उत्पाद मध्यम और उच्च-आय वाले परिवारों के लिए एक व्यापक स्वास्थ्य सुरक्षा समाधान
    है।'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 28bb9925-87e9-5dca-96e8-7be430209ff5
  title: परिवार स्वास्थ्य बीमा — प्रारंभिक प्रतीक्षा अवधि (दिन) की व्याख्या
  body: 'प्रश्न: परिवार स्वास्थ्य बीमा में ''प्रारंभिक प्रतीक्षा अवधि'' क्या है और
    यह कितने दिनों की है?

    उत्तर: प्रारंभिक प्रतीक्षा अवधि वह समय है जब पॉलिसी शुरू होने के बाद कुछ सामान्य
    बीमारियों के लिए कवर उपलब्ध नहीं होता है। इस उत्पाद के लिए यह अवधि 30 दिन है।
    इसका अर्थ है कि पॉलिसी सक्रिय होने के पहले 30 दिनों के दौरान होने वाली बीमारियों
    के लिए दावा नहीं किया जा सकता (दुर्घटनाओं को छोड़कर)।


    अधिक जानकारी के लिए ''परिवार स्वास्थ्य बीमा — सीमाएँ, प्रतिबंध और अपवाद स्थितियाँ''
    देखें।'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f46b1b0f-e900-5fc4-988d-0f0c13e8d33b
  title: परिवार स्वास्थ्य बीमा — बदलाव या अद्यतन करना
  body: 'अपनी परिवार स्वास्थ्य बीमा पॉलिसी में विवरण अपडेट करने के लिए इन चरणों का
    पालन करें:


    1. हमें वह विशिष्ट जानकारी बताएं जिसे आप बदलना चाहते हैं (जैसे पता, फोन नंबर या
    नामांकित व्यक्ति का विवरण)।

    2. पहचान सत्यापन के लिए अपना पॉलिसी नंबर प्रदान करें। हम आपके पंजीकृत मोबाइल पर
    एक ओटीपी (OTP) भेजेंगे या बायोमेट्रिक सत्यापन का अनुरोध करेंगे।

    3. सत्यापन सफल होने के बाद, हम आपसे नए विवरणों का प्रमाण (जैसे पहचान पत्र या पता
    प्रमाण) मांगेंगे।

    4. आवश्यक दस्तावेज़ साझा करने के बाद, हम विवरणों को अपडेट करेंगे और आपको एक पुष्टिकरण
    ईमेल भेजेंगे।


    आप यह जान पाएंगे कि प्रक्रिया पूरी हो गई है जब आपको एक संशोधित पॉलिसी विवरण दस्तावेज़
    प्राप्त होगा जिसमें अद्यतित जानकारी दर्ज होगी।'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 8d99d5d7-9b79-51c1-8856-5626b11ec1c7
  title: परिवार स्वास्थ्य बीमा — एक्सेस या लॉगिन समस्याएँ
  body: 'यदि आप अपने डिजिटल पोर्टल या पॉलिसी विवरणों तक पहुँचने में असमर्थ हैं, तो
    कृपया निम्नलिखित जाँचें:


    लक्षण: ''अमान्य क्रेडेंशियल'' का संदेश या ओटीपी (OTP) प्राप्त न होना।


    समाधान के चरण:

    1. सुनिश्चित करें कि आप अपने पंजीकृत मोबाइल नंबर और ईमेल का उपयोग कर रहे हैं।

    2. यदि ओटीपी नहीं मिल रहा है, तो अपने नेटवर्क सिग्नल की जाँच करें और 2 मिनट प्रतीक्षा
    करें।

    3. यदि पासवर्ड भूल गए हैं, तो हमसे ''पासवर्ड रीसेट'' का अनुरोध करें। हम आपकी पहचान
    सत्यापित करने के लिए बहु-स्तरीय प्रमाणीकरण प्रक्रिया शुरू करेंगे।


    यदि समस्या बनी रहती है, तो हम इस मामले को अपने आंतरिक तकनीकी विशेषज्ञ दल के पास
    भेजेंगे। आपको 48 कार्य घंटों के भीतर एक समाधान ईमेल या कॉल प्राप्त होगा।'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: f8875d75-b814-536b-b2f9-ab1930e0d910
  title: परिवार स्वास्थ्य बीमा — पात्रता श्रेणियाँ
  body: "परिवार स्वास्थ्य बीमा के लिए पात्रता मानदंड:\n\n- आयु वर्ग (प्रवेश): 18 से\
    \ 65 वर्ष $\rightarrow$ पात्र (मानक प्रीमियम ₹9,500)\n- आयु वर्ग (वरिष्ठ नागरिक):\
    \ 65 वर्ष से अधिक $\rightarrow$ चिकित्सा जांच के अधीन पात्र\n- आय समूह: मध्यम\
    \ और उच्च आय वाले भारतीय परिवार $\rightarrow$ पात्र\n- स्वास्थ्य स्थिति: पूर्व-मौजूद\
    \ बीमारियाँ $\rightarrow$ पात्र (36 महीने की प्रतीक्षा अवधि के साथ)"
  domain: insurance
  product_category: health_indemnity
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
