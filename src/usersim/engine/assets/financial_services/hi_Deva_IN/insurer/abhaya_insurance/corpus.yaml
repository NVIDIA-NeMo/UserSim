- id: 8b7f8cf3-bc15-5218-8ccf-3418575e833d
  title: ULIP वेल्थ प्लान — शर्तों में बदलाव की नीति
  body: 'यह दस्तावेज़ ''ULIP वेल्थ प्लान'' की शर्तों में संशोधन की प्रक्रिया को निर्धारित
    करता है।


    1. शुल्क संशोधन: हम बाजार की स्थितियों या परिचालन लागतों के आधार पर प्रीमियम आवंटन
    शुल्क (वर्तमान में 3%) और फंड प्रबंधन शुल्क (वर्तमान में 1.35%) में बदलाव कर सकते
    हैं।

    2. लॉक-इन अवधि: नियामक मानदंडों के अनुसार, इस प्लान में 5 वर्ष की लॉक-इन अवधि
    अनिवार्य है। इस अवधि के दौरान फंड की निकासी की अनुमति नहीं है।

    3. सूचना अवधि: किसी भी महत्वपूर्ण शर्त या शुल्क में बदलाव करने से पहले, हम आपको
    पंजीकृत ईमेल या डाक के माध्यम से 30 दिनों की अग्रिम सूचना प्रदान करेंगे।

    4. सहमति और समाप्ति: यदि आप संशोधित शर्तों से असहमत हैं, तो आप पॉलिसी दस्तावेज़
    प्राप्त करने के बाद निर्धारित ''फ्री-लुक अवधि'' के भीतर पॉलिसी रद्द कर सकते हैं।


    हम IRDAI के नियमों का सख्ती से पालन करते हैं ताकि पारदर्शिता और सुरक्षा सुनिश्चित
    की जा सके।'
