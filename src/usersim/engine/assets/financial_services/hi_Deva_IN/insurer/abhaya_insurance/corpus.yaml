- id: 77500f5d-79d4-5c56-bf2f-787def5fc353
  title: परिवार स्वास्थ्य बीमा — शुल्क अनुसूची
  body: 'हम शुल्क पारदर्शिता में विश्वास रखते हैं। ''परिवार स्वास्थ्य बीमा'' के लिए
    लागू शुल्क निम्नलिखित हैं:


    - वार्षिक प्रीमियम: ₹9500

    - आवंटन और प्रबंधन शुल्क: जैसा कि आपके व्यक्तिगत पॉलिसी दस्तावेज़ में स्पष्ट रूप
    से लिखा गया है।


    इन प्रीमियम का उपयोग जोखिम प्रबंधन और हमारे परिचालन लागतों को कवर करने के लिए
    किया जाता है।'
