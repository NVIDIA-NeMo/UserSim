- id: fa684f30-decf-5d4a-9d6c-560a193e7c9d
  title: ULIP वेल्थ प्लान — खाता अनुबंध
  body: 'यह अनुबंध अभय इंश्योरेंस और पॉलिसीधारक के बीच ULIP वेल्थ प्लान के संचालन
    को नियंत्रित करता है।


    1. प्रीमियम भुगतान: पॉलिसीधारक ₹50000 के वार्षिक प्रीमियम का भुगतान करने के लिए
    बाध्य है। भुगतान में चूक होने पर पॉलिसी की स्थिति प्रभावित हो सकती है।

    2. शुल्क संरचना: हम प्रीमियम राशि से 3% प्रीमियम आवंटन शुल्क काटेंगे। इसके अतिरिक्त,
    फंड प्रबंधन के लिए 1.35% का वार्षिक फंड प्रबंधन शुल्क लागू होगा। ये शुल्क पॉलिसी
    दस्तावेज़ में स्पष्ट रूप से लिखे गए हैं।

    3. लॉक-इन अवधि: इस योजना में 5 वर्ष की अनिवार्य लॉक-इन अवधि है, जिसके दौरान फंड
    की निकासी प्रतिबंधित है।

    4. नामांकन: नामांकित व्यक्ति (Nominee) की जानकारी प्रदान करना अनिवार्य है। मृत्यु
    लाभ केवल वैध नामांकित व्यक्ति को देय होगा।

    5. अनुबंध की समाप्ति: पॉलिसीधारक फ्री-लुक अवधि के दौरान या लॉक-इन अवधि के बाद
    शर्तों के अनुसार पॉलिसी बंद कर सकता है।


    ***

    कानूनी डिस्क्लेमर: यह एक कानूनी अनुबंध है। विस्तृत विवरण के लिए कृपया अपने आधिकारिक
    पॉलिसी दस्तावेज़ को देखें।

    ***'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: terms_conditions
  source_authority: official
