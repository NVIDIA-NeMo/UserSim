- id: c8085c68-7cc4-5ce8-b6dc-effcb4c8836b
  title: परिवार स्वास्थ्य बीमा — रेफरल और लॉयल्टी ऑफर
  body: हम अपने मौजूदा ग्राहकों के भरोसे की सराहना करते हैं। यदि आप परिवार स्वास्थ्य
    बीमा की सुरक्षा को अपने मित्रों या परिवार के साथ साझा करते हैं, तो हम आपको एक
    विशेष रेफरल लाभ प्रदान करते हैं। 1 अक्टूबर 2023 से 31 दिसंबर 2023 तक, प्रत्येक
    सफल रेफरल (पॉलिसी जारी होने के बाद) पर आपको ₹500 का लॉयल्टी बोनस मिलेगा। यह बोनस
    आपके अगले वार्षिक प्रीमियम भुगतान में समायोजित किया जाएगा। सुरक्षा का दायरा बढ़ाएं
    और अभय इंश्योरेंस के साथ अपने प्रियजनों को मानसिक शांति प्रदान करें।
  domain: insurance
  product_category: health_indemnity
  document_type: promo_notice
  source_authority: official
