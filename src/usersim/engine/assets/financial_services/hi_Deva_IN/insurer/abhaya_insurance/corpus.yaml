- id: 19d4ac0b-8737-55d9-a0bd-991d3f0bac77
  title: ULIP वेल्थ प्लान — धोखाधड़ी और अनधिकृत गतिविधि से सुरक्षा
  body: 'अभय इंश्योरेंस में, हम आपके निवेश और सुरक्षा की गोपनीयता को प्राथमिकता देते
    हैं। ULIP वेल्थ प्लान के ग्राहकों को अक्सर ऐसे स्कैम का सामना करना पड़ता है जहाँ
    जालसाज ''गारंटीड रिटर्न'' या ''पॉलिसी बोनस'' का लालच देकर आपके संवेदनशील विवरण
    मांगते हैं।


    कृपया ध्यान दें कि हम आपसे कभी भी आपका ओटीपी (OTP), बायोमेट्रिक डेटा या पासवर्ड
    साझा करने के लिए नहीं कहेंगे। किसी भी पॉलिसी बदलाव या भुगतान से पहले हमारा बहु-स्तरीय
    पहचान सत्यापन अनिवार्य है।


    यदि आपको कोई संदिग्ध कॉल या ईमेल प्राप्त होता है, या आपके फंड में कोई अनधिकृत
    बदलाव दिखता है, तो तुरंत हमें सूचित करें। धोखाधड़ी की रिपोर्ट करने के लिए निर्धारित
    समय सीमा का पालन करना आवश्यक है ताकि हम त्वरित जांच कर सकें। हम धोखाधड़ी के प्रति
    शून्य-सहनशीलता की नीति अपनाते हैं और सभी दावों की निष्पक्ष जांच करते हैं।


    ***

    कानूनी डिस्क्लेमर: सुरक्षा उपाय IRDAI के नियमों के अधीन हैं। अनधिकृत पहुँच की
    रिपोर्ट न करने पर देयता प्रभावित हो सकती है।

    ***'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: security_advisory
