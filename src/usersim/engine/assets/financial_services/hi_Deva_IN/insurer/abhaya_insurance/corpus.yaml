  institution_id: abhaya_insurance
- id: f028dc7e-6d99-5858-82bf-e0cacecb2b94
  title: अभय टर्म लाइफ कवर — खाता अनुबंध
  body: 'यह अनुबंध अभय इंश्योरेंस और पॉलिसीधारक के बीच के कानूनी संबंधों को परिभाषित
    करता है।


    1. **प्रीमियम भुगतान**: पॉलिसीधारक ₹12000 के वार्षिक प्रीमियम का भुगतान समय पर
    करने के लिए बाध्य है। यदि भुगतान तिथि निकल जाती है, तो हम 30 दिनों की छूट अवधि
    (Grace Period) प्रदान करते हैं, जिसके भीतर भुगतान करने पर कवर जारी रहता है।

    2. **कवर और अवधि**: हम पॉलिसी अवधि 30 वर्ष के लिए ₹10000000 की बीमित राशि (Sum
    Assured) प्रदान करने के लिए प्रतिबद्ध हैं।

    3. **पॉलिसी रद्दीकरण**: ग्राहक को पॉलिसी दस्तावेज़ प्राप्त होने के बाद 15 दिनों
    की फ्री-लुक अवधि (Free-look Period) मिलती है, जिसके दौरान शर्तों से असहमत होने
    पर पॉलिसी रद्द की जा सकती है।

    4. **नामांकन**: पॉलिसी की वैधता के लिए एक नामांकित व्यक्ति (Nominee) की जानकारी
    अनिवार्य है।

    5. **समाप्ति**: यदि छूट अवधि के बाद भी प्रीमियम का भुगतान नहीं किया जाता है, तो
    पॉलिसी लैप्स हो जाएगी और कवर समाप्त हो जाएगा।


    <div style="border: 1px solid #000; padding: 10px;">

    डिस्क्लेमर: यह उत्पाद एक शुद्ध सुरक्षा योजना है, इसे निवेश के रूप में नहीं देखा
    जाना चाहिए।

    </div>'
  domain: insurance
  product_category: term_life_cover
  document_type: terms_conditions
  source_authority: official
