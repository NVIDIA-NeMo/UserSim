- id: 14451810-3060-5078-93be-d289707ac7ce
  title: ULIP वेल्थ प्लान — विकल्पों से तुलना और कब न चुनें
  body: 'ULIP वेल्थ प्लान सुरक्षा और निवेश का एक संतुलित मिश्रण है, लेकिन यह हर किसी
    के लिए नहीं है।


    तुलना:

    - शुद्ध सुरक्षा बनाम धन सृजन: यदि आपका लक्ष्य न्यूनतम प्रीमियम पर अधिकतम जीवन
    सुरक्षा है, तो ''अभय टर्म लाइफ कवर — सिंहावलोकन'' एक बेहतर विकल्प है।

    - तरलता (Liquidity): यदि आपको अगले 5 वर्ष तक अपने पैसे की तत्काल आवश्यकता हो सकती
    है, तो इस उत्पाद को न चुनें, क्योंकि इसमें 5 वर्ष की लॉक-इन अवधि है।

    - लागत संवेदनशीलता: इस प्लान में 3% प्रीमियम आवंटन शुल्क और 1.35% फंड प्रबंधन
    शुल्क शामिल है।


    यह उत्पाद उन मध्यम और उच्च-आय वाले परिवारों के लिए आदर्श है जो ₹50000 का वार्षिक
    निवेश करने में सक्षम हैं और दीर्घकालिक संपत्ति निर्माण के साथ बीमा सुरक्षा चाहते
    हैं।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 4d1cdec3-2049-5c1d-9526-89f4b320c337
  title: ULIP वेल्थ प्लान — लागत और शुल्क
  body: 'प्रश्न: ULIP वेल्थ प्लान से जुड़ी कुल लागतें क्या हैं?

    उत्तर: इस प्लान में पारदर्शिता बनाए रखने के लिए सभी शुल्क पॉलिसी दस्तावेज़ में
    स्पष्ट हैं। मुख्य शुल्क निम्नलिखित हैं:

    1. प्रीमियम आवंटन शुल्क: यह 3% है, जो आपके प्रीमियम से काटा जाता है।

    2. फंड प्रबंधन शुल्क: निवेश के प्रबंधन के लिए 1.35% का शुल्क लिया जाता है।

    इन शुल्कों का उपयोग जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए किया जाता
    है।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: c6a93172-da6d-5c50-918d-c44ff4925ced
  title: ULIP वेल्थ प्लान — एक सामान्य अनुरोध का पूर्ण समाधान
  body: 'फंड स्विचिंग या विवरण अपडेट करने जैसे सामान्य अनुरोधों को पूरा करने की प्रक्रिया:


    1. हमें वह विशिष्ट बदलाव बताएं जो आप करना चाहते हैं (जैसे: फंड विकल्प बदलना)।

    2. हम आपकी पहचान की पुष्टि के लिए बहु-स्तरीय सत्यापन (ओटीपी या बायोमेट्रिक) करेंगे।

    3. यदि आप फंड स्विच कर रहे हैं, तो हम आपको वर्तमान फंड वैल्यू और नए फंड के जोखिम
    प्रोफाइल के बारे में शिक्षित करेंगे।

    4. हम आपके अनुरोध को प्रोसेस करेंगे और पुष्टि करेंगे कि प्रीमियम आवंटन शुल्क (3%)
    या अन्य लागू शुल्क आपके निवेश पर कैसे प्रभाव डालते हैं।

    5. प्रक्रिया पूरी होने पर, हम आपको एक पुष्टिकरण संदेश और अपडेटेड पॉलिसी सारांश
    भेजेंगे।


    यह प्रक्रिया सुनिश्चित करती है कि आपके निवेश का प्रबंधन आपकी इच्छा और नियमों के
    अनुसार हो।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 150f9260-07c7-549e-b361-9224f53af5f1
  title: ULIP वेल्थ प्लान — आपके रिकॉर्ड या विवरण में अंतर
  body: 'लक्षण: ग्राहक को लगता है कि उनके स्टेटमेंट में दिखाई गई फंड वैल्यू या प्रीमियम
    राशि (₹50000) उनके रिकॉर्ड से मेल नहीं खा रही है।


    जांच के चरण:

    1. सबसे पहले, प्रीमियम आवंटन शुल्क (3%) की कटौती की जांच करें; यह राशि कुल प्रीमियम
    से घटाई जाती है और निवेश योग्य राशि कम हो जाती है।

    2. फंड प्रबंधन शुल्क (1.35%) के प्रभाव को देखें, जो समय-समय पर फंड वैल्यू से समायोजित
    किया जाता है।

    3. सत्यापित करें कि क्या कोई प्रीमियम भुगतान लंबित है या देरी से प्राप्त हुआ है।


    समाधान:

    हम आपके स्टेटमेंट का विस्तृत विश्लेषण करेंगे और शुल्क कटौती का स्पष्ट विवरण प्रदान
    करेंगे। यदि गणना में कोई वास्तविक त्रुटि पाई जाती है, तो हम इसे तुरंत ठीक करेंगे
    और संशोधित विवरण भेजेंगे। यदि आप संतुष्ट नहीं हैं, तो हम मामले को बीमा लोकपाल
    (Insurance Ombudsman) के पास भेजने की प्रक्रिया शुरू कर सकते हैं।'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: ebbf01e4-0672-5559-b60e-ffad6e978ba3
  title: मोटर ओन-डैमेज कवर — सिंहावलोकन
  body: 'अभय इंश्योरेंस का मोटर ओन-डैमेज कवर आपके वाहन के लिए एक व्यापक सुरक्षा कवच
    है, जिसे विशेष रूप से मध्यम और उच्च-आय वाले परिवारों को मानसिक शांति प्रदान करने
    के लिए डिज़ाइन किया गया है। हम दुर्घटनाओं, चोरी और प्राकृतिक आपदाओं से होने वाले
    नुकसान की भरपाई में आपकी सहायता करते हैं।


    इस प्लान की मुख्य विशेषताएं और वित्तीय विवरण निम्नलिखित हैं:

    - वार्षिक प्रीमियम: ₹7500

    - अनिवार्य कटौती योग्य राशि (Compulsory Deductible): ₹1000

    - पहले वर्ष का नो-क्लेम बोनस (NCB): 20%

    - दावा निपटान समय: 30 दिन


    हमारा उद्देश्य सरल प्रक्रियाओं और नैतिक अंडरराइटिंग के माध्यम से आपको सर्वोत्तम
    सुरक्षा प्रदान करना है।


    ***

    कानूनी डिस्क्लेमर: यह उत्पाद सुरक्षा के लिए है, निवेश के लिए नहीं। सभी शर्तें
    पॉलिसी दस्तावेज़ के अधीन हैं। हम व्यक्तिगत कानूनी या कर सलाहकार के रूप में कार्य
    नहीं करते हैं।'
