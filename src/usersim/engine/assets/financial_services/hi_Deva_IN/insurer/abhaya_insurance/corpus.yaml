  institution_id: abhaya_insurance
- id: 7ad68044-8ed6-566a-8700-15c4b781efb6
  title: get_claim_status का उपयोग कब करें
  body: 'एक बार दावा दायर हो जाने के बाद, ग्राहक अक्सर यह जानना चाहते हैं कि उनके
    आवेदन की प्रगति क्या है। get_claim_status का उपयोग तब किया जाता है जब ग्राहक यह
    पूछना चाहता है कि उनका दावा वर्तमान में किस चरण (जैसे दस्तावेज़ समीक्षा, जांच,
    या अंतिम निपटान) में है। हम पारदर्शी प्रक्रिया सुनिश्चित करते हैं ताकि ग्राहक
    को मानसिक शांति मिले।


    **कार्यवाही के चरण:**

    1. `verify_identity` के माध्यम से अनुरोधकर्ता की पहचान सत्यापित करें।

    2. `get_accounts` का उपयोग करके सही पॉलिसी आईडी की पुष्टि करें।

    3. विशिष्ट दावा संदर्भ संख्या (यदि उपलब्ध हो) प्राप्त करें।

    4. दावे की वर्तमान स्थिति और किसी भी लंबित आवश्यकता को जानने के लिए `get_claim_status`
    टूल का उपयोग करें।


    दावे की सूचना से निपटान तक की प्रक्रिया स्पष्ट और समयबद्ध होती है।'
  domain: insurance
  product_category: procedure
  document_type: policy_procedure
  source_authority: official
  placeholder: true
  mentions_tools:
  - get_claim_status
  institution_id: abhaya_insurance
- id: b658626e-1e66-5dd8-b436-0a3db0b7d7f0
  title: get_claim_status टूल संदर्भ
  body: 'यह टूल एजेंट को किसी सक्रिय दावे की वर्तमान स्थिति और प्रगति की जांच करने
    की अनुमति देता है। एजेंट इस जानकारी को सीधे get_claim_status टूल को कॉल करके प्राप्त
    करता है।


    **सिग्नेचर:** `get_claim_status(claim_id: string)`

    **तर्क (Args):**

    - `claim_id`: दावा आवेदन की विशिष्ट संदर्भ आईडी।

    **प्रभाव:** यह दावे की वर्तमान स्थिति (जैसे: Pending, Approved, Rejected, In-Review)
    और अगले चरणों का विवरण प्रदान करता है।'
