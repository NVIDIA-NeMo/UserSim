  institution_id: abhaya_insurance
- id: e7edbe7e-031d-5da4-826f-83b081e7bcd6
  title: ULIP वेल्थ प्लान — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'ULIP वेल्थ प्लान सुरक्षा और बाजार-आधारित धन सृजन का एक संतुलित मिश्रण है।
    यह उन मध्यम और उच्च-आय वाले भारतीय परिवारों के लिए सबसे उपयुक्त है जो जीवन बीमा
    के साथ-साथ दीर्घकालिक पूंजी वृद्धि चाहते हैं।


    यह उत्पाद उन व्यक्तियों के लिए आदर्श है जो:

    - ₹50000 के वार्षिक प्रीमियम के साथ एक अनुशासित निवेश शुरू करना चाहते हैं।

    - 5 वर्ष या उससे अधिक की अवधि के लिए निवेश करने के इच्छुक हैं (लॉक-इन अवधि के
    कारण)।

    - बाजार के जोखिमों को समझते हुए पेशेवर फंड प्रबंधन (जिसका शुल्क 1.35% है) का लाभ
    उठाना चाहते हैं।


    मुख्य वित्तीय विवरण:

    - वार्षिक प्रीमियम: ₹50000

    - लॉक-इन अवधि: 5 वर्ष

    - प्रीमियम आवंटन शुल्क: 3%

    - फंड प्रबंधन शुल्क: 1.35%


    हमारा उद्देश्य सरल प्रक्रियाओं के माध्यम से आपको मानसिक शांति और वित्तीय सुरक्षा
    प्रदान करना है।


    ***

    कानूनी डिस्क्लेमर: यह उत्पाद निवेश के बजाय सुरक्षा के रूप में देखा जाना चाहिए।
    हम व्यक्तिगत कर सलाहकार के रूप में कार्य नहीं करते हैं।

    ***'
  domain: insurance
  product_category: ulip_wealth_plan
  document_type: product_sheet
