  institution_id: abhaya_insurance
- id: 8e00d4cf-da05-5751-8d33-0e4b30e81ae0
  title: परिवार स्वास्थ्य बीमा — सेटअप और सक्रियण
  body: 'अपने परिवार के लिए सुरक्षा सुनिश्चित करने हेतु ''परिवार स्वास्थ्य बीमा''
    को सक्रिय करने के लिए इन चरणों का पालन करें:


    1. हमें अपनी बुनियादी व्यक्तिगत जानकारी, परिवार के सदस्यों का विवरण और एक अनिवार्य
    नामांकित व्यक्ति (Nominee) की जानकारी प्रदान करें।

    2. अपनी स्वास्थ्य स्थिति का विवरण साझा करें ताकि हम नैतिक अंडरराइटिंग प्रक्रिया
    पूरी कर सकें।

    3. ₹9500 के वार्षिक प्रीमियम का भुगतान करें।

    4. हम आपके विवरणों का बहु-स्तरीय पहचान सत्यापन करेंगे, जिसमें ओटीपी (OTP) आधारित
    प्रमाणीकरण शामिल हो सकता है।

    5. सत्यापन सफल होने के बाद, हम आपको आपका पॉलिसी दस्तावेज़ जारी करेंगे।


    एक बार पॉलिसी जारी होने के बाद, आपकी 30 दिन की प्रारंभिक प्रतीक्षा अवधि शुरू हो
    जाएगी, जिसके बाद ही अधिकांश कवर सक्रिय होते हैं। आप अपने दस्तावेज़ प्राप्त करने
    के बाद फ्री-लुक अवधि के भीतर शर्तों की समीक्षा कर सकते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
