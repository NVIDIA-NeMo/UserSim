- id: 457e1626-8a12-51ca-afd4-7860fdd81dce
  title: परिवार स्वास्थ्य बीमा — यह किसके लिए सबसे उपयुक्त है और सामान्य उपयोग
  body: 'परिवार स्वास्थ्य बीमा विशेष रूप से उन मध्यम और उच्च-आय वाले भारतीय परिवारों
    के लिए डिज़ाइन किया गया है जो अपने परिवार के लिए एक व्यापक और पारदर्शी स्वास्थ्य
    सुरक्षा कवच चाहते हैं।


    यह उत्पाद उन लोगों के लिए सबसे उपयुक्त है जो:

    - अस्पताल के बड़े खर्चों से अपनी बचत को सुरक्षित रखना चाहते हैं।

    - ₹500,000 की पर्याप्त बीमा राशि के साथ मानसिक शांति चाहते हैं।

    - एक सरल और किफायती योजना की तलाश में हैं, जिसका वार्षिक प्रीमियम ₹9,500 है।


    सामान्य उपयोग में अस्पताल में भर्ती होने के खर्च, रूम-रेंट का प्रबंधन (बीमा राशि
    का 1% तक) और गंभीर बीमारियों का कवर शामिल है। कृपया ध्यान दें कि पॉलिसी शुरू होने
    के बाद 30 दिनों की प्रारंभिक प्रतीक्षा अवधि और पूर्व-मौजूद स्थितियों के लिए 36
    महीनों की प्रतीक्षा अवधि लागू होती है। हम इस उत्पाद को निवेश के बजाय सुरक्षा के
    रूप में देखने का सुझाव देते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: product_sheet
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 6fe5d858-49a3-5c32-8b52-0ee848daab44
  title: परिवार स्वास्थ्य बीमा — वार्षिक प्रीमियम की व्याख्या
  body: 'प्रश्न: परिवार स्वास्थ्य बीमा के लिए मुझे हर साल कितना भुगतान करना होगा?

    उत्तर: इस पॉलिसी के लिए वार्षिक प्रीमियम ₹9,500 है। यह राशि आपके जोखिम प्रबंधन
    और हमारी परिचालन लागतों को कवर करने के लिए उपयोग की जाती है।


    प्रश्न: क्या इस प्रीमियम में कोई छिपा हुआ शुल्क है?

    उत्तर: नहीं, हम पूर्ण पारदर्शिता बनाए रखते हैं। सभी शुल्क और आवंटन पॉलिसी दस्तावेज़
    में स्पष्ट रूप से लिखे जाते हैं। अधिक जानकारी के लिए आप परिवार स्वास्थ्य बीमा
    — शुल्क अनुसूची देख सकते हैं।'
  domain: insurance
  product_category: health_indemnity
  document_type: faq
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 4b010c2d-d4d7-5e4c-b3a0-1a1219ff75e3
  title: परिवार स्वास्थ्य बीमा — रद्द करना, बंद करना या डाउनग्रेड करना
  body: 'यदि आप अपनी पॉलिसी को रद्द करना, बंद करना या उसकी बीमा राशि को डाउनग्रेड
    करना चाहते हैं, तो इन चरणों का पालन करें:


    1. हमें अपनी पॉलिसी संख्या और रद्द करने या डाउनग्रेड करने का कारण बताएं।

    2. यदि आप पॉलिसी दस्तावेज़ प्राप्त करने के बाद ''फ्री-लुक अवधि'' के भीतर हैं,
    तो हमें लिखित अनुरोध प्रदान करें।

    3. हम आपके द्वारा प्रदान की गई पहचान का बहु-स्तरीय सत्यापन (ओटीपी या बायोमेट्रिक)
    करेंगे।

    4. यदि कोई रिफंड देय है, तो हम आपके पंजीकृत बैंक खाते में राशि जमा करेंगे और आपको
    इसकी पुष्टि भेजेंगे।

    5. एक बार प्रक्रिया पूरी हो जाने पर, हम आपको पॉलिसी बंद होने या संशोधित कवरेज
    (डाउनग्रेड के मामले में) का पुष्टिकरण दस्तावेज़ प्रदान करेंगे।'
  domain: insurance
  product_category: health_indemnity
  document_type: how_to_guide
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 99a628ec-9bfb-5f1a-9b82-26d152fef255
  title: परिवार स्वास्थ्य बीमा — अनपेक्षित शुल्क या राशि
  body: 'यदि आपको अपने खाते या प्रीमियम भुगतान में कोई ऐसी राशि दिखती है जिसकी आपने
    अपेक्षा नहीं की थी, तो कृपया निम्नलिखित कदम उठाएं:


    - समस्या की पहचान करें: जांचें कि क्या यह राशि वार्षिक प्रीमियम ₹9,500 से अधिक
    है या यह कोई पुराना बकाया शुल्क है।

    - दस्तावेज़ जांचें: अपने पॉलिसी दस्तावेज़ में लिखे प्रबंधन शुल्क और आवंटन विवरणों
    की समीक्षा करें।

    - हमें विवरण दें: यदि विसंगति बनी रहती है, तो हमें भुगतान की तारीख और सटीक राशि
    बताएं।


    हम आंतरिक रूप से इस शुल्क की जांच करेंगे। यदि यह हमारी गलती है, तो हम संबंधित
    राशि को आपके खाते में वापस जमा करेंगे या अगले प्रीमियम में समायोजित करेंगे। यदि
    विवाद बना रहता है, तो मामला हमारे आंतरिक शिकायत अधिकारी और उसके बाद बीमा लोकपाल
    (Insurance Ombudsman) के पास भेजा जाएगा।'
  domain: insurance
  product_category: health_indemnity
  document_type: troubleshooting
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 35e51187-81d0-52bf-803f-7371221bbdba
  title: परिवार स्वास्थ्य बीमा — आवश्यक दस्तावेज़
  body: 'पॉलिसी जारी करने के लिए निम्नलिखित दस्तावेज़ अनिवार्य हैं:


    - पहचान प्रमाण: आधार कार्ड, पैन कार्ड या पासपोर्ट (अनिवार्य)।

    - आयु प्रमाण: जन्म प्रमाण पत्र या स्कूल छोड़ने का प्रमाण पत्र।

    - स्वास्थ्य विवरण: पिछले 36 महीनों का चिकित्सा इतिहास और डॉक्टर की रिपोर्ट।

    - नामांकन: नामांकित व्यक्ति (Nominee) की पूरी जानकारी और पहचान प्रमाण।

    - फोटो: सभी बीमित सदस्यों की हालिया पासपोर्ट आकार की तस्वीरें।'
  domain: insurance
  product_category: health_indemnity
  document_type: eligibility_matrix
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 78999fc8-987f-5931-af85-320ef50f78fd
  title: परिवार स्वास्थ्य बीमा — प्रतिस्पर्धी की सामान्य पेशकश से तुलना
  body: 'बाजार की सामान्य पेशकशों की तुलना में, परिवार स्वास्थ्य बीमा ₹500,000 की
    बीमा राशि और ₹9,500 के प्रतिस्पर्धी वार्षिक प्रीमियम के साथ एक संतुलित सुरक्षा
    प्रदान करता है। जहाँ कई प्रतिस्पर्धी रूम-रेंट पर सख्त सीमाएं लगाते हैं, हम स्पष्ट
    रूप से बीमा राशि के 1% की सीमा प्रदान करते हैं।


    हमारा मुख्य लाभ हमारी नैतिक अंडरराइटिंग और सरल दावा प्रक्रिया है। यदि आप केवल
    सबसे सस्ता प्रीमियम चाहते हैं, तो कुछ बुनियादी प्लान बेहतर हो सकते हैं, लेकिन
    जो परिवार पारदर्शिता और विश्वसनीय दावे निपटान को प्राथमिकता देते हैं, उनके लिए
    हमारा यह प्लान सबसे उपयुक्त है।'
  domain: insurance
  product_category: health_indemnity
  document_type: comparison
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 9137cd4b-dedd-5db5-9fc9-6f1b4bb74a07
  title: परिवार स्वास्थ्य बीमा — जोखिम प्रकटीकरण
  body: 'यह प्रकटीकरण ग्राहक को परिवार स्वास्थ्य बीमा से जुड़े महत्वपूर्ण जोखिमों
    और सीमाओं के बारे में शिक्षित करने के लिए है।


    कृपया ध्यान दें कि यह उत्पाद निवेश नहीं बल्कि सुरक्षा है। इसमें निम्नलिखित समय-सीमाएं
    लागू हैं:

    - पॉलिसी शुरू होने के पहले 30 दिनों तक अधिकांश दावों के लिए ''प्रारंभिक प्रतीक्षा
    अवधि'' होती है।

    - पूर्व-मौजूद बीमारियों के लिए, कवर का लाभ उठाने के लिए 36 महीनों की प्रतीक्षा
    अवधि पूरी करना अनिवार्य है।

    - अस्पताल के कमरे के किराये के लिए भुगतान बीमा राशि के 1% तक ही सीमित है; इससे
    अधिक का खर्च पॉलिसीधारक को वहन करना होगा।


    हम IRDAI के नियमों का सख्ती से पालन करते हैं। किसी भी दावे की स्वीकृति हमारी निष्पक्ष
    जांच और पॉलिसी में लिखित बहिष्करणों (Exclusions) पर निर्भर करती।'
  domain: insurance
  product_category: health_indemnity
  document_type: disclosure
  source_authority: official
  placeholder: true
  mentions_tools: []
  institution_id: abhaya_insurance
- id: 08316b51-7925-5ceb-a94f-3011d9a9b350
  title: परिवार स्वास्थ्य बीमा — दरें कैसे श्रेणीबद्ध और लागू होती हैं
  body: 'परिवार स्वास्थ्य बीमा के लिए एक मानक दर संरचना लागू होती है। इस उत्पाद के
    लिए वार्षिक प्रीमियम ₹9,500 निर्धारित है, जो सभी पात्र सदस्यों के लिए एक समान
    रूप से लागू होता है।


    यह दर जोखिम प्रबंधन और परिचालन लागतों को कवर करने के लिए तय की गई है। प्रीमियम
    दरों में बदलाव केवल नियामक दिशा-निर्देशों, उम्र के स्लैब में परिवर्तन या पॉलिसी
    की शर्तों में संशोधन के बाद ही किया जाता है। किसी भी बदलाव की सूचना ग्राहकों को
    निर्धारित समय सीमा के भीतर दी जाएगी।'
